# A scripted warp while the partner evolves (as when leaving the canyon shop): the warp and the new map's fade in go
# on under the scene, so the evolution is seen on the new map instead of a black screen.
# How to run: docs/guides/vertical-slice.md.
name: evolve-warp
device: keyboard
timeout: 120
steps:
  - wait: {map: twna01, seconds: 1}
  - resize: [1280, 720]
  - script: evolve("grey")
  - script: warp("room08")
  - wait: {map: room08, setting: {evolution.active: true}, timeout: 30, seconds: 1}
  - screenshot: evolve-warp-scene
  - wait: {partner_model: digimon/grey/model, timeout: 60}
  - wait: {setting: {evolution.active: false}, timeout: 60, seconds: 1}
  - screenshot: evolve-warp
