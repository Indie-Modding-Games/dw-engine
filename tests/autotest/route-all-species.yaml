# Every species as a partner, on by default (docs/modulos/game/evoluciones-extra.md): a new game from the main menu
# with the keyboard keeps the rules screen's defaults, the chart has the original's 61 cells and the 60 new ones,
# and a partner raised along a new line evolves by the natural check: species 44 (in-training) to species 109
# (rookie: offense the highest, no care mistakes, weight 5), then to species 110 (champion: HP and MP 70, weight 50,
# at most 5 care mistakes), both targets no form of the original's takes with those values. Run it with
# --saves <empty folder>, once per language (--lang en, --lang es); how to run it: docs/guides/prueba-vertical.md.
# After each evolution the route waits for its scene to end (evolution.active) and confirms the rank notice an
# evolution may bring.
name: all-species
device: keyboard
timeout: 900
main_menu: true
new_game_rules: true
text_fit: true
steps:
  - resize: [1280, 720]
  - wait: {shown: main_menu, seconds: 1, timeout: 60}
  - menu_select: play
  - wait: {shown: save_slots, seconds: 0.5, timeout: 30}
  - menu_select: slot-1
  - wait: {shown: dialog, seconds: 0.5, timeout: 30}
  - menu_select: yes
  - wait: {shown: new_game_rules, seconds: 0.5, timeout: 30}
  - screenshot: rules-default
  - menu_select: rules-start
  - wait: {map: twna01, hidden: new_game_rules, seconds: 2, timeout: 120}
  - expect_setting: {player.chart.count: 121}
  - script: evolve("tane")
  - wait: {setting: {partner.name: main.digimon_names.0044}, timeout: 600}
  - wait: {setting: {evolution.active: "false"}, timeout: 600}
  - wait: {seconds: 1}
  - when: {shown: award_notice, steps: [{tap: {key: return}}, {wait: {hidden: award_notice, timeout: 10}}]}
  - script: clock_speed("0")
  - script: partner_set("hp 340")
  - script: partner_set("mp 560")
  - script: partner_set("offense 70")
  - script: partner_set("defense 46")
  - script: partner_set("speed 14")
  - script: partner_set("brains 60")
  - script: partner_set("care 0")
  - script: partner_set("weight 5")
  - script: partner_set("discipline 0")
  - script: partner_set("happiness 0")
  - script: partner_set("battles 0")
  - script: partner_set("hours 23")
  - script: clock_speed("120")
  - wait: {setting: {partner.name: main.digimon_names.0109}, timeout: 600}
  - script: clock_speed("0")
  - wait: {setting: {evolution.active: "false"}, timeout: 600}
  - wait: {seconds: 1}
  - when: {shown: award_notice, steps: [{tap: {key: return}}, {wait: {hidden: award_notice, timeout: 10}}]}
  - screenshot: field-rookie
  - script: partner_set("hp 740")
  - script: partner_set("mp 1010")
  - script: partner_set("offense 483")
  - script: partner_set("defense 96")
  - script: partner_set("speed 855")
  - script: partner_set("brains 0")
  - script: partner_set("care 1")
  - script: partner_set("weight 49")
  - script: partner_set("discipline 0")
  - script: partner_set("happiness 0")
  - script: partner_set("battles 0")
  - script: partner_set("hours 71")
  - script: clock_speed("120")
  - wait: {setting: {partner.name: main.digimon_names.0110}, timeout: 600}
  - script: clock_speed("0")
  - wait: {setting: {evolution.active: "false"}, timeout: 600}
  - wait: {seconds: 1}
  - when: {shown: award_notice, steps: [{tap: {key: return}}, {wait: {hidden: award_notice, timeout: 10}}]}
  - screenshot: field-champion
  - expect_setting: {player.chart.count: 121}
