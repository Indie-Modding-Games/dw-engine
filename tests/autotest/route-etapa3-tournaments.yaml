# Stage 3 of the story with the keyboard, two Arena cups (run with --start room13 and --story-stage stage_3, in en and
# in es; docs/guides/prueba-vertical.md). At the desk (cells 81, script 168 section 0x51 -> script 213) the player
# registers for Grade C today (routine 18); at 10:00 the door's step cell (54, section 0x36) starts the cup (routine 6):
# the grade's card, the bracket before the match, the match's intro (each fighter runs in with its stats), and the
# partner loses its first match on time (battle_time_up "lose": TIME UP, the damage box, the lost match's letters):
# no cup won, 0 wins and the participation prize (script 214). Then the player registers for Grade D tomorrow, the
# night passes, and the cup is won with three wins (battle_win, then on time with battle_time_up "win", then
# battle_win), each match after its board, then the champion's climb and the champion scene on the podium: cup 0's
# won trigger (15, saved with the story), 3 wins and the winner's prize money in the bag.
name: etapa3-tournaments
device: keyboard
timeout: 1500
steps:
  - wait: {map: room13, partner_within: 400, seconds: 2, timeout: 60}
  - expect_setting: {story.trigger.91: "false"}
  # The seeded game has no residents; a cup's rivals are drawn from them (startTournament).
  - script: 'for n = 203, 258 do if not ({[206]=1, [207]=1, [212]=1, [214]=1, [220]=1, [221]=1, [225]=1, [246]=1, [254]=1, [256]=1})[n] then story_set("trigger " .. n .. " on") end end'
  - screenshot: room13
  # The desk cells (81) run along the counter, in front of the host (133, -1154): the welcome first (trigger 91).
  - walk_to: {point: [-50, -350], radius: 40, timeout: 120}
  - tap: {key: return}
  - wait: {shown: story_textbox, seconds: 0.5, timeout: 20}
  - repeat: {times: 8, steps: [{when: {shown: story_textbox, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - wait: {setting: {story.trigger.91: "true"}, timeout: 30}
  - wait: {hidden: story_textbox, seconds: 1, timeout: 30}
  # The second time the host asks; Yes opens the schedule. Grade C is the second row of today's column.
  - tap: {key: return}
  - wait: {shown: story_textbox, seconds: 1, timeout: 20}
  - repeat: {times: 6, steps: [{when: {hidden: tournament_schedule, steps: [{tap: {key: return}}]}}, {wait: {seconds: 2}}]}
  - wait: {shown: tournament_schedule, seconds: 2, timeout: 30}
  - tap: {key: down}
  - wait: {seconds: 0.5}
  - screenshot: entry-grade-c
  - tap: {key: return}
  - wait: {seconds: 1.5}
  - repeat: {times: 4, steps: [{when: {shown: tournament_schedule, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - repeat: {times: 4, steps: [{when: {shown: story_textbox, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - wait: {hidden: tournament_schedule, seconds: 1, timeout: 30}
  - expect_setting: {story.trigger.37: "true"}
  - expect_setting: {story.var.3: "1"}
  # 10:00: the door's step cell starts the cup.
  - script: clock_speed("120")
  - wait: {setting: {hud.clock.hour: "10"}, timeout: 120}
  - script: clock_speed("1")
  - walk_to: {trigger: 54, stop_on_scene: true, timeout: 120}
  - wait: {shown: tournament_bracket, timeout: 60}
  - wait: {seconds: 1}
  - screenshot: cup-c-card
  # STD_runIntro: the partner's name comes in, then it runs in and its stats count up; then the rival's.
  - wait: {shown: tournament_match, timeout: 120}
  - wait: {seconds: 1.2}
  - screenshot: cup-c-intro-name
  - wait: {seconds: 2.5}
  - screenshot: cup-c-intro-stats
  - wait: {setting: {battle.phase: fight}, seconds: 2, timeout: 120}
  - screenshot: cup-c-match
  - wait: {seconds: 4}
  - screenshot: cup-c-match-camera
  # The clock runs out with the partner behind: TIME UP, from frame 60 the damage box, then the lost match's letters.
  - script: battle_time_up("lose")
  - wait: {shown: tournament_match, timeout: 30}
  - wait: {seconds: 1}
  - screenshot: cup-c-time-up
  - wait: {seconds: 2.5}
  - screenshot: cup-c-damage-box
  - wait: {seconds: 3}
  - wait: {seconds: 4.5}
  - screenshot: cup-c-lose-letters
  - wait: {hidden: battle, seconds: 1, timeout: 120}
  # Script 214: the participation prize, then the lobby.
  - repeat: {times: 12, steps: [{when: {shown: story_textbox, steps: [{screenshot: cup-c-prize}, {tap: {key: return}}]}}, {wait: {seconds: 2}}]}
  - wait: {map: room13, hidden: story_textbox, seconds: 1, timeout: 60}
  - expect_setting: {story.var.255: "0"}
  - expect_setting: {story.trigger.16: "false"}
  - expect_setting: {story.trigger.37: "false"}
  # The lost match left the partner with a fifth of its HP (STD_deinitializeCombat); a Super Recovery Floppy heals it,
  # offered until the partner takes it (partnerWillRefuseItem rolls against its discipline).
  - repeat: {times: 10, steps: [{script: 'give_item("sup_recovery 1")'}, {script: 'use_item("sup_recovery")'}, {wait: {seconds: 4}}]}
  - wait: {setting: {partner.hp: "800"}, timeout: 30}
  # Grade D tomorrow: the first row of the second column.
  - walk_to: {point: [-50, -350], radius: 40, timeout: 120}
  - tap: {key: return}
  - wait: {shown: story_textbox, seconds: 1, timeout: 20}
  - repeat: {times: 6, steps: [{when: {hidden: tournament_schedule, steps: [{tap: {key: return}}]}}, {wait: {seconds: 2}}]}
  - wait: {shown: tournament_schedule, seconds: 2, timeout: 30}
  - tap: {key: right}
  - wait: {seconds: 0.5}
  - screenshot: entry-grade-d
  - tap: {key: return}
  - wait: {seconds: 1.5}
  - repeat: {times: 4, steps: [{when: {shown: tournament_schedule, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - repeat: {times: 4, steps: [{when: {shown: story_textbox, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - wait: {hidden: tournament_schedule, seconds: 1, timeout: 30}
  - expect_setting: {story.trigger.37: "true"}
  - expect_setting: {story.var.3: "0"}
  # The night passes; the money before the cup.
  - script: clock_speed("120")
  - wait: {setting: {hud.clock.hour: "3"}, confirm: true, timeout: 300}
  - wait: {setting: {hud.clock.hour: "10"}, confirm: true, timeout: 300}
  - script: clock_speed("1")
  - wait: {hidden: story_textbox, seconds: 1, timeout: 60}
  - menu: open
  # The menu takes no input until it is in place.
  - wait: {seconds: 0.6}
  - menu_select: open-items
  - wait: {shown: partner_menu, seconds: 0.6}
  - remember: bag.money
  # The original look's bag has no tabs: cancel closes it, then the menu.
  - tap: {key: escape}
  - wait: {hidden: partner_menu, timeout: 5}
  - menu: close
  - walk_to: {trigger: 54, stop_on_scene: true, timeout: 120}
  - wait: {shown: tournament_bracket, timeout: 60}
  - wait: {seconds: 1}
  - screenshot: cup-d-card
  - wait: {seconds: 7}
  - screenshot: cup-d-bracket
  - wait: {setting: {battle.phase: fight}, seconds: 2, timeout: 120}
  - screenshot: cup-d-match
  - script: battle_win("")
  # The rival falls: the won match's letters fly in under the circling camera.
  - wait: {seconds: 4.5}
  - screenshot: cup-d-win-letters
  - wait: {shown: tournament_bracket, timeout: 120}
  - wait: {seconds: 2}
  - screenshot: cup-d-bracket-2
  # The second match is won on time; the confirm button cuts each fighter's intro short.
  - wait: {shown: tournament_match, timeout: 120}
  - tap: {key: return}
  - wait: {seconds: 0.5}
  - tap: {key: return}
  - wait: {setting: {battle.phase: fight}, seconds: 1, timeout: 120}
  - script: battle_time_up("win")
  - wait: {shown: tournament_match, timeout: 30}
  - wait: {seconds: 3.5}
  - screenshot: cup-d-damage-box
  - wait: {seconds: 8}
  - screenshot: cup-d-win-on-time
  - wait: {shown: tournament_bracket, timeout: 120}
  - wait: {setting: {battle.phase: fight}, seconds: 1, timeout: 120}
  - script: battle_win("")
  - wait: {shown: tournament_bracket, timeout: 120}
  - wait: {seconds: 2}
  - screenshot: cup-d-champion
  - wait: {hidden: tournament_bracket, timeout: 60}
  # The champion scene: the title spins in, the podium lifts the partner, it poses.
  - wait: {seconds: 3.5}
  - screenshot: cup-d-champion-title
  - wait: {seconds: 4}
  - screenshot: cup-d-podium-lift
  - wait: {seconds: 3.5}
  - screenshot: cup-d-champion-pose
  # Script 214: the winner's money and item, then the medals' script (204).
  - repeat: {times: 12, steps: [{when: {shown: story_textbox, steps: [{screenshot: cup-d-prize}, {tap: {key: return}}]}}, {wait: {seconds: 2}}]}
  - wait: {map: room13, hidden: story_textbox, seconds: 1, timeout: 60}
  - expect_setting: {story.var.255: "3"}
  - expect_setting: {story.trigger.15: "true"}
  - expect_setting: {story.trigger.0: "false"}
  - menu: open
  # The menu takes no input until it is in place.
  - wait: {seconds: 0.6}
  - menu_select: open-items
  - wait: {shown: partner_menu, seconds: 0.6}
  - expect_change: {bag.money: up}
  - screenshot: cup-d-bag
  # The original look's bag has no tabs: cancel closes it, then the menu.
  - tap: {key: escape}
  - wait: {hidden: partner_menu, timeout: 5}
  - menu: close
