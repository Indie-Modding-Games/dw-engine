# The battle screen with the mouse (clicks on the entries): a battle against the first NPC of File City that can
# fight, started with the debug trigger (battle("") in the console, apps/game/src/battle_trigger.hpp), an order from
# the command row, running away and the end box. The new game's partner has three entries: its finisher (command-0,
# unavailable until the gauge is full), Run (command-1) and Your Call (command-2). How to run it: docs/guides/prueba-
# vertical.md.
name: battle-mouse
device: mouse
timeout: 300
steps:
  - wait: {map: twna01, seconds: 1}
  - resize: [1280, 720]
  # The new game's bag is empty, as the original's: the debug give_item puts a Recovery in its first slot.
  - script: give_item("sm_recovery 2")
  - script: battle("")
  # The battle opens with the enemy's anger mark and the "BATTLE" banner; the commands answer once it has gone.
  - wait: {shown: battle, seconds: 1}
  - wait: {setting: {battle.phase: fight}, seconds: 0.5, timeout: 30}
  - screenshot: battle-start
  - menu_select: command-2
  - wait: {seconds: 4}
  - expect_setting: {battle.phase: fight}
  - screenshot: battle-fight
  # Menu opens the tamer's bag (Tab on the keyboard; on a gamepad its north button) while the
  # battle goes on; a slot's Use throws its item to the partner once the bag has closed.
  - tap: {key: tab}
  - expect_setting: {battle.bag.open: true}
  - wait: {shown: partner_menu, seconds: 0.5}
  - screenshot: battle-bag
  - menu_select: slot-0
  - screenshot: battle-bag-options
  - menu_select: opt-use
  - wait: {hidden: partner_menu, timeout: 5}
  - expect_setting: {battle.item_in_flight: true}
  - screenshot: battle-item-thrown
  - wait: {seconds: 3}
  - expect_setting: {battle.item_in_flight: false}
  - menu_select: command-1
  - wait: {seconds: 3}
  - expect_setting: {battle.phase: end}
  - screenshot: battle-end
  # The end box closes by itself once its wait is over.
  - wait: {hidden: battle, timeout: 10}
  - screenshot: battle-closed
