# The partner's menu with the keyboard, in the original look: from the pause menu, the status page; then the menu's
# ITEM entry, the item bag (an item's options, using it, moving it to another slot, the sort orders, the drop's question
# answered no). The original look's partner entry holds the status and tech pages only and its bag has no tabs, as the
# original's; praising and scolding are field actions there. How to run it: docs/guides/prueba-vertical.md.
name: partner-keyboard
device: keyboard
timeout: 300
steps:
  - wait: {map: twna01, seconds: 1}
  - resize: [1280, 720]
  # The new game's bag is empty, as the original's: the debug give_item fills a few slots first.
  - script: give_item("meat 3")
  - script: give_item("sm_recovery 2")
  - script: give_item("mp_floppy 1")
  # The field fades in from black first: the menu pauses the fade, and the partner comes for food only once it is over.
  - wait: {setting: {screen_fade: 0}, timeout: 10}
  - menu: open
  # The menu's box takes no input until it is in place (tickUIBox).
  - wait: {seconds: 0.6}
  - menu_select: open-partner
  - wait: {shown: partner_menu, seconds: 0.5}
  - screenshot: partner-status
  - tap: {key: escape}
  - wait: {hidden: partner_menu, timeout: 5}
  - menu: open
  - wait: {seconds: 0.6}
  - menu_select: open-items
  - wait: {shown: partner_menu, seconds: 0.5}
  - screenshot: partner-bag
  - menu_select: slot-0
  - screenshot: partner-bag-options
  - menu_select: opt-use
  # startFeedingItem (game_menu.c): the menu closes and the partner comes for the meat.
  - wait: {hidden: partner_menu, timeout: 5}
  - wait: {seconds: 6}
  - menu: open
  - wait: {seconds: 0.6}
  - menu_select: open-items
  - wait: {shown: partner_menu, seconds: 0.5}
  - screenshot: partner-bag-used
  - menu_select: slot-0
  - menu_select: opt-move
  - menu_select: slot-4
  - wait: {seconds: 0.5}
  - screenshot: partner-bag-moved
  - menu_select: slot-4
  - menu_select: opt-sort
  - screenshot: partner-bag-sort
  - menu_select: sort-0
  - wait: {seconds: 0.5}
  - menu_select: slot-0
  - menu_select: opt-drop
  - screenshot: partner-bag-drop
  # No leaves the question for the item's options; cancel closes them, then the bag, which has no tabs: back to the
  # menu, which closes after it.
  - menu_select: confirm-no
  - wait: {seconds: 0.3}
  - tap: {key: escape}
  - wait: {seconds: 0.3}
  - tap: {key: escape}
  - wait: {hidden: partner_menu, timeout: 5}
  - menu: close
  - wait: {menu_open: false}
  - screenshot: partner-closed
