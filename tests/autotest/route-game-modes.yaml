# The new game's mode list (docs/modules/game/modes.md) and the game variants (docs/architecture/game-variants.md): a
# new game from the main menu asks the mode first, Classic Enhanced, Folder Mode and, with a third mode mounted
# (--mods tests/mods/game_mode, a synthetic mod whose «practice» mode plays the original's rules), that one too.
# Folder Mode goes on to the rules screen; Classic Enhanced starts right away with the original's rules, and its game
# fixes the options that change the rules (the options page shows them locked, grouped last); the practice mode starts
# right away too. Run it with --saves <empty folder>, once per language (--lang en, --lang es); how to run it:
# docs/guides/vertical-slice.md.
name: game-modes
device: keyboard
timeout: 300
main_menu: true
new_game_rules: true
text_fit: true
steps:
  - resize: [1280, 720]
  - wait: {shown: main_menu, seconds: 1, timeout: 60}
  - menu_select: play
  - wait: {shown: save_slots, seconds: 0.5, timeout: 30}
  - menu_select: slot-1
  - wait: {shown: dialog, seconds: 0.5, timeout: 30}
  - menu_select: yes
  - wait: {shown: new_game_mode, seconds: 0.5, timeout: 30}
  - expect_text_fits: all
  - screenshot: modes
  # Folder Mode asks its rules next; back from them goes to the slot list.
  - menu_select: mode-2
  - wait: {shown: new_game_rules, hidden: new_game_mode, seconds: 0.5, timeout: 30}
  - screenshot: modes-folder-rules
  - menu_select: back
  - wait: {shown: save_slots, seconds: 0.5, timeout: 30}
  - menu_select: slot-1
  - wait: {shown: dialog, seconds: 0.5, timeout: 30}
  - menu_select: yes
  - wait: {shown: new_game_mode, seconds: 0.5, timeout: 30}
  - menu_select: mode-3
  - wait: {map: twna01, hidden: new_game_mode, seconds: 2, timeout: 120}
  - screenshot: modes-practice-started
