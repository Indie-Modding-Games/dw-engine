# The pad's Select (Back) opens the options after the player page was minimized with North in the
# original look. `settings` has no keyboard key, so this runs on a gamepad. Run with:
# dwe-game --content <folder> --autotest tests/autotest/route-settings-after-player-tab.yaml
name: settings-after-player-tab
device: gamepad
gamepad: generic
timeout: 120
steps:
  - wait: {map: twna01, seconds: 1}
  - wait: {setting: {screen_fade: 0}, timeout: 10}
  - menu: open
  - wait: {menu_open: true, seconds: 0.6, timeout: 5}
  - menu_select: open-player
  - wait: {seconds: 1}
  - screenshot: player-page
  # North (the menu action) on the player page minimizes it into the tools panel.
  - tap: {button: north}
  - wait: {seconds: 0.5}
  - screenshot: player-minimized
  # Select must show the options page.
  - tap: {button: back}
  - wait: {menu_open: true, seconds: 0.5, timeout: 5}
  - expect_setting: {has_class.pause_menu#page-options.hidden: "false"}
  - expect_setting: {has_class.pause_menu#panel.box-closed: "false"}
  - screenshot: options-after-player-tab
