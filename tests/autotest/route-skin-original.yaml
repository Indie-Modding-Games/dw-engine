# The original look on every screen it styles, with a capture of each: the title screen and its menu, the field's
# clock and bars, the pause menu and its options, the partner's status and bag (an item's options and the sort
# orders), a battle (the partner's bars, the commands, an enemy's bar) and its end boxes, and the need bubble over the
# partner at 1920x1080. The original look is the packs' default, and an autotest reads no saved settings, so the route
# needs no flag; it needs content extracted with the original look's sprites (dwx 2 or later): without them the game
# starts with the modern skin and the first step fails. It runs once per language. How to run it:
# docs/guides/prueba-vertical.md.
name: skin-original
device: keyboard
main_menu: true
timeout: 300
steps:
  - wait: {shown: main_menu, seconds: 1}
  - resize: [1280, 720]
  - expect_setting: {ui_skin: original}
  - screenshot: main-menu
  - menu_select: play
  - wait: {map: twna01, hidden: main_menu, seconds: 1}
  - screenshot: field
  # The new game's bag is empty, as the original's: the debug give_item fills a few slots first.
  - script: give_item("meat 3")
  - script: give_item("sm_recovery 2")
  - script: give_item("mp_floppy 1")
  - menu: open
  - screenshot: pause-menu
  - menu_select: open-options
  - screenshot: pause-options
  - menu_select: options-back
  - menu_select: open-partner
  - wait: {shown: partner_menu, seconds: 0.5}
  - screenshot: partner-status
  - menu_select: tab-items
  - wait: {seconds: 0.3}
  - screenshot: partner-bag
  - menu_select: slot-0
  - screenshot: partner-bag-options
  - menu_select: opt-sort
  - screenshot: partner-bag-sort
  - menu_select: sort-0
  - wait: {seconds: 0.3}
  - menu_select: close
  - wait: {hidden: partner_menu, timeout: 5}
  - script: battle("")
  - wait: {shown: battle, seconds: 1}
  - wait: {setting: {battle.phase: fight}, seconds: 0.5, timeout: 30}
  - screenshot: battle
  # An order first, as route-battle-keyboard gives, then Run (the new game's partner's second command) ends the
  # battle.
  - expect_setting: {battle.phase: fight}
  - menu_select: command-2
  - wait: {seconds: 4}
  - menu_select: command-1
  - wait: {seconds: 3}
  - expect_setting: {battle.phase: end}
  - screenshot: battle-end
  # The end box closes by itself once its wait is over.
  - wait: {hidden: battle, timeout: 10}
  # Two game hours a real second until the partner is hungry, then the bubble over it at a larger size.
  - resize: [1920, 1080]
  - script: clock_speed("120")
  - wait: {partner_has: partner_menu.condition.hungry, timeout: 60}
  - script: clock_speed("1")
  # The new game's Jijimon stands by File City's entrance, in the straight line from the start; walk_to plans
  # around the map's walls but not around NPCs, so the walk goes south of him first.
  - walk_to: {point: [-330, 1950], radius: 40}
  - walk_to: {point: [300, 1950], radius: 40}
  - walk_to: {point: [600, 300], radius: 40}
  - wait: {partner_within: 300, seconds: 0.5, timeout: 5}
  - expect_setting: {hud.partner.visible: true}
  - expect_setting: {hud.need.0.active: true}
  - screenshot: field-hungry-1080
