name: training-trai00-speed
# One whole speed session on trai00, checked against the bounds of the original (DuckStation, this gym):
# frames from the partner's arrival to the gains, its farthest point from its spot, the ground it
# covered and each stat's gain, in original units (docs/guides/comprobar-entrenamiento.md).
device: keyboard
timeout: 290
steps:
  - wait: {map: trai00, seconds: 2}
  - script: gym("speed")
  - wait: {setting: {gym.session.count: "1"}, timeout: 280}
  - expect_range: {gym.session.frames: [1199, 1204]}
  - expect_range: {gym.session.max_offset: [2754, 3368]}
  - expect_range: {gym.session.path: [47916, 58565]}
  - expect_range: {gym.session.gain.hp: [5, 15]}
  - expect_range: {gym.session.gain.mp: [0, 0]}
  - expect_range: {gym.session.gain.offense: [0, 0]}
  - expect_range: {gym.session.gain.defense: [0, 0]}
  - expect_range: {gym.session.gain.speed: [4, 12]}
  - expect_range: {gym.session.gain.brain: [0, 0]}
