name: training-icsa03-defense
# One whole defense session on icsa03, checked against the bounds of dwe's own run (not measured in the original):
# frames from the partner's arrival to the gains, its farthest point from its spot, the ground it
# covered and each stat's gain, in original units (docs/guides/comprobar-entrenamiento.md).
device: keyboard
timeout: 900
steps:
  - wait: {map: icsa03, seconds: 2}
  - script: gym("defense")
  - wait: {setting: {gym.session.count: "1"}, timeout: 880}
  - expect_range: {gym.session.frames: [13039, 13303]}
  - expect_range: {gym.session.max_offset: [0, 40]}
  - expect_range: {gym.session.path: [0, 40]}
  - expect_range: {gym.session.gain.hp: [0, 0]}
  - expect_range: {gym.session.gain.mp: [0, 0]}
  - expect_range: {gym.session.gain.offense: [0, 0]}
  - expect_range: {gym.session.gain.defense: [6, 18]}
  - expect_range: {gym.session.gain.speed: [1, 3]}
  - expect_range: {gym.session.gain.brain: [0, 0]}
