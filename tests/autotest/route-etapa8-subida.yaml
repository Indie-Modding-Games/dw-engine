# Stage 8 of the story with the keyboard, chunk 2 of 3: up Mt. Infinity. Run it on the save chunk 1 leaves
# (--story-stage stage_8 --saves <dir> --load slot_01): from File City with the way up open (trigger 354) the player
# goes through the gate (tile 58) to mgen01 (tile 56) and climbs mgen01 to mgen10, mgen98 and mgen99. The wild ones on
# the way end won as they start (encounters: win); the walks go at a walk, as a run at a low frame rate overshoots
# into the exit back down next to some arrivals. Bosses: mgen06 (forced, trigger 321); mgen10's Megadramon asks
# (the first answer, "hurry up", is the critical path and skips the optional fight); mgen98 (forced, trigger 326).
# It ends saving in slot_01 on mgen99, where chunk 3 starts.
name: etapa8-subida
device: keyboard
timeout: 3000
steps:
  - wait: {map: twna08, partner_within: 400, seconds: 2, timeout: 120}
  # The city's gate (tile 58) walks the player past the wall (section 0x3a); the path up starts at tile 56.
  - walk_to: {trigger: 58, stop_on_scene: true, timeout: 240}
  - wait: {seconds: 5}
  - walk_to: {trigger: 56, timeout: 240}
  - wait: {confirm: true, map: mgen01, seconds: 3, timeout: 120}
  - screenshot: mgen01
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen02, seconds: 2, timeout: 120}
  - walk_to: {trigger: 52, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen03, seconds: 2, timeout: 120}
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen04, seconds: 2, timeout: 120}
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen05, seconds: 2, timeout: 120}
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen06, seconds: 2, timeout: 120}
  - screenshot: mgen06
  - script: use_item("sup_recovery")
  - wait: {seconds: 1.5}
  - script_if: {setting: {bag.result: partner_menu.bag_result.refused}, script: 'use_item("sup_recovery")'}
  - wait: {seconds: 1.5}
  - script_if: {setting: {bag.result: partner_menu.bag_result.refused}, script: 'use_item("sup_recovery")'}
  - wait: {seconds: 1.5}
  - walk_to: {trigger: 53, stop_on_scene: true, encounters: win, timeout: 240}
  - wait: {confirm: true, shown: battle, timeout: 120}
  - screenshot: mgen06-battle
  # A boss outlasts a written save's partner: after some seconds on screen the fight ends with battle_win.
  - wait: {confirm: true, win_after: 12, setting: {story.trigger.321: "true"}, timeout: 400}
  - wait: {confirm: true, hidden: story_textbox, seconds: 2, timeout: 60}
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen07, seconds: 2, timeout: 120}
  - screenshot: mgen07
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen08, seconds: 2, timeout: 120}
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen09, seconds: 2, timeout: 120}
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen10, seconds: 2, timeout: 120}
  - screenshot: mgen10
  - script: use_item("sup_recovery")
  - wait: {seconds: 1.5}
  - script_if: {setting: {bag.result: partner_menu.bag_result.refused}, script: 'use_item("sup_recovery")'}
  - wait: {seconds: 1.5}
  - script_if: {setting: {bag.result: partner_menu.bag_result.refused}, script: 'use_item("sup_recovery")'}
  - wait: {seconds: 1.5}
  - walk_to: {trigger: 53, stop_on_scene: true, encounters: win, timeout: 240}
  # Megadramon's question: its cursor starts on the first answer (row 1 under the question), Enter takes it.
  - wait: {confirm: true, setting: {story_textbox.cursor_row: "1"}, timeout: 120}
  - screenshot: mgen10-choice
  - tap: {key: return}
  - wait: {confirm: true, hidden: story_textbox, seconds: 3, timeout: 120}
  - walk_to: {trigger: 51, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen98, seconds: 2, timeout: 120}
  - screenshot: mgen98
  - script: use_item("sup_recovery")
  - wait: {seconds: 1.5}
  - script_if: {setting: {bag.result: partner_menu.bag_result.refused}, script: 'use_item("sup_recovery")'}
  - wait: {seconds: 1.5}
  - script_if: {setting: {bag.result: partner_menu.bag_result.refused}, script: 'use_item("sup_recovery")'}
  - wait: {seconds: 1.5}
  - walk_to: {trigger: 53, walk: true, stop_on_scene: true, encounters: win, timeout: 240}
  - wait: {confirm: true, shown: battle, timeout: 120}
  - screenshot: mgen98-battle
  - wait: {confirm: true, win_after: 20, setting: {story.trigger.326: "true"}, timeout: 400}
  - wait: {confirm: true, hidden: story_textbox, seconds: 2, timeout: 60}
  - walk_to: {trigger: 52, walk: true, encounters: win, timeout: 240}
  - wait: {map: mgen99, seconds: 3, timeout: 120}
  - screenshot: mgen99
  - script: save("slot_01")
  - wait: {seconds: 2}
