# Stage 2 of the story with the keyboard, the lock's border in the jungle: from trop03 on a seeded game (run with
# --start trop03 --story-stage stage_2) the player walks into the exit to the
# Great Canyon (gcan01, stage 4), which stays closed with the lock's message, then on to trop02 and into its exit to
# the Grey Lord's Mansion (dgha01, stage 7), closed too. The player stays on the jungle map each time.
name: etapa2-lock
device: keyboard
timeout: 600
steps:
  - resize: [1280, 720]
  - wait: {map: trop03, partner_within: 400, seconds: 2, timeout: 60}
  # The jungle's wild ones fight whoever walks into them: a Champion partner wins those fights by itself.
  - script: evolve("grey")
  - wait: {seconds: 30}
  - walk_to: {trigger: 110, encounters: true, stop_on_closed: true, timeout: 180}
  - wait: {shown: dialog, seconds: 0.5, timeout: 30}
  - screenshot: trop03-gcan01-closed
  - tap: {key: return}
  - wait: {map: trop03, hidden: dialog, seconds: 1, timeout: 30}
  - walk_to: {trigger: 111, encounters: true, timeout: 180}
  - wait: {map: trop02, partner_within: 400, seconds: 1, timeout: 60}
  - walk_to: {trigger: 110, encounters: true, stop_on_closed: true, timeout: 180}
  - wait: {shown: dialog, seconds: 0.5, timeout: 30}
  - screenshot: trop02-dgha01-closed
  - tap: {key: return}
  - wait: {map: trop02, hidden: dialog, seconds: 1, timeout: 30}
