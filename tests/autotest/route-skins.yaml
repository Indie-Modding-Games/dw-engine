# The skins route: the game starts with the original look, the packs' default; the interface skin is switched live from
# the main menu to the next one the packs offer, the test skin, then the screens that are already loaded (the HUD, the
# pause menu and its options, the partner's menu, the battle screen) in it, and on to the modern skin from the pause
# menu's options. It needs content extracted with the original look's sprites (dwx 2 or later) and the synthetic test
# skin's mod pack: --mods tests/mods/ui_skin. It runs once per language, with --lang en and --lang es. How to run it:
# docs/guides/prueba-vertical.md.
name: skins
device: keyboard
main_menu: true
timeout: 300
steps:
  - wait: {shown: main_menu, seconds: 1}
  - resize: [1280, 720]
  - expect_setting: {ui_skin: original}
  - screenshot: main-menu-original
  # The skin entry, on the Interface tab of the options page the title's Options opens, moves to the next skin the
  # packs offer: the test pack's, which lays the main menu out as the modern one, its entries all in one box.
  - menu_select: options
  - menu_select: ui-skin
  - expect_setting: {ui_skin: test_contrast}
  - wait: {seconds: 0.5}
  - screenshot: title-options-test-contrast
  - menu_select: options-back
  - wait: {hidden: pause_menu, seconds: 0.5}
  - screenshot: main-menu-test-contrast
  # Play opens the slot list; the route plays without saving, which writes nothing.
  - menu_select: play
  - wait: {shown: save_slots, seconds: 0.5}
  - menu_select: no-save
  - wait: {shown: dialog, seconds: 0.5}
  - menu_select: yes
  - wait: {map: twna01, hidden: main_menu, seconds: 0.5}
  - screenshot: field
  - menu: open
  - screenshot: pause-menu
  - menu_select: open-partner
  - wait: {shown: partner_menu, seconds: 0.5}
  - screenshot: partner-status
  - menu_select: close
  - wait: {hidden: partner_menu, timeout: 5}
  - script: battle("")
  - wait: {shown: battle, seconds: 1}
  - wait: {setting: {battle.phase: fight}, seconds: 0.5, timeout: 30}
  - screenshot: battle
  # An order first, as route-battle-keyboard gives, then Run (the new game's partner's second command) ends the
  # battle.
  - expect_setting: {battle.phase: fight}
  - menu_select: command-2
  - wait: {seconds: 4}
  - expect_setting: {battle.phase: fight}
  - menu_select: command-1
  - wait: {seconds: 3}
  - expect_setting: {battle.phase: end}
  - screenshot: battle-end
  # The end box closes by itself once it has counted, typed and waited.
  - wait: {hidden: battle, timeout: 60}
  # On to the modern skin from the pause menu's options: past the test skin the list goes round to the first one the
  # packs offer, devvago, and then to modern.
  - menu: open
  - menu_select: open-options
  - screenshot: pause-options-test-contrast
  - menu_select: ui-skin
  - expect_setting: {ui_skin: devvago}
  - wait: {seconds: 0.5}
  - screenshot: pause-options-devvago
  - menu_select: ui-skin
  - expect_setting: {ui_skin: modern}
  - wait: {seconds: 0.5}
  - screenshot: pause-options-modern
  - menu: close
  - wait: {menu_open: false}
