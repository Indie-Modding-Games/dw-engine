# The vertical slice's route with the mouse (click-to-move on the ground, the HUD's menu button, clicks on the
# menu): File City to the elder's house and back, the menu and the minimap, the tabs of the player's page (original
# look) and of the partner's page, clicked, and the window at each size. How to run it: docs/guides/prueba-vertical.md.
name: mouse
device: mouse
timeout: 600
steps:
  - wait: {map: twna01, seconds: 1}
  - resize: [1280, 720]
  - screenshot: twna01-start
  # The menu with the mouse: minimap off, then on again (its default).
  - menu: open
  - screenshot: menu-open
  # The original look keeps the minimap and the options among the PLAYER page's tools; the modern look lists them on
  # the menu's first page. The mouse has no way to the tools yet, so the route takes the PC's key for them (Tab) and
  # clicks the rest.
  - when:
      setting: {ui_skin: original}
      steps:
        - menu_select: open-player
        # The page's box takes no input until it is in place (tickUIBox).
        - wait: {seconds: 0.5}
        # A click on a tab shows its page, as Left and Right do.
        - menu_select: player-tab-chart
        - expect_setting: {has_class.pause_menu#player-tab-chart.selected: "true"}
        - screenshot: menu-player-chart
        - menu_select: player-tab-player
        - expect_setting: {has_class.pause_menu#player-tab-player.selected: "true"}
        - tap: {key: tab}
        - menu_select: player-minimap
  - when:
      setting: {ui_skin: modern}
      steps:
        - menu_select: open-minimap
  - expect_setting: {minimap: "on"}
  - menu_select: minimap-mode
  - expect_setting: {minimap: "off"}
  - screenshot: menu-minimap-hidden
  - menu_select: minimap-mode
  - expect_setting: {minimap: "on"}
  - menu: close
  - wait: {menu_open: false}
  # The new game's Jijimon stands by File City's entrance, in the straight line from the start; walk_to plans
  # around the map's walls but not around NPCs, so the walk goes south of him first.
  - walk_to: {point: [-330, 1950], radius: 40}
  - walk_to: {point: [300, 1950], radius: 40}
  # Behind the awning of the house by the water: the player under a depth layer.
  - walk_to: {point: [600, 300], radius: 40}
  # The partner has followed the walk across the map (on arrival it is always close: it spawns next to the player).
  - wait: {partner_within: 300, seconds: 0.5, timeout: 5}
  - screenshot: twna01-behind-layer
  - walk_to: {trigger: 112}
  - wait: {map: room08, partner_within: 400, seconds: 0.5}
  - screenshot: room08
  - resize: [800, 600]
  - screenshot: room08
  # Across the room and back to the door, with the partner following. Jijimon stands in the middle of the room and a
  # click on him talks to him, so the walk goes between him and Botamon, west of him.
  - walk_to: {point: [-260, -200], radius: 40}
  - walk_to: {point: [-260, -650], radius: 40}
  - walk_to: {point: [-95, -900], radius: 80}
  - wait: {partner_within: 300, seconds: 0.5, timeout: 5}
  - walk_to: {point: [-260, -650], radius: 40}
  - walk_to: {point: [-260, -200], radius: 40}
  - walk_to: {trigger: 51}
  - wait: {map: twna01, partner_within: 400, seconds: 0.5}
  - screenshot: twna01-back
  - resize: [1920, 1080]
  - screenshot: twna01
  - resize: [2560, 1080]
  - screenshot: twna01
  - fullscreen: true
  - screenshot: twna01-fullscreen
  - fullscreen: false
  - resize: [1280, 720]
  - wait: {map: twna01, seconds: 0.5}
  # The partner's page: a click on a tab shows its page.
  - menu: open
  - wait: {seconds: 0.6}
  - menu_select: open-partner
  - wait: {shown: partner_menu, seconds: 0.6}
  - menu_select: tab-tech
  - expect_setting: {has_class.partner_menu#tab-tech.selected: "true"}
  - screenshot: partner-tech
  - menu_select: tab-status
  - expect_setting: {has_class.partner_menu#tab-status.selected: "true"}
  - tap: {key: escape}
  - wait: {hidden: partner_menu, timeout: 5}
  - menu: close
  - wait: {menu_open: false}
