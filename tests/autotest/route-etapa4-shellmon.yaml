# Stage 4 of the story with the keyboard, Shellmon: from gcan02 on a seeded game (run with --start gcan02
# --story-stage stage_4, docs/guides/prueba-vertical.md), after the fortress and the voice on the bridge (triggers 175,
# 176 and 182, written here; route-etapa4-fortaleza.yaml plays them). In the story the player then rides the canyon
# top's elevator down into the fortress (script 37, section 0x51, "Press DOWN"; ogre03 section 0x36 turns trigger 180
# off and 181 on) and walks back out to the canyon top; that state is written here too, since the lift behind the
# throne would turn 180 on again. With 180 off the path leads to the other bridge (gcan04_2), where Shellmon, freed,
# joins after one talk (script 122, section 0x05: trigger 235). Its exit to Freezeland (frzl01, stage 5) stays closed
# with the lock's message.
name: etapa4-shellmon
device: keyboard
timeout: 1200
steps:
  - resize: [1280, 720]
  - wait: {map: gcan02, seconds: 2, timeout: 60}
  - script: story_set("trigger 175 on")
  - script: story_set("trigger 176 on")
  - script: story_set("trigger 180 off")
  - script: story_set("trigger 181 on")
  - script: story_set("trigger 182 on")
  - script: evolve("grey")
  - wait: {seconds: 30}
  # A Goburimon of the canyon top runs at the player and fights ("I'll knock you out!"); it is beaten with the debug
  # command.
  - repeat: {times: 10, steps: [{when: {shown: story_textbox, steps: [{tap: {key: return}}]}}, {when: {shown: battle, steps: [{wait: {setting: {battle.phase: fight}, seconds: 0.5, timeout: 60}}, {script: 'battle_win("")'}, {wait: {setting: {battle.phase: end}, timeout: 60}}, {repeat: {times: 10, steps: [{wait: {seconds: 1.0}}, {tap: {key: return}}]}}, {wait: {hidden: battle, seconds: 1, timeout: 60}}]}}, {wait: {seconds: 2}}]}
  - script: place("player 3200 2700 0")
  - wait: {seconds: 0.5}
  - walk_to: {trigger: 51, timeout: 60}
  - wait: {map: gcan04_2, seconds: 3, timeout: 60}
  - screenshot: gcan04_2
  - expect_setting: {story.trigger.235: "false"}
  - script: place("player 2246 -1150 2048")
  - wait: {seconds: 1}
  - tap: {key: return}
  - wait: {shown: story_textbox, seconds: 1, timeout: 20}
  - screenshot: gcan04_2-shellmon
  - repeat: {times: 20, steps: [{when: {shown: story_textbox, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - wait: {setting: {story.trigger.235: "true"}, timeout: 60}
  - walk_to: {trigger: 111, stop_on_closed: true, timeout: 120}
  - wait: {shown: dialog, seconds: 0.5, timeout: 30}
  - screenshot: gcan04_2-frzl01-closed
  - tap: {key: return}
  - wait: {map: gcan04_2, hidden: dialog, seconds: 1, timeout: 30}
