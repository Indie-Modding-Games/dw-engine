# Stage 5 of the story with the keyboard, Ogremon: from tunn02 on a seeded game (run with --start tunn02 and
# --story-stage stage_5) with trigger 150, the one the fight in the Secret Beach Cave sets (route-etapa5-whamon.yaml;
# the route writes it), the cells of section 0x33 of the Drill Tunnel (script 26) start Ogremon's ambush: his gang
# fights, loses, and Ogremon joins the city (trigger 234). Without 150 (stage 2) the scene does not start.
name: etapa5-ogremon
device: keyboard
timeout: 900
steps:
  - wait: {map: tunn02, partner_within: 400, seconds: 2, timeout: 60}
  - expect_setting: {story.trigger.234: "false"}
  - script: story_set("trigger 150 on")
  - screenshot: tunn02
  # The wild ones fight whoever walks into them: the walks end those fights at once (`encounters: win`).
  - script: evolve("garu")
  - wait: {seconds: 30}
  - walk_to: {trigger: 51, stop_on_scene: true, encounters: win, timeout: 240}
  - wait: {shown: story_textbox, seconds: 1, timeout: 60}
  - screenshot: tunn02-ogremon
  # Six boxes and the walks between them, then the fight; a spare press in the fight's menu is undone by the debug
  # win below.
  - repeat: {times: 8, steps: [{tap: {key: return}}, {wait: {seconds: 1.5}}]}
  - wait: {shown: battle, seconds: 1, timeout: 120}
  - screenshot: tunn02-battle
  - wait: {setting: {battle.phase: fight}, seconds: 0.5, timeout: 30}
  - script: battle_win("")
  - wait: {setting: {battle.phase: end}, timeout: 60}
  - repeat: {times: 10, steps: [{wait: {seconds: 1.0}}, {tap: {key: return}}]}
  - wait: {hidden: battle, seconds: 1, timeout: 60}
  - screenshot: tunn02-after-battle
  # Twenty-eight boxes after the fight; the scene ends with trigger 234.
  - repeat: {times: 34, steps: [{tap: {key: return}}, {wait: {seconds: 1.5}}]}
  - wait: {setting: {story.trigger.234: "true"}, timeout: 60}
  - wait: {seconds: 2}
  - screenshot: tunn02-ogremon-joins
