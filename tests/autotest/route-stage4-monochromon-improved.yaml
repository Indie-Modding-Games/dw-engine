# Stage 4 of the story, Monochromon's shop job in its improved mode (the default; docs/reference/shop-job.md),
# from gcan11 on a seeded game (run with --start gcan11 --story-stage stage_4 --seed 1,
# docs/guides/vertical-slice.md). The player confirms on the counter's cells and says he will try: script 49's
# section 0x51 asks the engine for the mode (routine 256) and goes on in the job's own section 0x300. The rules panel
# opens by itself at the first customer; the counter's haggle screen (routine 259) replaces the price menus. The first
# customer buys at the regular price (row 6, +90 to the tally; seed 1's first customer accepts it, the level is
# exact), the second is sent away, and the third is made the 20th with the tally past the bonus (3584): sending it
# away ends the job with the original's winning pay, trigger 247 and the bonus item.
name: stage4-monochromon-improved
device: keyboard
timeout: 900
steps:
  - resize: [1280, 720]
  - wait: {map: gcan11, seconds: 2, timeout: 60}
  - script: shop_job_mode("improved")
  - script: story_set("money 1000")
  - script: story_set("var 1 0")
  - expect_setting: {story.trigger.247: "false"}
  # The counter's cells (A in the collision, trigger 81) before Monochromon.
  - script: place("player -450 -450 2048")
  - wait: {seconds: 1}
  - tap: {key: return}
  - wait: {shown: story_textbox, seconds: 1, timeout: 20}
  # The talk and "I'll try"; the first customer walks in and the rules open by themselves.
  - wait: {confirm: true, answer: true, shown: shop_job_rules, timeout: 180}
  - expect_setting: {shop_job.shown: "true"}
  - screenshot: improved-rules
  - wait: {seconds: 0.5}
  - tap: {key: return}
  - wait: {hidden: shop_job_rules, timeout: 10}
  # The first customer at the counter: the regular price sells.
  - wait: {confirm: true, shown: shop_haggle, seconds: 0.5, timeout: 120}
  - screenshot: improved-first-customer
  - click: {element: shop_haggle#row-6}
  - wait: {hidden: shop_haggle, timeout: 10}
  - expect_setting: {shop_job.tally: "90"}
  # The second customer is sent away.
  - wait: {confirm: true, shown: shop_haggle, seconds: 0.5, timeout: 180}
  - expect_setting: {shop_job.customer: "2"}
  - screenshot: improved-second-customer
  - click: {element: shop_haggle#haggle-dismiss}
  - wait: {hidden: shop_haggle, timeout: 10}
  # The third is made the 20th, the tally past the bonus; sending it away ends the job.
  - wait: {confirm: true, shown: shop_haggle, seconds: 0.5, timeout: 180}
  - expect_setting: {shop_job.customer: "3"}
  - script: story_set("var 123 20")
  - script: story_set("tally 3700")
  - click: {element: shop_haggle#haggle-dismiss}
  - wait: {hidden: shop_haggle, timeout: 10}
  - wait: {confirm: true, answer: true, setting: {story_textbox.row.0.run.0.text: "Monochromon joins the city!"}, timeout: 180}
  - wait: {confirm: true, setting: {story_textbox.row.0.run.0.text: "Monochromon gives you a"}, timeout: 60}
  - screenshot: improved-bonus
  - wait: {confirm: true, map: gcan09, seconds: 2, timeout: 60}
  - expect_setting: {story.trigger.247: "true"}
  - expect_setting: {story.var.1: "2"}
