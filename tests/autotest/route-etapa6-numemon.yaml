# Stage 6 of the story with the keyboard, the sewer's fight: from fact06 on a seeded game (run with --start fact06
# and --story-stage stage_6, docs/guides/prueba-vertical.md), with the power back (trigger 344,
# route-etapa6-guardia; the earlier links are written). Andromon (script 151) says the power came back but something
# is still wrong underground (trigger 341). In the sewer (fact11b, script 180) Numemon picks a fight on entering;
# after it he leaves for the city and joins (trigger 211). Andromon then tells to look for help in the city (trigger
# 328), which the next link (route-etapa6-andromon) finds.
name: etapa6-numemon
device: keyboard
timeout: 1200
steps:
  - wait: {map: fact06, partner_within: 400, seconds: 2, timeout: 60}
  - resize: [1280, 720]
  - script: story_set("trigger 340 on")
  - script: story_set("trigger 342 on")
  - script: story_set("trigger 347 on")
  - script: story_set("trigger 343 on")
  - script: story_set("trigger 331 on")
  - script: story_set("trigger 332 on")
  - script: story_set("trigger 344 on")
  - expect_setting: {story.trigger.341: "false"}
  # Andromon (original x 200, z 336); a click walks up to him, confirm talks.
  - walk_to: {point: [200, 0], radius: 100, timeout: 120}
  - click: [200, -336]
  - wait: {seconds: 3}
  - tap: {key: return}
  - wait: {shown: story_textbox, seconds: 1, timeout: 30}
  - screenshot: andromon
  - repeat: {times: 12, steps: [{when: {shown: story_textbox, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - wait: {hidden: story_textbox, seconds: 1, timeout: 30}
  - expect_setting: {story.trigger.341: "true"}
  - walk_to: {trigger: 51, encounters: win, timeout: 240}
  - wait: {map: fact03, partner_within: 400, seconds: 1, timeout: 60}
  - walk_to: {trigger: 54, encounters: win, timeout: 240}
  - wait: {map: fact11a, partner_within: 400, seconds: 1, timeout: 60}
  - walk_to: {trigger: 51, encounters: win, timeout: 240}
  - wait: {map: fact11b, seconds: 1, timeout: 60}
  # The sewer's Numemon fights on entering (section 0x06 from the map's enter section), after five pages.
  - repeat: {times: 8, steps: [{when: {shown: story_textbox, hidden: battle, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - wait: {shown: battle, seconds: 1, timeout: 120}
  - screenshot: numemon-battle
  - wait: {setting: {battle.phase: fight}, seconds: 0.5, timeout: 60}
  - script: battle_win("")
  - wait: {setting: {battle.phase: end}, timeout: 60}
  - repeat: {times: 10, steps: [{wait: {seconds: 1.0}}, {tap: {key: return}}]}
  - wait: {hidden: battle, seconds: 1, timeout: 60}
  - repeat: {times: 12, steps: [{when: {shown: story_textbox, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - wait: {setting: {story.trigger.211: "true"}, timeout: 60}
  - screenshot: numemon-joins
  - wait: {hidden: story_textbox, seconds: 1, timeout: 30}
  - walk_to: {trigger: 51, encounters: win, timeout: 240}
  - wait: {map: fact11a, partner_within: 400, seconds: 1, timeout: 60}
  - walk_to: {trigger: 52, encounters: win, timeout: 240}
  - wait: {map: fact03, partner_within: 400, seconds: 1, timeout: 60}
  - walk_to: {trigger: 53, encounters: win, timeout: 240}
  - wait: {map: fact06, partner_within: 400, seconds: 1, timeout: 60}
  - walk_to: {point: [200, 0], radius: 100, timeout: 120}
  - click: [200, -336]
  - wait: {seconds: 3}
  - tap: {key: return}
  - wait: {shown: story_textbox, seconds: 1, timeout: 30}
  - repeat: {times: 26, steps: [{when: {shown: story_textbox, steps: [{tap: {key: return}}]}}, {wait: {seconds: 1.5}}]}
  - wait: {hidden: story_textbox, seconds: 1, timeout: 30}
  - expect_setting: {story.trigger.328: "true"}
  - screenshot: andromon-city
