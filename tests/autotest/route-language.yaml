# The language route (R3.9): the main menu, a change of language there and back, then the HUD and the pause menu in the
# language the run started in. It runs once per language, with --lang en and --lang es, and each run's screenshots go
# to their own folder. How to run it: docs/guides/prueba-vertical.md.
name: language
device: keyboard
main_menu: true
timeout: 180
steps:
  - wait: {shown: main_menu, seconds: 1}
  - resize: [1280, 720]
  - screenshot: main-menu
  # The language is in the original look's options; right on it moves to the next language the packs have, and with
  # two, a second press comes back. Escape goes back to the menu.
  - menu_select: options
  - tap: {key: right}
  - wait: {seconds: 0.5}
  - screenshot: main-menu-switched
  - tap: {key: right}
  - wait: {seconds: 0.5}
  - screenshot: main-menu-back
  - tap: {key: escape}
  - menu_select: play
  - wait: {map: twna01, hidden: main_menu, seconds: 0.5}
  - screenshot: field
  - menu: open
  - screenshot: pause-menu
  # The original look keeps the minimap and the options among the PLAYER page's tools (Tab there); the modern look
  # lists them on the menu's first page.
  - when:
      setting: {ui_skin: original}
      steps:
        - menu_select: open-player
        # The page's box takes no input until it is in place (tickUIBox).
        - wait: {seconds: 0.5}
        - tap: {key: tab}
        - menu_select: player-minimap
  - when:
      setting: {ui_skin: modern}
      steps:
        - menu_select: open-minimap
  - screenshot: pause-minimap
  - menu: close
  - wait: {menu_open: false}
  - menu: open
  - when:
      setting: {ui_skin: original}
      steps:
        - menu_select: open-player
        # The page's box takes no input until it is in place (tickUIBox).
        - wait: {seconds: 0.5}
        - tap: {key: tab}
        - menu_select: player-options
  - when:
      setting: {ui_skin: modern}
      steps:
        - menu_select: open-options
  - screenshot: pause-options
  - menu: close
  - wait: {menu_open: false}
