# The first run's skin picker (ui/skin_picker), then the language box: the cursor starts on the packs' default
# (original), each move puts its skin on at once, and confirming New goes on to the language box in that skin. The
# packs' skins in their order (modern, new, original: the game pack's with the disc's images). A manual
# preview, out of the gate's route-*.yaml glob: run it without --ui-skin, so the picker starts on the default.
name: skin-picker
device: keyboard
main_menu: true
boot_screen: true
language_first: true
skin_first: true
timeout: 120
steps:
  - resize: [1280, 720]
  - wait: {shown: skin_picker, seconds: 1}
  - expect_setting: {ui_skin: original}
  - screenshot: original
  - tap: {key: up}
  - wait: {seconds: 1}
  - expect_setting: {ui_skin: new}
  - screenshot: new
  - tap: {key: up}
  - wait: {seconds: 1}
  - expect_setting: {ui_skin: modern}
  - screenshot: modern
  - tap: {key: down}
  - wait: {seconds: 1}
  - expect_setting: {ui_skin: new}
  - tap: {key: return}
  - wait: {shown: main_menu, hidden: skin_picker, seconds: 1.5}
  - screenshot: language
