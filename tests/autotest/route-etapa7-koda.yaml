# Stage 7 of the story with the keyboard, the dinosaur region's forest (koda00-08): from koda00 on a seeded game (run
# with --start koda00 and --story-stage stage_7), the route walks every exit of the forest and back, under the lock.
name: etapa7-koda
device: keyboard
timeout: 1200
steps:
  - wait: {map: koda00, partner_within: 400, seconds: 2, timeout: 60}
  - resize: [1280, 720]
  # The wild ones fight on the way: a Champion partner, healed before each leg, and the fights won at once.
  - script: evolve("grey")
  - wait: {seconds: 30}
  - script: give_item("sm_recovery 20")
  - script: use_item("sm_recovery")
  - walk_to: {trigger: 111, encounters: win, timeout: 300}
  - wait: {map: koda01, seconds: 1, timeout: 60}
  - screenshot: koda01
  - script: use_item("sm_recovery")
  - walk_to: {trigger: 111, encounters: win, timeout: 300}
