# El aviso de un objeto del suelo respondido con un click (tamer.c: tamerTickPickupItem se responde
# confirmando, y el click izquierdo es `confirm` - packages/engine/input: action_map.c:37): drop_item deja la
# carne a los pies del jugador, el aviso se muestra, un click sobre su caja lo cierra y el objeto entra en
# la bolsa. Se corre con: dwe-game --content <carpeta> --autotest tests/autotest/route-field-pickup-mouse.yaml
name: field-pickup-mouse
device: mouse
timeout: 60
steps:
  - wait: {map: twna01, seconds: 1}
  # A clear ground on File City's field, on the free exploration route's way.
  - script: place("player 300 1950 0")
  - wait: {seconds: 0.5}
  - script: drop_item("meat")
  - wait: {shown: field_item_notice, seconds: 0.5, timeout: 10}
  # The click answers the notice as its own `confirm` (field_item_notice's box, document.rml).
  - click: {element: "field_item_notice#box"}
  - wait: {hidden: field_item_notice, seconds: 0.5, timeout: 10}
