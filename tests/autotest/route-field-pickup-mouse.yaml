# The notice of an item on the ground answered with a click (tamer.c: tamerTickPickupItem is answered by
# confirming, and the left click is `confirm` - packages/engine/input: action_map.c:37): drop_item leaves the
# meat at the player's feet, the notice shows, a click on its box closes it and the item goes into the
# bag. Run it with: dwe-game --content <folder> --autotest tests/autotest/route-field-pickup-mouse.yaml
name: field-pickup-mouse
device: mouse
timeout: 60
steps:
  - wait: {map: twna01, seconds: 1}
  # A clear ground on File City's field, on the free exploration route's way.
  - script: place("player 300 1950 0")
  - wait: {seconds: 0.5}
  - script: drop_item("meat")
  - wait: {shown: field_item_notice, seconds: 0.5, timeout: 10}
  # The click answers the notice as its own `confirm` (field_item_notice's box, document.rml).
  - click: {element: "field_item_notice#box"}
  - wait: {hidden: field_item_notice, seconds: 0.5, timeout: 10}
