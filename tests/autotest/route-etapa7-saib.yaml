# Stage 7 of the story with the keyboard, Overdell (saib01-03): from saib01 on a seeded game (run with --start saib01
# and --story-stage stage_7), the route walks every exit of the graveyard and back, under the lock.
name: etapa7-saib
device: keyboard
timeout: 1200
steps:
  - wait: {map: saib01, partner_within: 400, seconds: 2, timeout: 60}
  - resize: [1280, 720]
  # The wild ones fight on the way: a Champion partner, healed before each leg, and the fights won at once.
  - script: evolve("grey")
  - wait: {seconds: 30}
  - script: give_item("sm_recovery 20")
  - script: use_item("sm_recovery")
  - walk_to: {trigger: 110, encounters: win, timeout: 300}
  - wait: {map: saib02, seconds: 1, timeout: 60}
  - screenshot: saib02
  - script: use_item("sm_recovery")
  - walk_to: {trigger: 111, encounters: win, timeout: 300}
  - wait: {map: saib01, seconds: 1, timeout: 60}
  - screenshot: saib01
  - script: use_item("sm_recovery")
  - walk_to: {trigger: 111, encounters: win, timeout: 300}
  - wait: {map: saib03, seconds: 1, timeout: 60}
  - screenshot: saib03
  - script: use_item("sm_recovery")
  - walk_to: {trigger: 110, encounters: win, timeout: 300}
  - wait: {map: saib01, seconds: 1, timeout: 60}
  - screenshot: saib01
