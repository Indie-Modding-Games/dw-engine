# The art fixes (an engine improvement, docs/modulos/apps/game.md, «Arreglos gráficos»): the partner's status page in
# the original look draws the happiness label from the texture's right columns with the option on, and as the original
# does (cut) with it off, the default. From a new game with the keyboard; run it with --ui-skin original.
name: art-fixes
device: keyboard
timeout: 200
steps:
  - wait: {map: twna01, seconds: 1}
  - resize: [1280, 720]
  - expect_setting: {art_fixes: "false"}
  - menu: open
  - wait: {seconds: 0.6}
  - menu_select: open-partner
  - wait: {shown: partner_menu, seconds: 0.8}
  - expect_setting: {has_class.partner_menu#status-happiness-name.fixed: "false"}
  - screenshot: happiness-original
  - menu: close
  - wait: {menu_open: false}
  - wait: {seconds: 0.5}
  - menu: open
  - wait: {seconds: 0.6}
  - menu_select: open-player
  - wait: {seconds: 0.5}
  - tap: {key: tab}
  - wait: {seconds: 0.3}
  - menu_select: player-options
  - wait: {seconds: 0.3}
  - menu_select: art-fixes
  - expect_setting: {art_fixes: "true"}
  - menu: close
  - wait: {menu_open: false}
  - wait: {seconds: 0.5}
  - menu: open
  - wait: {seconds: 0.6}
  - menu_select: open-partner
  - wait: {shown: partner_menu, seconds: 0.8}
  - expect_setting: {has_class.partner_menu#status-happiness-name.fixed: "true"}
  - screenshot: happiness-fixed
