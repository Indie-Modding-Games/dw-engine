# The battle screen with a gamepad (a virtual one of the platform): a battle against the first NPC of File City that
# can fight, started with the debug trigger (battle("") in the console, apps/game/src/battle_trigger.hpp), an order
# from the command row, running away and the end box. The new game's partner has three entries: its finisher
# (command-0, unavailable until the gauge is full), Run (command-1) and Your Call (command-2). How to run it:
# docs/guides/prueba-vertical.md.
name: battle-gamepad
device: gamepad
gamepad: xbox
timeout: 300
steps:
  - wait: {map: twna01, seconds: 1}
  - resize: [1280, 720]
  # The new game's bag is empty, as the original's: the debug give_item puts a Recovery in its first slot.
  - script: give_item("sm_recovery 2")
  - script: battle("")
  # The battle opens with the enemy's anger mark and the "BATTLE" banner; the commands answer once it has gone.
  - wait: {shown: battle, seconds: 1}
  - wait: {setting: {battle.phase: fight}, seconds: 0.5, timeout: 30}
  - screenshot: battle-start
  - menu_select: command-2
  - wait: {seconds: 4}
  - expect_setting: {battle.phase: fight}
  - screenshot: battle-fight
  # The tamer's bag: cancel opens it (the original look draws no entry for it) while the battle goes on, a slot throws its item to the partner.
  - tap: {button: east}
  - expect_setting: {battle.bag.open: true}
  - screenshot: battle-bag
  - menu_select: bag-slot-0
  - expect_setting: {battle.item_in_flight: true}
  - screenshot: battle-item-thrown
  - wait: {seconds: 3}
  - expect_setting: {battle.item_in_flight: false}
  - menu_select: command-1
  - wait: {seconds: 3}
  - expect_setting: {battle.phase: end}
  - screenshot: battle-end
  # The end box closes by itself once its wait is over.
  - wait: {hidden: battle, timeout: 10}
  - screenshot: battle-closed
