# Opening a chest with the keyboard (tamer.c: tamerTickTakeChest): beside the lake's chest, confirm turns the player
# toward the chest, standing (animation 0), the partner stays still (partnerSetState(0xb)) and the drawer comes out;
# then the notice appears. The first confirm puts the item in the bag and the notice goes on; the second closes it
# and sends the partner back to follow the player. A third confirm opens the chest, now empty. Run it with: dwe-game
# --content <folder> --start mayo10 --new-game --autotest tests/autotest/route-field-chest.yaml --shots <folder>
name: field-chest
device: keyboard
timeout: 60
steps:
  - wait: {map: mayo10, seconds: 4}
  # In front of the lake's chest, where its drawer reaches (spawnChest: four cells ahead of it).
  - script: place("player -1511 693 0")
  - wait: {seconds: 0.5}
  - screenshot: chest-before
  - tap: {key: return}
  - wait: {seconds: 0.1}
  - screenshot: chest-opening
  - wait: {shown: field_item_notice, timeout: 10}
  - wait: {seconds: 0.5}
  - screenshot: chest-notice
  - tap: {key: return}
  - wait: {seconds: 0.5}
  - expect_setting: {story.trigger.706: "true"}
  - screenshot: chest-taken
  - tap: {key: return}
  - wait: {hidden: field_item_notice, seconds: 0.5, timeout: 10}
  - screenshot: chest-after
  - tap: {key: return}
  - wait: {shown: field_item_notice, seconds: 0.5, timeout: 10}
  - screenshot: chest-empty
