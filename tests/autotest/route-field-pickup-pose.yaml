# Picking up an item from the ground with the keyboard (tamer.c: tamerTickPickupItem): drop_item leaves the meat at the
# player's feet, the notice appears and the player crouches (field_items.pickup_player_clip, the original's animation
# 12) and stays on its last frame until confirm; meanwhile the partner, placed far away, keeps coming toward the
# player and the clock keeps running. In the original look the box grows from the player and returns to it on
# confirm. On confirm the item goes into the bag and the player stands up again. The captures show the gesture and the
# partner. Run it with: dwe-game --content <folder> --autotest tests/autotest/route-field-pickup-pose.yaml
# --shots <folder>
name: field-pickup-pose
device: keyboard
timeout: 60
steps:
  - wait: {map: twna01, seconds: 4}
  # A clear ground on File City's field, on the free exploration route's way, the partner farther north.
  - script: place("player 300 1950 0")
  - script: place("partner 300 1450 0")
  - wait: {seconds: 1.5}
  - screenshot: pickup-standing
  - script: drop_item("meat")
  - wait: {shown: field_item_notice, timeout: 10}
  - wait: {seconds: 0.15}
  - screenshot: pickup-crouch
  - wait: {seconds: 1.5}
  - screenshot: pickup-hold
  - tap: {key: return}
  - wait: {hidden: field_item_notice, seconds: 0.5, timeout: 10}
  - screenshot: pickup-after
