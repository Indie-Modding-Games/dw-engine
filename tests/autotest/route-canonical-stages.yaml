# The canonical stages (docs/modulos/apps/game.md, «Etapas canónicas»): a new game with the hidden content on, the option
# among the pause menu's options turned on, and the chart: one page with six boxes, the Mega box (Phoenixmon,
# HerculesKabuterimon and the hidden content's MetalEtemon) right of the Ultimate one, the stage names of a Mega and of
# an Ultimate (Phoenixmon and MetalGreymon); then the option off again: the original's five boxes, whose Ultimate box
# cannot hold the hidden content's MetalEtemon and Myotismon, which go to page 2 (arrows and page number under the
# chart), reached with Down past the Ultimate column's last cell, and Up back to page 1 (the chart only in the original
# look, which draws it). Every text must fit its box, and the options list, one row longer,
# scrolls to the new row. Run it with --saves <empty folder>, once per language (--lang en, --lang es) and look
# (--ui-skin original, modern); how to run it: docs/guides/prueba-vertical.md.
name: canonical-stages
device: keyboard
timeout: 300
main_menu: true
new_game_rules: true
text_fit: true
steps:
  - resize: [1280, 720]
  - wait: {shown: main_menu, seconds: 1, timeout: 60}
  - menu_select: play
  - wait: {shown: save_slots, seconds: 0.5, timeout: 30}
  - menu_select: slot-1
  - wait: {shown: dialog, seconds: 0.5, timeout: 30}
  - menu_select: yes
  - wait: {shown: new_game_rules, seconds: 0.5, timeout: 30}
  - menu_select: rules-hidden
  - wait: {seconds: 0.3}
  - menu_select: rules-start
  - wait: {map: twna01, hidden: new_game_rules, seconds: 2, timeout: 120}
  - expect_setting: {canonical_stages: false}
  - expect_setting: {player.chart.58.id: houo}
  - expect_setting: {player.chart.59.id: hkab}
  - expect_setting: {player.chart.62.id: mtet}
  # Phoenixmon (59) and MetalGreymon (12) raised (story triggers 0x200 + their number), so their cells open.
  - script: story_set("trigger 571 on")
  - script: story_set("trigger 524 on")
  # The option on. The original look keeps the options among the player page's tools (Tab there); the modern look lists
  # them on the menu's first page.
  - menu: open
  - wait: {seconds: 0.6}
  - when:
      setting: {ui_skin: original}
      steps:
        - menu_select: open-player
        - wait: {seconds: 0.5}
        - tap: {key: tab}
        - menu_select: player-options
  - when:
      setting: {ui_skin: modern}
      steps:
        - menu_select: open-options
  - wait: {seconds: 0.4}
  - menu_select: canonical-stages
  - expect_setting: {canonical_stages: true}
  - wait: {seconds: 0.3}
  - screenshot: options-on
  - expect_text_fits: all
  - menu: close
  - wait: {menu_open: false}
  # The chart with the Mega box, and the stage names of a Mega and of an Ultimate (the original look draws the chart).
  - when:
      setting: {ui_skin: original}
      steps:
        - menu: open
        - wait: {seconds: 0.6}
        - menu_select: open-player
        - wait: {seconds: 0.6}
        - menu_select: player-tab-chart
        - wait: {seconds: 0.6}
        - expect_text_fits: all
        - screenshot: chart-canonical
        # Phoenixmon's detail, from the Mega box.
        - menu_select: chart-cell-58
        - wait: {seconds: 0.3}
        - tap: {key: return}
        - wait: {seconds: 0.6}
        - expect_text_fits: all
        - screenshot: detail-mega
        - tap: {key: left_ctrl}
        - wait: {seconds: 0.4}
        - menu_select: chart-cell-11
        - wait: {seconds: 0.3}
        - tap: {key: return}
        - wait: {seconds: 0.6}
        - expect_text_fits: all
        - screenshot: detail-ultimate
        - tap: {key: left_ctrl}
        - wait: {seconds: 0.4}
        - menu: close
        - wait: {menu_open: false}
  # The option off: the original's names and boxes.
  - menu: open
  - wait: {seconds: 0.6}
  - when:
      setting: {ui_skin: original}
      steps:
        - menu_select: open-player
        - wait: {seconds: 0.5}
        - tap: {key: tab}
        - menu_select: player-options
  - when:
      setting: {ui_skin: modern}
      steps:
        - menu_select: open-options
  - wait: {seconds: 0.4}
  - menu_select: canonical-stages
  - expect_setting: {canonical_stages: false}
  - menu: close
  - wait: {menu_open: false}
  - when:
      setting: {ui_skin: original}
      steps:
        - menu: open
        - wait: {seconds: 0.6}
        - menu_select: open-player
        - wait: {seconds: 0.6}
        - menu_select: player-tab-chart
        - wait: {seconds: 0.6}
        - expect_text_fits: all
        - screenshot: chart-original
        # MetalGreymon's detail (the cursor still on its cell), then Down past its column's last cell (Etemon) slides to
        # page 2, the cursor in the same column there, on MetalEtemon, and Up goes back to Etemon.
        - tap: {key: return}
        - wait: {seconds: 0.3}
        - tap: {key: return}
        - wait: {seconds: 0.6}
        - expect_text_fits: all
        - screenshot: detail-original
        - tap: {key: left_ctrl}
        - wait: {seconds: 0.4}
        - repeat: {times: 8, steps: [{tap: {key: down}}, {wait: {seconds: 0.1}}]}
        - wait: {seconds: 0.5}
        - expect_text_fits: all
        - screenshot: chart-page2
        - tap: {key: up}
        - wait: {seconds: 0.5}
        - screenshot: chart-back
        - tap: {key: left_ctrl}
        - wait: {seconds: 0.3}
        - tap: {key: left_ctrl}
        - wait: {seconds: 0.4}
        - menu: close
        - wait: {menu_open: false}
