# Free exploration's switch and chooser with the gamepad (docs/architecture/warps-de-script.md): the pause menu turns
# it on, East stays on File City's cell 51, and in the elder's house, South takes the place the chooser starts on:
# the story's, back to File City. It runs once per language, like route-language.yaml. How to run it:
# docs/guides/prueba-vertical.md.
name: free-exploration-gamepad
device: gamepad
timeout: 300
steps:
  - wait: {map: twna01, seconds: 1}
  - resize: [1280, 720]
  - menu: open
  - menu_select: open-options
  - menu_select: free-exploration
  - expect_setting: {free_exploration: "true"}
  - menu: close
  - wait: {menu_open: false}
  - walk_to: {trigger: 51}
  - wait: {shown: destination_choice, seconds: 0.5}
  - screenshot: chooser-twna01
  - tap: {button: east}
  - wait: {hidden: destination_choice, seconds: 0.5}
  - wait: {map: twna01}
  # The elder's house through the warp table; its door's script leads to File City's 13 phases.
  - walk_to: {trigger: 112}
  - wait: {map: room08, partner_within: 400, seconds: 0.5}
  - walk_to: {trigger: 51}
  - wait: {shown: destination_choice, seconds: 0.5}
  - expect_setting: {exploration_story: "0"}
  - screenshot: chooser-room08
  - tap: {button: south}
  - wait: {hidden: destination_choice}
  - wait: {map: twna01, partner_within: 400, seconds: 0.5}
