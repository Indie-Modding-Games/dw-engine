# The battle screen with the keyboard: a battle against the first NPC of File City that can fight, started with the
# debug trigger (battle("") in the console, apps/game/src/battle_trigger.hpp), an order from the command row, running
# away and the end box. The new game's partner has three entries: its finisher (command-0, unavailable until the gauge
# is full), Run (command-1) and Your Call (command-2). How to run it: docs/guides/prueba-vertical.md.
name: battle-keyboard
device: keyboard
timeout: 300
steps:
  - wait: {map: twna01, seconds: 1}
  - resize: [1280, 720]
  # The new game's bag is empty, as the original's: the debug give_item puts a Recovery in its first slot.
  - script: give_item("sm_recovery 2")
  # Nine more fill the new game's ten slots, to check the full bag's layout.
  - script: give_item("med_recovery 1")
  - script: give_item("lrg_recovery 1")
  - script: give_item("sup_recovery 1")
  - script: give_item("mp_floppy 1")
  - script: give_item("medium_mp 1")
  - script: give_item("large_mp 1")
  - script: give_item("double_flop 1")
  - script: give_item("various 1")
  - script: give_item("omnipotent 1")
  - script: battle("")
  # The battle opens with the enemy's anger mark and the "BATTLE" banner; the commands answer once it has gone.
  - wait: {shown: battle, seconds: 1}
  - wait: {setting: {battle.phase: fight}, seconds: 0.5, timeout: 30}
  - screenshot: battle-start
  - menu_select: command-2
  - wait: {seconds: 4}
  - expect_setting: {battle.phase: fight}
  - screenshot: battle-fight
  # The tamer's bag: open-bag (or cancel) opens it while the battle goes on, a slot throws its item to the partner.
  - menu_select: open-bag
  - expect_setting: {battle.bag.open: true}
  - screenshot: battle-bag
  # The bag clears the enemies' panels and the prompts on a 4:3 screen and on a wide one too.
  - resize: [800, 600]
  - screenshot: battle-bag
  - resize: [1920, 1080]
  - screenshot: battle-bag
  - resize: [1280, 720]
  - menu_select: bag-slot-0
  - expect_setting: {battle.item_in_flight: true}
  - screenshot: battle-item-thrown
  - wait: {seconds: 3}
  - expect_setting: {battle.item_in_flight: false}
  - menu_select: command-1
  - wait: {seconds: 3}
  - expect_setting: {battle.phase: end}
  - screenshot: battle-end
  # The end box closes by itself once it has counted, typed and waited.
  - wait: {hidden: battle, timeout: 60}
  - screenshot: battle-closed
