[package]
name = "dwe-launcher"
version = "0.1.1"
description = "Desktop launcher of dwe: reads the player's disc, keeps the game up to date and starts it"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "dwe_launcher"
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
futures-util = "0.3"
semver = "1"
sha2 = "0.10"
base64 = "0.22"
minisign-verify = "0.2"
tar = "0.4"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
sevenz-rust2 = "0.20"
thiserror = "2"
dirs = "6"
time = { version = "0.3", features = ["formatting", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
minisign = "0.7"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
