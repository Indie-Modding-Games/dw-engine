<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dwe</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="backdrop" id="backdrop" aria-hidden="true"><div class="backdrop-art" id="backdropArt"></div></div>
    <div class="shell">
      <nav class="sidebar" id="rail">
        <img class="sidebar-logo" src="art/app-icon.svg" alt="" width="36" height="36" draggable="false" />
        <ul class="side-list" id="sidebar" data-slot="sidebar"></ul>
        <div class="side-bottom">
          <button class="side-item" id="aboutButton" type="button" data-tip="">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="9" /><path d="M12 11v5.5M12 7.6v.1" />
            </svg>
            <span class="sr-only" data-text="nav.about"></span>
          </button>
        </div>
      </nav>

      <div class="stage">
        <header class="topbar">
          <ul class="status-pills" id="statusPills" role="list"></ul>
        </header>

        <main class="main" id="main">
          <section class="view home" id="homeView" aria-labelledby="homeTitle">
            <p class="eyebrow" data-text="heroEyebrow"></p>
            <h1 class="hero-title" id="homeTitle"></h1>
            <p class="lead" id="homeLead"></p>
            <div class="hero-actions">
              <button class="pill" id="mainAction" type="button"></button>
              <div class="menu-wrap" id="configureWrap">
                <button class="ghost" id="configureButton" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="configureMenu">
                  <span data-text="configure"></span>
                  <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
                </button>
                <div class="menu" id="configureMenu" role="menu" aria-labelledby="configureButton" hidden></div>
              </div>
              <button class="ghost" id="stopButton" type="button" hidden data-text="btnStop"></button>
            </div>
            <button class="link-button" id="secondaryAction" type="button" hidden></button>
            <div class="first-run" id="firstRun" hidden>
              <p class="first-run-hint" id="dropTitle"></p>
              <p class="muted small" id="dropHint"></p>
              <p class="muted small" id="dropUnsupported"></p>
              <p class="privacy">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
                  <path d="M12 3 5 6v5c0 4.4 3 8.3 7 10 4-1.7 7-5.6 7-10V6l-7-3Z" /><path d="m9 12 2 2 4-4" />
                </svg>
                <span><strong data-text="privacyTitle"></strong> <span data-text="privacyBody"></span></span>
              </p>
            </div>
            <div class="notice" id="notice" role="status" hidden></div>
          </section>

          <section class="view games" id="gamesView" hidden aria-labelledby="gamesTitle">
            <h1 class="view-title" id="gamesTitle" data-text="gamesTitle"></h1>
            <p class="lead" data-text="gamesLead"></p>
            <ul class="game-cards" id="gameCards" role="list"></ul>
          </section>

          <section class="view addon-view" id="addonView" hidden aria-labelledby="addonTitle">
            <h1 class="view-title" id="addonTitle"></h1>
            <div class="tabpanels" id="tabpanels" data-slot="tabs"></div>
          </section>
        </main>

        <footer class="bottombar">
          <div class="menu-wrap" id="addonsWrap">
            <button class="chip-button" id="addonsPill" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="addonsPopover">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                <path d="M9 4h4v2.2a1.8 1.8 0 1 0 3.6 0V4H20v5h-1.8a1.8 1.8 0 1 0 0 3.6H20V20h-5v-1.8a1.8 1.8 0 1 0-3.6 0V20H4v-7h1.8a1.8 1.8 0 1 0 0-3.6H4V4h5Z" />
              </svg>
              <span data-text="addonsPill"></span>
              <span class="count" id="addonsCount"></span>
            </button>
            <div class="popover addons-popover" id="addonsPopover" role="dialog" aria-labelledby="addonsPopoverTitle" hidden></div>
          </div>
          <div class="bottom-right">
            <div class="menu-wrap news-wrap">
              <button class="chip-button" id="newsPill" type="button" aria-expanded="false" aria-controls="newsPanel">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 4h11l3 3v13H5Z" /><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4" />
                </svg>
                <span data-text="newsToggle"></span>
                <span class="news-version" id="newsVersion"></span>
                <span class="dot" id="newsDot" hidden></span>
                <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6" /></svg>
              </button>
              <section class="popover news-panel" id="newsPanel" aria-label="" hidden>
                <div class="news" id="news" data-slot="news"></div>
              </section>
            </div>
            <ul class="links" id="links" role="list" hidden></ul>
          </div>
        </footer>
      </div>
    </div>
    <div class="drop-overlay" id="dropOverlay" aria-hidden="true" hidden><p id="dropOverlayText"></p></div>

    <dialog class="dialog settings" id="settingsDialog" aria-labelledby="settingsTitle">
      <div class="settings-layout">
        <aside class="settings-side">
          <h2 class="settings-heading" id="settingsTitle" data-text="settings"></h2>
          <div class="settings-nav" id="settingsNav" role="tablist" aria-orientation="vertical" aria-labelledby="settingsTitle"></div>
          <p class="settings-keys" data-text="settingsKeys"></p>
        </aside>
        <div class="settings-main">
          <button class="icon-button settings-close" id="settingsClose" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="sr-only" data-text="close"></span>
          </button>
          <div class="settings-panels" id="settingsPanels" data-slot="settings"></div>
        </div>
      </div>
    </dialog>

    <dialog class="dialog ask" id="askDialog" aria-labelledby="askTitle">
      <h2 id="askTitle"></h2>
      <div id="askBody"></div>
      <div class="dialog-actions">
        <button class="button" id="askCancel" type="button"></button>
        <button class="button primary" id="askOk" type="button"></button>
      </div>
    </dialog>

    <dialog class="dialog message" id="messageDialog" aria-labelledby="messageTitle">
      <h2 id="messageTitle"></h2>
      <p id="messageBody"></p>
      <pre id="messageLog" hidden></pre>
      <div class="dialog-actions">
        <button class="button primary" id="messageDismiss" type="button" data-text="dismiss"></button>
      </div>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <!-- The add-ons' background pages (sandboxed iframes, never shown). -->
    <div class="addon-frames" id="addonFrames" aria-hidden="true"></div>
    <div class="sr-only" id="live" aria-live="polite"></div>
  </body>
</html>
