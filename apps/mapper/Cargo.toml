[workspace]
resolver = "3"
members = [
  ".",
  "crates/mapper-core",
  "crates/mapper-live",
  "crates/mapper-mcp",
  "../../packages/rust/dwe-pack",
  "../../packages/rust/dwe-map",
  "../../packages/rust/dwe-story",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
dwe-pack = { path = "../../packages/rust/dwe-pack" }
dwe-map = { path = "../../packages/rust/dwe-map" }
dwe-story = { path = "../../packages/rust/dwe-story" }
mapper-core = { path = "crates/mapper-core" }
mapper-live = { path = "crates/mapper-live" }
mapper-mcp = { path = "crates/mapper-mcp" }
glam = "0.30"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "dwe-mapper"
version = "0.1.0"
description = "Map editor of dwe: views and edits field maps, their collision, exits and characters"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "dwe-mapper"
path = "src/main.rs"

[dependencies]
dwe-map.workspace = true
dwe-pack.workspace = true
dwe-story.workspace = true
mapper-core.workspace = true
mapper-live.workspace = true
mapper-mcp.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
glam.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
serde_yaml_ng.workspace = true

[lints]
workspace = true
