text.00ae: "Qu'est-ce que tu veux ?!"
text.00e8: "Ouah !"
text.0104: "... ? ... !"
text.011e: "Quoi ? Maintenant ?!\nD'accord, battons-nous !"
text.0196: "J'ai perdu. Zut !"
text.01bc: "Je devrais l'inviter\nen ville."
text.0206: "Euh, pardon."
text.022c: "Tu pourrais...\nvenir en ville... ?"
text.027e: "Quoi ? La ville ?!"
text.029c: "Ce vieux coin, tu veux dire ?"
text.02dc: "Eh bien..."
text.02f0: "Euh......"
text.0306: "Hum........."
text.0332: "Bon, d'accord.\nJe suis Agumon.\nEnchanté."
text.03c6: "Agumon rejoint la ville !"
text.0408: "Super, ça vaut le coup\nd'essayer. Je continue !"
text.0478: "C'est mon territoire !"
text.04b8: "Quoi ?!"
text.04da: "C'est le moment !"
text.0810: "Impossible de me débarrasser\nde ce type !"
