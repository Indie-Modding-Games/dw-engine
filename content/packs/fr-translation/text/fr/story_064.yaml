text.005c: "Myotismon ! Que s'est-il\npassé ?"
text.00b0: "Bakke !"
text.00c6: "..."
text.00ea: "Je vous rejoins à l'Arène.\nMes gars vont me regretter."
text.0172: "Mes gars n'obéissent pas.\nAlors je prends SkullGreymon."
text.01d8: "SkullGreymon n'est plus le\nmême. Il écoute les autres."
text.024e: "Myotismon, ça va ?"
text.02a8: "Argh... C'est toi !\nTu m'as encore sauvé."
text.0306: "Que s'est-il passé ?"
text.032a: "Tu as vu Devimon ?"
text.035e: "Oui. Il est méchant."
text.038a: "Il a ruiné mes recherches\navec sa malveillance."
text.03da: "Tes recherches\nsur SkullGreymon ?"
text.0422: "Je réunissais des os pour\nles assembler. Je ferai\nplus attention."
text.04b8: "Ce Devimon est horrible."
text.04ec: "Je le connais bien."
text.0514: "Quoi ?!"
text.0528: "Il a toujours été rusé,\nmais jamais à ce point."
text.0580: "Quelqu'un lui a peut-être\nlavé le cerveau."
text.05d8: "Peut-être."
text.05ec: "Il pourrait être des vôtres\ns'il redevenait lui-même."
