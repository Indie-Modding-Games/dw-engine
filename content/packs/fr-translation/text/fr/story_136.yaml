text.014c: "J'entends une voix derrière.\nCette voix... !"
text.01f6: "Attends !"
text.0208: "Pourquoi j'attendrais ?!"
text.023e: "Ha ha ha !"
text.02bc: "Ouah, quelle surprise !"
text.02ee: "Whamon, bravo ! Ouah !"
text.033e: "Rends-toi !"
text.0364: "Ugghh !"
text.0378: "Viens travailler en ville\npour racheter tes fautes."
text.03ec: "D'accord, compris.\nJ'irai en ville."
text.0452: "Ha ha ha, je blague ! Salut."
text.08fa: "Zut, il m'a eu !"
text.092a: "Bon, on a repris la grotte.\nÇa va, j'imagine."
text.099a: "Je crois que la grotte\nest sûre maintenant."
text.09da: "Tu as l'air vraiment gentil.\nJe suis sûr qu'ils verront\nleur erreur un jour."
text.0a8a: "Je te donne mon trésor.\nIl est au fond."
text.0aea: "Attends, attends.\nC'est ton trésor, non ?\nJe ne peux pas l'accepter."
text.0b68: "Non, je n'en ai pas besoin.\nJe veux aller dans ta ville."
text.0bce: "Alors, à quoi bon reprendre\ncette grotte ?\nPour rien... ?"
text.0c56: "Désolé, mais je veux\nvraiment t'aider maintenant."
text.0cb8: "Je vois. Merci.\nTu es vraiment gentil."
text.0d04: "Je vais droit en ville.\nJe t'emmène si tu veux."
text.0d92: "Whamon rejoint la ville !"
text.0dd4: "Tu rentres en ville ?"
text.0e0a: "Je rentre\nPas encore"
