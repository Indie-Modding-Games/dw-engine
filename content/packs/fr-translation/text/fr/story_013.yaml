text.0084: "Hé, c'est toi qui\nbâtis une ville ?"
text.00d6: "Oui."
text.00ea: "Euh, tu as de la chance\nde me rencontrer."
text.0132: "Ça ne se voit pas, mais je\nsuis un Digimon Ultime. Si\ntu me bats, je t'aiderai."
text.01d6: "D'accord\nNon merci"
text.0258: "Oh, j'ai perdu ! Bon, on\nse voit en ville."
text.02f0: "Piximon rejoint la ville !"
text.033a: "Oh, quel trouillard !\nÀ la prochaine !"
text.03c0: "Oh, señorita !"
text.03f0: "Hé amigo, quoi de neuf ?"
text.0430: "Wouki, wouki !"
text.0460: "Hein ?"
