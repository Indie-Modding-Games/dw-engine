text.0030: "Repose-toi autant que\npossible. C'est la clé\nde la santé du Digimon."
text.00ca: "Bien. Je vais t'expliquer\ncomment la ville va\ngrandir et prospérer..."
text.014c: "Quand un Digimon Novice\nvient en ville,\nc'est un point de plus."
text.01cc: "Et quand un Digimon\nChampion vient en ville,\nc'est deux points de plus."
text.025a: "Si un Digimon Ultime\nvient en ville,\nc'est trois points de plus."
text.02da: "Mais il y a trois Digimon\nChampions qui ne sont\npas très utiles."
text.0366: "Quand l'un d'eux vient,\nc'est un seul point de plus."
text.03de: "Je vais te parler un peu\ndes types."
text.0436: "Si l'adversaire est du même\ntype que ton partenaire,\nil risque de ne pas se battre."
text.04d2: "Et si le type de ton Digimon\nn'est pas compatible, une\nporte peut lui être refusée."
text.056c: "À part ça, tu n'as sans\ndoute pas à\nt'en soucier."
text.05f2: "Parlons du niveau\nde dresseur."
text.063c: "Le niveau de dresseur monte\nsi tu élèves un Digimon\njusqu'au stade Ultime."
text.06d0: "Et gagner un tournoi de\nhaut niveau, c'est\ntrès bien."
text.075c: "Il monte tout seul.\nNe t'en soucie pas\ntrop."
text.07e8: "Par contre, il faut faire\nattention à ne pas le\nlaisser baisser."
text.0874: "Si ton Digimon s'éteint,\nton niveau de dresseur\nbaissera à coup sûr."
text.0900: "Si tu fais souvent des\nerreurs de soin, il peut\nbaisser. Fais attention."
