text.00cc: "Qu'est-ce que c'est ?"
text.00f4: "AU SECOURS !"
text.0114: "Il a des ennuis,\nje dois l'aider !"
text.0174: "{color:7}??? {color:1}\nPrends-t'en à quelqu'un\nde ta taille !"
text.01e4: "Qui est-ce ?"
text.0270: "Ça va ?"
text.0298: "Merci."
text.02b4: "Appelle-moi quand tu as\ndes ennuis. J'arriverai\ntout de suite !"
text.032e: "À la prochaine !"
text.035e: "Hé, attends-moi !"
text.039a: "On dirait un héros.\nC'est lui qui a la gloire."
text.0404: "C'est ma maison. Sors !"
text.044a: "Je suis Sharmamon. Et toi ?"
