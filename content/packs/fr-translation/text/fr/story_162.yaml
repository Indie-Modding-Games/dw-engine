text.00f8: "Me revoilà !"
text.0122: "Merci de m'avoir invité.\nJ'espère qu'on travaillera\nensemble, {color:10}{partner}{color:1}."
text.01c6: "{color:7}Ton niveau de dresseur\na augmenté ! {color:1}"
text.020c: "{color:7}Bravo !\nVoici une médaille\npour toi. {color:1}"
text.026c: "Carte Machinedramon obtenue !"
text.0782: "Tu as vu le\nGardien du Lac ?"
text.07c8: "Sinon, tu devrais\nattendre côté sud."
text.083e: "Lève-toi très tôt et\nmarche dans la brume.\nIl se passera un truc bien !"
text.08de: "Tu savais qu'au nord, il y a\nun endroit appelé\nPlage Iceberg ?"
text.0962: "On dit qu'un énorme\nDigimon apparaît souvent\nsur la plage."
text.09f4: "Les brigands sont battus ?\nIl paraît qu'il y a\nune bande de brigands."
text.0a8c: "Tu es allé au Grand Canyon ?"
text.0ac6: "On dit que les\nbrigands y sont."
text.0b1e: "Ce sont des méchants ?"
text.0b4a: "Ils t'attaquent et te volent."
text.0b86: "Il faut faire quelque chose."
text.0bd8: "Tu es allé au Grand Canyon ?"
text.0c12: "On dit qu'il y a un\npont invisible là-bas."
text.0c96: "Il paraît que\nMachinedramon est revenu."
text.0cea: "Tu as encore battu\nMachinedramon."
text.0d2e: "Je vais t'expliquer les\nenvirons de la ville."
text.0d88: "La Forêt Natale\nentoure la ville."
text.0dd0: "Les Digimon du coin\nne sont pas très forts."
text.0e2c: "À l'ouest, il y a un\ncamp d'entraînement."
text.0e7a: "La Jungle Tropicale est à\nl'est, de l'autre côté\nde la rivière."
text.0ed2: "Je ne sais pas\nce qu'il y a au-delà."
text.0f18: "À l'ouest, il y a une\nmontagne et un lac."
text.0f70: "Au sud, il y a l'océan."
text.0fb4: "Il y a une haute montagne\nau nord."
text.1006: "Cette ville est le\ncentre de l'île."
text.1058: "Je vais vérifier les rumeurs.\nReviens en savoir plus."
text.10c8: "Voyons ce qu'il y a autour."
text.1108: "Je n'aime pas les toilettes,\nmais le reste a l'air bien !"
text.117e: "Ça a l'air très animé."
text.11b2: "Je ne dois pas retourner\nà Ville Factorielle ?"
text.120c: "Ma fonction d'agenda\nmarche. Pas de problème."
text.1282: "Tu tombes bien !"
text.12be: "Regarde cette sculpture !\nQu'en penses-tu ?"
text.1318: "Quel chef-d'œuvre.\nJe m'épate moi-même."
text.1364: "Comment ça ?\nTu te moques de moi !"
text.13be: "De quoi on parlait ?\nBah, peu importe."
text.141e: "Quelle image j'avais ?\nQuand tu trouveras,\ndis-le-moi."
text.14e2: "il dort..."
text.1516: "Tu sais quoi ? Une plante\nbizarre pousse dans\nla Jungle Tropicale."
text.15b2: "Ah oui,"
text.15c8: "J'ai planté une {color:6}Plante\npluie {color:1}juste là."
text.1618: "Elle donne des fruits\nchaque année vers le 15.\nTu peux les prendre."
text.16a4: "Pour quoi faire ?"
text.16cc: "Oh, ça fait du bien !\nLes rayons du soleil."
text.170e: "Oh, ça fait du bien !\nLes rayons du soleil."
text.1766: "Super, c'est génial !"
text.17be: "Oh, c'est un..."
text.17f6: "Trop d'objets."
text.1822: "J'ai eu un {color:6}Fruit de\nplante pluie{color:1} !"
text.1902: "Je t'emmène sur l'océan.\nC'est mon travail."
text.195c: "Je t'emmène là où on ne\nva que par la mer."
text.19c8: "Bon, alors..."
text.19ea: "Hmmm, où aller ?\nVille Factorielle ou\nla Grotte Plage Secrète."
text.1a6c: "Ville Factorielle\nGrotte Plage Secrète\nNulle part"
text.1b5a: "Je t'ai trouvé !"
text.1b88: "Oh non, il fonce\ndroit sur nous !"
text.1be2: "Enfin, je te trouve !\nJe suis Greymon.\nRéglons ça !"
text.1c62: "Quoi ?!"
text.1c76: "Je suis venu en suivant\nles rumeurs sur toi.\nJe veux te combattre !"
text.1d00: "Si je gagne, je veux\nce panneau !"
text.1d54: "Il n'y a pas de panneau."
text.1d7c: "Peu importe,\nbattons-nous quand même !"
text.1e08: "Hé, vous êtes forts !\nMais pour votre objectif,\nvous êtes encore novices."
text.1ea6: "Hmmm"
text.1eb6: "Je reste pour t'entraîner.\nTu vas beaucoup progresser !"
text.1f56: "Greymon rejoint la ville !"
text.200c: "Enfin, je te trouve, {color:6}{tamer}{color:1} !"
text.2048: "Embuscade !"
text.205e: "Mon but : te battre."
text.2094: "Ces yeux ! On lui a\nlavé le cerveau !"
text.2126: "Quoi que je fasse,\nje dois le vaincre."
text.218c: "De quoi tu parles ?\nTu as besoin de soins."
