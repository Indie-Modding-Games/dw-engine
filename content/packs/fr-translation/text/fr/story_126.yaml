text.0060: "Boutique de cartes Digimon."
text.00a0: "Quoi ? Une carte Digimon ?"
text.00d4: "Tout le monde en collectionne.\nTu ne peux pas perdre."
text.0146: "Oh ?"
text.0158: "Je t'en offre une pour\ncommencer. Une bonne."
text.01ca: "Hé ! Cette carte, c'est MOI !"
text.0206: "J'ai eu une carte de {color:6}{tamer}{color:1} !"
text.0236: "Boutique de cartes Digimon."
text.027e: "On a des cartes géniales\nen stock aujourd'hui."
text.02da: "Acheter une carte\nVendre une carte\nQuitter"
text.0348: "Un paquet de trois\nUne seule\nQuitter"
text.03a0: "Une seule\nQuitter"
text.03cc: "500 Bits le paquet.\nImpossible de savoir\nce qu'il y a dedans."
text.0442: "Je l'achète\nNon merci"
text.0488: "Ouvre vite le paquet."
text.04e8: "Tu veux autre chose ?"
text.0526: "Reviens vite."
text.0552: "Boutique de recyclage."
text.0594: "Un objet normal\nUn objet recyclé\nUne autre fois"
text.0676: "Hé !?"
text.0690: "C'est une boutique !"
