text.027a: "Alerte intrus !"
text.02a2: "Alerte intrus !"
text.02ca: "Je vais tirer !"
text.0346: "Ça va, {color:10}{partner}{color:1}?!"
text.0376: "Rentrons."
text.03b2: "Oh non ! Je dois ranimer\n{color:10}{partner}{color:1}."
text.131c: " !!! "
text.1364: "Incroyable que tu aies\ntraversé la forêt !"
text.13cc: "Je suis Centarumon.\nPardon pour ce que j'ai fait."
text.1426: "Je ne t'ai pas testé pour\nrien. Je veux travailler\navec toi."
text.149a: "Vas-y. Je reste en ville\net je t'attends."
text.1536: "Centarumon rejoint la ville !"
text.1584: "{color:10}{partner}{color:1}, je crois qu'on\ndevient plutôt célèbres !"
text.15e2: "Continuons comme ça !"
text.1632: "Raté !"
