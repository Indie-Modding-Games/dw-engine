text.006c: "Tu es un Digimon ?"
text.00a6: "Tu viens d'où, toi ?!"
text.00e8: "Te moque pas de moi !"
text.0128: "Je vais te dévorer !"
text.01a4: "Oh non, si je ne fais rien,\nelle va se dessécher..."
text.020a: "Pourvu qu'il pleuve..."
text.023e: "Ça alors, intéressant.\nElle germe."
text.0294: "Elle a un peu bougé.\nC'est la plante mystérieuse\ndont tout le monde parle ?"
text.0340: "Elle fane. Si je ne fais\nrien, elle va mourir."
text.03ac: "Utiliser des objets ?"
text.03de: "Oui\nNon"
text.0410: "Je n'ai rien sur moi."
text.045c: "Rien de ce que j'ai n'aide."
text.04ae: "Ça ne marchera pas..."
text.0800: "Hé hé hé."
text.0818: "Salut, je suis Vegiemon !"
text.084c: "Quoi ! Un Digimon plante ?"
text.0880: "Au fait, tu aimes\nles légumes ?"
text.08d4: "Pourquoi tu me parles\nde légumes ? Alors ?"
text.0932: "J'aime ça\nJ'aime pas"
text.0966: "Bon, j'ai changé d'avis."
text.09a8: "Quelqu'un qui aime les\nlégumes est forcément sympa."
text.0a14: "Non, non !\nLes légumes, c'est bon !"
text.0a52: " ? ? ? "
text.0a68: "Bon, c'est décidé.\nJe viens avec toi !"
text.0acc: "Quel type insistant...\nHé, attends !"
text.0b1e: "Bon, alors je ne viens pas !\nSalut !"
text.0b60: "Décide-toi !"
text.0b8c: "Qu'est-ce que tu veux que\nje fasse ?"
text.0bd0: "Et si tu venais en ville\npour nous aider !"
text.0c36: "D'accord, ça me va.\nÇa fait trop longtemps\nque je suis ici."
text.0cea: "Vegiemon rejoint la ville !"
