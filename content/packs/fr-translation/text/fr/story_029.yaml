text.0116: "Je crois qu'on a sorti\npresque toute la terre."
text.0182: "Le travail avance bien.\nMerci.\nAttends encore un peu."
text.021e: "Merci pour ton travail.\nVoici ta paie."
text.0296: "J'ai gagné 500 Bits\nen travaillant !"
text.02d8: "HP en hausse de 50 !\nAttaque en hausse de 5 !\nDéfense en hausse de 5 !"
text.0396: "Vide la terre en dehors\ndu tunnel, s'il te plaît."
text.040a: "Prends-la dans le tas."
text.0476: "Tu vas porter de la terre ?"
text.04b4: "Ton Digimon a l'air fatigué.\nLaisse-le d'abord se reposer."
text.054c: "Tu vas porter de la terre ?"
text.058c: "Oui\nNon"
text.05b8: "Ce n'est pas un endroit pour\nles amateurs. Éloigne-toi,\nc'est trop dangereux."
text.065e: "Ce tunnel n'est pas encore\nouvert. Ne nous gêne pas."
text.06d8: "Pardon. Tu sais quand\nil le sera ?"
text.072e: "Je ne sais pas,\nça va prendre du temps."
text.077c: "C'est embêtant.\nOn peut aider ?"
text.07c0: "Tu veux nous voler notre\nplaisir ? Tu pourrais\npeut-être porter la terre."
text.083c: "Qu'est-ce que c'est ?"
text.0866: "J'ai creusé cette terre.\nTu peux la sortir\net la vider dehors."
text.08de: "C'est un travail dur, alors\nje te paie 500 Bits\npar aller-retour."
text.096e: "On creusera plus vite.\nJe gagne de l'argent, et\nc'est un bon entraînement."
text.0a0c: "D'accord\nNon merci"
text.0a3a: "Transport de terre\n{color:6}△ {color:1}pose une caisse\ndevant la terre.\nVide-la hors du tunnel.\nAprès chaque tour,\npréviens Drimogemon."
text.0b66: "Tu as peur ?"
text.0bae: "Caisse ajoutée."
