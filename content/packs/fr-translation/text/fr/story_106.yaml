text.005e: "Un éboulement bloque tout..."
text.00a2: "Test de combat !"
text.00c0: "Je blague."
text.00e6: "On m'appelle M. Pratique !\nQue puis-je pour toi ?"
text.0146: "Modifier les paramètres\nAvancer le temps\nMaîtriser les techniques"
text.01cc: "Augmenter\nDiminuer\nRemettre le niveau à zéro"
text.022a: "Avancer d'une heure\nAvancer de six heures\nAvancer d'un jour"
text.02e4: "Ajouter 50\nAjouter 100\nAjouter 200"
text.03bc: "Retirer 50\nRetirer 100\nRetirer 200"
