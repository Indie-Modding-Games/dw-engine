text.00b2: "Qu'est-ce que c'est ?!"
text.00e2: "Oh, bon retour, Hagurumon !"
text.0122: "Hagurumon ?!"
text.0168: "Qu'est-ce qui se passe ?!"
text.01d8: "{color:7}Jouets {color:1}\nC'est un vieux conte.\nUn méchant est venu de\nloin sur cette île."
text.0280: "{color:7}Jouets {color:1}\nLes méchants ont dit aux\nDigimon : l'île est à nous."
text.030a: "{color:7}Jouets {color:1}\nLes Digimon ont répondu :\nc'est faux. Cette île\nest à tout le monde."
text.03b8: "{color:7}Jouets {color:1}\nLes Digimon se sont unis\net ont défié les méchants,\nqui ont reçu une leçon."
text.0494: "{color:7}Jouets {color:1}\nMais les méchants ont dit :\nattendez, on reviendra.\n... Et ils ont disparu."
text.0554: "{color:7}Jouets {color:1}\nC'est un vieux conte."
text.05b0: "Hmmm, je me sens joyeux...\nOh, attends."
text.05fc: "Cette histoire de la chanson,\nc'est un vieux conte\nde l'île, non ?"
text.0684: "Les Digimon qui battent\nles méchants..."
text.06e0: "Hmmm, qui étaient les\nméchants de l'histoire ?"
text.0750: "Merci de m'avoir aidé.\nVoici pour te remercier."
text.07cc: "La peluche de Monzaemon\nrejoint la ville !"
text.0850: "Attends, WaruMonzaemon n'a\npas laissé tomber un truc ?"
text.08be: "Bonne chance !\nC'est la maison d'à côté !"
text.092a: "......"
text.09cc: "Oh, Monzaemon !\nTu es revenu à la vie !"
text.0a16: "Ouah, qu'est-ce que c'est ?"
text.0a3e: "Va combattre WaruMonzaemon !\nVite, tout le monde,\nbougez ! Vite, vite !"
text.0ace: "Attendez... attendez ! Ce\nn'est pas le Monzaemon\nque vous connaissez."
text.0b38: "Hein ? Comment ça ? Mais\nc'est bien un Monzaemon, non ?"
text.0bb2: "Oui, c'est vrai que\nc'est un Monzaemon."
text.0c0a: "Un méchant, WaruMonzaemon,\na enlevé mes amis."
text.0c7a: "Je crois que seul Monzaemon\npeut le vaincre !"
text.0cec: "Hmm, alors il faut trouver\nce méchant. Où est-il ?"
text.0d5a: "Il est à côté. Je vais\nouvrir le sceau de la porte."
text.0dc2: "Alors va voir ce que\ntu peux faire."
text.0e14: "Je vois. D'accord,\nje vais t'aider !"
text.0e60: "Merci !"
text.0e88: "Merci !"
text.0eb0: "Merci !"
