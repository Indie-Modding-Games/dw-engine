text.004c: "Bienvenue dans mon restaurant."
text.0084: "J'ai décidé d'être gérant\net chef de ce restaurant."
text.00fc: "Savoure ma cuisine flambée\nautant que tu veux."
text.0178: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}, vous ne\ngoûtez pas ma cuisine ?"
text.01ce: "Ce n'est pas un objet, c'est\nde la vraie cuisine. C'est\nmon talent secret."
text.0274: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1} !\nJ'ai décidé de vivre de\nla cuisine. Je suis doué !"
text.02f2: "Viens te détendre et manger\nà mon restaurant un jour."
text.037a: "C???NC?? , C???MC?? .\nMon resto a enfin ouvert !"
text.03e6: "Goûte le dessert glacé !\nC'est ma spécialité."
text.045c: "{color:6}{tamer}{color:1}, j'ai décidé\nde travailler comme chef\ndans ce restaurant."
text.04d0: "Savoure un bon plat chaud."
text.051e: "Super !\n{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nje suis cuisinier !"
text.0566: "Ma cuisine est bien\nmeilleure que partout\nailleurs. Goûte-la !"
text.061a: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1} !\nJ'ai décidé de consacrer\nma vie à la cuisine !"
text.067e: "Ma cuisine maison est très\nsaine ! Viens me voir\nquand je cuisine."
text.0734: "Hé ! {color:6}{tamer}{color:1}, {color:10}{partner}{color:1} !"
text.0758: "J'ai décidé d'aider\nce restaurant.\nOn me laisse faire le dessert."
text.07d6: "Je suis très fier de\nmon dessert.\nGoûte-le, d'accord ?"
