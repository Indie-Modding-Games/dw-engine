text.006c: "Je ne me sens pas bien."
text.0098: "Ça va ?"
text.00c0: "Je ne me sens pas bien."
text.00ec: "C'est ici que tu vis ?"
text.0122: "Je suis malade. Sans énergie."
text.0158: "Tu as une sale mine."
text.017e: "Ça empire."
text.01ac: "Je dois trouver pourquoi."
text.01e6: "D'où vient cette eau\nd'égout ?\nJe vais voir ça !"
text.0282: "Qu'est-ce que c'est ?"
text.02b2: "Qu'y a-t-il, {color:10}{partner}{color:1} ?!"
text.02ea: "Ce brouillard pue !"
text.0312: "C'est bizarre, plutôt infect."
text.0350: "Bien, l'égout est\nredevenu normal."
text.039a: "Ça va aller pour lui.\nJ'ai réglé le problème."
text.040c: "Quelque chose cloche !"
text.0450: "Da da da !"
text.04bc: "Je suis fatigué.\nQu'est-ce qui vous arrive ?"
text.050e: "Il a l'air plus bête !\nIl a peut-être retrouvé\nses esprits."
text.0574: "Tu me traites de bête ?\nMalpoli ! Moi, c'est Numemon."
text.05e8: "Si tu n'es pas bête,\ntu es quoi ?"
text.0630: "Pardon, Numemon. Tu sais\nqui t'a sauvé la vie ?"
text.06a0: "Hein ? Tu veux que je te\nsauve la vie ? D'accord."
text.06fc: "Ugghh. Il ne comprend\nrien ! Bon, peu importe."
text.0766: "Hé, moi, un sauveur. Cool !"
text.07ae: "Viens dans notre ville.\nTu sais où elle est ?"
text.081c: "Un peu."
text.087c: "Numemon rejoint la ville !"
text.08ce: "Qui est là ?!"
text.08ec: "Qui es-tu ?!"
text.0984: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1} ! Je peux\nporter jusqu'à 20 objets !"
text.0a46: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1} ! Je peux\nporter jusqu'à 30 objets !"
