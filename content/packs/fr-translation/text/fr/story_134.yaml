text.0092: "Shaka shaka !"
text.00c0: "Shreau !"
text.00e4: "Croâ !"
text.0104: "Si on ne les assomme pas,\nc'est nous qui y passons."
text.017a: "Cervelle d'oiseau !"
text.0198: "Tête de nœud !"
text.01b4: "Nigaud !"
text.01ca: "Tête de linotte !"
text.01ec: "Bêta, bêta !"
text.020a: "Eau de ringard !"
text.022a: "Qu'est-ce que tu as dit ?!"
text.0254: "Ça m'énerve\nJe vais les ignorer"
text.02de: "Ils ne sont pas gentils !"
text.034e: "Attends, qu'y a-t-il ?"
text.0396: "!"
text.03b4: "Mon maître m'appelle.\nViens avec moi. Croâ."
text.0420: "Oh non !"
text.0440: "Ha ha ha, il bluffe.\nJe ne traite pas avec\nles gamins."
