text.003e: "!!!"
text.006c: "Un œuf !"
text.0080: "Ce serait celui de\nMachinedramon ?"
text.00c8: "Ça sent les ennuis !"
text.015e: "Digitamamon rejoint la ville !"
text.01b8: "!"
text.01e2: "Il est là ! Je l'ai trouvé !"
text.022a: "C'est toi, le chef !"
text.0252: "Enchanté.\nJe suis Analogman."
text.029a: "Je sais tout de toi, mais je\nne savais pas que tu étais\nun gamin."
text.030e: "Un gamin a fichu mon plan\nen l'air, incroyable."
text.0378: "J'étais si près de régner\nsur le Monde du Net."
text.03ce: "Tu es un adulte ! Arrête,\ntu fais du mal à tous."
text.0442: "Peu m'importe de faire\ndu mal aux Digimon."
text.049a: "Les Digimon doivent obéir\naux humains comme esclaves."
text.04fa: "Tu as tort ! Les Digimon ont\nun cœur et une âme !\nOn est amis !"
text.0578: "Battons-nous pour voir qui\nvaut mieux : esclaves ou amis."
text.060c: "À toi, Machinedramon !"
text.0698: "On a réussi, {color:10}{partner}{color:1} !"
text.06e0: "Impossible !\nMon esclave le plus puissant !"
text.0736: "Tu vois, tu avais tort !"
text.0772: "Ouah, ouah..."
text.07b4: "Si tu laisses l'île\ntranquille et demandes pardon,\nils te pardonneront."
text.0854: "Je n'aurais pas dû me fier\naux Digimon. J'agirai seul."
text.08e2: "Qu'est-ce que tu vas faire ?!"
text.0926: "{color:7}Analogman {color:1}\nJe vais faire sauter l'île\net fuir dans un autre\nmonde. Dommage, gamin !"
text.0a12: "Oh noooon !!"
text.0a3c: "{color:7}Analogman {color:1}\nC'est fini pour toi !"
text.0a86: "Désolé, les amis. Je ne\npeux plus rien faire."
text.0af0: "{color:7}??? {color:1}\nCe n'est rien."
text.0b30: "Hein ?"
text.0b56: "{color:7}Analogman {color:1}\nLe transfert ne marche pas !\nUne erreur dans le\nprogramme. Qu'arrive-t-il ?!"
text.0c18: "J'entends la voix de tous !\nQui est là ?"
text.0c7e: "{color:7}Jijimon {color:1}\nJe t'envoie notre énergie\nen ce moment même."
text.0cee: "{color:7}Tokomon {color:1}\nTu entends nos voix ?"
text.0d3c: "{color:7}Agumon {color:1}\nOn est arrivés à temps !"
text.0d8e: "Vous tous..."
text.0dc4: "{color:7}Analogman {color:1}\nNon, maudite machine !\nÀ l'aide ! À l'aide !\nAhhhhhhh !!!"
text.0ec4: "Il a disparu ! Que s'est-il\npassé ?"
text.0efe: "{color:7}Jijimon {color:1}\nJe ne sais pas. Mais..."
text.0f4c: "Jijimon ? Ça va exploser !\nFais quelque chose !"
text.0fa2: "{color:7}Jijimon {color:1}\nIl devrait déjà être là."
text.1032: "Airdramon !"
text.104e: "Vite, dépêche-toi !"
text.10ac: "Analogman a disparu."
text.10d8: "La paix est revenue sur\nl'île File."
text.1124: "Et..."
