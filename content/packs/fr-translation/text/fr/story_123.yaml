text.0058: "Hé !"
text.0076: "Haaaa !"
text.0098: "Ouah !"
text.00bc: "Est : Ascenseur\nOuest : Danger !!\nAttention à la falaise."
text.012e: "Mode Ogre : OUI\nMode Ogre : NON"
text.018a: "Attention aux éboulements !"
text.01f0: "On dit que des brigands\nattaquent sur cette route."
text.025e: "Allez, on y va, {color:10}{partner}{color:1}."
text.02b6: "Youhou !"
text.02d2: "Ha ha ha !"
text.02ec: "Yahou !"
text.034a: "Rends-toi et laisse tes\naffaires, sinon gare à toi !"
text.03c6: "Rends-toi !"
text.03e2: "Quoi ?! Toi..."
text.0404: "Impossible !"
text.0424: "Chef, on fait quoi ?"
text.0458: "Pas de panique ! On est\nplus forts et plus\nnombreux ! Attrapez-les !"
text.0530: "Je me vengerai un jour !"
text.0570: "Regarde-les filer ! Ils ne\nreviendront pas de sitôt."
