text.0020: "Bon retour, {color:6}{tamer}{color:1}."
text.004c: "Je tiens les archives\nde Jijimon."
text.008a: "Je note les infos de Jijimon\net je te les transmets."
text.00e8: "Si tu ne sais pas quoi faire,\ndemande-moi, je te dirai\noù aller."
text.0184: "Tous les Digimon se sont\nréunis en ville.\nMerci infiniment !"
text.0208: "Je te dis ce que je sais.\nVoyons..."
text.0266: "Et puis..."
text.0288: "Et aussi..."
text.0300: "Les Digimon végétaux sont en\nforêt. Plus ils sont près,\nplus ils sont durs à voir."
text.03e6: "Les Digimon Insectes aiment\nla verdure. Comme celle\nautour de la ville..."
text.04a6: "La Jungle Tropicale a une\nforêt en labyrinthe.\nUn Digimon fort la garde."
text.0578: "Un ancien, dans la rivière,\nattend quelqu'un."
text.0616: "Un Digimon adore les rives\naux eaux chaudes."
text.06b0: "Les cimetières ont des\nfantômes. Ils adorent parler."
text.0752: "Un secret se cache dans le\nparterre de la ville. Demande\nà une plante pour une autre."
text.0828: "La Région Dino Antique est\ndangereuse, mais mieux\nvaut aller voir."
text.08ec: "La lave coule dans le\nMont Panorama. Certains\nDigimon adorent la chaleur."
text.09a4: "Emmener au froid un Digimon\nqui aime la chaleur, c'est\ncontre les règles, mais..."
text.0a88: "En Terre Gelée, beaucoup\nde Digimon te suivront.\nVa vers l'ouest."
text.0b58: "Au sommet du Grand Canyon\nvit un Digimon Oiseau."
text.0bf8: "Le Grand Canyon est un\nlabyrinthe. Une fois dedans,\ndur d'en sortir."
text.0cb0: "Dans la Savane Engrenage,\nil y a un Digimon\nqui adore l'électricité."
text.0d60: "Au Bois Brumeux, un Digimon\nlève-tôt peut apparaître."
text.0e02: "Au Grand Canyon,\nil y a une boutique\ntenue par un Digimon."
text.0ea6: "Tu croiseras peut-être un\nDigimon ailé qui survole le\nMont Panorama en un battement."
text.0f84: "La Savane Engrenage convient\naux Digimon qui volent bas.\nCherche là-bas."
text.104e: "Certains Digimon te\nconnaissent peut-être\net te défieront."
text.10ee: "En Terre Gelée, des Digimon\nvivent dans des grottes et\ninvitent les autres."
text.11be: "Invite en ville les Digimon\ntravailleurs, une fois\nleurs tâches finies."
text.12a2: "Le Bois Brumeux est parfait\npour se cacher. Guider les\nDigimon cachés, c'est ton job."
text.137c: "Quand les rumeurs sur toi\ncourront, reviens."
text.141e: "Une ombre immense apparaît\nsur les côtes de Terre Gelée.\nPeut-être un Digimon."
text.14f6: "Aide les Digimon qui\nadorent collectionner.\nEssaie la Terre Gelée."
text.15b6: "Au sommet du Mont Panorama,\nun Digimon te défiera\nsi tu le vois."
text.1694: "Il y a aussi des Digimon dans\nles lieux humides, comme les\négouts. Aide-les."
text.176c: "Des Digimon Insectes vivent\naprès le Lac Œil de Dragon.\nVa y pêcher."
text.1832: "Quand un Digimon Androïde\ntombe en panne, il se répare\nentièrement et vite."
text.18fa: "Si tu crains le danger, tu\nperdras ton but de vue."
text.1966: "Il faut avoir le courage\nd'escalader au moins une fois\nune falaise dangereuse."
text.1a36: "Écoute tout ce qu'on dit\nen ville sur ceux\nqui ont besoin d'aide."
text.1afc: "Un méchant s'est installé\nrécemment dans un endroit\ntrès peuplé. Peut-être..."
text.1be0: "Il y aurait une vieille\ntablette enterrée, mais\nquelqu'un doit la déterrer."
text.1ca8: "Un Digimon rare apparaît\ndans une jungle et défie\nles autres."
text.1d68: "Il y a peut-être des Digimon\nqui vivent dans les arbres."
text.1e16: "Dans une Cité de Fer à\nl'ouest, un Digimon rare\npeut apparaître et défier."
text.1efa: "Il y a un Digimon\nextraterrestre. Tu le\ncroiseras peut-être un jour."
text.1f9e: "Il y a un Digimon Animal\nMythique. Il est dans une\nmaison sans propriétaire."
text.2076: "Continue de chercher\nNanimon jusqu'au\nvrai trésor."
text.2136: "Myotismon a disparu.\nSuis les indices\nde son manoir."
text.21f0: "Il reste des Digimon inconnus,\nmais finis d'abord\nl'essentiel !"
text.22c4: "Le dernier Digimon naîtra\nau dernier endroit où tu\niras. Tu comprends ?"
