text.0034: "Miam, miam."
text.004e: "Euh..."
text.0064: "Écoute-moi, s'il te plaît."
text.008e: "Miam, miam."
text.00b0: "Mes hommes ne m'écoutent plus."
text.00f0: "Je crois qu'ils ne se\nrappellent plus mes ordres."
text.014a: "Parfois, ils ne\ncomprennent même pas."
text.019a: "Mes hommes devraient\nm'apporter mes repas, mais..."
text.01ea: "Miam..."
text.0202: "Pendant que je travaillais,\nils ne m'ont rien apporté,\nalors j'ai oublié de manger."
text.0294: "Tu es trop absorbé par\nton travail."
text.02e2: "J'ai tellement honte."
text.0310: "Je crois qu'il y a un\nproblème dans le manoir."
text.0366: "Un problème sur l'île ? Tous\nsont comme mes hommes ?"
text.03da: "Oui, ils perdent tous\nla mémoire."
text.042c: "Tu crois que quelqu'un\nfait ça ?"
text.0478: "Hmmm"
text.0488: "Que puis-je faire ?"
text.04ac: "On bâtit une ville pour\nunir le cœur des Digimon."
text.0512: "On voyage pour\ntrouver des amis."
text.055a: "Ce que je peux faire ?\nMes hommes ne savent\nque se battre."
text.05cc: "Je ne peux pas les laisser."
text.0604: "Je vois..."
text.061c: "Laisse-moi y réfléchir.\nJe suis désolé, mais..."
text.067e: "Je reviendrai.\nN'oublie pas de manger."
text.06de: "Tu veux faire un match ?"
text.0712: "Un match ? Parfait,\nça changera les idées\nde mes hommes."
text.0776: "Alors, tu veux venir ?"
text.07a8: "Oui, mais j'ai encore des\nrecherches à faire ici.\nJ'irai bientôt."
