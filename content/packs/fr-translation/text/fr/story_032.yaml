text.007e: "Hé, ce sera bientôt ouvert !"
text.00e6: "On attendait ça depuis\nlongtemps ! Le tunnel\nest ouvert !"
text.014e: "Plus besoin de passer par\nla montagne. Merci."
text.01c2: "Merci. Je n'aurais pas pu\nbouger ce rocher tout seul."
text.0234: "Qu'est-ce que je fais\nmaintenant ?"
text.026e: "Tu devrais venir en ville.\nTu y trouveras quoi faire !"
text.02e6: "J'ai encore plein d'énergie.\nJ'accepte avec plaisir."
text.0362: "Ce sera bientôt ouvert !"
text.03dc: "Drimogemon rejoint la ville !"
