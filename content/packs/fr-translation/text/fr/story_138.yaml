text.0018: "Je collectionne les cartes."
text.0058: "Donne-moi Hagurumon,\nToyAgumon et WaruMonzaemon,\net je te donne un truc."
text.0108: "Donner\nNe pas donner"
text.0138: "Désolé, je n'en ai pas."
text.0176: "Tiens. Un {color:6}Bandage X{color:1}."
text.01b4: "J'ai trop d'objets."
text.01f8: "Tu as déjà essayé le curling ?"
text.0236: "Si tu marques dix\npoints au jeu, tu as\nun talent incroyable."
text.02c0: "Je ne sais pas si ça aide,\nmais voici des conseils\nde pêche."
text.0338: "D'abord, la canne. Une bonne\ncanne lance loin et\nplie juste comme il faut."
text.03c0: "Ensuite, l'appât. Retiens\nquel poisson tu as pris\navec quel appât."
text.043c: "Quand tu lances la canne,\nrelâche {color:6}△ {color:1}\npour la lancer à fond !"
text.04ce: "Le Gardien du Lac...\nIl apparaît chaque jour le\nmatin et en fin d'après-midi."
