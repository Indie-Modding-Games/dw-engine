text.0050: "Il est arrivé ! Ça a marché !"
text.0094: "Un humain.\nComme tu l'avais dit, Jiji."
text.00e8: "Mmmm."
text.0102: "Chut, il se réveille."
text.0140: "Hein ? Où suis-je ?"
text.0170: "Bienvenue dans Digimon World !"
text.01ae: "Quoi ?"
text.01d0: "Aïe !"
text.01ec: "Qu'est-ce qu'il y a ?"
text.0220: "Qui êtes-vous ?"
text.0266: "Ce sont des Digimon."
text.0296: "Digi... Quoi ?"
text.02c0: "Hein ? Je croyais que tu\nconnaissais les Digimon."
text.0320: "J'ai compris, c'est un rêve."
text.0364: "Ce n'est pas un rêve."
text.039a: "Hé, attends, tu es Tokomon.\nC'est un rêve très réaliste."
text.0412: "{color:6}{tamer}{color:1}, ce n'est pas\nun rêve, mais ce n'est pas\nréel non plus."
text.048a: "De quoi tu parles ?\nQui es-tu ?"
text.04ea: "Je suis Jijimon."
text.0514: "Je ne connais aucun\nDigimon de ce nom."
text.0576: "Il existe plus de Digimon\nque tu n'en connais.\nVoici Digimon World."
text.0600: "Digimon World ?!"
text.0636: "Ce monde n'est ni un rêve\nni la réalité.\nC'est notre monde."
text.06b8: "Eh ben... Ça a l'air trop\nréel pour un rêve."
text.071e: "Regarde derrière toi,\ntu vas comprendre."
text.077a: "Quoi ?"
text.07b6: "C'est {color:10}{partner}{color:1} ?"
text.07e2: "Je me souviens ! J'ai été\naspiré dans ce porte-clés\nDigimon."
text.0864: "C'est ça."
text.0892: "Pourquoi suis-je ici ?"
text.08be: "Viens chez moi,\nje vais t'expliquer."
text.0a62: "Je t'ai fait venir\npour nous sauver."
text.0aaa: "Vous sauver de quoi ?"
text.0ae0: "On est à Cité File, le\ncentre de l'île File."
text.0b58: "Une ville ? Ici ?"
text.0b86: "Eh bien, c'était une ville.\nToutes sortes de Digimon\nvivaient ici."
text.0c2e: "Les Digimon ont perdu cœur\net ont quitté la ville."
text.0ca6: "Comment ça ?"
text.0cdc: "Je ne sais pas pourquoi.\nLes Digimon ont commencé\nà perdre la parole."
text.0d84: "Certains parlent encore,\nmais tous ont oublié\nqu'ils vivaient ici."
text.0e14: "C'est ce que tu voulais\ndire par « perdre cœur »."
text.0e70: "C'est dangereux\nde ne rien faire."
text.0ebc: "Mais pourquoi moi ?"
text.0ee2: "Tu es doué pour élever\nles Digimon, non ?"
text.0f3c: "Oui, je suis doué !"
text.0f7c: "Tu ne remarques pas que\ntu parles digimon ?"
text.0fe6: "Hein ? Pas du tout. Je\nparle français, tout bête."
text.104e: "Pour nous, c'est du digimon."
text.10a2: "Exactement !"
text.10d4: "Dans ce monde, ton amour\ndes Digimon te donnera\nde la force."
text.1158: "Merci."
text.1176: "C'est pour ça que je t'ai\nchoisi. Tu peux rallier\ntous les Digimon de l'île !"
text.120a: "Quoi ?"
text.121c: "Hmm ?"
text.122c: "Tu peux compter sur moi !"
text.126c: "Super !"
text.1294: "Merci, tu es notre espoir."
text.12da: "Par où je commence ?"
text.130c: "Prends {color:10}{partner}{color:1} et\nexplore l'île."
text.1360: "Trouve la cause de ce\ndanger et fais revenir\nles Digimon."
text.13f6: "Allons-y, {color:10}{partner}{color:1} !"
text.1444: "Attends, je n'ai pas fini."
