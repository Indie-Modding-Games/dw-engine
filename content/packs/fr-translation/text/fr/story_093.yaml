text.0066: "Ouah, on dirait qu'elle vit !"
text.0096: "En fait, elle bouge quand\non bouge. Attends !"
text.0144: "Qu'y a-t-il, {color:10}{partner}{color:1} ?\nTu as trouvé quelque chose ?"
text.01a0: "Ouah, bravo,\n{color:10}{partner}{color:1} !"
text.0202: "Oh ? À propos de cette\nstatue..."
text.024e: "Ah !"
text.0272: "Ouf, bon"
text.028e: "Tu es revenu à la vie.\nSuper !"
text.02d4: "Je suis Angemon, un ange qui\nte protège. Je me suis éveillé\npour remplir mon devoir."
text.036a: "De quoi il parle... ?"
text.03a8: "Je connais la vérité céleste."
text.03e4: "J'offre mon âme pour suivre\nles instructions terrestres."
text.044a: "De quoi il parle... ?\nTu viens en ville ?"
text.04c0: "Ta mission est mon devoir.\nJ'y vais."
text.050a: "Pardon, tu peux parler avec\ndes mots que je comprends ?"
text.0578: "J'irai en ville, alors\ncontinue tes efforts."
text.05da: "Je vois. Merci !"
text.0636: "Angemon rejoint la ville !"
