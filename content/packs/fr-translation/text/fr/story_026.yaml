text.0076: "Oh, merci beaucoup !"
text.00a6: "Quoi ? Tu veux te battre ?"
text.00f4: "Oh, merci mille fois !"
text.0120: "Laisse ça !"
text.0154: "Ne force pas trop !"
text.0186: "Battons-nous, voyou !"
text.01c0: "J'abandonne !"
text.01de: "Le chef est parti."
text.0262: "Hé, vous deux, si vous\nvoulez passer par ici,\nlaissez toutes vos affaires !{stop}"
text.02ec: "Ça fait longtemps."
text.0316: "Mmm. Encore vous !"
text.0346: "C'est ma réplique !\nVous trouver, c'était facile.\nPrêts à perdre ?"
text.03c6: "Perdre ? Jamais !\nJe vais te montrer ce que\nje fais quand je m'énerve !"
text.0444: "Réglons ça une bonne\nfois pour toutes !"
text.04de: "Comment... je ne peux\npas gagner ?"
text.0520: "Qu'est-ce qu'il y a ?\nTu ne t'enfuis pas ?"
text.0578: "Je suis trop fatigué."
text.059c: "..."
text.05aa: "Je suis devenu bandit parce\nque je croyais l'île fichue,\nalors je faisais\nn'importe quoi."
text.0654: "Tu savais que l'île était\nen danger ?"
text.06aa: "Oui, puis vous êtes arrivés.\nC'est bête de vouloir\nvous aider maintenant."
text.0742: "Je ne crois pas.\nViens en ville."
text.0794: "Non, je ne peux pas. Et puis,\npersonne ne me pardonnera\nce que j'ai fait."
text.083e: "Oh, tais-toi donc\net viens avec moi !"
text.089c: "Tu peux être utile !\nTout le monde a quelque\nchose à offrir !"
text.090c: "!!!"
text.0922: "Cette île peut être sauvée ?\nVous allez la sauver\npour nous, hein ?!"
text.09ba: "Bien sûr ! Tu sais où\nse trouve la ville ?"
text.0a1c: "Ohhhhh !\nJ'y serai !"
text.0a84: "Ogremon rejoint la ville !"
text.0ad6: "Oups !\nLa sortie, c'est pas par là !"
text.0b32: "Oh non ! Je dois rendre la\ncaisse à Drimogemon !"
text.0be6: "Oups ! La sortie, c'est\npas par là !"
text.0c42: "Oh non ! Je dois rendre la\ncaisse à Drimogemon !"
