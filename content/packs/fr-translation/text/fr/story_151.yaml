text.0026: "Tout va bien ici.\nBonne chance."
text.0078: "Moi aussi, je dois aider. Je\nferai des allers-retours avec\nla ville dès que je pourrai."
text.0128: "Andromon rejoint la ville !"
text.0176: "Réparation des données finie.\nLisons les données."
text.01e6: "Je t'en prie."
text.0200: "Il y a 100 ans, des\nHumains Analogiques sont\napparus sur l'île Digimon."
text.0286: "Les Humains Analogiques et\nles Digimon natifs se sont\nbattus avec acharnement."
text.02f0: "Après dix ans de combat,\nles Humains Analogiques\nont perdu et ont disparu."
text.038c: "Les dix années suivantes,\nmystérieusement, la surface\nde l'île a presque doublé."
text.0438: "Les humains ont donc combattu\nles Digimon ?"
text.0476: "Désolé. C'est tout ce\nqu'on a pu récupérer."
text.04e6: "Ne t'en fais pas. C'est une\ninformation très importante.\nJ'en sais bien plus, merci."
text.0582: "Vraiment ?"
text.05ae: "Ces humains sont sans doute\nceux qui ont semé le trouble\nsur l'île."
text.065e: "Les humains peuvent\nvivre 100 ans ?"
text.06aa: "On dirait que, pour les\nhumains, le temps est lent\ndans ce monde."
text.071a: "C'est pour ça que je n'ai pas\nà manger ni à dormir ici."
text.078a: "100 ans, c'est très long.\nCes types doivent être\ntrès coriaces."
text.081c: "Tu crois qu'ils se cachent\nquelque part ?"
text.0872: "Je vais les trouver\net agir."
text.08b8: "Je sais pourquoi je suis ici.\nComme je suis humain, je dois\nm'occuper d'eux."
text.095e: "On est vraiment désolés. On\nva fermer l'usine un temps."
text.09d6: "Avec ces troubles, personne\nne sait ce qui va arriver.\nCe n'est pas ta faute."
text.0a8a: "Je crois que quelqu'un\ncontrôle Giromon."
text.0aea: "Les ordinateurs ont été\ndétruits et l'eau usée\ns'est mise à fuir."
text.0b62: "Cette eau a rendu les\nDigimon fous. Je ne crois pas\nà une coïncidence."
text.0bee: "Ces ordinateurs ont une\nimportance capitale."
text.0c46: "Il est peut-être trop tard,\nmais je crois que quelqu'un\nvoulait nous avoir."
text.0cc8: "Quoi ?!"
text.0cdc: "Je crois que ces ordinateurs\navaient des données sur\nle passé de l'île."
text.0d78: "Mais la révolte de Giromon\na détruit les données."
text.0dec: "Tu n'as jamais vu ces infos ?"
text.0e2a: "Non, mais on peut peut-être\nen réparer une partie. Je vais\nessayer de les reconstituer."
text.0eca: "Je vois, merci.\nÇa prendra combien de temps ?"
text.0f22: "Un bon moment. Je rouvre\nl'entrée de la ville,\nalors reviens plus tard."
text.0fb2: "Merci. Je reviendrai."
text.0ff6: "Tu as fini de réparer\nles données ?"
text.1044: "Ça prendra encore du temps.\nReviens plus tard."
text.10a2: "D'accord, je reviendrai."
text.10ea: "Hé, hé !"
text.1104: "Je dois m'excuser."
text.113c: "Plus tard ! Tu dois arrêter\nles machines de l'usine !"
text.11ba: "D'accord, j'y vais."
text.11ee: "L'usine vient de\ns'arrêter."
text.1246: "Bien, je vais voir l'égout.\nÀ plus."
text.12b2: "Je dois m'excuser."
text.12dc: "On n'a pas le temps\nd'en parler !"
text.133e: "Notre ordinateur est parfait."
text.1376: "L'usine est vraiment sûre ?\nQu'est-ce qu'on peut faire ?"
text.13e8: "Bon, il faut s'occuper\ndes gardes. On n'a pas\nd'autre choix !"
text.1482: "Comment es-tu entré en ville ?"
text.14ca: "Si tu n'as rien à faire\nici, va-t'en !"
text.1546: "On en parlera plus tard.\nJe dois aller voir\nl'usine maintenant."
text.15cc: "C'est une question de vie\nou de mort. Donne ton accord !"
text.163e: "Je ne comprends pas bien\nce que tu veux faire.\nJe ne peux pas t'autoriser."
text.16e4: "Des Digimon vont s'éteindre\nà cause de l'eau usée\nde l'usine !"
text.178e: "De l'usine ? Impossible !\nLe système d'épuration\nmarche très bien."
text.182a: "Comment le savoir sans\nvérifier ?!"
text.18a6: "Notre ordinateur est parfait.\nEn cas d'urgence, le Net\nKeeper coupe le système."
text.1952: "Tu veux dire que le Net\nKeeper marchera toujours\ncorrectement ?"
text.19de: "Net Keeper, c'est l'autre\nnom de Giromon, un Digimon\nUltime."
text.1a68: "Son jugement et ses capacités\nsont parfaits."
text.1ac2: "C'est un Digimon ?! Oh non,\nc'est encore pire !\nDonne-moi ton accord !"
text.1b7c: "Va-t'en ! Tout de suite !"
text.1ba2: "Pff... Zut !"
