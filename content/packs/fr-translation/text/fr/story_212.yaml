text.0022: "On dirait que {color:10}{partner}{color:1}\ns'est éteint..."
text.0064: "Avant de s'éteindre, il a\npondu un Digitama. Il\nrenaîtra avec ses capacités."
text.0116: "Quel œuf veux-tu ?"
text.0158: "Tu peux changer le nom\n{color:10}{partner}{color:1} si tu veux."
text.01b0: "Nouveau nom\nGarder son nom"
text.0214: "{color:10}{partner}{color:1}, ça te va ?"
text.0234: "Un autre nom\nD'accord"
text.02a0: "Hé, ne tombe pas malade !"
text.02ce: "Avec le peu de vie qui\nrestait, {color:10}{partner}{color:1} a pu\nsurvivre."
text.0346: "Tu dois faire attention."
text.0384: "Oh là là !\nTe revoilà après une défaite."
text.03d4: "Avec le peu de vie qui\nrestait, {color:10}{partner}{color:1} a pu\nsurvivre."
text.044c: "On t'a peut-être volé tes\naffaires."
text.048e: "Le perdant d'un combat peut\nse faire voler ses affaires."
text.0502: "Les objets volés sont\npeut-être vendus ailleurs.\nNe renonce pas !"
text.059e: "Oh non ! {color:10}{partner}{color:1}\nn'a plus de vie."
text.05de: "Avant de s'éteindre,\n{color:10}{partner}{color:1} a pondu\nun Digitama."
text.0646: "À cause du danger, le\nDigitama n'a pas hérité\nde toutes les capacités..."
text.06d8: "{color:4}Ton niveau de dresseur\na baissé ! {color:1}"
text.0726: "Si tu veux,\ntu peux changer le nom\n{color:10}{partner}{color:1}."
text.0780: "Nouveau nom\nGarder son nom"
text.0872: "{color:10}{partner}{color:1} a digivolué !"
text.08be: "{color:10}{partner}{color:1} a digivolué !"
text.090a: "{color:10}{partner}{color:1} a digivolué !"
text.095c: "{color:10}{partner}{color:1} a digivolué !"
