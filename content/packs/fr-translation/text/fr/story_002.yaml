text.0060: "Je vais gagner !"
text.0098: "Allez, viens, mon grand !"
text.00d4: "Qu'est-ce qui va se passer ?"
text.0122: "Ça ne marchera jamais."
text.0168: "J'ai faim."
text.0186: "Donner à manger\nNe rien donner"
text.01de: "Je n'ai rien à manger."
text.0266: "Oups, je ne peux pas te\ndonner ça."
text.02b8: "C'est bon..."
text.02de: "Battons-nous !"
text.032e: "Ça va mal.\nQu'est-ce que je fais ?"
text.0380: "Viens en ville travailler\npour rembourser ton repas !"
text.03e6: "D'accord, je viens. Je suis\nun Digimon insecte nommé\nKunemon. Enchanté."
text.04c0: "Kunemon rejoint la ville !"
text.0508: "Apporte-en la prochaine fois."
