text.00a6: "Tu as apporté de quoi\nsoigner la blessure ?"
text.0104: "Une seconde. Voyons..."
text.014c: "J'ai mal à l'aile !"
text.0170: "Que s'est-il passé ?"
text.0194: "Je me suis blessé à l'aile.\nTu as de quoi me soigner ?"
text.020a: "Ça a l'air grave. Attends.\nQu'est-ce que je fais ?"
text.027c: "Je n'ai rien sur moi."
text.02f8: "Raté. Ça ne va pas !"
text.0346: "C'est bien mieux. Merci."
text.0386: "Tu peux déjà voler ?"
text.03b6: "Je ne crois pas pouvoir\nvoler loin."
text.03f6: "Il y a une clinique en ville.\nTu devrais y aller.\nCe n'est pas loin d'ici."
text.048a: "J'ai entendu parler de la\nville. Elle est plus grande\nque je pensais."
text.04f8: "Va en ville te reposer."
text.0534: "Merci. Je pourrai peut-être\nt'aider un jour."
text.05c2: "Unimon rejoint la ville !"
text.0602: "Je vais chercher de quoi\nsoigner ta blessure. Attends."
text.0678: "Merci. Fais vite !"
