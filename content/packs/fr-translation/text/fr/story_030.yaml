text.0060: "Mince ! On est tombés sur\nun gros rocher !"
text.0098: "Je ne peux pas le percer."
text.00c6: "Tu ne peux pas ? Oh non !"
text.00f0: "Il faut trouver comment le\nbouger. Tu peux le faire ?"
text.0164: "Je ne sais pas."
text.0192: "{color:10}{partner}{color:1},\nj'ai besoin de toi."
text.034e: "On a réussi !"
text.036a: "Ouah, quelle force !\nOn a bougé le rocher !"
text.03be: "Je crois que c'est vide\naprès cet endroit."
text.041e: "Une rivière de lave !\nC'est dangereux !"
text.0468: "Il y a un chemin le long\nde la rivière. Allons-y !"
text.04c2: "Tu entres ?\nFais attention !"
text.0516: "Tu entres ?\nFais attention !"
text.0576: "Reviens quand {color:10}{partner}\n{color:1}aura grandi."
