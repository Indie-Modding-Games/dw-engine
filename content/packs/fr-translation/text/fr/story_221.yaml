text.001e: "{color:6}{tamer}{color:1}, tu as réussi !"
text.0044: "Agumon est venu en ville.\nIl a lancé un commerce\nlà-bas."
text.00be: "J'espère que d'autres\nDigimon feront pareil !"
text.012c: "Palmon est venu, il veut\nagrandir le champ de viande."
text.019c: "On aura plein de viande !"
text.01f4: "Kunemon est venu, il veut\nmanger de l'herbe."
text.024e: "J'espère qu'il mangera\nles mauvaises herbes !"
text.02a2: "Centarumon est venu, il\ncompte ouvrir une clinique."
text.0310: "Fini de s'inquiéter des\nmaladies et blessures !"
text.0386: "Coelamon est venu, il veut\nouvrir une boutique."
text.03ec: "La ville va prospérer !"
text.0438: "Betamon est venu, il voudrait\nouvrir une boutique."
text.04a8: "La ville va prospérer !"
text.04f4: "Bakemon est venu et a dit\nun truc incompréhensible."
text.056c: "Bon, ce n'est pas grave."
text.05b6: "Vegiemon est venu. Il veut\nencore agrandir le champ."
text.0632: "Plus de soucis de nourriture."
text.0686: "Tyrannomon est venu dire\nque sa cuisine est top."
text.06f8: "Bah, elle a son charme."
text.0746: "Meramon est venu dire qu'il\nest le chef des flammes."
text.07c0: "Il brûle de motivation !"
text.0816: "Frigimon est venu parler\nde goûters."
text.0882: "J'adore les goûters."
text.08bc: "Garurumon est venu dire\nqu'il sait cuisiner."
text.091e: "Il est plutôt doué."
text.0964: "Birdramon est venu dire\nqu'il serait messager."
text.09c4: "Ça me plaît."
text.09fa: "Shellmon est venue dire\nqu'elle ferait des panneaux."
text.0a70: "Un pas vers une société\nde l'information !"
text.0ada: "Elecmon est venu, il va\nmettre l'électricité."
text.0b46: "J'espère que la ville sera\nbien éclairée."
text.0b9c: "Kokatorimon est venu parler\nde faire une statue."
text.0c10: "Un endroit pour se détendre."
text.0c66: "Monochromon est venu parler\nde devenir gérant de la\nboutique d'objets.{stop}"
text.0d08: "C'est un pro."
text.0d4e: "Unimon est venu dire qu'il\nvoulait être utile au commerce."
text.0dc4: "Belle attitude."
text.0e12: "Patamon est venu chercher\nun travail intéressant."
text.0e78: "Je lui ai conseillé\nla boutique d'objets."
text.0ec8: "Biyomon est venu me demander\nquel travail je conseille."
text.0f3c: "Je lui ai conseillé\nla boutique d'objets."
text.0f8c: "Greymon est venu parler\nde construire une arène."
text.0ff2: "Je veux vraiment\nvoir ça."
text.104c: "Penguinmon est venu\nparler de construire\nun stade de curling."
text.10ca: "On a de plus en plus de choix."
text.1120: "Angemon est venu parler\nd'enregistrer\nles conversations."
text.1194: "Il n'est pas loin."
text.11ce: "Drimogemon est venu parler\nde faire de la chasse au\ntrésor son métier."
text.1270: "Un gros travail !"
text.12a2: "Gabumon est venu, il\ns'inquiétait de ce qu'il\npourrait faire."
text.1334: "Je lui ai dit de choisir\nun grand projet."
text.13a0: "Ninjamon est venu parler\nd'entraînement."
text.1400: "Ça fait plaisir, des bosseurs."
text.145a: "Whamon est venu parler\nde remplacer\nle bac."
text.14e0: "Super !"
text.150a: "Mojyamon est venu parler\nd'ouvrir\nun bazar."
text.1586: "Mais il y a quelque chose\nde différent."
text.15f4: "Mamemon est venu parler de\nvendre des objets précieux."
text.166a: "Que veut dire\n« précieux » ?"
text.16c8: "Numemon est venu parler\nd'ouvrir une boutique,\nmais c'est un secret."
text.1752: "Ce n'est plus un secret."
text.17a0: "Kabuterimon est venu parler\nd'entraînement et de travaux."
text.181e: "Il est allé au Gymnase Vert ?"
text.1872: "Kuwagamon est venu demander\noù est Kabuterimon."
text.18d8: "Où est-il allé ?"
text.1916: "Giromon est venu dire\nde faire une demande !"
text.1976: "Alors, fais une demande."
text.19b8: "Ogremon est venu me\ndemander d'acheter son bras."
text.1a1c: "Il avait les yeux furieux !"
text.1a66: "Leomon est venu poser plein\nde questions sur la ville."
text.1acc: "On dirait que la patrouille\nde la savane continue !"
text.1b40: "Piximon est venu me dire :\n« Monsieur, tu veux un\nobjet secret ? »"
text.1bca: "Il m'inquiète."
text.1c04: "Etemon est venu parler\nd'ouvrir une boutique cool."
text.1c70: "Ça m'a l'air louche."
text.1cb2: "MetalMamemon est venu\ndemander s'il y avait un\ntravail pour rivaliser\navec {color:6}{tamer}{color:1}."
text.1d4e: "Il a l'esprit de compétition."
text.1da4: "Vademon est venu, et...\nattends, il est venu ?"
text.1dfc: "Je ne m'en souviens plus."
text.1e4c: "MetalGreymon est venu\nparler de mannequinat."
text.1eb2: "Il se prend pour un grand !"
text.1efc: "Nanimon est venu et reparti."
text.1f38: "Où peut-il bien être ?"
text.1f80: "Monzaemon est venu, ou plutôt\nsa carapace est apparue\nd'un coup."
text.2012: "Il a décidé de la laisser\nchez lui."
text.206e: "Devimon est venu parler\nd'un objet fantastique."
text.20e4: "Il doit être fantastique."
text.2130: "Airdramon est guéri, et il\na parlé de travailler."
text.219a: "Content qu'il aille mieux."
text.21f4: "Digitamamon est venu et\nreparti à la vitesse\nde la lumière."
text.2264: "Il est encore quelque part\nen ville."
text.22c4: "SkullGreymon est venu dire\nqu'il combattrait\nà l'arène."
text.233e: "Myotismon a fait l'interprète."
text.2396: "Andromon est venu dire\nqu'il était ravi de nous voir."
text.23fa: "Il ne peut pas rester\ntrès longtemps."
