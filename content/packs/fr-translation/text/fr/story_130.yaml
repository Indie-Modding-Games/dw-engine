text.0036: "Je vais t'avoir !"
text.0070: "Ah, vraiment !"
text.00ce: "Qui es-tu ?"
text.00ee: "Je suis venu t'aider\nPas encore prêt..."
text.0158: "Il y a quelqu'un ?"
text.018c: "Tu ne vois pas ?"
text.01b4: "Je suis Whamon. D'habitude,\nje vis dans la mer."
text.0206: "Je n'ai pas d'yeux, mais\nje sens presque tout."
text.026c: "Je suis humain. Je m'appelle\n{color:6}{tamer}{color:1}."
text.02a6: "Voici {color:10}{partner}{color:1},\nmon partenaire, un {digimon:pstat=103}."
text.02f6: "Je sens une grande puissance."
text.0330: "Tu veux écouter mon histoire ?\nIl y a une grotte près\nde la plage où je me repose."
text.03c8: "Mais des brutes m'ont chassé,\net j'y ai perdu mon\nprécieux trésor."
text.046a: "Des brutes, hein ?\nÇa ne sent pas bon."
text.04bc: "Chasse-les, s'il te plaît.\nAide-moi à reprendre\nla grotte."
text.0540: "Je vais t'aider\nPas maintenant"
text.0592: "Je vois."
text.05ae: "Alors, monte sur mon dos."
text.06c0: "Allons-y."
