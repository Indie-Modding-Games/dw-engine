text.0020: "Je te gêne ?"
text.0056: "Tu m'as sauvé !"
text.0078: "C'était donc toi."
text.009c: "Ça tombe parfaitement."
text.00cc: "Quoi ?"
text.00e2: "J'allais vers ta ville\npour mettre mon talent\nà profit !"
text.0160: "Quel genre de talent ?"
text.0190: "Oh, tu ne me connais pas ?\nChez les Digimon, je suis\nconnue pour tout savoir !"
text.0224: "Vraiment ?\nJe n'ai jamais entendu parler\nde toi."
text.026c: "Je suis prête pour la ville."
text.02b4: "Elle va vraiment\nservir à quelque chose ?"
text.0302: "À plus !"
text.0350: "Shellmon rejoint la ville !"
