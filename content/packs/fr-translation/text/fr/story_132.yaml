text.0028: "Où sommes-nous ?\nC'est un rêve ?"
text.008c: "Ouah ! Qui es-tu ?\nOù est {color:10}{partner}{color:1} ?"
text.00e2: "Calme-toi. Je m'appelle\nFrigimon. C'est ma maison.\nJe suis un Digimon des neiges."
text.017c: "Tu étais évanoui dans la\nneige. Je t'ai ramassé\net soigné."
text.0218: "Oh, {color:10}{partner}{color:1}.\nOuf, tu vas bien !"
text.025c: "Hé, tu m'écoutes ?\nSans moi, tu serais\ndéjà mort !"
text.02f6: "Oh, pardon. Merci beaucoup."
text.033e: "Hé, {color:10}{partner}{color:1},\nje me suis cogné la tête\nquand tu es tombé d'un coup."
text.03be: "{digimon:pstat=103}ne supporte pas le\nfroid. Quelle imprudence.\nTout est de ta faute."
text.0452: "Je ne savais pas.\nPardon, {color:10}{partner}{color:1}."
text.049e: "Merci, Frigimon. Je peux te\ndemander encore un service ?"
text.0504: "Et si {digimon:pstat=103}tombe\nencore ? Tu ferais mieux\nde vite rentrer !"
text.058e: "D'accord, compris.\nJe ferai digivoluer\n{color:10}{partner}{color:1} en un autre Digimon."
text.062c: "Digivoluer ?"
text.06c8: "Re-bonjour."
text.06e8: "Qu'est devenu\nl'autre Digimon ?"
text.0732: "Oh, c'est le même."
text.076a: "Hein ? Vraiment ?\nJe ne comprends pas."
text.07bc: "Je suis venu te demander\nun service. Je veux que\ntu viennes en ville."
text.0850: "Qu'est-ce que j'y gagne ?\nUn truc intéressant ?"
text.08b6: "Eh bien, tu peux ouvrir\nla boutique que tu veux."
text.0914: "Ouah, j'en ai toujours rêvé.\nD'accord, j'y vais !"
text.0980: "Très bien.\nAlors, allons-y."
text.09d8: "Une boutique ! Granités et\nglaces. Ça va être\ngénial !"
text.0a94: "Frigimon rejoint la ville !"
text.0ad6: "Ce Digimon ne supporte pas\nbien le froid !"
text.0b36: "Je reviendrai !"
