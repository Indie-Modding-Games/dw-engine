text.03b8: "Bienvenue dans ma boutique."
text.03e4: "Regarde, {color:6}{tamer}{color:1}. C'est\nma boutique. Je vais vendre\ntoutes sortes d'objets."
text.046c: "J'aurai bientôt plus de choix.\nMais il me faut des Digimon\npour m'aider."
text.052c: "Je vais acheter et vendre\ndes objets. Viens me voir\nquand tu as besoin."
text.05c6: "On n'a pas beaucoup de choix,\nmais avec un assistant,\nje ferai peut-être mieux."
text.069c: "J'ai décidé d'ouvrir\nune boutique d'objets.\nJ'espère te voir souvent."
text.0726: "Le stock est encore maigre,\nmais on veut s'agrandir.\nPatiente un peu."
text.080a: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nj'ai ouvert ma boutique.\nJe crois que ça va marcher !"
text.087c: "Avec plus de Digimon en\nville, on aura plus de choix."
text.0920: "{color:6}{tamer}{color:1}, je viens d'aider\nà tenir cette boutique.\nAchète plein de choses !"
text.09ea: "Bienvenue. Dès aujourd'hui,\nje travaille ici.\nReviens souvent."
text.0ab4: "J'ai décidé d'aider à\ntenir cette boutique.\nPasse quand tu veux."
text.0b68: "Oh, {color:6}{tamer}{color:1}. C'est\nl'endroit parfait pour moi.\nJe vais bien travailler."
text.0e56: "Salut, je suis toujours\ndébordé par la boutique...\nMais non !"
text.0ec2: "Je suis un peu flemmard, je\nne serai pas souvent là.\nMais j'ai des trucs géniaux."
text.0f5e: "Oui ! Le « Manuel entr. » !\nAvec ça, ton entraînement\nsera meilleur !"
text.0fe6: "Il est très précieux. Je le\nvends 50 000 Bits.\nTu regretteras de le rater."
text.1094: "Acheter\nNe pas acheter"
text.10d6: "Tu n'as pas assez de Bits."
text.1126: "Hmmm, tu portes beaucoup\nde choses."
text.1186: "J'ai eu un\n{color:6}Manuel entr.{color:1} !"
text.11c2: "Pas de réduction."
text.123a: "Tu as des ennuis parce\nque tu portes\ntrop de choses ?"
text.12b2: "Il y a un endroit où trouver\nun porte-clés qui relie ton\nsac à une autre dimension."
text.135a: "Il augmente le nombre\nd'objets que tu peux porter."
text.13be: "Même si tu es déjà allé\nquelque part, regarde encore."
text.1432: "Je vais te dire le secret\npour acheter des objets."
text.1488: "Appuie sur Start sur\nl'objet dont tu veux\ndes infos !"
text.1514: "Choisis l'objet avec {color:6}△{color:1},\net appuie sur {color:4}□{color:1} pour\nen acheter beaucoup."
text.159e: "Pour monter ou baisser de dix,\nutilise haut ou bas\nen tenant {color:10}○{color:1}."
text.1636: "Oh, juste après une\ndigivolution, achète un truc.\nIl se passera un truc bien !"
