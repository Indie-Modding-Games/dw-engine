text.0064: "C'est le dernier."
text.00a2: "Enfin, on y est !"
text.00e0: "La voie est libre !"
text.0118: "Faisons simple."
text.0154: "C'est la dernière chance !"
text.019a: "Tu y vas vraiment ?"
text.01f0: "Ça fait peur ! Je le sens\njusque dans mes os."
text.023a: "..."
text.0248: "Pourquoi il ne m'attaque pas ?"
text.0282: "..."
text.0290: "Tu n'as pas à te battre ?"
text.02c8: "Dépêchons-nous d'y aller.\nOn doit tester nos talents."
text.0348: "Allons-y, {color:10}{partner}{color:1} !"
text.039c: "..."
text.03de: "On a gagné ?"
