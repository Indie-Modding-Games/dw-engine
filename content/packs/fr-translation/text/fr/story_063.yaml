text.0042: "Myotismon n'est pas là."
text.00b2: "Euh... ma clé du frigo\nà viande ?"
text.00f4: " ! "
text.0102: "Quelqu'un vient m'aider ?"
text.013a: "Un Digimon ? Ça va ?"
text.016a: "Qui es-tu ? Donne-moi à\nmanger !"
text.01a6: "Tu as faim ? Que veux-tu ?"
text.01e0: "De la viande."
text.020c: "J'ai de la viande !"
text.022a: "Viande."
text.023c: "Quoi ?"
text.0252: "De la viande ? J'en ai pas."
text.028e: "Tiens."
text.02a4: "Une clé ?"
text.02c4: "Je dois me débarrasser\nde quelque chose."
text.0312: "J'ai eu la {color:6}Clé frigo{color:1} !"
text.0342: "Bon..."
text.0358: "Le temps presse !"
text.038c: "Je t'apporte quelque chose.\nTiens bon encore un peu."
text.03fc: "Ouf !"
text.041e: "Je suis sauvé. Merci mille\nfois. Désolé du dérangement."
text.0488: "Qu'est-ce qui s'est passé ?"
text.04ac: "Je suis Myotismon, maître\nde ce manoir."
text.0500: "Je suis {color:6}{tamer}{color:1}, un humain\nd'un autre monde. Voici\nmon partenaire, {color:10}{partner}{color:1}."
text.0580: "On est là pour\nsauver l'île."
text.05c4: "On dirait qu'on a beaucoup\nà se dire. Bienvenue."
text.0678: "Ouah !"
text.0688: "..."
text.0696: "Tu es sérieux ?"
text.06c6: "Il a disparu. Je rêve ?"
text.0746: "Je crois qu'on s'en est\noccupés."
text.078e: "Quoi ?"
text.07a6: "Hein ? Quoi ?"
text.07ca: "Je me suis évanoui. Pardon."
text.084e: "La malédiction d'Analogman !\nT'en fais pas, ça ira."
