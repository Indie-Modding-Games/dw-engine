text.0034: "Hé, tu veux faire un match\ncontre moi ? Si tu gagnes,\nje ferai ce que tu veux."
text.00da: "Quel genre de match ?"
text.0108: "Ce que j'appelle...\nle Curling Digimon !\nJe t'explique dedans."
text.0186: "Hmm, et si je perds ?"
text.01c6: "Rien, la première fois.\nMais ensuite, tu devras\nd'abord me donner un poisson."
text.025c: "Alors, si je gagne, tu viens\nen ville avec moi. D'accord ?{stop}\nAlors, allons-y."
text.02f4: "D'accord, ça marche.\nEntrons."
text.0384: "Hé, tu veux faire un match\ncontre moi ? Donne-moi un\npoisson et on joue."
text.0426: "Je vais t'avoir\nNon merci"
text.0474: "Salut, frérot ! J'ai fait\nune patinoire ici."
text.04c2: "Un poisson par match.\nMais si tu gagnes, je te\ndonne un joli prix."
text.0554: "Hé, mec, tu ne veux pas\nfaire un match ? Tu peux\nme défier avec un poisson."
text.0606: "Je relève le défi\nNon merci"
text.0642: "Zut, pas drôle."
text.0676: "Donne-moi un poisson !"
text.06ae: "Je n'ai rien sur moi..."
text.0738: "Oh non, te donner ça\nne sert à rien."
text.079a: "Ouah, ça a l'air bon. Oups,\nil faut d'abord jouer\nle match. Entrons."
text.0842: "Allez, mec.\nVa donc pêcher au\nLac Œil de Dragon."
text.08d6: "Désolé, frérot. Reviens me\ndéfier. Et n'oublie pas\nd'apporter un autre poisson."
text.0992: "Bravo ! Score parfait !\nTu serais par hasard...\nun pro ?"
text.0a34: "{color:7}Bravo !\nVoici une médaille pour\nce super match ! {color:1}"
text.0ab8: "Incroyable, mec. Je perds un\nmatch pour la première fois."
text.0b20: "Bon, viens en ville avec\nmoi, comme promis."
text.0b94: "Bon, il le faut bien.\nMais j'ai déjà décidé ce\nque je ferai en ville."
text.0c7a: "Penguinmon rejoint la ville !"
text.0cd2: "Désolé, frérot. Reviens me\ndéfier. Et n'oublie pas\nd'apporter un poisson."
text.0d82: "Bravo ! Score parfait !\nTu serais par hasard...\nun pro ?"
text.0e24: "{color:7}Bravo !\nVoici une médaille pour\nce super match ! {color:1}"
text.0ea8: "Ouah, tu es incroyable.\nJ'ai encore perdu."
text.0f00: "Bon, que dire.\nVoici ton prix."
text.0ff8: "Tu as trop d'objets !"
text.103c: "J'ai eu : {color:6}{item:pstat=110}{color:1}!"
text.106a: "Hé, {color:6}{tamer}{color:1}. Je garde\nla boutique pour rendre\nservice à Penguinmon."
text.10ea: "Fais un match avec moi !\nSi tu gagnes, je te donne\nmon prix spécial. Ça te va ?"
text.118c: "D'accord, allons-y\nNon merci"
text.11da: "Donne-moi le poisson\navant le match."
text.123e: "Oh, je n'ai\nrien sur moi."
text.12da: "Te donner ça\nne sert à rien."
text.1330: "Cette fois, c'est moi\nqui gagne. Entrons."
text.13a2: "Pas de match sans\npoisson. Reviens\nune autre fois."
text.1436: "Quoi ? Tu\nrefuses ?"
text.1488: "Si tu veux me battre,\nsers-toi de ta tête !\nÀ un de ces jours."
text.1546: "Un score parfait contre\nmoi !! Tu es un génie\ndu curling ?!"
text.15e0: "{color:7}Bravo !\nVoici une médaille pour\nce super match ! {color:1}"
text.1664: "Tu es fort, {color:6}{tamer}{color:1} !\nVoici le prix\npromis !"
text.17a2: "Tu as trop d'objets."
text.17e6: "J'ai eu : {color:6}{item:pstat=110}{color:1}!"
