text.002e: "!"
text.005e: "Tu es {color:6}{tamer}{color:1} ?"
text.007e: "Un Digimon squelette ?!"
text.00ac: "Tu es {color:10}{partner}{color:1} ?"
text.00cc: "Je ne sens pas de vie en\nlui, mais du mal."
text.0126: "Il a fait quelque chose\nà Myotismon ?!"
text.0188: "Si tu ne me dis rien...\nje t'attaque !"
text.0208: "Je t'attaque !"
text.0242: "Je dois vite sauver\nMyotismon !"
