text.008e: "Hmm"
text.00b4: "On dirait un nid d'oiseau.\nQu'en penses-tu ?"
text.012e: "J'entends du bruit."
text.01bc: "Tu es fort."
text.01dc: "C'était donc ton nid."
text.020c: "Oui."
text.0222: "Pardon d'être entré\nsans demander."
text.026a: "Oh, ne t'en fais pas."
text.02a4: "?"
text.02ae: "J'ai entendu parler de toi."
text.02da: "Je ne savais pas être connu."
text.0318: "Tu es sans doute le dernier\nhumain de l'île."
text.0388: "Le dernier... ? Il y en a\neu d'autres avant moi ?"
text.03e0: "Tu ne vas pas m'inviter\nen ville ?"
text.0440: "Ah oui, tu ne viendrais pas\nen ville ?"
text.0492: "D'accord. Alors, au travail.\nAccroche-toi bien."
text.0534: "Birdramon rejoint la ville !"
text.066a: "Ascenseur"
text.0682: "Bas une fois\nBas deux fois\nNe pas monter"
text.074e: "Hein ?"
text.075c: "Raté. Ça ne marche pas."
