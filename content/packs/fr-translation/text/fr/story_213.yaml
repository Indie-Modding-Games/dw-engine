text.0040: "Oh, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nvous êtes venus. Regardez la\nsuper Arène de Cité File !"
text.00d0: "Bientôt, participants et fans\nla rempliront. Tu feras\nla joie des fans, hein ?!"
text.0188: "Il y aura de l'argent et des\nprix pour les vainqueurs.\nTu n'as rien à perdre."
text.0230: "Pour les détails du tournoi,\nregarde la machine là-bas."
text.02d0: "Au fait, les Digimon Apprentis\nne peuvent pas participer.\nJe regarde le calendrier ?"
text.038c: "Au fait, les Digimon Apprentis\nne peuvent pas participer.\nJe regarde le calendrier ?"
text.043c: "Content que tu sois venu. Tu\nveux participer au tournoi ?"
text.04b6: "Oui\nNon\nComment ça ?"
text.0520: "Tu participes donc au\ntournoi de demain,\nc'est ça ?"
text.058a: "Tu veux annuler\nton inscription ?"
text.05d8: "Non, je n'annule pas\nOui, j'annule"
text.0652: "Tu participes donc au\ntournoi d'aujourd'hui ?\nTu peux entrer dès 10 h."
text.06e8: "Tu ne comptes pas annuler,\nhein ?!"
text.0740: "Non, je n'annule pas\nOui, j'annule"
text.07aa: "Tu participes donc au\ntournoi d'aujourd'hui ?\nEntre avant 23 h."
text.0832: "Tu ne comptes pas\nannuler, hein ?!"
text.088a: "Non, je n'annule pas\nOui, j'annule"
text.08f6: "Bon, j'annule pour toi."
text.0934: "Une fois dedans, à l'heure,\ndescends l'escalier de gauche\npour combattre."
text.09de: "L'inscription est gratuite.\nSeulement pour les tournois\nd'aujourd'hui et de demain."
text.0a8c: "Mais pour le tournoi du jour,\nil faut s'inscrire\navant 10 h."
text.0b1a: "Tu peux voir le calendrier\ncinq jours à l'avance,\nalors organise-toi."
text.0bb8: "Les tournois en rouge sont\nceux où tu ne peux pas aller."
text.0c32: "Mais appuie sur Start pour\nvoir de quoi il s'agit."
text.0ca0: "Même pour les tournois\naux Conditions : aucune,"
text.0d06: "les Digimon Apprentis\nne peuvent pas participer."
text.0d52: "Voilà pour l'inscription.\nTu veux participer ?"
text.0dd4: "Oui\nNon\nRéexplique, pardon"
text.0e3c: "Hé ! Tu n'es pas\ninscrit, tu sais !"
text.0eba: "Hé ! Le tournoi, c'est\ndemain, tu sais !"
text.0f42: "C'est encore tôt pour entrer.\nOn attend 10 h."
text.0ff4: " \n{color:4}Niveau de dresseur en baisse !{color:1}"
