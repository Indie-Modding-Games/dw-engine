text.005a: "Ce costume semble différent\ndes autres. Il a une\nprésence écrasante."
text.0130: "Il y a une fermeture éclair\ndans le dos."
text.018e: "Que se passe-t-il,\n{color:10}{partner}{color:1} ?!"
text.01d4: "Quoi ? Tu t'es changé en\nun autre Digimon ?\nC'est plutôt chouette."
text.0250: " {color:10}{partner}{color:1},\ntu veux entrer dedans ?"
text.02ae: "Non, tu ne peux pas,\n{color:10}{partner}{color:1}. Il faut être\nsouple et glissant pour ça."
