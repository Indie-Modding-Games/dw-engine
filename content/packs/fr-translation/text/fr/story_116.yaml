text.0062: "Ouah !"
text.0080: "Mmmm."
text.00a0: "Euh, on arrête là."
text.00e6: "On ne peut pas encore\nbaisser la garde."
text.013c: "... !"
text.0180: "Non, je ne veux pas !\nJe ne veux pas me battre !"
text.01de: "Si tu ne veux pas te\nbattre, alors fuis."
text.023a: "Dommage."
text.0268: "Je ne te comprends pas."
text.029c: "Bon, et si tu venais dans\nnotre ville ? C'est mieux\nque de te cacher ici."
text.032e: "Euh, la ville ?"
text.0350: "On ne va pas te\nforcer."
text.0394: "Ça me donne envie d'y aller.\nD'accord, j'y vais !"
text.0426: "Gabumon rejoint la ville !"
text.0464: "Quel drôle de type."
