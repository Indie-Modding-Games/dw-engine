text.0058: "Jouer de la {color:6}Flûte bleue{color:1}\ndu Gardien du Lac ?"
text.00be: "Jouer\nNe pas jouer"
text.010a: "Rapport, rapport !"
text.014a: "Ennemi en vue !"
text.0178: "Hii-haa !"
text.019e: "Ce n'est pas un bon jour."
text.01e2: " ??? "
text.0202: "Tu ne trouves pas ça injuste ?"
text.0250: "Arrêtez-les !"
text.027a: "Quel boulot !"
