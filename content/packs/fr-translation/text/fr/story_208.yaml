text.002e: "Journal Coquille n° 8\nUn Digimon extraterrestre :\nOn a trouvé l'OVNI.\nLa créature s'est montrée\net a dit des mots inconnus.\nEst-ce un extraterrestre ?\nReviendra-t-il ?"
text.018a: "Retour\nFermer"
text.01bc: "Journal Coquille n° 7\nMyotismon dément sa\nretraite :\nEn interview,\nil a démenti les rumeurs.\nIl travaille toujours dur.\nIl adore ses fans.\nIl a aussi annoncé que\nson élève, SkullGreymon,\nfera ses débuts."
text.0368: "Retour\nSuivant\nFermer"
text.03d0: "Journal Coquille n° 6\nMyotismon à la retraite ? :\nOn dit que le populaire et\ndoué Myotismon va arrêter.\nPersonne à l'arène ne l'a\nvu. Sa carrière touche à\nsa fin. Il est trop vieux."
text.0544: "Retour\nSuivant\nFermer"
text.05b4: "Journal Coquille n° 5\nTrésor caché :\nUne boutique géniale dans la\nSavane Engrenage. Elle n'ouvre\nque du 1er au 15 chaque année.\nLe gérant est fier de\nses objets rares."
text.0710: "Retour\nSuivant\nFermer"
text.0794: "Journal Coquille n° 4\nUn Digimon légendaire ? :\nOn dit qu'un Digimon des\ngrands froids vit en\nTerre Gelée. M. M a été\nsauvé par ce monstre. On\naurait dit une boule de neige.\nDigimon frileux,\nfaites attention !"
text.094e: "Retour\nSuivant\nFermer"
text.09aa: "Journal Coquille n° 3\nUn gardien pour le lac ? :\nLe Gardien du Lac est au\nLac Œil de Dragon.\nCette créature digimonesque\na été appelée par quelqu'un.\nCe gardien peut-il exaucer\nles vœux ?"
text.0b10: "Retour\nSuivant\nFermer"
text.0b80: "Journal Coquille n° 2\nUn OVNI ! :\nUn rapport situe l'OVNI\nprès du Mont Panorama.\nL'OVNI ressemble à une\nassiette argentée avec une\nlumière en dessous.\nUn extraterrestre ?\nPlus d'infos à venir."
text.0cf8: "Retour\nSuivant\nFermer"
text.0d48: "Journal Coquille n° 1\nLes brigands, c'est fini ! :\n{color:6}{tamer}{color:1} a trouvé la\nplanque d'Ogremon.\nMais Ogremon est\ntoujours en liberté et\nl'inquiétude demeure."
text.0e70: "Suivant\nFermer"
