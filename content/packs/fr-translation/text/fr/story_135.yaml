text.004c: " {color:6}{tamer}{color:1} et {color:10}{partner}{color:1},\nc'est ça ? Merci d'être\nvenus à Villa Volume !"
text.00ca: "Pardon pour ce qu'on\na fait à Otamamon."
text.0122: "Ce n'est rien."
text.0148: "Hein ?"
text.0168: "Je te suis reconnaissant.\nIl paraît que tu travailles\ndur pour sauver l'île."
text.0200: "Ah bon ?"
text.0218: "Je voulais t'aider. Tu es\nallé au Bois Brumeux,\njuste au nord d'ici ?"
text.02ca: "Pas encore."
text.02ee: "Oui."
text.02fe: "Il y a toujours du brouillard.\nTu auras sans doute du mal\nà t'y repérer."
text.0390: "Mais tu devrais rencontrer\nCherrymon, le chef\nde la forêt."
text.041e: "Cherrymon ? Jamais entendu\nparler de ce Digimon."
text.0482: "Cherrymon crée le brouillard\ndu Bois Brumeux."
text.04d6: "Il a créé ce brouillard pour\nprotéger la forêt du danger."
text.0548: "Mais pour nous, c'est gênant."
text.0594: "Je crois que Cherrymon sait\nquelque chose sur la cause\ndes malheurs de l'île."
text.062e: "Ça vaut le coup de traverser\nle brouillard pour le voir."
text.0688: "Si seulement on pouvait\nrégler ce brouillard."
text.06da: "Seul Cherrymon peut chasser\nle brouillard."
text.074a: "Mais il y a un moyen de\npasser. Je vais te jeter\nun sort."
text.07be: "Qu'est-ce qui va se passer ?"
text.07ee: "Tu verras la route, même\ndans le brouillard."
text.0860: "Oh, super !"
text.0888: "Bien, je commence."
text.08b8: "Croâ, croâ !"
text.08f6: "Bien. C'est parfait.\nMaintenant, va au Bois\nBrumeux."
text.0974: "Je l'ai vu.\nLe brouillard a disparu."
text.09ba: "Ouah, incroyable ! Alors,\ncomment puis-je t'aider ?"
text.0a2a: "Bien, je te donne ceci."
text.0a6c: "J'ai eu un\n{color:6}Digibar{color:1} !"
text.0abc: "Jette autre chose."
text.0b04: "C'est très rare.\nÇa te sera utile."
text.0b72: "Merci. Et si tu venais\nen ville, Shogun ?"
text.0bde: "Je suis le chef de 100\nGekomon au Marais Geko.\nDésolé, je ne peux pas venir."
text.0c84: "Mais je ferai tout ce que\nje peux d'ici.\nViens quand tu veux."
text.0d58: "On dirait que tu as un souci.\nLe costume, c'est ça ?"
text.0dce: "Tu es au courant ?"
text.0dfa: "Ne me sous-estime pas.\nNumemon pourra le porter."
text.0e68: "Surpris ? Et ce n'est pas\ntout : une fois porté... Tu\nne croiras pas... Essaie."
text.0f4e: "Au fait, je retire la\n{color:6}Super canne {color:1}de\ntes objets."
text.0fe0: "C'est un objet spécial."
text.1022: "Bonne chance !"
text.1052: "Tu ne peux pêcher qu'au\nLac Œil de Dragon."
text.10a6: "Recule, recule !"
text.10da: "Shogun collectionne les\nobjets rares. Avant,\nil collectionnait les objets."
text.1154: "Mais maintenant, il est\nfou des cartes Digimon."
text.11aa: "Si tu lui apportes une carte\nrare, il te donnera\ndes points de mérite."
text.1222: "Tu peux réunir des cartes,\ndes points de mérite et les\néchanger contre des objets.{stop}{stop}"
text.12bc: "Bon... non, rien. Croâ."
text.12fe: "Pardon... Je veux aller en\nville. Croâ !"
text.1362: "D'accord, mais pourquoi ?"
text.1396: "Je veux me battre à l'Arène.\nOn dirait que nous,\nla tribu Gekomon,{stop}"
text.142e: "on est méprisés, pris pour\ndes campagnards. Croâ."
text.1494: "Oui, on vient de la campagne,\nmais on a notre fierté !{stop}"
text.1522: "Je comprends.\nAlors, essaie. Bonne chance !"
text.1582: "Gekomon rejoint l'Arène !"
