text.0090: "Il y a des lettres\ngravées ici."
text.00dc: "Personne ! Rentre chez toi !"
text.011e: "Quelqu'un vit ici ?"
text.0176: "{color:7}? ? ? {color:1}\nMême un singe peut tomber\nde son arbre."
text.01c8: "{color:7}? ? ? {color:1}\nCoup de genou volant !"
text.025e: "J'ai perdu, mais vous,\nvous n'êtes rien !"
text.02b4: "Sois beau joueur. Tu nous\nas même attaqués par\nsurprise."
text.0344: "Argh ! Tu ne me laisses\npas le choix..."
text.0394: "Dans ta ville, je vais\nte montrer à quel point\nje suis fort ! Tu vas voir !"
text.0462: "Etemon rejoint la ville !"
text.04a0: "Tu vas juste te faire mal."
text.04e0: "Quel bébé !"
text.051c: "Bon, je veux bien jouer\navec toi."
text.056a: "Je vais te casser le nez !"
text.05aa: "Je vais te briser en deux !"
