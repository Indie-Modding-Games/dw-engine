text.0338: "La pêche, mode d'emploi :\nD'abord, trouve une «canne».\nUn sous-menu {color:5}× {color:1}aura\nl'icône «Pêche». Choisis-la.\nMets l'appât avec {color:6}△ {color:1}.\nChoisis parmi la nourriture\nque tu as."
text.0480: "Ensuite, oriente-toi avec\ngauche ou droite. Lève la\ncanne avec {color:6}△ {color:1},\nlance-la avec {color:6}△ {color:1}.\nAttends que le flotteur bouge.\nS'il bouge, le poisson a pris\nl'appât. Tire avec {color:6}△ {color:1}."
text.05f8: "Regarde la jauge en haut à\ngauche. Lâche {color:6}△ {color:1}avant\nqu'elle soit pleine, sinon la\nligne casse : attention.\nSi tu ramènes le flotteur\nassez près de toi, tu as\nattrapé le poisson."
text.077a: "Un «X» sur l'ombre du poisson\nveut dire que tu ne peux pas\nle pêcher avec cet appât."
