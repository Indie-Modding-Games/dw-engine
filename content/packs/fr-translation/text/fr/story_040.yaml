text.00b8: "Qui es-tu ? Va-t'en !"
text.00f2: "C'est ici que tu habites ?"
text.012c: "Je ne peux pas te le dire !"
text.0156: "Tu es un garde ou quoi ?"
text.0198: "Tu veux te battre ? Je vais\nte battre !"
text.01da: "Battons-nous\nTu ne me fais pas peur"
text.025c: "Ouah !"
text.02c4: "Oh non ! Hé !"
text.02e2: "{color:7}???mon {color:1}\nHa ha ha."
text.0310: "Qui est là ?"
text.032c: "{color:7}???mon {color:1}\nJe n'ai rien fait de mal.\nN'entre pas chez moi\nsans permission !"
text.03d2: "Je ferais mieux de partir."
text.0418: "Bon courage pour ta garde !"
text.0452: "Tu es un bandit d'Ogremon !\nC'est ta cachette !"
text.04ba: "De quoi tu parles ?"
text.0500: "Tu as eu de la chance la\ndernière fois ! Rends-toi !"
text.0554: "Ouah !"
text.05b4: "Tu m'as eu la dernière fois,\nmais cette fois je t'aurai."
text.061a: "De quoi tu parles ?"
text.0660: "Cette fois, tu ne\nt'échapperas pas !"
text.06ac: "Allez, laisse-moi entrer."
text.06da: "Tu me cherches ?\nJe vais t'assommer !"
text.0738: "Battons-nous\nNe m'embête pas"
