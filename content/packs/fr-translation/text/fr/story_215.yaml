text.0020: "Ma blessure est guérie, alors\nje veux travailler. Merci\nde t'être occupé de moi."
text.00b6: "Je peux prédire l'avenir\nde toute créature, et c'est\nce que je vais faire."
text.013e: "Si ça t'intéresse, viens\nà ma boutique.\nC'est gratuit."
text.01d6: "Tu veux connaître\nton avenir ?\nBien, voyons voir."
text.0268: "Hmmm, oh... oh, ouah !"
text.029a: "Bon, tout d'abord..."
text.0320: "Globalement, tu as\nbeaucoup de chance."
text.039e: "Globalement, c'est très bien."
text.0424: "Ta chance est moyenne."
text.04a4: "Ta chance n'est\npas terrible."
text.0532: "Globalement, ce n'est pas bon."
text.059c: "Quoi que tu fasses,\ntout ira bien."
text.05ea: "Une belle occasion va\nse présenter à toi."
text.0650: "Tu pourrais vivre un\nmoment inoubliable."
text.069e: "Tu pourrais trouver\nune chose inattendue."
text.06f0: "Ta question trouvera\nsa réponse."
text.073a: "Ton porte-monnaie va grossir."
text.077e: "Tu pourrais avoir de bonnes\nnouvelles de tes amis."
text.07de: "Changer d'humeur pourrait\nte faire du bien."
text.0838: "Essaie d'aller là où tu\nne vas jamais."
text.0896: "Tu pourrais faire un\nrêve intéressant."
text.08ea: "Essaie de ne pas\ntrop dépenser."
text.0936: "Ton secret pourrait\nêtre révélé."
text.097a: "Couche-toi plutôt tôt."
text.09ba: "Surveille bien tes affaires."
text.09f2: "Un ami pourrait passer\nses nerfs sur toi."
text.0a5c: "Plusieurs malheurs pourraient\ns'abattre sur toi..."
text.0ab8: "Tu pourrais croiser une\npersonne que tu n'aimes pas."
text.0b1c: "Une grosse perte pourrait\ns'abattre sur toi..."
text.0b76: "Ta couleur porte-bonheur :\nrouge."
text.0bbe: "Ta couleur porte-bonheur :\nblanc."
text.0c0a: "Ta couleur porte-bonheur :\nbleu."
text.0c54: "Ta couleur porte-bonheur :\nnoir."
text.0ca0: "Ta couleur porte-bonheur :\nvert."
text.0cec: "Ta couleur porte-bonheur :\ngris."
text.0d36: "Ta couleur porte-bonheur :\nmarron."
text.0d82: "Ta couleur porte-bonheur :\njaune."
text.0dd0: "Ta couleur porte-bonheur :\nviolet."
text.0e1e: "Ta couleur porte-bonheur :\nor."
text.0e5c: "Enfin, ta compatibilité\navec\n{color:10}{partner}{color:1}..."
text.0ece: "C'est l'entente parfaite."
text.0f10: "C'est plutôt bien."
text.0f4a: "Ça va."
text.0f72: "Couci-couça."
text.0fa0: "Ce n'est pas mal..."
