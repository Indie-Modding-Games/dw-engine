text.0062: "Va-t'en !"
text.008a: "Dégage !"
text.00b2: "C'est à moi !"
text.00dc: "Je l'ai !"
text.0114: "{color:7}? ? ? {color:1}\n..."
text.013c: "{color:7}? ? ? {color:1}. Une fleur."
text.0172: "{color:7}? ? ? {color:1}\nJe suis une fleur."
text.01ae: "{color:7}? ? ? {color:1}\nJe suis une fleur, j'ai dit !\nTu m'écoutes ?!"
text.0262: "Je déteste me battre."
text.028e: "Dans ce cas,\nviens en ville."
text.02d6: "C'est paisible, là-bas."
text.030a: "La ville ?"
text.0322: "Ça a l'air amusant.\nJe suis Palmon.\nJe te serai utile !"
text.03cc: "Palmon rejoint la ville !"
