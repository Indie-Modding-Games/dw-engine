text.0072: "Chaud ! C'est chaud !"
text.00a4: "Ça s'est mis à bouillir !"
text.00e0: "Oh, je vois."
text.010a: "Bon, viens !"
text.0142: "J'en ai assez !"
text.0178: "Non merci !"
text.01a2: "Quoi ?"
text.01c2: "Mmmmm !"
text.01f4: "Je le sens mal."
text.022c: "Toi aussi ? Je m'en doutais."
text.0288: "Il n'y a rien dans le\ntunnel. On le traverse ?"
text.02f0: "Y aller\nNe pas y aller"
