text.0032: "Le moment est venu."
text.005e: "J'aimerais rester,\nmais ma mère s'inquiète."
text.00b6: "Merci, {color:6}{tamer}{color:1},\nj'aimerais te le rendre."
text.010e: "{color:7}Tokomon {color:1}\nNe nous oublie pas !"
text.014c: "On se reverra.\nJ'en suis sûr."
text.01c0: "Je me suis bien amusé. Merci."
text.01fa: "On devrait faire une\ncérémonie d'adieu."
text.0258: "{color:10}{partner}{color:1}, notre\naventure était grandiose !"
