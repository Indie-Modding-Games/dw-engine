text.014c: "Il y a des dessins bizarres\nsur le sol."
text.01a2: "Ce sont des cercles étranges ?\nIls ont l'air récents."
text.0238: "Il y en a encore plus.\nTu crois qu'ils viennent\nde l'OVNI ?"
text.02d4: "Ugghh !?"
text.02f4: "J'en vois bien plus."
text.032c: "Bon, ça veut dire..."
text.036a: "Quoi ?"
text.03d0: "Un extraterrestre ?!"
text.03ec: "..."
text.03fa: "Tu es un Digimon ?"
text.0426: "..."
text.0434: "Alors ?"
text.044c: "..."
text.0472: "Je ne suis pas ton ennemi !"
text.04a8: "Bien, tu as compris."
text.04ea: "{color:6}{tamer}{color:1} a tenté\nde le convaincre."
text.0526: "..."
text.0534: "Il ne comprend peut-être pas."
text.0588: "D'acc."
text.05d4: "Vademon rejoint la ville !"
text.060a: "Hein ?"
text.0618: "Il parle !"
