text.005a: "Malheureusement, les\ninscriptions sont closes.\nAttends l'année prochaine."
text.00f4: "On est entre deux tournois.\nJe n'ai rien à faire."
text.017c: "Le tournoi vient de finir.\nAttends l'année prochaine."
text.01fc: "Tu n'es pas un Insecte.\nTu ne peux pas participer."
text.027c: "Tu veux t'inscrire ?"
text.02c0: "Expliquer\nNe pas expliquer"
text.02fe: "Le 22, il y a un tournoi\nréservé aux Digimon\nInsectes."
text.0390: "Tu peux t'inscrire\ntout de suite."
text.03e6: "Si tu n'es pas un Digimon\nInsecte, tu ne peux pas\nt'inscrire au tournoi."
text.047a: "Si tu gagnes, tu reçois de\nsuper cadeaux. Inscris-toi."
text.04f4: "M'inscrire\nNe pas m'inscrire"
text.0548: "On est entre deux tournois.\nJe n'ai rien à faire."
text.05d0: "Le tournoi vient de finir.\nAttends l'année prochaine."
text.0632: "Tu es inscrit à\n« {tournament:pstat=3}».\nTu veux annuler ?"
text.06bc: "Ne pas annuler\nAnnuler"
text.0706: "J'ai annulé."
text.0726: "Tu es sûr de toi ?"
text.0764: "Je me suis inscrit."
text.07a2: "Il n'y a pas de tournoi\naujourd'hui."
text.0806: "Ceux qui ne sont pas inscrits\nne peuvent pas entrer."
text.0886: "Ce n'est pas encore ouvert.\nInscris-toi le 22,\nentre 10 h et 23 h."
text.0950: "Dommage, le tournoi est fini.\nReviens l'année prochaine."
text.0a10: "Dommage.\nCe sera pour l'an prochain."
text.0a60: "J'ai eu une {color:6}Méga viande {color:1}\npour ma participation !"
text.0ac8: "Trop d'affaires.\nJettes-en quelques-unes."
text.0b30: "Prix du champion :\n5000 Bits.\nJ'ai eu une {color:6}Perle insecte {color:1}\ncomme prix du champion !"
text.0c00: "Trop d'affaires !"
text.0c52: "Prix du deuxième :\n2000 Bits !\nJ'ai eu un {color:6}Casque cornu {color:1}\ncomme prix du deuxième !"
text.0d22: "Trop d'affaires !"
text.0d6c: "Prix du deuxième :\n2000 Bits !\nJ'ai eu une {color:6}Mandibule {color:1}\ncomme prix du deuxième !"
text.0e32: "Trop d'affaires !"
