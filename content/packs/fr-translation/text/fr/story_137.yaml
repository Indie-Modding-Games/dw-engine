text.0028: "Uggh !"
text.0060: "Quoi ?"
text.007e: "Quoi ?!"
text.009e: "Oh, chef, on a des ennuis !"
text.00e2: "Qu'est-ce que vous faites ?"
text.011e: "Bravo. Tu as trouvé la\nnouvelle Forteresse Ogre !"
text.018c: "Encore des mauvais coups ?"
text.01d0: "Bien sûr ! Hé hé !"
text.01fa: "Je ne vous laisserai pas\nfaire ! Sortez de\ncette grotte !"
text.0278: "Cette fois, c'est différent !"
text.02c0: "Chef, c'est lui ?"
text.02ee: "Ouais. Vas-y !"
text.033c: "Quoi ?!"
text.0360: "Maître WaruSeadramon !\nAllez-y, je vous en prie !"
text.03ca: "C'est votre garde du corps ?"
text.040c: "Hé hé hé ! Tu es fichu !"
text.0490: "Zut !"
text.04a2: "Ahhhhhh !"
text.04c6: "Tu ne m'échapperas pas !"
