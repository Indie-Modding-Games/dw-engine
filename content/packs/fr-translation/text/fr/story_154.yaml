text.003e: "Quelqu'un est là ! Qui ?!"
text.00c4: "Hé hé, je vais casser ce\nvilain ordi ! Hé hé hé !"
text.0284: "C'est lui... Hé !\nHé, qu'est-ce que tu fais ?!"
text.02f0: "Ouais ! Je vais détruire !\nJe vais tout détruire.\nTout ce qui est mauvais !"
text.04b2: "Oh non, il est fou.\nC'est un Digimon Ultime,\nmais il faut l'arrêter !"
text.054c: "Hé hé hé,\nje vais tous vous détruire !"
text.06c4: "Ugghhh ! Je faiblis."
text.0702: "On perd l'électricité.\nDemandons à Andromon de\ncouper l'eau usée de l'usine."
