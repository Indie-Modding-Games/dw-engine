text.002e: "Je vais t'avoir."
text.0068: "Tu es venu ici pour perdre ?"
text.00b2: "Tu es plutôt minable !"
text.00f2: "Hmmm, tu tiens à perdre ?"
text.0140: "Tu vas tomber !"
text.017a: "Pousse-toi de là !"
text.01ca: "C'est une ère complètement\ndifférente."
text.0226: "Pas de temps à perdre.\nCherchons les météorites."
