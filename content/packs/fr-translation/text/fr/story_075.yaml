text.0096: "J'ai entendu parler de toi."
text.00d6: "Si tu as entendu parler de\nnous et de la ville, viens\ndonc avec moi."
text.0166: "Moi aussi, je pense à\nl'avenir de l'île. Je cherche\nquelque chose."
text.0218: "Qu'est-ce que tu cherches ?"
text.0252: "Une chose que mes ancêtres\nont laissée, mais je ne\nsais pas ce que c'est."
text.02fe: "Je vois. Si je la trouve,\nje te préviens."
text.0354: "Je cherche depuis\nlongtemps.\nCe ne sera pas facile."
text.03cc: "Mais si tu la trouves,\nje te le promets,\nj'irai dans ta ville."
text.044c: "C'est ça ?"
text.0474: "Oh, c'est ça !"
text.04b8: "C'est ce que mes ancêtres\nont écrit. Voyons voir."
text.0524: "Quand le danger menace\nl'île, va en ville."
text.0592: "Mes ancêtres disent\nque je dois y aller !"
text.05de: "Tu vas nous aider ?"
text.061e: "Tu peux compter sur moi !"
text.0686: "Leomon rejoint la ville !"
text.06ca: "Je dois chercher quelque\nchose. Excuse-moi, je dois..."
text.0756: "{color:5}Entraînement :\nFrappe spéciale {color:1}"
text.0796: "Commencer\nExpliquer\nQuitter"
text.07ce: "Normal\nEssai bonus\nQuitter"
text.080c: "Avec un sac de béton,\nfrappe de toutes tes forces."
text.0868: "Ça augmente l'Attaque\net les HP max."
text.08c4: "Réexpliquer\nCommencer\nQuitter"
text.091e: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.09a0: "{color:5}Entraînement : \nParcours de la savane {color:1}"
text.09de: "Commencer\nExpliquer\nQuitter"
text.0a16: "Normal\nEssai bonus\nQuitter"
text.0a54: "Fais le tour du parcours\nde la savane."
text.0a8e: "Ça augmente beaucoup la\nVitesse, et aussi les HP max."
text.0afc: "Réexpliquer\nCommencer\nQuitter"
text.0b56: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
