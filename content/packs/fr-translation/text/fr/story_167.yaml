text.0038: "Oh, {color:6}{tamer}{color:1}et {color:10}{partner}{color:1},\nvous êtes là."
text.0078: "Je suis livreur.\nJe livre de tout."
text.00cc: "La seule chose que tu peux\nporter, c'est toi, non ?"
text.0132: "Et si je vous transportais ?\nBonne idée, hein ?"
text.0190: "Je t'emmène\npartout, à tout moment.\nContre paiement, bien sûr."
text.0222: "Hé, {color:6}{tamer}{color:1}."
text.023c: "Parfois, je vais patrouiller\nà la Savane Engrenage."
text.029e: "Il paraît qu'il y a des\nboutiques sur la plage de\nla Savane Engrenage. Vues ?"
