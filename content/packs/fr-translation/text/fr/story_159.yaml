text.0082: "Encore toi ! Sors d'ici !"
text.00c8: "Euh..."
text.00e0: "Toi... tu es une plaie !\nÇa te va, là ?!"
text.0154: "Encore toi ! Sors d'ici\ntout de suite !"
text.01ba: "Ravi de vous voir, mes amis.\nSi vous voulez vivre ici,\nje vous le permets."
text.0260: "On veut vivre ici\nOn veut repartir"
text.02c6: "Hmmm, très bien. Quoi ?\nMais tu es analogique,\ntu ne peux pas vivre ici."
text.0356: "On doit rester ensemble !"
text.038c: "Alors, sors d'ici\navec lui !"
text.03de: "Quoi ? Qu'est-ce que tu dis ?"
text.0422: "Ce n'était pas un Sukamon.\nRoi, rends-lui sa forme\nd'origine, s'il te plaît !"
text.04c2: "Ce n'est pas génial qu'il\nsoit devenu Sukamon ?"
text.0516: "Non, pas vraiment pour\nl'instant. S'il te plaît."
text.0570: "Le seul moyen de devenir\nSukamon, c'est l'effort."
text.05cc: "Il est devenu Sukamon\nnaturellement, et\nc'est bien le problème."
text.0642: "Vous êtes incroyables !"
text.06aa: "Ouah ! Roi, merci !"
text.06e0: "Sors d'ici tout de suite !"
text.072c: "Tu es venu pour\nquelque chose ?"
text.0774: "Eh bien..."
text.078a: "Si tu as une requête,\noublie-la. Car je suis\nle Roi des Sukamon !"
text.0810: "Je ne pourrai sans doute pas\nl'inviter en ville."
text.0890: "Moi aussi, je collectionne\nles cartes Digimon."
text.08e0: "Je veux une carte Roi des\nSukamon. Tu l'échanges\ncontre ma carte Etemon ?"
text.0986: "Échanger\nNe pas échanger"
text.09ba: "Désolé, je ne l'ai pas."
text.0a02: "Ouah, ça pue ! C'est un\ntas d'ordures ?"
text.0a4c: "Je ne savais pas qu'il y en\navait dans Digimon World."
text.0aca: "Content que tu sois venu.\nBienvenue aux nouveaux amis."
text.0b26: "C'est une communauté de\nla tribu Sukamon ?"
text.0b82: "Exact. C'est le paradis de\nla tribu Sukamon, appelé\nRoyaume Poussière."
text.0c20: "Le Roi des Sukamon est ici."
text.0c62: "Le Roi des Sukamon... ?"
text.0c90: "Le Roi des Sukamon est fort !\nSi tu ne l'écoutes pas,\ntu seras digivolué !"
text.0d32: "Tu veux dire qu'on devient\nautre chose que Sukamon ?"
text.0d9e: "Ça veut dire qu'on reprend\nnotre forme d'origine ?!"
text.0dfc: "Oui, ça fait peur. Brr."
text.0e36: "J'ai appris un truc utile..."
text.0ea2: "Oh, Sukamon ?!"
text.0ec4: "Hein ? Tu me connais ?"
text.0f00: "Eh bien, un peu.\nOn doit aussi emmener\nSukamon en ville ?"
text.0f92: "Ouah, intéressant !\nJe n'ai jamais rien vu\nde pareil !"
text.1014: "Mon Dieu ! Les cacas\nbougent et parlent !"
text.107c: "Tu parles de moi ?\nJe suis Sukamon...\nun Digimon Mutant."
text.1100: "Tu n'es pas du caca ?"
text.112a: "D'une certaine façon, oui,\ncar on est faits de\ndéchets numériques."
text.11aa: "On lui demande de venir\nen ville aussi ? Pas de\npréjugés."
text.1240: "Tu comptes vivre\nici ?"
text.1284: "Quoi ? Je n'y ai\njamais pensé."
text.12ca: "Bah, c'est un paradis\nréservé à la tribu Sukamon.\nLes autres ne peuvent pas."
text.136a: "Alors, vous ne pouvez pas\nvivre ailleurs ?"
text.13ba: "Bien sûr que non !\nTu crois quoi ?"
text.1404: "Je vois. C'est bien\nce que je pensais."
text.1446: "Bon, même si tu ne peux\npas vivre ici,\ntu peux visiter."
text.14be: "Ah, juste visiter. D'accord."
text.14f2: "Oh, au fait, ne mets\njamais le Roi en colère."
text.1552: "Sa technique Digivolution\nte changerait en\nquelque chose de misérable."
text.1610: "Hé, tu as trop de\ncartes Etemon !\nNe fais pas ça."
text.167c: "Oh, merci !"
text.16bc: "Hé, vous venez de...\ndu machin... la ville ?"
text.172e: "Ça reste entre nous.\nÇa m'intéresse\nun petit peu."
text.17ae: "Je viendrai vous voir\nlà-bas un jour."
text.17fe: "Hé, vous connaissez la\ntechnique spéciale de la\ntribu Sukamon ?"
text.187e: "On absorbe le caca par terre\ndans notre corps et\non le change en énergie !"
text.1916: "Hein ? C'est le Royaume\nPoussière. Je sais, pour toi,\nc'est un tas d'ordures."
text.19a4: "Mais on peut trouver un truc\nutile. J'ai vu un long\nbâton là-bas."
text.1a4c: "Ouah, une\n{color:6}Canne usée{color:1} !"
text.1aba: " {color:5}Entraînement : Ordures {color:1}"
text.1af6: "Commencer\nExpliquer\nQuitter"
text.1b2e: "Normal\nEssai bonus\nQuitter"
text.1b6c: "Entraînement mental en te\nplongeant dans les ordures.\nLes MP max montent beaucoup."
text.1c0e: "Réexpliquer\nCommencer\nQuitter"
text.1c68: " {color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
