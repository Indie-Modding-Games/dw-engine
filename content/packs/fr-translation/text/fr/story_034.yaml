text.006e: "C'est ton dernier jour."
text.00b2: "Ne reste pas derrière moi !"
text.00f4: "Puisque tu as vu mon visage..."
text.0142: "Je ne dois pas me tromper !"
text.0186: "Désolé, mais tu vas perdre !"
text.01d2: "Tu ne m'échapperas pas !"
text.0216: "Pas question que je perde !"
text.0262: "J'en ai fini avec toi !"
