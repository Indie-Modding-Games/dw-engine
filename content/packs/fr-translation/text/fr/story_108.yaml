text.004e: "{color:5}Entraînement :\nRocher, amélioré {color:1}"
text.00a4: "{color:5}Entraînement :\nRocher {color:1}"
text.00e0: "Commencer\nExpliquer\nQuitter"
text.0116: "Normal\nEssai bonus\nQuitter"
text.0152: "Pousse le rocher pour être\nplus fort. Augmente les HP\nmax et l'Attaque."
text.01ec: "Réexpliquer\nCommencer\nQuitter"
text.0246: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.02d6: "{color:5}Entraînement :\nCascade, améliorée {color:1}"
text.0322: "{color:5}Entraînement : Cascade {color:1}"
text.0354: "Commencer\nExpliquer\nQuitter"
text.038c: "Normal\nEssai bonus\nQuitter"
text.03ca: "Reste sous la cascade.\nAugmente les MP max\net la Défense."
text.0448: "Réexpliquer\nCommencer\nQuitter"
text.04a2: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.0532: "{color:5}Entraînement :\nFrappe d'arbre, améliorée {color:1}"
text.0582: "{color:5}Entraînement : Frappe d'arbre {color:1}"
text.05bc: "Commencer\nExpliquer\nQuitter"
text.05f4: "Normal\nEssai bonus\nQuitter"
text.0632: "Tape un arbre pour t'exercer.\nAugmente beaucoup l'Attaque\net la Vitesse."
text.06c2: "Réexpliquer\nCommencer\nQuitter"
text.071c: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.07aa: "{color:5}Entraînement : Gant,\namélioré {color:1}"
text.0800: "{color:5}Entraînement : Gant {color:1}"
text.083c: "Commencer\nExpliquer\nQuitter"
text.0874: "Normal\nEssai bonus\nQuitter"
text.08b2: "Gagne en force avec la\nmachine à gant. Augmente la\nDéfense et l'Intelligence."
text.0946: "Réexpliquer\nCommencer\nQuitter"
text.09a0: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.0a30: "{color:5}Entraînement :\nCourse, améliorée {color:1}"
text.0a78: "{color:5}Entraînement : Course {color:1}"
text.0aa6: "Commencer\nExpliquer\nQuitter"
text.0ade: "Normal\nEssai bonus\nQuitter"
text.0b1c: "Fais le tour du parcours.\nAugmente beaucoup la\nVitesse et les HP max."
text.0b88: "Réexpliquer\nCommencer\nQuitter"
text.0be2: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.0c72: "{color:5}Entraînement :\nClasse de {color:6}{tamer}{color:1}{color:5},\naméliorée {color:1}"
text.0ccc: "{color:5}Entraînement :\nClasse de {color:6}{tamer}{color:1}{color:5} {color:1}"
text.0d0c: "Commencer\nExpliquer\nQuitter"
text.0d44: "Normal\nEssai bonus\nQuitter"
text.0d82: "{color:6}{tamer}{color:1} t'apprend plein\nde choses. Augmente\nl'Intelligence et les MP max."
text.0df2: "Réexpliquer\nCommencer\nQuitter"
text.0e4c: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.0ece: "Hé, j'ai du nouveau."
text.0efe: "Pour les Digimon Bébés ou\nApprentis, répète le même\nentraînement."
text.0f88: "Il se passera un truc bien."
text.0fd4: "J'ai du nouveau."
text.0ffa: "À l'Essai bonus, si tu\nalignes les mêmes images, la\ncapacité augmente beaucoup."
text.10b0: "Oh, je devais te parler\ndes techniques."
text.110e: "Les techniques de l'ennemi\npeuvent être maîtrisées\nsi tu gagnes le combat."
text.1198: "Mais seulement celles\nqu'on peut ajouter\nà ce moment-là."
text.1226: "Tu ne peux pas tout maîtriser.\nMais le combat est le moyen\nle plus rapide d'y arriver."
text.12d0: "L'entraînement marche aussi,\nmais les chances sont faibles."
text.134e: "Quand tu seras plus malin,\nva à la classe de\n{color:6}{tamer}{color:1} pour apprendre\nune technique."
text.13e6: "Les chances sont faibles,\nalors n'en attends pas trop.\nEntraîne-toi avec équilibre !"
text.148c: "Salut, je suis Koromon.\nJiji m'a dit de te parler\nde l'entraînement."
text.1506: "Tu veux me demander un truc ?"
text.153c: "Quel entraînement ?\nComment s'entraîner ?\nNon, rien"
text.15b2: "En t'entraînant ici, tu\npeux augmenter les capacités\nde ton Digimon."
text.162c: "L'entraînement fatigue,\nmais il rapporte plus\nqu'un vrai combat."
text.16c8: "Et, très rarement, tu peux\nmaîtriser de nouvelles\ntechniques."
text.173a: "Je t'en dirai plus sur\nles techniques la prochaine\nfois."
text.17a0: "Il y a six postes\nd'entraînement ici, avec\nun panneau à côté."
text.182a: "Appuie sur {color:6}△ {color:1}\ndevant le panneau."
text.187c: "Lis les panneaux, et tu\nsauras quelles capacités\ntu peux augmenter."
text.18fe: "Selon la spécialité de ton\nDigimon, certaines capacités\naugmentent plus que d'autres."
text.19aa: "Mais tu ne le sauras\nqu'en essayant."
text.1a0a: "Après « Commencer »,\nchoisis « Normal » et\nentraîne-toi une heure."
text.1a7a: "Pendant l'entraînement,\navec {color:5}× {color:1}tu peux\navancer le temps."
text.1ae6: "Ah oui, je dois te parler\nde l'« Essai bonus »."
text.1b48: "S'il réussit, l'Essai bonus\naugmente beaucoup la force,\nmais peu en cas d'échec."
text.1be4: "Essaie une fois, tu verras."
text.1c24: "Bon, je vais vite te trouver\nd'autres infos."
text.1d7c: "Je suis allé en ville. Mais\nc'était trop urbain pour\nmoi, alors je suis venu ici."
text.1e10: "J'ai modifié l'équipement.\nC'est mieux. Entraîne-toi !"
text.1e86: "Je suis allé en ville. Mais\nc'était trop urbain pour\nmoi, alors je suis venu ici."
text.1f1a: "J'ai modifié l'équipement.\nC'est mieux. Entraîne-toi !"
