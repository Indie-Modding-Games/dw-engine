text.00a2: "Je vais t'assommer !"
text.00de: "Hé, ne me pousse pas !"
text.011a: "C'est paisible, là-haut !"
text.015c: "Je vais tomber ! C'est\ndangereux !"
text.01a6: "Pas de ça ici, là-haut !"
text.01e8: "N'essaie même pas de me\ncombattre !"
text.0238: "Ascenseur"
text.0250: "Appuyer sur BAS\nNe pas monter"
text.0302: "Rien ne se passe.\nÇa ne va pas."
