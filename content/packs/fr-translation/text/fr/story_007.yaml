text.0038: "Oh, oui !"
text.0050: "Vas-tu jouer de la {color:6}Flûte bleue\n{color:1}du Gardien du Lac ?"
text.00b6: "Jouer\nNe pas jouer"
text.0188: "Besoin d'aide, l'ami ?"
text.01ce: "Emmène-moi de l'autre côté."
text.020e: "Bien sûr. Monte."
text.033c: "Seadramon !"
text.0358: "On se retrouve.\nTu as une demande ?"
text.03bc: "Soyons amis\nApprends-moi une tech.\nJe veux un objet"
text.0444: "On est déjà amis.\nUne autre demande ?"
text.050c: "Quoi... oh non !\nC'est le Gardien du Lac !"
text.056c: "Euh, oui. Je suis Seadramon."
text.05a0: "Alors c'est toi qui pêches\nautant !\nSoit. Une demande ?"
text.0634: "Quoi !? Je comprends pourquoi\non t'appelle Gardien.\nOui, j'ai une demande."
text.06bc: "Soyons amis\nApprends-moi une tech.\nJe veux un objet"
text.0738: "Bon, d'accord."
text.0754: "Dès maintenant, on est amis.\nPrends cette flûte en gage."
text.07ec: "Oh non ! Trop d'objets.\nJe dois en jeter."
text.085e: "J'ai eu la {color:6}Flûte bleue\n{color:1}du Gardien du Lac !"
text.08b4: "Joue de la flûte près du\nlac et je viendrai. Je\nt'emmènerai de l'autre côté."
text.095c: "Je peux aller de l'autre\ncôté ? Merci !"
text.09bc: "Après le lac, il y a une\nforêt étrange. Tu veux\ny aller tout de suite ?"
text.0a5e: "Oui, j'y vais\nNon, plus tard"
text.0aaa: "Je vais t'apprendre\nune technique."
text.0af6: "J'ai maîtrisé\n«Magie aquatique» !"
text.0b40: "J'ai maîtrisé\n«Souffle hivernal» !"
text.0b8e: "J'ai maîtrisé «Gigagel» !"
text.0bcc: "Euh, je crois que je n'ai\nplus de techniques à\nt'apprendre..."
text.0c5c: "Salut !"
text.0ca8: "Bon, je te donne la\n{color:6}Gourde{color:1}."
text.0d12: "Oh non ! Trop d'objets.\nJe dois en jeter."
text.0d84: "Ouais, j'ai eu la\n{color:6}Gourde{color:1} !"
text.0dca: "Salut !"
text.0e16: "Bon, grimpe sur mon dos."
text.0ece: "À bientôt."
