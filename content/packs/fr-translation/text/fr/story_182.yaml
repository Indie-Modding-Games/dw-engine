text.0056: "Enfin, on y est."
text.008c: "Tu es le chef ?"
text.00ba: "Désolé, non.\nJe suis MetalGreymon !"
text.0114: "Je m'occuperai de toi\nplus tard ! Pousse-toi !"
text.015e: "Je ne bougerai pas.\nTu ne passeras pas."
text.01c4: "Je veux garder mon énergie.\nLe combattre ne m'aide pas."
text.0230: "J'arrive !"
text.0294: "Hein ? Où suis-je ?"
text.02bc: "Tu as retrouvé tes esprits !"
text.02f6: "On dirait..."
text.0316: "Si tu les bats, on se\nreverra peut-être.\nD'ici là, je m'en vais."
