text.004e: "Tu ne devrais pas rentrer ?"
text.0090: "Rentre chez toi !"
text.00b6: "Tu devrais faire demi-tour !"
text.010c: "Oh, c'est aveuglant !"
text.014c: "{color:7}??? mon {color:1}\nToi qui cherches mon aide,\nl'heure est venue ! Reçois\nla bénédiction de mes ailes !"
text.0206: "Quoi... ? Où... ?\nÀ qui est cette voix... ?"
text.0252: "Ugh !"
text.0274: "C'était quoi ? La lumière a\ndisparu. Il n'y a plus rien\nici. Alors, c'est au-dessus ?!"
