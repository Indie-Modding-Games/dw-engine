text.00c8: "Bienvenue, jeune homme."
text.0108: "Tu es Cherrymon, non ?"
text.0144: "Qui est là ?"
text.0164: "Que veux-tu à un vieil\nhomme comme moi ?"
text.01ca: "D'abord, chasse le brouillard."
text.0200: "Ce brouillard m'aveugle.\nTu peux t'en débarrasser ?"
text.026c: "Ah, c'est donc ça. Je vois."
text.02a6: "... tu ne peux pas ?"
text.02da: "D'abord, écoute ce que j'ai\nà dire. Voyons...\npar où commencer ?"
text.0364: "Si tu sais quelque chose\nsur le danger de l'île,\ndis-le-moi, s'il te plaît."
text.03fa: "Je vois, je vois.\nLe danger."
text.043e: "L'île a commencé à changer\nil y a 80 ans, après les\nbouleversements de la terre."
text.04de: "Le nord-est de l'île\nest apparu d'un coup\nil y a 80 ans."
text.0574: "Depuis, les Digimon ont\ncommencé à partir.\nLes espèces se sont séparées."
text.05fa: "Et chaque espèce s'est mise\nà parler sa propre langue."
text.066a: "Ils ont oublié la langue\nqu'ils parlaient en ville..."
text.06d2: "Au bout du compte, Cité File\na perdu presque tous\nses Digimon."
text.0752: "Puis les Digimon ont\ncommencé à perdre la mémoire !"
text.07a8: "L'histoire de l'île, leur\npassé, leurs sens...\nÇa empire de jour en jour."
text.0844: "J'ai une chose importante\nà te dire, mais je ne\nm'en souviens plus non plus."
text.08e6: "Pourtant, tout finira par\nse rejoindre. Quelqu'un\nl'a voulu ainsi !"
text.097c: "Avec le temps, les Digimon\nfiniront par trouver ce\ndanger normal."
text.0a08: "Seuls toi et le pouvoir de\nCité File d'unir les Digimon\npeuvent arrêter ça !"
text.0ab8: "Rassemble des Digimon en\nville et crée un miracle.\nIl arrivera, c'est sûr."
text.0b54: "Bon, je me suis emporté.\nOuf, j'ai tout dit."
text.0bd4: "Maintenant, dissipons le\nbrouillard."
text.0c20: "Le brouillard servait à\npouvoir te parler.\nOh, encore une chose..."
text.0cd0: "D'autres dans la forêt\nsavent des choses\nsur le passé."
text.0d44: "Va au fond de la forêt\npour les trouver, si tu peux."
text.0dbc: "Tu es revenu écouter\nun vieil homme parler ?"
text.0e24: "À propos de l'île...\nEntraîne {color:10}{partner}{color:1}\nLaisse tomber"
text.0e98: "Voici ce que j'ai à dire."
text.0eda: "Ah, d'accord."
text.0efe: "{color:5}Entraînement : Leçons \nde la forêt {color:1}"
text.0f56: "Commencer\nExpliquer\nQuitter"
text.0f8e: "Normal\nEssai bonus\nQuitter"
text.0fcc: "Cherrymon te transmettra\nbeaucoup de savoir. Ça\naugmente beaucoup la sagesse."
text.1068: "Réexpliquer\nCommencer\nQuitter"
text.10c2: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.1138: "Ha ha ha."
