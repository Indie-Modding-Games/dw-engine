text.00bc: "Je t'attendais,\n{color:6}{tamer}{color:1}.\nCe jour est enfin arrivé."
text.0130: "Que se passe-t-il ?"
text.0154: "L'entrée du Mont Infini\nest apparue."
text.01a8: "Quoi ? Vraiment ? Où ?"
text.01d8: "Derrière les chutes\nde la ville."
text.0224: "Ça alors, c'est tout près !"
text.0254: "À mon avis, le dernier\nennemi est au Mont Infini."
text.02c4: "C'est donc l'ultime donjon.\nJ'y vais !"
text.0316: "Bonne chance ! Mais ne te\nprécipite pas. N'y va pas\navant d'être bien préparé."
text.03ce: "De l'autre côté de la\ncascade, en ville, se trouve\nl'entrée du Mont Infini."
text.0478: "À mon avis, le dernier\nennemi est au Mont Infini."
text.04e6: "Vas-y bien préparé !"
text.051c: "En tout cas..."
text.0546: "Le taux de prospérité de\nla ville est de {num:pstat=1}."
text.05b4: "On est loin de\nce qu'elle était."
text.060e: "Elle prend enfin forme."
text.0658: "Elle se développe bien."
text.0698: "Elle devient une belle ville."
text.06e2: "Tu as fait du beau travail.\nSplendide !"
text.073a: "Je n'ai plus rien à\ndire. C'est fantastique !"
text.07be: "{color:7}Ton niveau de dresseur\na augmenté ! {color:1}"
text.0808: "{color:7}Bravo !\nVoici une médaille pour\nton excellent travail ! {color:1}"
