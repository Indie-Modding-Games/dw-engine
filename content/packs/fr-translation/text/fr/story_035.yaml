text.009a: "Ha ! Tu as peur."
text.00d4: "Tu ferais mieux de rentrer !"
text.0114: "Une fois entré,\ntu ne pourras plus sortir."
text.0170: "Hé, hé !"
text.0198: "Attends."
text.01b8: "Tu vas être possédé."
text.0202: "Bakke-bakke ?"
text.0226: "On dirait qu'il\ndemande quelque chose."
text.0272: "?...Oui\n?...Non"
text.02a8: "Bakke ! Bakke bakke ?"
text.02d6: "Oui\nNon"
text.0300: "Bakkeee...bakke bakke ?"
text.0338: "Oui\nNon"
text.035e: "Bakke bakke !\nBakkeee bakke bakkeee !"
text.03e8: "Bakemon rejoint la ville !"
text.0422: "Je crois que ça a marché."
text.046e: "Je l'ai peut-être fâché ?"
text.04ea: "Bloqué par une étrange\nforce noire !"
text.0556: "Quoi ?! Mes jambes..."
