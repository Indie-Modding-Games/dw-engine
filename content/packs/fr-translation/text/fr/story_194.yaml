text.0066: "Taaa"
text.0084: "Demandons pardon."
text.00ce: "Le pardon guérit le cœur."
text.011c: "Tu es méchant ?"
text.014c: "Suis-moi. Ensuite..."
text.0194: "Ha ha ha !"
text.01bc: "Toi !"
text.01cc: "Tu vas perdre !"
text.0220: "Je n'arrive pas à croire\nqu'il m'a lavé le cerveau."
text.027c: "Il est fort.\nTu peux le vaincre ?\nPourquoi fais-tu ça ?"
text.02f4: "Je me bats pour l'île\nRéglons ça maintenant."
text.035c: "On ne veut pas de maître,\ntu es notre seul espoir."
