text.004e: "Tunnel Foreuse"
text.0084: "Normal\nMode Ogre"
text.00ec: "Quel sale type ! Malpoli !"
text.012e: "Hein ?"
text.015a: "{color:7}Market manager {color:1}\nJe ne savais pas qu'il fallait\npayer pour passer !"
text.01f6: "{color:7}Market manager {color:1}\nHé, mais tu es... oui !\nFais quelque chose !"
text.026c: "Comment vont les Drimogemon\nà l'intérieur ?"
text.02b0: "{color:7}Market manager {color:1}\nJe ne sais pas."
text.02f6: "J'espère qu'ils vont bien.\nBon, j'y vais !"
text.0362: "{color:7}Market manager {color:1}\nFais quelque chose, vite !"
text.03f8: "Il n'y a plus rien dans\nle tunnel... On le traverse\nou quoi ?"
text.047e: "On traverse !\nNon"
