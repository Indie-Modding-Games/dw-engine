text.0072: "Te voilà, {color:6}{tamer}{color:1} !"
text.009a: "On est chasseurs de trésors.\nOn trouve les trésors\nenfouis en creusant."
text.013e: "Compte sur moi pour trouver\ndes trésors."
text.0196: "Tu veux que je cherche\nquelque chose ? Ou que\nj'explique comment on fait ?"
text.0230: "Expliquer\nNe pas expliquer\nLaisse tomber"
text.0286: "On a deux formules, avec\ndes durées et des prix\ndifférents."
text.02ee: "Norm. : 3 jours, 1000 Bits\nSpéc. : 10 jours, 5000 Bits"
text.036a: "Les chances de trouver un\nmeilleur trésor sont plus\ngrandes en formule spéciale."
text.03f6: "C'est à peu près tout.\nQue veux-tu faire ?"
text.044e: "Chercher un trésor\nRéexpliquer\nLaisse tomber"
text.04b0: "Choisis une formule !"
text.04d4: "Norm. : 3 jours, 1000 Bits\nSpéc. : 10 jours, 5000 Bits\nAnnuler"
text.056e: "D'accord, au revoir."
text.05c4: "Résultats dans trois jours.\nSouhaite-moi bonne chance."
text.066a: "Résultats dans dix jours.\nSouhaite-moi bonne chance."
text.06ea: "Tu n'as pas assez de Bits.\nIl me faut de l'argent pour\nchercher des trésors."
text.07a4: "Je cherche un trésor en ce\nmoment. Patiente un peu."
text.082a: "Tu sais quoi ?\nOn a trouvé un trésor."
text.0b00: "Fais de la place !"
text.0b32: "J'ai eu : {color:6}{item:pstat=110}{color:1}!"
text.0dae: "Merci d'être venu !"
text.0de8: "Merci de ta confiance,\n{color:6}{tamer}{color:1} !"
text.0e2a: "Je viens de commencer à\naider Drimogemon. Je suis\ndoué pour trouver des trucs."
