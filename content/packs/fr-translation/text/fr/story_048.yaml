text.004e: "Ah !"
text.006a: "Ah !"
text.0096: "C'est l'ascenseur qui fait\nmonter le sol ?"
text.0102: "Monter\nNe pas monter"
text.0190: "Hé !"
text.01b0: "Quoi ?"
text.01c0: "Tu es venu ici pour perdre ?"
text.0208: "C'est ma réplique !"
text.0232: "Cette fois, je ne retiens\nrien. Tu vas pleurer !"
text.02d6: "Ouah !"
text.02e6: "Oh non !"
text.0312: "Zut !"
text.03b6: "Qu'est-ce que c'est ?"
text.0460: "Salut, les nigauds !"
text.0496: "Zut, il s'est enfui !"
text.04de: "Il a un ascenseur de secours.\nLe poursuivre ne sert à rien."
text.05a8: "Qui es-tu ?"
text.05c8: "Qui je suis ? Et toi ?"
text.0672: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1} !\nJe peux porter 20 objets !"
text.0722: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1} !\nJe peux porter 30 objets !"
