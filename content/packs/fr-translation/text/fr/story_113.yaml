text.0094: "Va tout droit et\ntourne à droite. Hé hé hé..."
text.0108: "Tourne à droite et\nvite à gauche. Hé hé..."
text.016c: "Tu ne sortiras pas de\ncette forêt. Hé hé hé..."
text.01dc: "Je me suis perdu !"
text.0208: "Ces temps-ci, je suis fatigué."
text.024e: "Toi ? Pas possible !?"
text.027e: "Fais attention où tu marches."
text.02cc: "Hé, toi !"
text.0318: "Hmm, tu es incroyable !\nPas mal du tout pour\nsi tôt le matin."
text.03c2: "Hé, hé, ne fais pas comme si\nça ne te concernait pas !"
text.0438: "Je sais ! Je sais de quoi\ntu parles."
text.0490: "Il paraît que tu travailles\ndur pour l'île en\nrassemblant des Digimon."
text.0520: "Tu le sais donc. Alors,\npourquoi ne pas m'aider ?"
text.057a: "Et je suis censé faire\nquoi, et où ?"
text.05d2: "Oh, tu ne piges rien !\nTu dois travailler\nen ville, tu te souviens ?!"
text.066c: "Bah, comme on dit...\nl'avenir appartient à ceux\nqui se lèvent tôt."
text.06e2: "Ça n'a rien à voir !\nEt en plus, ce n'est même\npas ça, le proverbe !"
text.078a: "Je blague. Bon,\non se voit en ville..."
text.0830: "Kokatorimon rejoint la ville !"
text.0876: "On peut vraiment lui faire\nconfiance ? Je me demande..."
text.08de: "Hé, des plumes d'oiseau\npar terre. Encore toutes\nfraîches. Trop tard ?"
