text.0020: "Je te dérange ?"
text.0090: "{color:7}??? {color:1}\nÀ l'aide !"
text.00ca: "J'entends une voix là-haut.\nIl y a quelqu'un ?"
text.012c: "{color:7}??? {color:1}\nIl y a quelqu'un ?"
text.0162: "Oui, je suis là."
text.018a: "{color:7}??? {color:1}\nÀ l'aide !\nLe sol se soulève."
text.01e8: "Tu plaisantes."
text.0222: "{color:7}??? {color:1}\nNon, c'est vrai.\nJ'entends des machines."
text.029a: "Des machines ? Ça doit venir\nde la cachette d'Ogremon."
text.0312: "{color:7}??? {color:1}\nTu as dû faire une bêtise\nlà-bas, non ?"
text.0386: "J'en ai fait beaucoup. C'est\npeut-être l'ascenseur... Je\nretourne voir à la cachette."
text.0442: "{color:7}??? {color:1}\nMerci."
