text.00a8: "Tu tombes à pic ! J'ai un\nservice que toi seul\npeux me rendre."
text.0146: "Qu'est-ce que c'est ?"
text.0164: "Je viens de sentir le même\nmal qu'avec Analogman\net Machinedramon."
text.01f8: "Je sais d'où il vient."
text.0236: "Encore ? Bon, compte sur moi !"
text.0272: "Merci. Au fait..."
text.02b8: "Il paraît que tu as battu\nMachinedramon !"
text.02fe: "Oui, mais je ne comprends\npas. On aurait dit la\nmalédiction d'Analogman."
text.0386: "Sa rancune était si forte.\nOn aura peut-être la paix."
text.03fa: "Si Machinedramon revient,\non le battra encore."
text.0460: "On peut compter sur toi.\nIl a poussé à la ferme,\nc'est pour toi."
text.04f0: "Ouah ! Un {color:6}Melon\nchaîne{color:1} ?"
text.0548: "J'ai trop d'objets."
text.0588: "Merci !"
text.05be: "Te voilà !\nC'est une chose que je ne\npeux demander qu'à toi."
text.0636: "N'aie crainte, je suis là.\nTu veux dire\nqu'Analogman est revenu ?"
text.06a6: "Je sens son mal, mais\nje ne sais pas où il est."
text.0712: "Compte sur moi ! Je vais le\ntrouver et m'en occuper."
text.0784: "Merci.\nAu fait..."
text.07ea: "Me revoilà, et je compte\nrebâtir Cité File avec\nl'aide de {color:10}{partner}{color:1}."
text.0882: "Je veux construire des\nboutiques utiles\nà toi et à {color:10}{partner}{color:1}."
text.0900: "Tu devrais explorer la Forêt\nNatale, juste à côté."
text.099c: "Tiens, pour toi. Bonne chance."
text.09de: "J'ai eu plein d'objets !"
text.0a26: "Pour voir tes objets,\nappuie sur {color:5}× {color:1}..."
text.0a6a: "... puis choisis « Objets »\net regarde avec\n{color:6}△ {color:1}."
text.0ae2: "On dirait que Yuramon a\nrécolté d'autres rumeurs."
text.0b56: "Il paraît que Yuramon\na de nouvelles rumeurs."
text.0bb2: "La ville commence à\ngrandir, et il paraît\nqu'elle change."
text.0c30: "Je vais t'apprendre le bon\nsens de notre monde."
text.0ca0: "Une journée dure 24 heures,\navec le matin, le jour\net la nuit."
text.0d32: "Le rythme te paraîtra\npeut-être rapide."
text.0d76: "Une année dure 30 jours.\nUn mois ? C'est quoi ? Les\nsaisons ? Ça se mange ?"
text.0e14: "Bien sûr qu'on a de l'argent.\nL'unité, c'est le Bit. On n'a\njamais trop d'argent."
text.0eb6: "Sur cette île, quand on dit\n« la ville », c'est ici."
text.0f24: "Mais il y a d'autres\npetits villages."
text.0f84: "Sur l'horloge, le point jaune\nindique les heures et\nl'aiguille, les minutes."
text.100a: "En haut, minuit,\nen bas, midi."
text.1050: "La partie rouge à gauche,\nc'est la fin d'après-midi,\nde 16 h à 20 h."
text.10f0: "La partie violette à droite,\nc'est le matin,\nde 4 h à 8 h."
text.118a: "Les Digimon sont actifs à\ncertaines heures."
text.11e6: "La plupart se lèvent le\nmatin et dorment la nuit,\nmais d'autres font l'inverse."
text.1286: "Si tu ne trouves pas le\nDigimon voulu, essaie\nà une autre heure."
text.1340: "Parle à Tsunomon et Yuramon\naussi souvent que possible."
text.13bc: "Je vais te parler du\nniveau de dresseur."
text.140a: "Avec un haut niveau, quand\nton Digimon s'éteint,"
text.147c: "ton Digimon suivant aura\nde meilleurs paramètres."
text.14de: "Au début,\nil ne monte pas beaucoup,"
text.152e: "mais élève-le avec régularité\net il progressera."
text.15b2: "Quand tu utilises ton coup\nfinal, appuie très vite\nsur L et R."
text.1658: "Jauge finale pleine,\nles dégâts sont doublés\npar rapport à vide !"
text.1704: "Je vais te parler de la vie\nd'un Digimon."
text.1754: "Quand ton Digimon a faim,\nil te le dit."
text.17ac: "Il doit aussi faire ses\nbesoins. Veille à ce qu'il\naille aux toilettes."
text.182e: "Le Digimon a sommeil et\ndoit dormir, mais c'est\ntoi qui le couches."
text.18b8: "Ne le fais pas veiller\ntrop longtemps."
text.190a: "Il peut se fatiguer, tomber\nmalade ou se vexer.\nIl est un peu fragile."
text.198c: "Les Digimon sont sauvages,\nalors félicite-les ou\ngronde-les."
text.1a16: "Quoi que tu fasses,\nfais attention à ce que\nfait ton Digimon."
text.1aba: "Tu es réveillé...\nDésolé."
text.1b28: "C'est quoi, cette machine ?"
text.1b64: "Ça ? C'est une\n{color:4}machine de sauvegarde\ndes données de combat{color:1}."
text.1be6: "Avec cette machine, tu peux\nsauvegarder les données de\ncombat de ton partenaire."
text.1c7c: "Appuie sur {color:6}△ {color:1},\net la machine te dira\nquoi faire."
text.1d02: "Tu veux utiliser la\n{color:4}machine de sauvegarde\ndes données de combat{color:1} ?"
text.1d84: "Oui\nNon"
text.1dce: "Je ne vois pas Punimon, mais\nje vais me reposer ici."
text.1e3a: "{color:7}Punimon {color:1}\nJe suis Punimon ! Tu ne veux\npas te reposer un peu ?"
text.1eb0: "{color:7}Punimon {color:1}\nUne heure de repos rend HP,\nMP et baisse la fatigue."
text.1f34: "Se reposer\nNe pas se reposer"
