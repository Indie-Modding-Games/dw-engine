text.0034: "Je m'occupe de toi !"
text.006a: "Je m'occupe de toi !"
text.00a0: "Je m'occupe de toi !"
text.0102: "Qu'est-ce que ça dit ?"
text.012c: "Retourne à l'endroit où\nl'idiot t'a donné\nles points."
text.01d8: "J'ai utilisé la {color:6}\nclé du frigo. {color:1}"
text.0234: "Je ne la vois pas."
text.025e: "Il y a une note."
text.0284: "Retourne à l'endroit où\nl'idiot t'a donné\nles points."
text.0310: "Je devrais suivre cette note."
text.036a: "C'est un frigo."
text.039a: "Il est fermé à clé. Je n'ai\njamais vu un frigo à clé."
