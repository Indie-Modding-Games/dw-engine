text.0038: "Qu'est-ce que c'est ?\nDes livres que je sais lire ?"
text.00ba: "Non. Aucun que je sais lire."
text.00e8: "Ouah ! Un livre avec\nune couverture géniale !"
text.012a: "Je le prends\nMieux vaut pas"
text.0190: "J'ai touché le beau livre."
text.01c0: "Hein ?"
text.01f8: "Ouah !"
text.020e: "C'est peut-être un piège...\nLaisse-le !"
