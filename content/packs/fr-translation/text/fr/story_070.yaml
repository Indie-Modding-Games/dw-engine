text.00ac: "Me revoilà."
text.00da: "Salut !"
text.00fa: "Si on continue comme ça, on\nva tourner en rond."
text.0168: "Je devrais attendre ici."
text.01c4: "Qui est là ?"
text.01e0: "Pas question."
text.0206: "Ahhh !"
text.0228: "Attends-moi !"
text.027a: "Encore ! Attends !"
text.02d6: "Encore ! Attends !"
text.0332: "Encore ! Attends !"
text.038e: "Encore ! Attends !"
text.04c6: "Je vais peut-être attendre."
text.04ec: "Attendre\nY aller"
text.0524: "Allez, {color:10}{partner}{color:1},\nchasse Biyomon !"
text.05aa: "Il s'est trompé d'endroit !"
text.0612: "Je vais peut-être attendre."
text.0638: "Attendre\nY aller"
text.0670: "Allez, {color:10}{partner}{color:1},\nchasse Biyomon !"
text.06f6: "Il s'est trompé d'endroit !"
text.075c: "Je vais peut-être attendre."
text.0782: "Attendre\nY aller"
text.07ba: "Allez, {color:10}{partner}{color:1},\nchasse Biyomon !"
text.0840: "Il s'est trompé d'endroit !"
text.08a6: "Je vais peut-être attendre."
text.08cc: "Attendre\nY aller"
text.0904: "Allez, {color:10}{partner}{color:1},\nchasse Biyomon !"
text.098a: "Il s'est trompé d'endroit !"
text.09ea: "L'embuscade a réussi !"
text.0a26: "À l'aide !"
text.0a4a: "Pas de panique. Ce n'est\npas nous, les méchants."
text.0aac: "C'est toi, le fameux\nkidnappeur de Digimon ?"
text.0b02: "Je crois que tout le monde\nse trompe."
text.0b5e: "{color:6}{tamer}{color:1} a tenté\nde les convaincre."
text.0ba0: "Je vois. C'est mon erreur."
text.0bd6: "Je vais aller en ville."
text.0c66: "Biyomon rejoint la ville !"
text.0cc4: "Viens m'attraper !"
text.0cfa: "Tu es courageux !"
text.0d2a: "Ouah !"
text.0d48: "Je suis le premier !"
text.0d72: "Je suis fort.\nTu ne fais pas le poids !"
text.0dc8: "Te fâche pas si je gagne."
