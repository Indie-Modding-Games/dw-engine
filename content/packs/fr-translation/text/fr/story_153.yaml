text.0010: "Je t'attendais !"
text.0044: "Tu retrouves\ntes esprits ?"
text.0092: "Je me sens\nun peu bizarre."
text.00d8: "Hé,\nc'est sérieux, tu sais ?"
text.011e: "L'usine est fermée, alors\nj'ai plein de temps libre.\nJe vais t'aider !"
text.01b0: "Il a retrouvé la raison, mais\nil a toujours l'air fou !\n? il a toujours l'air fou !"
text.024c: "Eh bien, excuuuuuse-moiii.\nÀ plus tard !"
text.02d6: "Giromon rejoint la ville !"
