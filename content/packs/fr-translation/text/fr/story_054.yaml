text.0056: "Myotismon est parti."
text.009a: "Oh !"
text.00b8: "J'ai trouvé une clé. Elle\nouvre peut-être ces portes."
text.0128: "J'ai utilisé la\n{color:6}Clé manoir{color:1} !"
text.016e: "Je dois me débarrasser\nde quelque chose."
text.01e2: "J'ai utilisé la\n{color:6}Clé manoir{color:1} !"
text.0246: "Ça ne s'ouvre pas.\nC'est fermé à clé."
text.02d8: "J'ai utilisé la\n{color:6}Clé manoir{color:1} !"
text.033c: "Ça ne s'ouvre pas.\nC'est fermé à clé."
text.03b0: "Miam, miam..."
text.03d0: "Bon."
text.03e6: "Écoute-moi."
text.0408: "Miam, miam..."
text.0430: "Mes gars n'obéissent plus."
text.0470: "Je crois qu'ils ne se\nrappellent plus mes ordres."
text.04ca: "Ils ne comprennent plus.\nIls devraient m'apporter\nmes repas, mais..."
text.0560: "Miam, miam..."
text.0580: "Pendant que je travaillais,\nils ne m'ont rien apporté,\nalors j'ai oublié de manger."
text.0614: "Tu es trop absorbé par\nton travail."
text.0662: "J'ai tellement honte."
text.0690: "Je crois qu'il y a un\nproblème au manoir."
text.06e6: "Des soucis sur l'île ?\nTout le monde est comme\nmes gars ?"
text.0754: "Oui, ils perdent tous\nla mémoire."
text.07a6: "Tu crois que quelqu'un\nest derrière tout ça ?"
text.07fa: "Hmm ?"
text.080a: "Que puis-je faire ?"
text.082e: "On bâtit une ville pour\nunir le cœur des Digimon."
text.089e: "On cherche des amis."
text.08da: "Que puis-je faire ? Mes gars\nne savent que se battre."
text.0940: "Je ne peux pas les laisser."
text.0978: "Je vois."
text.098c: "Laisse-moi y réfléchir.\nJe suis vraiment désolé."
text.09e0: "Je reviendrai.\nN'oublie pas de manger."
text.0b9c: "Merci pour ton aide.\nJe vais te montrer mes\nrecherches."
text.0c02: "Parfois, si MetalGreymon\ns'éteint, il digivolue\nen SkullGreymon.{stop}"
text.0cac: "Bakemon, Devimon et\nPhoenixmon digivoluent\naussi de cette façon."
text.0d22: "J'ignore qui ils étaient à\nla naissance. Les tableaux\nd'évolution ne le disent pas."
text.0dc6: "Les matchs ont fait\ndu bien à mes gars."
text.0e0a: "Un match, ça repose\nde mes recherches."
text.0e64: "Sur quoi portent tes\nrecherches ?"
text.0eae: "Une Arène a été\nconstruite en ville !"
text.0efc: "Mes gars pourraient-ils\naider ?"
text.0f40: "Oui, ils peuvent y aller\naussi fort qu'ils veulent."
text.0fa4: "Mes gars vont de plus\nen plus mal. Il est temps\nde quitter le manoir."
