text.002c: "J'ai réparé le panneau\nde l'entrée."
text.0086: "Il fait chaud ! Fais quelque\nchose !"
text.00c8: "Qu'est-ce qui se passe ?"
text.00f4: "Il fait trop chaud !\nJe n'en peux plus !"
text.0178: "La chaleur m'a rendu\nbizarre."
text.01c8: "Je sais qu'il fait chaud,\nmais... du calme, mon vieux !"
text.0218: "Plus on creuse, plus il fait\nchaud. Le tunnel est\ndans un volcan."
text.02a0: "Je ne crois pas que ce soit\nla seule raison. Il y a\npeut-être un feu tout près."
text.0330: "Hmmm"
text.0340: "Je n'ai pas le choix.\nJe dois supporter la chaleur\net continuer à creuser."
text.03d0: "On va chercher la cause.\nCe serait super si le\ntunnel débouchait."
text.045a: "Tu es sympa.\nJe me dépêche de\ncreuser ce tunnel !"
text.050e: "Aujourd'hui, c'est moi\nqui fais la cuisine."
