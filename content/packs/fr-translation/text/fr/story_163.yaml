text.034c: "Bakke. Bah Kkea."
text.0374: "Je ne le comprends toujours\npas."
text.03dc: "Je vois. Tu fais\ndes rondes pour nous ?!"
text.0438: "Regarde ! C'est mon\npanneau d'affichage."
text.048a: "La ville a besoin d'infos,\nalors j'ai décidé de faire\nun journal ! Qu'en dis-tu ?"
text.053e: "Compte sur moi pour\nréunir des infos."
text.059e: "Tu lis mon journal."
text.05f0: "Ah, c'est frais et agréable."
text.0630: "Quand on est à l'aise,\nc'est agréable."
text.069e: "Que penses-tu de ma boutique ?"
text.06de: "Je ne suis pas doué pour\nvendre, mais personne d'autre\nne peut le faire."
text.0766: "Amène plein de Digimon ici !"
text.07c0: "Alors, qu'en penses-tu ?"
text.07f8: "{color:7}Coelamon {color:1}\nOn a décidé de s'entraider\net de vendre ces objets."
text.0912: "Mmmm. J'ai vu de bonnes\nplantes, alors j'ai mangé."
text.0986: "La ville est devenue\ntrop venteuse, je crois."
text.09ee: "Oh, l'autre jour, j'ai trouvé\nun {color:6}Champi joie {color:1}\npar hasard."
text.0a6c: "Il paraît que c'est rare."
text.0aa4: "On m'a aussi parlé d'un\n{color:6}Champi luxe{color:1}.\nCe serait bien d'en trouver."
text.0b3e: "La {color:6}Pomme bleue {color:1}\nde la Forêt Natale\nest vraiment bonne."
text.0bb0: "La {color:6}Banane orange {color:1}\nde la Jungle Tropicale\nest vraiment bonne."
text.0c2c: "La {color:6}Grosse baie {color:1}\ndu Mont Panorama\nest vraiment bonne."
text.0c98: "La {color:6}Noix sucrée {color:1}\nde la Savane Engrenage\nest vraiment bonne."
text.0d02: "Le {color:6}Super légume {color:1}\ndu Cimetière d'Overdell\nest bon."
text.0d70: "La {color:6}Baie rouge {color:1}\ndu Tombeau Dino Antique\nest bonne."
text.0dda: "La {color:6}Figue cactus {color:1}\ndu Grand Canyon\nest bonne."
text.0e4e: "Le {color:6}Digiananas {color:1}\ndu Bois Brumeux\nest bon."
text.0ff6: "J'ai un truc à te dire."
text.102c: "Qu'est-ce que c'est ?\nÀ plus !"
text.106c: "Tu as vu le Pont de l'Est\nréparé ? On a tant travaillé."
text.10f6: "On répare le Pont Digital.\nPatiente un peu."
text.1166: "Il paraît qu'un Digimon rare\nvit à la Pointe Coela (sud)."
text.11e0: "On dit qu'il apparaît chaque\njour en fin d'après-midi."
text.125c: "Dis, tu savais qu'il y a\nun pont cassé à l'est\nde la ville ?"
text.12f0: "On ne pensait pas que\nquelqu'un s'en servirait,\nalors on l'a laissé."
text.138e: "On pense le réparer\nnous-mêmes."
text.13e8: "En attendant, va voir\nl'ouest et le sud.\nPuis reviens me voir."
text.1496: "Tu es allé au Marais Geko ?\nUn Digimon farceur\nrisque de te piéger."
text.151c: "Quand un Digimon digivolue,\nsouviens-toi, ses jeux\nde techniques changent."
text.15ae: "Eh bien..."
text.15d6: "Qu'en dis-tu ? J'ai allumé\nla lumière. Assez clair ?"
text.164e: "Rendons notre ville\npropre et joyeuse !"
text.16a6: "La lumière change\nquelque chose ?"
text.16f0: "Bah, tout dépend de\nta façon de voir."
text.1746: "Je suis le plus puissant."
text.1780: "Je ne me considère pas\ncomme perdant. Viens à\nl'Arène, et tu verras."
text.1824: "Hé, {color:6}{tamer}{color:1}.\nJe surveille les types\nlouches en ville."
text.18a2: "Qu'y a-t-il ? Je ne te\ndérange pas, si ?!"
text.192a: "Bienvenue dans ma boutique !\nJe te fais un bon prix,\n{color:6}{tamer}{color:1}."
text.1998: "Je ne suis pas doué pour\nvendre, les autres non plus."
text.1a02: "Je m'occupe des ventes.\nJ'espère qu'on fera affaire."
text.1a74: "{color:6}{tamer}{color:1}, ramène\nautant de Digimon\nque tu peux."
text.1b10: "Que penses-tu\nde ma boutique ?"
text.1b50: "Je ne suis pas doué pour\nvendre, mais personne ne\nl'est, alors je m'y colle."
text.1bcc: "Ramène vite plein\nde Digimon."
text.1c32: "Alors, qu'en penses-tu ?"
text.1c6a: "{color:7}Coelamon {color:1}\nOn a décidé de s'entraider\net de vendre ces objets."
