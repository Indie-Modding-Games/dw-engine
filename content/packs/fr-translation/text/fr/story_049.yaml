text.004a: "Bienvenue. Je ne t'ai jamais\nvu. D'où viens-tu ?"
text.00c2: "De la ville. En fait, je\nviens d'un autre monde."
text.0120: "Tu comprends ma langue ?"
text.015e: "Oui, je la comprends."
text.017a: "Parfois c'est dur, et\nje ne vends pas grand-chose."
text.01e0: "Je vois."
text.01f4: "Beaucoup de clients\nne viennent plus."
text.0236: "Ça doit être à cause des\nproblèmes de l'île."
text.0288: "Aide-moi un peu."
text.02ba: "Qu'est-ce que c'est ?"
text.02d8: "Tu peux travailler\ndans ma boutique ?"
text.0310: "Ta boutique ?"
text.032c: "Une demi-journée ? Plus tu\nvends, plus je te paie.\nTu connais notre langue."
text.03c8: "Tu risques de perdre\nde l'argent."
text.03fa: "T'en fais pas. Ça me fera\ndu bien. Disons huit heures ?"
text.0474: "J'essaie\nNon merci"
text.05fa: "Dommage. Reviens quand\ntu auras le temps."
text.065e: "Tu veux travailler ?"
text.06b2: "Bon, c'est à moitié fait.\n "
text.0750: "À ce rythme, on ne gagnera\nrien. Fais un effort.\n "
text.07e2: "Les ventes vont bien.\nOn peut gagner un peu."
text.084a: "Je n'avais pas eu autant\nde clients depuis longtemps.\nContinue comme ça !"
text.08d8: "Je crois que c'est l'heure.\nMerci pour ton travail."
text.0944: "Ça aurait pu être mieux,\nmais ce n'était pas si mal.\nN'abandonne pas."
text.09d4: "J'ai gagné 500 Bits !"
text.0a22: "Tu peux mieux faire.\nTravaille plus que ça."
text.0a86: "J'ai gagné 1500 Bits !"
text.0ace: "Ta sagesse, ton caractère\net ton cran, voilà ce qu'il\nfaut pour sauver l'île."
text.0b60: "De quoi tu parles ?"
text.0b9e: "Je te testais pour voir si\ntu es capable de nous sauver."
text.0c18: "C'est important d'être\nbon au combat."
text.0c68: "À part la force, il faut\naussi du courage et\nde la sagesse."
text.0cd4: "On a réussi le test ?"
text.0d06: "Oui, je vais t'aider\nautant que je peux."
text.0d56: "Tu viens en ville ?\nEt ta boutique,\nqu'en feras-tu ?"
text.0dd2: "J'en ouvrirai une plus tard.\nCette boutique a fait\nson temps."
text.0e42: "Monochromon rejoint la ville !"
text.0e7e: "J'ai gagné 2000 Bits !"
