text.00e0: "Infos de l'Arène"
text.0108: "Palmarès\nTournois de classe\nTournois spéciaux"
text.0188: "Nombre de\nvictoires en tournoi {tourn_won}\n{tourn_wins}V {tourn_lost}D"
text.01ea: "Tout le monde peut faire un\ntournoi de classe. Il y en a\nsouvent."
text.025a: "Mais un Digimon d'un stade\nsupérieur ne devrait pas\nfaire les petits tournois."
text.02f2: "Si ton Digimon digivolue\nentre l'inscription et le\ntournoi, il ne peut pas jouer."
text.039c: "Les tournois spéciaux ont\ndes règles d'entrée\net sont plus rares."
text.0434: "S'il n'y a pas assez de\nparticipants en ville,\nil n'a même pas lieu."
text.04cc: "Chaque tournoi n'a lieu\nqu'une ou deux fois par an.\nRegarde le calendrier."
text.058c: "{color:10}{partner}{color:1}, laisse-moi te trouver\nun surnom... un héros\nqui a sauvé le monde."
text.061c: "Voyons voir."
text.0648: "Que dis-tu de\n« {color:10}{partner}{color:1} l'Invincible » ?"
text.0694: "Que dis-tu de\n« {color:10}{partner}{color:1}, héros légendaire » ?"
text.06e8: "Que dis-tu de\n« {color:10}{partner}{color:1} le Grand » ?"
text.0732: "Que dis-tu de\n« {color:10}{partner}{color:1} le Pacificateur » ?"
text.077e: "Que dis-tu de\n« {color:10}{partner}{color:1} le Champion » ?"
text.07c8: "Que dis-tu de\n« {color:10}{partner}{color:1} le Brave » ?"
text.0812: "Que dis-tu de\n« {color:10}{partner}{color:1}, le cool » ?"
text.085e: "Que dis-tu de\n« {color:10}{partner}{color:1} le Puissant » ?"
text.08aa: "Que dis-tu de\n« {color:10}{partner}{color:1} l'Auguste » ?"
text.08f2: "Que dis-tu de\n« {color:10}{partner}{color:1} le Cerveau » ?"
text.0946: "Hé, ces places sont\npour nos invités."
text.0d0e: "- Classe D -\nTournoi pour\nDigimon Novices\n\nUn contre un, trois manches,\nhuit participants.\nConditions ? aucune."
