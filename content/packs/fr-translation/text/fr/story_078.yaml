text.006e: "Quelqu'un voulait devenir\nmarchand. Il paraît qu'il a\nune boutique quelque part."
text.011c: "Il est plus utile que moi."
text.015c: "Pourquoi le temps est-il\ndifférent ici ?"
text.01ba: "Il fait sûrement bon vivre\nici, mais..."
text.0240: "J'ai observé les environs\ndepuis le ciel."
text.0292: "Au nord, il y a de la glace\net de la neige. Vivre dans un\nendroit si froid, c'est fou."
text.0332: "J'ai observé les environs\ndepuis le ciel."
text.0384: "Il y a une petite ville en\nfer à l'ouest."
text.03e6: "Mais l'entrée et la sortie\nsont fermées. Moi, j'y vole."
text.0460: "J'ai observé les environs\ndepuis le ciel."
text.04b2: "Il y a des groupes de Digimon\navec des cornes ou des\ngriffes."
text.0522: "Il paraît qu'ils creusent\nleurs maisons dans le bois."
text.0594: "J'ai observé les environs\ndepuis le ciel."
text.05e6: "Au nord-ouest, il y a une\nforêt avec des bâtiments."
text.0644: "C'est très loin."
text.066e: "J'ai observé les environs\ndepuis le ciel."
text.06c0: "Tu as passé le Grand Canyon ?\nC'est un vrai labyrinthe."
text.073a: "J'ai observé les environs\ndepuis le ciel."
text.078c: "Je ne vois pas le centre de\nl'île. Rien que des nuages."
text.0812: "Tu le sais déjà."
text.0858: "Ici, le temps est lent.\nUne demi-journée ici, c'est\nune journée là-bas."
text.08de: "Pour ceux qui veulent se\nreposer, c'est parfait."
text.094e: "Le temps passe vite dans\nl'Ère Rapide.\nC'est juste après ici."
text.09d0: "Là-bas, deux jours passent\nau lieu d'un."
text.0a26: "Ton Digimon grandit plus\nvite, mais s'éteint aussi\nplus vite."
text.0aaa: "Distributeur"
text.0ad0: "Qu'est-ce qui va sortir ?\n200 Bits chaque.\nJ'en achète ?"
text.0b54: "Essayer\nAnnuler"
text.0b96: "J'ai pas assez d'argent."
text.0bec: "De la {color:6}viande {color:1}est sortie !"
text.0c24: "J'ai trop d'objets.\nJe dois en jeter."
text.0cac: "Un {color:6}Petit\nsoin {color:1}est sorti !"
text.0d0a: "J'ai trop d'objets.\nJe dois en jeter."
text.0d92: "Un {color:6}steak {color:1}\nest sorti !"
text.0dce: "J'ai trop d'objets.\nJe dois en jeter."
text.0e56: "Une {color:6}Disquette MP {color:1}\nest sortie !"
text.0e9c: "J'ai trop d'objets.\nJe dois en jeter."
