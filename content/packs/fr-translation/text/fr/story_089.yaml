text.0072: "Laisse tes objets de valeur."
text.00b2: "Je vais te couvrir de glace !"
text.00f4: "Tu ne peux aller ni à droite\nni à gauche."
text.0140: "Je vais te changer\nen statue de glace !"
text.019e: "Tu vas voir !"
text.01d0: "Tu veux mourir de froid ?"
text.0216: "Ouest : Bois Brumeux\nEst : Plage Iceberg"
