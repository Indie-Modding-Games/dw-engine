text.0052: "Taaa !"
text.0072: "Tiens, prends ça !"
text.00ae: "Shaaaa !"
text.00d2: "Buooon !"
text.011e: "Qui es-tu ? Personne ne\nviendra semer le trouble ici !"
text.0194: "Pas d'inquiétude. On ne fait\nque passer pour sauver\nl'île."
text.0220: "Je ne te crois pas. Va-t'en !"
text.0260: "Attends une seconde."
text.02cc: "Tu serais par hasard... ?"
text.030e: "Je te l'avais dit !"
text.0336: "Pardon. On a rarement de la\nvisite, alors je m'emballe\navec mon nouveau travail."
text.03d2: "Ton travail ?"
text.03e2: "Je garde un endroit appelé\nRégion Dino Antique."
text.0448: "C'est une région inexplorée."
text.0484: "Tu me la fais visiter ?"
text.04bc: "La Région Dino Antique est\ndivisée en deux parties."
text.0520: "Là où on vit, c'est\nl'Ère Glaciaire."
text.057a: "C'est un endroit spécial où\nle temps passe lentement."
text.05de: "Le temps passe lentement ?"
text.0608: "L'autre endroit, c'est\nl'Ère Rapide."
text.0656: "Elle est dangereuse et plus\nloin que l'Ère Glaciaire."
text.06c8: "C'est dangereux, car le\ntemps y passe très vite."
text.071c: "La terre est nue. Des os et\ndes fossiles partout."
text.0782: "Parce que le temps y passe\nplus vite qu'ailleurs ?"
text.07fc: "Exact. N'y reste pas trop."
text.083c: "Comme je bloque le passage,\ntu ne peux pas y aller."
text.08a4: "Tu as perdu."
text.08c2: "Pas de chance ! Ça ne\nm'arrive pas souvent."
text.0918: "Ah bon ?"
text.093c: "Je dois rentrer chez moi.\nDemande aux autres Digimon\nsi tu as des questions."
