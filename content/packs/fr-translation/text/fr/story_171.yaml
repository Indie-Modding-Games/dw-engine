text.0034: "Bienvenue ! Mon nouveau\nmétier : gardien d'objets.\nJe garde les objets des gens."
text.00c0: "Je garde tes objets\ngratuitement, service spécial."
text.0144: "Sur la digivolution...\nLe stade qui suit le\nDigimon Champion..."
text.01e4: "C'est le Digimon Ultime.\nIl ne digivolue pas toujours\naprès le stade Champion."
text.0286: "Pour digivoluer, certaines\nconditions doivent être\nremplies exactement."
text.030e: "Mais une fois Digimon\nUltime, son espérance\nde vie augmente."
text.03a8: "Mais s'il digivolue en\nmangeant un objet, son\nespérance de vie reste égale."
text.0464: "Encore la digivolution.\nLes conditions."
text.04c6: "D'abord, il paraît que le\npoids doit être proche\ndu poids visé."
text.0560: "Et plus les paramètres sont\nélevés, mieux c'est."
text.05b8: "Mais selon le paramètre\nle plus élevé, le\nrésultat change."
text.0644: "Pour les erreurs de soin,\nparfois, il vaut mieux\néchouer exprès."
text.06d8: "Selon la digivolution\nvisée, certaines conditions\ndoivent être remplies."
text.0768: "Certaines situations peuvent\nprovoquer une digivolution."
text.07da: "Comme le nombre de combats\nou sa discipline."
text.0850: "Si ces conditions sont\nremplies, même sans les\nautres, il peut digivoluer."
text.08fc: "Jiji m'a dit que\n{color:10}{partner}{color:1} va digivoluer."
text.0956: "Du Digimon Bébé au\nDigimon Apprenti,\nil ne faut que six heures."
text.09e2: "De là au Digimon Novice,\nil faut environ un jour\npour digivoluer."
text.0a68: "Puis au Digimon Champion,\nil faut environ trois\njours pour digivoluer."
text.0b02: "Et quel était le stade\nsuivant ? J'ai oublié,\nmais il y en a d'autres."
text.0b82: "La digivolution dépend\ndu poids, des paramètres\net des erreurs de soin."
text.0c0a: "Je ne comprends pas\ntrès bien. Je demanderai\nà Jiji à l'occasion."
