text.0060: "Tu tombes à pic ! J'ai un\ngrand service à te demander,\net toi seul peux le rendre."
text.010c: "Qu'est-ce que c'est ?"
text.012a: "C'est le même mal que\nj'ai senti chez Analogman\net Machinedramon."
text.01a6: "Mais je ne sais pas\nd'où il vient."
text.01fe: "D'accord, compte sur moi !"
text.0236: "Merci. Au fait..."
text.0282: "Il paraît que tu as\nbattu Machinedramon !"
text.02d2: "Oui, mais je ne comprends\npas. On aurait dit la\nmalédiction d'Analogman."
text.035a: "Sa rancune était si forte.\nOn aura peut-être la paix."
text.03ce: "Si Machinedramon revient,\non le battra encore."
text.0436: "On peut compter sur toi.\nVoici pour te remercier.\nIl a poussé à la ferme."
text.04d8: "Ouah ! Un {color:6}Melon\nchaîne{color:1} ?"
text.0530: "J'ai trop d'objets."
text.0570: "J'accepte avec joie, merci !"
text.05c8: "Oh, te revoilà !\nC'est une chose que je ne\npeux demander qu'à toi."
text.0648: "D'accord. Tu veux dire\nqu'Analogman est revenu ?"
text.0698: "J'ai senti son mal, mais\nje ne sais pas où il est."
text.06fc: "D'accord, compte sur moi !\nJe vais le trouver et\nm'en occuper."
text.0780: "Oh, merci. Au fait..."
text.0800: "Tu es réveillé. Désolé."
text.086a: "C'est quoi, cette machine ?"
text.08a6: "C'est une {color:4}machine de\nsauvegarde des données de\ncombat{color:1}."
text.0914: "Avec cette machine, tu peux\nsauvegarder les données de\ncombat de ton partenaire."
text.09aa: "Il suffit d'appuyer sur\n{color:6}△ {color:1}et la machine\nte dira quoi faire."
text.0a4e: "Tu veux utiliser la\n{color:4}machine de sauvegarde\nde combat{color:1} ?"
text.0ace: "Oui\nNon"
text.0b04: "On dirait que Yuramon a\nrécolté d'autres rumeurs."
text.0b78: "Il paraît que Yuramon\nconnaît de nouvelles rumeurs."
text.0bda: "La ville commence à\ngrandir et à changer\nmaintenant qu'on est là."
text.0c5a: "{color:6}{tamer}{color:1}, tu as une\nfaçon très différente\nde vivre l'aventure."
