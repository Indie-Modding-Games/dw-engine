text.0022: "Ugh !"
text.0032: "..."
text.0040: "Tu es sérieux ?!"
text.0072: "Disparu. C'était un piège ?"
text.00f0: "J'ai réussi, je ne sais\ncomment."
text.0124: "Hein ?"
text.013a: "Qu'est-ce que c'est ?"
text.0162: "Je me suis évanoui d'un coup\net... Oh, désolé !"
text.0228: "Hein ? C'était quoi ?\nLa malédiction d'Analogman ?"
