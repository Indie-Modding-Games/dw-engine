text.002a: "Je m'y connais en objets."
text.0056: "Il existe 128 sortes\nd'objets en tout."
text.00d0: "32 sont de la nourriture."
text.00fe: "Les objets rares poussent\ndans certaines zones et\nnulle part ailleurs."
text.018e: "Par exemple, on trouve\nla Pomme bleue dans\nla Forêt Natale."
text.0204: "Ces aliments ont des effets\nspéciaux, alors choisis bien\nle moment pour les manger."
text.02b8: "Parlons maintenant des\nobjets de digivolution."
text.030c: "Les objets de digivolution\nfont digivoluer les Digimon,\ncomme leur nom l'indique."
text.0392: "Il y a beaucoup de sortes\nd'objets de digivolution."
text.0402: "Chaque sorte fait\ndigivoluer le Digimon en\nun Digimon différent."
text.0494: "Par exemple, avec une\nGriffe grise, le Digimon\ndeviendra Greymon."
text.0528: "Les objets de digivolution\nsont légendaires, certains\nsont uniques."
text.05b2: "Mais parfois, il n'y a pas\nde bonus de capacités comme\nen digivolution normale."
text.0654: "Le bonheur baisse aussi,\nils ne sont pas parfaits."
text.06ca: "En même temps, c'est bien de\ndigivoluer en le Digimon\nque tu veux."
text.0772: "Tu ne peux digivoluer que\ndepuis le stade juste avant\nle Digimon voulu."
text.081a: "Alors fais attention."
text.087c: "Hé ! Hola amigos !"
text.08a4: "C'est quelle boutique ?\nC'est la mienne ?\nAchète quelque chose."
text.0942: "Regarde, {color:6}{tamer}{color:1} ! Ma\nboutique vend des trucs\ncurieux. Reviens souvent."
text.09f6: "Ce que tu vois ici n'a\nrien d'ordinaire,\nalors fais tes achats !"
text.0a9c: "Salut, l'inconnu ! Je savais\nque tu viendrais, {color:6}{tamer}{color:1}.\nNe fais pas cette tête."
text.0b1c: "Sauras-tu maîtriser mes\nobjets ? Ça dépend de ton\ntalent de dresseur."
text.0be2: "Où suis-je ?\nJ'adore le noir, et cette\nboutique le montre bien !"
text.0c88: "Bien, {color:6}{tamer}{color:1}, merci\nd'être venu. Tant que tu es\nlà, achète donc un truc."
text.0d48: "Hé, {color:6}{tamer}{color:1}. Te voilà !\nAllez, prends quelques-uns\nde mes objets très utiles."
text.0dec: "Salut, l'inconnu !\nJe savais que tu viendrais,\n{color:6}{tamer}{color:1}. Ne fais pas cette tête."
text.0e6c: "Sauras-tu maîtriser mes\nobjets ? Ça dépend de ton\ntalent de dresseur."
