text.003c: "Où vas-tu ?"
text.007a: "Attends !"
text.009a: "Dopeeee !"
text.00c0: "Gguhh Heyee Hee !"
text.00f6: "Qui es-tu ?"
text.0114: "Je suis MetalMamemon, invaincu\nen 99 combats !\nTu seras le 100e !"
text.01b0: "Je ne crois pas qu'un\n{color:6}{tamer}{color:1}puisse s'enfuir."
text.0214: "D'accord, battons-nous\nDésolé, à plus"
text.0294: "Tu es plus fort que\nje ne pensais."
text.02d4: "Tu es un digne rival !"
text.0306: "Je te battrai un jour !"
text.0372: "MetalMamemon est en ville !"
text.03c6: "Je savais que tu te\ndégonflerais. On se revoit\nquand tu auras du cran."
