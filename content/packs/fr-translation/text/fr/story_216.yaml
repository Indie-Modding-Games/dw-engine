text.0024: "Bonjour, {color:6}{tamer}{color:1}.\nSurprise ! J'ai ouvert\nune clinique !"
text.007a: "Pour soigner maladies et\nblessures. Ce n'est pas\ngratuit, mais pas cher."
text.0130: "Ton Digimon n'a pas l'air\nbien. Tu dois prendre\nsoin de sa santé."
text.01be: "Je le soigne tout de suite\navec une réduction.\n300 Bits."
text.025e: "Pas assez de Bits ?\nPaie ce que tu peux."
text.0304: "Tout va bien maintenant.\nFais attention à l'avenir."
text.038a: "Ton Digimon a l'air en forme.\nQue te faut-il ?"
text.03e6: "Ôter sa fatigue\nVendre un médicament\nRien"
text.046c: "La fatigue de {color:10}{partner}{color:1} est très\nhaute, il doit se reposer."
text.04ec: "{color:10}{partner}{color:1} est fatigué.\nIl doit se reposer."
text.0548: "{color:10}{partner}{color:1} semble un peu\nfatigué. Il ne devrait\npas trop forcer."
text.05c2: "{color:10}{partner}{color:1} va bien.\nSurveille sa fatigue."
text.0634: "Il se sent plus détendu ?"
text.066e: "Il te faut autre chose ?"
text.06a0: "Encore du repos\nVendre un médicament\nRien"
text.0706: "Ça devrait aller."
text.0732: "Bandage : 400 Bits\nMédicament : 1200 Bits\nNe rien acheter"
text.07c0: "Quand il ne va pas bien,\nviens me voir."
text.0826: "S'il est encore fatigué,\nentraîne-le moins, et fais-le\nmanger et dormir bien."
text.08c8: "Rester trop longtemps au\nfroid ou au chaud\npeut rendre malade."
text.0958: "Un bandage ne sert qu'aux\nblessures."
text.09b2: "Le médicament soigne les\nmaladies, mais ne réduit\npas la fatigue."
text.0a50: "Avec peu de HP à la fin d'un\ncombat, le Digimon peut\nse blesser facilement."
text.0ae8: "Garder bonheur et fatigue\nà un bon niveau mène\nà une longue vie."
text.0b8c: "Tu n'as pas assez de Bits.\nJe ne peux pas te le vendre."
text.0c0e: "Tu as trop d'objets."
text.0c62: "Tu n'as pas assez de Bits.\nJe ne peux pas te le vendre."
text.0ce4: "Tu as trop d'objets."
text.0d28: "Il te faut autre chose ?"
text.0d5a: "Ôter sa fatigue\nVendre un médicament\nNon, rien"
