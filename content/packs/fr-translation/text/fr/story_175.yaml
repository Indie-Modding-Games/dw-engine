text.0050: "Bienvenue dans mon restaurant."
text.0088: "J'ai décidé d'être\ngérant et chef\nde ce restaurant."
text.0104: "Savoure ma cuisine flambée\nautant que tu veux."
text.0180: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nvous ne goûtez pas\nma cuisine ?"
text.01d6: "Ce n'est pas un objet, c'est\nde la vraie cuisine. C'est\nmon talent secret."
text.027c: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1} !\nJ'ai décidé de vivre de\nla cuisine. Je suis doué !"
text.02f6: "Viens te détendre et\nmanger à mon restaurant\nun jour."
text.037e: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}.\nMon restaurant a enfin\nouvert !"
text.03d4: "Goûte le dessert glacé !\nC'est ma spécialité."
text.044a: "{color:6}{tamer}{color:1}, j'ai décidé\nde travailler comme chef\ndans ce restaurant."
text.04c2: "Tu peux savourer un\nbon plat chaud ici."
text.0520: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nje suis cuisinier pro !"
text.0572: "Si tu veux goûter ma\ncuisine, viens plutôt\nle matin !"
text.0614: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1} !\nJ'ai décidé de vivre de\nla cuisine. Je suis doué !"
text.068e: "Tu peux manger ma cuisine\nspéciale tôt le matin\net en pleine nuit."
text.0750: "Hé, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1} !"
text.0770: "J'ai décidé d'aider\nce restaurant.\nOn me laisse faire le dessert."
text.07ee: "Je suis très fier de\nmon dessert.\nGoûte-le, d'accord ?"
text.08a8: "Ouah ! Hé, {color:6}{tamer}{color:1} !\nC'est quoi, cette machine ?"
text.08fa: "N'aie pas peur ! C'est un\njuke-box qui me fait battre\nle cœur ! Super !"
text.098a: "Bouge-toi un peu !\nAllez, lâche-toi ! J'attends\nta commande !"
