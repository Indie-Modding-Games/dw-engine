text.0048: "Grrun."
text.005a: "Grrun.ru.ru.."
text.007e: "Quelque chose a repris vie !"
text.00ce: " ? "
text.00dc: "Je vivais en ville avant.\nTu sens la ville."
text.0156: "Ouah !"
text.0166: "Ça fait peur. J'ai quitté\nla ville et perdu la mémoire."
text.01ca: "Mais grâce à toi,\nje me souviens de tout."
text.022a: "Je retourne en ville,\nd'accord ?"
text.0274: "Bien sûr. Je suis sûr que\nla ville est plus animée\nqu'avant."
text.02f8: "Vraiment ? Super !\nJe vais faire de mon mieux !"
text.037c: "Betamon rejoint la ville !"
text.03c2: "C'est mon territoire !"
text.0402: "Hé hé hé. D'accord !"
text.043c: "Regarde bien !"
