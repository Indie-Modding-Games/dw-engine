text.00c2: "J'ai mal à l'aile."
text.00ee: "Qu'est-ce qui s'est passé ?"
text.0112: "Je me suis blessé l'aile...\nTu as de quoi la soigner ?"
text.018e: "Ouh, ça a l'air grave !\nAttends. Fais voir."
text.0208: "Je n'ai rien sur moi\npour l'instant."
text.0294: "Ça ne va pas."
text.02bc: "Ça va beaucoup mieux. Merci."
text.030a: "Tu peux voler, maintenant ?"
text.0332: "Je ne pourrai pas voler loin."
text.037a: "Il y a une clinique en ville.\nTu devrais y aller.\nCe n'est pas loin."
text.0402: "J'ai entendu parler de la\nville. Elle est plus grande\nque je pensais."
text.0470: "Va en ville te reposer."
text.04a8: "Merci. Un jour, je pourrai\npeut-être t'aider."
text.053c: "Unimon rejoint la ville !"
text.057c: "Je n'ai rien pour soigner\nta blessure.\nJe vais te trouver un truc."
text.0608: "Désolé, fais vite."
text.068c: "Il y a d'étranges dessins\nsur le sol."
text.06f0: "C'est un de ces cercles\nmystérieux ?\nIl a l'air encore récent."
text.0774: "J'en vois d'autres !\nEst-ce que c'est lié\nà l'OVNI... ?"
text.080a: "Quoi !? Il y en a encore\nplus qu'avant !"
text.0862: "Qu'est-ce que ça veut dire ?"
text.0896: "Quoi ?"
text.08f8: "L'OVNI de Vademon apparaît."
text.092c: "Un... un extraterrestre ?!"
text.0950: "..."
text.095e: "Tu es... un Digimon ?"
text.0990: "..."
text.099e: "Euh..."
text.09b4: "..."
text.09ca: "Vademon brandit un pistolet."
text.09fa: "Non, arrête !\nJe ne suis pas ton ennemi !"
text.0a3c: "Vademon lâche le pistolet."
text.0a70: "Tant mieux, tu as compris."
text.0aa0: "{color:6}{tamer}{color:1} tente\ndésespérément de\nle convaincre."
text.0af4: "..."
text.0b02: "Il ne comprend peut-être pas ?"
text.0b3a: "D'accord."
text.0b8a: "Vademon rejoint la ville !"
text.0bc0: "Il..."
text.0bd0: "Il sait parler !"
