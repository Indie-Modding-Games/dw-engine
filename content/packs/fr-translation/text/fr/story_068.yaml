text.00ce: "Ha ha, touche-moi et\ntu vas prendre une décharge."
text.016a: "Tu ne veux pas rester ici ?"
text.01ee: "Ouah ! Il a du cran, celui-là."
text.022c: "Tu iras loin !\nD'accord, je vais t'aider."
text.029a: "Tu ne mettrais pas ton\nélectricité au service\nde la ville ?"
text.0300: "La ville ? C'est quoi ?\nÇa me dit quelque chose..."
text.035a: "Je vais aider. Je suis\nElecmon, enchanté."
text.03ec: "Elecmon rejoint la ville !"
text.0432: "Argh !"
text.0454: "Ahhh !"
text.0474: "Tu es fichu !"
text.04ac: "Pas mal."
text.04d2: "Tu n'as aucun goût."
text.050e: "Tu es arrogant ! Je vais\nt'apprendre."
text.057e: "Cette porte en fer est dure.\nSi elle ne s'ouvre pas,\non ne peut pas entrer."
