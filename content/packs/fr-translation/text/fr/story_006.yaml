text.0122: "Je vais gagner !"
text.0150: "Ne viens pas ici ! Va-t'en !"
text.0194: "Là, je suis vraiment fâché !"
text.01d0: "Frappe-moi et je riposte !"
text.0214: "Essaie, si tu peux !"
text.02f4: "Oh, c'est toi, {color:6}{tamer}{color:1}.\nLe pont est réparé."
text.0348: "Tu bâtis une ville, paraît-il."
text.0386: "J'ai une demande.\nAide-moi comme je\nt'ai aidé."
text.040a: "?"
text.0414: "Bâtir une ville, c'est\nsauver cette île.\nTout le monde sera sauvé."
text.04a2: "Ça veut dire que tu\nviendras en ville ?"
text.04fc: "Oui. J'irai dans ta ville."
text.0596: "Coelamon rejoint la ville !"
text.06b0: "Hé, tu es humain ?"
text.06dc: "Je suis Coelamon,\nle Digimon poisson.\nTu es venu me voir ?"
text.0758: "Oui, on t'a cherché partout\nMaintenant que tu le dis"
text.07d0: "Ha ha, vraiment !"
text.080c: "Je sais déjà ce\nque tu veux."
text.084e: "Le pont en amont est\ncassé et tu veux passer\nde l'autre côté. Non ?"
text.08f2: "Je vois.\nBon, je vais t'aider."
text.093c: "Ah ah, te revoilà."
text.0a0a: "Allez, marche sur nos têtes.\nN'aie pas peur."
text.0a7a: "Bon, c'est parti !"
text.0b94: "Ce monde a besoin de plus\nd'entraide. À la prochaine."
