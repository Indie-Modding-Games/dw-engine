text.0060: "Daa !"
text.007e: "Haa !"
text.009c: "Gghhee !"
text.00c6: "Est : Ascenseur\nOuest : Danger, falaise"
text.0120: "Mode Ogre : OUI\nMode Ogre : NON"
text.0196: "Quoi ?"
text.01fa: "J'ai senti le sol bouger.\nC'était mon imagination ?"
text.02c8: "Quoi ? Pas possible !"
text.0344: "{color:6}{tamer}{color:1}Ouah !!"
text.0370: "Attention aux éboulements !"
text.03d6: "Il paraît que les bandits\nattaquent sur cette route."
text.0438: "Allons-y, {color:10}{partner}{color:1}."
text.0480: "Youhou !"
text.049c: "Ha ha !"
text.04b0: "Yahou !"
text.050e: "Rendez-vous et laissez vos\naffaires ! Sinon..."
text.0562: "Non, c'est toi qui te rends !"
text.058a: "Quoi ?! Toi... ?"
text.05ae: "C'est pas possible."
text.05ce: "Chef, on fait quoi ?"
text.0602: "Pas de panique, on est plus\nforts et plus nombreux.\nAttrapez-les !"
text.06d2: "Je me vengerai\nun jour !"
text.0724: "Regarde-les filer ! Ils ne\nreviendront pas de sitôt."
