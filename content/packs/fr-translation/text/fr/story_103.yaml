text.0020: "J'en ai assez de m'entraîner\nici. Qu'est-ce que je fais ?"
text.0082: "Que faire ?"
text.00a0: "Où t'entraînes-tu ?"
text.00da: "C'est un terrain\nd'entraînement ?"
text.0116: "Je suis las de m'entraîner.\nJe veux de vrais combats."
text.0180: "Un terrain d'entraînement ?\nUne arène, peut-être"
text.01ee: "Je suis las de m'entraîner.\nJe veux de vrais combats."
text.0258: "Je veux y aller.\nJe m'entraînerai là-bas."
text.02e2: "Kabuterimon rejoint la ville !"
text.032a: "Le tournoi des Guerriers\nInsectes a lieu ici\nchaque année..."
text.03ae: "...les jours avec deux 2.\nLe gagnant reçoit des\nsuper trucs !"
text.0422: "Mais seuls les Digimon\nInsectes peuvent entrer."
text.0480: "Il y a Kabuterimon,\nKuragamon, Kunemon,\net un autre Insecte."
text.0508: "Mais pas de Numemon."
text.052e: "Les jours avec deux 2, le\ntournoi des Guerriers Insectes\na lieu chaque année."
text.05ce: "Tu as déjà gagné, non ?"
text.060a: "Il y a Kabuterimon,\nKuragamon, Kunemon,\net un autre Insecte."
text.0692: "C'est HerculesKabuterimon."
text.06ce: "Hercules-Kabuterimon est\nsuper fort."
text.071e: "Le vainqueur peut devenir\nHercules-Kabuterimon\net gagner des objets."
text.07a6: "Tu peux participer au tournoi\ndes Guerriers Insectes\nautant que tu veux."
text.0824: "Tu es fort.\nJe n'ai rien à t'apprendre."
text.0886: "On étudie les techniques.\nLes techniques difficiles\nsont dures à maîtriser."
text.091a: "Si tu as le niveau, tu\npourrais les maîtriser.\nTu veux les plus dures ?"
text.09c8: "Bien sûr !\nNon merci"
text.0a06: "Alors, j'essaie."
text.0a3e: "Il te manque de la Défense.\nEntraîne-toi encore."
text.0aa0: "Il te manque de la Vitesse.\nEntraîne-toi encore."
text.0aee: "Il te manque des HP.\nEntraîne-toi encore."
text.0b2a: "Tu as maîtrisé une technique."
text.0b64: "Tu as maîtrisé « Bestiole » !"
text.0bb4: "{color:5}Entraînement : Rocher {color:1}"
text.0bec: "Commencer\nExpliquer\nQuitter"
text.0c22: "Normal\nEssai bonus\nQuitter"
text.0c5e: "Pousse le rocher pour\ngagner en force. Les HP max\naugmentent beaucoup."
text.0ce4: "Réexpliquer\nCommencer\nQuitter"
text.0d3e: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
text.0dc0: "{color:5}Entraînement : Frappe {color:1}"
text.0df0: "Commencer\nExpliquer\nQuitter"
text.0e28: "Normal\nEssai bonus\nQuitter"
text.0e66: "Frappe un mannequin de\ntoutes tes forces. L'Attaque\naugmente beaucoup."
text.0efc: "Réexpliquer\nCommencer\nQuitter"
text.0f56: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
