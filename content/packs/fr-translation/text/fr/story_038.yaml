text.0088: "Tu veux bien arrêter ?"
text.00c6: "Shuha, shuha !"
text.00f6: "Swish !"
text.0118: "Combattons à fond !"
text.0158: "Qu'est-ce que tu racontes ?"
text.019a: "Nord-ouest : Terre Gelée"
text.01d8: "Ascenseur"
text.01f0: "Appuyer sur HAUT\nAppuyer sur BAS\nNe pas monter"
text.02b4: "Quoi ?"
text.02c4: "Rien ne se passe."
