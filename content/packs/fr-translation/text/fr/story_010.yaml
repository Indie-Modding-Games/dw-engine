text.0090: "Tu te crois important !"
text.00dc: "Qu'est-ce que je t'ai fait ?!"
text.0156: "{color:7}? ? ? {color:1}\nAttends !"
text.02f0: "On m'appelle Ninjamon !"
text.033a: "Tu es {color:6}{tamer}{color:1}?\nEt toi, tu dois être {color:10}{partner}{color:1}!"
text.0380: "Tu es célèbre jusqu'au\nVillage Ninja. Accepte\nmon défi !"
text.041e: "D'accord\nUne autre fois"
text.0454: "Ha, c'est ce que tu crois !"
text.04e0: "Tu es aussi fort qu'on\nle dit. Je t'en prie,\nfais de moi ton disciple !"
text.0580: "Disciple ? Bah, je ne fais\npas ça. Mais tu peux nous\naider à bâtir une ville."
text.060a: "D'accord.\nC'est aussi un bon\nentraînement. Je m'y mets."
text.076c: "Ninjamon rejoint la ville !"
text.07b8: "Hé, toi !"
text.07d0: "Comment ça ?\nQu'est-ce que tu fais là ?"
text.081c: "Hé, {color:6}{tamer}{color:1}!"
text.0834: "Quand j'ai voulu monter\nmon propre harem en ville,\non m'a mis dehors !"
text.08ce: "Il paraît que tout te réussit\nen ce moment. Je vais te\nvendre un truc génial !"
text.0962: "C'est l'ultra précieuse\n{color:6}Banane d'or{color:1}."
text.09c0: "Ça fera 50 000 Bits.\nPas de crédit, s'il te plaît."
text.0a24: "Payer\nNe pas payer"
text.0a76: "Idiot ! Tu en as trop !"
text.0abe: "Oups, j'en ai trop !"
text.0afe: "Merci beaucoup !"
text.0b30: "Les humains devraient payer\nen espèces."
