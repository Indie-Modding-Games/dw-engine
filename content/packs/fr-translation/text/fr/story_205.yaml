text.0010: "Quelle boutique veux-tu ?"
text.004c: "Clinique\nChasseur de trésors\nVoyante"
text.00aa: "J'en ai fait un hôpital."
text.0100: "Il ne va pas bien,\nn'est-ce pas ? Tu dois\nprendre soin de sa santé !"
text.018c: "Je le soigne tout de suite.\nLes frais sont réduits\nà 300 Bits."
text.0242: "Pas assez de Bits ?!\nPaie ce que tu peux. Garde\nton argent pour plus tard."
text.02f6: "Tout va bien maintenant.\nFais attention à l'avenir."
text.0364: "Il n'a l'air ni malade ni\nblessé. Que te faut-il ?"
text.03d0: "L'examiner\nVendre un médicament\nRien"
text.042c: "Bien, voyons voir\ncomment va {color:10}{partner}{color:1}."
text.048a: "Oh non. La fatigue de {color:10}{partner}{color:1}\nest à un niveau critique.\nIl doit se reposer, vite !"
text.0540: "{color:10}{partner}{color:1} est trop\nfatigué. Il doit se reposer\navant qu'il soit trop tard."
text.05da: "{color:10}{partner}{color:1} semble un peu\nfatigué. Il ne devrait pas\ntrop forcer."
text.0664: "{color:10}{partner}{color:1} va bien, mais la\nfatigue cause toutes sortes\nde soucis. Fais attention."
text.06fe: "Alors, comment se sent-il ?"
text.0742: "Mentalement, {color:10}{partner}{color:1} est\nparfaitement détendu. Il\nvivra longtemps."
text.07da: "L'état mental de {color:10}{partner}{color:1} est\nexcellent. C'est le signe\nd'une vie saine."
text.0880: "{color:10}{partner}{color:1} semble très\ndétendu. Il lui est arrivé\nquelque chose de bien ?"
text.0918: "Je ne crois pas que {color:10}{partner}{color:1}\nsoit vraiment stressé.\nJe dirais qu'il est normal."
text.09be: "{color:10}{partner}{color:1} semble un peu stressé.\nDoucement avec l'entraînement."
text.0a40: "{color:10}{partner}{color:1} est trop stressé.\nIl a besoin de s'amuser."
text.0aac: "{color:10}{partner}{color:1} est bien trop stressé\net pas heureux. Il ne\ndevrait pas trop forcer."
text.0b4e: "{color:10}{partner}{color:1} est bien trop stressé !\nS'il continue comme ça,\nil ne vivra pas longtemps !"
text.0be4: "Hmmm... C'est tout ce que\nje peux faire pour {color:10}{partner}{color:1}."
text.0c40: "Tu as encore besoin\nde moi ?"
text.0c8e: "L'examiner\nVendre un médicament\nRien"
text.0cee: "Hmmm, ça devrait aller."
text.0d26: "Bandage : 400 Bits\nMédicament : 1200 Bits\nNe rien acheter"
text.0dca: "Quand il ne va pas bien,\nviens me voir tout de suite."
text.0e50: "Tu as beaucoup d'affaires."
text.0ea8: "Tu n'as pas assez de Bits.\nJe ne peux pas te le vendre."
text.0f28: "Tu as beaucoup d'affaires."
text.0f80: "Tu n'as pas assez de Bits.\nJe ne peux pas te le vendre."
text.0fee: "Tu as encore besoin\nde moi ?"
text.103c: "L'examiner\nVendre un médicament\nRien"
text.109c: "J'ai changé de métier, je suis\nchasseur de trésors."
text.1112: "Tu veux une chasse au\ntrésor ? Ou des\ninformations ?"
text.11ac: "Des infos\nPas besoin d'infos\nLaisse tomber"
text.121c: "Il y a deux formules, avec\ndes durées et des prix\ndifférents."
text.128e: "Norm. : 3 jours, 1000 Bits\nSpéc. : 10 jours, 5000 Bits"
text.130a: "Les chances de trouver un\nmeilleur trésor sont plus\ngrandes en formule spéciale."
text.139e: "C'est à peu près tout.\nAlors, que veux-tu faire ?"
text.13fe: "Réexpliquer\nChercher un trésor\nRien"
text.145a: "Choisis une formule !"
text.147e: "Norm. : 3 jours, 1000 Bits\nSpéc. : 10 jours, 5000 Bits\nAnnuler"
text.1518: "D'accord, au revoir."
text.1564: "Bien, résultats dans trois\njours. Souhaite-moi bonne\nchance."
text.1602: "Bien, résultats dans trois\njours. Souhaite-moi bonne\nchance."
text.1680: "Tu n'as pas assez de Bits.\nIl me faut de l'argent pour\nchercher des trésors."
text.1734: "{color:7}Panneau {color:1}\nJe cherche un trésor en ce\nmoment. Patiente un peu.\nDrimogemon."
text.17d6: "Tu sais quoi ?\nOn a trouvé un trésor."
text.1976: "Vide tes poches !"
text.19aa: "J'ai eu : {color:6}{item:pstat=110}{color:1}!"
text.1af2: "Merci de ta confiance !"
