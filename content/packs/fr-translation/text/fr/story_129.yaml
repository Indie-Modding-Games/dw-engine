text.00c6: "Hé, {color:6}{tamer}{color:1} !"
text.00f4: "Hé, {color:6}{tamer}{color:1} !"
text.0122: "Hé, {color:6}{tamer}{color:1} !"
text.0154: "Merci d'être revenu."
text.0190: "Salut, je suis Mojyamon !"
text.0280: "{color:6}{tamer}{color:1}, je suis si content !\nTu as tant fait pour nous."
text.02e2: "J'ai décidé d'aller en\nville. On travaillera\nensemble, d'accord ?"
text.03a4: "Mojyamon rejoint la ville !"
