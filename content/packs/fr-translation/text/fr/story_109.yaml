text.003a: "Ouah, c'est incroyable !"
text.0092: "Hé, il y a une tablette de\npierre. Voyons..."
text.0112: "Il est écrit Leomon.\nJe ne lis pas le reste."
text.016c: "Je comprends la parole,\nmais pas l'écriture..."
text.01cc: "Prenons-la."
text.0200: "Oups, je dois jeter\nquelque chose."
text.0262: "J'ai eu la {color:6}Pierre\nLeomon{color:1} !"
text.02ba: "Qui es-tu ?"
text.02da: "Qui es-tu !"
text.0370: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1} ! Je peux\nporter jusqu'à 20 objets !"
text.0434: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1} ! Je peux\nporter jusqu'à 30 objets !"
