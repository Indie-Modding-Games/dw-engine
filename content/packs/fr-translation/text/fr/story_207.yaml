text.0044: "Salut, tu veux de la viande ?"
text.007c: "Oh, je ne t'ai encore\nrien expliqué."
text.00d8: "C'est une ferme à viande.\nOn fait pousser la viande\npour tout le monde."
text.013e: "La viande pousse à la ferme ?"
text.0176: "Oui, pourquoi ?"
text.0192: "Eh bien... rien"
text.01b8: "Jiji et moi avons décidé de\nte donner trois morceaux de\nviande par jour, {color:6}{tamer}{color:1}."
text.0242: "Voici ta viande du jour."
text.028e: "Tu as trop de viande.\nPas besoin aujourd'hui."
text.030a: "Tu as trop de viande. Je\nreprends ce que tu ne\npeux pas porter."
text.0380: "J'ai eu trois morceaux\nde {color:6}viande{color:1} !"
text.03dc: "Tu as trop d'objets."
text.0414: "J'ai eu trois morceaux de\n{color:6}viande{color:1} !"
text.0470: "On a récolté plein de viande\naujourd'hui ! On te donne\ncinq morceaux."
text.0508: "Tu as trop de viande."
text.054c: "Tu as trop de viande. Je\nreprends ce que tu ne\npeux pas porter."
text.05c2: "J'ai eu cinq morceaux de\n{color:6}viande{color:1} !"
text.0620: "Tu as trop d'objets."
text.0658: "J'ai eu cinq morceaux de\n{color:6}viande{color:1} !"
text.0698: "Tu en auras plus demain."
text.06e4: "Voici la viande du jour."
text.072a: "Tu as trop de viande."
text.076e: "Tu as trop de viande. Je\nreprends ce que tu ne\npeux pas porter."
text.07e4: "J'ai eu de la {color:6}viande{color:1} !"
text.0820: "Tu as trop d'objets."
text.0858: "J'ai eu de la {color:6}viande{color:1} !"
text.087a: "Je t'en donnerai plus demain."
text.08c0: "Je croyais t'avoir donné\nta viande du jour."
text.090a: "Si tu n'as plus à manger,\nva dans la Forêt Natale\nchercher des champignons."
text.09a2: "Salut, {color:6}{tamer}{color:1}, j'ai agrandi\nma ferme à viande."
text.09ea: "Je te donnerai trois méga\nviandes par jour."
text.0a4e: "Si tu en veux plus,\nje te les vends\n500 Bits pièce."
text.0ad2: "Je m'occupe de cette ferme\npour Tanemon.\nIl se repose quelque part."
text.0b74: "J'ai récolté plein de\nviande aujourd'hui !"
text.0bd2: "Tu as trop de méga viande.\nPas besoin aujourd'hui."
text.0c56: "Tu as trop de méga viande.\nPas besoin aujourd'hui."
text.0cce: "J'ai eu de la {color:6}Méga viande{color:1} !"
text.0d14: "Tu as trop d'objets."
text.0d4c: "J'ai eu cinq morceaux de\n{color:6}Méga viande{color:1} !"
text.0d98: "Je t'en donnerai plus demain."
text.0dea: "Voici trois méga viandes\npour aujourd'hui."
text.0e60: "Tu as trop de méga viande.\nPas besoin aujourd'hui."
text.0ee2: "Tu as trop de méga viande.\nJe reprends ce que tu\nne peux pas porter."
text.0f64: "J'ai eu de la {color:6}Méga viande{color:1} !"
text.0faa: "Tu as trop d'objets."
text.0fe2: "J'ai eu trois morceaux de\n{color:6}Méga viande{color:1} !"
text.1036: "Je t'en donnerai demain.\nOu tu peux en acheter.\n500 Bits pièce ?"
text.10d2: "Acheter\nNe pas acheter"
text.1110: "Il te faut plus d'argent."
text.1150: "Tu as trop d'objets."
text.119c: "Tu veux en acheter plus ?"
text.11d4: "Acheter\nNe pas acheter"
text.1202: "À demain."
text.123e: "Hé, hé, hé !\n{color:6}{tamer}{color:1}, regarde !"
text.128a: "On peut faire pousser plein\nd'aloyau. Je t'en donnerai\ntrois par jour."
text.1310: "J'ai aussi commencé à faire\npousser des légumes rares !\nAchètes-en à volonté !"
text.13a6: "Je suis de bonne humeur,\nalors je te donne cinq\nmorceaux d'aloyau."
text.143a: "Tu as trop d'aloyau.\nPas besoin aujourd'hui."
text.14b6: "Tu as trop d'aloyau."
text.14f4: "J'ai eu de l'{color:6}Aloyau{color:1} !"
text.1534: "Tu as trop d'objets."
text.156c: "J'ai eu cinq morceaux\nd'{color:6}Aloyau{color:1} !"
text.15b2: "À demain !"
text.15ee: "Voici ta portion du jour :\ntrois aloyaux !"
text.1668: "Tu as trop d'aloyau.\nPas besoin aujourd'hui."
text.16e6: "Tu as trop d'aloyau."
text.1724: "J'ai eu de l'{color:6}Aloyau{color:1} !"
text.1766: "Tu as trop d'objets."
text.179e: "J'ai eu trois morceaux\nd'{color:6}Aloyau{color:1} !"
text.17ec: "Ce n'est pas encore demain !\nTu veux acheter des légumes ?"
text.1858: "Acheter\nNe pas acheter"
text.1886: "Supercarotte : 500 Bits\nRadis faucon : 500 Bits\nNe rien acheter"
text.1930: "Tu n'as pas assez d'argent."
text.197e: "Tu as trop d'objets !"
text.19ca: "Tu n'as pas assez d'argent."
text.1a18: "Tu as trop d'objets !"
text.1a62: "Tu veux en acheter plus ?"
text.1a9a: "Acheter\nNe pas acheter"
text.1ac8: "À plus !"
