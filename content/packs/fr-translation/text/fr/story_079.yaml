text.009c: "Après ce point, c'est\nl'Ère Rapide.\nNe t'approche pas trop."
text.012e: "J'ai deux objectifs.\nLe premier : trouver le\ndanger qui menace l'île."
text.01b2: "Le second : amener des\nDigimon en ville."
text.0212: "Et alors ?"
text.023e: "Aide-moi, s'il te plaît\nNon, rien"
text.0286: "Impossible. Je dois garder\ncette forêt."
text.02d4: "Alors, tu sais quelque chose\nsur le danger de l'île ?"
text.0346: "Rien du tout. Attends."
text.037c: "Je me souviens d'un gros\nrocher tombé du ciel\nil n'y a pas longtemps."
text.03fc: "Où est-il tombé ?"
text.0428: "Dans l'Ère Rapide. De\nl'autre côté de la forêt."
text.04a2: "Laisse-moi y aller ! Je\ntrouverai peut-être des\nindices !"
text.0506: "..."
text.0512: "Si tu insistes.\nVa donc voir."
text.057e: "Après ce point, le temps\npasse deux fois plus vite.\nPrends assez à manger."
text.0610: "Fais aussi attention\nà ne pas trop vieillir."
text.0672: "Tu devrais aller voir\nailleurs."
text.06dc: "Après ce point, le temps\npasse deux fois plus vite.\nPrends assez à manger."
text.076e: "Fais aussi attention\nà ne pas trop vieillir."
text.07dc: "Il s'est passé quelque chose ?"
text.0810: "Pas encore."
text.0828: "D'après mon maître, il y a\nun passage secret."
text.0890: "Mais je ne sais pas où."
text.08da: "Qu'est-ce que c'est ?"
text.08f8: "On dirait une météorite !\nRien d'inquiétant."
text.096c: "Désolé, mais c'est\ntout ce que je sais."
text.09ae: "Merci quand même."
text.09da: "Prends ça !"
text.0a82: "Tu es un bon à rien !"
text.0aac: "Maître ?!"
text.0ac4: "Je n'en reviens pas,\ntu es encore là !"
text.0b1c: "Maître ? Qui est-ce ?"
text.0b4c: "Mais Maître, qui gardera\nla Région Dino Antique ?"
text.0bba: "L'île traverse une période\ncritique. Va en ville et\naide les autres !"
text.0c5c: "Oui, Maître !"
text.0c7c: "Tu es sûr que ça va ?!"
text.0cba: "Il est encore jeune, mais\nfais-le travailler.\nJe monterai la garde ici."
text.0d54: "Maître..."
text.0d74: "{color:6}{tamer}{color:1}, voilà l'histoire.\nJe peux aller en ville ?"
text.0de4: "Tu dois bien travailler."
text.0e12: "Promis !\nÀ plus tard, Maître !"
text.0e92: "Tyrannomon rejoint la ville !"
text.0ed6: "Qu'est-ce qu'il sait faire ?"
text.0f1a: "Ça faisait longtemps que\nje ne gardais plus ici."
text.0f7a: "Tu peux passer quand tu veux."
text.0fc2: "Ça faisait longtemps que\nje ne gardais plus ici."
text.1022: "Tu peux passer quand tu veux."
