text.0066: "Je vais t'assommer !"
text.00ce: "On recommence."
text.00fa: "D'accord\nNon"
text.0148: "Encore un petit peu...\nAllez, une dernière fois !"
text.01ae: "D'accord\nNon"
text.020c: "Je n'arrive pas à gagner !"
text.0230: "Pourquoi tu veux gagner ?"
text.026e: "Qu'est-ce que je dois faire ?"
text.0298: "Comment ça ?\nTu n'as rien à faire ?"
text.02f4: "J'ai tout mon temps."
text.032c: "Si tu as trop de temps,\nviens en ville. Il y a\ntoutes sortes de Digimon."
text.03d6: "Bonne idée. J'y vais.\nJe m'appelle Patamon.\nÀ plus tard."
text.0482: "Patamon rejoint la ville !"
text.04c8: "C'est pas drôle !"
text.04f6: "Tu viens ?"
text.052a: "Tu ne sens rien !"
text.0560: "Tu as l'air bon.\nJe vais te dévorer !"
text.05b6: "Ha ha, tu es drôle !"
