text.0042: "Ça doit être ça !\nJ'ai beau regarder,\nc'est une simple météorite."
text.00d8: "La casser pour voir\nNe pas y toucher"
text.0130: "Hmmm"
text.0146: "Pour moi, c'est une\nvieille météorite banale."
text.019c: "{color:7}???mon {color:1}\nDésolé d'avoir l'air\nsi vieux et banal."
text.0202: "Ouah !"
text.0212: "Tu es un Digimon ?!\nQui es-tu ?"
text.0264: "{color:7}???mon {color:1}\nJe m'appelle Meteormon."
text.02aa: "Tu sais quelque chose sur\nle danger de l'île ?"
text.02fe: "Je ne sais rien !"
text.0324: "Rien du tout ?! Tu ne me\ncacherais pas quelque chose ?"
text.039c: "Quel culot ! D'accord !\nBattons-nous pour voir\nqui a raison !"
text.041e: "D'accord ! Allons-y."
text.0488: "J'abandonne. Tu es trop fort."
text.04c8: "Dis-moi tout ce que tu sais\nsur le danger de l'île."
text.0542: "Je viens de naître, alors\nje ne sais rien !"
text.059e: "Quoi ?!"
text.05ba: "La tribu des Météorites naît\ndans le ciel, puis tombe\nsur le sol."
text.064a: "Puis on dort très longtemps.\nEn fait, j'aurais dû dormir\nbien plus longtemps, mais..."
text.06fa: "Le temps passe bien plus\nvite ici."
text.0738: "Sûrement. Bref, je vais\nexplorer l'île.\nÀ plus !{stop}"
text.07f4: "Aucun indice.\nSortons vite d'ici."
text.086a: "On l'a examinée, et on ne\nvoit rien de spécial.\nCassons-la !"
text.08f8: "{color:7}???mon {color:1}\nQu'est-ce que tu fabriques ?\nEspèce d'écervelé !"
text.0998: "Hein ? Qui es-tu ?!"
text.09c4: "Qui je suis ? Et toi, alors ?!"
text.0a70: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1}.\nJe peux porter 20 objets !"
text.0b20: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1}.\nJe peux porter 30 objets !"
