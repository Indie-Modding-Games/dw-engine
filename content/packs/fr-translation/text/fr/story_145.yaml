text.0054: "Arrête de faire l'idiot !"
text.0084: "D'accord. Je ne crois pas\nque je recommencerai."
text.00e2: "Je crois que c'est\nla dernière salle."
text.0156: "{color:7}??? {color:1}\nLaquelle ?"
text.0198: "Cette voix... on dirait\nWaruMonzaemon !"
text.01ec: "Grande ou petite boîte ?\nJe lis dans tes pensées !"
text.0250: "Grande boîte\nPetite boîte"
text.0304: "Hein ? Aaahhhh !"
text.04a2: "Ha ha ha, crétin !\nRaté !"
text.052c: "Ohhhh, tu m'as trouvé !\nHé hé hé. Nerveux ?"
text.059a: "Zut, qu'y a-t-il de drôle ?"
text.05ce: "Ouh là, du calme.\nQue fais-tu ici aujourd'hui ?\nTu veux travailler pour moi ?"
text.0674: "Rends-nous l'ami que\ntu as enlevé !"
text.06c6: "Un ami ? De quoi tu parles ?\nJ'ai l'air de quelqu'un\nqui ferait ça ?"
text.0768: "Oui !"
text.077a: "Ouah, encore gagné !\nOui, c'est moi ! C'est moi !"
text.07ec: "Mais tu sais que tu ne\nle récupéreras pas.\nCar je suis WaruMonzaemon."
text.0878: "Si c'est comme ça,\nje vais t'y forcer !"
text.08d2: "Tu plaisantes ?\nTu crois pouvoir me battre ?"
text.0930: "Tu sais quoi ?\nTu ferais mieux d'ouvrir\nles yeux !"
text.09e0: "Hé, rends-moi l'ami\nque tu as enlevé."
text.0a4a: "Ugghhh... non !\nJe n'y crois pas,\nje perds..."
text.0ae2: "Allez !"
text.0afa: "Bon... je crois que je\nn'ai pas le choix. Tiens."
text.0bd8: "Hein ? Ouahhh... hé !"
text.0d54: "Hé, arrête de faire le\nclown, ça suffit !"
text.0dae: "Hé, tu ne piges pas la\nblague ? Tiens. Le voilà."
text.0e2c: "Qu'est-ce que c'est ?\nC'est un engrenage."
text.0e6e: "Oui, c'est ça."
text.0ea4: "C'est ça, l'ami ???"
text.0ed6: "Bah, je n'ai rien pris\nd'autre. Vraiment."
text.0f32: "Je vais le reprendre\npour l'instant."
text.0f94: "Toi ! Ne fais plus de\nbêtises, d'accord ?!"
text.0ff8: "D'accord. Je ne crois pas\nque ça se reproduira."
text.105c: "Je ne te crois pas trop,\nmais j'ai tant de choses\nà faire."
text.1104: "Oh non, j'ai trop\nd'objets. Je dois\nen jeter un."
text.1182: "J'ai eu un {color:6}Engrenage{color:1} !"
text.11ba: "Quoi ? Qui es-tu ?"
text.11e6: "Qui je suis ? Et toi, alors ?!"
text.1292: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1} ! Je peux\nporter jusqu'à 20 objets."
text.1354: "J'ai eu un {color:4}Porte-clés\ndimensionnel{color:1} ! Je peux\nporter jusqu'à 20 objets."
