text.0066: "On se bat ?\nT'as la trouille ?!"
text.00b2: "D'accord, battons-nous\nAttends une minute"
text.011e: "Oh non ! J'ai perdu !"
text.0152: "Il était plutôt coriace."
text.019a: "Tu es sympa. Je suis Mamemon.\nJe viens avec toi."
text.0200: "Tu viens avec nous ? Alors\npourquoi pas aller en ville ?"
text.0272: "D'accord. J'y vais."
text.02d6: "Mamemon rejoint la ville !"
text.0320: "Reviens quand tu seras\nplus costaud."
text.039c: "Daaaa !"
text.03be: "Ha, ha, ha."
text.03ea: "Argh !"
text.0410: "Est : Forêt Natale\nOuest : Savane Engrenage"
