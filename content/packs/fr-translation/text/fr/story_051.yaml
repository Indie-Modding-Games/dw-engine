text.004e: "Je le sens mal..."
text.0098: "Je savais que tu viendrais !"
text.00e4: "Qui es-tu ?"
text.0104: "Je suis Devimon, un ange noir.\nJ'ai le pouvoir des ténèbres."
text.017c: "Tu sais quelque chose ?"
text.01b0: "Myotismon est au manoir.\nIl est peut-être vivant."
text.021e: "C'est toi qui as fait ça ?"
text.024a: "Je ne sais pas... je sais\njuste que tu es mon ennemi."
text.02c2: "Tu ne t'échapperas pas !"
text.030c: "Ha ha ha !"
text.034a: "Oh non !"
text.036e: "Salue Myotismon de ma part."
text.03cc: "Il s'est enfui !\nJe n'aime pas ce type."
text.048a: "Quel grand manoir !"
text.04ca: "Il y a quelqu'un ?"
text.0500: "Personne, ou alors\non ne m'entend pas."
text.0566: "Bon. On explore !"
text.05be: "J'ai utilisé la\n{color:6}Clé manoir{color:1} !"
text.0622: "Ça ne s'ouvre pas.\nC'est fermé à clé."
text.069a: "J'ai utilisé la\n{color:6}Clé manoir{color:1} !"
text.06fe: "Ça ne s'ouvre pas.\nC'est fermé à clé."
text.0776: "J'ai utilisé la\n{color:6}Clé manoir{color:1} !"
text.07da: "Ça ne s'ouvre pas.\nC'est fermé à clé."
text.0866: "Ça ne s'ouvre pas. C'est\nscellé par une force étrange."
