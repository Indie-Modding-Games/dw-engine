text.007c: "Je vais gagner !"
text.00ae: "Tu ne me battras jamais !"
text.00ee: "Hé hé ! Vraiment désolé !"
text.012c: "Tu m'ignores ?"
text.017a: "Si tu veux passer, tu dois\naccepter mon défi."
text.021c: "J'ai baissé ma garde, mais\ndeux contre un, c'est injuste."
text.028a: "C'est peut-être vrai\nSois beau joueur"
text.02ea: "Je ne perds jamais contre\npersonne à la loyale."
text.034e: "Un contre un. Reviens demain\nà quatre heures.\nSeuls les Digimon se battent."
text.03fe: "D'accord\nNon merci"
text.0436: "C'est promis, alors.\nÀ demain !"
text.04e6: "Tu es revenu, bien.\nAujourd'hui, on se bat\nà la loyale !"
text.0550: "Tu es en retard, mais j'ai pu\nsoigner ma blessure.\nAllons-y."
text.05f2: "Je regarde. Commencez !"
text.0630: "Vas-y, {color:10}{partner}{color:1} !"
text.067e: "Tu es fort ! Qui es-tu ?"
text.06b8: "On explore pour sauver\nl'île du danger."
text.0734: "Quoi ?"
text.0746: "{color:6}{tamer}{color:1} fait tout pour\nle convaincre !"
text.079a: "Je vais t'aider. Mais je dois\nd'abord voir cette ville."
text.0844: "Garurumon rejoint la ville !"
