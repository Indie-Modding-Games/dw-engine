text.0020: "Je veux battre Kabuterimon.\nComment je peux gagner ?"
text.0098: "Hmm. Tu dois devenir plus\nfort. En fait, il y a un\nmoyen sûr... bon, tiens bon."
text.015e: "Je vois. D'accord, je\nm'entraîne."
text.019e: "Vrai ?! Alors je vais\nt'entraîner !"
text.01e8: "Viens donc en ville."
text.0220: "..."
text.022c: "Tu es vraiment gentil.\nJ'irai en ville."
text.02bc: "Kuwagamon part en ville !"
text.0304: "Bah, tu n'es pas gentil.\nJe suis déçu !"
text.0368: "Hé, tu as déjà fait ces\ntournois d'insectes, non ?"
text.03d8: "Bon, je vais t'apprendre\nun truc utile."
text.042a: "Tu sais où dort Kunemon ?\nDans la Forêt Natale ?"
text.0496: "Les Digimon Enfants y\ndorment. À leur réveil, ils\ndeviennent Kunemon."
text.051e: "Mais pas toujours.\nC'est une question de chance."
text.05a8: "Hé, tu as déjà fait ces\ntournois d'insectes, non ?"
text.0618: "Euh... Comme tu es là,\ntu n'y arriveras pas."
text.0676: "Bon, je vais t'apprendre\nun truc utile."
text.06c8: "Tu sais où dort Kunemon ?\nDans la Forêt Natale."
text.0734: "Les Digimon Enfants y\ndorment. À leur réveil, ils\ndeviennent Kunemon."
text.07bc: "Mais pas toujours.\nC'est une question de chance."
text.0826: "Hé, tu veux participer au\ntournoi d'insectes ?"
text.0890: "C'est quoi ?"
text.08b0: "Il faut s'inscrire le 22\navant 10 h."
text.0924: "Hein ???"
text.0938: "Tu auras les détails\nle jour du tournoi."
text.099c: "De quoi il parle,\nau juste ?"
text.09ea: "On va bien s'entraîner,\nmais il faut aussi se reposer."
text.0a42: "On se repose une heure ?"
text.0a7e: "Se reposer\nPas de repos"
text.0ae0: "{color:5}Entraînement :\nMarteau-machine {color:1}"
text.0b1e: "Commencer\nExpliquer\nQuitter"
text.0b56: "Normal\nEssai bonus\nLaisse tomber"
text.0ba0: "Encaisser les coups du\nmarteau-machine rend fort.\nLa Défense augmente."
text.0c3e: "Réexpliquer\nCommencer\nQuitter"
text.0c98: "{color:7}Machine à sous {color:1}\nAvec {color:6}△, \naligne trois images."
text.0d22: "{color:5}Entraînement : Tapis roulant {color:1}"
text.0d54: "Commencer\nExpliquer\nQuitter"
text.0d8c: "Normal\nEssai bonus\nLaisse tomber"
text.0dd6: "Cours dans le sens\nopposé au tapis.\nTa Vitesse augmente."
text.0e5a: "Réexpliquer\nCommencer\nQuitter"
text.0eb4: "{color:7}Machine à sous {color:1}\nAvec {color:6}△ {color:1},\naligne trois images."
