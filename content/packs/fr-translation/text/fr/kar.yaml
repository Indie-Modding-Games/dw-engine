"penguinmon_dialogue.0001": "D'abord, choisis ta"
"penguinmon_dialogue.0002": "pierre de curling."
"penguinmon_dialogue.0005": "Il y a des pierres lourdes,"
"penguinmon_dialogue.0006": "moyennes et légères : pense"
"penguinmon_dialogue.0007": "au meilleur ordre d'emploi."
"penguinmon_dialogue.0009": "Certaines ont quatre pointes."
"penguinmon_dialogue.0010": "Elles restent là où elles"
"penguinmon_dialogue.0011": "tombent : très utile !"
"penguinmon_dialogue.0013": "Utilise les touches"
"penguinmon_dialogue.0014": "directionnelles gauche/droite"
"penguinmon_dialogue.0015": "pour choisir la direction."
"penguinmon_dialogue.0017": "Haut et bas font défiler"
"penguinmon_dialogue.0018": "l'écran. Appuie sur {prompt:confirm}"
"penguinmon_dialogue.0019": "pour fixer la direction."
"penguinmon_dialogue.0021": "Appuie sur {prompt:confirm} quand la"
"penguinmon_dialogue.0022": "jauge atteint le niveau"
"penguinmon_dialogue.0023": "voulu pour la force du lancer."
"penguinmon_dialogue.0025": "Si ta pierre s'arrête et"
"penguinmon_dialogue.0026": "touche la marque GOOD,"
"penguinmon_dialogue.0027": "tu gagnes deux points."
"penguinmon_dialogue.0029": "Sur la ligne bleue, mais hors"
"penguinmon_dialogue.0030": "de la marque GOOD du centre,"
"penguinmon_dialogue.0031": "c'est un point."
"penguinmon_dialogue.0033": "Si tu touches le BAD en bas"
"penguinmon_dialogue.0034": "à droite, tu perds deux"
"penguinmon_dialogue.0035": "points. Fais attention !"
"penguinmon_dialogue.0037": "Et en cas d'égalité,"
"penguinmon_dialogue.0038": "je gagne !"
"penguinmon_dialogue.0039": "Que la partie commence !!"
"penguinmon_dialogue.0042": "T'es pas si fort que ça !"
"penguinmon_dialogue.0045": "Ça ne fait que commencer !"
"penguinmon_dialogue.0049": "Hé, t'es plutôt doué !"
"penguinmon_dialogue.0053": "Ouais ! J'ai gagné !"
"penguinmon_dialogue.0057": "Oh, j'ai perdu. "
"metalmamemon_dialogue.0001": "Ouais. D'abord, choisis"
"metalmamemon_dialogue.0002": "le type de pierre de curling."
"metalmamemon_dialogue.0005": "Moi, en génie, j'utilise"
"metalmamemon_dialogue.0006": "plein de pierres dans le bon"
"metalmamemon_dialogue.0007": "ordre : la clé pour gagner."
"metalmamemon_dialogue.0009": "Les pierres à quatre pointes"
"metalmamemon_dialogue.0010": "freinent et restent en place,"
"metalmamemon_dialogue.0011": "alors elles valent de l'or."
"metalmamemon_dialogue.0013": "Choisis la direction du lancer"
"metalmamemon_dialogue.0014": "avec les touches"
"metalmamemon_dialogue.0015": "directionnelles gauche/droite."
"metalmamemon_dialogue.0017": "Haut et bas font défiler"
"metalmamemon_dialogue.0018": "l'écran."
"metalmamemon_dialogue.0019": "Appuie sur {prompt:confirm} pour lancer."
"metalmamemon_dialogue.0021": "Appuie sur {prompt:confirm} quand la"
"metalmamemon_dialogue.0022": "jauge atteint le niveau"
"metalmamemon_dialogue.0023": "voulu pour la force du lancer."
"metalmamemon_dialogue.0025": "Points : si ta pierre est"
"metalmamemon_dialogue.0026": "sur la marque GOOD,"
"metalmamemon_dialogue.0027": "tu gagnes deux points."
"metalmamemon_dialogue.0029": "Sur la ligne bleue, mais hors"
"metalmamemon_dialogue.0030": "de la marque GOOD du centre,"
"metalmamemon_dialogue.0031": "c'est un point."
"metalmamemon_dialogue.0033": "Sur la marque BAD en bas à"
"metalmamemon_dialogue.0034": "droite, c'est moins deux"
"metalmamemon_dialogue.0035": "points. Fais attention !"
"metalmamemon_dialogue.0037": "En cas d'égalité, je gagne !"
"metalmamemon_dialogue.0038": "Que la partie commence !!"
"metalmamemon_dialogue.0041": "Je vais gagner !"
"metalmamemon_dialogue.0045": "J'ai pas encore perdu !"
"metalmamemon_dialogue.0049": "Pas question de perdre !"
"metalmamemon_dialogue.0053": "Ouais, j'ai gagné !"
"metalmamemon_dialogue.0057": "Oh, j'ai presque gagné."
"menu.0000": "Jouer     Explications"
