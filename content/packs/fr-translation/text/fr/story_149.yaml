text.009a: "Il n'y a pas de garde !"
text.00f8: "Tu ne peux pas passer ici."
text.0136: "Tu ne peux pas passer ici."
text.01dc: "......"
text.01f0: "Ouah, il nous fixe !\nIl se méfie peut-être\nde nous."
text.0266: "Cachons-nous et attendons,\npuis revenons.\nIl est midi."
text.030e: "Cette usine doit vider ses\ndéchets dans les égouts.\nJe dois en avoir le cœur net."
text.03d4: "Tu peux te pousser ?"
text.0412: "On ne passe pas ici sans\nun permis délivré par\nle responsable."
text.04a8: "Je suis pressé."
text.04ce: "Désolé, il te faut\nun permis."
text.051c: "D'accord, si c'est\ncomme ça."
text.0580: "Alors, on fait quoi ?"
text.05b4: "Heure de la relève\nLaisse-moi passer\nNon, rien"
text.0636: "Ce n'est pas encore l'heure\nde la relève."
text.0694: "Pas grave, t'en fais pas.\nC'est quand, la relève ?"
text.0704: "Non, on doit respecter\nl'heure à la lettre."
text.075e: "La relève a lieu à\nminuit et à midi."
text.07bc: "Ah, je vois."
text.07e2: "Tu ne me fais pas peur.\nIl te faut un permis."
text.084a: "Un permis ? J'en ai un.\nJe te donne la permission !"
text.08bc: "On ne peut pas te donner de\npermis. Tu dois passer\npar la voie officielle."
text.0944: "Ouah, tu es si strict !"
text.097c: "Toujours pas l'heure de\nla relève ?"
text.09b8: "..."
text.09c6: "Ouah, il nous fixe !\nOn dirait qu'il ne fera\npas la relève."
text.0a42: "Revenons plus tard.\nOn devrait peut-être\nse cacher et attendre."
text.0aca: "Bopi bopi pooooo."
text.0b02: "Geba geba !"
text.0b2c: "Boobyo ?"
text.0b50: "Je suis satisfait !"
text.0b82: "Ça fait partie de mon boulot."
text.0bc6: "Quel est le problème ?"
