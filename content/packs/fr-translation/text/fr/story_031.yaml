text.0040: "!"
text.0058: "Qu'arrive-t-il à l'île ?"
text.0092: "Les tribus se disloquent,\nperdent la mémoire et\ndeviennent sauvages."
text.0100: "Je ne sais pas combien de\ntemps je garderai la raison."
text.0152: "On ne peut pas laisser ça !\nIls doivent voir le danger !"
text.021c: "Arrête ! Tu veux ruiner\nl'île ?!"
text.0278: "Qui es-tu ? Pousse-toi !\nC'est la seule solution !"
text.031c: "Tu veux dire qu'il y a\nune autre solution ?"
text.037a: "Si l'île est ruinée, ça\nne sert à rien !\nÉcoute-moi."
text.03fe: "Quoi ?"
text.0418: "On bâtit une ville pour\nl'île en réunissant tous\nles Digimon."
text.049a: "Il paraît qu'unir les\nDigimon peut sauver l'île\nde ce danger."
text.0532: "Tu as sans doute raison,\nmais réunir tous les\nDigimon, c'est énorme..."
text.05cc: "On y travaille en ce\nmoment. Rien n'est\nimpossible !"
text.063e: "Quelle tâche !\nMais ça me touche...\nVous y arriverez peut-être."
text.06c8: "Si tu crois en nous, je\nveux que tu viennes en ville."
text.073e: "D'accord. J'irai en ville.\nC'est ma nouvelle voie !"
text.07f0: "Meramon rejoint la ville !"
text.084a: "Je savais que tu reviendrais.\nJe dois connaître la réponse !"
text.08f0: "Bon, j'ai perdu..."
text.091c: "Il y a une chose que\nje dois te dire."
