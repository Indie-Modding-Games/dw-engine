text.0438: "{color:1}Blanc Blanc Blanc\n{color:2}Bleu Bleu Bleu\n{color:3}Rouge Rouge Rouge\n{color:4}Rose {color:5}Vert\n{color:6}Cyan Cyan\n{color:7}Jaune {color:10}Orange\n{color:10}a {color:6}b {color:4}c {color:5}d"
text.051c: "Il est {num:pstat=107}: {num:pstat=108}\nle jour {num:pstat=106}\ndu mois {num:pstat=105}."
text.0582: "Je suis M. Téléport.\nOù veux-tu aller ?"
text.05d6: "Près\nLoin\nTrès loin"
text.0620: "Sommet du Mont Panorama\nJungle Tropicale\nTunnel Foreuse"
text.069e: "Savane Engrenage\nManoir Seigneur Gris\nGrand Canyon"
text.070c: "Dino Antique : porte\nDino Antique : fond\nMonde inconnu"
text.07b6: "Devant la grotte curling\nPêche Seadra\nGrotte de Lave"
text.083e: "Vie trois"
text.085a: "Je suis M. Digivolution.\nQue veux-tu devenir ?"
text.08bc: "Numemon\nSukamon\nBotamon"
text.0a50: "À moitié mort\nMode ouverture\nAvancer le temps"
text.0acc: "Avancer d'une heure\nAvancer de six heures\nAvancer de dix jours"
text.0b76: "Tu veux de la viande ?"
text.0bae: "Oh, pardon.\nJ'ai oublié d'expliquer."
text.0bfa: "C'est une ferme à viande.\nOn fait pousser la viande\npour tout le monde."
text.0c60: "La viande pousse à la ferme ?"
text.0c98: "Oui, et alors ?"
text.0cc4: "Rien... ça va.\nContinue, je t'en prie..."
text.0d20: "Jiji et moi avons décidé\nde te donner trois morceaux\nde viande par jour, {color:6}{tamer}{color:1}."
text.0da4: "Voici la viande du jour."
text.0df6: "Tu as trop de viande.\nPas besoin d'en avoir\naujourd'hui, je crois."
text.0e82: "Tu as trop de viande.\nJe reprends ce que\ntu ne peux pas porter."
text.0efa: "J'ai eu trois morceaux de\n{color:6}viande{color:1} !"
text.0f52: "Tu as trop d'objets."
text.0f8a: "J'ai eu trois morceaux de\n{color:6}viande{color:1} !"
text.0fea: "On a récolté plein de viande !\nAlors je te donne\ncinq morceaux de viande."
text.1088: "Tu as trop de viande.\nPas besoin d'en avoir\naujourd'hui, je crois."
text.1110: "Tu as trop de viande.\nJe reprends ce que\ntu ne peux pas porter."
text.1192: "J'ai eu cinq morceaux de\n{color:6}viande{color:1} !"
text.11f0: "Désolé, mais\ntu as trop d'objets."
text.1246: "J'ai eu cinq morceaux de\n{color:6}viande{color:1} !"
text.1286: "Je t'en donnerai plus demain."
text.12d8: "Voici la viande du jour."
text.131e: "Tu as trop de viande.\nPas besoin d'en avoir\naujourd'hui, je crois."
text.13a6: "Tu as trop de viande.\nJe reprends ce que\ntu ne peux pas porter."
text.142a: "J'ai eu trois morceaux de\n{color:6}viande{color:1} !"
text.148a: "Tu as trop d'objets."
text.14c4: "J'ai eu trois morceaux de\n{color:6}viande{color:1} !"
text.1506: "Je t'en donnerai plus demain."
text.154c: "Quoi ? Je t'ai déjà donné\nde la viande aujourd'hui."
text.159e: "Si tu n'as plus à manger,\ncherche des champignons\ndans la Forêt Natale."
text.1620: "Bon, je vais t'expliquer\nles environs de la ville."
text.1692: "La Forêt Natale\nentoure la ville."
text.16da: "Les Digimon du coin\nne sont pas très forts."
text.173a: "Il y a un camp d'entraînement\nà l'ouest. Tu y iras\nsûrement souvent."
text.17d4: "La Jungle Tropicale est à\nl'est, de l'autre côté\nde la rivière."
text.1846: "Je ne sais pas ce qu'il y a\nau-delà."
text.1888: "Il y a une montagne et un\nlac à l'ouest, et\nc'est un cul-de-sac."
text.1910: "Si tu continues vers le sud,\nil y a l'océan."
text.196a: "Et il y a une haute montagne\nau nord. C'est aussi\nun cul-de-sac."
text.19ee: "Comme la ville est au centre\nde l'île, il doit y avoir\nde vastes terres au nord."
text.1a9c: "Je vais vérifier les rumeurs\nsur l'extérieur.\nReviens en savoir plus."
