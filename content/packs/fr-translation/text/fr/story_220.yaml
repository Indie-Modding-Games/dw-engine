text.0022: "{color:7}Poyomon {color:1}\nPoyomon. Je m'appelle Poyomon."
text.0084: "{color:7}Poyomon {color:1}\nParlons digivolution.\nBon... Il s'agit du stade\naprès le Digimon Champion."
text.014e: "{color:7}Poyomon {color:1}\nOn l'appelle Digimon Ultime.\nMais un Champion ne\ndigivolue pas toujours."
text.0214: "{color:7}Poyomon {color:1}\nLes conditions sont dures,\nmais une fois Ultime,\nta durée de vie s'allonge."
text.02d8: "{color:7}Poyomon {color:1}\nAvec les objets de\ndigivolution, la durée de\nvie n'augmente pas."
text.0370: "{color:7}Poyomon {color:1}\nParlons digivolution.\nBon... Il s'agit des\nconditions pour digivoluer."
text.0428: "{color:7}Poyomon {color:1}\nD'abord, le poids doit être\nproche du poids du stade\nsuivant."
text.04b6: "{color:7}Poyomon {color:1}\nEnsuite, plus les paramètres\nsont hauts, mieux c'est, mais\nchacun a un effet différent."
text.0566: "{color:7}Poyomon {color:1}\nLes erreurs de soin. Selon\nle Digimon que tu vises,\nelles sont parfois utiles."
text.062e: "{color:7}Poyomon {color:1}\nAh oui, il y a d'autres\nconditions spéciales pour\ndevenir certains Digimon."
text.06d6: "{color:7}Poyomon {color:1}\nPar exemple, une discipline\ntrès haute ou beaucoup\nde combats."
text.0756: "{color:7}Poyomon {color:1}\nAinsi, même si les trois\nconditions de base ne sont\npas remplies, il digivolue."
text.082a: "{color:7}Poyomon {color:1}\nJiji m'a dit que {color:10}{partner}{color:1}\nallait digivoluer."
text.089c: "{color:7}Poyomon {color:1}\nIl faut six heures du stade\nBébé au stade Apprenti."
text.0920: "{color:7}Poyomon {color:1}\nEt un seul jour pour\npasser au stade Novice."
text.09ac: "{color:7}Poyomon {color:1}\nLe stade Champion prend\nenviron trois jours."
text.0a2c: "{color:7}Poyomon {color:1}\nCombien pour le stade\nsuivant ? J'ai oublié, mais\nc'est plus long."
text.0ab4: "{color:7}Poyomon {color:1}\nLe poids, les paramètres et\nles erreurs de soin influent\nsur la digivolution."
text.0b42: "{color:7}Poyomon {color:1}\nJe ne connais pas les\ndétails, je demanderai\nà Jiji."
