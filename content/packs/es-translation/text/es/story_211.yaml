text.0020: "Bienvenido de vuelta,\n{color:6}{tamer}{color:1}."
text.004c: "Soy el archivista de Jijimon."
text.008a: "Anoto la información de\nJijimon y te la doy."
text.00e8: "Si no sabes qué hacer,\npregúntame y te diré\nadónde ir."
text.0184: "Todos los Digimon se\nreunieron en la ciudad.\n¡Muchísimas gracias!"
text.0208: "Te diré lo que sé.\nA ver..."
text.0266: "Y luego..."
text.0288: "Y además..."
text.0300: "Hay Digimon planta en el\nbosque. Cuanto más cerca,\nmás difícil es verlos."
text.03e6: "A los Digimon insecto les\ngusta la vegetación. Como\nla que rodea la ciudad..."
text.04a6: "En la Selva Tropical hay\nun bosque como un laberinto.\nUn Digimon fuerte lo vigila."
text.0578: "Un veterano en el río\nestá esperando a alguien."
text.0616: "Hay un Digimon al que le\nencantan las orillas tibias."
text.06b0: "En los cementerios hay\nfantasmas. Les encanta\nhablar contigo."
text.0752: "Hay un secreto en el jardín\nde la ciudad. Pregúntale a\nuna planta por otra planta."
text.0828: "La Región Dino Antigua\nes peligrosa, pero vale\nla pena explorarla."
text.08ec: "Dentro del Monte Panorama\ncorre lava. A algunos\nDigimon les encanta el calor."
text.09a4: "Llevar a un Digimon que ama\nel calor a un lugar frío va\ncontra las reglas, pero..."
text.0a88: "En Tierra Helada hay muchos\nDigimon que irán contigo.\nVe hacia el oeste."
text.0b58: "En la cima del Gran Cañón\nvive un Digimon ave."
text.0bf8: "El Gran Cañón es como un\nlaberinto. Si entras,\ncuesta salir."
text.0cb0: "En la Sabana Engranaje\nhay un Digimon al que\nle encanta la electricidad."
text.0d60: "En los Árboles Brumosos\npuede aparecer un Digimon\nmadrugador."
text.0e02: "En el Gran Cañón\nhay una tienda\nque atiende un Digimon."
text.0ea6: "Quizá conozcas a un Digimon\ncon alas que cruza el Monte\nPanorama de un aletazo."
text.0f84: "La Sabana Engranaje va bien\na Digimon que no vuelan alto.\nDeberías buscar ahí."
text.104e: "Algunos Digimon quizá te\nconozcan y te reten."
text.10ee: "En Tierra Helada hay\nDigimon que viven en cuevas\ne invitan a otros a pasar."
text.11be: "Pide a los Digimon\ntrabajadores que vengan a la\nciudad cuando terminen."
text.12a2: "Los Árboles Brumosos son ideales\npara esconderse. También debes\nguiar a los Digimon escondidos."
text.137c: "Cuando se corran rumores\nsobre ti, deberías volver."
text.141e: "Una sombra enorme aparece\nen las costas de Tierra\nHelada. Quizá sea un Digimon."
text.14f6: "Ayuda a los Digimon que\naman coleccionar cosas.\nPrueba en Tierra Helada."
text.15b6: "En la cima del Monte\nPanorama, un Digimon te\nretará a pelear si lo ves."
text.1694: "También hay Digimon en\nlugares húmedos como las\ncloacas. Ayúdalos."
text.176c: "Algunos Digimon insecto\nviven más allá del Lago\nOjo de Dragón. Ve a pescar."
text.1832: "Cuando un Digimon androide\nse rompe, puede repararse\nsolo y muy rápido."
text.18fa: "Si temes al peligro,\nperderás de vista tu meta."
text.1966: "Hay que tener valor para\nescalar un acantilado\npeligroso al menos una vez."
text.1a36: "Escucha todo lo que oigas\nen la ciudad sobre quienes\nnecesitan ayuda."
text.1afc: "Hace poco, un tipo malo se\nmudó a una zona muy\npoblada. Quizá sea..."
text.1be0: "Dicen que hay una tablilla\nantigua enterrada, pero\nalguien tiene que sacarla."
text.1ca8: "Un Digimon raro aparece\nen una selva y reta\na otros a pelear."
text.1d68: "Quizá haya Digimon que\nvivan en los árboles,\n¿quién sabe?"
text.1e16: "En una ciudad de hierro al\noeste, un Digimon raro puede\naparecer y retar a otros."
text.1efa: "Hay un Digimon alienígena.\nQuizá lo conozcas algún día."
text.1f9e: "Hay un Digimon animal\nmítico. Está en una casa\nque perdió a sus dueños."
text.2076: "Debes seguir buscando a\nNanimon hasta conseguir\nel verdadero tesoro."
text.2136: "Myotismon desapareció.\nSigue las pistas que\nhay en su mansión."
text.21f0: "Aún hay Digimon que no\nconoces, ¡pero termina\nprimero lo más importante!"
text.22c4: "El último Digimon nacerá\nen el último lugar al que\nvayas. ¿Lo entiendes?"
