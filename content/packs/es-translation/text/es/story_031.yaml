text.0040: "!"
text.0058: "¿Qué le pasó a la isla?"
text.0092: "Las tribus se separaron, sin\nmemoria y ya salvajes."
text.0100: "No sé cuánto tiempo más\npodré seguir cuerdo."
text.0152: "¡No podemos dejarlo así!\n¡Deben ver el peligro!"
text.021c: "¡Alto! ¿Quieres arruinar\nla isla?"
text.0278: "¿Quién eres? ¡Quítate de mi\ncamino! ¡No hay otra manera!"
text.031c: "¿Me estás diciendo que\nhay otra manera?"
text.037a: "¡Si la isla se arruina,\nno tiene sentido!\nEscúchame."
text.03fe: "¿Qué?"
text.0418: "Construimos una ciudad para\nla isla reuniendo a todos\nlos Digimon."
text.049a: "Oí que podemos salvar a la\nisla de este peligro si\nunimos a los Digimon."
text.0532: "Creo que tienes razón, pero\nreunir a todos los Digimon\nes una gran..."
text.05cc: "Ya estamos trabajando en\neso. ¡Nada es imposible!"
text.063e: "¡Es una gran tarea!\nPero me conmueve...\nQuizá ustedes lo logren."
text.06c8: "Si crees en nosotros, quiero\nque vengas a la ciudad."
text.073e: "Está bien. Iré a la ciudad.\n¡Ese será mi nuevo camino!"
text.07f0: "¡Meramon se une a la ciudad!"
text.084a: "Sabía que volverías.\n¡Necesito saber la respuesta!"
text.08f0: "Supongo que perdí..."
text.091c: "Hay algo que\nnecesito decirte."
