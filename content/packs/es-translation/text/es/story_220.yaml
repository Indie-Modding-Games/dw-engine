text.0022: "{color:7}Poyomon {color:1}\nPoyomon. Me llamo Poyomon."
text.0084: "{color:7}Poyomon {color:1}\nTe hablaré de la digievolución.\nBueno... Sobre la etapa que\nsigue a los Digimon Campeón."
text.014e: "{color:7}Poyomon {color:1}\nSe llama Digimon Ultra.\nPero no es seguro que un\nCampeón siempre digievolucione."
text.0214: "{color:7}Poyomon {color:1}\nDigievolucionar es difícil,\npero una vez en Ultra,\ntu vida se alarga."
text.02d8: "{color:7}Poyomon {color:1}\nCon los objetos de\ndigievolución, la vida\nno se alarga."
text.0370: "{color:7}Poyomon {color:1}\nTe hablaré de la digievolución.\nBueno... Sobre las condiciones\npara digievolucionar."
text.0428: "{color:7}Poyomon {color:1}\nPrimero, el peso debe estar\ncerca del rango de peso de\nla siguiente etapa."
text.04b6: "{color:7}Poyomon {color:1}\nLuego, conviene tener\nparámetros altos, pero cada\nuno tiene efectos distintos."
text.0566: "{color:7}Poyomon {color:1}\nLos errores de cuidado.\nSegún el Digimon que quieras,\na veces los errores son buenos."
text.062e: "{color:7}Poyomon {color:1}\nAh, por cierto, hay otras\ncondiciones especiales para\nvolverse ciertos Digimon."
text.06d6: "{color:7}Poyomon {color:1}\nComo una disciplina muy\nalta, o muchas batallas."
text.0756: "{color:7}Poyomon {color:1}\nAsí, aunque no se cumplan del\ntodo las tres condiciones\nbásicas, puedes digievolucionar."
text.082a: "{color:7}Poyomon {color:1}\nJiji me dijo que {color:10}{partner}{color:1}\npronto digievolucionaría."
text.089c: "{color:7}Poyomon {color:1}\nDe Bebé a Entrenamiento\nse tarda seis horas."
text.0920: "{color:7}Poyomon {color:1}\nY solo se tarda un día en\nllegar a la etapa Novato."
text.09ac: "{color:7}Poyomon {color:1}\nLa siguiente etapa, Campeón,\ntarda unos tres días."
text.0a2c: "{color:7}Poyomon {color:1}\n¿Cuánto falta para la que\nsigue? Lo olvidé, pero\ntarda más."
text.0ab4: "{color:7}Poyomon {color:1}\nEl peso, los parámetros y\nlos errores de cuidado afectan\nla digievolución."
text.0b42: "{color:7}Poyomon {color:1}\nNo sé bien los detalles,\nasí que le preguntaré a Jiji."
