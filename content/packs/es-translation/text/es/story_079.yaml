text.009c: "Más allá está la\nZona de Tiempo Veloz.\nNo te acerques mucho."
text.012e: "Tengo dos objetivos.\nUno es descubrir el\npeligro de la isla."
text.01b2: "El otro es llevar\nDigimon a la ciudad."
text.0212: "¿Y a qué quieres llegar?"
text.023e: "Ayúdame, por favor\nNo, olvídalo"
text.0286: "No puedo. Debo vigilar\neste bosque."
text.02d4: "Entonces, ¿sabes algo\nsobre el peligro de la isla?"
text.0346: "No sé nada. Espera."
text.037c: "Recuerdo que una gran roca\ncayó del cielo\nhace poco."
text.03fc: "¿Dónde cayó?"
text.0428: "En la Zona de Tiempo Veloz,\ndel otro lado del bosque."
text.04a2: "¡Déjame ir! ¡Quizá encuentre\nalguna pista!"
text.0506: "..."
text.0512: "Si insistes.\nVe a investigar."
text.057e: "Más allá de este punto,\nel tiempo corre al doble.\nLleva suficiente comida."
text.0610: "También cuídate de\nenvejecer demasiado."
text.0672: "Deberías revisar\notros lugares."
text.06dc: "Más allá de este punto,\nel tiempo corre al doble.\nLleva suficiente comida."
text.076e: "También cuídate de\nenvejecer demasiado."
text.07dc: "¿Pasó algo?"
text.0810: "Todavía no."
text.0828: "Según mi maestro,\nhay un pasadizo secreto."
text.0890: "Pero no sé dónde está."
text.08da: "¿Qué es eso?"
text.08f8: "¡Parece un meteorito!\nNo hay de qué preocuparse."
text.096c: "Lo siento, pero eso\nes todo lo que sé."
text.09ae: "Gracias de todos modos."
text.09da: "¡Toma esto!"
text.0a82: "¡No sirves para nada!"
text.0aac: "¡¿Maestro?!"
text.0ac4: "¡No puedo creer que\nsigas aquí!"
text.0b1c: "¿Maestro? ¿Quién es?"
text.0b4c: "Pero, Maestro, ¿quién vigilará\nla Región Dino Antigua?"
text.0bba: "La isla vive un momento\ncrítico. ¡Ve a la ciudad\ny ayuda a los demás!"
text.0c5c: "¡Sí, señor!"
text.0c7c: "¡¿Seguro que está bien?!"
text.0cba: "Aún es joven, pero\npor favor, ponlo a trabajar.\nYo vigilaré este lugar."
text.0d54: "Maestro..."
text.0d74: "{color:6}{tamer}{color:1}, eso es todo.\n¿Puedo ir a la ciudad?"
text.0de4: "Debes esforzarte."
text.0e12: "¡Lo haré!\n¡Maestro, hasta luego!"
text.0e92: "¡Tyrannomon se une\na la ciudad!"
text.0ed6: "¿Qué podrá hacer?"
text.0f1a: "Hacía tiempo que no\nvigilaba este lugar."
text.0f7a: "Puedes pasar cuando quieras."
text.0fc2: "Hacía tiempo que no\nvigilaba este lugar."
text.1022: "Puedes pasar cuando quieras."
