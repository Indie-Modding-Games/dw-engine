text.009a: "¡Ja! Tienes miedo."
text.00d4: "¡Mejor vete a casa!"
text.0114: "Una vez que entras,\nya no puedes salir."
text.0170: "¡Je, je!"
text.0198: "Espera."
text.01b8: "Te poseerán."
text.0202: "¿Bakke-bakke?"
text.0226: "Parece que está\npreguntando algo."
text.0272: "?...Sí\n?...No"
text.02a8: "¡Bakke! ¿Bakke bakke?"
text.02d6: "Sí\nNo"
text.0300: "¿Bakkeee...bakke bakke?"
text.0338: "Sí\nNo"
text.035e: "¡Bakke bakke!\n¡Bakkeee bakke bakkeee!"
text.03e8: "¡Bakemon se une a la ciudad!"
text.0422: "Creo que salió bien."
text.046e: "¿Quizá lo hice enojar?"
text.04ea: "¡Me detuvo una extraña\nfuerza negra!"
text.0556: "¡¿Qué?! Mis piernas están..."
