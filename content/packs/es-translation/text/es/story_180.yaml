"text.006c": "No me siento bien."
"text.0098": "¿Estás bien?"
"text.00c0": "Me siento mal."
"text.00ec": "¿Aquí es donde vives?"
"text.0122": "Me siento enfermo. Sin energía."
"text.0158": "Te ves fatal."
"text.017e": "Está empeorando."
"text.01ac": "Tengo que averiguar por qué."
"text.01e6": "¿De dónde viene esta\nagua sucia?\n¡Voy a averiguarlo!"
"text.0282": "¿Qué es esto?"
"text.02b2": "¡¿Qué pasó, {color:10}{partner}{color:1}?!"
"text.02ea": "¡Esta niebla apesta!"
"text.0312": "Es rara, medio asquerosa."
"text.0350": "Bien, la alcantarilla\nvolvió a la normalidad."
"text.039a": "Ya estará bien.\nResolví el problema."
"text.040c": "¡Algo anda mal!"
"text.0450": "¡Da da da!"
"text.04bc": "Estoy cansado.\n¿Qué les pasó a ustedes?"
"text.050e": "¡Suena más tonto!\nQuizá recuperó la razón."
"text.0574": "¿Me llamas tonto?\n¡Qué grosero! Me llamo Numemon."
"text.05e8": "Si no eres tonto,\n¿qué eres?"
"text.0630": "Disculpa, Numemon. ¿Sabes\nquién te salvó la vida?"
"text.06a0": "¿Eh? ¿Quieres que te\nsalve la vida? Bien."
"text.06fc": "Aggh. ¡No entiende\nnada! Bueno, no importa."
"text.0766": "Oye, seré un salvador. ¡Genial!"
"text.07ae": "Ven a nuestra ciudad, por favor.\n¿Sabes dónde está?"
"text.081c": "Más o menos."
"text.087c": "¡Numemon se une a la ciudad!"
"text.08ce": "¡¿Quién es?!"
"text.08ec": "¡¿Quién eres?!"
"text.0984": "¡Conseguí un {color:4}Llavero\nDimensional{color:1}! ¡Ya puedo\nllevar hasta veinte objetos!"
"text.0a46": "¡Conseguí un {color:4}Llavero\nDimensional{color:1}! ¡Ya puedo\nllevar hasta treinta objetos!"
