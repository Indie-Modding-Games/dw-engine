text.0048: "Gruun."
text.005a: "Gruun.ru.ru.."
text.007e: "¡Algo volvió a la vida!"
text.00ce: " ? "
text.00dc: "Antes vivía en la ciudad.\nHueles a la ciudad."
text.0156: "¡Guau!"
text.0166: "Da miedo. Dejé la ciudad\ny perdí la memoria."
text.01ca: "Pero gracias a ti,\nahora lo recuerdo todo."
text.022a: "Voy a volver a la ciudad,\n¿está bien?"
text.0274: "Claro. Seguro que la\nciudad está más animada\nque antes."
text.02f8: "¿De verdad? ¡Bien!\n¡Daré lo mejor de mí!"
text.037c: "¡Betamon se une a la ciudad!"
text.03c2: "¡Este es mi territorio!"
text.0402: "Je, je, je. ¡Bien!"
text.043c: "¡Ya verás!"
