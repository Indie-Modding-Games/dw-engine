text.004c: "Máquina expendedora"
text.007a: "¡Cielos, qué caro!"
text.00b6: "Carne: 300 Bits\nDigihongo: 600 Bits\nNo comprar"
text.015e: "No me alcanza el dinero."
text.01b2: "No me alcanza el dinero."
text.01f6: "¡Salió {color:6}Carne{color:1}!"
text.023e: "¡Ups! Llevo demasiadas cosas."
text.0286: "¡Salió un\n{color:6}Digihongo{color:1}!"
text.02ec: "¡Ups! Llevo demasiadas cosas."
text.0338: "Cómo pescar:\nPrimero, consigue una «caña».\nVerás un submenú {color:5}× {color:1}\ncon el ícono «Pesca». Elígelo.\nPon la carnada con {color:6}△ {color:1}.\nElige algo de la comida\nque llevas."
text.0480: "Luego, cambia de dirección\ncon izquierda o derecha.\nAlza la caña con {color:6}△ {color:1}\ny lánzala con {color:6}△ {color:1}.\nEspera a que el flotador se\nmueva: el pez mordió la\ncarnada. Tira con {color:6}△ {color:1}."
text.05f8: "Mira el medidor de arriba a\nla izquierda. Suelta {color:6}△ {color:1}antes\nde que se llene, o el sedal\nse romperá. Ten cuidado.\nSi acercas el flotador lo\nsuficiente hacia ti, habrás\natrapado el pez."
text.077a: "Si ves una «X» en la sombra\ndel pez, no puedes pescarlo\ncon la carnada que usas."
