text.005c: "¡Myotismon! ¿Qué pasó?"
text.00b0: "¡Bakke!"
text.00c6: "..."
text.00ea: "Nos veremos en la Arena.\nQuizá mis hombres me extrañen."
text.0172: "Mis hombres no obedecen.\nMe llevaré a SkullGreymon."
text.01d8: "SkullGreymon ya no es igual.\nAhora obedece a otros."
text.024e: "Myotismon, ¿estás bien?"
text.02a8: "Ugghh... ¡Eres tú!\nMe salvaste otra vez."
text.0306: "¿Qué pasó?"
text.032a: "¿Has visto a Devimon?"
text.035e: "Sí. Es malvado."
text.038a: "Arruinó mi investigación\ncon su maldad."
text.03da: "¿Tu investigación\nsobre SkullGreymon?"
text.0422: "Reunía huesos y los\nestaba armando.\nTendré más cuidado."
text.04b8: "Ese Devimon es terrible."
text.04ec: "Lo conozco bien."
text.0514: "¡¿Qué?!"
text.0528: "Siempre fue tramposo,\npero nunca tan malo."
text.0580: "Quizá alguien le\nlavó el cerebro."
text.05d8: "Puede ser."
text.05ec: "Si fuera el de siempre,\npodría unirse a ustedes."
