text.0060: "¡Voy a ganar!"
text.0098: "¡Bien, vamos, amigo!"
text.00d4: "¿Qué va a pasar ahora?"
text.0122: "De ninguna manera funcionará."
text.0168: "Tengo hambre."
text.0186: "Darle comida\nNo darle comida"
text.01de: "Ahora no tengo comida."
text.0266: "¡Ups! No puedo darte esto."
text.02b8: "Qué rico..."
text.02de: "¡A pelear!"
text.032e: "Esto no está bien.\n¿Qué debería hacer?"
text.0380: "¡Ven a la ciudad y paga\nlo que comiste trabajando!"
text.03e6: "Bien, lo haré. Soy un\nDigimon insecto llamado\nKunemon. Mucho gusto."
text.04c0: "¡Kunemon se une a la ciudad!"
text.0508: "La próxima vez trae algo."
