text.0010: "¿Qué tienda quieres?"
text.004c: "Clínica\nCazatesoros\nAdivino"
text.00aa: "La convertí en un hospital."
text.0100: "No se siente bien,\n¿verdad? ¡Tienes que\ncuidar su salud!"
text.018c: "Déjame tratarlo ahora mismo.\nLa tarifa tendrá descuento:\ntrescientos bits."
text.0242: "¡¿No tienes bits suficientes?!\nPágame lo que puedas.\nAhorra para cuando haga falta."
text.02f6: "Ya está todo bien.\nTen más cuidado en adelante."
text.0364: "No se ve enfermo ni\nherido. ¿Qué necesitas?"
text.03d0: "Revísalo\nVéndeme medicina\nNada"
text.042c: "Bien, déjame ver\ncómo está {color:10}{partner}{color:1}."
text.048a: "Oh, no. El cansancio de\n{color:10}{partner}{color:1} es muy peligroso.\n¡Tiene que descansar ya!"
text.0540: "{color:10}{partner}{color:1} está muy\ncansado. Debe descansar\nantes de que sea tarde."
text.05da: "{color:10}{partner}{color:1} parece un poco\ncansado. No debería\nexigirse tanto."
text.0664: "{color:10}{partner}{color:1} está bien, pero el\ncansancio trae todo tipo\nde males. Ten cuidado."
text.06fe: "Bueno, ¿cómo se siente?"
text.0742: "Mentalmente, {color:10}{partner}{color:1}\nestá muy relajado.\nVivirá mucho tiempo."
text.07da: "El estado mental de\n{color:10}{partner}{color:1} es excelente.\nEs señal de una vida sana."
text.0880: "{color:10}{partner}{color:1} parece muy\nrelajado. ¿Le pasó\nalgo bueno?"
text.0918: "No creo que {color:10}{partner}{color:1}\nesté muy estresado.\nDiría que está normal."
text.09be: "{color:10}{partner}{color:1} parece algo\nestresado. Entrénalo\ncon más calma."
text.0a40: "{color:10}{partner}{color:1} tiene\ndemasiado estrés.\nNecesita divertirse."
text.0aac: "{color:10}{partner}{color:1} tiene mucho estrés\ny no está feliz. No debería\nexigirse tanto."
text.0b4e: "¡{color:10}{partner}{color:1} tiene\ndemasiado estrés! Si sigue\nasí, ¡no vivirá mucho!"
text.0be4: "Mmm.... Esto es lo mejor\nque puedo hacer por\n{color:10}{partner}{color:1}."
text.0c40: "¿Necesitas algo\nmás de mí?"
text.0c8e: "Revísalo\nVéndeme medicina\nNada"
text.0cee: "Mmm, debería estar bien."
text.0d26: "Venda:    cuatrocientos bits\nMedicina: mil doscientos bits\nNo comprar nada"
text.0dca: "Cuando no se sienta bien,\nven a verme de inmediato."
text.0e50: "Llevas demasiadas cosas."
text.0ea8: "No tienes bits suficientes.\nNo puedo vendértelo."
text.0f28: "Llevas demasiadas cosas."
text.0f80: "No tienes bits suficientes.\nNo puedo vendértelo."
text.0fee: "¿Necesitas algo\nmás de mí?"
text.103c: "Revísalo\nVéndeme medicina\nNada"
text.109c: "Cambié de oficio y\nahora soy Cazatesoros."
text.1112: "¿Quieres encargar una\nbúsqueda de tesoros?\n¿Quieres información?"
text.11ac: "Quiero información\nNo necesito información\nOlvídalo"
text.121c: "Hay dos planes con\ndistintos tiempos y precios."
text.128e: "Normal: tres días, mil bits\nEsp.: diez días, cinco mil bits"
text.130a: "Con el Plan Especial\nhay más probabilidad de\nencontrar mejores tesoros."
text.139e: "Eso es todo.\nEntonces, ¿qué quieres hacer?"
text.13fe: "Explícalo otra vez\nBuscar tesoros\nNada"
text.145a: "¡Elige un plan!"
text.147e: "Normal: tres días, mil bits\nEsp.: diez días, cinco mil bits\nCancelar"
text.1518: "Bien, entonces adiós."
text.1564: "Muy bien, tendrás resultados\nen tres días. Deséame suerte."
text.1602: "Muy bien, tendrás resultados\nen tres días. Deséame suerte."
text.1680: "No tienes bits suficientes.\nNecesito dinero para\nbuscar tesoros."
text.1734: "{color:7}Letrero {color:1}\nEstoy buscando tesoros\nahora mismo. Espera\nun rato: Drimogemon."
text.17d6: "¿Sabes qué?\nEncontramos un tesoro."
text.1976: "¡Haz espacio en tus cosas!"
text.19aa: "¡Conseguí {color:6}{item:pstat=110}{color:1}!"
text.1af2: "¡Gracias por tu preferencia!"
