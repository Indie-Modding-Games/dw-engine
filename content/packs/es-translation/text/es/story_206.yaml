text.0034: "Oye, ¿quieres jugar una\npartida conmigo? Si ganas,\nharé lo que digas."
text.00da: "¿Qué clase de partida?"
text.0108: "La llamo...\n¡Curling Digimon! \nTe cuento más adentro."
text.0186: "Mmm, ¿y qué pasa si pierdo?"
text.01c6: "Nada la primera vez.\nPero la próxima tendrás\nque darme un pez antes."
text.025c: "Entonces, si gano, vienes\na la ciudad conmigo. ¿Sí?{cell:0000}\nPues hagámoslo."
text.02f4: "Muy bien, me parece. \nVamos adentro."
text.0384: "Oye, ¿quieres jugar una\npartida conmigo? Dame un\npez y podrás jugar."
text.0426: "Te voy a ganar\nNo, gracias"
text.0474: "¡Hola, hermano! Hice\nuna pista de patinaje aquí."
text.04c2: "Un pez por partida.\nPero si ganas, te daré\nun buen premio."
text.0554: "Oye, amigo, ¿no quieres\nuna partida conmigo? Puedes\nretarme con un pez."
text.0606: "Acepto\nNo, gracias"
text.0642: "Rayos, qué aburrido."
text.0676: "¡Dame un pez!"
text.06ae: "Ahora no tengo nada..."
text.0738: "Ay, no, darte esto\nno sirve de nada."
text.079a: "Guau, se ve sabroso. Ups,\nprimero hay que jugar.\nVamos adentro."
text.0842: "Ay, vamos, amigo.\n¿Por qué no vas a pescar\nal Lago Ojo de Dragón?"
text.08d6: "Lo siento, hermano. Vuelve\na retarme. Y no olvides\ntraer otro pez."
text.0992: "¡Impresionante! ¡Puntaje\nperfecto! ¿Acaso eres...\nprofesional?"
text.0a34: "{color:7}¡Felicidades!\n¡Toma una medalla por\ntu gran competencia! {color:1}"
text.0ab8: "Increíble, amigo. Es la\nprimera vez que pierdo."
text.0b20: "Muy bien, ahora ven a la\nciudad conmigo como prometiste."
text.0b94: "Bueno, supongo que debo ir.\nPero ya decidí lo que\nvoy a hacer en la ciudad."
text.0c7a: "¡Penguinmon se une\na la ciudad!"
text.0cd2: "Lo siento, hermano. Vuelve\na retarme. Y no olvides\ntraer un pez."
text.0d82: "¡Impresionante! ¡Puntaje\nperfecto! ¿Acaso eres...\nprofesional?"
text.0e24: "{color:7}¡Felicidades!\n¡Toma una medalla por\ntu gran competencia! {color:1}"
text.0ea8: "Guau, eres increíble. \nPerdí otra vez."
text.0f00: "Bueno, qué te digo.\nAquí tienes tu premio."
text.0ff8: "¡Llevas demasiados objetos!"
text.103c: "¡Conseguí {color:6}{item:pstat=110}{color:1}!"
text.106a: "Hola, {color:6}{tamer}{color:1}. Cuido\nla tienda como favor\na Penguinmon."
text.10ea: "¡Juega una partida conmigo!\nSi ganas, te daré mi\npremio especial. ¿Qué dices?"
text.118c: "Muy bien, hagámoslo\nNo, gracias"
text.11da: "Dame el pez antes\nde la partida."
text.123e: "Ay, ahora no\ntengo nada."
text.12da: "Darte esto\nno sirve de nada."
text.1330: "Bueno, esta vez voy\na ganar. Vamos adentro."
text.13a2: "No puedo jugar sin\nun pez. Vuelve en\notro momento."
text.1436: "¿Qué? ¿Me estás\nrechazando?"
text.1488: "Si quieres ganarme,\n¡más te vale usar la cabeza!\nNos vemos algún día."
text.1546: "¡¡Me ganaste con puntaje\nperfecto!! ¡¿Eres un\ngenio del curling?!"
text.15e0: "{color:7}¡Felicidades!\n¡Toma una medalla por\ntu gran competencia! {color:1}"
text.1664: "¡Eres bueno, {color:6}{tamer}{color:1}!\n¡Aquí tienes el premio\nque te prometí!"
text.17a2: "Llevas demasiados objetos."
text.17e6: "¡Conseguí {color:6}{item:pstat=110}{color:1}!"
