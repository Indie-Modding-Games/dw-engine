text.0a16: "Normal\nIntento extra\nSalir"
text.0a54: "Corre por el Circuito Sabana."
text.0a8e: "Aumenta mucho la Velocidad\ny también el HP máximo."
text.0afc: "Explicar otra vez\nEmpezar\nSalir"
text.0b56: "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}para\nalinear tres dibujos."
