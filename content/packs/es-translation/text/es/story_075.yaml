text.0096: "He oído hablar de ti."
text.00d6: "Si sabes de nosotros y de\nla ciudad, ¿por qué no\nvienes conmigo?"
text.0166: "Yo también pienso en el\nfuturo de la isla. He estado\nbuscando algo."
text.0218: "¿Qué estás buscando?"
text.0252: "Algo que dejaron mis\nancestros, pero\nno sé qué es."
text.02fe: "Ya veo. Si lo encuentro,\nte aviso."
text.0354: "Llevo mucho tiempo\nbuscándolo.\nNo será fácil de encontrar."
text.03cc: "Pero si lo encuentras,\nte prometo\nque iré a tu ciudad."
text.044c: "¿Es esto?"
text.0474: "¡Oh, eso es!"
text.04b8: "Esto es lo que escribieron\nmis ancestros. A ver."
text.0524: "Cuando el peligro llegue a\nla isla, ve a la ciudad."
text.0592: "¡Mis ancestros dicen\nque debo ir!"
text.05de: "¿Nos vas a ayudar?"
text.061e: "¡Cuenta conmigo!"
text.0686: "¡Leomon se une a la ciudad!"
text.06ca: "Tengo que buscar algo.\nDisculpa, pero debo irme..."
text.0756: "{color:5}Entrenamiento:\nGolpe especial {color:1}"
text.0796: "Empezar\nExplicar\nSalir"
text.07ce: "Normal\nIntento extra\nSalir"
text.080c: "Golpea con toda tu fuerza\nun saco de concreto."
text.0868: "Esto aumenta el Ataque\ny el HP máximo."
text.08c4: "Explicar otra vez\nEmpezar\nSalir"
text.091e: "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}para\nalinear tres dibujos."
