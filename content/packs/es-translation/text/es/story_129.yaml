"text.00c6": "¡Hola, {color:6}{tamer}{color:1}!"
"text.00f4": "¡Hola, {color:6}{tamer}{color:1}!"
"text.0122": "¡Hola, {color:6}{tamer}{color:1}!"
"text.0154": "Gracias por volver."
"text.0190": "¡Hola, soy Mojyamon!"
"text.0280": "{color:6}{tamer}{color:1}, ¡qué feliz estoy!\nHas hecho mucho por nosotros."
"text.02e2": "Decidí que iré a la\nciudad. Trabajaremos\njuntos, ¿de acuerdo?"
"text.03a4": "¡Mojyamon se une a la ciudad!"
