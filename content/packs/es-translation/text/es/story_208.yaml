text.002e: "Periódico Concha Ocho\nAparece un Digimon alienígena:\nEncontramos el OVNI.\nLa criatura mostró su cuerpo\ny dijo palabras extrañas.\n¿Es un extraterrestre?\n¿Volverá a aparecer?"
text.018a: "Atrás\nSalir"
text.01bc: "Periódico Concha Siete\nMyotismon niega su\nretiro:\nEn una entrevista,\nnegó los rumores.\nSigue trabajando duro.\nAma a sus fans.\nTambién anunció que\nsu alumno, SkullGreymon,\nhará su debut."
text.0368: "Atrás\nAdelante\nSalir"
text.03d0: "Periódico Concha Seis\n¿Se retira Myotismon?:\nSe rumora que el popular y \nhábil Myotismon se retira.\nNadie en la arena lo ha\nvisto. Su carrera llega\na su fin. Está muy viejo."
text.0544: "Atrás\nAdelante\nSalir"
text.05b4: "Periódico Concha Cinco\nTesoro escondido:\nUna gran tienda en la\nSabana Engranaje. Solo abre\ndel uno al quince cada año.\nSu encargado está orgulloso\nde sus objetos raros."
text.0710: "Atrás\nAdelante\nSalir"
text.0794: "Periódico Concha Cuatro\n¿Un Digimon legendario?:\nSe rumora que hay un\nDigimon de clima frío en\nTierra Helada. Salvó al\nSr. M. Parecía una gran\nbola de nieve. ¡Digimon\nque no aguantan el frío,\ntengan cuidado!"
text.094e: "Atrás\nAdelante\nSalir"
text.09aa: "Periódico Concha Tres\n¿Un guardián del lago?:\nEl Guardián del Lago está\nen el Lago Ojo de Dragón.\nAlguien llamó a la criatura,\nque parece un Digimon.\n¿Puede este guardián\ncumplir deseos?"
text.0b10: "Atrás\nAdelante\nSalir"
text.0b80: "Periódico Concha Dos\n¡Un OVNI!:\nUn reporte dice que el OVNI\nestá cerca del Monte\nPanorama. Parece un plato\nplateado con luz que\nsale por debajo.\n¿Es un extraterrestre?\nPronto, más información."
text.0cf8: "Atrás\nAdelante\nSalir"
text.0d48: "Periódico Concha Uno\n¡Se acabaron los bandidos!:\n{color:6}{tamer}{color:1} encontró la\nguarida, liderada por Ogremon.\nPero Ogremon sigue \nsuelto y la gente\naún está preocupada."
text.0e70: "Adelante\nSalir"
