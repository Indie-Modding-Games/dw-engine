text.0056: "Oye, quiero {color:6}Carne{color:1}."
text.008e: "Bienvenido, quieres\n{color:6}Carne{color:1}. Bueno, eh..."
text.0102: "Subir precio\nDejar en cincuenta bits\nBajar precio"
text.0174: "Eh, quieres {color:6}Carne{color:1}\na buen precio, ¿no? Eh..."
text.01fa: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na setenta y cinco bits?"
text.0268: "Subir a setenta y cinco\nLo pensaré mejor"
text.02f0: "¿Y la {color:6}Carne{color:1} de cincuenta\na setenta bits?"
text.034c: "Subir a setenta\nLo pensaré mejor"
text.03d4: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na sesenta y cinco bits?"
text.043e: "Subir a sesenta y cinco\nLo pensaré mejor"
text.04c2: "¿Y la {color:6}Carne{color:1} de cincuenta\na sesenta bits?"
text.051a: "Subir a sesenta\nLo pensaré mejor"
text.059e: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na cincuenta y cinco bits?"
text.0608: "Subir a cincuenta y cinco\nLo pensaré mejor"
text.0680: "¿Y la {color:6}Carne{color:1} de cincuenta\na su precio normal?"
text.06dc: "Dejar a precio normal\nLo pensaré mejor"
text.075e: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na cuarenta y cinco bits?"
text.07c8: "Bajar a cuarenta y cinco\nLo pensaré mejor"
text.084c: "¿Y la {color:6}Carne{color:1} de cincuenta\na cuarenta bits?"
text.08a4: "Bajar a cuarenta\nLo pensaré mejor"
text.0928: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na treinta y cinco bits?"
text.0994: "Bajar a treinta y cinco\nLo pensaré mejor"
text.0adc: "¡Bien, la compro!"
text.0b28: "Ganancia total: {shopvar}\nGanancia:\ncuarenta"
text.0b7e: "Ganancia total: {shopvar}\nGanancia:\ntreinta y cinco"
text.0be0: "Ganancia total: {shopvar}\nGanancia:\ntreinta"
text.0c38: "Ganancia total: {shopvar}\nGanancia:\nveinticinco"
text.0c9a: "Ganancia total: {shopvar}\nGanancia:\nveinte"
text.0cf2: "Ganancia total: {shopvar}\nGanancia:\nquince"
text.0d4c: "Ganancia total: {shopvar}\nGanancia:\ndiez"
text.0d9e: "Ganancia total: {shopvar}\nGanancia:\ncinco"
text.0de8: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.0eaa: "¡¡Me voy!!"
text.0ef4: "No viene ningún cliente..."
text.0f32: "¡Cobras demasiado!"
text.0f6c: "¿En serio? Bueno, entonces..."
text.0fa0: "Oye, tengo que conseguir\nun {color:6}Orinal portátil{color:1}."
text.0ff0: "Eh... Bienvenido, ¿quieres un\n{color:6}Orinal portátil{color:1}?"
text.105c: "Subir precio\nDejar en trescientos bits\nBajar precio"
text.10d8: "Eh... ¿quieres un buen precio\nen un {color:6}Orinal portátil{color:1}?"
text.1160: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na cuatrocientos cincuenta bits?"
text.11fc: "Subir a cuatrocientos cincuenta\nLo pensaré mejor"
text.128a: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na cuatrocientos veinte bits?"
text.1330: "Subir a cuatrocientos veinte\nLo pensaré mejor"
text.13ba: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos noventa bits?"
text.145a: "Subir a trescientos noventa\nLo pensaré mejor"
text.14e6: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos sesenta bits?"
text.158c: "Subir a trescientos sesenta\nLo pensaré mejor"
text.1616: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos treinta bits?"
text.16b6: "Subir a trescientos treinta\nLo pensaré mejor"
text.1736: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na su precio normal?"
text.17dc: "Dejar a precio normal\nLo pensaré mejor"
text.185e: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos setenta bits?"
text.18fc: "Bajar a doscientos setenta\nLo pensaré mejor"
text.198a: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos cuarenta bits?"
text.1a2c: "Bajar a doscientos cuarenta\nLo pensaré mejor"
text.1ab8: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos diez bits?"
text.1b4e: "Bajar a doce\nLo pensaré mejor"
text.1c98: "¡Bien, lo compro!"
text.1ce4: "Ganancia total: {shopvar}\nGanancia:\ndoscientos cuarenta"
text.1d52: "Ganancia total: {shopvar}\nGanancia:\ndoscientos diez"
text.1dbc: "Ganancia total: {shopvar}\nGanancia:\nciento ochenta"
text.1e2c: "Ganancia total: {shopvar}\nGanancia:\nciento cincuenta"
text.1e9a: "Ganancia total: {shopvar}\nGanancia:\nciento veinte"
text.1f0a: "Ganancia total: {shopvar}\nGanancia:\nnoventa"
text.1f62: "Ganancia total: {shopvar}\nGanancia:\nsesenta"
text.1fb8: "Ganancia total: {shopvar}\nGanancia:\ntreinta"
text.2006: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.209c: "¿No es demasiado?"
text.20ce: "¿No? Bueno...\nBueno, entonces..."
text.210c: "Oye, quiero\n{color:6}Medicina{color:1}."
text.214c: "Eh... Bienvenido, ¿quieres\n{color:6}Medicina{color:1}?"
text.21b2: "Subir precio\nDejar en mil bits\nBajar precio"
text.222c: "Eh, ¿querías un buen precio\nen {color:6}Medicina{color:1}?"
text.22b2: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil quinientos bits?"
text.233e: "Subir a mil quinientos\nLo pensaré mejor"
text.23c8: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na mil cuatrocientos bits?"
text.244e: "Subir a mil cuatrocientos\nLo pensaré mejor"
text.24da: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil trescientos bits?"
text.2568: "Subir a mil trescientos\nLo pensaré mejor"
text.25f4: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na mil doscientos bits?"
text.2676: "Subir a mil doscientos\nLo pensaré mejor"
text.26fe: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil cien bits?"
text.2788: "Subir a mil cien\nLo pensaré mejor"
text.2804: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na su precio normal?"
text.2892: "Dejar a precio normal\nLo pensaré mejor"
text.2914: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na novecientos bits?"
text.2996: "Bajar a novecientos\nLo pensaré mejor"
text.2a20: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na ochocientos bits?"
text.2aa0: "Bajar a ochocientos\nLo pensaré mejor"
text.2b2c: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na setecientos bits?"
text.2bb4: "Bajar a setecientos\nLo pensaré mejor"
text.2d24: "Ganancia total: {shopvar}\nGanancia:\nochocientos"
text.2d8a: "Ganancia total: {shopvar}\nGanancia:\nsetecientos"
text.2df0: "Ganancia total: {shopvar}\nGanancia:\nseiscientos"
text.2e52: "Ganancia total: {shopvar}\nGanancia:\nquinientos"
text.2eb6: "Ganancia total: {shopvar}\nGanancia:\ncuatrocientos"
text.2f1a: "Ganancia total: {shopvar}\nGanancia:\ntrescientos"
text.2f80: "Ganancia total: {shopvar}\nGanancia:\ndoscientos"
text.2fe2: "Ganancia total: {shopvar}\nGanancia:\ncien"
text.303a: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.30d0: "Está algo caro."
text.30fc: "¿Tú crees? Bueno, entonces..."
