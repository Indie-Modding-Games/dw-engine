text.004a: "Bienvenido. Nunca te había\nvisto. ¿De dónde eres?"
text.00c2: "De la ciudad. En realidad,\nsoy de otro mundo."
text.0120: "¿Entiendes mi idioma?"
text.015e: "Sí, lo entiendo."
text.017a: "A veces es difícil y\naquí no vendo mucho."
text.01e0: "Ya veo."
text.01f4: "Muchos clientes ya no vienen."
text.0236: "Debe ser por los problemas\nde la isla."
text.0288: "Ayúdame con algo."
text.02ba: "¿Qué es?"
text.02d8: "¿Puedes trabajar en mi tienda?"
text.0310: "¿En tu tienda?"
text.032c: "¿Medio día? Mientras más\nvendas, más te pagaré.\nTú conoces nuestro idioma."
text.03c8: "Podrías perder dinero."
text.03fa: "No te preocupes. Me hará\nbien. ¿Qué tal ocho horas?"
text.0474: "Lo intentaré\nNo, gracias"
text.05fa: "Qué lástima. Vuelve cuando\ntengas tiempo."
text.065e: "¿Quieres trabajar?"
text.06b2: "Bueno, ya vas a la mitad.\n "
text.0750: "Así como vamos, no ganaremos\nnada. Esfuérzate más.\n "
text.07e2: "Las ventas van bien.\nPodemos ganar algo de dinero."
text.084a: "Hacía mucho que no tenía\ntanto negocio.\n¡Sigue así!"
text.08d8: "Creo que ya es hora.\nGracias por tu trabajo."
text.0944: "Pudo ser mejor, pero\nno estuvo tan mal.\nNo te rindas."
text.09d4: "¡Gané quinientos Bits!"
text.0a22: "Puedes hacerlo mejor.\nQuiero que trabajes más."
text.0a86: "¡Gané mil quinientos Bits!"
text.0ace: "Tu sabiduría, carácter y\nvalor son lo que necesitamos\npara salvar esta isla."
text.0b60: "¿De qué estás hablando?"
text.0b9e: "Te estaba poniendo a prueba\npara ver si puedes salvarnos."
text.0c18: "Es importante ser\nbueno en la batalla."
text.0c68: "Además de fuerza, también se\nnecesitan valor y sabiduría."
text.0cd4: "¿Pasamos la prueba?"
text.0d06: "Sí, te ayudaré\nen todo lo que pueda."
text.0d56: "¿Vendrás a la ciudad?\n¿Qué harás\ncon la tienda?"
text.0dd2: "Puedo abrir una tienda luego.\nEsta tienda ya cumplió."
text.0e42: "¡Monochromon se une\na la ciudad!"
text.0e7e: "¡Gané dos mil Bits!"
