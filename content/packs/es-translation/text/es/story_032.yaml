text.007e: "¡Oye, pronto estará abierto!"
text.00e6: "¡Lo estábamos esperando!\n¡El túnel está abierto!"
text.014e: "Ya no tenemos que cruzar la\nmontaña. Gracias."
text.01c2: "Gracias. No habría podido\nmover la roca yo solo."
text.0234: "¿Qué hago ahora?"
text.026e: "Deberías venir a la ciudad.\n¡Encontrarás cosas que hacer!"
text.02e6: "Aún tengo mucha energía.\nAcepto tu oferta con gusto."
text.0362: "¡Pronto estará abierto!"
text.03dc: "¡Drimogemon se une\na la ciudad!"
