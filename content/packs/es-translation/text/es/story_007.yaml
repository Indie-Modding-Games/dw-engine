text.0038: "¡Ah, sí!"
text.0050: "¿Tocas la {color:6}Flauta azul{color:1}\ndel Guardián del Lago?"
text.00b6: "La tocaré\nNo la tocaré"
text.0188: "¿Necesitas ayuda, amigo?"
text.01ce: "Llévame a la otra orilla."
text.020e: "Claro. Súbete."
text.033c: "¡Seadramon!"
text.0358: "Nos volvemos a ver.\n¿Tienes alguna petición?"
text.03bc: "Seamos amigos\nEnséñame una técnica\nQuiero un objeto"
text.0444: "Ya somos amigos.\n¿Alguna otra petición?"
text.050c: "¿Pero qué...? ¡Oh, no!\n¡Es el Guardián del Lago!"
text.056c: "Eh, sí. Soy Seadramon."
text.05a0: "¡Así que tú eres quien\nha pescado tanto!\nEn fin. ¿Alguna petición?"
text.0634: "¿¡Qué!? Ya veo por qué te\nllaman Guardián.\nSí, tengo una petición."
text.06bc: "Seamos amigos\nEnséñame una técnica\nQuiero un objeto"
text.0738: "Bien, de acuerdo."
text.0754: "Desde ahora somos amigos.\nTe doy esta flauta\ncomo prueba."
text.07ec: "¡Oh, no! Demasiados objetos.\nTengo que tirar algunos."
text.085e: "¡Obtuve la {color:6}Flauta azul{color:1}\ndel Guardián del Lago!"
text.08b4: "Si tocas la flauta cerca\ndel lago, vendré. Te\nllevaré a la otra orilla."
text.095c: "¿Puedo ir a la otra\norilla? ¡Gracias!"
text.09bc: "Más allá del lago hay\nun bosque extraño. ¿Quieres\nir allí ahora mismo?"
text.0a5e: "Sí, iré\nNo, quizá después"
text.0aaa: "Te enseñaré una técnica."
text.0af6: "¡Dominé «Magia acuática»!"
text.0b40: "¡Dominé «Ráfaga invernal»!"
text.0b8e: "¡Dominé «Gigacongelación»!"
text.0bcc: "Eh, creo que ya no hay\nmás técnicas que\npueda enseñarte..."
text.0c5c: "¡Adiós!"
text.0ca8: "Bien, te daré la\n{color:6}Cantimplora{color:1}."
text.0d12: "¡Oh, no! Demasiados objetos.\nTengo que tirar algunos."
text.0d84: "¡Sí! ¡Obtuve la\n{color:6}Cantimplora{color:1}!"
text.0dca: "¡Adiós!"
text.0e16: "Bien, súbete a mi lomo."
text.0ece: "Hasta pronto."
