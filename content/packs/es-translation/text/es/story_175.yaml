"text.0050": "Bienvenido a mi restaurante."
"text.0088": "Decidí ser\nel encargado y chef\nde este restaurante."
"text.0104": "Disfruta mi cocina ardiente\ntodo lo que quieras."
"text.0180": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\n¿no quieren probar\nmi cocina casera?"
"text.01d6": "A diferencia de los objetos,\nesto es cocina de verdad.\nEs mi talento secreto."
"text.027c": "¡{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nDecidí vivir de\nla cocina. ¡Soy bueno!"
"text.02f6": "Relájate y ven\na comer a mi restaurante\nalguna vez."
"text.037e": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}.\n¡Por fin abrí mi\nrestaurante!"
"text.03d4": "¡Prueba el postre helado!\nEs mi especialidad."
"text.044a": "{color:6}{tamer}{color:1}, decidí\ntrabajar como chef\nen este restaurante."
"text.04c2": "Aquí puedes disfrutar\nde comida caliente."
"text.0520": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\n¡ahora soy cocinero profesional!"
"text.0572": "Si quieres probar mi\ncocina, ¡mejor ven\nen la mañana!"
"text.0614": "¡{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nDecidí vivir de\nla cocina. ¡Soy bueno!"
"text.068e": "Puedes comer mi cocina\nespecial muy temprano\ny a medianoche."
"text.0750": "¡Hola, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
"text.0770": "Decidí ayudar en\neste restaurante.\nMe dejan hacer postres."
"text.07ee": "Estoy muy orgulloso\nde mi postre.\nNo dejes de probarlo, ¿sí?"
"text.08a8": "¡Guau! ¡Oye, {color:6}{tamer}{color:1}!\n¿Para qué es esta máquina?"
"text.08fa": "¡No te asustes! ¡Es una\nrockola que me acelera\nel corazón! ¡Bien!"
"text.098a": "¡Tienes que bailar!\n¡Vamos, suéltate! ¡Espero\ntu pedido!"
