text.0034: "¡Yo me encargo de ti!"
text.006a: "¡Yo me encargo de ti!"
text.00a0: "¡Yo me encargo de ti!"
text.0102: "¿Qué dice?"
text.012c: "Regresa al lugar\ndonde el tonto te\ndio los puntos."
text.01d8: "Usé la {color:6}\nLlave refri. {color:1}"
text.0234: "No lo veo."
text.025e: "Hay una nota."
text.0284: "Regresa al lugar\ndonde el tonto te\ndio los puntos."
text.0310: "Debería hacerle caso\na esta nota."
text.036a: "Es un refrigerador."
text.039a: "Tiene llave. Nunca había\nvisto un refri con llave."
