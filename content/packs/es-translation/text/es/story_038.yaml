text.0088: "¿Puedes dejar de hacer eso?"
text.00c6: "¡Shuha, shuha!"
text.00f6: "¡Zas!"
text.0118: "¡Peleemos con todo!"
text.0158: "¿De qué hablas?"
text.019a: "Noroeste: Tierra Helada"
text.01d8: "Elevador"
text.01f0: "Presionar ARRIBA\nPresionar ABAJO\nNo subir"
text.02b4: "¿Qué?"
text.02c4: "No pasa nada."
