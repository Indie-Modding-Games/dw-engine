text.006c: "¿Eres un Digimon?"
text.00a6: "¡¿De dónde eres, compa?!"
text.00e8: "¡No te burles de mí!"
text.0128: "¡Te voy a devorar!"
text.01a4: "Oh, no, si no hago\nnada, se va a secar..."
text.020a: "Ojalá llueva..."
text.023e: "¡Guau, qué interesante!\nEstá brotando."
text.0294: "Se movió un poquito.\n¿Es la planta misteriosa\nde la que todos hablan?"
text.0340: "Se está marchitando. Si no\nhago nada, se morirá."
text.03ac: "¿Vas a usar objetos?"
text.03de: "Sí\nNo"
text.0410: "Ahora no tengo nada."
text.045c: "Nada de lo que tengo sirve."
text.04ae: "Esto no funcionará..."
text.0800: "Je, je, je."
text.0818: "¡Hola, soy Vegiemon!"
text.084c: "¡¿Qué?! ¿Un Digimon planta?"
text.0880: "Por cierto, ¿te gustan\nlas verduras?"
text.08d4: "¿Por qué me preguntas\npor las verduras? ¿Y bien?"
text.0932: "Me gustan\nNo me gustan"
text.0966: "Bueno, cambié de opinión."
text.09a8: "Quien ama las verduras\ndebe ser buena persona."
text.0a14: "¡No, no!\n¡Las verduras son buenas!"
text.0a52: " ? ? ? "
text.0a68: "Bien, ya lo decidí.\n¡Iré contigo!"
text.0acc: "Qué tipo tan insistente...\n¡Oye, espera!"
text.0b1e: "¡Pues entonces no voy!\n¡Adiós!"
text.0b60: "¡Decídete de una vez!"
text.0b8c: "¿Qué quieres que haga?"
text.0bd0: "¡Ven a la ciudad\na ayudarnos!"
text.0c36: "Bien, suena bien.\nLlevo demasiado tiempo aquí."
text.0cea: "¡Vegiemon se une a la ciudad!"
