text.0084: "Oye, ¿tú eres el que\nestá haciendo una ciudad?"
text.00d6: "Sí."
text.00ea: "Eh, tienes mucha suerte\nde conocerme."
text.0132: "No lo parezco, pero soy un\nDigimon Ultra. Si me\nvences, te ayudaré."
text.01d6: "Bien, acepto\nNo, gracias"
text.0258: "¡Guau, perdí! Bueno, nos\nvemos en la ciudad."
text.02f0: "¡Piximon se une a la ciudad!"
text.033a: "¡Ay, qué cobarde!\n¡Nos vemos otra vez!"
text.03c0: "¡Oh, señorita!"
text.03f0: "Oye, amigo, ¿qué tal?"
text.0430: "¡Wuki, wuki!"
text.0460: "¿Eh?"
