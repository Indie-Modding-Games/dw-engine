"text.008e": "Mmm"
"text.00b4": "Parece un nido de ave.\n¿Qué opinas?"
"text.012e": "Oigo un ruido."
"text.01bc": "Eres bueno."
"text.01dc": "Así que era tu nido."
"text.020c": "Sí."
"text.0222": "Perdón por entrar sin permiso."
"text.026a": "Ah, no te preocupes."
"text.02a4": "?"
"text.02ae": "He oído hablar de ti."
"text.02da": "No sabía que era famoso."
"text.0318": "Quizá seas el único humano\nque queda en la isla."
"text.0388": "¿Que queda...? ¿Hubo\notros antes que yo?"
"text.03e0": "¿No me vas a invitar\na la ciudad?"
"text.0440": "Ah, sí, ¿no quieres venir\na la ciudad?"
"text.0492": "Bien. Entonces vamos al\ngrano. Sujétate fuerte."
"text.0534": "¡Birdramon se une a la ciudad!"
"text.066a": "Elevador"
"text.0682": "Bajar una vez\nBajar dos veces\nNo subir"
"text.074e": "¿Eh?"
"text.075c": "Nada. No funciona."
