text.0062: "¡Aléjate!"
text.008a: "¡Lárgate!"
text.00b2: "¡Es mío!"
text.00dc: "¡Lo tengo!"
text.0114: "{color:7}? ? ? {color:1}\n..."
text.013c: "{color:7}? ? ? {color:1}. Una flor."
text.0172: "{color:7}? ? ? {color:1}\nSoy una flor."
text.01ae: "{color:7}? ? ? {color:1}\n¡Dije que soy una flor!\n¿¡No me estás escuchando!?"
text.0262: "Odio pelear."
text.028e: "En ese caso,\nven a la ciudad."
text.02d6: "Allí hay paz."
text.030a: "¿La ciudad?"
text.0322: "Suena divertido.\nSoy Palmon.\n¡Te seré útil!"
text.03cc: "¡Palmon se une a la ciudad!"
