text.027a: "¡Alerta de intruso!"
text.02a2: "¡Alerta de intruso!"
text.02ca: "¡Voy a disparar!"
text.0346: "¿¡Estás bien, {color:10}{partner}{color:1}!?"
text.0376: "Volvamos."
text.03b2: "¡Oh, no! Tengo que reanimar\na {color:10}{partner}{color:1}."
text.131c: " !!! "
text.1364: "¡Es increíble que hayas\ncruzado el bosque!"
text.13cc: "Soy Centarumon.\nPerdón por lo que hice."
text.1426: "No te probé por diversión.\nQuiero trabajar contigo."
text.149a: "Adelante. Me quedaré en\nla ciudad a esperarte."
text.1536: "¡Centarumon se une\na la ciudad!"
text.1584: "{color:10}{partner}{color:1}, ¡creo que\nnos estamos haciendo famosos!"
text.15e2: "¡Sigamos así!"
text.1632: "¡Fallé!"
