"text.003c": "¿Adónde vas?"
"text.007a": "¡Espera!"
"text.009a": "¡Dopiiii!"
"text.00c0": "¡Gguhh Jeyii Jii!"
"text.00f6": "¿Quién eres?"
"text.0114": "¡Soy MetalMamemon, invicto\nen noventa y nueve batallas!\n¡Tú serás la número cien!"
"text.01b0": "No creo que alguien como\n{color:6}{tamer}{color:1}vaya a huir."
"text.0214": "Bien, peleemos\nPerdón, luego"
"text.0294": "Eres mejor de lo\nque pensaba."
"text.02d4": "¡Eres un rival digno!"
"text.0306": "¡Algún día te venceré!"
"text.0372": "¡MetalMamemon llega a la ciudad!"
"text.03c6": "Sabía que te acobardarías.\nBueno, nos vemos cuando\ntengas más agallas."
