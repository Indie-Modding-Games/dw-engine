"text.0020": "Quiero vencer a Kabuterimon.\n¿Qué necesito para ganar?"
"text.0098": "Mmm. Tienes que ser más fuerte.\nHay una forma segura...\nbueno, tú aguanta."
"text.015e": "Ya veo. Bien, entrenaré."
"text.019e": "¡¿En serio?! ¡Pues te entreno!"
"text.01e8": "Solo ven a la ciudad."
"text.0220": "..."
"text.022c": "Eres muy amable.\nIré a la ciudad."
"text.02bc": "¡Kuwagamon se fue a la ciudad!"
"text.0304": "Vaya, no eres nada amable.\n¡Qué decepción!"
"text.0368": "Oye, tú has ido a esos\ntorneos de insectos, ¿no?"
"text.03d8": "Bueno, te enseñaré\nalgo útil."
"text.042a": "¿Sabes dónde duerme Kunemon?\n¿En el Bosque Nativo?"
"text.0496": "Ahí duermen los Digimon\nniños. Al despertar,\nse vuelven Kunemon."
"text.051e": "Pero a veces no pasa.\nEs cuestión de suerte."
"text.05a8": "Oye, tú has ido a esos\ntorneos de insectos, ¿no?"
"text.0618": "Eh... Tal como estás ahora,\nno lo lograrás."
"text.0676": "Bueno, te enseñaré\nalgo útil."
"text.06c8": "¿Sabes dónde duerme Kunemon?\nEn el Bosque Nativo."
"text.0734": "Ahí duermen los Digimon\nniños. Al despertar,\nse vuelven Kunemon."
"text.07bc": "Pero a veces no pasa.\nEs cuestión de suerte."
"text.0826": "Oye, ¿quieres entrar al\ntorneo de insectos?"
"text.0890": "¿Qué es eso?"
"text.08b0": "Hay que inscribirse antes\nde las diez del día veintidós."
"text.0924": "¿¿¿Eh???"
"text.0938": "Te darán los detalles\nel día del torneo."
"text.099c": "¿De qué estará\nhablando?"
"text.09ea": "Entrenaremos duro, pero\ntambién hay que descansar."
"text.0a42": "¿Descansamos una hora?"
"text.0a7e": "Descansemos\nNo descansar"
"text.0ae0": "{color:5}Entrenamiento:\nMáquina de martillo {color:1}"
"text.0b1e": "Empezar\nExplicar\nSalir"
"text.0b56": "Normal\nIntento extra\nMejor no"
"text.0ba0": "Recibir golpes de la máquina\nde martillo te hace fuerte.\nSube la Defensa."
"text.0c3e": "Explicar otra vez\nEmpezar\nSalir"
"text.0c98": "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ \npara alinear tres dibujos."
"text.0d22": "{color:5}Entrenamiento: Cinta {color:1}"
"text.0d54": "Empezar\nExplicar\nSalir"
"text.0d8c": "Normal\nIntento extra\nMejor no"
"text.0dd6": "Corre en sentido contrario\na la cinta que se mueve.\nSube tu Velocidad."
"text.0e5a": "Explicar otra vez\nEmpezar\nSalir"
"text.0eb4": "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}\npara alinear tres dibujos."
