text.007c: "¡Voy a ganar!"
text.00ae: "¡Nunca me vencerás!"
text.00ee: "¡Je je! ¡Lo siento mucho!"
text.012c: "¿Me estás ignorando?"
text.017a: "Si quieres pasar,\ndebes aceptar mi desafío."
text.021c: "Bajé la guardia, pero\ndos contra uno no es justo."
text.028a: "Bueno, puede ser.\nNo seas mal perdedor."
text.02ea: "Nunca pierdo contra nadie\nen una pelea justa."
text.034e: "Peleemos uno contra uno.\nVuelve mañana a las cuatro.\nSolo pelearán los Digimon."
text.03fe: "De acuerdo\nNo, gracias"
text.0436: "Entonces es una promesa.\n¡Nos vemos mañana!"
text.04e6: "Volviste, bien.\n¡Hoy pelearemos limpio!"
text.0550: "Llegas tarde, pero así tuve\ntiempo de curar mi herida.\nAhora, ¡vamos a ello!"
text.05f2: "Yo solo miraré. ¡Empiecen!"
text.0630: "¡Vamos, {color:10}{partner}{color:1}!"
text.067e: "¡Eres bueno! ¿Quién eres?"
text.06b8: "Exploramos para salvar\nla isla del peligro."
text.0734: "¿Qué?"
text.0746: "{color:6}{tamer}{color:1} se esfuerza\nmucho por convencerlo."
text.079a: "Te ayudaré. Pero primero\ntendré que ver esa ciudad."
text.0844: "¡Garurumon se une a la ciudad!"
