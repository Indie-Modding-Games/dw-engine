text.0060: "¡Rayos! ¡Dimos con una roca!"
text.0098: "No puedo perforarla."
text.00c6: "¿No puedes? ¡Oh, no!"
text.00f0: "Hay que ver cómo moverla.\n¿Tú puedes hacerlo?"
text.0164: "No lo sé."
text.0192: "{color:10}{partner}{color:1},\nnecesito tu ayuda."
text.034e: "¡Lo logramos!"
text.036a: "¡Guau, qué fuerza!\n¡Movimos la roca!"
text.03be: "Creo que más allá de este\npunto está vacío."
text.041e: "¡Es un río de lava!\n¡Es peligroso!"
text.0468: "Hay un camino junto al\nrío. ¡Vamos!"
text.04c2: "¿Vas a entrar?\n¡Ten cuidado!"
text.0516: "¿Vas a entrar?\n¡Ten cuidado!"
text.0576: "Vuelve con {color:10}{partner}{color:1}\ncuando haya crecido más."
