text.0066: "¡Te voy a noquear!"
text.00ce: "Hagámoslo otra vez."
text.00fa: "Sí\nNo"
text.0148: "Solo un poco más...\n¡Vamos, una vez más!"
text.01ae: "Sí\nNo"
text.020c: "¡No puedo ganar!"
text.0230: "¿Por qué quieres ganar?"
text.026e: "¿Qué debería hacer?"
text.0298: "¿Qué quieres decir?\n¿No tienes nada que hacer?"
text.02f4: "Tengo mucho tiempo libre."
text.032c: "Si te sobra tiempo, ven a\nla ciudad. Allí hay Digimon\nde todo tipo."
text.03d6: "Suena bien. Iré.\nMe llamo Patamon.\nNos vemos."
text.0482: "¡Patamon se une a la ciudad!"
text.04c8: "¡Eso no es divertido!"
text.04f6: "¿Vienes?"
text.052a: "¡No hueles a nada!"
text.0560: "Te ves sabroso.\n¡Te voy a devorar!"
text.05b6: "¡Ja, ja, qué gracioso eres!"
