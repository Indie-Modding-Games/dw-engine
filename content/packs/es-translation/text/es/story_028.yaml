text.002c: "Arreglé el letrero de entrada."
text.0086: "¡Qué calor! ¡Haz algo!"
text.00c8: "¿Qué está pasando?"
text.00f4: "¡Hace demasiado calor!\n¡Ya no lo soporto!"
text.0178: "Me puse raro\npor el calor."
text.01c8: "Ya sé que hace calor, pero...\n¡cálmate, amigo!"
text.0218: "Cuanto más cavamos, más\ncalor hace. El túnel\nestá en un volcán."
text.02a0: "No creo que sea la única\nrazón. Quizá haya\nun incendio cerca."
text.0330: "Mmm"
text.0340: "No tengo opción.\nDebo aguantar este calor\ny seguir cavando."
text.03d0: "Investigaremos la causa.\nSería genial que el\ntúnel llegara al otro lado."
text.045a: "Eres buena gente.\n¡Me daré prisa en\ncavar este túnel!"
text.050e: "Hoy me toca\ncocinar a mí."
