"text.003e": "¡Hay alguien aquí! ¡¿Quién es?!"
"text.00c4": "Je, je, ¡romperé la mala\ncomputadora! ¡Je, je, je!"
"text.0284": "Es él... ¡Oye!\nOye, ¡¿qué estás haciendo?!"
"text.02f0": "¡Sí! ¡Destruiré!\nDestruiré todo.\n¡Todo lo malo!"
"text.04b2": "Oh, no, está loco.\nEs un Digimon Ultra,\npero ¡hay que detenerlo!"
"text.054c": "Je, je, je,\n¡los destruiré a todos!"
"text.06c4": "¡Aggghhh! Pierdo energía."
"text.0702": "Nos quedamos sin electricidad.\nPidámosle a Andromon que pare\nel agua sucia de la fábrica."
