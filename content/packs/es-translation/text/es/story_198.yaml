text.0064: "Este es el último."
text.00a2: "¡Por fin llegamos!"
text.00e0: "¡El camino está libre!"
text.0118: "Hagámoslo fácil."
text.0154: "¡Es la última oportunidad!"
text.019a: "¿De verdad vas a ir?"
text.01f0: "¡Qué miedo! Lo siento\nen los huesos."
text.023a: "..."
text.0248: "¿Por qué no me ataca?"
text.0282: "..."
text.0290: "¿No tienes que pelear?"
text.02c8: "Démonos prisa y vámonos.\nTenemos que probar\nnuestras habilidades."
text.0348: "¡Vamos, {color:10}{partner}{color:1}!"
text.039c: "..."
text.03de: "¿Ganamos?"
