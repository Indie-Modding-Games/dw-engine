text.0034: "{color:5}Entrenamiento: Mover hielo {color:1}"
text.0068: "Empezar\nExplicar\nSalir"
text.009e: "Normal\nIntento extra\nSalir"
text.00da: "Empujar hielo da mucha fuerza."
text.011c: "Sube mucho el HP máximo.\nTambién sube la\nDefensa."
text.0198: "Explicar otra vez\nEmpezar\nSalir"
text.01f2: "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}para hacer\ncoincidir tres dibujos."
text.0274: "{color:5}Entrenamiento: Carámbanos {color:1}"
text.02aa: "Empezar\nExplicar\nSalir"
text.02e2: "Normal\nIntento extra\nSalir"
text.0320: "Entrena atrapando\nun gran carámbano."
text.0364: "La Defensa sube\nmucho.\nLa Velocidad también sube."
text.03e4: "Explicar otra vez\nEmpezar\nSalir"
text.043e: "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}para\nhacer coincidir tres dibujos"
