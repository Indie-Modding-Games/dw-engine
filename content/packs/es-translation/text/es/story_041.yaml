text.0058: "¡Esto no va bien!"
text.0096: "¿Dijiste algo?"
text.00d8: "Te dije que es imposible."
text.0124: "No tengo mucha confianza."
text.0174: "No seas duro conmigo."
text.01a6: "¡No te burles de mí!"
text.01ee: "Elevador"
text.0206: "Presionar AZOTEA\nPresionar ARRIBA\nNo subir"
text.026e: "No hace nada."
text.02ba: "Hay una roca atascada en\nla máquina. Quizá esto es..."
text.0334: "¡Quité la roca!"
text.0362: "¡Con eso debería bastar!"
text.03fe: "No hace nada."
text.044a: "Hay una roca atascada en\nla máquina. Quizá esto es..."
text.04bc: "¡Quité la roca!{cell:0000}"
text.04fe: "Con eso debería bastar."
