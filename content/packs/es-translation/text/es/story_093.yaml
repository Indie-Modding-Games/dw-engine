text.0066: "¡Guau, parece que está vivo!"
text.0096: "En realidad, empieza a moverse\ncuando nos movemos. ¡Espera!"
text.0144: "¿Qué pasa, {color:10}{partner}{color:1}?\n¿Encontraste algo?"
text.01a0: "¡Guau, qué bien,\n{color:10}{partner}{color:1}!"
text.0202: "¿Oh? Sobre esa estatua..."
text.024e: "¡Ah!"
text.0272: "Uf, bueno"
text.028e: "Volviste a la vida.\n¡Muy bien!"
text.02d4: "Soy Angemon, un ángel que\nte protege. He despertado\npara cumplir mi deber."
text.036a: "¿De qué está hablando...?"
text.03a8: "Conozco la verdad del cielo."
text.03e4: "Ofrezco mi alma para seguir\nlos mandatos terrenales."
text.044a: "¿De qué está hablando...?\n¿Vendrás a la ciudad?"
text.04c0: "Tu misión es mi deber.\nHe de partir."
text.050a: "Perdón, ¿pero puedes hablar\ncon palabras que entienda?"
text.0578: "Iré a la ciudad, así que\ntú debes seguir esforzándote."
text.05da: "Ya veo. ¡Gracias!"
text.0636: "¡Angemon se une a la ciudad!"
