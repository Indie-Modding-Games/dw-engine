text.00ce: "Ja, ja, si me tocas\nte vas a electrocutar."
text.016a: "¿No quieres estar aquí?"
text.01ee: "¡Guau! ¡Tiene agallas!"
text.022c: "¡Llegarás lejos!\nBien, te ayudaré."
text.029a: "¿No usarías tu poder\neléctrico para la ciudad?"
text.0300: "¿Ciudad? ¿Qué es eso?\nMe suena, pero..."
text.035a: "Te ayudaré. Soy Elecmon,\nmucho gusto."
text.03ec: "¡Elecmon se une a la ciudad!"
text.0432: "¡Ugghh!"
text.0454: "¡Ahhh!"
text.0474: "¡Estás acabado!"
text.04ac: "Nada mal."
text.04d2: "Tienes mal gusto."
text.050e: "¡Creído! Te daré una lección."
text.057e: "Esta puerta de hierro es dura.\nSi no se abre,\nno podremos entrar."
