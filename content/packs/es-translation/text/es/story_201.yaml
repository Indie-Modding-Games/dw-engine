text.0056: "Oye, quiero {color:6}Carne {color:1}."
text.0090: "Bienvenido, necesitas\n{color:6}Carne{color:1}. Bueno, eh..."
text.0104: "Subir precio\nDejar en cincuenta bits\nBajar precio"
text.0176: "Eh, quieres {color:6}Carne{color:1}\nbarata, ¿no? Eh..."
text.01e8: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na setenta y cinco bits?"
text.0256: "Subir a setenta y cinco\nLo pensaré mejor"
text.02de: "¿Y la {color:6}Carne{color:1} de cincuenta\na setenta bits?"
text.033a: "Subir a setenta\nLo pensaré mejor"
text.03c2: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na sesenta y cinco bits?"
text.042c: "Subir a sesenta y cinco\nLo pensaré mejor"
text.04b0: "¿Y la {color:6}Carne{color:1} de cincuenta\na sesenta bits?"
text.0508: "Subir a sesenta\nLo pensaré mejor"
text.058c: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na cincuenta y cinco bits?"
text.05f6: "Subir a cincuenta y cinco\nLo pensaré mejor"
text.066e: "¿Y la {color:6}Carne{color:1} de cincuenta\na su precio normal?"
text.06ca: "Dejar a precio normal\nLo pensaré mejor"
text.074c: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na cuarenta y cinco bits?"
text.07b6: "Bajar a cuarenta y cinco\nLo pensaré mejor"
text.083a: "¿Y la {color:6}Carne{color:1} de cincuenta\na cuarenta bits?"
text.0892: "Bajar a cuarenta\nLo pensaré mejor"
text.0916: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na treinta y cinco bits?"
text.0982: "Bajar a treinta y cinco\nLo pensaré mejor"
text.0aca: "¡Bien, me la llevo!"
text.0b18: "Ganancia total: {shopvar}\nGanancia:\ncuarenta"
text.0b6e: "Ganancia total: {shopvar}\nGanancia:\ntreinta y cinco"
text.0bd0: "Ganancia total: {shopvar}\nGanancia:\ntreinta"
text.0c28: "Ganancia total: {shopvar}\nGanancia:\nveinticinco"
text.0c8a: "Ganancia total: {shopvar}\nGanancia:\nveinte"
text.0ce2: "Ganancia total: {shopvar}\nGanancia:\nquince"
text.0d3c: "Ganancia total: {shopvar}\nGanancia:\ndiez"
text.0d8e: "Ganancia total: {shopvar}\nGanancia:\ncinco"
text.0dd8: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.0e9a: "¡¡Estoy perdiendo el tiempo!!"
text.0f06: "Vaya, ¿dónde están\nlos clientes?"
text.0f56: "¡Creo que cobras demasiado!"
text.0f96: "Puede ser. Bueno, entonces..."
text.0fce: "Daría lo que fuera por un\n{color:6}Orinal portátil{color:1}."
text.102a: "Eh... Bienvenido, ¿quieres un\n{color:6}Orinal portátil{color:1}barato?"
text.10a0: "Subir precio\nDejar en trescientos bits\nBajar precio"
text.111c: "Eh... a ver, ¿quieres un\n{color:6}Orinal portátil{color:1}?"
text.119c: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na cuatrocientos cincuenta bits?"
text.1238: "Subir a cuatrocientos cincuenta\nLo pensaré mejor"
text.12c6: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na cuatrocientos veinte bits?"
text.136c: "Subir a cuatrocientos veinte\nLo pensaré mejor"
text.13f6: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos noventa bits?"
text.1496: "Subir a trescientos noventa\nLo pensaré mejor"
text.1522: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos sesenta bits?"
text.15c8: "Subir a trescientos sesenta\nLo pensaré mejor"
text.1652: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos treinta bits?"
text.16f2: "Subir a trescientos treinta\nLo pensaré mejor"
text.1772: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na su precio normal?"
text.1818: "Dejar a precio normal\nLo pensaré mejor"
text.189a: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos setenta bits?"
text.1938: "Bajar a doscientos setenta\nLo pensaré mejor"
text.19c6: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos cuarenta bits?"
text.1a68: "Bajar a doscientos cuarenta\nLo pensaré mejor"
text.1af4: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos cuarenta bits?"
text.1b96: "Bajar a doce\nLo pensaré mejor"
text.1ce0: "¡Muy bien, me lo llevo!"
text.1d34: "Ganancia total: {shopvar}\nGanancia:\ndoscientos cuarenta"
text.1da2: "Ganancia total: {shopvar}\nGanancia:\ndoscientos diez"
text.1e0c: "Ganancia total: {shopvar}\nGanancia:\nciento ochenta"
text.1e7c: "Ganancia total: {shopvar}\nGanancia:\nciento cincuenta"
text.1eea: "Ganancia total: {shopvar}\nGanancia:\nciento veinte"
text.1f5a: "Ganancia total: {shopvar}\nGanancia:\nnoventa"
text.1fb2: "Ganancia total: {shopvar}\nGanancia:\nsesenta"
text.2008: "Ganancia total: {shopvar}\nGanancia:\ntreinta"
text.2056: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.20ec: "¡Vamos, hazme una rebaja!"
text.2126: "¿Eh? Bueno, entonces..."
text.2154: "Oye, necesito\n{color:6}Medicina{color:1}."
text.2194: "Eh... Bienvenido, ¿quieres\n{color:6}Medicina{color:1}?"
text.21fa: "Subir precio\nDejar en mil bits\nBajar precio"
text.2274: "Eh, querías {color:6}Medicina {color:1}\nbarata, ¿verdad?"
text.22f4: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil quinientos bits?"
text.2380: "Subir a mil quinientos\nLo pensaré mejor"
text.240a: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na mil cuatrocientos bits?"
text.2490: "Subir a mil cuatrocientos\nLo pensaré mejor"
text.251c: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil trescientos bits?"
text.25aa: "Subir a mil trescientos\nLo pensaré mejor"
text.2636: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na mil doscientos bits?"
text.26b8: "Subir a mil doscientos\nLo pensaré mejor"
text.2740: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil cien bits?"
text.27ca: "Subir a mil cien\nLo pensaré mejor"
text.2846: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na su precio normal?"
text.28d0: "Dejar a precio normal\nLo pensaré mejor"
text.2952: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na novecientos bits?"
text.29d8: "Bajar a novecientos\nLo pensaré mejor"
text.2a62: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na ochocientos bits?"
text.2ae2: "Bajar a ochocientos\nLo pensaré mejor"
text.2b6e: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na setecientos bits?"
text.2bf6: "Bajar a setecientos\nLo pensaré mejor"
text.2d44: "¡Bien, vendido!"
text.2d96: "Ganancia total: {shopvar}\nGanancia:\nochocientos"
text.2dfc: "Ganancia total: {shopvar}\nGanancia:\nsetecientos"
text.2e62: "Ganancia total: {shopvar}\nGanancia:\nseiscientos"
text.2ec4: "Ganancia total: {shopvar}\nGanancia:\nquinientos"
text.2f28: "Ganancia total: {shopvar}\nGanancia:\ncuatrocientos"
text.2f8c: "Ganancia total: {shopvar}\nGanancia:\ntrescientos"
text.2ff2: "Ganancia total: {shopvar}\nGanancia:\ndoscientos"
text.3054: "Ganancia total: {shopvar}\nGanancia:\ncien"
text.30ac: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.3142: "¡Eso es un robo!"
text.3178: "Bueno. Entonces..."
