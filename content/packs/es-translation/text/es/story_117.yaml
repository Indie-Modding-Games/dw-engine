"text.0090": "¿Quién es?"
"text.00ba": "¡Ya voy! Es broma."
"text.0100": "Ja, ja, ja. Esto es genial."
"text.0144": "¡Ay, voy a\ndisfrutar esto!"
"text.018c": "¡¿Lo dices en serio?!"
"text.01c4": "Oye, ¡¿lo dices en serio?!"
"text.0206": "¡Silencio!"
"text.022e": "¡Puedo hacerlo cuando\nme lo propongo!"
