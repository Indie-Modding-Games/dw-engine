text.0090: "Aquí hay letras\ngrabadas."
text.00dc: "¡Aquí no hay nadie! ¡Vete!"
text.011e: "¿Alguien vive aquí?"
text.0176: "{color:7}? ? ? {color:1}\nHasta los monos se caen."
text.01c8: "{color:7}? ? ? {color:1}\n¡Rodillazo volador!"
text.025e: "Perdí, ¡pero ustedes\nno son nada!"
text.02b4: "No seas mal perdedor.\nHasta nos atacaste\npor sorpresa."
text.0344: "¡Ugh! No me dejan\notra opción más que..."
text.0394: "¡En esa ciudad suya\nles mostraré lo fuerte\nque soy! ¡Ya verán!"
text.0462: "¡Etemon se une a la ciudad!"
text.04a0: "Solo saldrás lastimado."
text.04e0: "¡Eres un bebé!"
text.051c: "Supongo que puedo jugar\ncontigo."
text.056a: "¡Te romperé la nariz!"
text.05aa: "¡Te partiré en dos!"
