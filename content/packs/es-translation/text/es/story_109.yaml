"text.003a": "¡Guau, es increíble!"
"text.0092": "Oye, hay una tablilla de piedra.\nA ver..."
"text.0112": "Dice Leomon.\nNo puedo leer el resto."
"text.016c": "Entiendo lo que se habla,\npero no lo escrito..."
"text.01cc": "Llevémosla."
"text.0200": "Uy, tengo que tirar\nalgo."
"text.0262": "¡Conseguí la {color:6}Piedra\nLeomon{color:1}!"
"text.02ba": "¿Quién eres?"
"text.02da": "¡¿Quién eres?!"
"text.0370": "¡Conseguí un {color:4}Llavero\nDimensional{color:1}! ¡Ya puedo\nllevar hasta veinte objetos!"
"text.0434": "¡Conseguí un {color:4}Llavero\nDimensional{color:1}! ¡Ya puedo\nllevar hasta treinta objetos!"
