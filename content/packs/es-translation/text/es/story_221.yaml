text.001e: "¡{color:6}{tamer}{color:1}, lo lograste!"
text.0044: "Agumon vino a la ciudad.\nEmpezó un negocio\npor allá."
text.00be: "¡Ojalá más Digimon\nsean como él!"
text.012c: "Palmon vino y piensa\nampliar el campo de carne."
text.019c: "¡Así tendremos mucha carne!"
text.01f4: "Kunemon vino y\nquiere comer pasto."
text.024e: "¡Ojalá se coma la maleza!"
text.02a2: "Centarumon vino y\npiensa abrir una clínica."
text.0310: "¡Ya no hay que preocuparse\npor enfermarse o lastimarse!"
text.0386: "Coelamon vino y\nquiere abrir una tienda."
text.03ec: "¡La ciudad prosperará!"
text.0438: "Betamon vino y dijo que\nle gustaría abrir una tienda."
text.04a8: "¡La ciudad prosperará!"
text.04f4: "Bakemon vino y dijo algo\nque no entendí."
text.056c: "Sí, bueno, no pasa nada."
text.05b6: "Vegiemon vino. Piensa\nampliar más el campo de carne."
text.0632: "Ya no hay que preocuparse\npor la comida."
text.0686: "Tyrannomon vino y dijo que\nsu cocina es la mejor."
text.06f8: "Bueno, tiene su encanto."
text.0746: "Meramon vino y dijo que\nes el jefe de las llamas."
text.07c0: "¡Arde de motivación!"
text.0816: "Frigimon vino y dijo\nalgo sobre bocadillos."
text.0882: "Me encantan los bocadillos."
text.08bc: "Garurumon vino y\ndijo que sabe cocinar."
text.091e: "Es muy hábil."
text.0964: "Birdramon vino diciendo\nque será Mensajero."
text.09c4: "Suena bien."
text.09fa: "Shellmon vino diciendo que\nhará tablones de anuncios."
text.0a70: "¡Un paso hacia una\nsociedad de la información!"
text.0ada: "Elecmon vino y\nencenderá la electricidad."
text.0b46: "Ojalá la ciudad esté\nbien iluminada."
text.0b9c: "Kokatorimon vino y\nhabló de hacer una estatua."
text.0c10: "Un lugar donde relajarse."
text.0c66: "Monochromon vino hablando\nde trabajar como\nencargado de la Tienda de Objetos.{stop}"
text.0d08: "Es un profesional."
text.0d4e: "Unimon vino hablando de\nser útil en los negocios."
text.0dc4: "Buena actitud."
text.0e12: "Patamon vino preguntando\npor trabajos interesantes."
text.0e78: "Le sugerí la Tienda de Objetos."
text.0ec8: "Biyomon vino preguntando\nqué trabajo le recomiendo."
text.0f3c: "Le sugerí la Tienda de Objetos."
text.0f8c: "Greymon vino hablando\nde hacer una Arena."
text.0ff2: "Sin duda quiero\nverla."
text.104c: "Penguinmon vino\nhablando de hacer\nun estadio de curling."
text.10ca: "Tenemos mucha variedad."
text.1120: "Angemon vino y habló\nde grabar\nconversaciones."
text.1194: "Está aquí cerca."
text.11ce: "Drimogemon vino y habló\nde dedicarse por completo\na buscar tesoros."
text.1270: "¡Un gran trabajo!"
text.12a2: "Gabumon vino y\nhabló de que le preocupa\nhacer algo."
text.1334: "Le dije que eligiera\nun trabajo en grande."
text.13a0: "Ninjamon vino y\nhabló de entrenar."
text.1400: "Da gusto ver gente\ntrabajadora."
text.145a: "Whamon vino hablando\nde hacer de\nferri."
text.14e0: "¡Genial!"
text.150a: "Mojyamon vino hablando\nde abrir\nuna Tienda de todo."
text.1586: "Aunque tiene algo\nde raro."
text.15f4: "Mamemon vino hablando de\nvender objetos de tesoro."
text.166a: "¿Qué querrá decir\n«de tesoro»?"
text.16c8: "Numemon vino hablando\nde abrir una tienda,\npero es un secreto."
text.1752: "Ya no es un secreto."
text.17a0: "Kabuterimon vino hablando\nde entrenar y remodelar."
text.181e: "¿Habrá ido al Gimnasio Verde?"
text.1872: "Kuwagamon vino preguntando\ndónde está Kabuterimon."
text.18d8: "¿Adónde habrá ido?"
text.1916: "Giromon vino y dijo:\n¡haz un pedido!"
text.1976: "Así que haz un pedido."
text.19b8: "Ogremon vino y me\npidió que le comprara el brazo."
text.1a1c: "¡Tenía la mirada encendida!"
text.1a66: "Leomon vino y preguntó\nmucho sobre la ciudad."
text.1acc: "¡Parece que la Patrulla de\nla Sabana sigue activa!"
text.1b40: "Piximon vino y me preguntó:\n«Señor, ¿quiere un\nobjeto secreto?»"
text.1bca: "Me preocupa."
text.1c04: "Etemon vino hablando\nde abrir una tienda genial."
text.1c70: "Suena sospechoso."
text.1cb2: "MetalMamemon vino a\npreguntar si hay trabajos\npara competir con {color:6}{tamer}{color:1}."
text.1d4e: "Tiene espíritu competitivo."
text.1da4: "Vademon vino, y...\nespera, ¿sí vino?"
text.1dfc: "No logro recordarlo."
text.1e4c: "MetalGreymon vino\ny habló de ser modelo"
text.1eb2: "¡Se cree mucho!"
text.1efc: "Nanimon vino y se fue."
text.1f38: "¿Dónde estará?"
text.1f80: "Monzaemon vino, o mejor\ndicho, su caparazón\napareció de repente."
text.2012: "Decidió dejarlo en casa."
text.206e: "Devimon vino hablando de\nun objeto realmente fantástico."
text.20e4: "Supongo que es fantástico."
text.2130: "Airdramon ya sanó\ny habló de trabajar."
text.219a: "Qué bueno que volvió\na la normalidad."
text.21f4: "Digitamamon vino y se fue\na la velocidad de la luz."
text.2264: "Sigue en algún lugar\nde la ciudad."
text.22c4: "SkullGreymon vino diciendo\nque competirá\nen la Arena."
text.233e: "Myotismon me hizo\nde intérprete."
text.2396: "Andromon vino diciendo\nque fue un gusto conocernos."
text.23fa: "Parece que no puede\nquedarse mucho tiempo."
