text.006e: "Había alguien que quería\nser comerciante. Dicen que\ntiene una tienda por ahí."
text.011c: "Él es más útil que yo."
text.015c: "¿Por qué el tiempo aquí es\ndistinto al de otras zonas?"
text.01ba: "Seguro que aquí se vive\nbien, pero..."
text.0240: "He estado mirando todo\ndesde el cielo."
text.0292: "Al norte hay hielo y\nnieve. Vivir en un lugar\ntan frío es una locura."
text.0332: "He estado mirando todo\ndesde el cielo."
text.0384: "Al oeste hay una pequeña\nciudad de hierro."
text.03e6: "Pero entrada y salida están\ncerradas. Yo puedo ir volando."
text.0460: "He estado mirando todo\ndesde el cielo."
text.04b2: "Hay grupos de Digimon\ncon cuernos o garras."
text.0522: "Dicen que hacen sus casas\ntallando la madera."
text.0594: "He estado mirando todo\ndesde el cielo."
text.05e6: "Al noroeste hay un bosque\ncon edificios."
text.0644: "Está muy lejos."
text.066e: "He estado mirando todo\ndesde el cielo."
text.06c0: "¿Has cruzado el Gran Cañón?\nEs como un laberinto."
text.073a: "He estado mirando todo\ndesde el cielo."
text.078c: "No puedo ver el centro de la\nisla. Solo veo nubes."
text.0812: "Esto ya lo oíste."
text.0858: "Aquí el tiempo es lento.\nMedio día aquí es\ncomo un día allá afuera."
text.08de: "Para quien quiere descansar,\nes perfecto."
text.094e: "El tiempo corre rápido en\nla Zona de Tiempo Veloz.\nEstá justo más allá."
text.09d0: "Allí pasan dos días\nen lugar de uno."
text.0a26: "Tu Digimon crece más rápido,\npero se desvanece antes."
text.0aaa: "Máquina expendedora"
text.0ad0: "¿Qué saldrá?\n¿200 Bits cada uno?\n¿Lo compro?"
text.0b54: "Probar\nCancelar"
text.0b96: "No tengo suficiente dinero."
text.0bec: "¡Salió {color:6}Carne{color:1}!"
text.0c24: "Tengo demasiados objetos.\nDebo tirar algunos."
text.0cac: "¡Salió un\n{color:6}Recup. peq.{color:1}!"
text.0d0a: "Tengo demasiados objetos.\nDebo tirar algunos."
text.0d92: "¡Salió un\n{color:6}Bistec{color:1}!"
text.0dce: "Tengo demasiados objetos.\nDebo tirar algunos."
text.0e56: "¡Salió un\n{color:6}Disquete MP{color:1}!"
text.0e9c: "Tengo demasiados objetos.\nDebo tirar algunos."
