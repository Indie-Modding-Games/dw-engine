"text.0094": "Sigue derecho y\ngira a la derecha. Je, je, je..."
"text.0108": "Gira a la derecha y\nluego a la izquierda. Je, je..."
"text.016c": "No saldrás de este\nbosque. Je, je, je..."
"text.01dc": "¡Me perdí!"
"text.0208": "Últimamente ando cansado."
"text.024e": "¿Tú? ¡¿De ninguna manera?!"
"text.027e": "Ten cuidado por dónde pisas."
"text.02cc": "¡Oye, tú!"
"text.0318": "¡Mmm, eres algo especial!\nEso estuvo bastante bien\npara ser tan temprano."
"text.03c2": "¡Oye, oye, no actúes como\nsi no fuera asunto tuyo!"
"text.0438": "¡Ya sé! Ya sé de qué\nme hablas."
"text.0490": "Dicen que trabajas duro\npor la isla reuniendo\na los Digimon."
"text.0520": "Así que lo sabes. Bueno,\n¿por qué no me ayudas?"
"text.057a": "¿Y dónde se supone\nque haga qué?"
"text.05d2": "¡Ay, no entiendes nada!\nSe supone que trabajes\nen la ciudad, ¿recuerdas?"
"text.066c": "Bueno, como dicen... al que\nmadruga, el bicho le ayuda."
"text.06e2": "¡Eso no tiene nada que ver!\nAdemás, ¡es Dios quien\nayuda, no el bicho!"
"text.078a": "Es broma. Bueno,\nte veo en la ciudad..."
"text.0830": "¡Kokatorimon se une a la ciudad!"
"text.0876": "¿De verdad podemos confiar\nen él? Quién sabe..."
"text.08de": "Oye, aquí cayeron plumas\nde un ave. Aún están\nfrescas. ¿Llegamos tarde?"
