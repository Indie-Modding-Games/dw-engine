"text.009a": "¡No hay guardia!"
"text.00f8": "No puedes pasar por aquí."
"text.0136": "No puedes pasar por aquí."
"text.01dc": "......"
"text.01f0": "¡Vaya, nos está mirando!\nQuizá sospecha\nde nosotros."
"text.0266": "Deberíamos escondernos\ny volver después.\nSon las doce en punto."
"text.030e": "Esta fábrica debe tirar\nsus desechos a la\nalcantarilla. Debo averiguarlo."
"text.03d4": "¿Te puedes mover, por favor?"
"text.0412": "No puedes pasar sin un\npermiso del\nencargado."
"text.04a8": "Tengo prisa."
"text.04ce": "Lo siento, necesitas\nun permiso."
"text.051c": "Bien, si así son\nlas cosas."
"text.0580": "¿Y qué hacemos?"
"text.05b4": "Hora del cambio de turno\nDéjame pasar o verás\nNo, nada"
"text.0636": "Todavía no es hora del\ncambio de turno."
"text.0694": "Está bien, no te preocupes.\n¿Cuándo es el cambio?"
"text.0704": "No, debemos respetar\nel horario al pie de la letra."
"text.075e": "Los cambios de turno son\na medianoche y a mediodía."
"text.07bc": "Ah, ya veo."
"text.07e2": "No puedes amenazarme.\nNecesitas un permiso."
"text.084a": "¿Un permiso? Tengo uno.\n¡Yo te doy permiso!"
"text.08bc": "No podemos darte un permiso.\nTienes que seguir los\ntrámites debidos."
"text.0944": "¡Vaya, qué estrictos son!"
"text.097c": "¿Todavía no es el cambio?"
"text.09b8": "..."
"text.09c6": "¡Vaya, nos está mirando!\nCreo que no hará\nel cambio de turno."
"text.0a42": "Volvamos más tarde.\nQuizá debamos escondernos\ny esperar."
"text.0aca": "Bopi bopi puuuuu."
"text.0b02": "¡Geba geba!"
"text.0b2c": "¿Buubyo?"
"text.0b50": "¡Estoy satisfecho!"
"text.0b82": "Esto es parte de mi trabajo."
"text.0bc6": "¿Cuál es el problema?"
