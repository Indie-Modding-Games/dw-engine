"text.0438": "{color:1}Blanco Blanco Blanco\n{color:2}Azul Azul Azul\n{color:3}Rojo Rojo Rojo\n{color:4}Rosa {color:5}Verde\n{color:6}Celeste Celeste\n{color:7}Amarillo {color:10}Naranja\n{color:10}a {color:6}b {color:4}c {color:5}d"
"text.051c": "Ahora son las {num:pstat=107}: {num:pstat=108}\ndel día {num:pstat=106}\ndel mes {num:pstat=105}."
"text.0582": "Soy el Sr. Salto.\n¿Adónde quieres ir?"
"text.05d6": "Cerca\nLejos\nMuy lejos"
"text.0620": "La cima del Monte Panorama\nSelva Tropical\nTúnel Taladro"
"text.069e": "Sabana Engranaje\nMansión del Señor Gris\nGran Cañón"
"text.070c": "Reg. Dino Antigua: puerta\nReg. Dino Antigua: fondo\nMundo desconocido"
"text.07b6": "Frente a la Cueva del Curling\nPesca de Seadra\nCueva de Lava"
"text.083e": "Vida tres"
"text.085a": "Soy el Sr. Digievolución.\n¿Qué quieres ser?"
"text.08bc": "Numemon\nSukamon\nBotamon"
"text.0a50": "Medio muerto\nModo apertura\nAdelantar el tiempo"
"text.0acc": "Adelantar una hora\nAdelantar seis horas\nAdelantar diez días"
"text.0b76": "¿Quieres un poco de carne?"
"text.0bae": "Ay, perdón.\nOlvidé explicarte."
"text.0bfa": "Esta es una granja de carne.\nCultivamos carne para todos."
"text.0c60": "¿Cultivan carne en una granja?"
"text.0c98": "Sí, ¿qué tiene?"
"text.0cc4": "Nada... está bien.\nSigue, por favor..."
"text.0d20": "Jiji y yo decidimos darte\ntres piezas de carne\nal día, {color:6}{tamer}{color:1}."
"text.0da4": "Aquí está la carne de hoy."
"text.0df6": "Tienes demasiada carne.\nCreo que hoy no\nnecesitas más."
"text.0e82": "Tienes demasiada carne.\nMe quedo con lo que\nno puedas llevar."
"text.0efa": "¡Conseguí tres piezas de\n{color:6}Carne{color:1}!"
"text.0f52": "Tienes demasiados objetos."
"text.0f8a": "¡Conseguí tres piezas de\n{color:6}Carne{color:1}!"
"text.0fea": "¡Cosechamos mucha carne!\nAsí que te daré\ncinco piezas de carne."
"text.1088": "Tienes demasiada carne.\nCreo que hoy no\nnecesitas más."
"text.1110": "Tienes demasiada carne.\nCon gusto me quedo con\nlo que no puedas llevar"
"text.1192": "¡Conseguí cinco piezas de\n{color:6}Carne{color:1}!"
"text.11f0": "Lo siento, pero\ntienes demasiados objetos."
"text.1246": "¡Conseguí cinco piezas de\n{color:6}Carne{color:1}!"
"text.1286": "Mañana te daré más."
"text.12d8": "Aquí está la carne de hoy."
"text.131e": "Tienes demasiada carne.\nCreo que hoy no\nnecesitas más."
"text.13a6": "Tienes demasiada carne.\nCon gusto me quedo con\nlo que no puedas llevar."
"text.142a": "¡Conseguí tres piezas de\n{color:6}Carne{color:1}!"
"text.148a": "Tienes demasiados objetos."
"text.14c4": "¡Conseguí tres piezas de\n{color:6}Carne{color:1}!"
"text.1506": "Mañana te daré más."
"text.154c": "¿Qué? Hoy ya te di carne,\n¿recuerdas?"
"text.159e": "Si te quedas sin comida,\nbusca hongos en el\nBosque Nativo."
"text.1620": "Bien, te explicaré los\nalrededores de esta ciudad."
"text.1692": "El Bosque Nativo\nrodea la ciudad."
"text.16da": "Los Digimon de por ahí\nno son muy fuertes."
"text.173a": "Hay un campo de entrenamiento\nal oeste. Creo que irás\nseguido."
"text.17d4": "La Selva Tropical está al\neste, cruzando el río."
"text.1846": "No sé qué hay más allá."
"text.1888": "Hay una montaña y un lago\nal oeste,\ny no tiene salida."
"text.1910": "Si sigues hacia el sur,\nestá el océano."
"text.196a": "Y hay una montaña alta\nen el norte. Tampoco\ntiene salida."
"text.19ee": "Como esta ciudad es el centro\nde la isla, debe haber\ngrandes zonas en el norte."
"text.1a9c": "Investigaré los rumores\nsobre las afueras.\nVuelve para saber más."
