text.00a6: "¿Trajiste algo para\ncurar la herida?"
text.0104: "Espera un segundo. A ver..."
text.014c: "¡Me duele el ala!"
text.0170: "¿Qué pasó?"
text.0194: "Me lastimé el ala. ¿Tienes\nalgo para curar mi herida?"
text.020a: "Se ve mal. Aguanta.\n¿Qué debo hacer?"
text.027c: "Ahora no tengo nada."
text.02f8: "No sirve. ¡Así no!"
text.0346: "Está mucho mejor. Gracias."
text.0386: "¿Ya puedes volar?"
text.03b6: "Creo que no puedo volar lejos."
text.03f6: "Hay una clínica en la ciudad.\nDeberías ir allá.\nNo está lejos de aquí."
text.048a: "Oí hablar de la ciudad.\nEs más grande de lo que creía."
text.04f8: "Ve a la ciudad y descansa."
text.0534: "Gracias. Quizá algún día\nyo pueda ayudarte."
text.05c2: "¡Unimon se une\na la ciudad!"
text.0602: "Traeré algo para curar\ntu herida. Espérame."
text.0678: "Gracias. ¡Date prisa,\npor favor!"
