text.0042: "¡Esto debe ser!\nLo mire como lo mire,\nparece un meteorito común."
text.00d8: "Romperlo y revisar\nDejarlo así"
text.0130: "Mmm"
text.0146: "A mí me parece un\nmeteorito común y viejo."
text.019c: "{color:7}???mon {color:1}\nPerdón por verme\ntan común y viejo."
text.0202: "¡Guau!"
text.0212: "¡¿Eres un Digimon?!\n¿Quién eres?"
text.0264: "{color:7}???mon {color:1}\nMe llamo Meteormon."
text.02aa: "¿Sabes algo del peligro\nque amenaza a la isla?"
text.02fe: "¡No sé nada!"
text.0324: "¡¿No sabes nada?! ¿Seguro\nque no escondes algo?"
text.039c: "¡Qué grosero! ¡Muy bien!\n¡Peleemos para ver\nquién tiene la razón!"
text.041e: "¡Bien! ¡Vamos a ello!"
text.0488: "Me rindo. Eres muy fuerte."
text.04c8: "Dime lo que sepas sobre\nel peligro de la isla."
text.0542: "Acabo de nacer, ¡así que\nno sé nada!"
text.059e: "¡¿Qué?!"
text.05ba: "La Tribu Meteorito nace\nen el cielo y luego\ncae a la tierra."
text.064a: "Luego dormimos mucho tiempo.\nEn realidad, debía dormir\nmucho más, pero..."
text.06fa: "Aquí el tiempo va más rápido."
text.0738: "Seguramente. En fin, iré a\nrevisar la isla.\n¡Nos vemos!{stop}"
text.07f4: "No encontramos ninguna pista.\nSalgamos rápido."
text.086a: "Lo revisamos y no\nsacamos nada en claro.\n¡Rompámoslo!"
text.08f8: "{color:7}???mon {color:1}\n¿Qué crees que estás haciendo?\n¡Bruto imprudente!"
text.0998: "¿Eh? ¡¿Quién eres?!"
text.09c4: "¿Yo? ¡¿Y quién eres tú?!"
text.0a70: "Obtuve un {color:4}Llavero\nDimensional{color:1}.\n¡Puedo llevar veinte objetos!"
text.0b20: "Obtuve un {color:4}Llavero\nDimensional{color:1}.\n¡Puedo llevar treinta objetos!"
