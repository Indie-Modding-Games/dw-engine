"text.005a": "Este disfraz es distinto\na los demás. Tiene una\npresencia abrumadora."
"text.0130": "Tiene un cierre en la espalda."
"text.018e": "¡¿Qué pasó, {color:10}{partner}{color:1}?!"
"text.01d4": "¿Qué? ¿Te volviste\notro Digimon?\nSe ve bien."
"text.0250": " {color:10}{partner}{color:1},\n¿quieres meterte?"
"text.02ae": "No, no puedes, {color:10}{partner}{color:1}.\nSolo entra quien sea flexible\ny resbaloso."
