"penguinmon_dialogue.0001": "Primero, elige tu piedra"
"penguinmon_dialogue.0002": "de curling, por favor."
"penguinmon_dialogue.0005": "Hay piedras pesadas, medianas"
"penguinmon_dialogue.0006": "y ligeras, así que piensa en"
"penguinmon_dialogue.0007": "el mejor orden para usarlas."
"penguinmon_dialogue.0009": "Algunas piedras tienen cuatro"
"penguinmon_dialogue.0010": "clavos. Se quedan donde caen"
"penguinmon_dialogue.0011": "y pueden ser muy útiles."
"penguinmon_dialogue.0013": "Usa los botones de dirección"
"penguinmon_dialogue.0014": "a izquierda y derecha para"
"penguinmon_dialogue.0015": "elegir hacia dónde lanzar."
"penguinmon_dialogue.0017": "Con arriba y abajo mueves"
"penguinmon_dialogue.0018": "la pantalla. Presiona X para"
"penguinmon_dialogue.0019": "fijar la dirección del tiro."
"penguinmon_dialogue.0021": "Presiona X cuando la barra"
"penguinmon_dialogue.0022": "de fuerza llegue al nivel"
"penguinmon_dialogue.0023": "que quieras para lanzar."
"penguinmon_dialogue.0025": "Si tu piedra cae y toca"
"penguinmon_dialogue.0026": "la marca GOOD, ganas"
"penguinmon_dialogue.0027": "dos puntos."
"penguinmon_dialogue.0029": "Si queda en la línea azul,"
"penguinmon_dialogue.0030": "pero fuera de la marca GOOD"
"penguinmon_dialogue.0031": "del centro, ganas un punto."
"penguinmon_dialogue.0033": "Si tocas la marca BAD de"
"penguinmon_dialogue.0034": "abajo a la derecha, pierdes"
"penguinmon_dialogue.0035": "dos puntos. ¡Ten cuidado!"
"penguinmon_dialogue.0037": "Y si hay empate,"
"penguinmon_dialogue.0038": "¡gano yo!"
"penguinmon_dialogue.0039": "¡¡Así que a jugar!!"
"penguinmon_dialogue.0042": "¡No eres tan bueno!"
"penguinmon_dialogue.0045": "¡La batalla apenas empieza!"
"penguinmon_dialogue.0049": "¡Oye, eres bastante bueno!"
"penguinmon_dialogue.0053": "¡Sí! ¡Gané!"
"penguinmon_dialogue.0057": "Ay, perdí. "
"metalmamemon_dialogue.0001": "Sí. Primero tienes que elegir"
"metalmamemon_dialogue.0002": "el tipo de piedra de curling."
"metalmamemon_dialogue.0005": "Como soy un genio, uso varias"
"metalmamemon_dialogue.0006": "piedras en el orden correcto."
"metalmamemon_dialogue.0007": "Es la clave para ganar."
"metalmamemon_dialogue.0009": "Las piedras con cuatro clavos"
"metalmamemon_dialogue.0010": "se frenan y se quedan donde"
"metalmamemon_dialogue.0011": "caen, así que valen mucho."
"metalmamemon_dialogue.0013": "Elige hacia dónde lanzar con"
"metalmamemon_dialogue.0014": "los botones de dirección,"
"metalmamemon_dialogue.0015": "a izquierda y derecha."
"metalmamemon_dialogue.0017": "Con arriba y abajo puedes"
"metalmamemon_dialogue.0018": "desplazar la pantalla."
"metalmamemon_dialogue.0019": "Presiona X para lanzarla."
"metalmamemon_dialogue.0021": "Presiona X cuando la barra"
"metalmamemon_dialogue.0022": "de fuerza llegue al nivel"
"metalmamemon_dialogue.0023": "que quieras para lanzar."
"metalmamemon_dialogue.0025": "Puntos: si la piedra queda"
"metalmamemon_dialogue.0026": "en la marca GOOD,"
"metalmamemon_dialogue.0027": "ganas dos puntos."
"metalmamemon_dialogue.0029": "Si queda en la línea azul,"
"metalmamemon_dialogue.0030": "pero fuera de la marca GOOD"
"metalmamemon_dialogue.0031": "del centro, ganas un punto."
"metalmamemon_dialogue.0033": "Si caes en la marca BAD de"
"metalmamemon_dialogue.0034": "abajo a la derecha, son dos"
"metalmamemon_dialogue.0035": "puntos menos. ¡Cuidado!"
"metalmamemon_dialogue.0037": "Si hay empate, ¡gano yo!"
"metalmamemon_dialogue.0038": "¡¡Que empiece el juego!!"
"metalmamemon_dialogue.0041": "¡Voy a ganar!"
"metalmamemon_dialogue.0045": "¡Todavía no he perdido!"
"metalmamemon_dialogue.0049": "¡No puedo perder este juego!"
"metalmamemon_dialogue.0053": "¡Sí, gané!"
"metalmamemon_dialogue.0057": "Ay, casi gano."
"menu.0000": "Jugar     Cómo se juega"
