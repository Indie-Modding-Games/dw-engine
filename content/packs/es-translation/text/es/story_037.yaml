text.00a2: "¡Te voy a noquear!"
text.00de: "¡Oye, no me empujes!"
text.011a: "¡Qué tranquilo es aquí arriba!"
text.015c: "¡Me caeré! ¡Es peligroso!"
text.01a6: "¡No hagas eso aquí arriba!"
text.01e8: "¡Ni intentes pelear conmigo!"
text.0238: "Elevador"
text.0250: "Presionar ABAJO\nNo subir"
text.0302: "No pasa nada.\nEso no es bueno."
