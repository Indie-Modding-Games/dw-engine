"text.004c": "Bienvenido a mi restaurante."
"text.0084": "Decidí ser el encargado\ny chef de este restaurante."
"text.00fc": "Disfruta mi cocina ardiente\ntodo lo que quieras."
"text.0178": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}, ¿no\nquieren probar mi cocina casera?"
"text.01ce": "A diferencia de los objetos,\nesto es cocina de verdad.\nEs mi talento secreto."
"text.0274": "¡{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nDecidí vivir de\nla cocina. ¡Soy bueno!"
"text.02f2": "Relájate y ven a comer a\nmi restaurante alguna vez."
"text.037a": "C???NC?? , C???MC?? .\n¡Por fin abrí mi restaurante!"
"text.03e6": "¡Prueba el postre helado!\nEs mi especialidad."
"text.045c": "{color:6}{tamer}{color:1}, decidí\ntrabajar como chef\nen este restaurante."
"text.04d0": "Disfruta una comida caliente."
"text.051e": "¡Muy bien!\n{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\n¡ahora soy cocinero!"
"text.0566": "Mi cocina es mucho mejor\nque lo que consigas\nen otro lado. ¡Pruébala!"
"text.061a": "¡{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\n¡Decidí dedicar mi vida\na la cocina!"
"text.067e": "¡Mi cocina casera especial\nes muy sana! Ven a\nverme cuando cocine."
"text.0734": "¡Hola,  {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
"text.0758": "Decidí ayudar en\neste restaurante.\nMe dejan hacer postres."
"text.07d6": "Estoy muy orgulloso\nde mi postre.\nNo dejes de probarlo, ¿sí?"
