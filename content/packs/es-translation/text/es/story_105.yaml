"text.00ae": "¡¿Qué quieres?!"
"text.00e8": "¡Guau!"
"text.0104": "...? ...!"
"text.011e": "¿Qué? ¡¿Ahora?!\nBien, ¡peleemos!"
"text.0196": "Perdí. ¡Rayos!"
"text.01bc": "Debería invitarlo\na la ciudad."
"text.0206": "Eh, disculpa."
"text.022c": "¿Podrías...\nvenir a la ciudad...?"
"text.027e": "¿Qué? ¡¿La ciudad?!"
"text.029c": "¿Hablas de ese... sitio viejo?"
"text.02dc": "Bueno..."
"text.02f0": "Eh......"
"text.0306": "Mmm........."
"text.0332": "Bueno, está bien.\nSoy Agumon.\nMucho gusto."
"text.03c6": "¡Agumon se une a la ciudad!"
"text.0408": "Bien, vale la pena intentarlo.\n¡Seguiré preguntando!"
"text.0478": "¡Este es mi territorio!"
"text.04b8": "¡¿Qué?!"
"text.04da": "¡Es mi oportunidad!"
"text.0810": "¡No puedo librarme\nde este tipo!"
