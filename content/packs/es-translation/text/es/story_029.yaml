text.0116: "Creo que ya sacamos casi\ntoda la tierra."
text.0182: "El trabajo va bien.\nGracias.\nEspera un poco más."
text.021e: "Gracias por tu trabajo.\nAquí tienes tu paga."
text.0296: "¡Gané quinientos Bits\npor el trabajo!"
text.02d8: "¡HP sube cincuenta!\n¡Ataque sube cinco!\n¡Defensa sube cinco!"
text.0396: "Tira la tierra fuera\ndel túnel, por favor."
text.040a: "Tómala del montón de tierra."
text.0476: "¿Vas a acarrear tierra?"
text.04b4: "Tu Digimon se ve cansado.\nMejor déjalo descansar antes."
text.054c: "¿Vas a acarrear tierra?"
text.058c: "Sí\nNo"
text.05b8: "Este no es lugar para\naficionados. Aléjate,\nes muy peligroso."
text.065e: "Este túnel todavía no\nestá abierto. No nos\nestorbes."
text.06d8: "Lo siento. ¿Sabes\ncuándo lo estará?"
text.072e: "No lo sé,\ntardará un tiempo."
text.077c: "Qué problema.\n¿Podemos ayudar?"
text.07c0: "¿Quieres quitarnos\nla diversión? Quizá\npuedas acarrear tierra."
text.083c: "¿Qué es?"
text.0866: "Yo cavé esa tierra.\nPuedes sacarla\ny tirarla."
text.08de: "Es un trabajo duro, así que\nte pagaré quinientos Bits\npor cada ida y vuelta."
text.096e: "Así cavarán más rápido.\nPuedo ganar dinero y\nes buen entrenamiento."
text.0a0c: "Bien\nNo, gracias"
text.0a3a: "Acarreo de tierra\nUsa {color:6}△ {color:1}para poner una\ncaja frente a la tierra.\nTírala fuera del túnel.\nAl terminar una vuelta,\navísale a Drimogemon."
text.0b66: "¿Tienes miedo?"
text.0bae: "Se añadió la caja de tierra."
