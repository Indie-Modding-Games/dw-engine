"text.002e": "!"
"text.005e": "¿Eres {color:6}{tamer}{color:1}?"
"text.007e": "¡¿Un Digimon esqueleto?!"
"text.00ac": "¿Eres {color:10}{partner}{color:1}?"
"text.00cc": "No siento vida en él,\nsino algo de maldad."
"text.0126": "¡¿Le habrá hecho\nalgo a Myotismon?!"
"text.0188": "Si no me lo dices...\n¡te atacaré!"
"text.0208": "¡Te atacaré!"
"text.0242": "¡Tengo que salvar a Myotismon\nlo antes posible!"
