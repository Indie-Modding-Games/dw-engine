text.0066: "Taaa"
text.0084: "Pidamos perdón."
text.00ce: "El perdón sana el corazón."
text.011c: "¿Eres malvado?"
text.014c: "Sígueme. Y luego..."
text.0194: "¡Ja, ja, ja!"
text.01bc: "¡Tú!"
text.01cc: "¡Vas a perder!"
text.0220: "No puedo creer que él\nme lavara el cerebro."
text.027c: "Es fuerte.\n¿Puedes vencerlo?\n¿Por qué haces esto?"
text.02f4: "Pelearé por la isla.\nArreglemos esto ahora."
text.035c: "No queremos un gobernante,\neres nuestra única esperanza."
