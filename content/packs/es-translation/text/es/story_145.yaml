"text.0054": "¡Deja de hacer tonterías!"
"text.0084": "Bien. No creo que\nlo vuelva a hacer."
"text.00e2": "Creo que esta es\nla última sala."
"text.0156": "{color:7}??? {color:1}\n¿Cuál?"
"text.0198": "Esa voz... ¡suena como\nWaruMonzaemon!"
"text.01ec": "¿Caja grande o caja chica?\n¡Puedo leer tu mente!"
"text.0250": "Caja grande\nCaja chica"
"text.0304": "¿Eh? ¡Aaahhhh!"
"text.04a2": "¡Ja, ja, ja, tonto!\n¡Fallaste!"
"text.052c": "¡Ohhhh, me descubriste!\nJe, je, je. ¿Nervioso?"
"text.059a": "Rayos, ¿qué es tan gracioso?"
"text.05ce": "Vaya, no te emociones.\n¿A qué viniste hoy?\n¿Quieres trabajar para mí?"
"text.0674": "¡Devuélvenos al amigo\nque raptaste!"
"text.06c6": "¿Amigo? ¿De qué hablas?\n¿Acaso parezco capaz\nde hacer algo así?"
"text.0768": "¡Sí!"
"text.077a": "¡Vaya, otra vez aciertas!\n¡Sí, fui yo! ¡Lo hice!"
"text.07ec": "Pero sabes que no\npuedes recuperarlo.\nPorque soy WaruMonzaemon."
"text.0878": "Si eso piensas,\n¡te obligaré!"
"text.08d2": "¿Es broma?\n¿Tú me vas a vencer?"
"text.0930": "¿Sabes qué?\nMejor despierta y\nenfrenta la realidad."
"text.09e0": "Oye, devuélveme al\namigo que raptaste."
"text.0a4a": "Aggghhh... ¡no puede ser!\nNo lo creo,\nestoy perdiendo...."
"text.0ae2": "¡Vamos!"
"text.0afa": "Bueno... supongo que\nno tengo opción. Toma."
"text.0bd8": "¿Eh? Guauuu.... ¡oye!"
"text.0d54": "Oye, deja de hacer el\ntonto, ¡ya basta!"
"text.0dae": "Oye, ¿no entiendes la broma?\nToma. Es este."
"text.0e2c": "¿Qué es esto?\nEs un engranaje."
"text.0e6e": "Sí, así es."
"text.0ea4": "¿¿¿Este es el amigo???"
"text.0ed6": "Bueno, no me llevé\nnada más. En serio."
"text.0f32": "Supongo que por ahora\nme llevaré esto."
"text.0f94": "¡Tú! No vuelvas a hacer\nnada malo, ¡¿entendido?!"
"text.0ff8": "Bien. No creo que\nvuelva a pasar."
"text.105c": "No sé por qué no te creo,\npero tengo muchas cosas\nque atender."
"text.1104": "Oh, no, tengo demasiados\nobjetos. Tengo que\ntirar uno."
"text.1182": "¡Conseguí un {color:6}Engranaje{color:1}!"
"text.11ba": "¿Qué? ¿Quién eres?"
"text.11e6": "¿Quién soy yo? ¡¿Quién eres tú?!"
"text.1292": "¡Conseguí un {color:4}Llavero\nDimensional{color:1}! Ya puedo\nllevar hasta veinte objetos."
"text.1354": "¡Conseguí un {color:4}Llavero\nDimensional{color:1}! Ya puedo\nllevar hasta veinte objetos."
