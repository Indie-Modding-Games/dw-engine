"text.006a": "¡Con el último terremoto se\nfueron la tierra y la arena!"
"text.00ee": "La hora actual es:\nmes {num:pstat=105}, día {num:pstat=106},\n{num:pstat=107} horas, {num:pstat=108} minutos."
"text.016e": "{color:10}{partner}{color:1} es un Digimon\nde tipo Datos, ¿verdad?"
"text.01c6": "{color:10}{partner}{color:1} es un Digimon\nde tipo Vacuna, ¿verdad?"
"text.0224": "{color:10}{partner}{color:1} es un Digimon\nde tipo Virus, ¿verdad?"
"text.027c": "Sirvo para muchas cosas.\n¿Qué quieres que haga?"
"text.02f2": "Cambiar sus parámetros\nAcelerar el tiempo\nConvertir esto en tienda"
"text.038c": "Hacerlo el más poderoso\nHacerlo súper débil\nHacerlo promedio"
"text.0416": "Que pase una hora\nQue pasen seis horas\nQue pasen veinticuatro horas"
