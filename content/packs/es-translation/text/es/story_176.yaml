"text.03b8": "Bienvenido a mi tienda."
"text.03e4": "Mira, {color:6}{tamer}{color:1}. Esta es\nmi tienda. Venderé\ntoda clase de objetos."
"text.046c": "Pronto tendré más cosas.\nPero necesito Digimon que\nme ayuden aquí."
"text.052c": "Compraré y venderé\nobjetos. Ven a verme\ncuando me necesites."
"text.05c6": "No tenemos mucha variedad,\npero si encuentro un ayudante,\nquizá mejore."
"text.069c": "Decidí abrir\nuna tienda de objetos.\nOjalá vengas seguido."
"text.0726": "Aún no tenemos mucho surtido,\npero pronto queremos crecer.\nPor ahora, ten paciencia."
"text.080a": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nabrí mi tienda de objetos.\n¡Creo que me irá bien!"
"text.087c": "Con más Digimon en la\nciudad, tendremos más cosas."
"text.0920": "{color:6}{tamer}{color:1}, empecé a ayudar\na llevar esta tienda.\n¡Compra muchas cosas!"
"text.09ea": "Bienvenido. Desde hoy\ntrabajaré aquí.\nVen seguido, por favor."
"text.0ab4": "Decidí ayudar a\nllevar esta tienda.\nVen cuando quieras."
"text.0b68": "Ah, {color:6}{tamer}{color:1}. Este es\nel lugar perfecto para mí.\nTrabajaré duro aquí."
"text.0e56": "Hola, siempre estoy ocupado\nllevando esta tienda... ¡No!"
"text.0ec2": "Soy medio flojo y no estaré\nmucho en la tienda.\nPero tengo cosas geniales."
"text.0f5e": "¡Sí! ¡El «Manual de entreno»!\nCon esto, tu entrenamiento\n¡será mejor!"
"text.0fe6": "Es muy valioso. Te lo vendo\npor cincuenta mil bits.\nSi no lo compras, lo lamentarás."
"text.1094": "Comprar\nNo comprar"
"text.10d6": "No tienes suficientes bits."
"text.1126": "Mmm, llevas muchas\ncosas encima."
"text.1186": "¡Conseguí un\n{color:6}Manual de entreno{color:1}!"
"text.11c2": "No te haré descuento."
"text.123a": "¿Tienes problemas\nporque llevas\ndemasiadas cosas?"
"text.12b2": "Hay un lugar donde hallar un\nllavero que conecta tu bolsa\ncon otra dimensión."
"text.135a": "Aumenta el número de\nobjetos que puedes llevar."
"text.13be": "Aunque ya hayas estado en\nun lugar, vuelve a mirar."
"text.1432": "Te diré el secreto para\ncomprar objetos."
"text.1488": "¡Presiona el botón Start\nsobre el objeto del que\nquieras información!"
"text.1514": "Elige el objeto con {color:6}△{color:1}\ny presiona {color:4}□{color:1} si\nquieres comprar muchos."
"text.159e": "Para subir o bajar de diez,\nusa arriba o abajo\nmientras presionas {color:10}○{color:1}."
"text.1636": "Ah, justo después de\ndigievolucionar, compra algo.\n¡Debería pasar algo bueno!"
