"text.0c72": "{color:5}Entrenamiento:\nAula de {color:6}{tamer}{color:1}{color:5},\nmejorado {color:1}"
"text.0ccc": "{color:5}Entrenamiento:\nAula de {color:6}{tamer}{color:1}{color:5} {color:1}"
"text.0d0c": "Empezar\nExplicar\nSalir"
"text.0d44": "Normal\nIntento extra\nSalir"
"text.0d82": "{color:6}{tamer}{color:1} enseñará muchas\ncosas. Sube la Inteligencia\ny el MP máximo."
"text.0df2": "Explicar otra vez\nEmpezar\nSalir"
"text.0e4c": "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}\npara alinear tres dibujos."
"text.0ece": "Oye, aquí hay información nueva."
"text.0efe": "Con Digimon Bebé o de\nEntrenamiento, intenta repetir\nel mismo entrenamiento."
"text.0f88": "Pasará algo bueno."
"text.0fd4": "Información nueva."
"text.0ffa": "En el intento extra, si alineas\nlos mismos dibujos, su\nhabilidad sube mucho."
"text.10b0": "Ah, se suponía que te\nhablaría de técnicas."
"text.110e": "Las técnicas que usa un\nenemigo se pueden dominar\nsi ganas la batalla."
"text.1198": "Pero solo las técnicas\nque se pueden aprender\nen ese momento."
"text.1226": "No puedes dominarlo todo.\nPero pelear es la forma más\nrápida de dominar técnicas."
"text.12d0": "También se dominan entrenando,\npero hay pocas posibilidades."
"text.134e": "Cuando seas más listo, toma\nel aula de {color:6}{tamer}{color:1} y quizá\naprendas una técnica."
"text.13e6": "Hay pocas posibilidades de\naprender, no esperes mucho.\n¡Entrena con equilibrio!"
"text.148c": "Hola, soy Koromon.\nJiji me pidió que te hablara\ndel entrenamiento."
"text.1506": "¿Quieres preguntarme algo?"
"text.153c": "¿Qué entrenamiento?\nEnséñame a entrenar\nNo, nada"
"text.15b2": "Si entrenas aquí,\npuedes mejorar las\nhabilidades de tu Digimon."
"text.162c": "Entrenar cansa, pero\nsacarás más provecho\nque en una batalla real."
"text.16c8": "Además, aunque es muy raro,\npuedes dominar técnicas nuevas."
"text.173a": "La próxima vez te contaré\nmás sobre las técnicas."
"text.17a0": "Aquí hay seis puestos de\nentrenamiento y cada uno\ntiene un letrero al lado."
"text.182a": "Presiona {color:6}△ {color:1}\nfrente al letrero."
"text.187c": "Lee los letreros y sabrás\nqué habilidades\npuedes mejorar."
"text.18fe": "Según la especialidad de tu\nDigimon, unas habilidades\nsuben más que otras."
"text.19aa": "Pero no lo sabrás seguro\nhasta que lo pruebes."
"text.1a0a": "Tras «Empezar»,\nelige «Normal» y\nentrena una hora."
"text.1a7a": "Mientras entrenas, con\n{color:5}× {color:1}puedes\nadelantar el tiempo."
"text.1ae6": "Ah, sí, tengo que contarte\ndel «Intento extra»."
"text.1b48": "Si sale bien, el intento extra\nsube mucho tu poder, pero\npoco si fallas."
"text.1be4": "Pruébalo una vez y verás."
"text.1c24": "Bueno, pronto tendré más\ninformación nueva para ti."
"text.1d7c": "Estuve en la ciudad. Pero era\ndemasiado urbana para mí,\nasí que vine aquí."
"text.1e10": "Modifiqué el equipo.\nAhora es mejor. ¡Entrena duro!"
"text.1e86": "Estuve en la ciudad. Pero era\ndemasiado urbana para mí,\nasí que vine aquí."
"text.1f1a": "Modifiqué el equipo.\nAhora es mejor. ¡Entrena duro!"
