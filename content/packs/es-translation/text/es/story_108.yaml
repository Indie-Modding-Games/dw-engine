"text.083c": "Empezar\nExplicar\nSalir"
"text.0874": "Normal\nIntento extra\nSalir"
"text.08b2": "Gana fuerza con la máquina\nde golpes. Sube la Defensa\ny la Inteligencia."
"text.0946": "Explicar otra vez\nEmpezar\nSalir"
"text.09a0": "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}\npara alinear tres dibujos."
