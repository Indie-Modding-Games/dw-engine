text.0090: "¡Te crees muy importante!"
text.00dc: "¿¡Qué te hice yo!?"
text.0156: "{color:7}? ? ? {color:1}\n¡Espera!"
text.02f0: "¡Me llamo Ninjamon!"
text.033a: "¿Tú eres {color:6}{tamer}{color:1}?\n¡Y tú debes ser {color:10}{partner}{color:1}!"
text.0380: "Eres famoso hasta en la\nAldea Ninja. Acepta mi\ndesafío y pelea conmigo."
text.041e: "Claro\nEn otra ocasión"
text.0454: "¡Ja, eso es lo que tú crees!"
text.04e0: "Eres tan fuerte como\ndicen. ¡Por favor,\nhazme tu discípulo!"
text.0580: "¿Discípulo? Bueno, yo no\nhago eso. Pero puedes\nayudarnos a hacer una ciudad."
text.060a: "Bien.\nEso también es entrenamiento.\nMe esforzaré."
text.076c: "¡Ninjamon se une a la ciudad!"
text.07b8: "¡Oye, tú!"
text.07d0: "¿Qué quieres decir?\n¿Por qué estás aquí?"
text.081c: "¡Oye, {color:6}{tamer}{color:1}!"
text.0834: "¡Cuando quise tener\nmi propio harén en la\nciudad, me echaron!"
text.08ce: "Oí que te va muy bien\núltimamente. ¡Te venderé\nalgo bueno!"
text.0962: "Es la valiosísima\n{color:6}Banana dorada{color:1}."
text.09c0: "Son cincuenta mil Bits.\nSin fiado, por favor."
text.0a24: "Pagar\nNo pagar"
text.0a76: "¡Tonto! ¡Llevas demasiado!"
text.0abe: "¡Ups! ¡Llevo demasiado!"
text.0afe: "¡Muchísimas gracias!"
text.0b30: "Los humanos deben pagar\ncon dinero de verdad."
