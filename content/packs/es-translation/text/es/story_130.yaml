"text.0036": "¡Te voy a atrapar!"
"text.0070": "¡¿En serio?!"
"text.00ce": "¿Quién eres?"
"text.00ee": "Vine a ayudarte\nAún no estoy listo..."
"text.0158": "¿Hay alguien ahí?"
"text.018c": "¿No puedes ver?"
"text.01b4": "Soy Whamon. Normalmente\nvivo en el mar."
"text.0206": "No tengo ojos, pero\npuedo sentir casi todo."
"text.026c": "Soy humano. Me llamo\n{color:6}{tamer}{color:1}."
"text.02a6": "Este es {color:10}{partner}{color:1},\nmi compañero, un {digimon:pstat=103}."
"text.02f6": "Siento un gran poder."
"text.0330": "¿Escucharás mi historia?\nCerca hay una cueva en la\nplaya donde descanso."
"text.03c8": "Pero unos malvados me echaron\ny perdí ahí un tesoro\nmuy importante."
"text.046a": "¿Malvados, eh?\nNo suena nada bien."
"text.04bc": "Por favor, échalos.\nQuiero que me ayudes a\nrecuperar la cueva."
"text.0540": "Te ayudaré\nAhora no puedo ayudar"
"text.0592": "Ya veo."
"text.05ae": "Entonces súbete a mi espalda."
"text.06c0": "Vamos."
