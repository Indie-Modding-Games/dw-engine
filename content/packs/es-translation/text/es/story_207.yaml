text.0044: "Hola, ¿necesitas carne?"
text.007c: "Ah, no te había contado\nnada de esto."
text.00d8: "Esta es una granja de carne.\nCultivamos carne para todos."
text.013e: "¿Cultivan carne en una granja?"
text.0176: "Sí, ¿por qué?"
text.0192: "Bueno... por nada"
text.01b8: "Jiji y yo decidimos darte\ntres piezas de carne\nal día, {color:6}{tamer}{color:1}."
text.0242: "Aquí está tu carne de hoy."
text.028e: "Ya tienes mucha carne.\nHoy no necesitas más."
text.030a: "Ya tienes mucha carne. Me\nquedo con la que no te cabe."
text.0380: "¡Conseguí tres piezas\nde {color:6}Carne{color:1}!"
text.03dc: "Llevas demasiados objetos."
text.0414: "¡Conseguí tres piezas de\n{color:6}Carne{color:1}!"
text.0470: "¡Hoy cosechamos mucha carne!\nTe daremos\ncinco piezas."
text.0508: "Ya tienes mucha carne."
text.054c: "Ya tienes mucha carne. Me\nquedo con la que no te cabe."
text.05c2: "¡Conseguí cinco piezas de\n{color:6}Carne{color:1}!"
text.0620: "Llevas demasiados objetos."
text.0658: "¡Conseguí cinco piezas de\n{color:6}Carne{color:1}!"
text.0698: "Mañana tendrás más."
text.06e4: "Aquí está la carne de hoy."
text.072a: "Ya tienes mucha carne."
text.076e: "Ya tienes mucha carne. Me\nquedo con la que no te cabe."
text.07e4: "¡Conseguí {color:6}Carne{color:1}!"
text.0820: "Llevas demasiados objetos."
text.0858: "¡Conseguí {color:6}Carne{color:1}!"
text.087a: "Mañana te daré más."
text.08c0: "Creí que ya te había dado\nla carne de hoy."
text.090a: "Si te quedas sin comida,\nve al Bosque Nativo y\nbusca hongos."
text.09a2: "Hola, {color:6}{tamer}{color:1}, amplié\nmi granja de carne."
text.09ea: "Te daré tres piezas de\ncarne enorme al día."
text.0a4e: "Si quieres más,\nte la vendo a\nquinientos bits cada una."
text.0ad2: "Me encargaré de esta\ngranja por Tanemon.\nEstá descansando por ahí."
text.0b74: "¡Hoy coseché\nmucha carne!"
text.0bd2: "Ya tienes mucha carne enorme.\nHoy no necesitas más."
text.0c56: "Ya tienes mucha carne enorme.\nHoy no necesitas más."
text.0cce: "¡Conseguí {color:6}Carne enorme{color:1}!"
text.0d14: "Llevas demasiados objetos."
text.0d4c: "¡Conseguí cinco piezas de\n{color:6}Carne enorme{color:1}!"
text.0d98: "Mañana te daré más."
text.0dea: "Aquí tienes tres piezas de\ncarne enorme para hoy."
text.0e60: "Ya tienes mucha carne enorme.\nHoy no necesitas más"
text.0ee2: "Ya tienes mucha\ncarne enorme. Me quedo\ncon la que no te cabe."
text.0f64: "¡Conseguí {color:6}Carne enorme{color:1}!"
text.0faa: "Llevas demasiados objetos."
text.0fe2: "¡Conseguí tres piezas de\n{color:6}Carne enorme{color:1}!"
text.1036: "Mañana te daré más.\nO puedes comprar más ya.\n¿Quinientos bits cada una?"
text.10d2: "Comprar\nNo comprar"
text.1110: "Necesitas más dinero."
text.1150: "Llevas demasiados objetos."
text.119c: "¿Quieres comprar más?"
text.11d4: "Comprar\nNo comprar"
text.1202: "Nos vemos mañana."
text.123e: "¡Je, je, je!\n¡{color:6}{tamer}{color:1}, mira!"
text.128a: "Podemos cultivar mucho\nsolomillo. Te daré\ntres solomillos al día."
text.1310: "¡También empecé a cultivar\nverduras raras!\n¡Compra todas las que quieras!"
text.13a6: "Hoy me siento bien,\nasí que te daré cinco\npiezas de solomillo."
text.143a: "Ya tienes mucho solomillo.\nHoy no necesitas más"
text.14b6: "Ya tienes mucho solomillo."
text.14f4: "¡Conseguí {color:6}Solomillo{color:1}!"
text.1534: "Llevas demasiados objetos."
text.156c: "¡Conseguí cinco piezas de\n{color:6}Solomillo{color:1}!"
text.15b2: "¡Nos vemos mañana!"
text.15ee: "¡Aquí está tu ración de hoy:\nsolomillo por tres!"
text.1668: "Ya tienes mucho solomillo.\nHoy no necesitas más."
text.16e6: "Ya tienes mucho solomillo."
text.1724: "¡Conseguí {color:6}Solomillo{color:1}!"
text.1766: "Llevas demasiados objetos."
text.179e: "¡Conseguí tres piezas de\n{color:6}Solomillo{color:1}!"
text.17ec: "¡Todavía no es mañana!\n¿Quieres comprar verduras?"
text.1858: "Comprar\nNo comprar"
text.1886: "Zanahoria XL: quinientos bits\nRábano halcón: quinientos bits\nNo comprar"
text.1930: "No tienes dinero suficiente."
text.197e: "¡Llevas demasiados objetos!"
text.19ca: "No tienes dinero suficiente."
text.1a18: "¡Llevas demasiados objetos!"
text.1a62: "¿Quieres comprar más?"
