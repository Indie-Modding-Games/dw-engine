text.005a: "Lo siento, llegas tarde\npara inscribirte.\nEspera otro año."
text.00f4: "Estamos entre torneos.\nNo tengo nada que hacer."
text.017c: "El torneo acaba de terminar.\nEspera otro año."
text.01fc: "No eres un insectoide.\nNo puedes participar."
text.027c: "¿Quieres entrar al torneo?"
text.02c0: "Explicar\nNo explicar"
text.02fe: "El día veintidós hay un\ntorneo solo para Digimon\ninsectoides."
text.0390: "Puedes inscribirte en ese\nahora mismo."
text.03e6: "Si no eres un Digimon\ninsectoide, no puedes\ninscribirte en el torneo."
text.047a: "Si ganas, recibirás premios\nde lujo. Solo inscríbete."
text.04f4: "Inscribirme\nNo inscribirme"
text.0548: "Estamos entre torneos.\nNo tengo nada que hacer."
text.05d0: "El torneo acaba de terminar.\nEspera otro año."
text.0632: "Estás inscrito en\nel torneo  ' - {tournament:pstat=3}- '.\n¿Quieres cancelar?"
text.06bc: "No cancelar\nCancelar"
text.0706: "Inscripción cancelada."
text.0726: "¿Seguro que quieres hacerlo?"
text.0764: "Quedaste inscrito."
text.07a2: "Hoy no hay torneo."
text.0806: "Quienes no están inscritos\nno pueden entrar."
text.0886: "Aún no abre. Inscríbete el\nveintidós, de diez de la\nmañana a once de la noche."
text.0950: "Lástima, el torneo terminó.\nVuelve el próximo año."
text.0a10: "Lástima.\nSerá el próximo año."
text.0a60: "¡Recibí una {color:6}Carne enorme {color:1}\npor participar!"
text.0ac8: "Demasiadas cosas.\nHay que tirar algunas."
text.0b30: "Dinero del campeonato:\ncinco mil Bits.\n¡Recibí una {color:6}Perla insecto {color:1}\ncomo premio de campeón!"
text.0c00: "¡Demasiadas cosas!"
text.0c52: "Dinero del segundo lugar:\ndos mil Bits.\n¡Recibí un {color:6}Casco cornudo {color:1}\ncomo premio del segundo lugar!"
text.0d22: "¡Demasiadas cosas!"
text.0d6c: "Dinero del segundo lugar:\ndos mil Bits.\n¡Recibí {color:6}Fauces tijera {color:1}\ncomo premio del segundo lugar!"
text.0e32: "¡Demasiadas cosas!"
