text.003e: "¡¡¡!!!"
text.006c: "¡Un huevo!"
text.0080: "¿Será de Machinedramon?"
text.00c8: "¡Esto pinta mal!"
text.015e: "¡Digitamamon se une\na la ciudad!"
text.01b8: "¡!"
text.01e2: "¡Ahí está! ¡Lo encontré!"
text.022a: "¡Tú eres el jefe!"
text.0252: "Mucho gusto.\nSoy Analogman."
text.029a: "Lo sé todo de ti, pero no\nsabía que eras un niño."
text.030e: "No puedo creer que un niño\nhaya arruinado mi plan."
text.0378: "Estuve tan cerca de\ndominar el Mundo Red."
text.03ce: "¡Eres un adulto! Basta,\nles estás haciendo daño."
text.0442: "No me importa hacerles\ndaño a los Digimon."
text.049a: "Los Digimon deben obedecer\na los humanos como esclavos."
text.04fa: "¡Te equivocas! ¡Los Digimon\ntienen corazón y mente!\n¡Somos amigos!"
text.0578: "Peleemos y veamos qué es\nmejor: esclavos o amigos."
text.060c: "¡Tu turno, Machinedramon!"
text.0698: "¡Lo logramos, {color:10}{partner}{color:1}!"
text.06e0: "¡No puede ser!\n¡Mi esclavo más poderoso!"
text.0736: "¡Ya ves, estabas equivocado!"
text.0772: "Vaya, vaya..."
text.07b4: "Si dejas en paz la isla\ny pides perdón,\nte perdonarán."
text.0854: "No debí confiar en los\nDigimon. Lo haré yo mismo."
text.08e2: "¡¿Qué vas a hacer?!"
text.0926: "{color:7}Analogman {color:1}\nVoy a volar la isla\ny escaparé a otro\nmundo. ¡Mala suerte, niño!"
text.0a12: "¡¡Nooooo!!"
text.0a3c: "{color:7}Analogman {color:1}\n¡Ahora sí estás acabado!"
text.0a86: "Lo siento, amigos. Ya no\npuedo hacer nada."
text.0af0: "{color:7}??? {color:1}\nTodo está bien."
text.0b30: "¿Eh?"
text.0b56: "{color:7}Analogman {color:1}\n¡No se transfiere!\nAlgo falla en el\nprograma. ¡¿Qué pasa?!"
text.0c18: "¡Oigo las voces de todos!\n¿Quién está ahí?"
text.0c7e: "{color:7}Jijimon {color:1}\nTe estamos enviando\nnuestra energía ahora."
text.0cee: "{color:7}Tokomon {color:1}\n¿Oyes nuestras voces?"
text.0d3c: "{color:7}Agumon {color:1}\n¡Parece que llegamos a tiempo!"
text.0d8e: "Todos ustedes..."
text.0dc4: "{color:7}Analogman {color:1}\n¡No, cacharro estúpido!\n¡Ayuda! ¡Ayúdenme! ¡Aaaaah!"
text.0ec4: "¡Desapareció! ¿Qué pasó?"
text.0efe: "{color:7}Jijimon {color:1}\nNo lo sé. Pero..."
text.0f4c: "¿Jijimon? ¡Va a explotar!\n¡Haz algo!"
text.0fa2: "{color:7}Jijimon {color:1}\nYa debería estar aquí."
text.1032: "¡Airdramon!"
text.104e: "¡Date prisa, vamos!"
text.10ac: "Analogman se ha ido."
text.10d8: "La paz volvió a\nIsla File."
text.1124: "Y..."
