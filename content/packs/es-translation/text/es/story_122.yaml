"text.0020": "¿Te estorbo?"
"text.0056": "¡Me salvaste!"
"text.0078": "Así que eras tú."
"text.009c": "Esto es perfecto."
"text.00cc": "¿Qué?"
"text.00e2": "¡Iba rumbo a tu ciudad\npara darle buen uso\na mi talento!"
"text.0160": "¿Qué clase de talento?"
"text.0190": "¿No me conoces?\n¡Soy famosa entre los Digimon\npor saberlo todo!"
"text.0224": "¿En serio?\nNunca he oído de ti."
"text.026c": "Estoy lista para ir a la ciudad."
"text.02b4": "¿De verdad\nnos será útil?"
"text.0302": "¡Nos vemos!"
"text.0350": "¡Shellmon se une a la ciudad!"
