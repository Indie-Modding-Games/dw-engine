text.0072: "¡Calor! ¡Qué calor!"
text.00a4: "¡Empezó a hervir!"
text.00e0: "Ah, ya veo."
text.010a: "Muy bien, ¡vamos!"
text.0142: "¡Ya tuve suficiente!"
text.0178: "¡No, gracias!"
text.01a2: "¿Qué?"
text.01c2: "¡Mmmmm!"
text.01f4: "Tengo un mal presentimiento."
text.022c: "¿Tú también? Lo sabía."
text.0288: "No hay nada en el túnel.\n¿Lo cruzamos?"
text.02f0: "Ir\nNo ir"
