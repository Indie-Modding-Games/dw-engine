text.006a: "¡Shwaa!"
text.008c: "¡Sha sha shaaaa!"
text.00c0: "No parece que esté herido."
text.010e: "Te haré un descuento."
text.0156: "¡No te burles de nosotros!"
text.0196: "¡No vas a volver\na casa con vida!"
text.0262: "¡Ay!"
text.027a: "Para una caída tan grande,\nte ves bien."
text.02dc: "{color:10}{partner}{color:1},\n¿estás bien?"
text.0310: "¡Guau, te ves bien!"
text.033c: "¿Volaste? ¡Eso es trampa!\nBueno, supongo que no."
text.03b6: "¡Vamos!"
text.03ea: "¡Ay!"
text.0402: "Para una caída tan grande,\nse ve bien."
text.0460: "{color:10}{partner}{color:1},\n¿estás bien?"
text.0494: "Supongo que duele. Lo siento."
text.04d4: "¡Vamos!"
