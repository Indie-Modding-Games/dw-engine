"text.0028": "¡Aggh!"
"text.0060": "¿Qué?"
"text.007e": "¡¿Qué?!"
"text.009e": "¡Ay, jefe, estamos en problemas!"
"text.00e2": "¿Qué hacen ustedes?"
"text.011e": "Me impresionas. ¡Encontraste\nla Nueva Fortaleza Ogro!"
"text.018c": "¿Van a cometer más fechorías?"
"text.01d0": "¡Claro que sí! ¡Je, je!"
"text.01fa": "¡No dejaré que lo hagan!\n¡Más les vale salir\nde esta cueva!"
"text.0278": "¡Esta vez es diferente!"
"text.02c0": "Jefe, ¿es ese?"
"text.02ee": "Sí. ¡Adelante!"
"text.033c": "¡¿Pero qué...?!"
"text.0360": "¡Amo WaruSeadramon!\n¡Adelante, hágalo, por favor!"
"text.03ca": "Es tu guardaespaldas, ¿eh?"
"text.040c": "¡Je, je, je! ¡Estás acabado!"
"text.0490": "¡Rayos!"
"text.04a2": "¡Ahhhhhh!"
"text.04c6": "¡No dejaré que escapes!"
