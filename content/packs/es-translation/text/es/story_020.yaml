text.0066: "¿Vamos a pelear?\n¿O eres un gallina?"
text.00b2: "Bien, peleemos\nEspera un momento"
text.011e: "¡Oh, no! ¡Perdí!"
text.0152: "Era bastante fuerte."
text.019a: "Eres buena gente. Soy\nMamemon. Iré contigo."
text.0200: "¿Vienes con nosotros? Bueno,\n¿por qué no vas a la ciudad?"
text.0272: "Bien. Iré allá."
text.02d6: "¡Mamemon se une a la ciudad!"
text.0320: "Vuelve cuando seas\nmás fuerte."
text.039c: "¡Daaaa!"
text.03be: "Ja, ja, ja."
text.03ea: "¡Ughhh!"
text.0410: "Este: Bosque Nativo\nOeste: Sabana Engranaje"
