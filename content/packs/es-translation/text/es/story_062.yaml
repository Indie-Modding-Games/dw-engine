text.0038: "¿Qué son esos?\n¿Algún libro que pueda leer?"
text.00ba: "No. Ninguno que pueda leer."
text.00e8: "¡Guau! ¡Un libro con\nuna portada genial!"
text.012a: "Lo tomo\nMejor no"
text.0190: "Tocaste el libro genial."
text.01c0: "¿Eh?"
text.01f8: "¡Guau!"
text.020e: "Podría ser una trampa...\n¡Déjalo!"
