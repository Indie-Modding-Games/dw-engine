"text.0038": "Ah, {color:6}{tamer}{color:1}y {color:10}{partner}{color:1},\nya están aquí."
"text.0078": "Soy repartidor.\nEntrego de todo."
"text.00cc": "Lo único que pueden llevar\nes a ustedes mismos, ¿no?"
"text.0132": "¿Y si yo los llevo?\nGran idea, ¿eh?"
"text.0190": "Los llevo a donde\nsea, cuando sea.\nCobrando, claro."
"text.0222": "Hola, {color:6}{tamer}{color:1}."
"text.023c": "A veces vuelvo a la Sabana\nEngranaje a patrullar."
"text.029e": "Oí que hay tiendas en la\nplaya de la Sabana\nEngranaje. ¿Las viste?"
