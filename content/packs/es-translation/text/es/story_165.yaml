"text.0060": "¡Llegaste en el momento justo!\nTengo un gran favor que pedirte\nque solo tú puedes hacer."
"text.010c": "¿Qué es?"
"text.012a": "Es la misma maldad que\nsentí en Analogman\ny Machinedramon."
"text.01a6": "Pero no sé\nde dónde viene."
"text.01fe": "¡Bien, déjamelo a mí!"
"text.0236": "Gracias. Por cierto..."
"text.0282": "¡Supe que venciste\na Machinedramon!"
"text.02d2": "Sí, pero no lo entiendo.\nParecía la maldición\nde Analogman."
"text.035a": "Su rencor era muy fuerte.\nQuizá ahora tengamos paz."
"text.03ce": "Si Machinedramon vuelve,\nlo venceremos otra vez."
"text.0436": "Eres de confianza. Toma esto\nen agradecimiento. Creció\nen nuestra granja de carne."
"text.04d8": "¡Guau! ¿Un {color:6}Melón\ncadena{color:1}?"
"text.0530": "Tengo demasiados objetos."
"text.0570": "¡Lo acepto con gusto, gracias!"
"text.05c8": "¡Ah, volviste!\nEsto no se lo puedo pedir\na nadie más."
"text.0648": "Bien. ¿Quieres decir que\nAnalogman volvió?"
"text.0698": "Sentí su maldad, pero\nno sé dónde está."
"text.06fc": "¡Bien, déjamelo a mí!\nIré a buscarlo y\nme encargaré."
"text.0780": "Ah, gracias. Por cierto..."
"text.0800": "Despertaste. Lo siento mucho."
"text.086a": "¿Qué es esta máquina?"
"text.08a6": "Es una {color:4}máquina para\nguardar datos de batalla\nen la tarjeta{color:1}."
"text.0914": "Con esa máquina puedes\nguardar los datos de tu\ncompañero para batallas."
"text.09aa": "Solo tienes que presionar\n{color:6}△ {color:1}y la máquina\nte dirá qué hacer."
"text.0a4e": "¿Quieres usar la\n{color:4}máquina para guardar\ndatos de batalla{color:1}?"
"text.0ace": "Sí\nNo"
"text.0b04": "Parece que Yuramon\nconsiguió más rumores."
"text.0b78": "Oí que Yuramon sabe\nrumores nuevos."
"text.0bda": "La ciudad empieza a\ncrecer y cambiar\nahora que estamos aquí."
"text.0c5a": "{color:6}{tamer}{color:1}, tienes una\nforma muy distinta\nde vivir la aventura."
