text.0020: "¿Te molesto?"
text.0090: "{color:7}??? {color:1}\n¡Ayúdenme!"
text.00ca: "Oigo una voz desde arriba.\n¿Hay alguien ahí?"
text.012c: "{color:7}??? {color:1}\n¿Hay alguien ahí?"
text.0162: "Sí, aquí hay alguien."
text.018a: "{color:7}??? {color:1}\n¡Ayúdenme!\nEl suelo se está levantando."
text.01e8: "Debes estar bromeando."
text.0222: "{color:7}??? {color:1}\nNo, es verdad.\nOigo ruido de maquinaria."
text.029a: "¿Una máquina? Debe venir de\nla guarida de Ogremon."
text.0312: "{color:7}??? {color:1}\nDebiste hacer algo\nmal ahí, ¿no?"
text.0386: "Hice muchas cosas. Podría\nser el elevador.... Volveré\na la guarida a revisar."
text.0442: "{color:7}??? {color:1}\nGracias."
