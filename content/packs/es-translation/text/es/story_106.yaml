"text.005e": "Un derrumbe bloqueó el camino..."
"text.00a2": "¡Prueba de batalla!"
"text.00c0": "Es broma."
"text.00e6": "¡Me llaman Sr. Práctico!\n¿Qué puedo hacer por ti?"
"text.0146": "Cambiar parámetros\nAdelantar el tiempo\nDominar todas las técnicas"
"text.01cc": "Subir\nBajar\nReiniciar nivel de habilidad"
"text.022a": "Adelantar una hora\nAdelantar seis horas\nAdelantar un día"
"text.02e4": "Sumar cincuenta\nSumar cien\nSumar doscientos"
"text.03bc": "Restar cincuenta\nRestar cien\nRestar doscientos"
