text.002e: "Te voy a atrapar."
text.0068: "¿Viniste aquí a perder?"
text.00b2: "¡Te ves bastante debilucho!"
text.00f2: "Mmm, ¿en serio quieres perder?"
text.0140: "¡Vas a caer!"
text.017a: "¡Quítate de mi camino!"
text.01ca: "Esta es una zona horaria\ncompletamente distinta."
text.0226: "No podemos perder tiempo.\nDebemos buscar meteoritos."
