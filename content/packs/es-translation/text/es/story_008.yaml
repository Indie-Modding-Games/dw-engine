text.004e: "Túnel Taladro"
text.0084: "Normal\nModo Ogro"
text.00ec: "¡Ese tonto! ¡Qué grosero!"
text.012e: "¿Eh?"
text.015a: "{color:7}Encargado del mercado {color:1}\n¡No sabía que habría que\npagar para pasar!"
text.01f6: "{color:7}Encargado del mercado {color:1}\nOye, ¿no eres...? ¡Sí!\n¡Haz algo!"
text.026c: "¿Cómo están los Drimogemon\nde adentro?"
text.02b0: "{color:7}Encargado del mercado {color:1}\nNo lo sé."
text.02f6: "Espero que estén bien.\n¡Bien, allá voy!"
text.0362: "{color:7}Encargado del mercado {color:1}\n¡Haz algo rápido!"
text.03f8: "Ya no hay nada más en\nel túnel... ¿Lo cruzamos\no qué?"
text.047e: "¡Crucémoslo!\nMejor no"
