text.0076: "¡Oh, muchas gracias!"
text.00a6: "¿Qué? ¿Quieres pelear?"
text.00f4: "¡Oh, mil gracias!"
text.0120: "¡Déjalo!"
text.0154: "¡No te esfuerces de más!"
text.0186: "¡A pelear, mocoso!"
text.01c0: "¡Me rindo!"
text.01de: "El jefe se fue."
text.0262: "Oigan, si quieren pasar\npor aquí, ¡dejen\ntodas sus cosas!{cell:0000}"
text.02ec: "Cuánto tiempo sin vernos."
text.0316: "Mmm. ¡Ustedes otra vez!"
text.0346: "¡Eso lo digo yo!\nFue muy fácil encontrarte.\n¿Listo para perder?"
text.03c6: "¿Perder? ¡Ni loco!\n¡Te mostraré lo que hago\ncuando me pongo serio!"
text.0444: "¡Arreglemos esto\nde una vez por todas!"
text.04de: "¿Cómo es que... no gano?"
text.0520: "¿Qué pasa?\n¿No vas a huir?"
text.0578: "Estoy muy cansado."
text.059c: "..."
text.05aa: "Me hice bandido porque\ncreí que la isla estaba\nperdida, e hice lo que quise."
text.0654: "¿Sabías que la isla\nestaba en problemas?"
text.06aa: "Sí, y luego llegaste tú.\nSupongo que es tonto\nempezar a ayudarte ahora."
text.0742: "No lo creo.\nVen a la ciudad."
text.0794: "No, no puedo. Además, nadie\nme perdonaría por lo\nque hice."
text.083e: "¡Ay, ya cállate\ny ven conmigo!"
text.089c: "¡Puedes ser útil!\n¡Todos tienen algo\nque aportar!"
text.090c: "¡¡¡!!!"
text.0922: "¿Se puede salvar esta isla?\nTú la vas a salvar\npor nosotros, ¿verdad?"
text.09ba: "¡Claro! Sabes dónde\nestá la ciudad, ¿verdad?"
text.0a1c: "¡Ohhhhh!\n¡Allá estaré!"
text.0a84: "¡Ogremon se une a la ciudad!"
text.0ad6: "¡Ups!\n¡La salida no es por aquí!"
text.0b32: "¡Oh, no! ¡Debo devolverle la\ncaja de tierra a Drimogemon!"
text.0be6: "¡Ups! ¡La salida no es aquí!"
text.0c42: "¡Oh, no! ¡Debo devolverle la\ncaja de tierra a Drimogemon!"
