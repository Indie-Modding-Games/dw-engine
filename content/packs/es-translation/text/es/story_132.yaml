"text.0028": "¿Dónde estamos?\n¿Es un sueño?"
"text.008c": "¡Guau! ¿Quién eres?\n¿Dónde está {color:10}{partner}{color:1}?"
"text.00e2": "Cálmate. Me llamo Frigimon.\nEsta es mi casa. Soy un\nDigimon de hielo y nieve."
"text.017c": "Estabas inconsciente en la\nnieve. Te recogí\ny te cuidé."
"text.0218": "Ah, {color:10}{partner}{color:1}.\n¡Qué bueno que estás bien!"
"text.025c": "Oye, ¿me escuchas?\nSi no te encontraba,\n¡ya estarías muerto!"
"text.02f6": "Ah, perdón. Vaya, gracias."
"text.033e": "Oye, {color:10}{partner}{color:1},\nhasta me golpeé la cabeza\ncuando caíste de repente."
"text.03be": "{digimon:pstat=103}no aguanta el frío.\nEres muy imprudente.\nTodo es culpa tuya."
"text.0452": "No lo sabía.\nLo siento, {color:10}{partner}{color:1}."
"text.049e": "Gracias, Frigimon. ¿Puedo\npedirte un favor más?"
"text.0504": "¿Qué harás si {digimon:pstat=103}\nse desmaya otra vez?\n¡Mejor vete a casa pronto!"
"text.058e": "Bien, entendido.\nHaré que {color:10}{partner}{color:1}\ndigievolucione en otro Digimon."
"text.062c": "¿Digievolucionar?"
"text.06c8": "Hola de nuevo."
"text.06e8": "¿Qué pasó con\nel otro Digimon?"
"text.0732": "Ah, es el mismo."
"text.076a": "¿Eh? ¿En serio?\nNo lo entiendo."
"text.07bc": "Vine porque tengo que\npedirte un favor. Quiero\nque vengas a la ciudad."
"text.0850": "¿Qué gano yo?\n¿Algo interesante?"
"text.08b6": "Bueno, puedes abrir\nla tienda que quieras."
"text.0914": "Guau, siempre quise hacer\neso. ¡Bien, iré!"
"text.0980": "Bien, suena bien.\nEntonces vamos ya."
"text.09d8": "¡Una tienda! Raspados y\nhelados. ¡Esto va a\nestar genial!"
"text.0a94": "¡Frigimon se une a la ciudad!"
"text.0ad6": "¡Ese Digimon no aguanta\nbien el frío!"
"text.0b36": "¡Volveré!"
