"text.0010": "¡Te estaba esperando!"
"text.0044": "¿Estás recuperando\nla razón?"
"text.0092": "Me siento\nun poquito raro."
"text.00d8": "Oye,\nesto es serio, ¿sabes?"
"text.011e": "La fábrica está cerrada, así\nque tengo mucho tiempo libre.\n¡Te ayudaré!"
"text.01b0": "Recuperó la razón, pero\n¡sigue pareciendo loco!\n? ¡sigue pareciendo loco!"
"text.024c": "Bueno, perdóóóónenmeee.\n¡Nos vemos!"
"text.02d6": "¡Giromon se une a la ciudad!"
