text.004e: "¿No deberías irte a casa?"
text.0090: "¡Vete a casa!"
text.00b6: "¡Deberías regresar!"
text.010c: "¡Ay, qué deslumbrante!"
text.014c: "{color:7}??? mon {color:1}\nTú que buscas mi ayuda,\n¡ha llegado la hora! ¡Te doy\nla bendición de mis alas!"
text.0206: "¿Qué...? ¿Dónde...?\n¿De quién es esa voz...?"
text.0252: "¡Agh!"
text.0274: "¿Qué fue eso? La luz se fue.\nNo hay nada más aquí.\n¡¿Entonces está arriba?!"
