text.0022: "Parece que {color:10}{partner}{color:1}\nse desvaneció..."
text.0064: "Antes de desvanecerse, dejó\nun Digitama. Renacerá con\nsus habilidades."
text.0116: "¿Qué huevo quieres?"
text.0158: "Si quieres, puedes cambiar\nel nombre {color:10}{partner}{color:1}."
text.01b0: "Quiero un nombre nuevo\nMantener su nombre"
text.0214: "¿Te parece {color:10}{partner}{color:1}?"
text.0234: "Quiero otro nombre\nEstá bien"
text.02a0: "¡Oye, no te enfermes!"
text.02ce: "Con la poca vida que le\nquedaba, {color:10}{partner}{color:1}\nlogró sobrevivir."
text.0346: "Debes tener cuidado."
text.0384: "¡Dios mío!\nVolviste tras perder."
text.03d4: "Con la poca vida que le\nquedaba, {color:10}{partner}{color:1}\nlogró sobrevivir."
text.044c: "Quizá te robaron tus cosas."
text.048e: "A quien pierde una batalla\npueden robarle sus cosas."
text.0502: "Los objetos robados quizá\nse vendan en algún lugar.\n¡No dejes de buscarlos!"
text.059e: "¡Oh, no! {color:10}{partner}{color:1}\nse quedó sin vida."
text.05de: "Antes de desvanecerse,\n{color:10}{partner}{color:1}\ndejó un Digitama."
text.0646: "Por el peligro, el Digitama\nno heredó todas\nlas habilidades..."
text.06d8: "{color:4}¡El nivel de domador\nbajó! {color:1}"
text.0726: "Si quieres,\npuedes cambiar el nombre\n{color:10}{partner}{color:1}."
text.0780: "Quiero un nombre nuevo\nMantener su nombre"
text.0872: "¡{color:10}{partner}{color:1} digievolucionó!"
