text.0056: "¡Oye, dame {color:6}Carne{color:1}!"
text.008c: "Bienvenido, quieres\n{color:6}Carne{color:1}. Bueno, eh..."
text.0100: "Subir precio\nDejar en cincuenta bits\nBajar precio"
text.0172: "Eh, querías\n{color:6}Carne{color:1}, ¿verdad? Eh..."
text.01e8: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na setenta y cinco bits?"
text.0256: "Subir a setenta y cinco\nLo pensaré mejor"
text.02de: "¿Y la {color:6}Carne{color:1} de cincuenta\na setenta bits?"
text.033a: "Subir a setenta\nLo pensaré mejor"
text.03c2: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na sesenta y cinco bits?"
text.042c: "Subir a sesenta y cinco\nLo pensaré mejor"
text.04b0: "¿Y la {color:6}Carne{color:1} de cincuenta\na sesenta bits?"
text.0508: "Subir a sesenta\nLo pensaré mejor"
text.058c: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na cincuenta y cinco bits?"
text.05f6: "Subir a cincuenta y cinco\nLo pensaré mejor"
text.066e: "¿Y la {color:6}Carne{color:1} de cincuenta\na su precio normal?"
text.06ca: "Dejar a precio normal\nLo pensaré mejor"
text.074c: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na cuarenta y cinco bits?"
text.07b6: "Bajar a cuarenta y cinco\nLo pensaré mejor"
text.083a: "¿Y la {color:6}Carne{color:1} de cincuenta\na cuarenta bits?"
text.0892: "Bajar a cuarenta\nLo pensaré mejor"
text.0916: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na treinta y cinco bits?"
text.0982: "Bajar a treinta y cinco\nLo pensaré mejor"
text.0aca: "¡Bien, vendido!"
text.0b12: "Ganancia total: {shopvar}\nGanancia:\ncuarenta"
text.0b68: "Ganancia total: {shopvar}\nGanancia:\ntreinta y cinco"
text.0bca: "Ganancia total: {shopvar}\nGanancia:\ntreinta"
text.0c22: "Ganancia total: {shopvar}\nGanancia:\nveinticinco"
text.0c84: "Ganancia total: {shopvar}\nGanancia:\nveinte"
text.0cdc: "Ganancia total: {shopvar}\nGanancia:\nquince"
text.0d36: "Ganancia total: {shopvar}\nGanancia:\ndiez"
text.0d88: "Ganancia total: {shopvar}\nGanancia:\ncinco"
text.0dd2: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.0e94: "¡Nos vemos! ¡¡Me largo!!"
text.0ef6: "¿Cuándo vendrán clientes...?"
text.0f44: "¡Hazme una rebaja!"
text.0f74: "Bueno... Bueno, entonces..."
text.0fa8: "¡Oye! Dame un\n{color:6}Orinal portátil{color:1}."
text.0fee: "Eh... Bienvenido, ¿quieres un\n{color:6}Orinal portátil{color:1}?"
text.1060: "Subir precio\nDejar en trescientos bits\nBajar precio"
text.10dc: "Eh... ¿querías un\n{color:6}Orinal portátil{color:1}?"
text.114a: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na cuatrocientos cincuenta bits?"
text.11e6: "Subir a cuatrocientos cincuenta\nLo pensaré mejor"
text.1274: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na cuatrocientos veinte bits?"
text.131a: "Subir a cuatrocientos veinte\nLo pensaré mejor"
text.13a4: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos noventa bits?"
text.1444: "Subir a trescientos noventa\nLo pensaré mejor"
text.14d0: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos sesenta bits?"
text.1576: "Subir a trescientos sesenta\nLo pensaré mejor"
text.1600: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos treinta bits?"
text.16a0: "Subir a trescientos treinta\nLo pensaré mejor"
text.1720: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na su precio normal?"
text.17c6: "Dejar a precio normal\nLo pensaré mejor"
text.1848: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos setenta bits?"
text.18e6: "Bajar a doscientos setenta\nLo pensaré mejor"
text.1974: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos cuarenta bits?"
text.1a16: "Bajar a doscientos cuarenta\nLo pensaré mejor"
text.1aa2: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos diez bits?"
text.1b38: "Bajar a doce\nLo pensaré mejor"
text.1c82: "¡Sí! ¡Trato hecho!"
text.1cd4: "Ganancia total: {shopvar}\nGanancia:\ndoscientos cuarenta"
text.1d42: "Ganancia total: {shopvar}\nGanancia:\ndoscientos diez"
text.1dac: "Ganancia total: {shopvar}\nGanancia:\nciento ochenta"
text.1e1c: "Ganancia total: {shopvar}\nGanancia:\nciento cincuenta"
text.1e8a: "Ganancia total: {shopvar}\nGanancia:\nciento veinte"
text.1efa: "Ganancia total: {shopvar}\nGanancia:\nnoventa"
text.1f52: "Ganancia total: {shopvar}\nGanancia:\nsesenta"
text.1fa8: "Ganancia total: {shopvar}\nGanancia:\ntreinta"
text.1ff6: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.208c: "Creo que está algo caro."
text.20c4: "¿Tú crees? Bueno, entonces..."
text.20fc: "¡Oye! Dame\n{color:6}Medicina{color:1}."
text.213a: "Eh... Bienvenido, ¿quieres\n{color:6}Medicina{color:1}?"
text.21a0: "Subir precio\nDejar en mil bits\nBajar precio"
text.221a: "Eh, querías\n{color:6}Medicina{color:1}, ¿verdad?"
text.228c: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil quinientos bits?"
text.2318: "Subir a mil quinientos\nLo pensaré mejor"
text.23a2: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na mil cuatrocientos bits?"
text.2428: "Subir a mil cuatrocientos\nLo pensaré mejor"
text.24b4: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil trescientos bits?"
text.2542: "Subir a mil trescientos\nLo pensaré mejor"
text.25ce: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na mil doscientos bits?"
text.2650: "Subir a mil doscientos\nLo pensaré mejor"
text.26d8: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil cien bits?"
text.2762: "Subir a mil cien\nLo pensaré mejor"
text.27de: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na su precio normal?"
text.2868: "Dejar a precio normal\nLo pensaré mejor"
text.28ea: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na novecientos bits?"
text.2970: "Bajar a novecientos\nLo pensaré mejor"
text.29fa: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na ochocientos bits?"
text.2a7a: "Bajar a ochocientos\nLo pensaré mejor"
text.2b06: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na setecientos bits?"
text.2b8e: "Bajar a setecientos\nLo pensaré mejor"
text.2cdc: "¡Bien! Me lo llevo."
text.2d2a: "Ganancia total: {shopvar}\nGanancia:\nochocientos"
text.2d90: "Ganancia total: {shopvar}\nGanancia:\nsetecientos"
text.2df6: "Ganancia total: {shopvar}\nGanancia:\nseiscientos"
text.2e58: "Ganancia total: {shopvar}\nGanancia:\nquinientos"
text.2ebc: "Ganancia total: {shopvar}\nGanancia:\ncuatrocientos"
text.2f20: "Ganancia total: {shopvar}\nGanancia:\ntrescientos"
text.2f86: "Ganancia total: {shopvar}\nGanancia:\ndoscientos"
text.2fe8: "Ganancia total: {shopvar}\nGanancia:\ncien"
text.3040: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.30d6: "Cobras demasiado."
text.3106: "¿En serio? Bueno, entonces..."
