text.00cc: "¿Qué pasa?"
text.00f4: "¡AUXILIO!"
text.0114: "¡Está en problemas,\ntengo que ayudarlo!"
text.0174: "{color:7}??? {color:1}\n¡Métete con alguien\nde tu tamaño!"
text.01e4: "¿Quién es ese?"
text.0270: "¿Estás bien?"
text.0298: "Gracias."
text.02b4: "Llámame cuando estés\nen problemas. ¡Vendré\nde inmediato!"
text.032e: "¡Hasta pronto!"
text.035e: "¡Oye, espera!"
text.039a: "Es como un héroe.\nSe lleva todo el mérito."
text.0404: "Esta es mi casa. ¡Vete!"
text.044a: "Soy Sharmamon. ¿Quién eres?"
