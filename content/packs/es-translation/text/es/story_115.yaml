"text.00c8": "Bienvenido, jovencito."
"text.0108": "Eres Cherrymon, ¿verdad?"
"text.0144": "¿Quién es?"
"text.0164": "¿Qué quieres de un\nviejo como yo?"
"text.01ca": "Primero, despeja la niebla."
"text.0200": "No veo nada con la niebla.\n¿Puedes quitarla?"
"text.026c": "Así que es eso. Ya veo."
"text.02a6": "... ¿no puedes hacerlo?"
"text.02da": "Primero, escucha lo que\ntengo que decir. A ver...\n¿por dónde empiezo?"
"text.0364": "Si sabes de la emergencia\nen la isla, por favor,\ncuéntamela."
"text.03fa": "Ya veo, ya veo.\nLa emergencia."
"text.043e": "Esta isla empezó a cambiar\nhace ochenta años, tras los\ncambios de la tierra."
"text.04de": "Las zonas del noreste de\nla isla aparecieron de\nrepente hace ochenta años."
"text.0574": "Desde entonces, los Digimon\nempezaron a irse.\nLas especies se separaron."
"text.05fa": "Y cada especie empezó\na hablar su propia lengua."
"text.066a": "Olvidaron el idioma\nque usaban en la ciudad..."
"text.06d2": "Al final, Ciudad File\nperdió a casi toda su\npoblación de Digimon."
"text.0752": "¡Luego los Digimon empezaron\na perder la memoria!"
"text.07a8": "La historia de la isla, su\npasado, sus sentidos...\nempeoran día a día."
"text.0844": "Tengo algo importante que\ndecirte, pero tampoco\nlo puedo recordar."
"text.08e6": "Sin embargo, todo se unirá\nal final. ¡Alguien\nhace que así sea!"
"text.097c": "Con el tiempo, los Digimon\nverán la emergencia\ncomo algo normal."
"text.0a08": "¡Solo tú y el poder de Ciudad\nFile para unir a los Digimon\npueden detener esto!"
"text.0ab8": "Reúne Digimon en la ciudad\ny crea un milagro.\nSin duda ocurrirá."
"text.0b54": "Bueno, me emocioné.\nUf, ya lo dije todo."
"text.0bd4": "Ahora, quitemos la niebla."
"text.0c20": "Puse la niebla en el bosque\npara poder hablar contigo.\nAh, una cosa más..."
"text.0cd0": "En el bosque hay otros\nque saben del\npasado."
"text.0d44": "Adéntrate en el bosque\npara encontrarlos, si puedes."
"text.0dbc": "¿Volviste para oír\nhablar a un viejo?"
"text.0e24": "Sobre la isla...\nEntrena a {color:10}{partner}{color:1}\nNada, olvídalo"
"text.0e98": "Esto es lo que tengo que decir."
"text.0eda": "Ah, está bien."
"text.0efe": "{color:5}Entrenamiento: Enseñanzas\ndel bosque {color:1}"
"text.0f56": "Empezar\nExplicar\nSalir"
"text.0f8e": "Normal\nIntento extra\nSalir"
"text.0fcc": "Cherrymon te dará mucho\nconocimiento. Subirá mucho\ntu sabiduría."
"text.1068": "Explicar otra vez\nEmpezar\nSalir"
"text.10c2": "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}\npara alinear tres dibujos."
"text.1138": "Ja, ja, ja."
