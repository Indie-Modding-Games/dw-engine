"text.00f8": "¡Volví!"
"text.0122": "Gracias por invitarme.\nOjalá podamos trabajar\njuntos, {color:10}{partner}{color:1}."
"text.01c6": "{color:7}¡Subió tu nivel\nde domador! {color:1}"
"text.020c": "{color:7}¡Felicidades!\nAquí tienes\nuna medalla. {color:1}"
"text.026c": "¡Una carta de Machinedramon!"
"text.0782": "¿Has visto al\nGuardián del Lago?"
"text.07c8": "Si no, deberías\nesperar en el lado sur."
"text.083e": "Levántate muy temprano y\ncamina entre la niebla.\n¡Pasará algo bueno!"
"text.08de": "¿Sabías que en el norte\nhay un lugar llamado\nPlaya Iceberg?"
"text.0962": "Dicen que en esa playa\nsuele aparecer un\nDigimon enorme."
"text.09f4": "¿Ya vencieron a los bandidos?\nOí que hay una banda\nde bandidos."
"text.0a8c": "¿Has ido al Gran Cañón?"
"text.0ac6": "Dicen que ahí están\nlos bandidos."
"text.0b1e": "¿Son malvados?"
"text.0b4a": "Te asaltan y te roban."
"text.0b86": "Hagamos algo al respecto."
"text.0bd8": "¿Has ido al Gran Cañón?"
"text.0c12": "Dicen que ahí hay un\nPuente Invisible."
"text.0c96": "Oí que Machinedramon\nha vuelto."
"text.0cea": "Venciste otra vez\na Machinedramon."
"text.0d2e": "Te explicaré los\nalrededores de la ciudad."
"text.0d88": "El Bosque Nativo\nrodea la ciudad."
"text.0dd0": "Los Digimon de por ahí\nno son muy fuertes."
"text.0e2c": "Al oeste hay un campo\nde entrenamiento."
"text.0e7a": "La Selva Tropical está\nal este, cruzando el río."
"text.0ed2": "No sé qué hay\nmás allá."
"text.0f18": "Al oeste hay una\nmontaña y un lago."
"text.0f70": "Al sur está el océano."
"text.0fb4": "Al norte hay una montaña\nmuy alta."
"text.1006": "Esta ciudad es el\ncentro de la isla."
"text.1058": "Investigaré los rumores.\nVuelve para saber más."
"text.10c8": "Veamos qué hay por aquí."
"text.1108": "No me gusta el baño, ¡pero\ntodo lo demás está bien!"
"text.117e": "Se ve muy animado."
"text.11b2": "¿No tengo que volver\nal Pueblo Factorial?"
"text.120c": "Mi función de agenda\nfunciona. Sin problemas."
"text.1282": "¡Llegaste en buen momento!"
"text.12be": "¡Mira esta escultura!\n¿Qué te parece?"
"text.1318": "Qué obra maestra.\nMe asombro a mí mismo."
"text.1364": "¿Qué quieres decir?\n¡Te estás burlando de mí!"
"text.13be": "¿De qué hablábamos?\nBueno, da igual."
"text.141e": "¿Qué imagen tenía yo?\nCuando lo descubras,\navísame."
"text.14e2": "durmiendo..."
"text.1516": "¿Ya supiste? Hay una\nplanta rara creciendo\nen la Selva Tropical."
"text.15b2": "Ah, sí,"
"text.15c8": "Planté una {color:6}Planta lluvia\n{color:1}justo ahí."
"text.1618": "Da fruto cada año\nhacia el día quince.\nPuedes llevártelos."
"text.16a4": "¿Para qué?"
"text.16cc": "¡Ah, qué rico!\nRayos de sol."
"text.170e": "¡Ah, qué rico!\nRayos de sol."
"text.1766": "¡Bien, esto es genial!"
"text.17be": "Ah, esto es un..."
"text.17f6": "Demasiados objetos."
"text.1822": "¡Conseguí un {color:6}Fruto de\nPlanta lluvia{color:1}!"
"text.1902": "Te llevaré al océano.\nEse es mi trabajo."
"text.195c": "Te llevaré a un lugar al que\nsolo se llega por mar."
"text.19c8": "Bueno, entonces..."
"text.19ea": "Mmm, ¿adónde vamos?\nAl Pueblo Factorial o quizá\na la Cueva Playa."
"text.1a6c": "Pueblo Factorial\nCueva Playa Secreta\nA ningún lado"
"text.1b5a": "¡Te encontré!"
"text.1b88": "¡Oh, no, viene\nhacia nosotros!"
"text.1be2": "¡Por fin te encuentro!\nSoy Greymon.\n¡Ahora arreglemos cuentas!"
"text.1c62": "¡¿Qué?!"
"text.1c76": "Llegué aquí siguiendo\nlos rumores sobre ti.\n¡Quiero pelear contigo!"
"text.1d00": "Si gano,\n¡quiero este letrero!"
"text.1d54": "Aquí no hay letrero."
"text.1d7c": "No me importa,\n¡peleemos de todos modos!"
"text.1e08": "¡Oigan, son buenos!\nPero para cumplir su meta,\naún son unos novatos."
"text.1ea6": "Mmm"
"text.1eb6": "Me quedaré a entrenarlos.\n¡Mejorarán mucho!"
"text.1f56": "¡Greymon se une a la ciudad!"
"text.200c": "¡Bien, te encontré, {color:6}{tamer}{color:1}!"
"text.2048": "¡Emboscada!"
"text.205e": "Mi meta es vencerte."
"text.2094": "¡Esos ojos! ¡Deben haberle\nlavado el cerebro!"
"text.2126": "Haga lo que haga,\ndebo vencerlo."
"text.218c": "¿De qué hablas?\nNecesitas tratamiento."
