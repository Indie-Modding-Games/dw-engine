"text.0026": "Aquí todo está bien.\nBuena suerte."
"text.0078": "Yo también debo ayudar. Iré\ny vendré entre aquí y la\nciudad siempre que pueda."
"text.0128": "¡Andromon se une a la ciudad!"
"text.0176": "Reparación de datos completa.\nAhora, leamos los datos."
"text.01e6": "Por favor."
"text.0200": "Hace cien años, aparecieron\nlos Humanos Analógicos\nen la isla Digimon."
"text.0286": "Los Humanos Analógicos y los\nDigimon nativos lucharon duro."
"text.02f0": "Tras diez años de batalla,\nlos Humanos Analógicos\nperdieron y desaparecieron."
"text.038c": "En los diez años siguientes,\nmisteriosamente, la isla casi\nduplicó su tamaño."
"text.0438": "¿Humanos contra Digimon?"
"text.0476": "Lo siento. Esos son todos los\ndatos que pudimos recuperar."
"text.04e6": "No te preocupes. Es\ninformación muy importante.\nAhora sé mucho más."
"text.0582": "¿De verdad?"
"text.05ae": "Seguro esos humanos son los\nque causaron el caos y los\nproblemas en la isla."
"text.065e": "¿Los humanos pueden\nvivir cien años?"
"text.06aa": "Parece que para los humanos,\naquí el tiempo pasa lento."
"text.071a": "Por eso aquí no tengo\nque comer ni dormir."
"text.078a": "Cien años es mucho\ntiempo. Esos tipos\ndeben ser muy duros."
"text.081c": "¿Crees que estén\nescondidos en algún lugar?"
"text.0872": "Los encontraré\ny haré algo."
"text.08b8": "Ahora sé por qué estoy aquí.\nComo soy humano,\ndebo encargarme de ellos."
"text.095e": "Lo sentimos mucho. Cerraremos\nla fábrica por un tiempo."
"text.09d6": "Con los problemas de ahora,\nnadie sabe qué va a pasar.\nNo es culpa tuya."
"text.0a8a": "Creo que alguien controla\na Giromon."
"text.0aea": "Destruyeron las computadoras\ny el agua sucia empezó a salir."
"text.0b62": "Esa agua enloqueció a\nlos Digimon. No creo que\nsea una coincidencia."
"text.0bee": "Estas computadoras tienen\nalgo muy importante."
"text.0c46": "Quizá sea tarde,\npero creo que alguien\nquería atacarnos."
"text.0cc8": "¡¿Qué?!"
"text.0cdc": "Creo que en estas computadoras\nhabía datos sobre el\npasado de la isla."
"text.0d78": "Pero por el motín de Giromon,\nlos datos se destruyeron."
"text.0dec": "¿Nunca viste esos datos?"
"text.0e2a": "No, pero quizá podamos\nreparar parte. Intentaré\nconectar los datos."
"text.0eca": "Ya veo, gracias.\n¿Cuánto tardará?"
"text.0f22": "Un buen rato. Reabriré\nla entrada del pueblo,\nasí que vuelve luego."
"text.0fb2": "Gracias. Volveré."
"text.0ff6": "¿Terminaste de\nreparar los datos?"
"text.1044": "Tardará un poco más.\nVuelve más tarde."
"text.10a2": "Bien, volveré."
"text.10ea": "¡Oye, oye!"
"text.1104": "Tengo que disculparme."
"text.113c": "Eso luego, ¡ahora tienes que\ndetener las máquinas!"
"text.11ba": "Bien, lo haré."
"text.11ee": "La fábrica acaba de\ndetenerse."
"text.1246": "Bien, revisaré la alcantarilla.\nNos vemos, amigo."
"text.12b2": "Debo disculparme."
"text.12dc": "¡No hay tiempo para\nhablar de eso ahora!"
"text.133e": "Nuestra computadora es perfecta."
"text.1376": "¿De verdad la fábrica es segura?\n¿Qué podemos hacer ahora?"
"text.13e8": "Bien, hay que hacer algo\ncon los guardias. ¡No hay\notra forma!"
"text.1482": "¿Cómo entraste al pueblo?"
"text.14ca": "Si no tienes nada que\nhacer aquí, ¡vete ya!"
"text.1546": "Eso lo hablamos luego.\nAhora tengo que revisar\nla fábrica."
"text.15cc": "Es cuestión de vida o\nmuerte. ¡Dame permiso!"
"text.163e": "No entiendo bien\nqué intentas hacer.\nNo puedo darte permiso."
"text.16e4": "¡Hay Digimon a punto de\ndesaparecer por el agua\nsucia de la fábrica!"
"text.178e": "¿De la fábrica? ¡Imposible!\nEl sistema de limpieza\nde agua funciona bien."
"text.182a": "¡¿Cómo sabes que funciona\nbien si no lo revisamos?!"
"text.18a6": "Nuestra computadora es perfecta.\nEn emergencias, el Guardián\nde Red apaga el sistema."
"text.1952": "¿Me dices que el Guardián\nde Red siempre funcionará\nbien?"
"text.19de": "Guardián de Red es otro\nnombre de Giromon, un\nDigimon Ultra."
"text.1a68": "Su juicio y su habilidad\nson perfectos."
"text.1ac2": "¡¿Es un Digimon?! Oh, no,\nahora estamos peor.\n¡Por favor, dame permiso!"
"text.1b7c": "¡Vete! ¡Ya!"
"text.1ba2": "Ay... ¡Rayos!"
