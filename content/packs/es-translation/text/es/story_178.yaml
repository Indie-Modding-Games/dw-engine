"text.00a8": "¡Llegaste en el momento justo!\nTengo un favor que\nsolo tú puedes hacer."
"text.0146": "¿Qué es?"
"text.0164": "Acabo de sentir la misma\nmaldad que Analogman\ny Machinedramon."
"text.01f8": "Sé de dónde viene."
"text.0236": "¿Otra vez? ¡Déjamelo a mí!"
"text.0272": "Gracias. Por cierto..."
"text.02b8": "¡Supe que venciste\na Machinedramon!"
"text.02fe": "Sí, pero no lo entiendo.\nParecía la maldición\nde Analogman."
"text.0386": "Su rencor era muy fuerte.\nQuizá ahora tengamos paz."
"text.03fa": "Si Machinedramon vuelve,\nlo venceremos otra vez."
"text.0460": "Eres de confianza. Esto creció\nen nuestra granja de carne,\nes para ti."
"text.04f0": "¡Guau! ¿Un {color:6}Melón\ncadena{color:1}?"
"text.0548": "Tengo demasiados objetos."
"text.0588": "¡Gracias!"
"text.05be": "¡Llegaste!\nEsto no se lo puedo pedir\na nadie más."
"text.0636": "No temas, aquí estoy.\n¿Quieres decir que\nAnalogman volvió?"
"text.06a6": "Siento su maldad, pero\nno sé dónde está."
"text.0712": "¡Déjamelo a mí! Lo encontraré\ny me encargaré de él."
"text.0784": "Gracias.\nPor cierto..."
"text.07ea": "Volví y pienso reconstruir\nCiudad File con la ayuda\nde {color:10}{partner}{color:1}."
"text.0882": "Quiero construir\ntiendas que les sirvan\na ti y a {color:10}{partner}{color:1}."
"text.0900": "Explora el Bosque Nativo,\njusto fuera de la ciudad."
"text.099c": "Toma esto. Buena suerte."
"text.09de": "¡Conseguí muchos objetos!"
"text.0a26": "Para ver los objetos, presiona\n{color:5}× {color:1}..."
"text.0a6a": "...luego elige «Objeto»\ny míralos con\n{color:6}△ {color:1}."
"text.0ae2": "Parece que Yuramon\nconsiguió más rumores."
"text.0b56": "Oí que Yuramon\ntiene rumores nuevos."
"text.0bb2": "La ciudad empieza a\ncrecer y dicen que\nestá cambiando."
"text.0c30": "Te enseñaré lo básico\nde nuestro mundo."
"text.0ca0": "El día tiene veinticuatro horas\ny hay mañana,\ntarde y noche."
"text.0d32": "Quizá sientas que\nel ritmo es rápido."
"text.0d76": "El año tiene treinta días.\n¿Mes? ¿Qué es eso? ¿Estaciones?\n¿Se comen?"
"text.0e14": "Claro que tenemos dinero.\nLa unidad es el bit. Nunca\nse tiene demasiado dinero."
"text.0eb6": "Cuando en esta isla dicen\n«ciudad», se refieren a aquí."
"text.0f24": "Pero hay otras aldeas\ny pueblos pequeños."
"text.0f84": "En el reloj, el punto amarillo\nson las horas y la aguja,\nlos minutos."
"text.100a": "Arriba es medianoche\ny abajo, mediodía."
"text.1050": "La parte roja de la izquierda\nes el atardecer. Marca\nde las cuatro a las ocho."
"text.10f0": "La parte morada de la\nderecha es la mañana y\nmarca de cuatro a ocho."
"text.118a": "Los Digimon están activos\na ciertas horas del día."
"text.11e6": "Casi todos se levantan en la\nmañana y duermen de noche,\npero algunos al revés."
"text.1286": "Si no encuentras al\nDigimon que buscas, prueba\na otra hora del día."
"text.1340": "Habla con Tsunomon y Yuramon\ntan seguido como puedas."
"text.13bc": "Te hablaré del\nnivel de domador."
"text.140a": "Con un nivel de domador alto,\ncuando tu Digimon desaparezca,"
"text.147c": "tu siguiente Digimon tendrá\nmejores parámetros."
"text.14de": "Al principio\nno subirá mucho,"
"text.152e": "pero sigue criándolo con\nconstancia y mejorará."
"text.15b2": "Cuando uses tu técnica\nfinal, presiona rápido\nlos botones L y R."
"text.1658": "Con el medidor final lleno,\ncomparado con vacío, ¡el\ndaño al enemigo es el doble!"
"text.1704": "Te hablaré de la\nvida de un Digimon."
"text.1754": "Cuando el Digimon tiene\nhambre, te lo dirá."
"text.17ac": "También necesita ir al baño.\nAsegúrate de que lo haga\nen el inodoro."
"text.182e": "Los Digimon tienen sueño y\nnecesitan dormir, pero tú\ntienes que hacerlo dormir."
"text.18b8": "No intentes tenerlo\ndespierto demasiado."
"text.190a": "Puede cansarse, enfermarse\no solo enojarse.\nEs algo delicado."
"text.198c": "Como los Digimon son\ncriaturas salvajes, debes\nelogiarlos o regañarlos."
"text.1a16": "Hagas lo que hagas,\nfíjate en lo que\nhace tu Digimon."
"text.1aba": "Despertaste...\nLo siento mucho."
"text.1b28": "¿Qué es esta máquina?"
"text.1b64": "¿Eso? Es una\n{color:4}máquina para guardar\ndatos de batalla{color:1}."
"text.1be6": "Con esa máquina puedes\nguardar los datos de tu\ncompañero para batallas."
"text.1c7c": "Solo presiona {color:6}△ {color:1}\ny la máquina te dirá\nqué hacer."
"text.1d02": "¿Quieres usar la\n{color:4}máquina para guardar\ndatos de batalla{color:1}?"
"text.1d84": "Sí\nNo"
"text.1dce": "No veo a Punimon, pero\ncreo que descansaré aquí."
"text.1e3a": "{color:7}Punimon {color:1}\n¡Soy Punimon! ¿Por qué no\ndescansas aquí un rato?"
"text.1eb0": "{color:7}Punimon {color:1}\nUna hora de descanso recupera\nHP, MP y baja el cansancio."
"text.1f34": "Descansar\nNo descansar"
