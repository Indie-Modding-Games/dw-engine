text.0020: "Como mi herida ya sanó,\nquiero trabajar. Gracias\npor cuidarme."
text.00b6: "Puedo predecir el futuro\nde cualquier criatura,\ny eso es lo que haré."
text.013e: "Si te interesa, ven a\nvisitar mi tienda.\nNo te cobraré."
text.01d6: "¿Te interesa conocer\ntu fortuna?\nBien, déjame verla."
text.0268: "Mmm, oh... ¡oh, vaya!"
text.029a: "Bueno, antes que nada..."
text.0320: "En general, tienes\nmuy buena suerte."
text.039e: "En general, se ve\nbastante bien."
text.0424: "Tu suerte general es regular."
text.04a4: "Tu suerte general\nno es muy buena."
text.0532: "En general, no es buena."
text.059c: "Hagas lo que hagas,\nte irá bien."
text.05ea: "Te llegará una\noportunidad maravillosa."
text.0650: "Quizá vivas algo\nmemorable."
text.069e: "Quizá encuentres\nalgo inesperado."
text.06f0: "Tu pregunta tendrá\nrespuesta."
text.073a: "Tu cartera engordará."
text.077e: "Quizá recibas buenas\nnoticias de tus amigos."
text.07de: "Cambiar de ánimo\nte puede hacer bien."
text.0838: "Prueba ir a un lugar\nal que no sueles ir."
text.0896: "Quizá tengas un\nsueño interesante."
text.08ea: "Procura no gastar\ndemasiado dinero."
text.0936: "Tu secreto podría revelarse."
text.097a: "Mejor acuéstate temprano."
text.09ba: "Cuida bien tus cosas."
text.09f2: "Un amigo podría desquitar\nsu frustración contigo."
text.0a5c: "Podrían caerte muchas\ndesgracias encima..."
text.0ab8: "Quizá te encuentres con\nalguien que no te agrada."
text.0b1c: "Podrías sufrir\nuna gran pérdida..."
text.0b76: "Tu color de la suerte\nes el rojo."
text.0bbe: "Tu color de la suerte\nes el blanco."
text.0c0a: "Tu color de la suerte\nes el azul."
text.0c54: "Tu color de la suerte\nes el negro."
text.0ca0: "Tu color de la suerte\nes el verde."
text.0cec: "Tu color de la suerte\nes el gris."
text.0d36: "Tu color de la suerte\nes el café."
text.0d82: "Tu color de la suerte\nes el amarillo."
text.0dd0: "Tu color de la suerte\nes el morado."
text.0e1e: "Tu color de la suerte\nes el dorado."
text.0e5c: "Por último, sobre tu\ncompatibilidad con\n{color:10}{partner}{color:1}..."
text.0ece: "Son la pareja perfecta."
text.0f10: "Es bastante buena."
text.0f4a: "Está bien."
text.0f72: "Es regular."
text.0fa0: "No está mal..."
