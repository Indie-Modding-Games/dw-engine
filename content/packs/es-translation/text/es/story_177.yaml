"text.002a": "Sé mucho de objetos."
"text.0056": "En total hay ciento veintiocho\nclases de objetos."
"text.00d0": "Treinta y dos son comida."
"text.00fe": "Los objetos raros crecen\nsolos en algunas zonas y\nen otras no se encuentran."
"text.018e": "Por ejemplo, puedes\nencontrar una Manzana azul\nen el Bosque Nativo."
"text.0204": "Estas comidas tienen efectos\nespeciales, así que cuida\ncuándo las comes."
"text.02b8": "Ahora te hablaré de los\nobjetos de digievolución."
"text.030c": "Los objetos de digievolución\nhacen digievolucionar al\nDigimon, como dice su nombre."
"text.0392": "Hay muchas clases de\nobjetos de digievolución."
"text.0402": "Cada clase hace que el\nDigimon digievolucione en\nun tipo de Digimon distinto."
"text.0494": "Por ejemplo, si usas\nGarras grises, el Digimon\nse vuelve Greymon."
"text.0528": "Los objetos de digievolución\nson objetos de leyenda y\nalgunos son únicos."
"text.05b2": "Pero a veces no recibes\nla habilidad extra de una\ndigievolución normal."
"text.0654": "Además, baja la felicidad,\nasí que no son perfectos."
"text.06ca": "Al mismo tiempo, es bueno\ndigievolucionar en el Digimon\nque quieres ser."
"text.0772": "Solo puedes digievolucionar\ndesde la etapa anterior al\nDigimon que quieres ser."
"text.081a": "Así que ten cuidado."
"text.087c": "¡Oye! ¡Hola, amigos!"
"text.08a4": "¿Qué clase de tienda es esta?\n¿Es mi tienda?\nCompra algo, por favor."
"text.0942": "¡Mira, {color:6}{tamer}{color:1}! Mi tienda\nvende cosas interesantes.\nOjalá vengas mucho."
"text.09f6": "Lo que ves aquí\nno es nada común,\n¡así que adelante, compra!"
"text.0a9c": "¡Hola, forastero! Sabía que\nvendrías, {color:6}{tamer}{color:1}.\nNo pongas esa cara."
"text.0b1c": "¿Sabrás usar bien\nmis objetos? Depende de\ntu talento como domador."
"text.0be2": "¿Dónde estoy?\nAmo los lugares oscuros ¡y\nesta tienda lo demuestra!"
"text.0c88": "Bien, {color:6}{tamer}{color:1}, gracias\npor venir. Ya que estás aquí,\n¿por qué no compras algo?"
"text.0d48": "Hola, {color:6}{tamer}{color:1}. ¡Llegaste!\nVamos, llévate algunos de\nmis objetos tan útiles."
"text.0dec": "¡Hola, forastero!\nSabía que vendrías, {color:6}{tamer}{color:1}.\nNo pongas esa cara."
"text.0e6c": "¿Sabrás usar bien\nmis objetos? Depende de\ntu talento como domador."
