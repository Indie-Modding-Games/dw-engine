"text.0060": "Esta es una tienda de cartas."
"text.00a0": "¿Qué es una carta Digimon?"
"text.00d4": "Todos las coleccionan.\nCon ellas no puedes perder."
"text.0146": "¿Ah, sí?"
"text.0158": "Para empezar, te regalo una.\nEs de las buenas."
"text.01ca": "¡Oye! ¡Esta carta es sobre MÍ!"
"text.0206": "¡Conseguiste una carta de {color:6}{tamer}{color:1}!"
"text.0236": "Esta es una tienda de cartas."
"text.027e": "Hoy tenemos cartas\nmuy buenas."
"text.02da": "Quiero comprar una carta\nQuiero vender una carta\nSalir"
"text.0348": "Comprar un sobre de tres\nComprar una\nSalir"
"text.03a0": "Comprar una\nSalir"
"text.03cc": "Quinientos bits por sobre.\nNunca se sabe qué trae."
"text.0442": "Lo compro\nNo, gracias"
"text.0488": "Abre el sobre ya mismo."
"text.04e8": "¿Quieres algo más?"
"text.0526": "Vuelve pronto."
"text.0552": "Esta es una tienda de reciclaje."
"text.0594": "Quiero un objeto normal\nQuiero un objeto reciclado\nLa próxima vez"
"text.0676": "¡¿Oye?!"
"text.0690": "¡Es una tienda!"
