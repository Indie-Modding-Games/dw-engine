"text.014c": "Oigo una voz detrás\nde nosotros. ¡Esa voz es...!"
"text.01f6": "¡Espera!"
"text.0208": "¡¿Por qué debería esperar?!"
"text.023e": "¡Ja, ja, ja!"
"text.02bc": "¡Vaya, qué sorpresa!"
"text.02ee": "¡Whamon, bien! ¡Guau!"
"text.033e": "¡Ríndete!"
"text.0364": "¡Aggh!"
"text.0378": "Ven a trabajar a la ciudad\npara pagar por tus faltas."
"text.03ec": "Bien, entendido.\nIré a la ciudad."
"text.0452": "¡Ja, ja, ja, es broma! Adiós."
"text.08fa": "¡Rayos, me engañó!"
"text.092a": "Bueno, recuperamos la cueva.\nSupongo que está bien."
"text.099a": "Creo que la cueva ya está bien."
"text.09da": "Pareces una persona muy\nbuena. Seguro algún día\nentenderán su error."
"text.0a8a": "Te daré mi tesoro.\nEstá al fondo."
"text.0aea": "Espera, espera.\nEse es tu tesoro, ¿no?\nNo puedo aceptarlo."
"text.0b68": "No, no lo necesito. Quiero\nir a tu ciudad."
"text.0bce": "¿Entonces para qué\nrecuperamos esta cueva?\n¿Para nada...?"
"text.0c56": "Lo siento, pero ahora\nde verdad quiero ayudarte."
"text.0cb8": "Ya veo. Gracias.\nEres muy amable."
"text.0d04": "Iré directo a la ciudad.\nTe llevo si\nquieres."
"text.0d92": "¡Whamon se une a la ciudad!"
"text.0dd4": "¿Vuelves a la ciudad?"
"text.0e0a": "Vuelvo\nNo vuelvo"
