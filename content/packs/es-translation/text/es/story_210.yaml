text.00bc: "Te estaba esperando,\n{color:6}{tamer}{color:1}.\nPor fin llegó este día"
text.0130: "¿Qué pasó?"
text.0154: "Apareció la entrada\nal Monte Infinito."
text.01a8: "¿Qué? ¿En serio? ¿Dónde?"
text.01d8: "Está tras las cascadas\nde la ciudad."
text.0224: "¡Vaya, está muy cerca!"
text.0254: "Según yo, el último\nenemigo está en el\nMonte Infinito."
text.02c4: "Entonces es la última\nmazmorra. ¡Lo haré!"
text.0316: "¡Suerte! Pero no te\napresures. No te muevas\nhasta estar bien preparado."
text.03ce: "Del otro lado de la\ncascada, en la ciudad, está\nla entrada al Monte Infinito."
text.0478: "Según yo, el último\nenemigo está en el\nMonte Infinito."
text.04e6: "¡Ve bien preparado!"
text.051c: "En todo caso..."
text.0546: "El índice de prosperidad\nde la ciudad es {num:pstat=1}."
text.05b4: "Está lejos de\nlo que era antes."
text.060e: "Por fin está tomando forma."
text.0658: "Se está desarrollando bien."
text.0698: "Se está volviendo una\nbuena ciudad."
text.06e2: "Hiciste un buen trabajo.\n¡Espléndido!"
text.073a: "No necesito decir\nnada más. ¡Es fantástica!"
text.07be: "{color:7}¡El nivel de domador\nsubió! {color:1}"
text.0808: "{color:7}¡Felicidades!\n¡Toma una medalla\npor tu gran trabajo! {color:1}"
