"text.0034": "¡Bienvenido! Mi nuevo negocio\nes el «Guardaobjetos».\nGuardo objetos de la gente."
"text.00c0": "Como servicio especial,\nguardo tus objetos gratis."
"text.0144": "Sobre la digievolución...\nSobre la etapa que sigue\nal Digimon Campeón..."
"text.01e4": "Es el Digimon Ultra.\nNo siempre digievoluciona\ndespués de Campeón."
"text.0286": "Para digievolucionar,\nhay que cumplir ciertas\ncondiciones con exactitud."
"text.030e": "Pero cuando digievoluciona\na Ultra, su esperanza\nde vida aumenta."
"text.03a8": "Pero si digievoluciona al comer\nun objeto de digievolución,\nsu vida no cambia."
"text.0464": "Más sobre la digievolución.\nSobre las condiciones."
"text.04c6": "Para empezar, dicen que\nel peso debe acercarse\nal peso objetivo."
"text.0560": "Y cuanto más altos los\nparámetros, mejor."
"text.05b8": "Pero según qué parámetro\nsea más alto, el\nresultado cambia."
"text.0644": "Sobre los errores de cuidado,\na veces conviene\nfallar a propósito."
"text.06d8": "Según el Digimon al que\nvaya a digievolucionar, hay\ncondiciones que cumplir."
"text.0768": "Hay situaciones que pueden\nprovocar la digievolución."
"text.07da": "Como el número de batallas o\nqué tan disciplinado está."
"text.0850": "Si se cumplen esas condiciones,\naunque no se cumplan otras,\npuede digievolucionar."
"text.08fc": "Jiji me dijo que\n{color:10}{partner}{color:1} digievolucionará."
"text.0956": "De Digimon Bebé a\nDigimon de Entrenamiento,\nsolo tarda seis horas."
"text.09e2": "De ahí a Digimon\nNovato, tarda como\nun día en digievolucionar."
"text.0a68": "Luego, a Digimon Campeón,\ntarda como tres días\nen digievolucionar."
"text.0b02": "¿Y cuál era la siguiente\netapa? Lo olvidé,\npero hay más."
"text.0b82": "La digievolución depende\ndel peso, los parámetros\ny los errores de cuidado."
"text.0c0a": "No lo entiendo\nmuy bien. Le preguntaré\na Jiji cuando pueda."
