text.0034: "Ñam, ñam."
text.004e: "Eh..."
text.0064: "Escúchame, por favor."
text.008e: "Qué rico, qué rico."
text.00b0: "Mis hombres ya no\nme hacen caso."
text.00f0: "Creo que no pueden\nrecordar mis órdenes."
text.014a: "A veces ni siquiera\nlas entienden."
text.019a: "Mis hombres deberían\ntraerme la comida, pero..."
text.01ea: "Qué rico..."
text.0202: "Mientras trabajaba, no\nme trajeron la comida,\nasí que olvidé comer."
text.0294: "Estás demasiado metido\nen tu trabajo."
text.02e2: "Qué vergüenza."
text.0310: "Creo que hay problemas\nen la mansión."
text.0366: "¿Problemas en la isla?\n¿Todos actúan como\nmis hombres?"
text.03da: "Sí, todos están\nperdiendo la memoria."
text.042c: "¿Crees que alguien\nestá haciendo esto?"
text.0478: "Mmm"
text.0488: "¿Qué puedo hacer?"
text.04ac: "Construimos una ciudad para\nunir los corazones\nde los Digimon."
text.0512: "Viajamos para\nencontrar amigos."
text.055a: "¿Qué puedo hacer yo?\nMis hombres solo\nsaben pelear."
text.05cc: "No puedo dejarlos aquí."
text.0604: "Ya veo..."
text.061c: "Déjame pensarlo.\nLo siento mucho, pero..."
text.067e: "Volveré otra vez.\nNo olvides comer."
text.06de: "¿Quieres entrar a un combate?"
text.0712: "¿Un combate? Perfecto,\nanimará a mis hombres."
text.0776: "Entonces, ¿quieres unirte?"
text.07a8: "Sí, pero aún tengo que\ninvestigar aquí.\nIré pronto."
