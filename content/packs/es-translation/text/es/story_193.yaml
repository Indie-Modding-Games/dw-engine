text.0050: "¡Llegó! ¡Funcionó!"
text.0094: "Un humano.\nTal como dijiste, Jiji."
text.00e8: "Mmmm."
text.0102: "Shhh, se está levantando."
text.0140: "¿Eh? ¿Dónde estoy?"
text.0170: "¡Bienvenido al Mundo Digimon!"
text.01ae: "¿Qué?"
text.01d0: "¡Ay!"
text.01ec: "¿Qué te pasa?"
text.0220: "¿Quiénes son ustedes?"
text.0266: "Somos Digimon."
text.0296: "¿Digi... qué?"
text.02c0: "¿Eh? Creí que sabías\nde los Digimon."
text.0320: "Ya entendí, esto es un sueño."
text.0364: "No es un sueño."
text.039a: "Oye, espera, eres Tokomon.\nQué sueño tan realista."
text.0412: "{color:6}{tamer}{color:1}, esto no\nes un sueño, pero tampoco\nes real."
text.048a: "¿De qué hablas?\n¿Quién eres?"
text.04ea: "Soy Jijimon."
text.0514: "No conozco a ningún\nDigimon con ese nombre."
text.0576: "Hay más Digimon de\nlos que conoces.\nEste es el Mundo Digimon."
text.0600: "¡¿El Mundo Digimon?!"
text.0636: "Este mundo no es un\nsueño ni es real.\nEs nuestro mundo."
text.06b8: "Vaya... Se ve demasiado\nreal para ser un sueño."
text.071e: "Mira detrás de ti y\nverás a qué me refiero."
text.077a: "¿Qué?"
text.07b6: "¿Este es {color:10}{partner}{color:1}?"
text.07e2: "¡Ya me acuerdo! Me absorbió\nese llavero Digimon."
text.0864: "Así es."
text.0892: "¿Por qué estoy aquí?"
text.08be: "Ven a mi casa,\nte lo explicaré."
text.0a62: "Te invité aquí\npara que nos salves."
text.0aaa: "¿Que los salve de qué?"
text.0ae0: "Estamos en Ciudad File,\nel centro de Isla File."
text.0b58: "¿Una ciudad? ¿Aquí?"
text.0b86: "Bueno, era una ciudad.\nAquí vivían Digimon\nde todo tipo."
text.0c2e: "Los Digimon perdieron el\nánimo y se fueron de la ciudad."
text.0ca6: "¿A qué te refieres?"
text.0cdc: "No sé bien qué lo causó.\nLos Digimon empezaron a\nperder el habla."
text.0d84: "Algunos todavía hablan,\npero todos olvidaron que\nvivían aquí."
text.0e14: "A eso te referías\ncon perder el ánimo."
text.0e70: "Es peligroso si no\nhacemos nada."
text.0ebc: "Pero ¿por qué yo?"
text.0ee2: "Eres bueno criando\nDigimon, ¿verdad?"
text.0f3c: "¡Claro que soy bueno!"
text.0f7c: "¿No te das cuenta de que\nestás hablando digimon?"
text.0fe6: "¿Eh? Para nada. Hablo\nespañol de toda la vida."
text.104e: "Para nosotros suena a digimon."
text.10a2: "¡Así es!"
text.10d4: "En este mundo, tu amor\npor los Digimon te\ndará fuerza."
text.1158: "Gracias."
text.1176: "Por eso te elegí. ¡Puedes\nreunir a todos los\nDigimon de la isla!"
text.120a: "¿Qué?"
text.121c: "¿Mmm?"
text.122c: "¡Cuenta conmigo!"
text.126c: "¡Muy bien!"
text.1294: "Gracias, eres nuestra\núnica esperanza."
text.12da: "¿Por dónde empiezo?"
text.130c: "Lleva a {color:10}{partner}{color:1} y\nexplora la isla."
text.1360: "Encuentra la causa de este\npeligro y haz que los\nDigimon vuelvan."
text.13f6: "¡Vamos, {color:10}{partner}{color:1}!"
text.1444: "Espera, aún no termino."
