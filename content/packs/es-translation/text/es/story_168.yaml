"text.00e0": "Información de la Arena"
"text.0108": "Historial\nSobre los torneos de Clase\nSobre los torneos especiales"
"text.0188": "Campeonatos\nganados: {tourn_won}\n{tourn_wins}victorias {tourn_lost}derrotas"
"text.01ea": "Cualquiera puede entrar a un\ntorneo de Clase. Hay muchos."
"text.025a": "Pero un Digimon de etapa\nsuperior no debe entrar a\ntorneos de nivel inferior."
"text.02f2": "Si tu Digimon digievoluciona\nentre la inscripción y el\ntorneo, no puede competir."
"text.039c": "Los torneos especiales tienen\nreglas de participación\ny no se celebran seguido."
"text.0434": "Si no hay suficientes\nparticipantes en la ciudad,\nni siquiera se celebran."
"text.04cc": "Cada torneo solo se celebra\nuna o dos veces al año.\nRevisa el calendario antes."
"text.058c": "{color:10}{partner}{color:1}, déjame pensar\ntu apodo... un héroe\nque salvó el mundo."
"text.061c": "A ver."
