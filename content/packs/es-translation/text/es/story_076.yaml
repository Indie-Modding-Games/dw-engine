text.0052: "¡Taaa!"
text.0072: "¡Bien, toma esto!"
text.00ae: "¡Shaaaa!"
text.00d2: "¡Buooon!"
text.011e: "¿Quién eres? ¡No dejaré que\nnadie arruine este lugar!"
text.0194: "Tranquilo. Solo estamos\nde paso para\nsalvar la isla."
text.0220: "No confío en ti, ¡lárgate!"
text.0260: "Espera un momento."
text.02cc: "¿Acaso tú eres...?"
text.030e: "¡Te lo dije!"
text.0336: "Perdón. No recibimos muchas\nvisitas, así que me emociono\ncon mi nuevo trabajo."
text.03d2: "¿Trabajo?"
text.03e2: "Vigilo un lugar llamado\nRegión Dino Antigua."
text.0448: "Es una región inexplorada."
text.0484: "¿Me la muestras?"
text.04bc: "La Región Dino Antigua está\ndividida en dos zonas."
text.0520: "Donde vivimos se llama\nZona de Tiempo Glacial."
text.057a: "Es un lugar especial donde\nel tiempo pasa lento."
text.05de: "¿El tiempo pasa lento?"
text.0608: "La otra zona es la\nZona de Tiempo Veloz."
text.0656: "Es peligrosa y está más lejos\nque la Zona de Tiempo Glacial."
text.06c8: "Es peligrosa porque el\ntiempo pasa muy rápido."
text.071c: "Es tierra yerma. Hay huesos\ny fósiles por todas partes."
text.0782: "¿Porque allí el tiempo pasa\nmás rápido que en otros lados?"
text.07fc: "Así es. No te quedes mucho."
text.083c: "Como yo bloqueo el\npaso, no puedes ir allí."
text.08a4: "Perdiste."
text.08c2: "¡Tuve mala suerte! No me\npasa seguido."
text.0918: "¿Ah, sí?"
text.093c: "Tengo que volver a casa.\nPregúntale a otros Digimon\nsi tienes dudas."
