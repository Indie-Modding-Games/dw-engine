text.0056: "Me vendría muy bien\nun poco de {color:6}Carne{color:1}."
text.0098: "Bienvenido, tenemos\n{color:6}Carne{color:1} buenísima. Bueno, eh..."
text.010e: "Subir precio\nDejar en cincuenta bits\nBajar precio"
text.0180: "Eh, querías\n{color:6}Carne{color:1}, ¿verdad? Eh..."
text.01f6: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na setenta y cinco bits?"
text.0264: "Subir a setenta y cinco\nLo pensaré mejor"
text.02ec: "¿Y la {color:6}Carne{color:1} de cincuenta\na setenta bits?"
text.0348: "Subir a setenta\nLo pensaré mejor"
text.03d0: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na sesenta y cinco bits?"
text.043a: "Subir a sesenta y cinco\nLo pensaré mejor"
text.04be: "¿Y la {color:6}Carne{color:1} de cincuenta\na sesenta bits?"
text.0516: "Subir a sesenta\nLo pensaré mejor"
text.059a: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na cincuenta y cinco bits?"
text.0604: "Subir a cincuenta y cinco\nLo pensaré mejor"
text.067c: "¿Y la {color:6}Carne{color:1} de cincuenta\na su precio normal?"
text.06d8: "Dejar a precio normal\nLo pensaré mejor"
text.075a: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na cuarenta y cinco bits?"
text.07c4: "Bajar a cuarenta y cinco\nLo pensaré mejor"
text.0848: "¿Y la {color:6}Carne{color:1} de cincuenta\na cuarenta bits?"
text.08a0: "Bajar a cuarenta\nLo pensaré mejor"
text.0924: "¿Qué tal la {color:6}Carne{color:1} de cincuenta\na treinta y cinco bits?"
text.0990: "Bajar a treinta y cinco\nLo pensaré mejor"
text.0ad8: "¡Trato hecho!"
text.0b1e: "Ganancia total: {shopvar}\nGanancia:\ncuarenta"
text.0b74: "Ganancia total: {shopvar}\nGanancia:\ntreinta y cinco"
text.0bd6: "Ganancia total: {shopvar}\nGanancia:\ntreinta"
text.0c2e: "Ganancia total: {shopvar}\nGanancia:\nveinticinco"
text.0c90: "Ganancia total: {shopvar}\nGanancia:\nveinte"
text.0ce8: "Ganancia total: {shopvar}\nGanancia:\nquince"
text.0d42: "Ganancia total: {shopvar}\nGanancia:\ndiez"
text.0d94: "Ganancia total: {shopvar}\nGanancia:\ncinco"
text.0dde: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.0ea0: "¡Olvídalo,\ncompraré en otra parte!"
text.0f1c: "No hay clientes, qué aburrido."
text.0f64: "¿Cobras demasiado?"
text.0f94: "¿Tú crees? Bueno, entonces..."
text.0fd4: "Vaya, me vendría muy bien\nun {color:6}Orinal portátil{color:1}."
text.102e: "¡Bienvenido, tenemos un buen\n{color:6}Orinal portátil{color:1}!"
text.1094: "Subir precio\nDejar en trescientos bits\nBajar precio"
text.1110: "Eh... ¿así que quieres un\n{color:6}Orinal portátil{color:1}?"
text.1180: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na cuatrocientos cincuenta bits?"
text.121c: "Subir a cuatrocientos cincuenta\nLo pensaré mejor"
text.12aa: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na cuatrocientos veinte bits?"
text.1350: "Subir a cuatrocientos veinte\nLo pensaré mejor"
text.13da: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos noventa bits?"
text.147a: "Subir a trescientos noventa\nLo pensaré mejor"
text.1506: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos sesenta bits?"
text.15ac: "Subir a trescientos sesenta\nLo pensaré mejor"
text.1636: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na trescientos treinta bits?"
text.16d6: "Subir a trescientos treinta\nLo pensaré mejor"
text.1756: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na su precio normal?"
text.17fc: "Dejar a precio normal\nLo pensaré mejor"
text.187e: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos setenta bits?"
text.191c: "Bajar a doscientos setenta\nLo pensaré mejor"
text.19aa: "¿Qué tal el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos cuarenta bits?"
text.1a4c: "Bajar a doscientos cuarenta\nLo pensaré mejor"
text.1ad8: "¿Y el {color:6}Orinal portátil{color:1}\nde trescientos bits\na doscientos diez bits?"
text.1b6e: "Bajar a doce\nLo pensaré mejor"
text.1cb8: "¡Bien, trato hecho!"
text.1d04: "Ganancia total: {shopvar}\nGanancia:\ndoscientos cuarenta"
text.1d72: "Ganancia total: {shopvar}\nGanancia:\ndoscientos diez"
text.1ddc: "Ganancia total: {shopvar}\nGanancia:\nciento ochenta"
text.1e4c: "Ganancia total: {shopvar}\nGanancia:\nciento cincuenta"
text.1eba: "Ganancia total: {shopvar}\nGanancia:\nciento veinte"
text.1f2a: "Ganancia total: {shopvar}\nGanancia:\nnoventa"
text.1f82: "Ganancia total: {shopvar}\nGanancia:\nsesenta"
text.1fd8: "Ganancia total: {shopvar}\nGanancia:\ntreinta"
text.2026: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.20bc: "Cobras demasiado caro."
text.20fa: "¿En serio? Bueno, entonces..."
text.212e: "Vaya, de verdad necesito\n{color:6}Medicina{color:1}."
text.217c: "Eh... Bienvenido, ¿quieres\n{color:6}Medicina{color:1}?"
text.21e2: "Subir precio\nDejar en mil bits\nBajar precio"
text.225c: "Eh, querías\n{color:6}Medicina{color:1}, ¿verdad?"
text.22ce: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil quinientos bits?"
text.235a: "Subir a mil quinientos\nLo pensaré mejor"
text.23e4: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na mil cuatrocientos bits?"
text.246a: "Subir a mil cuatrocientos\nLo pensaré mejor"
text.24f6: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil trescientos bits?"
text.2584: "Subir a mil trescientos\nLo pensaré mejor"
text.2610: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na mil doscientos bits?"
text.2692: "Subir a mil doscientos\nLo pensaré mejor"
text.271a: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na mil cien bits?"
text.27a4: "Subir a mil cien\nLo pensaré mejor"
text.2820: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na su precio normal?"
text.2894: "Dejar a precio normal\nLo pensaré mejor"
text.2916: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na novecientos bits?"
text.299c: "Bajar a novecientos\nLo pensaré mejor"
text.2a26: "¿Y la {color:6}Medicina{color:1}\nde mil bits\na ochocientos bits?"
text.2aa6: "Bajar a ochocientos\nLo pensaré mejor"
text.2b32: "¿Qué tal la {color:6}Medicina{color:1}\nde mil bits\na setecientos bits?"
text.2bba: "Bajar a setecientos\nLo pensaré mejor"
text.2d08: "¡Amigo, envuélvemela!"
text.2d60: "Ganancia total: {shopvar}\nGanancia:\nochocientos"
text.2dc6: "Ganancia total: {shopvar}\nGanancia:\nsetecientos"
text.2e2c: "Ganancia total: {shopvar}\nGanancia:\nseiscientos"
text.2e8e: "Ganancia total: {shopvar}\nGanancia:\nquinientos"
text.2ef2: "Ganancia total: {shopvar}\nGanancia:\ncuatrocientos"
text.2f56: "Ganancia total: {shopvar}\nGanancia:\ntrescientos"
text.2fbc: "Ganancia total: {shopvar}\nGanancia:\ndoscientos"
text.301e: "Ganancia total: {shopvar}\nGanancia:\ncien"
text.3076: "Ganancia total: {shopvar}\nGanancia:\ncero"
text.310c: "¡Eso es carísimo!"
text.313c: "¿En serio? Bueno, entonces..."
