text.0060: "¡Daa!"
text.007e: "¡Haa!"
text.009c: "¡Gghhee!"
text.00c6: "Este: Elevador\nOeste: Peligro, acantilado"
text.0120: "Modo Ogro : ACTIVO\nModo Ogro : INACTIVO"
text.0196: "¿Qué?"
text.01fa: "Sentí que el suelo se movió.\n¿Fue mi imaginación?"
text.02c8: "¿Qué? ¡No puede ser!"
text.0344: "{color:6}{tamer}{color:1}¡¡Guau!!"
text.0370: "¡Cuidado con los derrumbes!"
text.03d6: "Oí que en este camino\natacan los bandidos."
text.0438: "Vamos, {color:10}{partner}{color:1}."
text.0480: "¡Yujuu!"
text.049c: "¡Ja, ja!"
text.04b0: "¡Yajuu!"
text.050e: "¡Ríndete y deja tus cosas!\n¡O si no...!"
text.0562: "¡No, ríndete tú!"
text.058a: "¡¿Qué?! ¿Tú...?"
text.05ae: "No puede ser."
text.05ce: "Jefe, ¿qué hacemos?"
text.0602: "Tranquilos, somos más fuertes\ny somos más.\n¡Vayan por ellos!"
text.06d2: "¡Algún día me\nlas pagarás!"
text.0724: "¡Mira cómo corren! Tardarán\nen volver."
