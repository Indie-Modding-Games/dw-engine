text.004e: "¡Ah!"
text.006a: "¡Ah!"
text.0096: "¿El elevador está haciendo\nque el suelo suba?"
text.0102: "Subir\nNo subir"
text.0190: "¡Oye!"
text.01b0: "¿Qué?"
text.01c0: "¿Viniste aquí a perder?"
text.0208: "¡Eso lo digo yo!"
text.0232: "Esta vez no me contendré.\n¡Te haré llorar!"
text.02d6: "¡Guau!"
text.02e6: "¡Oh, no!"
text.0312: "¡Rayos!"
text.03b6: "¿Qué pasa?"
text.0460: "¡Adiós, tontos!"
text.0496: "¡Rayos, se escapó!"
text.04de: "Hay un elevador de escape.\nPerseguirlo no servirá."
text.05a8: "¿Quién eres?"
text.05c8: "¿Quién soy yo? ¿Quién eres tú?"
text.0672: "¡Conseguí un {color:4}Llavero\nDimensional{color:1}!\n¡Puedo llevar veinte objetos!"
text.0722: "¡Conseguí un {color:4}Llavero\nDimensional{color:1}!\n¡Puedo llevar treinta objetos!"
