"text.0072": "¡Llegaste, {color:6}{tamer}{color:1}!"
"text.009a": "Somos cazadores de tesoros.\nHallamos tesoros bajo tierra\ncavando con maestría."
"text.013e": "Confía en mí para los tesoros."
"text.0196": "¿Quieres que busque\nalgo? ¿Quieres que te\nexplique cómo lo hacemos?"
"text.0230": "Explicar\nNo explicar\nNada, olvídalo"
"text.0286": "Tenemos dos planes con\ndistintos días y precios."
"text.02ee": "Normal: 3 días, mil bits\nEspecial: 10 días, 5 mil bits"
"text.036a": "Con el plan especial hay\nmás posibilidades de\nhallar mejores tesoros."
"text.03f6": "Eso es todo.\n¿Qué quieres hacer?"
"text.044e": "Buscar tesoro\nExplicar otra vez\nNada, olvídalo"
"text.04b0": "¡Elige un plan!"
"text.04d4": "Normal: 3 días, mil bits\nEspecial: 10 días, 5 mil bits\nCancelar"
"text.056e": "Bien, entonces adiós."
"text.05c4": "Tendrás los resultados en\ntres días. Deséame suerte."
"text.066a": "Tendrás los resultados en\ndiez días. Deséame suerte."
"text.06ea": "No tienes suficientes bits.\nNecesito dinero para\nbuscar tesoros."
"text.07a4": "Ahora mismo busco el tesoro.\nTen paciencia, por favor."
"text.082a": "¿Sabes qué?\nEncontramos un tesoro."
"text.0b00": "¡Vacía tus cosas!"
"text.0b32": "¡Conseguí {color:6}{item:pstat=110}{color:1}!"
"text.0dae": "¡Gracias por venir!"
"text.0de8": "¡Gracias por tu preferencia,\n{color:6}{tamer}{color:1}!"
"text.0e2a": "Empecé hace poco a ayudar a\nDrimogemon. Soy muy bueno\nbuscando cosas."
