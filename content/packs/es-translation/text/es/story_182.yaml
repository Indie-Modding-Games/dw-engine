text.0056: "Por fin llegamos."
text.008c: "¿Eres tú el jefe?"
text.00ba: "Lo siento, no lo soy.\n¡Soy MetalGreymon!"
text.0114: "¡Me encargo de ti después!\n¡Apártate!"
text.015e: "No me apartaré por ti.\nNo pasarás."
text.01c4: "Quiero ahorrar energía.\nPelear con él no me sirve."
text.0230: "¡Allá voy!"
text.0294: "¿Eh? ¿Dónde estoy?"
text.02bc: "¡Recobraste el juicio!"
text.02f6: "Eso parece..."
text.0316: "Si les ganas, quizá\nnos volvamos a ver.\nHasta entonces, me voy."
