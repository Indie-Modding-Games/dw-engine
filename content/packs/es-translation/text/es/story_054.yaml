text.0056: "Myotismon se ha ido."
text.009a: "¡Oh!"
text.00b8: "Encontré una llave. Quizá\nabra alguna de esas puertas."
text.0128: "¡Usé la\n{color:6}Llave mansión{color:1}!"
text.016e: "Debo deshacerme de algo."
text.01e2: "¡Usé la\n{color:6}Llave mansión{color:1}!"
text.0246: "No abre.\nEstá cerrada con llave."
text.02d8: "¡Usé la\n{color:6}Llave mansión{color:1}!"
text.033c: "No abre.\nEstá cerrada con llave."
text.03b0: "Ñam, ñam...."
text.03d0: "Bueno."
text.03e6: "Escúchame."
text.0408: "Qué rico, qué rico...."
text.0430: "Mis hombres ya no obedecen."
text.0470: "Creo que ya no recuerdan\nmis órdenes."
text.04ca: "Ya no entienden.\nDeberían traerme\nla comida, pero...."
text.0560: "Ñam, ñam...."
text.0580: "Mientras trabajaba, no me\ntrajeron la comida,\nasí que olvidé comer."
text.0614: "Estás demasiado metido en\ntu trabajo."
text.0662: "Qué vergüenza."
text.0690: "Creo que hay problemas\nen la mansión."
text.06e6: "¿Hay problemas en la isla?\n¿Todos son como mis hombres?"
text.0754: "Sí, todos están\nperdiendo la memoria."
text.07a6: "¿Crees que alguien está\nplaneando esto?"
text.07fa: "¿Mmm?"
text.080a: "¿Qué puedo hacer?"
text.082e: "Construimos una ciudad para\nunir los corazones Digimon."
text.089e: "Buscamos amigos."
text.08da: "¿Qué puedo hacer? Mis hombres\nsolo saben pelear."
text.0940: "No puedo dejarlos aquí."
text.0978: "Ya veo."
text.098c: "Déjame pensarlo.\nLo siento mucho."
text.09e0: "Volveré otra vez.\nNo olvides comer."
text.0b9c: "Gracias por tu ayuda.\nTe mostraré mi investigación."
text.0c02: "A veces, si MetalGreymon\nse desvanece, digievoluciona\na SkullGreymon.{cell:0000}"
text.0cac: "Bakemon, Devimon y\nPhoenixmon también\ndigievolucionan así."
text.0d22: "No sé quiénes eran al\nnacer. Las tablas de\ndigievolución no lo dicen."
text.0dc6: "Los combates han\nayudado a mis hombres."
text.0e0a: "Un combate es un buen\ndescanso de mi investigación."
text.0e64: "¿Qué investigas?"
text.0eae: "¡Se construyó una Arena\nen la ciudad!"
text.0efc: "Me pregunto si mis hombres\npodrían ayudar."
text.0f40: "Sí, ahí pueden pelear con\ntoda la fuerza que quieran."
text.0fa4: "Mis hombres están peor.\nEs hora de dejar\nla mansión."
