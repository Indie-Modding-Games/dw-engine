text.0022: "¡Agh!"
text.0032: "..."
text.0040: "¡¿Hablas en serio?!"
text.0072: "Desapareció, ¿fue un truco?"
text.00f0: "De algún modo lo logré."
text.0124: "¿Eh?"
text.013a: "¿Qué es esto?"
text.0162: "De repente me desmayé\ny... ¡Ah, perdón por eso!"
text.0228: "¿Eh? ¿Qué fue eso?\n¿La maldición de Analogman?"
