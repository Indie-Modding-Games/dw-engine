text.0024: "Hola, {color:6}{tamer}{color:1}.\n¡Sorpresa! ¡Abrí\nuna clínica!"
text.007a: "Es para tratar enfermedades\ny heridas. No es gratis,\npero será barato."
text.0130: "Tu Digimon no se ve\nbien. Tienes que\ncuidar su salud."
text.01be: "Lo trataré ahora y te\nharé un descuento.\nTrescientos bits."
text.025e: "¿No tienes bits suficientes?\nPágame lo que puedas."
text.0304: "Ya está todo bien.\nTen más cuidado en adelante."
text.038a: "Tu Digimon se ve bien.\n¿Qué necesitas?"
text.03e6: "Quítale el cansancio\nVéndeme medicina\nNada"
text.046c: "El cansancio de {color:10}{partner}{color:1}\nes muy alto, necesita\ndescansar ya."
text.04ec: "{color:10}{partner}{color:1} está cansado.\nDebería descansar ya."
text.0548: "{color:10}{partner}{color:1} parece un\npoco cansado. No debería\nexigirse."
text.05c2: "{color:10}{partner}{color:1} está bien.\nVigila su cansancio."
text.0634: "¿Se siente más relajado?"
text.066e: "¿Necesitas algo más?"
text.06a0: "Descansaremos más\nVéndeme medicina\nNada"
text.0706: "Debería estar bien."
text.0732: "Venda: cuatrocientos bits\nMedicina: mil doscientos bits\nNo comprar"
text.07c0: "Cuando no se sienta bien,\nven a verme."
text.0826: "Si sigue cansado, entrénalo\nmenos y haz que coma y\nduerma con regularidad."
text.08c8: "Quedarse mucho tiempo en\nlugares fríos o calientes\npuede enfermarlo."
text.0958: "Una venda solo sirve\npara las heridas."
text.09b2: "La medicina cura las\nenfermedades, pero no\nquita el cansancio."
text.0a50: "Si los HP están bajos al\nfinal de una batalla, el\nDigimon se lastima fácil."
text.0ae8: "Mantener bien la felicidad\ny el cansancio da\nuna vida larga."
text.0b8c: "No tienes bits suficientes.\nNo puedo vendértelo."
text.0c0e: "Llevas demasiados objetos."
text.0c62: "No tienes bits suficientes.\nNo puedo vendértelo."
text.0ce4: "Llevas demasiados objetos."
text.0d28: "¿Necesitas algo más?"
text.0d5a: "Quítale el cansancio\nVéndeme más medicina\nNo, nada"
