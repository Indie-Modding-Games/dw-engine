text.0122: "¡Voy a ganar!"
text.0150: "¡No vengas aquí! ¡Vete!"
text.0194: "¡Ahora sí estoy enojado!"
text.01d0: "¡Si me pegas, te pego!"
text.0214: "¡Inténtalo, si puedes!"
text.02f4: "Ah, eres tú, {color:6}{tamer}{color:1}.\nEl puente está arreglado."
text.0348: "Oí que estás haciendo\nuna ciudad."
text.0386: "Tengo una petición.\nQuiero que me ayudes\ncomo yo te ayudé."
text.040a: "¿?"
text.0414: "Hacer una ciudad es\nsalvar esta isla.\nTodos se salvarán."
text.04a2: "¿Eso significa que\nvendrás a la ciudad?"
text.04fc: "Sí. Iré a tu ciudad."
text.0596: "¡Coelamon se une a la ciudad!"
text.06b0: "Oye, ¿eres humano?"
text.06dc: "Soy Coelamon,\nel Digimon pez.\n¿Viniste a verme?"
text.0758: "Sí, te buscamos mucho\nAhora que lo dices"
text.07d0: "¡Ja, ja! ¿Conque sí?"
text.080c: "Ya sé lo que\nquieres."
text.084e: "El puente río arriba está\nroto y quieres cruzar.\n¿Verdad?"
text.08f2: "Ya veo.\nBien, te ayudaré."
text.093c: "¡Ajá! Volviste."
text.0a0a: "Ahora camina sobre\nnuestras cabezas. Tranquilo."
text.0a7a: "¡Bien, allá vamos!"
text.0b94: "Este mundo necesita más\ntrabajo en equipo. Nos vemos."
