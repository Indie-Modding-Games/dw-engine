text.0042: "Myotismon no está aquí."
text.00b2: "Eh... ¿la llave de mi\nrefri de carne?"
text.00f4: " ! "
text.0102: "¿Alguien vino a ayudarme?"
text.013a: "¿Un Digimon? ¿Estás bien?"
text.016a: "¿Quién eres? ¡Dame comida!"
text.01a6: "¿Tienes hambre? ¿Qué quieres?"
text.01e0: "Carne."
text.020c: "¡Tengo carne!"
text.022a: "Carne."
text.023c: "¿Qué?"
text.0252: "¿Carne? No, no tengo nada."
text.028e: "Toma."
text.02a4: "¿Una llave?"
text.02c4: "Tengo que deshacerme de algo."
text.0312: "¡Conseguí la {color:6}Llave refri{color:1}!"
text.0342: "Bueno..."
text.0358: "¡No me queda mucho tiempo!"
text.038c: "Pronto te traeré algo.\nAguanta un poco más."
text.03fc: "¡Uf!"
text.041e: "Me salvaste. Muchas gracias.\nPerdón por las molestias."
text.0488: "¿Qué pasó?"
text.04ac: "Soy Myotismon, el señor de\nesta mansión."
text.0500: "Soy {color:6}{tamer}{color:1}, un humano de\notro mundo. Y este es\nmi compañero, {color:10}{partner}{color:1}."
text.0580: "Vinimos a\nsalvar la isla."
text.05c4: "Parece que tenemos mucho\nde qué hablar. Bienvenidos."
text.0678: "¡Guau!"
text.0688: "..."
text.0696: "¿Lo dices en serio?"
text.06c6: "Desapareció. ¿Es un sueño?"
text.0746: "Creo que ya lo resolvimos."
text.078e: "¿Qué?"
text.07a6: "¿Eh? ¿Qué?"
text.07ca: "Me desmayé. Lo siento."
text.084e: "¡La maldición de Analogman!\nNo te preocupes, estará bien."
