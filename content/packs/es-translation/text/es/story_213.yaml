text.0040: "Oh, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nvinieron. Miren esta gran\nArena de Ciudad File. ¿Genial?"
text.00d0: "Pronto la llenarán rivales y\nfans. Tú también harás\nfelices a los fans, ¿verdad?"
text.0188: "Habrá dinero y premios para\nlos ganadores del torneo.\nNo tienes nada que perder."
text.0230: "Para ver los detalles del\ntorneo, revisa esa máquina."
text.02d0: "Ah, por cierto, los Digimon\nEntrenamiento no participan.\n¿Reviso el calendario?"
text.038c: "Ah, por cierto, los Digimon\nEntrenamiento no participan.\n¿Reviso el calendario?"
text.043c: "Qué bueno que viniste.\n¿Quieres entrar al torneo?"
text.04b6: "Sí\nNo\n¿A qué te refieres?"
text.0520: "Así que participas en\nla competencia\nde mañana, ¿verdad?"
text.058a: "¿Vas a cancelar\ntu inscripción?"
text.05d8: "No, no cancelaré\nSí, quiero cancelar"
text.0652: "Así que participas en la\ncompetencia de hoy, ¿no?\nPuedes entrar desde las 10 am."
text.06e8: "No pensarás cancelar,\n¡¿verdad?!"
text.0740: "No, no cancelaré\nSí, quiero cancelar"
text.07aa: "Así que participas en la\ncompetencia de hoy, ¿no?\nEntra antes de las 11 pm."
text.0832: "No pensarás cancelar,\n¡¿verdad?!"
text.088a: "No, no cancelaré\nSí, quiero cancelar"
text.08f6: "Bueno, la cancelo por ti."
text.0934: "Ya adentro, a la hora de\ninicio, baja por la escalera\nizquierda para combatir."
text.09de: "La inscripción es gratis. Solo\npuedes inscribirte en las\ncompetencias de hoy y de mañana."
text.0a8c: "Pero para la competencia\nde ese mismo día, debes\ninscribirte antes de las 10 am."
text.0b1a: "Puedes ver el calendario\ncon cinco días de antelación.\nRevísalo y haz tus planes."
text.0bb8: "Las competencias en rojo son\nen las que no puedes entrar."
text.0c32: "Pero presiona Start\npara ver de qué se trata."
text.0ca0: "Incluso en las competencias\ncon Requisitos: ninguno,"
text.0d06: "los Digimon Entrenamiento\nno pueden participar."
text.0d52: "Bueno, eso es todo sobre\nla inscripción. ¿Quieres\nparticipar?"
text.0dd4: "Sí\nNo\nPerdón, explícalo otra vez"
text.0e3c: "¡Oye! ¡No te has\ninscrito, ¿sabes?!"
text.0eba: "¡Oye! ¡El torneo es\nmañana, ¿sabes?!"
text.0f42: "Aún es temprano para entrar.\nEspera hasta las diez."
text.0ff4: " \n{color:4}¡El nivel de domador bajó!{color:1}"
