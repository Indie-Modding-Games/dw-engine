text.00b8: "¿Quién eres? ¡Vete!"
text.00f2: "¿Aquí es donde vives?"
text.012c: "¡No te lo puedo decir!"
text.0156: "¿Eres un guardia o algo así?"
text.0198: "¿Quieres pelear? ¡Te ganaré!"
text.01da: "Supongo que pelearé\nNo puedes intimidarme"
text.025c: "¡Guau!"
text.02c4: "¡Oh, no! ¡Oye!"
text.02e2: "{color:7}???mon {color:1}\nJa, ja, ja."
text.0310: "¿Quién es?"
text.032c: "{color:7}???mon {color:1}\nNo he hecho nada malo.\n¡No entres a mi casa\nsin permiso!"
text.03d2: "Creo que mejor me voy."
text.0418: "¡Sigue vigilando bien!"
text.0452: "¡Eres de la banda de Ogremon!\n¡Esta es tu guarida!"
text.04ba: "¿De qué estás hablando?"
text.0500: "¡La otra vez tuviste suerte!\n¡Ríndete!"
text.0554: "¡Guau!"
text.05b4: "La otra vez me engañaste,\npero ahora te atraparé."
text.061a: "¿De qué estás hablando?"
text.0660: "¡Esta vez no escaparás!"
text.06ac: "Vamos, déjame entrar."
text.06da: "¿Quieres pelea?\n¡Te voy a noquear!"
text.0738: "Peleemos\nNo me molestes"
