"text.034c": "Bakke. Bah Kkea."
"text.0374": "Sigo sin entenderle."
"text.03dc": "Ya veo. ¡¿Patrullas\npor nosotros?!"
"text.0438": "¡Mira! Es mi tablero\nespecial de noticias."
"text.048a": "La ciudad necesita información,\n¡así que decidí hacer un\nperiódico! ¿Qué te parece?"
"text.053e": "Cuenta conmigo para\njuntar información."
"text.059e": "Estás leyendo mi periódico."
"text.05f0": "Ah, qué fresco, qué agradable."
"text.0630": "Cuando estás cómodo,\nse siente bien."
"text.069e": "¿Qué te parece mi tienda?"
"text.06de": "No soy bueno vendiendo, pero\nahora no hay nadie más\nque lo haga."
"text.0766": "Trae muchos Digimon, ¿sí?"
"text.07c0": "Bueno, ¿qué te parece?"
"text.07f8": "{color:7}Coelamon {color:1}\nDecidimos ayudarnos\ny vender todos estos objetos."
"text.0912": "Mmmm. Vi unas plantas\ndeliciosas y decidí comer."
"text.0986": "Creo que la ciudad se\nvolvió demasiado ventosa."
"text.09ee": "Ah, el otro día encontré\nun {color:6}Hongo feliz {color:1}\npor casualidad."
"text.0a6c": "Dicen que es de los raros."
"text.0aa4": "También oí de un\n{color:6}Hongo de lujo{color:1}.\nSería bueno encontrarlo."
"text.0b3e": "La {color:6}Manzana azul {color:1}\ndel Bosque Nativo\nsabe muy rica."
"text.0bb0": "La {color:6}Banana naranja {color:1}\nde la Selva Tropical\nsabe muy rica."
"text.0c2c": "La {color:6}Baya grande {color:1}\ndel Monte Panorama\nsabe muy rica."
"text.0c98": "La {color:6}Nuez dulce {color:1}\nde la Sabana Engranaje\nsabe muy rica."
"text.0d02": "La {color:6}Súper verdura {color:1}\ndel Cementerio Overdell\nsabe rica."
"text.0d70": "La {color:6}Baya roja {color:1}\nde la Tumba Dino Antigua\nsabe rica."
"text.0dda": "La {color:6}Tuna {color:1}\ndel Gran Cañón\nsabe rica."
"text.0e4e": "La {color:6}Digipiña {color:1}\nde los Árboles Brumosos\nsabe rica."
"text.0ff6": "Tengo algo que decir."
"text.102c": "¿Qué es?\n¡Nos vemos!"
"text.106c": "¿Viste que arreglamos el\nPuente del Este?\nTrabajamos muy duro."
"text.10f6": "Estamos arreglando el Puente\nDigimon. Espera un poco."
"text.1166": "Dicen que hay un Digimon raro\nen Punta Coela, en el sur."
"text.11e0": "Dicen que aparece cada\ndía al atardecer."
"text.125c": "Oye, ¿sabías que hay\nun puente roto en\nel este de la ciudad?"
"text.12f0": "No creímos que alguien\nlo fuera a usar, así que\nno hicimos nada."
"text.138e": "Pensamos arreglarlo\npor nuestra cuenta."
"text.13e8": "Mientras, revisa las zonas\noeste y sur.\nLuego vuelve a verme."
"text.1496": "¿Fuiste al Pantano Geko?\nUn Digimon travieso\npodría engañarte."
"text.151c": "Recuerda: cuando un Digimon\ndigievoluciona, sus técnicas\nfijadas cambian."
"text.15ae": "Bueno..."
"text.15d6": "¿Qué te parece? Encendí\nla luz. ¿Alumbra bastante?"
"text.164e": "¡Hagamos nuestra ciudad\nlimpia y alegre!"
"text.16a6": "¿La luz hace\nalguna diferencia?"
"text.16f0": "Bueno, todo depende\nde cómo lo veas."
"text.1746": "Soy el más poderoso."
"text.1780": "No me considero menos\nque tú. Si vienes a la\nArena, lo verás."
"text.1824": "Hola, {color:6}{tamer}{color:1}.\nPatrullo la ciudad buscando\ntipos sospechosos."
"text.18a2": "¿Qué pasa? No te estoy\nmolestando, ¡¿verdad?!"
"text.192a": "¡Bienvenido a mi tienda!\nTe daré un gran precio,\n{color:6}{tamer}{color:1}."
"text.1998": "No soy bueno vendiendo,\npero nadie más lo es."
"text.1a02": "Ahora me encargo de las ventas.\nOjalá hagamos negocios."
"text.1a74": "{color:6}{tamer}{color:1}, por favor, trae\ntodos los Digimon\nque puedas."
"text.1b10": "¿Qué te parece\nmi tienda?"
"text.1b50": "No soy bueno vendiendo,\npero nadie más lo es,\nasí que debo hacerlo."
"text.1bcc": "Trae pronto muchos\nDigimon."
"text.1c32": "Bueno, ¿qué te parece?"
"text.1c6a": "{color:7}Coelamon {color:1}\nDecidimos ayudarnos\ny vender estos objetos."
