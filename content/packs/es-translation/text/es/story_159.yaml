"text.0082": "¡Tú otra vez! ¡Fuera de aquí!"
"text.00c8": "Eh..."
"text.00e0": "Tú... ¡eres una plaga!\n¡¿Ya estás contento?!"
"text.0154": "¡Tú otra vez! ¡Fuera de aquí\nahora mismo!"
"text.01ba": "Qué gusto verlos, amigos.\nSi quieren vivir aquí,\nles doy permiso."
"text.0260": "Queremos vivir aquí\nQueremos volver"
"text.02c6": "Mmm, qué bien. ¿Qué?\nPero tú eres analógico,\nasí que no puedes vivir aquí."
"text.0356": "¡Tenemos que estar juntos!"
"text.038c": "¡Entonces vete de aquí\ncon él!"
"text.03de": "¿Qué? ¿Qué estás diciendo?"
"text.0422": "Él no era Sukamon.\nRey, ¡por favor, devuélvele\nsu forma original!"
"text.04c2": "¿No es genial que\nse volviera Sukamon?"
"text.0516": "No, ahora mismo no está\nnada bien. Por favor."
"text.0570": "La única forma de ser Sukamon\nes esforzarse."
"text.05cc": "Se volvió Sukamon\nde forma natural y\nese es el problema."
"text.0642": "¡Ustedes son increíbles!"
"text.06aa": "¡Guau! ¡Rey, gracias!"
"text.06e0": "¡Fuera de aquí ahora mismo!"
"text.072c": "¿Vinieron por\nalgo?"
"text.0774": "Bueno..."
"text.078a": "Si tienen una petición,\nolvídenla. ¡Porque soy\nel Rey de los Sukamon!"
"text.0810": "Creo que no podré\ninvitarlo a la ciudad."
"text.0890": "Yo también colecciono\ncartas Digimon."
"text.08e0": "Quiero mucho una carta del\nRey de los Sukamon. ¿La\ncambias por mi carta de Etemon?"
"text.0986": "Cambiar\nNo cambiar"
"text.09ba": "Lo siento, pero no la tengo."
"text.0a02": "¡Guau, qué peste! ¿Esto es\nun basurero?"
"text.0a4c": "No sabía que había uno\nen el mundo Digimon."
"text.0aca": "Qué bueno que vinieron.\nRecibimos a nuevos amigos."
"text.0b26": "¿Esta es una comunidad de\nla tribu Sukamon?"
"text.0b82": "Exacto. Es el paraíso de\nla tribu Sukamon,\nse llama Reino del Polvo."
"text.0c20": "El Rey de los Sukamon vive aquí."
"text.0c62": "¿El Rey de los Sukamon...?"
"text.0c90": "¡El Rey es asombroso!\nSi no le haces caso,\n¡te hará digievolucionar!"
"text.0d32": "¿Quieres decir que nos volvemos\nalgo que no sea Sukamon?"
"text.0d9e": "¡¿Eso significa volver\na nuestra forma original?!"
"text.0dfc": "Sí, da miedo. Escalofríos."
"text.0e36": "Aprendí algo útil..."
"text.0ea2": "¡¿Ah, Sukamon?!"
"text.0ec4": "¿Eh? ¿Me conoces?"
"text.0f00": "Bueno, algo así.\n¿También hay que llevar\na Sukamon a la ciudad?"
"text.0f92": "¡Guau, qué interesante!\n¡Nunca había visto\nalgo así!"
"text.1014": "¡Dios mío! ¡La caca\nse mueve y habla!"
"text.107c": "¿Hablas de mí?\nSoy Sukamon...\nSoy un Digimon mutante."
"text.1100": "¿No eres caca?"
"text.112a": "En cierto modo tienes razón,\nporque estamos hechos de\nbasura digital."
"text.11aa": "¿Le pedimos que venga a la\nciudad también? No hay\nque tener prejuicios."
"text.1240": "¿Piensas vivir\naquí?"
"text.1284": "¿Qué? Nunca lo\nhabía pensado."
"text.12ca": "Bueno, esto es un paraíso\nsolo para la tribu Sukamon.\nLos demás no pueden vivir aquí."
"text.136a": "¿Entonces ustedes no pueden\nvivir en otros lugares?"
"text.13ba": "¡Claro que no!\n¿Tú qué crees?"
"text.1404": "Ya veo. Eso es\nlo que pensaba."
"text.1446": "Bueno, aunque no puedes\nvivir aquí,\npuedes echar un vistazo."
"text.14be": "Ah, solo mirar. Bien."
"text.14f2": "Ah, por cierto, nunca\nhagas enojar al Rey."
"text.1552": "El Rey te volverá algo\nmiserable con su técnica\nde digievolución."
"text.1610": "Oye, ¡tienes demasiadas\ncartas de Etemon!\nNo lo hagas."
"text.167c": "¡Ah, gracias!"
"text.16bc": "Oigan, ¿ustedes son de...\ncómo se llama... la ciudad?"
"text.172e": "Esto queda entre\ntú y yo. Me interesa\nun poquito."
"text.17ae": "Algún día iré a\nvisitarlos allá."
"text.17fe": "Oigan, ¿conocen la técnica\nespecial de la\ntribu Sukamon?"
"text.187e": "¡Absorbemos la caca del suelo\ncon el cuerpo y la\nconvertimos en energía!"
"text.1916": "¿Eh? Esto es el Reino del Polvo.\nSé que para ti es solo\nun basurero."
"text.19a4": "Pero quizá hallemos algo\nútil. Vi allá algo largo\ncomo una vara."
"text.1a4c": "¡Guau, es una\n{color:6}Caña vieja{color:1}!"
"text.1aba": " {color:5}Entrenamiento: Entre basura {color:1}"
"text.1af6": "Empezar\nExplicar\nSalir"
"text.1b2e": "Normal\nIntento extra\nSalir"
"text.1b6c": "Entrenamiento mental metido\nen basura sucia.\nSube mucho el MP máximo."
"text.1c0e": "Explicar otra vez\nEmpezar\nSalir"
"text.1c68": " {color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}\npara alinear tres dibujos."
