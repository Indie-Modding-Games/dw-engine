"text.00b2": "¡¿Qué pasa?!"
"text.00e2": "¡Ah, bienvenido, Hagurumon!"
"text.0122": "¡¿Hagurumon?!"
"text.0168": "¡¿Qué está pasando?!"
"text.01d8": "{color:7}Juguetes {color:1}\nEs una vieja historia.\nUn malvado llegó de\nmuy lejos a esta isla."
"text.0280": "{color:7}Juguetes {color:1}\nLos malvados dijeron a los\nDigimon: esta isla es nuestra."
"text.030a": "{color:7}Juguetes {color:1}\nLos Digimon les dijeron:\nNo es cierto. Esta isla\nes de todos."
"text.03b8": "{color:7}Juguetes {color:1}\nComo los Digimon se unieron\ny enfrentaron a los malvados,\nestos recibieron su lección."
"text.0494": "{color:7}Juguetes {color:1}\nPero los malvados dijeron:\nEsperen, ya volveremos.\n...y desaparecieron."
"text.0554": "{color:7}Juguetes {color:1}\nEs una vieja historia."
"text.05b0": "Mmm, qué alegría siento...\nAh, espera."
"text.05fc": "La historia de esa canción\nes un viejo relato de esta\nisla, ¿no?"
"text.0684": "Lo de los Digimon que\nvencieron a los malvados..."
"text.06e0": "Mmm, ¿quiénes serían los\nmalvados de la historia?"
"text.0750": "Gracias por ayudarme.\nEsto es en agradecimiento."
"text.07cc": "¡El peluche de Monzaemon\nse une a la ciudad!"
"text.0850": "Espera, ¿no se le cayó algo\na WaruMonzaemon?"
"text.08be": "¡Buena suerte!\n¡Es la casa de al lado!"
"text.092a": "......"
"text.09cc": "¡Ah, Monzaemon!\n¡Volviste con vida!"
"text.0a16": "Guau, ¿qué es eso?"
"text.0a3e": "¡Ve a pelear con WaruMonzaemon!\n¡Rápido, todos a\nmoverse! ¡Rápido, rápido!"
"text.0ace": "¡Espera... espera! No es el\nMonzaemon que conocen."
"text.0b38": "¿Eh? ¿Cómo que no? Pero\nes un Monzaemon, ¿no?"
"text.0bb2": "Sí, es cierto que\nes un Monzaemon."
"text.0c0a": "Un malvado, WaruMonzaemon,\nse llevó a mis amigos."
"text.0c7a": "¡Creo que solo Monzaemon\npuede vencerlo!"
"text.0cec": "Mmm, entonces hay que hallar\na ese malvado. ¿Dónde está?"
"text.0d5a": "Está al lado. Quitaré\nel sello de la puerta."
"text.0dc2": "Así que, por favor, ve\na ver qué puedes hacer."
"text.0e14": "Ya veo. Bien,\n¡te ayudaré!"
"text.0e60": "¡Gracias!"
"text.0e88": "¡Gracias!"
"text.0eb0": "¡Gracias!"
