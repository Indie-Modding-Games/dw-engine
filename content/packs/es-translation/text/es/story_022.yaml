text.00c2: "Me duele el ala."
text.00ee: "¿Qué pasó?"
text.0112: "Me lastimé el ala... ¿Tienes\nalgo para curarla?"
text.018e: "¡Guau, se ve bastante mal!\nEspera. Déjame ver."
text.0208: "Ahora no tengo\nnada."
text.0294: "Esto no servirá."
text.02bc: "Está mucho mejor. Gracias."
text.030a: "¿Ya puedes volar?"
text.0332: "No creo poder volar lejos."
text.037a: "Hay una clínica en la ciudad.\nDeberías ir allí.\nNo está lejos."
text.0402: "Oí hablar de la ciudad.\nEs más grande de lo que creía."
text.0470: "Ve a la ciudad a descansar."
text.04a8: "Gracias. Tal vez algún\ndía pueda ayudarte."
text.053c: "¡Unimon se une a la ciudad!"
text.057c: "No tengo nada para\ncurar tu herida.\nTe conseguiré algo."
text.0608: "Lo siento, date prisa."
text.068c: "Hay unos dibujos extraños\nen el suelo."
text.06f0: "¿Es uno de esos\ncírculos misteriosos?\nTodavía se ve nuevo."
text.0774: "¡Ahora veo más!\n¿Tendrá esto que ver\ncon el ovni...?"
text.080a: "¿¡Guau!? ¡Hay más\nque antes!"
text.0862: "¿Qué significa esto?"
text.0896: "¿Qué?"
text.08f8: "Aparece el ovni de Vademon."
text.092c: "¿¡Un... un extraterrestre!?"
text.0950: "..."
text.095e: "¿Eres... un Digimon?"
text.0990: "..."
text.099e: "Bueno..."
text.09b4: "..."
text.09ca: "Vademon empuña un arma."
text.09fa: "¡No, detente!\n¡No soy tu enemigo!"
text.0a3c: "Vademon suelta el arma."
text.0a70: "Qué bueno que lo entiendes."
text.0aa0: "{color:6}{tamer}{color:1} intenta\nconvencerlo desesperadamente."
text.0af4: "..."
text.0b02: "¿Será que no lo entiende?"
text.0b3a: "Bien."
text.0b8a: "¡Vademon se une a la ciudad!"
text.0bc0: "Él..."
text.0bd0: "¡Él puede hablar!"
