text.0032: "Llegó la hora."
text.005e: "Ojalá pudiera quedarme,\npero mi mamá se preocupa."
text.00b6: "Gracias, {color:6}{tamer}{color:1}.\nOjalá pudiera pagártelo."
text.010e: "{color:7}Tokomon {color:1}\n¡No nos olvides!"
text.014c: "Nos volveremos a ver.\nLo sé."
text.01c0: "La pasé genial. Gracias."
text.01fa: "Deberíamos hacer una\nceremonia de despedida."
text.0258: "{color:10}{partner}{color:1}, ¡nuestra\naventura fue grandiosa!"
