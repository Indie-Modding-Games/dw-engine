"text.0062": "¡Guau!"
"text.0080": "Mmmm."
"text.00a0": "Eh, dejémoslo aquí."
"text.00e6": "Aún no podemos\nbajar la guardia."
"text.013c": "...!"
"text.0180": "¡No, no quiero!\n¡No quiero pelear!"
"text.01de": "Si no quieres pelear,\nentonces huye."
"text.023a": "Qué lástima."
"text.0268": "No te entiendo."
"text.029c": "Bueno, ¿por qué no vienes a\nnuestra ciudad? Es mejor que\nesconderte aquí."
"text.032e": "Eh, ¿ciudad?"
"text.0350": "No te vamos a\nobligar."
"text.0394": "Eso me dan ganas de ir.\n¡Bien, iré!"
"text.0426": "¡Gabumon se une a la ciudad!"
"text.0464": "Qué tipo tan raro."
