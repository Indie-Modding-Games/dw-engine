text.004e: "Tengo un mal presentimiento..."
text.0098: "¡Sabía que vendrías!"
text.00e4: "¿Quién eres?"
text.0104: "Soy Devimon, un ángel oscuro.\nPoseo el poder de las sombras."
text.017c: "¿Sabes algo?"
text.01b0: "Myotismon está en la mansión.\nQuizá sigue vivo."
text.021e: "¿Tú hiciste esto?"
text.024a: "No sé...solo sé que\neres mi enemigo."
text.02c2: "¡No escaparás!"
text.030c: "¡Ja, ja, ja!"
text.034a: "¡Oh, no!"
text.036e: "Salúdame a Myotismon."
text.03cc: "¡Se escapó!\nEse tipo no me agrada."
text.048a: "¡Qué mansión tan grande!"
text.04ca: "¿Hay alguien en casa?"
text.0500: "No hay nadie o\nno me oyen."
text.0566: "Bien. ¡A explorar!"
text.05be: "¡Usé la\n{color:6}Llave mansión{color:1}!"
text.0622: "No abre.\nEstá cerrada con llave."
text.069a: "¡Usé la\n{color:6}Llave mansión{color:1}!"
text.06fe: "No abre.\nEstá cerrada con llave."
text.0776: "¡Usé la\n{color:6}Llave mansión{color:1}!"
text.07da: "No abre.\nEstá cerrada con llave."
text.0866: "No abre. Está sellada con\nuna fuerza extraña."
