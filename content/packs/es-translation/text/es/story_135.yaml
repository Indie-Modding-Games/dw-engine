"text.004c": " {color:6}{tamer}{color:1} y {color:10}{partner}{color:1},\n¿verdad? ¡Gracias por venir\na Villa Volumen!"
"text.00ca": "Perdón por lo que le\nhicimos a Otamamon."
"text.0122": "No importa."
"text.0148": "¿Eh?"
"text.0168": "Te lo agradezco. Supe que\nhas trabajado duro\npara salvar esta isla."
"text.0200": "¿Ah, sí?"
"text.0218": "Quería ayudarte.\n¿Fuiste a los Árboles\nBrumosos, al norte de aquí?"
"text.02ca": "Todavía no."
"text.02ee": "Sí."
"text.02fe": "Ahí siempre hay niebla.\nSeguro te costará\nmoverte por ahí."
"text.0390": "Pero deberías conocer a\nCherrymon, el jefe\ndel bosque."
"text.041e": "¿Cherrymon? Nunca he oído\nde ese Digimon."
"text.0482": "Cherrymon crea la niebla\nde los Árboles Brumosos."
"text.04d6": "Creó la niebla para proteger\nel bosque del peligro."
"text.0548": "Pero nos causa problemas."
"text.0594": "Creo que Cherrymon sabe\nalgo de la causa de los\nproblemas de la isla."
"text.062e": "Vale la pena cruzar\nla niebla para verlo."
"text.0688": "Si pudiéramos hacer algo\ncon la niebla..."
"text.06da": "Solo Cherrymon puede\nquitar la niebla."
"text.074a": "Pero hay una forma de pasar.\nTe echaré un hechizo."
"text.07be": "¿Qué va a pasar?"
"text.07ee": "Podrás ver el camino\naun con la niebla."
"text.0860": "¡Ah, qué bien!"
"text.0888": "Bien, entonces empiezo."
"text.08b8": "¡Croac, croac!"
"text.08f6": "Bien. Perfecto.\nAhora ve a los Árboles Brumosos."
"text.0974": "Lo conocí.\nYa no hay niebla."
"text.09ba": "¡Guau, increíble! Bueno,\n¿cómo puedo ayudarte?"
"text.0a2a": "Bien, déjame darte esto."
"text.0a6c": "¡Conseguí un\n{color:6}Digirróbalo{color:1}!"
"text.0abc": "Tira alguna otra cosa."
"text.0b04": "Es algo muy raro.\nTe será útil."
"text.0b72": "Gracias. ¿Y por qué no\nvienes a la ciudad, Shogun?"
"text.0bde": "Soy jefe de cien Gekomon\nen el Pantano Geko. Lo siento,\npero no puedo ir contigo."
"text.0c84": "Pero a cambio, haré\ntodo lo que pueda desde aquí.\nVen cuando quieras."
"text.0d58": "Parece que tienes un problema.\nCon el disfraz, ¿verdad?"
"text.0dce": "¿Lo sabes?"
"text.0dfa": "No me subestimes. Numemon\npodrá ponérselo."
"text.0e68": "¿Sorprendido? Y no solo eso,\ncuando se lo ponga... No lo\ncreerás... Bueno, pruébalo."
"text.0f4e": "Por cierto, quitaré de tus\nobjetos la {color:6}Caña genial {color:1}\npara pescar."
"text.0fe0": "Es un objeto especial."
"text.1022": "¡Buena suerte!"
"text.1052": "Solo puedes pescar en el\nLago Ojo de Dragón."
"text.10a6": "¡Atrás, atrás!"
"text.10da": "Shogun colecciona objetos\nraros. Antes coleccionaba\nobjetos."
"text.1154": "Pero ahora le encantan\nlas cartas Digimon."
"text.11aa": "Si le traes una carta rara,\nte dará\npuntos de mérito."
"text.1222": "Puedes juntar cartas,\npuntos de mérito y\ncambiarlos por objetos.{stop}{stop}"
"text.12bc": "Bueno... no, nada. Croac."
"text.12fe": "Disculpa... Quiero ir a\nla ciudad. ¡Croac!"
"text.1362": "Bien, pero ¿qué pasó?"
"text.1396": "Quiero pelear en la Arena.\nParece que a nosotros,\nla tribu Gekomon,{stop}"
"text.142e": "nos menosprecian como\nDigimon de campo. Croac."
"text.1494": "Sí, somos del campo,\n¡pero también tenemos orgullo!{stop}"
"text.1522": "Entiendo cómo te sientes.\nEntonces, inténtalo. ¡Suerte!"
"text.1582": "¡Gekomon se unió a la Arena!"
