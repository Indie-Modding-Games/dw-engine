"text.0020": "Me cansé de entrenar aquí.\n¿Qué hago?"
"text.0082": "¿Qué hago?"
"text.00a0": "¿Dónde entrenas?"
"text.00da": "¿Eso es un lugar de entreno?"
"text.0116": "Me cansé de entrenar.\nQuiero batallas de verdad."
"text.0180": "Quizá sea un lugar de entreno.\nQuizá sea una Arena."
"text.01ee": "Me cansé de entrenar.\nQuiero batallas de verdad."
"text.0258": "Quiero ir allá.\nEntrenaré allá."
"text.02e2": "¡Kabuterimon se une a la ciudad!"
"text.032a": "El Torneo de Guerreros\nInsecto se celebra aquí\ncada año..."
"text.03ae": "...en los días con dos doses.\n¡El ganador se lleva premios!"
"text.0422": "Pero solo pueden entrar\nlos Digimon insecto."
"text.0480": "Están Kabuterimon,\nKuragamon, Kunemon\ny otro insecto más."
"text.0508": "Pero Numemon no."
"text.052e": "Los días con dos doses, el\nTorneo de Guerreros Insecto\nse celebra cada año."
"text.05ce": "Ya ganaste antes, ¿verdad?"
"text.060a": "Están Kabuterimon,\nKuragamon, Kunemon\ny otro insecto más."
"text.0692": "Ese es HerculesKabuterimon."
"text.06ce": "Hercules-Kabuterimon es\nsúper fuerte."
"text.071e": "El ganador puede volverse\nHercules-Kabuterimon\ny recibir objetos."
"text.07a6": "Puedes entrar al Torneo de\nGuerreros Insecto muchas veces."
"text.0824": "Eres fuerte.\nNo tengo nada que enseñarte."
"text.0886": "Investigamos técnicas.\nEs difícil dominar\nlas técnicas difíciles."
"text.091a": "Si tienes talento, podrías\ndominar las técnicas.\n¿Quieres dominar las difíciles?"
"text.09c8": "¡Claro que sí!\nNo, gracias"
"text.0a06": "Entonces lo intentaré."
"text.0a3e": "Te falta Defensa.\nEntrena más."
"text.0aa0": "Te falta Velocidad.\nEntrena más."
"text.0aee": "Te falta HP.\nEntrena más."
"text.0b2a": "Dominaste una técnica."
"text.0b64": "¡Dominaste «Bicho»!"
"text.0bb4": "{color:5}Entrenamiento: Empujar roca {color:1}"
"text.0bec": "Empezar\nExplicar\nSalir"
"text.0c22": "Normal\nIntento extra\nSalir"
"text.0c5e": "Gana fuerza empujando\nla roca. Sube mucho\nel HP máximo."
"text.0ce4": "Explicar otra vez\nEmpezar\nSalir"
"text.0d3e": "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}para\nalinear tres dibujos."
"text.0dc0": "{color:5}Entrenamiento: Golpes {color:1}"
"text.0df0": "Empezar\nExplicar\nSalir"
"text.0e28": "Normal\nIntento extra\nSalir"
"text.0e66": "Golpea un muñeco con\ntoda tu fuerza. Sube\nmucho el Ataque."
"text.0efc": "Explicar otra vez\nEmpezar\nSalir"
"text.0f56": "{color:7}Tragamonedas {color:1}\nUsa {color:6}△ {color:1}para\nalinear tres dibujos."
