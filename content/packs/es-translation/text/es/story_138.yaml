"text.0018": "Colecciono cartas Digimon."
"text.0058": "Dame a Hagurumon,\nToyAgumon y WaruMonzaemon\ny te daré algo."
"text.0108": "Dar\nNo dar"
"text.0138": "Lo siento, no tengo."
"text.0176": "Toma. Una {color:6}Venda X{color:1}."
"text.01b4": "Tengo demasiados objetos."
"text.01f8": "¿Alguna vez probaste el curling?"
"text.0236": "Si consigues diez\npuntos en el juego,\ntienes un talento increíble."
"text.02c0": "No sé si te sirva, pero\naquí van consejos de pesca."
"text.0338": "Primero, la caña.\nUna buena llega lejos\ny es flexible."
"text.03c0": "Luego, la carnada. Recuerda\nqué pez pescaste con\nqué carnada."
"text.043c": "Al lanzar la caña,\nsuelta con {color:6}△ {color:1}\n¡para lanzarla con todo!"
"text.04ce": "Sobre el Guardián del Lago...\nAparece cada día en la\nmañana y al atardecer."
