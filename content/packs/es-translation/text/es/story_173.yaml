"text.0030": "Descansa todo lo posible.\nEs la clave de la\nsalud de tu Digimon."
"text.00ca": "Bien. Déjame contarte\ncómo crecerá y\nprosperará la ciudad..."
"text.014c": "Cuando un Digimon Novato\nllega a la ciudad,\nsuma un punto."
"text.01cc": "Y cuando un Digimon\nCampeón llega a la ciudad,\nsuma dos puntos."
"text.025a": "Si un Digimon Ultra\nllega a la ciudad,\nsuma tres puntos."
"text.02da": "Pero hay tres Digimon\nCampeón que no son\nmuy útiles."
"text.0366": "Cuando llega uno de ellos,\nsolo suma un punto."
"text.03de": "Déjame contarte un\npoco sobre los tipos."
"text.0436": "Si un rival es del mismo\ntipo que tu compañero\nDigimon, quizá no pelee."
"text.04d2": "Y si el tipo de tu Digimon\nno es compatible, pueden\nno dejarlo pasar una puerta."
"text.056c": "Fuera de eso, quizá\nno tengas que\npreocuparte."
"text.05f2": "Déjame hablarte del\nnivel de domador."
"text.063c": "El nivel de domador sube\nsi logras criar Digimon\nhasta Digimon Ultra."
"text.06d0": "Y ganar el campeonato\nde un torneo de nivel alto\nes muy bueno."
"text.075c": "Subirá por sí solo.\nNo tienes que\npreocuparte mucho."
"text.07e8": "Por otro lado,\ndebes tener cuidado\nde que no baje."
"text.0874": "Si tu Digimon desaparece,\ntu nivel de domador\nbajará seguro."
"text.0900": "Si cometes errores de\ncuidado seguido, podría\nbajar. Ten cuidado."
