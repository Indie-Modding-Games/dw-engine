text.0026: "여긴 다 괜찮아.\n행운을 빌어."
text.0078: "나도 도와야지. 틈나는 대로\n여기랑 마을을\n오가도록 하지."
text.0128: "안드로몬이 마을에 들어왔다!"
text.0176: "데이터 복구 완료.\n그럼 데이터를 읽어 보지."
text.01e6: "부탁해."
text.0200: "100년 전, 디지몬 섬에\n아날로그 인간이\n나타났다."
text.0286: "아날로그 인간과 섬의\n디지몬은 치열하게 싸웠다."
text.02f0: "10년에 걸친 싸움 끝에\n아날로그 인간은\n패배하고 사라졌다."
text.038c: "그 후 10년 동안\n이상하게도 섬의 넓이가\n거의 두 배로 늘어났다."
text.0438: "인간이 디지몬이랑 싸웠다고?"
text.0476: "미안하다. 복구할 수 있었던\n데이터는 이게 전부다."
text.04e6: "괜찮아. 이건 정말\n중요한 정보야.\n덕분에 많은 걸 알았어."
text.0582: "그래?"
text.05ae: "아마 그 인간들이\n섬에 혼란과 문제를\n일으킨 장본인일 거야."
text.065e: "인간이 100년이나\n살 수 있어?"
text.06aa: "인간에게는 이 세계의\n시간이 느리게 흐르나 봐."
text.071a: "그래서 여기선 먹지도\n자지도 않아도 되는구나."
text.078a: "100년이면 정말\n긴 시간이야. 그 녀석들\n엄청 질긴가 봐."
text.081c: "그 녀석들이 어딘가에\n숨어 있을 것 같아?"
text.0872: "내가 찾아내서\n어떻게든 해 볼게."
text.08b8: "내가 왜 여기 왔는지 알겠어.\n나도 인간이니까\n내가 상대해야 해."
text.095e: "정말 미안하다. 당분간\n공장을 닫겠다."
text.09d6: "이런 상황에선 앞으로\n무슨 일이 생길지 아무도\n몰라. 네 잘못이 아니야."
text.0a8a: "누군가 기로몬을\n조종하고 있는 것 같다."
text.0aea: "컴퓨터가 망가지고\n폐수가 새기 시작했다."
text.0b62: "그 물 때문에 디지몬들이\n미쳐 버렸지. 우연은\n아닌 것 같다."
text.0bee: "이 컴퓨터들에는 뭔가\n중요한 게 있다."
text.0c46: "늦었을지도 모르지만\n누군가 우리를 노리고\n있었던 것 같다."
text.0cc8: "뭐?!"
text.0cdc: "이 컴퓨터들에 섬의\n과거에 관한 데이터가\n있었던 것 같다."
text.0d78: "하지만 기로몬의 난동으로\n데이터가 망가졌다."
text.0dec: "그 데이터를 본 적 없어?"
text.0e2a: "없다. 하지만 일부는 복구할\n수 있을지도 모른다.\n데이터를 이어 보겠다."
text.0eca: "그렇구나, 고마워.\n얼마나 걸려?"
text.0f22: "시간이 좀 걸린다. 마을\n입구를 다시 열어 둘 테니\n나중에 다시 와라."
text.0fb2: "고마워. 다시 올게."
text.0ff6: "데이터 복구는\n다 끝났어?"
text.1044: "조금 더 걸린다.\n나중에 다시 와라."
text.10a2: "알았어, 다시 올게."
text.10ea: "이봐, 이봐!"
text.1104: "사과해야 할 일이 있다."
text.113c: "그건 나중에 하고, 지금은\n공장 기계부터 멈춰!"
text.11ba: "알았다, 그렇게 하지."
text.11ee: "방금 공장 가동이\n멈췄다."
text.1246: "좋아, 하수도를 확인해 볼게.\n나중에 봐!"
text.12b2: "사과해야겠다."
text.12dc: "지금 그런 얘기 할\n시간 없어!"
text.133e: "우리 컴퓨터는 완벽하다."
text.1376: "공장이 정말 안전할까?\n이제 어떡하지?"
text.13e8: "좋아, 경비를 어떻게든\n해야겠어. 다른\n방법이 없어!"
text.1482: "어떻게 마을에 들어왔지?"
text.14ca: "여기 볼일이 없다면\n당장 나가라!"
text.1546: "그 얘긴 나중에 하자.\n지금은 공장을\n확인해야 해."
text.15cc: "목숨이 걸린\n일이야. 허락해 줘!"
text.163e: "무슨 일을 하려는지\n잘 모르겠군.\n허락해 줄 수 없다."
text.16e4: "공장 폐수 때문에\n사라질 위기에 처한\n디지몬들이 있어!"
text.178e: "공장에서? 말도 안 돼!\n폐수 정화 시스템은\n정상 작동 중이다."
text.182a: "확인도 안 해 놓고 정상인지\n어떻게 알아?!"
text.18a6: "우리 컴퓨터는 완벽하다.\n비상시엔 네트 수호자가\n시스템을 멈춘다."
text.1952: "그 네트 수호자가 언제나\n제대로 작동한다는\n거야?"
text.19de: "네트 수호자는\n완전체 디지몬 기로몬의\n다른 이름이다."
text.1a68: "판단력도 능력도\n완벽하지."
text.1ac2: "디지몬이라고?! 이런, 이제\n더 큰일 났어.\n제발 허락해 줘!"
text.1b7c: "나가라! 당장!"
text.1ba2: "휴... 에잇!"
