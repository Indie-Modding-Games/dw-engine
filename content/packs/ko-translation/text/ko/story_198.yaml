text.0064: "이게 마지막이야."
text.00a2: "드디어 도착했어!"
text.00e0: "길이 뚫렸어!"
text.0118: "쉽게 끝내자."
text.0154: "이게 마지막 기회야!"
text.019a: "정말 갈 거야?"
text.01f0: "무서워! 뼛속까지\n오싹해."
text.023a: "..."
text.0248: "왜 날 공격하지 않지?"
text.0282: "..."
text.0290: "싸우지 않아도 돼?"
text.02c8: "어서 서둘러 가자.\n우리 실력을 시험해야 해."
text.0348: "가자, {color:10}{partner}{color:1}!"
text.039c: "..."
text.03de: "이긴 거야?"
