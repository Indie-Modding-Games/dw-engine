text.014c: "땅에 이상한 그림이\n그려져 있어."
text.01a2: "그 이상한 원 같은 건가?\n아직 새것처럼 보여."
text.0238: "아까보다 더 늘었어.\n혹시 UFO가\n남긴 걸까?"
text.02d4: "으윽!?"
text.02f4: "훨씬 많이 보여."
text.032c: "그러니까 이건..."
text.036a: "뭐?"
text.03d0: "외계인?!"
text.03ec: "..."
text.03fa: "너 디지몬이야?"
text.0426: "..."
text.0434: "맞아?"
text.044c: "..."
text.0472: "난 네 적이 아니야!"
text.04a8: "좋아, 이제 알겠지."
text.04ea: "{color:6}{tamer}{color:1}(은)는 그를\n설득하려 했다."
text.0526: "..."
text.0534: "말을 못 알아듣나 봐."
text.0588: "좋아."
text.05d4: "베이드몬이 마을에 들어왔다!"
text.060a: "응?"
text.0618: "얘, 말할 줄 알잖아!"
