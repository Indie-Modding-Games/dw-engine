text.003a: "우와, 굉장하다!"
text.0092: "어, 돌 석판이 있어.\n어디 보자..."
text.0112: "레오몬이라고 써 있어.\n나머진 못 읽겠어."
text.016c: "말은 알아듣는데\n글은 잘 몰라서..."
text.01cc: "가져가자."
text.0200: "앗, 뭔가\n버려야겠어."
text.0262: "{color:6}레오몬\n석판{color:1}을 얻었다!"
text.02ba: "누구야?"
text.02da: "누구냐!"
text.0370: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 20개까지\n가질 수 있다!"
text.0434: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 30개까지\n가질 수 있다!"
