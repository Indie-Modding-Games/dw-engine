text.014c: "뒤에서 목소리가\n들려. 저 목소리는...!"
text.01f6: "기다려!"
text.0208: "내가 왜 기다려?!"
text.023e: "하하하!"
text.02bc: "우와, 깜짝이야!"
text.02ee: "와몬, 멋져! 우와!"
text.033e: "포기해!"
text.0364: "으아악!"
text.0378: "마을에 와서 일하면서\n죗값을 치러."
text.03ec: "그래, 알았어.\n마을로 갈게."
text.0452: "하하하, 농담이야! 잘 있어."
text.08fa: "젠장, 속았다!"
text.092a: "뭐, 동굴은 되찾았으니까.\n괜찮겠지."
text.099a: "이제 이 동굴은 괜찮을 거야."
text.09da: "넌 정말 착한 아이구나.\n저 녀석들도 언젠가\n잘못을 깨달을 거야."
text.0a8a: "내 보물을 너에게 줄게.\n안쪽에 있어."
text.0aea: "잠깐, 잠깐.\n그건 네 보물이잖아?\n받을 수 없어."
text.0b68: "아니, 난 필요 없어.\n너희 마을에 가고 싶어."
text.0bce: "그럼 우린 뭐 하러\n이 동굴을 되찾은 거야?\n괜히...?"
text.0c56: "미안해. 하지만 지금은\n정말 너를 돕고 싶어."
text.0cb8: "그렇구나. 고마워.\n넌 정말 착하구나."
text.0d04: "난 곧장 마을로 갈 거야.\n원하면 태워\n줄게."
text.0d92: "와몬이 마을에 들어왔다!"
text.0dd4: "마을로 돌아갈래?"
text.0e0a: "돌아갈래\n안 갈래"
