text.003c: "어디 가?"
text.007a: "기다려!"
text.009a: "도페에에!"
text.00c0: "구흐 헤이 히!"
text.00f6: "넌 누구야?"
text.0114: "난 99전 무패의\n메탈마메몬이다!\n네가 100번째 상대다!"
text.01b0: "{color:6}{tamer}{color:1} 같은 녀석이\n도망칠 리는 없겠지."
text.0214: "좋아, 붙자\n미안, 다음에"
text.0294: "생각보다\n제법이구나."
text.02d4: "넌 내 진정한 라이벌이다!"
text.0306: "언젠가 꼭 이기고 말겠다!"
text.0372: "메탈마메몬이\n마을에 들어왔다!"
text.03c6: "겁먹을 줄 알았다.\n뭐, 배짱이 좀 더\n생기면 다시 만나자."
