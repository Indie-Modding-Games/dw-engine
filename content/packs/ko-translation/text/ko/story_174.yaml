text.004c: "제 식당에 어서 오세요."
text.0084: "이 식당의 주인 겸\n요리사가 되기로 했어요."
text.00fc: "제 불꽃 요리를\n마음껏 즐기세요."
text.0178: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}, 제\n집밥 한번 먹어 볼래요?"
text.01ce: "주워 먹는 아이템과는 달리\n이건 진짜 요리예요.\n제 숨은 재주랍니다."
text.0274: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\n요리로 먹고살기로 했어요.\n솜씨는 자신 있어요!"
text.02f2: "언제 한번 제 식당에서\n편하게 밥 먹고 가요."
text.037a: "C???NC?? , C???MC?? .\n드디어 제 식당을 열었어요!"
text.03e6: "얼음 디저트를 먹어 봐요!\n제 특기예요."
text.045c: "{color:6}{tamer}{color:1}, 이 식당에서\n요리사로 일하기로\n했어요."
text.04d0: "따끈한 식사를 즐기세요."
text.051e: "좋아요!\n{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\n이제 저도 요리사예요!"
text.0566: "제 요리는 다른 데서\n먹는 것보다 훨씬\n맛있어요. 먹어 봐요!"
text.061a: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\n요리에 인생을\n걸기로 했어요!"
text.067e: "제 특제 집밥은 몸에\n아주 좋아요! 제가 요리할\n때 꼭 들러 줘요."
text.0734: "어서 와요!  {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
text.0758: "이 식당 일을 돕기로\n했어요. 디저트는\n제가 맡았답니다."
text.07d6: "제 디저트는 정말\n자신 있어요.\n꼭 먹어 봐요, 알았죠?"
