text.0028: "으윽!"
text.0060: "뭐?"
text.007e: "뭐야?!"
text.009e: "두목, 큰일 났어요!"
text.00e2: "너희 뭐 하는 거야?"
text.011e: "대단한데. 새 오거 요새를\n찾아내다니!"
text.018c: "또 나쁜 짓 하려고?"
text.01d0: "당연하지! 헤헤!"
text.01fa: "그렇게는 못 둬!\n당장 이 동굴에서\n나가!"
text.0278: "이번엔 다르다!"
text.02c0: "두목, 저거예요?"
text.02ee: "그래. 가라!"
text.033c: "뭐야?!"
text.0360: "와루시드라몬 님!\n부디 해치워 주세요!"
text.03ca: "네 보디가드라는 거야?"
text.040c: "헤헤헤! 넌 끝장이다!"
text.0490: "젠장!"
text.04a2: "아아아아악!"
text.04c6: "놓치지 않을 거야!"
