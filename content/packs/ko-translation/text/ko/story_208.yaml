text.002e: "조개 신문 제8호\n외계 디지몬 출현:\n드디어 UFO를 찾았다.\n그 생물은 모습을 드러내고\n알 수 없는 말을 했다.\n그 생물은 외계인일까?\n다시 나타날 것인가?"
text.018a: "이전\n닫기"
text.01bc: "조개 신문 제7호\n마이오티스몬, 은퇴설을\n부인:\n인터뷰에서 그는\n소문을 부인했다.\n아직 열심히 활동 중이며\n팬들을 사랑한다고.\n또한 제자 스컬그레이몬이\n곧 데뷔한다고\n발표했다."
text.0368: "이전\n다음\n닫기"
text.03d0: "조개 신문 제6호\n마이오티스몬 은퇴?:\n인기 있고 실력 있는 \n마이오티스몬이 은퇴한다는\n소문이다. 경기장에서 그를\n본 이가 없다. 이제 선수\n생활도 끝인가. 너무 늙었다."
text.0544: "이전\n다음\n닫기"
text.05b4: "조개 신문 제5호\n숨은 보물:\n기어 사바나의 멋진 가게.\n이 가게는 매년 1일부터\n15일까지만 문을 연다.\n가게 주인은 귀한 아이템이\n자랑거리라고 한다."
text.0710: "이전\n다음\n닫기"
text.0794: "조개 신문 제4호\n전설의 디지몬?:\n얼음 나라에 추위에 강한\n디지몬이 산다는 소문이다.\nM 씨가 이 괴물에게\n구조되었다고 한다.\n커다란 눈덩이 같았다고.\n추위에 약한 디지몬은\n조심하길!"
text.094e: "이전\n다음\n닫기"
text.09aa: "조개 신문 제3호\n호수에 수호신이?:\n용의 눈 호수에\n호수의 수호신이 있다.\n디지몬을 닮은 그 생물은\n누군가가 불러냈다고 한다.\n이 수호신은 소원을\n이루어 줄 수 있을까?"
text.0b10: "이전\n다음\n닫기"
text.0b80: "조개 신문 제2호\nUFO 출현!:\n파노라마 산 근처에서\nUFO를 봤다는 제보가 있다.\nUFO는 은색 접시처럼\n생겼고 바닥에서\n빛이 나온다고 한다.\n과연 외계인일까?\n자세한 소식은 다음 호에."
text.0cf8: "이전\n다음\n닫기"
text.0d48: "조개 신문 제1호\n도적단 소탕!:\n{color:6}{tamer}{color:1}이(가) 오거몬이\n이끄는 아지트를 찾아냈다.\n하지만 오거몬은 \n아직 잡히지 않아\n모두 불안해하고 있다."
text.0e70: "다음\n닫기"
