text.0040: "!"
text.0058: "섬에 무슨 일이 생긴 거야?"
text.0092: "부족들은 뿔뿔이 흩어져\n기억을 잃고 난폭해졌어."
text.0100: "나도 언제까지 정신을\n붙들고 있을지 모르겠어."
text.0152: "이대로 둘 순 없어!\n위험을 깨닫게 해야 해!"
text.021c: "멈춰! 섬을 망칠\n셈이야?!"
text.0278: "넌 누구냐? 비켜! 이 방법\n말고는 없단 말이다!"
text.031c: "다른 방법이\n있다는 거냐?"
text.037a: "섬이 망가지면\n아무 소용 없잖아!\n내 말 좀 들어 봐."
text.03fe: "뭐?"
text.0418: "우린 모든 디지몬을 모아서\n섬을 위한 마을을\n만들고 있어."
text.049a: "디지몬들이 힘을 합치면\n섬을 이 위험에서\n구할 수 있다고 들었어."
text.0532: "네 말이 맞는 것 같다만,\n모든 디지몬을 모으는 건\n엄청난..."
text.05cc: "지금 하고 있는 중이야.\n불가능한 건 없어!"
text.063e: "엄청난 일이로군!\n하지만 감동했다...\n너희라면 해낼지도 몰라."
text.06c8: "우리를 믿는다면\n마을로 와 줬으면 해."
text.073e: "좋다. 마을로 가겠다.\n그게 내 새로운 길이겠지!"
text.07f0: "메라몬이 마을에 들어왔다!"
text.084a: "돌아올 줄 알았다.\n답을 들어야겠다!"
text.08f0: "내가 진 것 같군..."
text.091c: "너에게 꼭\n할 말이 있다."
