text.01ba: "와 줘서 고마워!"
text.01ea: "안녕, 난 모쟈몬이야!"
text.02e0: "{color:6}{tamer}{color:1}, 너무 기뻐!\n우릴 위해 많이 애써 줬잖아."
text.0342: "나, 마을에 가기로 했어.\n같이 열심히 일하자,\n알았지?"
text.0404: "모쟈몬이 마을에 들어왔다!"
