text.001e: "{color:6}{tamer}{color:1}, 해냈구나!"
text.0044: "아구몬이 마을에 왔단다.\n저쪽에서 장사를\n시작했지."
text.00be: "저런 디지몬이 더\n많아지면 좋겠구나!"
text.012c: "팔몬이 와서 고기 밭을\n넓힐 계획이라더구나."
text.019c: "그럼 고기를 잔뜩 얻겠지!"
text.01f4: "쿠네몬이 와서\n풀을 먹고 싶다더구나."
text.024e: "잡초를 먹어 주면 좋겠는데!"
text.02a2: "센타루몬이 와서\n진료소를 열 계획이란다."
text.0310: "이제 병이나 상처는\n걱정 없겠구나!"
text.0386: "코엘라몬이 와서\n가게를 열고 싶다는구나."
text.03ec: "마을이 번창하겠구나!"
text.0438: "베타몬이 와서 가게를\n열고 싶다고 하더구나."
text.04a8: "마을이 번창하겠구나!"
text.04f4: "바케몬이 와서 무슨\n말을 했는데 못 알아들었단다."
text.056c: "뭐, 괜찮겠지."
text.05b6: "베지몬이 왔단다. 고기 밭을\n더 넓힐 계획이라더구나."
text.0632: "이제 먹을 걱정은 없겠구나."
text.0686: "티라노몬이 와서 자기\n요리가 최고라더구나."
text.06f8: "뭐, 나름 매력이 있지."
text.0746: "메라몬이 와서 자기가\n불꽃의 대장이라더구나."
text.07c0: "의욕이 활활 타오르더구나!"
text.0816: "프리지몬이 와서 간식\n얘기를 하더구나."
text.0882: "나도 간식을 좋아한단다."
text.08bc: "가루루몬이 와서\n요리를 할 줄 안다더구나."
text.091e: "솜씨가 꽤 좋단다."
text.0964: "버드라몬이 와서\n배달부가 되겠다더구나."
text.09c4: "좋은 생각이지."
text.09fa: "셸몬이 와서 게시판을\n세우겠다더구나."
text.0a70: "정보화 사회로\n한 걸음 다가섰구나!"
text.0ada: "엘렉몬이 와서 전기를\n켜 주겠다더구나."
text.0b46: "마을이 환해지면 좋겠구나."
text.0b9c: "코카토리몬이 와서\n조각상을 만들겠다더구나."
text.0c10: "쉴 수 있는 곳이 되겠지."
text.0c66: "모노크로몬이 와서\n아이템 상점 주인으로\n일하고 싶다더구나.{stop}"
text.0d08: "그 녀석은 전문가란다."
text.0d4e: "유니몬이 와서 장사에\n도움이 되고 싶다더구나."
text.0dc4: "좋은 마음가짐이지."
text.0e12: "파타몬이 와서 재미있는\n일이 없냐고 묻더구나."
text.0e78: "아이템 상점을\n권해 주었단다."
text.0ec8: "비요몬이 와서 추천할\n만한 일이 없냐고 묻더구나."
text.0f3c: "아이템 상점을\n권해 주었단다."
text.0f8c: "그레이몬이 와서 경기장을\n만들겠다더구나."
text.0ff2: "꼭 보고 싶구나."
text.104c: "펭귄몬이 와서\n컬링 경기장을\n만들겠다더구나."
text.10ca: "점점 다양해지는구나."
text.1120: "엔젤몬이 와서\n대화를 기록하겠다고\n하더구나."
text.1194: "가까이에 있단다."
text.11ce: "드리모게몬이 와서\n보물찾기를 본업으로\n삼겠다더구나."
text.1270: "큰일이로구나!"
text.12a2: "가부몬이 와서 뭔가를\n하는 게 걱정된다고\n하더구나."
text.1334: "그래서 큰 일을\n골라 보라고 했지."
text.13a0: "닌자몬이 와서\n수련 얘기를 하더구나."
text.1400: "열심히 하는 모습은 보기 좋지."
text.145a: "와몬이 와서\n나룻배 대신\n사람들을 태워 주겠다더구나."
text.14e0: "잘됐구나!"
text.150a: "모쟈몬이 와서\n만물상을 열겠다고\n하더구나."
text.1586: "그런데 뭔가\n좀 이상하더구나."
text.15f4: "마메몬이 와서 귀한\n아이템을 팔겠다더구나."
text.166a: "“귀한” 게\n뭘까?"
text.16c8: "누메몬이 와서 가게를\n열겠다고 했는데,\n비밀이라더구나."
text.1752: "이젠 비밀도 아니지."
text.17a0: "카부테리몬이 와서 훈련과\n개조 얘기를 하더구나."
text.181e: "그린 체육관에 갔으려나?"
text.1872: "쿠와가몬이 와서\n카부테리몬이 어디 있냐고\n묻더구나."
text.18d8: "어디로 갔을까?"
text.1916: "기로몬이 와서\n주문을 하라더구나!"
text.1976: "그러니 주문을 해 보거라."
text.19b8: "오거몬이 와서 자기\n팔을 사 달라더구나."
text.1a1c: "눈빛이 이글이글하더구나!"
text.1a66: "레오몬이 와서 마을에 대해\n이것저것 묻더구나."
text.1acc: "사바나 순찰대는 아직도\n활동 중인 모양이구나!"
text.1b40: "픽시몬이 와서 묻더구나.\n“할아버지, 비밀 아이템\n필요하지 않아?”"
text.1bca: "좀 걱정되는구나."
text.1c04: "에테몬이 와서 멋진\n가게를 열겠다더구나."
text.1c70: "수상한 냄새가 나는구나."
text.1cb2: "메탈마메몬이 와서\n{color:6}{tamer}{color:1}와(과) 겨룰 만한\n일이 없냐고 묻더구나."
text.1d4e: "승부욕이 대단하더구나."
text.1da4: "베이드몬이 왔는데...\n잠깐, 왔던가?"
text.1dfc: "도무지 기억이 안 나는구나."
text.1e4c: "메탈그레이몬이 와서\n모델 얘기를 하더구나"
text.1eb2: "자기가 대단한 줄 알더구나!"
text.1efc: "나니몬은 왔다가 가 버렸단다."
text.1f38: "어디 있으려나?"
text.1f80: "몬자에몬이 왔단다. 아니,\n껍데기만 갑자기\n나타났다고 해야겠구나."
text.2012: "그건 집에 두기로 했단다."
text.206e: "데비몬이 와서 정말\n굉장한 아이템 얘기를 하더구나."
text.20e4: "굉장하긴 한가 보구나."
text.2130: "에어드라몬은 이제 다 나아서\n일하고 싶다더구나."
text.219a: "원래대로 돌아와서 다행이야."
text.21f4: "디지타마몬이 와서는\n빛의 속도로 가 버렸단다."
text.2264: "아직 마을 어딘가에\n있을 거란다."
text.22c4: "스컬그레이몬이 와서\n경기장 대회에\n나가겠다더구나."
text.233e: "마이오티스몬이\n통역해 주었단다."
text.2396: "안드로몬이 와서\n만나서 반가웠다더구나."
text.23fa: "오래 머물 수는\n없는 모양이구나."
