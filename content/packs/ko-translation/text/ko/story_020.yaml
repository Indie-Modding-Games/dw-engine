text.0066: "한판 붙을래?\n겁나냐?!"
text.00b2: "좋아, 붙자\n잠깐만"
text.011e: "이런! 졌다!"
text.0152: "꽤 센 녀석이었어."
text.019a: "너 좋은 녀석이구나. 난\n마메몬이야. 같이 갈래."
text.0200: "같이 가겠다고? 그럼\n마을로 가 보는 건 어때?"
text.0272: "알았어. 그리로 갈게."
text.02d6: "마메몬이 마을에 들어왔다!"
text.0320: "더 강해지면\n다시 와."
text.039c: "다아아아!"
text.03be: "하, 하, 하."
text.03ea: "으으윽!"
text.0410: "동쪽: 원시의 숲\n서쪽: 기어 사바나"
