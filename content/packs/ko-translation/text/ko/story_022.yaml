text.00c2: "날개가 아파."
text.00ee: "무슨 일이야?"
text.0112: "날개를 다쳤어... 혹시\n치료할 만한 거 있어?"
text.018e: "우와, 꽤 심해 보여!\n잠깐만. 좀 볼게."
text.0208: "지금은 아무것도\n없어."
text.0294: "이걸론 안 되겠어."
text.02bc: "훨씬 나아졌어. 고마워."
text.030a: "이제 날 수 있어?"
text.0332: "멀리 날 수는 없을 것 같아."
text.037a: "마을에 진료소가 있어.\n거기 가 보는 게 좋겠어.\n멀지 않아."
text.0402: "마을 얘기는 들었어.\n생각보다 크구나."
text.0470: "마을에 가서 좀 쉬어."
text.04a8: "고마워. 언젠가\n내가 도와줄 수 있을 거야."
text.053c: "유니몬이 마을에 들어왔다!"
text.057c: "상처를 치료할 게\n하나도 없네.\n뭐라도 구해 올게."
text.0608: "미안해, 서둘러 줘."
text.068c: "땅에 이상한 그림이\n그려져 있다."
text.06f0: "이게 그 미스터리\n서클이라는 건가?\n아직 새것 같은데."
text.0774: "이제 더 많이 보여!\n혹시 UFO랑\n관계가 있는 걸까...?"
text.080a: "우와!? 아까보다\n더 늘어났어!"
text.0862: "이게 무슨 뜻이지?"
text.0896: "뭐야?"
text.08f8: "베이드몬의 UFO가 나타났다."
text.092c: "외, 외계인?!"
text.0950: "..."
text.095e: "너... 디지몬이야?"
text.0990: "..."
text.099e: "그게..."
text.09b4: "..."
text.09ca: "베이드몬이 총을 들었다."
text.09fa: "안 돼, 멈춰!\n난 적이 아니야!"
text.0a3c: "베이드몬이 총을 내려놓았다."
text.0a70: "알아줘서 다행이야."
text.0aa0: "{color:6}{tamer}{color:1}(은)는 필사적으로\n설득했다."
text.0af4: "..."
text.0b02: "못 알아들은 걸까?"
text.0b3a: "알았다."
text.0b8a: "베이드몬이 마을에 들어왔다!"
text.0bc0: "얘..."
text.0bd0: "얘, 말할 줄 알잖아!"
