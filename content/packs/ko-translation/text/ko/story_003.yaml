text.0062: "저리 가!"
text.008a: "꺼져!"
text.00b2: "내 거야!"
text.00dc: "잡았다!"
text.0114: "{color:7}? ? ? {color:1}\n..."
text.013c: "{color:7}? ? ? {color:1}. 꽃."
text.0172: "{color:7}? ? ? {color:1}\n난 꽃이야."
text.01ae: "{color:7}? ? ? {color:1}\n꽃이라고 했잖아!\n내 말 안 듣고 있어!?"
text.0262: "싸우는 건 싫어."
text.028e: "그렇다면\n우리 마을로 와."
text.02d6: "거긴 평화로워."
text.030a: "마을?"
text.0322: "재밌겠다.\n난 팔몬이야.\n분명 도움이 될 거야!"
text.03cc: "팔몬이 마을에 들어왔다!"
