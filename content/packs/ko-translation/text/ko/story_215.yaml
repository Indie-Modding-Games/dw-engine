text.0020: "상처가 다 나았으니\n이제 일하고 싶어요.\n돌봐 줘서 고마워요."
text.00b6: "저는 어떤 생명이든\n미래를 점칠 수 있어요.\n그 일을 해 볼까 해요."
text.013e: "관심 있으면 제 가게에\n들러 주세요.\n돈은 받지 않을게요."
text.01d6: "운세가 궁금한가요?\n좋아요, 한번\n봐 드릴게요."
text.0268: "흐음, 오... 오, 이런!"
text.029a: "자, 우선..."
text.0320: "전체적으로\n운이 아주 좋네요."
text.039e: "전체적으로 꽤 좋아 보여요."
text.0424: "전체 운은 그럭저럭이에요."
text.04a4: "전체 운이\n별로 좋지 않네요."
text.0532: "전체적으로 좋지 않아요."
text.059c: "무엇을 하든\n잘될 거예요."
text.05ea: "멋진 기회가\n찾아올 거예요."
text.0650: "기억에 남을 일이\n생길지도 몰라요."
text.069e: "뜻밖의 물건을\n발견할지도 몰라요."
text.06f0: "궁금했던 일의\n답을 얻게 될 거예요."
text.073a: "지갑이 두둑해질 거예요."
text.077e: "친구에게서 좋은 소식이\n올지도 몰라요."
text.07de: "기분 전환을 하면\n좋을 거예요."
text.0838: "평소에 안 가던 곳에\n가 보세요."
text.0896: "재미있는 꿈을\n꿀지도 몰라요."
text.08ea: "돈을 너무 많이\n쓰지 않도록 하세요."
text.0936: "비밀이 들통날지도 몰라요."
text.097a: "일찍 자는 게 좋겠어요."
text.09ba: "물건을 잘 챙기세요."
text.09f2: "친구가 괜히 화풀이를\n할지도 몰라요."
text.0a5c: "여러 재난이 한꺼번에\n닥칠지도 몰라요..."
text.0ab8: "싫어하는 상대와\n마주칠지도 몰라요."
text.0b1c: "큰 손해를 볼지도\n몰라요..."
text.0b76: "행운의 색은 빨간색이에요."
text.0bbe: "행운의 색은 흰색이에요."
text.0c0a: "행운의 색은 파란색이에요."
text.0c54: "행운의 색은 검은색이에요."
text.0ca0: "행운의 색은 초록색이에요."
text.0cec: "행운의 색은 회색이에요."
text.0d36: "행운의 색은 갈색이에요."
text.0d82: "행운의 색은 노란색이에요."
text.0dd0: "행운의 색은 보라색이에요."
text.0e1e: "행운의 색은 금색이에요."
text.0e5c: "마지막으로\n{color:10}{partner}{color:1}와(과)의\n궁합은..."
text.0ece: "천생연분이에요."
text.0f10: "꽤 좋은 편이에요."
text.0f4a: "괜찮아요."
text.0f72: "그저 그래요."
text.0fa0: "나쁘지는 않아요..."
