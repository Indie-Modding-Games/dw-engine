text.0034: "{color:5}훈련: 얼음 밀기 {color:1}"
text.0068: "시작\n설명\n그만두기"
text.009e: "일반\n보너스 도전\n그만두기"
text.00da: "얼음을 밀며 힘을 기르는 훈련."
text.011c: "최대 HP가 크게 오른다.\n방어력도\n올라간다."
text.0198: "다시 설명\n시작\n그만두기"
text.01f2: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.0274: "{color:5}훈련: 고드름 받기 {color:1}"
text.02aa: "시작\n설명\n그만두기"
text.02e2: "일반\n보너스 도전\n그만두기"
text.0320: "커다란 고드름을\n받아 내는 훈련."
text.0364: "방어력이 크게\n오른다.\n속도도 올라간다."
text.03e4: "다시 설명\n시작\n그만두기"
text.043e: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요"
