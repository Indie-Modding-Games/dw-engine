text.00cc: "무슨 일이야?"
text.00f4: "살려 줘!"
text.0114: "위험해 보여.\n도와줘야 해!"
text.0174: "{color:7}??? {color:1}\n약한 상대를\n괴롭히지 마라!"
text.01e4: "저건 누구지?"
text.0270: "괜찮아?"
text.0298: "고마워."
text.02b4: "곤란할 땐 언제든\n불러. 바로\n달려갈게!"
text.032e: "또 보자!"
text.035e: "어이, 기다려!"
text.039a: "꼭 영웅 같아.\n좋은 건 다 혼자 챙기네."
text.0404: "여긴 내 집이야. 나가!"
text.044a: "난 샤마몬. 넌 누구야?"
