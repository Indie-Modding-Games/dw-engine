text.0010: "어느 가게로 할래?"
text.004c: "진료소\n보물 사냥꾼\n점쟁이"
text.00aa: "여기를 병원으로 바꿨어요."
text.0100: "몸이 안 좋아 보이네요?\n건강 관리를\n잘 해 줘야 해요!"
text.018c: "바로 치료해 줄게요.\n치료비는 할인해서\n300 Bits예요."
text.0242: "Bits가 모자라요?!\n있는 만큼만 내요. 나중을\n위해 돈을 모아 두세요."
text.02f6: "이제 다 괜찮아요.\n앞으로는 조심하세요."
text.0364: "병이나 부상은 없어\n보이네요. 무슨 일로 왔어요?"
text.03d0: "진찰받기\n약 사기\n됐어"
text.042c: "좋아요, {color:10}{partner}{color:1}의\n상태를 볼게요."
text.048a: "이런. {color:10}{partner}{color:1}의 피로가\n아주 위험한 수준이에요.\n당장 쉬어야 해요!"
text.0540: "{color:10}{partner}{color:1}은(는) 피로가\n너무 쌓였어요. 늦기 전에\n쉬게 해 주세요."
text.05da: "{color:10}{partner}{color:1}은(는) 조금\n피곤해 보여요. 너무\n무리하면 안 돼요."
text.0664: "{color:10}{partner}{color:1}은(는) 괜찮지만,\n피로는 온갖 나쁜 일의\n원인이 돼요. 조심하세요."
text.06fe: "그럼, 마음 상태는 어떨까요?"
text.0742: "{color:10}{partner}{color:1}은(는) 마음이\n아주 편안해요.\n오래오래 살 거예요."
text.07da: "{color:10}{partner}{color:1}의 마음 상태는\n아주 좋아요. 건강하게\n지낸다는 증거예요."
text.0880: "{color:10}{partner}{color:1}은(는) 아주\n편안해 보여요. 뭔가\n좋은 일이 있었나 봐요?"
text.0918: "{color:10}{partner}{color:1}은(는) 스트레스가\n별로 없는 것 같아요.\n보통이라고 할 수 있어요."
text.09be: "{color:10}{partner}{color:1}은(는) 스트레스가\n조금 있어요. 훈련은 살살요."
text.0a40: "{color:10}{partner}{color:1}은(는) 스트레스가\n너무 많아요. 놀게 해 주세요."
text.0aac: "{color:10}{partner}{color:1}은(는) 스트레스가\n심해서 행복하지 않아요.\n너무 무리하면 안 돼요."
text.0b4e: "{color:10}{partner}{color:1}은(는) 스트레스가\n너무 심해요! 이대로 가면\n오래 못 살 거예요!"
text.0be4: "음.... 이게 {color:10}{partner}{color:1}에게\n해 줄 수 있는 최선이에요."
text.0c40: "또 필요한 게\n있어요?"
text.0c8e: "진찰받기\n약 사기\n됐어"
text.0cee: "음, 괜찮을 거예요."
text.0d26: "붕대: 400 Bits\n약: 1200 Bits\n안 산다"
text.0dca: "몸이 안 좋을 땐\n바로 찾아오세요."
text.0e50: "짐이 너무 많네요."
text.0ea8: "Bits가 모자라요.\n팔 수가 없어요."
text.0f28: "짐이 너무 많네요."
text.0f80: "Bits가 모자라요.\n팔 수가 없어요."
text.0fee: "또 필요한 게\n있어요?"
text.103c: "진찰받기\n약 사기\n됐어"
text.109c: "일을 바꿔서\n보물 사냥꾼이 됐어요."
text.1112: "보물 찾기를 맡기실래요?\n아니면 설명을\n들어 보실래요?"
text.11ac: "설명 듣기\n설명 안 듣기\n됐어"
text.121c: "기간과 가격이 다른\n두 가지 플랜이 있어요."
text.128e: "일반: 3일, 1000 Bits\n특별: 10일, 5000 Bits"
text.130a: "특별 플랜이 더 좋은\n보물을 찾을 확률이\n높아요."
text.139e: "설명은 이게 다예요.\n어떻게 하실래요?"
text.13fe: "다시 설명\n보물 찾기\n됐어"
text.145a: "플랜을 고르세요!"
text.147e: "일반: 3일, 1000 Bits\n특별: 10일, 5000 Bits\n취소"
text.1518: "그럼 안녕히 가세요."
text.1564: "결과는 3일 뒤에 나와요.\n행운을 빌어 주세요."
text.1602: "결과는 10일 뒤에 나와요.\n행운을 빌어 주세요."
text.1680: "Bits가 모자라요.\n보물을 찾으려면\n돈이 필요해요."
text.1734: "{color:7}표지판 {color:1}\n지금 보물을 찾는 중이에요.\n조금만 기다려 주세요.\n드리모게몬 드림."
text.17d6: "있잖아요,\n보물을 찾았어요."
text.1976: "짐을 좀 비워 주세요!"
text.19aa: "{color:6}{item:pstat=110}{color:1}을(를) 받았다!"
text.1af2: "이용해 주셔서 감사합니다!"
