text.0020: "카부테리몬을 이기고 싶어.\n이기려면 어떻게 해야 해?"
text.0098: "음. 더 강해져야지.\n사실 확실한 방법이\n있긴 한데.... 뭐, 힘내."
text.015e: "그렇구나. 좋아, 훈련할게."
text.019e: "정말?! 그럼 내가\n훈련시켜 줄게!"
text.01e8: "그냥 마을로 와."
text.0220: "..."
text.022c: "너 정말 착하구나.\n마을로 갈게."
text.02bc: "쿠와가몬이 마을로 갔다!"
text.0304: "뭐야, 하나도 안 착하네.\n실망이야!"
text.0368: "야, 너 그 곤충 배틀\n대회에 나가 봤지?"
text.03d8: "그럼 쓸모 있는 걸\n하나 가르쳐 줄게."
text.042a: "쿠네몬이 어디서 자는지\n알아? 원시의 숲에서?"
text.0496: "아기 디지몬들이 거기서\n잠을 자. 깨어나면\n쿠네몬이 되지."
text.051e: "그런데 가끔은 안 돼.\n운에 달렸지."
text.05a8: "야, 너 그 곤충 배틀\n대회에 나가 봤지?"
text.0618: "어... 지금 그대로는\n이기기 힘들 거야."
text.0676: "그럼 쓸모 있는 걸\n하나 가르쳐 줄게."
text.06c8: "쿠네몬이 어디서 자는지\n알아? 원시의 숲이야."
text.0734: "아기 디지몬들이 거기서\n잠을 자. 깨어나면\n쿠네몬이 되지."
text.07bc: "그런데 가끔은 안 돼.\n운에 달렸지."
text.0826: "야, 곤충 배틀 대회에\n나가 볼래?"
text.0890: "그게 뭔데?"
text.08b0: "22일 열 시까지\n등록해야 해."
text.0924: "엥???"
text.0938: "자세한 건 대회 날\n알려 줄 거야."
text.099c: "무슨 소리를\n하는 걸까?"
text.09ea: "열심히 훈련하겠지만\n쉬기도 해야지."
text.0a42: "한 시간 쉴까?"
text.0a7e: "쉬자\n쉬지 말자"
text.0ae0: "{color:5}훈련:\n해머 머신 {color:1}"
text.0b1e: "시작\n설명\n그만두기"
text.0b56: "일반\n보너스 도전\n그만두기"
text.0ba0: "해머 머신에 맞으면서\n튼튼해지는 훈련.\n방어력이 오른다."
text.0c3e: "다시 설명\n시작\n그만두기"
text.0c98: "{color:7}슬롯머신 {color:1}\n{color:6}△ 버튼으로\n그림 세 개를 맞추세요."
text.0d22: "{color:5}훈련: 러닝머신 {color:1}"
text.0d54: "시작\n설명\n그만두기"
text.0d8c: "일반\n보너스 도전\n그만두기"
text.0dd6: "움직이는 벨트와\n반대 방향으로 달린다.\n속도가 오른다."
text.0e5a: "다시 설명\n시작\n그만두기"
text.0eb4: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
