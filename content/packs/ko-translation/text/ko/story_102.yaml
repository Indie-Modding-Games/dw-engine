text.005a: "죄송해요, 등록 기간이\n이미 끝났어요.\n내년을 기다려 주세요."
text.00f4: "지금은 대회 기간이 아니라서\n저도 할 일이 없어요."
text.017c: "대회가 막 끝났어요.\n내년을 기다려 주세요."
text.01fc: "곤충형 디지몬이 아니네요.\n대회에 참가할 수 없어요."
text.027c: "대회에 참가하시겠어요?"
text.02c0: "설명을 듣는다\n안 듣는다"
text.02fe: "22일에는 곤충형\n디지몬만 참가하는\n대회가 열려요."
text.0390: "지금 바로\n등록할 수 있어요."
text.03e6: "곤충형 디지몬이\n아니면 대회에\n등록할 수 없어요."
text.047a: "우승하면 멋진 상품을\n드려요. 등록만 하세요."
text.04f4: "등록한다\n등록 안 한다"
text.0548: "지금은 대회 기간이 아니라서\n저도 할 일이 없어요."
text.05d0: "대회가 막 끝났어요.\n내년을 기다려 주세요."
text.0632: "' - {tournament:pstat=3}- '\n대회에 등록되어 있어요.\n취소하시겠어요?"
text.06bc: "취소 안 한다\n취소한다"
text.0706: "등록을 취소했어요."
text.0726: "정말 그렇게 하시겠어요?"
text.0764: "등록됐어요."
text.07a2: "오늘은 대회가 없어요."
text.0806: "등록하지 않은 분은\n들어갈 수 없어요."
text.0886: "아직 안 열었어요. 22일\n오전 10시부터 오후 11시\n사이에 등록하세요."
text.0950: "아쉽지만 대회는 끝났어요.\n내년에 또 오세요."
text.0a10: "아쉽네요.\n내년을 기약하세요."
text.0a60: "참가상으로 {color:6}왕고기{color:1}를\n받았다!"
text.0ac8: "아이템이 너무 많아.\n몇 개 버려야겠어."
text.0b30: "우승 상금:\n5000 Bits.\n우승 상품으로 {color:6}갑충 진주{color:1}를\n받았다!"
text.0c00: "아이템이 너무 많아!"
text.0c52: "준우승 상금:\n2000 Bits!\n준우승 상품으로 {color:6}뿔 투구{color:1}를\n받았다!"
text.0d22: "아이템이 너무 많아!"
text.0d6c: "준우승 상금:\n2000 Bits!\n준우승 상품으로 {color:6}가위 턱{color:1}을\n받았다!"
text.0e32: "아이템이 너무 많아!"
text.0ed6: "- D급 -\n성장기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.0fd4: "- C급 -\n성숙기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.10d6: "- B급 -\n성숙기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.11d8: "- A급 -\n완전체 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.12da: "- S급 -\n최강의 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\nA급 우승자만 참가 가능."
text.13d4: "- R급 -\n배틀 로열 대회:\n승리의 열쇠는 작전\n\n4인 배틀 로열,\n2라운드, 참가자 8명.\n참가 조건 ? 없음."
text.1508: "- 버전 1 컵 -\n버전 1 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 1 디지몬만 참가 가능."
text.1644: "- 버전 2 컵 -\n버전 2 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 2 디지몬만 참가 가능."
text.1780: "- 버전 3 컵 -\n버전 3 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 3 디지몬만 참가 가능."
text.18c8: "- 버전 4 컵 -\n버전 4 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 4 디지몬만 참가 가능."
text.1a0a: "- 버전 0 컵 -\n버전 1 ? 4에 속하지 않는\n최강 디지몬의\n시간제한 시합.\n일대일 시합, 3라운드,\n참가자 8명. 버전 1 ? 4가\n아닌 디지몬만 참가 가능."
text.1b70: "- 불꽃 컵 -\n불꽃 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 불꽃 속성\n디지몬만 참가 가능."
text.1caa: "- 격투 컵 -\n격투 스포츠의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 투지가 넘치는\n디지몬만 참가 가능."
text.1df4: "- 천둥바람 컵 -\n하늘의 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 천둥바람 속성\n디지몬만 참가 가능."
text.1f42: "- 냉기 컵 -\n냉기 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 얼음 속성\n디지몬만 참가 가능."
text.2074: "- 자연 컵 -\n자연 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 자연 속성\n디지몬만 참가 가능."
text.21c0: "- 메탈 컵 -\n기계 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 기계 속성\n디지몬만 참가 가능."
text.22fa: "- 오물 컵 -\n오물 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 오물 속성\n디지몬만 참가 가능."
text.2432: "- 공룡 컵 -\n고대의 혈통을 이은\n디지몬의 시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.2562: "- 날개 컵 -\n날개 달린 디지몬이\n힘을 겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.2674: "- 동물 컵 -\n야수의 혈통을 이은\n디지몬의 시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.27a8: "- 인간 컵 -\n인간형 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
