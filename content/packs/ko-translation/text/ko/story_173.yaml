text.0030: "되도록 푹 쉬게 해 줘.\n그게 디지몬 건강의\n비결이야."
text.00ca: "좋아. 마을이 어떻게\n커지고 번창하는지\n알려 줄게..."
text.014c: "성장기 디지몬이\n마을에 오면\n1점이 올라."
text.01cc: "그리고 성숙기\n디지몬이 마을에 오면\n2점이 올라."
text.025a: "완전체 디지몬이\n마을에 오면\n3점이 올라."
text.02da: "하지만 별로 쓸모없는\n성숙기 디지몬이\n셋 있어."
text.0366: "그 녀석들이 오면\n1점밖에 안 올라."
text.03de: "타입에 대해\n조금 알려 줄게."
text.0436: "상대가 네 파트너 디지몬과\n같은 타입이면\n싸우지 않을 수도 있어."
text.04d2: "그리고 디지몬의 타입이\n맞지 않으면 문 앞에서\n거절당할 수도 있어."
text.056c: "그것 말고는\n크게 걱정할 필요\n없을 거야."
text.05f2: "테이머 레벨에 대해\n알려 줄게."
text.063c: "디지몬을 완전체까지\n키우면 테이머 레벨이\n올라가."
text.06d0: "그리고 높은 등급 대회에서\n우승하는 것도\n아주 좋아."
text.075c: "자연스럽게 올라가니까\n너무 신경 쓰지\n않아도 돼."
text.07e8: "반대로 레벨이\n내려가지 않게\n조심해야 해."
text.0874: "디지몬이 사라지면\n테이머 레벨이\n틀림없이 내려가."
text.0900: "돌봄 실수가 잦아도\n내려갈 수 있어.\n조심해."
