text.0032: "때가 왔구나."
text.005e: "더 있고 싶지만\n엄마가 걱정하셔."
text.00b6: "고마워, {color:6}{tamer}{color:1}.\n이 은혜를 갚고 싶은데."
text.010e: "{color:7}토코몬 {color:1}\n우리를 잊지 마!"
text.014c: "우린 또 만날 거야.\n난 알아."
text.01c0: "정말 즐거웠어. 고마워."
text.01fa: "작별 파티를\n열어야겠어."
text.0258: "{color:10}{partner}{color:1}, 우리 모험은\n정말 멋졌어!"
