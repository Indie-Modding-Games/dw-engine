text.0020: "돌아왔구나, {color:6}{tamer}{color:1}."
text.004c: "난 지지몬의 기록 담당이야."
text.008a: "지지몬이 아는 걸 기록해서\n너한테 알려 주고 있어."
text.00e8: "뭘 해야 할지 모르겠으면\n나한테 물어봐. 어디로\n가면 좋을지 알려 줄게."
text.0184: "모든 디지몬이\n마을에 모였어.\n정말 고마워!"
text.0208: "내가 아는 걸 알려 줄게.\n어디 보자..."
text.0266: "그리고..."
text.0288: "그리고 또..."
text.0300: "숲에는 식물 디지몬이 있어.\n가까이 있을수록\n오히려 눈에 잘 안 띄어."
text.03e6: "곤충 디지몬은 초록이\n우거진 곳을 좋아해.\n마을 주변 같은 곳..."
text.04a6: "열대 정글에는 미로 같은\n숲이 있어. 강한 디지몬이\n그곳을 지키고 있지."
text.0578: "강에 사는 노인이\n누군가를 기다리고 있어."
text.0616: "따뜻한 물가를\n좋아하는 디지몬이 있어."
text.06b0: "묘지에는 유령이 있어.\n유령은 말 거는 걸 좋아해."
text.0752: "마을 꽃밭에 비밀이\n숨어 있어. 식물에게 다른\n식물에 대해 물어봐."
text.0828: "고대 공룡 지대는\n위험하지만, 한번\n가 보는 게 좋아."
text.08ec: "파노라마 산 안에는\n용암이 흘러. 더위를\n좋아하는 디지몬도 있지."
text.09a4: "더운 곳을 좋아하는 디지몬을\n추운 곳에 데려가는 건\n반칙이지만..."
text.0a88: "얼음 나라에는 함께 와 줄\n디지몬이 많아.\n서쪽으로 가 봐."
text.0b58: "대협곡 꼭대기에\n새 디지몬이 살아."
text.0bf8: "대협곡은 미로 같아.\n한번 들어가면\n빠져나오기 힘들어."
text.0cb0: "기어 사바나에는\n전기를 좋아하는\n디지몬이 있어."
text.0d60: "안개 숲에는 일찍 일어나는\n디지몬이 나타날지도 몰라."
text.0e02: "대협곡에는\n디지몬이 하는\n가게가 있어."
text.0ea6: "날갯짓 한 번으로\n파노라마 산을 넘는 날개 달린\n디지몬을 만날지도 몰라."
text.0f84: "기어 사바나는 높이 못 나는\n디지몬에게 딱 맞는 곳이야.\n거기를 찾아봐."
text.104e: "너를 알고 도전해 오는\n디지몬도 있을 거야."
text.10ee: "얼음 나라에는 동굴에 살면서\n다른 이를 불러들이는\n디지몬들이 있어."
text.11be: "열심히 일하는 디지몬에게는\n할 일이 끝나면 마을에\n와 달라고 부탁해 봐."
text.12a2: "안개 숲은 숨기에 딱 좋아.\n숨어 있는 디지몬을 이끄는\n것도 네 일이야."
text.137c: "네 소문이 퍼지면\n다시 와 봐."
text.141e: "얼음 나라 해안에\n거대한 그림자가 나타나.\n어쩌면 디지몬일지도."
text.14f6: "물건 모으기를 좋아하는\n디지몬을 도와줘.\n얼음 나라에 가 봐."
text.15b6: "파노라마 산 꼭대기에서\n마주치면 싸움을 거는\n디지몬이 있어."
text.1694: "하수도처럼 축축한 곳에도\n디지몬이 있어. 고민을\n해결해 줘."
text.176c: "용의 눈 호수 건너편에\n곤충 디지몬이 살고 있어.\n거기서 낚시를 해 봐."
text.1832: "안드로이드 디지몬은\n고장 나도 금방\n스스로 완전히 고칠 수 있어."
text.18fa: "위험을 두려워하면\n목표를 놓치게 돼."
text.1966: "위험한 절벽도 한 번쯤은\n올라가 볼 용기가\n있어야 해."
text.1a36: "도움이 필요한 이들에 대해\n마을에서 들리는 얘기에\n귀를 기울여 봐."
text.1afc: "얼마 전 아주 북적이는\n곳에 못된 녀석이\n이사 왔대. 어쩌면..."
text.1be0: "땅에 묻힌 오래된 석판이\n있다고 해. 하지만 누군가\n파내야 해."
text.1ca8: "정글에 희귀한 디지몬이\n나타나서 싸움을\n건대."
text.1d68: "나무에 사는 디지몬이\n있을지도 몰라. 누가 알겠어?"
text.1e16: "서쪽의 철의 도시에\n희귀한 디지몬이 나타나\n싸움을 걸지도 몰라."
text.1efa: "외계인 디지몬이 있어.\n언젠가 만날지도 몰라."
text.1f9e: "전설의 동물 디지몬이\n있어. 주인을 잃은\n집에 있대."
text.2076: "진짜 보물을 얻을 때까지\n나니몬을 계속\n찾아야 해."
text.2136: "마이오티스몬이 사라졌어.\n그의 저택에 남은\n단서를 따라가 봐."
text.21f0: "아직 모르는 디지몬도\n있지만, 중요한 일부터\n먼저 끝내!"
text.22c4: "마지막 디지몬은 네가\n마지막으로 가는 곳에서\n태어날 거야. 알겠어?"
