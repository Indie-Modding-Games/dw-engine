text.0038: "아, {color:6}{tamer}{color:1}와(과) {color:10}{partner}{color:1},\n왔구나."
text.0078: "난 배달부야.\n뭐든지 배달하지."
text.00cc: "너희가 옮길 수 있는 건\n너희 자신뿐이잖아, 그치?"
text.0132: "내가 너희를 태워 주면 어때?\n좋은 생각이지?"
text.0190: "어디든, 언제든\n데려다줄게.\n물론 돈은 받아."
text.0222: "안녕, {color:6}{tamer}{color:1}."
text.023c: "가끔 순찰하러\n기어 사바나에 돌아가."
text.029e: "기어 사바나 해변에\n가게가 몇 개 있대.\n본 적 있어?"
