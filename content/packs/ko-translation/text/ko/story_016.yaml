text.0048: "그루운."
text.005a: "그루운.루.루.."
text.007e: "뭔가가 되살아났다!"
text.00ce: " ? "
text.00dc: "나 예전에 마을에 살았어.\n너한테서 마을 냄새가 나."
text.0156: "우와!"
text.0166: "무서웠어. 마을을 떠났다가\n기억을 잃어버렸거든."
text.01ca: "그런데 네 덕분에\n이제 다 기억났어."
text.022a: "마을로 돌아가도\n될까?"
text.0274: "물론이지. 지금 마을은\n분명 예전보다 훨씬\n북적일 거야."
text.02f8: "정말? 좋아!\n열심히 할게!"
text.037c: "베타몬이 마을에 들어왔다!"
text.03c2: "여긴 내 영역이야!"
text.0402: "헤헤헤. 좋아!"
text.043c: "두고 봐!"
