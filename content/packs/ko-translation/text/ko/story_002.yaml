text.0060: "내가 이길 거야!"
text.0098: "좋아, 덤벼 봐!"
text.00d4: "다음엔 어떻게 될까?"
text.0122: "그게 될 리가 없지."
text.0168: "배고파."
text.0186: "먹이를 준다\n안 준다"
text.01de: "지금은 먹을 게 없어."
text.0266: "앗, 이건 줄 수 없어."
text.02b8: "맛있다..."
text.02de: "싸우자!"
text.032e: "이거 큰일인데.\n어떡하지?"
text.0380: "마을에 와서 먹은 만큼\n일해서 갚아!"
text.03e6: "알았어, 그렇게 할게.\n난 곤충형 디지몬\n쿠네몬이야. 반가워."
text.04c0: "쿠네몬이 마을에 들어왔다!"
text.0508: "다음엔 좀 가져와."
