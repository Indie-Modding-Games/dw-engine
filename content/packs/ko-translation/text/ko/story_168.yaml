text.00e0: "경기장 안내"
text.0108: "전적\n등급 대회 안내\n특별 대회 안내"
text.0188: "우승 횟수\n{tourn_won}회\n{tourn_wins}승 {tourn_lost}패"
text.01ea: "등급 대회는 누구나\n참가할 수 있어. 자주 열려."
text.025a: "하지만 높은 세대의\n디지몬은 낮은 등급 대회에\n나가면 안 돼."
text.02f2: "등록하고 대회가 열리기\n전에 디지몬이 진화하면\n출전할 수 없어."
text.039c: "특별 대회는 참가 조건이\n정해져 있고\n자주 열리지 않아."
text.0434: "마을에 참가자가\n부족하면\n아예 열리지도 않아."
text.04cc: "같은 대회는 1년에\n한두 번만 열려.\n일정을 미리 확인해."
text.058c: "{color:10}{partner}{color:1}, 네 별명을\n생각해 볼게... 세상을\n구한 영웅이니까."
text.061c: "어디 보자."
text.0648: "“무적의 {color:10}{partner}{color:1}”\n어때?"
text.0694: "“전설의 영웅 {color:10}{partner}{color:1}”\n어때?"
text.06e8: "“위대한 {color:10}{partner}{color:1}”\n어때?"
text.0732: "“평화의 수호자 {color:10}{partner}{color:1}”\n어때?"
text.077e: "“챔피언 {color:10}{partner}{color:1}”\n어때?"
text.07c8: "“용감한 {color:10}{partner}{color:1}”\n어때?"
text.0812: "“멋쟁이 {color:10}{partner}{color:1}”\n어때?"
text.085e: "“강력한 {color:10}{partner}{color:1}”\n어때?"
text.08aa: "“존엄한 {color:10}{partner}{color:1}”\n어때?"
text.08f2: "“천재 전략가 {color:10}{partner}{color:1}”\n어때?"
text.0946: "야, 그 자리는\n손님용이야."
text.0d0e: "- D급 -\n성장기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.0e0c: "- C급 -\n성숙기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.0f0e: "- B급 -\n성숙기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.1010: "- A급 -\n완전체 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.1112: "- S급 -\n최강의 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\nA급 우승자만 참가 가능."
text.120c: "- R급 -\n배틀 로열 대회:\n승리의 열쇠는 작전\n\n4인 배틀 로열,\n2라운드, 참가자 8명.\n참가 조건 ? 없음."
text.1340: "- 버전 1 컵 -\n버전 1 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 1 디지몬만 참가 가능."
text.147c: "- 버전 2 컵 -\n버전 2 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 2 디지몬만 참가 가능."
text.15b8: "- 버전 3 컵 -\n버전 3 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 3 디지몬만 참가 가능."
text.1700: "- 버전 4 컵 -\n버전 4 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 4 디지몬만 참가 가능."
text.1842: "- 버전 0 컵 -\n버전 1 ? 4에 속하지 않는\n최강 디지몬의\n시간제한 시합.\n일대일 시합, 3라운드,\n참가자 8명. 버전 1 ? 4가\n아닌 디지몬만 참가 가능."
text.19a8: "- 불꽃 컵 -\n불꽃 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 불꽃 속성\n디지몬만 참가 가능."
text.1ae2: "- 격투 컵 -\n격투 스포츠의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 투지가 넘치는\n디지몬만 참가 가능."
text.1c2c: "- 천둥바람 컵 -\n하늘의 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 천둥바람 속성\n디지몬만 참가 가능."
text.1d7a: "- 냉기 컵 -\n냉기 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 얼음 속성\n디지몬만 참가 가능."
text.1eac: "- 자연 컵 -\n자연 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 자연 속성\n디지몬만 참가 가능."
text.1ff8: "- 메탈 컵 -\n기계 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 기계 속성\n디지몬만 참가 가능."
text.2132: "- 오물 컵 -\n오물 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 오물 속성\n디지몬만 참가 가능."
text.226a: "- 공룡 컵 -\n고대의 혈통을 이은\n디지몬의 시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.239a: "- 날개 컵 -\n날개 달린 디지몬이\n힘을 겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.24ac: "- 동물 컵 -\n야수의 혈통을 이은\n디지몬의 시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.25e0: "- 인간 컵 -\n인간형 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
