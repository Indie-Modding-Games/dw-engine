text.0034: "냠, 냠."
text.004e: "저기..."
text.0064: "내 말 좀 들어 줘."
text.008e: "맛있다, 맛있어."
text.00b0: "부하들이 이제\n내 말을 듣지 않는군."
text.00f0: "내 명령을 기억하지\n못하는 것 같아."
text.014a: "가끔은 알아듣지도\n못하더군."
text.019a: "부하들이 식사를\n가져와야 하는데..."
text.01ea: "맛있다..."
text.0202: "일하는 동안 부하들이\n식사를 가져오지 않아서\n먹는 걸 잊고 있었다."
text.0294: "일에 너무\n빠져 있었구나."
text.02e2: "정말 부끄럽군."
text.0310: "저택에 무슨 문제가\n생긴 것 같아."
text.0366: "섬에 문제가? 다들 내\n부하들처럼 행동하는 건가?"
text.03da: "응, 다들 기억을\n잃어 가고 있어."
text.042c: "누군가 일부러 이러는\n거라고 생각하나?"
text.0478: "흐음"
text.0488: "내가 뭘 할 수 있지?"
text.04ac: "우린 디지몬의 마음을\n하나로 모을 마을을\n만들고 있어."
text.0512: "친구를 찾으러\n여행하고 있어."
text.055a: "내가 뭘 할 수 있겠나?\n내 부하들은 싸우는\n재주밖에 없는데."
text.05cc: "이 녀석들을 두고 갈 순 없어."
text.0604: "그렇구나..."
text.061c: "생각해 보겠다.\n정말 미안하지만..."
text.067e: "다음에 또 올게.\n밥 먹는 거 잊지 마."
text.06de: "시합에 나가 볼래?"
text.0712: "시합이라? 딱 좋군.\n부하들 기분 전환이 되겠어."
text.0776: "그럼, 함께할래?"
text.07a8: "그래. 하지만 여기서\n아직 할 연구가 있다.\n곧 가겠다."
