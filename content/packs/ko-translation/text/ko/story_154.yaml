text.003e: "누가 있다! 누구냐?!"
text.00c4: "헤헤, 나쁜 컴퓨터를\n부숴 버릴 거야! 헤헤헤!"
text.0284: "저 녀석이야... 야!\n야, 지금 뭐 하는 거야?!"
text.02f0: "그래! 부숴 버릴 거야!\n전부 다 부술 거야.\n나쁜 건 전부!"
text.04b2: "이런, 미쳐 버렸어.\n완전체 디지몬이지만\n꼭 막아야 해!"
text.054c: "헤헤헤,\n너희 모두 부숴 주마!"
text.06c4: "으아아악! 힘이 빠진다."
text.0702: "전기가 끊기고 있어.\n안드로몬에게 공장 폐수를\n멈춰 달라고 하자."
