text.004c: " {color:6}{tamer}{color:1}와(과) {color:10}{partner}{color:1},\n맞지? 볼륨 빌라에\n와 줘서 고맙다!"
text.00ca: "오타마몬한테 한 일은\n미안하게 됐다."
text.0122: "괜찮아."
text.0148: "응?"
text.0168: "고맙다. 이 섬을 구하려고\n열심히 애쓰고 있다고\n들었다."
text.0200: "그래?"
text.0218: "널 돕고 싶었다.\n여기서 바로 북쪽에 있는\n안개 숲에는 가 봤나?"
text.02ca: "아직."
text.02ee: "응."
text.02fe: "거긴 늘 안개가 껴 있지.\n돌아다니기 힘들\n거다."
text.0390: "그래도 숲의 우두머리\n체리몬은 만나 봐야\n한다."
text.041e: "체리몬? 그런 디지몬은\n처음 들어 봐."
text.0482: "안개 숲의 안개는\n체리몬이 만든다."
text.04d6: "위험으로부터 숲을 지키려고\n안개를 만든 거지."
text.0548: "하지만 우리한텐 골칫거리다."
text.0594: "체리몬은 섬에 생긴\n문제의 원인을 뭔가\n알고 있을 거다."
text.062e: "안개를 헤치고서라도\n만나 볼 가치가 있다."
text.0688: "안개를 어떻게 할 수만\n있다면."
text.06da: "안개를 걷을 수 있는 건\n체리몬뿐이다."
text.074a: "하지만 지나갈 방법은 있다.\n너한테 주문을 걸어 주마."
text.07be: "어떻게 되는데?"
text.07ee: "안개 속에서도\n길이 보이게 된다."
text.0860: "오, 그거 좋다!"
text.0888: "좋아, 그럼 시작한다."
text.08b8: "개굴, 개굴!"
text.08f6: "좋아. 완벽하다.\n자, 안개 숲으로 가라."
text.0974: "만나고 왔어.\n이제 안개가 걷혔어."
text.09ba: "오, 대단하군! 그럼\n내가 뭘 도와주면 되겠나?"
text.0a2a: "좋아, 이걸 주마."
text.0a6c: "{color:6}디지농어{color:1}를\n받았다!"
text.0abc: "다른 걸 버려라."
text.0b04: "아주 귀한 물건이다.\n쓸모가 있을 거다."
text.0b72: "고마워. 그럼 쇼군,\n마을에 와 주지 않을래?"
text.0bde: "난 게코 늪에 사는\n게코몬 백 마리의 우두머리다.\n미안하지만 같이 못 간다."
text.0c84: "대신 여기서 할 수 있는\n건 뭐든 하마.\n언제든 찾아와라."
text.0d58: "고민이 있는 모양이군.\n그 옷 얘기지?"
text.0dce: "알고 있어?"
text.0dfa: "날 얕보지 마라. 누메몬도\n그걸 입을 수 있게 될 거다."
text.0e68: "놀랐나? 그뿐만이 아니다.\n그걸 입으면... 믿기\n힘들걸... 뭐, 해 봐라."
text.0f4e: "그건 그렇고, 네 아이템에서\n{color:6}명품 낚싯대{color:1}를\n빼 가겠다."
text.0fe0: "특별한 아이템이다."
text.1022: "행운을 빈다!"
text.1052: "낚시는 용의 눈 호수에서만\n할 수 있다."
text.10a6: "물러서, 물러서!"
text.10da: "쇼군은 귀한 아이템을\n모으고 계셔. 예전엔\n아이템을 모으셨지."
text.1154: "그런데 요즘은 디지몬\n카드에 푹 빠지셨어."
text.11aa: "귀한 카드를 가져가면\n공적 포인트를\n주실 거야."
text.1222: "카드를 모아서\n공적 포인트를 받고\n아이템으로 바꿀 수 있어.{stop}{stop}"
text.12bc: "저기... 아냐, 아무것도. 개굴."
text.12fe: "저기... 나 마을에\n가고 싶어. 개굴!"
text.1362: "좋아, 그런데 무슨 일이야?"
text.1396: "경기장에서 싸우고 싶어.\n우리 게코몬 일족은{stop}"
text.142e: "시골 디지몬이라고\n무시당하는 것 같아. 개굴."
text.1494: "그래, 우린 시골 출신이지만\n우리도 자존심이 있다고!{stop}\n개굴."
text.1522: "그 마음 알겠어.\n그럼 해 봐. 힘내!"
text.1582: "게코몬이 경기장에 들어왔다!"
