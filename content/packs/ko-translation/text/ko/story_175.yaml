text.0050: "제 식당에 어서 오세요."
text.0088: "이 식당의\n주인 겸 요리사가\n되기로 했어요."
text.0104: "제 불꽃 요리를\n마음껏 즐기세요."
text.0180: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\n제 집밥 한번\n먹어 볼래요?"
text.01d6: "주워 먹는 아이템과는 달리\n이건 진짜 요리예요.\n제 숨은 재주랍니다."
text.027c: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\n요리로 먹고살기로 했어요.\n솜씨는 자신 있어요!"
text.02f6: "언제 한번\n제 식당에서 편하게\n밥 먹고 가요."
text.037e: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}.\n드디어 제 식당을\n열었어요!"
text.03d4: "얼음 디저트를 먹어 봐요!\n제 특기예요."
text.044a: "{color:6}{tamer}{color:1}, 이 식당에서\n요리사로 일하기로\n했어요."
text.04c2: "여기서 따끈한\n식사를 즐겨요."
text.0520: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\n이제 저도 프로 요리사예요!"
text.0572: "제 요리를 먹고 싶으면\n아침에 오는 게\n좋을 거예요!"
text.0614: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\n요리로 먹고살기로 했어요.\n솜씨는 자신 있어요!"
text.068e: "제 특제 요리는\n이른 아침과 한밤중에\n먹을 수 있어요."
text.0750: "어서 와요, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
text.0770: "이 식당 일을 돕기로\n했어요. 디저트는\n제가 맡았답니다."
text.07ee: "제 디저트는 정말\n자신 있어요.\n꼭 먹어 봐요, 알았죠?"
text.08a8: "우와! 저기, {color:6}{tamer}{color:1}!\n이 기계는 뭐에 쓰는 거야?"
text.08fa: "겁먹지 마요! 제 심장을\n두근거리게 하는\n주크박스예요! 좋아!"
text.098a: "신나게 춤춰 봐요!\n자, 몸을 맡겨요! 주문은\n언제든 기다릴게요!"
