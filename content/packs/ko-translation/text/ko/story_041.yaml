text.0058: "잘 안 되네!"
text.0096: "뭐라고 했어?"
text.00d8: "불가능하다고 했잖아."
text.0124: "별로 자신이 없어."
text.0174: "살살 해 줘."
text.01a6: "날 놀리지 마!"
text.01ee: "엘리베이터"
text.0206: "옥상\n위로\n안 탄다"
text.026e: "아무 반응이 없어."
text.02ba: "기계에 바위가 끼어\n있어. 혹시 이게..."
text.0334: "바위를 치웠다!"
text.0362: "이제 될 거야!"
text.03fe: "아무 반응이 없어."
text.044a: "기계에 바위가 끼어\n있어. 혹시 이게..."
text.04bc: "바위를 치웠다!{stop}"
text.04fe: "이제 될 거야."
