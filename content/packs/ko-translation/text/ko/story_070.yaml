text.00ac: "나 또 왔어."
text.00da: "안녕!"
text.00fa: "이대로 가다간 계속\n제자리만 맴돌겠어."
text.0168: "여기서 기다리는 게 좋겠어."
text.01c4: "누구야?"
text.01e0: "말도 안 돼."
text.0206: "으아아!"
text.0228: "기다려!"
text.027a: "또야! 기다려!"
text.02d6: "또야! 기다려!"
text.0332: "또야! 기다려!"
text.038e: "또야! 기다려!"
text.04c6: "일단 기다려 볼까."
text.04ec: "기다린다\n간다"
text.0524: "좋아, {color:10}{partner}{color:1},\n비요몬을 잡아!"
text.05aa: "엉뚱한 데로 가 버렸어!"
text.0612: "일단 기다려 볼까."
text.0638: "기다린다\n간다"
text.0670: "좋아, {color:10}{partner}{color:1},\n비요몬을 잡아!"
text.06f6: "엉뚱한 데로 가 버렸어!"
text.075c: "일단 기다려 볼까."
text.0782: "기다린다\n간다"
text.07ba: "좋아, {color:10}{partner}{color:1},\n비요몬을 잡아!"
text.0840: "엉뚱한 데로 가 버렸어!"
text.08a6: "일단 기다려 볼까."
text.08cc: "기다린다\n간다"
text.0904: "좋아, {color:10}{partner}{color:1},\n비요몬을 잡아!"
text.098a: "엉뚱한 데로 가 버렸어!"
text.09ea: "매복 작전 성공!"
text.0a26: "살려 줘!"
text.0a4a: "진정해. 우린\n나쁜 녀석들이 아니야."
text.0aac: "네가 그 유명한\n디지몬 납치범이야?"
text.0b02: "다들 뭔가 오해하고\n있는 것 같아."
text.0b5e: "{color:6}{tamer}{color:1}은(는)\n오해를 풀려고 설득했다."
text.0ba0: "그렇구나. 내가 잘못 알았어."
text.0bd6: "마을로 갈게."
text.0c66: "비요몬이 마을에 들어왔다!"
text.0cc4: "잡을 수 있으면 잡아 봐!"
text.0cfa: "용감한데!"
text.0d2a: "우와!"
text.0d48: "내가 먼저야!"
text.0d72: "난 강해.\n넌 날 못 당해!"
text.0dc8: "내가 이겨도 화내지 마."
