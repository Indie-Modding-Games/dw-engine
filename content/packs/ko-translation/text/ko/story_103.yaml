text.0020: "여기서 훈련하는 것도 지겨워.\n뭘 하면 좋을까?"
text.0082: "뭘 하지?"
text.00a0: "어디서 훈련하는데?"
text.00da: "거기 훈련장이야?"
text.0116: "훈련은 이제 지겨워.\n진짜 배틀을 하고 싶어."
text.0180: "훈련장일지도 몰라\n경기장일지도 몰라"
text.01ee: "훈련은 이제 지겨워.\n진짜 배틀을 하고 싶어."
text.0258: "거기 가고 싶어.\n거기서 훈련할래."
text.02e2: "카부테리몬이 마을에 들어왔다!"
text.032a: "곤충 전사 대회는\n매년 여기서\n열려..."
text.03ae: "...2가 두 번 겹치는 날에.\n우승하면 굉장한 상품을 줘!"
text.0422: "하지만 곤충형 디지몬만\n참가할 수 있어."
text.0480: "카부테리몬, 쿠라가몬,\n쿠네몬, 그리고\n곤충형 하나가 더 있어."
text.0508: "하지만 누메몬은 안 돼."
text.052e: "2가 두 번 겹치는 날이면\n매년 곤충 전사 대회가\n열려."
text.05ce: "전에 우승한 적 있지?"
text.060a: "카부테리몬, 쿠라가몬,\n쿠네몬, 그리고\n곤충형 하나가 더 있어."
text.0692: "그건 헤라클레스카부테리몬이야."
text.06ce: "헤라클레스카부테리몬은\n엄청 강해."
text.071e: "대회에서 우승하면\n헤라클레스카부테리몬이 되고\n아이템도 받을 수 있어."
text.07a6: "곤충 전사 대회에는\n몇 번이고 참가할 수 있어."
text.0824: "넌 강하구나.\n내가 가르칠 게 없어."
text.0886: "우린 기술을 연구하고 있어.\n어려운 기술은\n익히기가 힘들지."
text.091a: "능력만 있으면 기술을\n익힐 수 있을지도 몰라.\n어려운 기술 배워 볼래?"
text.09c8: "당연하지!\n아니, 됐어"
text.0a06: "그럼 한번 해 볼게."
text.0a3e: "방어력이 부족해.\n더 훈련하고 와."
text.0aa0: "속도가 부족해.\n더 훈련하고 와."
text.0aee: "HP가 부족해.\n더 훈련하고 와."
text.0b2a: "기술을 습득했다."
text.0b64: "“버그”를 습득했다!"
text.0bb4: "{color:5}훈련: 바위 밀기 {color:1}"
text.0bec: "시작\n설명\n그만두기"
text.0c22: "일반\n보너스 도전\n그만두기"
text.0c5e: "바위를 밀어서 힘을\n기르는 훈련. 최대\nHP가 크게 오른다."
text.0ce4: "다시 설명\n시작\n그만두기"
text.0d3e: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.0dc0: "{color:5}훈련: 펀치 {color:1}"
text.0df0: "시작\n설명\n그만두기"
text.0e28: "일반\n보너스 도전\n그만두기"
text.0e66: "인형을 있는 힘껏\n치는 훈련. 공격력이\n크게 오른다."
text.0efc: "다시 설명\n시작\n그만두기"
text.0f56: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
