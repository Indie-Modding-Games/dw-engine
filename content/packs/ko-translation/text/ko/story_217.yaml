text.0020: "자, 뭘 주문하실래요?"
text.0080: "뭘 드시겠어요?"
text.00cc: "자, 뭐 드실래요?"
text.0110: "빨간 라멘: 400 Bits\n매운 카레: 1200 Bits\n용암 전골: 3500 Bits"
text.01e0: "Bits가 모자란\n것 같네요."
text.0246: "{color:10}{partner}{color:1}(은)는\n화끈한 빨간 라멘을\n맛있게 먹었다!"
text.02b4: "공격력이 1 올랐다!\n지능이 1 올랐다!"
text.0320: "행복이 올랐다!\n피로가 줄었다!"
text.0386: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.03e0: "Bits가 모자란\n것 같네요."
text.0446: "{color:10}{partner}{color:1}(은)는\n불타는 매운 카레를\n맛있게 먹었다!"
text.04bc: "공격력이\n3 올랐다!\n지능이 2 올랐다!"
text.0532: "행복이 올랐다!\n피로가 줄었다."
text.0598: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.05f2: "Bits가 모자란\n것 같네요."
text.0658: "{color:10}{partner}{color:1}(은)는\n용암 전골을 맛있게 먹었다!"
text.06c4: "공격력이\n5 올랐다!\n지능이 3 올랐다!"
text.073c: "행복이 올랐다!\n규율이 떨어졌다!\n피로가 줄었다!"
text.07ce: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.0814: "언제든 또 오세요."
text.0842: "드래곤 국수: 400 Bits\n자우루스 피자: 1000 Bits\n쥬라기 버거: 2500 Bits"
text.091a: "Bits가 모자라요."
text.096a: "{color:10}{partner}{color:1}(은)는\n야생 드래곤 국수를\n맛있게 먹었다."
text.09e2: "방어력이 1 올랐다!\n속도가 1 올랐다!"
text.0a4c: "행복이 올랐다!\n피로가 줄었다."
text.0ab2: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.0b0c: "Bits가 모자라요."
text.0b5c: "{color:10}{partner}{color:1}(은)는\n자우루스 피자를\n맛있게 먹었다!"
text.0bc8: "방어력이\n3 올랐다!\n속도가 2 올랐다!"
text.0c30: "행복이 올랐다!\n피로가 줄었다."
text.0c96: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.0cf0: "Bits가 모자라요."
text.0d40: "{color:10}{partner}{color:1}(은)는\n쥬라기 버거를 맛있게 먹었다!"
text.0db6: "방어력이\n5 올랐다!\n속도가 3 올랐다!"
text.0e30: "행복이 올랐다!\n규율이 올랐다!\n피로가 줄었다."
text.0ebe: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.0f04: "어, 벌써 끝났네요."
text.0f3a: "티본 스테이크: 1000 Bits\nDX 스테이크: 2500 Bits\n환상의 스테이크: 5000 Bits"
text.1012: "Bits가 모자라요."
text.1062: "{color:10}{partner}{color:1}(은)는\n티본 스테이크를\n맛있게 먹었다!"
text.10ce: "HP가 10 올랐다!\n지능이 1 올랐다!"
text.111a: "규율이 올랐다\n피로가 줄었다."
text.1180: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.11da: "Bits가 모자라요."
text.122a: "{color:10}{partner}{color:1}(은)는\nDX 스테이크를 맛있게 먹었다!"
text.129c: "HP가 30 올랐다!\n지능이 2 올랐다!"
text.12fa: "행복이 올랐다!\n규율이 올랐다!\n피로가 줄었다!"
text.1388: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.13e2: "Bits가 모자라요."
text.1432: "{color:10}{partner}{color:1}(은)는\n환상의 스테이크를\n맛있게 먹었다!"
text.14ae: "HP가 50 올랐다!\n지능이 3 올랐다!"
text.150a: "행복이 올랐다!\n규율이 올랐다!\n피로가 줄었다!"
text.1598: "{color:10}{partner}{color:1}(은)는\n배가 안 고픈 것 같다."
text.15de: "또 오세요!"
