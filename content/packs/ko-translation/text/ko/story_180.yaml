text.006c: "몸이 안 좋아."
text.0098: "괜찮아?"
text.00c0: "기분이 별로야."
text.00ec: "여기가 네 집이야?"
text.0122: "속이 안 좋아. 힘이 없어."
text.0158: "얼굴이 말이 아니네."
text.017e: "점점 심해져."
text.01ac: "원인을 알아내야겠어."
text.01e6: "이 더러운 물은\n어디서 흘러오는 거지?\n내가 알아볼게!"
text.0282: "이게 뭐지?"
text.02b2: "무슨 일이야, {color:10}{partner}{color:1}?!"
text.02ea: "이 안개, 냄새 지독해!"
text.0312: "이상해, 왠지 역겨워."
text.0350: "좋아, 하수도가\n원래대로 돌아왔어."
text.039a: "이제 괜찮아질 거야.\n문제는 해결했어."
text.040c: "뭔가 이상해!"
text.0450: "다다다!"
text.04bc: "피곤해.\n너희 무슨 일 있었어?"
text.050e: "더 바보 같아졌어!\n정신이 돌아왔나 봐."
text.0574: "날 바보라고 했어?\n무례하긴! 난 누메몬이야."
text.05e8: "바보가 아니면\n대체 뭔데?"
text.0630: "저기, 누메몬. 누가\n널 구해 줬는지 알아?"
text.06a0: "응? 네 목숨을\n구해 달라고? 좋아."
text.06fc: "으으. 하나도 못\n알아듣네! 뭐, 됐어."
text.0766: "와, 내가 구세주라니. 멋져!"
text.07ae: "우리 마을에 와 줘.\n어딘지 알아?"
text.081c: "대충 알아."
text.087c: "누메몬이 마을에 들어왔다!"
text.08ce: "누구야?!"
text.08ec: "넌 누구야?!"
text.0984: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 20개까지\n가질 수 있다!"
text.0a46: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 30개까지\n가질 수 있다!"
