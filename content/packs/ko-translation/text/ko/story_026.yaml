text.0076: "오, 정말 고마워!"
text.00a6: "뭐? 한판 붙자고?"
text.00f4: "오, 진짜 고마워!"
text.0120: "놔둬!"
text.0154: "무리하지 마!"
text.0186: "덤벼라, 꼬맹이!"
text.01c0: "항복이야!"
text.01de: "두목이 사라졌다."
text.0262: "어이, 너희들! 여기를\n지나가고 싶으면\n짐을 전부 두고 가!{stop}"
text.02ec: "오랜만이군."
text.0316: "흠. 또 너희냐!"
text.0346: "그건 내가 할 말이야!\n찾기 정말 쉽더라.\n질 준비는 됐어?"
text.03c6: "지냐고? 천만에!\n내가 진심을 내면\n어떤지 보여 주마!"
text.0444: "이번에야말로\n결판을 내자!"
text.04de: "어째서... 못 이기는 거지?"
text.0520: "왜 그래?\n도망 안 가?"
text.0578: "너무 지쳤어."
text.059c: "..."
text.05aa: "이 섬은 이제 끝장이라고\n생각해서 산적이 됐어.\n그래서 멋대로 굴었지."
text.0654: "섬이 위험하다는 걸\n알고 있었어?"
text.06aa: "그래, 그러다 네가 나타났지.\n이제 와서 널 돕는 것도\n우스운 일이겠지."
text.0742: "그렇지 않아.\n마을로 와."
text.0794: "아니, 못 가. 게다가 내가\n저지른 일을 용서해 줄\n녀석은 없을 거야."
text.083e: "아, 잔말 말고\n같이 가자!"
text.089c: "너도 도움이 될 수 있어!\n누구나 할 수 있는 일이\n있다고!"
text.090c: "!!!"
text.0922: "이 섬을 구할 수 있을까?\n네가 우리를 위해\n구해 줄 거지?!"
text.09ba: "물론이지! 마을이 어딘지\n알지?"
text.0a1c: "오오오오!\n당장 갈게!"
text.0a84: "오거몬이 마을에 들어왔다!"
text.0ad6: "앗!\n출구는 이쪽이 아니야!"
text.0b32: "앗, 흙 상자를\n드리모게몬에게 돌려줘야 해!"
text.0be6: "앗! 출구는 이쪽이 아니야!"
text.0c42: "앗, 흙 상자를\n드리모게몬에게 돌려줘야 해!"
