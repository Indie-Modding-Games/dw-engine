text.00ce: "하하, 날 건드리면\n찌릿찌릿 감전될걸."
text.016a: "여기 있기 싫어?"
text.01ee: "우와, 대단해! 배짱 좋은데."
text.022c: "넌 크게 될 거야!\n좋아, 도와줄게."
text.029a: "네 전기의 힘을\n마을을 위해 써 주지 않을래?"
text.0300: "마을? 그게 뭔데?\n어디서 들어 본 것 같은데..."
text.035a: "도와줄게. 난 엘렉몬이야.\n잘 부탁해."
text.03ec: "엘렉몬이 마을에 들어왔다!"
text.0432: "으윽!"
text.0454: "으아아!"
text.0474: "넌 이제 끝장이야!"
text.04ac: "제법인데."
text.04d2: "보는 눈이 없구나."
text.050e: "건방지긴! 혼 좀 내 주지."
text.057e: "이 철문은 단단해.\n열리지 않으면\n들어갈 수가 없어."
