text.0060: "디지몬 카드 가게예요."
text.00a0: "디지몬 카드가 뭐야?"
text.00d4: "다들 모으고 있어요.\n모아 두면 손해 볼 일 없죠."
text.0146: "그래?"
text.0158: "처음이니까 한 장 공짜로\n드릴게요. 좋은 거예요."
text.01ca: "어! 이 카드 나잖아!"
text.0206: "{color:6}{tamer}{color:1} 카드를 받았다!"
text.0236: "디지몬 카드 가게예요."
text.027e: "오늘은 정말 멋진 카드가\n들어와 있어요."
text.02da: "카드를 살래\n카드를 팔래\n그만두기"
text.0348: "3장 팩 사기\n1장 사기\n그만두기"
text.03a0: "1장 사기\n그만두기"
text.03cc: "한 팩에 500 Bits예요.\n뭐가 들었는지는 몰라요."
text.0442: "살게\n괜찮아"
text.0488: "바로 팩을 열어 보세요."
text.04e8: "다른 거 필요하세요?"
text.0526: "또 오세요."
text.0552: "재활용품 가게예요."
text.0594: "일반 아이템을 원해\n재활용 아이템을 원해\n다음에 올게"
text.0676: "어라!?"
text.0690: "가게잖아!"
