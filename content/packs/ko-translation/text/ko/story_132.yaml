text.0028: "여기가 어디지?\n꿈인가?"
text.008c: "우와! 넌 누구야?\n{color:10}{partner}{color:1}은(는) 어디 있어?"
text.00e2: "진정해. 내 이름은\n프리지몬. 여긴 내 집이야.\n난 얼음눈 디지몬이야."
text.017c: "네가 눈 속에서 기절해\n있길래 데려와서\n돌봐 줬어."
text.0218: "아, {color:10}{partner}{color:1}.\n무사해서 다행이야!"
text.025c: "야, 듣고 있어?\n내가 못 찾았으면\n넌 벌써 죽었을 거야!"
text.02f6: "아, 미안. 정말 고마워."
text.033e: "야, {color:10}{partner}{color:1},\n네가 갑자기 쓰러질 때\n나 머리까지 부딪혔어."
text.03be: "{digimon:pstat=103}은(는) 추위에\n약해. 넌 너무 무모해.\n전부 네 탓이야."
text.0452: "몰랐어.\n미안해, {color:10}{partner}{color:1}."
text.049e: "고마워, 프리지몬. 부탁\n하나만 더 해도 될까?"
text.0504: "{digimon:pstat=103}이(가) 또\n쓰러지면 어쩌려고?\n얼른 돌아가는 게 좋아!"
text.058e: "알았어, 알았어.\n{color:10}{partner}{color:1}을(를) 다른\n디지몬으로 진화시킬게."
text.062c: "진화?"
text.06c8: "또 왔구나."
text.06e8: "다른 디지몬은\n어떻게 됐어?"
text.0732: "아, 같은 애야."
text.076a: "응? 그런 거야?\n잘 모르겠네."
text.07bc: "부탁할 게 있어서 왔어.\n네가 마을에 와\n줬으면 해."
text.0850: "가면 나한테 뭐가 좋은데?\n재밌는 거 있어?"
text.08b6: "음, 원하는 가게를\n열 수 있어."
text.0914: "우와, 그거 꼭 해 보고\n싶었어. 좋아, 갈게!"
text.0980: "좋아, 그거 괜찮네.\n그럼 지금 가자."
text.09d8: "가게다! 빙수랑\n아이스크림. 이거\n최고겠는데!"
text.0a94: "프리지몬이 마을에 들어왔다!"
text.0ad6: "그 디지몬은 추위에\n정말 약하구나!"
text.0b36: "다시 올게!"
