text.0438: "{color:1}하양 하양 하양\n{color:2}파랑 파랑 파랑\n{color:3}빨강 빨강 빨강\n{color:4}분홍 {color:5}초록\n{color:6}하늘 하늘\n{color:7}노랑 {color:10}주황\n{color:10}a {color:6}b {color:4}c {color:5}d"
text.051c: "지금은\n{num:pstat=105}월 {num:pstat=106}일\n{num:pstat=107}: {num:pstat=108}이야."
text.0582: "난 워프 씨야.\n어디로 가고 싶어?"
text.05d6: "가까운 곳\n먼 곳\n아주 먼 곳"
text.0620: "파노라마 산 정상\n열대 정글\n드릴 터널"
text.069e: "기어 사바나\n회색 영주의 저택\n대협곡"
text.070c: "고대 공룡 지대: 문\n고대 공룡 지대: 안쪽\n미지의 세계"
text.07b6: "컬링 동굴 앞\n시드라 낚시\n용암 동굴"
text.083e: "목숨 세 개"
text.085a: "난 진화 씨야.\n뭐가 되고 싶어?"
text.08bc: "누메몬\n스카몬\n보타몬"
text.0a50: "빈사 상태\n오프닝 모드\n시간 빨리 감기"
text.0acc: "1시간 앞으로\n6시간 앞으로\n10일 앞으로"
text.0b76: "고기 좀 먹을래?"
text.0bae: "아, 미안.\n설명하는 걸 깜빡했네."
text.0bfa: "여긴 고기 농장이야.\n모두를 위해 고기를 길러."
text.0c60: "농장에서 고기를 기른다고?"
text.0c98: "응, 뭐가 이상해?"
text.0cc4: "아니... 괜찮아.\n계속해..."
text.0d20: "지지랑 의논해서\n{color:6}{tamer}{color:1}에게 하루에\n고기를 3개씩 주기로 했어."
text.0da4: "자, 오늘의 고기야."
text.0df6: "고기가 너무 많구나.\n오늘은 필요\n없겠네."
text.0e82: "고기가 너무 많구나.\n못 가져가는 건\n내가 맡아 둘게."
text.0efa: "{color:6}고기{color:1}를 3개\n받았다!"
text.0f52: "아이템이 너무 많구나."
text.0f8a: "{color:6}고기{color:1}를 3개\n받았다!"
text.0fea: "고기를 많이 수확했어!\n그러니까 오늘은\n고기를 5개 줄게."
text.1088: "고기가 너무 많구나.\n오늘은 필요\n없겠네."
text.1110: "고기가 너무 많구나.\n못 가져가는 건\n내가 기꺼이 맡아 둘게"
text.1192: "{color:6}고기{color:1}를 5개\n받았다!"
text.11f0: "미안하지만\n아이템이 너무 많구나."
text.1246: "{color:6}고기{color:1}를 5개\n받았다!"
text.1286: "내일 또 줄게."
text.12d8: "자, 오늘의 고기야."
text.131e: "고기가 너무 많구나.\n오늘은 필요\n없겠네."
text.13a6: "고기가 너무 많구나.\n못 가져가는 건\n내가 기꺼이 맡아 둘게."
text.142a: "{color:6}고기{color:1}를 3개\n받았다!"
text.148a: "아이템이 너무 많구나."
text.14c4: "{color:6}고기{color:1}를 3개\n받았다!"
text.1506: "내일 또 줄게."
text.154c: "응? 오늘은 고기를\n이미 줬잖아, 기억 안 나?"
text.159e: "먹을 게 떨어지면\n원시의 숲에서\n버섯을 찾아봐."
text.1620: "좋아, 이 마을 주변에 대해\n설명해 줄게."
text.1692: "원시의 숲이\n마을을 둘러싸고 있어."
text.16da: "그 근처 디지몬은\n그렇게 세지 않아."
text.173a: "서쪽에는 훈련장이 있어.\n아마 자주 가게\n될 거야."
text.17d4: "강 건너 동쪽에는\n열대 정글이 있어."
text.1846: "그 너머는 나도 몰라."
text.1888: "서쪽에는 산과 호수가\n있는데\n막다른 곳이야."
text.1910: "남쪽으로 계속 가면\n바다가 나와."
text.196a: "그리고 북쪽엔 높은 산이\n있어. 거기도\n막다른 곳이야."
text.19ee: "이 마을이 섬의 한가운데니까\n북쪽에는 분명\n넓은 땅이 있을 거야."
text.1a9c: "바깥 지역에 대한\n소문을 알아볼게.\n다시 오면 더 알려 줄게."
