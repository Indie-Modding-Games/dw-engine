text.0034: "어서 오세요! 새로 시작한\n“아이템 보관소”예요.\n아이템을 맡아 드려요."
text.00c0: "특별 서비스로 아이템을\n무료로 맡아 드릴게요."
text.0144: "진화에 대해서...\n성숙기 디지몬 다음\n세대 말인데..."
text.01e4: "그게 완전체 디지몬이야.\n성숙기 다음에 꼭\n진화하는 건 아니래."
text.0286: "진화하려면 정해진\n조건을 정확히\n갖춰야 한대."
text.030e: "하지만 완전체 디지몬으로\n진화하면 수명이\n늘어난대."
text.03a8: "하지만 진화 아이템을 먹고\n진화하면 수명은\n그대로래."
text.0464: "진화 얘기 하나 더.\n조건에 대해서야."
text.04c6: "우선 체중이 목표\n체중에 가까워야\n한대."
text.0560: "그리고 능력치는\n높을수록 좋대."
text.05b8: "하지만 어떤 능력치가\n더 높으냐에 따라\n결과가 달라진대."
text.0644: "돌봄 실수 말인데,\n경우에 따라선 일부러\n실수하는 게 나을 때도 있어."
text.06d8: "진화할 대상에 따라\n갖춰야 하는\n조건이 있대."
text.0768: "진화를 일으키는\n상황도 있대."
text.07da: "배틀 횟수라든가\n규율이 잘 잡혔는지 같은 거."
text.0850: "그 조건만 갖추면\n다른 조건이 모자라도\n진화할 수 있대."
text.08fc: "지지한테 들었는데\n{color:10}{partner}{color:1}이(가) 곧 진화한대."
text.0956: "유아기 디지몬에서\n유년기 디지몬까지는\n6시간밖에 안 걸려."
text.09e2: "거기서 성장기\n디지몬으로 진화하는 데는\n하루쯤 걸려."
text.0a68: "그다음 성숙기\n디지몬으로 진화하는 데는\n3일쯤 걸려."
text.0b02: "그다음 세대는 뭐였더라?\n까먹었는데,\n더 있어."
text.0b82: "진화는 체중, 능력치,\n돌봄 실수와\n관계가 있어."
text.0c0a: "잘 모르겠어.\n다음에 지지한테\n물어봐야지."
