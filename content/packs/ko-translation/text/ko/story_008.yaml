text.004e: "드릴 터널"
text.0084: "보통\n오거 모드"
text.00ec: "저 녀석! 무례하기는!"
text.012e: "응?"
text.015a: "{color:7}시장 관리인 {color:1}\n지나가는 데 돈을 내야\n할 줄은 몰랐어!"
text.01f6: "{color:7}시장 관리인 {color:1}\n어, 너 혹시... 맞아!\n어떻게 좀 해 줘!"
text.026c: "안에 있는 드리모게몬들은\n괜찮아?"
text.02b0: "{color:7}시장 관리인 {color:1}\n모르겠어."
text.02f6: "다들 무사하면 좋겠는데.\n좋아, 간다!"
text.0362: "{color:7}시장 관리인 {color:1}\n빨리 어떻게 좀 해 줘!"
text.03f8: "터널엔 이제 아무것도\n없어... 그냥 지나갈까,\n말까?"
text.047e: "지나가자!\n그만두자"
