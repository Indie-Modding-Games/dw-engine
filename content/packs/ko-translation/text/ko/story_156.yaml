text.0042: "개조해 드릴게요.\n요금은 2000 Bits예요."
text.00be: "스타일이 달라서\n개조할 수 없어요."
text.011a: "해 줘\n괜찮아"
text.015a: "Bits가 모자라요."
text.01a0: "잠깐만요."
text.01d4: "잘 안 됐지만..."
text.0214: "우와, 기로몬이 됐다!"
text.0262: "성공했어요!"
text.029a: "우와,\n메탈마메몬이 됐다!"
text.02e6: "잘 안 됐어요."
text.030c: "이럴 수가!"
text.032e: "죄송해요..."
text.0350: "덧셈, 소거!"
text.0392: "최우선 목표는\n하드웨어 파괴다."
