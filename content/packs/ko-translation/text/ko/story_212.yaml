text.0022: "{color:10}{partner}{color:1}(이)가\n사라져 버린 것 같구나..."
text.0064: "사라지기 전에 디지타마를\n남겼단다. 지금의 능력을\n이어받아 다시 태어날 거야."
text.0116: "어떤 알로 할래?"
text.0158: "원한다면 {color:10}{partner}{color:1}의\n이름을 바꿔도 된단다."
text.01b0: "새 이름을 지을래\n이름은 그대로 둘래"
text.0214: "{color:10}{partner}{color:1}(으)로 괜찮니?"
text.0234: "다른 이름으로 할래\n좋아"
text.02a0: "얘, 병에 걸리면 안 된다!"
text.02ce: "얼마 남지 않은 생명으로\n{color:10}{partner}{color:1}(은)는 겨우\n살아남았다."
text.0346: "조심해야 한단다."
text.0384: "이런 세상에!\n싸움에 지고 돌아왔구나."
text.03d4: "얼마 남지 않은 생명으로\n{color:10}{partner}{color:1}(은)는 겨우\n살아남았다."
text.044c: "물건을 도둑맞았을지도 몰라."
text.048e: "배틀에서 지면 물건을\n도둑맞을 수도 있단다."
text.0502: "도둑맞은 물건은 어딘가에서\n팔리고 있을지도 몰라.\n포기하지 말고 찾아보거라!"
text.059e: "이런! {color:10}{partner}{color:1}의\n생명이 다하고 말았구나."
text.05de: "사라지기 전에\n{color:10}{partner}{color:1}(은)는\n디지타마를 남겼다."
text.0646: "위험한 상황이었던 탓에\n디지타마는 능력을\n전부 이어받지 못했다..."
text.06d8: "{color:4}테이머 레벨이\n내려갔다! {color:1}"
text.0726: "원한다면\n{color:10}{partner}{color:1}의\n이름을 바꿔도 된단다."
text.0780: "새 이름을 지을래\n이름은 그대로 둘래"
text.0872: "{color:10}{partner}{color:1}(이)가 진화했다!"
