text.006a: "슈와아!"
text.008c: "샤 샤 샤아아!"
text.00c0: "다친 것 같지는 않아."
text.010e: "할인해 줄게."
text.0156: "우릴 얕보지 마!"
text.0196: "살아서 집에 돌아갈\n생각은 마!"
text.0262: "아야!"
text.027a: "그렇게 높이서 떨어졌는데\n멀쩡해 보이네."
text.02dc: "{color:10}{partner}{color:1},\n괜찮아?"
text.0310: "우와, 멀쩡하네!"
text.033c: "날았다고? 반칙이야!\n뭐, 아닌가."
text.03b6: "가자!"
text.03ea: "아야!"
text.0402: "그렇게 높이서 떨어졌는데\n멀쩡해 보이네."
text.0460: "{color:10}{partner}{color:1},\n괜찮아?"
text.0494: "아픈가 보다. 미안해."
text.04d4: "가자!"
