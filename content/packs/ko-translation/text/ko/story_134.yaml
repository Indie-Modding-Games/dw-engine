text.0092: "샤카 샤카!"
text.00c0: "슈리아우!"
text.00e4: "개굴!"
text.0104: "우리가 먼저 안 쓰러뜨리면\n우리가 쓰러질 거야."
text.017a: "새대가리!"
text.0198: "돌머리!"
text.01b4: "멍청이!"
text.01ca: "바보 멍청이!"
text.01ec: "바보, 바보!"
text.020a: "괴짜 냄새!"
text.022a: "뭐라고?!"
text.0254: "그 말에 화가 나\n그냥 무시할래"
text.02de: "쟤네 너무해!"
text.034e: "잠깐, 무슨 일이야?"
text.0396: "!"
text.03b4: "주인님이 날 부르셔.\n따라와. 개굴."
text.0420: "이런!"
text.0440: "하하하, 허세 부리는군.\n애들은 상대 안 해."
