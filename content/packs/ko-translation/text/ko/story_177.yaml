text.002a: "아이템이라면 잘 알아."
text.0056: "아이템은 모두\n128가지가 있어."
text.00d0: "그중 32가지가 음식이야."
text.00fe: "귀한 아이템은 어떤 곳에선\n저절로 자라지만, 다른\n곳에선 찾을 수 없어."
text.018e: "예를 들어 원시의 숲에서는\n푸른 사과를 찾을 수\n있어."
text.0204: "그런 음식은 특별한 효과가\n있으니까 먹는 때를\n잘 골라야 해."
text.02b8: "이번엔 진화 아이템에\n대해 얘기해 줄게."
text.030c: "진화 아이템은 이름\n그대로 디지몬을\n진화시켜."
text.0392: "진화 아이템은 종류가\n아주 많아."
text.0402: "종류마다 디지몬이\n서로 다른 디지몬으로\n진화하게 돼."
text.0494: "예를 들어 회색 발톱을\n쓰면 그 디지몬은\n그레이몬이 돼."
text.0528: "진화 아이템은 전설의\n아이템이라서 세상에 하나\n뿐인 것도 있어."
text.05b2: "하지만 보통 진화 때처럼\n능력치 보너스를 못 받을\n때도 있어."
text.0654: "게다가 행복도 떨어지니까\n완벽하진 않아."
text.06ca: "그래도 되고 싶은 디지몬으로\n진화할 수 있다는 건\n좋은 점이야."
text.0772: "되고 싶은 디지몬보다\n한 세대 전 단계에서만\n진화할 수 있어."
text.081a: "그러니까 조심해."
text.087c: "어이! 올라, 아미고스!"
text.08a4: "여긴 무슨 가게냐고?\n내 가게냐고?\n뭐 좀 사 줘요."
text.0942: "봐요, {color:6}{tamer}{color:1}! 제 가게엔\n재미있는 물건이 있어요.\n자주 와 줘요."
text.09f6: "여기 있는 건 평범한\n물건이 아니에요.\n어서 골라 봐요!"
text.0a9c: "어서 와요, 나그네! 올 줄\n알았어요, {color:6}{tamer}{color:1}.\n그렇게 놀라지 말아요."
text.0b1c: "제 아이템을 잘 쓸 수\n있을까요? 그건 테이머로서의\n실력에 달렸어요."
text.0be2: "여기가 어디냐고요?\n전 어두운 곳이 좋아요.\n이 가게가 딱 그렇죠!"
text.0c88: "좋아요, {color:6}{tamer}{color:1}, 와 줘서\n고마워요. 온 김에\n뭐 좀 사 가지 그래요?"
text.0d48: "어머, {color:6}{tamer}{color:1}. 왔네요!\n자, 아주 쓸모 있는\n제 아이템 좀 사 가요."
text.0dec: "어서 와요, 나그네!\n올 줄 알았어요, {color:6}{tamer}{color:1}.\n그렇게 놀라지 말아요."
text.0e6c: "제 아이템을 잘 쓸 수\n있을까요? 그건 테이머로서의\n실력에 달렸어요."
