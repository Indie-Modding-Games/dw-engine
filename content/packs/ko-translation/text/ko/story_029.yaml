text.0116: "흙은 거의 다 밖으로\n옮긴 것 같아."
text.0182: "일은 잘 되고 있어.\n고마워.\n조금만 더 기다려 줘."
text.021e: "수고했어.\n여기 품삯이야."
text.0296: "일한 대가로\n500 Bits를 받았다!"
text.02d8: "HP가 50 올랐다!\n공격력이 5 올랐다!\n방어력이 5 올랐다!"
text.0396: "흙은 터널 밖에\n버려 줘."
text.040a: "흙더미에서 가져가."
text.0476: "흙을 나를 거야?"
text.04b4: "네 디지몬이 지쳐 보여.\n먼저 좀 쉬게 하는 게 어때?"
text.054c: "흙을 나를 거야?"
text.058c: "응\n아니"
text.05b8: "여긴 아마추어가 올 데가\n아니야. 저리 가,\n너무 위험해."
text.065e: "이 터널은 아직\n안 뚫렸어. 방해하지\n마."
text.06d8: "미안. 언제쯤\n뚫리는지 알아?"
text.072e: "모르겠어.\n시간이 좀 걸릴 거야."
text.077c: "그거 곤란한데.\n우리가 도울까?"
text.07c0: "우리 재미를 뺏으려고?\n음, 흙 나르는 일이라면\n해도 돼."
text.083c: "그게 뭔데?"
text.0866: "내가 파낸 흙이 있어.\n그걸 밖으로 날라서\n버리면 돼."
text.08de: "힘든 일이니까\n한 번 왕복할 때마다\n500 Bits를 줄게."
text.096e: "그러면 굴착도 빨라지고,\n나는 돈도 벌고,\n좋은 훈련도 되겠네."
text.0a0c: "좋아\n사양할게"
text.0a3a: "흙 운반 일\n{color:6}△ {color:1}로 흙 앞에\n흙 상자를 놓아.\n흙은 터널 밖에 버려.\n한 바퀴 끝나면\n드리모게몬에게 알려 줘."
text.0b66: "무서워?"
text.0bae: "흙 상자가 추가됐다."
