text.0018: "난 디지몬 카드 수집가야."
text.0058: "하구루몬, 토이아구몬,\n와루몬자에몬 카드를 주면\n좋은 걸 하나 줄게."
text.0108: "준다\n안 준다"
text.0138: "미안, 하나도 없어."
text.0176: "자. {color:6}X 붕대{color:1}야."
text.01b4: "아이템이 너무 많아."
text.01f8: "컬링 해 본 적 있어?"
text.0236: "그 게임에서 10점을\n낼 수 있으면\n정말 대단한 실력이야."
text.02c0: "도움이 될지 모르겠지만\n낚시 요령을 알려 줄게."
text.0338: "먼저 낚싯대. 좋은 건\n멀리 날아가고\n잘 휘어져."
text.03c0: "다음은 미끼. 어떤\n물고기를 어떤 미끼로\n낚았는지 기억해 둬."
text.043c: "낚싯대를 던질 때\n{color:6}△ {color:1}버튼을 떼면\n힘껏 날아가!"
text.04ce: "호수의 수호신 말인데...\n매일 아침이랑 늦은\n오후에 나타나."
