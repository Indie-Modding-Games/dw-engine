text.00a8: "마침 잘 와 주었구나!\n너에게만 할 수 있는\n부탁이 있단다."
text.0146: "그게 뭔데?"
text.0164: "방금 아날로그맨과\n머신드라몬에게서 느꼈던\n사악한 기운을 또 느꼈단다."
text.01f8: "어디서 오는지 알고 있다."
text.0236: "또? 좋아, 나한테 맡겨!"
text.0272: "고맙구나. 그런데 말이다..."
text.02b8: "머신드라몬을\n쓰러뜨렸다고 들었다!"
text.02fe: "응, 그런데 잘 모르겠어.\n꼭 아날로그맨의\n저주 같았거든."
text.0386: "그 원한이 무척 강했지.\n이제 평화가 올지도 모르겠구나."
text.03fa: "머신드라몬이 돌아와도\n또 이기면 돼."
text.0460: "넌 믿음직하구나. 우리\n고기 농장에서 자란 거란다.\n이걸 받거라."
text.04f0: "우와! {color:6}사슬\n멜론{color:1}이잖아?"
text.0548: "아이템이 너무 많아."
text.0588: "고마워!"
text.05be: "오, 왔구나!\n다른 누구에게도\n부탁할 수 없는 일이란다."
text.0636: "걱정 마, 내가 있잖아.\n아날로그맨이\n돌아왔다는 거야?"
text.06a6: "사악한 기운은 느꼈지만\n어디 있는지는 모르겠구나."
text.0712: "좋아, 나한테 맡겨! 내가\n찾아가서 해결할게."
text.0784: "고맙구나.\n그런데 말이다..."
text.07ea: "나는 돌아와서 {color:10}{partner}{color:1}의\n도움을 받아 파일 시티를\n다시 세울 생각이란다."
text.0882: "너와 {color:10}{partner}{color:1}에게\n도움이 되는 가게들을\n세우고 싶구나."
text.0900: "마을 바로 밖에 있는\n원시의 숲을 탐험해 보거라."
text.099c: "이걸 가져가거라. 행운을 빈다."
text.09de: "아이템을 잔뜩 얻었다!"
text.0a26: "아이템을 보려면\n{color:5}× {color:1}버튼을 누르고..."
text.0a6a: "...“아이템”을 고른 다음\n{color:6}△ {color:1}버튼으로\n살펴보거라."
text.0ae2: "유라몬이 소문을 더\n모아 온 것 같아."
text.0b56: "유라몬이 새로운 소문을\n들었다더구나."
text.0bb2: "마을이 커지기 시작해서\n지금 달라지고 있다고\n하더구나."
text.0c30: "우리 세계의 상식을\n알려 주마."
text.0ca0: "하루는 24시간이고\n아침, 낮, 밤이\n있단다."
text.0d32: "시간이 빨리 간다고\n느낄지도 모르겠구나."
text.0d76: "1년은 30일이란다.\n달? 그게 뭐냐? 계절?\n그거 먹는 거냐?"
text.0e14: "물론 돈도 있지.\n단위는 Bits란다. 돈은\n아무리 많아도 좋지."
text.0eb6: "이 섬에서 “마을”이라고\n하면 바로 여기를 말한단다."
text.0f24: "하지만 작은 마을과\n동네가 따로 더 있단다."
text.0f84: "시계에서 노란 점은\n시를, 바늘은 분을\n가리킨단다."
text.100a: "위쪽이 자정이고\n아래쪽이 정오란다."
text.1050: "왼쪽의 빨간 부분은\n저녁이란다. 4시부터\n8시까지를 나타내지."
text.10f0: "오른쪽의 보라색 부분은\n아침이란다. 4시부터\n8시까지를 나타내지."
text.118a: "디지몬은 하루 중 정해진\n시간에 활동한단다."
text.11e6: "대부분 아침에 일어나서\n밤에 자지만, 반대인\n녀석들도 있지."
text.1286: "만나고 싶은 디지몬을\n못 만나면 다른 시간에\n찾아가 보거라."
text.1340: "츠노몬과 유라몬에게\n되도록 자주 말을 걸거라."
text.13bc: "테이머 레벨에 대해\n알려 주마."
text.140a: "테이머 레벨이 높으면\n네 디지몬이 사라졌을 때,"
text.147c: "다음 디지몬의 능력치가\n더 좋아진단다."
text.14de: "처음에는\n별로 오르지 않지만,"
text.152e: "꾸준히 키우다 보면\n점점 좋아질 거다."
text.15b2: "필살기를 쓸 때는\nL 버튼과 R 버튼을\n빠르게 연타하거라."
text.1658: "필살 게이지가 가득 차면\n비었을 때보다 적에게\n두 배의 피해를 준단다!"
text.1704: "디지몬의 생활에 대해\n알려 주마."
text.1754: "디지몬은 배가 고프면\n너에게 알려 준단다."
text.17ac: "볼일도 봐야 한단다.\n꼭 화장실에서\n보게 하거라."
text.182e: "디지몬은 졸리면 자야\n하지만, 재우는 건\n네 몫이란다."
text.18b8: "너무 오래 깨어 있게\n하면 안 된다."
text.190a: "지치거나 병에 걸리거나\n그냥 토라질 수도 있지.\n꽤 예민하단다."
text.198c: "디지몬은 야생의\n생물이니까 칭찬도 하고\n꾸짖기도 해야 한단다."
text.1a16: "무엇을 하든\n네 디지몬이 뭘 하는지\n잘 지켜보거라."
text.1aba: "깼구나...\n정말 미안하다."
text.1b28: "이 기계는 뭐야?"
text.1b64: "저거? 저건\n{color:4}메모리 카드 배틀\n데이터 저장기{color:1}란다."
text.1be6: "그 기계를 쓰면 지금\n파트너의 배틀용 데이터를\n저장할 수 있단다."
text.1c7c: "{color:6}△ {color:1}버튼만 누르면\n기계가 할 일을\n알려 줄 거다."
text.1d02: "{color:4}메모리 카드 배틀\n데이터 저장기{color:1}를\n쓸 거니?"
text.1d84: "응\n아니"
text.1dce: "푸니몬은 안 보이지만\n여기서 좀 쉬어야겠다."
text.1e3a: "{color:7}푸니몬 {color:1}\n난 푸니몬이야! 여기서\n잠깐 쉬었다 가지 않을래?"
text.1eb0: "{color:7}푸니몬 {color:1}\n1시간 쉬면 HP와 MP가\n회복되고 피로가 줄어."
text.1f34: "쉰다\n안 쉰다"
