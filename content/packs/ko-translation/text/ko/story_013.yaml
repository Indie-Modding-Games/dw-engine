text.0084: "이봐, 네가 마을을\n만들고 있다는 녀석이야?"
text.00d6: "응."
text.00ea: "어, 나를 만나다니\n운이 정말 좋구나."
text.0132: "이래 봬도 난 완전체\n디지몬이야. 날 이기면\n도와줄게."
text.01d6: "좋아, 받아들일게\n사양할게"
text.0258: "우와, 졌다! 그럼\n마을에서 보자."
text.02f0: "픽시몬이 마을에 들어왔다!"
text.033a: "이런, 겁쟁이 같으니!\n또 만나자!"
text.03c0: "오, 세뇨리타!"
text.03f0: "헤이 아미고, 잘 지내?"
text.0430: "우키, 우키!"
text.0460: "응?"
