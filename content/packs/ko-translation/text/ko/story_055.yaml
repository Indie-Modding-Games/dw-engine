text.0034: "내가 상대해 주마!"
text.006a: "내가 상대해 주마!"
text.00a0: "내가 상대해 주마!"
text.0102: "뭐라고 쓰여 있어?"
text.012c: "멍청이한테 포인트를\n받았던 곳으로\n돌아가라."
text.01d8: "{color:6}냉장고 열쇠{color:1}를\n사용했다."
text.0234: "안 보이는데."
text.025e: "메모가 있다."
text.0284: "멍청이한테 포인트를\n받았던 곳으로\n돌아가라."
text.0310: "이 메모대로 해 봐야겠어."
text.036a: "냉장고다."
text.039a: "잠겨 있다. 잠긴 냉장고는\n처음 봐."
