text.008e: "흠"
text.00b4: "새 둥지 같아.\n어떻게 생각해?"
text.012e: "무슨 소리가 들려."
text.01bc: "제법이구나."
text.01dc: "네 둥지였구나."
text.020c: "그래."
text.0222: "허락 없이 들어와서 미안해."
text.026a: "아, 신경 쓰지 마."
text.02a4: "?"
text.02ae: "네 얘기는 들었어."
text.02da: "내가 유명한 줄은 몰랐네."
text.0318: "넌 아마 이 섬에 남은\n유일한 인간일 거야."
text.0388: "남은...? 나 말고도\n누가 있었어?"
text.03e0: "나한테 마을로 오라고\n안 할 거야?"
text.0440: "아, 맞다. 마을에\n와 줄래?"
text.0492: "좋아. 그럼 바로 본론으로\n가자. 꽉 잡아."
text.0534: "버드라몬이 마을에 들어왔다!"
text.066a: "엘리베이터"
text.0682: "아래로 한 번\n아래로 두 번\n안 탄다"
text.074e: "응?"
text.075c: "안 되겠어. 작동을 안 해."
