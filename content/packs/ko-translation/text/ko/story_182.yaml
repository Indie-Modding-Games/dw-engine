text.0056: "드디어 도착했다."
text.008c: "네가 보스야?"
text.00ba: "미안하지만 아니야.\n난 메탈그레이몬이다!"
text.0114: "너는 나중에 상대해 주지!\n비켜!"
text.015e: "너를 위해 비킬 순 없다.\n여긴 못 지나간다."
text.01c4: "힘을 아껴야 해.\n저 녀석과 싸워도 소용없어."
text.0230: "간다!"
text.0294: "어? 여긴 어디지?"
text.02bc: "정신이 돌아왔구나!"
text.02f6: "그런 것 같아..."
text.0316: "저 녀석들을 이기면\n또 만날지도 모르지.\n그때까진 이만 갈게."
