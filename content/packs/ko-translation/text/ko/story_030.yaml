text.0060: "이런! 큰 바위에 막혔어!"
text.0098: "뚫을 수가 없어."
text.00c6: "못 뚫는다고? 큰일이네!"
text.00f0: "어떻게든 치워야 해.\n너희가 할 수 있겠어?"
text.0164: "글쎄."
text.0192: "{color:10}{partner}{color:1},\n네 도움이 필요해."
text.034e: "해냈다!"
text.036a: "우와, 굉장한 힘이야!\n바위를 치웠어!"
text.03be: "여기서부턴 텅 비어\n있는 것 같아."
text.041e: "용암 강이야!\n위험해!"
text.0468: "강을 따라 길이 있어.\n가자!"
text.04c2: "안으로 들어갈 거야?\n조심해!"
text.0516: "안으로 들어갈 거야?\n조심해!"
text.0576: "{color:10}{partner}{color:1}(이)가 더 크면\n그때 다시 와."
