text.0044: "안녕, 고기 필요해?"
text.007c: "아, 아직 이 얘기는\n하나도 안 했지."
text.00d8: "여긴 고기 농장이야.\n모두를 위해 고기를 길러."
text.013e: "농장에서 고기를 기른다고?"
text.0176: "응, 왜?"
text.0192: "아니... 아무것도"
text.01b8: "지지랑 의논해서\n{color:6}{tamer}{color:1}에게 하루에\n고기를 3개씩 주기로 했어."
text.0242: "자, 오늘 몫의 고기야."
text.028e: "고기가 너무 많구나.\n오늘은 필요 없겠네."
text.030a: "고기가 너무 많구나. 못\n가져가는 건 내가 맡아 둘게."
text.0380: "{color:6}고기{color:1}를 3개\n받았다!"
text.03dc: "아이템이 너무 많구나."
text.0414: "{color:6}고기{color:1}를 3개\n받았다!"
text.0470: "오늘은 고기를 많이\n수확했어! 그러니까\n5개 줄게."
text.0508: "고기가 너무 많구나."
text.054c: "고기가 너무 많구나. 못\n가져가는 건 내가 맡아 둘게."
text.05c2: "{color:6}고기{color:1}를 5개\n받았다!"
text.0620: "아이템이 너무 많구나."
text.0658: "{color:6}고기{color:1}를 5개\n받았다!"
text.0698: "내일 또 받으러 와."
text.06e4: "자, 오늘의 고기야."
text.072a: "고기가 너무 많구나."
text.076e: "고기가 너무 많구나. 못\n가져가는 건 내가 맡아 둘게."
text.07e4: "{color:6}고기{color:1}를 받았다!"
text.0820: "아이템이 너무 많구나."
text.0858: "{color:6}고기{color:1}를 받았다!"
text.087a: "내일 또 줄게."
text.08c0: "오늘 몫의 고기는\n벌써 준 것 같은데."
text.090a: "먹을 게 떨어지면\n원시의 숲에 가서\n버섯을 찾아봐."
text.09a2: "안녕, {color:6}{tamer}{color:1}. 고기\n농장을 넓혔어."
text.09ea: "하루에 왕고기를\n3개씩 줄게."
text.0a4e: "더 갖고 싶으면\n하나에 500 Bits에\n팔게."
text.0ad2: "타네몬 대신 내가\n이 농장을 맡게 됐어.\n걔는 지금 어디서 쉬고 있대."
text.0b74: "오늘은 고기를\n많이 수확했어!"
text.0bd2: "왕고기가 너무 많구나.\n오늘은 필요 없겠네."
text.0c56: "왕고기가 너무 많구나.\n오늘은 필요 없겠네."
text.0cce: "{color:6}왕고기{color:1}를 받았다!"
text.0d14: "아이템이 너무 많구나."
text.0d4c: "{color:6}왕고기{color:1}를 5개\n받았다!"
text.0d98: "내일 또 줄게."
text.0dea: "자, 오늘 몫의\n왕고기 3개야."
text.0e60: "왕고기가 너무 많구나.\n오늘은 필요 없겠네"
text.0ee2: "왕고기가 너무\n많구나. 못 가져가는 건\n내가 맡아 둘게."
text.0f64: "{color:6}왕고기{color:1}를 받았다!"
text.0faa: "아이템이 너무 많구나."
text.0fe2: "{color:6}왕고기{color:1}를 3개\n받았다!"
text.1036: "내일 또 줄게.\n아니면 지금 더 살래?\n하나에 500 Bits야."
text.10d2: "산다\n안 산다"
text.1110: "Bits가 모자라."
text.1150: "아이템이 너무 많구나."
text.119c: "더 살래?"
text.11d4: "산다\n안 산다"
text.1202: "내일 또 봐."
text.123e: "헤헤헤!\n{color:6}{tamer}{color:1}, 이것 봐!"
text.128a: "이제 등심도 잔뜩\n기를 수 있어. 하루에\n등심을 3개씩 줄게."
text.1310: "귀한 채소도\n기르기 시작했어!\n원하는 만큼 사 가!"
text.13a6: "오늘은 기분이 좋으니까\n등심을 5개\n줄게."
text.143a: "등심이 너무 많구나.\n오늘은 필요 없겠네"
text.14b6: "등심이 너무 많구나."
text.14f4: "{color:6}등심{color:1}을 받았다!"
text.1534: "아이템이 너무 많구나."
text.156c: "{color:6}등심{color:1}을 5개\n받았다!"
text.15b2: "내일 또 봐!"
text.15ee: "자, 오늘 몫의\n등심 3개야!"
text.1668: "등심이 너무 많구나.\n오늘은 필요 없겠네."
text.16e6: "등심이 너무 많구나."
text.1724: "{color:6}등심{color:1}을 받았다!"
text.1766: "아이템이 너무 많구나."
text.179e: "{color:6}등심{color:1}을 3개\n받았다!"
text.17ec: "아직 내일이 아니야!\n채소 살래?"
text.1858: "산다\n안 산다"
text.1886: "슈퍼 당근: 500 Bits\n매 무: 500 Bits\n안 산다"
text.1930: "Bits가 모자라."
text.197e: "아이템이 너무 많잖아!"
text.19ca: "Bits가 모자라."
text.1a18: "아이템이 너무 많잖아!"
text.1a62: "더 살래?"
text.1a9a: "산다\n안 산다"
text.1ac8: "또 봐!"
