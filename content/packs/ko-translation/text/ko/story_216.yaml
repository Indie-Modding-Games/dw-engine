text.0024: "안녕하세요, {color:6}{tamer}{color:1}.\n놀랐죠? 진료소를\n열었어요!"
text.007a: "병이나 상처를 치료하는\n곳이에요. 공짜는 아니지만\n싸게 해 드릴게요."
text.0130: "디지몬 상태가 안 좋아\n보이네요. 건강을 잘\n챙겨 줘야 해요."
text.01be: "지금 바로 치료하고\n할인해 드릴게요.\n300 Bits예요."
text.025e: "Bits가 모자라요?\n있는 만큼만 내세요."
text.0304: "이제 다 괜찮아요.\n앞으로는 조심하세요."
text.038a: "디지몬은 건강해 보이네요.\n무엇이 필요하세요?"
text.03e6: "피로를 풀어 줘\n약을 살래\n됐어"
text.046c: "{color:10}{partner}{color:1}의 피로가\n아주 심해요. 지금 바로\n쉬어야 해요."
text.04ec: "{color:10}{partner}{color:1}(은)는 지쳤어요.\n지금 쉬는 게 좋겠어요."
text.0548: "{color:10}{partner}{color:1}(이)가 조금\n지친 것 같아요. 무리하지\n않는 게 좋겠어요."
text.05c2: "{color:10}{partner}{color:1}(은)는 괜찮아요.\n피로를 잘 살펴 주세요."
text.0634: "좀 편안해졌나요?"
text.066e: "또 필요한 게 있나요?"
text.06a0: "좀 더 쉴래\n약을 살래\n됐어"
text.0706: "이제 괜찮을 거예요."
text.0732: "붕대: 400 Bits\n약: 1200 Bits\n안 살래"
text.07c0: "몸이 안 좋을 땐\n저를 찾아오세요."
text.0826: "그래도 지쳐 있으면 훈련을\n줄이고, 규칙적으로 먹고\n자게 해 주세요."
text.08c8: "춥거나 더운 곳에\n너무 오래 있으면\n병에 걸릴 수 있어요."
text.0958: "붕대는 상처에만\n효과가 있어요."
text.09b2: "약으로 병은 고칠 수\n있지만, 피로는\n줄지 않아요."
text.0a50: "배틀이 끝났을 때 HP가\n적으면 디지몬이\n다치기 쉬워요."
text.0ae8: "행복과 피로를 좋은\n상태로 유지하면\n오래 살 수 있어요."
text.0b8c: "Bits가 모자라요.\n그건 팔 수 없어요."
text.0c0e: "아이템이 너무 많아요."
text.0c62: "Bits가 모자라요.\n그건 팔 수 없어요."
text.0ce4: "아이템이 너무 많아요."
text.0d28: "또 필요한 게 있나요?"
text.0d5a: "피로를 풀어 줘\n약을 더 살래\n아니, 됐어"
