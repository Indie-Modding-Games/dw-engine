text.0084: "음, 무슨 말인지 알겠어."
text.00c8: "이 아름다움이 보여?"
text.010c: "으아아아악!!"
text.0136: "이젠 정말 절박해!"
text.0170: "제자아앙! 에이, 몰라."
text.01aa: "배가 아파."
text.01e8: "자판기"
text.0212: "특별한 상품이 나오는\n자판기다.\n뭘 사 볼까?"
text.0294: "회복약(소): 200 Bits\n휴대용 변기: 500 Bits\n안 산다"
text.034c: "Bits가 모자라."
text.039e: "Bits가 모자라."
text.03ea: "아이템이 너무 많아."
text.041e: "{color:6}회복약(소){color:1}가\n나왔다!"
text.0496: "아이템이 너무 많아."
text.04ca: "{color:6}휴대용 변기{color:1}가\n나왔다!"
text.0528: "좋아, 당첨이다!"
text.054e: "{color:6}더블 플로피{color:1}가\n나왔다!"
text.05a2: "아이템이 너무 많아."
text.05de: "MP 자판기"
text.05fa: "MP를 회복해 주는 기계일까?"
text.0638: "100 MP: 200 Bits\n1000 MP: 1800 Bits\n안 쓴다"
text.06e2: "MP가 회복됐다!"
text.0724: "Bits가 모자라."
text.077a: "MP가 회복됐다!"
text.07bc: "Bits가 모자라."
