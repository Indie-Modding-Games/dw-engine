text.003e: "!!!"
text.006c: "알이다!"
text.0080: "설마 머신드라몬의 알?"
text.00c8: "큰일 날지도 몰라!"
text.015e: "디지타마몬이\n마을에 들어왔다!"
text.01b8: "!"
text.01e2: "저기 있다! 찾았어!"
text.022a: "네가 보스구나!"
text.0252: "처음 뵙겠네.\n나는 아날로그맨이다."
text.029a: "너에 대해선 다 알지만\n꼬마일 줄은 몰랐군."
text.030e: "꼬마 녀석이 내 계획을\n망쳐 왔다니 믿을 수 없군."
text.0378: "네트 세계를 지배하기\n직전이었는데."
text.03ce: "어른이잖아! 그만해,\n모두가 다치고 있어."
text.0442: "디지몬이 다치든 말든\n상관없다."
text.049a: "디지몬은 노예처럼\n인간에게 복종해야 해."
text.04fa: "틀렸어! 디지몬에게도\n마음과 생각이 있어!\n우린 친구야!"
text.0578: "노예와 친구 중 어느 쪽이\n나은지 싸워서 가려 보자."
text.060c: "네 차례다, 머신드라몬!"
text.0698: "해냈어, {color:10}{partner}{color:1}!"
text.06e0: "말도 안 돼!\n내 가장 강한 노예가!"
text.0736: "봐, 네가 틀렸잖아!"
text.0772: "이런, 이런..."
text.07b4: "섬을 가만히 두고\n용서를 빌면\n다들 용서해 줄 거야."
text.0854: "디지몬을 믿는 게 아니었어.\n내가 직접 하겠다."
text.08e2: "뭘 하려는 거야?!"
text.0926: "{color:7}아날로그맨 {color:1}\n이 섬을 날려 버리고\n다른 세계로 도망칠 거다.\n안됐구나, 꼬마야!"
text.0a12: "안 돼애애!!"
text.0a3c: "{color:7}아날로그맨 {color:1}\n이제 넌 끝이다!"
text.0a86: "미안해, 얘들아.\n이제 내가 할 수 있는 게 없어."
text.0af0: "{color:7}??? {color:1}\n괜찮아."
text.0b30: "응?"
text.0b56: "{color:7}아날로그맨 {color:1}\n전송이 안 돼!\n프로그램에 문제가 있어.\n어떻게 된 거야?!"
text.0c18: "모두의 목소리가 들려!\n거기 누구야?"
text.0c7e: "{color:7}지지몬 {color:1}\n지금 우리의 힘을\n너에게 보내고 있단다."
text.0cee: "{color:7}토코몬 {color:1}\n우리 목소리 들려?"
text.0d3c: "{color:7}아구몬 {color:1}\n늦지 않게 왔나 봐!"
text.0d8e: "모두..."
text.0dc4: "{color:7}아날로그맨 {color:1}\n안 돼, 이 고물아! 살려 줘!\n누가 좀 살려 줘! 으아아악!!!"
text.0ec4: "사라졌어! 어떻게 된 거지?"
text.0efe: "{color:7}지지몬 {color:1}\n모르겠구나. 하지만..."
text.0f4c: "지지몬? 곧 폭발할 거야!\n어떻게 좀 해 봐!"
text.0fa2: "{color:7}지지몬 {color:1}\n이제 올 때가 됐는데."
text.1032: "에어드라몬!"
text.104e: "어서, 서둘러!"
text.10ac: "아날로그맨은 사라졌다."
text.10d8: "파일 섬에 평화가\n돌아왔다."
text.1124: "그리고..."
