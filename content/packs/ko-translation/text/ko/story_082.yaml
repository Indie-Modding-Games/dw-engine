text.0042: "이게 틀림없어!\n아무리 봐도\n그냥 평범한 운석인데."
text.00d8: "깨서 확인한다\n그냥 둔다"
text.0130: "흐음"
text.0146: "내 눈엔 그냥\n평범하고 낡은 운석 같아."
text.019c: "{color:7}???몬 {color:1}\n평범하고 낡아 보여서\n미안하게 됐네."
text.0202: "우와!"
text.0212: "디지몬이었어?!\n넌 누구야?"
text.0264: "{color:7}???몬 {color:1}\n내 이름은 메테오몬이야."
text.02aa: "섬에 닥친 위험에 대해\n알고 있어?"
text.02fe: "아무것도 몰라!"
text.0324: "아무것도 모른다고?! 정말\n뭔가 숨기는 거 아니야?"
text.039c: "무례하긴! 좋아!\n누가 옳은지\n배틀로 가려 보자!"
text.041e: "좋아! 한번 해 보자."
text.0488: "항복이야. 너 정말 세구나."
text.04c8: "섬에 닥친 위험에 대해\n아는 건 뭐든 말해 줘."
text.0542: "난 막 태어나서\n아무것도 모른다니까!"
text.059e: "뭐?!"
text.05ba: "운석족은 하늘에서\n태어나서 땅으로\n떨어져."
text.064a: "그리고 오랫동안 잠을 자.\n사실 난 훨씬 더 오래\n잘 예정이었는데..."
text.06fa: "여긴 시간이 훨씬 빨리 흘러."
text.0738: "아마 그렇겠지. 아무튼 난\n섬을 둘러보러 갈게.\n또 보자!{stop}"
text.07f4: "아무 단서도 못 찾았어.\n얼른 나가자."
text.086a: "살펴봤는데 아무것도\n알 수가 없어.\n깨 보자!"
text.08f8: "{color:7}???몬 {color:1}\n지금 무슨 짓을 하는 거야?\n이 무식한 녀석아!"
text.0998: "어? 넌 누구야?!"
text.09c4: "나? 그러는 넌 누군데?!"
text.0a70: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 20개까지\n가질 수 있다!"
text.0b20: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 30개까지\n가질 수 있다!"
