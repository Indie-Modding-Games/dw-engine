text.0122: "내가 이길 거야!"
text.0150: "오지 마! 저리 가!"
text.0194: "이젠 진짜 화났어!"
text.01d0: "때리면 나도 때릴 거야!"
text.0214: "할 수 있으면 해 봐!"
text.02f4: "아, {color:6}{tamer}{color:1}, 너구나.\n다리는 다 고쳤어."
text.0348: "마을을 만들고 있다며?"
text.0386: "부탁이 하나 있어.\n내가 도와준 것처럼\n너도 날 도와줬으면 해."
text.040a: "?"
text.0414: "마을을 만드는 건\n이 섬을 구하는 일이야.\n모두가 구원받을 거야."
text.04a2: "그 말은, 우리 마을에\n와 준다는 거야?"
text.04fc: "응. 너희 마을로 갈게."
text.0596: "코엘라몬이 마을에 들어왔다!"
text.06b0: "이봐, 너 인간이야?"
text.06dc: "나는 물고기 디지몬\n코엘라몬이야.\n날 만나러 온 거야?"
text.0758: "응, 한참 찾았어\n듣고 보니 그렇네"
text.07d0: "하하, 그렇단 말이지!"
text.080c: "네가 원하는 건\n이미 알고 있어."
text.084e: "상류의 다리가 무너져서\n건너편으로 가고 싶은\n거지? 맞지?"
text.08f2: "그렇구나.\n좋아, 도와줄게."
text.093c: "아하, 또 왔구나."
text.0a0a: "자, 우리 머리를 밟고 건너.\n걱정 마."
text.0a7a: "좋아, 간다!"
text.0b94: "이 세상엔 협동이 더\n필요해. 또 만나자."
