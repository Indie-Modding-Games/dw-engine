text.03b8: "제 가게에 어서 오세요."
text.03e4: "봐요, {color:6}{tamer}{color:1}. 여기가\n제 가게예요. 온갖 아이템을\n팔 거예요."
text.046c: "곧 물건이 더 들어올 거예요.\n하지만 여기서 도와줄\n디지몬이 필요해요."
text.052c: "아이템을 사고팔\n거예요. 필요할 땐\n언제든 들러요."
text.05c6: "아직 물건이 별로 없지만\n도와줄 디지몬을 찾으면\n더 나아질 거예요."
text.069c: "아이템 가게를\n열기로 했어요.\n자주 와 줘요."
text.0726: "아직 물건이 넉넉지 않지만\n곧 늘릴 생각이에요.\n조금만 기다려 줘요."
text.080a: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\n아이템 가게를 열었어요.\n잘될 것 같아요!"
text.087c: "마을에 디지몬이 늘면\n물건도 더 늘어나요."
text.0920: "{color:6}{tamer}{color:1}, 이 가게 일을\n막 돕기 시작했어요.\n많이 사 가요!"
text.09ea: "어서 오세요. 오늘부터\n여기서 일하게 됐어요.\n자주 와 주세요."
text.0ab4: "이 가게 일을\n돕기로 했어요.\n언제든 들러요."
text.0b68: "아, {color:6}{tamer}{color:1}. 여긴\n저한테 딱 맞는 곳이에요.\n열심히 일할게요."
text.0e56: "안녕하세요, 가게 일로\n늘 바빠요... 농담이에요!"
text.0ec2: "전 좀 게을러서 가게엔\n잘 안 나와요. \n그래도 좋은 물건이 있어요."
text.0f5e: "짜잔! “훈련 교본”!\n이게 있으면 훈련이\n더 잘될 거예요!"
text.0fe6: "아주 귀한 물건이에요.\n50000 Bits에 팔게요.\n안 사면 후회할걸요."
text.1094: "산다\n안 산다"
text.10d6: "Bits가 모자라요."
text.1126: "음, 가진 물건이\n너무 많네요."
text.1186: "{color:6}훈련 교본{color:1}을\n얻었다!"
text.11c2: "깎아 드리진 않아요."
text.123a: "물건이 너무 많아서\n곤란한가요?"
text.12b2: "가방을 다른 차원과\n이어 주는 열쇠고리를\n찾을 수 있는 곳이 있어요."
text.135a: "가질 수 있는 아이템\n수가 늘어나요."
text.13be: "전에 가 본 곳이라도\n다시 한번 살펴봐요."
text.1432: "아이템을 사는 비결을\n알려 드릴게요."
text.1488: "알고 싶은 아이템에서\nStart 버튼을\n눌러 봐요!"
text.1514: "{color:6}△{color:1}로 아이템을 고르고\n{color:4}□{color:1}를 누르면\n한꺼번에 살 수 있어요."
text.159e: "{color:10}○{color:1}를 누른 채\n방향 버튼 위아래를 누르면\n10개씩 늘고 줄어요."
text.1636: "아, 진화한 직후에\n뭔가 사 봐요.\n좋은 일이 있을 거예요!"
