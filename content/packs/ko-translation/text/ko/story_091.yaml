text.007c: "내가 이길 거야!"
text.00ae: "넌 절대 날 못 이겨!"
text.00ee: "헤헤! 정말 미안!"
text.012c: "날 무시하는 거야?"
text.017a: "여길 지나가고 싶으면\n내 도전을 받아들여야 해."
text.021c: "방심하긴 했지만\n둘이 하나를 치는 건 반칙이야."
text.028a: "그럴지도\n졌다고 투덜대지 마"
text.02ea: "정정당당한 싸움이라면\n난 누구한테도 안 져."
text.034e: "일대일로 붙자. 내일 4시에\n다시 와. 싸우는 건\n디지몬끼리만이야."
text.03fe: "좋아\n싫어"
text.0436: "그럼 약속한 거다.\n내일 보자!"
text.04e6: "다시 왔구나, 좋아.\n오늘은 정정당당하게 싸우자!"
text.0550: "늦었지만 덕분에\n상처를 치료할 수 있었어.\n자, 한번 붙어 보자."
text.05f2: "난 지켜보기만 할게. 시작!"
text.0630: "가라, {color:10}{partner}{color:1}!"
text.067e: "제법인데! 넌 누구야?"
text.06b8: "우린 섬을 탐험하면서\n위험에서 구하려는 중이야."
text.0734: "뭐?"
text.0746: "{color:6}{tamer}{color:1}은(는) 열심히\n설득했다!"
text.079a: "도와줄게. 하지만 먼저\n그 마을을 봐야겠어."
text.0844: "가루루몬이 마을에 들어왔다!"
