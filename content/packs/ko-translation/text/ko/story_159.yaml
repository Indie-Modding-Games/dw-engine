text.0082: "또 너야! 여기서 나가!"
text.00c8: "어..."
text.00e0: "너... 정말 귀찮은 녀석이구나!\n이제 됐냐?!"
text.0154: "또 너야! 당장\n여기서 나가!"
text.01ba: "반갑구나, 친구들.\n여기서 살고 싶다면\n허락해 주지."
text.0260: "여기서 살래\n돌아갈래"
text.02c6: "흠, 좋아. 뭐라고?\n하지만 넌 아날로그잖아.\n여기선 살 수 없다."
text.0356: "우린 함께 있어야 해!"
text.038c: "그럼 그 녀석이랑\n같이 나가라!"
text.03de: "뭐? 무슨 소리야?"
text.0422: "원래는 스카몬이 아니었어.\n왕님, 제발 이 녀석을\n원래 모습으로 돌려줘!"
text.04c2: "스카몬이 됐으니\n잘된 일 아니냐?"
text.0516: "아니, 지금은 전혀\n잘된 일이 아니야. 제발."
text.0570: "스카몬이 되려면\n열심히 노력하는 수밖에 없다."
text.05cc: "저절로 스카몬이\n돼 버렸으니까\n그게 문제라고."
text.0642: "너희들 정말 못 말리겠구나!"
text.06aa: "우와! 왕님, 고마워!"
text.06e0: "당장 여기서 나가!"
text.072c: "무슨 볼일이라도\n있어서 왔느냐?"
text.0774: "그게..."
text.078a: "부탁이라면 잊어버려라.\n왜냐하면 나는\n스카몬의 왕이니까!"
text.0810: "저 왕은 마을에\n초대하기 힘들겠는걸."
text.0890: "나도 디지몬 카드를\n모으고 있어."
text.08e0: "스카몬 왕 카드가\n정말 갖고 싶어. 내 에테몬\n카드랑 바꾸지 않을래?"
text.0986: "교환한다\n교환 안 한다"
text.09ba: "미안, 그 카드가 없어."
text.0a02: "우와, 냄새 지독해!\n여기 쓰레기장이야?"
text.0a4c: "디지몬 월드에도\n이런 데가 있는 줄 몰랐어."
text.0aca: "와 줘서 기뻐.\n새 친구는 언제나 환영이야."
text.0b26: "여기는 스카몬 일족의\n마을이야?"
text.0b82: "맞아. 여긴 스카몬 일족의\n낙원, 이름하여\n먼지 왕국이야."
text.0c20: "스카몬 왕님도 여기 계셔."
text.0c62: "스카몬 왕...?"
text.0c90: "스카몬 왕님은 대단하셔!\n말을 안 들으면\n진화당하고 말걸!"
text.0d32: "스카몬이 아닌 다른 걸로\n변해 버린다는 뜻이야?"
text.0d9e: "그럼 원래 모습으로\n돌아간다는 거야?!"
text.0dfc: "응, 무서워. 소름 끼쳐."
text.0e36: "쓸모 있는 걸 알았네..."
text.0ea2: "앗, 스카몬?!"
text.0ec4: "응? 나를 알아?"
text.0f00: "응, 뭐 조금.\n스카몬도 마을로\n데려가야 하나?"
text.0f92: "우와, 신기하다!\n이런 건 처음\n봐!"
text.1014: "세상에! 똥이\n움직이고 말을 해!"
text.107c: "나 말하는 거야?\n난 스카몬...\n변이 디지몬이야."
text.1100: "똥이 아니야?"
text.112a: "어떤 의미에선 맞아.\n우린 디지털 쓰레기로\n만들어졌거든."
text.11aa: "이 녀석한테도 마을에\n오라고 할까? 편견을\n가지면 안 되니까."
text.1240: "여기서 살 생각이야?"
text.1284: "뭐? 그런 건\n생각해 본 적 없어."
text.12ca: "음, 여긴 스카몬 일족만을\n위한 낙원이야.\n다른 디지몬은 못 살아."
text.136a: "그럼 너희는 다른 곳에선\n못 사는 거야?"
text.13ba: "당연히 못 살지!\n무슨 생각을 하는 거야?"
text.1404: "그렇구나.\n그럴 줄 알았어."
text.1446: "음, 여기서 살 순 없지만\n구경은\n해도 돼."
text.14be: "아, 구경만이라. 알았어."
text.14f2: "아, 그리고 절대로\n왕님을 화나게 하지 마."
text.1552: "왕님의 진화 기술로\n비참한 모습이\n돼 버릴 거야."
text.1610: "야, 너 에테몬 카드가\n너무 많잖아!\n그만둬."
text.167c: "아, 고마워!"
text.16bc: "얘들아, 너희 그...\n뭐더라... 마을에서 왔지?"
text.172e: "이건 우리끼리 비밀인데,\n나 조금\n관심 있어."
text.17ae: "언젠가 너희 마을에\n놀러 갈게."
text.17fe: "얘들아, 스카몬 일족의\n특별한 기술을\n알고 있어?"
text.187e: "땅에 있는 똥을 몸으로\n흡수해서\n에너지로 바꾸는 거야!"
text.1916: "응? 여긴 먼지 왕국이야.\n너희한텐 그냥\n쓰레기 더미겠지만."
text.19a4: "그래도 쓸모 있는 게 있을지\n몰라. 저쪽에서 막대기\n같은 긴 걸 봤어."
text.1a4c: "우와,\n{color:6}낡은 낚싯대{color:1}다!"
text.1aba: " {color:5}훈련: 쓰레기 속 버티기 {color:1}"
text.1af6: "시작\n설명\n그만두기"
text.1b2e: "일반\n보너스 도전\n그만두기"
text.1b6c: "더러운 쓰레기 속에 들어가\n정신을 단련한다.\n최대 MP가 크게 오른다."
text.1c0e: "다시 설명\n시작\n그만두기"
text.1c68: " {color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
