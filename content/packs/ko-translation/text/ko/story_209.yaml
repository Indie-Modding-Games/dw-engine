text.0012: "가게 1\n가게 2\n기타\n이름 입력"
text.0074: "{color:6}{tamer}{color:1}\n{color:10}{partner}{color:1}"
text.00a6: "가게\n시장\n포인트"
text.01fc: "카드\n아이템 보관소\n다른 가게"
text.0256: "오늘도 여느 때처럼\n새 카드가 들어왔어요."
text.02a6: "카드 사기\n카드 팔기\n취소"
text.0304: "3장 팩 사기\n1장 사기\n취소"
text.0378: "1장 사기\n취소"
text.03bc: "한 팩에\n500 Bits예요. 뭐가\n들었는지는 비밀이에요."
text.0442: "산다\n취소"
text.0472: "바로 팩을 열어 보세요."
text.04d4: "또 뭐가 필요해요, 아미고?"
text.0518: "또 오세요."
text.0538: "사운드 테스트\n워프 가게\n교환"
text.05a4: "참가\n경기장\n기타\n가격"
text.05ee: "오프닝\n엔딩\n변신\n퇴장"
text.0772: "원래 모습으로 진화."
text.07b8: "스카몬으로 진화."
text.07f6: "완료."
text.082e: "' - {tournament:pstat=3}- '에 등록 중"
text.0872: "등록된 대회가 없어요."
text.08b0: "현재 {shopvar}Bits예요."
text.08e2: "초기화\n추가\n끝"
text.0992: "- D급 -\n성장기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.0a90: "- C급 -\n성숙기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.0b92: "- B급 -\n성숙기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.0c94: "- A급 -\n완전체 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.0d96: "- S급 -\n최강의 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\nA급 우승자만 참가 가능."
text.0e90: "- R급 -\n배틀 로열 대회:\n승리의 열쇠는 작전\n\n4인 배틀 로열,\n2라운드, 참가자 8명.\n참가 조건 ? 없음."
text.0fc4: "- 버전 1 컵 -\n버전 1 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 1 디지몬만 참가 가능."
text.1100: "- 버전 2 컵 -\n버전 2 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 2 디지몬만 참가 가능."
text.123c: "- 버전 3 컵 -\n버전 3 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 3 디지몬만 참가 가능."
text.1384: "- 버전 4 컵 -\n버전 4 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 4 디지몬만 참가 가능."
text.14c6: "- 버전 0 컵 -\n버전 1 ? 4에 속하지 않는\n최강 디지몬의\n시간제한 시합.\n일대일 시합, 3라운드,\n참가자 8명. 버전 1 ? 4가\n아닌 디지몬만 참가 가능."
text.162c: "- 불꽃 컵 -\n불꽃 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 불꽃 속성\n디지몬만 참가 가능."
text.1766: "- 격투 컵 -\n격투 스포츠의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 투지가 넘치는\n디지몬만 참가 가능."
text.18b0: "- 천둥바람 컵 -\n하늘의 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 천둥바람 속성\n디지몬만 참가 가능."
text.19fe: "- 냉기 컵 -\n냉기 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 얼음 속성\n디지몬만 참가 가능."
text.1b30: "- 자연 컵 -\n자연 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 자연 속성\n디지몬만 참가 가능."
text.1c7c: "- 메탈 컵 -\n기계 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 기계 속성\n디지몬만 참가 가능."
text.1db6: "- 오물 컵 -\n오물 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 오물 속성\n디지몬만 참가 가능."
text.1eee: "- 공룡 컵 -\n고대의 혈통을 이은\n디지몬의 시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.201e: "- 날개 컵 -\n날개 달린 디지몬이\n힘을 겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.2130: "- 동물 컵 -\n야수의 혈통을 이은\n디지몬의 시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.2264: "- 인간 컵 -\n인간형 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
