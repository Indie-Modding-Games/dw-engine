text.0096: "네 얘기는 들었어."
text.00d6: "우리랑 마을 얘기를\n들었다면, 나랑 같이\n가지 않을래?"
text.0166: "나도 섬의 미래를\n생각하고 있어. 그래서\n뭔가를 찾는 중이야."
text.0218: "뭘 찾고 있는데?"
text.0252: "조상님들이 남긴 건데,\n그게 뭔지는\n나도 몰라."
text.02fe: "그렇구나. 내가 찾으면\n알려 줄게."
text.0354: "오랫동안\n찾아 왔어.\n쉽게 찾진 못할 거야."
text.03cc: "그래도 네가 찾아 준다면\n약속할게.\n너희 마을로 가겠어."
text.044c: "이거야?"
text.0474: "오, 바로 그거야!"
text.04b8: "조상님들이 남긴 글이야.\n어디 보자."
text.0524: "섬에 위험이 닥치면\n마을로 가라."
text.0592: "조상님들이 나더러\n가라고 하셨어!"
text.05de: "우릴 도와줄 거야?"
text.061e: "나만 믿어!"
text.0686: "레오몬이 마을에 들어왔다!"
text.06ca: "찾아야 할 게 있어.\n미안하지만 이만..."
text.0756: "{color:5}훈련:\n강펀치 특훈 {color:1}"
text.0796: "시작\n설명\n그만두기"
text.07ce: "일반\n보너스 도전\n그만두기"
text.080c: "콘크리트 샌드백을\n있는 힘껏 치는 훈련."
text.0868: "공격력과 최대 HP가\n올라간다."
text.08c4: "다시 설명\n시작\n그만두기"
text.091e: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.09a0: "{color:5}훈련: \n사바나 코스 {color:1}"
text.09de: "시작\n설명\n그만두기"
text.0a16: "일반\n보너스 도전\n그만두기"
text.0a54: "사바나 코스를 달리는 훈련."
text.0a8e: "속도가 크게 오르고\n최대 HP도 올라간다."
text.0afc: "다시 설명\n시작\n그만두기"
text.0b56: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
