text.0020: "내가 방해되나?"
text.0090: "{color:7}??? {color:1}\n살려 줘!"
text.00ca: "위에서 목소리가 들려.\n거기 누구 있어?"
text.012c: "{color:7}??? {color:1}\n거기 누구 있어?"
text.0162: "응, 여기 있어."
text.018a: "{color:7}??? {color:1}\n살려 줘!\n땅이 불룩 솟아오르고 있어."
text.01e8: "설마, 농담이지?"
text.0222: "{color:7}??? {color:1}\n아냐, 진짜야.\n기계 소리 같은 게 들려."
text.029a: "기계? 분명 오거몬의\n아지트에서 나는 소리야."
text.0312: "{color:7}??? {color:1}\n거기서 뭔가 잘못\n건드린 거 아니야?"
text.0386: "이것저것 많이 했지. 혹시\n엘리베이터인가.... 아지트로\n돌아가서 확인해 볼게."
text.0442: "{color:7}??? {color:1}\n고마워."
