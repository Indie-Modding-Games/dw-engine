text.00b8: "넌 누구야? 저리 가!"
text.00f2: "여기가 네 집이야?"
text.012c: "말해 줄 수 없어!"
text.0156: "너 경비라도 서는 거야?"
text.0198: "싸우자고? 내가 이길걸!"
text.01da: "좋아, 싸우자\n협박은 안 통해"
text.025c: "우와!"
text.02c4: "앗! 이봐!"
text.02e2: "{color:7}???몬 {color:1}\n하하하."
text.0310: "누구야?"
text.032c: "{color:7}???몬 {color:1}\n난 잘못한 거 없어.\n허락도 없이 남의 집에\n들어오지 마!"
text.03d2: "이만 가 봐야겠다."
text.0418: "경비 일 열심히 해!"
text.0452: "너 오거몬 산적단이지!\n여기가 너희 아지트구나!"
text.04ba: "무슨 소리야?"
text.0500: "지난번엔 운이 좋았지!\n포기해!"
text.0554: "우와!"
text.05b4: "지난번엔 속았지만,\n이번엔 꼭 잡고 말겠어."
text.061a: "무슨 소리야?"
text.0660: "이번엔 못 도망가!"
text.06ac: "자, 들여보내 줘."
text.06da: "한판 붙자는 거야?\n한 방에 날려 주마!"
text.0738: "싸우자\n괴롭히지 마"
