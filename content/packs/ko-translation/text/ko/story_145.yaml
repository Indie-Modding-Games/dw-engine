text.0054: "장난 그만 쳐!"
text.0084: "알았어. 다시는\n안 그럴 거야, 아마."
text.00e2: "여기가 마지막\n방인 것 같아."
text.0156: "{color:7}??? {color:1}\n어느 쪽?"
text.0198: "저 목소리... 와루몬자에몬\n같은데!"
text.01ec: "큰 상자냐, 작은 상자냐.\n네 마음은 다 읽힌다고!"
text.0250: "큰 상자\n작은 상자"
text.0304: "어? 으아아악!"
text.04a2: "하하하, 멍청하긴!\n틀렸다!"
text.052c: "오오, 들켰네!\n헤헤헤. 떨려?"
text.059a: "쳇, 뭐가 그렇게 웃겨?"
text.05ce: "어이쿠, 흥분하지 마.\n오늘은 무슨 일로 왔어?\n나 밑에서 일하고 싶어?"
text.0674: "네가 잡아간 내 친구를\n돌려줘!"
text.06c6: "친구? 무슨 소리야.\n내가 그런 짓을 할\n녀석으로 보여?"
text.0768: "응!"
text.077a: "오, 또 맞혔네!\n그래, 나야! 내가 했다!"
text.07ec: "하지만 돌려받을 순\n없을걸. 왜냐면 난\n와루몬자에몬이니까."
text.0878: "그렇게 나온다면\n억지로라도 받아 내겠어!"
text.08d2: "농담하냐?\n네가 날 이기겠다고?"
text.0930: "있잖아.\n정신 차리고 현실을\n좀 봐라!"
text.09e0: "야, 네가 잡아간 내\n친구 돌려줘."
text.0a4a: "으아아.... 말도 안 돼!\n믿을 수 없어,\n내가 지다니...."
text.0ae2: "어서!"
text.0afa: "뭐... 어쩔 수\n없지. 자."
text.0bd8: "어? 우와아.... 야!"
text.0d54: "야, 장난 그만 쳐,\n이제 됐어!"
text.0dae: "야, 농담도 못 알아듣냐?\n자. 이거야."
text.0e2c: "이게 뭐야?\n톱니바퀴잖아."
text.0e6e: "그래, 맞아."
text.0ea4: "이게 친구라고???"
text.0ed6: "글쎄, 다른 건 아무것도\n안 가져갔어. 진짜야."
text.0f32: "일단 이건\n가져갈게."
text.0f94: "너! 다시는 나쁜 짓\n하지 마, 알았지?!"
text.0ff8: "알았어. 다시는\n안 그럴 거야, 아마."
text.105c: "왠지 못 믿겠지만,\n할 일이 너무 많으니까\n이만 갈게."
text.1104: "이런, 아이템이 너무\n많아. 하나 버려야\n해."
text.1182: "{color:6}톱니바퀴{color:1}를 얻었다!"
text.11ba: "뭐야? 넌 누구야?"
text.11e6: "내가 누구냐고? 넌 누군데?!"
text.1292: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 20개까지\n가질 수 있다!"
text.1354: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 20개까지\n가질 수 있다!"
