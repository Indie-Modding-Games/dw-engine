text.0038: "아, 그래!"
text.0050: "호수 수호자의\n{color:6}푸른 피리{color:1}를 불까?"
text.00b6: "분다\n안 분다"
text.0188: "도움이 필요하니, 친구?"
text.01ce: "건너편으로 데려다줘."
text.020e: "좋아. 타."
text.033c: "시드라몬!"
text.0358: "또 만났군.\n부탁이라도 있나?"
text.03bc: "친구가 되자\n기술을 가르쳐 줘\n아이템을 원해"
text.0444: "우린 이미 친구잖아.\n다른 부탁은 없나?"
text.050c: "뭐, 뭐야... 이런!\n호수의 수호신잖아!"
text.056c: "어, 그래. 내가 시드라몬이다."
text.05a0: "그렇게 낚시를 해 대던 게\n바로 너였군!\n좋다. 부탁이라도 있나?"
text.0634: "뭐!? 왜 수호자라고\n불리는지 알겠어.\n응, 부탁이 있어."
text.06bc: "친구가 되자\n기술을 가르쳐 줘\n아이템을 원해"
text.0738: "좋아, 알았다."
text.0754: "이제부터 우린 친구다.\n그 증표로 이 피리를 주지."
text.07ec: "이런! 아이템이 너무 많아.\n몇 개 버려야겠어."
text.085e: "호수 수호자의\n{color:6}푸른 피리{color:1}를 받았다!"
text.08b4: "호수 근처에서 피리를\n불면 내가 오겠다.\n건너편으로 데려다주지."
text.095c: "건너편으로 갈 수\n있다는 거야? 고마워!"
text.09bc: "호수 건너편엔 이상한 숲이\n있다. 지금 바로\n가 보겠나?"
text.0a5e: "응, 갈래\n아니, 나중에"
text.0aaa: "기술을 가르쳐 주지."
text.0af6: "“물의 마법”을 습득했다!"
text.0b40: "“겨울 돌풍”을 습득했다!"
text.0b8e: "“기가 프리즈”를 습득했다!"
text.0bcc: "음, 더 가르쳐 줄 수 있는\n기술은 없는 것\n같구나..."
text.0c5c: "잘 가라!"
text.0ca8: "그럼, 이\n{color:6}물병{color:1}을 주지."
text.0d12: "이런! 아이템이 너무 많아.\n몇 개 버려야겠어."
text.0d84: "좋아,\n{color:6}물병{color:1}을 받았다!"
text.0dca: "잘 가라!"
text.0e16: "그럼, 내 등에 타라."
text.0ece: "그럼 또 보자."
