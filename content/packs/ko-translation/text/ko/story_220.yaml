text.0022: "{color:7}포요몬 {color:1}\n포요몬. 난 포요몬이야."
text.0084: "{color:7}포요몬 {color:1}\n진화 얘기를 해 줄게.\n음... 성숙기 디지몬 다음\n단계에 대한 얘기야."
text.014e: "{color:7}포요몬 {color:1}\n그건 완전체 디지몬이라고 해.\n하지만 성숙기가 꼭\n진화한다는 보장은 없어."
text.0214: "{color:7}포요몬 {color:1}\n진화 조건은 까다롭지만,\n완전체가 되면\n수명이 늘어나."
text.02d8: "{color:7}포요몬 {color:1}\n진화 아이템으로는\n수명이 늘지 않아."
text.0370: "{color:7}포요몬 {color:1}\n진화 얘기를 해 줄게.\n음... 진화 조건에\n대한 얘기야."
text.0428: "{color:7}포요몬 {color:1}\n먼저 체중이 다음 단계의\n체중 범위에 가까워야 해."
text.04b6: "{color:7}포요몬 {color:1}\n다음으로 능력치는 높을수록\n좋지만, 능력치마다\n효과가 달라."
text.0566: "{color:7}포요몬 {color:1}\n돌봄 실수 말인데, 원하는\n디지몬에 따라서는\n실수가 좋을 때도 있어."
text.062e: "{color:7}포요몬 {color:1}\n아, 맞다. 특정 디지몬이\n되려면 다른 특별한\n조건도 있어."
text.06d6: "{color:7}포요몬 {color:1}\n규율이 특히 높다거나,\n배틀을 많이 했다거나."
text.0756: "{color:7}포요몬 {color:1}\n그러면 기본 조건 세 가지를\n다 채우지 못해도\n진화할 수 있어."
text.082a: "{color:7}포요몬 {color:1}\n지지가 그러는데\n{color:10}{partner}{color:1}(이)가\n곧 진화할 거래."
text.089c: "{color:7}포요몬 {color:1}\n유아기에서 유년기\n디지몬까지는 6시간 걸려."
text.0920: "{color:7}포요몬 {color:1}\n그리고 성장기 디지몬이\n되는 데는 하루면 돼."
text.09ac: "{color:7}포요몬 {color:1}\n다음 단계인 성숙기까지는\n3일쯤 걸려."
text.0a2c: "{color:7}포요몬 {color:1}\n그다음 단계까지는 얼마나\n걸리더라? 까먹었지만\n더 오래 걸려."
text.0ab4: "{color:7}포요몬 {color:1}\n진화는 체중, 능력치,\n돌봄 실수의\n영향을 받아."
text.0b42: "{color:7}포요몬 {color:1}\n자세한 건 잘 모르니까\n다음에 지지한테 물어볼게."
