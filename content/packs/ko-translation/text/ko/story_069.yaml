text.0066: "한 방에 날려 주지!"
text.00ce: "한 번 더 하자."
text.00fa: "응\n아니"
text.0148: "조금만 더...\n자, 한 번만 더!"
text.01ae: "응\n아니"
text.020c: "이길 수가 없어!"
text.0230: "왜 그렇게 이기고 싶은데?"
text.026e: "그럼 뭘 하면 좋지?"
text.0298: "무슨 말이야?\n할 일이 하나도 없어?"
text.02f4: "시간이 남아돌아."
text.032c: "시간이 남으면 마을로 와.\n거기엔 온갖 디지몬이\n다 있어."
text.03d6: "좋아. 갈게.\n난 파타몬이야.\n나중에 봐."
text.0482: "파타몬이 마을에 들어왔다!"
text.04c8: "재미없어!"
text.04f6: "올 거야?"
text.052a: "아무 냄새도 안 나!"
text.0560: "맛있어 보이는데.\n꿀꺽 삼켜 주지!"
text.05b6: "하하, 너 웃기다!"
