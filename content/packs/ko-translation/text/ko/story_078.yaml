text.006e: "상인이 되고 싶어 하던\n녀석이 있었어. 어딘가에\n가게를 차렸다던데."
text.011c: "그 녀석이 나보다 쓸모 있어."
text.015c: "왜 여기는 다른 곳이랑\n시간이 다르게 흘러?"
text.01ba: "여기가 살기 편한 건\n분명한데..."
text.0240: "하늘에서 이곳저곳을\n둘러봤어."
text.0292: "북쪽엔 얼음과 눈뿐이야.\n그렇게 추운 곳에서\n사는 건 미친 짓이지."
text.0332: "하늘에서 이곳저곳을\n둘러봤어."
text.0384: "서쪽에 철로 만든\n작은 마을이 있어."
text.03e6: "근데 입구랑 출구가 닫혀\n있어. 난 날아갈 수 있지만."
text.0460: "하늘에서 이곳저곳을\n둘러봤어."
text.04b2: "뿔이나 발톱이 있는\n디지몬 무리가 있어."
text.0522: "나무를 깎아서 집을\n짓고 산다더라."
text.0594: "하늘에서 이곳저곳을\n둘러봤어."
text.05e6: "북서쪽에 건물이 있는\n숲이 있어."
text.0644: "아주 멀어."
text.066e: "하늘에서 이곳저곳을\n둘러봤어."
text.06c0: "대협곡을 지나가 봤어?\n거긴 꼭 미로 같아."
text.073a: "하늘에서 이곳저곳을\n둘러봤어."
text.078c: "섬 한가운데는 안 보여.\n구름밖에 안 보이거든."
text.0812: "이 얘긴 벌써 들었잖아."
text.0858: "여긴 시간이 느리게 흘러.\n여기서 반나절이\n바깥의 하루야."
text.08de: "쉬고 싶은 디지몬한테는\n딱 좋은 곳이지."
text.094e: "쾌속 지대에선\n시간이 빨리 흘러.\n바로 이 너머에 있어."
text.09d0: "거기선 하루 대신\n이틀이 지나가."
text.0a26: "디지몬이 빨리 자라지만\n그만큼 빨리 사라져."
text.0aaa: "자판기"
text.0ad0: "뭐가 나올까?\n하나에 200 Bits?\n사 볼까?"
text.0b54: "사 본다\n그만둔다"
text.0b96: "돈이 모자라."
text.0bec: "{color:6}고기{color:1}가 나왔다!"
text.0c24: "아이템이 너무 많아.\n몇 개 버려야겠어."
text.0cac: "{color:6}회복약(소){color:1}가\n나왔다!"
text.0d0a: "아이템이 너무 많아.\n몇 개 버려야겠어."
text.0d92: "{color:6}스테이크{color:1}가\n나왔다!"
text.0dce: "아이템이 너무 많아.\n몇 개 버려야겠어."
text.0e56: "{color:6}MP 플로피{color:1}가\n나왔다!"
text.0e9c: "아이템이 너무 많아.\n몇 개 버려야겠어."
