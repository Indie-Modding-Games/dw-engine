text.0062: "우와!"
text.0080: "으음."
text.00a0: "어, 이쯤 하자."
text.00e6: "아직 방심하면\n안 돼."
text.013c: "...!"
text.0180: "싫어, 하기 싫어!\n싸우기 싫단 말이야!"
text.01de: "싸우기 싫으면\n도망가."
text.023a: "아쉽네."
text.0268: "무슨 말인지 모르겠어."
text.029c: "그럼 우리 마을에\n오는 게 어때? 여기 숨어\n있는 것보단 나을걸."
text.032e: "어, 마을?"
text.0350: "억지로 데려가진\n않을게."
text.0394: "그렇게 말하니까 가고\n싶어지네. 좋아, 갈게!"
text.0426: "가부몬이 마을에 들어왔다!"
text.0464: "참 이상한 녀석이야."
