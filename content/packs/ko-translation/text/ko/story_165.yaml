text.0060: "마침 잘 와 주었구나!\n너에게만 할 수 있는\n큰 부탁이 있단다."
text.010c: "그게 뭔데?"
text.012a: "아날로그맨과\n머신드라몬에게서 느꼈던\n것과 똑같은 사악한 기운이란다."
text.01a6: "하지만 어디서 오는지\n알 수가 없구나."
text.01fe: "좋아, 나한테 맡겨!"
text.0236: "고맙구나. 그런데 말이다..."
text.0282: "머신드라몬을\n쓰러뜨렸다고 들었다!"
text.02d2: "응, 그런데 잘 모르겠어.\n꼭 아날로그맨의\n저주 같았거든."
text.035a: "그 원한이 무척 강했지.\n이제 평화가 올지도 모르겠구나."
text.03ce: "머신드라몬이 돌아와도\n또 이기면 돼."
text.0436: "넌 믿음직하구나. 고마운\n마음의 표시란다. 우리\n고기 농장에서 자랐지."
text.04d8: "우와! {color:6}사슬\n멜론{color:1}이잖아?"
text.0530: "아이템이 너무 많아."
text.0570: "고맙게 받을게!"
text.05c8: "오, 돌아왔구나!\n다른 누구에게도\n부탁할 수 없는 일이란다."
text.0648: "알았어. 아날로그맨이\n돌아왔다는 거야?"
text.0698: "사악한 기운은 느꼈지만\n어디 있는지는 모르겠구나."
text.06fc: "좋아, 나한테 맡겨!\n내가 찾아가서\n해결할게."
text.0780: "오, 고맙구나. 그런데 말이다..."
text.0800: "깼구나. 정말 미안하다."
text.086a: "이 기계는 뭐야?"
text.08a6: "그건 {color:4}메모리 카드 배틀\n데이터 저장기{color:1}란다."
text.0914: "그 기계를 쓰면 지금\n파트너의 배틀용 데이터를\n저장할 수 있단다."
text.09aa: "{color:6}△ {color:1}버튼만 누르면\n기계가 할 일을\n알려 줄 거다."
text.0a4e: "{color:4}메모리 카드 배틀\n데이터 저장기{color:1}를\n쓸 거니?"
text.0ace: "응\n아니"
text.0b04: "유라몬이 소문을 더\n모아 온 것 같아."
text.0b78: "유라몬이 새로운 소문을\n알고 있대."
text.0bda: "우리가 오고 나서\n마을이 점점 커지고\n달라지고 있어."
text.0c5a: "{color:6}{tamer}{color:1}, 너는\n모험하는 방식이\n정말 독특하구나."
