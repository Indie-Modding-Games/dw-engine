text.006c: "너 디지몬이야?"
text.00a6: "어디서 왔냐, 친구?!"
text.00e8: "날 놀리지 마!"
text.0128: "꿀꺽 삼켜 주마!"
text.01a4: "이런, 아무것도 안 하면\n말라 버릴 거야..."
text.020a: "비가 오면 좋겠다..."
text.023e: "우와, 신기하다.\n싹이 트고 있어."
text.0294: "조금 움직였어.\n이게 다들 말하는\n그 신비한 식물인가?"
text.0340: "시들고 있어. 아무것도\n안 하면 죽고 말 거야."
text.03ac: "아이템을 쓸까?"
text.03de: "응\n아니"
text.0410: "지금은 아무것도 없어."
text.045c: "쓸 만한 게 하나도 없어."
text.04ae: "이걸론 안 되겠어..."
text.0800: "헤헤헤."
text.0818: "안녕, 난 베지몬이야!"
text.084c: "뭐야! 식물 디지몬이잖아?"
text.0880: "그건 그렇고, 너 채소\n좋아해?"
text.08d4: "왜 나한테 채소 얘기를\n묻는 거야? 응?"
text.0932: "좋아해\n싫어해"
text.0966: "음, 마음이 바뀌었어."
text.09a8: "채소를 좋아하는 녀석은\n분명 좋은 녀석일 거야."
text.0a14: "아냐, 아냐!\n채소는 맛있다고!"
text.0a52: " ? ? ? "
text.0a68: "좋아, 결심했어.\n너랑 같이 갈래!"
text.0acc: "정말 끈질긴 녀석이네...\n야, 잠깐만!"
text.0b1e: "그럼 안 갈래!\n안녕!"
text.0b60: "마음 좀 정해!"
text.0b8c: "나보고 어쩌라는 거야?"
text.0bd0: "마을에 와서\n우리를 도와줘!"
text.0c36: "좋아, 그거 괜찮네.\n여기 너무 오래 있었어."
text.0cea: "베지몬이 마을에 들어왔다!"
