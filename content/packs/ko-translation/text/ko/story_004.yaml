text.0090: "글자가\n새겨져 있다."
text.00dc: "여긴 아무도 없어! 돌아가!"
text.011e: "누가 여기 사나?"
text.0176: "{color:7}? ? ? {color:1}\n원숭이도 나무에서 떨어진다."
text.01c8: "{color:7}? ? ? {color:1}\n플라잉 니 드롭!"
text.025e: "졌지만,\n너희는 별것도 아니야!"
text.02b4: "억지 부리지 마.\n우리를 기습까지\n했으면서."
text.0344: "으윽! 이렇게 된 이상\n어쩔 수 없지..."
text.0394: "너희 마을에서\n내가 얼마나 센지\n보여 주마! 두고 봐!"
text.0462: "에테몬이 마을에 들어왔다!"
text.04a0: "다치기만 할 거야."
text.04e0: "완전 애기네!"
text.051c: "좀 놀아 줄 수는 있겠네."
text.056a: "코를 납작하게 해 주지!"
text.05aa: "반으로 쪼개 주마!"
