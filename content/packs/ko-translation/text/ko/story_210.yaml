text.00bc: "기다리고 있었단다,\n{color:6}{tamer}{color:1}.\n드디어 이날이 왔구나"
text.0130: "무슨 일이야?"
text.0154: "무한 산으로 가는 입구가\n나타났단다."
text.01a8: "뭐? 정말? 어디에?"
text.01d8: "마을의 폭포\n너머에 있단다."
text.0224: "와, 엄청 가깝잖아!"
text.0254: "내 생각엔, 마지막 적은\n무한 산에 있을 게다."
text.02c4: "그럼 거기가 마지막 던전이네.\n해 보겠어!"
text.0316: "행운을 빈다! 하지만\n서두르면 안 된다. 준비가\n다 될 때까지 기다리거라."
text.03ce: "마을에 있는 폭포\n건너편에 무한 산으로\n가는 입구가 있단다."
text.0478: "내 생각엔, 마지막 적은\n무한 산에 있을 게다."
text.04e6: "준비를 단단히 하고 가거라!"
text.051c: "그건 그렇고..."
text.0546: "지금 마을의 번영도는\n{num:pstat=1}점이란다."
text.05b4: "예전 모습에는\n아직 한참 못 미치는구나."
text.060e: "이제야 겨우 모양이 잡혔구나."
text.0658: "잘 발전하고 있구나."
text.0698: "훌륭한 마을이 되어 가는구나."
text.06e2: "정말 잘해 주었구나.\n훌륭하다!"
text.073a: "더 이상 할 말이 없구나.\n정말 멋지단다!"
text.07be: "{color:7}테이머 레벨이\n올랐다! {color:1}"
text.0808: "{color:7}축하해!\n수고한 너에게\n메달을 줄게! {color:1}"
