text.002c: "입구 간판을 고쳤어."
text.0086: "더워! 어떻게 좀 해 봐!"
text.00c8: "무슨 일이야?"
text.00f4: "너무 더워!\n더는 못 참겠어!"
text.0178: "더위 때문에\n좀 이상해졌어."
text.01c8: "더운 건 알지만...\n진정해, 친구!"
text.0218: "파면 팔수록 더워져.\n이 터널은 화산 속에\n있거든."
text.02a0: "그게 다는 아닌 것\n같아. 근처에 불이\n난 걸지도 몰라."
text.0330: "흐음"
text.0340: "어쩔 수 없지.\n더위를 참고\n계속 파야겠어."
text.03d0: "원인은 우리가 알아볼게.\n터널이 뚫리면\n정말 좋겠다."
text.045a: "너 좋은 녀석이구나.\n서둘러서 이 터널을\n뚫어 볼게!"
text.050e: "오늘은 내가\n요리 당번이야."
