text.0060: "다아!"
text.007e: "하아!"
text.009c: "크헤에!"
text.00c6: "동쪽: 엘리베이터\n서쪽: 위험, 절벽"
text.0120: "오거 모드 : ON\n오거 모드 : OFF"
text.0196: "뭐야?"
text.01fa: "땅이 움직인 것 같은데.\n기분 탓인가?"
text.02c8: "뭐? 말도 안 돼!"
text.0344: "{color:6}{tamer}{color:1}우와!!"
text.0370: "낙석 주의!"
text.03d6: "이 길에 산적들이\n나타난다고 들었어."
text.0438: "가자, {color:10}{partner}{color:1}."
text.0480: "유후!"
text.049c: "하하!"
text.04b0: "야호!"
text.050e: "순순히 짐을 두고 가!\n안 그러면 알지?"
text.0562: "아니, 너희나 포기해!"
text.058a: "뭐?! 너는...?"
text.05ae: "말도 안 돼."
text.05ce: "두목, 어떡하죠?"
text.0602: "걱정 마, 우리가 더 세고\n숫자도 더 많아.\n덤벼라!"
text.06d2: "언젠가 꼭\n갚아 주마!"
text.0724: "도망가는 것 좀 봐! 한동안\n안 돌아올 거야."
