text.006a: "지난번 지진 때\n흙과 모래가 사라졌어!"
text.00ee: "지금 시각은\n{num:pstat=105}월 {num:pstat=106}일\n{num:pstat=107}시 {num:pstat=108}분."
text.016e: "{color:10}{partner}{color:1}은(는)\n데이터형 디지몬이지?"
text.01c6: "{color:10}{partner}{color:1}은(는)\n백신형 디지몬이지?"
text.0224: "{color:10}{partner}{color:1}은(는)\n바이러스형 디지몬이지?"
text.027c: "난 여러모로 쓸모가 있어.\n뭘 해 줄까?"
text.02f2: "능력치 바꾸기\n시간 빨리 가게 하기\n여기를 가게로 바꾸기"
text.038c: "최강으로 만들기\n엄청 약하게 만들기\n평범하게 만들기"
text.0416: "1시간 지나게 하기\n6시간 지나게 하기\n24시간 지나게 하기"
