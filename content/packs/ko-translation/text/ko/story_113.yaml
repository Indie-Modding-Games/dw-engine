text.0094: "곧장 가서\n오른쪽으로 꺾어. 헤헤헤..."
text.0108: "오른쪽으로 꺾고\n바로 왼쪽. 헤헤..."
text.016c: "이 숲에선 못 나갈걸.\n헤헤헤..."
text.01dc: "길을 잃었어!"
text.0208: "요즘 좀 피곤해."
text.024e: "너? 설마!?"
text.027e: "발밑을 조심해."
text.02cc: "야, 너!"
text.0318: "흠, 너 제법인데!\n아침 일찍부터\n꽤 괜찮았어."
text.03c2: "야, 야, 남 일처럼\n굴지 마!"
text.0438: "알아! 무슨 얘긴지\n알고 있어."
text.0490: "디지몬을 모아서\n섬을 위해 애쓰고\n있다며?"
text.0520: "알고 있구나. 그럼\n나 좀 도와줘."
text.057a: "그래서, 내가 어디서\n뭘 하면 되는데?"
text.05d2: "아휴, 그것도 몰라!\n마을에서 일하는 거잖아,\n기억 안 나?!"
text.066c: "뭐, 그런 말 있잖아...\n일찍 일어나는 새가\n모이를 먹는다고."
text.06e2: "그게 무슨 상관이야!\n게다가 모이가 아니라\n벌레를 잡는 거거든!"
text.078a: "농담이야. 그럼\n마을에서 보자..."
text.0830: "코카토리몬이 마을에 들어왔다!"
text.0876: "정말 믿어도 될까?\n글쎄..."
text.08de: "어, 새 깃털이 떨어져\n있어. 아직 새것이야.\n우리가 늦은 걸까?"
