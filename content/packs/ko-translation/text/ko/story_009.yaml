text.004c: "자판기"
text.007a: "세상에, 엄청 비싸네!"
text.00b6: "고기: 300 Bits\n디지버섯: 600 Bits\n안 산다"
text.015e: "돈이 모자라."
text.01b2: "돈이 모자라."
text.01f6: "{color:6}고기{color:1}가 나왔다!"
text.023e: "앗, 짐이 너무 많아."
text.0286: "{color:6}디지버섯{color:1}이\n나왔다!"
text.02ec: "앗, 짐이 너무 많아."
text.0338: "낚시하는 법:\n먼저 “낚싯대”를 구해.\n그러면 {color:5}× {color:1}서브 메뉴에\n“낚시” 아이콘이 생겨.\n그걸 고르고 {color:6}△ {color:1}로 미끼를\n달아. 가진 먹이 중에서\n하나를 고르면 돼."
text.0480: "다음엔 좌우 버튼으로 방향을\n바꾸고, {color:6}△ {color:1}로 낚싯대를 들어.\n다시 {color:6}△ {color:1}로 던지면 돼.\n찌가 움직일 때까지 기다려.\n찌가 움직이면 물고기가\n미끼를 문 거야.\n{color:6}△ {color:1}로 끌어당겨."
text.05f8: "왼쪽 위의 게이지를 봐.\n게이지가 차기 전에 {color:6}△ {color:1}를\n놓아. 안 그러면 줄이\n끊어지니까 조심해.\n찌를 충분히 가까이\n끌어당기면\n물고기를 잡은 거야."
text.077a: "물고기 그림자에 “X”가 뜨면\n지금 미끼로는\n낚을 수 없다는 뜻이야."
