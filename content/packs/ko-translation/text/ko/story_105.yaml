text.00ae: "뭐야?!"
text.00e8: "우와!"
text.0104: "...? ...!"
text.011e: "뭐? 지금?!\n좋아, 붙어 보자!"
text.0196: "졌다. 쳇!"
text.01bc: "마을로 오라고\n해 봐야겠다."
text.0206: "저, 있잖아."
text.022c: "혹시...\n마을에 와 줄래...?"
text.027e: "뭐? 마을?!"
text.029c: "그... 낡은 데 말이야?"
text.02dc: "글쎄..."
text.02f0: "음......"
text.0306: "으음........."
text.0332: "뭐, 좋아.\n난 아구몬이야.\n반가워."
text.03c6: "아구몬이 마을에 들어왔다!"
text.0408: "좋아, 해 보길 잘했어.\n계속 물어봐야지!"
text.0478: "여긴 내 영역이야!"
text.04b8: "뭐?!"
text.04da: "지금이 기회다!"
text.0810: "이 녀석한테서\n도저히 못 벗어나겠어!"
