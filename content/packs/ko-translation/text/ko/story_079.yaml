text.009c: "여기서부터는\n쾌속 지대야.\n너무 가까이 가지 마."
text.012e: "나한텐 목표가 두 개 있어.\n하나는 섬에 닥친\n위험을 알아내는 거야."
text.01b2: "다른 하나는 디지몬을\n마을로 데려가는 거고."
text.0212: "그래서 하고 싶은 말이 뭔데?"
text.023e: "도와줘\n아냐, 됐어"
text.0286: "안 돼. 난 이 숲을\n지켜야 하거든."
text.02d4: "그럼 섬에 닥친 위험에 대해\n뭐 아는 거 없어?"
text.0346: "아무것도 몰라. 잠깐만."
text.037c: "얼마 전에 하늘에서\n커다란 바위가\n떨어진 게 기억나."
text.03fc: "어디에 떨어졌는데?"
text.0428: "쾌속 지대에. 숲\n반대편이야."
text.04a2: "보내 줘! 뭔가 단서를\n찾을 수 있을지도 몰라!"
text.0506: "..."
text.0512: "정 그렇다면야.\n가서 조사해 봐."
text.057e: "여기서부터는\n시간이 두 배로 빨리 흘러.\n먹을 걸 넉넉히 챙겨 가."
text.0610: "너무 늙어 버리지 않게\n조심해야 해."
text.0672: "다른 곳도 둘러보는 게\n좋을 거야."
text.06dc: "여기서부터는\n시간이 두 배로 빨리 흘러.\n먹을 걸 넉넉히 챙겨 가."
text.076e: "너무 늙어 버리지 않게\n조심해야 해."
text.07dc: "무슨 일 있었어?"
text.0810: "아직은 없어."
text.0828: "스승님 말로는\n비밀 통로가 있대."
text.0890: "근데 어딘지는 몰라."
text.08da: "그게 뭔데?"
text.08f8: "운석 같은데!\n걱정할 건 없어."
text.096c: "미안하지만 내가 아는 건\n그게 다야."
text.09ae: "그래도 고마워."
text.09da: "받아라!"
text.0a82: "한심한 녀석!"
text.0aac: "스승님?!"
text.0ac4: "아직도 여기 있을\n줄이야!"
text.0b1c: "스승님? 누군데?"
text.0b4c: "하지만 스승님, 고대 공룡\n지대는 누가 지키나요?"
text.0bba: "지금 섬이 아주 위태롭다.\n마을로 가서\n다른 이들을 돕거라!"
text.0c5c: "네, 스승님!"
text.0c7c: "정말 그래도 괜찮아?!"
text.0cba: "아직 어리지만\n잘 부려 주려무나.\n여긴 내가 지키마."
text.0d54: "스승님..."
text.0d74: "{color:6}{tamer}{color:1}, 이렇게 됐으니\n나 마을로 가도 될까?"
text.0de4: "열심히 해야 한다."
text.0e12: "네!\n스승님, 다녀오겠습니다!"
text.0e92: "티라노몬이 마을에 들어왔다!"
text.0ed6: "저 녀석이 뭘 할 수 있으려나?"
text.0f1a: "여길 지키는 건\n정말 오랜만이구나."
text.0f7a: "언제든 지나가도 된단다."
text.0fc2: "여길 지키는 건\n정말 오랜만이구나."
text.1022: "언제든 지나가도 된단다."
