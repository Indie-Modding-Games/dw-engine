text.005c: "마이오티스몬! 무슨 일이야?"
text.00b0: "바케!"
text.00c6: "..."
text.00ea: "경기장에서 보자.\n부하들이 날 보고 싶어 할 거야."
text.0172: "부하들이 말을 안 들어.\n스컬그레이몬은 내가 데려가지."
text.01d8: "스컬그레이몬이 예전 같지\n않아. 이젠 남의 말을 들어."
text.024e: "마이오티스몬, 괜찮아?"
text.02a8: "으윽... 너구나!\n또 날 구해 줬네."
text.0306: "무슨 일이 있었어?"
text.032a: "데비몬을 봤어?"
text.035e: "봤어. 아주 못된 녀석이야."
text.038a: "그 녀석이 사악한 힘으로\n내 연구를 망쳐 놨어."
text.03da: "스컬그레이몬에 대한\n연구 말이야?"
text.0422: "뼈를 모아서 하나씩\n맞추고 있었거든.\n앞으론 더 조심해야지."
text.04b8: "데비몬은 정말 지독해."
text.04ec: "그 녀석은 내가 잘 알아."
text.0514: "뭐?!"
text.0528: "원래 꾀가 많긴 했지만\n이렇게 못되진 않았어."
text.0580: "누군가한테 세뇌당한\n건지도 몰라."
text.05d8: "그럴지도."
text.05ec: "원래 모습이라면 너희와\n함께할 수도 있을 텐데."
