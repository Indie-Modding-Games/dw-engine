text.0042: "마이오티스몬이 여기 없어."
text.00b2: "어... 내 고기 냉장고 열쇠?"
text.00f4: " ! "
text.0102: "누가 날 도우러 와 준 거야?"
text.013a: "디지몬? 괜찮아?"
text.016a: "넌 누구야? 먹을 것 좀 줘!"
text.01a6: "배고파? 뭘 먹고 싶어?"
text.01e0: "고기."
text.020c: "고기 있어!"
text.022a: "고기."
text.023c: "뭐?"
text.0252: "고기? 아니, 하나도 없는데."
text.028e: "자, 여기."
text.02a4: "열쇠?"
text.02c4: "뭔가를 버려야겠어."
text.0312: "{color:6}냉장고 열쇠{color:1}를 얻었다!"
text.0342: "알았어..."
text.0358: "시간이 별로 없어!"
text.038c: "금방 먹을 걸 가져올게.\n조금만 더 버텨."
text.03fc: "휴!"
text.041e: "살았다. 정말 고마워.\n폐를 끼쳐서 미안해."
text.0488: "무슨 일이 있었던 거야?"
text.04ac: "나는 마이오티스몬.\n이 저택의 주인이야."
text.0500: "나는 {color:6}{tamer}{color:1}, 다른\n세계에서 온 인간이야. 이쪽은\n내 파트너 {color:10}{partner}{color:1}."
text.0580: "우린 이 섬을\n구하러 왔어."
text.05c4: "할 이야기가 많을 것 같군.\n잘 왔어. 환영해."
text.0678: "우와!"
text.0688: "..."
text.0696: "진심이야?"
text.06c6: "사라졌어. 이거 꿈인가?"
text.0746: "해결한 것 같아."
text.078e: "뭐?"
text.07a6: "어? 뭐야?"
text.07ca: "정신을 잃었었어. 미안해."
text.084e: "아날로그맨의 저주야!\n걱정 마, 괜찮아질 거야."
