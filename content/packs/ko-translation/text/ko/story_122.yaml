text.0020: "내가 방해돼?"
text.0056: "덕분에 살았어!"
text.0078: "너였구나."
text.009c: "마침 잘됐다."
text.00cc: "뭐?"
text.00e2: "내 재능을 제대로 쓰려고\n너희 마을로 가던\n길이었거든!"
text.0160: "무슨 재능인데?"
text.0190: "어머, 나 몰라?\n디지몬들 사이에선 척척박사로\n유명하다고!"
text.0224: "정말?\n처음 듣는데."
text.026c: "마을에 갈 준비 다 됐어."
text.02b4: "정말 도움이\n될까?"
text.0302: "또 봐!"
text.0350: "셸몬이 마을에 들어왔다!"
