text.00c8: "어서 오너라, 젊은이."
text.0108: "체리몬 맞지?"
text.0144: "누구냐?"
text.0164: "나 같은 늙은이한테\n무슨 볼일이냐?"
text.01ca: "먼저 안개를 걷어 줘."
text.0200: "안개 때문에 앞이 안 보여.\n좀 없애 줄 수 있어?"
text.026c: "그런 거였구나. 알겠다."
text.02a6: "... 안 되는 거야?"
text.02da: "먼저 내 이야기를\n들어 보거라. 자...\n어디서부터 시작할까."
text.0364: "섬에 생긴 이변에 대해\n알고 있다면,\n부디 말해 주렴."
text.03fa: "그렇지, 그렇지.\n이변 말이로구나."
text.043e: "이 섬은 80년 전\n땅이 변한 뒤로\n달라지기 시작했단다."
text.04de: "섬의 북동쪽 땅이\n80년 전에 갑자기\n나타났지."
text.0574: "그 뒤로 디지몬들이\n떠나기 시작했고,\n종족은 흩어졌단다."
text.05fa: "그리고 종족마다\n제각기 말을 쓰게 됐지."
text.066a: "마을에서 쓰던 말을\n잊어버린 게야..."
text.06d2: "결국 파일 시티는\n디지몬 주민을 거의\n다 잃고 말았단다."
text.0752: "그러다 디지몬들이\n기억을 잃기 시작했어!"
text.07a8: "섬의 역사, 자신의 과거,\n감각까지... 날이 갈수록\n나빠지고 있단다."
text.0844: "너에게 꼭 할 중요한\n이야기가 있는데, 그것도\n기억이 안 나는구나."
text.08e6: "하지만 결국 모든 건\n하나로 모일 게다. 누군가가\n그렇게 만들고 있어!"
text.097c: "이대로면 디지몬들은\n이변을 당연하게\n여기게 될 게다."
text.0a08: "이걸 막을 수 있는 건\n너와, 디지몬을 하나로 묶는\n파일 시티의 힘뿐이란다!"
text.0ab8: "마을에 디지몬을 모아\n기적을 일으키거라.\n반드시 일어날 게다."
text.0b54: "허허, 너무 흥분했구나.\n휴, 할 말은 다 했다."
text.0bd4: "자, 안개를 걷어 주마."
text.0c20: "숲에 안개를 친 건\n너와 이야기하기 위해서\n였단다. 아, 하나 더..."
text.0cd0: "숲에는 과거를 아는\n자들이 또 있단다."
text.0d44: "할 수 있다면 숲 깊숙이\n들어가 찾아보거라."
text.0dbc: "늙은이 이야기를 들으러\n또 왔느냐?"
text.0e24: "섬에 대해서...\n{color:10}{partner}{color:1} 훈련시켜 줘\n아니, 됐어"
text.0e98: "내 이야기는 이렇단다."
text.0eda: "오, 그러냐."
text.0efe: "{color:5}훈련: 숲의 가르침 {color:1}"
text.0f56: "시작\n설명\n그만두기"
text.0f8e: "일반\n보너스 도전\n그만두기"
text.0fcc: "체리몬이 많은 지식을\n전해 준다. 지혜가\n크게 오른다."
text.1068: "다시 설명\n시작\n그만두기"
text.10c2: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.1138: "허허허."
