text.004e: "앗!"
text.006a: "앗!"
text.0096: "엘리베이터 때문에\n땅이 솟아오르는 건가?"
text.0102: "탄다\n안 탄다"
text.0190: "야!"
text.01b0: "뭐야?"
text.01c0: "지러 여기까지 왔냐?"
text.0208: "그건 내가 할 말이야!"
text.0232: "이번엔 봐주지 않겠다.\n울려 주마!"
text.02d6: "우와!"
text.02e6: "이런!"
text.0312: "젠장!"
text.03b6: "무슨 일이야?"
text.0460: "잘 있어라, 바보들아!"
text.0496: "젠장, 놓쳤어!"
text.04de: "탈출용 엘리베이터가 있어.\n쫓아가 봐야 소용없어."
text.05a8: "넌 누구야?"
text.05c8: "내가 누구냐고? 넌 누군데?"
text.0672: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 20개까지\n가질 수 있다!"
text.0722: "{color:4}차원 열쇠고리{color:1}를 얻었다!\n이제 아이템을 30개까지\n가질 수 있다!"
