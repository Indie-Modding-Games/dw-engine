text.00f8: "다녀왔어!"
text.0122: "초대해 줘서 고마워.\n앞으로 잘 부탁해,\n{color:10}{partner}{color:1}."
text.01c6: "{color:7}테이머 레벨이\n올랐다! {color:1}"
text.020c: "{color:7}축하해!\n메달을\n줄게. {color:1}"
text.026c: "머신드라몬 카드를 받았다!"
text.0782: "호수의 수호신를\n본 적 있어?"
text.07c8: "못 봤으면\n남쪽에서 기다려 봐."
text.083e: "아침 일찍 일어나서\n안개 속을 걸어 봐.\n좋은 일이 생길 거야!"
text.08de: "북쪽에 빙산 해변이라는\n곳이 있는 거\n알아?"
text.0962: "그 해변에 커다란\n디지몬이 자주 나타난다는\n소문이 있어."
text.09f4: "산적들은 해치웠어?\n산적단이 있다고\n들었거든."
text.0a8c: "대협곡에 가 본 적 있어?"
text.0ac6: "산적들이 거기 있다는\n소문이 있어."
text.0b1e: "나쁜 녀석들이야?"
text.0b4a: "덮쳐서 물건을 빼앗아 가."
text.0b86: "우리가 어떻게 해 보자."
text.0bd8: "대협곡에 가 본 적 있어?"
text.0c12: "거기에 투명 다리가\n있다는 소문이 있어."
text.0c96: "머신드라몬이\n돌아왔다던데."
text.0cea: "머신드라몬을\n또 이겼구나."
text.0d2e: "마을 주변에 대해\n설명해 줄게."
text.0d88: "원시의 숲이\n마을을 둘러싸고 있어."
text.0dd0: "그 근처 디지몬은\n그렇게 세지 않아."
text.0e2c: "서쪽에는\n훈련장이 있어."
text.0e7a: "강 건너 동쪽에는\n열대 정글이 있어."
text.0ed2: "그 너머에 뭐가 있는지는\n나도 몰라."
text.0f18: "서쪽에는\n산과 호수가 있어."
text.0f70: "남쪽으로 가면 바다가 있어."
text.0fb4: "북쪽에는\n높은 산이 있어."
text.1006: "이 마을은\n섬의 한가운데에 있어."
text.1058: "소문을 알아볼게.\n다시 오면 더 알려 줄게."
text.10c8: "이 근처에 뭐가 있나 볼까."
text.1108: "화장실은 별로지만\n나머지는 다 괜찮아!"
text.117e: "꽤 활기차 보이네."
text.11b2: "팩토리얼 마을로\n안 돌아가도 돼?"
text.120c: "일정 관리 기능은\n정상 작동 중. 문제없음."
text.1282: "마침 잘 왔어!"
text.12be: "이 조각상 좀 봐!\n어때?"
text.1318: "정말 걸작이야.\n내가 생각해도 놀라워."
text.1364: "그게 무슨 뜻이야?\n날 놀리는 거지!"
text.13be: "우리 무슨 얘기 하고 있었지?\n뭐, 아무렴 어때."
text.141e: "내가 무슨 생각을 했더라?\n알아내면\n말해 줘."
text.14e2: "자는 중..."
text.1516: "그 얘기 들었어? 열대 정글에\n이상한 식물이\n자라고 있대."
text.15b2: "아, 맞다,"
text.15c8: "저기에 {color:6}비 식물\n{color:1}을 심었어."
text.1618: "매년 15일쯤에\n열매가 열려.\n따 가도 돼."
text.16a4: "왜?"
text.16cc: "아, 기분 좋다!\n햇살이야."
text.170e: "아, 기분 좋다!\n햇살이야."
text.1766: "좋아, 이거 최고야!"
text.17be: "앗, 이건..."
text.17f6: "아이템이 너무 많아."
text.1822: "{color:6}비 식물\n열매{color:1}를 얻었다!"
text.1902: "바다로 데려다줄게.\n그게 내 일이야."
text.195c: "바다로만 갈 수 있는 곳에\n데려다줄게."
text.19c8: "그럼..."
text.19ea: "흠, 어디로 갈까?\n팩토리얼 마을이나\n해변 동굴도 좋고."
text.1a6c: "팩토리얼 마을\n비밀 해변 동굴\n안 간다"
text.1b5a: "찾았다!"
text.1b88: "이런, 우리 쪽으로\n곧장 오고 있어!"
text.1be2: "드디어 만났군!\n난 그레이몬이다.\n자, 승부를 내자!"
text.1c62: "뭐?!"
text.1c76: "네 소문을 따라서\n여기까지 왔다.\n너랑 싸우고 싶어!"
text.1d00: "내가 이기면\n이 도로 표지판을 받겠다!"
text.1d54: "표지판 같은 건 없는데."
text.1d7c: "상관없어,\n아무튼 싸우자!"
text.1e08: "야, 너희 제법이구나!\n하지만 목표를 이루기엔\n아직 풋내기야."
text.1ea6: "흐음"
text.1eb6: "내가 남아서 훈련시켜 주지.\n훨씬 강해질 거다!"
text.1f56: "그레이몬이 마을에 들어왔다!"
text.200c: "좋아, 찾았다, {color:6}{tamer}{color:1}!"
text.2048: "매복이다!"
text.205e: "내 목표는 너를 쓰러뜨리는 것."
text.2094: "저 눈! 세뇌당한 게\n틀림없어!"
text.2126: "무슨 수를 써서라도\n저 녀석을 쓰러뜨려야 해."
text.218c: "무슨 소리야?\n너 치료 좀 받아야겠다."
