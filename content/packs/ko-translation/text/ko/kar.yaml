"penguinmon_dialogue.0000": " 펭귄몬 "
"penguinmon_dialogue.0001": "먼저 컬링 스톤을"
"penguinmon_dialogue.0002": "골라 줘."
"penguinmon_dialogue.0004": " 펭귄몬 "
"penguinmon_dialogue.0005": "무거운 것, 중간 것, 가벼운 게"
"penguinmon_dialogue.0006": "있으니까 어떤 순서로"
"penguinmon_dialogue.0007": "쓰면 좋을지 생각해 봐."
"penguinmon_dialogue.0008": " 펭귄몬 "
"penguinmon_dialogue.0009": "다리 네 개짜리 스톤도 있어."
"penguinmon_dialogue.0010": "떨어진 자리에 딱 멈추니까"
"penguinmon_dialogue.0011": "아주 쓸모가 있지."
"penguinmon_dialogue.0012": " 펭귄몬 "
"penguinmon_dialogue.0013": "방향 버튼을 왼쪽, 오른쪽으로"
"penguinmon_dialogue.0014": "움직여서 던질 방향을 "
"penguinmon_dialogue.0015": "정하는 거야."
"penguinmon_dialogue.0016": " 펭귄몬 "
"penguinmon_dialogue.0017": "방향 버튼 위아래로 화면을"
"penguinmon_dialogue.0018": "움직일 수 있어. {prompt:confirm} 버튼으로"
"penguinmon_dialogue.0019": "던질 방향을 정해."
"penguinmon_dialogue.0020": " 펭귄몬 "
"penguinmon_dialogue.0021": "파워 게이지가 원하는 곳에"
"penguinmon_dialogue.0022": "왔을 때 {prompt:confirm} 버튼을 눌러서"
"penguinmon_dialogue.0023": "던지는 힘을 정해."
"penguinmon_dialogue.0024": " 펭귄몬 "
"penguinmon_dialogue.0025": "컬링 스톤이 멈춰서"
"penguinmon_dialogue.0026": "GOOD 마크에 닿으면"
"penguinmon_dialogue.0027": "2점을 얻어."
"penguinmon_dialogue.0028": " 펭귄몬 "
"penguinmon_dialogue.0029": "파란 선 위에 있지만"
"penguinmon_dialogue.0030": "가운데 GOOD 마크 밖이면"
"penguinmon_dialogue.0031": "1점이야."
"penguinmon_dialogue.0032": " 펭귄몬 "
"penguinmon_dialogue.0033": "오른쪽 아래의 BAD에 닿으면"
"penguinmon_dialogue.0034": "2점을 잃으니까"
"penguinmon_dialogue.0035": "조심해."
"penguinmon_dialogue.0036": " 펭귄몬 "
"penguinmon_dialogue.0037": "그리고 동점일 때는"
"penguinmon_dialogue.0038": "내가 이기는 거야!"
"penguinmon_dialogue.0039": "그럼 게임을 시작하자!!"
"penguinmon_dialogue.0040": " 펭귄몬 "
"penguinmon_dialogue.0042": "별로 대단하지 않네!"
"penguinmon_dialogue.0044": " 펭귄몬 "
"penguinmon_dialogue.0045": "승부는 이제부터야!"
"penguinmon_dialogue.0048": " 펭귄몬 "
"penguinmon_dialogue.0049": "오, 꽤 잘하는데!"
"penguinmon_dialogue.0052": " 펭귄몬 "
"penguinmon_dialogue.0053": "앗싸! 내가 이겼다!"
"penguinmon_dialogue.0056": " 펭귄몬 "
"penguinmon_dialogue.0057": "아, 졌다. "
"metalmamemon_dialogue.0000": " 메탈마메몬 "
"metalmamemon_dialogue.0001": "응. 먼저 컬링 스톤의"
"metalmamemon_dialogue.0002": "종류를 골라야 해."
"metalmamemon_dialogue.0004": " 메탈마메몬 "
"metalmamemon_dialogue.0005": "나는 천재라서 여러 스톤을"
"metalmamemon_dialogue.0006": "알맞은 순서로 쓸 수 있지."
"metalmamemon_dialogue.0007": "그게 이기는 비결이야."
"metalmamemon_dialogue.0008": " 메탈마메몬 "
"metalmamemon_dialogue.0009": "다리가 네 개 달린 스톤은"
"metalmamemon_dialogue.0010": "떨어진 자리에 멈춰 서니까"
"metalmamemon_dialogue.0011": "아주 귀중하지."
"metalmamemon_dialogue.0012": " 메탈마메몬 "
"metalmamemon_dialogue.0013": "던질 방향은 방향 버튼을"
"metalmamemon_dialogue.0014": "왼쪽, 오른쪽으로"
"metalmamemon_dialogue.0015": "움직여서 정해."
"metalmamemon_dialogue.0016": " 메탈마메몬 "
"metalmamemon_dialogue.0017": "방향 버튼 위아래로"
"metalmamemon_dialogue.0018": "화면을 움직일 수 있어."
"metalmamemon_dialogue.0019": "{prompt:confirm} 버튼을 누르면 던져."
"metalmamemon_dialogue.0020": " 메탈마메몬 "
"metalmamemon_dialogue.0021": "파워 게이지가 원하는 곳에"
"metalmamemon_dialogue.0022": "왔을 때 {prompt:confirm} 버튼을 눌러서"
"metalmamemon_dialogue.0023": "던지는 힘을 정해."
"metalmamemon_dialogue.0024": " 메탈마메몬 "
"metalmamemon_dialogue.0025": "점수: 스톤이"
"metalmamemon_dialogue.0026": "GOOD 마크에 멈추면"
"metalmamemon_dialogue.0027": "2점을 얻어."
"metalmamemon_dialogue.0028": " 메탈마메몬 "
"metalmamemon_dialogue.0029": "파란 선 위에 있지만"
"metalmamemon_dialogue.0030": "가운데 GOOD 마크 밖이면"
"metalmamemon_dialogue.0031": "1점이야."
"metalmamemon_dialogue.0032": " 메탈마메몬 "
"metalmamemon_dialogue.0033": "오른쪽 아래 BAD 마크에"
"metalmamemon_dialogue.0034": "멈추면 2점이 깎이니까"
"metalmamemon_dialogue.0035": "조심해."
"metalmamemon_dialogue.0036": " 메탈마메몬 "
"metalmamemon_dialogue.0037": "동점일 때는 내가 이겨!"
"metalmamemon_dialogue.0038": "게임 시작!!"
"metalmamemon_dialogue.0040": " 메탈마메몬 "
"metalmamemon_dialogue.0041": "내가 이길 거야!"
"metalmamemon_dialogue.0044": " 메탈마메몬 "
"metalmamemon_dialogue.0045": "아직 안 졌어!"
"metalmamemon_dialogue.0048": " 메탈마메몬 "
"metalmamemon_dialogue.0049": "이번 승부는 질 수 없어!"
"metalmamemon_dialogue.0052": " 메탈마메몬 "
"metalmamemon_dialogue.0053": "좋아, 내가 이겼다!"
"metalmamemon_dialogue.0056": " 메탈마메몬 "
"metalmamemon_dialogue.0057": "아, 이길 뻔했는데."
"menu.0000": "게임 시작 게임 설명"
