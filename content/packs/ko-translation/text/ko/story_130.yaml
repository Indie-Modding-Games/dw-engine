text.0036: "잡아 주마!"
text.0070: "정말이야!"
text.00ce: "누구야?"
text.00ee: "도와주러 왔어\n아직 준비가 안 됐어..."
text.0158: "거기 누구 있니?"
text.018c: "앞이 안 보여?"
text.01b4: "난 와몬이야. 평소엔\n바다에서 살아."
text.0206: "눈은 없지만 웬만한 건\n다 느낄 수 있단다."
text.026c: "난 인간이야. 내 이름은\n{color:6}{tamer}{color:1}."
text.02a6: "이쪽은 {color:10}{partner}{color:1}.\n내 파트너고, {digimon:pstat=103}이야."
text.02f6: "강한 힘이 느껴지는구나."
text.0330: "내 이야기 좀 들어 줄래?\n이 근처 해변에 내가\n쉬는 동굴이 있어."
text.03c8: "그런데 못된 녀석들이\n날 쫓아내서, 거기서 소중한\n보물을 잃어버렸어."
text.046a: "못된 녀석들이라고?\n안 좋은 얘기네."
text.04bc: "그 녀석들을 쫓아내 줘.\n동굴을 되찾게\n도와줬으면 해."
text.0540: "도와줄게\n지금은 못 도와줘"
text.0592: "그렇구나."
text.05ae: "그럼 내 등에 타렴."
text.06c0: "가자."
