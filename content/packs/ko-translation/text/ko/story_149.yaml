text.009a: "경비가 없어!"
text.00f8: "여긴 지나갈 수 없다."
text.0136: "여긴 지나갈 수 없다."
text.01dc: "......"
text.01f0: "우와, 우릴 노려보고 있어!\n우리를 수상하게\n여기나 봐."
text.0266: "일단 숨어서 기다렸다가\n다시 오자.\n교대는 12시야."
text.030e: "이 공장이 폐수를\n하수도로 흘려보내는 게\n분명해. 꼭 알아내야 해."
text.03d4: "좀 비켜 줄래?"
text.0412: "책임자가 발급한\n허가증 없이는\n여길 지나갈 수 없다."
text.04a8: "나 급하단 말이야."
text.04ce: "미안하지만\n허가증이 있어야 해."
text.051c: "알았어, 정 그렇다면\n어쩔 수 없지."
text.0580: "그럼 이제 어떡하지?"
text.05b4: "교대 시간이야\n안 비키면 혼난다\n아냐, 아무것도"
text.0636: "아직 교대할\n시간이 아니다."
text.0694: "괜찮아, 신경 쓰지 마.\n교대는 언제야?"
text.0704: "안 돼. 우린 시간을\n철저히 지켜야 한다."
text.075e: "교대는 자정과\n정오에 한다."
text.07bc: "아, 그렇구나."
text.07e2: "협박해도 소용없다.\n허가증을 받아 와라."
text.084a: "허가증? 그런 거 있어.\n내가 허가해 줄게!"
text.08bc: "허가증은 우리가 줄 수 없다.\n정해진 절차를\n밟아야 한다."
text.0944: "우와, 진짜 깐깐하네!"
text.097c: "아직 교대 안 해?"
text.09b8: "..."
text.09c6: "우와, 우릴 노려보고 있어!\n교대를 안 할 것\n같은데."
text.0a42: "나중에 다시 오자.\n일단 숨어서\n기다려 보자."
text.0aca: "보피 보피 뿌우우우."
text.0b02: "게바 게바!"
text.0b2c: "부뵤?"
text.0b50: "만족스럽다!"
text.0b82: "이것도 내 일이다."
text.0bc6: "무슨 문제라도 있나?"
