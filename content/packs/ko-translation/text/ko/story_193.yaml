text.0050: "왔어! 성공이야!"
text.0094: "인간이다.\n지지 말대로야."
text.00e8: "으음."
text.0102: "쉿, 일어난다."
text.0140: "어? 여긴 어디지?"
text.0170: "디지몬 월드에 온 걸 환영해!"
text.01ae: "뭐?"
text.01d0: "으악!"
text.01ec: "왜 그래?"
text.0220: "너희는 누구야?"
text.0266: "우린 디지몬이야."
text.0296: "디지... 뭐?"
text.02c0: "어? 디지몬을 아는 줄\n알았는데."
text.0320: "알았다, 이건 꿈이야."
text.0364: "꿈이 아니야."
text.039a: "잠깐, 너 토코몬이지?\n엄청 생생한 꿈이네."
text.0412: "{color:6}{tamer}{color:1}, 이건\n꿈이 아니지만 현실도\n아니란다."
text.048a: "무슨 소리야?\n넌 누구야?"
text.04ea: "나는 지지몬이란다."
text.0514: "그런 이름의 디지몬은\n모르는데."
text.0576: "네가 아는 것보다 디지몬은\n훨씬 많단다. 여기는\n디지몬 월드야."
text.0600: "디지몬 월드?!"
text.0636: "이 세계는 꿈도\n현실도 아니란다.\n우리의 세계지."
text.06b8: "와... 꿈이라기엔\n너무 진짜 같아."
text.071e: "뒤를 돌아보거라.\n무슨 말인지 알 게다."
text.077a: "뭐?"
text.07b6: "이게 {color:10}{partner}{color:1}?"
text.07e2: "이제 기억났어! 그 디지몬\n열쇠고리에 빨려 들어왔지."
text.0864: "그렇단다."
text.0892: "내가 왜 여기 있는 거야?"
text.08be: "내 집으로 가자꾸나.\n설명해 주마."
text.0a62: "우리를 구해 달라고\n너를 이곳에 불렀단다."
text.0aaa: "뭐로부터 구해?"
text.0ae0: "여기는 파일 시티란다.\n파일 섬의 중심이지."
text.0b58: "마을? 여기가?"
text.0b86: "음, 마을이었지.\n예전엔 온갖 디지몬이\n여기서 살았단다."
text.0c2e: "디지몬들이 마음을 잃고\n마을을 떠나기 시작했지."
text.0ca6: "무슨 뜻이야?"
text.0cdc: "원인은 잘 모르겠구나.\n디지몬들이 말하는 법을\n잊어 가기 시작했단다."
text.0d84: "아직 말하는 디지몬도\n있지만, 다들 여기 살았던\n것을 잊어버렸지."
text.0e14: "그래서 마음을 잃었다고\n한 거구나."
text.0e70: "가만있으면\n위험해진단다."
text.0ebc: "그런데 왜 나야?"
text.0ee2: "너는 디지몬을 잘\n키우잖니, 그렇지?"
text.0f3c: "그건 자신 있어!"
text.0f7c: "네가 디지몬 말을 하고\n있다는 걸 모르겠니?"
text.0fe6: "응? 설마. 그냥 평범한\n한국말을 하고 있는데."
text.104e: "우리한텐 디지몬 말로 들려."
text.10a2: "맞아!"
text.10d4: "이 세계에서는 디지몬을\n사랑하는 마음이\n너에게 힘을 준단다."
text.1158: "고마워."
text.1176: "그래서 너를 골랐단다.\n너라면 섬의 모든\n디지몬을 모을 수 있어!"
text.120a: "뭐?"
text.121c: "응?"
text.122c: "나만 믿어!"
text.126c: "좋아!"
text.1294: "고맙다. 네가 우리의\n유일한 희망이란다."
text.12da: "뭐부터 하면 돼?"
text.130c: "{color:10}{partner}{color:1}(와)과 함께\n섬을 탐험하거라."
text.1360: "이 위험의 원인을 찾아서\n디지몬들이 돌아오게\n해 다오."
text.13f6: "가자, {color:10}{partner}{color:1}!"
text.1444: "잠깐, 아직 얘기가 안 끝났다."
