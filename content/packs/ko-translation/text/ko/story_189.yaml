text.00a6: "상처를 치료할 만한 걸\n가져왔어?"
text.0104: "잠깐만. 어디 보자..."
text.014c: "날개가 아파!"
text.0170: "무슨 일이야?"
text.0194: "날개를 다쳤어. 상처를\n치료할 만한 거 있어?"
text.020a: "많이 다쳤네. 조금만 버텨.\n어떻게 하지?"
text.027c: "지금은 아무것도 없어."
text.02f8: "안 되겠어. 이걸론 부족해!"
text.0346: "훨씬 나아졌어. 고마워."
text.0386: "이제 날 수 있어?"
text.03b6: "멀리 날 수는 없을 것 같아."
text.03f6: "마을에 병원이 있어.\n거기 가 봐.\n여기서 멀지 않아."
text.048a: "마을 얘기는 들었어.\n생각보다 크구나."
text.04f8: "마을에 가서 좀 쉬어."
text.0534: "고마워. 언젠가\n나도 널 도울 수 있겠지."
text.05c2: "유니몬이 마을에 들어왔다!"
text.0602: "상처를 치료할 걸\n가져올게. 기다려."
text.0678: "고마워. 서둘러 줘!"
