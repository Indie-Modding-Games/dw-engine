text.00b2: "무슨 일이야?!"
text.00e2: "아, 어서 와, 하구루몬!"
text.0122: "하구루몬?!"
text.0168: "어떻게 된 거야?!"
text.01d8: "{color:7}장난감들 {color:1}\n옛날 옛적 이야기.\n먼 곳에서 나쁜 녀석이\n이 섬에 찾아왔대."
text.0280: "{color:7}장난감들 {color:1}\n나쁜 녀석들이 디지몬에게\n말했대. 이 섬은 우리 거야."
text.030a: "{color:7}장난감들 {color:1}\n디지몬들이 말했대.\n그렇지 않아. 이 섬은\n모두의 것이야."
text.03b8: "{color:7}장난감들 {color:1}\n디지몬들이 힘을 합쳐\n나쁜 녀석들에게 맞서자,\n녀석들은 혼쭐이 났대."
text.0494: "{color:7}장난감들 {color:1}\n하지만 나쁜 녀석들은 말했대.\n두고 봐, 나중에 꼭 갚아 줄게.\n...그리고 사라졌대."
text.0554: "{color:7}장난감들 {color:1}\n옛날 옛적 이야기."
text.05b0: "음, 기분이 좋아지네...\n아, 잠깐."
text.05fc: "그 노래 속 이야기는\n이 섬의 옛날이야기\n맞지?"
text.0684: "디지몬들이 나쁜 녀석들을\n물리쳤다는 거..."
text.06e0: "음, 이야기 속 나쁜 녀석들은\n누구였을까?"
text.0750: "도와줘서 고마워.\n이건 내 감사의 표시야."
text.07cc: "몬자에몬 인형이\n마을에 들어왔다!"
text.0850: "잠깐, 와루몬자에몬이\n뭘 떨어뜨리지 않았어?"
text.08be: "힘내!\n바로 옆집이야!"
text.092a: "......"
text.09cc: "아, 몬자에몬!\n살아 돌아왔구나!"
text.0a16: "우와, 뭐야?"
text.0a3e: "와루몬자에몬이랑 싸워!\n어서, 다들 움직여!\n빨리, 빨리!"
text.0ace: "잠깐... 잠깐! 저건 너희가\n아는 몬자에몬이 아니야."
text.0b38: "응? 무슨 소리야? 그래도\n몬자에몬은 맞잖아?"
text.0bb2: "응, 몬자에몬인 건\n맞아."
text.0c0a: "와루몬자에몬이라는 나쁜\n녀석이 내 친구들을 잡아갔어."
text.0c7a: "그 녀석을 이길 수 있는 건\n몬자에몬뿐일 거야!"
text.0cec: "음, 그럼 그 나쁜 녀석을\n찾아야겠네. 어디 있어?"
text.0d5a: "바로 옆집이야. 문에 걸린\n봉인을 풀어 줄게."
text.0dc2: "그러니까 가서 어떻게든\n해 줘."
text.0e14: "그렇구나. 좋아,\n도와줄게!"
text.0e60: "고마워!"
text.0e88: "고마워!"
text.0eb0: "고마워!"
