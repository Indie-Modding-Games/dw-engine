text.0058: "야!"
text.0076: "하아아!"
text.0098: "우와!"
text.00bc: "동쪽: 엘리베이터\n서쪽: 위험!!\n절벽 주의."
text.012e: "오거 모드 : ON\n오거 모드 : OFF"
text.018a: "낙석 주의!"
text.01f0: "이 길에 산적이 나온다는\n소문이 있어."
text.025e: "좋아, 가자 {color:10}{partner}{color:1}."
text.02b6: "야호!"
text.02d2: "하하하!"
text.02ec: "야하호!"
text.034a: "순순히 짐을 두고 가라.\n안 그러면 후회할 거다!"
text.03c6: "포기해!"
text.03e2: "뭐?! 너..."
text.0404: "말도 안 돼!"
text.0424: "두목, 어떡하죠?"
text.0458: "당황하지 마! 우리가 더\n세고 수도 많아!\n쳐라!"
text.0530: "언젠가 갚아 주마!"
text.0570: "도망가는 것 좀 봐!\n한동안은 안 올 거야."
