text.034c: "박케. 바 크케아."
text.0374: "여전히 무슨 말인지 모르겠어."
text.03dc: "그렇구나. 우리를 위해\n순찰하고 있는 거야?!"
text.0438: "봐! 내 특별한\n게시판이야."
text.048a: "마을엔 정보가 필요하니까\n신문을 만들기로 했어!\n어때?"
text.053e: "정보 모으는 건\n나한테 맡겨."
text.059e: "내 신문을 읽고 있구나."
text.05f0: "아, 시원하고 기분 좋다."
text.0630: "편안하면\n기분이 좋지."
text.069e: "제 가게 어때요?"
text.06de: "장사는 서툴지만\n지금은 할 사람이\n저밖에 없어요."
text.0766: "디지몬을 많이 데려와 주세요!"
text.07c0: "자, 어때요?"
text.07f8: "{color:7}코엘라몬 {color:1}\n서로 도와서 이 물건들을\n전부 팔기로 했어요."
text.0912: "음~. 맛있어 보이는 풀이\n있어서 먹기로 했어."
text.0986: "마을에 바람이\n너무 잘 통하게 된 것 같아."
text.09ee: "아, 며칠 전에\n{color:6}행복버섯 {color:1}을\n우연히 주웠어."
text.0a6c: "귀한 거라던데."
text.0aa4: "{color:6}고급버섯{color:1}이라는 것도\n있다고 들었어.\n찾으면 좋겠다."
text.0b3e: "원시의 숲에서 나는\n{color:6}푸른 사과 {color:1}는\n정말 맛있어."
text.0bb0: "열대 정글에서 나는\n{color:6}오렌지바나나{color:1}는\n정말 맛있어."
text.0c2c: "파노라마 산에서 나는\n{color:6}큰 베리 {color:1}는\n정말 맛있어."
text.0c98: "기어 사바나에서 나는\n{color:6}달콤한 호두 {color:1}는\n정말 맛있어."
text.0d02: "Overdell 묘지에서 나는\n{color:6}슈퍼 채소 {color:1}는\n맛있어."
text.0d70: "고대 공룡 무덤에서 나는\n{color:6}빨간 베리 {color:1}는\n맛있어."
text.0dda: "대협곡에서 나는\n{color:6}선인장 열매 {color:1}는\n맛있어."
text.0e4e: "안개 숲에서 나는\n{color:6}디지파인 {color:1}은\n맛있어."
text.0ff6: "할 말이 있어."
text.102c: "뭔데?\n나중에 봐!"
text.106c: "동쪽 다리 고친 거 봤어?\n우리 정말\n열심히 일했어."
text.10f6: "지금 디지몬 다리를 고치는\n중이야. 조금만 기다려 줘."
text.1166: "남쪽 코엘라 곶에\n희귀한 디지몬이 있대."
text.11e0: "매일 늦은 오후에\n나타난다는 소문이야."
text.125c: "있지, 마을 동쪽에\n부서진 다리가 있는 거\n알아?"
text.12f0: "쓸 사람이 있을 거라곤\n생각 못 해서\n그냥 내버려 뒀어."
text.138e: "우리끼리 고쳐 볼까\n생각 중이야."
text.13e8: "그동안 서쪽과 남쪽을\n둘러보고 와.\n그다음에 날 찾아와."
text.1496: "게코 늪에 가 봤어?\n장난꾸러기 디지몬한테\n속을지도 몰라."
text.151c: "디지몬이 진화하면\n장착한 기술이\n바뀐다는 걸 기억해."
text.15ae: "그게..."
text.15d6: "어때? 불을 켜 봤어.\n충분히 밝아?"
text.164e: "우리 마을을 깨끗하고\n밝게 만들자!"
text.16a6: "불을 켜면\n뭐가 달라져?"
text.16f0: "글쎄, 다\n생각하기 나름이야."
text.1746: "내가 제일 강해."
text.1780: "난 너한테 진다고\n생각 안 해. 경기장에\n와 보면 알 거야."
text.1824: "안녕, {color:6}{tamer}{color:1}.\n마을에 수상한 녀석이\n없는지 순찰 중이야."
text.18a2: "왜? 내가 방해하는 건\n아니지?!"
text.192a: "어서 오세요!\n특별히 싸게 드릴게요,\n{color:6}{tamer}{color:1} 님."
text.1998: "장사는 서툴지만\n다른 디지몬도 마찬가지예요."
text.1a02: "이제 제가 판매를 맡았어요.\n잘 부탁드려요."
text.1a74: "{color:6}{tamer}{color:1} 님, 디지몬을\n최대한 많이\n데려와 주세요."
text.1b10: "제 가게\n어때요?"
text.1b50: "장사는 서툴지만\n할 사람이 없으니\n제가 해야죠."
text.1bcc: "디지몬을 많이\n빨리 데려와 주세요."
text.1c32: "자, 어때요?"
text.1c6a: "{color:7}코엘라몬 {color:1}\n서로 도와서 이 물건들을\n팔기로 했어요."
