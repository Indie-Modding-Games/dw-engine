text.00c6: "안녕, {color:6}{tamer}{color:1}!"
text.00f4: "안녕, {color:6}{tamer}{color:1}!"
text.0122: "안녕, {color:6}{tamer}{color:1}!"
text.0154: "또 와 줘서 고마워."
text.0190: "안녕, 난 모쟈몬이야!"
text.0280: "{color:6}{tamer}{color:1}, 너무 기뻐!\n우릴 위해 많이 애써 줬잖아."
text.02e2: "나, 마을에 가기로 했어.\n같이 열심히 일하자,\n알았지?"
text.03a4: "모쟈몬이 마을에 들어왔다!"
