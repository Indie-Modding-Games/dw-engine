text.009a: "하! 겁먹었구나."
text.00d4: "집에나 가는 게 좋을걸!"
text.0114: "한번 들어가면\n다시는 못 나와."
text.0170: "헤헤!"
text.0198: "기다려."
text.01b8: "씌어 버릴 거야."
text.0202: "바케바케?"
text.0226: "뭔가 묻는 것\n같아."
text.0272: "?...응\n?...아니"
text.02a8: "바케! 바케바케?"
text.02d6: "응\n아니"
text.0300: "바케에에...바케바케?"
text.0338: "응\n아니"
text.035e: "바케바케!\n바케에에 바케 바케에에!"
text.03e8: "바케몬이 마을에 들어왔다!"
text.0422: "잘된 것 같아."
text.046e: "혹시 화나게 했나?"
text.04ea: "이상한 검은 힘에\n가로막혔다!"
text.0556: "뭐야?! 다리가..."
