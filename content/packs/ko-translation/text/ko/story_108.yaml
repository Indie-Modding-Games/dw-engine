text.004e: "{color:5}훈련:\n바위 옮기기 (개량) {color:1}"
text.00a4: "{color:5}훈련:\n바위 옮기기 {color:1}"
text.00e0: "시작\n설명\n그만두기"
text.0116: "일반\n보너스 도전\n그만두기"
text.0152: "바위를 밀어서 힘을 기른다.\n최대 HP와 공격력이\n오른다."
text.01ec: "다시 설명\n시작\n그만두기"
text.0246: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.02d6: "{color:5}훈련:\n폭포 수행 (개량) {color:1}"
text.0322: "{color:5}훈련: 폭포 수행 {color:1}"
text.0354: "시작\n설명\n그만두기"
text.038c: "일반\n보너스 도전\n그만두기"
text.03ca: "폭포를 맞는 훈련.\n최대 MP와 방어력이\n오른다."
text.0448: "다시 설명\n시작\n그만두기"
text.04a2: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.0532: "{color:5}훈련:\n나무 치기 (개량) {color:1}"
text.0582: "{color:5}훈련: 나무 치기 {color:1}"
text.05bc: "시작\n설명\n그만두기"
text.05f4: "일반\n보너스 도전\n그만두기"
text.0632: "나무를 치며 연습한다.\n공격력과 속도가\n크게 오른다."
text.06c2: "다시 설명\n시작\n그만두기"
text.071c: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요"
text.07aa: "{color:5}훈련: 펀치 글러브\n(개량) {color:1}"
text.0800: "{color:5}훈련: 펀치 글러브 {color:1}"
text.083c: "시작\n설명\n그만두기"
text.0874: "일반\n보너스 도전\n그만두기"
text.08b2: "펀치 기계로 힘을 기른다.\n방어력과 지능이\n오른다."
text.0946: "다시 설명\n시작\n그만두기"
text.09a0: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.0a30: "{color:5}훈련:\n달리기 (개량) {color:1}"
text.0a78: "{color:5}훈련: 달리기 {color:1}"
text.0aa6: "시작\n설명\n그만두기"
text.0ade: "일반\n보너스 도전\n그만두기"
text.0b1c: "코스를 달린다.\n속도와 최대 HP가\n크게 오른다."
text.0b88: "다시 설명\n시작\n그만두기"
text.0be2: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.0c72: "{color:5}훈련:\n{color:6}{tamer}{color:1}의 {color:5}교실\n(개량) {color:1}"
text.0ccc: "{color:5}훈련:\n{color:6}{tamer}{color:1}의 {color:5}교실 {color:1}"
text.0d0c: "시작\n설명\n그만두기"
text.0d44: "일반\n보너스 도전\n그만두기"
text.0d82: "{color:6}{tamer}{color:1}이(가) 여러 가지를\n가르친다. 지능과\n최대 MP가 오른다."
text.0df2: "다시 설명\n시작\n그만두기"
text.0e4c: "{color:7}슬롯머신 {color:1}\n{color:6}△ {color:1}버튼으로\n그림 세 개를 맞추세요."
text.0ece: "야, 새로운 정보야."
text.0efe: "유아기나 유년기\n디지몬은 같은 훈련을\n반복해 봐."
text.0f88: "좋은 일이 생길 거야."
text.0fd4: "새로운 정보야."
text.0ffa: "보너스 도전에서 같은\n그림을 맞추면 능력이\n크게 올라."
text.10b0: "아, 기술 얘기를\n해 주기로 했었지."
text.110e: "적이 쓰는 기술은\n배틀에서 이기면\n습득할 수 있어."
text.1198: "하지만 그때 익힐 수\n있는 기술만이야."
text.1226: "전부 다 익힐 순 없어.\n그래도 기술을 익히는 데는\n배틀이 제일 빨라."
text.12d0: "훈련으로도 익힐 수 있지만\n확률이 낮아."
text.134e: "똑똑해지면 {color:6}{tamer}{color:1}의\n교실에 가 봐. 기술을\n익힐지도 몰라."
text.13e6: "익힐 확률은 낮으니까\n너무 기대하진 마.\n골고루 훈련해!"
text.148c: "안녕, 난 코로몬이야.\n지지가 훈련에 대해\n알려 주라고 했어."
text.1506: "나한테 뭐 물어볼래?"
text.153c: "무슨 훈련?\n훈련 방법 알려 줘\n아니, 없어"
text.15b2: "여기서 훈련하면\n디지몬의 능력을\n올릴 수 있어."
text.162c: "훈련하면 지치지만,\n실제 배틀보다\n얻는 게 더 많아."
text.16c8: "그리고 아주 드물지만\n새 기술을 익힐 수도 있어."
text.173a: "기술 얘기는\n다음에 더 해 줄게."
text.17a0: "여기엔 훈련 장소가 여섯\n군데 있고, 근처에\n안내판이 있어."
text.182a: "안내판 앞에서\n{color:6}△ {color:1}버튼을 눌러 봐."
text.187c: "안내판을 읽으면\n어떤 능력을 올릴 수\n있는지 알 수 있어."
text.18fe: "디지몬의 특기에 따라\n더 많이 오르는 능력이\n따로 있어."
text.19aa: "그래도 직접 해 보기\n전엔 확실히 몰라."
text.1a0a: "‘시작’을 고르고\n‘일반’을 골라서\n한 시간 훈련해."
text.1a7a: "훈련 중에\n{color:5}× {color:1}버튼으로\n시간을 빨리 감을 수 있어."
text.1ae6: "아, 맞다. ‘보너스 도전’\n얘기도 해 줘야지."
text.1b48: "보너스 도전은 성공하면\n힘이 크게 오르지만,\n실패하면 조금만 올라."
text.1be4: "한 번 해 보면 알 거야."
text.1c24: "그럼, 곧 새로운 정보를\n또 가져올게."
text.1d7c: "마을에 가 봤는데,\n나한텐 너무 도시 같아서\n여기로 왔어."
text.1e10: "장비를 개조했어.\n이제 더 좋아. 열심히 해!"
text.1e86: "마을에 가 봤는데,\n나한텐 너무 도시 같아서\n여기로 왔어."
text.1f1a: "장비를 개조했어.\n이제 더 좋아. 열심히 해!"
