text.0056: "마이오티스몬이 없어졌어."
text.009a: "앗!"
text.00b8: "열쇠를 찾았다. 저 문들 중\n어딘가를 열 수 있을지도."
text.0128: "{color:6}저택 열쇠{color:1}를\n사용했다!"
text.016e: "뭔가를 버려야겠어."
text.01e2: "{color:6}저택 열쇠{color:1}를\n사용했다!"
text.0246: "안 열린다.\n잠겨 있다."
text.02d8: "{color:6}저택 열쇠{color:1}를\n사용했다!"
text.033c: "안 열린다.\n잠겨 있다."
text.03b0: "냠냠...."
text.03d0: "저기."
text.03e6: "내 말 좀 들어 봐."
text.0408: "맛있다, 맛있어...."
text.0430: "부하들이 이제 말을 안 들어."
text.0470: "내 명령을 기억하지\n못하는 것 같아."
text.04ca: "이제는 말귀를 못 알아들어.\n원래는 내게 식사를\n가져와야 하는데...."
text.0560: "냠냠...."
text.0580: "연구에 빠져 있는 동안\n식사를 안 가져와서\n먹는 걸 잊고 있었어."
text.0614: "일에 너무\n빠져 있었구나."
text.0662: "정말 부끄럽군."
text.0690: "저택에 무슨 문제가\n생긴 것 같아."
text.06e6: "섬에 무슨 문제라도 있니?\n다들 내 부하들 같아?"
text.0754: "응, 다들\n기억을 잃어 가고 있어."
text.07a6: "누가 일부러 꾸민\n일이라고 생각해?"
text.07fa: "응?"
text.080a: "내가 뭘 할 수 있지?"
text.082e: "우린 디지몬의 마음을 하나로\n모을 마을을 만들고 있어."
text.089e: "함께할 친구를 찾고 있어."
text.08da: "내가 뭘 할 수 있겠어? 내\n부하들은 싸우는 것밖에 몰라."
text.0940: "이 녀석들을 두고 갈 순 없어."
text.0978: "그렇구나."
text.098c: "좀 생각해 볼게.\n정말 미안해."
text.09e0: "다음에 또 올게.\n밥 먹는 거 잊지 마."
text.0b9c: "도와줘서 고마워.\n내 연구를 보여 줄게."
text.0c02: "메탈그레이몬이 사라질 때\n가끔 스컬그레이몬으로\n진화하는 경우가 있어.{stop}"
text.0cac: "바케몬, 데비몬,\n피닉스몬도\n그렇게 진화해."
text.0d22: "처음 태어났을 때 누구였는지는\n나도 몰라. 진화 도감에도\n나와 있지 않거든."
text.0dc6: "시합 덕분에 부하들이\n많이 좋아졌어."
text.0e0a: "시합은 연구하다\n쉬기에 딱 좋아."
text.0e64: "무슨 연구를 하는데?"
text.0eae: "마을에 경기장이\n생겼다!"
text.0efc: "내 부하들도 도움이\n될 수 있을까?"
text.0f40: "응, 거기선 마음껏\n힘을 쓸 수 있어."
text.0fa4: "부하들 상태가 더 나빠졌어.\n이제 저택을 떠날\n때가 됐군."
