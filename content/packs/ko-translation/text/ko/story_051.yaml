text.004e: "왠지 불길한 예감이 들어...."
text.0098: "네가 올 줄 알았지!"
text.00e4: "넌 누구야?"
text.0104: "나는 데비몬, 어둠의 천사.\n어둠의 힘을 지닌 자다."
text.017c: "뭔가 알고 있어?"
text.01b0: "마이오티스몬이 저택에 있다.\n어쩌면 살아 있을지도 모르지."
text.021e: "네가 이런 짓을 했어?"
text.024a: "글쎄...내가 아는 건\n네가 내 적이라는 것뿐."
text.02c2: "놓치지 않을 거야!"
text.030c: "하하하!"
text.034a: "앗, 안 돼!"
text.036e: "마이오티스몬에게\n안부 전해 줘라."
text.03cc: "도망쳤어!\n저 녀석 정말 마음에 안 들어."
text.048a: "정말 큰 저택이다!"
text.04ca: "누구 계세요?"
text.0500: "아무도 없거나\n내 목소리가 안 들리나 봐."
text.0566: "좋아. 탐험 시작이다!"
text.05be: "{color:6}저택 열쇠{color:1}를\n사용했다!"
text.0622: "안 열린다.\n잠겨 있다."
text.069a: "{color:6}저택 열쇠{color:1}를\n사용했다!"
text.06fe: "안 열린다.\n잠겨 있다."
text.0776: "{color:6}저택 열쇠{color:1}를\n사용했다!"
text.07da: "안 열린다.\n잠겨 있다."
text.0866: "안 열린다. 이상한 힘으로\n봉인되어 있다."
