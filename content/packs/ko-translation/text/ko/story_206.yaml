text.0034: "야, 나랑 한판 붙어 볼래?\n네가 이기면\n뭐든 시키는 대로 할게."
text.00da: "무슨 시합인데?"
text.0108: "그 이름하여...\n디지몬 컬링! \n자세한 건 안에서 말해 줄게."
text.0186: "음, 내가 지면 어떻게 돼?"
text.01c6: "처음엔 아무것도 없어.\n하지만 다음부터는 먼저\n물고기를 하나 줘야 해."
text.025c: "그럼 내가 이기면 나랑 같이\n마을로 가는 거다. 됐지?{stop}\n좋아, 해 보자."
text.02f4: "좋아, 그러자. \n안으로 들어가자."
text.0384: "야, 나랑 한판 붙어 볼래?\n물고기를 하나 주면\n상대해 줄게."
text.0426: "붙어 보자\n됐어"
text.0474: "야, 친구! 여기에\n스케이트장을 만들었어."
text.04c2: "물고기 하나에 한 판이야.\n대신 이기면\n좋은 상품을 줄게."
text.0554: "야, 친구. 나랑 한판\n붙어 보지 않을래? 물고기\n하나면 도전할 수 있어."
text.0606: "좋아, 하자\n됐어"
text.0642: "쳇, 재미없네."
text.0676: "물고기 줘!"
text.06ae: "지금은 아무것도 없어..."
text.0738: "아차, 이걸 줘 봤자\n소용없겠지."
text.079a: "와, 맛있겠다. 아차,\n먼저 시합부터 해야지.\n안으로 들어가자."
text.0842: "에이, 친구.\n용의 눈 호수에 가서\n낚시라도 해 보지 그래."
text.08d6: "아쉽게 됐네, 친구. 또\n도전하러 와. 물고기 하나\n더 가져오는 거 잊지 말고."
text.0992: "대단해! 만점이야!\n혹시 너...\n프로야?"
text.0a34: "{color:7}축하해!\n멋진 승부를 펼친 너에게\n메달을 줄게! {color:1}"
text.0ab8: "대단하다, 친구. 시합에서\n진 건 처음이야."
text.0b20: "좋아, 그럼 약속대로\n나랑 마을로 가자."
text.0b94: "어쩔 수 없지, 가야겠네.\n그래도 마을에서 뭘 할지는\n벌써 정해 뒀어."
text.0c7a: "펭귄몬이 마을에 들어왔다!"
text.0cd2: "아쉽게 됐네, 친구. 또\n도전하러 와. 물고기\n가져오는 거 잊지 말고."
text.0d82: "대단해! 만점이야!\n혹시 너...\n프로야?"
text.0e24: "{color:7}축하해!\n멋진 승부를 펼친 너에게\n메달을 줄게! {color:1}"
text.0ea8: "와, 너 정말 대단하다. \n또 졌어."
text.0f00: "뭐, 할 말이 없네.\n자, 상품이야."
text.0ff8: "아이템이 너무 많잖아!"
text.103c: "{color:6}{item:pstat=110}{color:1}을(를) 받았다!"
text.106a: "안녕, {color:6}{tamer}{color:1}. 펭귄몬\n부탁으로 지금은 내가\n가게를 보고 있어."
text.10ea: "나랑 한판 붙자!\n네가 이기면 특별 상품을\n줄게. 어때?"
text.118c: "좋아, 하자\n됐어"
text.11da: "시합 전에\n물고기부터 받을게."
text.123e: "아, 지금은\n아무것도 없어."
text.12da: "이걸 줘 봤자\n소용없겠지."
text.1330: "좋아, 이번엔 내가\n이길 거야. 안으로 가자."
text.13a2: "물고기가 없으면\n시합은 못 해. 다음에\n다시 와."
text.1436: "뭐? 내 도전을\n거절하는 거야?"
text.1488: "날 이기고 싶으면\n머리를 좀 써야 할걸!\n언젠가 또 보자."
text.1546: "나를 상대로 만점이라니!!\n너 혹시\n컬링 천재야?!"
text.15e0: "{color:7}축하해!\n멋진 승부를 펼친 너에게\n메달을 줄게! {color:1}"
text.1664: "잘하는구나, {color:6}{tamer}{color:1}!\n약속한 상품\n여기 있어!"
text.17a2: "아이템이 너무 많구나."
text.17e6: "{color:6}{item:pstat=110}{color:1}을(를) 받았다!"
