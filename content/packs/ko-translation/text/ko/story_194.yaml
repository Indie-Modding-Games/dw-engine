text.0066: "타아아"
text.0084: "용서를 구하자."
text.00ce: "용서는 마음을 치유해."
text.011c: "넌 나쁜 녀석이야?"
text.014c: "날 따라와. 그러면..."
text.0194: "하하하!"
text.01bc: "너!"
text.01cc: "넌 질 거야!"
text.0220: "내가 저 녀석한테\n세뇌당했다니 믿을 수 없어."
text.027c: "저 녀석은 강해.\n이길 수 있겠어?\n왜 이런 짓을 하는 거야?"
text.02f4: "섬을 위해 싸우겠어.\n지금 결판을 내자."
text.035c: "우린 지배자 따윈 필요 없어.\n네가 우리의 유일한 희망이야."
