text.0052: "타아!"
text.0072: "좋아, 받아라!"
text.00ae: "샤아아!"
text.00d2: "부오옹!"
text.011e: "누구냐? 여길 어지럽히는\n녀석은 가만두지 않겠다!"
text.0194: "진정해. 우린 섬을\n구하러 가는 길에\n지나가는 것뿐이야."
text.0220: "못 믿겠어. 썩 꺼져!"
text.0260: "잠깐만."
text.02cc: "너 혹시...?"
text.030e: "그러게 내가 뭐랬어!"
text.0336: "미안해. 손님이 별로\n없다 보니 새 일에\n너무 들떠 있었어."
text.03d2: "일?"
text.03e2: "난 고대 공룡 지대라는\n곳을 지키고 있어."
text.0448: "아무도 탐험한 적 없는 곳이야."
text.0484: "안내해 줄래?"
text.04bc: "고대 공룡 지대는\n두 구역으로 나뉘어 있어."
text.0520: "우리가 사는 곳은\n빙하 지대라고 해."
text.057a: "시간이 느리게 흐르는\n특별한 곳이야."
text.05de: "시간이 느리게 흘러?"
text.0608: "다른 한 곳은\n쾌속 지대야."
text.0656: "빙하 지대보다 더 멀고\n위험한 곳이지."
text.06c8: "시간이 엄청 빨리 흘러서\n위험해."
text.071c: "땅은 황량하고 사방에\n뼈랑 화석뿐이야."
text.0782: "거기선 다른 곳보다 시간이\n빨리 흘러서 그런 거야?"
text.07fc: "맞아. 거기 오래 있지 마."
text.083c: "내가 길을 막고 있으니\n거긴 못 가."
text.08a4: "네가 졌어."
text.08c2: "운이 나빴어! 이런 일은\n흔치 않은데."
text.0918: "그래?"
text.093c: "난 집에 가 봐야 해.\n궁금한 건 다른\n디지몬한테 물어봐."
