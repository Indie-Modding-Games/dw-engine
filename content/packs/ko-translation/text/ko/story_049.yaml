text.004a: "어서 와. 처음 보는 얼굴인데.\n어디서 왔니?"
text.00c2: "마을에서. 사실은\n다른 세계에서 왔어."
text.0120: "내 말을 알아듣는 거야?"
text.015e: "응, 알아들어."
text.017a: "요즘 장사가 힘들어서\n물건이 잘 안 팔려."
text.01e0: "그렇구나."
text.01f4: "손님들이 많이 끊겼거든."
text.0236: "섬에 문제가 생겨서\n그런 걸 거야."
text.0288: "부탁 하나만 들어줘."
text.02ba: "뭔데?"
text.02d8: "내 가게에서 일해 줄래?"
text.0310: "네 가게에서?"
text.032c: "반나절 어때? 많이 팔수록\n돈도 많이 줄게.\n넌 우리 말도 알잖아."
text.03c8: "손해 볼지도 몰라."
text.03fa: "걱정 마. 나한테도 좋은\n일이야. 여덟 시간 어때?"
text.0474: "해 볼게\n싫어"
text.05fa: "아쉽네. 시간 날 때\n다시 와."
text.065e: "일해 볼래?"
text.06b2: "자, 이제 절반 왔어.\n "
text.0750: "이대로 가면 한 푼도\n못 벌겠어. 더 힘내!\n "
text.07e2: "잘 팔리고 있어.\n돈 좀 벌겠는걸."
text.084a: "이렇게 장사가 잘된 건\n정말 오랜만이야.\n계속 힘내!"
text.08d8: "이제 시간 다 됐다.\n일해 줘서 고마워."
text.0944: "더 잘할 수도 있었지만\n나쁘진 않았어.\n포기하지 마."
text.09d4: "500 Bits를 받았다!"
text.0a22: "더 잘할 수 있잖아.\n좀 더 일해 줬으면 해."
text.0a86: "1500 Bits를 받았다!"
text.0ace: "네 지혜와 성품, 그리고\n배짱이야말로 이 섬을\n구하는 데 필요한 거야."
text.0b60: "무슨 소리야?"
text.0b9e: "네가 우리를 구할 수 있는지\n시험해 본 거야."
text.0c18: "배틀을 잘하는 것도\n중요하지."
text.0c68: "하지만 힘 말고도 용기와\n지혜가 필요하거든."
text.0cd4: "우리 시험에 통과한 거야?"
text.0d06: "응, 내가 할 수 있는 만큼\n힘껏 도와줄게."
text.0d56: "마을로 올 거야?\n가게는\n어떻게 하고?"
text.0dd2: "가게는 나중에 또 열면 돼.\n이 가게는 할 일을 다 했어."
text.0e42: "모노크로몬이 마을에 들어왔다!"
text.0e7e: "2000 Bits를 받았다!"
