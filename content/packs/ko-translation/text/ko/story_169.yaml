text.0072: "어서 와요, {color:6}{tamer}{color:1}!"
text.009a: "저흰 보물 사냥꾼이에요.\n땅 파는 기술로 땅속에\n묻힌 보물을 찾아요."
text.013e: "보물 찾기는 맡겨 주세요."
text.0196: "뭔가 찾아 드릴까요?\n아니면 저희가 하는 일을\n설명해 드릴까요?"
text.0230: "설명 듣기\n설명 안 듣기\n됐어"
text.0286: "기간과 가격이 다른\n두 가지 플랜이 있어요."
text.02ee: "일반: 3일, 1000 Bits\n특별: 10일, 5000 Bits"
text.036a: "특별 플랜이 더 좋은\n보물을 찾을 확률이\n높아요."
text.03f6: "설명은 이게 다예요.\n어떻게 하실래요?"
text.044e: "보물 찾기\n다시 설명\n됐어"
text.04b0: "플랜을 고르세요!"
text.04d4: "일반: 3일, 1000 Bits\n특별: 10일, 5000 Bits\n취소"
text.056e: "그럼 안녕히 가세요."
text.05c4: "결과는 3일 뒤에 나와요.\n행운을 빌어 주세요."
text.066a: "결과는 10일 뒤에 나와요.\n행운을 빌어 주세요."
text.06ea: "Bits가 모자라요.\n보물을 찾으려면\n돈이 필요해요."
text.07a4: "지금 보물을 찾는 중이에요.\n조금만 기다려 주세요."
text.082a: "있잖아요,\n보물을 찾았어요."
text.0b00: "짐을 좀 비워 주세요!"
text.0b32: "{color:6}{item:pstat=110}{color:1}을(를) 받았다!"
text.0dae: "와 주셔서 감사합니다!"
text.0de8: "이용해 주셔서 감사합니다,\n{color:6}{tamer}{color:1}!"
text.0e2a: "얼마 전부터 드리모게몬을\n돕고 있어요. 물건 찾는 건\n자신 있어요."
