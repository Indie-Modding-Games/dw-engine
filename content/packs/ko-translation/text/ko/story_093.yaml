text.0066: "우와, 살아 있는 것 같아!"
text.0096: "사실 우리가 움직이면\n저것도 움직여. 잠깐만!"
text.0144: "왜 그래, {color:10}{partner}{color:1}?\n뭐 찾았어?"
text.01a0: "우와, 대단해\n{color:10}{partner}{color:1}!"
text.0202: "어? 그 석상 말인데..."
text.024e: "앗!"
text.0272: "휴, 그럼"
text.028e: "다시 살아났구나.\n좋았어!"
text.02d4: "나는 엔젤몬. 그대를 지키는\n천사. 내 사명을 다하고자\n깨어났노라."
text.036a: "무슨 소리야...?"
text.03a8: "나는 하늘의 진리를 아노라."
text.03e4: "땅의 뜻을 따르고자\n내 영혼을 바치노라."
text.044a: "무슨 소리야...?\n마을로 올 거야?"
text.04c0: "그대의 사명이 곧 나의 의무.\n가겠노라."
text.050a: "미안한데, 좀 알아듣기\n쉽게 말해 줄래?"
text.0578: "마을로 갈 테니까\n너도 계속 힘내."
text.05da: "그렇구나. 고마워!"
text.0636: "엔젤몬이 마을에 들어왔다!"
