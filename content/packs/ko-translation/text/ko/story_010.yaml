text.0090: "잘난 척하기는!"
text.00dc: "내가 너한테 뭘 했다고!?"
text.0156: "{color:7}? ? ? {color:1}\n기다려라!"
text.02f0: "내 이름은 닌자몬!"
text.033a: "네가 {color:6}{tamer}{color:1}인가?\n그리고 넌 {color:10}{partner}{color:1}(이)겠군!"
text.0380: "닌자 마을까지 이름이\n자자하더군. 내 도전을\n받아들여라."
text.041e: "좋아\n다음에"
text.0454: "하, 그건 네 생각이지!"
text.04e0: "소문대로 강하시군요.\n부디 저를 제자로\n삼아 주세요!"
text.0580: "제자? 그런 건 안 받아.\n대신 마을 만드는 걸\n도와주면 좋겠어."
text.060a: "알겠습니다.\n그것도 좋은 수련이겠군요.\n열심히 하겠습니다."
text.076c: "닌자몬이 마을에 들어왔다!"
text.07b8: "어이, 너!"
text.07d0: "그게 무슨 소리야?\n너 여기서 뭐 해?"
text.081c: "어이, {color:6}{tamer}{color:1}!"
text.0834: "마을에 나만의 하렘을\n만들려고 했더니\n쫓겨났다고!"
text.08ce: "요즘 아주 잘나간다며?\n좋은 걸 팔아 주지!"
text.0962: "엄청나게 귀한\n{color:6}황금 바나나{color:1}야."
text.09c0: "50000 Bits다.\n외상은 사절이야."
text.0a24: "낸다\n안 낸다"
text.0a76: "바보야! 짐이 너무 많잖아!"
text.0abe: "앗, 짐이 너무 많아!"
text.0afe: "정말 고마워!"
text.0b30: "인간이라면 현금을 써야지."
