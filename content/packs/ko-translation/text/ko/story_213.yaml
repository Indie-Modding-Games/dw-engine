text.0040: "오, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\n왔구나. 이 멋진 파일 시티\n경기장 좀 봐. 끝내주지!"
text.00d0: "곧 참가자와 팬들로\n가득 찰 거야. 너도 팬들을\n즐겁게 해 줄 거지?!"
text.0188: "대회 우승자에겐 상금과\n상품이 준비될 거야.\n손해 볼 건 없잖아."
text.0230: "대회에 대해 자세히 알고\n싶으면 저 기계를 확인해 봐."
text.02d0: "아, 그런데 유년기 디지몬은\n참가할 수 없어.\n일정을 확인해 줄까?"
text.038c: "아, 그런데 유년기 디지몬은\n참가할 수 없어.\n일정을 확인해 줄까?"
text.043c: "와 줘서 기뻐.\n대회에 참가할래?"
text.04b6: "응\n아니\n무슨 뜻이야?"
text.0520: "그럼 내일\n대회에\n참가하는 거지?"
text.058a: "참가를\n취소할 거야?"
text.05d8: "아니, 취소 안 해\n응, 취소할래"
text.0652: "그럼 오늘 대회에\n참가하는 거지?\n오전 10시부터 들어갈 수 있어."
text.06e8: "설마 취소할 생각은\n아니지?!"
text.0740: "아니, 취소 안 해\n응, 취소할래"
text.07aa: "그럼 오늘 대회에\n참가하는 거지?\n오후 11시까지 들어가."
text.0832: "설마 취소할\n생각은 아니지?!"
text.088a: "아니, 취소 안 해\n응, 취소할래"
text.08f6: "그럼 취소해 줄게."
text.0934: "안에 들어가서 시작 시간이\n되면 왼쪽 계단으로\n내려가서 시합에 나가."
text.09de: "등록은 무료야. 등록은\n오늘 대회와 내일 대회만\n할 수 있어."
text.0a8c: "단, 당일 대회는\n그날 오전 10시까지\n등록해야 해."
text.0b1a: "일정은 5일 뒤까지\n볼 수 있으니까 확인하고\n계획을 세워 봐."
text.0bb8: "빨간색으로 표시된 대회는\n네가 참가할 수 없는 대회야."
text.0c32: "하지만 Start 버튼을 누르면\n어떤 대회인지 볼 수 있어."
text.0ca0: "참가 조건이 “없음”인\n대회라도,"
text.0d06: "유년기 디지몬은\n참가할 수 없어."
text.0d52: "등록에 대한 설명은\n이 정도야. 대회에\n참가할래?"
text.0dd4: "응\n아니\n다시 설명해 줘"
text.0e3c: "야! 너 아직\n등록 안 했잖아!"
text.0eba: "야! 대회는\n내일이라니까!"
text.0f42: "아직 들어가기엔 일러.\n10시까지 기다려."
text.0ff4: " \n{color:4}테이머 레벨이 내려갔다!{color:1}"
text.10c6: "- D급 -\n성장기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.11c4: "- C급 -\n성숙기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.12c6: "- B급 -\n성숙기 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.13c8: "- A급 -\n완전체 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 ? 없음."
text.14ca: "- S급 -\n최강의 디지몬이\n겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\nA급 우승자만 참가 가능."
text.15c4: "- R급 -\n배틀 로열 대회:\n승리의 열쇠는 작전\n\n4인 배틀 로열,\n2라운드, 참가자 8명.\n참가 조건 ? 없음."
text.16f8: "- 버전 1 컵 -\n버전 1 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 1 디지몬만 참가 가능."
text.1834: "- 버전 2 컵 -\n버전 2 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 2 디지몬만 참가 가능."
text.1970: "- 버전 3 컵 -\n버전 3 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 3 디지몬만 참가 가능."
text.1ab8: "- 버전 4 컵 -\n버전 4 최강 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n버전 4 디지몬만 참가 가능."
text.1bfa: "- 버전 0 컵 -\n버전 1 ? 4에 속하지 않는\n최강 디지몬의\n시간제한 시합.\n일대일 시합, 3라운드,\n참가자 8명. 버전 1 ? 4가\n아닌 디지몬만 참가 가능."
text.1d60: "- 불꽃 컵 -\n불꽃 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 불꽃 속성\n디지몬만 참가 가능."
text.1e9a: "- 격투 컵 -\n격투 스포츠의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 투지가 넘치는\n디지몬만 참가 가능."
text.1fe4: "- 천둥바람 컵 -\n하늘의 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 천둥바람 속성\n디지몬만 참가 가능."
text.2132: "- 냉기 컵 -\n냉기 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 얼음 속성\n디지몬만 참가 가능."
text.2264: "- 자연 컵 -\n자연 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 자연 속성\n디지몬만 참가 가능."
text.23b0: "- 메탈 컵 -\n기계 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 기계 속성\n디지몬만 참가 가능."
text.24ea: "- 오물 컵 -\n오물 디지몬의 왕을 가리는\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명. 오물 속성\n디지몬만 참가 가능."
text.2622: "- 공룡 컵 -\n고대의 혈통을 이은\n디지몬의 시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.2752: "- 날개 컵 -\n날개 달린 디지몬이\n힘을 겨루는 대회\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.2864: "- 동물 컵 -\n야수의 혈통을 이은\n디지몬의 시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
text.2998: "- 인간 컵 -\n인간형 디지몬의\n시간제한 시합\n\n일대일 시합, 3라운드,\n참가자 8명.\n참가 조건 --  ? ? ?"
