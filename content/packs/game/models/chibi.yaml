# Chibi style (engine improvement, prototype; the original does not have it): per-species fixes for when the
# automatic detection (animation::classifyChibi) gets it wrong. The original's models are already chibi: their
# proportions, measured with these fixes, make up the reference profile (models/chibi_profile.yaml). The key
# is the species folder, that of its model in the pack (<folder>/model). Each species can carry:
#   off: true            leaves it with its original look and out of the profile
#   shape: biped         body shape: biped, quadruped, winged, serpent or unknown (unknown: no changes)
#   head: 4              the bone (joint index, the original's object order) that is the head
#   parts: {12: tail}    the part that hangs from that bone: head, neck, arm, leg, tail, wing or other
#   scale: {head: 1.4}   fixed factors instead of the ones the profile fit looks for (head, torso, neck, arm, leg,
#                        hand, foot, tail, wing, girth), from 0.25 to 4; they only count if the model is not chibi already
#
# A shape the detection does not recognize (unknown) stays as it is. The species below were checked by hand
# with the viewer (--model-viewer <folder>/model --chibi).
species:
  # They already have the head and body in a single round piece, or are babies: the style would only shorten their
  # limbs, so they stay as they are.
  bota: {off: true}
  puni: {off: true}
  poyo: {off: true}
  yura: {off: true}
  koro: {off: true}
  tane: {off: true}
  toko: {off: true}
  tuno: {off: true}
  puti: {off: true}
  otam: {off: true}
  mame: {off: true}
  emam: {off: true}
  mtma: {off: true}
  emtm: {off: true}
  nani: {off: true}
  enan: {off: true}
  giro: {off: true}
  egir: {off: true}
  tkka: {off: true}
  igam: {off: true}
  eiga: {off: true}
  bake: {off: true}
  ebak: {off: true}
  soul: {off: true}
  tens: {off: true}
  gard: {off: true}
  # The head and mouth hang from a neck with no mesh, turned to one side in the rest pose.
  etem: {head: 4}
  eete: {head: 4}
  # The staff arm does not hang (the staff goes above the head): it is also an arm. Its head
  # is the beard (the hair is on the trunk), which grows little.
  jiji: {parts: {7: arm}}
