# The starting partner (Agumon, type 3 in main.c when a game starts) and its animations. The ids are the same for
# any partner Digimon (partner.c: setPartnerIdle, setPartnerSlowWalking, partnerTickWalking): 0 idle,
# 1 idle tired, 2 walks (450 units/s on Agumon), 3 walks tired, 4 runs when left far behind (900 units/s).
model: digimon/agum/model
animations:
  idle: 0
  idle_tired: 1
  walk: 2
  walk_tired: 3
  run: 4
  # partner.c: updateConditionAnimation, idle for a while: 5 happy, 7 unhappy, 0xE hurt or sick,
  # 0xF hungry, 0x10 needs the toilet, 0x11 sleepy, 0x12 tired, 0x13 sulking.
  happy: 5
  unhappy: 7
  hurt: 14
  hungry: 15
  toilet: 16
  sleepy: 17
  tired: 18
  sulking: 19
