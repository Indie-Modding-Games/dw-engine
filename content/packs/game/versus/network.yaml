# Online versus network (packages/game/versus/network.hpp, docs/modules/game/versus.md).
# signal_server: the signaling server (services/versus-signal) that pairs the two players by a
# room code, like wss://server/path. Empty: none is configured and "Online versus" says so.
# It can also be given at startup with --versus-server <url>.
signal_server: "wss://dwe-versus-signal.regamelabs.workers.dev"
# The STUN servers (and later TURN) that help open the direct path between the two machines.
ice_servers:
  - stun:stun.cloudflare.com:3478
