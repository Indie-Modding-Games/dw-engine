# The big board of the training ground: "Battle course", in two lines that follow the board's slope.
signs:
  - id: title_top
    region: [96, 0, 78, 76]
    clear:
      mode: diffuse
      quad: [[98, 32], [173, -12], [173, 75], [98, 112]]
    corners: [[96, 36], [170, 4], [170, 39], [96, 73]]
    text: signs.trai00_title_top
    group: title
    color: "#6e7826"
    outline: {color: "#21426b", width: 1.5}
    colors: region
  - id: title_bottom
    region: [96, 36, 78, 76]
    clear: none
    corners: [[96, 73], [170, 39], [171, 72], [96, 108]]
    text: signs.trai00_title_bottom
    group: title
    color: "#86285a"
    outline: {color: "#21426b", width: 1.5}
    colors: region
  # The gym's plate on the lower stand, a tall panel the original writes top to bottom: its name in two columns read
  # sideways, grey on the right then magenta on the left, each with the blue edge of the original's letters (the
  # Chinese, Japanese and Korean overlays stack the letters upright instead). The sprites cut from the background
  # over it take the text too.
  - id: gym_top
    region: [244, 556, 46, 76]
    clear:
      mode: diffuse
      quad: [[250, 566], [283, 561], [284, 623], [253, 629]]
      color: "#102108"
      tolerance: 36
    corners: [[282, 562], [283, 623], [268.5, 625.5], [267, 564.5]]
    text: signs.trai00_gym_top
    group: gym
    color: "#7b736b"
    outline: {color: "#21426b", width: 1}
    colors: region
  - id: gym_bottom
    region: [244, 556, 46, 76]
    clear: none
    corners: [[267, 564.5], [268.5, 625.5], [254, 628], [252, 567]]
    text: signs.trai00_gym_bottom
    group: gym
    color: "#73214a"
    outline: {color: "#21426b", width: 1}
    colors: region
