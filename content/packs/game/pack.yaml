  ruleset_care:
    - rules/*/care
  ruleset_clock:
    - rules/*/clock
  ruleset_save:
    - rules/*/save
  save_settings:
    - save/settings
  ruleset_life:
    - rules/*/life
  ruleset_training:
    - rules/*/training
  ruleset_inventory:
    - rules/*/inventory
  localization:
    - localization/*/*
  ui_text_font:
    - ui/fonts/original_look
  ruleset_new_game:
    - rules/*/new_game
  ruleset_tamer:
    - rules/*/tamer
  ruleset_evolution:
    - rules/*/evolution
