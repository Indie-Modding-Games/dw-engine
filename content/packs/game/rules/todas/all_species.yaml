# Todas las especies como compañero (opción de partida nueva, encendida por defecto): las especies con
# modelo y clips de combate que el original nunca deja criar salen evolucionando en una partida normal. El
# original va primero: un destino de aquí solo se elige cuando ninguno de los del original pasa. Diseño:
# docs/modulos/game/evoluciones-extra.md. Formato de los parches: docs/architecture/rulesets.md.

# Los novatos de la línea de fuego, hielo, ogros y oscuridad: un entrenamiento que despierta en su mapa
# (como el especial del original en mayo02), tras los del original.
