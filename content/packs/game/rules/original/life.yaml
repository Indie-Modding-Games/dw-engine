# Partner life, death and rebirth (docs/reference/care.md, "Life and age" and "Death and rebirth"). Read by
# packages/game/partner. Hours are game hours. Unless stated otherwise, everything is in src/main/partner_impl.c.
# initializePartner, initializeReincarnatedPartner: life starts at 360 hours (15 days).
lifetime_hours: 360
# initializePartner, evolution.c: reincarnatePartner: the partner starts with 3 lives.
lives: 3
# tickConditions: every 4 hours (CURRENT_FRAME % 4800) with happiness below 80, life drops
# (happiness - 80) / -50 + 1 hours, with integer division.
unhappy_lifetime:
  every_hours: 4
  happiness_below: 80
  happiness_divisor: 50
  extra_hours: 1
rebirth:
  # dooa/dooa.c: the egg is chosen with rand() % 4 among REINCARNATE_BABY_TYPE: original = a random one with the same
  # probability.
  baby_choice: original
  # dooa/dooa.c: REINCARNATE_BABY_TYPE, the four babies; partner_impl.c: initializeReincarnatedPartner, the fixed
  # stats of each one (setReincarnateStats). Code constants, not a disc table.
  babies:
    - { digimon: "bota", hp: 90, mp: 110, offense: 10, defense: 11, speed: 9, brain: 10 }
    - { digimon: "puni", hp: 120, mp: 100, offense: 16, defense: 8, speed: 8, brain: 6 }
    - { digimon: "poyo", hp: 100, mp: 140, offense: 12, defense: 6, speed: 6, brain: 8 }
    - { digimon: "yura", hp: 100, mp: 120, offense: 8, defense: 8, speed: 8, brain: 8 }
  # setReincarnateStats: after a natural death it inherits a % of each stat of the dead partner equal to the Tamer
  # level; otherwise, nothing.
  inherit_percent_per_tamer_level: 1
  # dooa/dooa.c: DOOA_getSequenceState: with no lives the egg is picked at random (rand() % 4) even if the box says otherwise; the
  # section 0x49 of script 212 is not even opened. With false (option choose_egg_after_lives_lost) the box is opened too and
  # the chosen egg counts.
  random_egg_without_lives: true
# The scenes of a lost life, of death and of rebirth, in original frames (20 per second). Without this
# section the partner changes instantly.
scenes:
  # murd/murd.c: MURD_tickScene: the iris closes on the partner (0x23), which is left alone on black with the lives
  # box until 0x5f; with lives, the fade to black rises to 160 (0x87), holds at 255 while the map loads
  # where the Tamer wakes up, the map returns at 0x91 and the fade drops from 160 to 0xb9.
  lost_life:
    iris_frames: 35
    alone_until: 95
    fade_out_end: 135
    map_back: 145
    fade_in_end: 185
    shade_max: 160
    shade_hold: 255
  # dooa/dooa.c: DOOA_tick and murd.c: MURD_tick: map 0xcd (exit 1) if trigger 0xdc or 0xd6 is set or
  # variable 1 reaches 50; otherwise, 0xda.
  wake_map:
    story_map: 205
    early_map: 218
    exit: 1
    story_triggers: [220, 214]
    story_variable: 1
    story_variable_at_least: 50
    # dooa/dooa.c: DOOA_tickDissolve: on the story map (0xCD) the death camera starts at 0xBC and not at
    # 0xA0: 28 pixels to the right of the screen center.
    story_map_start_x: 28
  # dooa/dooa.c: DOOA_tickDissolve (death) and DOOA_tickRebirth (rebirth), with sound bank 0x13 in
  # slot 8 (partnerTickDying: loadMapSounds2(19)). The sounds are from that bank.
  death:
    sound_bank: 19
    # 0x23: loads the map where the Tamer wakes up; with no lives the scene starts here, with the partner already hidden.
    map_frame: 35
    # 0x56: the partner is left alone and the burst animation starts.
    stand_frame: 86
    burst: { frame: 105, sound: 0 }
    # 0xbf: the partner shrinks; 0xd1: disappears (vanish animation); 0x135: the light rises; 0x1b7: end.
    sink: { frame: 191, sound: 1 }
    vanish: { frame: 209, sound: 2 }
    rise: { frame: 309, sound: 3 }
    # 0x185: the first character of the wake-up map (ENTITY_TABLE[2], the old man at his house) becomes visible again over
    # black and continues during the rebirth.
    host_frame: 389
    end_frame: 439
    # DOOA_tickRebirth: the egg glows (10) and opens (132); at 152 the new baby (reincarnatePartner) and the map
    # returns from black until 202, when the baby is seen with the reborn animation; at 262 the finish animation.
    glow: { frame: 10, sound: 5 }
    hatch: { frame: 132, sound: 6 }
    swap_frame: 152
    shown_frame: 202
    sparkle_sound: 7
    finish_frame: 262
    clips: { alive: 1, last_life: 44, burst: 12, vanish: 33, reborn: 28, finish: 11 }
