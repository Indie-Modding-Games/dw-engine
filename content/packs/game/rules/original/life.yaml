# Vida, muerte y renacer del partner (docs/reference/care.md, "Vida y edad" y "Muerte y renacer"). Lo lee
# packages/game/partner. Las horas son horas de juego. Salvo que se diga otra cosa, todo está en src/main/partner_impl.c.
# initializePartner, initializeReincarnatedPartner: la vida empieza en 360 horas (15 días).
lifetime_hours: 360
# initializePartner, evolution.c: reincarnatePartner: el partner empieza con 3 vidas.
lives: 3
# tickConditions: cada 4 horas (CURRENT_FRAME % 4800) con felicidad menor que 80, la vida baja
# (felicidad - 80) / -50 + 1 horas, con división entera.
unhappy_lifetime:
  every_hours: 4
  happiness_below: 80
  happiness_divisor: 50
  extra_hours: 1
rebirth:
  # dooa/dooa.c: el huevo se elige con rand() % 4 entre REINCARNATE_BABY_TYPE: original = uno al azar con la misma
  # probabilidad.
  baby_choice: original
  # dooa/dooa.c: REINCARNATE_BABY_TYPE, los cuatro bebés; partner_impl.c: initializeReincarnatedPartner, los stats
  # fijos de cada uno (setReincarnateStats). Constantes del código, no una tabla del disco.
  babies:
    - { digimon: "bota", hp: 90, mp: 110, offense: 10, defense: 11, speed: 9, brain: 10 }
    - { digimon: "puni", hp: 120, mp: 100, offense: 16, defense: 8, speed: 8, brain: 6 }
    - { digimon: "poyo", hp: 100, mp: 140, offense: 12, defense: 6, speed: 6, brain: 8 }
    - { digimon: "yura", hp: 100, mp: 120, offense: 8, defense: 8, speed: 8, brain: 8 }
  # setReincarnateStats: tras una muerte natural hereda un % de cada stat del partner muerto igual al nivel del
  # tamer; si no, nada.
  inherit_percent_per_tamer_level: 1
# Las escenas de una vida perdida, de la muerte y del renacer, en fotogramas del original (20 por segundo). Sin esta
# sección el partner cambia al momento.
scenes:
  # murd/murd.c: MURD_tickScene: el iris se cierra sobre el partner (0x23), que queda solo sobre negro con la caja de
  # vidas hasta 0x5f; con vidas, el fundido a negro sube hasta 160 (0x87), se sostiene en 255 mientras carga el mapa
  # donde despierta el tamer, el mapa vuelve en 0x91 y el fundido baja desde 160 hasta 0xb9.
  lost_life:
    iris_frames: 35
    alone_until: 95
    fade_out_end: 135
    map_back: 145
    fade_in_end: 185
    shade_max: 160
    shade_hold: 255
  # dooa/dooa.c: DOOA_tick y murd.c: MURD_tick: el mapa 0xcd (salida 1) si el trigger 0xdc o el 0xd6 está puesto o
  # la variable 1 llega a 50; si no, el 0xda.
  wake_map:
    story_map: 205
    early_map: 218
    exit: 1
    story_triggers: [220, 214]
    story_variable: 1
    story_variable_at_least: 50
    # dooa/dooa.c: DOOA_tickDissolve: en el mapa de la historia (0xCD) la cámara de la muerte parte de 0xBC y no de
    # 0xA0: 28 píxeles a la derecha del centro de la pantalla.
    story_map_start_x: 28
  # dooa/dooa.c: DOOA_tickDissolve (la muerte) y DOOA_tickRebirth (el renacer), con el banco de sonidos 0x13 en la
  # ranura 8 (partnerTickDying: loadMapSounds2(19)). Los sonidos son de ese banco.
  death:
    sound_bank: 19
    # 0x23: carga el mapa donde despierta el tamer; sin vidas la escena empieza aquí, con el partner ya oculto.
    map_frame: 35
    # 0x56: el partner queda solo y empieza la animación burst.
    stand_frame: 86
    burst: { frame: 105, sound: 0 }
    # 0xbf: el partner se encoge; 0xd1: desaparece (animación vanish); 0x135: sube la luz; 0x1b7: fin.
    sink: { frame: 191, sound: 1 }
    vanish: { frame: 209, sound: 2 }
    rise: { frame: 309, sound: 3 }
    # 0x185: el primer personaje del mapa de despertar (ENTITY_TABLE[2], el anciano en su casa) vuelve a verse sobre
    # negro y sigue durante el renacer.
    host_frame: 389
    end_frame: 439
    # DOOA_tickRebirth: el huevo brilla (10) y se abre (132); en 152 el bebé nuevo (reincarnatePartner) y el mapa
    # vuelve desde negro hasta 202, cuando se ve el bebé con la animación reborn; en 262 la animación finish.
    glow: { frame: 10, sound: 5 }
    hatch: { frame: 132, sound: 6 }
    swap_frame: 152
    shown_frame: 202
    sparkle_sound: 7
    finish_frame: 262
    clips: { alive: 1, last_life: 44, burst: 12, vanish: 33, reborn: 28, finish: 11 }
