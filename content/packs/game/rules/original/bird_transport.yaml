# The bird transport that opens the story (script_interp.c: CALL_ROUTINE 10 -> shop/script_menu.c:
# tickBirdraTransport; packages/session: BirdTransport): the carrier takes the player to a place in exchange for bits.

# showMapHeadTextbox(..., 0x4d6): the carrier's lines are this MAPHEAD section.
lines_section: 1238
# createShopBitsBox -> getShopkeeperLine: the money box says line 6 («Bits {bits}») of the
# shopkeeper section; the carrier is not in the shopkeeper table, so it is the first one's (0x4c4).
bits_section: 1220
# The number of each line within the section (resolveMapHeadEntry): «where shall I take you?» (state 0), the
# farewell with no trip (state 6), «are you sure? once there I can't bring you back» (tickBirdraTransportMenu) and the
# yes or no (state 4).
lines:
  greeting: 4
  farewell: 5
  confirm: 6
  choices: 7
  bits: 6
# State 5: the map and the destination entry go to variables 247 and 248, and the script continues in section
# 0x4e3 of MAPHEAD («Hold on tight!» and teleport with variable 247).
map_variable: 247
entry_variable: 248
travel_section: 1251
# tickSelectionDialogue: with trigger 0x31 set, cancel does not answer the yes or no.
choice_lock_trigger: 49
# tickBirdraTransportMenu: playSound(0, 0xb) on a place the money does not pay for.
refuse_sound: {slot: 0, sound: 11}
# BIRDRA_TRANSPORT_TARGETS: the original's map index, the entry, the trigger that puts the place in the
# list (birdraFillTargetList) and the price in bits.
destinations:
  - {map: 38, entry: 9, trigger: 221, cost: 1000}
  - {map: 70, entry: 9, trigger: 190, cost: 1000}
  - {map: 79, entry: 9, trigger: 188, cost: 1500}
  - {map: 93, entry: 9, trigger: 351, cost: 2000}
  - {map: 119, entry: 9, trigger: 147, cost: 2500}
  - {map: 105, entry: 0, trigger: 210, cost: 2500}
