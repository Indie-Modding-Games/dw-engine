# The medals the field gives (packages/session: MedalsAdapter; packages/game/story: medals.hpp).
# tamer.c: checkMedalConditions, every frame the player walks free: each medal not yet owned and whose
# condition is met is given (script_common.c: unlockMedal sets trigger first_trigger + medal) and leaves the notice
# pending (tamerTickAwardSomething). The tournament medals belong to the script.
first_trigger: 364
medal_limit: 19
conditions:
  # All moves numbered below count learned (hasMove).
  all_moves: { medal: 5, count: 57 }
  # The partner's base stats exactly these.
  max_stats: { medal: 7, hp: 9999, mp: 9999, offense: 999, defense: 999, speed: 999, brain: 999 }
  # The money exactly this amount.
  money: { medal: 13, amount: 999999 }
  # The calendar year exactly this one.
  year: { medal: 14, year: 10 }
  # All species from first to end (excluded) raised; also raises tamer_levels the Tamer level without a notice.
  all_raised: { medal: 6, first: 1, end: 62, tamer_levels: 1 }
  # At least count fish caught.
  fish: { medal: 9, count: 100 }
  # At least one copy of each card numbered below count (getCardAmount).
  all_cards: { medal: 12, count: 66 }
# The sound when the notice box opens (playSound(0, 7)).
award_sound: { slot: 0, sound: 7 }
