# The partner's moves at the start and on rebirth (packages/session: BattleAdapter, PartnerMoveRules,
# docs/modules/apps/session.md). A position is the index in the species' move list (data/digimon: moves): the
# original stores the equipped ones that way (stats.base.moves = 0x2E + position), so after an evolution each position
# names the new species' move. The equipped finisher is the last move in the list that is a finisher.

# partner_impl.c: initializePartner: species 3 (agum) equips position 0 (moves[0] = 0x2E) and learns its move
# (learnMove(2)); 0x11 (gabu) equips position 2 (moves[0] = 0x30, learnMove(0x2B)). Holds for the partner of
# new_game.yaml. Measured in the original with the second starting species: moves = [0x30, 0xFF, 0xFF, 0x35], only
# 0x2B learned (learnedMoves[1] = 0x800).
new_game_slot: 0
# The species that start with a position other than new_game_slot: the second starting species (0x11) equips and learns
# position 2.
new_game_species_slots: { gabu: 2 }
# evolution.c: reincarnatePartner: the reborn partner equips only position 0 (moves[0] = 0x2E, the rest 0xFF) and keeps
# the learned moves.
reborn_slot: 0
# Quirks of the original (true reproduces the original; another ruleset turns them off).
quirks:
  # utils2.c: unlearnMove (routine 47, lostAllLives) clears the move's bit with a 16-bit mask over a
  # 32-bit word (andi 0xffff, xori 0xffff, and over lw/sw; measured in the original's code on 2026-11-07): with it
  # the 16 high moves of the word go away; 0x30 clears the bit of 0x2C and 0x37 and 0x39 only that high half. false forgets
  # only the chosen move.
  forget_mask_16_bits: true
