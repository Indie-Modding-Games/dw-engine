# Las técnicas del partner al empezar y al renacer (packages/session: BattleAdapter, PartnerMoveRules,
# docs/modulos/apps/session.md). Una posición es el índice en la lista de técnicas de la especie (data/digimon: moves): el
# original guarda las equipadas así (stats.base.moves = 0x2E + posición), de modo que tras una evolución cada posición
# nombra la técnica de la nueva especie. El remate equipado es la última técnica de la lista que es un remate.

# partner_impl.c: initializePartner: la especie 3 (agum) equipa la posición 0 (moves[0] = 0x2E) y aprende su técnica
# (learnMove(2)); la 0x11 (gabu) equipa la posición 2 (moves[0] = 0x30, learnMove(0x2B)). Vale para el partner de
# new_game.yaml. Medido en el original con la segunda especie inicial: moves = [0x30, 0xFF, 0xFF, 0x35], aprendida solo la
# 0x2B (learnedMoves[1] = 0x800).
new_game_slot: 0
# Las especies que empiezan con otra posición que new_game_slot: la segunda especie inicial (la 0x11) equipa y aprende la
# posición 2.
new_game_species_slots: { gabu: 2 }
# evolution.c: reincarnatePartner: el renacido equipa solo la posición 0 (moves[0] = 0x2E, el resto 0xFF) y conserva
# las técnicas aprendidas.
reborn_slot: 0
# Rarezas del original (true reproduce el original; otro ruleset las apaga).
quirks:
  # utils2.c: unlearnMove (rutina 47, lostAllLives) borra el bit de la técnica con una máscara de 16 bits sobre una
  # palabra de 32 (andi 0xffff, xori 0xffff, and sobre lw/sw; medido en el código del original el 2026-11-07): con ella
  # se van las 16 técnicas altas de la palabra; 0x30 borra el bit de 0x2C y 0x37 y 0x39 solo esa mitad alta. false olvida
  # solo la técnica elegida.
  forget_mask_16_bits: true
