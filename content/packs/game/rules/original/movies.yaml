# The movies (apps/game: MovieScreen, docs/architecture/movies.md): which one plays at each moment and whether Start
# skips it. The original: main.c: main (which movie and when) and mov.c: MOV_playMovie (the skip: all but the 3rd, EDR).
movies:
  # On boot and every time the title screen goes landing_idle_frames without input.
  boot: { file: op1, skippable: true }
  # New game, before the starting map (MAIN_STATE 0).
  new_game: { file: op2, skippable: true }
  # Continuing a saved game after the ending (MAIN_STATE 2, main_menu.c: gameClearSave).
  cleared_load: { file: ed2, skippable: true }
  # After the ending (MAIN_STATE 3); then it goes back to the title screen.
  ending: { file: edr, skippable: false }
# Frames (at 60 per second) without input on the title screen before going back to the boot movie
# (main.c: runLandingScreen, 0x258).
landing_idle_frames: 600
