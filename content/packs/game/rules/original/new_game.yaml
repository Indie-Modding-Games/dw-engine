# The new game (packages/session: NewGameRules, docs/modules/apps/session.md): which partner and which Tamer it starts with.
# The stats are the partner's (offense, defense, speed, brain, max HP and MP); the rest of the partner is set by
# packages/game/partner at the start (care.yaml, life.yaml).
# main.c: main: a new game raises the starting partner (initializePartner(3)); the intro's answer can
# pick another starting partner (0x11, readPStat(0xfe)), which will arrive with the story.
partner: agum
# Fallback: the starting stats are set by script 193 after the intro (set_stat at 0x0918-0x0964), which dwx extracts to
# data/new_game_stats; the session uses that document and these values only if the base pack does not have it. They are
# not from the original.
stats: { hp: 500, mp: 500, offense: 50, defense: 50, speed: 50, brain: 50 }
# main_menu.c: initializeDefaultSavegame: tamerLevel = 0.
tamer_level: 0
