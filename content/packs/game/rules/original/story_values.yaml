# The numbers of the story orders that change the save (packages/session: StoryGameOrders,
# docs/reference/scripts.md).
# The cap of each stat after set_stat and add_stat (script_value.c: STATS_LIMIT_ARRAY); current HP
# and MP stay at their maximum. The original reads the lives outside its table: 255 lets
# through every value the disc writes.
stat_limits:
  offense: 999
  defense: 999
  speed: 999
  brain: 999
  max_hp: 9999
  max_mp: 9999
  tiredness: 100
  happiness: 100
  discipline: 999
  energy: 999
  virus: 999
  lifetime: 999
  merit: 9999
  started_battles: 9999
  fled_battles: 9999
  tournaments_won: 999
  tournament_wins: 999
  tournaments_lost: 999
  weight: 99
  tamer_level: 10
  lives: 255
# reduce_stat does not lower happiness below this (script_interp.c: scriptInstruction28to3F).
happiness_floor: -100
# add_minutes_to_date_at: a date of 255 years or more stays at 25 years, day 14, 23:59
# (script_interp.c: secondsToDate).
date_year_limit: 255
date_overflow: [25, 14, 23, 59]
