# Items that keep every place they are found in, lying, in a chest or given, and never appear anywhere else: the key
# items (droppable 0) and every item the story checks in the bag (story.items) to go on or to recruit. The session adds
# any other key item a pack brings (game::inventory::isKeyItem).
