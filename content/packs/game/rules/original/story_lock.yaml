# El candado de historia (apps/session: StoryLock, docs/modulos/apps/session.md): qué parte del juego
# está abierta mientras el port llega etapa a etapa. No es una regla del original: cuando todo el
# juego esté portado, la última etapa abre todos los mapas ("*").
#
# - Las etapas van en orden de entrega y son acumulativas: la etapa N abre los mapas de las etapas 1
#   a N. Sus `exits` y `sections` son su frontera: solo valen mientras esa etapa es la activa.
# - `active_stage` es la última etapa entregada. La opción de arranque `--story-stage <id>` juega
#   otra sin tocar este fichero, y `--story-stage all` lo abre todo (desarrollo y pruebas). El log
#   dice al arrancar qué etapa se juega ([port:story-lock]).
# - Se cierran los cambios de mapa nuevos hacia un mapa cerrado: una salida que pisa el jugador, el
#   cambio de mapa de un script y una sección de casilla cerrada no ocurren, y el juego muestra
#   `closed_message`. Una partida guardada más allá de la etapa no se rompe: el jugador se queda
#   donde está y puede salir por cualquier salida hacia un mapa abierto.
# - Un mapa se nombra por su id o por un prefijo acabado en '*' (twnb*); "*" son todos.
# - `exits` (opcional): mapas cuyas salidas solo llevan a estos mapas abiertos.
# - `sections` (opcional): mapas cuyas casillas solo lanzan estas secciones del script del mapa.
#
# Mapas y salidas verificados en el decomp y en los scripts extraídos (E1-01:
# _work/logs/plan/hitos-disparadores.md).
active_stage: stage_5
closed_message: story_lock.closed_exit
stages:
  # Etapa 1: la apertura, File City con sus casas y el Green Gym, y el Native Forest hasta el
  # puente roto de Coelamon. Quedan cerradas solas, por no estar en la lista, las salidas a la
  # etapa 2 y siguientes: mayo01_2 y mayo02_2 a mayo11 (Drill Tunnel), mayo02_2 a miha00,
  # mayo08a a trop00, el lomo de Coelamon (mayo05 a trop01), mayo06 a betl01, las casas
  # room10/11/12/14/19/20, mgen01, ogre10/fact01, los viajes de Birdramon (script 209) y el
  # teletransporte de depuración de twna01 (sección 5).
  - id: stage_1
    maps:
      # La apertura y File City (twna01 vacía, twna02-13 según la prosperidad; twnb, sus calles).
      - topn01
      - twna*
      - twnb*
      # Las casas de File City de la etapa (room08 es la casa de Jijimon) y el Green Gym.
      - room02
      - room04
      - room05a
      - room05b
      - room06
      - room07
      - room08
      - room13
      - trai00
      # Native Forest (mayo00 es el paso de Agumon; mayo02_2 y mayo08a son variantes que abren
      # flags de etapas posteriores, y sus salidas fuera quedan cerradas).
      - mayo00
      - mayo01
      - mayo01_2
      - mayo02
      - mayo02_2
      - mayo03
      - mayo04a
      - mayo04b
      - mayo05
      - mayo06
      - mayo08a
      - mayo08b
      - mayo10
  # Etapa 2: la jungla (Tropical Jungle, trop00-06) con Coelamon, Betamon, Centarumon y Vegiemon,
  # y el Drill Tunnel (mayo11 y tunn01-10 con sus variantes) con Drimogemon y Meramon. Ogremon se
  # une en tunn02 (disparador 234) solo con el 150, que pone ogre11 en la etapa 5: aquí su escena
  # no sale y el túnel se cruza igual.
  # Abre el lomo de Coelamon (mayo05 a trop01), mayo08a a trop00, las entradas del túnel desde
  # mayo01_2 y mayo02_2 y room14 (la casa que abre Drimogemon, disparador 238). Quedan cerradas
  # solas, por no estar en la lista, las salidas a la etapa 3 y siguientes: trop02 a dgha01,
  # trop03 a gcan01, trop06 a koda00, tunn03 y tunn03_2 a leom02 y mayo02_2 a miha00, y los
  # cambios de mapa de script de mayo11 y tunn08 a miha04b.
  - id: stage_2
    maps:
      - mayo11
      - trop00
      - trop01
      - trop02
      - trop03
      - trop04
      - trop05
      - trop06
      - tunn*
      - room14
  # Etapas 3 a 9: los mapas de cada tramo, verificados en los scripts extraídos y en las salidas de
  # los mapas. Todavía no se liberan: `active_stage` no las alcanza y sirven para probarlas con
  # `--story-stage`. Las salidas entre tramos no siguen la historia en línea (gias08 a stic01,
  # gcan01 a dgha01 o frzl08 a mist07 dan a la etapa 7, gias02 a fact05 a la 6): un mapa
  # de una etapa posterior queda cerrado hasta que su etapa se juega.
  # Etapa 3: Mt. Panorama (miha), Gear Savanna (gias, con la tienda secreta de cartas gias06b), la
  # cueva de Leomon (leom) y Trash Mountain (gomi). Entra por mayo02_2 a miha00 y por tunn03 y
  # tunn03_2 a leom02. Su frontera: la salida de gias08 a stic01 (etapa 7) queda cerrada sola; la
  # puerta de hierro de gias02 a fact05 (etapa 6) solo se abre con el disparador 328, y el
  # vestíbulo de la Arena (room13) solo lleva a room20 y room19 con los disparadores 257 y 50, que
  # la etapa no pone. Rutas: route-etapa3-*.yaml (docs/guides/prueba-vertical.md).
  - id: stage_3
    maps:
      - miha*
      - gias*
      - leom*
      - gomi*
  # Etapa 4: Great Canyon (gcan) con el puente invisible y el ascensor, Ogre Fortress (ogre00-04) y
  # la casa de Birdramon (room12, que abre los viajes en el aire). Entra por trop03 a gcan01.
  # Quedan cerradas solas las salidas a la etapa 5 y siguientes: gcan03, gcan04 y gcan04_2 a frzl01,
  # gcan01 a dgha01 y, en el transporte en pájaro, koda00, frzl06, mist05 y betl01 (en rojo, sin cobrar).
  - id: stage_4
    maps:
      - gcan*
      - ogre00
      - ogre01
      - ogre02
      - ogre03
      - ogre04
      - room12
  # Etapa 5: Freezeland (frzl, con el curling de frzl17), Ice Sanctuary (icsa), la cueva de Whamon
  # (ogre10 y ogre11) y la casa de Penguinmon (room20). Entra por gcan03, gcan04 y gcan04_2 a frzl01.
  # Camino de la historia: la playa de frzl16, donde Whamon (con el 175 de la Ogre Fortress) lleva a
  # ogre10; el combate de ogre11 pone el 150 (Ogremon se une luego en tunn02, 234) y Whamon se une
  # (224), que abre el viaje del muelle de File City a fact01 (etapa 6). Quedan cerradas solas las
  # salidas a etapas posteriores: frzl08 a mist07, el muelle (casilla 55 de twna02-13) a fact01 y
  # frzl05 a mgen11 (solo en el post-juego, variable 16).
  - id: stage_5
    maps:
      - frzl*
      - icsa*
      - ogre10
      - ogre11
      - room20
  # Etapa 6: Factorial Town (fact) y sus secuencias (map_239-246 y map_250-252). Entra con Whamon
  # (casilla 55 de twna02-13 a fact01).
  - id: stage_6
    maps:
      - fact*
      - map_*
  # Etapa 7: los módulos opcionales en orden libre: Grey Lord's Mansion (dgha), Ancient Dino Region
  # (yaka, chka01), Overdell (saib), Misty Trees y Geko Swamp (mist, stic, gkyo), Toy Town (omoc),
  # Beetle Land (betl) y el bosque de koda.
  - id: stage_7
    maps:
      - dgha*
      - yaka*
      - chka01
      - saib*
      - koda*
      - betl*
      - mist*
      - stic*
      - gkyo*
      - omoc*
  # Etapa 8: Mt. Infinity (mgen01-10, mgen98, mgen99), la segunda casa de Jijimon (room10, room11),
  # room19 y el final (tend01, tend02). Entra por la casilla 56 de twna02-13 a mgen01. Rutas
  # route-etapa8-*.yaml: Jijimon y Airdramon, la subida, el final hasta la portada y la frontera
  # (frzl05 a mgen11 queda cerrada).
  - id: stage_8
    maps:
      - mgen01
      - mgen02
      - mgen03
      - mgen04
      - mgen05
      - mgen06
      - mgen07
      - mgen08
      - mgen09
      - mgen10
      - mgen98
      - mgen99
      - room10
      - room11
      - room19
      - tend*
  # Etapa 9: el post-juego, la Back Dimension (mgen11-16). Con ella están abiertos todos los mapas.
  # Rutas route-etapa9-*.yaml sobre la partida terminada: el huevo y Digitamamon, y mgen11-13 desde
  # frzl05. mgen14-16 no tienen entrada conocida en los scripts.
  - id: stage_9
    maps:
      - mgen11
      - mgen12
      - mgen13
      - mgen14
      - mgen15
      - mgen16
