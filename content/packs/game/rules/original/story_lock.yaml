# The story lock (packages/session: StoryLock, docs/modules/apps/session.md): which part of the game
# is open while the port arrives stage by stage. It is not a rule of the original: once the whole
# game is ported, the last stage opens all maps ("*").
#
# - Stages are in delivery order and cumulative: stage N opens the maps of stages 1 to N. Their
#   `exits` and `sections` are their frontier: they only apply while that stage is the active one.
# - `active_stage` is the last delivered stage. The start option `--story-stage <id>` plays another
#   one without touching this file, and `--story-stage all` opens everything (development and
#   tests). The log says which stage is played at startup ([port:story-lock]).
# - New map changes toward a closed map are blocked: an exit the player steps on, a script map
#   change and a closed tile section do not happen, and the game shows `closed_message`. A save
#   past the stage does not break: the player stays where they are and can leave by any exit toward
#   an open map.
# - A map is named by its id or by a prefix ending in '*' (twnb*); "*" is all of them.
# - `exits` (optional): maps whose exits only lead to these open maps.
# - `sections` (optional): maps whose tiles only launch these sections of the map script.
#
# Maps and exits verified in the decomp and in the extracted scripts (E1-01:
# _work/logs/plan/hitos-disparadores.md).
active_stage: stage_9
closed_message: story_lock.closed_exit
stages:
  # Stage 1: the opening, File City with its houses and the Green Gym, and the Native Forest up to
  # Coelamon's broken bridge. The exits to stage 2 and later are closed on their own, by not being
  # in the list: mayo01_2 and mayo02_2 to mayo11 (Drill Tunnel), mayo02_2 to miha00, mayo08a to
  # trop00, Coelamon's back (mayo05 to trop01), mayo06 to betl01, the houses room10/11/12/14/19/20,
  # mgen01, ogre10/fact01, Birdramon's trips (script 209) and the debug teleport of twna01
  # (section 5).
  - id: stage_1
    maps:
      # The opening and File City (twna01 empty, twna02-13 by prosperity; twnb, its streets).
      - topn01
      - twna*
      - twnb*
      # The File City houses of the stage (room08 is Jijimon's house) and the Green Gym.
      - room02
      - room04
      - room05a
      - room05b
      - room06
      - room07
      - room08
      - room13
      - trai00
      # Native Forest (mayo00 is Agumon's pass; mayo02_2 and mayo08a are variants that open
      # flags of later stages, and their exits to the outside stay closed).
      - mayo00
      - mayo01
      - mayo01_2
      - mayo02
      - mayo02_2
      - mayo03
      - mayo04a
      - mayo04b
      - mayo05
      - mayo06
      - mayo08a
      - mayo08b
      - mayo10
  # Stage 2: the jungle (Tropical Jungle, trop00-06) with Coelamon, Betamon, Centarumon and Vegiemon,
  # and the Drill Tunnel (mayo11 and tunn01-10 with their variants) with Drimogemon and Meramon.
  # Ogremon joins in tunn02 (trigger 234) only with 150, which sets ogre11 in stage 5: here its
  # scene does not play and the tunnel is crossed all the same.
  # Opens Coelamon's back (mayo05 to trop01), mayo08a to trop00, the tunnel entrances from
  # mayo01_2 and mayo02_2 and room14 (the house that opens Drimogemon, trigger 238). The exits to
  # stage 3 and later are closed on their own, by not being in the list: trop02 to dgha01,
  # trop03 to gcan01, trop06 to koda00, tunn03 and tunn03_2 to leom02 and mayo02_2 to miha00, and
  # the script map changes of mayo11 and tunn08 to miha04b.
  - id: stage_2
    maps:
      - mayo11
      - trop00
      - trop01
      - trop02
      - trop03
      - trop04
      - trop05
      - trop06
      - tunn*
      - room14
  # Stages 3 to 9: the maps of each stretch, verified in the extracted scripts and in the map
  # exits. All of them are released (`active_stage` is stage_9); `--story-stage` is for playing
  # only up to an earlier one. The exits between stretches do not follow the story in a line
  # (gias08 to stic01, gcan01 to dgha01 or frzl08 to mist07 lead to stage 7, gias02 to fact05 to
  # stage 6): a map of a later stage stays closed until its stage is played.
  # Stage 3: Mt. Panorama (miha), Gear Savanna (gias, with the secret card shop gias06b), Leomon's
  # cave (leom) and Trash Mountain (gomi). Entered through mayo02_2 to miha00 and through tunn03 and
  # tunn03_2 to leom02. Its frontier: the exit from gias08 to stic01 (stage 7) is closed on its
  # own; the iron door from gias02 to fact05 (stage 6) only opens with trigger 328, and the Arena
  # lobby (room13) only leads to room20 and room19 with triggers 257 and 50, which the stage does
  # not set. Routes: route-stage3-*.yaml (docs/guides/vertical-slice.md).
  - id: stage_3
    maps:
      - miha*
      - gias*
      - leom*
      - gomi*
  # Stage 4: Great Canyon (gcan) with the invisible bridge and the elevator, Ogre Fortress (ogre00-04) and
  # Birdramon's house (room12, which opens the air trips). Entered through trop03 to gcan01.
  # The exits to stage 5 and later are closed on their own: gcan03, gcan04 and gcan04_2 to frzl01,
  # gcan01 to dgha01 and, in the bird transport, koda00, frzl06, mist05 and betl01 (red, no charge).
  - id: stage_4
    maps:
      - gcan*
      - ogre00
      - ogre01
      - ogre02
      - ogre03
      - ogre04
      - room12
  # Stage 5: Freezeland (frzl, with the curling of frzl17), Ice Sanctuary (icsa), Whamon's cave
  # (ogre10 and ogre11) and Penguinmon's house (room20). Entered through gcan03, gcan04 and gcan04_2 to frzl01.
  # Story path: the beach of frzl16, where Whamon (with the 175 of the Ogre Fortress) takes you to
  # ogre10; the ogre11 battle sets 150 (Ogremon joins later in tunn02, 234) and Whamon joins
  # (224), which opens the trip from the File City dock to fact01 (stage 6). The exits to later
  # stages are closed on their own: frzl08 to mist07, the dock (tile 55 of twna02-13) to fact01 and
  # frzl05 to mgen11 (only in the post-game, variable 16).
  - id: stage_5
    maps:
      - frzl*
      - icsa*
      - ogre10
      - ogre11
      - room20
      # Jijimon's house when the city has grown: tile 52 of twna02-13 leads to room10 instead of
      # room08 with Angemon (trigger 220, Ice Sanctuary), Monzaemon (214) or prosperity 50.
      - room10
  # Stage 6: Factorial Town (fact) and its sequences (map_239-246 and map_250-252). Entered with Whamon
  # (tile 55 of twna02-13 to fact01).
  - id: stage_6
    maps:
      - fact*
      - map_*
  # Stage 7: the optional modules in free order: Grey Lord's Mansion (dgha), Ancient Dino Region
  # (yaka, chka01), Overdell (saib), Misty Trees and Geko Swamp (mist, stic, gkyo), Toy Town (omoc),
  # Beetle Land (betl) and the koda forest.
  - id: stage_7
    maps:
      - dgha*
      - yaka*
      - chka01
      - saib*
      - koda*
      - betl*
      - mist*
      - stic*
      - gkyo*
      - omoc*
  # Stage 8: Mt. Infinity (mgen01-10, mgen98, mgen99), room11 (tile 57 of twna02-13 with
  # trigger 354), room19 and the ending (tend01, tend02). Entered through tile 56 of twna02-13 to mgen01.
  # Routes route-stage8-*.yaml: Jijimon and Airdramon, the climb, the ending up to the title screen and the
  # frontier (frzl05 to mgen11 stays closed).
  - id: stage_8
    maps:
      - mgen01
      - mgen02
      - mgen03
      - mgen04
      - mgen05
      - mgen06
      - mgen07
      - mgen08
      - mgen09
      - mgen10
      - mgen98
      - mgen99
      - room11
      - room19
      - tend*
  # Stage 9: the post-game, the Back Dimension (mgen11-16). With it all maps are open.
  # Routes route-stage9-*.yaml on the finished save: the egg and Digitamamon, and mgen11-13 from
  # frzl05. mgen14-16 have no known entrance in the scripts.
  - id: stage_9
    maps:
      - mgen11
      - mgen12
      - mgen13
      - mgen14
      - mgen15
      - mgen16
