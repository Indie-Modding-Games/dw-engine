# Partner care (docs/reference/care.md): hunger, sleep, potty, sickness, mood and tiredness. The effects of
# battles on care are in the battle section (consequences). Read by packages/game/partner. Units are in the name of
# each key: _frames are original frames (20 per game minute, see clock.yaml), _minutes game minutes,
# _hours game hours and _percent percent. Unless stated otherwise, everything is in src/main/partner_impl.c.
limits:
  # tickConditionBoundaries: happiness goes from -100 to 100; discipline and tiredness from 0 to 100; weight from 1 to
  # 99.
  happiness_min: -100
  happiness_max: 100
  discipline_max: 100
  tiredness_max: 100
  weight_min: 1
  weight_max: 99
  # item.c: handleFood (addWithLimit) and trn_hud.c: TRN_tickPostTrainingStatsBox: HP and MP up to 9999; offense,
  # defense, speed and brains up to 999.
  hp_mp_max: 9999
  stat_max: 999
  # Approved deviation (2026-10-20): each stat gain stops at 999 at most, whether it comes from training,
  # an item, evolution or the inheritance on rebirth. In the original only the first gain of
  # each training session has it (trn/trn_reward.c: TRN_award*TrainingGains); items and evolution only stop
  # at the caps above (item.c: handleFood; evl/evl.c: EVL_clampBaseStats), so a +1000 HP chip gives 999.
  stat_gain_max: 999
  # tickUnhappinessMechanics: a falling stat never goes below 1.
  stat_min: 1
start:
  # initializePartner, initializeReincarnatedPartner: discipline and happiness start at 50.
  discipline: 50
  happiness: 50
hunger:
  # setFoodTimer: a Baby (level 1) gets hungry every 2 hours (HOUR / 2 * 2 + 2).
  baby_interval_hours: 2
  # setFoodTimer: an In-Training (level 2) every 3 hours (HOUR / 3 * 3 + 3).
  in_training_interval_hours: 3
  # tickHungerMechanics: the window starts with starvationTimer = 180 and drops 1 every 10 frames: 1800 frames,
  # an hour and a half.
  window_minutes: 90
  window_step_frames: 10
  # tickHungerMechanics: with energy at 0, weight drops 1 every 200 frames.
  starving_weight_loss_minutes: 10
  # tickTirednessMechanics: with tiredness at 50 or more, a counter rises every frame; tickHungerMechanics: with it at 50
  # or more, every hour the food arrives 3 minutes earlier.
  tired_hunger_tiredness: 50
  tired_hunger_frames: 50
  tired_hunger_minutes: 3
  # partnerHandleFoodFeed: eating while hungry and reaching the energy threshold: happiness +5, discipline +1.
  fed_happiness: 5
  fed_discipline: 1
  # partnerHandleFoodFeed: eating while not hungry: happiness -3, discipline -2.
  overfed_happiness: -3
  overfed_discipline: -2
  # item.c: handleFood: the favorite food gives energy × 14 / 10 and +2 happiness.
  favorite_energy_percent: 140
  favorite_happiness: 2
refusal:
  # partnerWillRefuseItem: refuses if randomLimit(100) < 110 - (discipline + 10 + randomLimit(10)).
  discipline_base: 110
  discipline_bonus_min: 10
  discipline_bonus_range: 10
  # partnerWillRefuseItem: when not hungry it refuses its favorite food if randomLimit(10) < 2.
  favorite_refusal_percent: 20
sleep:
  # tickSleepMechanics: every minute (CURRENT_FRAME % 20) the sleep counter adds tiredness × 3 / 10.
  tiredness_percent_per_minute: 30
  # tickSleepMechanics: with the counter at 180 or more, every 200 frames 10 minutes of wakefulness are removed
  # (timeAwakeToday counts in blocks of 10 minutes) and the counter goes back to 0.
  tiredness_threshold: 180
  awake_cut_minutes: 10
  # setSleepTimes: a Baby sleeps 3 hours after the current hour and an In-Training 7, plus randomLimit(1).
  baby_awake_hours: 3
  in_training_awake_hours: 7
  young_awake_variation_hours: 1
  # partner_impl.c: SLEEP_PATTERN, the sleep schedules (a table in the code, not on the disc); RAISE_DATA picks one
  # per species (sleep_cycle). Babies and In-Training only use their asleep hours.
  patterns:
    - { sleepy_hour: 16, sleepy_minute: 0, wake_hour: 1, wake_minute: 0, awake_hours: 15, asleep_hours: 9 }
    - { sleepy_hour: 19, sleepy_minute: 0, wake_hour: 4, wake_minute: 0, awake_hours: 15, asleep_hours: 9 }
    - { sleepy_hour: 22, sleepy_minute: 0, wake_hour: 7, wake_minute: 0, awake_hours: 15, asleep_hours: 9 }
    - { sleepy_hour: 2, sleepy_minute: 0, wake_hour: 11, wake_minute: 0, awake_hours: 15, asleep_hours: 9 }
    - { sleepy_hour: 7, sleepy_minute: 0, wake_hour: 16, wake_minute: 0, awake_hours: 15, asleep_hours: 9 }
    - { sleepy_hour: 10, sleepy_minute: 0, wake_hour: 19, wake_minute: 0, awake_hours: 15, asleep_hours: 9 }
    - { sleepy_hour: 0, sleepy_minute: 0, wake_hour: 0, wake_minute: 0, awake_hours: 4, asleep_hours: 1 }
    - { sleepy_hour: 0, sleepy_minute: 0, wake_hour: 0, wake_minute: 0, awake_hours: 8, asleep_hours: 3 }
  # tickSleepMechanics: when sleepy and not in bed, happiness and discipline drop -1/-1 every 200 frames (Baby),
  # -1/-1 every 300 (In-Training) and -2/-4 every 1200 (the rest).
  baby_sleepy_penalty: { every_frames: 200, happiness: -1, discipline: -1 }
  in_training_sleepy_penalty: { every_frames: 300, happiness: -1, discipline: -1 }
  adult_sleepy_penalty: { every_frames: 1200, happiness: -2, discipline: -4 }
  # tickSleepMechanics: reaching wake-up time without sleeping: addTamerLevel(1, -1).
  missed_sleep_tamer_level_percent: 1
  # sleepRegen: HP and MP rise fraction × max × (70 + randomLimit(10)) / 100; tiredness drops fraction × tiredness
  # × (80 + randomLimit(20)) / 100; weight drops default weight / 10.
  regeneration:
    hp_mp_percent: 70
    hp_mp_percent_range: 10
    tiredness_percent: 80
    tiredness_percent_range: 20
    weight_divisor: 10
    # sleepRegen: the pillow (getItemCount(0x22)) and a zone it likes give × 12 / 10; one it does not, × 8 / 10.
    pillow_percent: 120
    liked_area_percent: 120
    disliked_area_percent: 80
  # handleSleeping: sleeping while sick: happiness -20, discipline -10, tiredness +10; injured: -10, -5, +5.
  sick_penalty: { happiness: -20, discipline: -10, tiredness: 10 }
  injured_penalty: { happiness: -10, discipline: -5, tiredness: 5 }
  # handleSleeping: falling asleep hungry drops weight by 1 (see the quirk sleeping_hungry_keeps_weight).
  hungry_weight_loss: 1
  # partnerTickSleep: fadeToBlack(40), sleep when FADE_OUT_CURRENT passes 39; fadeFromBlack(40), and control
  # returns (with the special evolution on waking) when FADE_IN_CURRENT passes 34. In original frames.
  fade: { out_frames: 40, in_frames: 40, control_frame: 35 }
  # partnerTickSleep: with the partner next to the player, the player does animation 8 and the partner 0; when the
  # player's ends the partner does 11 (yawns) and then 9 (lies down), and the fade to black starts 5 frames
  # before the end of 9. When the fade comes back the partner wakes up standing (animation 0).
  scene: { player_clip: 8, partner_idle_clip: 0, partner_yawn_clip: 11, partner_lie_down_clip: 9, fade_lead_frames: 5 }
toilet:
  # tickPoopingMechanic: the potty timer (poopLevel) drops 1 every 200 frames.
  poop_step_minutes: 10
  # tickPoopingMechanic: when it needs to go, the margin is (discipline + 20) × 1200 / 100 frames.
  urge_discipline_offset: 20
  urge_frames_per_hundred: 1200
  # handleToilet: happiness +2, discipline +2.
  toilet_happiness: 2
  toilet_discipline: 2
  # handleWildPoop: a care mistake, happiness -10, discipline -5; partner.c: tickWildPoop: addTamerLevel(1, -1).
  wild_happiness: -10
  wild_discipline: -5
  wild_tamer_level_percent: 1
  # handlePoopWeightLoss: weight drops (randomLimit(4) + poop size) / 4.
  weight_loss_roll: 4
  weight_loss_divisor: 4
  # createPoopPile: the virus bar rises 1 per poop outside the toilet, except on Sukamon (0x27); tickConditions: with 16
  # the partner turns into Sukamon.
  virus_bar_limit: 16
  virus_form: "scum"
  # tickPoopDetection: Numemon (0xb) and Sukamon (0x27) eat nearby poop.
  poop_eaters: ["nume", "scum"]
  # handleEatingPoop: depending on size, HP + max / divisor, MP + max / divisor, weight and chance of being cured.
  eating:
    - { below_size: 11, hp_divisor: 20, mp_divisor: 50, weight: 1, cure_percent: 2 }
    - { below_size: 14, hp_divisor: 10, mp_divisor: 20, weight: 3, cure_percent: 7 }
  eating_largest: { hp_divisor: 2, mp_divisor: 10, weight: 10, cure_percent: 20 }
  # createPoopPile: up to 16 poops per map and 100 in total; with the map full, the next one on the map is reused.
  piles_per_map: 16
  piles_total: 100
sickness:
  # tickSicknessMechanics: with 10 or more hours without sleep, every hour a roll is made with (tries - 10) × 5 + (tiredness - 50).
  missed_sleep_hours: 10
  tries_offset: 10
  tries_percent: 5
  tiredness_offset: 50
  # tickSicknessMechanics: more than 12000 frames (10 hours) in a zone it does not like.
  disliked_area_hours: 10
  # tickSicknessMechanics: a 12-hour injury turns into sickness.
  injury_hours: 12
  # tickSicknessMechanics: 12 hours of untreated sickness take away a life.
  untreated_hours: 12
  # tickSicknessMechanics: when getting sick from lack of sleep, happiness -20.
  on_sick_happiness: -20
  # tickSicknessMechanics: every hour sick, happiness -10, discipline -5, tiredness +5.
  hourly_penalty: { happiness: -10, discipline: -5, tiredness: 5 }
mood:
  # handlePraiseScold: scolding gives discipline +2 and happiness -10.
  scold_discipline: 2
  scold_happiness: -10
  # handlePraiseScold: scolding right after a refusal or poop on the floor gives discipline +8; the happiness change
  # is left uninitialized in the original and here it is 0 (assumption, see the evolution sheet).
  boosted_scold_discipline: 8
  boosted_scold_happiness: 0
  # handlePraiseScold: praising gives discipline -5 and happiness discipline / 10 + 2.
  praise_discipline: -5
  praise_happiness: 2
  praise_discipline_divisor: 10
  # tickUnhappinessMechanics: with no other need and negative happiness, every 200 frames it gets angry if
  # randomLimit(100) < |happiness| - discipline.
  sulk_check_frames: 200
  # tickUnhappinessMechanics: angry, happiness rises 1 every 15 frames and every 300 the stats lose 2 %.
  sulk_recovery_frames: 15
  sulk_stat_loss_frames: 300
  sulk_stat_loss_percent: 2
  # tickTirednessMechanics: every hour on the map (areaEffectTimer % 1200), +1 happiness and -2 tiredness in a zone
  # it likes; -1 and +1 in one it does not.
  area_effect_frames: 1200
  liked_area: { happiness: 1, tiredness: -2 }
  disliked_area: { happiness: -1, tiredness: 1 }
  # tickConditions: the zone counter goes back to 0 after passing 28800 frames (one day).
  area_timer_limit_frames: 28800
tiredness:
  # tickTirednessMechanics: with 80 or more it is tired and loses 2 happiness every 100 frames.
  tired_threshold: 80
  tired_happiness: -2
  tired_happiness_frames: 100
  # tickTirednessMechanics: subTiredness adds 1 tiredness on reaching 60. Nothing raises it in the original: it is a
  # dead counter kept for a ruleset that uses it.
  sub_tiredness_threshold: 60
year:
  # clock.c: tickGameClock: on year change, with happiness 100 addTamerLevel(5, 1); with negative happiness
  # addTamerLevel(10, -1).
  happy_happiness: 100
  happy_tamer_level_percent: 5
  unhappy_tamer_level_percent: 10
# The rules that are logic and not numbers (docs/architecture/rulesets.md, "Strategies").
strategies:
  # What counts as a care mistake: original = the hunger window closed without reaching the energy threshold, the
  # wake-up time without having slept and the poop on the floor.
  care_mistakes: original
  # The sickness roll for not sleeping (tickSicknessMechanics).
  sickness_roll: original
  # Whether it refuses an item or a food (partnerWillRefuseItem).
  item_refusal: original
# Quirks of the original (docs/reference/care.md, "Quirks"). true reproduces the original; another ruleset turns them off.
quirks:
  # handleSleeping removes hunger (condition &= ~4) before checking it to lower weight, so falling asleep hungry
  # never lowers weight.
  sleeping_hungry_keeps_weight: true
  # handleSleeping adds the default sleep hours (hoursAsleepDefault) to the evolution counter, even if it slept
  # less.
  sleep_adds_default_hours_to_evolution: true
  # tickSicknessMechanics stores the probability in a uint8_t: a negative one wraps around and the roll always hits.
  sickness_chance_wraps: true
  # setSleepTimes rolls randomLimit(1), which always gives 0: the baby's schedule does not vary.
  young_sleep_without_variation: true
  # tamer.c: advanceBattleTime: a battle that crosses midnight adds no age, and the hour it crosses adds no
  # evolution.
  battle_midnight_skips_age: true
  # partner_impl.c: handleToilet and handleWildPoop: only in the American version the next warning takes twice as long
  # (poopTimer + poopTimer).
  toilet_doubles_poop_interval: true
  # item.c: handleFood always calls setTrainingBoost: a food with no training bonus erases the one there was.
  food_clears_training_boost: true
  # TRN_advanceTrainingTime and skipHours count the hunger window error when skipping hours without closing it; on
  # return, tickHungerMechanics closes it and counts it again.
  skipped_hunger_window_counts_twice: true
  # tamer.c: advanceBattleTime and skipHours add to sicknessTries, not to the sickness hours, every hour sick.
  skipped_hours_add_sickness_tries: true
  # skipHours checks (HOUR + hours % 4) == 0 and not whether the skipped hours cross a multiple of 4: it only subtracts life for
  # unhappiness at midnight and in groups of 4 hours. false: it subtracts once per multiple of 4 hours crossed,
  # as if those hours were played.
  skipped_hours_unhappiness_only_at_midnight: true
  # partner_impl.c: setFoodTimer (American version) looks for the next food starting from the last one it set
  # (nextHungerHour, an hour without a day) when the current hour has not passed it. handleSleeping calls it on waking with
  # the one from before sleeping: if it wakes before that hour, it skips that food and the earlier ones. A partner that
  # falls asleep at 16 with the 18 food pending and wakes at 1 is not hungry until 22 or 23.
  # false: on waking it searches from the wake-up hour, like the Japanese version.
  wake_searches_from_last_meal: true
