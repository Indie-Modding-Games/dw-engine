# The game clock (docs/reference/care.md, "El reloj"). The original counts time in frames of its loop, and
# the care rules run every so many frames, so the clock keeps that unit.
# main.c: gameLoop waits three retraces per frame (VSync(3)): about 20 frames per second in NTSC
# (docs/reference/field.md, "Ritmo").
frames_per_second: 20
# clock.c: tickGameClock adds a minute every 20 frames (CURRENT_FRAME % 20): 1200 are an hour and 28 800 a day.
frames_per_minute: 20
# clock.c: tickGameClock: the day goes back to 0 and the year goes up on reaching 30 days.
days_per_year: 30
# clock.c: tickGameClock: the year goes back to 0 on reaching 100.
year_limit: 100
# clock.c: initializeClockData: a new game starts at year 0, day 0, at 8:00 (CURRENT_FRAME = 9600).
start:
  year: 0
  day: 0
  hour: 8
  minute: 0
