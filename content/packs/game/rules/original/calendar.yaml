# The calendar (packages/session: CalendarAdapter; packages/game/story: new_day.hpp).
# script_common.c: dailyPStatTrigger, at every midnight, when sleeping or training past it, when a script changes the
# day and once when starting a game (script_interp.c: initializeScripts).
new_day:
  # Variables 0x1c to 0x1f count the days: they go up one per day unless they are 0xff (stopped).
  day_counters: [28, 29, 30, 31]
  stopped_value: 255
  # Variable 2 loses its high bit every day (a "once a day" mark), unless it is 0xff.
  daily_marks:
    - variable: 2
      cleared_bits: 128
