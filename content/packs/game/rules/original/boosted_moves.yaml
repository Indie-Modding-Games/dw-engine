# Boosted techniques (docs/modules/game/battle.md, «Boosted techniques»): the one technique each species is better at
# as a partner. Only a partner that knows it fights with it boosted, and only while the gameplay option is on; enemies
# never do. Each pick is a technique the species can learn in the original (the species table's moves), of its own
# element or theme and never its finisher. Not in the original: Classic Enhanced turns the option off.
# The power is rounded down, the MP cost rounded up and never 0 when the technique costs MP.
power_percent: 125
mp_cost_percent: 75
