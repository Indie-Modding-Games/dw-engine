# The story's text boxes (packages/game/story: Dialogue, packages/session: StoryDialogue).
# A box that comes out of the speaker grows for 5 frames before it responds to the player
# (ui.c: renderUIBoxAnimated moves to the open state when its frame goes past 4).
open_frames: 5
# With this trigger set a selection cannot be canceled (script_textbox.c: tickSelectionDialogue, 0x31).
no_cancel_trigger: 49
# The dialogue box: 21 characters per row and 4 rows, the first with the speaker's name
# (script_textbox.c: setupDialogueBox, registerTextbox).
speech_box:
  columns: 21
  rows: 4
# The box sounds: slot and sound (sound.c: playSound; ui.c: createAnimatedUIBox;
# script_textbox.c: tickConfirmDialogue, tickSelectionDialogue, tickCustomSizedTextbox).
sounds:
  open: {slot: 0, sound: 0}
  advance: {slot: 0, sound: 3}
  cancel: {slot: 0, sound: 4}
  cursor: {slot: 0, sound: 2}
  refused: {slot: 0, sound: 11}
# The color of the speaker's name (script_textbox.c: showTextbox).
name_colors:
  player: 6
  partner: 10
  character: 7
  special: 5
