# The difficulty the player picks in the options (Improvement, normal by default; docs/modules/apps/game.md,
# "Difficulty"). Normal is the original: it changes nothing. Each other level changes values of this ruleset's other
# sections while playing on it; apps/game (RuleOptions) applies it with the same changes as the tuning panel.
# Each change names the section and the value's path (like the panel: "hunger.window_minutes") and gives either the new value
# (`value`, a YAML text) or a percentage of the value the ruleset has (`percent`, only for an integer,
# rounded down). A mod tunes difficulty with its own difficulty section.
levels:
  easy:
    # Combat (also in cups): the partner deals 50 % more damage and takes half, hits, finishers and blocks.
    - { section: battle, path: damage.partner_dealt_percent, percent: 150 }
    - { section: battle, path: damage.partner_taken_percent, percent: 50 }
    # Training: each session's gains, 50 % more.
    - { section: training, path: gain_percent, percent: 150 }
    # Care: twice the time to feed it before the care mistake, and half of the part of the
    # illness probability that grows with the number of times it could have fallen ill.
    - { section: care, path: hunger.window_minutes, percent: 200 }
    - { section: care, path: sickness.tries_percent, percent: 50 }
