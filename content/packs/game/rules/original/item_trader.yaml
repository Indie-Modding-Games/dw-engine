# The item trade that opens the story (script_interp.c: CALL_ROUTINE 2 -> shop/script_menu.c:
# openMojyamonShop; packages/session: ItemTrader): the player gives an item from the bag for the merchant's.

# showMapHeadTextbox(..., 0x4d6): the merchant's phrases are this MAPHEAD section.
lines_section: 1238
# The number of each phrase within the section (resolveMapHeadEntry): the greeting (state 0), "what do you give me?"
# (state 3), the goodbye with no trade (state 6), "do you really give me ...?" (tickMojyaTradeMenu), the yes or no
# (state 4), the thanks and the full bag (state 5).
lines:
  greeting: 8
  ask: 9
  farewell: 10
  confirm: 11
  choices: 12
  thanks: 13
  bag_full: 14
# The script puts the trade table in variable 249; the merchant writes 255 there on opening and then the
# item the player offers.
table_variable: 249
no_item: 255
# setMojyaItemTradedTrigger: trade i (counted across all the tables) sets trigger 5 + i; with all nine
# set it also sets 14.
first_traded_trigger: 5
all_traded_trigger: 14
# tickSelectionDialogue: with trigger 0x31 set, canceling does not answer the yes or no.
choice_lock_trigger: 49
# tickMojyaTradeMenu: playSound(0, 0xb) if the player does not have the item.
refuse_sound: {slot: 0, sound: 11}
# MOJYAMON_ITEMS_GIVE and MOJYAMON_ITEMS_GET: three tables of three trades, what it takes and what it gives.
tables:
  - - {give: digimushrm, get: med_recovery}
    - {give: supercarrot, get: omnipotent}
    - {give: happymushrm, get: hair_grower}
  - - {give: giant_meat, get: auto_pilot}
    - {give: black_trout, get: restore}
    - {give: hispeed_dsk, get: medicine}
  - - {give: omnipotent, get: s_off_disk}
    - {give: med_recovery, get: s_def_disk}
    - {give: digianchovy, get: s_speed_disk}
