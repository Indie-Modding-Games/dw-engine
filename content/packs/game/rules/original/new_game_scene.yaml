# The new-game scene before the first map (apps/game: NewGameInterview): Jijimon asks questions on a black background,
# the answers choose the partner and the player types their name and the partner's (main.c: newGameScene,
# shop/script_menu.c: newGameStateMachine). Without this section a new game starts with no questions.
# The MAPHEAD phrase table with the scene's lines (resolveMapHeadEntry(0x4D6, i), entries 0x10 to 0x20).
lines: 1238
# The partner each answer chooses, by its number (main.c: main: readPStat(0xFE) 0 -> 3, otherwise -> 0x11).
partners: [agum, gabu]
# Fade at the start and at the end, in scene frames (fadeFromBlack(0x14), fadeToBlack(0x28)).
fade_in_frames: 20
fade_out_frames: 40
# Engine ticks per scene frame: its loop waits VSync(3) (main.c: newGameScene).
frame_ticks: 3
# The camera looks at the origin from the front, at 0x1068 (new_game.c: loadNewGameScene: GsSetRefView2, vpz -0x1068), with the
# original's projection distance (GsSetProjection(0x3E8)) over its 240-line screen, and the projection
# center on this line (DRAWING_OFFSET_Y = 0xB9).
camera_distance: 4200
camera_projection: 1000
camera_centre_line: 185
# Jijimon (model 0x75) at (0x320, 0x96, 0) in the original's axes, with animation 2 (he walks in from the
# right); on frame 0x23 he turns toward the player (0x400 -> 0x71, in 4096ths of a turn) and switches to 0
# (tickNewGameJijimon); then the questions begin.
host:
  species: jiji
  position: [800, 150, 0]
  clip: 2
  turn_frame: 35
  turned_clip: 0
  yaw: 1024
  turned_yaw: 113
# The sounds of the scene and of the name box (sound.c: playSound, bank 0): the cursor, a confirmation (a
# page, a choice, a letter, delete) and a rejected press (canceling a choice with trigger 49
# set, an empty name, a space as the first letter). The scene plays no music (main.c: newGameScene).
sounds:
  cursor: {slot: 0, sound: 2}
  confirm: {slot: 0, sound: 3}
  refused: {slot: 0, sound: 11}
# The name box (setupNameSelectorBox, tickNamingBox): 6 letters at most, 5 columns; the first half of the
# rows is the left side of the grid and the second the right (NAMING_CHAR_PAGES of the American version). A
# space is an empty cell.
naming:
  length: 6
  columns: 5
  # American version quirk (namingDeleteLast): with a full name, delete removes two letters.
  full_delete_takes_two: true
  # A held direction key repeats at 6 frames and then every 2 (script_common.c, setInputRepeatMask).
  repeat_delay_frames: 6
  repeat_frames: 2
  rows:
    - "ABCDE"
    - "FGHIJ"
    - "KLMNO"
    - "PQRST"
    - "UVWXY"
    - "Z    "
    - "     "
    - "     "
    - "     "
    - "abcde"
    - "fghij"
    - "klmno"
    - "pqrst"
    - "uvwxy"
    - "z    "
    - "01234"
    - "56789"
    - "     "
