# Partner evolution (docs/reference/evolution.md). Hours are those of the evolution counter (evoTimer), which
# goes up by one per hour of play. Forms are ids from the Digimon table (data/digimon); items, from data/items.
# The requirement, path and gain tables are the ones the manifest names (tables: evolution).

# Strategies (docs/architecture/rulesets.md): how the target is picked and how a candidate is scored.
selection: original
scoring: original

# partner_impl.c: tickConditions: counter hours from which evolution is checked, per level. Level 5
# (Ultimate) does not evolve naturally.
check_hours:
  baby: 6
  in_training: 24
  rookie: 72
  champion: 144

# evolution.c: getFreshEvolutionTarget: the target of each baby is written in the code, ignoring care.
baby_targets:
  bota: koro
  puni: tuno
  poyo: toko
  yura: tane

# evolution.c: calculateRequirementScore.
requirements:
  # A target passes with 3 points or more (out of 4, plus the one for the preference for new forms).
  pass_points: 3
  # Weight scores if it is within this distance of the requested one.
  weight_margin: 5
  # HP and MP are compared divided by 10, here and in the average of getRookieEvolutionTarget.
  hp_mp_divisor: 10
  # evolution.c: getNumMasteredMoves: the moves requirement counts the bits of the two 32-bit words of
  # learnedMoves, so only learned moves with an index below 64.
  mastered_moves_below: 64

# evolution.c: getRookieEvolutionTarget: a Rookie with no candidate and the counter at 96 hours or more becomes Numemon.
fallback:
  rookie_hours: 96
  rookie_target: nume

# evolution.c: handleSpecialEvolutions. A single randomLimit(100) roll per call, shared by all the
# rules; they are checked in order and the last one that holds wins. `require` compares with `equals` or `at_least`.
specials:
  roll_limit: 100
  # partner.c: partnerTickSleep: on waking up (mode 2).
  wake_up:
    - target: aird
      roll_below: 30
      from: [bird, sead]
      require:
        discipline: { equals: 100 }
        happiness: { equals: 100 }
        tiredness: { equals: 0 }
    - target: igam
      roll_below: 30
      from: [vegi]
      require:
        battles: { at_least: 50 }
        discipline: { equals: 100 }
    - target: mono
      roll_below: 30
      from: [dori]
      require:
        defense: { at_least: 500 }
        discipline: { equals: 100 }
    # CURRENT_SCREEN == 1: the map mayo02, by its id in data/maps.
    - target: kune
      roll_below: 50
      from: [koro, toko, tuno, tane]
      require:
        map: { equals: mayo02 }
  # partner.c: partnerTickPraiseScold: after praising or scolding (mode 3).
  praise_scold:
    - target: sira
      roll_below: 30
      from: [hoee, shel]
      require:
        level: { equals: 4 }
        evolution_timer: { equals: 200 }
    # partner_impl.c: handlePraiseScold: scolding a Rookie with discipline 0 and happiness -100 triggers NANIMON_TRIGGER.
    - target: nani
      scolded: true
      require:
        level: { equals: 3 }
        discipline_before: { equals: 0 }
        happiness_before: { equals: -100 }
    - target: veda
      roll_below: 50
      require:
        level: { equals: 4 }
        evolution_timer: { at_least: 240 }
  # partner_impl.c: tickConditions: a Champion with the counter at exactly 360 hours tries the praise/scold rules.
  praise_scold_on_timer:
    level: 4
    hours: 360

# item.c: handleEvoItems.
items:
  # Three items lead to a fixed form regardless of level.
  fixed:
    giga_hand: ggdr
    noble_mane: panj
    metalbanana: mtet
  # Those in the EVOLUTION_ITEM_TARGET table only work if the target is exactly one level above.
  level_step: 1

# evl.c: EVL_applyEvolution and EVL_scaleBaseStats. The caps of EVL_clampBaseStats are the partner's (care.yaml,
# limits): evolution gives the change uncapped and the partner adds it with its caps.
stat_gains:
  # A stat that already reaches the reference one adds a tenth of it; otherwise it becomes the average of the two.
  gain_divisor: 10
  # In the scaling cases, each stat is multiplied by the intelligence field of the row, in tenths.
  scale_divisor: 10
  # Targets that scale instead of gaining: Devimon, Numemon, Sukamon and Nanimon (0x06, 0x0b, 0x27 and 0x35).
  scaled_targets: [devi, nume, scum, nani]
  # Targets of a level below this one also scale (Fresh and In-Training).
  scaled_below_level: 3
  # On reaching Ultimate without an item, the remaining lifetime goes up by 96 hours.
  ultimate_lifetime_hours: 96
  # addTamerLevel(20, 1) on reaching Champion and addTamerLevel(100, 1) on Ultimate, with IS_SCRIPT_PAUSED.
  champion_tamer_level_chance: 20
  ultimate_tamer_level_chance: 100

# evl.c: EVL_applyEvolution: the new form learns the weakest move of its first specialty.
moves:
  # First move of each specialty's block, from 0 to 6 (special[0] of the Digimon table).
  specialty_blocks: [0, 40, 8, 32, 16, 24, 49]
  # Each block holds 9 moves: from the first to the first + 8.
  block_size: 9
  # Below this level the first equipped slot is the first of the list (the basic attack).
  basic_slot_below_level: 3
  # The fourth slot is the last move of the list with an index from 0x3a up to before 0x71.
  finisher_first: 58
  finisher_end: 113

# dooa.c: REINCARNATE_BABY_TYPE, with the egg picked at random (rand() % 4); evolution.c: reincarnatePartner.
rebirth:
  babies: [bota, puni, poyo, yura]

# The evolution scene in the field, in frames of the original (main/evl.c: tickEvoSequenceLoading; evl.c:
# EVL_tickEvoSequence, EVL_updateEvoCamera). Without this section the partner swaps model instantly.
scene:
  # loadMapSounds2(18): the scene's sound bank in slot 8, until the map's one comes back.
  sound_bank: 18
  # tickEvoSequenceLoading: two waits (timer > 55), the first with the idle animation and the second with ready.
  wait_frames: 56
  # State 0: the map dims; when it ends the map and the other characters are hidden.
  dim_frames: 32
  # EVL_updateEvoCamera: the camera aims at the partner until frame 64 and moves closer until 96; then it orbits.
  camera_aim_end: 64
  camera_move_end: 96
  # State 2 (0x6a): the burst_sounds of slot 8 and the burst animation, followed by ready.
  burst_frame: 106
  # The camera orbit speeds up again (0xa4-0xc2) and the partner grows to the size of its new form
  # (0xcc-0x108).
  orbit_ease: { from: 164, to: 194 }
  grow: { from: 204, to: 264 }
  # 0xd6: the roar_sound sound; 0x11c: the new form (EVL_applyEvolution); 0x162: the map and the camera come back.
  roar_frame: 214
  swap_frame: 284
  end_frame: 354
  burst_sounds: [1, 0]
  roar_sound: 5
  # EVL_calculateCameraVectors: distance max(radius, height) * 5 + 1200, rise 400 + 2 * height; start angle
  # 0x638 and 0x16 per frame (4096 = one turn); projection up to 1000 and the image drops up to 20 pixels with
  # height (up to 200).
  camera:
    start_angle: 1592
    angle_step: 22
    distance_per_size: 5
    distance: 1200
    rise: 400
    focal_length: 1000
    max_drop: 20
    drop_height: 200
  # The partner's animations by their original id: idle, ready, the burst and the finish (0xb).
  clips: { idle: 0, ready: 1, burst: 12, finish: 11 }

# Quirks of the original (docs/reference/evolution.md, "Rarezas"). true reproduces the original; another ruleset turns them off.
quirks:
  # item.c: handleEvoItems sets HAS_USED_EVOITEM, which only goes back to 0 when the game starts: the following
  # natural evolutions of the session get no stat gains or lifetime bonus.
  evolution_item_sticks: true
  # evolution.c: getRookieEvolutionTarget and getChampionEvolutionTarget only reset the stat sum and count
  # when a candidate becomes the best; otherwise they carry over into the next one's average.
  selection_average_carries_over: true
  # evolution.c: getFreshEvolutionTarget sets the counter to 0 also for a baby that is not in its list (and returns
  # an uninitialized value, which here is "no target"). Decided by the design lead (2026-10-20): faithful to the
  # original.
  unlisted_baby_restarts_timer: true
  # evolution.c: calculateRequirementScore: with tied stats, the highest is the last in the order HP, MP, attack,
  # defense, speed, intelligence.
  rookie_stat_tie_picks_last: true
  # partner_impl.c: tickConditions: with the counter at exactly 360 hours, the result of the specials replaces the
  # Champion's normal evolution one, also when it finds none. Decided by the design lead
  # (2026-10-20): faithful to the original.
  timer_special_overrides_normal: true
