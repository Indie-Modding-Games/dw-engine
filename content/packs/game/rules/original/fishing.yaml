# Fishing (packages/game/fishing: rules.hpp, fishing.hpp; packages/session: FishingAdapter). fish.c is the FISH overlay; main/fish.c,
# the part that lives in the executable. The tables (the fish classes, the bite table, what gets hooked, the zones, the
# shore and the maps) are data/fishing, which dwx extracts from the disc; here go the rules of its logic.

# FISH_findFishToBite: the sea serpent bites at any bait, 20 % every 8 frames. FISH_tickFishPopulation
# checks every 20 frames whether it is its time (seadramon_times / 100 of data/fishing). Once on land, triggerSeadramonCutscene
# calls section 0x4e4 (1252) of the map header script: the scene of the lake guardian.
sea_serpent: {bite_chance: 20, bite_every: 8, check_every: 20, scene_section: 1252}

# FISH_findFishToBite: every 20 frames a fish at 200 or less from the bobber bites, with its class's percentage for the
# bait (data/fishing: bite_chances). FISH_tickFish: the fish attracted by the bait swims toward the bobber from less than 600.
bites: {every: 20, reach: 200, attract_reach: 600}

# FISH_tickFishPopulation and FISH_allocFish: 33 fish at a time; one is born per frame while there are fewer than 32, of the
# class with the fewest fish for the weight of its zone. FISH_spawnFish: each fish lives 600 to 1200 frames. FISH_tickFish:
# a fish that gets scared stops births for 30 frames.
population: {pool: 33, spawn_below: 32, lifetime: [600, 1200], scared_pause: 30}

# FISH_hookFish: a fish under 150 nibbles for 20 to 40 frames and then pulls 30; a bigger one, 40 to 60 and 60.
# Its strength is the size plus 150, up to a maximum of 100 more. FISH_tryStrike: pulling in the first half of the tug hooks it.
hook:
  large_size: 150
  small: {nibble: [20, 40], pull: 30}
  large: {nibble: [40, 60], pull: 60}
  power_bonus: 150
  power_max_bonus: 100

# FISH_beginTension and FISH_updateTension: the tension limit with the old rod and with the good one; what goes up or down
# each frame depending on whether the button is held and whether the fish flees or not, from size 50 to 300 (remapClamped). At -limit
# the fish escapes; at +limit, held 15, 10 or 5 frames depending on the size, the line breaks.
tension:
  limit: {old_rod: 5000, amazing_rod: 10000}
  sizes: [50, 300]
  slack: [-166, -166]
  fish_running: [41, 83]
  held: [71, 125]
  held_running: [166, 500]
  snap_steps: [1, 3]
  snap_frames_per_step: 5

# FISH_tickRod, state 9: with the button held and the bait already eaten, from frame 31 and every 20, a roll of
# customRandom(1, 10000) lower than 1001 hooks something; customRandom(0, 99) picks what in data/fishing: bait_chances.
junk: {after: 31, every: 20, chance: 1000, roll: 10000, pick: 99}

# FISH_tickRod, release: the cast strength is the frames with the button plus 5 (20 with the camera button),
# from 0 to 20, and gives a speed of 100 to 200 with the old rod or 400 with the good one.
cast:
  power_bonus: 5
  power_max: 20
  speed: {min: 100, old_rod: 200, amazing_rod: 400}

# FISH_isFishableWater2, the shore water test that walks along y: nothing from x 429 and everything above y 6.
shore_by_y: {right_limit: 429, open_above: 6}

# The slot 8 sounds (playSound(8, n)): cast, the bobber hits the water, a nibble, a tug, the fish fights, the
# fish flees with the line, the fish leaves the water, an item, the line breaks or the hook is lost, and the notice.
sounds:
  slot: 8
  cast: 0
  splash: 2
  nibble: 3
  bite: 4
  struggle: 5
  run: 6
  landed: 7
  item: 8
  lost: 9
  notice: 10
