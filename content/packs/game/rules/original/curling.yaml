# The stone minigame (curling) on the frozen lake (packages/game/curling: curling.hpp). kar/kar.c: KAR_start, KAR_setupMatch,
# KAR_tickStones, KAR_tickMatchState, KAR_tickScoreTally and KAR_finishMatch. The rink (walls, diagonals, lines)
# is in the code; the game rules go here.

# Script values: the opponent (pstat 0x7A: 0 the first, 1 the second; its entity is that number + 2) and the result
# (pstat 0x79: 2 perfect win, 1 win, 0 loss).
story: {opponent_variable: 122, result_variable: 121}

# KAR_setupMatch: each stone's type comes from this table with rand() % 10 (3 has studs, 0 to 2 are of a different
# weight) and its weight, from the per-type table.
stone_types: [3, 2, 2, 1, 1, 1, 0, 0, 0, 0]
weights: [30, 25, 35, 30]

# KAR_tickStones: each frame the stone advances its speed divided by its weight and the speed drops to 98/100; with an
# advance of less than 2 it stops.
friction: [98, 100]
min_move: 2

# KAR_tickMatchState (state 8): the power goes up by 100 per frame; on reaching 3000 it goes back to 0 and aiming starts again.
# State 9: the stone is thrown with the power plus 600.
power: {step: 100, limit: 3000, throw_bonus: 600}

# KAR_computeThrowPower: the opponent subtracts this from the computed power (the first 600, the second 500).
opponent_power_offsets: [600, 500]

# KAR_classifyStoneRings and KAR_tickScoreTally: the target's rings (center x, z, radius) and their points; a stone
# counts in the first one that contains it. Only stones past the line count (z < -1380).
# objects: the map objects that light up the ring while a stone passes through it or scores in it
# (KAR_updateRingMarkers; hidden the rest of the time).
rings:
  - {x: 0, z: -1718, radius: 145, points: 2, objects: [25]}
  - {x: 0, z: -1718, radius: 375, points: 1, objects: [19, 20, 21, 22]}
  - {x: 400, z: -2318, radius: 205, points: -2, objects: [16, 17, 18]}
  - {x: -400, z: -2318, radius: 205, points: 2, objects: [13, 14, 15]}

# KAR_finishMatch: with more points than the opponent you win; with at least 10, a perfect win.
perfect_score: 10
