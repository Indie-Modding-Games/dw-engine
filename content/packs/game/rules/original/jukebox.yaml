# The jukebox that opens the story (script_interp.c: CALL_ROUTINE 9 -> shop/script_menu.c: openJukebox,
# jukeboxFillTitleList, createJukeboxMenu, tickJukeboxMenu; packages/session: Jukebox).

# showMapHeadTextbox(..., 0x4d6): what the owner says are lines of section 0x4d6 of MAPHEAD. Before the list,
# line 3 («Why don't you request a number that will make me hot?»); over the list, 0 («Which one do you want?»);
# on choosing, 2 («{bgm:pstat=249}, right?»); on leaving, 1 («Help me on my next request.»).
lines_section: 1238
lines:
  greeting: 3
  ask: 0
  chosen: 2
  farewell: 1
# jukeboxFillTitleList: song 62 (Last Battle Theme) does not appear in the list until trigger 50 is set.
unlock_trigger: 50
locked_tracks: [62]
# The song that plays goes to variable 249 (writePStat(0xf9)); 255 is none.
chosen_variable: 249
no_track: 255
