# The city (packages/session: CityAdapter; packages/game/story: prosperity.hpp).
# main.c: recalculatePPandArena redoes the prosperity points (variable 1) from the recruitment triggers
# when the game loop starts (new game or load) and before each save; the scripts raise them
# on recruiting and read the variable and the triggers to make the city grow.
prosperity:
  points_variable: 1
  # Species n (from 3 to 0x3a) counts if trigger 200 + n is set and its level is 3 (Rookie) or more.
  recruit_trigger: 200
  first_species: 3
  end_species: 59
  min_level: 3
  # Adds its level minus 2; Numemon, Sukamon and Nanimon (11, 39, 53) add 1.
  level_offset: 2
  one_point_species: [11, 39, 53]
  # With no cup entered (variable 3 from 0x17 on) the entry triggers 0x25 to 0x27 are cleared.
  cup_variable: 3
  no_cup_from: 23
  registration_triggers: [37, 38, 39]
# map.c: getFileCityTopMap: the File City screen where a saved game continues after the ending, the first
# whose triggers are all set (0xdc and 0xd6 the big city; 0xdd, 0xe1 and 0xf6 its other works).
cleared_map:
  - { triggers: [220, 214, 221, 225], map: 179 }
  - { triggers: [220, 214, 221, 246], map: 178 }
  - { triggers: [220, 214, 221], map: 177 }
  - { triggers: [220, 214, 225], map: 176 }
  - { triggers: [220, 214, 246], map: 175 }
  - { triggers: [220, 214], map: 174 }
  - { triggers: [221, 225], map: 173 }
  - { triggers: [221, 246], map: 172 }
  - { triggers: [221], map: 171 }
  - { triggers: [225], map: 170 }
  - { triggers: [246], map: 169 }
  - { triggers: [], map: 168 }
