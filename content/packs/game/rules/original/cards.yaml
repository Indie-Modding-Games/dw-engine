# The player's cards and the card pack (packages/game/inventory: cards.hpp; session: CardsAdapter).
# script_menu.c: showCardTextbox: a card never goes past 9 copies.
max_copies: 9
# shopFillSellCardList: the card lists go from 1 to 0x40.
listed: {first: 1, last: 64}
# rollCardPack: 3 cards; rollCard: randomLimit(100): 0 is rarity 0, below 5 rarity 1, below 20 rarity 2, below 50 rarity 3, and
# otherwise rarity 4; then a card of that rarity, all equally likely.
pack:
  draws: 3
  rarity_roll: 100
  rarity_below: [1, 5, 20, 50]
# showCardTextbox: the text line of section 0x4d3 of MAPHEAD: new card by rarity (0, 1, and the rest), repeated
# with fewer than 6 copies, or with more.
lines:
  new_by_rarity: [2, 3, 4]
  few_copies: 6
  again: 5
  many: 6
