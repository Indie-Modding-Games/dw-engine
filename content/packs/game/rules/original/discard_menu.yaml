# The menu for choosing an item from the bag that opens the story (script_interp.c: CALL_ROUTINE 0 -> script_common.c:
# openDiscardItem; packages/session: DiscardMenu): to throw one away with a full bag or to hand one over.

# createSingleCardShopMenu: the «Is that OK?» box is line 0 of section 0x4d8 of MAPHEAD.
confirm_section: 1240
confirm_line: 0
# With trigger 3 set the player can leave without choosing; if the bag has nothing to choose, it stays set.
cancel_trigger: 3
# The chosen item goes to variable 254 (writePStat(0xfe)); 255 is none.
chosen_variable: 254
no_item: 255
