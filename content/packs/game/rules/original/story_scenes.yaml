# The story's battles, scenes and routines (packages/session: StoryScenes; script_interp.c:
# scriptInstruction64to7E, partner.c: callDigimonRoutine, map.c: changeMap).
battle:
  # start_battle leaves the result in variable 255: 255 (-1) defeat, 0 escape, 1 victory.
  outcome_variable: 255
  # With variable 250 set, the enemies are those of variables 251 to 253 (255: none).
  predefined_variable: 250
  first_enemy_variable: 251
  enemy_count: 3
  no_enemy: 255
  # A defeat continues in section 0x4DE of the map script (MAPHEAD).
  defeat_section: 1246
  # The counters of started battles and escapes stay at 9999.
  counter_max: 9999
  # With trigger 1 set the fight is fixed: no escaping and the partner does not walk back.
  fixed_fight_trigger: 1
  # After escaping, the map name is not shown (variable 6 = 2).
  show_name_variable: 6
  show_name_never: 2
partner:
  # Routine 2 goes back to the form from before the virus (variable 5); routine 10 evolves to the one in 254.
  virus_backup_variable: 5
  target_variable: 254
routines:
  # Most routines read their operand from variable 254.
  operand_variable: 254
  # The shop tally (routines 30, 31 and 56) goes in and out through variables 243 (high) and 244.
  tally_high_variable: 243
  tally_low_variable: 244
  # Routines 12 and 13 remove 1 or 99 of the item in 254, except 255 (none).
  no_item: 255
  remove_one: 1
  remove_all: 99
  # With trigger 3 the shop is the recycling one and the card shop buys; with 4 it sells cards.
  selling_trigger: 3
  buying_cards_trigger: 4
recruits:
  # A recruit is trigger 200 + its number, for 63 species; the engine saves when one arrives.
  first_trigger: 200
  count: 63
new_game:
  # original: clean state except the partner's raised trigger; the field starts on the `map` screen through the
  # `exit` exit (map.c: initializeMap), its header section (runMapHeadScript(0xCC)) loads script 164 and the pass
  # cell of exit 9 runs the opening (section 0x36: triggers 54, 55 and 75, jump to topn01 and the
  # wake-up scene in Jijimon's house, script 193). seeded: the state of data/new_game_story and the start of field/warps,
  # without the opening.
  chain: original
  map: 204
  exit: 9
# Cases of map.c: changeMap: when entering `to` from `from`, the previous screen is another one.
previous_screen:
  - {from: 207, to: 38, previous: 88, previous_exit: 2}
  - {from: 207, to: 70, previous: 69, previous_exit: 2}
  - {from: 207, to: 79, previous: 17, previous_exit: 1}
  - {from: 207, to: 93, previous: 90, previous_exit: 0}
  - {from: 207, to: 119, previous: 118, previous_exit: 1}
  - {from: 207, to: 105, previous: 106, previous_exit: 0}
  - {from: 43, to: 42, previous: 41, previous_exit: 1}
  - {from: 6, to: 105, previous: 106}
  - {from: 142, to: 135, previous: 132, previous_exit: 1}
  - {from: 5, to: 12, previous: 13, previous_exit: 1}
# Death (partner_impl.c: tickDeathCondition): a lost life or a death set variable 255
# to 0 and continue in section 0x4DE of the map script. The egg box (doo2.c:
# DOO2_openEggBox, DOO2_tickEggInput) sounds when opened, when moving the egg and when choosing it.
death:
  section: 1246
  cleared_variable: 255
  egg_box:
    open: {slot: 8, sound: 4}
    move: {slot: 0, sound: 2}
    choose: {slot: 0, sound: 3}
# Routine 47 (script_common.c: lostAllLives): the reborn forgets (10 - tamer level) * 2 % of the techniques it
# knows (of the first 0x3A), rounding up from 50; each one at random (randomLimit) with its box, line 7 of
# section 0x4D8 of MAPHEAD, which names the technique of variable 243; 244 counts the ones left.
forget_moves:
  lines_section: 1240
  line: 7
  move_variable: 243
  count_variable: 244
# The ending save (main_menu.c: gameClearSave, routine 54): record 40 (39 from 0) of the versus battles
# receives a copy of the partner (name, stats and discipline) as Machinedramon with three of its techniques
# (awardMachinedramonData: animations 0x2E, 0x30 and 0x32, its 1st, 3rd and 5th techniques).
ending:
  gift_slot: 39
  gift_species: muge
  gift_techniques: [megaton_punch, thunder_justice, all_range_beam]
# The job at the canyon shop (script 49, sections 0x51 and 0x52; the customers, scripts 199 to 202), for the job
# progress bar (engine improvement, option shop_job_bar): in gcan11 variable 123 counts the 20 customers; at
# the end, routine 56 copies the high byte of the tally to variable 243 and the script pays for it: up to 6, 500 bits;
# from 7, 1500; from 12 (a tally of 3072 or more), Monochromon joins the city (2000 bits and trigger 247).
shop_job:
  map: gcan11
  customers_variable: 123
  customers: 20
  better_pay_from: 7
  joins_from: 12
