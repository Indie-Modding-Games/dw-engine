# Los torneos de la arena (game/tournament: tournament.hpp; apps/session: TournamentAdapter). main/utils2.c:
# startTournament y std/std_setup.c: STD_tournamentMain y STD_initializeOpponent; std/std_main.c: STD_setupParticipants,
# STD_addFighterCounter y STD_deinitializeCombat. La base de los rivales por copa y las probabilidades de victoria por
# nivel son data/stadium, que dwx extrae del disco; las listas de cada copa, la sección 10 del guion de la arena.

# Valores del guion: la copa inscrita (pstat 3), las victorias con que termina (pstat 255), la inscripción (disparador
# 37), copa ganada (disparador 15 + copa) y los residentes de la ciudad (disparador 200 + especie).
story: {cup_variable: 3, result_variable: 255, registered_trigger: 37, won_trigger_base: 15, recruit_trigger_base: 200}

# startTournament: sin lista de rivales salen de todos los residentes de las especies 0 a 111; la Beetle Cup (22) usa
# su lista entera aunque no vivan en la ciudad. Hacen falta 3 victorias, y 2 en la copa 5 (Grade R: con 3 cuenta como
# perdida, rareza del original).
rivals: {species_count: 112, whole_list_cup: 22}
wins_needed: 3
cup_wins_needed: [[5, 2]]

# STD_tournamentMain: especies sin luchador en la arena y la que sale en su lugar (64 por 54, 63 por 48, 65 por 42).
stand_ins: [[64, 54], [63, 48], [65, 42]]

# STD_addFighterCounter(99): el reloj del combate en segundos. STD_deinitializeCombat: tras cada combate el compañero
# recupera un quinto de su HP y MP máximos.
time_limit: 99
recovery_divisor: 5

# STD_initializeOpponent: cada valor es la base de la copa ±30 % (0x1e - randomLimit(0x3d)); HP y MP, 10 veces eso. Se
# escalan por nivel (novato ×1, campeón ×2, perfecto ×25/10) y se cortan en 999 y 9999.
stats: {spread: 30, vitality_factor: 10, stat_cap: 999, vitality_cap: 9999}
levels: [[3, 1, 1], [4, 2, 1], [5, 25, 10]]
# STD_setupParticipants: STD_WIN_CHANCES[nivel - 3][nivel - 3].
first_level: 3

# STD_initializeOpponent: de las 15 primeras técnicas de la especie, las que no son remate (0x3a a 0x70) y cuyo coste
# por 3 paga su MP / 10. STD_tickEnemyAI: preferencias 30, 30, 30 y 0.
moves: {slots: 15, finishers: [58, 113], mp_cost_factor: 3, mp_divisor: 10, priorities: [30, 30, 30, 0]}

# La inscripción en el mostrador (rutina 18 del guion; dget/dget.c: initTournamentSchedule). Escribe el día inscrito en
# la variable 2 (hoy, o mañana + 0x80), la especie del compañero en la 4 y pone los disparadores 37, 38 y 39; el 40 si
# el compañero es demasiado fuerte para la copa (lista de la entrada 2). Las copas de hoy se aceptan hasta el minuto
# 600 (10:00); el calendario va por días % 30. isTournamentEnabled cuenta los residentes 200 a 311, la copa A ganada
# (disparador 18) y la lista de la sección 11 del guion del mapa. Lo que se dice son frases de la sección 0x4d8 de
# MAPHEAD: 1 el título, 2 la pregunta, 3 la pregunta si es demasiado fuerte, 4 «Enter / Don't enter». Una casilla que no
# se puede elegir suena con playSound(0, 0xb); mover, elegir y cerrar son los sonidos de los menús (2, 3 y 4).
schedule:
  day_variable: 2
  species_variable: 4
  tomorrow_flag: 128
  registered_triggers: [38, 39]
  overlevel_trigger: 40
  last_minute_today: 600
  cycle_days: 30
  recruit_trigger_end: 312
  grade_a_won_trigger: 18
  local_list_section: 11
  lines: {section: 1240, title: 1, ask: 2, ask_overlevel: 3, choice: 4}
  sounds: {slot: 0, refuse: 11}

# La arena de las copas (std_setup.c: STD_initializeTournament, STD_loadArenaAssets; std_main.c: STD_placePlayer1/2,
# STD_runIntro, STD_setCameraOrbit). Por número de arena: modelo y rejilla de colisión del pack, dónde empiezan los
# luchadores (el partner en +start_x, el rival en -start_x) y cuánto camina cada uno hacia el centro en su
# presentación. Las copas de betl02 (CURRENT_SCREEN 0x6a) usan la arena 1; las demás, la 0. La cámara del combate
# mira a los luchadores desde un lado: su distancia por projection / distance_divisor, entre min_distance (1000 con
# el combate en marcha) y max_distance, a eye_height del suelo y bajando drop hasta el punto medio.
arena:
  arenas:
    - {model: "model/stddat/t_togi", collision: "arena/b_togi/collision", start_x: 2500, walk_in: 2000}
    - {model: "model/stddat/b_togi", collision: "arena/b_togi/collision", start_x: 1800, walk_in: 1300}
  second_arena_map: betl02
  yaws: {partner: 1024, rival: 3072}
  camera: {projection: 500, distance_divisor: 200, min_distance: 1000, max_distance: 4200, eye_height: 1000, drop: 700}
