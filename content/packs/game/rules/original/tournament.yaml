# Arena tournaments (packages/game/tournament: tournament.hpp; packages/session: TournamentAdapter). main/utils2.c:
# startTournament and std/std_setup.c: STD_tournamentMain and STD_initializeOpponent; std/std_main.c: STD_setupParticipants,
# STD_addFighterCounter and STD_deinitializeCombat. The base of the rivals per cup and the win chances per
# level are data/stadium, which dwx extracts from the disc; the list for each cup is section 10 of the arena script.

# Script values: the registered cup (pstat 3), the wins it ends with (pstat 255), the registration (trigger
# 37), cup won (trigger 15 + cup) and the town residents (trigger 200 + species).
story: {cup_variable: 3, result_variable: 255, registered_trigger: 37, won_trigger_base: 15, recruit_trigger_base: 200}

# startTournament: with no rival list they come from all the residents of species 0 to 111; the Beetle Cup (22) uses
# its whole list even if they do not live in the town. 3 wins are needed, and 2 in cup 5 (Grade R: with 3 it counts as
# lost, an original quirk).
rivals: {species_count: 112, whole_list_cup: 22}
wins_needed: 3
cup_wins_needed: [[5, 2]]

# STD_tournamentMain: species with no fighter in the arena and the one that appears in its place (64 for 54, 63 for 48, 65 for 42).
stand_ins: [[64, 54], [63, 48], [65, 42]]

# STD_addFighterCounter(99): the combat clock in seconds. STD_deinitializeCombat: after each combat the partner
# recovers a fifth of its max HP and MP.
time_limit: 99
recovery_divisor: 5

# STD_initializeOpponent: each value is the cup base ±30 % (0x1e - randomLimit(0x3d)); HP and MP, 10 times that. They are
# scaled by level (Rookie ×1, Champion ×2, Ultimate ×25/10) and capped at 999 and 9999.
stats: {spread: 30, vitality_factor: 10, stat_cap: 999, vitality_cap: 9999}
levels: [[3, 1, 1], [4, 2, 1], [5, 25, 10]]
# STD_setupParticipants: STD_WIN_CHANCES[level - 3][level - 3].
first_level: 3

# STD_initializeOpponent: of the first 15 moves of the species, those that are not finishers (0x3a to 0x70) and whose cost
# times 3 pays its MP / 10. STD_tickEnemyAI: priorities 30, 30, 30 and 0.
moves: {slots: 15, finishers: [58, 113], mp_cost_factor: 3, mp_divisor: 10, priorities: [30, 30, 30, 0]}

# The registration at the counter (script routine 18; dget/dget.c: initTournamentSchedule). It writes the registered day to
# variable 2 (today, or tomorrow + 0x80), the partner's species to 4 and sets triggers 37, 38 and 39; 40 if
# the partner is too strong for the cup (list of entry 2). Today's cups are accepted until minute
# 600 (10:00); the calendar goes by days % 30. isTournamentEnabled counts residents 200 to 311, cup A won
# (trigger 18) and the list in section 11 of the map script. What is said are lines of section 0x4d8 of
# MAPHEAD: 1 the title, 2 the question, 3 the question if too strong, 4 «Enter / Don't enter». A slot that cannot
# be chosen plays playSound(0, 0xb); move, choose and close are the menu sounds (2, 3 and 4).
schedule:
  day_variable: 2
  species_variable: 4
  tomorrow_flag: 128
  registered_triggers: [38, 39]
  overlevel_trigger: 40
  last_minute_today: 600
  cycle_days: 30
  recruit_trigger_end: 312
  grade_a_won_trigger: 18
  local_list_section: 11
  lines: {section: 1240, title: 1, ask: 2, ask_overlevel: 3, choice: 4}
  sounds: {slot: 0, refuse: 11}
  # The registration notice (tournament.c: updateTournamentRegistration), every frame with the registered partner, with no
  # script running, the Tamer free and the partner in its normal state. If the partner is no longer of the registered species,
  # the registration is cleared without saying anything; a registration for tomorrow (tomorrow_flag) waits. From from_minute
  # (12:00): with another day or from late_minute (23:01) the cup was missed, missed_section runs and the registration is cleared;
  # otherwise, section runs once before second_minute (20:00, with trigger 38) and again after it (with 39).
  notice: {from_minute: 720, second_minute: 1200, late_minute: 1381, section: 1241, missed_section: 1242}

# The cup arena (std_setup.c: STD_initializeTournament, STD_loadArenaAssets; std_main.c: STD_placePlayer1/2,
# STD_runIntro, STD_setCameraOrbit). Per arena number: pack model and collision grid, where the
# fighters start (the partner at +start_x, the rival at -start_x) and how far each walks toward the center in its
# introduction. The betl02 cups (CURRENT_SCREEN 0x6a) use arena 1; the others, arena 0; versus picks among the
# three (battle.yaml: versus.arenas). The combat camera looks at the fighters from one side: its distance by
# projection / distance_divisor, between min_distance (1000 with combat running) and max_distance, at eye_height from the
# floor and dropping drop down to the midpoint.
# The music is that of each arena's bank (STD_initializeTournament: STD_MUSIC 30 in arena 0, 32 in 1) and its
# tracks (playMusic(STD_MUSIC, track)): the partner's entrance and the rival's (STD_runIntro), the combat
# (STD_combatMain) and the won or lost combat one (STD_deinitializeCombat, if there was no draw).
arena:
  arenas:
    - {model: "model/stddat/t_togi", collision: "arena/b_togi/collision", start_x: 2500, walk_in: 2000, music_font: 30}
    - {model: "model/stddat/b_togi", collision: "arena/b_togi/collision", start_x: 1800, walk_in: 1300, music_font: 32}
    # Only the versus one (vs_scene.c: VS_ARENA_MODELS[2], VS_ARENA_COLLISIONS[2]; VS_loadVSAssets: VS_MUSIC 31;
    # vs_intro.c: VS__runIntro and VS__placePlayer1/2 treat it as 0).
    - {model: "model/stddat/e_togi", collision: "arena/e_togi/collision", start_x: 2500, walk_in: 2000, music_font: 31}
  music: {partner_intro: 0, rival_intro: 1, fight: 2, won: 3, lost: 4}
  second_arena_map: betl02
  yaws: {partner: 1024, rival: 3072}
  camera: {projection: 500, distance_divisor: 200, min_distance: 1000, max_distance: 4200, eye_height: 1000, drop: 700}

# The bracket before each of the partner's combats (std_setup.c: STD_tournamentMain; std_main.c: STD_addBracketIntro,
# STD_addBracket, STD_drawBracket, STD_tickBracketHitFlash). It runs at 20 frames per second (VSync(3)). Its sounds are
# those of bank 16 in slot 8 (loadMapSounds(0x10)); its music, playMusic(29, track): 0 the presentation, 1 the
# bracket of a combat, 2 the champion's rise. After the rise, fadeToBlack(10) and 11 frames. The images come from
# the player's extracted data: the board (stdtim 005), the two sprite pages (000 and 001), the grade cards
# (data/stadium: grades) and the hit flash, 16 x 16 at (0, 200) of the second page with its palette 0.
bracket:
  frames_per_second: 20
  sound_bank: 16
  music: {font: 29, intro: 0, match: 1, champion: 2}
  champion_fade: 10
  champion_tail: 11
  textures:
    board: texture/stddat/stdtim/005
    pages: [texture/stddat/stdtim/000, texture/stddat/stdtim/001]
    cards: texture/stddat/grade
  flash: {page: 1, u: 0, v: 200, size: 16, palette: 0}

# Extra prizes per cup won, besides those of the arena script (script 214: money and item for the winner, the
# runner-up and the participation Giant Meat). The original has none; a ruleset can add
# {cup: N, item: item number, amount: how many} or {cup: N, money: bits}.
extra_prizes: []

# The tournament medal (script routine 22; tournament.c: checkTournamentMedalConditions and
# scriptCheckTournamentMedal). Cup groups (first won-cup trigger and how many): all won give the
# group's result (0 to 3); 100 tournament wins gives 4; the 66 cards and the finished game (trigger 50) gives 5.
# Only the first condition met counts: if its medal is already owned, there is no other (an original quirk). The
# medal of each result is data/tournaments: medal_ids; its text, the `result` line of section 0x4db of
# MAPHEAD, with no name.
medal:
  cup_groups: [[15, 6], [21, 5], [26, 7], [33, 4]]
  wins: 100
  cards: 66
  beaten_trigger: 50
  lines_section: 1243
