# The story (packages/session: StoryAdapter, docs/architecture/story-interpreter.md).
# The engine ticks at 60 Hz and the original's story advances 20 frames per second
# (main.c: gameLoop, VSync(3)): one original frame is 3 ticks.
ticks_per_frame: 3
# A story variable is a byte (script.h: ScriptState.pstats): 0 to 255, and a write
# that overflows stays at the limit (script_interp.c: scriptInstruction10to27).
variable_max: 255
# While a script holds the player still, variable 0 is 3 (script_interp.c: scriptPauseGame), and at the end
# it goes back to its value; a save made then stores it as 0 (main_menu.c: writeSavegame).
frozen_variable: 0
frozen_value: 3
# Each freeze clears this trigger, the one that keeps both sides of a chat from turning around.
talk_facing_trigger: 44
# Whether a script's map change shows the new map's name (script_interp.c: consumeMapChangeShowName): the
# variable says by event (no name in an event), always or never, and goes back to «by event».
show_name_variable: 6
show_name_by_event: 0
show_name_always: 1
show_name_never: 2
# Variables each co-op player keeps for itself, so a reward a script gives once goes to every player once
# (docs/architecture/multiplayer.md, «Shared world interactions»). Single player reads them as any other.
# 31 counts the days since the meat farm's last meat (a day counter of calendar.yaml; scripts 164 and 207
# give the meat and set it to 0). The canyon shop's job runs on each player's own counter: the customers served
# (123), the tally's bytes (243, 244), what each turn tells the scripts (110 result, 117 level, 248 face) and its
# halfway line (trigger 101), so one player's job never moves the other's bar (story_scenes.yaml, shop_job).
# 247 and 248 are what a script hands to the engine's routines right before the call (a map object and its
# animation, a mood bubble's character and face, the bird's map and entrance): no script reads them back, so
# they stay in the game that runs the script. 110 is a scratch roll: read in the section that rolls it, except
# the Toy Mansion's doors (scripts 142 to 144), whose map entry rolls the right door for that game's own walk.
player_own_variables: [31, 110, 117, 123, 243, 244, 247, 248]
player_own_triggers: [101]
# What the ruleset adds to the original's 800 triggers and 256 variables, for mods with more story or more
# species (docs/modding/story.md, «Capacity»). The extra variables are integers from 0 to extra_variable_max and
# all of them are saved; extra_raised gives "raised" triggers to species from 63 on (the original only has
# 0x200 + number for the first 63). The original adds nothing.
capacity:
  extra_triggers: 0
  extra_variables: 0
  extra_variable_max: 2147483647
  extra_raised:
    first_trigger: 800
    species: 0
# The map entries' rolls that place a roaming rare (docs/modules/apps/game.md, «Roaming rare chance»): each
# section's store_random into the variable, from 0 to highest, places it on hits_at_most or less. The option
# roaming_rare_chance tunes their chance with the same single draw; its original setting rolls them as they are.
roaming_rares:
  # Piximon in the jungle (trop01, MAPHEAD 0x0c) until trigger 255.
  - {script: 0, section: 12, variable: 100, highest: 99, hits_at_most: 2}
  # Mamemon on the plains (miha01, MAPHEAD 0x13) until trigger 213.
  - {script: 0, section: 19, variable: 100, highest: 99, hits_at_most: 2}
  # MetalMamemon in Factorial Town (fact02, MAPHEAD 0x99) until trigger 227.
  - {script: 0, section: 153, variable: 110, highest: 99, hits_at_most: 2}
