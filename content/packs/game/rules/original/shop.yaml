# The shop the story opens (script_interp.c: CALL_ROUTINE 8 -> script_common.c: openShop; packages/session: ShopCounter).
# The stock is not here: item i is sold while trigger 0x180 + i is set (inventory: shop).

# getShopkeeperLine (script_common.c:1174): a shopkeeper's lines are the MAPHEAD section 0x4c4 plus its place in
# data/shops shopkeepers; a shop with no owner (variable 254 = 0xFF) uses section 0x4ce.
keeper_lines_section: 1220
ownerless_lines_section: 1230
# CALL_ROUTINE 8 opens the recycle shop (openRecycleShop) while this trigger is set.
recycle_trigger: 3
# RECYCLABLE_ITEMS (script_common.c:350): what a defeat takes away of these items goes to the recycle shop
# (handleItemLoss), which keeps up to recycle_max of each.
recyclable:
  - { from: 11, to: 12 }
  - { from: 23, to: 31 }
  - { from: 33, to: 33 }
  - { from: 35, to: 36 }
  - { from: 46, to: 46 }
  - { from: 50, to: 50 }
  - { from: 56, to: 61 }
  - { from: 67, to: 67 }
  - { from: 70, to: 76 }
  - { from: 78, to: 124 }
recycle_max: 99
# tickItemMenuAmountBox (script_common.c:1457): the alternate button moves the amount in steps of ten.
amount_step: 10
# openShop: the number of each line within the shopkeeper's section (resolveMapHeadEntry).
lines:
  greeting: 0
  nothing_to_sell: 1
  choices: 2
  farewell_after_trade: 4
  farewell: 5
  bits: 6
  buy_prompt: 8
  sell_prompt: 9
  thanks: 10
  anything_else: 11
  discount: 13
  # openRecycleShop (script_menu.c:584): its options (buy or leave) and what it says when nothing is left.
  recycle_choices: 3
  sold_out: 12
