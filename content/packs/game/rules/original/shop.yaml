# La tienda que abre la historia (script_interp.c: CALL_ROUTINE 8 -> script_common.c: openShop; packages/session: ShopCounter).
# El surtido no está aquí: el objeto i se vende mientras el trigger 0x180 + i está puesto (inventory: shop).

# getShopkeeperLine (script_common.c:1174): las frases de un tendero son la sección de MAPHEAD 0x4c4 más su lugar en
# data/shops shopkeepers; una tienda sin dueño (variable 254 = 0xFF) usa la sección 0x4ce.
keeper_lines_section: 1220
ownerless_lines_section: 1230
# CALL_ROUTINE 8 abre la tienda de reciclaje (openRecycleShop) mientras este trigger está puesto.
recycle_trigger: 3
# RECYCLABLE_ITEMS (script_common.c:350): lo que una derrota quita de estos objetos va a la tienda de reciclaje
# (handleItemLoss), que guarda hasta recycle_max de cada uno.
recyclable:
  - { from: 11, to: 12 }
  - { from: 23, to: 31 }
  - { from: 33, to: 33 }
  - { from: 35, to: 36 }
  - { from: 46, to: 46 }
  - { from: 50, to: 50 }
  - { from: 56, to: 61 }
  - { from: 67, to: 67 }
  - { from: 70, to: 76 }
  - { from: 78, to: 124 }
recycle_max: 99
# tickItemMenuAmountBox (script_common.c:1457): el botón alternativo mueve la cantidad de diez en diez.
amount_step: 10
# openShop: el número de cada frase dentro de la sección del tendero (resolveMapHeadEntry).
lines:
  greeting: 0
  nothing_to_sell: 1
  choices: 2
  farewell_after_trade: 4
  farewell: 5
  bits: 6
  buy_prompt: 8
  sell_prompt: 9
  thanks: 10
  anything_else: 11
  discount: 13
  # openRecycleShop (script_menu.c:584): sus opciones (comprar o salir) y lo que dice cuando ya no le queda nada.
  recycle_choices: 3
  sold_out: 12
