# Saving (packages/game/save, docs/architecture/save.md). The original only saved when the player asked: when sleeping
# (partner.c: partnerTickSleep), at the save machine (main_menu.c: openSaveMachine) and when the game is cleared
# (main_menu.c: gameClearSave). All the autosaving is new: each reason set to false is the original.
autosave:
  # Approved deviation (2026-10-20): autosave on every map change, so no progress is lost.
  on_map_change: true
  # Approved deviation (2026-10-20): autosave at the end of every battle, won or lost.
  on_battle_end: true
  # Approved deviation (2026-10-20): autosave when the partner falls asleep.
  on_partner_sleep: true
  # Approved deviation (2026-10-20): autosave on every new day of the game clock.
  on_new_day: true
  # Approved deviation (2026-10-20): autosave after every evolution.
  on_evolution: true
  # Approved deviation (2026-10-20): autosave after the result of a tournament or the arena.
  on_tournament_result: true
  # Approved deviation (2026-10-20): autosave when a recruit joins the city.
  on_recruit_join: true
  # Approved deviation (2026-10-20): autosave when buying or using a key item.
  on_key_item: true
  # Approved deviation (2026-10-20): autosave before entering a known dangerous zone (the data on which
  # maps are dangerous arrives with the field).
  on_dangerous_area: true
  # Approved deviation (2026-10-20): autosave when the story advances (a story trigger).
  on_story_progress: true
  # Approved deviation (2026-10-20): autosave when the partner is reborn from its egg after dying.
  on_partner_reborn: true
  # Approved deviation (2026-10-20): requests within this many real seconds of the first give a single
  # autosave (sleeping and the new day, several reasons in the same frame). Real seconds and not game
  # clock: when sleeping the clock jumps hours at once, and in menus and battles it stops. Minimum 1: the autosave
  # slots take turns by their time in whole seconds.
  coalesce_seconds: 2
