# The Item Keeper the story opens (script_interp.c: CALL_ROUTINE 11 -> shop/script_menu.c:
# tickItemKeeper; packages/session: ItemKeeper). What it keeps goes in the save file.

# showMapHeadTextbox(..., 0x4d5): the keeper's lines are this MAPHEAD section.
lines_section: 1237
# The number of each line within the section (resolveMapHeadEntry): the question, the yes or no and the goodbye.
lines:
  ask: 0
  choices: 1
  farewell: 2
# itemKeeperFillItemList: keeps up to max_count of each item (0x63).
max_count: 99
# keeperMoveTen: the alternate button moves ten at a time.
step: 10
