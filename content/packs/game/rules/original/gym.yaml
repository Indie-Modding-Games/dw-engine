# The town gym (src/trn: TRN_setup*Training and TRN_tick*Training). Read by packages/game/gym and apps/game. The
# gains of each session are in training.yaml; here is the choreography of each course, counted in frames of the
# original (20 per second). Points are world units; objects, background pixels; angles, 4096 per
# turn. Besides the gym (trai00) there are other training spots: those of src/trn in gias09 and mist05 and those of
# src/trn2 (TRN2_setup*Training) in icsa03, betl03, betl04 and gomi02; each is a site (sites) with its courses.
# script_interp.c: routine 7: the course comes from variable 0xfe (254): 0 HP, 1 attack, 2 speed, 3 defense, 4 MP and
# 5 brains (choice of each course).
course_variable: 254
# TRN_setup*Training: variable 0xf6 (246) enables the slot machine.
slot_variable: 246
# TRN_calculateTrainingMultiplier: the training manual (getItemCount(0x21)).
manual_item: trn_manual
# playSound(8, ...): the map's bank.
sound_slot: 8
# TRN_createCloudFXLine: each cloud strays randomLimit(100) from its line.
cloud_scatter: 100
# tamer.c: tamerTickTraining: the player (state 8) sets its clip 10 and looks at the partner every frame.
watch_animation: 10
# trn_hud.c: the stats box waits 100 frames, then counts one point per frame with playSound(0, 0x16),
# capped at 9999 for HP and MP and 999 for the rest.
count:
  delay_frames: 100
  sound_slot: 0
  sound: 22
  hp_mp_max: 9999
  stat_max: 999
# What every course has in common: the apparatus (the partner walks to it and the camera follows it at speed 10), the session of
# 1200 frames (or until canceled), 20 frames of pause after the count, the sounds at the start (9) and at the end (10)
# and the walk and finish animations (0x12). Below, the course's own choreography.
# trn_slots.c: the slot machine, if the variable of slot_variable is 1. The reels are TRN_D_8008F1AC; the
# hidden help comes from TRN_D_8008F2CC[rand() % 10] (0 none, 1 match, 2 look for the 7). They spin at 0x400 >> 6
# pixels per frame in cells of 32; the line is shown for 30 frames (or until confirmed). It pays in tenths: triple 7,
# triple of the course's symbol, another triple and nothing. playSound(8, ...) sounds: 6 starts, 7 on press, 8 on stop,
# 0xc the 7, 0xb a triple and 0xd nothing.
slots:
  reels:
    - [1, 2, 3, 4, 5, 6, 7, 1, 3, 5, 2, 4, 6]
    - [6, 4, 2, 5, 3, 1, 2, 5, 3, 6, 1, 4, 7]
    - [7, 6, 5, 4, 6, 5, 4, 3, 2, 1, 3, 2, 1]
  assist_by_roll: [0, 0, 0, 0, 0, 1, 1, 1, 1, 2]
  jackpot_symbol: 7
  spin_speed: 16
  cell_pixels: 32
  # TRN_renderSlotMachine: a reel about to stop is drawn 2 pixels lower.
  settle_pixels: 2
  result_frames: 30
  payouts:
    jackpot: 100
    own_symbol: 40
    triple: 20
    miss: 5
  sounds:
    start: 6
    press: 7
    stop: 8
    jackpot: 12
    triple: 11
    miss: 13
# TRN_TRAINING_ANIM_IDS (and TRN2_TRAINING_ANIM_IDS, the same): each species' strike in the attack courses
# (animation and frames until the impact); the rest use the default one.
punches:
  default: { animation: 46, frames: 10 }
  by_species:
    agum: { animation: 51, frames: 12 }
    beta: { animation: 46, frames: 20 }
    grey: { animation: 53, frames: 20 }
    mera: { animation: 53, frames: 13 }
    nume: { animation: 46, frames: 20 }
    mtgr: { animation: 49, frames: 10 }
    mame: { animation: 46, frames: 8 }
    gabu: { animation: 46, frames: 20 }
    ange: { animation: 46, frames: 14 }
    bird: { animation: 46, frames: 15 }
    mtma: { animation: 46, frames: 8 }
    veda: { animation: 51, frames: 10 }
    poyo: { animation: 46, frames: 20 }
    toko: { animation: 46, frames: 20 }
    kune: { animation: 46, frames: 14 }
    unim: { animation: 46, frames: 20 }
    ogre: { animation: 49, frames: 10 }
    cent: { animation: 53, frames: 20 }
    bake: { animation: 46, frames: 20 }
    scum: { animation: 46, frames: 20 }
    andr: { animation: 46, frames: 13 }
    giro: { animation: 47, frames: 30 }
    etem: { animation: 46, frames: 15 }
    yura: { animation: 46, frames: 15 }
    piyo: { animation: 53, frames: 23 }
    mono: { animation: 51, frames: 10 }
    coca: { animation: 52, frames: 10 }
    digi: { animation: 48, frames: 30 }
    houo: { animation: 46, frames: 25 }
    hkab: { animation: 48, frames: 10 }

# TRN_awardBrainsTrainingGains and TRN_tryLearnMove: passing 100, 200, 300, 400 or 500 brains gives new
# orders; otherwise, passing one of these thresholds (or reaching 999) can teach a move: the first not yet
# learned of each of the partner's specials (TRN_D_8008F14C, by move number) that is in its list, with the
# weight of its slot (TRN_D_8008F184, per special); the one with the most weight wins if it exceeds randomLimit(100).
brain_learning:
  order_thresholds: [100, 200, 300, 400, 500]
  move_thresholds: [150, 250, 350, 450, 550, 650, 750, 800, 850, 900, 950]
  move_cap: 999
  moves_by_special:
    - [2, 5, 0, 4, 3, 1, 6, 7]
    - [43, 44, 42, 46, 45, 41, 40, 47]
    - [12, 10, 13, 9, 11, 14, 8, 15]
    - [37, 38, 32, 35, 34, 36, 39, 33]
    - [23, 19, 20, 21, 18, 16, 17, 22]
    - [24, 26, 31, 27, 30, 28, 25, 29]
    - [55, 49, 50, 53, 54, 51, 52, 56]
  weights:
    - [0, 15, 10]
    - [25, 13, 8]
    - [22, 11, 7]
    - [20, 9, 5]
    - [18, 8, 2]
    - [15, 7, 0]
    - [12, 6, 0]
    - [10, 5, 0]
sites:
  # map.c: loadTrainingLibrary and TRN_setup*Training: the town gym (map 0x70). training.yaml: place is the
  # place whose gains each course gives; only here do the sessions count toward practice (upgrade*Counter).
  - map: trai00
    place: trn
    courses:
      # trn_hp.c: the weights.
      - id: hp
        choice: 0
        # TRN_startSlotSessionIfEnabled(0): its symbol on the slot machine is 1.
        slot_symbol: 1
        # TRN_getTrainingSpotScreenPos (trn_hud.c, TRN_D_8008F1D4): the apparatus, where the slot machine box comes from.
        machine: { x: 1010, z: -975 }
        spot: { x: 1420, z: -1744 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        hp:
          # Looks toward the apparatus (0xa00) and lifts (animation 0x1b) the map's objects 0x53 to 0x62.
          facing: 2560
          objects: { first: 83, count: 16 }
          work_animation: 27
          # Every 120 frames, on frames 0 to 1200, a hit raises the weights (1, -2); every frame they shake ±2
          # in x; every 10 the hit sounds (sound 0).
          beat_frames: 120
          beat_move: { x: 1, y: -2 }
          jitter: 2
          beat_sound_every: 10
          beat_sound: 0
          # On return, the weights go down (-1, 2) one frame per hit given.
          return_move: { x: -1, y: 2 }
          # TRN_createCloudFXLine: every `every` frames, `count` clouds from (x, z) with step (dx, dz), shifted by the
          # hits given × every.
          clouds:
            - { every: 15, x: 1360, z: -1540, dx: 100, dz: -50, count: 8 }
            - { every: 20, x: 1461, z: -1639, dx: 50, dz: -50, count: 6 }
            - { every: 18, x: 1300, z: -1317, dx: 20, dz: -50, count: 4 }
      # trn_mp.c: the meditation machine.
      - id: mp
        choice: 4
        # TRN_startSlotSessionIfEnabled(1): its symbol on the slot machine is 2.
        slot_symbol: 2
        # TRN_getTrainingSpotScreenPos (trn_hud.c, TRN_D_8008F1D4): the apparatus, where the slot machine box comes from.
        machine: { x: 1432, z: 1276 }
        spot: { x: 684, z: 2152 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        mp:
          # It goes through this point first and returns to it at the end; it stays there.
          waypoint: { x: 656, z: 750 }
          facing: 0
          # Objects 0xa4 to 0xab rise over its head (20 pixels above); meanwhile 0x93 to
          # 0xa2 are hidden and 0xa3 to 0xba are shown.
          objects: { first: 164, count: 8 }
          hidden: { first: 147, count: 16 }
          shown: { first: 163, count: 24 }
          head_lift: 20
          work_animation: 0
          # playSound2(8, 2): sounds until done.
          loop_sound: 2
          leave_animation: 2
      # trn_off.c: the punching bag.
      - id: offense
        choice: 1
        # TRN_startSlotSessionIfEnabled(2): its symbol on the slot machine is 3.
        slot_symbol: 3
        # TRN_getTrainingSpotScreenPos (trn_hud.c, TRN_D_8008F1D4): the apparatus, where the slot machine box comes from.
        machine: { x: -506, z: -1937 }
        spot: { x: -982, z: -2580 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        offense:
          # Looks toward the bag (0x200), objects 0x64 to 0x6b.
          facing: 512
          objects: { first: 100, count: 8 }
          # createParticleFX on the hit, with sound 5.
          particles:
            - { x: -1100, y: -600, z: -2850 }
            - { x: -1100, y: -500, z: -2850 }
            - { x: -1100, y: -400, z: -2850 }
          hit_sound: 5
          # The bag moves away (-4, 2) on frames 1 to 3 of the swing, returns on 4 to 6 and then shakes
          # ±((100 - frame) / 20, (100 - frame) / 50) until frame 41.
          recoil_frames: 4
          recoil_move: { x: -4, y: 2 }
          rebound_frames: 7
          swing_frames: 41
          swing_base: 100
          swing_divisor: { x: 20, y: 50 }
          leave_animation: 2
      # trn_def.c: the log that hits.
      - id: defense
        choice: 3
        # TRN_startSlotSessionIfEnabled(3): its symbol on the slot machine is 4.
        slot_symbol: 4
        # TRN_getTrainingSpotScreenPos (trn_hud.c, TRN_D_8008F1D4): the apparatus, where the slot machine box comes from.
        machine: { x: -789, z: -875 }
        spot: { x: -827, z: -1634 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        defense:
          # Looks toward the log (0x400) on guard (animation 0x25); objects 0x47 to 0x53.
          facing: 1024
          objects: { first: 71, count: 13 }
          # createParticleFX and playSound2(8, 4) when the log arrives.
          particles:
            - { x: -900, y: -500, z: -2000 }
            - { x: -950, y: -500, z: -1900 }
            - { x: -950, y: -500, z: -2100 }
          loop_sound: 4
          work_animation: 37
          # The hits that push move the partner 100 in x per frame, with dust 100 behind.
          push: 100
          dust_behind: 100
          # Each swing moves the log `dx` per frame up to `limit` from where it was; then the partner returns to
          # its place and another round starts, or it ends if the session has passed.
          swings:
            - { dx: 50, limit: 100, push: false }
            - { dx: -50, limit: 50, push: true }
            - { dx: 50, limit: 90, push: true }
            - { dx: -30, limit: 60, push: false }
            - { dx: 20, limit: 90, push: false }
            - { dx: -10, limit: 70, push: false }
            - { dx: 5, limit: 90, push: false }
            - { dx: -4, limit: 0, push: false }
      # trn_speed.c: the track.
      - id: speed
        choice: 2
        # TRN_startSlotSessionIfEnabled(4): its symbol on the slot machine is 5.
        slot_symbol: 5
        # TRN_getTrainingSpotScreenPos (trn_hud.c, TRN_D_8008F1D4): the apparatus, where the slot machine box comes from.
        machine: { x: 12, z: 445 }
        spot: { x: 45, z: -388 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        speed:
          # Runs toward 0xc00; every 60 frames, if it left the screen, it goes back to x = -3000.
          facing: 3072
          run_animation: 4
          lap_frames: 60
          restart: { x: -3000 }
      # trn_brain.c: the blackboard.
      - id: brain
        choice: 5
        # TRN_startSlotSessionIfEnabled(5): its symbol on the slot machine is 6.
        slot_symbol: 6
        # TRN_getTrainingSpotScreenPos (trn_hud.c, TRN_D_8008F1D4): the apparatus, where the slot machine box comes from.
        machine: { x: -1779, z: 2084 }
        spot: { x: -1249, z: 1011 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 2, done: 18 }
        brain:
          # The Tamer walks (2) to the blackboard, stops (0) and teaches (9, every 30 frames with sound 3); the partner
          # waits (0) and learns (0x16, every 35). The partner stays at its desk at the end.
          tamer_spot: { x: -1452, z: 1563 }
          tamer_walk: 2
          tamer_stand: 0
          tamer_teach: 9
          partner_stand: 0
          partner_learn: 22
          teach_every_frames: 30
          teach_sound: 3
          learn_every_frames: 35
  # trn_off.c and trn_speed.c, instance 6: the savanna (map 0x4e). Its sessions do not count toward practice.
  - map: gias09
    place: trn
    counts_practice: false
    courses:
      # trn_off.c, states 7 and 8: the bag does not swing; the hit hides objects 0x27 to 0x2a and shows 0x2b to
      # 0x48 (and animates them from the start: resetMapObjectAnimation(0x2b, 0x2b)); 46 frames later they return.
      - id: offense
        choice: 1
        gains: offense_alt
        slot_symbol: 3
        # TRN_D_8008F20C: this map's entry with stat 2.
        machine: { x: -829, z: 4099 }
        spot: { x: -1319, z: 3289 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        offense:
          facing: 2048
          objects: { first: 43, count: 30 }
          particles:
            - { x: -1200, y: -200, z: 3500 }
            - { x: -1300, y: -200, z: 3500 }
            - { x: -1400, y: -200, z: 3500 }
          hit_sound: 16
          leave_animation: 2
          swap:
            frames: 46
            hit_shown: { first: 43, count: 30 }
            hit_hidden: { first: 39, count: 4 }
            hit_restarted: { first: 43, count: 43 }
            undo_shown: { first: 39, count: 4 }
            undo_hidden: { first: 43, count: 30 }
      # trn_speed.c: runs toward 0; every 60 frames, if it left the screen, it goes back to z = 2000.
      - id: speed
        choice: 2
        gains: speed_alt
        slot_symbol: 5
        machine: { x: 766, z: 106 }
        spot: { x: 50, z: -287 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        speed:
          facing: 0
          run_animation: 4
          lap_frames: 60
          restart: { z: 2000 }
  # trn_brain.c, instance 9: the fog (map 0x77). It teaches the map's first character (NPC_ENTITIES[0]): repeats its
  # animation 0x1e with sound 0x12 every 60 frames; the Tamer only watches. It does not count toward practice.
  - map: mist05
    place: trn
    counts_practice: false
    courses:
      - id: brain
        choice: 5
        slot_symbol: 6
        machine: { x: -2017, z: 1378 }
        spot: { x: -1507, z: 718 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 2, done: 18 }
        brain:
          tamer_spot: { x: -1380, z: 964 }
          tamer_walk: 2
          tamer_stand: 0
          partner_stand: 0
          partner_learn: 22
          learn_every_frames: 35
          teacher: { animation: 30, sound: 18, sound_every_frames: 60, done_animation: 0 }
  # src/trn2: the ice (map 0x63). TRN2_setupHpTraining and TRN2_setupDefenseTraining, instance 3.
  - map: icsa03
    place: trn2
    courses:
      # trn2_hp_map99.c: no sound at the start or on arrival; on arrival it shows objects 15 to 31 and hides them with
      # the gains. Objects 0 and 1 rise (-1, -1) per hit and go down (1, 1) on return.
      - id: hp
        choice: 0
        gains: hp_b
        slot_symbol: 1
        # TRN2_D_8008DB60: this map's entry with stat 0.
        machine: { x: 0, z: 1000 }
        spot: { x: 0, z: -150 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { end: 10 }
        animations: { walk: 4, done: 18 }
        hp:
          facing: 1024
          objects: { first: 0, count: 2 }
          work_animation: 27
          beat_frames: 120
          beat_move: { x: -1, y: -1 }
          jitter: 2
          beat_sound_every: 10
          beat_sound: 0
          return_move: { x: 1, y: 1 }
          clouds: []
          arrival_sound: false
          shown: { first: 15, count: 17 }
      # trn2_def_map99.c: object 14 falls 40 pixels per frame down to row 200; on hit it is swapped for
      # 33 and 30 frames later it goes back up. Only the falling frames count. TRN2_D_8008DB60 has no
      # entry with stat 3: the slot machine grows from the center.
      - id: defense
        choice: 3
        gains: defense_b
        slot_symbol: 4
        spot: { x: 1598, z: -959 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        defense_drop:
          work_animation: 37
          falling: { first: 14, count: 1 }
          drop: 40
          until_row: 200
          hit: { first: 33, count: 1 }
          particles:
            - { x: 1598, z: -959 }
          hit_sound: 16
          recover_frames: 30
  # src/trn2: the battlefield (map 0x6b), instance 1.
  - map: betl03
    place: trn2
    courses:
      # trn2_hp_map107.c: objects 10 and 11 rise (0, -1) per hit and go down (-1, 2) on return, like the original.
      - id: hp
        choice: 0
        gains: hp_a
        slot_symbol: 1
        machine: { x: -552, z: 1726 }
        spot: { x: 360, z: 737 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        hp:
          facing: 2200
          objects: { first: 10, count: 2 }
          work_animation: 27
          beat_frames: 120
          beat_move: { x: 0, y: -1 }
          jitter: 2
          beat_sound_every: 10
          beat_sound: 0
          return_move: { x: -1, y: 2 }
          clouds: []
      # trn2_off.c: the hit shows objects 12 to 14 and hides 15 (which does not return); 46 frames later
      # it shows 0x27 to 0x2a (leftovers of map 0x4e) and hides 12 to 14.
      - id: offense
        choice: 1
        slot_symbol: 3
        machine: { x: -1323, z: 1344 }
        spot: { x: -1414, z: -89 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        offense:
          facing: 1024
          objects: { first: 12, count: 3 }
          particles:
            - { x: -1600, y: -200, z: 0 }
            - { x: -1600, y: -200, z: 100 }
            - { x: -1600, y: -200, z: -100 }
          hit_sound: 15
          leave_animation: 2
          swap:
            frames: 46
            hit_shown: { first: 12, count: 3 }
            hit_hidden: { first: 15, count: 1 }
            hit_restarted: { first: 12, count: 12 }
            undo_shown: { first: 39, count: 4 }
            undo_hidden: { first: 12, count: 3 }
            # trn2_off.c sets animFlag 2 on every frame of the hit: each hit is given without advancing.
            hold_each_punch: true
  # src/trn2: the other battlefield (map 0x6c), instance 1.
  - map: betl04
    place: trn2
    courses:
      # trn2_reward.c: TRN2_tickSpeedTraining: the belt. At the first point loop 0xe sounds and objects
      # 0x38 to 0x3a are shown; it runs without moving (animFlag 2) and at the end goes to (0xf7, 0x3c5), not to the Tamer.
      - id: speed
        choice: 2
        slot_symbol: 5
        machine: { x: 750, z: 2040 }
        spot: { x: 882, z: 965 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 4, done: 18 }
        treadmill:
          waypoint: { x: 247, z: 550 }
          facing: 2640
          run_animation: 4
          loop_sound: 14
          shown: { first: 56, count: 3 }
          leave_spot: { x: 247, z: 965 }
      # trn2_def_map108.c: on guard (0x800) while objects 7 to 55 are animated (4 to 6 are hidden); every 4
      # frames a hit (animation 0x25, dust at the partner's height and sound 4) and 30 later the objects start
      # again. No sound at the start.
      - id: defense
        choice: 3
        gains: defense_a
        slot_symbol: 4
        machine: { x: -204, z: 2402 }
        spot: { x: -966, z: 1016 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { end: 10 }
        animations: { walk: 4, done: 18 }
        defense_pulse:
          facing: 2048
          hidden: { first: 4, count: 3 }
          shown: { first: 7, count: 49 }
          particles:
            - { x: -966, z: 1016 }
            - { x: -950, z: 1000 }
            - { x: -930, z: 980 }
          hit_sound: 4
          work_animation: 37
          hit_after_frames: 4
          recover_frames: 30
  # src/trn2: the dump (map 0xa5), instance 8.
  - map: gomi02
    place: trn2
    courses:
      # trn2_mp.c: walks (animation 2) through (0x3e5, 0x76) to the post and meditates (0xc); animFrame <= frameCount
      # always holds, so the pose restarts every frame. No objects or sound loop.
      - id: mp
        choice: 4
        slot_symbol: 2
        machine: { x: 1434, z: -283 }
        spot: { x: 1784, z: 466 }
        camera_speed: 10
        cycle_frames: 1200
        rest_frames: 20
        sounds: { start: 9, end: 10 }
        animations: { walk: 2, done: 18 }
        mp:
          waypoint: { x: 997, z: 118 }
          facing: 1024
          objects: { first: 0, count: 0 }
          hidden: { first: 0, count: 0 }
          shown: { first: 0, count: 0 }
          head_lift: 0
          work_animation: 12
          restart_work: true
          leave_animation: 2
