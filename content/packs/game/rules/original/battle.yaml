# Times that in the original come from each model's animations and the map collision, not from a table. In the game,
# with the models, the duration of the attack, the hit, the block and the faint and the step when walking come from the
# animations (their root motion) and each move's flight from its effect script; these values, averages and
# approximate, are left for the simulation and the tests, without models. The UI may replace them.
timing:
  attack_frames: 30
  hit_frame: 12
  hit_reaction_frames: 20
  block_animation_frames: 15
  faint_frames: 40
  # Walking speed in battle and of projectiles, in units per frame.
  walk_speed: 22
  projectile_speed: 60
  # Without camera or map (the simulation, the tests), the fight stays inside this radius around where it
  # started; on the map the combat area rules.
  arena_radius: 2400
  # map.c: entityCheckCollision: no step leaves the combat area, a rectangle of 280 x 200 pixels around
  # the center of the original screen; it tests the fighter's lower-left corner on the ground and the
  # right one at this height.
  combat_area_width: 280
  combat_area_height: 200
  combat_area_corner_height: 200
  # battle_setup.c: BTL_handleBattleIntro: while the banner forms, the tamer runs (animation 3, 50 units per
  # frame; his radius, DIGIMON_DATA[0].radius, is the box of the area test) along his way back and then
  # toward the cell he entered the map by, until reaching it or until his step leaves the combat area: of
  # 310 x 230 pixels along the way and 300 x 220 on the last stretch.
  retreat_step: 50
  retreat_radius: 100
  retreat_trail_area_width: 310
  retreat_trail_area_height: 230
  retreat_entry_area_width: 300
  retreat_entry_area_height: 220

# Versus fights between two players' registered partners (vs_main.c, vs_combat.c).
versus:
  # The fights of a series (VS__BATTLE_COUNTS); a series of n asks for n registered on each side.
  series: [1, 3, 5]
  # Each fight's clock in seconds (VS__combatInit: VS_addFighterCounter(99)).
  time_limit_seconds: 99
  # The arenas picked before the series (vs_select.c: VS__tickSelectMap, VS_BATTLE_SETUP.stage), by their number
  # in tournament.yaml (arena.arenas): T_TOGI, B_TOGI and E_TOGI (vs_scene.c: VS_ARENA_MODELS).
  arenas: [0, 1, 2]

# Co-op battles (an engine addition: the original has no co-op; docs/architecture/coop-difficulty.md §5): with the
# option coop_difficulty on (standard by default, hard adds hard_hp_bonus_percent to the HP), the enemies grow with the
# partners that fight, percents of the original value for 1, 2, 3 and 4 partners. Normal fights and fixed fights
# (trigger 1: story bosses) have their own table. Each player there whose partner does not fight adds helper_hp_percent
# to the HP. One partner and nobody helping: always the original numbers. Def, Speed and Brains never change, and the
# stat gains read the enemies' original stats.
coop_scaling:
  normal:
    hp_percent: [100, 180, 250, 320]
    mp_percent: [100, 150, 200, 250]
    offense_percent: [100, 100, 105, 110]
    finisher_fill_percent: [100, 125, 150, 175]
  fixed:
    hp_percent: [100, 200, 290, 370]
    # Fixed fights spend no MP.
    mp_percent: [100, 100, 100, 100]
    offense_percent: [100, 105, 110, 115]
    finisher_fill_percent: [100, 125, 150, 175]
  helper_hp_percent: 15
  hard_hp_bonus_percent: 25

# Quirks of the original (docs/reference/battle.md, "Quirks"). true reproduces the original; another ruleset turns them off.
quirks:
  # partner_impl.c: handlePostBattleTiredness divides the spent MP by the max before multiplying by 10, so it
  # almost always adds 0.
  broken_mp_tiredness: true
  # battle_tick.c: handleCommands computes the command delay by discipline and then immediately sets it to 0.
  command_delay_discarded: true
  # battle_main.c: BTL_calculateHitChance: with the partner sick everybody hits, including against the enemies.
  sickness_always_hits: true
  # battle_setup.c: BTL_initializeCombat: with intelligence 500 or more, attack and moderate disappear from the menu.
  smart_menu_drops_attack_and_moderate: true
  # battle_main.c: BTL_tickAttackHits: the counterattack spends no MP but requires having 165.
  counter_needs_mp: true
  # battle_main.c: BTL_selectPartnerMove: in the low-life branch the inner loop reuses the outer index and
  # looks at the slot and not the sorted move.
  low_hp_weights_loop_bug: true
  # battle_main.c: BTL_calculateTargetScore: it scores with its own life and defense, not the target's.
  target_score_uses_own_stats: true
  # battle_main.c: BTL_getWeakestEnemy returns the score of the last enemy it looked at, not the weakest one's, and with
  # it decides whether to switch targets.
  weakest_reports_last_score: true
  # battle_main.c: BTL_tickStatusEffects: anyone's confusion is only removed when the partner is not attacking.
  confusion_waits_for_partner_attack: true
  # battle_main.c: BTL_setupMoveExecution: in scripted fights enemies spend no MP.
  scripted_enemies_free_mp: true
  # battle_ui.c: handleBattleEndBox: the injury roll after winning is made if anyone took a hit in the fight
  # (HAS_TAKEN_DAMAGE), not just the partner.
  injury_counts_any_hit: true
  # btl.c: handleBattleStart: in scripted fights the roll is 0, so every visible enemy joins.
  scripted_battle_everyone_joins: true
  # battle_main.c: BTL_isMoveUsable discounts by intelligence before adding the sickness, and BTL_setupMoveExecution the
  # other way around, so the checked cost and the paid one can differ by one.
  mp_check_and_payment_round_differently: true
