# Tiempos que en el original marcan las animaciones de cada modelo y la colisión del mapa, no una tabla. En el juego,
# con los modelos, la duración del ataque, del golpe, del bloqueo y del desmayo y el paso al andar salen de las
# animaciones (su movimiento de raíz) y el vuelo de cada técnica de su script de efecto; estos valores, medios y
# aproximados, quedan para la simulación y las pruebas, sin modelos. La interfaz puede sustituirlos.
timing:
  attack_frames: 30
  hit_frame: 12
  hit_reaction_frames: 20
  block_animation_frames: 15
  faint_frames: 40
  # Velocidad de andar en batalla y de los proyectiles, en unidades por fotograma.
  walk_speed: 22
  projectile_speed: 60
  # Sin cámara ni mapa (la simulación, las pruebas), el combate se queda dentro de este radio alrededor de donde
  # empezó; en el mapa manda el área de combate.
  arena_radius: 2400
  # map.c: entityCheckCollision: ningún paso sale del área de combate, un rectángulo de 280 x 200 píxeles alrededor
  # del centro de la pantalla original; prueba la esquina de abajo a la izquierda del luchador en el suelo y la de la
  # derecha a esta altura.
  combat_area_width: 280
  combat_area_height: 200
  combat_area_corner_height: 200
  # battle_setup.c: BTL_handleBattleIntro: mientras se forma el rótulo, el domador corre (animación 3, 50 unidades por
  # fotograma; su radio, DIGIMON_DATA[0].radius, es la caja de la prueba del área) por su camino de vuelta y luego
  # hacia la celda por la que entró al mapa, hasta llegar a ella o hasta que su paso salga del área de combate: de
  # 310 x 230 píxeles por el camino y de 300 x 220 en el último tramo.
  retreat_step: 50
  retreat_radius: 100
  retreat_trail_area_width: 310
  retreat_trail_area_height: 230
  retreat_entry_area_width: 300
  retreat_entry_area_height: 220

# Rarezas del original (docs/reference/battle.md, "Rarezas"). true reproduce el original; otro ruleset las apaga.
quirks:
  # partner_impl.c: handlePostBattleTiredness divide el MP gastado entre el máximo antes de multiplicar por 10, así que
  # casi siempre suma 0.
  broken_mp_tiredness: true
  # battle_tick.c: handleCommands calcula el retraso de la orden por disciplina y acto seguido lo pone a 0.
  command_delay_discarded: true
  # battle_main.c: BTL_calculateHitChance: con el partner enfermo acierta todo el mundo, también contra los enemigos.
  sickness_always_hits: true
  # battle_setup.c: BTL_initializeCombat: con inteligencia 500 o más, atacar y moderado desaparecen del menú.
  smart_menu_drops_attack_and_moderate: true
  # battle_main.c: BTL_tickAttackHits: el contraataque no gasta MP pero exige tener 165.
  counter_needs_mp: true
  # battle_main.c: BTL_selectPartnerMove: en la rama de poca vida el bucle interno reutiliza el índice externo y
  # mira la ranura y no la técnica ordenada.
  low_hp_weights_loop_bug: true
  # battle_main.c: BTL_calculateTargetScore: puntúa con la vida y la defensa propias, no las del objetivo.
  target_score_uses_own_stats: true
  # battle_main.c: BTL_getWeakestEnemy devuelve la puntuación del último enemigo que miró, no la del más débil, y con
  # ella decide si cambia de objetivo.
  weakest_reports_last_score: true
  # battle_main.c: BTL_tickStatusEffects: la confusión de cualquiera solo se quita cuando el partner no está atacando.
  confusion_waits_for_partner_attack: true
  # battle_main.c: BTL_setupMoveExecution: en combates de guion los enemigos no gastan MP.
  scripted_enemies_free_mp: true
  # battle_ui.c: handleBattleEndBox: la tirada de lesión tras ganar se hace si alguien recibió un golpe en el combate
  # (HAS_TAKEN_DAMAGE), no solo el partner.
  injury_counts_any_hit: true
  # btl.c: handleBattleStart: en combates de guion la tirada vale 0, así que se une todo enemigo visible.
  scripted_battle_everyone_joins: true
  # battle_main.c: BTL_isMoveUsable descuenta por inteligencia antes de sumar la enfermedad, y BTL_setupMoveExecution al
  # revés, así que el coste comprobado y el pagado pueden diferir en uno.
  mp_check_and_payment_round_differently: true
