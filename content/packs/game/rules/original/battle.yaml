# Battle (docs/reference/battle.md). Times are in battle frames (20 per second, the frames_per_second of
# clock.yaml: the game clock stops during combat); distances are in world units, and the ones the
# original compares squared carry _squared in the name. Percentages go from 0 to 100. The per-move and
# per-Digimon tables (MOVE_DATA, DIGIMON_DATA, MOVE_LEARN_CHANCES) are the base pack's (tables: in ruleset.yaml).

# The rules that are logic, by name (docs/architecture/rulesets.md, "Strategies").
strategies:
  # battle_main.c: BTL_selectPartnerMove, BTL_selectFighterTarget, BTL_selectMoveByPower, BTL_selectMoveByMpCost.
  partner_ai: original
  # battle_main.c: BTL_selectEnemyMove, BTL_tickEnemyAI.
  enemy_ai: original
  # battle_main.c: BTL_calculateDamage, BTL_calculateHitChance.
  damage: original
  # battle_main.c: BTL_tickPartnerAI, BTL_tickEnemyAI (disobedience), BTL_retargetAfterHit; battle_tick.c:
  # handleCommands (command delay).
  obedience: original

# battle_main.c: pending damage and MP, and the stat caps.
limits:
  # btl.c: handleBattleStart: at most 3 enemies.
  max_enemies: 3
  # battle_main.c: BTL_tickAttackHits: the pending damage pool never goes above 9999.
  pending_damage_cap: 9999
  # battle_main.c: BTL_buffStats: addWithLimit(stat, value, 999); BTL_calculateTargetScore measures defense out of 999.
  stat_cap: 999

# utils.c: damageTick: every frame, the pending damage pool drops in steps, from the highest to the lowest, and what it
# drops is subtracted from life.
damage_tick:
  - { above: 999, amount: 900 }
  - { above: 99, amount: 80 }
  - { above: 9, amount: 6 }
  - { above: 0, amount: 1 }

# Specialty affinity. Specialties: 0 fire, 1 battle, 2 air, 3 nature, 4 ice, 5 machine, 6 filth.
affinity:
  # TYPE_FACTORS (US 0x80125F70): row = the move's specialty, column = the defender's specialty, in tenths.
  factors:
    - [10, 15, 5, 20, 20, 15, 20]
    - [10, 10, 2, 15, 10, 10, 5]
    - [15, 15, 15, 5, 15, 15, 5]
    - [5, 15, 20, 10, 10, 5, 15]
    - [20, 15, 5, 15, 10, 15, 20]
    - [10, 10, 5, 10, 10, 10, 5]
    - [5, 15, 5, 2, 10, 20, 2]
  # battle_main.c: BTL_calculateDamage: an empty specialty slot counts as 10 (x1).
  empty_slot: 10
  # battle_main.c: BTL_calculateElementBonus: what each affinity adds to a move's weight when choosing it.
  move_weight_bonus: { 20: 10, 15: 7, 10: 5, 5: 3, 2: 1 }
  # battle_main.c: BTL_calculateTargetScore: the inverted affinity that scores a target (low = preferred).
  target_score: { 20: 2, 15: 5, 10: 10, 5: 15, 2: 20 }

# Moves: the MOVE_DATA index blocks and the moves with their own rules.
moves:
  # battle_main.c: BTL_isMoveUsable, BTL_setupMoveExecution: the stored cost is multiplied by 3.
  mp_cost_multiplier: 3
  # battle_main.c: moves 0x3A to 0x70 are finishers; the ones below 0x3A can be learned.
  finisher_first_index: 58
  finisher_last_index: 112
  learnable_below_index: 58
  # battle_main.c: move 0x2D is the counterattack.
  counter: counter
  # battle_main.c: BTL_tickFlatState: a flattened fighter only fires move 0x79.
  flattened_shot: move_121
  # battle_main.c: BTL_setupMoveExecution: using a move subtracts its power from the speed pool, which never goes below
  # -155.
  speed_reserve_floor: -155
  # battle_main.c: BTL_startQueuedMove: a move with flag bit 1 blocks all the others that have it for
  # 110 frames.
  shared_cooldown_frames: 110
  # battle_main.c: BTL_applyBuffMove: support moves raise stats by a percentage during the fight.
  buffs:
    - { move: muscle_charge, offense: 30, defense: 0, speed: 0 }
    - { move: war_cry, offense: 10, defense: 5, speed: 10 }
    - { move: mass_morph, offense: 0, defense: 20, speed: 10 }
    - { move: aqua_magic, offense: 7, defense: 8, speed: 7 }
    - { move: full_potential, offense: 25, defense: 15, speed: 15 }
  # battle_setup.c: BTL_initializeCombat: support move uses per fight: intelligence / 100 + 1 below
  # 400, 4 below 600 and 5 from there.
  buff_uses:
    per_brain: 100
    base: 1
    tiers:
      - { brain: 400, uses: 4 }
      - { brain: 600, uses: 5 }
  # utils2.c: learnMove: these pairs are learned together.
  learned_together:
    - [dynamite_kick, dynamite_kick_48]
    - [horizontal_kick, horizontal_kick_57]
  # utils2.c: entityGetTechFromAnim: a fighter's technique is its species row's move at the clip's slot, but
  # H-Kabuterimon's clip 0x3C (slot 14) is High Electro Shocker where the row says Electro Shocker. The species table
  # loads with these, so every fighter of the species (wild, story, cup rival, partner, versus) uses them.
  slot_techniques:
    - { species: hkab, slot: 14, move: high_electro_shocker }

# The speed pool (battle_main.c: BTL_increaseSpeedBuffer).
speed_reserve:
  # battle_setup.c: BTL_initializeCombat: starts full.
  start: 100
  cap: 100
  # Every 2 frames it gains speed / 100 + 1.
  gain_every_frames: 2
  gain_per_speed: 100
  gain_base: 1

# Charge modes and pauses (battle_main.c: BTL_applyChargeRequirement, BTL_tickChargeState,
# BTL_tickFighterAction).
pacing:
  # battle_main.c: BTL_tickFighterAction: pause after each attack.
  after_attack_frames: 40
  # battle_main.c: BTL_setFighterCooldown: pause when it cannot afford any move, or the empty slot comes up.
  no_move_frames: 80
  # battle_main.c: BTL_tickRangedAttack: if it does not reach its distance in 80 frames, it fires anyway.
  ranged_patience_frames: 80
  # battle_main.c: BTL_tickRangedAttack: a ranged move's distance is accepted within ±30 %.
  ranged_band_percent: 30
  # battle_main.c: BTL_tickRangedAttack: a flattened fighter only fires on frames that are multiples of 40.
  flattened_shot_every_frames: 40
  # battle_main.c: BTL_tickFighterAction: the flattened fighter's shot goes out at 2 frames and its animation lasts 30.
  flattened_shot_frames: 30
  flattened_shot_release_frame: 2
  # battle_effect.c: BTL_addAuraProjectile, BTL_tickAuraProjectile: the shot leaves in front of the chest and moves 35 per
  # frame where it was facing; it lasts 58 frames and its box is 45 to each side and 200 up and down.
  flattened_shot_speed: 35
  flattened_shot_life_frames: 58
  flattened_shot_half_width: 45
  flattened_shot_half_height: 200

# Distances each one keeps (battle_main.c: BTL_maintainTargetDistance, BTL_getContactRangeSquared,
# BTL_handlePartnerMoveCommand).
spacing:
  # battle_main.c: BTL_getContactRangeSquared: the radii of the two plus 200.
  contact_margin: 200
  # battle_main.c: BTL_maintainTargetDistance: standing still, it moves closer if it is farther than contact + 480 000.
  standing: { near_squared: 0, far_squared: 480000 }
  # Walking, it backs off when closer than contact + 160 000 and moves closer when farther than contact + 320 000.
  walking: { near_squared: 160000, far_squared: 320000 }
  # battle_main.c: BTL_handlePartnerMoveCommand: with the distance command, outside the target's longest reach
  # plus 640 000, and 160 000 more while walking.
  keep_away_margin_squared: 640000
  keep_away_walking_squared: 160000

# Obedience (battle_main.c: BTL_tickPartnerAI, BTL_tickEnemyAI, BTL_retargetAfterHit; battle_tick.c: handleCommands).
obedience:
  # It only disobeys with intelligence below 301.
  brain_below: 301
  # It rolls every (intelligence / 2 + 1) x 20 frames.
  roll_brain_divisor: 2
  roll_period_frames: 20
  # Partner: (70 - discipline) %.
  partner_chance_base: 70
  # Enemy: (300 - intelligence) / 4 %.
  enemy_chance_brain: 300
  enemy_chance_divisor: 4
  # It stands still for 100 frames.
  idle_frames: 100
  # battle_main.c: TARGET_ATTACKER_CHANCE: chance (minus discipline) that the partner turns toward whoever hit it,
  # by charge mode (aggressive, normal, cautious, none).
  retarget_chances: [70, 40, 30, 0]
  # battle_main.c: BTL_selectFighterTarget: an enemy follows whoever hit it with 71 % (otherwise it goes for the partner).
  enemy_follow_attacker_percent: 71
  # battle_tick.c: handleCommands: command delay: with discipline below 70, 160 - discipline / 10
  # frames; otherwise, (10 - discipline / 10) x 10.
  command_delay:
    low_discipline_below: 70
    low_base: 160
    low_divisor: 10
    high_base: 10
    high_divisor: 10
    high_scale: 10

# Player commands (battle_setup.c: BTL_initializeCombat, BRAIN_TO_COMMAND_MAP). The menu of each intelligence
# tier, in order. `techniques` are the commands of the equipped moves (from the third to the first), only
# the ones that have a move.
commands:
  menus:
    - { brain: 0, commands: [finisher, flee, your_call] }
    - { brain: 100, commands: [finisher, flee, attack, your_call] }
    - { brain: 200, commands: [finisher, flee, moderate, attack, your_call] }
    - { brain: 300, commands: [finisher, flee, change, distance, moderate, attack, your_call] }
    - { brain: 400, commands: [finisher, flee, change, defend, distance, moderate, attack, your_call] }
    - { brain: 500, commands: [finisher, flee, change, defend, distance, techniques, your_call] }
  # Menus of a versus fight by intelligence (vs_combat.c: VS__combatInit, VS__COMMANDS):
  # no run and no target switch. Measured: intelligence 300 gives [finisher, distance, moderate,
  # attack, your_call]; 600 without a third move gives [finisher, defend, distance, move 2,
  # move 1, your_call].
  versus_menus:
    - { brain: 0, commands: [finisher, your_call] }
    - { brain: 100, commands: [finisher, attack, your_call] }
    - { brain: 200, commands: [finisher, moderate, attack, your_call] }
    - { brain: 300, commands: [finisher, distance, moderate, attack, your_call] }
    - { brain: 400, commands: [finisher, defend, distance, moderate, attack, your_call] }
    - { brain: 500, commands: [finisher, defend, distance, techniques, your_call] }

# Partner AI (battle_main.c: BTL_selectPartnerMove, BTL_selectFighterTarget).
partner_ai:
  # Intelligence from which it prefers enemies with a status ailment and compares scores.
  status_target_brain: 300
  # It only switches to a target that scores at least 40 less than the current one.
  switch_margin: 40
  # Intelligence from which it picks the target by score; below it, the nearest.
  scored_target_brain: 150
  # Weights per slot: BTL_YOUR_CALL_POWER_PRIO, BTL_YOUR_CALL_MP_PRIO, BTL_YOUR_CALL_WIDE_PRIO.
  power_weights: [50, 20, 5, 0]
  mp_weights: [50, 20, 10, 0]
  reach_weights: [10, 5, 0, 0]
  # In normal mode, each usable move weighs 20; an empty slot weighs 5.
  even_weight: 20
  empty_slot_weight: 5
  # Area moves: with intelligence 200 or more and at least 2 living enemies, + 10 or 15 per enemy depending on the mode.
  area_brain: 200
  area_min_enemies: 2
  area_weight_per_enemy: [10, 15, 15]
  # In cautious mode, with less than 31 % life, the move's reach weighs in.
  low_hp_percent: 31
  # battle_setup.c: BTL_initializeCombat: the priority counter of support moves starts at
  # intelligence / 10 + 5 and drops 1 every 20 frames (BTL_tickEnemyAI).
  buff_priority_brain_divisor: 10
  buff_priority_base: 5
  buff_priority_decay_frames: 20
  # battle_main.c: BTL_selectConfusedMove: when confused, 70 % of the time it attacks the air.
  confused_air_percent: 70
  # battle_main.c: BTL_tickConfusedState: while attacking the air, each frame has a 5 % chance of letting the blow go.
  confused_swing_percent: 5
  # battle_main.c: BTL_confusedRotate: every frame, with 8 or 9 out of 10, it turns up to 45 degrees.
  confused_turn_roll: 10
  confused_turn_from: 8

# Enemy AI (battle_main.c: BTL_selectEnemyMove).
enemy_ai:
  # An area move adds 20 if another enemy is still alive.
  area_weight: 20
  # In a cup fight (std_main.c: STD_tickEnemyAI) the rival is cautious (mode 2) with 1 in 10 on each decision;
  # otherwise, offensive or normal (0 or 1).
  match_cautious_roll: 10

# Hit, block and counterattack (battle_main.c: BTL_calculateHitChance, BTL_tickAttackHits).
hit:
  # Always hits against a Fresh or In-Training Digimon (level below 3).
  always_hit_below_level: 3
  # x = accuracy / 2 x (defender speed - attacker speed / 10) / 999.
  accuracy_divisor: 2
  attacker_speed_divisor: 10
  speed_scale: 999
  # x 6 / 5 if the defender is standing still.
  standing_evasion_percent: 120
  # Blocking gives 3 frames without being able to take another hit.
  block_frames: 3
  # A blocked melee attack still does 10 to 30 % of the damage.
  blocked_melee_min_percent: 10
  blocked_melee_max_percent: 30
  # Counterattacks with probability speed / level % if it has at least 165 MP.
  counter_min_mp: 165
  # A hit of at least 20 % of the partner's max life counts as a strong hit (for the gains).
  big_hit_percent: 20

# Damage (battle_main.c: BTL_calculateDamage).
damage:
  # The sum of the three affinities is divided by 30.
  affinity_divisor: 30
  # diff = attack - defense, between -500 and 500; damage = power + diff x power / 500.
  difference_cap: 500
  power_scale: 500
  # x random(90..110) / 100.
  variance_min: 90
  variance_max: 110
  # The counterattack uses 30 % of the defense.
  counter_defense_percent: 30
  # Partner finisher: x charge / 40 if the charge is over 40.
  finisher_charge_divisor: 40
  # Enemy finisher: x random(100..200) / 100.
  enemy_finisher_min: 100
  enemy_finisher_max: 200
  min: 1
  max: 9999
  # dwe improvement (not in the original): the damage of the partner's hits and of the hits it takes, as a percentage
  # of the formula's, before the minimum and the maximum. 100 is the original; easy difficulty changes them
  # (difficulty.yaml).
  partner_dealt_percent: 100
  partner_taken_percent: 100

# Status ailments (battle_main.c: BTL_applyMoveStatus, BTL_tickStatusEffects).
status:
  # Poison: every 100 frames it removes 1 to 3 % of max life.
  poison_every_frames: 100
  poison_min_percent: 1
  poison_max_percent: 3
  # Confusion: 200 to 300 frames.
  confusion_min_frames: 200
  confusion_max_frames: 300
  # Stun: 200 to 240 frames.
  stun_min_frames: 200
  stun_max_frames: 240
  # Flat: 65 animation frames on entering and on leaving; lasts 224 to 304.
  flatten_transition_frames: 65
  flatten_min_frames: 224
  flatten_max_frames: 304

# The finisher and its bar (battle_setup.c: BTL_initializeCombat; battle_main.c: BTL_addFinisherProgress,
# BTL_tickAttackHits, BTL_startQueuedMove; command_menu.c: BTL_tickFinisherChargeup).
finisher:
  # Goal = 3000 - speed.
  goal_base: 3000
  # +1 per frame; + goal x 2 / 50 per completed attack; + goal x 3 / 50 per block; whoever sees their attack blocked,
  # + goal x 4 / 50.
  per_frame: 1
  per_attack: 2
  per_block: 3
  per_blocked_attack: 4
  progress_divisor: 50
  # The aura lasts 80 frames; each press adds 2 to the charge, up to 80.
  aura_frames: 80
  charge_per_press: 2
  charge_cap: 80

# Sick or injured partner (battle_setup.c: BTL_initializeCombat; battle_main.c: BTL_isMoveUsable,
# BTL_setupMoveExecution).
condition:
  # It loses 20 % of attack, defense, speed and intelligence.
  stat_penalty_percent: 20
  # Its moves cost 50 % more MP.
  mp_cost_extra_percent: 50
  # MP discount by intelligence, from the highest to the lowest.
  mp_discounts:
    - { brain: 999, percent: 20 }
    - { brain: 900, percent: 15 }
    - { brain: 800, percent: 10 }
    - { brain: 700, percent: 5 }

# Fleeing and defeat (battle_tick.c: handleCommands; battle_setup.c: BTL_isBattleFinished).
ending:
  # After the run command, the fight ends at 41 frames and hits stop counting at 19.
  flee_frames: 41
  flee_ignores_hits_from: 19
  # After falling, the partner can still revive with an item for 171 frames; the count shows at 20.
  revive_frames: 171
  revive_countdown_shown_at: 20
  # When fleeing, the screen fades to black in 20 frames from frame 20 (fadeToBlack(0x14)), and
  # the player runs toward the exit they came in by: 3000 units behind their spawn point (handleFleeing).
  flee_fade_from: 20
  flee_fade_frames: 20
  flee_way_out: 3000

# The item the tamer throws (main.c: startThrowingItem, tickThrownItem): it leaves the hand on frame 7 of the
# throw animation (which the item sees one frame ahead) and flies 24 steps; the last one leaves it on the partner
# (time >= 0x18), always: measured, 29 frames after throwing it. While it flies, the defeat countdown stops
# (battle_setup.c: BTL_isBattleFinished).
item_throw:
  release_frame: 7
  flight_frames: 24

# An enemy's HP bar (battle_main.c: BTL_renderEnemyHPBars): it shows when taking damage and hides after
# 21 frames (0x15) with no hit reaction and no pending damage.
hud:
  enemy_hp_bar_frames: 21
  # battle_ui.c: createPostBattleStatsBox: the final box waits 100 frames before counting the parameters, one point
  # per frame (POST_BATTLE_STATS_TIMER).
  end_count_delay_frames: 100
  # battle_hud.c: BTL_drawBattleEndText: each line of the final box waits 60 frames or a button
  # (BATTLE_END_WAIT_FRAMES).
  end_wait_frames: 60

# Consequences for care (tamer.c: startBattle, advanceBattleTime; partner_impl.c: handlePostBattleTiredness;
# battle_ui.c: handleBattleInjury). This section owns these numbers: the partner receives them from the battle
# (Partner::applyBattle). The items lost on defeat belong to the inventory section (defeat.lost_percent).
consequences:
  victory: { happiness: 2, discipline: 0, tiredness: 0, battles: 1 }
  flee: { happiness: -10, discipline: -6, tiredness: 2, battles: 0 }
  defeat: { happiness: -30, discipline: -20, tiredness: 0, battles: 0 }
  # After winning or fleeing: tiredness +5 and food -15; more tiredness if MP ended below 80 %.
  after_battle_tiredness: 5
  after_battle_food: -15
  mp_tiredness_below_percent: 80
  mp_tiredness_scale: 10
  # After losing: a life is lost (script_interp.c: SCRIPT_OP_START_BATTLE).
  defeat_lives: 1
  # Each fight advances the clock 20 minutes.
  elapsed_minutes: 20

# Rewards (battle_ui.c: battleStatsGainsAndDrops, handleBattleEndBox, battleMoveLearning).
rewards:
  # STAT_GAIN_ENEMY_FACTORS: the factor by number of enemies (1, 2 or 3).
  enemy_factors: [10, 12, 16]
  # The gain is divided by the partner's stat x 10.
  partner_scale: 10
  # Roll for +1 on a stat that gained nothing: HP, % of life lost; MP and attack, 10 x attacks; defense, 10 x strong
  # hits; speed, 10 x blocks + half the % of life lost; intelligence, 5 x attacks + 5 x strong hits.
  fallback:
    hp_lost_percent: 100
    attacks: 10
    big_hits: 10
    blocks: 10
    speed_hp_lost_percent: 50
    brain_attacks: 5
    brain_big_hits: 5
  # battle_ui.c: battleStatsGainsAndDrops: on screen 0x8F no items are dropped.
  no_drop_maps: [ogre11]
  # battle_main.c: BTL_setupMoveExecution: up to 12 enemy moves are recorded.
  tracked_moves: 12

# Enemies that join the fight at the start (btl.c: handleBattleStart).
joining:
  # FLEE_CHANCES (US 0x8012BB14): row = partner type, column = enemy type (data, vaccine, virus).
  chances:
    - [60, 70, 100]
    - [80, 60, 100]
    - [90, 100, 30]
  # A partner with no type: 70 %.
  untyped_chance: 70
  # Wearing Enemy bell subtracts 50 from the roll (more join); otherwise, Enemy repel adds 20 (fewer join).
  bell_item: enemy_bell
  bell_roll: -50
  repel_item: enemy_repel
  repel_roll: 20
  # isScreenConcave (CONCAVE_SCREENS, US 0x8012BB20): on these maps nobody joins who has a wall in the straight line
  # (map.c: isLinearPathBlocked) from the player or from the partner.
  concave_maps: [mgen01, mgen02, mgen03, mgen04, mgen05, mgen11, mgen12, mgen13, mgen06, mgen07, mgen08, mgen09, mgen10,
                 fact09, frzl13, mayo03, trop02, icsa05]

