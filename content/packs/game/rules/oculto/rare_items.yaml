# Rare items (optional engine improvement, the "Rare items" option, off by default;
# docs/modules/game/evolution.md, "Rare evolution items"). When a map loads, each spot where its header
# rolls a random item has chance_percent in 100 of dropping one from the pool instead of its own. An item does not come up
# while it is in the bag or already on the ground; once used, it can come up again. With the hidden content only the
# partner form of this pool's item is reachable; the other needs the Mega step (oculto_mega/rare_items.yaml).
chance_percent: 1
pool: ["game:blood_moon"]
maps:
  trop06:
    # The forest of the archer challenge (script 18, section 0x00fe): its seven spots. The header stops placing
    # items with trigger 236.
    unless_trigger: 236
    spots: [[33, 49], [49, 53], [67, 42], [34, 29], [50, 34], [49, 18], [65, 22]]
