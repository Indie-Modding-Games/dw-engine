# Parches por especie sobre las tablas del disco (docs/architecture/rulesets.md, «Parches por especie»). Son números
# de diseño nuestros, no datos del juego: requisitos con el formato de EVOLUTION_REQS (stats mínimos, errores de
# cuidado, peso ± margen y un punto extra; aprueba con 3 de 4), una puerta que el original no tiene (si no se cumple,
# el destino ni puntúa) y la celda del árbol (píxeles del árbol; icono prestado de otra especie con otra paleta).
# Cada destino nuevo toma la primera ranura libre de `to` tras el último destino del origen, así que en un empate
# gana el destino del original.
species:
  # Panjyamon (Campeón): el discípulo del rey bestia. Puerta: Leomon vive en la ciudad (disparador 200 + 48).
  panj:
    requirement:
      from: penm
      offense: 150
      defense: 100
      speed: 120
      care: 2
      care_is_maximum: true
      weight: 25
      techs: 30
    gate: { triggers: [248] }
    evolves_from: [elec, penm]
    # Los destinos de Leomon.
    evolves_to: [andr, mame]
    chart: { x: 189, y: 176, icon: leom, palette: 2 }
  # Gigadramon (Ultra). Puerta: la Copa Metálica (copa 16 de data/tournaments) ganada alguna vez; los torneos la
  # apuntan con el disparador 15 + copa (TournamentAdapter::cupWon).
  ggdr:
    requirement:
      hp: 400
      mp: 400
      offense: 500
      defense: 400
      speed: 300
      brains: 300
      care: 5
      care_is_maximum: true
      weight: 60
      battles: 60
    gate: { cup: 16 }
    evolves_from: [tyra, devi, aird, sead]
    chart: { x: 274, y: 176, icon: mgdr, palette: 1 }
  # MetalEtemon (Ultra; Mega con el paso Ultra → Mega). Puerta: Etemon vencido, que se une a la ciudad (200 + 42).
  mtet:
    requirement:
      from: scum
      offense: 500
      speed: 500
      brains: 400
      care: 0
      care_is_maximum: true
      weight: 20
      battles: 100
    gate: { triggers: [242] }
    evolves_from: [scum, nume]
    # La tercera columna de Ultra (el árbol se ensancha).
    chart: { x: 298, y: 81, icon: etem, palette: 2 }
  # Myotismon (Ultra), que el disco solo trae como jefe: filas diseñadas (ganancias, crianza copiada de Devimon con la
  # carne de comida favorita), el remate de Devimon (death_claw) en su primera ranura vacía y los puntos de lanzamiento
  # de Devimon. Puerta: Myotismon rescatado en el laboratorio de la Mansión de Grey Lord (disparador 129) y solo de
  # noche (20 a 6).
  vand:
    requirement:
      mp: 500
      speed: 400
      brains: 500
      care: 5
      care_is_maximum: true
      weight: 30
      discipline: 80
    gate: { triggers: [129], hours: { from: 20, to: 6 } }
    evolves_from: [devi, bake]
    stats_gains: { hp: 6000, mp: 7000, offense: 600, defense: 500, speed: 700, brains: 700 }
    raise: { copy: devi, favorite_food: meat }
    moves: [death_claw]
    effect_type: devi
    # Su modelo de enemigo no tiene los clips de cuidado ni de gimnasio: cada uno juega otro suyo (id que falta: id
    # que juega). Andar mal anda; contento celebra; descontento, rechazar y el enfurruñado de siempre se enfurruñan;
    # comer es su técnica 0; dormir, el baño y los estados se quedan quietos de mal humor; acostarse cae; tras el baño
    # o el regaño encaja un golpe; cansado es el cansancio del combate; los gimnasios usan la guardia y el bloqueo; su
    # remate (técnica 5) juega su técnica 0.
    clips: { 3: 2, 5: 42, 7: 19, 8: 46, 9: 1, 10: 1, 11: 43, 12: 41, 13: 19, 14: 1, 15: 1, 16: 1, 17: 1, 18: 34,
             21: 33, 22: 33, 23: 36, 24: 36, 25: 36, 27: 37, 51: 46 }
    chart: { x: 298, y: 100, icon: devi, palette: 2 }

# Premios de más por copa ganada, que los torneos suman a los de tournament.yaml (mismo formato: copa y objeto por su
# número en data/tournaments y data/items), así que este ruleset no copia la sección de torneos del original. El
# objeto que el disco tiene para cada forma nueva: Noble Mane en la Copa Animal (20, grado Z), Giga Hand en la Copa
# Metálica (16, grado M) y Metalbanana en la Copa Basura (17, grado T).
extra_prizes:
  - { cup: 20, item: 126 }
  - { cup: 16, item: 125 }
  - { cup: 17, item: 127 }
