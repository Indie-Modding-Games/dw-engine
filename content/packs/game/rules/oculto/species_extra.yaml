# Per-species patches over the disc tables (docs/architecture/rulesets.md, "Per-species patches"). These are our own
# design numbers, not game data: requirements in the EVOLUTION_REQS format (minimum stats, care
# mistakes, weight ± margin and one extra point; passes with 3 of 4), a gate the original does not have (if it is not met,
# the target does not even score) and the tree cell (tree pixels; icon borrowed from another species with another palette).
# Each new target takes the first free `to` slot after the origin's last target, so in a tie
# the original's target wins.
species:
  # Panjyamon (Champion): the disciple of the beast king. Gate: Leomon lives in the city (trigger 200 + 48).
  panj:
    requirement:
      from: penm
      offense: 150
      defense: 100
      speed: 120
      care: 2
      care_is_maximum: true
      weight: 25
      techs: 30
    gate: { triggers: [248] }
    evolves_from: [elec, penm]
    # Leomon's targets.
    evolves_to: [andr, mame]
    chart: { x: 189, y: 176, icon: leom, palette: 2 }
  # Gigadramon (Ultimate). Gate: the Metalic Cup (cup 16 of data/tournaments) won at some point; the tournaments
  # record it with trigger 15 + cup (TournamentAdapter::cupWon).
  ggdr:
    requirement:
      hp: 400
      mp: 400
      offense: 500
      defense: 400
      speed: 300
      brains: 300
      care: 5
      care_is_maximum: true
      weight: 60
      battles: 60
    gate: { cup: 16 }
    evolves_from: [tyra, devi, aird, sead]
    chart: { x: 274, y: 176, icon: mgdr, palette: 1 }
  # MetalEtemon (Ultimate; Mega with the Ultimate → Mega step). Gate: Etemon defeated, who joins the city (200 + 42).
  mtet:
    requirement:
      from: scum
      offense: 500
      speed: 500
      brains: 400
      care: 0
      care_is_maximum: true
      weight: 20
      battles: 100
    gate: { triggers: [242] }
    evolves_from: [scum, nume]
    # Outside the Ultimate grid: the tree puts it in a free slot of the box, or on the next page.
    chart: { x: 298, y: 81, icon: etem, palette: 2 }
  # Myotismon (Ultimate), which the disc only has as a boss: designed rows (gains, raising copied from Devimon with the
  # favorite food meat), Devimon's finisher (death_claw) in its first empty slot and Devimon's launch points.
  # Gate: Myotismon rescued in the lab of Grey Lord's Mansion (trigger 129) and only at
  # night (20 to 6).
  vand:
    requirement:
      mp: 500
      speed: 400
      brains: 500
      care: 5
      care_is_maximum: true
      weight: 30
      discipline: 80
    gate: { triggers: [129], hours: { from: 20, to: 6 } }
    evolves_from: [devi, bake]
    stats_gains: { hp: 6000, mp: 7000, offense: 600, defense: 500, speed: 700, brains: 700 }
    raise: { copy: devi, favorite_food: meat }
    moves: [death_claw]
    effect_type: devi
    # Its enemy model does not have the care or gym clips: each one plays another of its own (missing id: id
    # it plays). Walking badly walks; happy celebrates; unhappy, refuse and the usual sulk all sulk;
    # eating is its technique 0; sleeping, the potty and the status effects stay still in a bad mood; lying down falls; after the potty
    # or the scolding it takes a hit; tired is the battle tiredness; the gyms use the guard and the block; its
    # finisher (technique 5) plays its technique 0.
    clips: { 3: 2, 5: 42, 7: 19, 8: 46, 9: 1, 10: 1, 11: 43, 12: 41, 13: 19, 14: 1, 15: 1, 16: 1, 17: 1, 18: 34,
             21: 33, 22: 33, 23: 36, 24: 36, 25: 36, 27: 37, 51: 46 }
    chart: { x: 298, y: 100, icon: devi, palette: 2 }

# Extra prizes per cup won, which the tournaments add to those of tournament.yaml (same format: cup and item by its
# number in data/tournaments and data/items), so this ruleset does not copy the tournaments section of the original. The
# item the disc has for each new form: Noble Mane in the Animal Cup (20, grade Z), Giga Hand in the Metalic
# Cup (16, grade M) and Metalbanana in the Filth Cup (17, grade T).
extra_prizes:
  - { cup: 20, item: 126 }
  - { cup: 16, item: 125 }
  - { cup: 17, item: 127 }
