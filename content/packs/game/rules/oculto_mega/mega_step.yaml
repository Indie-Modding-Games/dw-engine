# The Ultimate → Mega step (docs/architecture/rulesets.md, "Mega step"). Our own design numbers: an Ultimate checks at
# 120 hours with the usual score; reaching Mega gives 72 hours of life and raises the Tamer level. In the
# other rules a Mega still counts as level 5.
check_hours: 120
lifetime_hours: 72
tamer_level_chance: 100
mega: [mtet, muge]
species:
  # MetalEtemon comes from Etemon (not from Sukamon and Numemon) with the same requirements; the gate and the cell stay.
  mtet:
    requirement:
      from: etem
      offense: 500
      speed: 500
      brains: 400
      care: 0
      care_is_maximum: true
      weight: 20
      battles: 100
    evolves_from: [etem]
  # Machinedramon (Mega), which the disc only has as a boss: designed rows (gains, raising from Megadramon with
  # seven foods instead of six and weight 70 instead of 50). Gate: Mt. Infinity finished (trigger 50, which
  # script 184 sets after the final battle). As a partner it fights as type 3 (the boss's is 0) and its Infinity Cannon
  # hits 240 with 1 iframe; the boss keeps the table's.
  muge:
    requirement:
      hp: 800
      mp: 600
      offense: 700
      defense: 600
      speed: 400
      brains: 400
      battles: 150
      techs: 45
    gate: { triggers: [50] }
    evolves_from: [mgdr, ggdr]
    stats_gains: { hp: 9999, mp: 9999, offense: 999, defense: 900, speed: 700, brains: 800 }
    raise: { copy: mgdr, default_weight: 70, hunger_times: [2, 5, 9, 12, 16, 19, 22, -1] }
    partner_type: 3
    partner_moves:
      infinity_cannon: { power: 240, iframes: 1 }
    # Same substitutes as Myotismon (species_extra.yaml): its enemy model also lacks the care and gym clips.
    # Its finisher (technique 6) is its own.
    clips: { 3: 2, 5: 42, 7: 19, 8: 46, 9: 1, 10: 1, 11: 43, 12: 41, 13: 19, 14: 1, 15: 1, 16: 1, 17: 1, 18: 34,
             21: 33, 22: 33, 23: 36, 24: 36, 25: 36, 27: 37 }
    # It is huge (radius 400 versus Megadramon's 220): on the field it is drawn at 0.6.
    field_scale: 0.6
    chart: { x: 298, y: 119, icon: mgdr, palette: 2 }
