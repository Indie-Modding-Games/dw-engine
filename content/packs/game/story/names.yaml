# Names for the tools (mapper, remote control, logs) of the story triggers and variables
# to which the engine gives a meaning. The story runs on numbers: a name is just
# a label, an id in snake_case. Whatever is not here is shown by its number.
# docs/architecture/story-interpreter.md#q3-names-of-triggers-and-variables
triggers:
  # The four item slots of the player's page (the basic rod, the best one and two more).
  45: player_item_0
  46: player_item_1
  47: player_item_2
  48: player_item_3
  # The mist of the maps with mist goes away.
  148: mist_gone
  # The sewer mist goes away.
  341: sewer_mist_gone
  # The song that changes a map's background has already been heard.
  350: song_heard
  # The medals: 0x16c + number.
  364: medal_00
  365: medal_01
  366: medal_02
  367: medal_03
  368: medal_04
  369: medal_05
  370: medal_06
  371: medal_07
  372: medal_08
  373: medal_09
  374: medal_10
  375: medal_11
  376: medal_12
  377: medal_13
  378: medal_14
  379: medal_15
  380: medal_16
  381: medal_17
variables:
  # Cup registration: the day, the cup and the entrant.
  2: cup_entry_day
  3: cup_id
  4: cup_entrant
  # The field music: 0 is the day and night songs.
  245: music_mode
  # The two values the routine commands pass (the object or character and its animation or mood).
  247: routine_arg_a
  248: routine_arg_b
  # The species named by the card pack's line.
  249: card_pack_species
