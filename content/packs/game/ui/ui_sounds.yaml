# The sounds of the menus' cues (docs/architecture/audio.md#64-effects-in-detail): for each cue, the
# effects bank in sound/ and the sound number in it, the original's (main_menu.c: tickMenuInput plays
# playSound(0, 2) when moving the cursor, 3 when confirming and 4 when canceling; slot 0 is the ss bank).
# The original's animated windows sound when they open (ui.c: createAnimatedUIBox, playSound(0, 0)) and when they start
# to close (renderUIBoxAnim, playSound(0, 1)).
# A cue that is missing or invalid stays silent, with a warning in the log.
cursor: {bank: ss, sound: 2}
confirm: {bank: ss, sound: 3}
cancel: {bank: ss, sound: 4}
box_open: {bank: ss, sound: 0}
box_close: {bank: ss, sound: 1}
