# The UI look the game starts with until the player picks another (ui_skin setting): the id of one of
# the looks in ui/skins/ (docs/architecture/ui.md#skins). The game looks like the original unless the player
# picks another look (decided by the user, 2026-10-21). The original look asks for the pictures that dwx extracts from the
# disc; without them it is not offered and the game starts with the fallback one, the modern look.
default: original
fallback: modern
