# The text with the "original look" (the map's name when changing maps, and others later): the original-look
# family, used by the .original-look class of ui/common/base.rcss. It draws with the font that the player's
# text_font setting picks (docs/architecture/ui.md).
family: original-look
# The same font in the script's text windows and their lists (script_textbox.c: drawString2, the
# .original-dialogue class of ui/common/base.rcss): there a space advances as much as the previous glyph did, as in the original.
dialogue_family: original-look-dialogue
# The bitmap one until the player picks: the original look writes all its windows with the game's
# font (menu review QA-M08, 2026-10-30; before, the modern one by decision of 2026-10-20). The modern look does not
# use this family.
default: original
modern: Noto Sans
original:
  # The original's bitmap font, as dwx extracts it into the base pack (docs/formats/texts.md).
  atlas: font/main
  meta: font/main_meta
  # The row under the capitals' feet, from the top of the cell: the baseline.
  baseline: 10
  # The letters with accents and the signs the original does not have (á, Ñ, ü, ¿, ¡, «, »...) are composed with their own
  # glyphs when it loads (docs/architecture/ui.md). What is still missing (parentheses, other alphabets...) is drawn with
  # the modern one, on the same baseline and at this size, as a fraction of the bitmap font's line height.
  fallback_size: 1.0
