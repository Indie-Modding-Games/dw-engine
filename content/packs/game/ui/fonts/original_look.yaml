# El texto con «aspecto original» (el nombre del mapa al cambiar de mapa, y más adelante otros): la familia
# original-look, que usa la clase .original-look de ui/common/base.rcss. Dibuja con la fuente que elige el ajuste
# text_font del jugador (docs/architecture/ui.md).
family: original-look
# La misma fuente en las ventanas de texto del guion y sus listas (script_textbox.c: drawString2, la clase
# .original-dialogue de ui/common/base.rcss): ahí un espacio avanza lo que avanzó el glifo anterior, como en el original.
dialogue_family: original-look-dialogue
# La de mapa de bits hasta que el jugador elija: el aspecto original escribe todas sus ventanas con la fuente del
# juego (revisión de menús QA-M08, 2026-10-30; antes, la moderna por decisión del 2026-10-20). El aspecto moderno no
# usa esta familia.
default: original
modern: Noto Sans
original:
  # La fuente de mapa de bits del original, tal como la extrae dwx al paquete base (docs/formats/textos.md).
  atlas: font/main
  meta: font/main_meta
  # La fila bajo los pies de las mayúsculas, desde arriba de la celda: la línea base.
  baseline: 10
  # Las letras con tilde y los signos que el original no tiene (á, Ñ, ü, ¿, ¡, «, »...) se componen con sus propios
  # glifos al cargarla (docs/architecture/ui.md). Lo que sigue faltando (paréntesis, otros alfabetos...) se dibuja con
  # la moderna, en la misma línea base y a este tamaño, en fracción del alto de línea de la de mapa de bits.
  fallback_size: 1.0
