# The island map (M key), a dwe improvement: the original has no island map nor any overview picture.
# The zones are painted freehand from this data (packages/engine/ui: paintWorldMap): each zone is a center and a radius
# on a 1000 x 640 canvas with north up, the land joins the neighboring zones into a single island and the paths
# join the centers. The layout is dwe's, drawn from the maps' exits (data/maps and their warps,
# field/script_warps): zones that connect end up as neighbors.
#
# name is the main.map_names row that gives the zone's name in the player's language; places, the rows
# (MapEntry::loadingName, the name the original shows on entering) whose maps fall in the zone. A map with a
# row that is in no zone is not marked on the map.
canvas: [1000, 640]
