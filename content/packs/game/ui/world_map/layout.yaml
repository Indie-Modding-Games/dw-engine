# El mapa de la isla (tecla M), una mejora de dwe: el original no tiene mapa de la isla ni ninguna imagen de conjunto.
# Las zonas se pintan a mano alzada desde estos datos (packages/engine/ui: paintWorldMap): cada zona es un centro y un radio
# sobre un lienzo de 1000 x 640 con el norte arriba, la tierra une las zonas vecinas en una sola isla y los caminos
# unen los centros. La disposición es de dwe, dibujada a partir de las salidas de los mapas (data/maps y sus warps,
# field/script_warps): las zonas que se conectan quedan vecinas.
#
# name es el renglón de main.map_names que da el nombre de la zona en el idioma del jugador; places, los renglones
# (MapEntry::loadingName, el nombre que el original muestra al entrar) cuyos mapas caen en la zona. Un mapa con un
# renglón que no esté en ninguna zona no se marca en el mapa.
canvas: [1000, 640]
