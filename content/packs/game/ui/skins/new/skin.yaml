# The new look: the original's layout (extends original) redrawn in the UI concept's look: navy windows with a
# double light-blue line and gold corner brackets, pixel fonts, the gold ▶ cursor with a gold outline on the focused
# row, key caps for the prompts, the concept's icons and a brandless title (the island with its halo and the
# «PROJECT FOLDER» plate). The layout and the sprites it keeps come from the original skin, so like that one it needs
# the images that dwx extract takes from the user's disc: without them it is left out and the game starts with the
# fallback skin (ui/ui_skin.yaml: fallback).
#
# Each screen's sheet only changes the look (and a position where the design moves a box); the values come from the
# concept's design system (docs/architecture/ui.md#el-aspecto-new).
id: new
name: ui_skin.new
extends: original
# Yellow arrow with a black rim, as the designer drew it (hotspot at the tip); scripts/make_cursor.py redraws it.
cursor: cursor
cursor_hotspot: [1, 1]
theme: [theme]
screens:
  award_notice:
    styles: [story_textbox/style]
  bird_transport:
    styles: [bird_transport/style]
  card_shop:
    styles: [card_shop/style]
  curling_hud:
    styles: [story_textbox/style, curling_hud/style]
  destination_choice:
    styles: [panel/style, destination_choice/style]
  dev_menu:
    styles: [panel/style]
  dialog:
    styles: [panel/style, dialog/style]
  discard_menu:
    styles: [discard_menu/style]
  field_item_notice:
    styles: [story_textbox/style]
  fishing_bait:
    styles: [panel/style, fishing_bait/style]
  fishing_hud:
    styles: [fishing_hud/style]
  fishing_notice:
    styles: [panel/style, fishing_notice/style]
  gym_slots:
    styles: [panel/style, gym_slots/style]
  gym_stats:
    styles: [panel/style, gym_stats/style]
  hud:
    styles: [hud/style]
  item_keeper:
    styles: [item_keeper/style]
  jukebox:
    styles: [jukebox/style]
  main_menu:
    styles: [title/style, main_menu/style]
  merit_shop:
    styles: [merit_shop/style]
  money_box:
    styles: [money_box/style]
  naming_box:
    styles: [panel/style, naming_box/style]
  new_game_mode:
    styles: [title/style, panel/style, new_game_mode/style]
  new_game_rules:
    styles: [title/style, panel/style, new_game_rules/style]
  partner_menu:
    styles: [partner_menu/style]
  pause_box:
    styles: [pause_box/style]
  pause_menu:
    styles: [panel/style, pause_menu/style]
  save_indicator:
    styles: [save_indicator/style]
  save_machine:
    styles: [title/style, panel/style, save_machine/style]
  save_slots:
    styles: [title/style, panel/style, save_slots/style]
  shop_menu:
    styles: [panel/style, shop_menu/style]
  sleep_menu:
    styles: [panel/style, sleep_menu/style]
  story_textbox:
    styles: [story_textbox/style]
  tournament_bracket:
    styles: [tournament_bracket/style]
  tournament_schedule:
    styles: [tournament_schedule/style]
  trade_menu:
    styles: [trade_menu/style]
  world_map:
    styles: [world_map/style]
sprite_sheets:
  # Frames, cursor, key caps, tabs, bar fills and hearts of the design system, 2 pixels per dp (made from the
  # concept's theme.css values; see the skin's page in docs/architecture/ui.md).
  - name: nb-frames
    image: ui/skins/new/assets/frames
    dp_per_pixel: 0.5
    sprites:
      nb-box-outer: [0, 0, 80, 80]
      nb-box-inner: [32, 32, 16, 16]
      nb-half-outer: [80, 0, 80, 80]
      nb-half-inner: [112, 32, 16, 16]
      nb-over-outer: [160, 0, 80, 80]
      nb-over-inner: [192, 32, 16, 16]
      nb-thin-outer: [240, 0, 80, 80]
      nb-thin-inner: [272, 32, 16, 16]
      nb-row-outer: [320, 0, 40, 40]
      nb-row-inner: [332, 12, 16, 16]
      nb-ocur-outer: [0, 96, 120, 120]
      nb-ocur-inner: [52, 148, 16, 16]
      nb-brk-tl: [128, 96, 68, 68]
      nb-brk-br: [200, 96, 68, 68]
      nb-cursor: [272, 96, 36, 44]
      nb-arrow-l: [312, 96, 20, 28]
      nb-arrow-r: [336, 96, 20, 28]
      nb-arrow-u: [360, 96, 28, 20]
      nb-arrow-d: [392, 96, 28, 20]
      nb-tri-l: [312, 128, 24, 24]
      nb-tri-r: [340, 128, 24, 24]
      nb-tri-u: [368, 128, 24, 24]
      nb-tri-d: [396, 128, 24, 24]
      nb-more: [424, 96, 44, 32]
      nb-up-blue: [432, 136, 36, 32]
      nb-down-blue: [470, 136, 36, 32]
      nb-key-outer: [0, 240, 40, 76]
      nb-key-inner: [12, 252, 16, 44]
      nb-tab-outer: [48, 240, 120, 96]
      nb-tab-inner: [92, 252, 32, 72]
      nb-tab-on-outer: [176, 240, 120, 96]
      nb-tab-on-inner: [220, 252, 32, 72]
      nb-fill-hp: [304, 240, 20, 32]
      nb-fill-mp: [328, 240, 20, 32]
      nb-fill-st: [352, 240, 20, 32]
      nb-fill-gd: [376, 240, 20, 32]
      nb-fill-rd: [400, 240, 20, 32]
      nb-fill-pk: [424, 240, 20, 32]
      nb-fill-bl: [448, 240, 20, 32]
      nb-pip-pk: [304, 320, 12, 24]
      nb-pip-bl: [320, 320, 12, 24]
      nb-heart: [360, 320, 28, 24]
      nb-heart-empty: [400, 320, 28, 24]
  # The concept's icons for the field menu, owner-approved (assets/icon_sources holds the single pictures).
  - name: new-field-icons
    image: ui/skins/new/assets/menu_icons
    original_size: [896, 128]
    dp_per_pixel: 2.1333333333333333
    sprites:
      menu-partner-icon: [0, 0, 128, 128]
      menu-item-icon: [128, 0, 128, 128]
      menu-player-icon: [256, 0, 128, 128]
      menu-praise-icon: [384, 0, 128, 128]
      menu-scold-icon: [512, 0, 128, 128]
      menu-settings-icon: [640, 0, 128, 128]
      menu-sleep-icon: [768, 0, 128, 128]
