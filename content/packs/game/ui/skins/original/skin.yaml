# El aspecto original: la UI con la maquetación, los colores y las proporciones del juego original, redibujada nítida
# a cualquier resolución y adaptada a pantalla ancha (docs/architecture/ui.md#aspecto-original). Las formas (cajas,
# barras, textos) son RCSS; los iconos y sprites salen de las imágenes que dwx extract saca del disco del usuario y
# agranda x4 con la receta ui_original (content/enhance/ui_original.recipe.yaml). Sin esas imágenes este aspecto se
# queda fuera y el juego arranca con el de reserva (ui/ui_skin.yaml: fallback).
#
# Extiende el moderno para lo que no es aspecto (qué se esconde con .hidden, qué es flex) y reescribe todo lo que se
# ve. Las medidas van en dp: un píxel del original son 3 dp (240 líneas sobre 720 dp). Cada valor cita su fuente en el
# RCSS: un archivo y una función de la decompilación, o una captura de referencia.
id: original
name: ui_skin.original
extends: modern
theme:
  - ui/skins/original/theme
screens:
  hud:
    styles: [ui/skins/original/hud/style]
  pause_menu:
    styles: [ui/skins/original/pause_menu/style]
  # La caja de pausa de Start (utils2.c: createPauseBox).
  pause_box:
    styles: [ui/skins/original/pause_box/style]
  # La portada: la pantalla de "Press Start", el menú del original y sus cajas (main.c: main; main_menu.c).
  main_menu:
    styles: [ui/skins/original/main_menu/style]
  partner_menu:
    styles: [ui/skins/original/partner_menu/style]
  battle:
    styles: [ui/skins/original/battle/style]
  # El selector de la exploración libre usa el panel y las entradas del menú de pausa.
  destination_choice:
    styles: [ui/skins/original/pause_menu/style]
  # La lista de ranuras, el diálogo de guardar y el menú de dormir, también.
  save_slots:
    styles: [ui/skins/original/pause_menu/style, ui/skins/original/save_slots/style]
  dialog:
    styles: [ui/skins/original/pause_menu/style, ui/skins/original/dialog/style]
  sleep_menu:
    styles: [ui/skins/original/pause_menu/style]
  item_keeper:
    styles: [ui/skins/original/item_keeper/style]
  # El menú para elegir un objeto de la bolsa (tirar uno con la bolsa llena): las cajas y los rótulos del guardián.
  discard_menu:
    styles: [ui/skins/original/discard_menu/style]
  # La gramola: las cajas del original y los rótulos de número y título de la lista.
  jukebox:
    styles: [ui/skins/original/jukebox/style]
  # La inscripción a los torneos: las cajas del original y la barra de la elección.
  tournament_schedule:
    styles: [ui/skins/original/tournament_schedule/style]
  # El trueque de objetos: las cajas del original.
  trade_menu:
    styles: [ui/skins/original/trade_menu/style]
  # La tienda de cartas: las cajas y los rótulos del guardián, y la carta de cada rareza.
  card_shop:
    styles: [ui/skins/original/card_shop/style]
  # El intercambio por méritos: las cajas, los rótulos de las listas y la carta de cada rareza.
  merit_shop:
    styles: [ui/skins/original/merit_shop/style]
  # La máquina de guardado: las cajas del original donde el original las dibuja (main_menu.c: renderMenuBox).
  save_machine:
    styles: [ui/skins/original/pause_menu/style, ui/skins/original/save_machine/style]
  gym_stats:
    styles: [ui/skins/original/pause_menu/style, ui/skins/original/gym_stats/style]
  # La tienda, también, con la caja del dinero del original.
  shop_menu:
    styles: [ui/skins/original/pause_menu/style, ui/skins/original/shop_menu/style]
  # El aviso de un objeto del suelo o de un cofre: la caja de diálogo de la historia, como el original.
  field_item_notice:
    styles: [ui/skins/original/story_textbox/style]
  # Las cajas de texto de la historia: la caja del original y su barra de selección.
  story_textbox:
    styles: [ui/skins/original/story_textbox/style]
  # La caja de vidas de una vida perdida: la caja del original, como la de la historia.
  lives_box:
    styles: [ui/skins/original/story_textbox/style]
  # La caja de nombres de la partida nueva y de los guiones: el panel del menú de pausa, colocado como el original.
  naming_box:
    styles: [ui/skins/original/pause_menu/style, ui/skins/original/naming_box/style]
  # El menú del cebo y los avisos de la pesca, también.
  fishing_bait:
    styles: [ui/skins/original/pause_menu/style]
  fishing_notice:
    styles: [ui/skins/original/pause_menu/style]
  gym_slots:
    styles: [ui/skins/original/pause_menu/style, ui/skins/original/gym_slots/style]
  # La caja de los huevos tras una muerte, también.
  egg_box:
    styles: [ui/skins/original/pause_menu/style]
# Las barras del estado del campo se llenan a cuadritos, 25 por barra (partner_impl.c: renderStatusBars).
document_classes:
  # La portada y su lista de ranuras se maquetan como las del original (ui/main_menu/logic.lua, ui/save_slots/logic.lua).
  main_menu:
    panel: [title-original]
  save_slots:
    panel: [slots-original]
  hud:
    field-meter-0-bar: [pips]
    field-meter-1-bar: [pips]
    field-pool-0-bar: [pips]
    field-pool-1-bar: [pips]
# Una hoja por imagen y paleta: el original elige la paleta de cada sprite al dibujarlo. Rectángulos en píxeles del
# original (los de la decompilación); la copia x4 de ui_original los multiplica sola.
