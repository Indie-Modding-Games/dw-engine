# The DevVago look: the interface design that DevVago brought in #308, a night-blue widescreen UI with its own cover
# (the island with its halo and the "PROJECT FOLDER" plate), its field menu icons, a compact partner menu
# (status and techniques on a single page) and the player page with few tabs and the medals in the
# profile. It extends the modern one: each screen adds its sheet over the modern one's, as in their version, and the
# layouts that change are told by `layout` (below), not by classes. It reuses the sprites that dwx extract pulls from the
# user's disc: without them it is left out and the game starts with the fallback one (ui/ui_skin.yaml: fallback).
id: devvago
name: ui_skin.devvago
extends: modern
# Yellow arrow with a black border, as the designer defined it (hotspot at the tip). The image
# lives in this same folder (`cursor.png`); it can be regenerated with `scripts/make_cursor.py`.
cursor: cursor
cursor_hotspot: [1, 1]
theme:
  - theme
screens:
  hud:
    styles: [hud/style]
  pause_menu:
    styles: [pause_menu/style]
  # The Start pause box (utils2.c: createPauseBox).
  pause_box:
    styles: [pause_box/style]
  # The cover: the "Press Start" screen, the original's menu and its boxes (main.c: main; main_menu.c).
  main_menu:
    styles: [main_menu/style]
  partner_menu:
    styles: [partner_menu/style]
  battle:
    styles: [battle/style]
  # The numbers over the partner in the field (entity_text.c: renderEntityText): the battle's digits.
  field_numbers:
    styles: [battle/style]
  # The free-exploration picker uses the pause menu's panel and entries.
  destination_choice:
    styles: [pause_menu/style, destination_choice/style]
  # The slot list, the save dialog and the sleep menu, too.
  save_slots:
    styles: [pause_menu/style, save_slots/style]
  dialog:
    styles: [pause_menu/style, dialog/style]
  # The new game's rules (hidden content, Ultra → Mega step), too.
  new_game_rules:
    styles: [pause_menu/style, new_game_rules/style]
  # The new game's mode (only with more than one mode), with the rules box.
  new_game_mode:
    styles: [pause_menu/style, new_game_rules/style, new_game_mode/style]
  sleep_menu:
    styles: [pause_menu/style, sleep_menu/style]
  # The development menu (F2), too.
  dev_menu:
    styles: [pause_menu/style]
  # Online versus: the pause menu's panels, and the fight and the scoreboard with the original's sprites.
  versus:
    styles: [pause_menu/style, versus/style]
  item_keeper:
    styles: [original_lists/style, item_keeper/style]
  # The menu to pick an item from the bag (discarding one with a full bag): the keeper's boxes and labels.
  discard_menu:
    styles: [original_lists/style, discard_menu/style]
  # The jukebox: the original's boxes and the number and title labels of the list.
  jukebox:
    styles: [original_lists/style, jukebox/style]
  # The tournament sign-up: the original's boxes and the choice bar.
  tournament_schedule:
    styles: [tournament_schedule/style]
  # The cup's bracket: without names or round, like the original in English.
  tournament_bracket:
    styles: [tournament_bracket/style]
  # What a cup battle shows: without the presentation's name, like the original in English, the figures and
  # TIME UP with the sprites of ow-std-match and the time-up box with the original's window.
  tournament_match:
    styles: [tournament_match/style]
  # The item trade: the original's boxes.
  trade_menu:
    styles: [trade_menu/style]
  # The bird transport: the original's boxes and the PLACE and POINT labels.
  bird_transport:
    styles: [original_lists/style, bird_transport/style]
  # The island map (M key, a dwe improvement): the original's boxes, ink and font.
  world_map:
    styles: [world_map/style]
  # The money box that the script opens over the talk: the original's box.
  money_box:
    styles: [money_box/style]
  # The card shop: the keeper's boxes and labels, and the card of each rarity.
  card_shop:
    styles: [original_lists/style, card_shop/style]
  # The merit exchange: the boxes, the lists' labels and the card of each rarity.
  merit_shop:
    styles: [original_lists/style, merit_shop/style]
  # The shop job's counter and rules: the shop's terminal panel, the rows as cells.
  shop_haggle:
    styles: [shop_haggle/style]
  shop_job_rules:
    styles: [shop_haggle/style, shop_job_rules/style]
  # The save machine: the original's boxes where the original draws them (main_menu.c: renderMenuBox).
  save_machine:
    styles: [pause_menu/style, save_machine/style]
  gym_stats:
    styles: [pause_menu/style, gym_stats/style]
  # The shop, too, with the original's money box.
  shop_menu:
    styles: [pause_menu/style, shop_menu/style]
  # The notice of a floor item or a chest: the story's dialogue box, like the original, with its rows of
  # 12 pixels and the animated confirm button (tamer.c: renderItemPickupTextbox).
  field_item_notice:
    styles: [story_textbox/style, notice_box/style]
  # The notice of an award or of the partner's illness, the same (tamer.c: renderAwardSomethingTextbox).
  award_notice:
    styles: [story_textbox/style, notice_box/style]
  # The story's text boxes: the original's box and its selection bar.
  story_textbox:
    styles: [story_textbox/style]
  # The help pages and the stones game's question: the story's dialogue box, like the original;
  # the recruiting bar (an engine improvement), in an original box.
  curling_hud:
    styles: [story_textbox/style, curling_hud/style]
  # The lives box of a lost life: the original's box, like the story's.
  lives_box:
    styles: [story_textbox/style]
  # The name box of the new game and of the scripts: the pause menu's panel, placed like the original.
  naming_box:
    styles: [pause_menu/style, naming_box/style]
  # The bait menu and the fishing notices, too.
  fishing_bait:
    styles: [pause_menu/style]
  fishing_notice:
    styles: [pause_menu/style]
  gym_slots:
    styles: [pause_menu/style, gym_slots/style]
  # The egg box after a death, too.
  egg_box:
    styles: [egg_box/style]
  # The save notice (an engine improvement): an original window with the figure and the text.
  save_indicator:
    styles: [save_indicator/style]
# The field status bars fill in little squares, 25 per bar (partner_impl.c: renderStatusBars).
  bug_report:
    styles: [bug_report/style]
  fishing_hud:
    styles: [fishing_hud/style]
document_classes:
  # Style only: title-original and slots-original are read by their cover and slot list sheets.
  # skin-original marks the panel of the screens that share the modern look's sheets (pause_menu,
  # partner_menu): the rules that look does not let this one inherit carry #panel:not(.skin-original).
  main_menu:
    panel: [title-original]
  save_slots:
    panel: [slots-original]
  pause_menu:
    panel: [skin-original]
  partner_menu:
    panel: [skin-original]
  destination_choice:
    panel: [skin-original]
  dialog:
    panel: [skin-original]
  new_game_mode:
    panel: [skin-original]
  versus:
    panel: [skin-original]
  sleep_menu:
    panel: [skin-original]
  dev_menu:
    panel: [skin-original]
  gym_stats:
    panel: [skin-original]
  shop_menu:
    panel: [skin-original]
  naming_box:
    panel: [skin-original]
  fishing_bait:
    panel: [skin-original]
  fishing_notice:
    panel: [skin-original]
  gym_slots:
    panel: [skin-original]
  egg_box:
    panel: [skin-original]
  hud:
    field-meter-0-bar: [pips]
    field-meter-1-bar: [pips]
    field-pool-0-bar: [pips]
    field-pool-1-bar: [pips]
# The layouts (docs/architecture/ui.md#skins): the cover, its slots, the new game's rules and the
# pause menu like the original's, with its three-tab player page (tabs: minimal) and the medals in the
# profile (medals: profile); the modern partner menu, compact (pages: compact) and with the HP and MP bars of what
# is left (pool: current). The boxes open without the original's animation (box: modern). The rest, like the modern one.
layout:
  pause_menu: {menu: original, tabs: minimal, medals: profile}
  partner_menu: {pages: compact, pool: current}
  main_menu: {menu: original}
  save_slots: {menu: original}
  new_game_rules: {menu: original}
# One sheet per image and palette: the original picks each sprite's palette when drawing it. Rectangles in pixels of the
# original (the decompilation's); the x4 copy of ui_original multiplies them by itself.
sprite_sheets:
  # The six icons of the field menu, measured in FI_INFO of the user's disc.
  - name: ow-field-menu
    image: texture/etcdat/fi_info
    palette: 12
    original_size: [256, 64]
    dp_per_pixel: 3
    sprites:
      menu-item: [0, 0, 20, 20]
      menu-player: [0, 20, 20, 20]
      menu-item-active: [20, 0, 20, 20]
      menu-player-active: [20, 20, 20, 20]
      menu-cursor-corner: [0, 59, 4, 4]
      menu-cursor-bar: [4, 59, 4, 4]
      menu-cursor-side: [8, 59, 4, 4]
  # The date's digits (game_menu.c: renderDateDigits): FI_INFO with CLUT 0x7f10 (row 508, palette 12). The
  # 8x12 cells without their first column, which carries pixels of the neighboring digit and is not seen in the original.
  - name: ow-field-menu-digits
    image: texture/etcdat/fi_info
    palette: 12
    original_size: [256, 64]
    dp_per_pixel: 3
    sprites:
      menu-digit-0: [121, 52, 7, 12]
      menu-digit-1: [97, 40, 7, 12]
      menu-digit-2: [105, 40, 7, 12]
      menu-digit-3: [113, 40, 7, 12]
      menu-digit-4: [121, 40, 7, 12]
      menu-digit-5: [81, 52, 7, 12]
      menu-digit-6: [89, 52, 7, 12]
      menu-digit-7: [97, 52, 7, 12]
      menu-digit-8: [105, 52, 7, 12]
      menu-digit-9: [113, 52, 7, 12]
  - name: ow-field-menu-neutral
    image: texture/etcdat/fi_info
    palette: 13
    original_size: [256, 64]
    dp_per_pixel: 3
    sprites:
      menu-partner: [40, 0, 20, 20]
      menu-praise: [40, 20, 20, 20]
      menu-scold: [0, 40, 20, 20]
      menu-sleep: [40, 40, 20, 20]
      menu-fish: [80, 0, 20, 19]
      menu-partner-active: [60, 0, 20, 20]
      menu-praise-active: [60, 20, 20, 20]
      menu-scold-active: [20, 40, 20, 20]
      menu-sleep-active: [60, 40, 20, 20]
      menu-fish-active: [100, 0, 20, 19]
      menu-label-item: [80, 19, 24, 7]
      menu-label-partner: [80, 26, 28, 7]
      menu-label-player: [80, 33, 28, 7]
      menu-label-praise: [108, 19, 20, 7]
      menu-label-scold: [108, 26, 20, 7]
      menu-label-sleep: [108, 33, 20, 7]
      menu-label-fish: [80, 40, 16, 7]
  # The gym roulette's drawings (trn_slots.c: TRN_SLOT_SPRITE1): 32 x 32 at u = (drawing - 1) x 32, v 216 of the
  # trai00 map texture at (704, 0), with CLUT (48, 486), palette 3.
  - name: new-field-icons
    image: ui/skins/devvago/assets/menu_icons
    original_size: [896, 128]
    dp_per_pixel: 2.1333333333333333
