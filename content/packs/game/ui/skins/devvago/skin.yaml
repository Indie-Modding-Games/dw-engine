  # The cover behind the main menu (main_menu.c: renderInitialMenu draws over TITLE2). It is indexed with its only
  # CLUT (main.c loads ETCNA\TITLE2.TIM with loadTIMFile, which uploads it with the image; clut_rect (0, 480)): palette 0
  # of its metadata, so it is drawn sharp like the rest of the disc's art. With the "rescaled" texture filter
  # (the field models' one) it is drawn smoothed by the same rescaler (upscale: smooth): the logo loses
  # the jagged edges; with the other filters, sharp.
