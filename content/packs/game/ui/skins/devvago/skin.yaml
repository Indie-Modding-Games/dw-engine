    upscale: smooth
    original_size: [320, 256]
    dp_per_pixel: 3
    sprites:
      boot-screen: [0, 0, 320, 206]
  # The same two images wider, for the «Widescreen pictures» option (ui/common/title_picture.lua): each
  # side carries on as a mirror of its edge columns (mirror_sides: [left, right], in pixels of the game's image;
