    dp_per_pixel: 3
    sprites:
      title-screen: [0, 0, 320, 240]
  # The screen before the menu (main.c: runLandingScreen draws TITLE256 with its only CLUT, (0, 480)). The sprite
  # stops at row 206: below it is the original's copyright notice, which is left out. Smoothed like the cover.
  - name: ow-boot
    image: texture/etcna/title256
