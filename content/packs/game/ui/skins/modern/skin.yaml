# El aspecto moderno, el de por defecto, para todas las pantallas. Un aspecto solo cambia cómo se ve la UI: los
# documentos (ui/<pantalla>/document.rml) y su lógica son los mismos con cualquiera (docs/architecture/ui.md#aspectos).
id: modern
name: ui_skin.modern
theme:
  - ui/skins/modern/theme
screens:
  hud:
    styles: [ui/skins/modern/hud/style]
  pause_menu:
    styles: [ui/skins/modern/pause_menu/style]
  # El menú principal usa los paneles y las opciones del menú de pausa.
  main_menu:
    styles: [ui/skins/modern/pause_menu/style, ui/skins/modern/main_menu/style]
  partner_menu:
    styles: [ui/skins/modern/partner_menu/style]
  battle:
    styles: [ui/skins/modern/battle/style]
  # Los números sobre el compañero en el campo: los dígitos de la batalla.
  field_numbers:
    styles: [ui/skins/modern/battle/style]
  # El selector de la exploración libre usa el panel y las entradas del menú de pausa.
  destination_choice:
    styles: [ui/skins/modern/pause_menu/style]
  # La lista de ranuras, el diálogo de guardar y el menú de dormir, también.
  save_slots:
    styles: [ui/skins/modern/pause_menu/style, ui/skins/modern/save_slots/style]
  dialog:
    styles: [ui/skins/modern/pause_menu/style]
  # Las reglas de la partida nueva (contenido oculto, paso Ultra → Mega), también.
  new_game_rules:
    styles: [ui/skins/modern/pause_menu/style]
  # El modo de la partida nueva (solo con más de un modo), también.
  new_game_mode:
    styles: [ui/skins/modern/pause_menu/style]
  # El versus en línea, también.
  versus:
    styles: [ui/skins/modern/pause_menu/style]
  sleep_menu:
    styles: [ui/skins/modern/pause_menu/style]
  # El menú de desarrollo (F2), también.
  dev_menu:
    styles: [ui/skins/modern/pause_menu/style]
  # La máquina de guardado: las cajas del original donde el original las dibuja (main_menu.c: renderMenuBox).
  save_machine:
    styles: [ui/skins/modern/pause_menu/style, ui/skins/modern/save_machine/style]
  gym_stats:
    styles: [ui/skins/modern/pause_menu/style]
  # La tienda, también.
  shop_menu:
    styles: [ui/skins/modern/pause_menu/style]
  # La caja de nombres de la partida nueva y de los guiones, también.
  naming_box:
    styles: [ui/skins/modern/pause_menu/style]
  # El menú del cebo y los avisos de la pesca, también.
  fishing_bait:
    styles: [ui/skins/modern/pause_menu/style]
  fishing_notice:
    styles: [ui/skins/modern/pause_menu/style]
  gym_slots:
    styles: [ui/skins/modern/pause_menu/style]
  # La caja de los huevos tras una muerte, también.
  egg_box:
    styles: [ui/skins/modern/pause_menu/style]
  # El intercambio de objetos: su ventana a la izquierda, lejos del minimapa.
  trade_menu:
    styles: [ui/skins/modern/trade_menu/style]
  # Las listas de las pantallas del original (tienda de cartas, guardaobjetos, tienda de méritos, tirar objetos,
  # transporte del pájaro, gramola): sus filas con la escala de letra del aspecto moderno, no a 33dp.
  card_shop:
    styles: [ui/skins/modern/original_lists/style]
  item_keeper:
    styles: [ui/skins/modern/original_lists/style]
  merit_shop:
    styles: [ui/skins/modern/original_lists/style]
  discard_menu:
    styles: [ui/skins/modern/original_lists/style]
  bird_transport:
    styles: [ui/skins/modern/original_lists/style]
  jukebox:
    styles: [ui/skins/modern/original_lists/style]
