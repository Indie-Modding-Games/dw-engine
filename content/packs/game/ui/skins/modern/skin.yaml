# The modern look, the default one, for every screen. A look only changes how the UI looks: the documents
# (ui/<screen>/document.rml) and their logic are the same with any of them (docs/architecture/ui.md#skins).
id: modern
name: ui_skin.modern
theme:
  - ui/skins/modern/theme
screens:
  hud:
    styles: [ui/skins/modern/hud/style]
  pause_menu:
    styles: [ui/skins/modern/pause_menu/style]
  # The main menu uses the pause menu's panels and options.
  main_menu:
    styles: [ui/skins/modern/pause_menu/style, ui/skins/modern/main_menu/style]
  partner_menu:
    styles: [ui/skins/modern/partner_menu/style]
  battle:
    styles: [ui/skins/modern/battle/style]
  # The numbers over the partner in the field: the battle's digits.
  field_numbers:
    styles: [ui/skins/modern/battle/style]
  # The free-exploration picker uses the pause menu's panel and entries.
  destination_choice:
    styles: [ui/skins/modern/pause_menu/style]
  # The slot list, the save dialog and the sleep menu, too.
  save_slots:
    styles: [ui/skins/modern/pause_menu/style, ui/skins/modern/save_slots/style]
  dialog:
    styles: [ui/skins/modern/pause_menu/style]
  # The new game's rules (hidden content, Ultra → Mega step), too.
  new_game_rules:
    styles: [ui/skins/modern/pause_menu/style]
  # The new game's mode (only with more than one mode), too.
  new_game_mode:
    styles: [ui/skins/modern/pause_menu/style]
  # The box of each start that asks for the look, too.
  skin_picker:
    styles: [ui/skins/modern/pause_menu/style, ui/skins/modern/skin_picker/style]
  # Online versus, too.
  versus:
    styles: [ui/skins/modern/pause_menu/style, ui/skins/modern/versus/style]
  sleep_menu:
    styles: [ui/skins/modern/pause_menu/style]
  # The development menu (F2), too.
  dev_menu:
    styles: [ui/skins/modern/pause_menu/style]
  # The save machine: the original's boxes where the original draws them (main_menu.c: renderMenuBox).
  save_machine:
    styles: [ui/skins/modern/pause_menu/style, ui/skins/modern/save_machine/style]
  gym_stats:
    styles: [ui/skins/modern/pause_menu/style]
  # The shop, too.
  shop_menu:
    styles: [ui/skins/modern/pause_menu/style]
  # The name box of the new game and of the scripts, too.
  naming_box:
    styles: [ui/skins/modern/pause_menu/style]
  # The bait menu and the fishing notices, too.
  fishing_bait:
    styles: [ui/skins/modern/pause_menu/style]
  fishing_notice:
    styles: [ui/skins/modern/pause_menu/style]
  gym_slots:
    styles: [ui/skins/modern/pause_menu/style]
  # The egg box after a death, too.
  egg_box:
    styles: [ui/skins/modern/pause_menu/style]
  # The item trade: its window on the left, away from the minimap.
  trade_menu:
    styles: [ui/skins/modern/trade_menu/style]
  # The lists of the original's screens (card shop, item keeper, merit shop, discard items,
  # bird transport, jukebox): their rows with the modern look's text scale, not at 33dp.
  card_shop:
    styles: [ui/skins/modern/original_lists/style]
  item_keeper:
    styles: [ui/skins/modern/original_lists/style]
  merit_shop:
    styles: [ui/skins/modern/original_lists/style]
  discard_menu:
    styles: [ui/skins/modern/original_lists/style]
  bird_transport:
    styles: [ui/skins/modern/original_lists/style]
  jukebox:
    styles: [ui/skins/modern/original_lists/style]
  # The shop job's counter and rules (the improved version): the skin's panel, the price table with its odds
  # meter; the rules share the counter's sheet for the panel.
  shop_haggle:
    styles: [ui/skins/modern/shop_haggle/style]
  shop_job_rules:
    styles: [ui/skins/modern/shop_haggle/style, ui/skins/modern/shop_job_rules/style]
# How the screens that share a document and script with the original look are laid out: the scripts read these
# options with ui.layout (docs/architecture/ui.md#skins). menu: the screen's layout; box: how
# its boxes open (the original's grow from a gray outline).
layout:
  pause_menu: {menu: modern, box: modern}
  partner_menu: {menu: modern, box: modern, pages: modern}
  battle: {menu: modern}
  main_menu: {menu: modern, picture: modern}
  save_slots: {menu: modern, picture: modern}
  new_game_rules: {menu: modern, picture: modern}
  egg_box: {box: modern}
  field_item_notice: {box: modern}
