  - {maps: [twnb02, twnb07], species: sira, sprites: [108]}
  - {maps: [twnb03], species: sira, sprites: [109]}
  - {maps: [twnb04], species: sira, sprites: [111]}
  - {maps: [twnb05], species: sira, sprites: [143]}
  - {maps: [twnb06], species: sira, sprites: [141]}
  - {maps: [twnb08], species: sira, sprites: [140]}
  - {maps: [twnb09], species: sira, sprites: [138]}
