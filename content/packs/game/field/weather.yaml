# Clima del campo (mejora del motor: el original no tiene clima; docs/modulos/game/weather.md).
# El tiempo de cada zona sale de la semilla de clima de la partida, la zona y la hora del juego: no tira los números
# aleatorios del juego y nunca cambia una regla (stats, encuentros, tiempos ni colisiones).
#
# Cada `period_hours` horas de juego la zona tira si sigue con el clima de antes (`keep_chance`) o saca uno nuevo
# por sus pesos. Un cambio se funde en `fade_seconds` segundos reales. Todos los mapas de una zona comparten clima.
# Pesos: clear (despejado, soleado de día), cloudy (nublado), light_rain, heavy_rain, light_snow, heavy_snow; un
# clima que falta no sale nunca.
period_hours: 3
keep_chance: 0.45
fade_seconds: 8
# Estaciones (opción «Estaciones», también mejora del motor): primavera, verano, otoño e invierno se turnan cada
# `days` días de juego desde el año 0, día 0, empezando por la primavera. Con la opción apagada no hay estación y todo
# es como sin este bloque. Nunca cambian una regla: solo el aspecto del escenario, partículas y las probabilidades
# del clima.
# 3 días: un partner nuevo vive unos 15 días (rules/original/life.yaml, 360 horas), así que ve las cuatro (12 días)
# y la primavera otra vez; un día de juego son unos 24 minutos reales, así que una estación dura más de una hora.
# - odds: multiplica el peso de cada clima de la zona (1 lo deja igual).
# - rain_to_snow: parte de la lluvia que cae como nieve en las zonas con `snow_from_rain` (por defecto sí).
# - grade: color del escenario (fondo y capas del mapa, nunca los personajes): los verdes giran hacia `foliage_hue`
#   (grados) en `foliage` (0 a 1), luego `saturation`, `gain` (rojo, verde, azul) y `lift` (más pálido).
# - petals / leaves: pétalos o hojas que caen, de 0 a 1 (ligeros).
# Una zona con `season_strength` menor que 1 solo se mueve esa parte hacia la estación (clima propio: nieve, desierto).
seasons:
  days: 3
  # Verdes frescos, pétalos, lluvia.
  spring:
    odds: { clear: 1, cloudy: 1, light_rain: 1.5, heavy_rain: 1.2, light_snow: 0.4, heavy_snow: 0.3 }
    grade: { foliage_hue: 105, foliage: 0.25, saturation: 1.18, gain: [1.0, 1.05, 0.97], lift: 0.015 }
    petals: 1
  # Luminoso y cálido, más sol.
  summer:
    odds: { clear: 1.8, cloudy: 0.8, light_rain: 0.6, heavy_rain: 0.7, light_snow: 0.3, heavy_snow: 0.2 }
    grade: { saturation: 1.15, gain: [1.1, 1.05, 0.9], lift: 0.02 }
  # Follaje naranja y marrón, hojas que caen, lluvia y nubes.
  autumn:
    odds: { clear: 0.9, cloudy: 1.3, light_rain: 1.5, heavy_rain: 1.3, light_snow: 0.8, heavy_snow: 0.6 }
    grade: { foliage_hue: 25, foliage: 0.42, saturation: 1.05, gain: [1.06, 0.97, 0.86] }
    leaves: 1
  # Frío y pálido: la lluvia cae como nieve.
  winter:
    odds: { clear: 0.9, cloudy: 1.3, light_rain: 1, heavy_rain: 0.8, light_snow: 1.6, heavy_snow: 1.6 }
    rain_to_snow: 0.75
    grade: { saturation: 0.6, gain: [0.94, 0.99, 1.08], lift: 0.07 }
# Sin clima: además de estos, los mapas con hora fija (interiores, cuevas, edificios) nunca lo tienen.
no_weather:
  # Túneles, salas, casas y tiendas de la ciudad, el vestíbulo del torneo y el monte Infinito.
  - tunn*
  - room*
  - tend*
  - topn*
  - mgen*
  # Mansiones, sótanos, laboratorio, santuario de hielo, cuevas y fortaleza.
  - yaka*
  - chka*
  - saib*
  - icsa*
  - leom*
  - ogre*
  - gcan11
areas:
  # Bosque Nativo, punta Coela, lago Ojo de Dragón y el puente: bosque, lluvia corriente.
  - id: native_forest
    maps: [mayo*]
    weights: { clear: 5, cloudy: 3, light_rain: 2, heavy_rain: 1 }
  # Jungla tropical, manglar y bosque Amida: la zona más lluviosa.
  - id: tropical_jungle
    maps: [trop*]
    weights: { clear: 3, cloudy: 2, light_rain: 3, heavy_rain: 2 }
    # Trópico: las estaciones apenas lo mueven y nunca nieva.
    season_strength: 0.5
    snow_from_rain: false
  # Monte Panorama: montaña, nubes a menudo.
  - id: mt_panorama
    maps: [miha*]
    weights: { clear: 4, cloudy: 4, light_rain: 2, heavy_rain: 1 }
  # Overdell: tierra gris, casi siempre nublado.
  - id: overdell
    maps: [dgha*]
    weights: { clear: 1, cloudy: 5, light_rain: 3, heavy_rain: 1 }
  # Gran Cañón: seco.
  - id: great_canyon
    maps: [gcan*]
    weights: { clear: 7, cloudy: 3, light_rain: 1 }
    # Desierto: sigue seco y sin nieve en cualquier estación.
    season_strength: 0.4
    snow_from_rain: false
  # Sabana de engranajes: sol, alguna tormenta.
  - id: gear_savanna
    maps: [gias*]
    weights: { clear: 6, cloudy: 3, light_rain: 1, heavy_rain: 1 }
    season_strength: 0.7
    snow_from_rain: false
  # Región glaciar antigua: nieve, nunca lluvia.
  - id: ancient_glacial
    maps: [koda01, koda02, koda03]
    weights: { clear: 2, cloudy: 3, light_snow: 4, heavy_snow: 2 }
    # Siempre nieve: la estación solo la empuja un poco.
    season_strength: 0.4
  # Regiones dino y veloz antiguas.
  - id: ancient_regions
    maps: [koda*]
    weights: { clear: 5, cloudy: 3, light_rain: 2, heavy_rain: 1 }
  # Freezeland: nieve, nunca lluvia.
  - id: freezeland
    maps: [frzl*]
    weights: { clear: 2, cloudy: 2, light_snow: 4, heavy_snow: 3 }
    season_strength: 0.4
  # Tierra de los escarabajos: bosque.
  - id: beetle_land
    maps: [betl*]
    weights: { clear: 4, cloudy: 3, light_rain: 2, heavy_rain: 1 }
  # Árboles Brumosos: nublado y lluvia a menudo (la niebla es la del original).
  - id: misty_trees
    maps: [mist*]
    weights: { clear: 1, cloudy: 4, light_rain: 3, heavy_rain: 1 }
  # Pantano Geko: lluvia corriente.
  - id: geko_swamp
    maps: [stic*]
    weights: { clear: 2, cloudy: 3, light_rain: 3, heavy_rain: 2 }
  # Villa Volumen.
  - id: volume_villa
    maps: [gkyo*]
    weights: { clear: 4, cloudy: 3, light_rain: 2 }
  # Ciudad de los Juguetes.
  - id: toy_town
    maps: [omoc*]
    weights: { clear: 5, cloudy: 3, light_rain: 1 }
  # Ciudad Factorial y la montaña de basura: humo, nublado a menudo.
  - id: factorial_town
    maps: [fact*, gomi*]
    weights: { clear: 3, cloudy: 4, light_rain: 2 }
  # Ciudad File y el gimnasio verde.
  - id: file_city
    maps: [twna*, twnb*, trai*]
    weights: { clear: 5, cloudy: 3, light_rain: 2, heavy_rain: 1 }
