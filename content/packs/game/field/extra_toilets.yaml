# Toilet booths that can be placed on any map with the «Extra toilets» option (an engine improvement,
# off by default; docs/modules/apps/game.md, extra toilets section; content/schemas/field_extra_toilets.schema.json).
# One entry gives everything: the drawn booth, its solid tiles, the ones in front with the toilet trigger and the
# original's toilet routine. A mod can add more entries or change the model.
# model: the booth model (props/toilet_booth, ours, made by scripts/art/make_toilet_booth.py); an
# entry can carry its own. map: the map. position: the booth's center, where the partner goes (x, z in the
# original's axes, like the toilet points of the map table); on a tile corner (multiples of
# 100) it takes up exactly 2 x 2. facing: the original's Y rotation (0-4095) the open front faces toward; in front
# are the tiles that must be stepped on.
model: props/toilet_booth
toilets:
  # The green gym: the grass next to the fence, to the left of the sign, open toward the camera and the path.
  - {map: trai00, position: [-800, -3400], facing: 3584}
