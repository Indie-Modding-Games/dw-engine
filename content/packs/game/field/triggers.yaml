# What the player's tile does according to its collision value (docs/reference/field.md,
# docs/architecture/story-interpreter.md#sections-and-triggers). They are the original's; dwx extracts
# the warps from the scripts with these same ranges. The ranges do not overlap and lie between 1 and 127.
# Stepping on the tile runs the section of that number of the map script, every frame on top.
step:
  first: 51
  last: 79
# Pressing confirm on the tile runs the section of that number.
confirm:
  first: 80
  last: 109
# The tile leads through the exit (value - first) of the map's warp table; ten at most.
exits:
  first: 110
  last: 119
# The partner who needs the toilet goes (section 0x4e2 of MAPHEAD).
toilet: 120
# The bit of the tiles that block the way. Fixed by the map format: only 128 is valid.
blocked_bit: 128
