# Field rules: player movement and partner following (docs/reference/field.md).
# Distances in world units (100 = one collision cell), speeds per second, turns in radians per
# second. The defaults are those of the original, measured in the decomp at 20 frames per second.
player:
  model: digimon/boys/model
  # DIGIMON_DATA[0].radius.
  radius: 100
  # Root of animations 2 (walk, with the button) and 3 (run, without it): 20 and 50 units per frame
  # (tamer.c: tamerTickWalkingState, anim.c: applyRootMomentum).
  walk_speed: 400
  run_speed: 1000
  # tamer.c: setTamerDirection: turns instantly.
  turn_speed: 0
partner:
  model: digimon/agum/model
  radius: 120
  # Average of the root of animations 2 (walk) and 4 (run) of the starting partner: 22.6 and 43.5 per frame.
  walk_speed: 452
  run_speed: 870
  # map.c: partnerTickCollision makes it face its destination instantly (entityLookAtTile, entityLookAtLocation).
  turn_speed: 0
  # In partner radii (partner.c: getPartnerTamerCloseness): farther than 3.5 it runs, between 2.5 and 3.5 it walks and
  # closer it stops.
  run_distance: 3.5
  walk_distance: 2.5
  # tamer.c: loadMapEntities.
  spawn_distance: 200
  # map.c: the partner's trail has 30 cells.
  trail_length: 30
  # map.c: isFiveTileWidePathBlocked looks at five lines of cells, two on each side.
  sight_half_width: 200
  # Engine-specific: the original has no such rescue.
  stuck_seconds: 1.0
  teleport_distance: 2000
  # partner.c: updateConditionAnimation: with no status, happy from 0x1F happiness and unhappy below
  # -0x1E; after stopping it waits 1 to 5 loops of its idle animation (randomLimit(5) + 1) before the gesture.
  happy_gesture_from: 31
  unhappy_gesture_below: -30
  gesture_idle_plays: 5
input:
  dead_zone: 0.25
  arrive_distance: 25
# The map change (tamer.c: tamerTickChangeMap): fade out (fade.c: fadeToBlack(20)) while the player keeps
# walking without collision; when FADE_OUT_CURRENT reaches 20 the new map is loaded (changeMap) and the fade in starts
# (fadeFromBlack(20)); the player moves again when FADE_IN_CURRENT reaches 20, and that frame still fades.
transition:
  # One frame of the original (20 per second): the fade changes once per frame.
  frame_seconds: 0.05
  fade_out_frames: 20
  fade_in_frames: 20
  # When the game starts, the first map fades in over 40 frames (main.c: main: fadeFromBlack(0x28)) with the
  # player free from the first one: the map's tiles already run while it fades. In a new game the arrival tile
  # jumps to topn01 on the first frame, and the fade out continues from that almost black shade, so
  # twna01 is never seen.
  start_fade_in_frames: 40
  # fade.c: renderFade draws in front a rectangle that subtracts a gray (semi-transparent mode 2, B - F). Its shade goes up
  # 160 / (20 + 1) = 7 per frame up to 160 (renderFadeOut) and goes down from 160 in steps of 7 on the way back (renderFadeIn).
  # fadeToBlack does not set it to 0: the fade out starts at the 20 left by the previous fade in (160 - 20 × 7).
  shade_step: 7
  shade_max: 160
  # The rectangle's texture is white (ETCTIM, entry 4, palette 6: 0xFFFF) and the console multiplies it by
  # shade / 128: from 128 on it subtracts the whole white and the screen goes black.
  shade_full: 128
  # tamer.c: tamerTickChangeMap shows the new map's name when FADE_OUT_CURRENT is 10
  # (map.c: addMapNameObject) and removes it on loading.
  name_frame: 10
# The hours of the day (map.c: updateTimeOfDay): day starts at 6, dusk at 16 and night at 20, and
# the background palette only changes right at those hours (map.c: renderMap). At dusk the map's three lights
# keep 7/10 of green and blue; at night, 5/10 of each channel (red, green, blue).
time_of_day:
  day_start: 6
  dusk_start: 16
  night_start: 20
  dusk_light: [1.0, 0.7, 0.7]
  night_light: [0.5, 0.5, 0.5]
# The map's NPCs (overworld.c: NPCEntityTickOverworld; map.c: entityCheckCollision, collisionGrace), at 20
# frames per second.
npc:
  # The original moves them with the root of their animations 2 (walk) and 4 (run), that of each species
  # (anim.c: applyRootMomentum). Here, the starting partner's: a pending difference until we have the per-species root.
  walk_speed: 452
  run_speed: 870
  # overworld.c: NPCEntityTickWaypointWalk turns 0x71 of 4096 per frame toward its point: 113 × 2π / 4096 × 20.
  turn_speed: 3.4669
  # map.c: collisionGrace turns the blocked NPC at most 0x50 per frame toward a free side (80 × 2π / 4096 × 20)
  # and 32 per frame if none is free (32 × 2π / 4096 × 20).
  grace_turn_speed: 2.4544
  stuck_turn_speed: 0.9817
  # map.c: entityCheckEntityCollision extends the player's box by 50 toward where it faces if confirm is pressed while standing still.
  talk_reach: 50
  # How NPCs see the player and go after them (overworld.c:1247-1303, the switch on followMode of
  # NPCEntityTickOverworld). Without this block, NPCs do not see the player.
  tracking:
    # NPCEntityIsInTrackingRadius: radius = trackingRange × 6 / 10. The original adds dx and dz with sign instead of their
    # squares (kept).
    radius_tenths: 6
    # NPCEntityTickTrackingTamer3 waits 40 frames where it saw the player; ...TrackingTamer4, 80 when going back home.
    chase_wait_frames: 40
    follow_wait_frames: 80
    # look: stops and looks at the player while they are still in the rectangle (NPCEntityTickLookingAtTamer).
    # chase: runs to where it saw them, waits and walks back (NPCEntityTickTrackingTamer and ...3).
    # follow: follows them walking (animation 2) or running (4) while they are in the radius, and comes back (...2 and ...4).
    modes:
      - { follow_modes: [2, 11], spot: rect, reaction: look }
      - { follow_modes: [3, 4, 5, 12, 13, 14], spot: rect, reaction: chase }
      - { follow_modes: [6, 15], spot: radius, reaction: follow, gait: walk }
      - { follow_modes: [7, 16], spot: radius, reaction: follow, gait: run }
      - { follow_modes: [8, 9, 17, 18], spot: rect, reaction: follow, gait: walk }

# Scripted movements (script_interp.c: tickScriptedMovement). entity_look_at_entity turns 0x200 of 4096 per
# frame (overworld.c: rotateEntity): an eighth of a turn, 2π / 8 / 0.05 radians per second.
script_motion:
  look_turn_speed: 15.707963
