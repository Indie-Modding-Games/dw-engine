# Reglas del campo: movimiento del jugador y seguimiento del partner (docs/reference/campo.md).
# Distancias en unidades del mundo (100 = una celda de colisión), velocidades por segundo, giros en radianes por
# segundo. Los valores por defecto son los del original, medidos en el decomp a 20 imágenes por segundo.
player:
  model: digimon/boys/model
  # DIGIMON_DATA[0].radius.
  radius: 100
  # Raíz de las animaciones 2 (andar, con el botón) y 3 (correr, sin él): 20 y 50 unidades por imagen
  # (tamer.c: tamerTickWalkingState, anim.c: applyRootMomentum).
  walk_speed: 400
  run_speed: 1000
  # tamer.c: setTamerDirection: gira de golpe.
  turn_speed: 0
partner:
  model: digimon/agum/model
  radius: 120
  # Media de la raíz de las animaciones 2 (andar) y 4 (correr) del partner inicial: 22,6 y 43,5 por imagen.
  walk_speed: 452
  run_speed: 870
  # map.c: partnerTickCollision le hace mirar de golpe a su destino (entityLookAtTile, entityLookAtLocation).
  turn_speed: 0
  # En radios del partner (partner.c: getPartnerTamerCloseness): más lejos que 3,5 corre, entre 2,5 y 3,5 anda y
  # más cerca se para.
  run_distance: 3.5
  walk_distance: 2.5
  # tamer.c: loadMapEntities.
  spawn_distance: 200
  # map.c: el rastro del partner tiene 30 celdas.
  trail_length: 30
  # map.c: isFiveTileWidePathBlocked mira cinco líneas de celdas, dos a cada lado.
  sight_half_width: 200
  # Propios del motor: el original no tiene este rescate.
  stuck_seconds: 1.0
  teleport_distance: 2000
  # partner.c: updateConditionAnimation: sin estado, contento desde 0x1F de felicidad y descontento por debajo de
  # -0x1E; tras pararse espera de 1 a 5 vueltas de su animación de quieto (randomLimit(5) + 1) antes del gesto.
  happy_gesture_from: 31
  unhappy_gesture_below: -30
  gesture_idle_plays: 5
input:
  dead_zone: 0.25
  arrive_distance: 25
# El cambio de mapa (tamer.c: tamerTickChangeMap): fundido de salida (fade.c: fadeToBlack(20)) mientras el jugador sigue
# andando sin colisión; cuando FADE_OUT_CURRENT llega a 20 se carga el mapa nuevo (changeMap) y empieza el de vuelta
# (fadeFromBlack(20)); el jugador se mueve otra vez cuando FADE_IN_CURRENT llega a 20, y ese fotograma aún se funde.
transition:
  # Un fotograma del original (20 por segundo): el fundido cambia una vez por fotograma.
  frame_seconds: 0.05
  fade_out_frames: 20
  fade_in_frames: 20
  # fade.c: renderFade pone delante un rectángulo que resta un gris (modo semitransparente 2, B - F). Su tono sube
  # 160 / (20 + 1) = 7 por fotograma hasta 160 (renderFadeOut) y baja de 160 de 7 en 7 al volver (renderFadeIn).
  # fadeToBlack no lo pone a 0: el de salida empieza en el 20 que deja el de vuelta anterior (160 - 20 × 7).
  shade_step: 7
  shade_max: 160
  # La textura del rectángulo es blanca (ETCTIM, entrada 4, paleta 6: 0xFFFF) y la consola la multiplica por
  # tono / 128: desde 128 resta el blanco entero y la pantalla queda negra.
  shade_full: 128
  # tamer.c: tamerTickChangeMap muestra el nombre del mapa nuevo cuando FADE_OUT_CURRENT es 10
  # (map.c: addMapNameObject) y lo quita al cargarlo.
  name_frame: 10
# Las horas del día (map.c: updateTimeOfDay): el día empieza a las 6, el atardecer a las 16 y la noche a las 20, y
# la paleta del fondo sólo cambia justo a esas horas (map.c: renderMap). Al atardecer las tres luces del mapa
# conservan 7/10 del verde y del azul; de noche, 5/10 de cada canal (rojo, verde, azul).
time_of_day:
  day_start: 6
  dusk_start: 16
  night_start: 20
  dusk_light: [1.0, 0.7, 0.7]
  night_light: [0.5, 0.5, 0.5]
# Los NPC del mapa (overworld.c: NPCEntityTickOverworld; map.c: entityCheckCollision, collisionGrace), a 20
# imágenes por segundo.
npc:
  # El original los mueve con la raíz de sus animaciones 2 (andar) y 4 (correr), la de cada especie
  # (anim.c: applyRootMomentum). Aquí, la del partner inicial: diferencia pendiente hasta tener la raíz por especie.
  walk_speed: 452
  run_speed: 870
  # overworld.c: NPCEntityTickWaypointWalk gira 0x71 de 4096 por imagen hacia su punto: 113 × 2π / 4096 × 20.
  turn_speed: 3.4669
  # map.c: collisionGrace gira al NPC bloqueado como mucho 0x50 por imagen hacia un lado libre (80 × 2π / 4096 × 20)
  # y 32 por imagen si no hay ninguno libre (32 × 2π / 4096 × 20).
  grace_turn_speed: 2.4544
  stuck_turn_speed: 0.9817
  # map.c: entityCheckEntityCollision alarga 50 la caja del jugador hacia donde mira si pulsa confirmar parado.
  talk_reach: 50
  # Cómo ven los NPC al jugador y van tras él (overworld.c:1247-1303, el switch sobre followMode de
  # NPCEntityTickOverworld). Sin este bloque, los NPC no ven al jugador.
  tracking:
    # NPCEntityIsInTrackingRadius: radio = trackingRange × 6 / 10. El original suma dx y dz con signo en vez de sus
    # cuadrados (se mantiene).
    radius_tenths: 6
    # NPCEntityTickTrackingTamer3 espera 40 imágenes donde vio al jugador; ...TrackingTamer4, 80 al volver a casa.
    chase_wait_frames: 40
    follow_wait_frames: 80
    # look: se para y mira al jugador mientras sigue en el rectángulo (NPCEntityTickLookingAtTamer).
    # chase: corre adonde lo vio, espera y vuelve andando (NPCEntityTickTrackingTamer y ...3).
    # follow: lo sigue andando (animación 2) o corriendo (4) mientras está en el radio, y vuelve (...2 y ...4).
    modes:
      - { follow_modes: [2, 11], spot: rect, reaction: look }
      - { follow_modes: [3, 4, 5, 12, 13, 14], spot: rect, reaction: chase }
      - { follow_modes: [6, 15], spot: radius, reaction: follow, gait: walk }
      - { follow_modes: [7, 16], spot: radius, reaction: follow, gait: run }
      - { follow_modes: [8, 9, 17, 18], spot: rect, reaction: follow, gait: walk }

# Los movimientos con guion (script_interp.c: tickScriptedMovement). entity_look_at_entity gira 0x200 de 4096 por
# fotograma (overworld.c: rotateEntity): un octavo de vuelta, 2π / 8 / 0,05 radianes por segundo.
script_motion:
  look_turn_speed: 15.707963
