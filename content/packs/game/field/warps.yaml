# Dónde empieza el campo (docs/reference/campo.md). Los warps que hacen los scripts de eventos los extrae dwx a
# field/script_warps del paquete base (docs/architecture/warps-de-script.md).
start:
  # File City, entrando desde la entrada de la ciudad (salida 1, la que usa trai00).
  map: twna01
  exit: 1
