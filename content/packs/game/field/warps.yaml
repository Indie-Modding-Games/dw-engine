# Dónde empieza el campo y los warps que el original hace desde un script de eventos y no desde la tabla de warps
# del mapa (docs/reference/campo.md). Cada uno dice en `evidence` qué script lo hace.
start:
  # File City, entrando desde la entrada de la ciudad (salida 1, la que usa trai00).
  map: twna01
  exit: 1
scripted_warps:
- map: room08
  trigger: 51
  target_map: twna01
  target_exit: 2
  evidence: "MAPHEAD sección 218 pone el script 178; su sección 0x33 (disparador 51, la puerta) lleva al jugador a (-470, -1970) y hace warp_to 204 (twna01) salida 2 si el flag 203 está apagado (el principio del juego)"
