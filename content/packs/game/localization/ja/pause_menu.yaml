help.free_exploration: "ストーリーに関係なく、マップのすべての道が開きます。"
help.walk_control: "キーボードとパッド、またはマウスで歩きます（両方同時には使えません）。"
help.autosave: "ルールに合わせて、ゲームが自動で冒険のスロットにセーブします。"
help.world_map: "M（パッドではL1）で島全体のマップを開き、今いる場所を表示します。"
help.bulk_trades: "アイテム交換とカードパックで、一度にいくつにするかを選べます。"
help.long_names: "名前を、オリジナルの6文字ではなく12文字まで入力できます。"
help.evolution_requirements: "進化図で、それぞれの進化先の条件とパートナーの今の状態がわかります。"
help.canonical_stages: "進化図の世代をシリーズの呼び方で表示し、メガの枠を追加します。"
help.rare_items: "アイテムの場所に、まれに進化アイテムがかくれていることがあります。隠し要素が必要です。"
help.battle_speed: "バトルが2倍速になります。いつも、またはR（右トリガー）で切りかえ。結果は同じです。"
help.enemy_hp_bars: "大会もふくめ、バトル中ずっと敵の上にライフバーを表示します。オフ: 攻撃が当たったあとしばらくだけ。"
help.gym_sessions: "ジムのコースを、この回数だけ続けてトレーニングします。パートナーのお世話中は待ち、キャンセルしたり、離れたり、ケガや病気になったりすると止まります。"
help.quick_battle_start: "フィールドのバトルが、前置きなしですぐに始まります。大会はそのままです。"
help.shop_job_mode: "改良版: お客が公平に並び、値段ごとの売れる確率がわかる交渉画面。オリジナル: 元のゲームの値段メニュー。"
help.battle_system: "クラシックは原作のバトル。Folderではパートナーに命令と構えを出し、命じた技だけを使う。次のバトルから適用。"
help.difficulty: "ふつうはオリジナルどおり。やさしい: パートナーの攻撃が強く、受けるダメージが減り、よく育ち、おなかがすくまで長く、病気になりにくくなります。"
help.skip_evolution: "決定かキャンセルで進化シーンをすぐに終わらせます。進化後の姿は同じです。"
help.choice_cancel_closes: "選択肢をキャンセルすると、閉じるだけになります。オリジナルでは最初の答えが選ばれる選択肢もあります。"
help.fair_sickness_chance: "病気の確率が0より下なら、病気になりません。オリジナルではかならず病気になります。"
help.fair_evolution_average: "進化先の候補を、前の候補の残りの合計ではなく、それぞれの能力でくらべます。"
help.fair_move_forgetting: "技を忘れるとき、その技だけを忘れます。オリジナルでは別の技もいっしょに消えることがあります。"
help.fair_card_stock: "カード屋は1日に同じカードを2回並べません。オリジナルでは並ぶことがあります。"
help.roaming_rare_chance: "マップに入るたびにマメモン、メタルマメモン、ピクシモンが現れる確率です。オリジナルは3%です。"
help.choose_egg_after_lives_lost: "パートナーのライフが尽きたとき、寿命のときと同じように新しいタマゴを選べます。オリジナルではランダムです。"
help.generous_talk: "どちらを向いていても、少し離れたところからキャラクターに話しかけたり看板を読んだりできます。オリジナルはもっと近づく必要があります。"
help.extra_toilets: "ジムの看板のそばなどに、トイレをいくつか追加します。パートナーが行きたいときに、その前に立ってください。オリジナルには元のトイレしかありません。"
help.angemon_event_zone: "エンジェモンの光を解放したあとは、どこからもどっても氷の聖域の1階でイベントが始まります。オリジナルは落とし戸の階段からしか始まりません。"
help.whamon_in_water: "オーガモンのイベントの前、ホエモンが浜辺の秘密洞窟の岸辺の水の中で待っていて、そこで話しかけられます。オリジナルでは見えない奥にいます。"
help.boosted_techniques: "種ごとに一つ、得意な技があります。パートナーがその技を覚えていると、威力が25%上がり、消費MPが25%下がります。オリジナルにはありません。"
help.coop_difficulty: "協力プレイでは、戦うパートナーや手伝うプレイヤーが増えるほど敵が強くなります。標準は公平に、むずかしいはさらに強く、オフはオリジナルの数値のままです。ホストの設定だけが使われます。"
help.coop_open_to_join: "協力プレイでホストのとき、始まったあとのゲームにも新しいプレイヤーが参加できます。オフにすると今いるプレイヤーだけで遊び、切断したプレイヤーはもどってこられます。ホスト中のルームにすぐ反映されます。"
help.status_extras: "ステータス画面に、疲れ、お世話ミス、バトル数、起きている時間、寿命、進化を表示します。"
help.display_mode: "ウィンドウかフルスクリーンで遊びます。"
help.vsync: "フレームを画面に合わせて、映像がずれないようにします。"
help.smooth_motion: "キャラクターとカメラが、オリジナルのフレームの間をなめらかに動きます。"
help.hd_scenery: "背景をウィンドウの解像度でくっきり描きます。変わるのは見た目だけです。"
help.scenery_quality: "HD背景のとき: マップごとに1回高解像度化する（よりくっきり）か、なめらかにするだけか。"
help.antialiasing: "3Dモデルのふちをなめらかにします。"
help.graphics_preset: "グラフィックの設定をまとめて変えます。軽量がいちばん軽く、高画質がゲーム本来の見た目です。どれかひとつを変えるとカスタムになります。"
help.graphics_device: "ゲームの描画に使っているもの: {gpu}"
help.auto_quality: "ゲームがなめらかに動くよう、画質を自動で上げ下げします。グラフィックカードがないときや性能が低いときは最初からオンです。"
help.render_scale: "シーンを小さく描いてウィンドウに引きのばします。遅いパソコンではずっと速くなり、少しぼやけます。"
help.frame_limit: "1秒あたりのフレーム数をおさえます。遅いパソコンでも安定して軽くなります。"
help.texture_filter: "フィールド、バトル、メニューのモデルのテクスチャ: 高解像度化、なめらか、またはオリジナルのドット。"
help.model_characters: "平らな絵で表示される場所のキャラクターを、3Dモデルで描きます。変わるのは見た目だけです。"
help.widescreen_pictures: "横長のウィンドウで、タイトル画像を画面いっぱいに、ムービーを横幅いっぱいに表示します。"
help.enhanced_lighting: "時間帯で景色の色が変わり、ランプや火がまわりを照らします。"
help.vivid_colors: "色をゆたかにし、ほどよいコントラストと明るい部分の光を加えます。メニューは変わりません。"
help.shadows: "影なし、オリジナルの丸い影、または時間で向きが変わる太陽の影も。"
help.chibi_style: "ほかから来たモデル（Mod、インポート）を、オリジナルの体型で描きます。"
help.weather: "外のマップに雨、嵐、雪、霧、風、雲、晴れ。ルールは変わりません。"
help.seasons: "春、夏、秋、冬が数日ごとに外の景色に色をつけます。"
help.music_volume: "音楽とムービーの音の音量。10がオリジナルの音量です。"
help.effects_volume: "効果音とメニューの音の音量。10がオリジナルの音量です。"
help.continuous_music: "次のマップの曲がすでに流れていれば、最初からではなくそのまま続けます。"
help.reverb: "オリジナルと同じく、音楽と効果音にサウンドチップの残響をかけます。オフにすると、すべて響かない音になります。"
