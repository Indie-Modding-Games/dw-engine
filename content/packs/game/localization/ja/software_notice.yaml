# The notice that the game draws without a graphics card (ui/software_notice, docs/architecture/software-mode.md).
title: "グラフィックカードなしでプレイ中"
body: "CPUで描画しているため、動作が遅くなることがあります。画質は自動で調整されます。オプション > グラフィックで変更できます。"
fix: "解決するには、グラフィックカードのメーカーのサイトからドライバーをインストールまたは更新してください。"
compatible.title: "互換グラフィックモード"
compatible.body: "グラフィックカードのVulkanドライバーが古いため、互換モードで動作しています。見た目も遊び心地も同じですが、少し遅くなることがあります。"
