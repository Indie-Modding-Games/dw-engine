# The rows' descriptions: one or two lines under the list.
help.free_exploration: "Jeder Weg auf den Karten ist offen, egal was die Geschichte sagt."
help.walk_control: "Laufe mit Tastatur und Pad oder mit der Maus (nie beides zugleich)."
help.autosave: "Das Spiel speichert von selbst im Platz deines Abenteuers, wenn die Regeln es sagen."
help.world_map: "M (L1 am Pad) öffnet eine Karte der ganzen Insel, die zeigt, wo du bist."
help.bulk_trades: "Der Itemhändler und die Kartenpacks fragen, wie viele auf einmal."
help.long_names: "Namen dürfen zwölf Buchstaben lang sein statt sechs wie im Original."
help.evolution_requirements: "Der Evolutionsbaum zeigt, was jedes Ziel braucht und wie dein Partner dasteht."
help.canonical_stages: "Der Baum nennt die Stufen wie die Serie und fügt ein Mega-Feld hinzu."
help.rare_items: "Manche Itemstellen können ein seltenes Evolutionsitem verbergen. Braucht die versteckten Inhalte."
help.battle_speed: "Kämpfe laufen doppelt so schnell, immer oder mit R (rechte Schultertaste). Gleiche Ergebnisse."
help.enemy_hp_bars: "Ein Lebensbalken über jedem Gegner, den ganzen Kampf lang, auch bei Pokalen. Aus: nur kurz nach einem Treffer."
help.gym_sessions: "Ein Trainingsgerät trainiert so viele Einheiten am Stück. Es wartet, während du dich um deinen Partner kümmerst; es stoppt, wenn du abbrichst, weggehst oder dein Partner verletzt oder krank wird."
help.quick_battle_start: "Ein Kampf im Gelände beginnt sofort, ohne Vorlauf. Pokale behalten ihren."
help.shop_job_mode: "Verbessert: eine faire Kundenschlange und ein Feilsch-Bildschirm mit den Chancen jedes Preises. Original: die Preismenüs des Originals."
help.battle_system: "Klassisch ist der Originalkampf. Folder: Du gibst deinem Partner Befehle und Haltungen, er nutzt nur befohlene Techniken. Gilt ab dem nächsten Kampf."
help.difficulty: "Normal ist das Original. Leicht: dein Partner trifft härter, steckt mehr ein, trainiert mehr, hat länger Zeit zum Essen und wird seltener krank."
help.skip_evolution: "Bestätigen oder Abbrechen beendet die Szene einer Evolution sofort. Die neue Form bleibt gleich."
help.choice_cancel_closes: "Abbrechen schließt eine Auswahl nur. Im Original wählen manche Auswahlen dann ihre erste Antwort."
help.fair_sickness_chance: "Eine Krankheitschance unter null heißt keine Krankheit. Im Original macht sie deinen Partner immer krank."
help.fair_evolution_average: "Jeder Evolutionskandidat wird nach seinen eigenen Werten gewogen, nicht nach Resten vom vorigen."
help.fair_move_forgetting: "Beim Vergessen einer Technik geht nur diese verloren. Im Original kann eine andere mitgehen."
help.fair_card_stock: "Der Kartenladen bietet dieselbe Karte nie zweimal am Tag an. Im Original schon."
help.roaming_rare_chance: "Wie oft Mamemon, MetalMamemon und Piximon erscheinen, wenn du ihre Karte betrittst. Im Original sind es 3 %."
help.choose_egg_after_lives_lost: "Wenn dein Partner alle Leben verliert, wählst du das neue Ei, wie nach einem natürlichen Tod. Im Original ist es zufällig."
help.generous_talk: "Sprich mit Figuren und lies Schilder aus etwas größerer Entfernung, egal wohin du schaust. Im Original musst du näher ran."
help.extra_toilets: "Fügt ein paar Toiletten hinzu, etwa die beim Schild des Trainingsplatzes. Stell dich davor, wenn dein Partner muss. Das Original hat nur seine eigenen Toiletten."
help.angemon_event_zone: "Ist Angemons Licht befreit, beginnt sein Ereignis im Erdgeschoss des Eisheiligtums, egal wie du zurückkommst. Im Original nur über die Falltür-Treppe."
help.whamon_in_water: "Vor dem Ogremon-Ereignis wartet Whamon im Wasser am Ufer der Geheimen Strandhöhle, wo du mit ihm sprichst. Im Original ist es weit hinten, außer Sicht."
help.boosted_techniques: "Jede Art hat eine Technik, die ihr am besten liegt. Kennt dein Partner sie, trifft sie 25 % stärker und kostet 25 % weniger MP. Im Original gibt es das nicht."
help.coop_difficulty: "Im Koop werden die Gegner mit jedem kämpfenden Partner und jedem helfenden Spieler stärker. Standard hält den Kampf fair, Schwer macht ihn härter, Aus behält die Werte des Originals. Nur die Wahl des Gastgebers zählt."
help.coop_open_to_join: "Wenn du im Koop Gastgeber bist, können neue Spieler deinem laufenden Spiel beitreten. Schalte es aus, damit es bei den bisherigen Spielern bleibt; wer die Verbindung verliert, kann trotzdem zurückkommen. Gilt sofort für deinen Raum."
help.status_extras: "Die Statusseite zeigt Müdigkeit, Fehler, Kämpfe, Wachzeit, Lebensdauer und Evolution."
help.display_mode: "Im Fenster oder im Vollbild spielen."
help.vsync: "Gleicht die Bilder mit dem Bildschirm ab, damit das Bild nicht reißt."
help.smooth_motion: "Figuren und Kamera gleiten zwischen den Bildern des Originals."
help.hd_scenery: "Die Kulissen werden scharf in der Fensterauflösung gezeichnet. Nur das Aussehen ändert sich."
help.scenery_quality: "Mit HD-Kulissen: einmal pro Karte hochskaliert (schärfer) oder nur geglättet."
help.antialiasing: "Glättet die Kanten der 3D-Modelle."
help.auto_quality: "Senkt oder hebt die Qualität von selbst, damit das Spiel flüssig bleibt. Ohne Grafikkarte standardmäßig an."
help.render_scale: "Zeichnet die Szene kleiner und streckt sie aufs Fenster: viel schneller auf einem langsamen Computer, etwas unschärfer."
help.frame_limit: "Begrenzt die Bilder pro Sekunde: gleichmäßiger und leichter für einen langsamen Computer."
help.texture_filter: "Die Texturen der Modelle im Gelände, im Kampf und in den Menüs: hochskaliert, geglättet oder die Pixel des Originals."
help.model_characters: "Figuren, die manche Orte als flache Bilder zeigen, werden mit ihren 3D-Modellen gezeichnet. Nur das Aussehen ändert sich."
help.widescreen_pictures: "In einem breiten Fenster füllt das Titelbild es aus und die Filme füllen die Breite."
help.enhanced_lighting: "Die Tageszeit färbt die Szene, und Lampen und Feuer beleuchten ihre Umgebung."
help.vivid_colors: "Sattere Farben, sanfter Kontrast und ein Schimmer auf hellen Stellen. Menüs bleiben gleich."
help.shadows: "Keine Schatten, der runde des Originals oder dazu ein Sonnenschatten, der sich mit der Uhr dreht."
help.chibi_style: "Zeichnet Modelle von anderswo (Mods, Importe) mit den Proportionen des Originals."
help.weather: "Regen, Gewitter, Schnee, Nebel, Wind, Wolken und Sonne auf den Außenkarten. Keine Regeländerung."
help.seasons: "Frühling, Sommer, Herbst und Winter färben alle paar Tage die Außenwelt."
help.music_volume: "Lautstärke der Musik und des Filmtons. 10 ist die Stufe des Originals."
help.effects_volume: "Lautstärke der Effekte und Menütöne. 10 ist die Stufe des Originals."
help.continuous_music: "Spielt das Lied der nächsten Karte schon, läuft es weiter, statt neu zu beginnen."
help.reverb: "Der Raumhall des Soundchips auf Musik und Effekten, wie im Original. Aus klingt alles trocken."
help.ui_skin: "Das Aussehen der Menüs und des HUD: das des Originals oder das moderne."
help.ui_addon: "Eine Oberfläche der Community statt der des Spiels. Sie gilt, wenn das Menü schließt; halte beim Spielstart Umschalt gedrückt, um die des Spiels zurückzuholen."
help.ui_plugins: "Die Plugins der Community (eine Uhr, Hinweise...) über der Oberfläche. Sie gelten, wenn das Menü schließt."
help.ui_scale: "Die Größe der Menüs und des HUD."
help.language: "Die Sprache der Texte."
help.text_font: "Schreibt die Texte in der Schrift des Originals."
help.translated_signs: "Die auf die Karten gemalten Schilder stehen in deiner Sprache."
help.minimap: "Die runde Minikarte oben rechts, mit dem Namen der Karte, dem Tag und der Uhrzeit."
help.minimap_enemies: "Ein roter Punkt auf der Minikarte für jeden Gegner, der einen Kampf beginnen kann."
help.minimap_items: "Eine grüne Raute auf der Minikarte für jedes Item, das zum Aufheben am Boden liegt."
help.digital_time: "Die Spielzeit in Ziffern (HH:MM) unter der Uhr."
help.save_notice: "Eine kleine Figur und „Speichern“ in einer Ecke, während das Spiel speichert."
help.need_bubble_stack: "Die Blase deines Partners zeigt bis zu fünf Bedürfnisse zugleich, das dringendste zuerst."
help.need_meters: "Balken für Glück, Disziplin, Hunger, Toilette und Müdigkeit im Feld; die letzten drei füllen sich, je näher ein Bedürfnis rückt."
help.danger_alert: "Ein kleiner Teufel schwebt über wilden Digimon, die deinen Partner zerquetschen würden."
help.shop_job_bar: "Ein Balken zeigt, wie nah du dran bist, während ein Job oder ein Spiel entscheidet, ob jemand einzieht."
help.name_spacing: "Ein Name in einem Text klebt nie am nächsten Wort."
help.shop_extras: "In Läden: die Beschreibung des gewählten Items, wie viele du hast und wie viel Geld dir bleibt."
help.favorite_food: "Die Statusseite zeigt das Lieblingsessen deines Partners, und Itemlisten markieren es in Gold mit einem Herz."
help.art_fixes: "Behebt Bilder, die das Original aus dem falschen Teil seiner Textur nimmt (das Glück auf der Statusseite)."
help.dev_tools: "Schaltet die Konsole (F1), das Entwicklermenü (F2) und die Kartenebene (F3) ein. Zum Testen."
help.options_reset: "Setzt die Optionen dieses Reiters auf Standard zurück. Fragt vorher."
help.options_back: "Zurück zum Menü."
help.quick_save: "Speichert das Spiel jetzt in seinem Platz."
help.to_title: "Zurück zum Titelbild. Fragt vorher, ob gespeichert werden soll."
help.quit: "Schließt das Spiel. Fragt vorher, ob gespeichert werden soll."
