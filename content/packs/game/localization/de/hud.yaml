menu: "Menü"
# The field status. {hour} and {minute} are the game time with two digits each (00-23 and 00-59).
clock.time: "{hour}:{minute}"
# {day} is the day of the year (1-30 in the original's calendar) and {year} the year, both counted from 1.
clock.date: "Tag {day}, Jahr {year}"
need.hunger: "Hunger"
need.sleep: "Schlaf"
need.toilet: "Klo"
need.tired: "Müde"
need.injured: "Verletzt"
need.sick: "Krank"
# The shop job's bar (the option shop_job_bar): its title, the customers served ({served} of {total}), the takings
# against the total that makes the shopkeeper join ({tally} of {goal} bits) and the next mark: the better pay from
# {tally}, the join from {tally}, then the join reached.
shop_job.title: "Ladenjob"
shop_job.customers: "Kunden {served}/{total}"
shop_job.tally: "{tally} / {goal} Bits"
shop_job.better_pay: "Mehr Lohn ab {tally}"
shop_job.join_from: "Zieht in die Stadt ab {tally}"
shop_job.joins: "Zieht in die Stadt!"
shop_job.mark.pay: "Mehr Lohn"
shop_job.mark.join: "Zieht ein"
shop_job.mark.bonus: "Bonus"
shop_job.bonus_from: "Bonus ab {tally}"
shop_job.bonus_reached: "Bonus verdient!"
# The round minimap (an engine improvement): the north mark on its ring and the day under it, next to the time (clock.time).
minimap.north: "N"
minimap.day: "Tag {day}"
# The lives box's word (on losing one), for skins that write it instead of the original's picture.
lives_box.label: "Leben"
