# The notice that the game draws without a graphics card (ui/software_notice, docs/architecture/software-mode.md).
title: "Игра без видеокарты"
body: "Игра рисует изображение процессором, поэтому может работать медленно. Качество настраивается само; его можно изменить в разделе Настройки > Графика."
fix: "Чтобы это исправить, установите или обновите драйвер видеокарты с сайта её производителя."
compatible.title: "Совместимый графический режим"
compatible.body: "У вашей видеокарты старый драйвер Vulkan, поэтому игра использует её в совместимом режиме: выглядит и играется так же, возможно, чуть медленнее."
compatible.fix: "Обновите драйвер видеокарты с сайта её производителя, и игра может стать быстрее."
your_card: "видеокарта"
