help.free_exploration: "Все пути на картах открыты, что бы ни говорил сюжет."
help.walk_control: "Ходи с клавиатуры и геймпада или мышью (но не всем сразу)."
help.autosave: "Игра сама сохраняется в слот твоего приключения, когда того требуют правила."
help.world_map: "M (L1 на геймпаде) открывает карту всего острова и показывает, где ты."
help.bulk_trades: "Торговец предметами и наборы карт спрашивают, сколько взять за раз."
help.long_names: "Имена до двенадцати букв вместо шести, как в оригинале."
help.evolution_requirements: "Древо эволюции показывает, что нужно для каждой формы и как дела у напарника."
help.canonical_stages: "Древо называет стадии, как в сериале, и добавляет ячейку для Высшего."
help.rare_items: "В некоторых местах с предметами может найтись редкий предмет для эволюции. Нужен скрытый контент."
help.battle_speed: "Бои идут вдвое быстрее: всегда или по R (правый триггер). Итог тот же."
help.enemy_hp_bars: "Полоска жизни над каждым врагом весь бой, и на кубках тоже. Выкл.: только недолго после удара."
help.gym_sessions: "Тренировка в спортзале идёт столько занятий подряд. Ждёт, пока ты ухаживаешь за напарником; прерывается, если ты отменишь, уйдёшь или он поранится или заболеет."
help.quick_battle_start: "Бой на карте начинается сразу, без вступления. На кубках вступление остаётся."
help.shop_job_mode: "Улучшенная: честная очередь покупателей и экран торга с шансами каждой цены. Оригинальная: меню цен, как в оригинале."
help.difficulty: "Обычная — как в оригинале. Лёгкая: напарник бьёт сильнее, получает меньше урона, лучше тренируется, дольше терпит голод и реже болеет."
help.skip_evolution: "Подтверждение или отмена сразу завершает сцену эволюции. Новая форма та же."
help.choice_cancel_closes: "Отмена в выборе только закрывает его. В оригинале некоторые выборы выполняют первый ответ."
help.fair_sickness_chance: "Шанс болезни ниже нуля значит, что болезни нет. В оригинале напарник от него всегда заболевает."
help.fair_evolution_average: "Каждый кандидат на эволюцию оценивается по своим параметрам, а не по суммам, оставшимся от предыдущего."
help.fair_move_forgetting: "Забывание приёма убирает только этот приём. В оригинале с ним может пропасть и другой."
help.fair_card_stock: "Карточный магазин не предлагает одну и ту же карту дважды за день. В оригинале может."
help.choose_egg_after_lives_lost: "Когда напарник теряет все жизни, новое яйцо выбираешь ты, как после естественной смерти. В оригинале оно случайное."
help.generous_talk: "Говори с персонажами и читай вывески чуть издалека, куда ни повернись. В оригинале нужно подойти ближе."
help.extra_toilets: "Добавляет ещё несколько туалетов, например у вывески спортзала. Встань перед ним, когда напарнику нужно в туалет. В оригинале есть только свои туалеты."
help.angemon_event_zone: "Когда свет Angemon освобождён, его событие начинается на первом этаже Ледяного святилища, с какой стороны ни зайти. В оригинале — только с лестницы у люка."
help.whamon_in_water: "До события с Ogremon Whamon ждёт в воде у берега Пещеры тайного пляжа, там с ним и говоришь. В оригинале он далеко, вне поля зрения."
help.coop_difficulty: "В кооперативе враги крепнут с каждым сражающимся напарником и каждым помогающим игроком. Стандартная держит бой честным, высокая усложняет, «Выкл.» оставляет числа оригинала. Решает только хост."
help.coop_open_to_join: "Когда ты хост кооператива, новые игроки могут присоединиться к уже идущей игре. Выключи, чтобы играли только те, кто уже в ней; отключившиеся всё равно смогут вернуться. Действует сразу для твоей комнаты."
help.status_extras: "Страница статуса показывает усталость, ошибки, бои, часы бодрствования, срок жизни и эволюцию."
help.display_mode: "Играть в окне или на весь экран."
help.vsync: "Синхронизирует кадры с монитором, чтобы картинка не рвалась."
help.smooth_motion: "Персонажи и камера плавно движутся между кадрами оригинала."
help.hd_scenery: "Фоны рисуются чётко в разрешении окна. Меняется только вид."
help.scenery_quality: "С HD-фонами: увеличение один раз на карту (чётче) или только сглаживание."
help.antialiasing: "Сглаживает края 3D-моделей."
help.texture_filter: "Текстуры моделей на карте, в бою и в меню: увеличенные, сглаженные или пиксели оригинала."
help.model_characters: "Персонажи, которые местами показаны плоскими картинками, рисуются 3D-моделями. Меняется только вид."
help.widescreen_pictures: "В широком окне титульная картинка заполняет его целиком, а ролики — всю ширину."
help.enhanced_lighting: "Время суток окрашивает сцену, а лампы и костры освещают всё вокруг себя."
help.vivid_colors: "Насыщенные цвета, мягкий контраст и свечение на ярких местах. Меню не меняются."
help.shadows: "Без теней, круглая тень оригинала или ещё и тень от солнца, которая поворачивается вместе с часами."
help.chibi_style: "Рисует сторонние модели (моды, импорт) с пропорциями оригинала."
help.weather: "Дождь, грозы, снег, туман, ветер, облака и солнце на открытых картах. Правила не меняются."
help.seasons: "Весна, лето, осень и зима раскрашивают природу каждые несколько дней."
help.music_volume: "Громкость музыки и звука роликов. 10 — уровень оригинала."
help.effects_volume: "Громкость эффектов и звуков меню. 10 — уровень оригинала."
help.continuous_music: "Если на следующей карте уже играет та же песня, она продолжается, а не начинается заново."
help.reverb: "Эхо звукового чипа на музыке и эффектах, как в оригинале. Выкл.: всё звучит сухо."
help.ui_skin: "Вид меню и HUD: как в оригинале или современный."
help.ui_addon: "Интерфейс от сообщества вместо стандартного. Применяется при закрытии меню; чтобы вернуть стандартный, зажми Shift при запуске игры."
help.ui_plugins: "Плагины сообщества (часы, уведомления...) поверх интерфейса. Применяются при закрытии меню."
help.ui_scale: "Размер меню и HUD."
help.language: "Язык текстов."
help.text_font: "Тексты пишутся шрифтом оригинала."
help.translated_signs: "Вывески, нарисованные на картах, читаются на твоём языке."
help.minimap: "Круглая миникарта справа вверху с названием карты, днём и временем."
help.minimap_enemies: "Красная точка на миникарте для каждого врага, с которым может начаться бой."
help.minimap_items: "Зелёный ромб на миникарте для каждого предмета, который лежит на земле."
help.digital_time: "Игровое время цифрами (ЧЧ:ММ) под часами."
help.save_notice: "Маленькая фигурка и «Сохранение» в углу, пока игра сохраняется."
help.need_bubble_stack: "Облачко напарника показывает до пяти потребностей сразу, начиная с самой опасной."
help.shop_job_bar: "Шкала показывает, сколько осталось, пока работа или игра решает, переедет ли кто-то в город."
help.name_spacing: "Имя внутри текста никогда не сливается со следующим словом."
help.shop_extras: "В магазинах: описание выбранного предмета, сколько их у тебя и сколько денег останется."
help.favorite_food: "Страница статуса показывает любимую еду напарника, а списки предметов отмечают её золотом и сердечком."
help.art_fixes: "Исправляет картинки, которые оригинал берёт не из той части текстуры (счастье на странице статуса)."
help.dev_tools: "Включает консоль (F1), меню разработчика (F2) и наложение карты (F3). Для тестов."
help.options_reset: "Возвращает настройки этой вкладки по умолчанию. Сначала спросит."
help.options_back: "Назад в меню."
help.quick_save: "Сразу сохраняет игру в её слот."
help.to_title: "Возврат в главное меню. Сначала спросит, сохранить ли игру."
help.quit: "Закрывает игру. Сначала спросит, сохранить ли её."
help.quit_title: "Закрывает игру."
