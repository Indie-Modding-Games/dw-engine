title: "Добро пожаловать"
intro: "Чтобы играть, нужна твоя собственная копия оригинальной игры: образ диска североамериканского издания (файл .cue с его .bin или .iso). Игра прочитает его один раз и сохранит нужное на этом компьютере; ничего не скачивается."
update_title: "Игра обновилась"
update_intro: "Эта версия игры читает диск по-другому, поэтому ей нужно ещё раз прочитать твой образ диска. Сохранения и настройки останутся как были. Образ, который ты выбирал в прошлый раз, уже указан ниже."
