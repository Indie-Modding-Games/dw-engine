title: "欢迎"
intro: "要玩这个游戏，你需要一份自己的原版游戏：北美版的光盘镜像（.cue文件加上它的.bin，或者.iso）。游戏只会读取一次，把需要的内容保存在这台电脑上；不会下载任何东西。"
