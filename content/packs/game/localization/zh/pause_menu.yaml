help.free_exploration: "无论剧情进展到哪里，地图上的所有道路都会开放。"
help.walk_control: "用键盘和手柄行走，或者用鼠标（不能同时使用）。"
help.autosave: "在规则规定的时机，游戏会自动保存到你冒险的存档位。"
help.world_map: "按M（手柄为L1）打开整座岛的地图，显示你所在的位置。"
help.bulk_trades: "道具交易商和卡包会问你一次要多少。"
help.long_names: "名字最多可用十二个字母，而不是原版的六个。"
help.evolution_requirements: "进化图会显示每个进化目标需要什么，以及你的伙伴达成了多少。"
help.canonical_stages: "进化图用系列作品的正统名称称呼各阶段，并增加究极体一栏。"
help.rare_items: "某些道具点可能藏有稀有的进化道具。需要开启隐藏内容。"
help.battle_speed: "战斗以两倍速度进行，可设为总是或按R（右扳机）切换。结果不变。"
help.enemy_hp_bars: "整场战斗中每个敌人头上都有血条，大赛也一样。关闭时：只在受到攻击后显示一会儿。"
help.gym_sessions: "道馆的训练项目会连续进行这么多次。照顾伙伴时会暂停；取消、走开或伙伴受伤、生病时会停止。"
help.quick_battle_start: "野外的战斗一触发就开始，没有开场。大赛保持原样。"
help.shop_job_mode: "改进版：顾客队列更合理，还有显示每个价格成交几率的议价画面。原版：原版的价格菜单。"
help.difficulty: "普通就是原版。简单：伙伴攻击更强、受到伤害更少、训练效果更好、吃饭时间更宽裕，也更不容易生病。"
help.skip_evolution: "按确定或取消可立即结束进化的场景。进化后的形态不变。"
help.choice_cancel_closes: "取消选项只会关闭它。原版中某些选项会执行第一个回答。"
help.fair_sickness_chance: "生病几率低于零就不会生病。原版中这样反而一定会让伙伴生病。"
help.fair_evolution_average: "每个进化候选都按它自己的能力来衡量，而不是上一个候选留下的总和。"
help.fair_move_forgetting: "遗忘招式只会去掉那一个招式。原版中可能会连带去掉另一个招式。"
help.fair_card_stock: "卡片店同一天不会卖两张相同的卡。原版中可能会。"
help.choose_egg_after_lives_lost: "伙伴失去所有生命时，由你来选新的蛋，和自然死亡后一样。原版中是随机的。"
help.generous_talk: "稍微远一点也能和角色说话、阅读告示牌，不管你面向哪边。原版需要靠得更近。"
help.extra_toilets: "增加几个厕所隔间，比如道馆招牌旁边那个。伙伴想上厕所时，站到隔间前面就行。原版只有自己的那些厕所。"
help.angemon_event_zone: "Angemon的光芒被解放后，无论你从哪里回来，他的事件都会在冰之圣域一楼开始。原版只会从活板门楼梯触发。"
help.whamon_in_water: "在Ogremon事件之前，Whamon会在秘密海滩洞窟的岸边水中等你，你可以在那里和它说话。原版中它待在远处，看不见。"
help.coop_difficulty: "合作时，每多一只伙伴参战、每多一位玩家帮忙，敌人就会更强。标准让战斗保持公平，困难更有挑战，关闭则保持原版数值。只有房主的选择有效。"
help.coop_open_to_join: "你当房主进行合作时，新玩家可以在游戏开始后加入。关闭后只限已在房间内的玩家；中途断线的玩家仍可回来。设置会立即应用于你的房间。"
help.status_extras: "状态页显示疲劳、失误、战斗次数、清醒时间、寿命和进化计时。"
help.display_mode: "以窗口或全屏模式游玩。"
help.vsync: "让画面帧与显示器同步，避免画面撕裂。"
help.smooth_motion: "角色和镜头会在原版的帧之间平滑移动。"
help.hd_scenery: "以窗口的分辨率清晰地绘制场景。只改变外观。"
help.scenery_quality: "开启高清场景时：每张地图放大一次（更清晰）或只做平滑处理。"
help.antialiasing: "让3D模型的边缘更平滑。"
help.texture_filter: "野外、战斗和菜单中的模型贴图：放大、平滑或原版的像素。"
help.model_characters: "某些地方以平面图片显示的角色，改用3D模型绘制。只改变外观。"
help.widescreen_pictures: "在宽窗口中，标题图片会铺满窗口，影片会填满宽度。"
help.enhanced_lighting: "时间会改变场景的色调，灯和火会照亮周围。"
help.vivid_colors: "色彩更丰富，对比柔和，亮处带有光晕。菜单不会改变。"
help.shadows: "无阴影、原版的圆形阴影，或者再加上随时钟转动的阳光阴影。"
help.chibi_style: "用原版的比例绘制其他来源的模型（模组、导入的模型）。"
help.weather: "户外地图会有雨、暴风雨、雪、雾、风、云和晴天。规则不变。"
help.seasons: "每隔几天，春夏秋冬会为户外换上不同的色彩。"
help.music_volume: "音乐和影片声音的音量。10为原版音量。"
help.effects_volume: "音效和菜单声音的音量。10为原版音量。"
help.continuous_music: "下一张地图的乐曲已在播放时，会继续播放而不是从头开始。"
help.reverb: "和原版一样，在音乐和音效上加入音源芯片的空间回响。关闭时，所有声音都很干。"
help.ui_skin: "菜单和HUD的外观：原版或现代风格。"
help.ui_addon: "用社区制作的界面代替游戏自带的界面。关闭菜单时生效；启动游戏时按住Shift可恢复游戏自带的界面。"
help.ui_plugins: "在界面上叠加社区制作的插件（时钟、提示……）。关闭菜单时生效。"
help.ui_scale: "菜单和HUD的大小。"
help.language: "文字的语言。"
help.text_font: "用原版的字体显示文字。"
help.translated_signs: "地图上画着的招牌会以你的语言显示。"
help.minimap: "右上角的圆形小地图，附带地图名称、日期和时间。"
help.minimap_enemies: "小地图上，每个可能引发战斗的敌人都会显示为红点。"
help.minimap_items: "小地图上，地上每个可以捡的道具都会显示为绿色菱形。"
help.digital_time: "在时钟下方用数字（HH:MM）显示游戏时间。"
help.save_notice: "保存游戏时，角落里会出现一个小人和“保存中”。"
help.need_bubble_stack: "伙伴的气泡最多同时显示五个需求，最快会伤害它的排在最前面。"
help.shop_job_bar: "打工或比赛决定是否有人加入城市时，进度条会显示你离目标还有多远。"
help.name_spacing: "文字中的名字不会和后面的词连在一起。"
help.shop_extras: "在商店里：显示所选道具的说明、你的持有数量和交易后剩下的钱。"
help.favorite_food: "状态页会显示伙伴最爱的食物，道具列表中会用金色和爱心标出它。"
help.art_fixes: "修正原版从贴图错误位置截取的图片（状态页的快乐值）。"
help.dev_tools: "开启控制台（F1）、开发者菜单（F2）和地图叠加层（F3）。测试用。"
help.options_reset: "把这个标签页的选项恢复为默认值。会先询问。"
help.options_back: "返回菜单。"
help.quick_save: "立即把游戏保存到存档位。"
help.to_title: "返回标题画面。会先询问是否保存。"
help.quit: "关闭游戏。会先询问是否保存。"
help.quit_title: "关闭游戏。"
