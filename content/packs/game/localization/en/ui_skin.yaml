# The names of the game pack's UI skins in the menus (ui/skins/<id>/skin.yaml names its key). A mod's skin keeps its
# name in a localization file of its own: one named ui_skin.yaml would replace this one whole.
modern: "Modern"
original: "Original"
new: "Pixel art"
devvago: "DevVago"
# One line per skin under its name in the first run's box (ui/skin_picker); a mod adds one with its name's key plus
# .hint.
modern.hint: "Clean panels and modern text."
original.hint: "The original's menus, redrawn sharp."
new.hint: "Navy windows and pixel fonts."
devvago.hint: "DevVago's design: night blue and compact menus."
