# The bulk trades (an engine improvement, the bulk_trades option): the item trader and the card
# shop's packs ask how many at once.
how_many: "How many?"
# The item trader's box: {count} of the {item} the player gives and gets.
give: "Give {count} x {item}"
get: "Get {count} x {item}"
# The most the bag allows, {most}.
most: "Up to {most}"
# The card shop's packs: the amount box's name, the keeper's question with the most packs the
# money covers ({most}), and what they gave: {packs} packs, {cards} cards, {new} new ones.
packs: "Packs"
packs_ask: "How many packs?\nYou can open up to {most}."
packs_got: "{packs} {packs:pack|packs} gave {cards} {cards:card|cards}.\nNew ones are in yellow: {new}."
# The column titles of the packs' summary.
card: "Card"
copies: "Copies"
