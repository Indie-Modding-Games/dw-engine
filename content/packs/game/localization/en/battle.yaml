# The battle screen (ui/battle) and the battle's own keys (game/battle: text_keys.hpp). The command row shows the
# original's command names (btl.command_names) and move names; command.* is the engine's fallback for tools.
command.none: "None"
command.flee: "Run"
command.attack: "Attack"
command.your_call: "Your call"
command.moderate: "Moderate"
command.distance: "Distance"
command.defend: "Defend"
command.change: "Change"
command.technique_1: "Technique 1"
command.technique_2: "Technique 2"
command.technique_3: "Technique 3"
command.finisher: "Finisher"
outcome.victory: "Victory!"
outcome.fled: "Got away safely."
outcome.defeat: "Defeated..."
status.poison: "Poisoned"
status.confusion: "Confused"
status.stun: "Stunned"
status.flatten: "Flattened"
# The end box types the original's own lines (btl.battle_effect_messages); these finish one or are the engine's. The
# marks are the original's: {color:7} yellow, {color:1} white, {br} a new row, {wait} the row that ends the line and
# waits. {amount} is the MP bonus in percent, after the original's "reduced by".
result.mp_bonus_percent: " {amount}%!{wait}"
# {amount} is the bits won.
result.bits: "Won {amount} {amount:bit|bits}."
# {amount} is how many lives the partner lost.
result.lives_lost: "Your partner lost{br}{color:7}{amount}{color:1} {amount:life|lives}.{wait}"
# {name} is the item's name and {amount} how many were lost.
result.item_lost: "Lost {color:7}{name}{color:1}{br}x{amount}.{wait}"
# {name} is the name of who joined the city.
result.recruit_joined: "{color:7}{name}{color:1}{br}will move to the city!{wait}"
# The short label before a healing or raise number over a fighter (modern look; the original look draws the icon).
number_icon.hp: "HP"
number_icon.mp: "MP"
number_icon.offense: "OFF"
number_icon.defense: "DEF"
number_icon.speed: "SPD"
# {seconds} is the time left to get back up.
revive_countdown: "Get up! {seconds}"
finisher: "Finisher"
# The finisher gauge's word and the "press" mark once it is full, which the original look draws over the gauge
# (one more letter of the word for each step the gauge fills; in English it shows the original's pictures).
finisher_word: "FINISH!!"
finisher_push: "PUSH"
# The word of the banner that opens a battle, in cells of the original's banner pieces: '#' a piece,
# '.' a gap, 8 rows; a letter ends at a column with no piece, and at most 200 pieces fit. English
# draws the original's own word.
banner_shape: |-
  #####.....##....######..######.##.....######
  ##..##....##......##......##...##.....##....
  ##..##...####.....##......##...##.....##....
  #####...##..##....##......##...##.....######
  ##..##..##..##....##......##...##.....##....
  ##..##.########...##......##...##.....##....
  ##..##.##....##...##......##...##.....##....
  #####..##....##...##......##...######.######
charge: "Charge the finisher!"
charge_hint: "Press repeatedly"
prompt.command: "Give the order"
prompt.bag: "Items"
# The bag in battle: the button that opens it.
bag.open: "Items"
# The marks over the fighters of a cup match between two of the same species (STD_renderPlayerMarker).
mark.partner: "1P"
mark.rival: "COM"
