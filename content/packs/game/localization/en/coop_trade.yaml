# An item trade between two players of a co-op game (ui/coop_trade, the co-op HUD's notices).
# {name} is the other player.
title: "Trade with {name}"
asking: "Waiting for {name} to answer..."
invited: "{name} wants to trade items with you."
accept: "Trade"
refuse: "No thanks"
cancel: "Call it off"
your_bag: "Your bag"
your_offer: "You give"
their_offer: "{name} gives"
empty_bag: "Your bag is empty."
nothing: "Nothing yet."
ready: "Ready"
choosing: "Choosing..."
trading: "Trading..."
confirm: "Ready to trade"
unconfirm: "Not ready"
