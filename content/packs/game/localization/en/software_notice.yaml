# The notice that the game draws without a graphics card (ui/software_notice, docs/architecture/software-mode.md).
title: "Playing without a graphics card"
body: "The game is drawing with the processor, so it may run slowly. The quality adjusts itself; you can change it in Options > Graphics."
fix: "To fix it, install or update your graphics card's driver from its maker's website."
compatible.title: "Compatible graphics mode"
compatible.body: "Your graphics card has an older Vulkan driver, so the game uses it in its compatible mode: it looks and plays the same, maybe a little slower."
compatible.fix: "Updating your graphics card's driver from its maker's website can make it faster."
your_card: "graphics card"
reason.basic_display_adapter: "Your {adapter} is running without its driver. Install it from your card maker's website and restart."
reason.dedicated_gpu_unused: "Your {dedicated} is not being used. In Windows Settings > System > Display > Graphics, set the game to High performance."
reason.driver_too_old: "The driver of your {gpu} is {driver}; install {minimum} or newer from its maker's website."
reason.no_vendor_driver: "Your {adapter} has no Vulkan driver. Install it from your card maker's website and restart."
reason.vulkan_too_old: "Your {gpu} only offers Vulkan {api}. Update its driver; if that does not help, the card is too old."
reason.missing_features: "Your {gpu} lacks features the game needs. Update its driver; if that does not help, the card is too old."
reason.gpu_unsuitable: "Your {gpu} cannot run the game with its current driver. Update it from its maker's website."
reason.hardware_no_vulkan: "Your {adapter} does not support Vulkan, so the processor draws instead."
reason.instance_failed: "Vulkan did not start. Reinstall your graphics driver and close overlays or recorders."
reason.device_failed: "Your {gpu} refused to start. Reinstall its driver and close overlays or recorders."
reason.device_lost: "Your {gpu} stopped responding. Update its driver and check it does not overheat."
reason.out_of_memory: "Your {gpu} ran out of video memory. Close other programs while you play."
reason.virtual_machine: "The game runs in a virtual machine. Play on the real computer for full speed."
reason.remote_session: "The game runs through a remote desktop, which hides the graphics card. Play at the computer itself."
reason.implicit_layers: "An overlay or recorder blocked the graphics card. Close it and start the game again."
reason.compatible_path: "Updating the driver of your {gpu} from its maker's website can make it faster."
reason.no_gpu: "No graphics card with Vulkan was found. Install your card's driver from its maker's website."
