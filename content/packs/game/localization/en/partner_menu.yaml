# The partner's menu (ui/partner_menu): the status page, the item bag and the care page. The original's own labels
# (HP, MP, the stats, the item options, the sort orders, the drop's question, bits) come from its text tables.
tab.status: "Status"
tab.items: "Items"
tab.care: "Care"
# The partner's species, under its own name (game_menu.c: drawDigimonStatsStrings).
species: "Species"
age: "Age"
# {days} is the partner's age in days; {days:day|days} picks the word by the count (1 day, 2 days).
age.value: "{days} {days:day|days}"
weight: "Weight"
# {weight} is the partner's weight.
weight.value: "{weight} G"
# {lives} is the lives the partner has left.
lives: "Lives {lives}"
happiness: "Happiness"
discipline: "Discipline"
virus: "Virus"
# The status page's extras (the status_extras option), which the original hides: the tiredness bar, the count of
# care mistakes and of battles, the hours it is awake, the hours of life it has left and the evolution counter.
tiredness: "Tiredness"
care_mistakes: "Mistakes"
battles: "Battles"
awake: "Awake"
# {wake} and {sleepy} are the times it wakes up and gets sleepy, as 08:00.
awake.value: "{wake}-{sleepy}"
# {value} is a number from 0 to 100 (-100 to 100 for happiness) the status page writes as a percentage: happiness,
# discipline and tiredness.
percent.value: "{value}%"
lifetime: "Lifetime"
evolution: "Evo. timer"
# {hours} is a count of game hours.
hours.value: "{hours} h"
# {hours} is the evolution counter and {check} the hours its level checks its evolution from.
evolution.value: "{hours}/{check} h"
# Its species' favourite food (the favorite_food option), with the item's name; "None" when it has none.
favorite_food: "Favourite food"
favorite_food.none: "None"
condition.none: "In good shape"
condition.sleepy: "Sleepy"
condition.tired: "Tired"
condition.hungry: "Hungry"
condition.needs_toilet: "Needs the toilet"
condition.sulking: "Sulking"
condition.injured: "Injured"
condition.sick: "Sick"
bag.empty: "-"
# {name} is the item being moved.
bag.move_prompt: "Where to put {name}?"
# {name} is the item's name in all the bag results.
bag_result.used: "Used {name}."
bag_result.refused: "Your partner won't take {name}."
bag_result.not_usable_here: "{name} can't be used here."
bag_result.not_in_bag: "There is nothing there."
bag_result.useless: "{name} would do nothing now."
bag_result.moved: "Moved {name}."
bag_result.dropped: "Threw away {name}."
bag_result.sorted: "The bag is sorted."
bag_result.failed: "That can't be done."
care.praise: "Praise"
care.scold: "Scold"
care.feed_hint: "To feed your partner, use food from the bag."
care.training_hint: "Training is done at the training spots in the field."
care_result.praised: "You praised your partner."
care_result.scolded: "You scolded your partner."

