error.unknown: "The series ended."
error.no_answer: "The host does not answer. Check the code or the address and that its port is open."
error.silence: "The connection to the other player was lost."
error.left: "The other player left the series."
error.version: "The other player has another version of the game."
error.content: "The other player has other game content (other rules or data)."
error.lineup: "A partner of the other player does not exist in this content."
error.desync: "The two battles stopped matching; the series was stopped."
error.damaged: "A damaged message arrived; the series was stopped."
