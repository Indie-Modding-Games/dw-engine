# The online versus (ui/versus): two players, each on their own machine with the registered partners of their save.
title: "Online versus"
menu.host: "Host a series"
menu.join: "Join a series"
menu.about: "Each player uses their own machine and the partners they registered at their save's save machine. Both need the same game version and the same content."
# The host picks how many battles the series has (all are played; whoever wins more wins).
host_setup.question: "How many battles?"
host_setup.battles: "◀ {count} battles ▶"
host_setup.hint: "Left and right change the number; accept opens the series."
# The host waits for the guest: it tells its code or its address.
hosting.waiting: "Waiting for the other player to join…"
hosting.codes: "Join code:"
hosting.addresses: "Address:"
hosting.no_address: "This machine's address was not found."
hosting.port: "UDP port {port}"
hosting.network: "On the same network the code is enough. Over the internet the host must open or forward UDP port 47120 on their router and give their public address."
# The guest types the host's code or address.
join.prompt: "Type the host's code or address (IP:port):"
join.bad: "That code or address is not valid."
join.hint: "Accept or Enter connects; Back erases the last letter."
joining: "Connecting to the host…"
# The save the partners come from.
save_pick.title: "Pick the save with your registered partners:"
save_pick.row: "{player} · {partner} ({count} registered)"
save_pick.none: "There are no saves."
# The partners for each battle, in order.
lineup.title: "Partner for battle {number} of {battles}:"
lineup.row: "{name} ({species}) {stats}"
lineup.picked: "Picked: {names}"
waiting_lineup: "Waiting for the other player to pick…"
# A battle.
score: "1P {host} - {guest} 2P"
match.top: "Battle {round}/{battles}   {clock}   {score}"
match.you: "You: {name} ({species})"
match.rival: "Rival: {name} ({species})"
match.numbers: "HP {hp}/{max_hp}  MP {mp}/{max_mp}  {command}"
match.stalled: "Waiting for the other player…"
match.leave: "Press Back again to leave the series."
log.attack: "{who} uses {move}"
log.hit: "{who} takes {amount} damage"
log.finisher: "{who} unleashes {move}!"
log.disobey: "{who} does not obey"
log.faint: "{who} falls"
# Between battles and at the end.
intermission.won: "You won battle {round}."
intermission.lost: "You lost battle {round}."
intermission.draw: "Battle {round}: both lose."
outcome.won: "Win"
outcome.lost: "Loss"
outcome.draw: "Both lose"
result.you: "You won the series!"
result.rival: "The rival won the series."
result.draw: "Draw."
