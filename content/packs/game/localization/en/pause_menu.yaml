vsync: "Vertical sync"
ui_skin: "Interface style"
# Free exploration: the scripts open every way they have, whatever the story (off by default).
free_exploration: "Free exploration"
# Smooth motion: the characters and the camera glide between the original's frames (on by default).
smooth_motion: "Smooth motion"
# Save notice: a small figure and "Saving" in a corner while the game saves (on by default).
save_notice: "Save notice"
# Autosave: the game saves by itself to the adventure's own slot (on by default; off, only the player's saves write).
autosave: "Autosave"
# Music and effects volume (an engine addition; the original has no sound options): a step from 0 (silent) to 10
# (the original's level, the default). The music includes the movies' sound.
music_volume: "Music volume"
effects_volume: "Effects volume"
# Digital time: the game time as HH:MM in a small box under the field's clock (on by default).
digital_time: "Digital time"
# Bulk trades: the item trader and the card shop's packs ask how many at once (on by default).
bulk_trades: "Bulk trades"
# Evolution requirements: the chart's tree tells what each target asks and how the partner stands (on by default).
evolution_requirements: "Evolution requirements"
translated_signs: "Translated signs"
# Status extras: the partner's tiredness bar and care mistakes on its status page, which the original hides (on by
# default).
status_extras: "Status extras"
# Canonical stages: the chart names the stages as the series does and draws a Mega box (off by default).
canonical_stages: "Canonical stages"
walk_control: "Walk with"
walk_control.keys: "Keyboard/pad"
walk_control.mouse: "Mouse"
# Long names: the naming box takes names of up to twelve letters instead of six (on by default).
long_names: "Long names"
# Recruit bar: while a job or a match decides whether someone joins the city (the canyon shop, the stones game), a bar
# shows how close the player is (on by default).
shop_job_bar: "Recruit bar"
# Continuous music: a map whose song is already playing lets it go on instead of starting it again
# (on by default).
continuous_music: "Continuous music"
# Several needs: the bubble over the partner shows up to three of its needs at once, the most urgent first (on by
# default; off, the original's: one at a time, the two most urgent taking turns).
need_bubble_stack: "Several needs"
# Chibi style: the original game's models are chibi already; a model from elsewhere (a mod's, an imported one)
# that is not is drawn with the original's proportions, the drawing only: off or external models (the default).
chibi_style: "Chibi style"
chibi_style.off: "No"
chibi_style.external: "External"

