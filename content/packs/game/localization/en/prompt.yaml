# The names of the controls in button prompts (docs/architecture/ui.md). The engine only names the control
# (key:enter is key.enter here, gamepad:south is gamepad.south); family.<family>.<button> is how a family of gamepads
# names its own buttons (south is the bottom face button, east the right one). Letters, digits and F1 to F12 without
# a name here show as themselves ("A", "7", "F5").
