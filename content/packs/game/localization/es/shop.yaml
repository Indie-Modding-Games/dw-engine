# The shop that opens the story (script_common.c: openShop). The shopkeeper's lines are story texts
# (MAPHEAD); these are the screen's own labels.
next: "Seguir"
back: "Volver"
previous: "Anterior"
next_page: "Siguiente"
# {page} of {pages}.
page: "{page}/{pages}"
empty: "No hay nada."
# In case the story text with the options is missing.
buy: "Comprar"
sell: "Vender"
leave: "Salir"
bits: "Bits {bits}"
# A row of the buy list: {name} and its price, {price}.
buy_row: "{name}  {price}"
# A row of the sell list: {name}, its price {price} and how many you have, {count}.
sale_row: "{name} x{count}  {price}"
price: "Precio {price}"
# The amount: {value} of a maximum of {max}.
amount: "{value} / {max}"
total: "Total {total}"
less: "-"
more: "+"
max: "Máx"
# Shop extras (an optional improvement): a buy row with how many you already have, {owned}.
buy_row_owned: "{name}  {price}  x{owned}"
# Shop extras: in the amount box, how many you have and the money you have left after the deal.
owned: "Tienes {owned}"
money_after: "Te quedarán {bits} bits"
