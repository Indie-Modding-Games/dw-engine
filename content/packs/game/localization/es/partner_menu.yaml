# The partner menu (ui/partner_menu): status, bag and care. The original's own labels
# (HP, MP, the stats, the item options, the orders, the drop question, the bits) come from its tables.
tab.status: "Estado"
tab.items: "Objetos"
tab.care: "Cuidados"
# The names of the compact menu pages (skin.yaml layout: partner_menu: pages: compact).
nav.partner: "Compañero"
nav.bag: "Bolsa"
# The partner's species, under its own name (game_menu.c: drawDigimonStatsStrings).
species: "Especie"
age: "Edad"
# {days} is the partner's age in days; {days:día|días} picks the word by the count (1 día, 2 días).
age.value: "{days} {days:día|días}"
weight: "Peso"
# {weight} is the partner's weight.
weight.value: "{weight} G"
# {lives} are the lives the partner has left.
lives: "Vidas {lives}"
happiness: "Felicidad"
discipline: "Disciplina"
virus: "Virus"
# The sheet's extras (the status_extras option), which the original hides: the tiredness bar, the count of
# care mistakes and of battles, the hours it is awake, the hours of life it has left and the
# evolution counter.
tiredness: "Cansancio"
care_mistakes: "Errores"
battles: "Combates"
awake: "Despierto"
# {wake} and {sleepy} are the hours at which it wakes up and gets sleepy, like 08:00.
awake.value: "{wake}-{sleepy}"
# {value} is a number from 0 to 100 (-100 to 100 for happiness) that the sheet writes as a percentage: happiness,
# discipline and tiredness.
percent.value: "{value}%"
lifetime: "Le quedan"
evolution: "Evolución"
# {hours} is a count of game hours.
hours.value: "{hours} h"
# {hours} is the evolution counter and {check} the hours from which its level looks at evolution.
evolution.value: "{hours}/{check} h"
# The favorite food of its species (the favorite_food option), with the item's name; «Ninguna» if it has none.
