# El versus en línea (ui/versus): dos jugadores, cada uno en su máquina con los compañeros registrados de su partida.
title: "Versus en línea"
menu.host: "Crear partida"
menu.join: "Unirse a una partida"
menu.about: "Cada jugador usa su propia máquina y los compañeros que registró en la máquina de guardado de su partida. Los dos necesitan la misma versión del juego y el mismo contenido."
# El anfitrión elige cuántos combates tiene la serie (se juegan todos; gana quien gane más).
host_setup.question: "¿Cuántos combates?"
host_setup.battles: "◀ {count} combates ▶"
host_setup.hint: "Izquierda y derecha cambian el número; aceptar abre la partida."
# El anfitrión espera al invitado: le dice su código o su dirección.
hosting.waiting: "Esperando a que el otro jugador se una…"
hosting.codes: "Código para unirse:"
hosting.addresses: "Dirección:"
hosting.no_address: "No se encontró la dirección de esta máquina."
hosting.port: "Puerto UDP {port}"
hosting.network: "En la misma red basta con el código. Por internet, el anfitrión tiene que abrir o redirigir el puerto UDP 47120 en su router y dar su dirección pública."
# El invitado escribe el código o la dirección del anfitrión.
join.prompt: "Escribe el código o la dirección (IP:puerto) del anfitrión:"
join.bad: "Ese código o esa dirección no es válido."
join.hint: "Aceptar o Intro conecta; Volver borra la última letra."
joining: "Conectando con el anfitrión…"
# La partida de la que se traen los compañeros.
save_pick.title: "Elige la partida con tus compañeros registrados:"
save_pick.row: "{player} · {partner} ({count} registrados)"
save_pick.none: "No hay partidas guardadas."
# Los compañeros de cada combate, en orden.
lineup.title: "Compañero para el combate {number} de {battles}:"
lineup.row: "{name} ({species}) {stats}"
lineup.picked: "Elegidos: {names}"
waiting_lineup: "Esperando a que el otro jugador elija…"
# Un combate.
score: "1P {host} - {guest} 2P"
match.top: "Combate {round}/{battles}   {clock}   {score}"
match.you: "Tú: {name} ({species})"
match.rival: "Rival: {name} ({species})"
match.numbers: "PV {hp}/{max_hp}  PM {mp}/{max_mp}  {command}"
match.stalled: "Esperando al otro jugador…"
match.leave: "Pulsa Volver otra vez para abandonar la serie."
log.attack: "{who} usa {move}"
log.hit: "{who} recibe {amount} de daño"
log.finisher: "¡{who} lanza {move}!"
log.disobey: "{who} no obedece"
log.faint: "{who} cae"
# Entre combates y al final.
intermission.won: "Has ganado el combate {round}."
intermission.lost: "Has perdido el combate {round}."
intermission.draw: "Combate {round}: pierden los dos."
outcome.won: "Victoria"
outcome.lost: "Derrota"
outcome.draw: "Los dos pierden"
result.you: "¡Has ganado la serie!"
result.rival: "El rival ha ganado la serie."
result.draw: "Empate."
# Por qué terminó la serie antes de tiempo.
error.unknown: "La serie ha terminado."
error.no_answer: "El anfitrión no responde. Revisa el código o la dirección y que su puerto esté abierto."
error.silence: "Se perdió la conexión con el otro jugador."
error.left: "El otro jugador ha abandonado la serie."
error.version: "El otro jugador tiene otra versión del juego."
error.content: "El otro jugador tiene otro contenido del juego (otras reglas o datos)."
error.lineup: "Un compañero del otro jugador no existe en este contenido."
error.desync: "Los dos combates dejaron de coincidir; la serie se ha detenido."
error.damaged: "Llegó un mensaje dañado; la serie se ha detenido."
error.cannot_host: "No se pudo abrir el puerto para crear la partida."
error.cannot_join: "No se pudo conectar con esa dirección."
