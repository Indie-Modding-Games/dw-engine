number_icon.defense: "DEF"
number_icon.speed: "VEL"
# {seconds} is the time left to get up.
revive_countdown: "¡Levántate! {seconds}"
# After a technique's name in the strip: the MP it costs the partner ({mp}, a number).
mp_cost: "{mp} MP"
