# The final box writes the original's own lines (btl.battle_effect_messages); these finish one or are the engine's.
# The marks are the original's: {color:7} yellow, {color:1} white, {br} another row, {wait} the row that ends the
# line and waits. {amount} is the MP bonus as a percentage, after the original's «reducido un».
result.mp_bonus_percent: " {amount} %{wait}"
# {amount} is the bits won.
result.bits: "Has ganado {amount} {amount:bit|bits}."
# As in the original, the box does not split rows: each row ({br}, {wait}) fits in its 156 pixels with the game
# font (about 19 characters; the widest item name takes 93).
# {amount} is how many lives the partner lost.
result.lives_lost: "Tu compañero perdió{br}{color:7}{amount}{color:1} {amount:vida|vidas}.{wait}"
# {name} is the item's name and {amount} how many were lost.
result.item_lost: "Has perdido{br}{color:7}{name}{color:1} x{amount}.{wait}"
# {name} is the name of whoever joins the city.
result.recruit_joined: "¡{color:7}{name}{color:1}{br}se mudará a la ciudad!{wait}"
# The short label in front of a healing or buff figure on a fighter (modern look; the original draws
# the icon).
