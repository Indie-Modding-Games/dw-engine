# Nombres de los controles en los avisos de botones (docs/architecture/ui.md). El motor solo nombra el control
# (key:enter es key.enter aquí, gamepad:south es gamepad.south); family.<familia>.<botón> es como una familia de mandos
# llama a sus propios botones (south es el botón de abajo, east el de la derecha). Las letras, las cifras y F1 a F12
# sin nombre aquí se muestran tal cual ("A", "7", "F5").
