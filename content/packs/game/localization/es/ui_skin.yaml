# Los nombres de los aspectos de la UI del paquete del juego en los menús (ui/skins/<id>/skin.yaml nombra su clave).
# Un aspecto de un mod guarda su nombre en un archivo de textos propio: uno llamado ui_skin.yaml reemplazaría este
# entero.
modern: "Moderno"
original: "Original"
new: "Pixel art"
devvago: "DevVago"
# Una línea por aspecto bajo su nombre en la caja de cada arranque (ui/skin_picker); un mod la añade con la clave de
# su nombre más .hint.
modern.hint: "Paneles limpios y letra moderna."
original.hint: "Los menús del juego original, nítidos."
new.hint: "Ventanas azules y letra de píxeles."
devvago.hint: "El diseño de DevVago: azul noche y menús compactos."
