# The names of the game pack's UI skins in the menus (ui/skins/<id>/skin.yaml names its key).
# A mod's skin keeps its name in a text file of its own: one called ui_skin.yaml would replace this one
# entirely.
modern: "Moderno"
original: "Original"
new: "Pixel art"
devvago: "DevVago"
# One line per skin under its name in the box at each boot (ui/skin_picker); a mod adds it with its name's key
# plus .hint.
modern.hint: "Paneles limpios y letra moderna."
original.hint: "Los menús del juego original, nítidos."
new.hint: "Ventanas azules y letra de píxeles."
devvago.hint: "El diseño de DevVago: azul noche y menús compactos."
