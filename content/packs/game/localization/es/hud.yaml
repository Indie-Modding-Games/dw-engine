menu: "Menú"
# Field status. {hour} and {minute} are the game time, two digits each (00-23 and 00-59).
clock.time: "{hour}:{minute}"
# {day} is the day of the year (1-30 in the original's calendar) and {year} the year, both counted from 1.
clock.date: "Día {day}, año {year}"
need.hunger: "Hambre"
need.sleep: "Sueño"
need.toilet: "Baño"
need.tired: "Cansancio"
need.injured: "Herida"
need.sick: "Enfermedad"
# The shop job bar (the shop_job_bar option): its title, the customers served ({served} of {total}),
# what was earned against the tally at which the shopkeeper joins ({tally} of {goal} bits) and the next mark: the better
# pay from {tally}, the joining from {tally} and then the joining reached.
shop_job.title: "Trabajo en la tienda"
shop_job.customers: "Clientes {served}/{total}"
shop_job.tally: "{tally} / {goal} bits"
shop_job.better_pay: "Mejor paga desde {tally}"
shop_job.join_from: "Se une a la ciudad desde {tally}"
shop_job.joins: "¡Se une a la ciudad!"
shop_job.mark.pay: "Mejor paga"
shop_job.mark.join: "Se une"
shop_job.mark.bonus: "Premio"
shop_job.bonus_from: "Premio desde {tally}"
shop_job.bonus_reached: "¡Premio conseguido!"
# The round minimap (an engine improvement): the north mark on its ring and the day under it, next to the time (clock.time).
minimap.north: "N"
minimap.day: "Día {day}"
# The word of the lives box (when losing one), for skins that write it instead of the original's drawing.
lives_box.label: "Vidas"
