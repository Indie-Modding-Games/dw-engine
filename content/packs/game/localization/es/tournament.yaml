# El cuadro de la copa, para las apariencias que dicen la ronda (la original no la muestra). {round} es 1 o 2.
bracket.round: "Ronda {round}"
bracket.final: "Final"
bracket.champion: "Campeón"
# El nombre de la copa por su grado, en la tarjeta de la presentación (para las apariencias que lo escriben).
bracket.cup: "Copa {grade}"
# Un combate de copa: los datos de la presentación (STD_renderIntroStats) y la caja del daño al agotarse el tiempo
# (STD_renderTimeoutWindow).
match.hp: "PV"
match.mp: "PM"
match.offense: "Ataque"
match.defense: "Defensa"
match.speed: "Velocidad"
match.brains: "Inteligencia"
match.damage: "Daño"
match.time_up: "TIEMPO"
