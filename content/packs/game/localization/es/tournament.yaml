# The cup bracket, for the looks that show the round (the original does not). {round} is 1 or 2.
bracket.round: "Ronda {round}"
bracket.final: "Final"
bracket.champion: "Campeón"
# The cup's name by its grade, on the intro card (for the looks that write it).
bracket.cup: "Copa {grade}"
# A cup match: the intro data (STD_renderIntroStats) and the damage box when time runs out
# (STD_renderTimeoutWindow).
match.hp: "PV"
match.mp: "PM"
match.offense: "Ataque"
match.defense: "Defensa"
match.speed: "Velocidad"
match.brains: "Inteligencia"
match.damage: "Daño"
match.time_up: "TIEMPO"
