# The language's name in the language itself, as the language selector shows it.
name: "Español"
# The name of each language in that language, the same in the texts of all languages: this is how the language box lists them.
native.en: "English"
native.es: "Español"
# The flag of each language, the asset id of its image (ui/flags, scripts/art/make_flags.py), the same in the texts of
# all languages: the language box shows it next to the name. A new language brings its image and its key here.
flag.en: "ui/flags/en"
flag.es: "ui/flags/es"
