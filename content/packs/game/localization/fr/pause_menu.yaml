help.free_exploration: "Tous les chemins des cartes s'ouvrent, quoi que dise l'histoire."
help.walk_control: "Marche avec le clavier et la manette, ou avec la souris (jamais les deux à la fois)."
help.autosave: "Le jeu sauvegarde tout seul dans l'emplacement de ton aventure quand les règles le prévoient."
help.world_map: "M (L1 sur une manette) ouvre une carte de toute l'île qui montre où tu es."
help.bulk_trades: "Le marchand d'objets et les paquets de cartes demandent combien d'un coup."
help.long_names: "Les noms acceptent jusqu'à douze lettres au lieu des six de l'original."
help.evolution_requirements: "Le tableau d'évolution dit ce qu'il faut pour chaque forme et où en est ton partenaire."
help.canonical_stages: "Le tableau nomme les niveaux comme la série et ajoute une case Méga."
help.rare_items: "Certains emplacements d'objets peuvent cacher un objet d'évolution rare. Demande le contenu caché."
help.battle_speed: "Les combats vont deux fois plus vite, toujours ou avec R (gâchette droite). Mêmes résultats."
help.enemy_hp_bars: "Une barre de vie sur chaque ennemi pendant tout le combat, coupes comprises. Non : seulement un moment après un coup."
help.gym_sessions: "Un parcours du gymnase enchaîne ce nombre de séances. Il attend pendant que tu t'occupes de ton partenaire ; il s'arrête si tu annules, t'éloignes, ou s'il est blessé ou malade."
help.quick_battle_start: "Un combat sur le terrain commence dès qu'il se déclenche, sans l'introduction. Les coupes gardent la leur."
help.shop_job_mode: "Amélioré : une file de clients équitable et un écran de marchandage qui montre les chances de chaque prix. Original : les menus de prix de l'original."
help.difficulty: "Normale, c'est l'original. Facile : ton partenaire frappe plus fort, encaisse moins, s'entraîne mieux, a plus de temps pour manger et tombe moins malade."
help.skip_evolution: "Confirmer ou annuler termine tout de suite la scène d'évolution. La nouvelle forme est la même."
help.choice_cancel_closes: "Annuler un choix ne fait que le fermer. Dans l'original, certains choix lancent leur première réponse."
help.fair_sickness_chance: "Un risque de maladie sous zéro veut dire aucune maladie. Dans l'original, ton partenaire tombe toujours malade."
help.fair_evolution_average: "Chaque forme candidate est jugée sur ses propres stats, pas sur des sommes laissées par la précédente."
help.fair_move_forgetting: "Oublier une technique n'enlève que celle-là. Dans l'original, elle peut en emporter une autre."
help.fair_card_stock: "La boutique de cartes ne propose jamais deux fois la même carte dans la journée. Dans l'original, si."
help.choose_egg_after_lives_lost: "Quand ton partenaire perd toutes ses vies, tu choisis le nouvel œuf, comme après une mort naturelle. Dans l'original, c'est au hasard."
help.generous_talk: "Parle aux personnages et lis les panneaux d'un peu plus loin, dans n'importe quelle direction. L'original demande d'être plus près."
help.extra_toilets: "Ajoute quelques toilettes de plus, comme celles près du panneau du gymnase. Place-toi devant quand ton partenaire a besoin d'y aller. L'original n'a que les siennes."
help.angemon_event_zone: "Une fois la lumière d'Angemon libérée, son événement démarre au rez-de-chaussée du Sanctuaire de Glace, quel que soit ton chemin. L'original ne le lance que par l'escalier de la trappe."
help.whamon_in_water: "Avant l'événement d'Ogremon, Whamon attend dans l'eau près du rivage de la Grotte de la Plage Secrète, où tu lui parles. L'original le laisse loin, hors de vue."
help.coop_difficulty: "En coop, les ennemis se renforcent avec chaque partenaire qui combat et chaque joueur qui aide. Standard garde un combat équilibré, Difficile le corse, Non garde les chiffres de l'original. Seul le choix de l'hôte compte."
help.status_extras: "La page d'état montre la fatigue, les erreurs, les combats, les heures d'éveil, la durée de vie et l'évolution."
help.display_mode: "Jouer en fenêtre ou en plein écran."
help.vsync: "Synchronise les images avec l'écran pour éviter les déchirures."
help.smooth_motion: "Les personnages et la caméra glissent entre les images de l'original."
help.hd_scenery: "Les décors sont dessinés nets à la résolution de la fenêtre. Seul l'aspect change."
help.scenery_quality: "Avec les décors HD : agrandis une fois par carte (plus nets) ou seulement lissés."
help.antialiasing: "Adoucit les bords des modèles 3D."
help.texture_filter: "Les textures des modèles sur le terrain, en combat et dans les menus : agrandies, lissées ou en pixels d'origine."
help.model_characters: "Les personnages que certains lieux montrent en images plates sont dessinés avec leurs modèles 3D. Seul l'aspect change."
help.widescreen_pictures: "Dans une fenêtre large, l'image titre la remplit et les vidéos occupent toute la largeur."
help.enhanced_lighting: "L'heure teinte la scène, et les lampes et les feux éclairent ce qui les entoure."
help.vivid_colors: "Des couleurs plus riches, un léger contraste et un éclat sur les points lumineux. Les menus ne changent jamais."
help.shadows: "Aucune ombre, l'ombre ronde de l'original, ou en plus une ombre de soleil qui tourne avec l'heure."
help.chibi_style: "Dessine les modèles d'ailleurs (mods, imports) avec les proportions de l'original."
help.weather: "Pluie, orage, neige, brouillard, vent, nuages et soleil sur les cartes en extérieur. Aucune règle ne change."
help.seasons: "Printemps, été, automne et hiver colorent l'extérieur tous les quelques jours."
help.music_volume: "Volume de la musique et du son des vidéos. 10 est le niveau de l'original."
help.effects_volume: "Volume des effets et des sons des menus. 10 est le niveau de l'original."
help.continuous_music: "Quand la carte suivante a déjà sa musique en cours, elle continue au lieu de recommencer."
help.reverb: "L'écho de la puce sonore sur la musique et les effets, comme l'original. Sans, tout sonne sec."
help.ui_skin: "L'aspect des menus et du HUD : celui de l'original ou le moderne."
help.ui_addon: "Une interface faite par la communauté à la place de celle du jeu. Elle s'applique à la fermeture du menu ; garde Maj enfoncée au lancement pour retrouver celle du jeu."
help.ui_plugins: "Les plugins de la communauté (une horloge, des avis...) par-dessus l'interface. Ils s'appliquent à la fermeture du menu."
help.ui_scale: "La taille des menus et du HUD."
help.language: "La langue des textes."
help.text_font: "Écrit les textes avec la police de l'original."
help.translated_signs: "Les panneaux peints sur les cartes s'affichent dans ta langue."
help.minimap: "La minicarte ronde en haut à droite, avec le nom de la carte, le jour et l'heure."
help.minimap_enemies: "Un point rouge sur la minicarte pour chaque ennemi qui peut lancer un combat."
help.minimap_items: "Un losange vert sur la minicarte pour chaque objet à ramasser par terre."
help.digital_time: "L'heure du jeu en chiffres (HH:MM) sous l'horloge."
help.save_notice: "Une petite figurine et « Sauvegarde » dans un coin pendant que le jeu sauvegarde."
help.need_bubble_stack: "La bulle de ton partenaire montre jusqu'à cinq besoins à la fois, le plus urgent en premier."
help.shop_job_bar: "Une barre montre où tu en es quand un job ou un match décide si quelqu'un rejoint la ville."
help.name_spacing: "Un nom dans un texte ne se colle jamais au mot suivant."
help.shop_extras: "Dans les boutiques : la description de l'objet choisi, combien tu en as et l'argent qu'il te restera."
help.favorite_food: "La page d'état montre le plat préféré de ton partenaire, et les listes d'objets le marquent en or avec un cœur."
help.art_fixes: "Corrige les images que l'original prend au mauvais endroit de sa texture (le bonheur de la page d'état)."
help.dev_tools: "Active la console (F1), le menu développeur (F2) et la surcouche de carte (F3). Pour les tests."
help.options_reset: "Remet les options de cet onglet à leurs valeurs par défaut. Demande d'abord."
help.options_back: "Retour au menu."
help.quick_save: "Sauvegarde la partie maintenant dans son emplacement."
help.to_title: "Retour à l'écran titre. Demande d'abord s'il faut sauvegarder."
help.quit: "Ferme le jeu. Demande d'abord s'il faut sauvegarder."
help.quit_title: "Ferme le jeu."
