help.free_exploration: "Todos os caminhos dos mapas se abrem, não importa o ponto da história."
help.walk_control: "Ande com o teclado e o controle, ou com o mouse (nunca os dois juntos)."
help.autosave: "O jogo salva sozinho no espaço da sua aventura quando as regras mandam."
help.world_map: "M (L1 no controle) abre um mapa da ilha inteira mostrando onde você está."
help.bulk_trades: "O trocador de itens e os pacotes de cartas perguntam quantos de uma vez."
help.long_names: "Os nomes aceitam até doze letras em vez das seis do original."
help.evolution_requirements: "A tabela de evolução mostra o que cada destino pede e como está seu parceiro."
help.canonical_stages: "A tabela chama os estágios como a série e acrescenta um quadro Mega."
help.rare_items: "Alguns pontos de itens podem esconder um item raro de evolução. Requer o conteúdo oculto."
help.battle_speed: "As batalhas rodam no dobro da velocidade, sempre ou ao apertar R (gatilho direito). Mesmo resultado."
help.enemy_hp_bars: "Uma barra de vida sobre cada inimigo a batalha toda, em copas também. Desligado: só um tempo após um golpe."
help.gym_sessions: "Um curso do ginásio treina este número de sessões seguidas. Espera enquanto você cuida do parceiro; para se você cancelar, se afastar ou ele se machucar ou ficar doente."
help.quick_battle_start: "Uma batalha no mapa começa assim que é ativada, sem a espera inicial. As copas mantêm a sua."
help.shop_job_mode: "Melhorado: uma fila justa de clientes e uma tela de pechincha que mostra as chances de cada preço. Original: os menus de preço do original."
help.difficulty: "Normal é o original. Fácil: seu parceiro bate mais forte, sofre menos, treina mais, tem mais tempo para comer e fica menos doente."
help.skip_evolution: "Confirmar ou cancelar encerra na hora a cena de uma evolução. A nova forma é a mesma."
help.choice_cancel_closes: "Cancelar uma escolha só a fecha. No original, algumas escolhas executam a primeira resposta."
help.fair_sickness_chance: "Uma chance de doença abaixo de zero não deixa doente. No original, ela sempre deixa seu parceiro doente."
help.fair_evolution_average: "Cada candidato a evolução é avaliado pelos próprios atributos, não por somas que sobraram do anterior."
help.fair_move_forgetting: "Esquecer uma técnica remove só essa técnica. No original, ela pode levar outra junto."
help.fair_card_stock: "A loja de cartas nunca oferece a mesma carta duas vezes no mesmo dia. No original, pode."
help.choose_egg_after_lives_lost: "Quando seu parceiro perde todas as vidas, você escolhe o novo ovo, como após uma morte natural. No original, é aleatório."
help.generous_talk: "Fale com os personagens e leia as placas de um pouco mais longe, para onde quer que olhe. O original pede que você chegue mais perto."
help.extra_toilets: "Acrescenta mais algumas cabines de banheiro, como a perto da placa do ginásio. Fique na frente de uma quando seu parceiro precisar ir. O original só tem os próprios banheiros."
help.angemon_event_zone: "Depois que a luz do Angemon é libertada, o evento dele começa no térreo do Santuário de Gelo, não importa por onde você volte. O original só o inicia pela escada do alçapão."
help.whamon_in_water: "Antes do evento do Ogremon, o Whamon espera na água junto à margem da Caverna da Praia Secreta, onde você fala com ele. O original o deixa lá no fundo, fora de vista."
help.coop_difficulty: "No cooperativo, os inimigos ficam mais fortes a cada parceiro que luta e a cada jogador que ajuda. Padrão mantém a batalha justa, difícil aperta, desligada mantém os números do original. Só vale a escolha do anfitrião."
help.coop_open_to_join: "Quando você é o anfitrião do cooperativo, novos jogadores podem entrar no seu jogo já em andamento. Desligue para deixá-lo só com quem já está; quem cair ainda pode voltar. Vale na hora para a sala que você hospeda."
help.status_extras: "A página de status mostra cansaço, erros, batalhas, horas acordado, tempo de vida e evolução."
help.display_mode: "Jogue em uma janela ou em tela cheia."
help.vsync: "Sincroniza os quadros com a tela para a imagem não rasgar."
help.smooth_motion: "Os personagens e a câmera deslizam entre os quadros do original."
help.hd_scenery: "Os cenários são desenhados nítidos na resolução da janela. Só muda o visual."
help.scenery_quality: "Com cenários em HD: ampliados uma vez por mapa (mais nítidos) ou só suavizados."
help.antialiasing: "Suaviza as bordas dos modelos 3D."
help.texture_filter: "As texturas dos modelos no mapa, na batalha e nos menus: ampliadas, suavizadas ou com os pixels do original."
help.model_characters: "Os personagens que alguns lugares mostram como desenhos planos aparecem com seus modelos 3D. Só muda o visual."
help.widescreen_pictures: "Numa janela larga, a imagem do título a preenche e os vídeos ocupam a largura toda."
help.enhanced_lighting: "A hora do dia tinge a cena, e lâmpadas e fogueiras iluminam o que está perto."
help.vivid_colors: "Cores mais ricas, um contraste suave e brilho nos pontos claros. Os menus nunca mudam."
help.shadows: "Sem sombras, a redonda do original, ou também uma sombra do sol que gira com o relógio."
help.chibi_style: "Desenha modelos de fora (mods, importados) com as proporções do original."
help.weather: "Chuva, tempestades, neve, neblina, vento, nuvens e sol nos mapas ao ar livre. Nenhuma regra muda."
help.seasons: "Primavera, verão, outono e inverno colorem as áreas externas a cada poucos dias."
help.music_volume: "Volume da música e do som dos vídeos. 10 é o nível do original."
help.effects_volume: "Volume dos efeitos e dos sons dos menus. 10 é o nível do original."
help.continuous_music: "Quando o próximo mapa tem a mesma música que já está tocando, ela continua em vez de recomeçar."
help.reverb: "O eco de sala do chip de som na música e nos efeitos, como no original. Desligado, tudo soa seco."
help.ui_skin: "O visual dos menus e do HUD: o do original ou o moderno."
help.ui_addon: "Uma interface feita pela comunidade no lugar da do jogo. Vale ao fechar o menu; segure Shift ao abrir o jogo para voltar à do jogo."
help.ui_plugins: "Os plugins da comunidade (um relógio, avisos...) sobre a interface. Vale ao fechar o menu."
help.ui_scale: "O tamanho dos menus e do HUD."
help.language: "O idioma dos textos."
help.text_font: "Escreve os textos com a fonte do original."
help.translated_signs: "As placas pintadas nos mapas aparecem no seu idioma."
help.minimap: "O minimapa redondo no canto superior direito, com o nome do mapa, o dia e a hora."
help.minimap_enemies: "Um ponto vermelho no minimapa para cada inimigo que pode começar uma batalha."
help.minimap_items: "Um losango verde no minimapa para cada item caído no chão para pegar."
help.digital_time: "A hora do jogo em dígitos (HH:MM) embaixo do relógio."
help.save_notice: "Uma figurinha e \"Salvando\" num canto enquanto o jogo salva."
help.need_bubble_stack: "O balão do seu parceiro mostra até cinco necessidades de uma vez, primeiro a que vai prejudicá-lo antes."
help.shop_job_bar: "Uma barra mostra quanto falta enquanto um trabalho ou uma partida decide se alguém se junta à cidade."
help.name_spacing: "Um nome dentro de um texto nunca fica grudado na palavra seguinte."
help.shop_extras: "Nas lojas: a descrição do item escolhido, quantos você tem e o dinheiro que vai sobrar."
help.favorite_food: "A página de status mostra a comida favorita do seu parceiro, e as listas de itens a marcam em dourado com um coração."
help.art_fixes: "Corrige desenhos que o original tira da parte errada da textura (a felicidade na página de status)."
help.dev_tools: "Liga o console (F1), o menu de desenvolvedor (F2) e a camada do mapa (F3). Para testes."
help.options_reset: "Volta as opções desta aba aos valores padrão. Pergunta antes."
help.options_back: "Volta ao menu."
help.quick_save: "Salva o jogo agora no espaço dele."
help.to_title: "Volta à tela de título. Pergunta antes se quer salvar."
help.quit: "Fecha o jogo. Pergunta antes se quer salvar."
help.quit_title: "Fecha o jogo."
