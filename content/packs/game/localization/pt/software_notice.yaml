# The notice that the game draws without a graphics card (ui/software_notice, docs/architecture/software-mode.md).
title: "Jogando sem placa de vídeo"
body: "O jogo está desenhando com o processador, então pode ficar lento. A qualidade se ajusta sozinha; você pode mudá-la em Opções > Gráficos."
fix: "Para resolver, instale ou atualize o driver da sua placa de vídeo pelo site do fabricante."
compatible.title: "Modo gráfico compatível"
compatible.body: "Sua placa de vídeo tem um driver Vulkan antigo, então o jogo a usa no modo compatível: a imagem e o jogo são iguais, talvez um pouco mais lento."
compatible.fix: "Atualizar o driver da sua placa de vídeo pelo site do fabricante pode deixar o jogo mais rápido."
your_card: "placa de vídeo"
reason.basic_display_adapter: "Sua {adapter} está funcionando sem o driver. Instale-o pelo site do fabricante da placa e reinicie."
reason.dedicated_gpu_unused: "Sua {dedicated} não está sendo usada. Em Configurações do Windows > Sistema > Tela > Gráficos, coloque o jogo em Alto desempenho."
reason.driver_too_old: "O driver da sua {gpu} é o {driver}; instale o {minimum} ou mais novo pelo site do fabricante."
reason.no_vendor_driver: "Sua {adapter} não tem driver Vulkan. Instale-o pelo site do fabricante da placa e reinicie."
reason.vulkan_too_old: "Sua {gpu} só oferece Vulkan {api}. Atualize o driver; se não resolver, a placa é antiga demais."
reason.missing_features: "Sua {gpu} não tem recursos de que o jogo precisa. Atualize o driver; se não resolver, a placa é antiga demais."
reason.gpu_unsuitable: "Sua {gpu} não consegue rodar o jogo com o driver atual. Atualize-o pelo site do fabricante."
reason.hardware_no_vulkan: "Sua {adapter} não é compatível com Vulkan, então o processador desenha no lugar dela."
reason.instance_failed: "O Vulkan não iniciou. Reinstale o driver de vídeo e feche overlays ou gravadores de tela."
reason.device_failed: "Sua {gpu} se recusou a iniciar. Reinstale o driver e feche overlays ou gravadores de tela."
reason.device_lost: "Sua {gpu} parou de responder. Atualize o driver e verifique se ela não está superaquecendo."
reason.out_of_memory: "Sua {gpu} ficou sem memória de vídeo. Feche outros programas enquanto joga."
reason.virtual_machine: "O jogo está rodando em uma máquina virtual. Jogue no computador de verdade para ter velocidade total."
reason.remote_session: "O jogo está rodando por área de trabalho remota, que esconde a placa de vídeo. Jogue no próprio computador."
reason.implicit_layers: "Um overlay ou gravador de tela bloqueou a placa de vídeo. Feche-o e abra o jogo de novo."
reason.compatible_path: "Atualizar o driver da sua {gpu} pelo site do fabricante pode deixar o jogo mais rápido."
reason.no_gpu: "Nenhuma placa de vídeo com Vulkan foi encontrada. Instale o driver da sua placa pelo site do fabricante."
