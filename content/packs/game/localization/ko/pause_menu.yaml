help.evolution_requirements: "진화 도감에 각 진화의 조건과 파트너의 현재 상태가 나와요."
help.canonical_stages: "도감이 세대를 시리즈식으로 부르고 궁극체 칸을 더해요."
help.rare_items: "아이템 자리에 희귀한 진화 아이템이 숨어 있을 수 있어요. 숨겨진 콘텐츠가 필요해요."
help.battle_speed: "배틀이 2배 속도로 진행돼요. 항상, 또는 R(오른쪽 트리거)로 전환. 결과는 같아요."
help.enemy_hp_bars: "배틀 내내 모든 적 위에 체력 막대가 보여요. 대회도요. 끄면 맞은 뒤 잠깐만 보여요."
help.gym_sessions: "체육관 훈련을 이만큼 연달아 해요. 파트너를 돌보는 동안은 기다리고, 취소하거나 자리를 뜨거나 파트너가 다치거나 병에 걸리면 멈춰요."
help.quick_battle_start: "필드의 배틀이 시작 연출 없이 바로 시작돼요. 대회는 그대로예요."
help.shop_job_mode: "개선판: 공정한 손님 줄과 가격별 성공 확률이 보이는 흥정 화면. 원작: 원작의 가격 메뉴."
help.battle_system: "클래식은 원작 배틀입니다. Folder: 파트너에게 명령과 자세를 주고, 명령한 기술만 씁니다. 다음 배틀부터 적용됩니다."
help.difficulty: "보통은 원작 그대로. 쉬움: 파트너가 더 세게 때리고, 덜 맞고, 더 많이 성장하고, 밥 먹을 시간이 길고, 병에 덜 걸려요."
help.skip_evolution: "선택이나 취소를 누르면 진화 장면이 바로 끝나요. 진화 결과는 같아요."
help.choice_cancel_closes: "선택지에서 취소하면 닫히기만 해요. 원작에서는 첫 번째 답을 고르는 선택지도 있어요."
help.fair_sickness_chance: "발병 확률이 0보다 낮으면 병에 걸리지 않아요. 원작에서는 오히려 꼭 병에 걸려요."
help.fair_evolution_average: "진화 후보마다 자기 능력치로 비교해요. 앞 후보의 합계가 남아 섞이지 않아요."
help.fair_move_forgetting: "기술을 잊으면 그 기술만 사라져요. 원작에서는 다른 기술까지 사라질 수 있어요."
help.fair_card_stock: "카드 가게가 하루에 같은 카드를 두 번 내놓지 않아요. 원작에서는 그럴 수 있어요."
help.roaming_rare_chance: "맵에 들어갈 때마다 마메몬, 메탈마메몬, 픽시몬이 나타날 확률이에요. 오리지널은 3%예요."
help.choose_egg_after_lives_lost: "파트너가 목숨을 다 잃으면 수명이 다했을 때처럼 새 알을 직접 골라요. 원작에서는 무작위예요."
help.generous_talk: "조금 더 멀리서, 어느 쪽을 보고 있든 말을 걸고 표지판을 읽어요. 원작은 더 가까이 가야 해요."
help.extra_toilets: "체육관 표지판 옆 같은 곳에 화장실을 몇 개 더 놓아요. 파트너가 볼일이 급하면 그 앞에 서세요. 원작은 원래 화장실만 있어요."
help.angemon_event_zone: "엔젤몬의 빛을 풀어 주면 어느 길로 돌아오든 얼음 성역 1층에서 이벤트가 시작돼요. 원작은 뚜껑문 계단으로 와야만 시작돼요."
help.whamon_in_water: "오거몬 이벤트 전에는 와몬이 비밀 해변 동굴의 물가에서 기다려서 말을 걸 수 있어요. 원작은 보이지 않는 먼 곳에 둬요."
help.boosted_techniques: "종마다 가장 잘 쓰는 기술이 하나 있어요. 파트너가 그 기술을 알면 위력이 25% 오르고 MP 소모가 25% 줄어요. 원작에는 없어요."
help.coop_difficulty: "협동에서 싸우는 파트너와 돕는 플레이어가 늘수록 적이 강해져요. 표준은 공정하게, 어려움은 더 세게, 끄기는 원작 수치 그대로. 호스트의 설정만 적용돼요."
help.coop_open_to_join: "협동에서 호스트일 때, 이미 시작된 게임에 새 플레이어가 참가할 수 있어요. 끄면 지금 있는 플레이어만 함께하고, 연결이 끊긴 플레이어는 다시 돌아올 수 있어요. 호스트 중인 방에 바로 적용돼요."
help.status_extras: "상태 화면에 피로, 실수, 배틀, 깨어 있는 시간, 수명, 진화가 나와요."
help.display_mode: "창 모드나 전체 화면으로 플레이해요."
help.vsync: "화면이 찢어지지 않도록 프레임을 모니터와 맞춰요."
help.smooth_motion: "캐릭터와 카메라가 원작의 프레임 사이를 부드럽게 움직여요."
help.hd_scenery: "배경을 창 해상도로 선명하게 그려요. 보이는 것만 달라져요."
help.scenery_quality: "HD 배경일 때: 맵마다 한 번 업스케일(더 선명) 또는 부드럽게만."
help.antialiasing: "3D 모델의 가장자리를 매끄럽게 해요."
help.graphics_preset: "모든 그래픽 옵션을 한 번에 맞춰요. 성능이 가장 가볍고, 품질이 게임의 기본 화면이에요. 옵션을 하나라도 바꾸면 사용자 지정이 돼요."
help.graphics_device: "게임이 그리는 데 쓰는 장치: {gpu}."
help.auto_quality: "게임이 부드럽게 돌아가도록 화질을 알아서 낮추거나 높여요. 그래픽 카드가 없거나 성능이 낮으면 기본으로 켜져요."
help.render_scale: "장면을 작게 그려서 창에 맞게 늘려요. 느린 컴퓨터에서 훨씬 빠르지만 조금 흐려져요."
help.frame_limit: "초당 프레임 수를 제한해요. 느린 컴퓨터에서 더 안정적이고 가벼워요."
help.texture_filter: "필드, 배틀, 메뉴의 모델 텍스처: 업스케일, 부드럽게, 또는 원작의 픽셀."
help.model_characters: "일부 장소에서 평면 그림으로 나오는 캐릭터를 3D 모델로 그려요. 보이는 것만 달라져요."
help.widescreen_pictures: "넓은 창에서 타이틀 그림이 화면을 채우고 동영상이 가로를 채워요."
help.enhanced_lighting: "시간대에 따라 장면의 색이 바뀌고, 등불과 불이 주변을 밝혀요."
help.vivid_colors: "더 풍부한 색, 은은한 대비, 밝은 곳의 빛 번짐. 메뉴는 바뀌지 않아요."
help.shadows: "그림자 없음, 원작의 원형 그림자, 또는 시계에 따라 도는 햇빛 그림자도."
help.chibi_style: "다른 곳(모드, 가져온 모델)의 모델을 원작의 비율로 그려요."
help.weather: "바깥 맵에 비, 폭풍, 눈, 안개, 바람, 구름, 햇빛. 규칙은 바뀌지 않아요."
help.seasons: "며칠마다 봄, 여름, 가을, 겨울이 바깥 풍경을 물들여요."
help.music_volume: "음악과 동영상 소리의 볼륨. 10이 원작의 크기예요."
help.effects_volume: "효과음과 메뉴 소리의 볼륨. 10이 원작의 크기예요."
help.continuous_music: "다음 맵의 곡이 이미 나오고 있으면 처음부터 다시 틀지 않고 이어서 들려줘요."
help.reverb: "원작처럼 음악과 효과음에 사운드 칩의 울림을 넣어요. 끄면 모두 건조하게 들려요."
help.ui_skin: "메뉴와 HUD의 모습: 원작풍 또는 모던."
help.ui_addon: "게임 기본 대신 커뮤니티가 만든 인터페이스를 써요. 메뉴를 닫으면 적용돼요. 게임을 시작할 때 Shift를 누르고 있으면 게임 기본으로 돌아가요."
help.ui_plugins: "인터페이스 위에 얹는 커뮤니티 플러그인(시계, 알림...). 메뉴를 닫으면 적용돼요."
help.ui_scale: "메뉴와 HUD의 크기."
help.language: "텍스트의 언어."
help.text_font: "텍스트를 원작의 글꼴로 써요."
help.translated_signs: "맵에 그려진 표지판을 선택한 언어로 읽을 수 있어요."
help.minimap: "오른쪽 위의 둥근 미니맵. 맵 이름, 날짜, 시간도 나와요."
help.minimap_enemies: "배틀을 걸어 올 수 있는 적마다 미니맵에 빨간 점이 찍혀요."
help.minimap_items: "땅에 떨어져 있어 주울 수 있는 아이템마다 미니맵에 초록 마름모가 찍혀요."
help.digital_time: "시계 아래에 게임 시간을 숫자(HH:MM)로 보여 줘요."
help.save_notice: "게임이 저장하는 동안 구석에 작은 그림과 “저장 중”이 나와요."
help.need_bubble_stack: "파트너의 말풍선에 요구가 최대 5개까지 함께 나와요. 가장 급한 것부터요."
help.need_meters: "필드에 행복, 규율, 배고픔, 화장실, 피로 막대가 나와요. 뒤의 세 개는 요구가 다가올수록 차올라요."
help.danger_alert: "파트너를 쓰러뜨릴 만큼 강한 야생 디지몬 위에 작은 악마가 떠요."
help.shop_job_bar: "일이나 시합으로 누군가 마을에 합류할지 정해질 때 얼마나 가까운지 막대로 보여 줘요."
help.name_spacing: "텍스트 속 이름이 다음 단어와 붙지 않아요."
help.shop_extras: "상점에서: 고른 아이템의 설명, 가진 개수, 거래 뒤 남는 돈."
help.favorite_food: "상태 화면에 파트너가 좋아하는 음식이 나오고, 아이템 목록에서는 금색과 하트로 표시돼요."
help.art_fixes: "원작이 텍스처의 엉뚱한 부분에서 가져오는 그림(상태 화면의 행복)을 바로잡아요."
help.dev_tools: "콘솔(F1), 개발자 메뉴(F2), 맵 오버레이(F3)를 켜요. 테스트용이에요."
help.options_reset: "이 탭의 설정을 기본값으로 되돌려요. 먼저 물어봐요."
help.options_back: "메뉴로 돌아가요."
help.quick_save: "지금 게임을 슬롯에 저장해요."
help.to_title: "타이틀 화면으로 돌아가요. 저장할지 먼저 물어봐요."
help.quit: "게임을 종료해요. 저장할지 먼저 물어봐요."
# The same options over the title screen, with no game to save.
help.quit_title: "게임을 종료해요."
