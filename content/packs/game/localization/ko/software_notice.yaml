# The notice that the game draws without a graphics card (ui/software_notice, docs/architecture/software-mode.md).
title: "그래픽 카드 없이 플레이 중"
body: "프로세서로 화면을 그리고 있어서 느릴 수 있어요. 화질은 자동으로 조정되며, 설정 > 그래픽에서 바꿀 수 있어요."
fix: "해결하려면 그래픽 카드 제조사 웹사이트에서 드라이버를 설치하거나 업데이트하세요."
compatible.title: "호환 그래픽 모드"
compatible.body: "그래픽 카드의 Vulkan 드라이버가 오래되어 호환 모드로 실행 중이에요. 화면과 플레이는 똑같고, 조금 느릴 수 있어요."
compatible.fix: "그래픽 카드 제조사 웹사이트에서 드라이버를 업데이트하면 더 빨라질 수 있어요."
your_card: "그래픽 카드"
reason.basic_display_adapter: "{adapter}에 전용 드라이버가 설치되지 않았어요. 카드 제조사 웹사이트에서 설치하고 다시 시작하세요."
reason.dedicated_gpu_unused: "지금 {dedicated}에서 게임이 실행되지 않고 있어요. Windows 설정 > 시스템 > 디스플레이 > 그래픽에서 게임을 고성능으로 설정하세요."
reason.driver_too_old: "{gpu}의 드라이버 버전: {driver}. 제조사 웹사이트에서 {minimum} 이상을 설치하세요."
reason.no_vendor_driver: "{adapter}에 Vulkan 드라이버가 없어요. 카드 제조사 웹사이트에서 설치하고 다시 시작하세요."
reason.vulkan_too_old: "{gpu}에서는 Vulkan {api}까지만 지원해요. 드라이버를 업데이트하세요. 그래도 안 되면 카드가 너무 오래된 거예요."
reason.missing_features: "{gpu}에 게임에 필요한 기능이 없어요. 드라이버를 업데이트하세요. 그래도 안 되면 카드가 너무 오래된 거예요."
reason.gpu_unsuitable: "지금 드라이버로는 {gpu}에서 게임을 실행할 수 없어요. 제조사 웹사이트에서 업데이트하세요."
reason.hardware_no_vulkan: "{adapter}에서 Vulkan을 지원하지 않아 프로세서로 화면을 그려요."
reason.instance_failed: "Vulkan이 시작되지 않았어요. 그래픽 드라이버를 다시 설치하고 오버레이나 녹화 프로그램을 닫으세요."
reason.device_failed: "{gpu}에서 그래픽을 시작하지 못했어요. 드라이버를 다시 설치하고 오버레이나 녹화 프로그램을 닫으세요."
reason.device_lost: "{gpu}의 응답이 멈췄어요. 드라이버를 업데이트하고 과열되지 않는지 확인하세요."
reason.out_of_memory: "{gpu}의 비디오 메모리가 부족해요. 플레이하는 동안 다른 프로그램을 닫으세요."
reason.virtual_machine: "게임이 가상 머신에서 실행 중이에요. 제 속도로 플레이하려면 실제 컴퓨터에서 실행하세요."
reason.remote_session: "게임이 원격 데스크톱으로 실행 중이라 그래픽 카드가 보이지 않아요. 컴퓨터 앞에서 직접 플레이하세요."
reason.implicit_layers: "오버레이나 녹화 프로그램이 그래픽 카드를 막았어요. 그 프로그램을 닫고 게임을 다시 시작하세요."
reason.compatible_path: "제조사 웹사이트에서 {gpu}의 드라이버를 업데이트하면 더 빨라질 수 있어요."
reason.no_gpu: "Vulkan을 지원하는 그래픽 카드를 찾지 못했어요. 카드 제조사 웹사이트에서 드라이버를 설치하세요."
