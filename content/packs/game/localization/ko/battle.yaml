  ########.##.....####..##..########..##
  .##..##..##....##..##.##..##........##
  .##..##..##....##..##.##..#######...##
  .##..##..####..##..##.##..##........##
  .##..##..##....##..##.##..########..##
  .##..##..##....##..##.##..............
  ########.##.....####..##..########..##
  .........##...........##..########..##
