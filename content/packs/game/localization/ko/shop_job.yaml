rules.prices: "가격 9개 중 하나를 골라요. 각 줄에는 더해지는 금액과, 지금까지 알아낸 것으로 본 손님의 구매 확률이 나와요."
rules.faces: "표정을 보면 얼마나 빗나갔는지 알 수 있어요: 대만족이나 만족이면 사요. 망설임(1단계 비쌈)과 짜증(2단계)은 인내심 1, 격노(3단계 이상)는 2가 줄어요."
rules.talk: "잡담(한 번, 인내심 {needs} 이상일 때)은 인내심 1을 써서 기분을 한 단계 올려요."
rules.dismiss: "돌려보내기: 손님이 사지도 화내지도 않고 떠나요. 인내심이 바닥나면 알아서 떠나요."
rules.characters: "손님별 성격"
rules.original: "원작의 가게 일을 하고 있어요: 게임의 가격 메뉴예요. “가게 일” 설정에서 개선판을 고를 수 있어요."
rules.close: "닫기"
