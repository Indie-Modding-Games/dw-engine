text.00a6: "ケガの手当てをする物は\n持ってきた？"
text.0104: "ちょっと待って。どれどれ…"
text.014c: "つばさが痛い！"
text.0170: "どうしたの？"
text.0194: "つばさをケガしたんだ。\n手当てできる物、ある？"
text.020a: "ひどいケガだ。待ってて。\nどうしよう？"
text.027c: "今は何も持ってないや。"
text.02f8: "ダメだ。これじゃ効かない！"
text.0346: "だいぶよくなった。ありがとう。"
text.0386: "もう飛べる？"
text.03b6: "遠くまでは飛べそうにない。"
text.03f6: "町に診療所があるよ。\n行ってみるといいよ。\nここから遠くないから。"
text.048a: "町のうわさは聞いてる。\n思ったより大きいんだな。"
text.04f8: "町へ行って休んでよ。"
text.0534: "ありがとう。いつか\nきみの力になれるかも。"
text.05c2: "ユニモンが町の仲間になった！"
text.0602: "ケガを治す物を持って\nくるよ。待ってて。"
text.0678: "ありがとう。急いでね！"
