text.0020: "カブテリモンに勝ちたい。\n勝つにはどうすればいい？"
text.0098: "うーん。強くなるしかないな。\n実は、確実な方法が\nあるんだけど…まあ、がんばれ。"
text.015e: "そうか。よし、修行するよ。"
text.019e: "本当！？なら鍛えてやる！"
text.01e8: "町に来てくれればいいよ。"
text.0220: "…"
text.022c: "きみって優しいね。\n町に行くよ。"
text.02bc: "クワガモンが町へ行った！"
text.0304: "なんだよ、優しくないなあ。\nがっかりだ！"
text.0368: "ねえ、きみは虫のバトル大会に\n出てるんだよね？"
text.03d8: "じゃあ、いいことを\n教えてあげる。"
text.042a: "クネモンがどこでねむるか\n知ってる？原生林かな？"
text.0496: "子どものデジモンがそこで\nねむるんだ。目が覚めると\nクネモンになるのさ。"
text.051e: "でも、ならないこともある。\n運しだいなんだ。"
text.05a8: "ねえ、きみは虫のバトル大会に\n出てるんだよね？"
text.0618: "うーん…今のきみじゃ\nとても無理だね。"
text.0676: "じゃあ、いいことを\n教えてあげる。"
text.06c8: "クネモンがどこでねむるか\n知ってる？原生林だよ。"
text.0734: "子どものデジモンがそこで\nねむるんだ。目が覚めると\nクネモンになるのさ。"
text.07bc: "でも、ならないこともある。\n運しだいなんだ。"
text.0826: "ねえ、虫のバトル大会に\n出てみない？"
text.0890: "それって何？"
text.08b0: "22日の10時までに\nエントリーしなきゃだめだよ。"
text.0924: "え？？？"
text.0938: "くわしいことは\n大会の日に教えるよ。"
text.099c: "何の話を\nしてるんだろう？"
text.09ea: "しっかりトレーニングするけど\n休むことも大事だ。"
text.0a42: "1時間休もうか？"
text.0a7e: "休む\n休まない"
text.0ae0: "{color:5}トレーニング：\nハンマーマシン {color:1}"
text.0b1e: "はじめる\n説明\nやめる"
text.0b56: "ふつう\nボーナストライ\nやめておく"
text.0ba0: "ハンマーマシンに打たれて\n体をきたえよう。\n防御力が上がります。"
text.0c3e: "もう一度説明\nはじめる\nやめる"
text.0c98: "{color:7}スロットゲーム {color:1}\n{color:6}△ ボタンを押して\n絵を3つそろえよう。"
text.0d22: "{color:5}トレーニング：ベルトマシン {color:1}"
text.0d54: "はじめる\n説明\nやめる"
text.0d8c: "ふつう\nボーナストライ\nやめておく"
text.0dd6: "動くベルトと反対の方向に\n走りましょう。\n素早さが上がります。"
text.0e5a: "もう一度説明\nはじめる\nやめる"
text.0eb4: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}を押して\n絵を3つそろえよう。"
