text.0018: "デジモンカードを集めてるんだ。"
text.0058: "ハグルモン、トイアグモン、\nワルモンザエモンをくれたら\nいいものをあげるよ。"
text.0108: "あげる\nあげない"
text.0138: "ごめん、持ってないや。"
text.0176: "はい。{color:6}X包帯{color:1}だよ。"
text.01b4: "アイテムがいっぱいだ。"
text.01f8: "カーリングをやったことある？"
text.0236: "あのゲームで10点とれたら\nすごい実力の\n持ち主だよ。"
text.02c0: "役に立つかわからないけど\n釣りのコツを教えるよ。"
text.0338: "まずは釣りざお。いいものは\n遠くまで飛ぶし\nよくしなるんだ。"
text.03c0: "次はエサ。どの魚が\nどのエサで釣れたか\n覚えておこう。"
text.043c: "さおを投げるときは\n{color:6}△ {color:1}をはなすと\n思いきり飛ぶよ！"
text.04ce: "湖の守り神のことだけど…\n毎日、朝と\n夕方にあらわれるんだ。"
