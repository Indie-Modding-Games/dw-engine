text.0056: "マイオティスモンは去った。"
text.009a: "おっ！"
text.00b8: "カギを見つけた。これで\nあのドアが開くかも。"
text.0128: "{color:6}館のカギ{color:1}を使った！"
text.016e: "なにか捨てなきゃ。"
text.01e2: "{color:6}館のカギ{color:1}を使った！"
text.0246: "開かない。\nカギがかかっている。"
text.02d8: "{color:6}館のカギ{color:1}を使った！"
text.033c: "開かない。\nカギがかかっている。"
text.03b0: "もぐもぐ…。"
text.03d0: "さて。"
text.03e6: "ねえ、聞いて。"
text.0408: "うまい、うまい…。"
text.0430: "部下たちが命令を聞かんのだ。"
text.0470: "わたしの命令を覚えて\nいられないらしい。"
text.04ca: "今ではもう話が通じん。\n食事を運んでくるはず\nなのだが…。"
text.0560: "もぐもぐ…。"
text.0580: "研究に夢中になっていたら\n食事が届かなくてな、\n食べるのを忘れておった。"
text.0614: "研究に夢中に\nなりすぎだよ。"
text.0662: "いやはや、お恥ずかしい。"
text.0690: "館でなにか問題が\n起きているようだ。"
text.06e6: "島でもなにか起きておるのか？\nみな部下たちと同じなのか？"
text.0754: "うん、みんな記憶を\nなくしかけてるんだ。"
text.07a6: "だれかのしわざだと\n思う？"
text.07fa: "ん？"
text.080a: "わたしになにができる？"
text.082e: "デジモンたちの心をひとつにする\n町を作ってるんだ。"
text.089e: "仲間をさがしてるんだ。"
text.08da: "わたしになにができる？部下は\n戦うことしか知らんのだ。"
text.0940: "部下たちを置いては行けん。"
text.0978: "そっか。"
text.098c: "少し考えさせてくれ。\nすまんな。"
text.09e0: "また来るよ。\nちゃんと食べてね。"
text.0b9c: "助けてくれてありがとう。\nわたしの研究を見せよう。"
text.0c02: "メタルグレイモンが力尽きると、\nまれにスカルグレイモンに\n進化することがある。{stop}"
text.0cac: "バケモン、デビモン、\nフェニックスモンも同じように\n進化するのだ。"
text.0d22: "生まれたときの姿は\nわからん。進化表にも\n書かれていないのだ。"
text.0dc6: "試合のおかげで\n部下たちも元気になった。"
text.0e0a: "試合は研究の\nいい息ぬきになる。"
text.0e64: "なんの研究をしてるの？"
text.0eae: "町にアリーナが\nできたんだ！"
text.0efc: "部下たちも\n役に立てるだろうか？"
text.0f40: "うん、アリーナなら\n思いきり戦えるよ。"
text.0fa4: "部下たちの具合がさらに悪い。\n館を出る\nときが来たようだ。"
