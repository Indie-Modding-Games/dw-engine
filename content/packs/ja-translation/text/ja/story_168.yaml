text.00e0: "アリーナ案内"
text.0108: "戦績\nクラス大会について\n特別大会について"
text.0188: "大会の\n優勝回数 {tourn_won}\n{tourn_wins}勝 {tourn_lost}敗"
text.01ea: "クラス大会には誰でも出られる。\nしょっちゅう開かれているよ。"
text.025a: "でも、上の世代のデジモンは\n下のクラスの大会に\n出ないほうがいいね。"
text.02f2: "エントリーしてから大会までに\n進化すると、\n出場できなくなるよ。"
text.039c: "特別大会には\n出場ルールがあって、\nあまり開かれないんだ。"
text.0434: "町に参加者が\n足りないと、\n開かれもしないよ。"
text.04cc: "同じ大会は年に1、2回しか\n開かれない。スケジュールを\n前もって確かめてね。"
text.058c: "{color:10}{partner}{color:1}の二つ名を\n考えてあげよう…世界を\n救った英雄だからね。"
text.061c: "そうだなあ。"
text.0648: "こんなのはどう？\n「無敵の{color:10}{partner}{color:1}」"
text.0694: "こんなのはどう？\n「伝説の勇者{color:10}{partner}{color:1}」"
text.06e8: "こんなのはどう？\n「偉大なる{color:10}{partner}{color:1}」"
text.0732: "こんなのはどう？\n「平和の使者{color:10}{partner}{color:1}」"
text.077e: "こんなのはどう？\n「王者{color:10}{partner}{color:1}」"
text.07c8: "こんなのはどう？\n「勇敢なる{color:10}{partner}{color:1}」"
text.0812: "こんなのはどう？\n「イカした{color:10}{partner}{color:1}」"
text.085e: "こんなのはどう？\n「最強の{color:10}{partner}{color:1}」"
text.08aa: "こんなのはどう？\n「気高き{color:10}{partner}{color:1}」"
text.08f2: "こんなのはどう？\n「天才軍師{color:10}{partner}{color:1}」"
text.0946: "ちょっと、その席は\nお客さん用だよ。"
text.0d0e: "- Dクラス -\nルーキーデジモンの\n大会\n\n1対1、3回戦制\n参加者8体。\n出場条件：なし。"
text.0e0c: "- Cクラス -\nチャンピオンデジモンの\n大会\n\n1対1、3回戦制\n参加者8体。\n出場条件：なし。"
text.0f0e: "- Bクラス -\nチャンピオンデジモンの\n大会\n\n1対1、3回戦制\n参加者8体。\n出場条件：なし。"
text.1010: "- Aクラス -\nアルティメットデジモンの\n大会\n\n1対1、3回戦制\n参加者8体。\n出場条件：なし。"
text.1112: "- Sクラス -\n最強のデジモンを\n決める大会\n\n1対1、3回戦制\n参加者8体。\nAクラスの優勝者のみ。"
text.120c: "- Rクラス -\nバトルロイヤル大会：\n作戦が勝利のカギ\n\n4体のバトルロイヤル、\n2回戦制、参加者8体。\n出場条件：なし。"
text.1340: "- バージョン1カップ -\n時間制限つきの試合で\nバージョン1の頂点を決める\n\n1対1、3回戦制\n参加者8体。\nバージョン1のデジモンのみ。"
text.147c: "- バージョン2カップ -\n時間制限つきの試合で\nバージョン2の頂点を決める\n\n1対1、3回戦制\n参加者8体。\nバージョン2のデジモンのみ。"
text.15b8: "- バージョン3カップ -\n時間制限つきの試合で\nバージョン3の頂点を決める\n\n1対1、3回戦制\n参加者8体。\nバージョン3のデジモンのみ。"
text.1700: "- バージョン4カップ -\n時間制限つきの試合で\nバージョン4の頂点を決める\n\n1対1、3回戦制\n参加者8体。\nバージョン4のデジモンのみ。"
text.1842: "- バージョン0カップ -\n時間制限つきの試合で\nバージョン1〜4以外の\n最強デジモンを決める\n1対1、3回戦制\n参加者8体。\nバージョン1〜4以外のみ。"
text.19a8: "- 炎カップ -\n時間制限つきの試合で\n炎のデジモンの王を決める\n\n1対1、3回戦制\n参加者8体。\n炎の性質のデジモンのみ。"
text.1ae2: "- 格闘カップ -\n時間制限つきの試合で\n格闘のデジモンの王を決める\n\n1対1、3回戦制\n参加者8体。\n格闘の性質のデジモンのみ。"
text.1c2c: "- 雷風カップ -\n時間制限つきの試合で\n大気のデジモンの王を決める\n\n1対1、3回戦制\n参加者8体。\n大気の性質のデジモンのみ。"
text.1d7a: "- 冷気カップ -\n時間制限つきの試合で\n冷気のデジモンの王を決める\n\n1対1、3回戦制\n参加者8体。\n氷の性質のデジモンのみ。"
text.1eac: "- 自然カップ -\n時間制限つきの試合で\n自然のデジモンの王を決める\n\n1対1、3回戦制\n参加者8体。\n自然の性質のデジモンのみ。"
text.1ff8: "- メタルカップ -\n時間制限つきの試合で\n機械のデジモンの王を決める\n\n1対1、3回戦制\n参加者8体。\n機械の性質のデジモンのみ。"
text.2132: "- よごれカップ -\n時間制限つきの試合で\nよごれたデジモンの王を決める\n\n1対1、3回戦制\n参加者8体。\nよごれの性質のデジモンのみ。"
text.226a: "- 恐竜カップ -\n時間制限つきの試合で\n古代の血をひくデジモンの戦い\n\n1対1、3回戦制\n参加者8体。\n出場条件：？？？"
text.239a: "- つばさカップ -\nつばさを持つデジモンが\n強さを競う\n\n1対1、3回戦制\n参加者8体。\n出場条件：？？？"
text.24ac: "- 動物カップ -\n時間制限つきの試合で\nけものの血をひくデジモンの戦い\n\n1対1、3回戦制\n参加者8体。\n出場条件：？？？"
text.25e0: "- 人型カップ -\n時間制限つきの試合で\n人型デジモンの戦い\n\n1対1、3回戦制\n参加者8体。\n出場条件：？？？"
