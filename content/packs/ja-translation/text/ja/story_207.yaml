text.0044: "やあ、肉はいらない？"
text.007c: "あ、このことをまだ\n話してなかったね。"
text.00d8: "ここは肉の畑なんだ。\nみんなのために肉を育ててるの。"
text.013e: "肉を畑で育ててるの？"
text.0176: "うん、それがどうかした？"
text.0192: "いや…なんでもない"
text.01b8: "ジジと相談して、毎日\n肉を3つあげることに\nしたよ、{color:6}{tamer}{color:1}。"
text.0242: "はい、今日の肉だよ。"
text.028e: "肉を持ちすぎだね。\n今日はいらないみたい。"
text.030a: "肉を持ちすぎだね。\n持てない分は返してもらうよ。"
text.0380: "{color:6}肉{color:1}を3つ\n手に入れた！"
text.03dc: "アイテムを持ちすぎだよ。"
text.0414: "{color:6}肉{color:1}を3つ\n手に入れた！"
text.0470: "今日は肉がたくさん\nとれたよ！5つ\nあげるね。"
text.0508: "肉を持ちすぎだね。"
text.054c: "肉を持ちすぎだね。\n持てない分は返してもらうよ。"
text.05c2: "{color:6}肉{color:1}を5つ\n手に入れた！"
text.0620: "アイテムを持ちすぎだよ。"
text.0658: "{color:6}肉{color:1}を5つ\n手に入れた！"
text.0698: "また明日もあげるね。"
text.06e4: "はい、今日の肉。"
text.072a: "肉を持ちすぎだね。"
text.076e: "肉を持ちすぎだね。\n持てない分は返してもらうよ。"
text.07e4: "{color:6}肉{color:1}を手に入れた！"
text.0820: "アイテムを持ちすぎだよ。"
text.0858: "{color:6}肉{color:1}を手に入れた！"
text.087a: "また明日あげるよ。"
text.08c0: "今日の肉は\nもうあげたはずだよ。"
text.090a: "食べ物がなくなったら、\n原生林へ行って\nキノコを探してね。"
text.09a2: "やあ、{color:6}{tamer}{color:1}。\n肉の畑を広げたんだ。"
text.09ea: "毎日、巨大肉を\n3つあげるよ。"
text.0a4e: "もっとほしいなら、\n1つ500ビットで\n売ってあげる。"
text.0ad2: "タネモンの代わりに、\nこの畑はぼくがまかされたよ。\nタネモンはどこかで休んでる。"
text.0b74: "今日は肉が\nたくさんとれたよ！"
text.0bd2: "巨大肉を持ちすぎだね。\n今日はいらないみたい。"
text.0c56: "巨大肉を持ちすぎだね。\n今日はいらないみたい。"
text.0cce: "{color:6}巨大肉{color:1}を手に入れた！"
text.0d14: "アイテムを持ちすぎだよ。"
text.0d4c: "{color:6}巨大肉{color:1}を5つ\n手に入れた！"
text.0d98: "また明日あげるよ。"
text.0dea: "はい、今日の\n巨大肉3つだよ。"
text.0e60: "巨大肉を持ちすぎだね。\n今日はいらないみたい。"
text.0ee2: "巨大肉を持ちすぎだね。\n持てない分は\n返してもらうよ。"
text.0f64: "{color:6}巨大肉{color:1}を手に入れた！"
text.0faa: "アイテムを持ちすぎだよ。"
text.0fe2: "{color:6}巨大肉{color:1}を3つ\n手に入れた！"
text.1036: "また明日あげるよ。\nそれとも、今もっと買う？\n1つ500ビットだよ。"
text.10d2: "買う\n買わない"
text.1110: "お金が足りないよ。"
text.1150: "アイテムを持ちすぎだよ。"
text.119c: "もっと買う？"
text.11d4: "買う\n買わない"
text.1202: "また明日ね。"
text.123e: "へへへ！\n{color:6}{tamer}{color:1}、見て！"
text.128a: "サーロインがたくさん\n育つようになったよ。毎日\nサーロインを3つあげるね。"
text.1310: "めずらしい野菜も\n育てはじめたんだ！\n好きなだけ買ってね！"
text.13a6: "今日は気分がいいから、\nサーロインを5つ\nあげるよ。"
text.143a: "サーロインを持ちすぎだね。\n今日はいらないみたい。"
text.14b6: "サーロインを持ちすぎだね。"
text.14f4: "{color:6}サーロイン{color:1}を手に入れた！"
text.1534: "アイテムを持ちすぎだよ。"
text.156c: "{color:6}サーロイン{color:1}を5つ\n手に入れた！"
text.15b2: "また明日ね！"
text.15ee: "はい、今日の分の\nサーロイン3つだよ！"
text.1668: "サーロインを持ちすぎだね。\n今日はいらないみたい。"
text.16e6: "サーロインを持ちすぎだね。"
text.1724: "{color:6}サーロイン{color:1}を手に入れた！"
text.1766: "アイテムを持ちすぎだよ。"
text.179e: "{color:6}サーロイン{color:1}を3つ\n手に入れた！"
text.17ec: "まだ明日になってないよ！\n野菜を買う？"
text.1858: "買う\n買わない"
text.1886: "特大ニンジン：500ビット\nタカ大根：    500ビット\n買わない"
text.1930: "お金が足りないよ。"
text.197e: "アイテムを持ちすぎだよ！"
text.19ca: "お金が足りないよ。"
text.1a18: "アイテムを持ちすぎだよ！"
text.1a62: "もっと買う？"
text.1a9a: "買う\n買わない"
text.1ac8: "またね！"
