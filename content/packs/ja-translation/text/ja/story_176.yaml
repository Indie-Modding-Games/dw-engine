text.03b8: "ぼくの店へようこそ。"
text.03e4: "見て、{color:6}{tamer}{color:1}。ここが\nぼくの店だよ。いろんな\nアイテムを売るつもりなんだ。"
text.046c: "品物はもうすぐ増えるよ。\nでも手伝ってくれる\nデジモンが必要なんだ。"
text.052c: "アイテムの売り買いを\nするつもりだよ。用がある\nときは寄ってね。"
text.05c6: "品ぞろえはまだ少ないけど、\n手伝いが見つかれば\nもっとよくなるかも。"
text.069c: "アイテムの店を\n開くことにしました。\nぜひ通ってくださいね。"
text.0726: "まだ品ぞろえは十分じゃ\nないけど、すぐに増やす\nつもり。今はがまんしてね。"
text.080a: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}、\nアイテムの店を開いたよ。\nうまくいきそうだ！"
text.087c: "町にデジモンが増えれば\n品物も増やせるんだ。"
text.0920: "{color:6}{tamer}{color:1}、この店を手伝い\n始めたところなんだ。\nたくさん買ってね！"
text.09ea: "いらっしゃいませ。今日から\nここで働きます。\nまた来てくださいね。"
text.0ab4: "この店を手伝うことに\nしました。\nいつでも来てくださいね。"
text.0b68: "あ、{color:6}{tamer}{color:1}。ここは\nぼくにぴったりの場所だ。\nここでがんばるよ。"
text.0e56: "やあ、この店の仕事で\nいつも大忙し…なんてね！"
text.0ec2: "ぼくはなまけ者だから\nあまり店にいないけど、\nいい物はそろってるよ。"
text.0f5e: "よし！「特訓マニュアル」だ！\nこれがあれば、トレーニングの\n効果が上がるぞ！"
text.0fe6: "とても貴重な品だよ。\n50000ビットで売ってあげる。\n買わなきゃ後悔するよ。"
text.1094: "買う\n買わない"
text.10d6: "ビットが足りないよ。"
text.1126: "うーん、荷物が\nいっぱいだね。"
text.1186: "{color:6}特訓マニュアル{color:1}を\n手に入れた！"
text.11c2: "値引きはしないよ。"
text.123a: "荷物が多すぎて\n困ってるのかい？"
text.12b2: "カバンを別の次元とつなぐ\nキーチェーンが\n見つかる場所があるよ。"
text.135a: "持てるアイテムの数が\n増えるんだ。"
text.13be: "一度行った場所でも\nもう一度探してみて。"
text.1432: "アイテムの買い方の\nコツを教えてあげよう。"
text.1488: "知りたいアイテムの上で\nスタートボタンを押すと\n説明が見られるよ！"
text.1514: "{color:6}△{color:1}でアイテムを選んで、\nまとめて買うなら\n{color:4}□{color:1}を押してね。"
text.159e: "10ずつ増減するときは、\n{color:10}○{color:1}を押しながら\n方向キーの上下を使ってね。"
text.1636: "そうそう、進化した直後に\n何か買ってみて。\nいいことがあるかもよ！"
