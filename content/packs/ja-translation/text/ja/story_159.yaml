text.0082: "またおまえか！出ていけ！"
text.00c8: "ううっ…"
text.00e0: "おまえ…おまえは厄介者だ！\nこれで満足か！？"
text.0154: "またおまえか！\n今すぐ出ていけ！"
text.01ba: "よく来たな、友よ。\nここに住みたいなら、\n許可してやろう。"
text.0260: "ここに住みたい\n元にもどりたい"
text.02c6: "ふむ、よかろう。なに？\nだがおまえはアナログだ。\nここには住めんぞ。"
text.0356: "ぼくたちはいっしょじゃなきゃ！"
text.038c: "ならば、そいつといっしょに\n出ていけ！"
text.03de: "えっ？何を言ってるの？"
text.0422: "彼はもともとスカモンじゃ\nないんです。王様、彼を\n元の姿にもどしてください！"
text.04c2: "スカモンになれて\nよかったではないか？"
text.0516: "いいえ、今はちっとも\nよくないんです。お願い。"
text.0570: "スカモンになるには、\nがんばるしかないのだ。"
text.05cc: "自然にスカモンに\nなってしまったのが\n問題なんです。"
text.0642: "まったく、あきれたヤツらだ！"
text.06aa: "わあ！王様、ありがとう！"
text.06e0: "今すぐ出ていけ！"
text.072c: "何か用があって\n来たのか？"
text.0774: "ええと…"
text.078a: "頼みごとなら\nあきらめろ。なぜなら\nわしはスカモン大王だ！"
text.0810: "彼を町にさそうのは\nむりみたいだな。"
text.0890: "ぼく、デジモンカードを\n集めてるんだ。"
text.08e0: "スカモン大王のカードが\nすごくほしいんだ。ぼくの\nエテモンのカードと交換する？"
text.0986: "交換する\n交換しない"
text.09ba: "ごめん、持ってないや。"
text.0a02: "うわっ、くさい！ここって\nゴミ捨て場？"
text.0a4c: "デジモンの世界にも\nあったなんて知らなかった。"
text.0aca: "よく来てくれたね。\n新しい仲間は大歓迎さ。"
text.0b26: "ここはスカモン族の\n集まる場所なの？"
text.0b82: "そのとおり。ここは\nスカモン族の楽園、\nその名もゴミの王国さ。"
text.0c20: "スカモン大王もいるよ。"
text.0c62: "スカモン大王…？"
text.0c90: "スカモン大王はすごいぞ！\n言うことを聞かないと\n進化させられちゃう！"
text.0d32: "スカモン以外の何かに\nなっちゃうってこと？"
text.0d9e: "それって、元の姿に\nもどれるってこと！？"
text.0dfc: "うん、こわいよね。ゾッとする。"
text.0e36: "いいことを聞いたぞ…"
text.0ea2: "あっ、スカモン！？"
text.0ec4: "えっ？ぼくを知ってるの？"
text.0f00: "まあ、ちょっとね。\nスカモンも町に\nつれて行かなきゃいけない？"
text.0f92: "わあ、おもしろい！\nこんなの\n見たことない！"
text.1014: "うわあ！ウンチが動いて\nしゃべってる！"
text.107c: "ぼくのこと？\nぼくはスカモン…\n突然変異のデジモンさ。"
text.1100: "ウンチじゃないの？"
text.112a: "ある意味、正解だよ。\nぼくたちはデジタルの\nゴミからできてるからね。"
text.11aa: "彼にも町に来てもらう？\n見た目で決めつけちゃ\nだめだよね。"
text.1240: "ここに住む\nつもりなの？"
text.1284: "えっ？そんなこと\n考えたこともないよ。"
text.12ca: "ここはスカモン族だけの\n楽園なんだ。\nほかのデジモンは住めない。"
text.136a: "じゃあ、ほかの場所には\n住めないの？"
text.13ba: "あたりまえだろ！\n何を言ってるんだい？"
text.1404: "そっか。\nそうだと思った。"
text.1446: "ここには住めないけど、\n見て回るのは\nかまわないよ。"
text.14be: "見るだけか。わかった。"
text.14f2: "あ、そうそう。王様を\n絶対に怒らせちゃだめだよ。"
text.1552: "王様の進化の技で、\nみじめな姿に\n変えられちゃうからね。"
text.1610: "ちょっと、エテモンのカードを\n持ちすぎだよ！\nやめときな。"
text.167c: "わあ、ありがとう！"
text.16bc: "ねえ、きみたちって…\nなんとかシティから来たの？"
text.172e: "ここだけの話だけどさ。\nちょっとだけ\n興味があるんだ。"
text.17ae: "いつか、そっちに\n遊びに行くよ。"
text.17fe: "ねえ、スカモン族の\n特別な技を\n知ってる？"
text.187e: "地面のウンチを\n体に吸いこんで\nエネルギーに変えるんだ！"
text.1916: "え？ここはゴミの王国。\nきみたちにとっては、ただの\nゴミ捨て場だろうけど。"
text.19a4: "でも役に立つものが\nあるかも。あっちに長い\n棒みたいなのがあったよ。"
text.1a4c: "わあ、\n{color:6}古い釣りざお{color:1}だ！"
text.1aba: " {color:5}トレーニング：ゴミかくれ {color:1}"
text.1af6: "はじめる\n説明を聞く\nやめる"
text.1b2e: "ふつう\nボーナス\nやめる"
text.1b6c: "汚いゴミの中にもぐって\n心をきたえる。\n最大MPが大きく上がる。"
text.1c0e: "もう一度説明\nはじめる\nやめる"
text.1c68: " {color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}で\n3つの絵をそろえよう。"
