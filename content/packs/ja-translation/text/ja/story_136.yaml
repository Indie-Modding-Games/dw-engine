text.014c: "うしろから声が聞こえる。\nこの声は…！"
text.01f6: "待て！"
text.0208: "だれが待つか！？"
text.023e: "ははは！"
text.02bc: "わあ、びっくり！"
text.02ee: "ホエモン、ナイス！すごい！"
text.033e: "あきらめろ！"
text.0364: "うぐぐっ！"
text.0378: "町に来て働いて、\n罪をつぐなうんだ。"
text.03ec: "わかった、わかったよ。\n町に行くよ。"
text.0452: "ははは、なーんてな！じゃあな。"
text.08fa: "くそっ、だまされた！"
text.092a: "まあ、洞窟は取りもどせたし\nいいか。"
text.099a: "これで洞窟はもう大丈夫だね。"
text.09da: "きみは本当にいい人だね。\nあいつらも、いつか\nまちがいに気づくよ。"
text.0a8a: "ぼくの宝物をあげるよ。\n奥にあるんだ。"
text.0aea: "待って待って。\nそれ、きみの宝物でしょ？\nもらえないよ。"
text.0b68: "いや、いらないんだ。きみの\n町に行きたいんだよ。"
text.0bce: "じゃあ、なんのために洞窟を\n取りもどしたの？\nムダだったの…？"
text.0c56: "ごめん、でも今は本当に\nきみの力になりたいんだ。"
text.0cb8: "そうか。ありがとう。\n本当に優しいね。"
text.0d04: "このまま町へ行くよ。\nよかったら\n乗せていってあげる。"
text.0d92: "ホエモンが町の仲間になった！"
text.0dd4: "町へもどる？"
text.0e0a: "もどる\nもどらない"
