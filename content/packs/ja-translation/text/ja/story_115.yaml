text.00c8: "よく来たな、若者よ。"
text.0108: "きみがチェリーモンだよね？"
text.0144: "だれじゃ？"
text.0164: "こんな年寄りに\nなんの用じゃ？"
text.01ca: "まずは、霧を晴らしてよ。"
text.0200: "霧で前が見えないんだ。\n晴らしてくれない？"
text.026c: "そういうことか。なるほど。"
text.02a6: "…できないの？"
text.02da: "まず、わしの話を聞くのじゃ。\nさて…どこから\n話そうかのう？"
text.0364: "島の異変について\n知っているなら、\n教えてください。"
text.03fa: "なるほど、なるほど。\n異変か。"
text.043e: "この島が変わりはじめたのは\n80年前、大地の変動が\n起きてからじゃ。"
text.04de: "島の北東部は\n80年前に\n突然あらわれたのじゃ。"
text.0574: "それ以来、デジモンたちは\n散らばっていき\n種族ごとに分かれた。"
text.05fa: "そして種族ごとに\n自分たちの言葉を話しはじめた。"
text.066a: "町で使っていた言葉を\n忘れてしまったのじゃ…"
text.06d2: "ついには、ファイルシティから\nほとんどのデジモンが\nいなくなってしもうた。"
text.0752: "そして、デジモンたちは\n記憶を失いはじめた！"
text.07a8: "島の歴史も、過去も、感覚も…\n日に日に\n失われていく。"
text.0844: "大事なことを話さねば\nならんのじゃが、わしも\n思い出せんのじゃ。"
text.08e6: "じゃが、最後にはすべてが\nひとつになる。そうさせる\n者がおるのじゃ！"
text.097c: "いずれデジモンたちは\n異変をあたりまえのことと\n思うようになるじゃろう。"
text.0a08: "それを止められるのは\nきみと、デジモンをまとめる\nファイルシティの力だけじゃ！"
text.0ab8: "町にデジモンを集めて\n奇跡を起こすのじゃ。\nきっと起こるはずじゃ。"
text.0b54: "つい熱くなってしもうた。\nふう、全部話したわい。"
text.0bd4: "では、霧を晴らすとしよう。"
text.0c20: "森の霧は、きみと\n話すためのものじゃった。\nおお、もうひとつ…"
text.0cd0: "森には、昔のことを\n知っている者が\nほかにもおる。"
text.0d44: "できるなら森の奥へ行って\nさがしてみるがよい。"
text.0dbc: "また年寄りの話を\n聞きに来たのかの？"
text.0e24: "島について…\n{color:10}{partner}{color:1}を鍛えて\nなんでもない"
text.0e98: "では、話そうかのう。"
text.0eda: "おお、そうか。"
text.0efe: "{color:5}トレーニング：\n森の教え {color:1}"
text.0f56: "はじめる\n説明\nやめる"
text.0f8e: "ふつう\nボーナストライ\nやめる"
text.0fcc: "チェリーモンがたくさんの知識を\n授けてくれます。賢さが\n大きく上がります。"
text.1068: "もう一度説明\nはじめる\nやめる"
text.10c2: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}を押して\n絵を3つそろえよう。"
text.1138: "ほっほっほ。"
