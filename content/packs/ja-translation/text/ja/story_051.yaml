text.004e: "なんだか、いやな予感が…。"
text.0098: "来ると思っていたぞ！"
text.00e4: "おまえはだれだ？"
text.0104: "わたしはデビモン、闇の天使。\n暗黒の力を持つ者だ。"
text.017c: "なにか知ってるのか？"
text.01b0: "館にはマイオティスモンがいる。\nまだ生きているかもな。"
text.021e: "おまえのしわざか？"
text.024a: "さあな…わかっているのは、\nおまえが敵だということだけだ。"
text.02c2: "逃がさないぞ！"
text.030c: "フハハハ！"
text.034a: "しまった！"
text.036e: "マイオティスモンによろしくな。"
text.03cc: "逃げられた！\nあいつはどうも気にくわない。"
text.048a: "大きな館だなあ！"
text.04ca: "だれかいませんか？"
text.0500: "だれもいないのかな。\nそれとも聞こえないのかな。"
text.0566: "よし、探検開始だ！"
text.05be: "{color:6}館のカギ{color:1}を使った！"
text.0622: "開かない。\nカギがかかっている。"
text.069a: "{color:6}館のカギ{color:1}を使った！"
text.06fe: "開かない。\nカギがかかっている。"
text.0776: "{color:6}館のカギ{color:1}を使った！"
text.07da: "開かない。\nカギがかかっている。"
text.0866: "開かない。ふしぎな力で\n封印されている。"
