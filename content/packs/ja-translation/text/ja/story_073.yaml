text.00cc: "どうしたの？"
text.00f4: "たすけて〜！"
text.0114: "困ってるみたいだ。\n助けなきゃ！"
text.0174: "{color:7}??? {color:1}\n弱い者いじめは\nやめろ！"
text.01e4: "だれだ、あれ？"
text.0270: "だいじょうぶ？"
text.0298: "ありがとう。"
text.02b4: "困ったときは、いつでも\n呼んでくれ。すぐに\nかけつけるぞ！"
text.032e: "また会おう！"
text.035e: "おい、待ってよ！"
text.039a: "ヒーローみたいだな。\n手柄をぜんぶ持っていった。"
text.0404: "ここはオレの家だ。出ていけ！"
text.044a: "オレはシャーマモン。おまえは？"
