text.006e: "商人になりたがってた\nやつがいたな。どこかで\n店をやってるらしいぞ。"
text.011c: "オレより役に立つはずさ。"
text.015c: "どうしてここは、ほかの場所と\n時間の流れがちがうの？"
text.01ba: "きっと住みやすい\n場所なんだろうけど…"
text.0240: "空からあちこち\n見てまわってるんだ。"
text.0292: "北には氷と雪がある。\nあんな寒いところに住むなんて\nどうかしてるよ。"
text.0332: "空からあちこち\n見てまわってるんだ。"
text.0384: "西には鉄でできた\n小さな町があるよ。"
text.03e6: "でも出入り口が閉じてるんだ。\nオレは飛んで行けるけどね。"
text.0460: "空からあちこち\n見てまわってるんだ。"
text.04b2: "ツノやツメを持つデジモンの\nグループがいるよ。"
text.0522: "木をくりぬいて\n家を作るらしい。"
text.0594: "空からあちこち\n見てまわってるんだ。"
text.05e6: "北西には建物のある\n森があるよ。"
text.0644: "すごく遠いけどね。"
text.066e: "空からあちこち\n見てまわってるんだ。"
text.06c0: "大渓谷の先には行った？\n迷路みたいなんだ。"
text.073a: "空からあちこち\n見てまわってるんだ。"
text.078c: "島の真ん中は見えないんだ。\n雲しか見えない。"
text.0812: "この話はもう聞いたよね。"
text.0858: "ここは時間がゆっくりなんだ。\nここでの半日が\n外の1日と同じなのさ。"
text.08de: "休みたい者には\nぴったりの場所だ。"
text.094e: "スピードゾーンでは\n時間が速く進む。\nこの先にあるんだ。"
text.09d0: "あそこでは1日のかわりに\n2日がすぎるんだ。"
text.0a26: "デジモンは早く育つけど、\n寿命も早くつきるよ。"
text.0aaa: "自動販売機"
text.0ad0: "なにが出てくるかな？\n1回200ビット？\n買ってみようかな？"
text.0b54: "買ってみる\nやめる"
text.0b96: "ビットが足りない。"
text.0bec: "{color:6}肉{color:1}が出てきた！"
text.0c24: "アイテムがいっぱいだ。\nなにか捨てないと。"
text.0cac: "{color:6}回復(小){color:1}が\n出てきた！"
text.0d0a: "アイテムがいっぱいだ。\nなにか捨てないと。"
text.0d92: "{color:6}ステーキ{color:1}が\n出てきた！"
text.0dce: "アイテムがいっぱいだ。\nなにか捨てないと。"
text.0e56: "{color:6}MPフロッピー{color:1}が\n出てきた！"
text.0e9c: "アイテムがいっぱいだ。\nなにか捨てないと。"
