text.0048: "グルーン。"
text.005a: "グルーン、ル、ル…"
text.007e: "なにかが生き返った！"
text.00ce: " ？ "
text.00dc: "前は町に住んでたんだ。\nきみから町のにおいがする。"
text.0156: "わあ！"
text.0166: "こわいんだ。町を出てから\n記憶をなくしちゃって。"
text.01ca: "でもきみのおかげで、\nぜんぶ思い出したよ。"
text.022a: "町にもどっていいかな？"
text.0274: "もちろん。町はきっと前より\nにぎやかになってるよ。"
text.02f8: "本当？よーし！\nがんばるぞ！"
text.037c: "ベタモンが町の仲間になった！"
text.03c2: "ここはオレのなわばりだ！"
text.0402: "へへへ。よーし！"
text.043c: "見てろよ！"
