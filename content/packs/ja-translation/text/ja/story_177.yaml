text.002a: "アイテムのことなら任せて。"
text.0056: "アイテムは全部で\n128種類あるんだ。"
text.00d0: "そのうち32種類は食べ物さ。"
text.00fe: "めずらしいアイテムは、ある\n場所では自然に育つけど、\nほかでは見つからないんだ。"
text.018e: "たとえば、原生林では\n青リンゴが\n見つかるよ。"
text.0204: "こういう食べ物には特別な\n効果があるから、食べる\nタイミングに気をつけてね。"
text.02b8: "次は進化アイテムの\n話をしよう。"
text.030c: "進化アイテムは、その名の\nとおり、デジモンを\n進化させるアイテムなんだ。"
text.0392: "進化アイテムには\nいろんな種類があるよ。"
text.0402: "種類によって、デジモンが\nちがうタイプのデジモンに\n進化するんだ。"
text.0494: "たとえば灰色の爪を使うと\nデジモンは\nグレイモンになるよ。"
text.0528: "進化アイテムは伝説の\nアイテムで、世界に一つ\nしかない物もあるんだ。"
text.05b2: "でも、ふつうの進化みたいな\n能力のボーナスが\nもらえないこともあるよ。"
text.0654: "それに機嫌も下がるから、\n完ぺきってわけじゃないんだ。"
text.06ca: "それでも、なってほしい\nデジモンに進化できるのは\nうれしいよね。"
text.0772: "進化できるのは、なりたい\nデジモンの一つ前の世代から\nだけなんだ。"
text.081a: "気をつけてね。"
text.087c: "ヘイ！オラ、アミーゴス！"
text.08a4: "ここは何の店かって？\nオレの店さ。\n何か買ってってくれ。"
text.0942: "見てくれ{color:6}{tamer}{color:1}！オレの店は\nおもしろい物を売ってるんだ。\nたくさん来てくれよな。"
text.09f6: "ここにあるのは\nふつうの品じゃないぜ。\n遠慮なく買ってくれ！"
text.0a9c: "よう、久しぶり！きっと\n来ると思ってたぜ{color:6}{tamer}{color:1}。\nそんなに驚くなって。"
text.0b1c: "オレのアイテムを使い\nこなせるかな？それは\nテイマーの腕しだいさ。"
text.0be2: "ここはどこだって？\nオレは暗い所が好きでな、\nこの店はまさにそれさ！"
text.0c88: "よし{color:6}{tamer}{color:1}、来てくれて\nありがとな。せっかくだから\n何か買っていかないか？"
text.0d48: "よう、{color:6}{tamer}{color:1}。来たな！\nさあ、役に立つアイテムを\n買っていってくれ。"
text.0dec: "よう、久しぶり！\n来ると思ってたぜ{color:6}{tamer}{color:1}。\nそんなに驚くなって。"
text.0e6c: "オレのアイテムを使い\nこなせるかな？それは\nテイマーの腕しだいさ。"
