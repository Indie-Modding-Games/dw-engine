text.003e: "誰かいる！誰だ！？"
text.00c4: "へへっ、悪いコンピューターを\nぶっこわす！へへへ！"
text.0284: "あいつだ…おい！\nおい、何をしてるんだ！？"
text.02f0: "そうだ！こわしてやる！\n全部こわしてやる。\n悪いものは全部！"
text.04b2: "だめだ、正気じゃない。\nアルティメットデジモンだけど\n止めなきゃ！"
text.054c: "へへへ、\nみんなこわしてやる！"
text.06c4: "うぐぐ…！力が抜けていく。"
text.0702: "電気が弱くなってきた。\nアンドロモンにたのんで、\n工場の廃水を止めてもらおう。"
