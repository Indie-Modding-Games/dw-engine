text.00a8: "いいところに来たのう！\nきみにしか頼めんことが\nあるんじゃ。"
text.0146: "どうしたの？"
text.0164: "アナログマンや\nマシーンドラモンと同じ\n邪悪な気配を感じたんじゃ。"
text.01f8: "出どころはわかっておる。"
text.0236: "また？よし、任せて！"
text.0272: "すまんのう。ところで…"
text.02b8: "マシーンドラモンを\n倒したそうじゃな！"
text.02fe: "うん、でもよくわからないんだ。\nアナログマンの呪いみたい\nだったけど。"
text.0386: "恨みが強かったんじゃな。\nこれで平和になるかのう。"
text.03fa: "マシーンドラモンが戻っても\nまた倒してやるさ！"
text.0460: "頼もしいのう。肉畑で\n育っておったものじゃ、\nこれをやろう。"
text.04f0: "わあ！\n{color:6}チェーンメロン{color:1}？"
text.0548: "アイテムがいっぱいだ。"
text.0588: "ありがとう！"
text.05be: "来てくれたか！\nほかの者には頼めんことが\nあるんじゃ。"
text.0636: "もう大丈夫、来たよ。\nもしかして\nアナログマンが戻ったの？"
text.06a6: "やつの邪気は感じるが、\nどこにおるかはわからん。"
text.0712: "任せて！見つけ出して\n片づけてくるよ。"
text.0784: "すまんのう。\nところで…"
text.07ea: "さて、わしは\n{color:10}{partner}{color:1}の力も借りて\nファイルシティを立て直すぞ。"
text.0882: "きみや{color:10}{partner}{color:1}の\n役に立つ店を\n作りたいんじゃ。"
text.0900: "町のすぐ外の原生林を\n探検してみるとよいぞ。"
text.099c: "これをやろう。しっかりな。"
text.09de: "アイテムをたくさんもらった！"
text.0a26: "アイテムを見るには\n{color:5}× {color:1}を押して…"
text.0a6a: "…それから「アイテム」を\n選んで\n{color:6}△ {color:1}で見るんだ。"
text.0ae2: "ユラモンがまた\nうわさを集めたようだ。"
text.0b56: "ユラモンが新しい\nうわさを仕入れたらしい。"
text.0bb2: "町が大きくなり始めて、\n今どんどん変わって\nいるそうだ。"
text.0c30: "この世界の常識を\n教えてあげよう。"
text.0ca0: "1日は24時間で、\n朝、昼、夜があるんだ。"
text.0d32: "時間が早く進むように\n感じるかもね。"
text.0d76: "1年は30日。\n月？何それ？季節？\nそれって食べられるの？"
text.0e14: "もちろんお金もあるよ。\n単位はビット。お金は\nいくらあっても困らないよ。"
text.0eb6: "この島で「町」と言えば、\nここのことだよ。"
text.0f24: "でもほかにも小さな\n村や町があるんだ。"
text.0f84: "時計の黄色い点が時、\n針が分を\n表しているよ。"
text.100a: "上が真夜中で、\n下が正午だよ。"
text.1050: "左の赤い部分は夕方。\n4時から8時を\n表しているよ。"
text.10f0: "右の紫の部分は朝。\n4時から8時を\n表しているよ。"
text.118a: "デジモンは決まった\n時間に活動するんだ。"
text.11e6: "たいていは朝に起きて\n夜にねるけど、\nその逆のデジモンもいるよ。"
text.1286: "会いたいデジモンに\n会えなかったら、ちがう\n時間に行ってみて。"
text.1340: "ツノモンやユラモンと\nできるだけ話してね。"
text.13bc: "テイマーレベルについて\n教えてあげよう。"
text.140a: "テイマーレベルが高いと、\nデジモンが消えたとき、"
text.147c: "次のデジモンの\n能力が高くなるんだ。"
text.14de: "最初のうちは\nあまり上がらないけど、"
text.152e: "こつこつ育て続ければ\n上がっていくよ。"
text.15b2: "必殺技を使うときは、\nLボタンとRボタンを\nすばやく連打してね。"
text.1658: "必殺ゲージが満タンだと、\n空のときに比べて\n敵へのダメージが2倍！"
text.1704: "デジモンの一生について\n教えてあげよう。"
text.1754: "おなかがすくと、\nデジモンが教えてくれるよ。"
text.17ac: "トイレにも行きたくなるよ。\nちゃんとトイレで\nさせてあげてね。"
text.182e: "デジモンは眠くなったら\nねる必要があるけど、\nねかせるのはきみだよ。"
text.18b8: "あまり長く\n起こしておかないでね。"
text.190a: "疲れたり、病気になったり、\n機嫌が悪くなったりするよ。\nけっこうデリケートなんだ。"
text.198c: "デジモンは野生の生き物\nだから、ほめたり\nしかったりしてね。"
text.1a16: "何をするにしても、\nデジモンの様子に\n気を配ってね。"
text.1aba: "起こしちゃった…\nごめんなさい。"
text.1b28: "この機械は何？"
text.1b64: "ああ、それは\n{color:4}メモリーカード対戦\nデータ・セーブマシン{color:1}だよ。"
text.1be6: "その機械を使えば、今の\nパートナーのデータを\n対戦用にセーブできるよ。"
text.1c7c: "{color:6}△ {color:1}を押せば、\n機械が使い方を\n教えてくれるよ。"
text.1d02: "{color:4}メモリーカード対戦\nデータ・セーブマシン{color:1}を\n使いますか？"
text.1d84: "はい\nいいえ"
text.1dce: "プニモンはいないけど、\nここで休んでいこうかな。"
text.1e3a: "{color:7}プニモン {color:1}\nボク、プニモン！\nここで休んでいかない？"
text.1eb0: "{color:7}プニモン {color:1}\n1時間休むとHPとMPが回復して、\n疲れも取れるよ。"
text.1f34: "休む\n休まない"
