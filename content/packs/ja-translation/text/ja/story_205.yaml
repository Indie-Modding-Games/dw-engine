text.0010: "どのお店にしますか？"
text.004c: "診療所\nトレジャーハンター\n占い師"
text.00aa: "ここを病院にしたんだ。"
text.0100: "具合が悪そうだね。\nちゃんと体調を\n管理してあげなきゃ！"
text.018c: "すぐに治療しよう。\n料金は割引して\n300ビットだよ。"
text.0242: "ビットが足りない！？\n払える分でいいよ。お金は\nいざという時にとっておきな。"
text.02f6: "これでもう大丈夫。\nこれからは気をつけてね。"
text.0364: "病気でもケガでもないね。\n何の用かな？"
text.03d0: "診てもらう\n薬を買う\n何もない"
text.042c: "よし、{color:10}{partner}{color:1}の\n調子を診てみよう。"
text.048a: "大変だ。{color:10}{partner}{color:1}の疲れが\nとても危ないレベルだよ。\nすぐに休ませないと！"
text.0540: "{color:10}{partner}{color:1}は疲れが\nたまりすぎているよ。手遅れに\nなる前に休ませてあげて。"
text.05da: "{color:10}{partner}{color:1}は少し\n疲れているみたい。あまり\n無理させないようにね。"
text.0664: "{color:10}{partner}{color:1}は元気だけど、\n疲れはいろんな悪いことの\nもとになるから気をつけて。"
text.06fe: "さて、気分はどうかな？"
text.0742: "{color:10}{partner}{color:1}の心はとても\nリラックスしているよ。\nきっと長生きするね。"
text.07da: "{color:10}{partner}{color:1}の心の状態は\nバッチリだね。健康な\n生活をしている証拠だよ。"
text.0880: "{color:10}{partner}{color:1}はとても\nリラックスしているみたい。\n何かいいことがあったのかな？"
text.0918: "{color:10}{partner}{color:1}はそんなに\nストレスを感じていないね。\nふつうと言っていいよ。"
text.09be: "{color:10}{partner}{color:1}はストレス気味。\nトレーニングはひかえめにね。"
text.0a40: "{color:10}{partner}{color:1}はストレスが\nたまりすぎ。遊びが必要だよ。"
text.0aac: "{color:10}{partner}{color:1}はストレスで\n機嫌が悪いみたい。あまり\n無理させないでね。"
text.0b4e: "{color:10}{partner}{color:1}はストレス過多！\nこのままだと\n長く生きられないよ！"
text.0be4: "う〜ん…。{color:10}{partner}{color:1}には\nこれでせいいっぱいだよ。"
text.0c40: "ほかに何か\n用はあるかな？"
text.0c8e: "診てもらう\n薬を買う\n何もない"
text.0cee: "うん、もう大丈夫だろう。"
text.0d26: "包帯：  400ビット\n薬：   1200ビット\n何も買わない"
text.0dca: "具合が悪くなったら、\nすぐに来てね。"
text.0e50: "持ち物がいっぱいだね。"
text.0ea8: "ビットが足りないね。\nそれは売れないよ。"
text.0f28: "持ち物がいっぱいだね。"
text.0f80: "ビットが足りないね。\nそれは売れないよ。"
text.0fee: "ほかに何か\n用はあるかな？"
text.103c: "診てもらう\n薬を買う\n何もない"
text.109c: "トレジャーハンターに\n転職したよ。"
text.1112: "宝探しの依頼かな？\nそれとも、情報が\nほしいのかな？"
text.11ac: "情報がほしい\n情報はいらない\nやっぱりいい"
text.121c: "時間と料金がちがう\n2つのコースがあるよ。"
text.128e: "ふつう：3日・1000ビット\nスペシャル：10日・5000ビット"
text.130a: "スペシャルコースのほうが\nいいお宝が見つかる\n確率が高いよ。"
text.139e: "説明はそんなところだね。\nさて、どうする？"
text.13fe: "もう一度説明して\n宝探しを頼む\n何もない"
text.145a: "コースを選んで！"
text.147e: "ふつう：3日・1000ビット\nスペシャル：10日・5000ビット\nやめる"
text.1518: "じゃあ、またね。"
text.1564: "よし、3日後に結果が\n出るよ。幸運を祈ってて。"
text.1602: "よし、3日後に結果が\n出るよ。幸運を祈ってて。"
text.1680: "ビットが足りないよ。\n宝探しには\nお金がいるんだ。"
text.1734: "{color:7}はり紙 {color:1}\nただいま宝探し中です。\nしばらくお待ちください。\nドリモゲモンより"
text.17d6: "ねえ、聞いて！\nお宝が見つかったよ。"
text.1976: "持ち物を空けてきて！"
text.19aa: "{color:6}{item:pstat=110}{color:1}を手に入れた！"
text.1af2: "ご利用ありがとう！"
