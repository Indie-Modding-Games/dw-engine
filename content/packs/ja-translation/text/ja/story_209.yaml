text.00a6: "店\nマーケット\nポイント"
text.01fc: "カード\nアイテム預かり所\nほかの店"
text.0256: "今日もいつもどおり、\n新しいカードが入ってるよ。"
text.02a6: "カードを買う\nカードを売る\nやめる"
text.0304: "3枚パックを買う\n1枚だけ買う\nやめる"
text.0378: "1枚だけ買う\nやめる"
text.03bc: "1パック\n500ビットだよ。中身は\nお楽しみ。"
text.0442: "買う\nやめる"
text.0472: "さっそくパックを開けてね。"
text.04d4: "ほかに何かいるかい、相棒？"
text.0518: "また来てね。"
text.0538: "サウンドテスト\nワープショップ\n交換"
text.05a4: "エントリー\nアリーナ\nいろいろ\n値段"
text.05ee: "オープニング\nエンディング\n変身\n消える"
text.0772: "元の姿に進化する。"
text.07b8: "スカモンに進化する。"
text.07f6: "完了。"
text.082e: "' - {tournament:pstat=3}- 'にエントリー中"
text.0872: "エントリーがありません。"
text.08b0: "現在、{shopvar}ビットです。"
text.08e2: "クリア\n追加\n終了"
text.0992: "- Dクラス -\nルーキーのデジモンが\n出場する大会\n\nシングルマッチ・3回戦、\n出場者8体。\n出場条件：なし。"
text.0a90: "- Cクラス -\nチャンピオンのデジモンが\n出場する大会\n\nシングルマッチ・3回戦、\n出場者8体。\n出場条件：なし。"
text.0b92: "- Bクラス -\nチャンピオンのデジモンが\n出場する大会\n\nシングルマッチ・3回戦、\n出場者8体。\n出場条件：なし。"
text.0c94: "- Aクラス -\nアルティメットのデジモンが\n出場する大会\n\nシングルマッチ・3回戦、\n出場者8体。\n出場条件：なし。"
text.0d96: "- Sクラス -\n最強のデジモンが\n出場する大会\n\nシングルマッチ・3回戦、\n出場者8体。\nAクラス優勝者のみ。"
text.0e90: "- Rクラス -\nバトルロイヤルの大会。\n勝利のカギは作戦だ\n\n4体のバトルロイヤル、\n2回戦、出場者8体。\n出場条件：なし。"
text.0fc4: "- バージョン1カップ -\n時間制限ありの試合。\nバージョン1の強者が対決\n\nシングルマッチ・3回戦、\n出場者8体。\nバージョン1のデジモンのみ。"
text.1100: "- バージョン2カップ -\n時間制限ありの試合。\nバージョン2の強者が対決\n\nシングルマッチ・3回戦、\n出場者8体。\nバージョン2のデジモンのみ。"
text.123c: "- バージョン3カップ -\n時間制限ありの試合。\nバージョン3の強者が対決\n\nシングルマッチ・3回戦、\n出場者8体。\nバージョン3のデジモンのみ。"
text.1384: "- バージョン4カップ -\n時間制限ありの試合。\nバージョン4の強者が対決\n\nシングルマッチ・3回戦、\n出場者8体。\nバージョン4のデジモンのみ。"
text.14c6: "- バージョン0カップ -\n時間制限ありの試合。\nバージョン1〜4以外の\n強者が対決。\nシングルマッチ・3回戦、\n出場者8体。\nバージョン1〜4以外のみ。"
text.162c: "- 炎カップ -\n時間制限ありの試合。\n燃えるデジモンの王者決定戦\n\nシングルマッチ・3回戦、\n出場者8体。\n炎の性質のデジモンのみ。"
text.1766: "- 格闘カップ -\n時間制限ありの試合。\n格闘デジモンの王者決定戦\n\nシングルマッチ・3回戦、\n出場者8体。\n格闘の性質のデジモンのみ。"
text.18b0: "- 雷風カップ -\n時間制限ありの試合。\n大気のデジモンの王者決定戦\n\nシングルマッチ・3回戦、\n出場者8体。\n大気の性質のデジモンのみ。"
text.19fe: "- 冷気カップ -\n時間制限ありの試合。\nクールなデジモンの王者決定戦\n\nシングルマッチ・3回戦、\n出場者8体。\n氷の性質のデジモンのみ。"
text.1b30: "- 自然カップ -\n時間制限ありの試合。\n自然派デジモンの王者決定戦\n\nシングルマッチ・3回戦、\n出場者8体。\n自然の性質のデジモンのみ。"
text.1c7c: "- メタルカップ -\n時間制限ありの試合。\n機械デジモンの王者決定戦\n\nシングルマッチ・3回戦、\n出場者8体。\n機械の性質のデジモンのみ。"
text.1db6: "- よごれカップ -\n時間制限ありの試合。\nよごれたデジモンの王者決定戦\n\nシングルマッチ・3回戦、\n出場者8体。\nよごれた性質のデジモンのみ。"
text.1eee: "- 恐竜カップ -\n時間制限ありの試合。\n古代の血を引くデジモンが対決\n\nシングルマッチ・3回戦、\n出場者8体。\n出場条件：？？？"
text.201e: "- つばさカップ -\nつばさを持つデジモンが\n強さを競う\n\nシングルマッチ・3回戦、\n出場者8体。\n出場条件：？？？"
text.2130: "- 動物カップ -\n時間制限ありの試合。\nけものの血を引くデジモンが対決\n\nシングルマッチ・3回戦、\n出場者8体。\n出場条件：？？？"
text.2264: "- 人型カップ -\n時間制限ありの試合。\n人型のデジモンが対決\n\nシングルマッチ・3回戦、\n出場者8体。\n出場条件：？？？"
