text.0066: "勝負するのか？\nそれともビビったか？！"
text.00b2: "よし、勝負だ\nちょっと待って"
text.011e: "うわっ！負けた！"
text.0152: "なかなか手ごわかったね。"
text.019a: "おまえ、いいやつだな。オイラは\nマメモン。いっしょに行くよ。"
text.0200: "いっしょに来る？じゃあ、\n町に行ってみたら？"
text.0272: "わかった。そうするよ。"
text.02d6: "マメモンが町の仲間になった！"
text.0320: "もっと強くなってから\nまた来いよ。"
text.039c: "だあああ！"
text.03be: "はっはっは。"
text.03ea: "うぐぐっ！"
text.0410: "東：原生林\n西：ギアサバンナ"
