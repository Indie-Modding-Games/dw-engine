text.009a: "はっ！ビビってるな。"
text.00d4: "帰ったほうがいいぞ！"
text.0114: "一度入ったら、\n二度と出られないぞ。"
text.0170: "へっへっへ！"
text.0198: "待て。"
text.01b8: "とりつかれるぞ。"
text.0202: "バッケバッケ？"
text.0226: "なにか聞いて\nいるみたいだ。"
text.0272: "…はい？\n…いいえ？"
text.02a8: "バッケ！バッケバッケ？"
text.02d6: "はい\nいいえ"
text.0300: "バッケー…バッケバッケ？"
text.0338: "はい\nいいえ"
text.035e: "バッケバッケ！\nバッケー、バッケバッケー！"
text.03e8: "バケモンが町の仲間になった！"
text.0422: "うまくいったみたい。"
text.046e: "怒らせちゃったかな？"
text.04ea: "へんな黒い力に\n止められた！"
text.0556: "なに！？足が…"
