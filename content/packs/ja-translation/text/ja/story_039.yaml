text.0020: "じゃまだったかな？"
text.0090: "{color:7}??? {color:1}\n助けて！"
text.00ca: "上から声が聞こえるぞ。\n誰かいるのか？"
text.012c: "{color:7}??? {color:1}\n誰かいるの？"
text.0162: "ああ、いるぞ。"
text.018a: "{color:7}??? {color:1}\n助けて！\n地面がもり上がってるんだ。"
text.01e8: "冗談だろ。"
text.0222: "{color:7}??? {color:1}\nううん、本当だよ。\n機械の音が聞こえるんだ。"
text.029a: "機械？それならオーガモンの\nアジトから聞こえてるんだな。"
text.0312: "{color:7}??? {color:1}\nそこでなにかまずいことを\nしたんじゃないの？"
text.0386: "いろいろやったからな。\nエレベーターかもしれん…\nアジトにもどって調べてみる。"
text.0442: "{color:7}??? {color:1}\nありがとう。"
