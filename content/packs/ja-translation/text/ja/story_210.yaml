text.00bc: "待っておったぞ、\n{color:6}{tamer}{color:1}。\nついにこの日が来たのじゃ"
text.0130: "どうしたの？"
text.0154: "無限山への入口が\n現れたのじゃ。"
text.01a8: "えっ？本当？どこに？"
text.01d8: "町の滝の\n向こうじゃよ。"
text.0224: "わあ、すごく近いね！"
text.0254: "わしが思うに、最後の\n敵は無限山におる。"
text.02c4: "じゃあ、そこが最後の\nダンジョンだね。やるよ！"
text.0316: "がんばるのじゃぞ！じゃが\nあせってはならん。準備が\nととのうまで動くでないぞ。"
text.03ce: "町の中、滝の向こう側に\n無限山への入口が\nあるのじゃ。"
text.0478: "わしが思うに、最後の\n敵は無限山におる。"
text.04e6: "しっかり準備して行くのじゃぞ！"
text.051c: "それはそうと…"
text.0546: "今の町の発展度は\n{num:pstat=1}じゃ。"
text.05b4: "昔のすがたには\nまだほど遠いのう。"
text.060e: "ようやく形になってきたのう。"
text.0658: "順調に発展しておるのう。"
text.0698: "立派な町になってきたのう。"
text.06e2: "よくやってくれたのう。\nすばらしい！"
text.073a: "もう何も言うことはない。\nすばらしい町じゃ！"
text.07be: "{color:7}テイマーレベルが\n上がった！ {color:1}"
text.0808: "{color:7}おめでとう！\nよくがんばったね！\nメダルをどうぞ！ {color:1}"
