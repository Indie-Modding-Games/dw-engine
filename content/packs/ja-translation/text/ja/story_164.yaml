text.0438: "{color:1}白 白 白\n{color:2}青 青 青\n{color:3}赤 赤 赤\n{color:4}ピンク {color:5}緑\n{color:6}水色 水色\n{color:7}黄色 {color:10}オレンジ\n{color:10}a {color:6}b {color:4}c {color:5}d"
text.051c: "今は{num:pstat=105}月\n{num:pstat=106}日の\n{num:pstat=107}: {num:pstat=108}です。"
text.0582: "わたしはMr.ワープ。\nどこへ行きたい？"
text.05d6: "近く\n遠く\nとても遠く"
text.0620: "パノラマ山の頂上\n熱帯ジャングル\nドリルトンネル"
text.069e: "ギアサバンナ\nグレイロードの館\n大渓谷"
text.070c: "古代恐竜地帯：門\n古代恐竜地帯：奥\n未知の世界"
text.07b6: "カーリング洞窟の前\nシードラ釣り\n溶岩洞窟"
text.083e: "寿命3"
text.085a: "わたしはMr.進化。\n何になりたい？"
text.08bc: "ヌメモン\nスカモン\nボタモン"
text.0a50: "瀕死\nオープニング\n時間を進める"
text.0acc: "1時間進める\n6時間進める\n10日進める"
text.0b76: "肉はいかが？"
text.0bae: "あら、ごめんなさい。\n説明するのを忘れてたわ。"
text.0bfa: "ここは肉畑。\nみんなのために肉を育ててるの。"
text.0c60: "畑で肉を育ててるの？"
text.0c98: "ええ、何かおかしい？"
text.0cc4: "いや…なんでもない。\nつづけて…"
text.0d20: "ジジとわたしで、\n{color:6}{tamer}{color:1}に毎日\n肉を3つあげることにしたの。"
text.0da4: "はい、今日の肉よ。"
text.0df6: "肉を持ちすぎだね。\n今日はいらない\nみたいだね。"
text.0e82: "肉を持ちすぎだね。\n持ちきれない分は\nもらっておくよ。"
text.0efa: "{color:6}肉{color:1}を\n3つ手に入れた！"
text.0f52: "アイテムがいっぱいです。"
text.0f8a: "{color:6}肉{color:1}を\n3つ手に入れた！"
text.0fea: "肉がたくさんとれたの！\nだから肉を\n5つあげるわ。"
text.1088: "肉を持ちすぎだね。\n今日はいらない\nみたいだね。"
text.1110: "肉を持ちすぎだね。\n持ちきれない分は\nもらっておくよ。"
text.1192: "{color:6}肉{color:1}を\n5つ手に入れた！"
text.11f0: "ごめんなさい、アイテムが\nいっぱいみたいね。"
text.1246: "{color:6}肉{color:1}を\n5つ手に入れた！"
text.1286: "また明日あげるわね。"
text.12d8: "はい、今日の肉よ。"
text.131e: "肉を持ちすぎだね。\n今日はいらない\nみたいだね。"
text.13a6: "肉を持ちすぎだね。\n持ちきれない分は\nもらっておくよ。"
text.142a: "{color:6}肉{color:1}を\n3つ手に入れた！"
text.148a: "アイテムがいっぱいです。"
text.14c4: "{color:6}肉{color:1}を\n3つ手に入れた！"
text.1506: "また明日あげるわね。"
text.154c: "あら？今日はもう肉を\nあげたでしょ？"
text.159e: "食べ物がなくなったら、\n原生林でキノコを\nさがしてみて。"
text.1620: "じゃあ、この町のまわりを\n説明してあげるわね。"
text.1692: "町のまわりは\n原生林よ。"
text.16da: "あのへんのデジモンは\nあまり強くないわ。"
text.173a: "西にはトレーニング\nキャンプがあるの。きっと\nよく行くことになるわ。"
text.17d4: "川をわたった東には\n熱帯ジャングルがあるわ。"
text.1846: "その先のことは知らないの。"
text.1888: "西には山と湖があって、\nその先は\n行き止まりよ。"
text.1910: "南にずっと行くと、\n海があるわ。"
text.196a: "それから北には高い山が\nあるの。そこも\n行き止まりよ。"
text.19ee: "この町は島のまん中だから、\n北には広い土地が\nあるはずよ。"
text.1a9c: "外のうわさを調べておくわ。\nまた聞きに来てね。"
