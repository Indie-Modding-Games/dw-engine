text.001e: "{color:6}{tamer}{color:1}、よくやったのう！"
text.0044: "アグモンが町に来てくれた。\nあそこで商売を\nはじめたぞ。"
text.00be: "アグモンのようなデジモンが\nもっとふえるといいのう！"
text.012c: "パルモンが来て、肉畑を\n広げてくれるそうじゃ。"
text.019c: "これで肉がたくさんとれるぞ！"
text.01f4: "クネモンが来て、\n草を食べたいそうじゃ。"
text.024e: "雑草を食べてくれるといいのう！"
text.02a2: "センタルモンが来て、\n診療所を開くそうじゃ。"
text.0310: "これで病気やケガも\n心配いらんのう！"
text.0386: "コエラモンが来て、\n店をはじめたいそうじゃ。"
text.03ec: "町がにぎやかになるのう！"
text.0438: "ベタモンが来て、店を\nはじめたいと言っておった。"
text.04a8: "町がにぎやかになるのう！"
text.04f4: "バケモンが来たが、\n言うことがよくわからんかった。"
text.056c: "まあ、それもよかろう。"
text.05b6: "ベジーモンが来た。肉畑を\nもっと広げるそうじゃ。"
text.0632: "これで食べ物の心配はないのう。"
text.0686: "ティラノモンが来て、自分の\n料理が一番だと言っておった。"
text.06f8: "まあ、それも魅力じゃな。"
text.0746: "メラモンが来て、自分は\n炎の親分だと言っておった。"
text.07c0: "やる気が燃えておるわい！"
text.0816: "フリジモンが来て、おやつの\n話をしておった。"
text.0882: "わしはおやつが大好きじゃ。"
text.08bc: "ガルルモンが来て、\n料理ができると言っておった。"
text.091e: "なかなかの腕前じゃ。"
text.0964: "バードラモンが来て、\n運び屋になると言っておった。"
text.09c4: "いいことじゃ。"
text.09fa: "シェルモンが来て、\n掲示板を作ると言っておった。"
text.0a70: "情報化社会への\n第一歩じゃ！"
text.0ada: "エレクモンが来て、\n電気を通してくれるそうじゃ。"
text.0b46: "町が明るくなるといいのう。"
text.0b9c: "コカトリモンが来て、\n像を作る話をしておった。"
text.0c10: "くつろげる場所じゃな。"
text.0c66: "モノクロモンが来て、\n道具屋の店長として\n働く話をしておった。{stop}"
text.0d08: "あやつはプロじゃ。"
text.0d4e: "ユニモンが来て、商売で\n役に立ちたいと言っておった。"
text.0dc4: "いい心がけじゃ。"
text.0e12: "パタモンが来て、おもしろい\n仕事はないかと聞いてきた。"
text.0e78: "道具屋をすすめておいた。"
text.0ec8: "ビヨモンが来て、おすすめの\n仕事はないかと聞いてきた。"
text.0f3c: "道具屋をすすめておいた。"
text.0f8c: "グレイモンが来て、\nアリーナを作る話をしておった。"
text.0ff2: "ぜひとも\n見てみたいのう。"
text.104c: "ペンギンモンが来て、\nカーリング場を\n作る話をしておった。"
text.10ca: "いろいろそろってきたのう。"
text.1120: "エンジェモンが来て、\n会話を記録する\n話をしておった。"
text.1194: "すぐ近くにおるぞ。"
text.11ce: "ドリモゲモンが来て、\n宝探しを本業にする\n話をしておった。"
text.1270: "大仕事じゃ！"
text.12a2: "ガブモンが来て、\n何をするか\n迷っておると言っておった。"
text.1334: "大きな仕事を選べと\n言っておいた。"
text.13a0: "ニンジャモンが来て、\n修行の話をしておった。"
text.1400: "働き者がいるのはいいことじゃ。"
text.145a: "ホエモンが来て、\n渡し船の代わりを\nすると言っておった。"
text.14e0: "すばらしい！"
text.150a: "モジャモンが来て、\nなんでも屋を開く\n話をしておった。"
text.1586: "じゃが、何かが\nちがう気がするのう。"
text.15f4: "マメモンが来て、お宝を\n売る話をしておった。"
text.166a: "「お宝」とは\nいったい何じゃろう？"
text.16c8: "ヌメモンが来て、店を\n開く話をしておった。\nじゃが、それは秘密じゃ。"
text.1752: "もう秘密ではないのう。"
text.17a0: "カブテリモンが来て、修行と\n改造の話をしておった。"
text.181e: "グリーンジムに行ったのかのう？"
text.1872: "クワガモンが来て、\nカブテリモンをさがしておった。"
text.18d8: "どこへ行ったのかのう？"
text.1916: "ギロモンが来て、\n依頼をしろと言っておった！"
text.1976: "だから依頼をするといい。"
text.19b8: "オーガモンが来て、自分の腕を\n買ってくれと言ってきた。"
text.1a1c: "目がギラギラしておったぞ！"
text.1a66: "レオモンが来て、町のことを\nいろいろ聞いてきた。"
text.1acc: "サバンナ・パトロールは\nまだ続いておるようじゃ！"
text.1b40: "ピクシモンが来て、こう言った。\n「おじさん、ひみつの\nアイテムはいらんかね？」"
text.1bca: "心配じゃのう。"
text.1c04: "エテモンが来て、イカした店を\n開く話をしておった。"
text.1c70: "あやしいのう。"
text.1cb2: "メタルマメモンが来て、\n{color:6}{tamer}{color:1}と張り合える\n仕事はないかと聞いてきた。"
text.1d4e: "負けずぎらいじゃのう。"
text.1da4: "ベイドモンが来て…\nいや、来たかのう？"
text.1dfc: "どうも思い出せん。"
text.1e4c: "メタルグレイモンが来て、\nモデルの話をしておった"
text.1eb2: "えらそうなやつじゃ！"
text.1efc: "ナニモンが来て、帰っていった。"
text.1f38: "どこにおるのかのう？"
text.1f80: "モンザエモンが来た…いや、\nその着ぐるみがとつぜん\n現れたと言うべきか。"
text.2012: "あれは家に置いておくそうじゃ。"
text.206e: "デビモンが来て、すごい\nアイテムの話をしておった。"
text.20e4: "すごいのじゃろうな。"
text.2130: "エアドラモンのケガが治って、\n働く話をしておった。"
text.219a: "元気になってよかったのう。"
text.21f4: "デジタマモンが来て、\n光の速さで去っていった。"
text.2264: "まだ町のどこかに\nおるはずじゃ。"
text.22c4: "スカルグレイモンが来て、\nアリーナで戦うと\n言っておった。"
text.233e: "マイオティスモンが通訳した。"
text.2396: "アンドロモンが来て、\n会えてうれしいと言っておった。"
text.23fa: "あまり長くは\nいられないようじゃ。"
