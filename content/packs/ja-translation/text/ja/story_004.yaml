text.0090: "文字がきざまれている。"
text.00dc: "誰もいないぞ！帰れ！"
text.011e: "誰か住んでるのかな？"
text.0176: "{color:7}? ? ? {color:1}\n猿も木から落ちるってな。"
text.01c8: "{color:7}? ? ? {color:1}\n空中ひざ落とし！"
text.025e: "負けたけど、\nおまえらなんか大したことない！"
text.02b4: "負けおしみはやめなよ。\nそっちだって不意打ちして\nきたじゃないか。"
text.0344: "うぐっ！こうなったら\nしかたない…"
text.0394: "おまえらの町で、\nオレ様の強さを見せて\nやる！見てろよ！"
text.0462: "エテモンが町の仲間になった！"
text.04a0: "ケガするだけだぜ。"
text.04e0: "まだまだお子ちゃまだな！"
text.051c: "遊んでやってもいいぜ。"
text.056a: "鼻をへし折ってやる！"
text.05aa: "まっぷたつにしてやる！"
