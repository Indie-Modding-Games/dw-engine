text.0064: "これで最後だ。"
text.00a2: "ついに着いたぞ！"
text.00e0: "道が開いた！"
text.0118: "気楽にいこう。"
text.0154: "これが最後のチャンスだ！"
text.019a: "本当に行くの？"
text.01f0: "こわい！体のしんまで\nふるえるよ。"
text.023a: "…"
text.0248: "なぜ攻撃してこない？"
text.0282: "…"
text.0290: "戦わなくていいのか？"
text.02c8: "急いで行かなきゃ。\n腕だめしをしないとね。"
text.0348: "行こう、{color:10}{partner}{color:1}！"
text.039c: "…"
text.03de: "勝ったの？"
