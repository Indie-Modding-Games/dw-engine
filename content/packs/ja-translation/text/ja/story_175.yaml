text.0050: "オレのレストランへようこそ。"
text.0088: "このレストランの\n店長兼シェフに\nなることにしたぞ。"
text.0104: "オレの燃える料理を\n好きなだけ味わってくれ。"
text.0180: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}、\nオレの手料理を\n食べていかないか？"
text.01d6: "拾ったアイテムとはちがう\n本物の料理だぜ。\nオレのひそかな特技さ。"
text.027c: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}！\n料理で生きていくことに\n決めたんだ。腕はいいぞ！"
text.02f6: "たまにはオレの店で\nゆっくり食べて\nいきなよ。"
text.037e: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}。\nついにオレのレストランが\nオープンしたぞ！"
text.03d4: "冷たいデザートをどうぞ！\n自慢の一品なんだ。"
text.044a: "{color:6}{tamer}{color:1}、このレストランで\nシェフとして働くことに\nしたよ。"
text.04c2: "ここでは温かい\n食事が楽しめるよ。"
text.0520: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}、\nぼくはもうプロの料理人だよ！"
text.0572: "ぼくの料理を食べたいなら\n朝のうちに\n来たほうがいいよ！"
text.0614: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}！\n料理で生きていくことに\n決めたんだ。腕はいいぞ！"
text.068e: "ぼくの特別料理は\n早朝と真夜中に\n食べられるよ。"
text.0750: "やあ{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}！"
text.0770: "このレストランを\n手伝うことにしたの。\nデザート担当なんだ。"
text.07ee: "わたしのデザートは\n自慢の味なの。\nぜったい食べてみてね！"
text.08a8: "わあ！ねえ{color:6}{tamer}{color:1}！\nこの機械は何に使うの？"
text.08fa: "こわがらないで！これは\nハートをアゲてくれる\nジュークボックスさ！イェイ！"
text.098a: "ノッていこうぜ！\nさあ、はじけちゃえ！\n注文を待ってるぜ！"
