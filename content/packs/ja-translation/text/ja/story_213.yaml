text.0040: "あっ、{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}！\n来たね！見てよ、これが\nファイルシティのアリーナだ！"
text.00d0: "もうすぐ選手やファンで\nいっぱいになるよ。きみも\nファンを喜ばせてくれるよね？！"
text.0188: "大会で勝つと賞金や\n賞品がもらえるんだ。\n損することはないよ。"
text.0230: "大会のくわしいことは、\nあそこの機械で見てね。"
text.02d0: "そうそう、見習いのデジモンは\n出られないんだけどね。\nスケジュールを見てみる？"
text.038c: "そうそう、見習いのデジモンは\n出られないんだけどね。\nスケジュールを見てみる？"
text.043c: "来てくれてうれしいよ。\n大会にエントリーする？"
text.04b6: "はい\nいいえ\nどういうこと？"
text.0520: "じゃあ、あしたの\n大会に出るんだね？"
text.058a: "エントリーを\nキャンセルするの？"
text.05d8: "キャンセルしない\nキャンセルする"
text.0652: "今日の大会にエントリー\nしてるんだよね？\n朝10時から入れるよ。"
text.06e8: "キャンセルなんて\nしないよね？！"
text.0740: "キャンセルしない\nキャンセルする"
text.07aa: "今日の大会にエントリー\nしてるんだよね？\n夜11時までに入ってね。"
text.0832: "キャンセルなんて\nしないよね？！"
text.088a: "キャンセルしない\nキャンセルする"
text.08f6: "じゃあ、キャンセルしておくね。"
text.0934: "中に入ったら、開始時間に\n左の階段を下りて\nバトルに出てね。"
text.09de: "エントリーは無料だよ。\nエントリーできるのは今日と\nあしたの大会だけ。"
text.0a8c: "でも、その日の大会は\n朝10時までにエントリー\nしないといけないよ。"
text.0b1a: "スケジュールは5日先まで\n見られるから、チェックして\n予定を立ててね。"
text.0bb8: "赤い大会には\n出られないっていう意味だよ。"
text.0c32: "でもスタートボタンを押せば\n内容は見られるよ。"
text.0ca0: "出場条件が「なし」の\n大会でも、"
text.0d06: "見習いのデジモンは\n出られないよ。"
text.0d52: "エントリーの説明は\nこんなところかな。\nエントリーする？"
text.0dd4: "はい\nいいえ\nもう一度説明して"
text.0e3c: "ちょっと！まだ\nエントリーしてないよ！"
text.0eba: "ちょっと！大会は\nあしただよ！"
text.0f42: "入るにはまだ早いよ。\n10時まで待ってね。"
text.0ff4: " \n{color:4}テイマーレベルが下がった！{color:1}"
text.10c6: "- Dクラス -\nルーキーデジモンの\n大会\n\nシングルマッチ、3回戦\n参加者8人。\n出場条件：なし。"
