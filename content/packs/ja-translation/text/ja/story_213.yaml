text.15c4: "- Rクラス -\nバトルロイヤル大会：\n勝利のカギは作戦だ\n\n4人でのバトルロイヤル、\n2回戦、参加者8人。\n出場条件：なし。"
text.16f8: "- バージョン1カップ -\nバージョン1の強者による\n時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\nバージョン1のデジモンのみ。"
text.1834: "- バージョン2カップ -\nバージョン2の強者による\n時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\nバージョン2のデジモンのみ。"
text.1970: "- バージョン3カップ -\nバージョン3の強者による\n時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\nバージョン3のデジモンのみ。"
text.1ab8: "- バージョン4カップ -\nバージョン4の強者による\n時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\nバージョン4のデジモンのみ。"
text.1bfa: "- バージョン0カップ -\n時間制限つきの試合\nバージョン1〜4以外の\n強いデジモンが対象\nシングルマッチ、3回戦\n参加者8人。\nバージョン1〜4以外のみ。"
text.1d60: "- 炎カップ -\n燃えるデジモンの王を\n決める時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\n炎の性質のデジモンのみ。"
text.1e9a: "- 格闘カップ -\n格闘技の王を\n決める時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\n格闘の性質のデジモンのみ。"
text.1fe4: "- 雷風カップ -\n雷と風のデジモンの王を\n決める時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\n雷風の性質のデジモンのみ。"
text.2132: "- 冷気カップ -\nクールなデジモンの王を\n決める時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\n氷の性質のデジモンのみ。"
text.2264: "- 自然カップ -\n自然派デジモンの王を\n決める時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\n自然の性質のデジモンのみ。"
text.23b0: "- メタルカップ -\n究極のマシンデジモンの王を\n決める時間制限つきの試合\n\nシングルマッチ、3回戦\n参加者8人。\n機械の性質のデジモンのみ。"
