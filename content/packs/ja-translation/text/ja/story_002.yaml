text.0060: "勝つのはぼくだ！"
text.0098: "よし、かかってこい！"
text.00d4: "次はどうなるのかな？"
text.0122: "うまくいくわけないよ。"
text.0168: "おなかがすいた。"
text.0186: "食べ物をあげる\nあげない"
text.01de: "今は食べ物がない。"
text.0266: "おっと、これはあげられない。"
text.02b8: "おいしい…。"
text.02de: "勝負だ！"
text.032e: "これはまずいな。\nどうしよう？"
text.0380: "町に来て、食べた分を\n働いて返しなよ！"
text.03e6: "わかった、そうするよ。ぼくは\n虫型デジモンのクネモン。\nよろしくね。"
text.04c0: "クネモンが町の仲間になった！"
text.0508: "次は持ってきてね。"
