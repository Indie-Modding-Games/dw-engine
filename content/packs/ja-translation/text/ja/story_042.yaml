text.006a: "シュワーッ！"
text.008c: "シャ、シャ、シャーッ！"
text.00c0: "ケガはしてないみたいだ。"
text.010e: "安くしとくよ。"
text.0156: "オレたちをバカにするな！"
text.0196: "生きて帰れると\n思うなよ！"
text.0262: "いたっ！"
text.027a: "あんな高さから落ちたのに、\n平気そうだね。"
text.02dc: "{color:10}{partner}{color:1}、\nだいじょうぶ？"
text.0310: "わあ、平気みたい！"
text.033c: "飛んだの？ずるい！\nまあ、ずるくはないか。"
text.03b6: "行こう！"
text.03ea: "いたっ！"
text.0402: "あんな高さから落ちたのに、\n平気そうだね。"
text.0460: "{color:10}{partner}{color:1}、\nだいじょうぶ？"
text.0494: "やっぱり痛いよね。ごめん。"
text.04d4: "行こう！"
