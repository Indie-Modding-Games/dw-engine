text.0034: "ねえ、ぼくと勝負しない？\nきみが勝ったら、なんでも\n言うことを聞いてあげるよ。"
text.00da: "どんな勝負？"
text.0108: "その名も…\nデジモンカーリング！\nくわしくは中で話すよ。"
text.0186: "う〜ん、負けたらどうなるの？"
text.01c6: "最初は何もなし。\nでも次からは先に\n魚を1匹もらうよ。"
text.025c: "じゃあ、こっちが勝ったら、\n町にいっしょに来てね。{stop}\nよし、やろう。"
text.02f4: "よし、それでいいよ。\n中に入ろう。"
text.0384: "ねえ、ぼくと勝負しない？\n魚を1匹くれたら\n相手になるよ。"
text.0426: "受けて立つ\nやめておく"
text.0474: "よう、兄弟！ここに\nスケートリンクを作ったんだ。"
text.04c2: "魚1匹で1試合。\nでも、勝ったら\nいい賞品をあげるよ。"
text.0554: "なあ、ぼくと勝負\nしないか？魚1匹で\n挑戦できるよ。"
text.0606: "受けて立つ\nやめておく"
text.0642: "ちぇっ、つまんないの。"
text.0676: "魚をちょうだい！"
text.06ae: "今は何も持ってないんだ…"
text.0738: "あ〜あ、それをもらっても\nしょうがないよ。"
text.079a: "わあ、おいしそう。おっと、\nまずは勝負しなきゃね。\n中に入ろう。"
text.0842: "おいおい、なんだよ。\n竜眼湖で釣りでも\nしてきたら？"
text.08d6: "ざんねんだったね。また\n挑戦しに来てよ。次の魚を\n忘れずに持ってきてね。"
text.0992: "すごい！パーフェクトだ！\nもしかして…\nプロの人？"
text.0a34: "{color:7}おめでとう！\nすばらしい勝負だったよ！\nメダルをどうぞ！ {color:1}"
text.0ab8: "すごいよ。ぼく、初めて\n勝負に負けちゃった。"
text.0b20: "さあ、約束どおり\n町にいっしょに来てね。"
text.0b94: "しかたないなあ、行くよ。\nでも、町で何をするかは\nもう決めてあるんだ。"
text.0c7a: "ペンギンモンが町の仲間に！"
text.0cd2: "ざんねんだったね。また\n挑戦しに来てよ。魚を\n忘れずに持ってきてね。"
text.0d82: "すごい！パーフェクトだ！\nもしかして…\nプロの人？"
text.0e24: "{color:7}おめでとう！\nすばらしい勝負だったよ！\nメダルをどうぞ！ {color:1}"
text.0ea8: "うわ、きみってすごいね。\nまた負けちゃった。"
text.0f00: "まあ、しかたない。\nはい、賞品だよ。"
text.0ff8: "アイテムを持ちすぎだよ！"
text.103c: "{color:6}{item:pstat=110}{color:1}を手に入れた！"
text.106a: "やあ、{color:6}{tamer}{color:1}。\nペンギンモンにたのまれて\n店番をしているんだ。"
text.10ea: "ぼくと勝負しよう！\n勝ったら、とっておきの\n賞品をあげるよ。どう？"
text.118c: "よし、やろう\nやめておく"
text.11da: "勝負の前に\n魚をもらうよ。"
text.123e: "あっ、今は何も\n持ってないや。"
text.12da: "それをもらっても\nしょうがないなあ。"
text.1330: "よし、今度こそ\n勝つぞ。中に入ろう。"
text.13a2: "魚がないと勝負は\nできないよ。また今度\n来てね。"
text.1436: "え？\n断るっていうの？"
text.1488: "ぼくに勝ちたいなら、\n頭を使わなきゃね！\nまたいつか会おう。"
text.1546: "ぼくにパーフェクトで\n勝つなんて！！きみは\nカーリングの天才！？"
text.15e0: "{color:7}おめでとう！\nすばらしい勝負だったよ！\nメダルをどうぞ！ {color:1}"
text.1664: "やるね、{color:6}{tamer}{color:1}！\n約束の賞品を\nどうぞ！"
text.17a2: "アイテムを持ちすぎだよ。"
text.17e6: "{color:6}{item:pstat=110}{color:1}を手に入れた！"
