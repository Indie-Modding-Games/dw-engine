text.0062: "わあ！"
text.0080: "うーん。"
text.00a0: "えっと、もうやめにしよう。"
text.00e6: "まだ油断は\nできないぞ。"
text.013c: "…！"
text.0180: "いやだ、いやだよ！\n戦いたくない！"
text.01de: "戦いたくないなら\n逃げればいいだろ。"
text.023a: "それは残念。"
text.0268: "きみのことがわからないよ。"
text.029c: "まあいいや、ぼくたちの町に\n来ない？ここにかくれてる\nよりいいよ。"
text.032e: "え、町？"
text.0350: "無理にとは\n言わないよ。"
text.0394: "そう言われると行きたくなる。\nよし、行くよ！"
text.0426: "ガブモンが町の仲間になった！"
text.0464: "変なやつだなあ。"
