text.0052: "たあっ！"
text.0072: "よし、くらえ！"
text.00ae: "シャーッ！"
text.00d2: "ブオーン！"
text.011e: "だれだ？この場所を荒らす\nやつは許さないぞ！"
text.0194: "心配しないで。島を救うために\n通りかかった\nだけなんだ。"
text.0220: "信じられないな。出ていけ！"
text.0260: "ちょっと待て。"
text.02cc: "もしかして、きみたちは…？"
text.030e: "だから言ったでしょ！"
text.0336: "すまない。めったに客が\n来ないから、新しい仕事に\n張りきってしまってな。"
text.03d2: "仕事？"
text.03e2: "古代恐竜地帯という場所の\n番をしているんだ。"
text.0448: "未知の土地なんだ。"
text.0484: "案内してくれる？"
text.04bc: "古代恐竜地帯は\n2つに分かれている。"
text.0520: "オレたちが住んでいるのは\n氷河ゾーンだ。"
text.057a: "時間がゆっくり流れる\n特別な場所なんだ。"
text.05de: "時間がゆっくり？"
text.0608: "もうひとつは\nスピードゾーンだ。"
text.0656: "氷河ゾーンより遠くにあって、\n危険な場所だ。"
text.06c8: "時間がとても速く流れるから\n危険なんだ。"
text.071c: "荒れた土地で、骨や化石が\nあちこちにある。"
text.0782: "ほかの場所より時間が\n速く進むから？"
text.07fc: "そうだ。長居はするなよ。"
text.083c: "オレが道をふさいでいるから、\n通ることはできないぞ。"
text.08a4: "きみの負けだね。"
text.08c2: "運が悪かっただけだ！\nめったにないことだぞ。"
text.0918: "ほんとかなあ？"
text.093c: "オレは家に帰らないと。\nわからないことは\nほかのデジモンに聞いてくれ。"
