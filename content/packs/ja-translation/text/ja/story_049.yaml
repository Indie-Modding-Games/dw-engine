text.004a: "いらっしゃい。見ない顔だね。\nどこから来たんだい？"
text.00c2: "町から。ほんとうは\n別の世界から来たんだ。"
text.0120: "ことばがわかるのかい？"
text.015e: "うん、わかるよ。"
text.017a: "ここはなかなか大変でね。\nあまり売れないんだ。"
text.01e0: "そうなんだ。"
text.01f4: "お客さんがずいぶん減ってね。"
text.0236: "島で起きてる騒ぎの\nせいだろうね。"
text.0288: "ちょっと手伝ってくれないか。"
text.02ba: "なに？"
text.02d8: "うちの店で働いてみないか？"
text.0310: "お店で？"
text.032c: "半日どうだい？たくさん売れば\nそれだけ給料をはずむよ。\nことばもわかるしね。"
text.03c8: "損しちゃうかもよ。"
text.03fa: "心配いらないよ。こっちも\n助かるんだ。8時間でどうだい？"
text.0474: "やってみる\nやめておく"
text.05fa: "ざんねんだ。時間があるときに\nまた来ておくれ。"
text.065e: "働きたいのかい？"
text.06b2: "さて、半分まで来たね。\n "
text.0750: "この調子じゃ、ぜんぜん\nもうからないよ。がんばって。\n "
text.07e2: "売れ行きは上々だ。\n少しはもうかりそうだね。"
text.084a: "こんなに繁盛したのは\nひさしぶりだよ。\nその調子で！"
text.08d8: "そろそろ時間だね。\n働いてくれてありがとう。"
text.0944: "もっとやれたと思うけど、\n悪くはなかったよ。\nくじけないでね。"
text.09d4: "500ビットもらった！"
text.0a22: "もっとできるはずだよ。\nまた働いてほしいな。"
text.0a86: "1500ビットもらった！"
text.0ace: "きみの知恵と人柄と根性こそ、\nこの島を救うのに\n必要なものなんだ。"
text.0b60: "なんの話？"
text.0b9e: "きみがわたしたちを救えるか\nためしていたんだよ。"
text.0c18: "バトルに強いことは\n大切だ。"
text.0c68: "でも力だけじゃなく、\n勇気と知恵も必要なんだ。"
text.0cd4: "テストは合格？"
text.0d06: "ああ、できるかぎり\n力を貸そう。"
text.0d56: "町に来てくれる？\nお店はどうするの？"
text.0dd2: "店はまた開けばいい。\nこの店の役目はもう終わったよ。"
text.0e42: "モノクロモンが\n町の仲間になった！"
text.0e7e: "2000ビットもらった！"
