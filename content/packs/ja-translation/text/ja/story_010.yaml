text.0090: "えらそうにしやがって！"
text.00dc: "ぼくがなにをしたっていうの！？"
text.0156: "{color:7}? ? ? {color:1}\n待て！"
text.02f0: "拙者はニンジャモンと申す！"
text.033a: "おぬしが{color:6}{tamer}{color:1}か？\nそしてそちらが{color:10}{partner}{color:1}だな！"
text.0380: "おぬしらの名は忍者の里にまで\nとどろいておる。\n拙者と勝負してもらおう。"
text.041e: "いいよ\nまた今度"
text.0454: "ふっ、甘いわ！"
text.04e0: "うわさ通りの強さだ。\nどうか拙者を弟子に\nしてくだされ！"
text.0580: "弟子？そういうのは\nやってないんだ。でも、\n町作りを手伝ってほしいな。"
text.060a: "承知した。\nそれもよい修行になろう。\n精一杯はげむでござる。"
text.076c: "ニンジャモンが町に加わった！"
text.07b8: "おい、おまえ！"
text.07d0: "どういうこと？\nなんでここにいるの？"
text.081c: "おい、{color:6}{tamer}{color:1}！"
text.0834: "町で自分だけのハーレムを\n作ろうとしたら、\n追い出されちまった！"
text.08ce: "最近、ずいぶん調子が\nいいらしいな。\nいいものを売ってやるよ！"
text.0962: "すっごく貴重な\n{color:6}金のバナナ{color:1}だ。"
text.09c0: "50000ビットだ。\nツケはお断りだぜ。"
text.0a24: "払う\n払わない"
text.0a76: "バカめ！持ちすぎだ！"
text.0abe: "おっと、持ちすぎだ！"
text.0afe: "まいどありー！"
text.0b30: "人間は生きた金を使うもんだ。"
