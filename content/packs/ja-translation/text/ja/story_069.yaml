text.0066: "ノックアウトしてやる！"
text.00ce: "もう一回やろうよ。"
text.00fa: "はい\nいいえ"
text.0148: "あとちょっと…\nほら、もう一回！"
text.01ae: "はい\nいいえ"
text.020c: "勝てないよ！"
text.0230: "どうして勝ちたいの？"
text.026e: "ほかになにをすればいいの？"
text.0298: "どういうこと？\nほかにすることがないの？"
text.02f4: "ひまならたくさんあるよ。"
text.032c: "ひまなら町においでよ。\nいろんなデジモンが\nいるよ。"
text.03d6: "いいね。行くよ。\nぼくはパタモン。\nまたね。"
text.0482: "パタモンが町の仲間になった！"
text.04c8: "つまんないの！"
text.04f6: "来るの？"
text.052a: "においがしないぞ！"
text.0560: "おいしそう。\nまるごと食べてやる！"
text.05b6: "ははっ、おもしろいやつ！"
