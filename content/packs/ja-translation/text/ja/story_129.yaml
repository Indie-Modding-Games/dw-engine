text.00c6: "やあ、{color:6}{tamer}{color:1}！"
text.00f4: "やあ、{color:6}{tamer}{color:1}！"
text.0122: "やあ、{color:6}{tamer}{color:1}！"
text.0154: "また来てくれてありがとう。"
text.0190: "やあ、モジャモンだよ！"
text.0280: "{color:6}{tamer}{color:1}、本当にうれしいよ！\nいろいろありがとう。"
text.02e2: "町に行くことに決めたよ。\nいっしょに働こうね。\nよろしく！"
text.03a4: "モジャモンが町の仲間になった！"
