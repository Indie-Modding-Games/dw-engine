text.00ac: "またここだ。"
text.00da: "じゃあね！"
text.00fa: "このままじゃ、同じことの\nくり返しだ。"
text.0168: "ここで待ってみようかな。"
text.01c4: "だれ？"
text.01e0: "まさか。"
text.0206: "わああ！"
text.0228: "待って！"
text.027a: "またか！待て！"
text.02d6: "またか！待て！"
text.0332: "またか！待て！"
text.038e: "またか！待て！"
text.04c6: "待ってみようかな。"
text.04ec: "待つ\n行く"
text.0524: "よし、{color:10}{partner}{color:1}、\nビヨモンをつかまえろ！"
text.05aa: "ちがう場所に行っちゃった！"
text.0612: "待ってみようかな。"
text.0638: "待つ\n行く"
text.0670: "よし、{color:10}{partner}{color:1}、\nビヨモンをつかまえろ！"
text.06f6: "ちがう場所に行っちゃった！"
text.075c: "待ってみようかな。"
text.0782: "待つ\n行く"
text.07ba: "よし、{color:10}{partner}{color:1}、\nビヨモンをつかまえろ！"
text.0840: "ちがう場所に行っちゃった！"
text.08a6: "待ってみようかな。"
text.08cc: "待つ\n行く"
text.0904: "よし、{color:10}{partner}{color:1}、\nビヨモンをつかまえろ！"
text.098a: "ちがう場所に行っちゃった！"
text.09ea: "待ちぶせ成功！"
text.0a26: "助けて〜！"
text.0a4a: "落ち着いて。ぼくたちは\n悪者じゃないよ。"
text.0aac: "あなたがうわさの\nデジモンさらいなの？"
text.0b02: "みんな、なにか\nかんちがいしてると思う。"
text.0b5e: "{color:6}{tamer}{color:1}は\n説得しようとした。"
text.0ba0: "そっか、わたしのかんちがいね。"
text.0bd6: "町に行ってみるね。"
text.0c66: "ビヨモンが町の仲間になった！"
text.0cc4: "つかまえてごらん！"
text.0cfa: "勇気あるね！"
text.0d2a: "わあっ！"
text.0d48: "一番乗り！"
text.0d72: "オレは強いぞ。\nおまえにはムリだ！"
text.0dc8: "負けても怒るなよ。"
