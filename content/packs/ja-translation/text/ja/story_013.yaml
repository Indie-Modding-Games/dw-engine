text.0084: "ねえ、町を作ってるのは\nきみかい？"
text.00d6: "そうだよ。"
text.00ea: "いやあ、ボクに会えるなんて\nついてるね。"
text.0132: "見かけによらず、ボクは\nアルティメットのデジモン。\nボクに勝ったら手を貸すよ。"
text.01d6: "よし、受けて立つ\nやめておく"
text.0258: "わあ、負けちゃった！じゃあ、\n町で会おうね。"
text.02f0: "ピクシモンが町の仲間になった！"
text.033a: "なんだ、いくじなし！\nまた会おうね！"
text.03c0: "おお、セニョリータ！"
text.03f0: "やあアミーゴ、元気かい？"
text.0430: "ウキー、ウキー！"
text.0460: "え？"
