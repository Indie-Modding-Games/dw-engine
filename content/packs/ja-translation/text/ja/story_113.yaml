text.0094: "まっすぐ行って\n右だよ。ヘヘヘ…"
text.0108: "右に行って\nすぐ左。ヘヘ…"
text.016c: "この森からは\n出られないよ。ヘヘヘ…"
text.01dc: "迷っちゃった！"
text.0208: "最近、疲れてるんだ。"
text.024e: "きみが？まさか！？"
text.027e: "足もとに気をつけな。"
text.02cc: "おい、きみ！"
text.0318: "ほう、なかなかやるな！\n朝っぱらから\nたいしたもんだ。"
text.03c2: "おいおい、ひとごとみたいな\n顔するなよ！"
text.0438: "わかってる！なんの話か\nわかってるって。"
text.0490: "デジモンを集めて\n島のためにがんばってる\nらしいな。"
text.0520: "知ってるなら話は早い。\n手伝ってくれよ。"
text.057a: "で、どこでなにを\nしろって？"
text.05d2: "わかってないなあ！\n町で働くんだよ、\n決まってるだろ！？"
text.066c: "ほら、よく言うだろ…\n早起きは虫をつかまえる、って。"
text.06e2: "なんの関係もないだろ！\nそれに、虫じゃなくて\nミミズだよ！"
text.078a: "冗談だよ。じゃあ、\n町で会おう…"
text.0830: "コカトリモンが町に加わった！"
text.0876: "本当に信用していいのかな？\nどうだろう…"
text.08de: "あれ、鳥の羽が落ちてる。\nまだ新しいな。\n遅かったかな？"
