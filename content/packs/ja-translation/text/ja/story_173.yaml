text.0030: "できるだけ休ませること。\nそれがデジモンの\n健康のひけつじゃ。"
text.00ca: "よし。町がどうやって\n大きく栄えていくか\n教えてやろう…"
text.014c: "ルーキーデジモンが\n町に来ると、\n1ポイント増えるんじゃ。"
text.01cc: "チャンピオンデジモンが\n町に来ると、\n2ポイント増える。"
text.025a: "アルティメットデジモンが\n町に来ると、\n3ポイント増えるぞ。"
text.02da: "じゃが、あまり役に立たん\nチャンピオンデジモンが\n3体おる。"
text.0366: "そやつらが来ても、\n1ポイントしか増えんのじゃ。"
text.03de: "タイプについて、\n少し教えてやろう。"
text.0436: "相手がパートナーと\n同じタイプだと、\n戦わないことがある。"
text.04d2: "それに、タイプが合わんと\n扉の前で\n追い返されることもある。"
text.056c: "それ以外は、\nあまり気にせんで\nよいじゃろう。"
text.05f2: "テイマーレベルについて\n教えてやろう。"
text.063c: "デジモンをアルティメットまで\n育てられれば、\nテイマーレベルが上がる。"
text.06d0: "それに、上のクラスの大会で\n優勝するのも\nとてもよいぞ。"
text.075c: "自然に上がっていくから、\nあまり気にせんで\nよいぞ。"
text.07e8: "そのかわり、\n下がらんように\n気をつけねばならん。"
text.0874: "デジモンが消えてしまうと、\nテイマーレベルは\nかならず下がる。"
text.0900: "お世話のミスが多いと、\n下がるかもしれん。\n気をつけるんじゃぞ。"
