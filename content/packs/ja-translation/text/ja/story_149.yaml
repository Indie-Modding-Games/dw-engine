text.009a: "見張りがいない！"
text.00f8: "ここは通れないぞ。"
text.0136: "ここは通れないぞ。"
text.01dc: "……"
text.01f0: "わっ、こっちを見てる！\nあやしまれてる\nのかも。"
text.0266: "かくれて待って、あとで\nまた来たほうがいいね。\n12時になったらね。"
text.030e: "この工場は廃液を下水に\n流しているにちがいない。\nたしかめなくちゃ。"
text.03d4: "通してもらえますか？"
text.0412: "責任者が出した許可証が\nないと、ここは\n通れないぞ。"
text.04a8: "急いでるんだけど。"
text.04ce: "悪いが、許可証が\n必要なんだ。"
text.051c: "わかったよ、そういうことなら\nしかたない。"
text.0580: "で、どうしよう？"
text.05b4: "交代の時間だよ\n通さないとひどいぞ\nなんでもない"
text.0636: "まだ交代の\n時間じゃないぞ。"
text.0694: "いいから、気にしないで。\n交代はいつ？"
text.0704: "いや、時間はきっちり\n守らないといけない。"
text.075e: "交代は\n夜の12時と昼の12時だ。"
text.07bc: "そうなんだ。"
text.07e2: "おどしてもムダだ。\n許可証をもらってこい。"
text.084a: "許可証？持ってるよ。\n許可してあげる！"
text.08bc: "許可証は出せない。\nちゃんとした手続きを\nふまないとな。"
text.0944: "うわ、かたいなあ！"
text.097c: "まだ交代じゃないの？"
text.09b8: "…"
text.09c6: "わっ、こっちを見てる！\n交代はしてくれそうに\nないな。"
text.0a42: "あとでまた来よう。\nかくれて待ったほうが\nいいかも。"
text.0aca: "ボピボピプーーー。"
text.0b02: "ゲバゲバ！"
text.0b2c: "ブビョ？"
text.0b50: "満足だ！"
text.0b82: "これも仕事のうちだ。"
text.0bc6: "どうした？"
