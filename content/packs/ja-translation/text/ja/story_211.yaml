text.0020: "おかえりなさい、{color:6}{tamer}{color:1}。"
text.004c: "わたしはジジモンの記録係です。"
text.008a: "ジジモンの情報を記録して、\nお伝えしています。"
text.00e8: "何をすればいいか迷ったら、\nわたしに聞いてください。\n行き先を教えますよ。"
text.0184: "デジモンがみんな\n町に集まりました。\n本当にありがとう！"
text.0208: "知っていることを話しますね。\nええと…"
text.0266: "それから…"
text.0288: "あとは…"
text.0300: "植物のデジモンは森にいます。\n近づくほど\n見えにくくなります。"
text.03e6: "昆虫のデジモンは緑が\n好きです。町のまわりの\nような…"
text.04a6: "熱帯ジャングルには\n迷路のような森があります。\n強いデジモンが守っています。"
text.0578: "川にいる古株さんが\nだれかを待っています。"
text.0616: "あたたかい水辺が大好きな\nデジモンがいます。"
text.06b0: "墓地にはおばけがいます。\nおばけはおしゃべりが大好き。"
text.0752: "町の花だんに秘密が\nあります。植物のことは\n植物に聞いてみて。"
text.0828: "古代恐竜地帯は危険ですが、\n調べてみる価値は\nありますよ。"
text.08ec: "パノラマ山の中には溶岩が\n流れています。暑いのが\n好きなデジモンもいます。"
text.09a4: "暑い場所が好きなデジモンを\n寒い場所に連れていくのは\nルール違反ですが…"
text.0a88: "フリーズランドには、ついて\nきてくれるデジモンが多いです。\n西へ行ってみて。"
text.0b58: "大渓谷の頂上に、\n鳥のデジモンが住んでいます。"
text.0bf8: "大渓谷は迷路のようです。\n一度入ると、\nなかなか出られません。"
text.0cb0: "ギアサバンナには、\n電気が大好きな\nデジモンがいます。"
text.0d60: "霧の森には、早起きの\nデジモンが現れるかも。"
text.0e02: "大渓谷には、\nデジモンがやっている\nお店があります。"
text.0ea6: "ひと羽ばたきでパノラマ山を\n越えるつばさを持った\nデジモンに会えるかも。"
text.0f84: "ギアサバンナは、高く飛べない\nデジモンにぴったりです。\nそこを探してみて。"
text.104e: "きみを知っていて、勝負を\nいどんでくるデジモンもいます。"
text.10ee: "フリーズランドには、ほら穴に\n住んで、ほかの者を招く\nデジモンがいます。"
text.11be: "働き者のデジモンには、\n仕事が終わってから\n町に来てもらいましょう。"
text.12a2: "霧の森はかくれるのに\nぴったり。かくれている\nデジモンを導くのも仕事です。"
text.137c: "きみのうわさが広まったら、\nもどってくるといいですよ。"
text.141e: "フリーズランドの海岸に\n大きな影が現れます。\nデジモンかもしれません。"
text.14f6: "物を集めるのが好きな\nデジモンを助けてあげて。\nフリーズランドへ行ってみて。"
text.15b6: "パノラマ山の頂上には、\n目が合うと勝負をいどんでくる\nデジモンがいます。"
text.1694: "下水道のようなじめじめした\n場所にもデジモンがいます。\n困りごとを助けてあげて。"
text.176c: "竜眼湖の向こうには、\n昆虫のデジモンが住んでいます。\nそこで釣りをしてみて。"
text.1832: "機械のデジモンは、こわれても\nすぐに自分で完全に\n修理できます。"
text.18fa: "危険をおそれていると、\n目的を見失いますよ。"
text.1966: "危ないがけでも、一度は\n登ってみる勇気が\n必要です。"
text.1a36: "町で聞く、困っている人の\n話には、なんでも\n耳をかたむけてください。"
text.1afc: "最近、人の多い場所に\nいじわるなやつが引っ越して\nきました。もしかして…"
text.1be0: "古い石板が埋まっている\nらしいですが、だれかが\n掘り出さないと。"
text.1ca8: "めずらしいデジモンが\nジャングルに現れて、\n勝負をいどんできます。"
text.1d68: "木に住んでいるデジモンも\nいるかもしれませんね。"
text.1e16: "西の鉄の町に、めずらしい\nデジモンが現れて、\n勝負をいどんでくるかも。"
text.1efa: "宇宙人のデジモンがいます。\nいつか会えるかもしれません。"
text.1f9e: "幻獣のデジモンがいます。\n持ち主がいなくなった\n家にいます。"
text.2076: "本物のお宝を手に入れるまで、\nナニモンを探しつづけて\nください。"
text.2136: "マイオティスモンが行方不明。\n館に残された\n手がかりを追ってください。"
text.21f0: "まだ知らないデジモンも\nいますが、まずは大事な\n仕事を先に終わらせて！"
text.22c4: "最後のデジモンは、最後に\n行く場所で生まれます。\nわかりますか？"
