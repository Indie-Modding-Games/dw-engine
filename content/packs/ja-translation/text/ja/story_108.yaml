text.0ade: "ふつう\nボーナストライ\nやめる"
text.0b1c: "コースを走ろう。\n素早さと最大HPが\n大きく上がります。"
text.0b88: "もう一度説明\nはじめる\nやめる"
text.0be2: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}を押して\n絵を3つそろえよう。"
text.0c72: "{color:5}トレーニング：\n{color:6}{tamer}{color:1}の{color:5}教室・\n改良版 {color:1}"
text.0ccc: "{color:5}トレーニング：\n{color:6}{tamer}{color:1}の{color:5}教室 {color:1}"
text.0d0c: "はじめる\n説明\nやめる"
text.0d44: "ふつう\nボーナストライ\nやめる"
text.0d82: "{color:6}{tamer}{color:1}がいろいろ\n教えてくれます。\n賢さと最大MPが上がります。"
text.0df2: "もう一度説明\nはじめる\nやめる"
text.0e4c: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}を押して\n絵を3つそろえよう。"
text.0ece: "ねえ、新しい情報だよ。"
text.0efe: "フレッシュや見習いの\nデジモンは、同じトレーニングを\nくり返してみて。"
text.0f88: "きっといいことがあるよ。"
text.0fd4: "新しい情報だよ。"
text.0ffa: "ボーナストライで同じ絵が\nそろえば、能力が\nぐんと上がるよ。"
text.10b0: "あ、技の話を\nするんだった。"
text.110e: "敵が使った技は\nバトルに勝つと\n習得できることがあるよ。"
text.1198: "でも、覚えられる技は\nその時点で追加できる\nものに限られるんだ。"
text.1226: "全部は覚えられないよ。\nでも、技を覚えるには\nバトルがいちばん早いんだ。"
text.12d0: "トレーニングでも覚えられる\nけど、確率は低いよ。"
text.134e: "賢くなったら、{color:6}{tamer}{color:1}の\n教室を受けてみて。\n技を覚えられるかもしれないよ。"
text.13e6: "覚えられる確率は低いから\nあまり期待しないでね。\nバランスよく鍛えよう！"
text.148c: "やあ、ぼくはコロモン。\nジジにトレーニングのことを\n教えるように言われたんだ。"
text.1506: "なにか聞きたいことある？"
text.153c: "トレーニングって？\nやり方を教えて\nなんでもない"
text.15b2: "ここでトレーニングすると\nデジモンの能力を\n上げられるよ。"
text.162c: "トレーニングは疲れるけど\n実際のバトルより\n得るものが多いんだ。"
text.16c8: "それに、ごくまれに\n新しい技を覚えることもあるよ。"
text.173a: "技のことは\nまた今度くわしく話すね。"
text.17a0: "ここにはトレーニング場が\n6つあって、それぞれの\nそばに看板があるよ。"
text.182a: "看板の前で{color:6}△ {color:1}を\n押してみて。"
text.187c: "看板を読めば、どの能力を\n上げられるか\nわかるよ。"
text.18fe: "デジモンの得意分野によって\nよく上がる能力と\nそうでない能力があるんだ。"
text.19aa: "でも、実際にやってみないと\nわからないけどね。"
text.1a0a: "「はじめる」のあと\n「ふつう」を選ぶと\n1時間トレーニングするよ。"
text.1a7a: "トレーニング中は\n{color:5}× {color:1}で\n時間を早送りできるよ。"
text.1ae6: "そうそう、「ボーナストライ」の\nことも話さないとね。"
text.1b48: "ボーナストライは成功すると\n能力がぐんと上がるけど\n失敗すると少ししか上がらない。"
text.1be4: "一度やってみればわかるよ。"
text.1c24: "じゃあ、また新しい情報を\n仕入れてくるね。"
text.1d7c: "町に行ってみたけど、\n都会すぎて合わなくて\nここに来たんだ。"
text.1e10: "器具を改良したんだ。\n性能アップ！がんばってね！"
text.1e86: "町に行ってみたけど、\n都会すぎて合わなくて\nここに来たんだ。"
text.1f1a: "器具を改良したんだ。\n性能アップ！がんばってね！"
