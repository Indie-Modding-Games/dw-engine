text.04a2: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}を押して\n絵を3つそろえよう。"
text.0532: "{color:5}トレーニング：\n木打ち・改良版 {color:1}"
text.0582: "{color:5}トレーニング：木打ち {color:1}"
text.05bc: "はじめる\n説明\nやめる"
text.05f4: "ふつう\nボーナストライ\nやめる"
text.0632: "木を打って練習しよう。\n攻撃力と素早さが\n大きく上がります。"
text.06c2: "もう一度説明\nはじめる\nやめる"
text.071c: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}を押して\n絵を3つそろえよう。"
text.07aa: "{color:5}トレーニング：パンチグローブ\n改良版 {color:1}"
text.0800: "{color:5}トレーニング：パンチグローブ {color:1}"
text.083c: "はじめる\n説明\nやめる"
text.0874: "ふつう\nボーナストライ\nやめる"
text.08b2: "パンチマシンで力をつけよう。\n防御力と賢さが\n上がります。"
text.0946: "もう一度説明\nはじめる\nやめる"
text.09a0: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}を押して\n絵を3つそろえよう。"
text.0a30: "{color:5}トレーニング：\nランニング・改良版 {color:1}"
