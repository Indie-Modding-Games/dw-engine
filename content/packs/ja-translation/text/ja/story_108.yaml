text.0322: "{color:5}トレーニング：滝 {color:1}"
text.0354: "はじめる\n説明\nやめる"
text.038c: "ふつう\nボーナストライ\nやめる"
text.03ca: "滝に打たれよう。\n最大MPと防御力が\n上がります。"
