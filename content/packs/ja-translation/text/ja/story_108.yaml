text.004e: "{color:5}トレーニング：\n岩押し・改良版 {color:1}"
text.00a4: "{color:5}トレーニング：\n岩押し {color:1}"
text.00e0: "はじめる\n説明\nやめる"
text.0116: "ふつう\nボーナストライ\nやめる"
text.0152: "岩を押して力をつけよう。\n最大HPと攻撃力が\n上がります。"
text.01ec: "もう一度説明\nはじめる\nやめる"
text.0246: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}を押して\n絵を3つそろえよう。"
