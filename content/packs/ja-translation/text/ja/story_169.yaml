text.0072: "よく来たね、{color:6}{tamer}{color:1}！"
text.009a: "おれたちはトレジャーハンター。\n得意の穴掘りで\n地下のお宝を見つけるんだ。"
text.013e: "お宝さがしはまかせてくれ。"
text.0196: "何かさがしてほしいかい？\nそれとも、やり方を\n説明しようか？"
text.0230: "説明を聞く\n説明はいい\nやっぱりいい"
text.0286: "日数と料金がちがう\n2つのプランがあるんだ。"
text.02ee: "ふつう：3日・1000ビット\nスペシャル：10日・5000ビット"
text.036a: "スペシャルコースのほうが、\nいいお宝が見つかる\n確率が高いよ。"
text.03f6: "説明はこんなところだ。\nどうする？"
text.044e: "お宝をさがす\nもう一度説明\nやっぱりいい"
text.04b0: "プランを選んで！"
text.04d4: "ふつう：3日・1000ビット\nスペシャル：10日・5000ビット\nキャンセル"
text.056e: "そうか、じゃあね。"
text.05c4: "3日後に結果を\n知らせるよ。幸運を祈ってて。"
text.066a: "10日後に結果を\n知らせるよ。幸運を祈ってて。"
text.06ea: "ビットが足りないよ。\nお宝さがしには\nお金がいるんだ。"
text.07a4: "今、お宝をさがしてる\nところだ。待っててくれ。"
text.082a: "聞いてくれ！\nお宝が見つかったぞ。"
text.0b00: "荷物を空けてきて！"
text.0b32: "{color:6}{item:pstat=110}{color:1}を手に入れた！"
text.0dae: "来てくれてありがとう！"
text.0de8: "いつもありがとう、\n{color:6}{tamer}{color:1}さん！"
text.0e2a: "ドリモゲモンの手伝いを\nはじめたばかりなんだ。\nさがし物は大得意だよ。"
