text.00b2: "なんだ！？"
text.00e2: "あっ、おかえり、ハグルモン！"
text.0122: "ハグルモン！？"
text.0168: "どうなってるの！？"
text.01d8: "{color:7}おもちゃたち {color:1}\nむかしむかしのお話。\n悪いやつが遠くから\nこの島にやってきた。"
text.0280: "{color:7}おもちゃたち {color:1}\n悪いやつはデジモンに言った。\n「この島はおれたちのものだ」"
text.030a: "{color:7}おもちゃたち {color:1}\nデジモンたちは言った。\n「ちがうよ。この島は\nみんなのものだ」"
text.03b8: "{color:7}おもちゃたち {color:1}\nデジモンが力を合わせて\n立ち向かったので\n悪いやつはこりごりした。"
text.0494: "{color:7}おもちゃたち {color:1}\nでも悪いやつは言った。\n「おぼえてろ」\n…そして消えていった。"
text.0554: "{color:7}おもちゃたち {color:1}\nむかしむかしのお話。"
text.05b0: "うーん、楽しくなるなあ…\nあ、待って。"
text.05fc: "あの歌のお話って\nこの島の\n昔話だよね？"
text.0684: "デジモンが\n悪いやつをやっつけた話…"
text.06e0: "うーん、お話に出てくる\n悪いやつってだれだろう？"
text.0750: "助けてくれてありがとう。\nこれはお礼だよ。"
text.07cc: "モンザエモンのぬいぐるみが\n町の仲間になった！"
text.0850: "あれ、ワルモンザエモンが\nなにか落とさなかった？"
text.08be: "がんばって！\nとなりの家だよ！"
text.092a: "……"
text.09cc: "あっ、モンザエモン！\n生きてたんだね！"
text.0a16: "わあ、なに？"
text.0a3e: "ワルモンザエモンをやっつけて！\nみんな、早く\n動いて！早く早く！"
text.0ace: "待って！このモンザエモンは\nみんなの知ってるのとちがうよ。"
text.0b38: "え？どういうこと？でも\nモンザエモンなんでしょ？"
text.0bb2: "うん、モンザエモンなのは\nたしかだけど。"
text.0c0a: "ワルモンザエモンという悪者が\nぼくの友だちをさらったんだ。"
text.0c7a: "あいつをたおせるのは\nモンザエモンだけだと思う！"
text.0cec: "うーん、じゃあその悪いやつを\nさがさないと。どこにいるの？"
text.0d5a: "となりの家だよ。ドアの\n封印をといてあげる。"
text.0dc2: "だから、行って\nなんとかしてみて。"
text.0e14: "わかった。よし、\n手伝うよ！"
text.0e60: "ありがとう！"
text.0e88: "ありがとう！"
text.0eb0: "ありがとう！"
