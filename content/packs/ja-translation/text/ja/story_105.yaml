text.00ae: "なんの用だ！？"
text.00e8: "うわっ！"
text.0104: "…？ …！"
text.011e: "なに？今か！？\nよし、勝負だ！"
text.0196: "負けた。くそっ！"
text.01bc: "町にさそって\nみようかな。"
text.0206: "あの、すみません。"
text.022c: "よかったら…\n町に来てくれない…？"
text.027e: "なに？町だと！？"
text.029c: "あの…古ぼけた場所のことか？"
text.02dc: "うーん…"
text.02f0: "えーと……"
text.0306: "うーん………"
text.0332: "まあ、いいだろう。\nオレはアグモン。\nよろしくな。"
text.03c6: "アグモンが町の仲間になった！"
text.0408: "よし、言ってみるもんだね。\nこれからもさそい続けよう！"
text.0478: "ここはオレのなわばりだ！"
text.04b8: "なにっ！？"
text.04da: "今がチャンスだ！"
text.0810: "こいつからは\nどうしても逃げられない！"
