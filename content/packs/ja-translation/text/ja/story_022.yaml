text.00c2: "つばさが痛い。"
text.00ee: "どうしたの？"
text.0112: "つばさをケガしてしまって…\n手当てできるものはないか？"
text.018e: "わあ、ひどいケガだ！\n待って。見せてごらん。"
text.0208: "今はなにも\n持ってないんだ。"
text.0294: "これじゃだめだ。"
text.02bc: "だいぶ楽になった。感謝する。"
text.030a: "もう飛べる？"
text.0332: "遠くまでは飛べそうにない。"
text.037a: "町に診療所があるよ。\n行ってみるといいよ。\n遠くないから。"
text.0402: "町のうわさは聞いている。\n思ったより大きいようだ。"
text.0470: "町に行って休みなよ。"
text.04a8: "ありがとう。いつか\n力になれるかもしれない。"
text.053c: "ユニモンが町の仲間になった！"
text.057c: "ケガを手当てできるものを\n持ってないんだ。\nなにか探してくるね。"
text.0608: "すまない、急いでくれ。"
text.068c: "地面にへんな絵が\nかいてある。"
text.06f0: "これってうわさの\nミステリーサークル？\nまだ新しいみたい。"
text.0774: "前より増えてる！\nもしかしてUFOと\n関係があるのかな…？"
text.080a: "ええっ！？前よりも\nたくさんある！"
text.0862: "これはどういうことだろう？"
text.0896: "えっ？"
text.08f8: "ベイドモンのUFOが現れた。"
text.092c: "う、宇宙人！？"
text.0950: "…"
text.095e: "きみは…デジモンなの？"
text.0990: "…"
text.099e: "えっと…"
text.09b4: "…"
text.09ca: "ベイドモンは銃をかまえた。"
text.09fa: "やめて、うたないで！\nぼくは敵じゃないよ！"
text.0a3c: "ベイドモンは銃を下ろした。"
text.0a70: "わかってくれてよかった。"
text.0aa0: "{color:6}{tamer}{color:1}は必死に\n説得した。"
text.0af4: "…"
text.0b02: "わかってないのかな？"
text.0b3a: "わかった。"
text.0b8a: "ベイドモンが町の仲間になった！"
text.0bc0: "しゃ…"
text.0bd0: "しゃべった！"
