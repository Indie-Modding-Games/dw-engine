text.0022: "{color:7}ポヨモン {color:1}\nポヨ。ぼくはポヨモンだよ。"
text.0084: "{color:7}ポヨモン {color:1}\n進化のお話をするね。\nえっとね…チャンピオンの\n次の段階のお話だよ。"
text.014e: "{color:7}ポヨモン {color:1}\nアルティメットっていうの。\nでもチャンピオンがいつも\n進化できるとはかぎらないよ。"
text.0214: "{color:7}ポヨモン {color:1}\n進化の条件はきびしいけど、\nアルティメットになれたら\n寿命がのびるんだ。"
text.02d8: "{color:7}ポヨモン {color:1}\n進化アイテムを使うと、\n寿命はのびないよ。"
text.0370: "{color:7}ポヨモン {color:1}\n進化のお話をするね。\nえっとね…進化の\n条件のお話だよ。"
text.0428: "{color:7}ポヨモン {color:1}\nまず、体重が次の段階の\n体重に近くないとダメ。"
text.04b6: "{color:7}ポヨモン {color:1}\n次に、能力は高いほうが\nいいけど、それぞれで\n効き目がちがうの。"
text.0566: "{color:7}ポヨモン {color:1}\nそれとお世話ミス。なりたい\nデジモンによっては、ミスが\nいいこともあるんだよ。"
text.062e: "{color:7}ポヨモン {color:1}\nそうそう、決まったデジモンに\nなるための、とくべつな\n条件もあるよ。"
text.06d6: "{color:7}ポヨモン {color:1}\nしつけがすごく高いとか、\nバトルの回数が多いとかね。"
text.0756: "{color:7}ポヨモン {color:1}\nそうすれば、3つの基本の\n条件が全部そろってなくても\n進化できるんだ。"
text.082a: "{color:7}ポヨモン {color:1}\nジジがね、{color:10}{partner}{color:1}は\nもうすぐ進化するって。"
text.089c: "{color:7}ポヨモン {color:1}\nフレッシュから見習いまでは\n6時間かかるよ。"
text.0920: "{color:7}ポヨモン {color:1}\nルーキーになるまでは\nたった1日なんだ。"
text.09ac: "{color:7}ポヨモン {color:1}\nチャンピオンになるまでは\n3日くらいかかるよ。"
text.0a2c: "{color:7}ポヨモン {color:1}\nその次は？わすれちゃったけど\nもっと長くかかるよ。"
text.0ab4: "{color:7}ポヨモン {color:1}\n体重、能力、お世話ミスが\n進化に関係してるんだ。"
text.0b42: "{color:7}ポヨモン {color:1}\nくわしいことはわからないから\n今度ジジに聞いてみるね。"
