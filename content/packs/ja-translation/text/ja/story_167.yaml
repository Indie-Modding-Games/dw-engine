text.0038: "おや、{color:6}{tamer}{color:1}と{color:10}{partner}{color:1}、\n来てたんだね。"
text.0078: "おれは配達屋さ。\nなんでも届けるよ。"
text.00cc: "きみたちが運べるのは\n自分の体だけだろ？"
text.0132: "おれがきみたちを運ぶってのは\nどうだい？いい考えだろ？"
text.0190: "いつでも、どこへでも\nつれて行ってあげるよ。\nもちろん料金はもらうけどね。"
text.0222: "やあ、{color:6}{tamer}{color:1}。"
text.023c: "ときどきギアサバンナに\nもどって見回りしてるんだ。"
text.029e: "ギアサバンナの浜辺に\n店があるらしいよ。\nもう見たかい？"
