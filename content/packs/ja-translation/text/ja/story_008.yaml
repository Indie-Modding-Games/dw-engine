text.004e: "ドリルトンネル"
text.0084: "ふつう\nオーガモード"
text.00ec: "あいつめ！なんて失礼なんだ！"
text.012e: "え？"
text.015a: "{color:7}市場の管理人 {color:1}\n通るのにお金がいるなんて\n知らなかったよ！"
text.01f6: "{color:7}市場の管理人 {color:1}\nあれ、きみは…そうだ！\nなんとかしてくれ！"
text.026c: "中のドリモゲモンたちは\nどうしてるの？"
text.02b0: "{color:7}市場の管理人 {color:1}\nわからないよ。"
text.02f6: "無事だといいけど。\nよし、行くぞ！"
text.0362: "{color:7}市場の管理人 {color:1}\n早くなんとかしてくれ！"
text.03f8: "トンネルにはもうなにも\nないみたい…\n通りぬけちゃう？"
text.047e: "通りぬけよう！\nやめておこう"
