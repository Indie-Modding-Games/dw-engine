text.0054: "ふざけるのもいいかげんにしろ！"
text.0084: "わかったよ。もう\nしないと思う。"
text.00e2: "ここが\n最後の部屋みたいだ。"
text.0156: "{color:7}??? {color:1}\nどっちだ？"
text.0198: "あの声は…\nワルモンザエモンだ！"
text.01ec: "大きい箱か、小さい箱か。\nおまえの心は読めるぞ！"
text.0250: "大きい箱\n小さい箱"
text.0304: "え？うわあああ！"
text.04a2: "ははは、まぬけめ！\nはずれだ！"
text.052c: "おおっと、見つかったか！\nヘヘヘ。あせってる？"
text.059a: "くそっ、なにがおかしい！"
text.05ce: "おいおい、興奮するなよ。\n今日はなんの用だ？\nオレの手下になりたいのか？"
text.0674: "さらっていった友だちを\n返して！"
text.06c6: "友だち？なんの話だ。\nオレがそんなことを\nするように見えるか？"
text.0768: "見える！"
text.077a: "おお、また正解だ！\nそう、オレがやったのさ！"
text.07ec: "でも返すわけにはいかないな。\nなぜなら、オレは\nワルモンザエモンだからな。"
text.0878: "そっちがその気なら\n力ずくで取り返す！"
text.08d2: "冗談だろ？\nおまえがオレをたおすって？"
text.0930: "いいか？\n目を覚まして\n現実を見るんだな！"
text.09e0: "ねえ、さらった友だちを\n返してよ。"
text.0a4a: "うぐぐ…そんなバカな！\n信じられない、\nオレが負けるなんて…"
text.0ae2: "さあ！"
text.0afa: "まあ…しかたない。\nほらよ。"
text.0bd8: "え？うわあ…おい！"
text.0d54: "ちょっと、ふざけないで！\nもういいでしょ！"
text.0dae: "おいおい、冗談が通じないな。\nほら。こいつだよ。"
text.0e2c: "これはなに？\nこれ、歯車だよ。"
text.0e6e: "ああ、そのとおり。"
text.0ea4: "これが友だち？？？"
text.0ed6: "いや、ほかにはなにも\nとってないぞ。本当だ。"
text.0f32: "とりあえず、これは\n返してもらうね。"
text.0f94: "きみ！もう悪いことは\nしないでよね！？"
text.0ff8: "わかったよ。たぶん\nもうしないさ。"
text.105c: "なんだか信用できないけど\nやらなきゃいけないことが\nたくさんあるし。"
text.1104: "しまった、アイテムが\nいっぱいだ。どれか\n捨てないと。"
text.1182: "{color:6}歯車{color:1}を手に入れた！"
text.11ba: "え？だれ？"
text.11e6: "だれだと？そっちこそだれだ！？"
text.1292: "{color:4}次元キーホルダー{color:1}を\n手に入れた！アイテムを\n20個まで持てるようになった！"
text.1354: "{color:4}次元キーホルダー{color:1}を\n手に入れた！アイテムを\n20個まで持てるようになった！"
