text.0040: "あっ！"
text.0058: "島はどうなってしまったんだ？"
text.0092: "種族はバラバラになり、記憶を\nなくして凶暴になった。"
text.0100: "オレもいつまで正気で\nいられるかわからん。"
text.0152: "このままにはしておけない！\nみんなに危険を気づかせねば！"
text.021c: "やめて！この島を\nめちゃくちゃにする気！？"
text.0278: "なにものだ？そこをどけ！\nこれしか方法はないんだ！"
text.031c: "ほかに方法があると\nいうのか？"
text.037a: "島がだめになったら、\n元も子もないよ！\n話を聞いて。"
text.03fe: "なに？"
text.0418: "ぼくたちは島のために、\nデジモンを集めて\n町を作ってるんだ。"
text.049a: "デジモンがひとつになれば、\nこの危機から島を救えるって\n聞いたんだ。"
text.0532: "たしかにそうだろうが、\nデジモンをすべて集めるなど、\nとんでもない…"
text.05cc: "今まさにやってるところ\nなんだ。不可能はないよ！"
text.063e: "なんとでかい仕事だ！\nだが、胸が熱くなった…\nおまえたちならやれるかもな。"
text.06c8: "ぼくたちを信じてくれるなら、\n町に来てほしいんだ。"
text.073e: "わかった。町へ行こう。\nそれがオレの新しい道だ！"
text.07f0: "メラモンが町の仲間になった！"
text.084a: "もどってくると思っていた。\n答えを聞かせてくれ！"
text.08f0: "オレの負けか…"
text.091c: "おまえに伝えたい\nことがある。"
