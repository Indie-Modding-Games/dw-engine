text.0034: "{color:5}トレーニング：氷押し {color:1}"
text.0068: "はじめる\n説明\nやめる"
text.009e: "ふつう\nボーナス\nやめる"
text.00da: "氷を押して力をきたえます。"
text.011c: "最大HPが大きく上がり、\n防御力も上がります。"
text.0198: "もう一度説明\nはじめる\nやめる"
text.01f2: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}ボタンで\n絵を3つそろえよう。"
text.0274: "{color:5}トレーニング：つらら落とし {color:1}"
text.02aa: "はじめる\n説明\nやめる"
text.02e2: "ふつう\nボーナス\nやめる"
text.0320: "大きなつららを\n受け止めるトレーニングです。"
text.0364: "防御力が大きく\n上がります。\n素早さも上がります。"
text.03e4: "もう一度説明\nはじめる\nやめる"
text.043e: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}ボタンで\n絵を3つそろえよう"
