text.0022: "{color:10}{partner}{color:1}は\n消えてしまったようだ…"
text.0064: "消える前にデジエッグを\n残していった。能力を受けつぎ\n生まれ変わるだろう。"
text.0116: "どのタマゴにする？"
text.0158: "{color:10}{partner}{color:1}の名前を\n変えることもできます。"
text.01b0: "新しい名前にする\n今の名前のままにする"
text.0214: "{color:10}{partner}{color:1}でいいですか？"
text.0234: "別の名前にする\nこれでいい"
text.02a0: "病気にならないようにね！"
text.02ce: "わずかに残った命で\n{color:10}{partner}{color:1}は\nなんとか助かった。"
text.0346: "気をつけなきゃダメだよ。"
text.0384: "なんてこと！\n負けて帰ってきたのね。"
text.03d4: "わずかに残った命で\n{color:10}{partner}{color:1}は\nなんとか助かった。"
text.044c: "持ち物を盗まれたかもしれない。"
text.048e: "バトルに負けると\n持ち物を盗まれることがある。"
text.0502: "盗まれた物はどこかで\n売られているかも。\nあきらめずに探そう！"
text.059e: "ああっ！{color:10}{partner}{color:1}の\n命がつきてしまった。"
text.05de: "消える前に、\n{color:10}{partner}{color:1}は\nデジエッグを残した。"
text.0646: "危険だったので、デジエッグは\n能力をすべては\n受けつげなかった…"
text.06d8: "{color:4}テイマーレベルが\n下がった！ {color:1}"
text.0726: "よければ\n{color:10}{partner}{color:1}の名前を\n変えられます。"
text.0780: "新しい名前にする\n今の名前のままにする"
text.0872: "{color:10}{partner}{color:1}が進化した！"
text.08be: "{color:10}{partner}{color:1}が進化した！"
text.090a: "{color:10}{partner}{color:1}が進化した！"
text.095c: "{color:10}{partner}{color:1}が進化した！"
