text.0020: "じゃまだったかしら？"
text.0056: "助かったわ！"
text.0078: "あなただったのね。"
text.009c: "ちょうどいいわ。"
text.00cc: "え？"
text.00e2: "あなたの町に行って\nわたしの才能を役立てようと\n思っていたところなの！"
text.0160: "どんな才能？"
text.0190: "あら、知らないの？\nわたしはデジモンの間で\nもの知りで有名なのよ！"
text.0224: "そうなの？\n聞いたことないけど。"
text.026c: "町へ行く準備はできてるわ。"
text.02b4: "本当に\n役に立つのかな？"
text.0302: "またね！"
text.0350: "シェルモンが町の仲間になった！"
