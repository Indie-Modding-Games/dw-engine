text.006c: "きみ、デジモン？"
text.00a6: "どこから来たんだよ、おい！？"
text.00e8: "バカにするな！"
text.0128: "ぱくっと食べちゃうぞ！"
text.01a4: "たいへん、なにもしないと\nかれちゃう…"
text.020a: "雨がふるといいな…"
text.023e: "わあ、おもしろい。\n芽が出てきた。"
text.0294: "ちょっと動いたぞ。\nこれがうわさの\nふしぎな植物かな？"
text.0340: "しおれてきた。なにか\nしないと、かれちゃう。"
text.03ac: "アイテムを使う？"
text.03de: "はい\nいいえ"
text.0410: "今はなにも持ってないや。"
text.045c: "役に立つものがないな。"
text.04ae: "これじゃだめだ…"
text.0800: "へへへ。"
text.0818: "よう、オレはベジーモンだ！"
text.084c: "なに！植物のデジモン？"
text.0880: "ところで、おまえ\n野菜は好きか？"
text.08d4: "なんで野菜のことを\n聞くの？で、どうなの？"
text.0932: "好き\nきらい"
text.0966: "やっぱり気が変わった。"
text.09a8: "野菜が好きなやつに\n悪いやつはいないからな。"
text.0a14: "ちがう、ちがう！\n野菜はいいものだぞ！"
text.0a52: " ？ ？ ？ "
text.0a68: "よし、決めた。\nおまえについていくぞ！"
text.0acc: "しつこいやつだなあ…\nおい、待てよ！"
text.0b1e: "じゃあ、行かないぞ！\nあばよ！"
text.0b60: "はっきりしてよ！"
text.0b8c: "オレにどうしてほしいんだ？"
text.0bd0: "町に来て、ぼくたちを\n手伝ってよ！"
text.0c36: "よし、いいだろう。\nここにはもう長くいすぎた。"
text.0cea: "ベジーモンが町の仲間になった！"
