text.0060: "だあっ！"
text.007e: "はあっ！"
text.009c: "ぐげえっ！"
text.00c6: "東：エレベーター\n西：危険・がけ"
text.0120: "オーガモード：ON\nオーガモード：OFF"
text.0196: "えっ？"
text.01fa: "地面が動いた気がする。\n気のせいかな？"
text.02c8: "なに？まさか！"
text.0344: "{color:6}{tamer}{color:1}うわあっ！！"
text.0370: "落石に注意！"
text.03d6: "この道は山賊がおそってくる\n場所だって聞いたよ。"
text.0438: "行こう、{color:10}{partner}{color:1}。"
text.0480: "ヒャッホー！"
text.049c: "ハハッ！"
text.04b0: "ヤッホー！"
text.050e: "観念して持ち物を置いていけ！\nさもないと！"
text.0562: "いや、観念するのはそっちだ！"
text.058a: "なに！？おまえは…？"
text.05ae: "そんなバカな。"
text.05ce: "ボス、どうしやす？"
text.0602: "心配するな、こっちのほうが\n強いし、数も多い。\nやっちまえ！"
text.06d2: "いつか仕返し\nしてやるからな！"
text.0724: "見てよ、あの逃げっぷり！\nしばらくはもどってこないね。"
