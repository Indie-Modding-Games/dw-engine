text.003a: "わあ、すごい！"
text.0092: "あれ、石板がある。\nどれどれ…"
text.0112: "レオモンって書いてある。\nほかは読めないな。"
text.016c: "話し言葉はわかるけど\n文字はちょっと…"
text.01cc: "持っていこう。"
text.0200: "おっと、なにか捨てないと\nいけないな。"
text.0262: "{color:6}レオモンの石{color:1}を\n手に入れた！"
text.02ba: "だれだ？"
text.02da: "だれだ！"
text.0370: "{color:4}次元キーホルダー{color:1}を\n手に入れた！アイテムを\n20個まで持てるようになった！"
text.0434: "{color:4}次元キーホルダー{color:1}を\n手に入れた！アイテムを\n30個まで持てるようになった！"
