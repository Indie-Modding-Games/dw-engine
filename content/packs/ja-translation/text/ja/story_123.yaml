text.0058: "おい！"
text.0076: "はあああ！"
text.0098: "うわっ！"
text.00bc: "東：エレベーター\n西：危険！！\nがけに注意。"
text.012e: "オーガモード：ON\nオーガモード：OFF"
text.018a: "落盤に注意！"
text.01f0: "ここは盗賊がおそってくる道\nだといううわさだ。"
text.025e: "よし、行こう、{color:10}{partner}{color:1}。"
text.02b6: "ヤッホー！"
text.02d2: "ははは！"
text.02ec: "ヒャッホー！"
text.034a: "あきらめて荷物を置いていけ！\nさもないと後悔するぞ！"
text.03c6: "あきらめろ！"
text.03e2: "なにっ！？おまえ…"
text.0404: "そんなバカな！"
text.0424: "親分、どうします？"
text.0458: "あわてるな！こっちのほうが\n強いし、数も多いんだ！\nやっちまえ！"
text.0530: "いつか仕返ししてやる！"
text.0570: "見ろ、逃げていく！しばらく\nもどってこないだろうね。"
