text.0032: "とうとう、その時が来た。"
text.005e: "ずっといたいけど、\nママが心配するから。"
text.00b6: "ありがとう{color:6}{tamer}{color:1}、\n恩返しができたらいいのに。"
text.010e: "{color:7}トコモン {color:1}\nボクたちを忘れないでね！"
text.014c: "また会えるよ。\nきっとね。"
text.01c0: "すごく楽しかった。ありがとう。"
text.01fa: "お別れの会を\n開かなきゃね。"
text.0258: "{color:10}{partner}{color:1}、\n最高の冒険だったね！"
