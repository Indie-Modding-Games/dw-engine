text.014c: "地面に変な絵が\nかいてあるよ。"
text.01a2: "ナゾの円かな？\nまだ新しいみたいだ。"
text.0238: "数が増えてる。\nUFOのしわざ\nなのかな？"
text.02d4: "うぐっ！？"
text.02f4: "もっとたくさん見える。"
text.032c: "ということは、つまり…"
text.036a: "何？"
text.03d0: "宇宙人！？"
text.03ec: "…"
text.03fa: "きみ、デジモン？"
text.0426: "…"
text.0434: "そうなの？"
text.044c: "…"
text.0472: "敵じゃないよ！"
text.04a8: "よし、わかってくれたね。"
text.04ea: "{color:6}{tamer}{color:1}は\n説得しようとした。"
text.0526: "…"
text.0534: "わかってないのかも。"
text.0588: "いいよ。"
text.05d4: "ベイドモンが町の仲間になった！"
text.060a: "え？"
text.0618: "しゃべれるんだ！"
