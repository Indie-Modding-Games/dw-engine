text.0034: "いらっしゃい！新しい商売\n「アイテム預かり所」だよ。\nアイテムを預かるんだ。"
text.00c0: "特別サービスで、アイテムを\nタダで預かってあげるよ。"
text.0144: "進化について…\nチャンピオンデジモンの\n次の世代のことだけど…"
text.01e4: "それがアルティメットデジモン。\nチャンピオンから必ず\n進化するわけじゃないんだ。"
text.0286: "進化するには、\n決まった条件を\nきっちり満たさないとだめ。"
text.030e: "でも、アルティメットに\n進化すると、\n寿命がのびるんだ。"
text.03a8: "でも、進化アイテムを\n食べて進化した場合は、\n寿命は変わらないよ。"
text.0464: "進化の話のつづきだよ。\n条件についてね。"
text.04c6: "まず、体重が目標の\n体重に近くないと\nだめらしいよ。"
text.0560: "それに能力は\n高いほどいいんだ。"
text.05b8: "でも、どの能力が\n高いかによって\n結果が変わるんだ。"
text.0644: "お世話のミスは、わざと\n失敗したほうがうまくいく\nこともあるんだって。"
text.06d8: "進化先によっては、\n満たさないといけない\n条件があるんだ。"
text.0768: "進化のきっかけになる\nできごともあるんだよ。"
text.07da: "たとえばバトルの回数や、\nしつけの具合とかね。"
text.0850: "その条件を満たせば、\nほかの条件が足りなくても\n進化できるんだ。"
text.08fc: "ジジから聞いたんだけど、\n{color:10}{partner}{color:1}が進化するって。"
text.0956: "フレッシュデジモンから\n見習いデジモンまでは\nたったの6時間。"
text.09e2: "そこからルーキー\nデジモンまでは、\nだいたい1日で進化する。"
text.0a68: "その次のチャンピオン\nデジモンまでは、\nだいたい3日で進化するよ。"
text.0b02: "その次の世代は\nなんだっけ？忘れちゃったけど、\nまだ先があるんだ。"
text.0b82: "進化には、体重と能力と\nお世話のミスが\n関係してるんだ。"
text.0c0a: "ぼくにはよくわからないや。\n今度ジジに\n聞いてみるよ。"
