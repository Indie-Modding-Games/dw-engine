text.0020: "ケガも治ったので、\n働こうと思います。お世話に\nなりました。"
text.00b6: "わたしはどんな生き物の\n未来でも占えます。それを\n仕事にしようと思います。"
text.013e: "よかったら、わたしの店に\n来てください。\nお代はいただきません。"
text.01d6: "運勢を知りたいのですか？\nわかりました、\n占ってみましょう。"
text.0268: "ふむふむ、おや…おお、これは！"
text.029a: "では、まずは…"
text.0320: "全体的に、\nとても運がいいですね。"
text.039e: "全体的に、なかなかいいですね。"
text.0424: "全体運はまあまあです。"
text.04a4: "全体運は\nあまりよくありません。"
text.0532: "全体的に、よくないですね。"
text.059c: "何をやっても\nうまくいくでしょう。"
text.05ea: "すばらしいチャンスが\nやってくるでしょう。"
text.0650: "思い出に残る出来事が\nあるかもしれません。"
text.069e: "思いがけない物を\n見つけるかもしれません。"
text.06f0: "疑問の答えが\n見つかるでしょう。"
text.073a: "おサイフがふくらむでしょう。"
text.077e: "友だちから、いい知らせが\nあるかもしれません。"
text.07de: "気分を変えてみると\nいいかもしれません。"
text.0838: "ふだん行かない場所に\n行ってみましょう。"
text.0896: "おもしろい夢を\n見るかもしれません。"
text.08ea: "お金を使いすぎないように\n気をつけましょう。"
text.0936: "秘密がバレるかもしれません。"
text.097a: "早めにねたほうがいいでしょう。"
text.09ba: "持ち物に気をつけましょう。"
text.09f2: "友だちに八つ当たり\nされるかもしれません。"
text.0a5c: "災難が次々と\nふりかかるかも…"
text.0ab8: "苦手な相手に\n出会うかもしれません。"
text.0b1c: "大きな損を\nするかもしれません…"
text.0b76: "ラッキーカラーは赤です。"
text.0bbe: "ラッキーカラーは白です。"
text.0c0a: "ラッキーカラーは青です。"
text.0c54: "ラッキーカラーは黒です。"
text.0ca0: "ラッキーカラーは緑です。"
text.0cec: "ラッキーカラーは灰色です。"
text.0d36: "ラッキーカラーは茶色です。"
text.0d82: "ラッキーカラーは黄色です。"
text.0dd0: "ラッキーカラーはむらさきです。"
text.0e1e: "ラッキーカラーは金色です。"
text.0e5c: "最後に、\n{color:10}{partner}{color:1}との\n相性は…"
text.0ece: "ぴったりの相性です。"
text.0f10: "なかなかいいですね。"
text.0f4a: "まあまあです。"
text.0f72: "ふつうですね。"
text.0fa0: "悪くはありません…"
