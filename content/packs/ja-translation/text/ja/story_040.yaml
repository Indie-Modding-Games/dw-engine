text.00b8: "誰だ？あっち行け！"
text.00f2: "ここがきみの家なの？"
text.012c: "教えられないね！"
text.0156: "きみは見張り番かなにか？"
text.0198: "やる気か？たたきのめすぞ！"
text.01da: "戦ってやる\nいじめないで"
text.025c: "うわあ！"
text.02c4: "そんな！おい！"
text.02e2: "{color:7}???モン {color:1}\nはっはっは。"
text.0310: "誰だ？"
text.032c: "{color:7}???モン {color:1}\nわたしはなにも悪くない。\n勝手に家に\n入ってこないでくれ！"
text.03d2: "そろそろおいとましよう。"
text.0418: "見張り、がんばってね！"
text.0452: "おまえはオーガモンの山賊だな！\nここがアジトだろう！"
text.04ba: "なんの話だ？"
text.0500: "この前は運がよかっただけだ！\n観念しろ！"
text.0554: "うわあ！"
text.05b4: "この前はだまされたけど、\n今度こそつかまえてやる。"
text.061a: "なんの話だよ？"
text.0660: "今度は逃がさないぞ！"
text.06ac: "ねえ、中に入れてよ。"
text.06da: "やる気か？\nぶっとばしてやる！"
text.0738: "戦う\nいじめないで"
