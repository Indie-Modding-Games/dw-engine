text.0096: "きみのことは聞いている。"
text.00d6: "町のことを知ってるなら、\nいっしょに来てくれない？"
text.0166: "わたしも島の未来のことを\n考えている。ずっと\nあるものをさがしているのだ。"
text.0218: "なにをさがしてるの？"
text.0252: "先祖が残したものだ。\nだが、それがなにかは\nわからない。"
text.02fe: "そっか。見つけたら\n知らせるよ。"
text.0354: "長いあいだ\nさがしてきたが、\nかんたんには見つからんぞ。"
text.03cc: "だが、もし見つけてくれたら\n約束しよう、\nきみの町へ行くと。"
text.044c: "これかな？"
text.0474: "おお、それだ！"
text.04b8: "先祖が書き残したものだ。\nどれどれ。"
text.0524: "「島に危機が訪れたとき、\n町へ行け」"
text.0592: "先祖が行けと\n言っている！"
text.05de: "力を貸してくれるの？"
text.061e: "まかせてくれ！"
text.0686: "レオモンが町の仲間になった！"
text.06ca: "さがしものがあるのだ。\nすまないが、もう行かねば…"
text.0756: "{color:5}トレーニング：\n打ちこみスペシャル {color:1}"
text.0796: "はじめる\n説明\nやめる"
text.07ce: "ふつう\nボーナス\nやめる"
text.080c: "コンクリートの袋を\n全力で打ちこみます。"
text.0868: "攻撃力と最大HPが\n上がります。"
text.08c4: "もう一度説明\nはじめる\nやめる"
text.091e: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}ボタンで\n絵を3つそろえよう。"
text.09a0: "{color:5}トレーニング： \nサバンナコース {color:1}"
text.09de: "はじめる\n説明\nやめる"
text.0a16: "ふつう\nボーナス\nやめる"
text.0a54: "サバンナコースを走ります。"
text.0a8e: "素早さが大きく上がり、\n最大HPも上がります。"
text.0afc: "もう一度説明\nはじめる\nやめる"
text.0b56: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}ボタンで\n絵を3つそろえよう。"
