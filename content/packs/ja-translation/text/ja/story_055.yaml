text.0034: "おまえの相手はオレだ！"
text.006a: "おまえの相手はオレだ！"
text.00a0: "おまえの相手はオレだ！"
text.0102: "なんて書いてある？"
text.012c: "「まぬけからポイントを\nもらった場所にもどれ」"
text.01d8: "{color:6}冷蔵庫のカギ{color:1}を\n使った。"
text.0234: "見あたらない。"
text.025e: "メモがある。"
text.0284: "「まぬけからポイントを\nもらった場所にもどれ」"
text.0310: "このメモの言うとおりに\nしてみよう。"
text.036a: "冷蔵庫だ。"
text.039a: "カギがかかってる。カギつきの\n冷蔵庫なんて初めて見た。"
