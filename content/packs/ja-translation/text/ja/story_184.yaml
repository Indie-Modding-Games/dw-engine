text.003e: "うわっ！！"
text.006c: "タマゴだ！"
text.0080: "マシーンドラモンのタマゴかな？"
text.00c8: "やっかいなことになるかも！"
text.015e: "デジタマモンが町の仲間に！"
text.01b8: "あっ！"
text.01e2: "いた！見つけたぞ！"
text.022a: "おまえがボスだな！"
text.0252: "はじめまして。\nわたしはアナログマン。"
text.029a: "きみのことはよく知っているが、\n子どもだとは思わなかった。"
text.030e: "子どもにわたしの計画を\nじゃまされていたとはな。"
text.0378: "あと少しでネットワールドを\n支配できたのに。"
text.03ce: "大人のくせに！もうやめろ、\nみんなが苦しんでるんだ。"
text.0442: "デジモンが苦しもうと\n知ったことではない。"
text.049a: "デジモンは奴隷のように\n人間に従えばいいのだ。"
text.04fa: "ちがう！デジモンにも\n心があるんだ！\nデジモンとは友だちなんだ！"
text.0578: "どちらが上か、\n戦って確かめようじゃないか。"
text.060c: "出番だ、マシーンドラモン！"
text.0698: "やったね、{color:10}{partner}{color:1}！"
text.06e0: "そんな！\nわたしの最強の奴隷が！"
text.0736: "ほら、まちがってただろ！"
text.0772: "ま、まさか…"
text.07b4: "島から手を引いて\nあやまれば、みんな\n許してくれるよ。"
text.0854: "デジモンなど信じたのが\nまちがいだった。自分でやる。"
text.08e2: "何をする気だ！？"
text.0926: "{color:7}アナログマン {color:1}\nこの島を爆破して、\n別の世界へ逃げるのさ。\n残念だったな、小僧！"
text.0a12: "そんなーーっ！！"
text.0a3c: "{color:7}アナログマン {color:1}\nこれで終わりだ！"
text.0a86: "ごめん、みんな。\nもう打つ手がないよ。"
text.0af0: "{color:7}??? {color:1}\n大丈夫だよ。"
text.0b30: "え？"
text.0b56: "{color:7}アナログマン {color:1}\n転送できない！\nプログラムがおかしい。\nどうなってるんだ！？"
text.0c18: "みんなの声が聞こえる！\nだれかいるの？"
text.0c7e: "{color:7}ジジモン {color:1}\n今、わしらの力を\nきみに送っておるぞ。"
text.0cee: "{color:7}トコモン {color:1}\nボクたちの声、聞こえる？"
text.0d3c: "{color:7}アグモン {color:1}\n間に合ったみたいだね！"
text.0d8e: "みんな…"
text.0dc4: "{color:7}アナログマン {color:1}\nやめろ、このポンコツめ！\n助けてくれ！うわあああ！！！"
text.0ec4: "消えた！どうなったんだ？"
text.0efe: "{color:7}ジジモン {color:1}\nわからん。じゃが…"
text.0f4c: "ジジモン？爆発しちゃう！\n何とかして！"
text.0fa2: "{color:7}ジジモン {color:1}\nそろそろ来るはずじゃ。"
text.1032: "エアドラモン！"
text.104e: "早く、乗って！"
text.10ac: "アナログマンは消えた。"
text.10d8: "ファイル島に\n平和がもどった。"
text.1124: "そして…"
