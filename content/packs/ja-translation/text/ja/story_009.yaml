text.004c: "自動販売機"
text.007a: "うわっ、高すぎる！"
text.00b6: "肉：300ビット\nデジキノコ：600ビット\n買わない"
text.015e: "お金が足りないや。"
text.01b2: "お金が足りないや。"
text.01f6: "{color:6}肉{color:1}が出てきた！"
text.023e: "おっと、持ち物がいっぱいだ。"
text.0286: "{color:6}デジキノコ{color:1}が\n出てきた！"
text.02ec: "おっと、持ち物がいっぱいだ。"
text.0338: "釣りのしかた：まず\n「釣りざお」を手に入れると\nサブメニュー{color:5}× {color:1}に\n「釣り」アイコンが出るので\n選びます。{color:6}△ {color:1}でエサを\nつけます。持っている食べ物\nから選んでください。"
text.0480: "次に、左右ボタンで\n向きを変えます。\n{color:6}△ {color:1}でさおを頭上にかまえ、\nもう一度{color:6}△ {color:1}で投げます。\nウキが動くのを待ちましょう。\nウキが動いたら魚がエサに\nかかった合図。{color:6}△ {color:1}で引きます。"
text.05f8: "左上のゲージを見てください。\nゲージがいっぱいになる前に\n{color:6}△ {color:1}をはなしましょう。\nでないと糸が切れてしまいます。\nウキを手前まで十分に\n引きよせれば、\n魚を釣り上げられます。"
text.077a: "魚の影に「X」が出たら、\n今のエサではその魚は\n釣れないという意味です。"
