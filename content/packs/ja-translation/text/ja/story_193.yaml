text.0050: "来た！うまくいったね！"
text.0094: "人間だ。\nジジの言ったとおりだね。"
text.00e8: "ううむ。"
text.0102: "シーッ、起きるよ。"
text.0140: "え？ここはどこ？"
text.0170: "デジモンワールドへようこそ！"
text.01ae: "えっ？"
text.01d0: "うわっ！"
text.01ec: "どうしたの？"
text.0220: "きみたちはだれ？"
text.0266: "デジモンじゃよ。"
text.0296: "デジ…何？"
text.02c0: "あれ？デジモンのこと\n知ってると思ったのに。"
text.0320: "わかった、これは夢だ。"
text.0364: "夢じゃないよ。"
text.039a: "待って、きみトコモンだよね。\nリアルな夢だなあ。"
text.0412: "{color:6}{tamer}{color:1}、これは夢\nではないが、現実でも\nないのじゃ。"
text.048a: "何を言ってるの？\nおじいさんはだれ？"
text.04ea: "わしはジジモンじゃ。"
text.0514: "そんな名前のデジモンは\n知らないよ。"
text.0576: "きみの知らないデジモンも\nたくさんおるんじゃ。\nここはデジモンワールド。"
text.0600: "デジモンワールド！？"
text.0636: "この世界は夢でも\n現実でもない。\nわしらの世界じゃ。"
text.06b8: "うーん…夢にしては\nリアルすぎるなあ。"
text.071e: "うしろを見てごらん。\nわかるはずじゃ。"
text.077a: "えっ？"
text.07b6: "これって{color:10}{partner}{color:1}？"
text.07e2: "思い出した！デジモンの\nキーチェーンに吸いこまれた！"
text.0864: "そのとおりじゃ。"
text.0892: "どうしてここに来たの？"
text.08be: "わしの家へ来なさい。\n話してあげよう。"
text.0a62: "わしらを救ってもらうために\nきみを呼んだのじゃ。"
text.0aaa: "何から救うの？"
text.0ae0: "ここはファイルシティ。\nファイル島の中心じゃ。"
text.0b58: "町？ここが？"
text.0b86: "かつては町だったんじゃ。\nいろんなデジモンが\nここに住んでおった。"
text.0c2e: "デジモンたちが心を失い始め、\n町を出ていったのじゃ。"
text.0ca6: "どういうこと？"
text.0cdc: "原因はわからん。\nデジモンたちが言葉を\n話せなくなり始めたのじゃ。"
text.0d84: "まだ話せる者もおるが、\nみな、ここに住んでいたことを\n忘れてしもうた。"
text.0e14: "それが、心を失うって\nことなんだね。"
text.0e70: "このままでは\n危ないのじゃ。"
text.0ebc: "でも、なんでぼくが？"
text.0ee2: "きみはデジモンを育てるのが\n得意じゃろう？"
text.0f3c: "それは得意だけど！"
text.0f7c: "自分がデジモン語を\n話しておると気づかんか？"
text.0fe6: "え？まさか。いつもどおりの\n言葉で話してるよ。"
text.104e: "わしらにはデジモン語じゃ。"
text.10a2: "そうだよ！"
text.10d4: "この世界では、デジモンへの\n愛が、きみの\n力になるのじゃ。"
text.1158: "ありがとう。"
text.1176: "だからきみを選んだのじゃ。\nきみなら島じゅうの\nデジモンを集められる！"
text.120a: "えっ？"
text.121c: "ん？"
text.122c: "任せてよ！"
text.126c: "よーし！"
text.1294: "ありがとう。きみが頼りじゃ。"
text.12da: "何から始めればいい？"
text.130c: "{color:10}{partner}{color:1}を連れて\n島を探検するのじゃ。"
text.1360: "この危機の原因を見つけ、\nデジモンたちを\n呼びもどしてくれ。"
text.13f6: "行こう、{color:10}{partner}{color:1}！"
text.1444: "待て、話はまだ終わっとらん。"
