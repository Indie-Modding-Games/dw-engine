text.0058: "うまくいかない！"
text.0096: "なにか言った？"
text.00d8: "無理だって言っただろ。"
text.0124: "あんまり自信ないなあ。"
text.0174: "お手やわらかにね。"
text.01a6: "バカにするな！"
text.01ee: "エレベーター"
text.0206: "屋上ボタンを押す\n上ボタンを押す\n乗らない"
text.026e: "なにも起こらない。"
text.02ba: "機械に岩がはさまってる。\nもしかしてこれが…"
text.0334: "岩を取りのぞいた！"
text.0362: "これでよし！"
text.03fe: "なにも起こらない。"
text.044a: "機械に岩がはさまってる。\nもしかしてこれが…"
text.04bc: "岩を取りのぞいた！{stop}"
text.04fe: "これでよし。"
