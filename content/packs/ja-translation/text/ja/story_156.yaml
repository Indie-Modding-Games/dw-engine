text.0042: "改造しますよ。\n料金は2000ビットです。"
text.00be: "タイプがちがうので、\n改造できません。"
text.011a: "たのむ\nやめておく"
text.015a: "ビットが足りませんよ。"
text.01a0: "少々お待ちを。"
text.01d4: "うまくいきませんでしたが…"
text.0214: "わあ、ギロモンになった！"
text.0262: "成功です！"
text.029a: "わあ、メタルマメモンに\nなった！"
text.02e6: "失敗しました。"
text.030c: "ひどい！"
text.032e: "ごめんなさい…"
text.0350: "足し算、消去！"
text.0392: "第一の目標は\nハードウェアの破壊。"
