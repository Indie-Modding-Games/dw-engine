text.00ce: "へへ、オレにさわると\nビリッとくるぜ。"
text.016a: "ここにいたくないのか？"
text.01ee: "わあ、すごい！根性あるな。"
text.022c: "おまえ、大物になるぜ！\nよし、力を貸してやる。"
text.029a: "その電気の力を\n町のために使ってくれない？"
text.0300: "町？なんだそれ？\n聞き覚えはあるけど…"
text.035a: "手伝うよ。オレはエレクモン、\nよろしくな。"
text.03ec: "エレクモンが町の仲間になった！"
text.0432: "うぐぐ！"
text.0454: "わああ！"
text.0474: "覚悟しろ！"
text.04ac: "なかなかやるな。"
text.04d2: "趣味が悪いな。"
text.050e: "生意気な！思い知らせてやる。"
text.057e: "かたい鉄のドアだ。\n開かないと\n中に入れない。"
