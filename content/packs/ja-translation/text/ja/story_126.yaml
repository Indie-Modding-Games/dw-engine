text.0060: "ここはデジモンカードの店だよ。"
text.00a0: "デジモンカードって？"
text.00d4: "みんな集めてるんだ。\n持ってて損はないよ。"
text.0146: "へえ？"
text.0158: "最初の1枚はタダであげるよ。\nいいカードだよ。"
text.01ca: "あっ！これ、ぼくのカードだ！"
text.0206: "{color:6}{tamer}{color:1}のカードを手に入れた！"
text.0236: "ここはデジモンカードの店だよ。"
text.027e: "今日はすごくいいカードが\n入ってるよ。"
text.02da: "カードを買う\nカードを売る\nやめる"
text.0348: "3枚パックを買う\n1枚買う\nやめる"
text.03a0: "1枚買う\nやめる"
text.03cc: "1パック500ビットだよ。\n中身はお楽しみ。"
text.0442: "買う\nいらない"
text.0488: "すぐにパックを開けてね。"
text.04e8: "ほかになにかいる？"
text.0526: "また来てね。"
text.0552: "ここはリサイクルショップだよ。"
text.0594: "ふつうのアイテムがほしい\nリサイクル品がほしい\nまた今度"
text.0676: "え！？"
text.0690: "お店だ！"
