text.0024: "こんにちは、{color:6}{tamer}{color:1}。\nおどろきましたか？\n診療所を開いたんです！"
text.007a: "病気やケガを治す所です。\nタダではありませんが、\nお安くしますよ。"
text.0130: "あなたのデジモン、具合が\n悪そうですね。体調に\n気をつけてあげないと。"
text.01be: "今すぐ治しましょう。\nお安くしておきます。\n300ビットです。"
text.025e: "ビットが足りませんか？\nある分だけでいいですよ。"
text.0304: "これでもう大丈夫。\nこれからは気をつけてね。"
text.038a: "あなたのデジモンは元気ですね。\n何のご用ですか？"
text.03e6: "疲れをとる\n薬を買う\n何もない"
text.046c: "{color:10}{partner}{color:1}はとても疲れています。\n今すぐ休ませてあげて。"
text.04ec: "{color:10}{partner}{color:1}は疲れています。\nもう休ませたほうがいいですね。"
text.0548: "{color:10}{partner}{color:1}は少し\n疲れているようです。\nムリはさせないで。"
text.05c2: "{color:10}{partner}{color:1}は元気です。\n疲れには気をつけてね。"
text.0634: "少しは楽になりましたか？"
text.066e: "ほかに何かありますか？"
text.06a0: "もっと休ませる\n薬を買う\n何もない"
text.0706: "もう大丈夫でしょう。"
text.0732: "包帯：400ビット\n薬：1200ビット\n買わない"
text.07c0: "具合が悪いときは、\nわたしの所に来てください。"
text.0826: "まだ疲れているなら、\nトレーニングをへらして、\nきちんと食べてねかせて。"
text.08c8: "寒い所や暑い所に\n長くいると、\n病気になりますよ。"
text.0958: "包帯はケガにしか\nききません。"
text.09b2: "薬で病気は治せますが、\n疲れはとれません。"
text.0a50: "バトルの終わりにHPが\n少ないと、デジモンは\nケガをしやすいんです。"
text.0ae8: "機嫌と疲れを\nいい状態にしておくと\n長生きしますよ。"
text.0b8c: "ビットが足りませんね。\nそれは売れません。"
text.0c0e: "アイテムがいっぱいですよ。"
text.0c62: "ビットが足りませんね。\nそれは売れません。"
text.0ce4: "アイテムがいっぱいですよ。"
text.0d28: "ほかに何かありますか？"
text.0d5a: "疲れをとる\n薬をもっと買う\nいいえ、何もない"
