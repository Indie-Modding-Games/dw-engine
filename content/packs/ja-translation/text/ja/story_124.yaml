text.008e: "うーん"
text.00b4: "鳥の巣みたいだね。\nどう思う？"
text.012e: "なにか音がする。"
text.01bc: "やるじゃない。"
text.01dc: "きみの巣だったんだね。"
text.020c: "うん。"
text.0222: "勝手に入ってごめんね。"
text.026a: "いいよ、気にしないで。"
text.02a4: "？"
text.02ae: "きみのうわさは聞いてるよ。"
text.02da: "有名だなんて知らなかった。"
text.0318: "たぶん島に残っている\nただひとりの人間だね。"
text.0388: "残っている…？\n前にもだれかいたの？"
text.03e0: "町にさそって\nくれないの？"
text.0440: "あ、そうだった。\n町に来てくれない？"
text.0492: "いいよ。じゃあさっそく\n行こう。しっかりつかまって。"
text.0534: "バードラモンが町に加わった！"
text.066a: "エレベーター"
text.0682: "下を1回押す\n下を2回押す\n乗らない"
text.074e: "あれ？"
text.075c: "だめだ。動かない。"
