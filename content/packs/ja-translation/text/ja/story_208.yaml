text.002e: "貝がら新聞 第8号\n宇宙人デジモン現る：\nUFOを発見した。\nその生き物は姿を見せ、\nなぞの言葉を話した。\nあれは宇宙人なのか？\nまた現れるのだろうか？"
text.018a: "前へ\nとじる"
text.01bc: "貝がら新聞 第7号\nマイオティスモン、引退を否定：\nインタビューで彼は\nうわさを否定した。\nまだまだ現役で、\nファンを大切にしている。\nまた、弟子の\nスカルグレイモンの\nデビューも発表した。"
text.0368: "前へ\n次へ\nとじる"
text.03d0: "貝がら新聞 第6号\nマイオティスモン引退か？：\n人気と実力をかねそなえた\nマイオティスモンが引退する\nといううわさだ。アリーナでも\nだれも彼を見ていない。\nもう年なのか…"
text.0544: "前へ\n次へ\nとじる"
text.05b4: "貝がら新聞 第5号\nかくれた宝：\nギアサバンナのすてきな店。\n毎年1日から15日までしか\n開いていない。店主は\nめずらしいアイテムが\n自慢だ。"
text.0710: "前へ\n次へ\nとじる"
text.0794: "貝がら新聞 第4号\n伝説のデジモン？：\nフリーズランドに寒さに強い\nデジモンがいるといううわさ。\nM氏はこの怪物に助けられた。\n大きな雪玉のような姿だった\nそうだ。寒さが苦手な\nデジモンは気をつけて！"
text.094e: "前へ\n次へ\nとじる"
text.09aa: "貝がら新聞 第3号\n湖に守り神？：\n竜眼湖に湖の守り神がいる。\nデジモンのような生き物で、\nだれかに呼ばれたらしい。\nこの守り神は願いを\nかなえてくれるのか？"
text.0b10: "前へ\n次へ\nとじる"
text.0b80: "貝がら新聞 第2号\nUFOだ！：\nパノラマ山の近くでUFOを\n見たという報告があった。\n下から光を出す\n銀色の皿のような形だ。\n宇宙人なのか？\nくわしくは次号で。"
text.0cf8: "前へ\n次へ\nとじる"
text.0d48: "貝がら新聞 第1号\n盗賊団がいなくなった！：\n{color:6}{tamer}{color:1}がオーガモンの\nひきいるアジトを見つけた。\nしかし、オーガモンは\nまだつかまっておらず、\nみんな不安がっている。"
text.0e70: "次へ\nとじる"
