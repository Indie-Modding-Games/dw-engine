text.0122: "勝つのはオレだ！"
text.0150: "こっちに来るな！あっち行け！"
text.0194: "本気で怒ったぞ！"
text.01d0: "たたいたら、たたき返すぞ！"
text.0214: "やれるものならやってみな！"
text.02f4: "おお、{color:6}{tamer}{color:1}か。\n橋は直ったよ。"
text.0348: "町を作っているそうだね。"
text.0386: "頼みがあるんだ。\nわたしが助けたように、\nきみにも力を貸してほしい。"
text.040a: "え？"
text.0414: "町を作ることは、この島を\n救うことなんだ。\nみんなが救われるんだよ。"
text.04a2: "それって、町に\n来てくれるってこと？"
text.04fc: "ああ。きみの町へ行こう。"
text.0596: "コエラモンが町の仲間になった！"
text.06b0: "おや、きみは人間かい？"
text.06dc: "わたしはコエラモン、\n魚のデジモンだ。\nわたしに会いに来たのかい？"
text.0758: "うん、ずっと探してた\n言われてみれば…"
text.07d0: "ははは、そうかい！"
text.080c: "用件はもうわかって\nいるよ。"
text.084e: "上流の橋がこわれていて、\n向こう岸へ渡りたいんだろう？"
text.08f2: "なるほど。\nいいよ、手を貸そう。"
text.093c: "ああ、また来たんだね。"
text.0a0a: "さあ、わたしたちの頭の上を\n歩いて。心配いらないよ。"
text.0a7a: "よし、行くよ！"
text.0b94: "この世界にはもっと協力が\n必要だ。また会おう。"
