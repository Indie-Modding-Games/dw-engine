text.005a: "このコスチュームはほかとは\nちがうみたい。なにか\nすごい存在感がある。"
text.0130: "背中にチャックがある。"
text.018e: "どうしたの、{color:10}{partner}{color:1}！？"
text.01d4: "え？ほかのデジモンに\nなっちゃったの？\nなんだかいい感じ。"
text.0250: " {color:10}{partner}{color:1}、\n中に入ってみる？"
text.02ae: "だめだよ、{color:10}{partner}{color:1}。\n体がやわらかくてヌルヌルじゃ\nないと入れないよ。"
