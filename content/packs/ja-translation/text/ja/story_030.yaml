text.0060: "くそっ！でかい岩にぶつかった！"
text.0098: "これじゃほれない。"
text.00c6: "ほれないの？そんな！"
text.00f0: "なんとか動かさないと。\nきみにできるかい？"
text.0164: "わからないな。"
text.0192: "{color:10}{partner}{color:1}、\n力を貸して。"
text.034e: "やった！"
text.036a: "すごい力だ！\n岩が動いたぞ！"
text.03be: "この先は空洞に\nなってるみたいだ。"
text.041e: "溶岩の川だ！\nあぶないよ！"
text.0468: "川ぞいに道があるよ。\n行こう！"
text.04c2: "中に入るのかい？\n気をつけてね！"
text.0516: "中に入るのかい？\n気をつけてね！"
text.0576: "{color:10}{partner}{color:1}がもっと\n育ったら、また来な。"
