text.009c: "この先はスピードゾーンだ。\nあまり近づくなよ。"
text.012e: "ぼくには目的が2つあるんだ。\nひとつは島の危機の\n正体をつきとめること。"
text.01b2: "もうひとつは、デジモンたちを\n町に集めること。"
text.0212: "で、なにが言いたいんだ？"
text.023e: "手伝ってほしい\nやっぱりいい"
text.0286: "ムリだ。オレはこの森を\n守らなきゃならない。"
text.02d4: "じゃあ、島の危機について\nなにか知らない？"
text.0346: "なにも知らないな。待てよ。"
text.037c: "そういえば少し前に、\n大きな岩が空から\n落ちてきたな。"
text.03fc: "どこに落ちたの？"
text.0428: "スピードゾーンだ。\n森の向こう側だよ。"
text.04a2: "行かせて！なにか手がかりが\nあるかもしれない！"
text.0506: "…"
text.0512: "そこまで言うなら。\n行って調べてこい。"
text.057e: "この先は、時間が\n2倍の速さで進む。\n食べ物を十分に持っていけ。"
text.0610: "年を取りすぎないようにも\n気をつけろよ。"
text.0672: "ほかの場所も\n調べてみたらどうだ。"
text.06dc: "この先は、時間が\n2倍の速さで進む。\n食べ物を十分に持っていけ。"
text.076e: "年を取りすぎないようにも\n気をつけろよ。"
text.07dc: "なにかあったか？"
text.0810: "まだだよ。"
text.0828: "師匠の話では、\n秘密の抜け道があるらしい。"
text.0890: "でも場所はわからないんだ。"
text.08da: "これはなに？"
text.08f8: "いん石みたいだな！\n心配することはないよ。"
text.096c: "悪いけど、オレが知ってるのは\nそれだけだ。"
text.09ae: "とにかく、ありがとう。"
text.09da: "これでもくらえ！"
text.0a82: "なさけないやつめ！"
text.0aac: "師匠！？"
text.0ac4: "まだこんなところに\nおったのか！"
text.0b1c: "師匠？だれなの？"
text.0b4c: "でも師匠、古代恐竜地帯は\nだれが守るんですか？"
text.0bba: "今、島は大事なときなのじゃ。\n町へ行って、\nみなを助けるのじゃ！"
text.0c5c: "はい、師匠！"
text.0c7c: "ほんとうにいいの！？"
text.0cba: "まだ若いが、どうか\nこき使ってやってくれ。\nここはわしが守る。"
text.0d54: "師匠…"
text.0d74: "{color:6}{tamer}{color:1}、そういうわけだ。\n町に行ってもいいか？"
text.0de4: "しっかり働くのじゃぞ。"
text.0e12: "はい！\n師匠、行ってきます！"
text.0e92: "ティラノモンが町に加わった！"
text.0ed6: "あいつになにができるかのう。"
text.0f1a: "ここの番をするのは\nひさしぶりじゃ。"
text.0f7a: "いつでも通ってよいぞ。"
text.0fc2: "ここの番をするのは\nひさしぶりじゃ。"
text.1022: "いつでも通ってよいぞ。"
