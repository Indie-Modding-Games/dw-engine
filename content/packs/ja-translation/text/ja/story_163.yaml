text.034c: "バッケ。バー・ッケア。"
text.0374: "まだ言葉がわからないなあ。"
text.03dc: "そうか。ぼくたちのために\n見回りしてくれてるの！？"
text.0438: "見て！わたし特製の\n掲示板よ。"
text.048a: "町には情報が必要でしょ。\nだから新聞を作ることに\nしたの！どう思う？"
text.053e: "情報集めなら\nわたしにまかせて。"
text.059e: "わたしの新聞を読んでるのね。"
text.05f0: "ああ、涼しくて気持ちいい。"
text.0630: "居心地がいいと\n気持ちいいね。"
text.069e: "ぼくの店、どう思う？"
text.06de: "商売は苦手なんだけど、\n今はほかに\nやる人がいないんだ。"
text.0766: "デジモンをたくさん呼んでね。"
text.07c0: "で、どう思う？"
text.07f8: "{color:7}コエラモン {color:1}\nみんなで助け合って、この\nアイテムを売ることにしたんだ。"
text.0912: "うーん。おいしそうな草が\nあったから、食べたんだ。"
text.0986: "町の風通しが\nよくなりすぎたかな。"
text.09ee: "そうそう、このあいだ\n{color:6}ハッピーキノコ {color:1}を\nたまたま拾ったんだ。"
text.0a6c: "めずらしい種類なんだって。"
text.0aa4: "{color:6}高級キノコ{color:1}の話も\n聞いたよ。\n見つかるといいな。"
text.0b3e: "原生林の\n{color:6}青リンゴ {color:1}は\nすごくおいしいよ。"
text.0bb0: "熱帯ジャングルの\n{color:6}オレンジバナナ {color:1}は\nすごくおいしいよ。"
text.0c2c: "パノラマ山の\n{color:6}大きなベリー {color:1}は\nすごくおいしいよ。"
text.0c98: "ギアサバンナの\n{color:6}甘い木の実 {color:1}は\nすごくおいしいよ。"
text.0d02: "オーバーデル墓地の\n{color:6}スーパー野菜 {color:1}は\nおいしいよ。"
text.0d70: "古代恐竜地帯の\n{color:6}赤ベリー {color:1}は\nおいしいよ。"
text.0dda: "大渓谷の\n{color:6}サボテンの実 {color:1}は\nおいしいよ。"
text.0e4e: "霧の森の\n{color:6}デジパイン {color:1}は\nおいしいよ。"
text.0ff6: "言いたいことがあるんだ。"
text.102c: "なあに？\nまたね！"
text.106c: "東の橋が直ったの、\n見た？\nみんなでがんばったんだ。"
text.10f6: "今、デジモン橋を\n直してるんだ。少し待ってて。"
text.1166: "南のコエラ岬に、めずらしい\nデジモンがいるんだって。"
text.11e0: "うわさでは、毎日夕方に\n現れるらしいよ。"
text.125c: "ねえ、町の東のほうに\nこわれた橋があるのを\n知ってる？"
text.12f0: "誰も使わないと思って、\nほったらかしに\nしてたんだ。"
text.138e: "自分たちで直そうかと\n考えてるんだ。"
text.13e8: "それまでは、西と南の\nほうを調べてきて。\nそれからまた来てね。"
text.1496: "ゲコ沼には行った？\nいたずら好きなデジモンに\nだまされるかもよ。"
text.151c: "デジモンが進化すると、\nセットしてある技が\n変わるから覚えておいてね。"
text.15ae: "ええと…"
text.15d6: "どう？明かりをつけたんだ。\n明るさは十分かな？"
text.164e: "町をきれいで\n明るくしよう！"
text.16a6: "明かりで何か\n変わるの？"
text.16f0: "まあ、それは\n気の持ちようさ。"
text.1746: "いちばん強いのはおれだ。"
text.1780: "おまえに負けてるとは\n思ってない。アリーナに\n来れば、わかるさ。"
text.1824: "やあ、{color:6}{tamer}{color:1}。\n町にあやしいヤツがいないか\n見回りしてるんだ。"
text.18a2: "なんだい？じゃまは\nしてないだろ！？"
text.192a: "いらっしゃい！\n{color:6}{tamer}{color:1}には\nうんと安くしておくよ。"
text.1998: "商売は苦手だけど、\nそれはみんな同じさ。"
text.1a02: "今はぼくが販売係なんだ。\nよろしくね。"
text.1a74: "お願い、{color:6}{tamer}{color:1}。\nできるだけたくさんの\nデジモンをつれてきてね。"
text.1b10: "ぼくの店、\nどう思う？"
text.1b50: "商売は苦手だけど、\nほかにやれる人がいないから\nぼくがやるしかないんだ。"
text.1bcc: "早くデジモンを\nたくさんつれてきてね。"
text.1c32: "で、どう思う？"
text.1c6a: "{color:7}コエラモン {color:1}\nみんなで助け合って\nアイテムを売ることにしたんだ。"
