text.0026: "ここはもう心配ないよ。\nがんばってね。"
text.0078: "私も力を貸します。\nできるときは、ここと町を\n行き来しますね。"
text.0128: "アンドロモンが町に加わった！"
text.0176: "データの修復が終わりました。\nでは、データを読みます。"
text.01e6: "お願い。"
text.0200: "今から100年前、\nアナログ人間が\nデジモンの島に現れた。"
text.0286: "アナログ人間と島のデジモンは\nはげしく戦った。"
text.02f0: "10年の戦いのすえ、\nアナログ人間は敗れ、\n姿を消した。"
text.038c: "その後の10年で、\nふしぎなことに島の広さは\nほぼ2倍になった。"
text.0438: "人間がデジモンと戦ったの？"
text.0476: "すみません。修復できた\nデータはこれだけです。"
text.04e6: "気にしないで。これは\nすごく大事な情報だよ。\nいろんなことがわかった。"
text.0582: "そうですか？"
text.05ae: "その人間たちが、きっと\n島に混乱と騒ぎを\n起こしたんだ。"
text.065e: "人間って100年も\n生きられるの？"
text.06aa: "この世界では、人間にとって\n時間がゆっくり流れるみたい。"
text.071a: "だからここでは、食べたり\nねたりしなくていいのか。"
text.078a: "100年はとても長い。\nそいつらは、きっと\nすごくしぶといんだ。"
text.081c: "どこかに隠れて\nいると思う？"
text.0872: "ぼくがそいつらを見つけて\nなんとかする。"
text.08b8: "ここにいる理由がわかった。\nぼくは人間だから、\nそいつらと向き合わなきゃ。"
text.095e: "本当にごめんなさい。\nしばらく工場を閉めます。"
text.09d6: "今は騒ぎのせいで、\nこの先どうなるかわからない。\nきみのせいじゃないよ。"
text.0a8a: "誰かがギロモンを\nあやつっている気がする。"
text.0aea: "コンピューターが壊されて、\n廃水がもれ出したんだ。"
text.0b62: "その水でデジモンたちが\nおかしくなった。\nただの偶然とは思えない。"
text.0bee: "このコンピューターには\n大事なカギがあるんだ。"
text.0c46: "今さらかもしれないけど、\n誰かがぼくたちを\nねらっていたと思う。"
text.0cc8: "なんだって！？"
text.0cdc: "このコンピューターには、\n島の過去についての\nデータがあったんです。"
text.0d78: "でもギロモンの暴走で、\nデータは壊されました。"
text.0dec: "そのデータを見たことはないの？"
text.0e2a: "いいえ。でも、一部なら\n直せるかもしれません。\nデータをつないでみます。"
text.0eca: "そうか、ありがとう。\nどれくらいかかる？"
text.0f22: "少し時間がかかります。\n町の入口を開けておくので、\nまた来てください。"
text.0fb2: "ありがとう。また来るよ。"
text.0ff6: "データの修復は\n終わった？"
text.1044: "もう少しかかります。\nまた来てください。"
text.10a2: "わかった、また来るね。"
text.10ea: "おい、おい！"
text.1104: "あやまらなければなりません。"
text.113c: "それは後で！今すぐ工場の\n機械を止めてくれ！"
text.11ba: "わかりました、止めます。"
text.11ee: "工場の機能が\nたった今、止まりました。"
text.1246: "よし、下水道を調べてくる。\nじゃあな！"
text.12b2: "おわびします。"
text.12dc: "今はそんな話を\nしてるヒマはない！"
text.133e: "我々のコンピューターは完璧だ。"
text.1376: "工場は本当に安全なのか？\n今、何ができるんだ？"
text.13e8: "よし、見張りを\nなんとかするしかない。\nほかに方法はない！"
text.1482: "どうやって町に入った？"
text.14ca: "用がないなら、\n今すぐ出ていけ！"
text.1546: "その話は後にしよう。\n今は工場を\n調べないと。"
text.15cc: "命にかかわる事態なんだ。\n許可をくれ！"
text.163e: "何をしたいのか\nよくわからない。\n許可はできない。"
text.16e4: "工場の廃水のせいで\n消えかけている\nデジモンがいるんだ！"
text.178e: "工場から？まさか！\n廃水の浄化システムは\n正常に動いている。"
text.182a: "調べもしないで、どうして\n正常だとわかるんだ！？"
text.18a6: "コンピューターは完璧だ。\n緊急時はネットキーパーが\nシステムを止める。"
text.1952: "ネットキーパーが、いつも\n正しく動くと\n言い切れるのか？"
text.19de: "ネットキーパーとは、\nアルティメットデジモン\nギロモンのことだ。"
text.1a68: "彼の判断力と能力は\n完璧なのだ。"
text.1ac2: "デジモンだって！？まずい、\nもっと大変なことになる。\nたのむ、許可をくれ！"
text.1b7c: "出ていけ！今すぐ！"
text.1ba2: "はあ…ちぇっ！"
