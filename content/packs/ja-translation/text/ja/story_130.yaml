text.0036: "つかまえてやる！"
text.0070: "へえ、そうかい！"
text.00ce: "だれ？"
text.00ee: "助けに来たよ\nまだ準備ができてない…"
text.0158: "だれかいるのかい？"
text.018c: "見えないの？"
text.01b4: "ぼくはホエモン。ふだんは\n海に住んでるんだ。"
text.0206: "目はないけど\nたいていのことは感じられるよ。"
text.026c: "人間だよ。\n名前は{color:6}{tamer}{color:1}。"
text.02a6: "こっちは{color:10}{partner}{color:1}。\nパートナーの{digimon:pstat=103}だよ。"
text.02f6: "強い力を感じる。"
text.0330: "ぼくの話を聞いてくれる？\nこの近くに、ぼくが休む\n浜辺の洞窟があるんだ。"
text.03c8: "でも、悪いやつらに追い出されて\nそこで大事な宝物を\nなくしちゃったんだ。"
text.046a: "悪いやつら、か。\nよくないね。"
text.04bc: "あいつらを追い出してほしい。\n洞窟を取りもどすのを\n手伝ってくれないかな。"
text.0540: "手伝うよ\n今は無理"
text.0592: "そうか。"
text.05ae: "じゃあ、ぼくの背中に乗って。"
text.06c0: "行こう。"
