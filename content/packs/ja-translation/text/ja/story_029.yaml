text.0116: "土の運び出しも\nほとんど終わったようだ。"
text.0182: "仕事は順調だよ。\nありがとう。\nもう少し待っててね。"
text.021e: "おつかれさま。\nこれはお礼だよ。"
text.0296: "仕事で500ビット\nもらった！"
text.02d8: "HPが50上がった！\n攻撃力が5上がった！\n防御力が5上がった！"
text.0396: "土はトンネルの外に\n捨ててね。"
text.040a: "土の山から取ってね。"
text.0476: "土を運ぶのかい？"
text.04b4: "きみのデジモン、疲れてるよ。\n先に休ませてあげたら？"
text.054c: "土を運ぶのかい？"
text.058c: "はい\nいいえ"
text.05b8: "ここはしろうとの来る場所\nじゃない。あぶないから\n近づくなよ。"
text.065e: "このトンネルはまだ\n開通してないんだ。\nじゃましないでくれ。"
text.06d8: "ごめんなさい。いつ通れる\nようになるの？"
text.072e: "わからない。\nしばらくかかるな。"
text.077c: "それはこまったな。\n手伝おうか？"
text.07c0: "おいらたちの楽しみを\nうばう気か？\nまあ、土運びならいいか。"
text.083c: "なんだい？"
text.0866: "あそこの土はおいらがほった。\nそれを外まで運んで\n捨ててくれ。"
text.08de: "きつい仕事だから、\n1往復ごとに500ビット\n払うよ。"
text.096e: "これで穴ほりが早く進む。\nお金ももらえるし、\nいいトレーニングにもなる。"
text.0a0c: "OK\nやめておく"
text.0a3a: "土運びの仕事\n{color:6}△ {color:1}で土の前に\n土の箱を置きます。\n土はトンネルの外に捨てます。\n1往復したら\nドリモゲモンに伝えてください。"
text.0b66: "こわいのかい？"
text.0bae: "土の箱が増えた。"
