text.002c: "入口の看板を直したよ。"
text.0086: "あつい！なんとかしてくれ！"
text.00c8: "どうしたの？"
text.00f4: "あつすぎる！\nもうがまんできない！"
text.0178: "あつさで頭が\nへんになっちまった。"
text.01c8: "あついのはわかるけど…\n落ち着いてよ！"
text.0218: "ほればほるほどあつくなる。\nこのトンネルは\n火山の中にあるんだ。"
text.02a0: "それだけじゃないと思う。\n近くで火が燃えてるのかも\nしれない。"
text.0330: "うーん"
text.0340: "しかたない。\nあつさをこらえて\nほり続けるしかない。"
text.03d0: "原因を調べてみるよ。\nトンネルが通じたら\nいいね。"
text.045a: "おまえ、いいやつだな。\n急いでトンネルを\nほりあげるぞ！"
text.050e: "今日はおいらが\n料理当番だ。"
