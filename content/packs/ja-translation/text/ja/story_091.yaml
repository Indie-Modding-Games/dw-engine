text.007c: "勝つのはオレだ！"
text.00ae: "おまえには負けない！"
text.00ee: "へへ！悪いな！"
text.012c: "オレを無視する気か？"
text.017a: "ここを通りたければ、\nオレの挑戦を受けろ。"
text.021c: "油断したが、2対1は\nひきょうだぞ。"
text.028a: "それもそうだね\n負けおしみ言わないで"
text.02ea: "正々堂々の勝負なら\nだれにも負けない。"
text.034e: "1対1で勝負だ。明日の4時に\nまた来い。\n戦うのはデジモンだけだ。"
text.03fe: "わかった\nやめておく"
text.0436: "じゃあ、約束だ。\nまた明日な！"
text.04e6: "よく来たな。\n今日は正々堂々と勝負だ！"
text.0550: "遅かったな。おかげで\nケガを治す時間ができた。\nさあ、勝負だ。"
text.05f2: "見てるだけにするよ。始め！"
text.0630: "いけ、{color:10}{partner}{color:1}！"
text.067e: "やるな！おまえは何者だ？"
text.06b8: "島を危機から救うために\n探検してるんだ。"
text.0734: "なに？"
text.0746: "{color:6}{tamer}{color:1}は\n一生けんめい説得した！"
text.079a: "力を貸そう。だが、まずは\nその町を見せてもらうぞ。"
text.0844: "ガルルモンが町の仲間になった！"
