text.0092: "シャカシャカ！"
text.00c0: "シュロー！"
text.00e4: "ケロッ！"
text.0104: "やっつけないと\nこっちがやられる。"
text.017a: "トリ頭！"
text.0198: "まぬけ！"
text.01b4: "ノロマ！"
text.01ca: "おたんこなす！"
text.01ec: "バーカ、バーカ！"
text.020a: "ダサいやつ！"
text.022a: "なんだと！？"
text.0254: "頭にきた\n無視しよう"
text.02de: "感じ悪い！"
text.034e: "待って、なんだ？"
text.0396: "！"
text.03b4: "親方が呼んでる。\nいっしょに来い。ケロ。"
text.0420: "しまった！"
text.0440: "ははは、ハッタリだよ。\n子どもの相手はしない。"
