text.006c: "気分が悪い…"
text.0098: "大丈夫？"
text.00c0: "具合がよくない…"
text.00ec: "ここに住んでるの？"
text.0122: "気持ち悪い。力が出ない…"
text.0158: "ひどい顔してるよ。"
text.017e: "どんどん悪くなってる。"
text.01ac: "原因を突き止めなきゃ。"
text.01e6: "この排水は\nどこから来てるんだ？\n調べてみよう！"
text.0282: "これは何だ？"
text.02b2: "どうしたんだ{color:10}{partner}{color:1}！？"
text.02ea: "この霧、くさい！"
text.0312: "変だな、なんだかイヤな感じ。"
text.0350: "よし、下水が\n元にもどった。"
text.039a: "これでもう大丈夫。\n問題は解決したよ。"
text.040c: "何かおかしい！"
text.0450: "ダダダ！"
text.04bc: "疲れた…\nきみたち、どうしたの？"
text.050e: "前よりおバカっぽいぞ！\n正気にもどったのかも。"
text.0574: "だれがおバカだって？\n失礼な！ボクはヌメモンだ。"
text.05e8: "おバカじゃないなら、\n何なのさ？"
text.0630: "ねえヌメモン、きみの命を\n救ったのがだれか知ってる？"
text.06a0: "え？命を救ってほしいの？\nいいよ。"
text.06fc: "うう…全然わかってない！\nまあ、いいか。"
text.0766: "ボクが救世主か。カッコいい！"
text.07ae: "ぼくたちの町に来てよ。\n場所はわかる？"
text.081c: "ちょっとならね。"
text.087c: "ヌメモンが町の仲間になった！"
text.08ce: "だれだ！？"
text.08ec: "おまえはだれだ！？"
text.0984: "{color:4}次元キーホルダー{color:1}を\n手に入れた！アイテムを\n20個まで持てるようになった！"
text.0a46: "{color:4}次元キーホルダー{color:1}を\n手に入れた！アイテムを\n30個まで持てるようになった！"
