text.0066: "わあ、生きてるみたい！"
text.0096: "じつは、こっちが動くと\n動きだすんだ。待って！"
text.0144: "どうしたの、{color:10}{partner}{color:1}？\nなにか見つけた？"
text.01a0: "{color:10}{partner}{color:1}、\nすごいじゃないか！"
text.0202: "おや？あの像のことだけど…"
text.024e: "あっ！"
text.0272: "ふう、さてと"
text.028e: "生き返ったんだ。\nやった！"
text.02d4: "我はエンジェモン、きみを守る\n天使なり。使命を果たすため\n目覚めたのだ。"
text.036a: "なにを言ってるんだろう…？"
text.03a8: "我は天の真理を知る者。"
text.03e4: "地上の導きに従うため、\n我が魂をささげよう。"
text.044a: "なにを言ってるんだろう…？\n町に来てくれるの？"
text.04c0: "汝の使命は我が務め。\nいざ参らん。"
text.050a: "ごめん、わかることばで\n話してくれないかな？"
text.0578: "町へ行こう。だから\nきみも努力を続けるのだ。"
text.05da: "そっか。ありがとう！"
text.0636: "エンジェモンが町に加わった！"
