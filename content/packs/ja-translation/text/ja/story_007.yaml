text.0038: "ああ、そうだ！"
text.0050: "湖の守り神の\n{color:6}青い笛{color:1}をふく？"
text.00b6: "ふく\nふかない"
text.0188: "なにか手伝おうか、友よ？"
text.01ce: "向こう岸へ連れてって。"
text.020e: "いいとも。乗りな。"
text.033c: "シードラモン！"
text.0358: "また会ったな。\nなにか頼みがあるのか？"
text.03bc: "友だちになろう\n技を教えて\nアイテムがほしい"
text.0444: "わたしたちはもう友だちだ。\nほかに頼みはあるか？"
text.050c: "な、なんだ…うわっ！\n湖の守り神だ！"
text.056c: "うむ。わたしはシードラモンだ。"
text.05a0: "おまえが、さんざん釣りを\nしていたやつか！\nまあよい。頼みはあるか？"
text.0634: "なに！？守り神と呼ばれる\nわけがわかったよ。\nうん、頼みがあるんだ。"
text.06bc: "友だちになろう\n技を教えて\nアイテムがほしい"
text.0738: "よし、いいだろう。"
text.0754: "今日から友だちだ。そのあかしに\nこの笛をおまえにやろう。"
text.07ec: "しまった！アイテムが多すぎる。\nなにか捨てなきゃ。"
text.085e: "湖の守り神の\n{color:6}青い笛{color:1}をもらった！"
text.08b4: "湖の近くで笛をふけば、\nわたしが来よう。向こう岸へ\n連れていってやる。"
text.095c: "向こう岸へ行けるって\nこと？ありがとう！"
text.09bc: "湖の向こうには、ふしぎな\n森がある。今すぐ\n行ってみるか？"
text.0a5e: "うん、行く\nううん、また今度"
text.0aaa: "技を教えてやろう。"
text.0af6: "「水の魔法」を習得した！"
text.0b40: "「冬の突風」を習得した！"
text.0b8e: "「大氷結」を習得した！"
text.0bcc: "うーむ、もう教えられる\n技はないようだ…"
text.0c5c: "じゃあね！"
text.0ca8: "では、この\n{color:6}水筒{color:1}をやろう。"
text.0d12: "しまった！アイテムが多すぎる。\nなにか捨てなきゃ。"
text.0d84: "やった、\n{color:6}水筒{color:1}をもらった！"
text.0dca: "じゃあね！"
text.0e16: "では、わたしの背中に乗れ。"
text.0ece: "ではまたな。"
