text.003c: "どこへ行く？"
text.007a: "待て！"
text.009a: "ドピーーー！"
text.00c0: "グフッ、ヘイイ、ヒー！"
text.00f6: "だれだ？"
text.0114: "オレは99戦無敗の\nメタルマメモンさまだ！\nおまえで100勝目だ！"
text.01b0: "{color:6}{tamer}{color:1}ほどの者が\n逃げるとは思えないな。"
text.0214: "よし、勝負だ\nごめん、またね"
text.0294: "思ったより\nやるじゃないか。"
text.02d4: "相手にとって不足なし！"
text.0306: "いつか必ず勝ってやる！"
text.0372: "メタルマメモンが町に加わった！"
text.03c6: "やっぱりおじけづいたか。\nまあ、もっと根性がついたら\nまた会おう。"
