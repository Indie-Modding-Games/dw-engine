text.0042: "マイオティスモンはいない。"
text.00b2: "うう…肉の冷蔵庫のカギ…？"
text.00f4: " ！ "
text.0102: "だれか助けに来てくれたのか？"
text.013a: "デジモン？だいじょうぶ？"
text.016a: "だれだ？食べ物をくれ！"
text.01a6: "おなかすいたの？なにが欲しい？"
text.01e0: "肉だ。"
text.020c: "肉ならあるよ！"
text.022a: "肉…。"
text.023c: "え？"
text.0252: "肉？ううん、持ってないや。"
text.028e: "これを…。"
text.02a4: "カギ？"
text.02c4: "なにか捨てなきゃ。"
text.0312: "{color:6}冷蔵庫のカギ{color:1}を手に入れた！"
text.0342: "わかった…"
text.0358: "もう時間がない！"
text.038c: "すぐになにか持ってくるよ。\nもう少しがんばって。"
text.03fc: "ふう！"
text.041e: "助かった。本当にありがとう。\n迷惑をかけたな。"
text.0488: "なにがあったの？"
text.04ac: "わたしはマイオティスモン、\nこの館の主だ。"
text.0500: "ぼくは{color:6}{tamer}{color:1}。別の世界から\n来た人間だよ。こっちは\nパートナーの{color:10}{partner}{color:1}だ。"
text.0580: "島を救うために\nここに来たんだ。"
text.05c4: "話すことがたくさん\nありそうだな。歓迎しよう。"
text.0678: "わあっ！"
text.0688: "…"
text.0696: "うそでしょ？"
text.06c6: "消えた。夢でも見てるのかな？"
text.0746: "なんとかなったみたいだ。"
text.078e: "え？"
text.07a6: "ん？なんだ？"
text.07ca: "気を失っていた。すまない。"
text.084e: "アナログマンののろいだ！\n心配いらない、だいじょうぶだ。"
