text.0034: "もぐもぐ。"
text.004e: "あの…"
text.0064: "ねえ、聞いてよ。"
text.008e: "もぐもぐ、うまい。"
text.00b0: "部下が言うことを聞かない。"
text.00f0: "わたしの命令を\n覚えていられないようだ。"
text.014a: "ときには命令の意味さえ\nわからないのだ。"
text.019a: "部下が食事を\n運ぶはずなのだが…"
text.01ea: "うまい…"
text.0202: "研究中に食事が運ばれず、\n食べるのを\n忘れていたのだ。"
text.0294: "仕事に夢中に\nなりすぎだよ。"
text.02e2: "お恥ずかしい。"
text.0310: "館で何か問題が\n起きてるみたいだね。"
text.0366: "島で問題？みんなが\n部下みたいになっているのか？"
text.03da: "うん、みんな\n記憶をなくしかけてるんだ。"
text.042c: "だれかのしわざ\nなのだろうか？"
text.0478: "ふーむ"
text.0488: "わたしに何ができるだろう？"
text.04ac: "デジモンの心をひとつにする\n町を作ってるんだ。"
text.0512: "仲間を探して\n旅をしてるんだ。"
text.055a: "わたしにできること？\n部下たちは\n戦うことしかできん。"
text.05cc: "部下を置いてはいけない。"
text.0604: "そっか…"
text.061c: "考えさせてくれ。\n本当にすまないが…"
text.067e: "また来るね。\nごはんを忘れないでね。"
text.06de: "試合に出てみない？"
text.0712: "試合？ちょうどいい、\n部下の気分転換になる。"
text.0776: "じゃあ、参加する？"
text.07a8: "ああ。だが、ここで\nまだ研究があるのでな。\nすぐに向かおう。"
