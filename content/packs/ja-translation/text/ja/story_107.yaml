text.006a: "この前の地震で\n土と砂が消えちゃった！"
text.00ee: "現在の時刻は\n{num:pstat=105}月{num:pstat=106}日\n{num:pstat=107}時{num:pstat=108}分です。"
text.016e: "{color:10}{partner}{color:1}は\nデータ種のデジモンだよね？"
text.01c6: "{color:10}{partner}{color:1}は\nワクチン種のデジモンだよね？"
text.0224: "{color:10}{partner}{color:1}は\nウィルス種のデジモンだよね？"
text.027c: "わたしはいろいろ役に立つよ。\nなにをしてほしい？"
text.02f2: "能力を変える\n時間を早める\nここをお店にする"
text.038c: "最強にする\n超弱くする\nふつうにする"
text.0416: "1時間進める\n6時間進める\n24時間進める"
