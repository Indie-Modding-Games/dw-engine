text.004c: " {color:6}{tamer}{color:1}と{color:10}{partner}{color:1}\nだな？ボリューム村へ\nよく来てくれた！"
text.00ca: "オタマモンのことでは\nすまなかった。"
text.0122: "気にしないで。"
text.0148: "え？"
text.0168: "感謝しておる。きみたちが\n島を救うために\nがんばっていると聞いた。"
text.0200: "そうなの？"
text.0218: "ずっと力になりたかったのだ。\nここの北にある霧の森へは\nもう行ったか？"
text.02ca: "まだだよ。"
text.02ee: "うん。"
text.02fe: "あそこはいつも霧が深い。\nきみたちが進むのは\nたいへんだろう。"
text.0390: "だが、森の長である\nチェリーモンには\n会っておくべきだ。"
text.041e: "チェリーモン？そんなデジモン\n聞いたことないな。"
text.0482: "霧の森の霧を作っているのは\nチェリーモンなのだ。"
text.04d6: "危険から森を守るために\n霧を作ったのだ。"
text.0548: "だが、わしらには困りものだ。"
text.0594: "チェリーモンは、島の異変の\n原因についてなにか\n知っていると思う。"
text.062e: "霧をこえてでも\n会いに行く価値はある。"
text.0688: "霧をなんとかできれば\nいいんだけど。"
text.06da: "霧を消せるのは\nチェリーモンだけなのだ。"
text.074a: "だが、ぬける方法はある。\nきみたちにまじないをかけよう。"
text.07be: "どうなるの？"
text.07ee: "霧の中でも\n道が見えるようになるのだ。"
text.0860: "それはいいね！"
text.0888: "よし、では始めるぞ。"
text.08b8: "ケロケロ！"
text.08f6: "よし。これで完璧だ。\nさあ、霧の森へ行け。"
text.0974: "会ってきたよ。\nもう霧は晴れたよ。"
text.09ba: "おお、それはすごい！さて\nなにか力になれることは？"
text.0a2a: "よし、これをやろう。"
text.0a6c: "{color:6}デジスズキ{color:1}を\n手に入れた！"
text.0abc: "ほかのものを捨てよう。"
text.0b04: "とてもめずらしいものだ。\nきっと役に立つぞ。"
text.0b72: "ありがとう。じゃあショーグン、\n町に来てくれない？"
text.0bde: "わしはゲコ沼の100匹の\nゲコモンの長なのだ。すまんが\nいっしょには行けない。"
text.0c84: "そのかわり、ここから\nできるかぎりのことをしよう。\nいつでも来るがいい。"
text.0d58: "困っているようだな。\nコスチュームのことだろう？"
text.0dce: "知ってるの？"
text.0dfa: "わしをあなどるでない。\nヌメモンにも着られるぞ。"
text.0e68: "おどろいたか？それだけでなく\nあれを着ると…信じられんぞ…\nまあ、ためしてみるがいい。"
text.0f4e: "ところで、アイテムから\n{color:6}すごい釣りざお {color:1}を\nはずしておくぞ。"
text.0fe0: "特別なアイテムなのだ。"
text.1022: "がんばれよ！"
text.1052: "釣りができるのは\n竜眼湖だけだよ。"
text.10a6: "下がれ、下がれ！"
text.10da: "ショーグンさまはめずらしい\nものを集めている。前は\nアイテムを集めていた。"
text.1154: "でも今は\nデジモンカードにむちゅうだ。"
text.11aa: "めずらしいカードを持ってくると\n功績ポイントを\nくれるぞ。"
text.1222: "カードを集めて功績ポイントを\nためて、アイテムと\n交換できるぞ。{stop}{stop}"
text.12bc: "いや…なんでもない。ケロ。"
text.12fe: "あの…町に行きたいんです。\nケロ！"
text.1362: "いいけど、どうしたの？"
text.1396: "アリーナで戦いたいんです。\nどうもぼくたちゲコモン族は{stop}"
text.142e: "田舎のデジモンだと\nバカにされてるみたいで。ケロ。"
text.1494: "たしかに田舎者だけど\nプライドはあるんです！ケロ。{stop}"
text.1522: "気持ちはわかるよ。じゃあ\nやってみなよ。がんばって！"
text.1582: "ゲコモンがアリーナに参加した！"
