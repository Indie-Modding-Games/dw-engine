"penguinmon_dialogue.0000": " ペンギンモン "
"penguinmon_dialogue.0001": "まずは、カーリングの"
"penguinmon_dialogue.0002": "ストーンを選んでね。"
"penguinmon_dialogue.0004": " ペンギンモン "
"penguinmon_dialogue.0005": "重いの、ふつうの、軽いのが"
"penguinmon_dialogue.0006": "あるから、どの順番で使うか"
"penguinmon_dialogue.0007": "よく考えてね。"
"penguinmon_dialogue.0008": " ペンギンモン "
"penguinmon_dialogue.0009": "ツメが4本あるストーンは"
"penguinmon_dialogue.0010": "止まった所から動かないから"
"penguinmon_dialogue.0011": "すごく役に立つよ。"
"penguinmon_dialogue.0012": " ペンギンモン "
"penguinmon_dialogue.0013": "方向ボタンの左右で"
"penguinmon_dialogue.0014": "投げる方向を"
"penguinmon_dialogue.0015": "決めてね。"
"penguinmon_dialogue.0016": " ペンギンモン "
"penguinmon_dialogue.0017": "上下で画面を動かせるよ。"
"penguinmon_dialogue.0018": "{prompt:confirm}で投げる"
"penguinmon_dialogue.0019": "方向を決めてね。"
"penguinmon_dialogue.0020": " ペンギンモン "
"penguinmon_dialogue.0021": "パワーゲージが好きな所で"
"penguinmon_dialogue.0022": "{prompt:confirm}を押すと"
"penguinmon_dialogue.0023": "投げる強さが決まるよ。"
"penguinmon_dialogue.0024": " ペンギンモン "
"penguinmon_dialogue.0025": "ストーンが止まって"
"penguinmon_dialogue.0026": "GOODマークにさわったら"
"penguinmon_dialogue.0027": "2点だよ。"
"penguinmon_dialogue.0028": " ペンギンモン "
"penguinmon_dialogue.0029": "青い線の上でも、真ん中の"
"penguinmon_dialogue.0030": "GOODマークの外なら"
"penguinmon_dialogue.0031": "1点だよ。"
"penguinmon_dialogue.0032": " ペンギンモン "
"penguinmon_dialogue.0033": "右下のBADにさわったら"
"penguinmon_dialogue.0034": "2点マイナスだから"
"penguinmon_dialogue.0035": "気をつけてね。"
"penguinmon_dialogue.0036": " ペンギンモン "
"penguinmon_dialogue.0037": "それと、引き分けのときは"
"penguinmon_dialogue.0038": "ぼくの勝ち！"
"penguinmon_dialogue.0039": "じゃあ、はじめよう！！"
"penguinmon_dialogue.0040": " ペンギンモン "
"penguinmon_dialogue.0042": "たいしたことないね！"
"penguinmon_dialogue.0044": " ペンギンモン "
"penguinmon_dialogue.0045": "勝負はこれからだよ！"
"penguinmon_dialogue.0048": " ペンギンモン "
"penguinmon_dialogue.0049": "へえ、なかなかやるね！"
"penguinmon_dialogue.0052": " ペンギンモン "
"penguinmon_dialogue.0053": "やった！ぼくの勝ち！"
"penguinmon_dialogue.0056": " ペンギンモン "
"penguinmon_dialogue.0057": "あーあ、負けちゃった。 "
"metalmamemon_dialogue.0000": " メタルマメモン "
"metalmamemon_dialogue.0001": "よし。まずはストーンの"
"metalmamemon_dialogue.0002": "種類を選ぶんだ。"
"metalmamemon_dialogue.0004": " メタルマメモン "
"metalmamemon_dialogue.0005": "オレは天才だから、いろんな"
"metalmamemon_dialogue.0006": "ストーンを正しい順に使える。"
"metalmamemon_dialogue.0007": "それが勝つコツさ。"
"metalmamemon_dialogue.0008": " メタルマメモン "
"metalmamemon_dialogue.0009": "ツメが4本のストーンは"
"metalmamemon_dialogue.0010": "止まった所から動かない。"
"metalmamemon_dialogue.0011": "だから、すごく貴重なんだ。"
"metalmamemon_dialogue.0012": " メタルマメモン "
"metalmamemon_dialogue.0013": "方向ボタンの左右で"
"metalmamemon_dialogue.0014": "投げる方向を"
"metalmamemon_dialogue.0015": "選ぶんだ。"
"metalmamemon_dialogue.0016": " メタルマメモン "
"metalmamemon_dialogue.0017": "方向ボタンの上下で"
"metalmamemon_dialogue.0018": "画面を動かせる。"
"metalmamemon_dialogue.0019": "{prompt:confirm}で投げるぞ。"
"metalmamemon_dialogue.0020": " メタルマメモン "
"metalmamemon_dialogue.0021": "パワーゲージが好きな所で"
"metalmamemon_dialogue.0022": "{prompt:confirm}を押すと "
"metalmamemon_dialogue.0023": "投げる強さが決まる。"
"metalmamemon_dialogue.0024": " メタルマメモン "
"metalmamemon_dialogue.0025": "点数：ストーンが"
"metalmamemon_dialogue.0026": "GOODマークに乗ったら"
"metalmamemon_dialogue.0027": "2点だ。"
"metalmamemon_dialogue.0028": " メタルマメモン "
"metalmamemon_dialogue.0029": "青い線の上でも、真ん中の"
"metalmamemon_dialogue.0030": "GOODマークの外なら"
"metalmamemon_dialogue.0031": "1点だ。"
"metalmamemon_dialogue.0032": " メタルマメモン "
"metalmamemon_dialogue.0033": "右下のBADマークに乗ったら"
"metalmamemon_dialogue.0034": "2点マイナスだから"
"metalmamemon_dialogue.0035": "気をつけな。"
"metalmamemon_dialogue.0036": " メタルマメモン "
"metalmamemon_dialogue.0037": "引き分けならオレの勝ち！"
"metalmamemon_dialogue.0038": "ゲーム開始だ！！"
"metalmamemon_dialogue.0040": " メタルマメモン "
"metalmamemon_dialogue.0041": "オレが勝つ！"
"metalmamemon_dialogue.0044": " メタルマメモン "
"metalmamemon_dialogue.0045": "まだ負けてないぞ！"
"metalmamemon_dialogue.0048": " メタルマメモン "
"metalmamemon_dialogue.0049": "この勝負は負けられない！"
"metalmamemon_dialogue.0052": " メタルマメモン "
"metalmamemon_dialogue.0053": "よし、勝った！"
"metalmamemon_dialogue.0056": " メタルマメモン "
"metalmamemon_dialogue.0057": "あーあ、もう少しだったのに。"
"menu.0000": "ゲーム開始あそびかた"
