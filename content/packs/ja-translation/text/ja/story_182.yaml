text.0056: "ついに着いたぞ。"
text.008c: "おまえがボスか？"
text.00ba: "悪いが、ちがう。\nオレはメタルグレイモンだ！"
text.0114: "おまえは後回しだ！\nどけ！"
text.015e: "どくつもりはない。\nここは通さんぞ。"
text.01c4: "力を温存したい。\nこいつと戦ってもムダだ。"
text.0230: "今行くぞ！覚悟しろ！"
text.0294: "ん？ここはどこだ？"
text.02bc: "正気にもどったんだね！"
text.02f6: "そのようだ…"
text.0316: "やつらを倒したら、\nまた会えるかもな。\nそれまでさらばだ。"
