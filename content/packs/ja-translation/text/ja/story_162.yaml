text.00f8: "ただいま！"
text.0122: "さそってくれてありがとう。\n{color:10}{partner}{color:1}といっしょに\nがんばりたいな。"
text.01c6: "{color:7}テイマーレベルが\n上がった！ {color:1}"
text.020c: "{color:7}おめでとう！\nきみにメダルを\nあげよう。 {color:1}"
text.026c: "マシーンドラモンのカード入手！"
text.0782: "湖の守り神を\n見たことある？"
text.07c8: "まだなら、南側で\n待ってみるといいよ。"
text.083e: "うんと早起きして\n霧の中を歩いてごらん。\nいいことがあるよ！"
text.08de: "北のほうに氷山の浜辺って\n場所があるのを\n知ってる？"
text.0962: "うわさでは、その浜辺に\n大きなデジモンが\nよく現れるんだって。"
text.09f4: "山賊は倒された？\n山賊の一味がいるって\n聞いたんだけど。"
text.0a8c: "大渓谷に行ったことある？"
text.0ac6: "うわさでは、そこに\n山賊がいるんだって。"
text.0b1e: "悪いヤツらなの？"
text.0b4a: "おそってきて物をうばうんだ。"
text.0b86: "なんとかしよう。"
text.0bd8: "大渓谷に行ったことある？"
text.0c12: "うわさでは、そこに\n見えない橋があるんだって。"
text.0c96: "マシーンドラモンが\nもどってきたらしいよ。"
text.0cea: "またマシーンドラモンを\n倒したんだね。"
text.0d2e: "町のまわりのことを\n説明してあげよう。"
text.0d88: "町のまわりは\n原生林だよ。"
text.0dd0: "あのへんのデジモンは\nそんなに強くないよ。"
text.0e2c: "西にはトレーニング\nキャンプがあるよ。"
text.0e7a: "川をわたった東には\n熱帯ジャングルがある。"
text.0ed2: "その先に何があるかは\nわからないなあ。"
text.0f18: "西には\n山と湖があるよ。"
text.0f70: "南へ行くと海があるよ。"
text.0fb4: "北には\n高い山があるよ。"
text.1006: "この町は\n島のまん中にあるんだ。"
text.1058: "うわさを調べておくよ。\nまた聞きに来てね。"
text.10c8: "このへんを見てみよう。"
text.1108: "トイレは好きじゃないけど、\nほかは問題なさそう！"
text.117e: "ずいぶんにぎやかですね。"
text.11b2: "ファクトリアルタウンに\n帰らなくていいんですか？"
text.120c: "スケジュール機能は\n正常です。問題ありません。"
text.1282: "ちょうどいいところに来た！"
text.12be: "この彫刻を見てくれ！\nどう思う？"
text.1318: "なんという傑作。\nわれながら感心する。"
text.1364: "どういう意味だ？\nバカにしてるのか！"
text.13be: "何の話だったかな？\nまあ、いいか。"
text.141e: "わたしはどんなイメージを\nもっていたんだろう？\nわかったら教えてくれ。"
text.14e2: "ねている…"
text.1516: "聞いた？熱帯ジャングルに\nふしぎな植物が\n生えてるんだって。"
text.15b2: "そうそう、"
text.15c8: "{color:6}雨の草{color:1}を\nそこに植えたんだ。"
text.1618: "毎年15日ごろに\n実がなるんだ。\n持っていっていいよ。"
text.16a4: "何のために？"
text.16cc: "ああ、気持ちいい！\nお日さまの光。"
text.170e: "ああ、気持ちいい！\nお日さまの光。"
text.1766: "よし、これはいい！"
text.17be: "おや、これは…"
text.17f6: "アイテムがいっぱいです。"
text.1822: "{color:6}雨の草の実{color:1}を\n手に入れた！"
text.1902: "海へつれて行ってあげる。\nそれがぼくの仕事さ。"
text.195c: "海からしか行けない場所へ\nつれて行ってあげるよ。"
text.19c8: "それじゃあ…"
text.19ea: "うーん、どこへ行こう？\nファクトリアルタウンか\n浜辺の洞窟かな。"
text.1a6c: "ファクトリアルタウン\n浜辺の秘密洞窟\nどこにも行かない"
text.1b5a: "見つけたぞ！"
text.1b88: "うわっ、こっちに\nまっすぐ向かってくる！"
text.1be2: "やっと会えたな！\nオレはグレイモン。\nさあ、勝負をつけようぜ！"
text.1c62: "なんだって！？"
text.1c76: "おまえのうわさを追って\nここまで来たんだ。\nおまえと戦いたい！"
text.1d00: "オレが勝ったら、\nこの道しるべをもらうぜ！"
text.1d54: "道しるべなんてないよ。"
text.1d7c: "かまうもんか、\nとにかく勝負だ！"
text.1e08: "おまえら、やるな！\nだが目標を果たすには、\nまだまだ未熟だ。"
text.1ea6: "うーん"
text.1eb6: "オレがここに残って\nきたえてやる。強くなれるぜ！"
text.1f56: "グレイモンが町の仲間になった！"
text.200c: "よし、見つけたぞ、{color:6}{tamer}{color:1}！"
text.2048: "待ちぶせだ！"
text.205e: "目的はおまえを倒すこと。"
text.2094: "あの目！きっと\nあやつられてるんだ！"
text.2126: "どんなことをしてでも、\nこいつを倒さなければ。"
text.218c: "何を言ってるんだ？\n治療してもらわなきゃ。"
