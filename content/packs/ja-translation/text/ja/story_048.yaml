text.004e: "あっ！"
text.006a: "あっ！"
text.0096: "エレベーターのせいで\n地面が上がってるのかな？"
text.0102: "乗る\n乗らない"
text.0190: "おい！"
text.01b0: "なんだ？"
text.01c0: "また負けに来たのか？"
text.0208: "それはこっちのセリフだ！"
text.0232: "今度は手加減しないぞ。\n泣かせてやる！"
text.02d6: "うわっ！"
text.02e6: "しまった！"
text.0312: "くそっ！"
text.03b6: "どうした？"
text.0460: "じゃあな、マヌケども！"
text.0496: "くそっ、逃げられた！"
text.04de: "脱出用のエレベーターがある。\n追いかけてもムダだな。"
text.05a8: "だれだ？"
text.05c8: "だれかって？そっちこそだれだ？"
text.0672: "{color:4}次元キーホルダー{color:1}を\n手に入れた！\nアイテムを20個持てる！"
text.0722: "{color:4}次元キーホルダー{color:1}を\n手に入れた！\nアイテムを30個持てる！"
