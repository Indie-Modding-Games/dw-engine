text.0028: "うぐっ！"
text.0060: "なに？"
text.007e: "なにっ！？"
text.009e: "親分、たいへんです！"
text.00e2: "ここでなにをしてるんだ？"
text.011e: "やるじゃないか。新オーガの砦を\n見つけるとはな！"
text.018c: "また悪さをするつもり？"
text.01d0: "当たり前だ！ヘヘッ！"
text.01fa: "そんなことはさせない！\nこの洞窟から\n出ていけ！"
text.0278: "今度はちがうぞ！"
text.02c0: "親分、あれですか？"
text.02ee: "そうだ。行け！"
text.033c: "なんだ！？"
text.0360: "ワルシードラモンさま！\nやっちゃってください！"
text.03ca: "そいつが用心棒ってわけか。"
text.040c: "ヘッヘッヘ！おまえも終わりだ！"
text.0490: "くそっ！"
text.04a2: "うわあああ！"
text.04c6: "逃がさないぞ！"
