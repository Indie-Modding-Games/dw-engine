text.0076: "おお、ほんとに助かったよ！"
text.00a6: "なんだ？やる気か？"
text.00f4: "おお、ありがとな！"
text.0120: "ほっとけ！"
text.0154: "無理するなよ！"
text.0186: "勝負だ、小僧！"
text.01c0: "まいった！"
text.01de: "ボスがいなくなった。"
text.0262: "おい、おまえら、ここを\n通りたけりゃ、持ち物を\nぜんぶ置いていきな！{stop}"
text.02ec: "ひさしぶりだな。"
text.0316: "むむ。またおまえらか！"
text.0346: "それはこっちのセリフだ！\n見つけるのはカンタンだったぜ。\n負ける準備はいいか？"
text.03c6: "負ける？まさか！\nオレが本気を出したら\nどうなるか見せてやる！"
text.0444: "今日こそ決着を\nつけてやる！"
text.04de: "なんで…勝てないんだ？"
text.0520: "どうしたの？\n逃げないの？"
text.0578: "もうヘトヘトだ。"
text.059c: "…"
text.05aa: "この島はもうおしまいだと\n思って山賊になったんだ。\n好き勝手やってたのさ。"
text.0654: "島がピンチなのは\n知ってたの？"
text.06aa: "ああ。そこへおまえらが\n現れた。今さら手を貸す\nなんてバカみたいだろ。"
text.0742: "そんなことないよ。\n町においでよ。"
text.0794: "いや、無理だ。それに、オレの\nやったことを許してくれる\nやつなんていないさ。"
text.083e: "もう、だまって\nいっしょに来て！"
text.089c: "きみだって役に立てるよ！\nみんな、なにかできる\nことがあるんだ！"
text.090c: "おおっ！！"
text.0922: "この島は救えるのか？\nおまえらが救って\nくれるんだよな！？"
text.09ba: "もちろん！町の場所は\nわかるよね？"
text.0a1c: "うおおおお！\nすぐ行くぜ！"
text.0a84: "オーガモンが町の仲間になった！"
text.0ad6: "おっと！\n出口はこっちじゃない！"
text.0b32: "しまった！土の箱を\nドリモゲモンに返さなきゃ！"
text.0be6: "おっと！出口はこっちじゃない！"
text.0c42: "しまった！土の箱を\nドリモゲモンに返さなきゃ！"
