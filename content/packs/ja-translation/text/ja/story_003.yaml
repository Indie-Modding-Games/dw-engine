text.0062: "あっち行け！"
text.008a: "消えろ！"
text.00b2: "それはわたしのよ！"
text.00dc: "取った！"
text.0114: "{color:7}? ? ? {color:1}\n…"
text.013c: "{color:7}? ? ? {color:1}。花よ。"
text.0172: "{color:7}? ? ? {color:1}\nわたしは花よ。"
text.01ae: "{color:7}? ? ? {color:1}\n花だって言ってるでしょ！\n聞いてるの！？"
text.0262: "戦うのはきらい。"
text.028e: "それなら、\n町においでよ。"
text.02d6: "あそこは平和だよ。"
text.030a: "町？"
text.0322: "楽しそうね。\nわたしはパルモン。\nきっと役に立つわよ！"
text.03cc: "パルモンが町の仲間になった！"
