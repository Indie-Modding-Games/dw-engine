text.005c: "マイオティスモン！どうしたの？"
text.00b0: "バッケ！"
text.00c6: "…"
text.00ea: "わたしもアリーナに加わろう。\n部下がさびしがるかもしれん。"
text.0172: "部下たちは言うことを聞かん。\nスカルグレイモンを連れていく。"
text.01d8: "スカルグレイモンは前とちがう。\n今はほかの者の言うことを聞く。"
text.024e: "マイオティスモン、平気？"
text.02a8: "うう…きみか！\nまた助けてもらったな。"
text.0306: "なにがあったの？"
text.032a: "デビモンを見なかったか？"
text.035e: "見たよ。いやなやつだった。"
text.038a: "あいつが悪の力で\nわたしの研究をだめにしたのだ。"
text.03da: "スカルグレイモンの\n研究のこと？"
text.0422: "骨を集めて\n組み立てていたのだ。\nこれからは気をつけよう。"
text.04b8: "あのデビモンはひどいやつだ。"
text.04ec: "あいつのことはよく知っている。"
text.0514: "えっ！？"
text.0528: "昔からずる賢かったが、\nここまでひどくはなかった。"
text.0580: "だれかにあやつられて\nいるのかもしれん。"
text.05d8: "そうかも。"
text.05ec: "元のあいつなら、\nきみたちの仲間になれただろう。"
