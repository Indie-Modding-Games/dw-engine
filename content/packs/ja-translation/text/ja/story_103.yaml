text.0020: "ここでのトレーニングは\nもうあきた。どうしよう？"
text.0082: "どうしよう？"
text.00a0: "どこでトレーニングしてるの？"
text.00da: "あれはトレーニング場？"
text.0116: "トレーニングはもうあきた。\n本物のバトルがしたい。"
text.0180: "トレーニング場かも\nアリーナかも"
text.01ee: "トレーニングはもうあきた。\n本物のバトルがしたい。"
text.0258: "そこに行きたい。\nそこできたえるよ。"
text.02e2: "カブテリモンが\n町の仲間になった！"
text.032a: "昆虫戦士大会は\n毎年ここで\n開かれるんだ…"
text.03ae: "…毎年22日にね。\n優勝者はすごい賞品をもらえる！"
text.0422: "でも出られるのは\n昆虫型デジモンだけ。"
text.0480: "カブテリモン、\nクラゲモン、クネモン、\nそれにもう1匹の昆虫型。"
text.0508: "でも、ヌメモンはいない。"
text.052e: "毎年22日に、\n昆虫戦士大会が\n開かれるんだ。"
text.05ce: "前に優勝したことあるよね？"
text.060a: "カブテリモン、\nクラゲモン、クネモン、\nそれにもう1匹の昆虫型。"
text.0692: "ヘラクレスカブテリモンだ。"
text.06ce: "ヘラクレスカブテリモンは\nすごく強いんだ。"
text.071e: "大会の優勝者は\nヘラクレスカブテリモンになれて\nアイテムももらえる。"
text.07a6: "昆虫戦士大会には\n何度でも出られるよ。"
text.0824: "きみは強い。\n教えることはなにもないな。"
text.0886: "技の研究をしているんだ。\nむずかしい技を習得するのは\n大変なんだよ。"
text.091a: "能力があれば、\n技を習得できるかもしれない。\nむずかしい技に挑戦する？"
text.09c8: "もちろん！\nやめておく"
text.0a06: "じゃあ、やってみよう。"
text.0a3e: "防御力が足りないね。\nもっときたえて。"
text.0aa0: "素早さが足りないね。\nもっときたえて。"
text.0aee: "HPが足りないね。\nもっときたえて。"
text.0b2a: "技を習得した。"
text.0b64: "「虫の大群」を習得した！"
text.0bb4: "{color:5}トレーニング：岩押し {color:1}"
text.0bec: "はじめる\n説明\nやめる"
text.0c22: "ふつう\nボーナス\nやめる"
text.0c5e: "岩を押して力をつけます。\n最大HPが\n大きく上がります。"
text.0ce4: "もう一度説明\nはじめる\nやめる"
text.0d3e: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}ボタンで\n絵を3つそろえよう。"
text.0dc0: "{color:5}トレーニング：打ちこみ {color:1}"
text.0df0: "はじめる\n説明\nやめる"
text.0e28: "ふつう\nボーナス\nやめる"
text.0e66: "人形を全力で打ちこみます。\n攻撃力が\n大きく上がります。"
text.0efc: "もう一度説明\nはじめる\nやめる"
text.0f56: "{color:7}スロットゲーム {color:1}\n{color:6}△ {color:1}ボタンで\n絵を3つそろえよう。"
