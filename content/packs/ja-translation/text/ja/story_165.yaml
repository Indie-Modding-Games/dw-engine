text.0060: "ちょうどいいところに\n来てくれた！おぬしにしか\n頼めん大事な話があるんじゃ。"
text.010c: "なあに？"
text.012a: "アナログマンや\nマシーンドラモンから感じた\nのと同じ悪の気配じゃ。"
text.01a6: "じゃが、どこから来るのか\nわからんのじゃ。"
text.01fe: "わかった、まかせて！"
text.0236: "ありがとう。ところで…"
text.0282: "マシーンドラモンを\n倒したそうじゃのう！"
text.02d2: "うん、でもよくわからない。\nまるでアナログマンの\nのろいみたいだった。"
text.035a: "やつの恨みは強かった。\nこれで平和になるかのう。"
text.03ce: "マシーンドラモンがもどっても\nまた倒してみせるよ。"
text.0436: "おぬしはたのもしいのう。\nほれ、お礼のしるしじゃ。\nわしらの肉畑でとれたんじゃ。"
text.04d8: "わあ！{color:6}チェーン\nメロン{color:1}だ！"
text.0530: "アイテムがいっぱいだ。"
text.0570: "喜んでもらうよ、ありがとう！"
text.05c8: "おお、もどったか！\nこれはほかの者には\n頼めんことなんじゃ。"
text.0648: "わかった。アナログマンが\nもどってきたってこと？"
text.0698: "やつの悪の気配はするが、\nどこにおるのかわからん。"
text.06fc: "わかった、まかせて！\nぼくが見つけ出して\nなんとかするよ。"
text.0780: "おお、ありがとう。ところで…"
text.0800: "目がさめたか。すまんのう。"
text.086a: "この機械は何？"
text.08a6: "それは{color:4}メモリーカード\n対戦データの\nセーブ装置{color:1}じゃ。"
text.0914: "その機械を使えば、\n今のパートナーのデータを\n対戦用にセーブできるんじゃ。"
text.09aa: "{color:6}△ {color:1}を押すだけで、\nあとは機械が\nやり方を教えてくれるぞ。"
text.0a4e: "{color:4}メモリーカード対戦\nデータのセーブ装置{color:1}を\n使いますか？"
text.0ace: "はい\nいいえ"
text.0b04: "ユラモンが、また\nうわさを集めたようじゃ。"
text.0b78: "ユラモンが新しい\nうわさを知っておるそうじゃ。"
text.0bda: "わしらが来てから、\n町は大きくなって\n変わりはじめておる。"
text.0c5a: "{color:6}{tamer}{color:1}の冒険の\nやり方は、ずいぶん\n変わっておるのう。"
