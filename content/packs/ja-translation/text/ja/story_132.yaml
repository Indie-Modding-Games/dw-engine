text.0028: "ここはどこ？\n夢かな？"
text.008c: "わっ！きみはだれ？\n{color:10}{partner}{color:1}はどこ？"
text.00e2: "落ち着いて。わたしは\nフリジモン。ここはわたしの家。\n氷雪のデジモンだよ。"
text.017c: "雪の中で気を失ってたんだ。\nわたしが運んで\n手当てしてあげたんだよ。"
text.0218: "あっ、{color:10}{partner}{color:1}。\n無事でよかった！"
text.025c: "ちょっと、聞いてる？\nわたしが見つけなかったら\n今ごろ命はなかったよ！"
text.02f6: "あ、ごめん。ありがとう。"
text.033e: "ねえ、{color:10}{partner}{color:1}、\n急にたおれるから\n頭まで打っちゃったよ。"
text.03be: "{digimon:pstat=103}は寒さに弱いんだ。\nむちゃしすぎだよ。\n全部きみのせいだよ。"
text.0452: "知らなかった。\nごめんね、{color:10}{partner}{color:1}。"
text.049e: "ありがとう、フリジモン。\nもうひとつお願いしていい？"
text.0504: "また{digimon:pstat=103}が\nたおれたらどうするの？\n早く帰ったほうがいいよ！"
text.058e: "わかった、わかった。\n{color:10}{partner}{color:1}をほかのデジモンに\n進化させるよ。"
text.062c: "進化？"
text.06c8: "また会ったね。"
text.06e8: "あのほかの\nデジモンはどうしたの？"
text.0732: "ああ、同じデジモンだよ。"
text.076a: "え？そうなの？\nよくわからないな。"
text.07bc: "お願いがあって来たんだ。\n町に来て\nほしいんだけど。"
text.0850: "わたしになにかいいことある？\nおもしろいこととか？"
text.08b6: "そうだね、好きなお店を\n開けるよ。"
text.0914: "わあ、ずっとやりたかったんだ。\nよし、行くよ！"
text.0980: "よかった。\nじゃあ、さっそく行こう。"
text.09d8: "お店だ！かき氷に\nアイスクリーム。\nこれは楽しみだ！"
text.0a94: "フリジモンが町の仲間になった！"
text.0ad6: "あのデジモンは\n寒さに弱いんだね！"
text.0b36: "また来るよ！"
