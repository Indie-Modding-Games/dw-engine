text.004c: "わたしのレストランへようこそ。"
text.0084: "このレストランの店長兼\nシェフになったんだ。"
text.00fc: "わたしの炎の料理を\n好きなだけ味わってくれ。"
text.0178: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}、\nわたしの手料理を食べないか？"
text.01ce: "拾ったアイテムとはちがう、\n本物の料理だぞ。わたしの\nかくれた才能さ。"
text.0274: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}！\n料理で生きていくことに\n決めたんだ。腕はいいぞ！"
text.02f2: "たまにはわたしの店で\nゆっくり食べていってくれ。"
text.037a: "C???NC?? , C???MC?? .\nやっと店をオープンしたぞ！"
text.03e6: "冷たいデザートを食べてみて！\nわたしの得意料理なんだ。"
text.045c: "{color:6}{tamer}{color:1}、わたし\nこのレストランでシェフとして\n働くことにしたの。"
text.04d0: "ここで温かいごはんを食べてね。"
text.051e: "よし！\n{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}\nおれは料理人になったぞ！"
text.0566: "おれの料理は、ほかの\nどこで食べるよりうまいぞ。\n食べてみな！"
text.061a: "{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}！\n料理に一生を\nささげることにしたぞ！"
text.067e: "おれの特製手料理は\nとても体にいいんだ！料理\nしてるときに来てくれよ。"
text.0734: "やあ！  {color:6}{tamer}{color:1}、{color:10}{partner}{color:1}！"
text.0758: "このレストランを\n手伝うことにしたんだ。\nデザートを任されてるの。"
text.07d6: "デザートには\n自信があるんだ。\nぜったい食べてみてね！"
