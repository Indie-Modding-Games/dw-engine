text.0042: "これにちがいない！\nどう見ても、\nただのいん石だけど。"
text.00d8: "割って調べる\nそのままにする"
text.0130: "うーん"
text.0146: "ただの古い\nいん石に見えるなあ。"
text.019c: "{color:7}???モン {color:1}\nただの古ぼけた石で\n悪かったな。"
text.0202: "わあっ！"
text.0212: "デジモンだったの！？\nきみはだれ？"
text.0264: "{color:7}???モン {color:1}\nオイラはメテオモンだ。"
text.02aa: "島の危機について\nなにか知らない？"
text.02fe: "なにも知らないよ！"
text.0324: "なにも知らないって！？\nなにかかくしてない？"
text.039c: "失礼なやつだな！よし！\nどっちが正しいか\nバトルで決めようぜ！"
text.041e: "いいよ！受けて立つ。"
text.0488: "まいった。おまえ、強いな。"
text.04c8: "なんでもいいから、\n島の危機について教えて。"
text.0542: "オイラ、生まれたばかりだから\nなにも知らないんだ！"
text.059e: "えっ！？"
text.05ba: "いん石族は空で生まれて\n地上に落ちてくるんだ。"
text.064a: "それから長いあいだねむる。\nほんとはもっとねむってる\nはずだったんだけど…"
text.06fa: "ここは時間がずっと速いからね。"
text.0738: "たぶんな。とにかく、オイラは\n島を見てまわるよ。\nじゃあな！{stop}"
text.07f4: "手がかりはなかった。\n早く出よう。"
text.086a: "調べてみたけど、\nなにもわからない。\n割ってみよう！"
text.08f8: "{color:7}???モン {color:1}\nなにしてんだ、おまえ！\nこの乱暴者め！"
text.0998: "え？だれ！？"
text.09c4: "オイラ？そっちこそだれだ！？"
text.0a70: "{color:4}次元キーホルダー{color:1}を\n手に入れた。\nアイテムを20個持てる！"
text.0b20: "{color:4}次元キーホルダー{color:1}を\n手に入れた。\nアイテムを30個持てる！"
