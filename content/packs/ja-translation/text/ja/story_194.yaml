text.0066: "たあー"
text.0084: "あやまろうよ。"
text.00ce: "許せば心も救われる。"
text.011c: "おまえは悪者か？"
text.014c: "ついてこい。そうすれば…"
text.0194: "ハッハッハ！"
text.01bc: "おまえ！"
text.01cc: "おまえの負けだ！"
text.0220: "あいつに洗脳されて\nいたなんて。"
text.027c: "あいつは強い。\n勝てるのか？\nなぜそこまでするんだ？"
text.02f4: "島のために戦うよ。\n今ここで決着をつけよう。"
text.035c: "支配者なんていらない。\nきみだけが希望なんだ。"
