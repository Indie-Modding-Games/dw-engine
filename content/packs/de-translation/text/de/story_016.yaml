text.0048: "Gruun."
text.005a: "Gruun.ru.ru.."
text.007e: "Etwas ist wieder lebendig!"
text.00ce: " ? "
text.00dc: "Früher lebte ich in der Stadt.\nDu riechst nach der Stadt."
text.0156: "Wow!"
text.0166: "Es ist unheimlich. Ich ging\nfort und vergaß alles."
text.01ca: "Aber dank dir weiß ich\njetzt wieder alles."
text.022a: "Ich gehe zurück in die Stadt,\nOK?"
text.0274: "Klar. Die Stadt ist jetzt\nsicher viel lebhafter\nals früher."
text.02f8: "Wirklich? Super!\nIch gebe mein Bestes!"
text.037c: "Betamon zieht in die Stadt!"
text.03c2: "Das ist mein Revier!"
text.0402: "Hehehe. Na gut!"
text.043c: "Pass nur auf!"
