text.0020: "Willkommen zurück, {color:6}{tamer}{color:1}."
text.004c: "Ich bin Jijimons Chronist."
text.008a: "Ich schreibe Jijimons Wissen\nauf und gebe es dir weiter."
text.00e8: "Wenn du nicht weiterweißt,\nfrag mich, und ich sag dir,\nwohin du gehen sollst."
text.0184: "Alle Digimon sind in der\nStadt versammelt.\nVielen, vielen Dank!"
text.0208: "Ich sag dir, was ich weiß.\nMal sehen..."
text.0266: "Und dann..."
text.0288: "Und außerdem..."
text.0300: "Pflanzen-Digimon leben im\nWald. Je näher sie sind,\ndesto schwerer sieht man sie."
text.03e6: "Insekten-Digimon mögen\nGrün. So wie das rund\num die Stadt..."
text.04a6: "Im Tropendschungel gibt es\neinen Wald wie ein Labyrinth.\nEin starkes Digimon wacht da."
text.0578: "Ein alter Hase im Fluss\nwartet auf jemanden."
text.0616: "Ein Digimon liebt Ufer\nmit warmem Wasser."
text.06b0: "Auf Friedhöfen gibt's Geister.\nSie reden gern mit dir."
text.0752: "Im Blumenbeet der Stadt liegt\nein Geheimnis. Frag eine\nPflanze nach einer anderen."
text.0828: "Die Urzeit-Dinoregion ist\ngefährlich, aber es lohnt\nsich, sie zu erkunden."
text.08ec: "Im Panoramaberg fließt\nLava. Manche Digimon\nlieben die Hitze."
text.09a4: "Ein Hitze liebendes Digimon\nin die Kälte zu bringen, ist\ngegen die Regeln, aber..."
text.0a88: "Im Frostland gibt es viele\nDigimon, die mitkommen.\nGeh nach Westen."
text.0b58: "Auf dem Gipfel am Großen\nCanyon lebt ein Vogel-Digimon."
text.0bf8: "Der Große Canyon ist wie\nein Labyrinth. Bist du drin,\nkommst du schwer raus."
text.0cb0: "In der Zahnradsavanne\nlebt ein Digimon, das\nStrom über alles liebt."
text.0d60: "Im Nebelwald zeigt sich\nmanchmal ein Frühaufsteher."
text.0e02: "Im Großen Canyon\ngibt es einen Laden,\nden ein Digimon führt."
text.0ea6: "Vielleicht triffst du ein\nDigimon, das den Panoramaberg\nmit einem Flügelschlag quert."
text.0f84: "Die Zahnradsavanne passt zu\nDigimon, die nicht hoch\nfliegen. Such mal dort."
text.104e: "Manche Digimon kennen dich\nund fordern dich heraus."
text.10ee: "Im Frostland gibt es\nDigimon, die in Höhlen leben\nund andere hereinbitten."
text.11be: "Frag fleißige Digimon, ob sie\nin die Stadt kommen, wenn\nihre Arbeit getan ist."
text.12a2: "Der Nebelwald ist ideal zum\nVerstecken. Du sollst auch\nversteckte Digimon führen."
text.137c: "Wenn sich Gerüchte über dich\nverbreiten, komm wieder."
text.141e: "An der Küste vom Frostland\nzeigt sich ein Riesenschatten.\nVielleicht ein Digimon."
text.14f6: "Hilf Digimon, die gern\nDinge sammeln. Versuch\nes mal im Frostland."
text.15b6: "Auf dem Panoramaberg fordert\ndich ein Digimon zum Kampf,\nwenn du es siehst."
text.1694: "Auch an feuchten Orten wie\nder Kanalisation gibt es\nDigimon. Hilf ihnen."
text.176c: "Hinter dem Drachenaugensee\nleben Insekten-Digimon.\nGeh dort angeln."
text.1832: "Geht ein Androiden-Digimon\nkaputt, repariert es sich\nschnell und vollständig."
text.18fa: "Wenn du Gefahr fürchtest,\nverlierst du dein Ziel."
text.1966: "Sei mutig genug, wenigstens\neinmal eine gefährliche\nKlippe zu erklimmen."
text.1a36: "Hör gut zu, wenn man in der\nStadt von jemandem erzählt,\nder Hilfe braucht."
text.1afc: "Ein fieser Kerl ist neulich\nin eine belebte Gegend\ngezogen. Ob das wohl..."
text.1be0: "Angeblich liegt irgendwo eine\nalte Steintafel vergraben.\nJemand muss sie ausgraben."
text.1ca8: "Ein seltenes Digimon taucht\nim Dschungel auf und fordert\nandere zum Kampf."
text.1d68: "Vielleicht leben Digimon\nin Bäumen, aber wer weiß?"
text.1e16: "In einer Eisenstadt im Westen\nkann ein seltenes Digimon\nauftauchen und herausfordern."
text.1efa: "Es gibt ein Alien-Digimon.\nVielleicht triffst du es mal."
text.1f9e: "Es gibt ein Digimon, das ein\nFabeltier ist. Es wohnt in\neinem Haus ohne Besitzer."
text.2076: "Such weiter nach Nanimon,\nbis du den echten\nSchatz hast."
text.2136: "Myotismon ist verschwunden.\nFolge den Spuren in\nseiner Villa."
text.21f0: "Es gibt noch unbekannte\nDigimon, aber erledige erst\ndas Wichtigste!"
text.22c4: "Das letzte Digimon wird am\nletzten Ort geboren, an den\ndu gehst. Verstehst du das?"
