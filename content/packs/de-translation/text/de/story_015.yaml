text.006c: "Bist du ein Digimon?"
text.00a6: "Wo kommst du her, Kumpel?!"
text.00e8: "Lach mich nicht aus!"
text.0128: "Ich verschling dich!"
text.01a4: "Oh nein, wenn ich nichts\ntue, vertrocknet sie..."
text.020a: "Hoffentlich regnet es..."
text.023e: "Wow, interessant.\nSie keimt."
text.0294: "Sie hat sich etwas bewegt.\nIst das die geheimnisvolle\nPflanze, von der alle reden?"
text.0340: "Sie welkt. Wenn ich nichts\ntue, geht sie ein."
text.03ac: "Willst du Items benutzen?"
text.03de: "Ja\nNein"
text.0410: "Ich hab gerade nichts."
text.045c: "Nichts davon hilft hier."
text.04ae: "Das klappt nicht..."
text.0800: "Hehehe."
text.0818: "He, ich bin Vegiemon!"
text.084c: "Was! Ein Pflanzen-Digimon?"
text.0880: "Übrigens, magst du\nGemüse?"
text.08d4: "Warum fragst du mich nach\nGemüse? Na?"
text.0932: "Ich mag es\nIch mag es nicht"
text.0966: "Ich hab's mir anders überlegt."
text.09a8: "Wer Gemüse mag, muss\nein netter Kerl sein."
text.0a14: "Nein, nein!\nGemüse ist gut!"
text.0a52: " ? ? ? "
text.0a68: "Gut, ich hab mich entschieden.\nIch komme mit dir!"
text.0acc: "So ein hartnäckiger Kerl...\nHe, warte!"
text.0b1e: "Na, dann komme ich eben nicht!\nTschüss!"
text.0b60: "Entscheide dich endlich!"
text.0b8c: "Was soll ich denn tun?"
text.0bd0: "Komm doch in die Stadt\nund hilf uns!"
text.0c36: "Okay, klingt gut. Ich bin\nschon viel zu lange hier."
text.0cea: "Vegiemon zieht in die Stadt!"
