text.0064: "Das ist der letzte."
text.00a2: "Endlich sind wir da!"
text.00e0: "Der Weg ist frei!"
text.0118: "Machen wir's uns leicht."
text.0154: "Das ist die letzte Chance!"
text.019a: "Gehst du wirklich?"
text.01f0: "Wie unheimlich! Das spüre\nich bis in die Knochen."
text.023a: "..."
text.0248: "Warum greift er mich nicht an?"
text.0282: "..."
text.0290: "Musst du nicht kämpfen?"
text.02c8: "Wir sollten uns beeilen. Wir\nmüssen unser Können testen."
text.0348: "Los geht's, {color:10}{partner}{color:1}!"
text.039c: "..."
text.03de: "Haben wir gewonnen?"
