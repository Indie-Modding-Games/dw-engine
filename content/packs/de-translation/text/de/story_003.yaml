text.0062: "Hau ab!"
text.008a: "Verschwinde!"
text.00b2: "Das gehört mir!"
text.00dc: "Hab ich!"
text.0114: "{color:7}? ? ? {color:1}\n..."
text.013c: "{color:7}? ? ? {color:1}. Eine Blume."
text.0172: "{color:7}? ? ? {color:1}\nIch bin eine Blume."
text.01ae: "{color:7}? ? ? {color:1}\nIch sagte, ich bin eine\nBlume! Hörst du nicht zu!?"
text.0262: "Ich hasse Kämpfe."
text.028e: "Dann komm doch\nin die Stadt."
text.02d6: "Dort ist es friedlich."
text.030a: "Die Stadt?"
text.0322: "Klingt lustig.\nIch bin Palmon.\nIch werde dir nützlich sein!"
text.03cc: "Palmon zieht in die Stadt!"
