text.0a4a: "Keine Panik. Wir sind\nnicht die Bösen."
text.0aac: "Bist du der berüchtigte\nDigimon-Entführer?"
text.0b02: "Ich glaube, alle haben\nda etwas falsch verstanden."
text.0b5e: "{color:6}{tamer}{color:1} versuchte,\nes zu erklären."
text.0ba0: "Verstehe. Mein Fehler."
text.0bd6: "Ich gehe in die Stadt."
text.0c66: "Biyomon zieht in die Stadt!"
text.0cc4: "Fang mich doch!"
text.0cfa: "Du bist mutig!"
text.0d2a: "Wow!"
text.0d48: "Ich zuerst!"
text.0d72: "Ich bin stark.\nMit mir wirst du nicht fertig!"
text.0dc8: "Gewinne ich, sei nicht sauer."
