text.005a: "Dieses Kostüm wirkt anders\nals die anderen. Es hat eine\nüberwältigende Ausstrahlung."
text.0130: "Hinten ist ein Reißverschluss."
text.018e: "Was ist los, {color:10}{partner}{color:1}?!"
text.01d4: "Was? Bist du ein anderes\nDigimon geworden?\nSieht irgendwie gut aus."
text.0250: " {color:10}{partner}{color:1},\nwillst du reinschlüpfen?"
text.02ae: "Das geht nicht, {color:10}{partner}{color:1}.\nNur wer gelenkig und\nglitschig ist, kommt rein."
