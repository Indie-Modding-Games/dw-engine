"text.002a": "Ich weiß viel über Items."
"text.0056": "Es gibt hundertachtundzwanzig\nArten von Items."
"text.00d0": "Zweiunddreißig sind Essen."
"text.00fe": "Seltene Items wachsen in\nmanchen Gegenden von selbst,\nin anderen gibt es sie nicht."
"text.018e": "Zum Beispiel findest du\neinen Blauen Apfel im\nHeimatwald."
"text.0204": "Diese Speisen haben besondere\nWirkungen, also achte darauf,\nwann du sie isst."
"text.02b8": "Jetzt erzähle ich dir\nvon Digievolutions-Items."
"text.030c": "Digievolutions-Items lassen\nDigimon digievolvieren, wie\nder Name schon sagt."
"text.0392": "Es gibt viele verschiedene\nDigievolutions-Items."
"text.0402": "Jede Sorte lässt ein Digimon\nzu einer anderen Art\nDigimon digievolvieren."
"text.0494": "Benutzt du zum Beispiel\nGraue Klauen, wird das\nDigimon zu Greymon."
"text.0528": "Digievolutions-Items sind\nlegendär, und manche gibt\nes nur ein einziges Mal."
"text.05b2": "Aber manchmal bekommst du\nkeinen Bonus wie bei einer\nnormalen Digievolution."
"text.0654": "Außerdem sinkt das Glück,\nalso sind sie nicht perfekt."
"text.06ca": "Trotzdem ist es schön, zu\ngenau dem Digimon zu werden,\ndas man sein will."
"text.0772": "Du kannst nur von der Stufe\ndirekt vor dem Digimon\ndigievolvieren, das du willst."
"text.081a": "Also sei vorsichtig."
"text.087c": "Hey! Hola amigos!"
"text.08a4": "Was für ein Laden ist das?\nMein Laden?\nKauf bitte etwas."
"text.0942": "Schau, {color:6}{tamer}{color:1}! Mein Laden\nverkauft spannende Sachen.\nKomm oft vorbei!"
"text.09f6": "Was du hier siehst, ist\nnichts Gewöhnliches,\nalso kauf ruhig ein!"
"text.0a9c": "Hallo, Fremder! Ich wusste,\ndass du kommst, {color:6}{tamer}{color:1}.\nGuck nicht so überrascht."
"text.0b1c": "Meisterst du meine Items?\nDas hängt von deinem\nKönnen als Bändiger ab."
"text.0be2": "Wo ich bin?\nIch liebe dunkle Orte, und\ndieser Laden zeigt das gut!"
"text.0c88": "Gut, {color:6}{tamer}{color:1}, danke fürs\nKommen. Wo du schon da bist,\nkauf doch etwas!"
"text.0d48": "Hey, {color:6}{tamer}{color:1}. Da bist du ja!\nLos, nimm ein paar meiner\nsehr nützlichen Items."
"text.0dec": "Hallo, Fremder!\nIch wusste, du kommst, {color:6}{tamer}{color:1}.\nGuck nicht so überrascht."
"text.0e6c": "Meisterst du meine Items?\nDas hängt von deinem\nKönnen als Bändiger ab."
