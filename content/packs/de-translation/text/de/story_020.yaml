text.0066: "Kämpfen wir?\nOder bist du ein Feigling?!"
text.00b2: "Okay, kämpfen wir\nMoment mal"
text.011e: "Oh nein! Ich hab verloren!"
text.0152: "Der war ganz schön stark."
text.019a: "Du bist nett. Ich bin Mamemon.\nIch komme mit dir."
text.0200: "Mit uns kommen? Geh doch\nlieber in die Stadt!"
text.0272: "OK. Dann gehe ich dorthin."
text.02d6: "Mamemon zieht in die Stadt!"
text.0320: "Komm wieder, wenn du\nstärker bist."
text.039c: "Daaaa!"
text.03be: "Hahaha."
text.03ea: "Uaargh!"
text.0410: "Osten: Heimatwald\nWesten: Zahnradsavanne"
