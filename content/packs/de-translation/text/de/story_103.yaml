"text.0020": "Ich habe genug vom Training\nhier. Was soll ich tun?"
"text.0082": "Was tun?"
"text.00a0": "Wo trainierst du?"
"text.00da": "Ist das ein Trainingsplatz?"
"text.0116": "Ich habe genug vom Training.\nIch will echte Kämpfe."
"text.0180": "Vielleicht ein Trainingsplatz\nVielleicht eine Arena"
"text.01ee": "Ich habe genug vom Training.\nIch will echte Kämpfe."
"text.0258": "Da will ich hin.\nDort trainiere ich."
"text.02e2": "Kabuterimon zieht in\ndie Stadt!"
"text.032a": "Das Insektenkrieger-Turnier\nfindet hier jedes Jahr\nstatt..."
"text.03ae": "...an Tagen mit zwei Zweien.\nDem Sieger winken Preise!"
"text.0422": "Aber nur Insekten-Digimon\ndürfen mitmachen."
"text.0480": "Da sind Kabuterimon,\nKuragamon, Kunemon\nund noch ein Insekt."
"text.0508": "Aber kein Numemon."
"text.052e": "An Tagen mit zwei Zweien\nfindet jedes Jahr das\nInsektenkrieger-Turnier statt."
"text.05ce": "Du hast schon gewonnen, oder?"
"text.060a": "Da sind Kabuterimon,\nKuragamon, Kunemon\nund noch ein Insekt."
"text.0692": "Das ist HerculesKabuterimon."
"text.06ce": "Hercules-Kabuterimon ist\nsuperstark."
"text.071e": "Der Sieger kann zu\nHercules-Kabuterimon werden\nund bekommt Items."
"text.07a6": "Beim Insektenkrieger-Turnier\nkannst du oft antreten."
"text.0824": "Du bist stark.\nIch kann dir nichts zeigen."
"text.0886": "Wir erforschen Techniken.\nSchwere Techniken zu\nmeistern ist schwierig."
"text.091a": "Mit Talent meisterst du\nvielleicht die Techniken.\nWillst du die schweren lernen?"
"text.09c8": "Na klar!\nNein danke"
"text.0a06": "Dann versuche ich es."
"text.0a3e": "Dir fehlt Verteidigung.\nTrainiere mehr."
"text.0aa0": "Dir fehlt Tempo.\nTrainiere mehr."
"text.0aee": "Dir fehlen HP.\nTrainiere mehr."
"text.0b2a": "Du meisterst eine Technik."
"text.0b64": "„Ungeziefer“ gemeistert!"
"text.0bb4": "{color:5}Training: Felsschieben {color:1}"
"text.0bec": "Starten\nErklären\nBeenden"
"text.0c22": "Normal\nBonusversuch\nBeenden"
"text.0c5e": "Kraft durch Schieben\nam Felsen. Max. HP\nsteigen stark."
"text.0ce4": "Nochmal erklären\nStarten\nBeenden"
"text.0d3e": "{color:7}Spielautomat {color:1}\nDrück {color:6}△ {color:1}\nfür drei gleiche Bilder."
"text.0dc0": "{color:5}Training: Schlagpuppe {color:1}"
"text.0df0": "Starten\nErklären\nBeenden"
"text.0e28": "Normal\nBonusversuch\nBeenden"
"text.0e66": "Schlag mit voller Kraft auf\neine Puppe. Angriff\nsteigt stark."
"text.0efc": "Nochmal erklären\nStarten\nBeenden"
"text.0f56": "{color:7}Spielautomat {color:1}\nDrück {color:6}△ {color:1}\nfür drei gleiche Bilder."
