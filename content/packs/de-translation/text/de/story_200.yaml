text.0056: "Ich könnte gut etwas\n{color:6}Fleisch{color:1} gebrauchen."
text.0098: "Willkommen, wir haben tolles\n{color:6}Fleisch{color:1}. Na ja, äh..."
text.010e: "Preis erhöhen\nBei fünfzig Bits lassen\nPreis senken"
text.0180: "Äh, du wolltest\n{color:6}Fleisch{color:1}, oder? Äh..."
text.01f6: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfundsiebzig Bits?"
text.0264: "Auf fünfundsiebzig erhöhen\nNoch mal überlegen"
text.02ec: "Und {color:6}Fleisch{color:1} zu fünfzig\nBits für siebzig Bits?"
text.0348: "Auf siebzig erhöhen\nNoch mal überlegen"
text.03d0: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfundsechzig Bits?"
text.043a: "Auf fünfundsechzig erhöhen\nNoch mal überlegen"
text.04be: "Und {color:6}Fleisch{color:1} zu fünfzig\nBits für sechzig Bits?"
text.0516: "Auf sechzig erhöhen\nNoch mal überlegen"
text.059a: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfundfünfzig Bits?"
text.0604: "Auf fünfundfünfzig erhöhen\nNoch mal überlegen"
text.067c: "Und {color:6}Fleisch{color:1} zu fünfzig\nBits zum Normalpreis?"
text.06d8: "Zum Normalpreis anbieten\nNoch mal überlegen"
text.075a: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfundvierzig Bits?"
text.07c4: "Auf fünfundvierzig senken\nNoch mal überlegen"
text.0848: "Und {color:6}Fleisch{color:1} zu fünfzig\nBits für vierzig Bits?"
text.08a0: "Auf vierzig senken\nNoch mal überlegen"
text.0924: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfunddreißig Bits?"
text.0990: "Auf fünfunddreißig senken\nNoch mal überlegen"
text.0ad8: "Abgemacht!"
text.0b1e: "Gesamtgewinn: {shopvar}\nGewinn:\nvierzig"
text.0b74: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfunddreißig"
text.0bd6: "Gesamtgewinn: {shopvar}\nGewinn:\ndreißig"
text.0c2e: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfundzwanzig"
text.0c90: "Gesamtgewinn: {shopvar}\nGewinn:\nzwanzig"
text.0ce8: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfzehn"
text.0d42: "Gesamtgewinn: {shopvar}\nGewinn:\nzehn"
text.0d94: "Gesamtgewinn: {shopvar}\nGewinn:\nfünf"
text.0dde: "Gesamtgewinn: {shopvar}\nGewinn:\nnull"
text.0ea0: "Vergiss es,\nich kaufe woanders ein!!"
text.0f1c: "Keine Kunden, wie langweilig."
text.0f64: "Zu teuer, findest du?"
text.0f94: "Findest du? Also dann..."
text.0fd4: "Mann, ich könnte gut ein\n{color:6}Reiseklo{color:1} gebrauchen."
text.102e: "Willkommen, wir haben ein\nschönes {color:6}Reiseklo{color:1}!"
text.1094: "Preis erhöhen\nBei dreihundert Bits lassen\nPreis senken"
text.1110: "Äh... du willst also ein\n{color:6}Reiseklo{color:1}?"
text.1180: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nvierhundertfünfzig Bits?"
text.121c: "Auf vierhundertfünfzig erhöhen\nNoch mal überlegen"
text.12aa: "Wie wär's: ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nvierhundertzwanzig Bits?"
text.1350: "Auf vierhundertzwanzig erhöhen\nNoch mal überlegen"
text.13da: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\ndreihundertneunzig Bits?"
text.147a: "Auf dreihundertneunzig erhöhen\nNoch mal überlegen"
text.1506: "Wie wär's: ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\ndreihundertsechzig Bits?"
text.15ac: "Auf dreihundertsechzig erhöhen\nNoch mal überlegen"
text.1636: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\ndreihundertdreißig Bits?"
text.16d6: "Auf dreihundertdreißig erhöhen\nNoch mal überlegen"
text.1756: "Wie wär's: ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits zum\nNormalpreis: dreihundert?"
text.17fc: "Zum Normalpreis anbieten\nNoch mal überlegen"
text.187e: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nzweihundertsiebzig Bits?"
text.191c: "Auf zweihundertsiebzig senken\nNoch mal überlegen"
text.19aa: "Wie wär's: ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nzweihundertvierzig Bits?"
text.1a4c: "Auf zweihundertvierzig senken\nNoch mal überlegen"
text.1ad8: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nzweihundertzehn Bits?"
text.1b6e: "Auf zweihundertzehn senken\nNoch mal überlegen"
text.1cb8: "Okay, abgemacht!"
text.1d04: "Gesamtgewinn: {shopvar}\nGewinn:\nzweihundertvierzig"
text.1d72: "Gesamtgewinn: {shopvar}\nGewinn:\nzweihundertzehn"
text.1ddc: "Gesamtgewinn: {shopvar}\nGewinn:\neinhundertachtzig"
text.1e4c: "Gesamtgewinn: {shopvar}\nGewinn:\neinhundertfünfzig"
text.1eba: "Gesamtgewinn: {shopvar}\nGewinn:\neinhundertzwanzig"
text.1f2a: "Gesamtgewinn: {shopvar}\nGewinn:\nneunzig"
text.1f82: "Gesamtgewinn: {shopvar}\nGewinn:\nsechzig"
text.1fd8: "Gesamtgewinn: {shopvar}\nGewinn:\ndreißig"
text.2026: "Gesamtgewinn: {shopvar}\nGewinn:\nnull"
text.20bc: "Du verlangst viel zu viel."
text.20fa: "Echt? Also dann..."
text.212e: "Mensch, ich brauche dringend\n{color:6}Medizin{color:1}."
text.217c: "Äh... Willkommen, du willst\n{color:6}Medizin{color:1}?"
text.21e2: "Preis erhöhen\nBei eintausend Bits lassen\nPreis senken"
text.225c: "Äh, du wolltest\n{color:6}Medizin{color:1}, oder?"
text.22ce: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\nfünfzehnhundert Bits?"
text.235a: "Auf fünfzehnhundert erhöhen\nNoch mal überlegen"
text.23e4: "Und {color:6}Medizin{color:1}\nzu eintausend Bits für\nvierzehnhundert Bits?"
text.246a: "Auf vierzehnhundert erhöhen\nNoch mal überlegen"
text.24f6: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\ndreizehnhundert Bits?"
text.2584: "Auf dreizehnhundert erhöhen\nNoch mal überlegen"
text.2610: "Und {color:6}Medizin{color:1}\nzu eintausend Bits für\nzwölfhundert Bits?"
text.2692: "Auf zwölfhundert erhöhen\nNoch mal überlegen"
text.271a: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\nelfhundert Bits?"
text.27a4: "Auf elfhundert erhöhen\nNoch mal überlegen"
text.2820: "Und {color:6}Medizin{color:1}\nzu eintausend Bits\nzum Normalpreis?"
text.2894: "Zum Normalpreis anbieten\nNoch mal überlegen"
text.2916: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\nneunhundert Bits?"
text.299c: "Auf neunhundert senken\nNoch mal überlegen"
text.2a26: "Und {color:6}Medizin{color:1}\nzu eintausend Bits für\nachthundert Bits?"
text.2aa6: "Auf achthundert senken\nNoch mal überlegen"
text.2b32: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\nsiebenhundert Bits?"
text.2bba: "Auf siebenhundert senken\nNoch mal überlegen"
text.2d08: "Pack's mir ein, Kumpel!"
text.2d60: "Gesamtgewinn: {shopvar}\nGewinn:\nachthundert"
text.2dc6: "Gesamtgewinn: {shopvar}\nGewinn:\nsiebenhundert"
text.2e2c: "Gesamtgewinn: {shopvar}\nGewinn:\nsechshundert"
text.2e8e: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfhundert"
text.2ef2: "Gesamtgewinn: {shopvar}\nGewinn:\nvierhundert"
text.2f56: "Gesamtgewinn: {shopvar}\nGewinn:\ndreihundert"
text.2fbc: "Gesamtgewinn: {shopvar}\nGewinn:\nzweihundert"
text.301e: "Gesamtgewinn: {shopvar}\nGewinn:\neinhundert"
text.3076: "Gesamtgewinn: {shopvar}\nGewinn:\nnull"
text.310c: "Das ist viel zu teuer!"
text.313c: "Echt? Also dann..."
