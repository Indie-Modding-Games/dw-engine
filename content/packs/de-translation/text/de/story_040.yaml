text.00b8: "Wer bist du? Verschwinde!"
text.00f2: "Wohnst du hier?"
text.012c: "Das darf ich nicht sagen!"
text.0156: "Bist du eine Wache oder so?"
text.0198: "Kämpfen? Ich mach dich fertig!"
text.01da: "Dann kämpfe ich eben\nDu schüchterst mich nicht ein"
text.025c: "Wow!"
text.02c4: "Oh nein! He!"
text.02e2: "{color:7}???mon {color:1}\nHahaha."
text.0310: "Wer ist da?"
text.032c: "{color:7}???mon {color:1}\nIch hab nichts Böses getan.\nKomm nicht ohne Erlaubnis\nin mein Haus!"
text.03d2: "Ich gehe jetzt wohl besser."
text.0418: "Weiter so mit dem Wachen!"
text.0452: "Du gehörst zu Ogremons Bande!\nDas hier ist euer Versteck!"
text.04ba: "Wovon redest du?"
text.0500: "Letztes Mal hattest du Glück!\nGib auf!"
text.0554: "Wow!"
text.05b4: "Letztes Mal hast du mich\nausgetrickst, jetzt nicht!"
text.061a: "Wovon redest du?"
text.0660: "Diesmal entkommst du nicht!"
text.06ac: "Komm schon, lass mich rein."
text.06da: "Willst du Ärger?\nIch hau dich k.o.!"
text.0738: "Kämpfen wir\nLass mich in Ruhe"
