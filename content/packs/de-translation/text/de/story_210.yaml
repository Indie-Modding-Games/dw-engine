text.00bc: "Ich hab auf dich gewartet,\n{color:6}{tamer}{color:1}.\nEndlich ist der Tag gekommen"
text.0130: "Was ist passiert?"
text.0154: "Der Eingang zum\nUnendlichkeitsberg ist da."
text.01a8: "Was? Echt? Wo?"
text.01d8: "Er liegt hinter den\nWasserfällen der Stadt."
text.0224: "Mensch, der ist ja ganz nah!"
text.0254: "Der letzte Feind ist wohl\nauf dem Unendlichkeitsberg."
text.02c4: "Also das letzte Dungeon.\nIch mach das!"
text.0316: "Viel Glück! Aber sei nicht\nvoreilig. Geh erst los, wenn\ndu gut vorbereitet bist."
text.03ce: "Hinter dem Wasserfall in\nder Stadt liegt der Eingang\nzum Unendlichkeitsberg."
text.0478: "Der letzte Feind ist wohl\nauf dem Unendlichkeitsberg."
text.04e6: "Geh gut vorbereitet hin!"
text.051c: "Wie auch immer..."
text.0546: "Der Wohlstand der Stadt\nliegt derzeit bei {num:pstat=1}."
text.05b4: "Sie ist noch weit von\nihrem alten Zustand entfernt."
text.060e: "Sie nimmt endlich Gestalt an."
text.0658: "Sie entwickelt sich gut."
text.0698: "Sie wird eine schöne Stadt."
text.06e2: "Du hast toll gearbeitet.\nPrächtig!"
text.073a: "Mehr muss ich gar nicht\nsagen. Sie ist fantastisch!"
text.07be: "{color:7}Die Bändigerstufe\nist gestiegen! {color:1}"
text.0808: "{color:7}Glückwunsch!\nHier ist eine Medaille\nfür deine tolle Arbeit! {color:1}"
