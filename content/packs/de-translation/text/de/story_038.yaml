text.0088: "Hörst du bitte damit auf?"
text.00c6: "Schuha, schuha!"
text.00f6: "Wusch!"
text.0118: "Kämpfen wir mit voller Kraft!"
text.0158: "Wovon redest du?"
text.019a: "Nordwesten: Frostland"
text.01d8: "Aufzug"
text.01f0: "HOCH drücken\nRUNTER drücken\nNicht einsteigen"
text.02b4: "Was?"
text.02c4: "Nichts passiert."
