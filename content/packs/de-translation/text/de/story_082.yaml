text.0042: "Das muss es sein!\nWie ich es auch drehe, es ist\nein ganz normaler Meteorit."
text.00d8: "Aufbrechen und prüfen\nIn Ruhe lassen"
text.0130: "Hmmm"
text.0146: "Für mich ist das ein ganz\nnormaler alter Meteorit."
text.019c: "{color:7}???mon {color:1}\nTut mir leid, dass ich\nso normal und alt aussehe."
text.0202: "Wow!"
text.0212: "Du bist ein Digimon?!\nWer bist du?"
text.0264: "{color:7}???mon {color:1}\nIch heiße Meteormon."
text.02aa: "Weißt du etwas über die\nGefahr für die Insel?"
text.02fe: "Ich weiß gar nichts!"
text.0324: "Du weißt nichts?! Verbirgst du\nauch wirklich nichts?"
text.039c: "Wie unhöflich! Na schön!\nLass uns kämpfen, dann\nsehen wir, wer recht hat!"
text.041e: "Gut! Auf geht's."
text.0488: "Ich geb auf. Du bist so stark."
text.04c8: "Sag mir alles, was du über\ndie Gefahr der Insel weißt."
text.0542: "Ich bin gerade erst geboren,\nich weiß gar nichts!"
text.059e: "Was?!"
text.05ba: "Der Meteoritenstamm wird\nim Himmel geboren und\nfällt dann auf die Erde."
text.064a: "Dann schlafen wir sehr lange.\nEigentlich sollte ich noch\nviel länger schlafen, aber..."
text.06fa: "Hier läuft die Zeit schneller."
text.0738: "Wahrscheinlich. Egal, ich\nsehe mir die Insel an.\nBis dann!{stop}"
text.07f4: "Wir haben keine Hinweise.\nSchnell raus hier."
text.086a: "Wir haben es angesehen und\nwissen nichts Neues.\nBrechen wir es auf!"
text.08f8: "{color:7}???mon {color:1}\nWas glaubst du, was du da\nmachst? Du Trampel!"
text.0998: "Hä? Wer bist du?!"
text.09c4: "Wer ich bin? Wer bist du?!"
text.0a70: "Ich habe einen\n{color:4}Dimensionsschlüsselbund{color:1}.\nJetzt passen 20 Items rein!"
text.0b20: "Ich habe einen\n{color:4}Dimensionsschlüsselbund{color:1}.\nJetzt passen 30 Items rein!"
