text.002e: "Muschelzeitung Nr. 8\nAlien-Digimon gesichtet:\nWir haben das UFO gefunden.\nDas Wesen zeigte sich und\nsprach fremde Worte.\nIst das Wesen ein Alien?\nKommt es wieder?"
text.018a: "Zurück\nBeenden"
text.01bc: "Muschelzeitung Nr. 7\nMyotismon dementiert\nRücktritt:\nIn einem Interview\nwies er die Gerüchte zurück.\nEr arbeitet weiter hart\nund liebt seine Fans.\nAußerdem kündigte er an,\ndass sein Schüler SkullGreymon\nbald debütiert."
text.0368: "Zurück\nWeiter\nBeenden"
text.03d0: "Muschelzeitung Nr. 6\nTritt Myotismon zurück?:\nGerüchten zufolge hört der \nbeliebte, starke Myotismon\nauf. In der Arena hat ihn\nniemand gesehen. Seine Zeit\nist vorbei. Er ist zu alt."
text.0544: "Zurück\nWeiter\nBeenden"
text.05b4: "Muschelzeitung Nr. 5\nVerborgener Schatz:\nEin toller Laden in der\nZahnradsavanne. Er hat nur\nvom 1. bis 15. jedes Jahres\nauf. Der Ladenchef ist stolz\nauf seine seltenen Items."
text.0710: "Zurück\nWeiter\nBeenden"
text.0794: "Muschelzeitung Nr. 4\nEin legendäres Digimon?:\nGerüchten zufolge lebt\nim Frostland ein Digimon\nder Kälte. Herr M wurde von\ndiesem Wesen gerettet. Es\nglich einem Riesenschneeball.\nDigimon, die keine Kälte\nmögen: Vorsicht!"
text.094e: "Zurück\nWeiter\nBeenden"
text.09aa: "Muschelzeitung Nr. 3\nEin Wächter für den See?:\nDer Wächter des Sees ist\nam Drachenaugensee.\nDas Digimon-artige Wesen\nwurde von jemandem gerufen.\nKann dieser Wächter\nWünsche erfüllen?"
text.0b10: "Zurück\nWeiter\nBeenden"
text.0b80: "Muschelzeitung Nr. 2\nEin UFO!:\nLaut einem Bericht ist das\nUFO nahe dem Panoramaberg.\nDas UFO sieht aus wie ein\nsilberner Teller, aus dem\nunten Licht kommt.\nIst es ein Alien?\nMehr Infos folgen."
text.0cf8: "Zurück\nWeiter\nBeenden"
text.0d48: "Muschelzeitung Nr. 1\nBanditen vertrieben!:\n{color:6}{tamer}{color:1} fand das\nVersteck von Ogremons Bande.\nAber Ogremon ist noch \nauf freiem Fuß, und alle\nsind noch besorgt."
text.0e70: "Weiter\nBeenden"
