text.0038: "Oh, ja!"
text.0050: "Spielst du die {color:6}Blaue Flöte{color:1}\ndes Wächters des Sees?"
text.00b6: "Ich spiele\nIch spiele nicht"
text.0188: "Brauchst du Hilfe, Freund?"
text.01ce: "Bring mich ans andere Ufer."
text.020e: "Klar. Steig auf."
text.033c: "Seadramon!"
text.0358: "Wir sehen uns wieder.\nHast du eine Bitte?"
text.03bc: "Lass uns Freunde sein\nBring mir eine Technik bei\nIch will ein Item"
text.0444: "Wir sind schon Freunde.\nNoch eine andere Bitte?"
text.050c: "Was zum... oh nein!\nDas ist der Wächter des Sees!"
text.056c: "Äh, ja. Ich bin Seadramon."
text.05a0: "Du bist also der, der hier\nso viel geangelt hat!\nNa schön. Eine Bitte?"
text.0634: "Was!? Jetzt weiß ich, warum\nman dich Wächter nennt.\nJa, ich habe eine Bitte."
text.06bc: "Lass uns Freunde sein\nBring mir eine Technik bei\nIch will ein Item"
text.0738: "Okay, na gut."
text.0754: "Wir sind jetzt Freunde. Als\nBeweis kriegst du die Flöte."
text.07ec: "Oh nein! Zu viele Items.\nIch muss welche wegwerfen."
text.085e: "Ich habe die {color:6}Blaue Flöte{color:1}\ndes Wächters des Sees!"
text.08b4: "Spielst du die Flöte am\nSee, komme ich und bringe\ndich ans andere Ufer."
text.095c: "Ich kann ans andere Ufer?\nDanke!"
text.09bc: "Hinter dem See liegt ein\nseltsamer Wald. Willst du\njetzt gleich dorthin?"
text.0a5e: "Ja, ich gehe\nNein, vielleicht später"
text.0aaa: "Ich lehre dich eine Technik."
text.0af6: "Ich kann jetzt „Wassermagie“!"
text.0b40: "Ich kann jetzt „Winterböe“!"
text.0b8e: "Ich kann jetzt „Gigafrost“!"
text.0bcc: "Äh, ich glaube, es gibt\nkeine Techniken mehr, die\nich dir beibringen kann..."
text.0c5c: "Tschüss!"
text.0ca8: "Dann gebe ich dir die\n{color:6}Feldflasche{color:1}."
text.0d12: "Oh nein! Zu viele Items.\nIch muss welche wegwerfen."
text.0d84: "Ja, ich habe die\n{color:6}Feldflasche{color:1}!"
text.0dca: "Tschüss!"
text.0e16: "Dann spring auf meinen Rücken."
text.0ece: "Bis dann."
