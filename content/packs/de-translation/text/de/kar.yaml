"penguinmon_dialogue.0001": "Such dir zuerst deinen"
"penguinmon_dialogue.0002": "Curlingstein aus."
"penguinmon_dialogue.0005": "Es gibt schwere, mittlere und"
"penguinmon_dialogue.0006": "leichte. Überleg dir also die"
"penguinmon_dialogue.0007": "beste Reihenfolge."
"penguinmon_dialogue.0009": "Manche Steine haben vier"
"penguinmon_dialogue.0010": "Zapfen. Sie halten dort, wo"
"penguinmon_dialogue.0011": "sie landen. Sehr nützlich!"
"penguinmon_dialogue.0013": "Mit den Richtungstasten "
"penguinmon_dialogue.0014": "links und rechts wählst du "
"penguinmon_dialogue.0015": "die Wurfrichtung."
"penguinmon_dialogue.0017": "Mit oben und unten bewegst"
"penguinmon_dialogue.0018": "du das Bild. Mit {prompt:confirm} legst"
"penguinmon_dialogue.0019": "du die Wurfrichtung fest."
"penguinmon_dialogue.0021": "Drück {prompt:confirm}, wenn die"
"penguinmon_dialogue.0022": "Kraftanzeige die gewünschte"
"penguinmon_dialogue.0023": "Stärke erreicht hat."
"penguinmon_dialogue.0025": "Landet dein Curlingstein und"
"penguinmon_dialogue.0026": "berührt er die GOOD-Marke,"
"penguinmon_dialogue.0027": "bekommst du zwei Punkte."
"penguinmon_dialogue.0029": "Liegt er auf der blauen"
"penguinmon_dialogue.0030": "Linie, aber nicht auf der"
"penguinmon_dialogue.0031": "GOOD-Marke: ein Punkt."
"penguinmon_dialogue.0033": "Berührst du das BAD unten"
"penguinmon_dialogue.0034": "rechts, verlierst du"
"penguinmon_dialogue.0035": "zwei Punkte. Pass also auf."
"penguinmon_dialogue.0037": "Und bei einem Unentschieden"
"penguinmon_dialogue.0038": "gewinne ich!"
"penguinmon_dialogue.0039": "Also, fangen wir an!!"
"penguinmon_dialogue.0042": "So toll bist du gar nicht!"
"penguinmon_dialogue.0045": "Das Duell fängt erst an!"
"penguinmon_dialogue.0049": "He, du bist ziemlich gut!"
"penguinmon_dialogue.0053": "Jaa! Gewonnen!"
"penguinmon_dialogue.0057": "Och, verloren. "
"metalmamemon_dialogue.0001": "Jo. Zuerst suchst du dir die"
"metalmamemon_dialogue.0002": "Sorte Curlingstein aus."
"metalmamemon_dialogue.0005": "Als Genie setze ich die"
"metalmamemon_dialogue.0006": "Steine in der richtigen"
"metalmamemon_dialogue.0007": "Reihenfolge ein. Der Trick!"
"metalmamemon_dialogue.0009": "Steine mit vier Zapfen"
"metalmamemon_dialogue.0010": "bleiben dort, wo sie landen,"
"metalmamemon_dialogue.0011": "darum sind sie sehr wertvoll."
"metalmamemon_dialogue.0013": "Die Wurfrichtung wählst du"
"metalmamemon_dialogue.0014": "mit den Richtungstasten,"
"metalmamemon_dialogue.0015": "nach links oder rechts."
"metalmamemon_dialogue.0017": "Mit oben und unten kannst du"
"metalmamemon_dialogue.0018": "das Bild verschieben."
"metalmamemon_dialogue.0019": "Drück {prompt:confirm} zum Werfen."
"metalmamemon_dialogue.0021": "Drück {prompt:confirm}, wenn die"
"metalmamemon_dialogue.0022": "Kraftanzeige die gewünschte "
"metalmamemon_dialogue.0023": "Stärke erreicht hat."
"metalmamemon_dialogue.0025": "Punkte: Liegt der Stein auf"
"metalmamemon_dialogue.0026": "der GOOD-Marke, bekommst du"
"metalmamemon_dialogue.0027": "zwei Punkte."
"metalmamemon_dialogue.0029": "Liegt er auf der blauen"
"metalmamemon_dialogue.0030": "Linie, aber nicht auf der"
"metalmamemon_dialogue.0031": "GOOD-Marke: ein Punkt."
"metalmamemon_dialogue.0033": "Landest du rechts unten auf"
"metalmamemon_dialogue.0034": "der BAD-Marke, gibt es minus"
"metalmamemon_dialogue.0035": "zwei Punkte. Also Vorsicht."
"metalmamemon_dialogue.0037": "Bei Gleichstand gewinne ich!"
"metalmamemon_dialogue.0038": "Los geht's!!"
"metalmamemon_dialogue.0041": "Ich gewinne!"
"metalmamemon_dialogue.0045": "Noch hab ich nicht verloren!"
"metalmamemon_dialogue.0049": "Das darf ich nicht verlieren!"
"metalmamemon_dialogue.0053": "Jo, gewonnen!"
"metalmamemon_dialogue.0057": "Och, fast gewonnen."
"menu.0000": "Spielen   Spiel erklären"
