text.0090: "Hier sind Buchstaben\neingraviert."
text.00dc: "Keiner da! Geh nach Hause!"
text.011e: "Wohnt hier jemand?"
text.0176: "{color:7}? ? ? {color:1}\nAuch Affen fallen mal runter."
text.01c8: "{color:7}? ? ? {color:1}\nFliegender Kniestoß!"
text.025e: "Ich hab verloren, aber\nihr seid ein Witz!"
text.02b4: "Sei kein schlechter Verlierer.\nDu hast uns sogar aus dem\nHinterhalt angegriffen."
text.0344: "Ugh! Dann bleibt mir\nwohl nichts anderes übrig..."
text.0394: "In eurer Stadt zeige ich\neuch, wie stark ich bin!\nIhr werdet schon sehen!"
text.0462: "Etemon zieht in die Stadt!"
text.04a0: "Du tust dir nur weh."
text.04e0: "Du bist so ein Baby!"
text.051c: "Na gut, ich spiele mit dir."
text.056a: "Ich brech dir die Nase!"
text.05aa: "Ich brech dich entzwei!"
