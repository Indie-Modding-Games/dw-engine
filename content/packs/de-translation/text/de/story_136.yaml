text.014c: "Ich höre hinter uns eine\nStimme. Die Stimme ist...!"
text.01f6: "Warte!"
text.0208: "Warum sollte ich warten?!"
text.023e: "Hahaha!"
text.02bc: "Wow, so eine Überraschung!"
text.02ee: "Whamon, super! Wow!"
text.033e: "Gib auf!"
text.0364: "Urgh!"
text.0378: "Komm in die Stadt und arbeite,\num deine Sünden abzubüßen."
text.03ec: "Na gut, verstanden.\nIch gehe in die Stadt."
text.0452: "Hahaha, nur Spaß! Tschüss."
text.08fa: "Mist, er hat mich reingelegt!"
text.092a: "Na ja, die Höhle ist wieder\nunser. Ist schon okay."
text.099a: "Die Höhle ist jetzt wohl okay."
text.09da: "Du scheinst ein echt netter\nMensch zu sein. Sie sehen\nihren Fehler sicher mal ein."
text.0a8a: "Ich geb dir meinen Schatz.\nEr liegt ganz hinten."
text.0aea: "Warte, warte.\nDas ist doch dein Schatz?\nDen kann ich nicht annehmen."
text.0b68: "Nein, ich brauche ihn nicht.\nIch will in deine Stadt."
text.0bce: "Wofür haben wir dann die\nHöhle zurückerobert?\nFür nichts...?"
text.0c56: "Tut mir leid, aber ich will\ndir jetzt wirklich helfen."
text.0cb8: "Verstehe. Danke.\nDu bist echt nett."
text.0d04: "Ich gehe direkt in die\nStadt. Ich nehm dich mit,\nwenn du willst."
text.0d92: "Whamon zieht in die Stadt!"
text.0dd4: "Zurück in die Stadt?"
text.0e0a: "Ich will zurück\nIch bleibe"
