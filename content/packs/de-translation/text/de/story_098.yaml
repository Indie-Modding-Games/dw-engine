text.004e: "Solltest du nicht heimgehen?"
text.0090: "Geh nach Hause!"
text.00b6: "Du solltest umkehren!"
text.010c: "Oh, das blendet so!"
text.014c: "{color:7}??? mon {color:1}\nDu, der meine Hilfe sucht,\ndie Zeit ist da! Ich gebe dir\nden Segen meiner Flügel!"
text.0206: "Was zum..? Wo..?\nWessen Stimme..?"
text.0252: "Uff!"
text.0274: "Was war das? Das Licht ist\nweg. Hier ist sonst nichts.\nAlso ist es oben?!"
