text.0040: "Oh, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nihr seid da! Seht euch die\nArena der File-Stadt an. Cool!"
text.00d0: "Bald füllen Kämpfer und Fans\ndie Ränge. Du machst die Fans\nauch glücklich, oder?!"
text.0188: "Für die Turniersieger gibt es\nGeld und Preise. Du hast\nnichts zu verlieren."
text.0230: "Details zum Turnier findest\ndu an dem Automaten dort."
text.02d0: "Ach ja, Training-Digimon\ndürfen aber nicht antreten.\nSoll ich in den Plan sehen?"
text.038c: "Ach ja, Training-Digimon\ndürfen aber nicht antreten.\nSoll ich in den Plan sehen?"
text.043c: "Schön, dass du kommst. Willst\ndu dich fürs Turnier anmelden?"
text.04b6: "Ja\nNein\nWie meinst du das?"
text.0520: "Du trittst also beim\nmorgigen\nTurnier an, oder?"
text.058a: "Willst du deine\nAnmeldung absagen?"
text.05d8: "Nein, ich sage nicht ab\nJa, ich sage ab"
text.0652: "Du trittst also beim heutigen\nTurnier an, oder?\nDu kannst ab 10 Uhr rein."
text.06e8: "Du willst doch nicht etwa\nabsagen, oder?!"
text.0740: "Nein, ich sage nicht ab\nJa, ich sage ab"
text.07aa: "Du trittst also beim heutigen\nTurnier an, oder?\nGeh vor 23 Uhr hinein."
text.0832: "Du willst doch nicht\netwa absagen, oder?!"
text.088a: "Nein, ich sage nicht ab\nJa, ich sage ab"
text.08f6: "Gut, ich sage für dich ab."
text.0934: "Wenn es losgeht, geh drinnen\ndie linke Treppe hinunter,\num zu kämpfen."
text.09de: "Die Anmeldung ist gratis. Du\nkannst dich nur für heute und\nmorgen anmelden."
text.0a8c: "Für ein Turnier am selben Tag\nmusst du dich aber bis\n10 Uhr anmelden."
text.0b1a: "Den Plan siehst du fünf Tage\nim Voraus. Schau rein und\nplane deine Tage."
text.0bb8: "Bei roten Turnieren kannst\ndu nicht mitmachen."
text.0c32: "Drück aber Start, um zu\nsehen, worum es geht."
text.0ca0: "Auch bei Turnieren mit\nBedingungen: keine,"
text.0d06: "dürfen Training-Digimon\nnicht antreten."
text.0d52: "So, das war alles zur\nAnmeldung. Willst du\nmitmachen?"
text.0dd4: "Ja\nNein\nNochmal erklären, bitte"
text.0e3c: "He! Du hast dich noch\nnicht angemeldet!"
text.0eba: "He! Das Turnier ist\nerst morgen!"
text.0f42: "Zum Reingehen ist es zu früh.\nWarte bis zehn Uhr."
text.0ff4: " \n{color:4}Bändigerstufe gesunken!{color:1}"
text.10c6: "- Klasse D -\nTurnier für\nNeuling-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.11c4: "- Klasse C -\nTurnier für\nChampion-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.12c6: "- Klasse B -\nTurnier für\nChampion-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.13c8: "- Klasse A -\nTurnier für\nUltra-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.14ca: "- Klasse S -\nTurnier der\nstärksten Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Sieger der Klasse A."
text.15c4: "- Klasse R -\nMassenkampf-Turnier:\nTaktik ist der Schlüssel\n\nMassenkampf zu viert,\nzwei Runden, acht Teilnehmer.\nBedingungen: keine."
text.16f8: "- Version-1-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 1\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Digimon der Version 1."
text.1834: "- Version-2-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 2\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Digimon der Version 2."
text.1970: "- Version-3-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 3\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nder Version 3."
text.1ab8: "- Version-4-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 4\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nder Version 4."
text.1bfa: "- Version-0-Pokal -\nKampf auf Zeit für die\nbesten Digimon, die nicht\nzu Version 1 bis 4 gehören.\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\naußerhalb Version 1 bis 4."
text.1d60: "- Feuer-Pokal -\nKampf auf Zeit um den König\nder lodernden Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit feuriger Natur."
text.1e9a: "- Ringen-Pokal -\nKampf auf Zeit um den\nKönig des Kampfsports\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit kämpferischer Natur."
text.1fe4: "- Donner-Wind-Pokal -\nKampf auf Zeit um den König\nder Digimon der Lüfte\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit luftiger Natur."
text.2132: "- Kälte-Pokal -\nKampf auf Zeit um den König\nder coolen Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit eisiger Natur."
text.2264: "- Natur-Pokal -\nKampf auf Zeit um den König\nder Natur-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon,\ndie der Natur nahestehen."
text.23b0: "- Metall-Pokal -\nKampf auf Zeit um den König\nder Androiden-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit mechanischer Natur."
text.24ea: "- Dreck-Pokal -\nKampf auf Zeit um den König\nder dreckigen Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit dreckiger Natur."
text.2622: "- Dino-Pokal -\nKampf auf Zeit für Digimon\nmit urzeitlichem Blut\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen --  ? ? ?"
text.2752: "- Flügel-Pokal -\nDigimon mit Flügeln\nmessen ihre Kräfte\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen --  ? ? ?"
text.2864: "- Tier-Pokal -\nKampf auf Zeit für Digimon\nmit tierischem Blut\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen --  ? ? ?"
text.2998: "- Mensch-Pokal -\nKampf auf Zeit für\nmenschenähnliche Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen --  ? ? ?"
