text.0034: "Willkommen! Mein neues\nGeschäft ist das „Itemlager“.\nIch bewahre Items auf."
text.00c0: "Als besonderen Service lagere\nich deine Items gratis."
text.0144: "Zur Digievolution...\nÜber die Stufe, die nach\nChampion-Digimon kommt..."
text.01e4: "Das sind Ultra-Digimon.\nNicht jedes Champion-Digimon\ndigievolviert weiter."
text.0286: "Um zu digievolvieren, müssen\nbestimmte Bedingungen genau\nerfüllt sein."
text.030e: "Aber digievolviert es zum\nUltra-Digimon, steigt seine\nLebensdauer."
text.03a8: "Aber digievolviert es durch\nein Digievolutions-Item,\nbleibt die Lebensdauer gleich."
text.0464: "Mehr zur Digievolution.\nZu den Bedingungen."
text.04c6: "Zuerst mal soll das Gewicht\nnah am Zielgewicht liegen."
text.0560: "Und je höher die Werte,\ndesto besser."
text.05b8: "Aber je nachdem, welcher\nWert höher ist, kommt\netwas anderes heraus."
text.0644: "Bei Pflegefehlern ist es\nmanchmal besser, absichtlich\netwas falsch zu machen."
text.06d8: "Je nachdem, wozu es\ndigievolviert, müssen\nBedingungen erfüllt sein."
text.0768: "Manche Situationen können\neine Digievolution auslösen."
text.07da: "Wie die Zahl der Kämpfe oder\nwie diszipliniert es ist."
text.0850: "Sind diese erfüllt, kann es\nauch digievolvieren, wenn\nandere nicht erfüllt sind."
text.08fc: "Jiji hat mir erzählt, dass\n{color:10}{partner}{color:1} digievolviert."
text.0956: "Von Baby-Digimon zu\nTraining-Digimon dauert\nes nur sechs Stunden."
text.09e2: "Von dort bis zum Neuling\ndauert die Digievolution\netwa einen Tag."
text.0a68: "Bis zum nächsten, dem\nChampion, dauert es\netwa drei Tage."
text.0b02: "Und was war die nächste\nStufe? Hab ich vergessen,\naber es gibt noch mehr."
text.0b82: "Die Digievolution hängt von\nGewicht, Werten und\nPflegefehlern ab."
text.0c0a: "Ich verstehe das nicht\nso ganz. Ich frage Jiji\nbei Gelegenheit."
