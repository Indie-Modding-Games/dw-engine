text.0022: "{color:7}Poyomon {color:1}\nPoyomon. Ich heiße Poyomon."
text.0084: "{color:7}Poyomon {color:1}\nIch erzähl dir was über die\nDigievolution. Also... über\ndie Stufe nach Champion."
text.014e: "{color:7}Poyomon {color:1}\nSie heißt Ultra-Digimon.\nAber nicht jedes Champion\ndigievolviert auch dazu."
text.0214: "{color:7}Poyomon {color:1}\nDie Bedingungen sind schwer,\naber auf der Ultra-Stufe\nlebt ein Digimon länger."
text.02d8: "{color:7}Poyomon {color:1}\nMit Digievolutions-Items\nwird das Leben nicht länger."
text.0370: "{color:7}Poyomon {color:1}\nIch erzähl dir was über die\nDigievolution. Also... über\nihre Bedingungen."
text.0428: "{color:7}Poyomon {color:1}\nErstens muss das Gewicht\nzur nächsten Stufe passen."
text.04b6: "{color:7}Poyomon {color:1}\nZweitens: Hohe Werte sind\nbesser, aber jeder Wert\nwirkt anders."
text.0566: "{color:7}Poyomon {color:1}\nPflegefehler. Je nachdem,\nwelches Digimon du willst,\nsind Fehler manchmal gut."
text.062e: "{color:7}Poyomon {color:1}\nAch ja, für manche Digimon\ngibt es noch besondere\nBedingungen."
text.06d6: "{color:7}Poyomon {color:1}\nZum Beispiel sehr hohe\nDisziplin oder viele Kämpfe."
text.0756: "{color:7}Poyomon {color:1}\nDann klappt es auch, wenn\ndie drei Grundbedingungen\nnicht ganz erfüllt sind."
text.082a: "{color:7}Poyomon {color:1}\nJiji hat gesagt, dass\n{color:10}{partner}{color:1} bald digievolviert."
text.089c: "{color:7}Poyomon {color:1}\nVon Baby bis Training\ndauert es sechs Stunden."
text.0920: "{color:7}Poyomon {color:1}\nUnd bis zur Neuling-Stufe\ndauert es nur einen Tag."
text.09ac: "{color:7}Poyomon {color:1}\nDie nächste Stufe, Champion,\ndauert etwa drei Tage."
text.0a2c: "{color:7}Poyomon {color:1}\nWie lange bis zur nächsten?\nVergessen. Jedenfalls länger."
text.0ab4: "{color:7}Poyomon {color:1}\nGewicht, Werte, Pflegefehler:\ndas zählt beim Digievolvieren."
text.0b42: "{color:7}Poyomon {color:1}\nDie Details kenne ich nicht,\nich frag nächstes Mal Jiji."
