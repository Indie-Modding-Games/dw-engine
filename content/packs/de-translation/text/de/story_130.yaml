text.0036: "Ich krieg dich!"
text.0070: "Ach wirklich!"
text.00ce: "Wer bist du?"
text.00ee: "Ich will dir helfen\nIch bin noch nicht so weit..."
text.0158: "Ist da jemand?"
text.018c: "Kannst du nicht sehen?"
text.01b4: "Ich bin Whamon. Sonst\nlebe ich im Meer."
text.0206: "Ich hab keine Augen, aber\nich spüre fast alles."
text.026c: "Ich bin ein Mensch. Ich\nheiße {color:6}{tamer}{color:1}."
text.02a6: "Das ist {color:10}{partner}{color:1}, mein\nPartner, ein {digimon:pstat=103}."
text.02f6: "Ich spüre eine starke Kraft."
text.0330: "Hörst du mir zu? Hier in der\nNähe gibt es eine Strandhöhle,\nwo ich mich ausruhe."
text.03c8: "Aber fiese Kerle warfen mich\nraus, und ich verlor dort\nmeinen wertvollen Schatz."
text.046a: "Fiese Kerle, was?\nKlingt nicht gut."
text.04bc: "Bitte wirf sie raus.\nHilf mir, die Höhle\nzurückzuerobern."
text.0540: "Ich helfe dir\nIch kann gerade nicht"
text.0592: "Verstehe."
text.05ae: "Dann steig auf meinen Rücken."
text.06c0: "Los geht's."
