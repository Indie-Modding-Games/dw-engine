text.004c: "Automat"
text.007a: "Meine Güte, ist das teuer!"
text.00b6: "Fleisch: 300 Bits\nDigipilz: 600 Bits\nNicht kaufen"
text.015e: "Ich hab nicht genug Geld."
text.01b2: "Ich hab nicht genug Geld."
text.01f6: "{color:6}Fleisch {color:1}kam heraus!"
text.023e: "Ups, zu viele Sachen."
text.0286: "Ein {color:6}Digipilz {color:1}\nkam heraus!"
text.02ec: "Ups, zu viele Sachen."
text.0338: "So angelst du:\nHol dir zuerst eine „Angel“.\nIm Untermenü {color:5}× {color:1}gibt\nes dann das Symbol „Angeln“.\nWähle es. Köder mit {color:6}△ {color:1}.\nSuch dir etwas von deinem\nEssen aus."
text.0480: "Dreh dich dann mit links\noder rechts. Heb die Angel\nmit {color:6}△ {color:1}über den Kopf und\nwirf sie mit {color:6}△ {color:1}aus.\nWarte, bis die Pose zuckt:\nDann hat ein Fisch den\nKöder. Zieh mit {color:6}△ {color:1}."
text.05f8: "Achte auf die Leiste oben\nlinks. Lass {color:6}△ {color:1}los, bevor\nsie voll ist, sonst reißt\ndie Schnur. Pass also auf.\nZiehst du die Pose nah\ngenug zu dir heran, hast\ndu den Fisch gefangen."
text.077a: "Siehst du ein „X“ auf dem\nFischschatten, kannst du ihn\nmit diesem Köder nicht fangen."
