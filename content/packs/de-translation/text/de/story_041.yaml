text.0058: "Das läuft nicht gut!"
text.0096: "Hast du was gesagt?"
text.00d8: "Ich sagte doch, es geht nicht."
text.0124: "Ich bin mir nicht sehr sicher."
text.0174: "Sei nicht so streng mit mir."
text.01a6: "Mach dich nicht lustig!"
text.01ee: "Aufzug"
text.0206: "DACH drücken\nHOCH drücken\nNicht einsteigen"
text.026e: "Er tut gar nichts."
text.02ba: "In der Maschine steckt ein\nStein. Vielleicht ist das..."
text.0334: "Ich habe den Stein entfernt!"
text.0362: "Das müsste es sein!"
text.03fe: "Er tut gar nichts."
text.044a: "In der Maschine steckt ein\nStein. Vielleicht ist das..."
text.04bc: "Stein entfernt!{stop}"
text.04fe: "Das müsste es sein."
