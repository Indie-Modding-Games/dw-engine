text.004e: "Bohrtunnel"
text.0084: "Normal\nOger-Modus"
text.00ec: "So ein Mistkerl! Wie frech!"
text.012e: "Hä?"
text.015a: "{color:7}Marktleiter {color:1}\nIch wusste nicht, dass man\nfürs Durchgehen zahlen muss!"
text.01f6: "{color:7}Marktleiter {color:1}\nHe, bist du nicht... ja!\nTu doch was!"
text.026c: "Wie geht es den Drimogemon\nda drinnen?"
text.02b0: "{color:7}Marktleiter {color:1}\nWeiß ich nicht."
text.02f6: "Hoffentlich geht's ihnen gut.\nOkay, los geht's!"
text.0362: "{color:7}Marktleiter {color:1}\nTu schnell was!"
text.03f8: "Im Tunnel ist nichts mehr...\nGehen wir durch\noder was?"
text.047e: "Gehen wir durch!\nLieber nicht"
