text.0032: "Es ist so weit."
text.005e: "Ich würde gern bleiben, aber\nmeine Mama macht sich Sorgen."
text.00b6: "Danke, {color:6}{tamer}{color:1}. Wie kann\nich dir das je vergelten?"
text.010e: "{color:7}Tokomon {color:1}\nVergiss uns nicht!"
text.014c: "Wir sehen uns wieder.\nDas weiß ich."
text.01c0: "Es war eine tolle Zeit. Danke."
text.01fa: "Wir sollten eine\nAbschiedsfeier machen."
text.0258: "{color:10}{partner}{color:1}, unser\nAbenteuer war großartig!"
