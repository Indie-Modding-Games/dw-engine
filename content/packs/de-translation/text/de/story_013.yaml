text.0084: "He, bist du derjenige, der\neine Stadt baut?"
text.00d6: "Ja."
text.00ea: "Äh, du hast echt Glück,\ndass du mich triffst."
text.0132: "Man sieht's nicht, aber ich\nbin ein Ultra-Digimon. Wenn\ndu mich besiegst, helfe ich."
text.01d6: "Okay, ich nehme an\nNein danke"
text.0258: "Wow, verloren! Na, wir\nsehen uns in der Stadt."
text.02f0: "Piximon zieht in die Stadt!"
text.033a: "Oh, was für ein Feigling!\nWir sehen uns wieder!"
text.03c0: "Oh, Señorita!"
text.03f0: "He, Amigo, was geht?"
text.0430: "Wuki, wuki!"
text.0460: "Hä?"
