text.0034: "Dich übernehme ich!"
text.006a: "Dich übernehme ich!"
text.00a0: "Dich übernehme ich!"
text.0102: "Was steht da?"
text.012c: "Geh zurück an die Stelle,\nwo dir der Dumme die\nPunkte gegeben hat."
text.01d8: "Ich benutze den {color:6}\nKühlschlüssel. {color:1}"
text.0234: "Ich sehe es nicht."
text.025e: "Da ist ein Zettel."
text.0284: "Geh zurück an die Stelle,\nwo dir der Dumme die\nPunkte gegeben hat."
text.0310: "Ich folge lieber dem Zettel."
text.036a: "Das ist ein Kühlschrank."
text.039a: "Abgeschlossen! Ein Kühlschrank\nmit Schloss, das ist neu."
