text.006e: "Jemand wollte Händler werden.\nIch habe gehört, er hat\nirgendwo einen Laden."
text.011c: "Er ist nützlicher als ich."
text.015c: "Warum vergeht die Zeit hier\nanders als anderswo?"
text.01ba: "Hier lebt es sich sicher\nangenehm, aber..."
text.0240: "Ich habe mich vom Himmel\naus umgesehen."
text.0292: "Im Norden gibt es Eis und\nSchnee. An so einem kalten\nOrt zu leben ist verrückt."
text.0332: "Ich habe mich vom Himmel\naus umgesehen."
text.0384: "Im Westen liegt eine kleine\nStadt aus Eisen."
text.03e6: "Aber Ein- und Ausgang sind\nzu. Ich kann hinfliegen."
text.0460: "Ich habe mich vom Himmel\naus umgesehen."
text.04b2: "Es gibt Gruppen von Digimon\nmit Hörnern oder Klauen."
text.0522: "Sie sollen ihre Häuser\naus Holz schnitzen."
text.0594: "Ich habe mich vom Himmel\naus umgesehen."
text.05e6: "Im Nordwesten liegt ein Wald\nmit Gebäuden."
text.0644: "Er ist sehr weit weg."
text.066e: "Ich habe mich vom Himmel\naus umgesehen."
text.06c0: "Warst du schon hinter dem\nGroßen Canyon? Ein Labyrinth."
text.073a: "Ich habe mich vom Himmel\naus umgesehen."
text.078c: "Die Inselmitte sehe ich\nnicht. Nur Wolken."
text.0812: "Das hast du schon gehört."
text.0858: "Hier vergeht die Zeit langsam.\nEin halber Tag hier ist\nwie ein Tag draußen."
text.08de: "Wer sich ausruhen will,\nist hier genau richtig."
text.094e: "In der Tempo-Zeitzone\nvergeht die Zeit schnell.\nSie liegt gleich dahinter."
text.09d0: "Dort vergehen zwei Tage\nstatt einem."
text.0a26: "Dein Digimon wächst schneller,\nschwindet aber auch früher."
text.0aaa: "Automat"
text.0ad0: "Was wohl rauskommt?\nJe 200 Bits?\nSoll ich kaufen?"
text.0b54: "Probieren\nAbbrechen"
text.0b96: "Ich habe nicht genug Geld."
text.0bec: "Heraus kam {color:6}Fleisch{color:1}!"
text.0c24: "Ich habe zu viele Items.\nIch muss welche loswerden."
text.0cac: "Heraus kam:\n{color:6}Heilung kl.{color:1}!"
text.0d0a: "Ich habe zu viele Items.\nIch muss welche loswerden."
text.0d92: "Heraus kam:\n{color:6}Steak{color:1}!"
text.0dce: "Ich habe zu viele Items.\nIch muss welche loswerden."
text.0e56: "Heraus kam:\n{color:6}MP-Diskette{color:1}!"
text.0e9c: "Ich habe zu viele Items.\nIch muss welche loswerden."
