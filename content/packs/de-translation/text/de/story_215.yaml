text.0020: "Meine Wunde ist verheilt, also\nwill ich arbeiten. Danke,\ndass du dich gekümmert hast."
text.00b6: "Ich kann die Zukunft jedes\nWesens vorhersagen, und\ngenau das werde ich tun."
text.013e: "Wenn du magst, besuch mich\nin meinem Laden.\nIch nehme kein Geld."
text.01d6: "Willst du wissen, was dir\ndas Schicksal bringt?\nGut, lass mich nachsehen."
text.0268: "Hmmm, oh... oh, wow!"
text.029a: "Also, zuerst einmal..."
text.0320: "Insgesamt hast du\nsehr viel Glück."
text.039e: "Insgesamt sieht es gut aus."
text.0424: "Dein Glück ist mittelmäßig."
text.04a4: "Dein Glück ist insgesamt\nnicht so gut."
text.0532: "Insgesamt ist es nicht gut."
text.059c: "Was du auch tust,\nes wird gut gehen."
text.05ea: "Eine wunderbare Chance\nkommt auf dich zu."
text.0650: "Vielleicht erlebst du\netwas Unvergessliches."
text.069e: "Vielleicht findest du\netwas Unerwartetes."
text.06f0: "Deine Frage wird\nbeantwortet."
text.073a: "Dein Geldbeutel wird dicker."
text.077e: "Vielleicht hörst du Gutes\nvon deinen Freunden."
text.07de: "Etwas Abwechslung könnte\ndir guttun."
text.0838: "Geh mal dorthin, wo du\nsonst nie hingehst."
text.0896: "Vielleicht hast du einen\nspannenden Traum."
text.08ea: "Gib nicht zu\nviel Geld aus."
text.0936: "Dein Geheimnis kommt raus."
text.097a: "Geh lieber früh ins Bett."
text.09ba: "Pass gut auf deine Sachen auf."
text.09f2: "Ein Freund lässt vielleicht\nseinen Frust an dir aus."
text.0a5c: "Viel Unglück könnte\ndich treffen..."
text.0ab8: "Vielleicht triffst du\njemanden, den du nicht magst."
text.0b1c: "Ein großer Verlust\nkönnte dich treffen..."
text.0b76: "Deine Glücksfarbe ist Rot."
text.0bbe: "Deine Glücksfarbe ist Weiß."
text.0c0a: "Deine Glücksfarbe ist Blau."
text.0c54: "Deine Glücksfarbe ist Schwarz."
text.0ca0: "Deine Glücksfarbe ist Grün."
text.0cec: "Deine Glücksfarbe ist Grau."
text.0d36: "Deine Glücksfarbe ist Braun."
text.0d82: "Deine Glücksfarbe ist Gelb."
text.0dd0: "Deine Glücksfarbe ist Lila."
text.0e1e: "Deine Glücksfarbe ist Gold."
text.0e5c: "Zum Schluss: Wie gut passt\ndu wohl zu\n{color:10}{partner}{color:1}..."
text.0ece: "Ihr passt perfekt zusammen."
text.0f10: "Ziemlich gut."
text.0f4a: "Ganz okay."
text.0f72: "So lala."
text.0fa0: "Nicht schlecht..."
