text.0034: "Hey, spielst du eine Partie\ngegen mich? Gewinnst du,\nmach ich alles, was du willst."
text.00da: "Was für eine Partie?"
text.0108: "Ich nenne es...\nDigimon-Curling! \nDrinnen erklär ich dir mehr."
text.0186: "Hmm, und wenn ich verliere?"
text.01c6: "Beim ersten Mal nichts.\nAber danach musst du mir\nvorher einen Fisch geben."
text.025c: "Wenn ich gewinne, kommst du\nmit in die Stadt. Okay?{stop}\nDann legen wir los."
text.02f4: "Na gut, einverstanden. \nGehen wir rein."
text.0384: "Hey, spielst du eine Partie\ngegen mich? Gib mir einen\nFisch, dann spielen wir."
text.0426: "Dich schlag ich\nNein, danke"
text.0474: "Hey, Kumpel! Ich hab hier\neine Eisbahn gebaut."
text.04c2: "Ein Fisch pro Partie.\nAber wenn du gewinnst,\ngibt's einen tollen Preis."
text.0554: "Hey, Alter, willst du nicht\ngegen mich spielen? Für einen\nFisch darfst du antreten."
text.0606: "Abgemacht\nNein, danke"
text.0642: "Mist, wie langweilig."
text.0676: "Gib mir einen Fisch!"
text.06ae: "Ich hab gerade nichts..."
text.0738: "Oh nein, wenn ich dir das\ngebe, bringt das nichts."
text.079a: "Wow, sieht lecker aus. Ups,\nerst müssen wir spielen.\nGehen wir rein."
text.0842: "Ach komm schon, Alter.\nGeh doch am Drachenaugensee\nangeln."
text.08d6: "Sorry, Kumpel. Komm wieder\nund fordere mich heraus. Und\nbring noch einen Fisch mit."
text.0992: "Beeindruckend! Volle Punkte!\nBist du etwa...\nein Profi?"
text.0a34: "{color:7}Glückwunsch!\nHier ist eine Medaille für\ndeine tolle Leistung! {color:1}"
text.0ab8: "Wahnsinn, Alter. Ich hab zum\nersten Mal verloren."
text.0b20: "So, jetzt komm wie versprochen\nmit mir in die Stadt."
text.0b94: "Na gut, dann muss ich wohl.\nAber ich weiß schon, was\nich in der Stadt mache."
text.0c7a: "Penguinmon zieht in die Stadt!"
text.0cd2: "Sorry, Kumpel. Komm wieder\nund fordere mich heraus. Und\nbring einen Fisch mit."
text.0d82: "Beeindruckend! Volle Punkte!\nBist du etwa...\nein Profi?"
text.0e24: "{color:7}Glückwunsch!\nHier ist eine Medaille für\ndeine tolle Leistung! {color:1}"
text.0ea8: "Wow, du bist der Hammer. \nIch hab wieder verloren."
text.0f00: "Tja, was soll ich sagen.\nHier ist dein Preis."
text.0ff8: "Du hast zu viele Items!"
text.103c: "Ich habe {color:6}{item:pstat=110}{color:1} bekommen!"
text.106a: "Hey, {color:6}{tamer}{color:1}. Ich passe\nPenguinmon zuliebe auf den\nLaden auf."
text.10ea: "Spiel eine Partie mit mir!\nGewinnst du, kriegst du\nmeinen Spezialpreis. Na?"
text.118c: "Klar, legen wir los\nNein, danke"
text.11da: "Gib mir vor der Partie\nden Fisch."
text.123e: "Oh, ich hab gerade\nnichts dabei."
text.12da: "Wenn ich dir das gebe,\nbringt das nichts."
text.1330: "Na, diesmal werde ich\ngewinnen. Gehen wir rein."
text.13a2: "Ohne Fisch gibt's\nkeine Partie. Komm ein\nandermal wieder."
text.1436: "Was? Lässt du mich\netwa abblitzen?"
text.1488: "Wenn du mich schlagen willst,\nmusst du deinen Kopf benutzen!\nWir sehen uns irgendwann."
text.1546: "Volle Punktzahl gegen\nmich!! Bist du etwa\nein Curling-Genie?!"
text.15e0: "{color:7}Glückwunsch!\nHier ist eine Medaille für\ndeine tolle Leistung! {color:1}"
text.1664: "Du bist gut, {color:6}{tamer}{color:1}!\nHier ist der Preis,\nden ich dir versprochen hab!"
text.17a2: "Du hast zu viele Items."
text.17e6: "Ich habe {color:6}{item:pstat=110}{color:1} bekommen!"
