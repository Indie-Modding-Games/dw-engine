text.0062: "Wow!"
text.0080: "Mmmm."
text.00a0: "Äh, lassen wir's gut sein."
text.00e6: "Wir dürfen die Deckung\nnoch nicht senken."
text.013c: "...!"
text.0180: "Nein, ich will nicht!\nIch will nicht kämpfen!"
text.01de: "Wenn du nicht kämpfen\nwillst, dann lauf weg."
text.023a: "Wie schade."
text.0268: "Ich versteh dich nicht."
text.029c: "Na ja, komm doch in unsere\nStadt! Besser, als dich\nhier zu verstecken."
text.032e: "Äh, Stadt?"
text.0350: "Wir zwingen dich\nja nicht."
text.0394: "Jetzt hab ich Lust zu gehen.\nOkay, ich komme!"
text.0426: "Gabumon zieht in die Stadt!"
text.0464: "Was für ein komischer Kerl."
