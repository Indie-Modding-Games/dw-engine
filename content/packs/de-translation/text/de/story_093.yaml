text.0066: "Wow, die wirkt lebendig!"
text.0096: "Sie bewegt sich, wenn wir\nuns bewegen. Warte mal!"
text.0144: "Was ist, {color:10}{partner}{color:1}?\nHast du etwas gefunden?"
text.01a0: "Wow, super gemacht,\n{color:10}{partner}{color:1}!"
text.0202: "Oh? Wegen dieser Statue..."
text.024e: "Ah!"
text.0272: "Puh, na ja"
text.028e: "Du bist wieder lebendig.\nSehr gut!"
text.02d4: "Ich bin Angemon, ein Engel\nzu deinem Schutz. Erwacht\nbin ich für meine Pflicht."
text.036a: "Wovon redet er bloß...?"
text.03a8: "Ich kenne die Himmelswahrheit."
text.03e4: "Ich gebe meine Seele, um\nirdischen Weisungen zu folgen."
text.044a: "Wovon redet er bloß...?\nKommst du in die Stadt?"
text.04c0: "Deine Mission ist meine\nPflicht. Ich gehe."
text.050a: "Entschuldige, kannst du so\nreden, dass ich's verstehe?"
text.0578: "Ich gehe in die Stadt, also\nmusst du weitermachen."
text.05da: "Verstehe. Danke!"
text.0636: "Angemon zieht in die Stadt!"
