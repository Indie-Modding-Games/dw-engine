text.005a: "Leider bist du zu spät\nfür die Anmeldung.\nWarte ein weiteres Jahr."
text.00f4: "Gerade ist kein Turnier.\nIch habe nichts zu tun."
text.017c: "Das Turnier ist gerade vorbei.\nWarte ein weiteres Jahr."
text.01fc: "Du bist kein Insekt. Du\nkannst nicht teilnehmen."
text.027c: "Willst du teilnehmen?"
text.02c0: "Erklären\nNicht erklären"
text.02fe: "Am Zweiundzwanzigsten gibt\nes ein Turnier nur für\nInsekten-Digimon."
text.0390: "Dafür kannst du dich\njetzt gleich anmelden."
text.03e6: "Wenn du kein Insekten-\nDigimon bist, kannst du\ndich nicht anmelden."
text.047a: "Wer gewinnt, bekommt tolle\nPreise. Melde dich einfach an."
text.04f4: "Anmelden\nNicht anmelden"
text.0548: "Gerade ist kein Turnier.\nIch habe nichts zu tun."
text.05d0: "Das Turnier ist gerade vorbei.\nWarte ein weiteres Jahr."
text.0632: "Du bist schon angemeldet\nfür  ' - {tournament:pstat=3}- '.\nWillst du dich abmelden?"
text.06bc: "Nicht abmelden\nAbmelden"
text.0706: "Ich habe mich abgemeldet."
text.0726: "Willst du das wirklich?"
text.0764: "Ich habe mich angemeldet."
text.07a2: "Heute ist kein Turnier."
text.0806: "Wer nicht angemeldet ist,\ndarf nicht hinein."
text.0886: "Noch geschlossen. Melde dich\nam Zweiundzwanzigsten an,\nvon 10 bis 23 Uhr."
text.0950: "Schade, das Turnier ist aus.\nKomm nächstes Jahr wieder."
text.0a10: "Schade.\nDann eben nächstes Jahr."
text.0a60: "Für die Teilnahme gab es\n{color:6}Riesenfleisch {color:1}!"
text.0ac8: "Zu viele Sachen.\nWirf etwas weg."
text.0b30: "Preisgeld für den Sieg:\n5000 Bits.\nIch bekam eine {color:6}Käferperle {color:1}\nals Siegerpreis!"
text.0c00: "Zu viele Sachen!"
text.0c52: "Preisgeld für Platz zwei:\n2000 Bits!\nIch bekam einen {color:6}Hornhelm {color:1}\nals Preis für Platz zwei!"
text.0d22: "Zu viele Sachen!"
text.0d6c: "Preisgeld für Platz zwei:\n2000 Bits!\nIch bekam {color:6}Scherenkiefer {color:1}\nals Preis für Platz zwei!"
text.0e32: "Zu viele Sachen!"
text.0ed6: "- Klasse D -\nTurnier für\nNeuling-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.0fd4: "- Klasse C -\nTurnier für\nChampion-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.10d6: "- Klasse B -\nTurnier für\nChampion-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.11d8: "- Klasse A -\nTurnier für\nUltra-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.12da: "- Klasse S -\nTurnier der\nstärksten Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Sieger der Klasse A."
text.13d4: "- Klasse R -\nMassenkampf-Turnier:\nTaktik ist der Schlüssel\n\nMassenkampf zu viert,\nzwei Runden, acht Teilnehmer.\nBedingungen: keine."
text.1508: "- Version-1-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 1\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Digimon der Version 1."
text.1644: "- Version-2-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 2\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Digimon der Version 2."
text.1780: "- Version-3-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 3\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nder Version 3."
text.18c8: "- Version-4-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 4\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nder Version 4."
text.1a0a: "- Version-0-Pokal -\nKampf auf Zeit für die\nbesten Digimon, die nicht\nzu Version 1 bis 4 gehören.\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\naußerhalb Version 1 bis 4."
text.1b70: "- Feuer-Pokal -\nKampf auf Zeit um den König\nder lodernden Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit feuriger Natur."
text.1caa: "- Ringen-Pokal -\nKampf auf Zeit um den\nKönig des Kampfsports\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit kämpferischer Natur."
text.1df4: "- Donner-Wind-Pokal -\nKampf auf Zeit um den König\nder Digimon der Lüfte\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit luftiger Natur."
text.1f42: "- Kälte-Pokal -\nKampf auf Zeit um den König\nder coolen Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit eisiger Natur."
text.2074: "- Natur-Pokal -\nKampf auf Zeit um den König\nder Natur-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon,\ndie der Natur nahestehen."
text.21c0: "- Metall-Pokal -\nKampf auf Zeit um den König\nder Androiden-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit mechanischer Natur."
text.22fa: "- Dreck-Pokal -\nKampf auf Zeit um den König\nder dreckigen Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit dreckiger Natur."
