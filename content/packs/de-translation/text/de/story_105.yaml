text.00ae: "Was willst du?!"
text.00e8: "Wow!"
text.0104: "...? ...!"
text.011e: "Was? Jetzt?!\nOkay, kämpfen wir!"
text.0196: "Verloren. Mist!"
text.01bc: "Ich sollte ihn in die\nStadt einladen."
text.0206: "Äh, entschuldige."
text.022c: "Würdest du...\nin die Stadt kommen...?"
text.027e: "Was? Stadt?!"
text.029c: "Du meinst diesen...alten Ort?"
text.02dc: "Na ja..."
text.02f0: "Äh......"
text.0306: "Ähm........."
text.0332: "Na gut.\nIch bin Agumon.\nFreut mich."
text.03c6: "Agumon zieht in die Stadt!"
text.0408: "Gut, Fragen kostet nichts.\nIch frag weiter!"
text.0478: "Das ist mein Revier!"
text.04b8: "Was?!"
text.04da: "Jetzt ist meine Chance!"
text.0810: "Diesen Kerl werd ich\neinfach nicht los!"
