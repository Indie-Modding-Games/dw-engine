text.005c: "Myotismon! Was ist passiert?"
text.00b0: "Bakke!"
text.00c6: "..."
text.00ea: "Ich komme mit in die Arena.\nManche vermissen mich sicher."
text.0172: "Meine Leute gehorchen nicht.\nIch nehme SkullGreymon mit."
text.01d8: "SkullGreymon ist nicht mehr\nderselbe. Er hört auf andere."
text.024e: "Myotismon, alles okay?"
text.02a8: "Uff... Du bist es!\nDu hast mich wieder gerettet."
text.0306: "Was ist passiert?"
text.032a: "Hast du Devimon gesehen?"
text.035e: "Ja. Er ist gemein."
text.038a: "Er hat meine Forschung mit\nBosheit ruiniert."
text.03da: "Deine Forschung\nüber SkullGreymon?"
text.0422: "Ich habe Knochen gesammelt\nund zusammengesetzt.\nIch passe besser auf."
text.04b8: "Dieser Devimon ist furchtbar."
text.04ec: "Ich kenne ihn gut."
text.0514: "Was?!"
text.0528: "Er war immer gerissen,\naber nie so schlimm."
text.0580: "Vielleicht hat ihm jemand\ndas Gehirn gewaschen."
text.05d8: "Vielleicht."
text.05ec: "Wäre er er selbst, könnte\ner zu eurer Gruppe gehören."
