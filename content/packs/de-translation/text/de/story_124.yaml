text.008e: "Hmm"
text.00b4: "Sieht aus wie ein Vogelnest.\nWas meinst du?"
text.012e: "Ich höre was."
text.01bc: "Du bist gut."
text.01dc: "Das war also dein Nest."
text.020c: "Ja."
text.0222: "Tut mir leid, dass ich störe."
text.026a: "Ach, mach dir nichts draus."
text.02a4: "?"
text.02ae: "Ich hab von dir gehört."
text.02da: "Bin ich etwa berühmt?"
text.0318: "Du bist wohl der letzte\nMensch auf der Insel."
text.0388: "Der letzte...? Gab es vor\nmir etwa noch andere?"
text.03e0: "Willst du mich nicht in\ndie Stadt einladen?"
text.0440: "Ach ja, kommst du mit\nin die Stadt?"
text.0492: "Okay. Dann kommen wir zur\nSache. Halt dich gut fest."
text.0534: "Birdramon zieht in die Stadt!"
text.066a: "Aufzug"
text.0682: "Einmal nach unten\nZweimal nach unten\nNicht einsteigen"
text.074e: "Hä?"
text.075c: "Nichts. Er geht nicht."
