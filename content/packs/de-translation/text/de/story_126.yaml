text.0060: "Das ist ein Kartenladen."
text.00a0: "Was ist eine Digimon-Karte?"
text.00d4: "Alle sammeln sie.\nDamit machst du nichts falsch."
text.0146: "Oh?"
text.0158: "Zum Einstieg schenk ich dir\neine. Eine richtig gute."
text.01ca: "Hey! Die Karte zeigt MICH!"
text.0206: "Karte von {color:6}{tamer}{color:1} bekommen!"
text.0236: "Das ist ein Kartenladen."
text.027e: "Heute haben wir richtig\ncoole Karten da."
text.02da: "Karte kaufen\nKarte verkaufen\nBeenden"
text.0348: "Dreierpack kaufen\nEine kaufen\nBeenden"
text.03a0: "Eine kaufen\nBeenden"
text.03cc: "Fünfhundert Bits pro Pack.\nWas drin ist, weiß keiner."
text.0442: "Ich kauf's\nNein, danke"
text.0488: "Mach das Pack gleich auf."
text.04e8: "Willst du noch was?"
text.0526: "Komm bald wieder."
text.0552: "Das ist ein Recyclingladen."
text.0594: "Normales Item, bitte\nRecycling-Item, bitte\nNächstes Mal"
text.0676: "Hey!?"
text.0690: "Das ist ein Laden!"
