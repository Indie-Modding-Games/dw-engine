text.0020: "Störe ich?"
text.0090: "{color:7}??? {color:1}\nHilfe!"
text.00ca: "Ich höre eine Stimme von oben.\nIst da jemand?"
text.012c: "{color:7}??? {color:1}\nIst da jemand?"
text.0162: "Ja, hier ist jemand."
text.018a: "{color:7}??? {color:1}\nHilfe!\nDer Boden wölbt sich hoch."
text.01e8: "Du machst wohl Witze."
text.0222: "{color:7}??? {color:1}\nNein, wirklich.\nIch höre Maschinenlärm."
text.029a: "Eine Maschine? Das kommt wohl\naus Ogremons Versteck."
text.0312: "{color:7}??? {color:1}\nHast du da nicht etwas\nfalsch gemacht?"
text.0386: "Ich hab vieles gemacht. Viel-\nleicht der Aufzug... Ich geh\nzum Versteck und sehe nach."
text.0442: "{color:7}??? {color:1}\nDanke."
