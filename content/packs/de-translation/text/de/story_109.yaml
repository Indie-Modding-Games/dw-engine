text.003a: "Wow, das ist ja toll!"
text.0092: "Hey, da ist eine Steintafel.\nMal sehen..."
text.0112: "Da steht „Leomon“.\nDen Rest kann ich nicht lesen."
text.016c: "Sprache verstehe ich,\naber keine Schrift..."
text.01cc: "Nehmen wir sie mit."
text.0200: "Hoppla, ich muss erst\nwas wegwerfen."
text.0262: "Ich hab den\n{color:6}Leomonstein{color:1} bekommen!"
text.02ba: "Wer bist du?"
text.02da: "Wer bist du!"
text.0370: "Ich hab den\n{color:4}Dimensionsschlüsselbund{color:1}!\nNun kann ich 20 Items tragen!"
text.0434: "Ich hab den\n{color:4}Dimensionsschlüsselbund{color:1}!\nNun kann ich 30 Items tragen!"
