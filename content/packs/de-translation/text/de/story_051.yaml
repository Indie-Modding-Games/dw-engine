text.004e: "Ich habe ein mieses Gefühl..."
text.0098: "Ich wusste, dass du kommst!"
text.00e4: "Wer bist du?"
text.0104: "Ich bin Devimon, ein dunkler\nEngel mit finsterer Macht."
text.017c: "Weißt du etwas?"
text.01b0: "Myotismon ist in der Villa.\nVielleicht lebt er noch."
text.021e: "Warst du das?"
text.024a: "Keine Ahnung... ich weiß nur,\ndass du mein Feind bist."
text.02c2: "Du entkommst mir nicht!"
text.030c: "Ha ha ha!"
text.034a: "Oh nein!"
text.036e: "Grüß Myotismon von mir."
text.03cc: "Er ist entkommen!\nDen Kerl mag ich nicht."
text.048a: "Was für eine riesige Villa!"
text.04ca: "Ist jemand zu Hause?"
text.0500: "Keiner da, oder sie\nhören mich nicht."
text.0566: "Na gut. Auf geht's, erkunden!"
text.05be: "Ich habe den\n{color:6}Hausschlüssel{color:1} benutzt!"
text.0622: "Geht nicht auf.\nEs ist abgeschlossen."
text.069a: "Ich habe den\n{color:6}Hausschlüssel{color:1} benutzt!"
text.06fe: "Geht nicht auf.\nEs ist abgeschlossen."
text.0776: "Ich habe den\n{color:6}Hausschlüssel{color:1} benutzt!"
text.07da: "Geht nicht auf.\nEs ist abgeschlossen."
text.0866: "Geht nicht auf. Eine seltsame\nKraft versiegelt es."
