text.0096: "Ich habe von dir gehört."
text.00d6: "Wenn du von uns und der\nStadt gehört hast, warum\nkommst du nicht mit?"
text.0166: "Ich denke auch an die Zukunft\nder Insel. Ich suche schon\nlange nach etwas."
text.0218: "Wonach suchst du?"
text.0252: "Etwas, das meine Ahnen\nhinterließen, aber ich\nweiß nicht, was es ist."
text.02fe: "Verstehe. Wenn ich es finde,\nsage ich dir Bescheid."
text.0354: "Ich suche schon\nsehr lange.\nEs wird schwer zu finden."
text.03cc: "Aber wenn du es findest,\nverspreche ich dir,\nin deine Stadt zu kommen."
text.044c: "Ist es das?"
text.0474: "Oh, das ist es!"
text.04b8: "Das haben meine Ahnen\ngeschrieben. Mal sehen."
text.0524: "Droht der Insel Gefahr,\ngeh in die Stadt."
text.0592: "Meine Ahnen sagen,\ndass ich gehen soll!"
text.05de: "Du hilfst uns also?"
text.061e: "Auf mich kannst du zählen!"
text.0686: "Leomon zieht in die Stadt!"
text.06ca: "Ich muss etwas suchen.\nEntschuldige, ich muss los..."
text.0756: "{color:5}Training:\nSpezialschlag {color:1}"
text.0796: "Starten\nErklären\nBeenden"
text.07ce: "Normal\nBonusversuch\nBeenden"
text.080c: "Schlag mit voller Kraft\nauf einen Betonsack."
text.0868: "Das steigert Angriff\nund max. HP."
text.08c4: "Nochmal erklären\nStarten\nBeenden"
text.091e: "{color:7}Spielautomat {color:1}\nDrück {color:6}△ {color:1}\nfür drei gleiche Bilder."
text.09a0: "{color:5}Training: \nSavannenrunde {color:1}"
text.09de: "Starten\nErklären\nBeenden"
text.0a16: "Normal\nBonusversuch\nBeenden"
text.0a54: "Lauf die Savannenrunde."
text.0a8e: "Das steigert Tempo stark\nund auch max. HP."
text.0afc: "Nochmal erklären\nStarten\nBeenden"
text.0b56: "{color:7}Spielautomat {color:1}\nDrück {color:6}△ {color:1}\nfür drei gleiche Bilder."
