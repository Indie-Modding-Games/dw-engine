text.034c: "Bakke. Bah Kkea."
text.0374: "Ich versteh ihn noch nicht."
text.03dc: "Verstehe. Du gehst für\nuns auf Streife?!"
text.0438: "Schau! Das ist mein ganz\neigenes Schwarzes Brett."
text.048a: "Die Stadt braucht Infos,\nalso mache ich eine Zeitung!\nWas hältst du davon?"
text.053e: "Beim Sammeln von Infos\nkannst du auf mich zählen."
text.059e: "Du liest meine Zeitung."
text.05f0: "Ah, schön kühl und angenehm."
text.0630: "Wenn man es bequem hat,\nfühlt man sich gut."
text.069e: "Wie gefällt dir mein Laden?"
text.06de: "Ich kann nicht gut verkaufen,\naber gerade gibt es sonst\nkeinen, der es macht."
text.0766: "Bring viele Digimon her, okay?"
text.07c0: "Na, was meinst du?"
text.07f8: "{color:7}Coelamon {color:1}\nWir helfen uns gegenseitig\nund verkaufen all diese Items."
text.0912: "Mmmm. Ich sah leckere\nPflanzen und hab sie gegessen."
text.0986: "In der Stadt wurde es\nwohl zu windig."
text.09ee: "Oh, ich hab neulich zufällig\neinen {color:6}Glückspilz {color:1}\ngefunden."
text.0a6c: "Der soll ziemlich selten sein."
text.0aa4: "Ich hab auch von einem\n{color:6}Luxuspilz{color:1} gehört.\nDen würde ich gern finden."
text.0b3e: "Der {color:6}Blaue Apfel {color:1}\naus dem Heimatwald\nschmeckt richtig gut."
text.0bb0: "Die {color:6}Orangebanane {color:1}\naus dem Tropendschungel\nschmeckt richtig gut."
text.0c2c: "Die {color:6}Großbeere {color:1}\nvom Panoramaberg\nschmeckt richtig gut."
text.0c98: "Die {color:6}Süßnuss {color:1}\naus der Zahnradsavanne\nschmeckt richtig gut."
text.0d02: "Das {color:6}Supergemüse {color:1}\nvom Overdell-Friedhof\nschmeckt gut."
text.0d70: "Die {color:6}Rote Beere {color:1}\naus dem Urzeit-Dinograb\nschmeckt gut."
text.0dda: "Die {color:6}Kaktusfeige {color:1}\naus dem Großen Canyon\nschmeckt gut."
text.0e4e: "Die {color:6}Digiananas {color:1}\naus dem Nebelwald\nschmeckt gut."
text.0ff6: "Ich muss dir was sagen."
text.102c: "Was denn?\nBis dann!"
text.106c: "Hast du die reparierte\nOstbrücke gesehen?\nWir haben hart gearbeitet."
text.10f6: "Wir reparieren gerade die\nDigimon-Brücke. Warte etwas."
text.1166: "Am Kap Coela im Süden soll\nes ein seltenes Digimon geben."
text.11e0: "Angeblich taucht es jeden\nTag am späten Nachmittag auf."
text.125c: "Sag mal, wusstest du, dass es\nim Osten der Stadt eine\nkaputte Brücke gibt?"
text.12f0: "Wir dachten, die benutzt eh\nkeiner, also haben wir\nnichts unternommen."
text.138e: "Wir überlegen, sie selbst\nzu reparieren."
text.13e8: "Sieh dir bis dahin den\nWesten und Süden an. Dann\nkomm wieder zu mir."
text.1496: "Warst du im Geko-Sumpf?\nEin freches Digimon\nkönnte dich reinlegen."
text.151c: "Denk dran: Wenn ein Digimon\ndigievolviert, ändern sich\nseine festgelegten Techniken."
text.15ae: "Na ja..."
text.15d6: "Na, wie ist es? Ich hab Licht\ngemacht. Hell genug?"
text.164e: "Machen wir unsere Stadt\nsauber und fröhlich!"
text.16a6: "Macht das Licht einen\nUnterschied?"
text.16f0: "Na ja, das kommt ganz\ndarauf an, wie man's sieht."
text.1746: "Ich bin der Stärkste."
text.1780: "Ich halte mich nicht für\nschwächer als dich. Komm in\ndie Arena, dann siehst du's."
text.1824: "Hey, {color:6}{tamer}{color:1}.\nIch suche in der Stadt nach\nverdächtigen Typen."
text.18a2: "Was ist? Ich störe dich\ndoch nicht, oder?!"
text.192a: "Willkommen in meinem Laden!\nFür dich gibt's gute Preise,\n{color:6}{tamer}{color:1}."
text.1998: "Ich kann nicht gut verkaufen,\naber die anderen auch nicht."
text.1a02: "Ich bin jetzt für den Verkauf\nzuständig. Auf gute Geschäfte!"
text.1a74: "{color:6}{tamer}{color:1}, bitte bring so\nviele Digimon wie möglich\nmit zurück."
text.1b10: "Wie gefällt dir\nmein Laden?"
text.1b50: "Ich kann nicht gut verkaufen,\naber sonst kann's keiner,\nalso muss ich ran."
text.1bcc: "Bring bald viele\nDigimon mit."
text.1c32: "Na, was meinst du?"
text.1c6a: "{color:7}Coelamon {color:1}\nWir helfen uns gegenseitig\nund verkaufen diese Items."
