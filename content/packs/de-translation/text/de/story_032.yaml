text.007e: "He, bald ist er offen!"
text.00e6: "Darauf haben wir gewartet!\nDer Tunnel ist offen!"
text.014e: "Wir müssen nicht mehr über\nden Berg. Danke."
text.01c2: "Danke. Allein hätte ich den\nFelsen nie bewegt."
text.0234: "Was mache ich jetzt?"
text.026e: "Komm doch in die Stadt.\nDort gibt es viel zu tun!"
text.02e6: "Ich hab noch viel Energie.\nIch nehme dein Angebot an."
text.0362: "Bald ist er offen!"
text.03dc: "Drimogemon zieht in die Stadt!"
