"text.03b8": "Willkommen in meinem Laden."
"text.03e4": "Schau, {color:6}{tamer}{color:1}. Das ist\nmein Laden. Ich verkaufe\nalle möglichen Items."
"text.046c": "Bald habe ich mehr Ware.\nAber ich brauche Digimon,\ndie mir hier helfen."
"text.052c": "Ich kaufe und verkaufe\nItems. Komm vorbei, wenn\ndu etwas brauchst."
"text.05c6": "Die Auswahl ist noch klein,\naber mit einem Helfer\nwird es vielleicht besser."
"text.069c": "Ich habe beschlossen,\neinen Itemladen zu eröffnen.\nKomm oft vorbei!"
"text.0726": "Wir haben noch nicht viel,\naber bald wollen wir wachsen.\nHab bis dahin etwas Geduld."
"text.080a": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nich habe meinen Itemladen\neröffnet. Das wird super!"
"text.087c": "Mit mehr Digimon in der\nStadt gibt es mehr Ware."
"text.0920": "{color:6}{tamer}{color:1}, ich helfe jetzt\nin diesem Laden mit.\nKauf bitte viel ein!"
"text.09ea": "Willkommen. Ab heute\narbeite ich hier.\nKomm bitte oft vorbei."
"text.0ab4": "Ich helfe jetzt mit,\ndiesen Laden zu führen.\nKomm jederzeit vorbei."
"text.0b68": "Oh, {color:6}{tamer}{color:1}. Das ist der\nperfekte Ort für mich.\nIch werde hier fleißig sein."
"text.0e56": "Hi, ich habe mit dem Laden\nimmer viel zu tun... Nicht!"
"text.0ec2": "Ich bin etwas faul und\nselten im Laden. \nAber ich hab coole Sachen."
"text.0f5e": "Ja! Das „Trainingsbuch“!\nDamit wird dein\nTraining besser!"
"text.0fe6": "Es ist sehr wertvoll. Für\nfünfzigtausend Bits ist es\ndeins. Sonst bereust du es!"
"text.1094": "Kaufen\nNicht kaufen"
"text.10d6": "Du hast nicht genug Bits."
"text.1126": "Hmmm, du hast ja eine\nMenge Zeug dabei."
"text.1186": "Ich habe das\n{color:6}Trainingsbuch{color:1}!"
"text.11c2": "Rabatt gibt es keinen."
"text.123a": "Hast du Probleme, weil\ndu zu viel Zeug\ndabeihast?"
"text.12b2": "Ein Schlüsselbund irgendwo\nverbindet deine Tasche mit\neiner anderen Dimension."
"text.135a": "Damit kannst du mehr\nItems tragen."
"text.13be": "Schau auch an Orten nach,\nan denen du schon warst."
"text.1432": "Ich verrate dir das Geheimnis\nbeim Itemkauf."
"text.1488": "Drück die Start-Taste\nauf dem Item, über das du\nmehr wissen willst!"
"text.1514": "Wähl das Item mit {color:6}△{color:1}\nund drück {color:4}□{color:1}, wenn du\nviele kaufen willst."
"text.159e": "Um zehn mehr oder weniger:\nOben oder Unten drücken\nund dabei {color:10}○{color:1} halten."
"text.1636": "Ach ja, kauf direkt nach\neiner Digievolution etwas.\nDann passiert was Gutes!"
