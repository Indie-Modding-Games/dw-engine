text.0060: "Daa!"
text.007e: "Haa!"
text.009c: "Gghhee!"
text.00c6: "Osten: Aufzug\nWesten: Gefahr, Klippe"
text.0120: "Oger-Modus : AN\nOger-Modus : AUS"
text.0196: "Was?"
text.01fa: "Der Boden hat gebebt.\nOder war das Einbildung?"
text.02c8: "Was? Das gibt's nicht!"
text.0344: "{color:6}{tamer}{color:1}Wow!!"
text.0370: "Vorsicht, Einsturzgefahr!"
text.03d6: "Auf dieser Straße greifen\nangeblich Banditen an."
text.0438: "Los, {color:10}{partner}{color:1}."
text.0480: "Juhuu!"
text.049c: "Haha!"
text.04b0: "Jaa-huu!"
text.050e: "Gib auf und lass dein Zeug da!\nSonst gibt's was!"
text.0562: "Nein, gib du doch auf!"
text.058a: "Was?! Du...?"
text.05ae: "Das kann nicht sein."
text.05ce: "Boss, was machen wir?"
text.0602: "Keine Sorge, wir sind stärker\nund in der Überzahl.\nSchnappt sie euch!"
text.06d2: "Das zahle ich dir\neines Tages heim!"
text.0724: "Sieh, wie sie rennen! Die\nkommen so bald nicht wieder."
