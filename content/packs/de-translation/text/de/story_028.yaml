text.002c: "Hab das Schild repariert."
text.0086: "Ist das heiß! Tu was!"
text.00c8: "Was ist hier los?"
text.00f4: "Es ist zu heiß!\nIch halte das nicht mehr aus!"
text.0178: "Die Hitze hat mich\nganz wirr gemacht."
text.01c8: "Ich weiß, es ist heiß, aber...\nbleib cool, Mann!"
text.0218: "Je tiefer wir graben, desto\nheißer wird es. Der Tunnel\nliegt in einem Vulkan."
text.02a0: "Ich glaube, das ist nicht\nder einzige Grund. Vielleicht\nbrennt es irgendwo."
text.0330: "Hmmm"
text.0340: "Ich hab keine andere Wahl.\nIch muss die Hitze ertragen\nund weitergraben."
text.03d0: "Wir finden die Ursache.\nEs wäre toll, wenn der\nTunnel durchkommt."
text.045a: "Du bist ein netter Kerl.\nIch beeile mich und\ngrabe den Tunnel!"
text.050e: "Heute bin ich mit\nKochen dran."
