text.001e: "{color:6}{tamer}{color:1}, du hast es geschafft!"
text.0044: "Agumon ist in die Stadt\ngezogen. Er hat dort drüben\nein Geschäft eröffnet."
text.00be: "Hoffentlich werden mehr\nDigimon so wie er!"
text.012c: "Palmon ist gekommen und will\ndas Fleischfeld vergrößern."
text.019c: "Dann gibt es viel Fleisch!"
text.01f4: "Kunemon ist gekommen und\nwill Gras fressen."
text.024e: "Hoffentlich frisst er Unkraut!"
text.02a2: "Centarumon ist gekommen und\nwill eine Klinik eröffnen."
text.0310: "Keine Sorge mehr wegen\nKrankheit oder Wunden!"
text.0386: "Coelamon ist gekommen und\nwill einen Laden eröffnen."
text.03ec: "Die Stadt wird aufblühen!"
text.0438: "Betamon ist gekommen und\nwill gern einen Laden führen."
text.04a8: "Die Stadt wird aufblühen!"
text.04f4: "Bakemon ist gekommen und hat\netwas Unverständliches gesagt."
text.056c: "Na ja, das ist schon okay."
text.05b6: "Vegiemon ist da. Er will das\nFleischfeld noch erweitern."
text.0632: "Keine Sorgen mehr ums Essen."
text.0686: "Tyrannomon ist gekommen und\nsagt, er kocht am besten."
text.06f8: "Na, das hat seinen Reiz."
text.0746: "Meramon ist gekommen und\nsagt, er sei der Flammenchef."
text.07c0: "Er brennt vor Motivation!"
text.0816: "Frigimon ist gekommen und\nhat was von Snacks erzählt."
text.0882: "Ich liebe Snacks."
text.08bc: "Garurumon ist gekommen und\nsagt, er kann kochen."
text.091e: "Er ist ziemlich geschickt."
text.0964: "Birdramon ist gekommen und\nwill Bote werden."
text.09c4: "Klingt gut."
text.09fa: "Shellmon ist gekommen und\nwill Anschlagbretter bauen."
text.0a70: "Ein Schritt in Richtung\nInformationsgesellschaft!"
text.0ada: "Elecmon ist gekommen und\nwill Strom anschalten."
text.0b46: "Hoffentlich wird es hell."
text.0b9c: "Kokatorimon ist gekommen und\nwill eine Statue bauen."
text.0c10: "Ein Ort zum Entspannen."
text.0c66: "Monochromon ist gekommen und\nwill als Leiter des\nItemladens arbeiten.{stop}"
text.0d08: "Er ist ein echter Profi."
text.0d4e: "Unimon ist gekommen und will\nsich im Handel nützlich machen."
text.0dc4: "Eine gute Einstellung."
text.0e12: "Patamon ist gekommen und hat\nnach spannenden Jobs gefragt."
text.0e78: "Ich riet ihm zum Itemladen."
text.0ec8: "Biyomon ist gekommen und hat\nnach einem guten Job gefragt."
text.0f3c: "Ich riet ihm zum Itemladen."
text.0f8c: "Greymon ist gekommen und\nwill eine Arena bauen."
text.0ff2: "Das will ich\nunbedingt sehen."
text.104c: "Penguinmon ist gekommen\nund will ein Stadion\nfürs Curling bauen."
text.10ca: "Es wird richtig vielfältig."
text.1120: "Angemon ist gekommen und\nwill Gespräche\naufzeichnen."
text.1194: "Er ist ganz in der Nähe."
text.11ce: "Drimogemon ist gekommen und\nwill die Schatzsuche zu\nseinem Hauptberuf machen."
text.1270: "Eine große Aufgabe!"
text.12a2: "Gabumon ist gekommen und\nwusste nicht so recht,\nwas er machen soll."
text.1334: "Ich riet ihm zu einer\nrichtig großen Aufgabe."
text.13a0: "Ninjamon ist gekommen und\nhat vom Training erzählt."
text.1400: "Fleißige sieht man gern."
text.145a: "Whamon ist gekommen und\nwill die Aufgabe einer\nFähre übernehmen."
text.14e0: "Toll!"
text.150a: "Mojyamon ist gekommen und\nwill einen Laden\nfür alles eröffnen."
text.1586: "Irgendwas ist aber\nkomisch daran."
text.15f4: "Mamemon ist gekommen und will\nkostbare Items verkaufen."
text.166a: "Was meint er wohl\nmit „kostbar“?"
text.16c8: "Numemon ist gekommen und\nwill einen Laden eröffnen,\naber das ist geheim."
text.1752: "Das ist jetzt kein Geheimnis."
text.17a0: "Kabuterimon ist gekommen und\nwill trainieren und umbauen."
text.181e: "Ging er zum Trainingsplatz?"
text.1872: "Kuwagamon ist gekommen und\nfragt, wo Kabuterimon ist."
text.18d8: "Wo ist er wohl hin?"
text.1916: "Giromon ist gekommen und\nsagt: Gib eine Bestellung auf!"
text.1976: "Also gib eine Bestellung auf."
text.19b8: "Ogremon ist gekommen und\nwollte mir den Arm verkaufen."
text.1a1c: "Seine Augen haben gefunkelt!"
text.1a66: "Leomon ist gekommen und hat\nviel über die Stadt gefragt."
text.1acc: "Die Savannenpatrouille gibt\nes wohl immer noch!"
text.1b40: "Piximon kam und fragte mich:\n„Hey, Meister, willst du\nein geheimes Item?“"
text.1bca: "Er macht mir Sorgen."
text.1c04: "Etemon ist gekommen und will\neinen coolen Laden eröffnen."
text.1c70: "Klingt verdächtig."
text.1cb2: "MetalMamemon ist gekommen\nund will einen Job, bei dem\ner sich mit {color:6}{tamer}{color:1} misst."
text.1d4e: "Er hat Kampfgeist."
text.1da4: "Vademon ist gekommen und...\nMoment, ist er gekommen?"
text.1dfc: "Ich weiß es nicht mehr."
text.1e4c: "MetalGreymon ist gekommen\nund will Model werden"
text.1eb2: "Er hält sich für was Tolles!"
text.1efc: "Nanimon kam und ging wieder."
text.1f38: "Wo er wohl gerade ist?"
text.1f80: "Monzaemon ist gekommen, oder\nbesser, seine Hülle ist\nplötzlich aufgetaucht."
text.2012: "Er lässt sie lieber zu Hause."
text.206e: "Devimon ist gekommen und hat\nvon einem tollen Item erzählt."
text.20e4: "Es ist wohl wirklich toll."
text.2130: "Airdramon ist wieder gesund\nund will arbeiten."
text.219a: "Schön, dass er wieder fit ist."
text.21f4: "Digitamamon ist gekommen und\nmit Lichtgeschwindigkeit weg."
text.2264: "Er ist noch irgendwo\nin der Stadt."
text.22c4: "SkullGreymon ist gekommen\nund will in der Arena\nantreten."
text.233e: "Myotismon hat übersetzt."
text.2396: "Andromon ist gekommen und hat\ngesagt, es freue ihn sehr."
text.23fa: "Er kann wohl nicht\nlange bleiben."
