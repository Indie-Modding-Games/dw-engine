text.0056: "Mensch, gib mir {color:6}Fleisch{color:1}!"
text.008c: "Willkommen, du willst also\n{color:6}Fleisch{color:1}. Na ja, äh..."
text.0100: "Preis erhöhen\nBei fünfzig Bits lassen\nPreis senken"
text.0172: "Äh, du wolltest\n{color:6}Fleisch{color:1}, oder? Äh..."
text.01e8: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfundsiebzig Bits?"
text.0256: "Auf fünfundsiebzig erhöhen\nNoch mal überlegen"
text.02de: "Und {color:6}Fleisch{color:1} zu fünfzig\nBits für siebzig Bits?"
text.033a: "Auf siebzig erhöhen\nNoch mal überlegen"
text.03c2: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfundsechzig Bits?"
text.042c: "Auf fünfundsechzig erhöhen\nNoch mal überlegen"
text.04b0: "Und {color:6}Fleisch{color:1} zu fünfzig\nBits für sechzig Bits?"
text.0508: "Auf sechzig erhöhen\nNoch mal überlegen"
text.058c: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfundfünfzig Bits?"
text.05f6: "Auf fünfundfünfzig erhöhen\nNoch mal überlegen"
text.066e: "Und {color:6}Fleisch{color:1} zu fünfzig\nBits zum Normalpreis?"
text.06ca: "Zum Normalpreis anbieten\nNoch mal überlegen"
text.074c: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfundvierzig Bits?"
text.07b6: "Auf fünfundvierzig senken\nNoch mal überlegen"
text.083a: "Und {color:6}Fleisch{color:1} zu fünfzig\nBits für vierzig Bits?"
text.0892: "Auf vierzig senken\nNoch mal überlegen"
text.0916: "{color:6}Fleisch{color:1} zu fünfzig Bits\nfür fünfunddreißig Bits?"
text.0982: "Auf fünfunddreißig senken\nNoch mal überlegen"
text.0aca: "Gut, verkauft!"
text.0b12: "Gesamtgewinn: {shopvar}\nGewinn:\nvierzig"
text.0b68: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfunddreißig"
text.0bca: "Gesamtgewinn: {shopvar}\nGewinn:\ndreißig"
text.0c22: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfundzwanzig"
text.0c84: "Gesamtgewinn: {shopvar}\nGewinn:\nzwanzig"
text.0cdc: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfzehn"
text.0d36: "Gesamtgewinn: {shopvar}\nGewinn:\nzehn"
text.0d88: "Gesamtgewinn: {shopvar}\nGewinn:\nfünf"
text.0dd2: "Gesamtgewinn: {shopvar}\nGewinn:\nnull"
text.0e94: "Tschüss! Ich bin weg!!"
text.0ef6: "Wann kommen nur Kunden...?"
text.0f44: "Gib mir einen Rabatt!"
text.0f74: "Na ja... Also dann..."
text.0fa8: "Hey! Gib mir ein \n{color:6}Reiseklo{color:1}."
text.0fee: "Äh... Willkommen, du willst\nein {color:6}Reiseklo{color:1}?"
text.1060: "Preis erhöhen\nBei dreihundert Bits lassen\nPreis senken"
text.10dc: "Äh... du wolltest ein\n{color:6}Reiseklo{color:1}?"
text.114a: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nvierhundertfünfzig Bits?"
text.11e6: "Auf vierhundertfünfzig erhöhen\nNoch mal überlegen"
text.1274: "Wie wär's: ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nvierhundertzwanzig Bits?"
text.131a: "Auf vierhundertzwanzig erhöhen\nNoch mal überlegen"
text.13a4: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\ndreihundertneunzig Bits?"
text.1444: "Auf dreihundertneunzig erhöhen\nNoch mal überlegen"
text.14d0: "Wie wär's: ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\ndreihundertsechzig Bits?"
text.1576: "Auf dreihundertsechzig erhöhen\nNoch mal überlegen"
text.1600: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\ndreihundertdreißig Bits?"
text.16a0: "Auf dreihundertdreißig erhöhen\nNoch mal überlegen"
text.1720: "Wie wär's: ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits zum\nNormalpreis: dreihundert?"
text.17c6: "Zum Normalpreis anbieten\nNoch mal überlegen"
text.1848: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nzweihundertsiebzig Bits?"
text.18e6: "Auf zweihundertsiebzig senken\nNoch mal überlegen"
text.1974: "Wie wär's: ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nzweihundertvierzig Bits?"
text.1a16: "Auf zweihundertvierzig senken\nNoch mal überlegen"
text.1aa2: "Und ein {color:6}Reiseklo{color:1}\nzu dreihundert Bits für\nzweihundertzehn Bits?"
text.1b38: "Auf zweihundertzehn senken\nNoch mal überlegen"
text.1c82: "Ja! Abgemacht!"
text.1cd4: "Gesamtgewinn: {shopvar}\nGewinn:\nzweihundertvierzig"
text.1d42: "Gesamtgewinn: {shopvar}\nGewinn:\nzweihundertzehn"
text.1dac: "Gesamtgewinn: {shopvar}\nGewinn:\neinhundertachtzig"
text.1e1c: "Gesamtgewinn: {shopvar}\nGewinn:\neinhundertfünfzig"
