text.208c: "Ich finde es etwas teuer."
text.20c4: "Meinst du? Also dann..."
text.20fc: "Mensch! Gib mir\n{color:6}Medizin{color:1}."
text.213a: "Äh... Willkommen, du willst\n{color:6}Medizin{color:1}?"
text.21a0: "Preis erhöhen\nBei eintausend Bits lassen\nPreis senken"
text.221a: "Äh, du wolltest\n{color:6}Medizin{color:1}, oder?"
text.228c: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\nfünfzehnhundert Bits?"
text.2318: "Auf fünfzehnhundert erhöhen\nNoch mal überlegen"
text.23a2: "Und {color:6}Medizin{color:1}\nzu eintausend Bits für\nvierzehnhundert Bits?"
text.2428: "Auf vierzehnhundert erhöhen\nNoch mal überlegen"
text.24b4: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\ndreizehnhundert Bits?"
text.2542: "Auf dreizehnhundert erhöhen\nNoch mal überlegen"
text.25ce: "Und {color:6}Medizin{color:1}\nzu eintausend Bits für\nzwölfhundert Bits?"
text.2650: "Auf zwölfhundert erhöhen\nNoch mal überlegen"
text.26d8: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\nelfhundert Bits?"
text.2762: "Auf elfhundert erhöhen\nNoch mal überlegen"
text.27de: "Und {color:6}Medizin{color:1}\nzu eintausend Bits zum\nNormalpreis: eintausend?"
text.2868: "Zum Normalpreis anbieten\nNoch mal überlegen"
text.28ea: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\nneunhundert Bits?"
text.2970: "Auf neunhundert senken\nNoch mal überlegen"
text.29fa: "Und {color:6}Medizin{color:1}\nzu eintausend Bits für\nachthundert Bits?"
text.2a7a: "Auf achthundert senken\nNoch mal überlegen"
text.2b06: "Wie wär's: {color:6}Medizin{color:1}\nzu eintausend Bits für\nsiebenhundert Bits?"
text.2b8e: "Auf siebenhundert senken\nNoch mal überlegen"
text.2cdc: "Okay! Ich nehm's."
text.2d2a: "Gesamtgewinn: {shopvar}\nGewinn:\nachthundert"
text.2d90: "Gesamtgewinn: {shopvar}\nGewinn:\nsiebenhundert"
text.2df6: "Gesamtgewinn: {shopvar}\nGewinn:\nsechshundert"
text.2e58: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfhundert"
text.2ebc: "Gesamtgewinn: {shopvar}\nGewinn:\nvierhundert"
text.2f20: "Gesamtgewinn: {shopvar}\nGewinn:\ndreihundert"
text.2f86: "Gesamtgewinn: {shopvar}\nGewinn:\nzweihundert"
text.2fe8: "Gesamtgewinn: {shopvar}\nGewinn:\neinhundert"
text.3040: "Gesamtgewinn: {shopvar}\nGewinn:\nnull"
text.30d6: "Du verlangst zu viel."
