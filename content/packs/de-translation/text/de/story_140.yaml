text.00b2: "Was ist los?!"
text.00e2: "Willkommen zurück, Hagurumon!"
text.0122: "Hagurumon?!"
text.0168: "Was geht hier vor?!"
text.01d8: "{color:7}Spielzeug {color:1}\nEs ist eine alte Sage.\nEin Bösewicht kam von\nweit her auf diese Insel."
text.0280: "{color:7}Spielzeug {color:1}\nDie Bösen sagten den Digimon:\nDiese Insel gehört uns."
text.030a: "{color:7}Spielzeug {color:1}\nDie Digimon sagten ihnen:\nDas stimmt nicht. Die Insel\ngehört allen."
text.03b8: "{color:7}Spielzeug {color:1}\nDie Digimon hielten zusammen\nund stellten sich den Bösen.\nDie bekamen eine Lektion."
text.0494: "{color:7}Spielzeug {color:1}\nDoch die Bösen sagten:\nWartet, wir kriegen euch!\n...und verschwanden."
text.0554: "{color:7}Spielzeug {color:1}\nEs ist eine alte Sage."
text.05b0: "Hmmm, wie fröhlich...\nOh, warte mal."
text.05fc: "Die Geschichte aus dem Lied\nist eine alte Sage dieser\nInsel, oder?"
text.0684: "Dass die Digimon die\nBösen besiegt haben..."
text.06e0: "Hmmm, wer wohl die Bösen\nin der Geschichte waren?"
text.0750: "Danke für deine Hilfe.\nDas hier als Dankeschön."
text.07cc: "Monzaemons Plüschtier\nzieht in die Stadt!"
text.0850: "Warte, hat WaruMonzaemon\nnicht was verloren?"
text.08be: "Viel Glück!\nEs ist das Haus nebenan!"
text.092a: "......"
text.09cc: "Oh, Monzaemon!\nDu lebst ja noch!"
text.0a16: "Wow, was ist das?"
text.0a3e: "Kämpf gegen WaruMonzaemon!\nSchnell, alle zusammen,\nlos! Schnell, schnell!"
text.0ace: "Warte...warte! Er ist nicht\nder Monzaemon, den ihr kennt."
text.0b38: "Hä? Wie meinst du das? Aber\ner ist doch ein Monzaemon?"
text.0bb2: "Ja, er ist schon\nein Monzaemon."
text.0c0a: "Ein Bösewicht, WaruMonzaemon,\nhat meine Freunde entführt."
text.0c7a: "Ich glaube, nur Monzaemon\nkann ihn besiegen!"
text.0cec: "Hmm, dann müssen wir den\nBösewicht finden. Wo ist er?"
text.0d5a: "Er ist nebenan. Ich löse\ndas Siegel an der Tür."
text.0dc2: "Also geh bitte hin und\nsieh, was du tun kannst."
text.0e14: "Verstehe. Na gut,\nich helfe dir!"
text.0e60: "Danke!"
text.0e88: "Danke!"
text.0eb0: "Danke!"
