text.0050: "Er ist da! Es hat geklappt!"
text.0094: "Ein Mensch.\nGenau wie du sagtest, Jiji."
text.00e8: "Mmmm."
text.0102: "Pssst, er steht auf."
text.0140: "Hä? Wo bin ich?"
text.0170: "Willkommen in der\nDigimon-Welt!"
text.01ae: "Was?"
text.01d0: "Huch!"
text.01ec: "Was ist los?"
text.0220: "Wer seid ihr denn?"
text.0266: "Das sind Digimon."
text.0296: "Digi... was?"
text.02c0: "Hä? Ich dachte, du kennst\ndich mit Digimon aus."
text.0320: "Ich hab's, das ist ein Traum."
text.0364: "Das ist kein Traum."
text.039a: "Moment, du bist Tokomon.\nWas für ein echter Traum."
text.0412: "{color:6}{tamer}{color:1}, das ist kein\nTraum, aber auch\nnicht echt."
text.048a: "Wovon redest du?\nWer bist du?"
text.04ea: "Ich bin Jijimon."
text.0514: "Ich kenne kein Digimon\nmit diesem Namen."
text.0576: "Es gibt mehr Digimon, als\ndu kennst. Das hier\nist die Digimon-Welt."
text.0600: "Digimon-Welt?!"
text.0636: "Diese Welt ist kein Traum\nund auch nicht echt.\nEs ist unsere Welt."
text.06b8: "Mensch... Für einen Traum\nwirkt das zu echt."
text.071e: "Schau hinter dich, dann\nverstehst du, was ich meine."
text.077a: "Was?"
text.07b6: "Ist das {color:10}{partner}{color:1}?"
text.07e2: "Jetzt weiß ich's! Mich zog\nder Digimon-Anhänger hinein."
text.0864: "Genau."
text.0892: "Warum bin ich hier?"
text.08be: "Komm zu mir nach Hause,\ndann erkläre ich es."
text.0a62: "Ich habe dich hergeholt,\ndamit du uns rettest."
text.0aaa: "Euch retten? Wovor?"
text.0ae0: "Wir sind in der File-Stadt,\ndem Zentrum der File-Insel."
text.0b58: "Eine Stadt? Hier?"
text.0b86: "Na ja, es war eine Stadt.\nHier lebten früher alle\nmöglichen Digimon."
text.0c2e: "Die Digimon verloren ihr Herz\nund zogen aus der Stadt weg."
text.0ca6: "Wie meinst du das?"
text.0cdc: "Ich weiß nicht, warum. Die\nDigimon verlernten nach und\nnach das Sprechen."
text.0d84: "Manche sprechen noch, aber\nalle haben vergessen, dass\nsie hier gewohnt haben."
text.0e14: "Das meintest du also mit\n„ihr Herz verlieren“."
text.0e70: "Wenn wir nichts tun,\nwird es gefährlich."
text.0ebc: "Aber warum ich?"
text.0ee2: "Du kannst gut Digimon\naufziehen, oder?"
text.0f3c: "Und ob ich das kann!"
text.0f7c: "Merkst du nicht, dass du\nDigimonisch sprichst?"
text.0fe6: "Hä? Quatsch. Ich spreche\nganz normales Deutsch."
text.104e: "Für uns klingt es Digimonisch."
text.10a2: "Genau!"
text.10d4: "In dieser Welt gibt dir\ndeine Liebe zu Digimon\nKraft."
text.1158: "Danke."
text.1176: "Deshalb habe ich dich gewählt.\nDu kannst alle Digimon der\nInsel zusammenbringen!"
text.120a: "Was?"
text.121c: "Hm?"
text.122c: "Auf mich kannst du zählen!"
text.126c: "Sehr gut!"
text.1294: "Danke, du bist unsere Rettung."
text.12da: "Wo fange ich an?"
text.130c: "Nimm {color:10}{partner}{color:1} mit und\nerkunde die Insel."
text.1360: "Finde die Ursache der Gefahr\nund hol die Digimon\nzurück."
text.13f6: "Los geht's, {color:10}{partner}{color:1}!"
text.1444: "Warte, ich bin nicht fertig."
