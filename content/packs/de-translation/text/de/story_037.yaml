text.00a2: "Ich hau dich k.o.!"
text.00de: "He, schubs mich nicht!"
text.011a: "So friedlich hier oben!"
text.015c: "Ich falle! Das ist gefährlich!"
text.01a6: "Lass das hier oben!"
text.01e8: "Leg dich nicht mit mir an!"
text.0238: "Aufzug"
text.0250: "RUNTER drücken\nNicht einsteigen"
text.0302: "Nichts passiert.\nDas ist nicht gut."
