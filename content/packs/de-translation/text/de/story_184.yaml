text.003e: "!!!"
text.006c: "Ein Ei!"
text.0080: "Ist das etwa Machinedramons?"
text.00c8: "Das könnte Ärger geben!"
text.015e: "Digitamamon zieht\nin die Stadt!"
text.01b8: "!"
text.01e2: "Da ist er! Gefunden!"
text.022a: "Du bist der Boss!"
text.0252: "Freut mich.\nIch bin Analogman."
text.029a: "Ich weiß alles über dich, aber\nnicht, dass du ein Kind bist."
text.030e: "Unglaublich, dass ein Kind\nmeinen Plan durchkreuzt hat."
text.0378: "Fast hätte ich die\nNetzwelt beherrscht."
text.03ce: "Du bist erwachsen! Hör auf,\ndu tust allen weh."
text.0442: "Mir ist egal, ob ich\nDigimon wehtue."
text.049a: "Digimon sollen Menschen\nwie Sklaven gehorchen."
text.04fa: "Falsch! Digimon haben Herz\nund Verstand!\nWir sind Freunde!"
text.0578: "Ein Kampf zeigt, wer besser\nist: Sklaven oder Freunde."
text.060c: "Du bist dran, Machinedramon!"
text.0698: "Wir haben's geschafft, {color:10}{partner}{color:1}!"
text.06e0: "Unmöglich!\nMein stärkster Sklave!"
text.0736: "Siehst du, du lagst falsch!"
text.0772: "Na so was..."
text.07b4: "Wenn du die Insel in Ruhe\nlässt und um Verzeihung\nbittest, verzeihen sie dir."
text.0854: "Ich hätte Digimon nie trauen\nsollen. Ich mach's selbst."
text.08e2: "Was hast du vor?!"
text.0926: "{color:7}Analogman {color:1}\nIch sprenge die Insel und\nfliehe in eine andere\nWelt. Pech gehabt, Kleiner!"
text.0a12: "Oh neiiin!!"
text.0a3c: "{color:7}Analogman {color:1}\nJetzt ist es aus mit dir!"
text.0a86: "Tut mir leid, Leute. Ich\nkann jetzt nichts mehr tun."
text.0af0: "{color:7}??? {color:1}\nAlles gut."
text.0b30: "Hä?"
text.0b56: "{color:7}Analogman {color:1}\nEs wird nicht übertragen!\nIm Programm stimmt was\nnicht. Was ist hier los?!"
text.0c18: "Ich höre die Stimmen aller!\nWer ist da?"
text.0c7e: "{color:7}Jijimon {color:1}\nWir schicken dir gerade\nunsere Energie."
text.0cee: "{color:7}Tokomon {color:1}\nHörst du unsere Stimmen?"
text.0d3c: "{color:7}Agumon {color:1}\nWir sind wohl rechtzeitig da!"
text.0d8e: "Ihr alle..."
text.0dc4: "{color:7}Analogman {color:1}\nNein, blödes Ding! Hilfe!\nHelft mir! Ahhhhhhh!!!"
text.0ec4: "Er ist weg! Was ist passiert?"
text.0efe: "{color:7}Jijimon {color:1}\nIch weiß nicht. Aber..."
text.0f4c: "Jijimon? Gleich explodiert's!\nTu was!"
text.0fa2: "{color:7}Jijimon {color:1}\nEr müsste jetzt hier sein."
text.1032: "Airdramon!"
text.104e: "Beeil dich, los!"
text.10ac: "Analogman ist fort."
text.10d8: "Auf der File-Insel herrscht\nwieder Frieden."
text.1124: "Und..."
