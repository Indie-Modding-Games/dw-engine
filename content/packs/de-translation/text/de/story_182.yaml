text.0056: "Endlich sind wir da."
text.008c: "Bist du der Boss?"
text.00ba: "Tut mir leid, bin ich nicht.\nIch bin MetalGreymon!"
text.0114: "Dich erledige ich später!\nAus dem Weg!"
text.015e: "Für dich gehe ich nicht weg.\nHier kommst du nicht vorbei."
text.01c4: "Ich will Kraft sparen. Gegen\nihn zu kämpfen bringt nichts."
text.0230: "Ich hol dich!"
text.0294: "Hä? Wo bin ich?"
text.02bc: "Du bist wieder bei Sinnen!"
text.02f6: "Sieht so aus..."
text.0316: "Wenn du sie besiegst, sehen\nwir uns vielleicht wieder.\nBis dahin, mach's gut."
