text.0052: "Taaa!"
text.0072: "So, nimm das!"
text.00ae: "Schaaaa!"
text.00d2: "Buooon!"
text.011e: "Wer bist du? Niemand bringt\nhier etwas durcheinander!"
text.0194: "Keine Sorge. Wir reisen\nnur hindurch, um\ndie Insel zu retten."
text.0220: "Ich trau dir nicht, hau ab!"
text.0260: "Moment mal."
text.02cc: "Bist du etwa...?"
text.030e: "Hab ich's doch gesagt!"
text.0336: "Tut mir leid. Wir haben\nselten Besuch, da bin ich\nbei meinem Job übereifrig."
text.03d2: "Job?"
text.03e2: "Ich bewache einen Ort namens\nUrzeit-Dinoregion."
text.0448: "Die Gegend ist unerforscht."
text.0484: "Zeigst du sie mir?"
text.04bc: "Die Urzeit-Dinoregion ist\nin zwei Teile geteilt."
text.0520: "Wo wir leben, heißt\nEiszeit-Zeitzone."
text.057a: "Ein besonderer Ort, wo\ndie Zeit langsam vergeht."
text.05de: "Die Zeit vergeht langsam?"
text.0608: "Der andere Ort ist\ndie Tempo-Zeitzone."
text.0656: "Sie ist gefährlich und liegt\nhinter der Eiszeit-Zeitzone."
text.06c8: "Gefährlich, weil die Zeit\ndort sehr schnell vergeht."
text.071c: "Das Land ist kahl. Überall\nKnochen und Fossilien."
text.0782: "Weil die Zeit dort schneller\nvergeht als anderswo?"
text.07fc: "Genau. Bleib nicht zu lange."
text.083c: "Da ich dir den Weg versperre,\nkommst du nicht hin."
text.08a4: "Du hast verloren."
text.08c2: "Ich hatte Pech! Das passiert\nnicht oft."
text.0918: "Ach ja?"
text.093c: "Ich muss nach Hause.\nFrag andere Digimon,\nwenn du Fragen hast."
