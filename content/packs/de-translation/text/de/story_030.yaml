text.0060: "Mist! Ein großer Felsen!"
text.0098: "Da bohre ich nicht durch."
text.00c6: "Geht nicht? Oh nein!"
text.00f0: "Wir müssen ihn irgendwie\nbewegen. Schaffst du das?"
text.0164: "Weiß ich nicht."
text.0192: "{color:10}{partner}{color:1},\nich brauche deine Hilfe."
text.034e: "Geschafft!"
text.036a: "Wow, was für eine Kraft!\nDer Felsen ist weg!"
text.03be: "Ab hier ist es wohl\nleer."
text.041e: "Ein Lavafluss!\nDas ist gefährlich!"
text.0468: "Am Fluss entlang führt\nein Weg. Los geht's!"
text.04c2: "Gehst du rein?\nPass auf!"
text.0516: "Gehst du rein?\nPass auf!"
text.0576: "Komm mit {color:10}{partner}{color:1}wieder,\nwenn es größer ist."
