text.00c6: "Hey, {color:6}{tamer}{color:1}!"
text.00f4: "Hey, {color:6}{tamer}{color:1}!"
text.0122: "Hey, {color:6}{tamer}{color:1}!"
text.0154: "Danke, dass du wieder da bist!"
text.0190: "Hi, ich bin Mojyamon!"
text.0280: "{color:6}{tamer}{color:1}, ich freu mich so!\nDu hast so viel für uns getan."
text.02e2: "Ich hab beschlossen, in die\nStadt zu gehen. Wir arbeiten\nzusammen, okay?"
text.03a4: "Mojyamon zieht in die Stadt!"
