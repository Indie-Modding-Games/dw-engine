text.0022: "Es sieht so aus, als wäre\n{color:10}{partner}{color:1} verblasst..."
text.0064: "Vor dem Verblassen legte er\nein Digitama. Mit seinen\nFähigkeiten kehrt er zurück."
text.0116: "Welches Ei willst du?"
text.0158: "Wenn du willst, kannst du\n{color:10}{partner}{color:1} umbenennen."
text.01b0: "Neuer Name\nNamen behalten"
text.0214: "Ist {color:10}{partner}{color:1} okay?"
text.0234: "Anderer Name\nOkay"
text.02a0: "He, werd bloß nicht krank!"
text.02ce: "Mit dem letzten bisschen\nLeben hat {color:10}{partner}{color:1}\nüberlebt."
text.0346: "Du musst vorsichtig sein."
text.0384: "Oje! Du bist nach einer\nNiederlage zurück."
text.03d4: "Mit dem letzten bisschen\nLeben hat {color:10}{partner}{color:1}\nüberlebt."
text.044c: "Wurdest du etwa bestohlen?"
text.048e: "Wer im Kampf verliert, dem\nwird vielleicht etwas geklaut."
text.0502: "Gestohlenes wird vielleicht\nirgendwo verkauft. Gib die\nSuche nicht auf!"
text.059e: "Oh nein! {color:10}{partner}{color:1}\nhat kein Leben mehr."
text.05de: "Bevor er verblasste, hat\n{color:10}{partner}{color:1}\nein Digitama gelegt."
text.0646: "Wegen der Gefahr hat das\nDigitama nicht alle\nFähigkeiten geerbt..."
text.06d8: "{color:4}Die Bändigerstufe\nist gesunken! {color:1}"
text.0726: "Wenn du willst,\nkannst du {color:10}{partner}{color:1}\numbenennen."
text.0780: "Neuer Name\nNamen behalten"
text.0872: "{color:10}{partner}{color:1} ist digievolviert!"
