"text.002e": "!"
"text.005e": "Bist du {color:6}{tamer}{color:1}?"
"text.007e": "Ein Skelett-Digimon?!"
"text.00ac": "Bist du {color:10}{partner}{color:1}?"
"text.00cc": "Ich spüre kein Leben in ihm,\nnur etwas Böses."
"text.0126": "Hat er etwa Myotismon\netwas angetan?!"
"text.0188": "Wenn du es mir nicht sagst...\ngreife ich dich an!"
"text.0208": "Ich greife dich an!"
"text.0242": "Ich muss Myotismon so\nschnell wie möglich retten!"
