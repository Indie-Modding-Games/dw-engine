text.0044: "Hallo, brauchst du Fleisch?"
text.007c: "Ach, davon hab ich dir\nja noch nichts erzählt."
text.00d8: "Das ist eine Fleischfarm.\nWir bauen Fleisch für alle an."
text.013e: "Fleisch baut man an?"
text.0176: "Ja, wieso?"
text.0192: "Na ja... nichts"
text.01b8: "Jiji und ich geben dir ab\njetzt täglich drei Stück\nFleisch, {color:6}{tamer}{color:1}."
text.0242: "Hier, dein Fleisch für heute."
text.028e: "Du hast genug Fleisch.\nHeute brauchst du keins."
text.030a: "Du hast zu viel Fleisch.\nDen Rest behalte ich."
text.0380: "Ich habe drei Stück\n{color:6}Fleisch{color:1} bekommen!"
text.03dc: "Du hast zu viele Items."
text.0414: "Ich habe drei Stück\n{color:6}Fleisch{color:1} bekommen!"
text.0470: "Heute haben wir viel Fleisch\ngeerntet! Du bekommst\nfünf Stück."
text.0508: "Du hast zu viel Fleisch."
text.054c: "Du hast zu viel Fleisch.\nDen Rest behalte ich."
text.05c2: "Ich habe fünf Stück\n{color:6}Fleisch{color:1} bekommen!"
text.0620: "Du hast zu viele Items."
text.0658: "Ich habe fünf Stück\n{color:6}Fleisch{color:1} bekommen!"
text.0698: "Morgen gibt's mehr."
text.06e4: "Hier, das Fleisch für heute."
text.072a: "Du hast zu viel Fleisch."
text.076e: "Du hast zu viel Fleisch.\nDen Rest behalte ich."
text.07e4: "Ich habe {color:6}Fleisch{color:1} bekommen!"
text.0820: "Du hast zu viele Items."
text.0858: "Ich habe {color:6}Fleisch{color:1} bekommen!"
text.087a: "Morgen geb ich dir mehr."
text.08c0: "Ich dachte, du hättest dein\nFleisch für heute schon."
text.090a: "Wenn dir das Essen ausgeht,\ngeh in den Heimatwald und\nsuch Pilze."
text.09a2: "Hallo, {color:6}{tamer}{color:1}, ich hab\nmeine Fleischfarm vergrößert."
text.09ea: "Ich gebe dir jeden Tag drei\nStück Riesenfleisch."
text.0a4e: "Wenn du mehr willst,\nverkauf ich es dir für\nfünfhundert Bits das Stück."
text.0ad2: "Ich kümmere mich für Tanemon\num die Farm. Er ruht sich\nirgendwo aus."
text.0b74: "Ich habe heute viel\nFleisch geerntet!"
text.0bd2: "Du hast genug Riesenfleisch.\nHeute brauchst du keins."
text.0c56: "Du hast genug Riesenfleisch.\nHeute brauchst du keins."
text.0cce: "Ich habe jetzt {color:6}Riesenfleisch{color:1}!"
text.0d14: "Du hast zu viele Items."
text.0d4c: "Ich habe fünf Stück\n{color:6}Riesenfleisch{color:1} bekommen!"
text.0d98: "Morgen geb ich dir mehr."
text.0dea: "Hier sind drei Stück\nRiesenfleisch für heute."
text.0e60: "Du hast genug Riesenfleisch.\nHeute brauchst du keins"
text.0ee2: "Du hast zu viel\nRiesenfleisch. Den Rest\nbehalte ich."
text.0f64: "Ich habe jetzt {color:6}Riesenfleisch{color:1}!"
text.0faa: "Du hast zu viele Items."
text.0fe2: "Ich habe drei Stück\n{color:6}Riesenfleisch{color:1} bekommen!"
text.1036: "Morgen geb ich dir mehr.\nOder du kaufst jetzt welches.\nFünfhundert Bits das Stück?"
text.10d2: "Kaufen\nNicht kaufen"
text.1110: "Du brauchst mehr Geld."
text.1150: "Du hast zu viele Items."
text.119c: "Willst du noch mehr kaufen?"
text.11d4: "Kaufen\nNicht kaufen"
text.1202: "Bis morgen."
text.123e: "He, he, he!\n{color:6}{tamer}{color:1}, schau mal!"
text.128a: "Wir können viel Lendensteak\nanbauen. Ich gebe dir\ndrei Stück am Tag."
text.1310: "Ich baue jetzt auch\nseltenes Gemüse an!\nKauf, so viel du willst!"
text.13a6: "Heute bin ich gut drauf,\ndrum kriegst du fünf Stück\nLendensteak."
text.143a: "Du hast genug Lendensteak.\nHeute brauchst du keins"
text.14b6: "Du hast zu viel Lendensteak."
