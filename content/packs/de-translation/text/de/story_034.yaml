text.006e: "Heute ist dein letzter Tag."
text.00b2: "Stell dich nicht hinter mich!"
text.00f4: "Du hast mich gesehen..."
text.0142: "Ich darf keinen Fehler machen!"
text.0186: "Sorry, aber du verlierst!"
text.01d2: "Du entkommst mir nicht!"
text.0216: "Niemals, ich verliere nicht!"
text.0262: "Mit dir bin ich fertig!"
