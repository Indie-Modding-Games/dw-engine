text.0116: "Ich glaube, wir haben fast\nall die Erde rausgeschafft."
text.0182: "Die Arbeit läuft gut.\nDanke.\nWarte bitte noch ein wenig."
text.021e: "Danke für deine Arbeit.\nHier ist dein Lohn."
text.0296: "Ich habe 500 Bits\nfürs Arbeiten bekommen!"
text.02d8: "HP steigen um 50!\nAngriff steigt um 5!\nVerteidigung steigt um 5!"
text.0396: "Kipp die Erde bitte\nvor dem Tunnel aus."
text.040a: "Nimm sie vom Erdhaufen."
text.0476: "Willst du Erde schleppen?"
text.04b4: "Dein Digimon sieht müde aus.\nLass es lieber erst ausruhen."
text.054c: "Willst du Erde schleppen?"
text.058c: "Ja\nNein"
text.05b8: "Das ist kein Ort für\nAnfänger. Bleib weg,\nes ist zu gefährlich."
text.065e: "Dieser Tunnel ist noch\nnicht offen. Steh uns\nnicht im Weg."
text.06d8: "Entschuldigung. Weißt du,\nwann er fertig ist?"
text.072e: "Keine Ahnung,\ndas dauert noch."
text.077c: "Das ist ein Problem.\nKönnen wir helfen?"
text.07c0: "Willst du uns den Spaß\nverderben? Vielleicht\nkannst du Erde schleppen."
text.083c: "Was ist das?"
text.0866: "Die Erde habe ich gegraben.\nDu kannst sie rausbringen\nund auskippen."
text.08de: "Das ist harte Arbeit, also\nzahle ich dir 500 Bits\npro Hin- und Rückweg."
text.096e: "Dann geht das Graben\nschneller. Ich verdiene Geld\nund es ist gutes Training."
text.0a0c: "OK\nNein danke"
text.0a3a: "Erde schleppen\nStell mit {color:6}△ {color:1}eine Erd-\nkiste vor die Erde.\nKipp sie vor dem Tunnel aus.\nNach jeder Runde sag\nbitte Drimogemon Bescheid."
text.0b66: "Hast du Angst?"
text.0bae: "Erdkiste erhalten."
