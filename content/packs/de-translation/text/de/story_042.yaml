text.02dc: "{color:10}{partner}{color:1},\nalles in Ordnung?"
text.0310: "Wow, dir geht's gut!"
text.033c: "Du bist geflogen? Gemogelt!\nNa ja, eigentlich nicht."
text.03b6: "Los geht's!"
