text.0092: "Schaka schaka!"
text.00c0: "Schriau!"
text.00e4: "Quak!"
text.0104: "Wenn wir sie nicht umhauen,\nhauen sie uns um."
text.017a: "Spatzenhirn!"
text.0198: "Hohlkopf!"
text.01b4: "Dummkopf!"
text.01ca: "Schafskopf!"
text.01ec: "Doof, doof!"
text.020a: "Eau de Streber!"
text.022a: "Was hast du gesagt?!"
text.0254: "Das macht mich wütend\nIch ignorier sie einfach"
text.02de: "Die sind gemein!"
text.034e: "Warte, was ist los?"
text.0396: "!"
text.03b4: "Mein Meister ruft mich.\nKomm mit. Quak."
text.0420: "Oh nein!"
text.0440: "Hahaha, der blufft nur.\nMit Kindern red ich nicht."
