text.0030: "Ruh dich so viel wie möglich\naus. Das ist der Schlüssel\nzur Gesundheit deines Digimon."
text.00ca: "Gut. Ich erkläre dir, wie\ndie Stadt wächst und\ngedeiht..."
text.014c: "Kommt ein Neuling-Digimon\nin die Stadt, gibt es\neinen Punkt."
text.01cc: "Und kommt ein Champion-Digimon\nin die Stadt, gibt es\nzwei Punkte."
text.025a: "Kommt ein Ultra-Digimon\nin die Stadt, gibt es\ndrei Punkte."
text.02da: "Es gibt aber drei\nChampion-Digimon, die\nnicht sehr nützlich sind."
text.0366: "Kommt einer von ihnen, gibt\nes nur einen Punkt."
text.03de: "Ich erzähl dir ein bisschen\nwas über Typen."
text.0436: "Ist ein Gegner vom selben Typ\nwie dein Partner-Digimon,\nkämpft er vielleicht nicht."
text.04d2: "Und passt der Typ deines\nDigimon nicht, wird er an\nmanchen Türen abgewiesen."
text.056c: "Ansonsten musst du dir\nwohl keine Sorgen\ndarum machen."
text.05f2: "Ich erzähl dir was über\ndie Bändigerstufe."
text.063c: "Die Bändigerstufe steigt,\nwenn du ein Digimon zum\nUltra-Digimon aufziehst."
text.06d0: "Und ein Sieg bei einem\nTurnier hoher Klasse\nist sehr gut."
text.075c: "Sie steigt von allein.\nDu musst dir darüber nicht\nzu viele Sorgen machen."
text.07e8: "Andererseits musst du\naufpassen, dass sie\nnicht sinkt."
text.0874: "Wenn dein Digimon vergeht,\nsinkt deine Bändigerstufe\nganz sicher."
text.0900: "Machst du oft Pflegefehler,\nkann sie sinken.\nPass also auf."
