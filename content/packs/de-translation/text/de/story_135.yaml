text.004c: " {color:6}{tamer}{color:1} und {color:10}{partner}{color:1},\noder? Danke für euren Besuch\nim Dorf Volumen!"
text.00ca: "Tut mir leid, was wir\nOtamamon angetan haben."
text.0122: "Schon gut."
text.0148: "Hä?"
text.0168: "Danke dir. Ich hab gehört,\ndass du hart arbeitest,\num diese Insel zu retten."
text.0200: "Ach ja?"
text.0218: "Ich wollte dir schon lange\nhelfen. Warst du schon im\nNebelwald, gleich im Norden?"
text.02ca: "Noch nicht."
text.02ee: "Ja."
text.02fe: "Dort ist es immer neblig.\nDu wirst dich dort wohl\nschwer zurechtfinden."
text.0390: "Aber du solltest Cherrymon\ntreffen, den Herrn\ndes Waldes."
text.041e: "Cherrymon? Von so einem\nDigimon hab ich nie gehört."
text.0482: "Cherrymon macht den Nebel\nim Nebelwald."
text.04d6: "Er schuf den Nebel, um den\nWald vor Gefahr zu schützen."
text.0548: "Aber uns macht das Probleme."
text.0594: "Ich glaube, Cherrymon weiß\netwas über die Ursache der\nProbleme auf der Insel."
text.062e: "Es lohnt sich, durch den\nNebel zu ihm zu gehen."
text.0688: "Wenn wir nur was gegen\nden Nebel tun könnten."
text.06da: "Nur Cherrymon kann den\nNebel vertreiben."
text.074a: "Aber es gibt einen Weg durch.\nIch verzaubere dich."
text.07be: "Was passiert dann?"
text.07ee: "Du kannst den Weg auch\nim Nebel sehen."
text.0860: "Oh, das ist gut!"
text.0888: "OK, dann fange ich an."
text.08b8: "Quak, quak!"
text.08f6: "Gut. Das ist perfekt.\nJetzt geh in den Nebelwald."
text.0974: "Ich hab ihn getroffen.\nDer Nebel ist jetzt weg."
text.09ba: "Wow, toll! Nun, wie\nkann ich dir helfen?"
text.0a2a: "Okay, dann nimm das hier."
text.0a6c: "Ich hab einen\n{color:6}Digibarsch{color:1} bekommen!"
text.0abc: "Wirf etwas anderes weg."
text.0b04: "Das ist etwas sehr Seltenes.\nEs wird dir nützlich sein."
text.0b72: "Danke. Willst du nicht in\ndie Stadt kommen, Shogun?"
text.0bde: "Ich bin Chef von hundert\nGekomon im Geko-Sumpf. Tut\nmir leid, ich kann nicht mit."
text.0c84: "Aber dafür tu ich von hier\naus alles, was ich kann.\nKomm, wann immer du willst."
text.0d58: "Du hast wohl ein Problem.\nMit dem Kostüm, oder?"
text.0dce: "Du weißt davon?"
text.0dfa: "Unterschätz mich nicht.\nNumemon wird es tragen können."
text.0e68: "Überrascht? Und nicht nur das,\nwenn er es trägt... Du wirst\nstaunen... Probier's einfach."
text.0f4e: "Übrigens nehme ich dir die\n{color:6}Superangel {color:1}aus\ndeinen Items."
text.0fe0: "Das ist ein Spezial-Item."
text.1022: "Viel Glück!"
text.1052: "Angeln kannst du nur\nam Drachenaugensee."
text.10a6: "Zurück, zurück!"
text.10da: "Shogun sammelt seltene\nItems. Früher sammelte er\nItems."
text.1154: "Aber jetzt ist er ganz\nverrückt nach Digimon-Karten."
text.11aa: "Bringst du ihm eine seltene\nKarte, gibt er dir\nVerdienstpunkte."
text.1222: "Sammle Karten und\nVerdienstpunkte und tausch\nsie gegen Items.{stop}{stop}"
text.12bc: "Na ja... nein, nichts. Quak."
text.12fe: "Entschuldige... Ich will in\ndie Stadt. Quak!"
text.1362: "OK, aber was ist passiert?"
text.1396: "Ich will in der Arena kämpfen.\nEs scheint, dass man uns,\nden Gekomon-Stamm,{stop}"
text.142e: "als Digimon vom Land\nverachtet. Quak."
text.1494: "Ja, wir sind vom Land, aber\nwir haben auch unseren Stolz!{stop}"
text.1522: "Ich verstehe, wie du fühlst.\nDann versuch's. Viel Glück!"
text.1582: "Gekomon tritt der Arena bei!"
