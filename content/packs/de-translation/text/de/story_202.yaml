text.0056: "Mann, ich will {color:6}Fleisch{color:1}."
text.008e: "Willkommen, du willst also\n{color:6}Fleisch{color:1}. Also, äh..."
text.0102: "Preis erhöhen\nBei fünfzig Bits lassen\nPreis senken"
text.0174: "Äh, du willst ein Schnäppchen\nbei {color:6}Fleisch{color:1}, oder? Äh..."
text.01fa: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfundsiebzig Bits?"
text.0268: "Auf fünfundsiebzig erhöhen\nNochmal überlegen"
text.02f0: "Und {color:6}Fleisch{color:1} zu fünfzig Bits\nfür siebzig Bits?"
text.034c: "Auf siebzig erhöhen\nNochmal überlegen"
text.03d4: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfundsechzig Bits?"
text.043e: "Auf fünfundsechzig erhöhen\nNochmal überlegen"
text.04c2: "Und {color:6}Fleisch{color:1} zu fünfzig Bits\nfür sechzig Bits?"
text.051a: "Auf sechzig erhöhen\nNochmal überlegen"
text.059e: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfundfünfzig Bits?"
text.0608: "Auf fünfundfünfzig erhöhen\nNochmal überlegen"
text.0680: "Und {color:6}Fleisch{color:1} zu fünfzig Bits\nzum Normalpreis?"
text.06dc: "Zum Normalpreis anbieten\nNochmal überlegen"
text.075e: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfundvierzig Bits?"
text.07c8: "Auf fünfundvierzig senken\nNochmal überlegen"
text.084c: "Und {color:6}Fleisch{color:1} zu fünfzig Bits\nfür vierzig Bits?"
text.08a4: "Auf vierzig senken\nNochmal überlegen"
text.0928: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfunddreißig Bits?"
text.0994: "Auf fünfunddreißig senken\nNochmal überlegen"
text.0adc: "Okay, ich kauf's!"
