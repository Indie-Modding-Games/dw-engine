text.1736: "Wie wär's: das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nzum Normalpreis: dreihundert?"
text.17dc: "Zum Normalpreis anbieten\nNochmal überlegen"
text.185e: "Und das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür zweihundertsiebzig Bits?"
text.18fc: "Auf zweihundertsiebzig senken\nNochmal überlegen"
