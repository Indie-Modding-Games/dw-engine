text.1a2c: "Auf zweihundertvierzig senken\nNochmal überlegen"
text.1ab8: "Und das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür zweihundertzehn Bits?"
text.1b4e: "Auf zweihundertzehn senken\nNochmal überlegen"
text.1c98: "Okay, ich kauf's!"
