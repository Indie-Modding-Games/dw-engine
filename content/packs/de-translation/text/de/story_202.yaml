text.21b2: "Preis erhöhen\nBei tausend Bits lassen\nPreis senken"
text.222c: "Äh, du wolltest {color:6}Medizin{color:1}\nzum guten Preis, oder?"
text.22b2: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür fünfzehnhundert Bits?"
text.233e: "Auf fünfzehnhundert erhöhen\nNochmal überlegen"
text.23c8: "Und die {color:6}Medizin{color:1}\nzu tausend Bits\nfür vierzehnhundert Bits?"
text.244e: "Auf vierzehnhundert erhöhen\nNochmal überlegen"
text.24da: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür dreizehnhundert Bits?"
