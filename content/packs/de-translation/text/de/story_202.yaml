text.0de8: "Gesamtgewinn: {shopvar}\nGewinn:\nnull"
text.0eaa: "Ich geh!!"
text.0ef4: "Es kommen keine Kunden..."
text.0f32: "Du verlangst zu viel!"
text.0f6c: "Echt? Na dann..."
text.0fa0: "Mann, ich brauch dringend\nein {color:6}Reiseklo{color:1}."
text.0ff0: "Äh... Willkommen, du willst\nein {color:6}Reiseklo{color:1}?"
text.105c: "Preis erhöhen\nBei dreihundert Bits lassen\nPreis senken"
text.10d8: "Äh... du suchst ein\n{color:6}Reiseklo{color:1} zum guten Preis?"
text.1160: "Und das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür vierhundertfünfzig Bits?"
text.11fc: "Auf vierhundertfünfzig erhöhen\nNochmal überlegen"
text.128a: "Wie wär's: das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür vierhundertzwanzig Bits?"
text.1330: "Auf vierhundertzwanzig erhöhen\nNochmal überlegen"
text.13ba: "Und das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür dreihundertneunzig Bits?"
text.145a: "Auf dreihundertneunzig erhöhen\nNochmal überlegen"
text.14e6: "Wie wär's: das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür dreihundertsechzig Bits?"
