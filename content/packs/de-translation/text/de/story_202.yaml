text.2914: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür neunhundert Bits?"
text.2996: "Auf neunhundert senken\nNochmal überlegen"
text.2a20: "Und die {color:6}Medizin{color:1}\nzu tausend Bits\nfür achthundert Bits?"
text.2aa0: "Auf achthundert senken\nNochmal überlegen"
text.2b2c: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür siebenhundert Bits?"
text.2bb4: "Auf siebenhundert senken\nNochmal überlegen"
