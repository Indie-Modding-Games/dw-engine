text.0060: "Ich werde gewinnen!"
text.0098: "Okay, komm schon, Kleiner!"
text.00d4: "Was passiert jetzt wohl?"
text.0122: "Das klappt doch nie."
text.0168: "Ich hab Hunger."
text.0186: "Essen geben\nKein Essen geben"
text.01de: "Ich hab gerade kein Essen."
text.0266: "Ups, das kann ich nicht geben."
text.02b8: "Lecker..."
text.02de: "Kämpfen wir!"
text.032e: "Das ist nicht gut.\nWas soll ich tun?"
text.0380: "Komm in die Stadt und arbeite\nab, was du gegessen hast!"
text.03e6: "Gut, mach ich. Ich bin ein\nInsekten-Digimon namens\nKunemon. Freut mich."
text.04c0: "Kunemon zieht in die Stadt!"
text.0508: "Bring nächstes Mal was mit."
