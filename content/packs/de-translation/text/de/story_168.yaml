text.00e0: "Arena-Infos"
text.0108: "Bilanz\nÜber Klassenturniere\nÜber Sonderturniere"
text.0188: "Anzahl der\nTurniersiege {tourn_won}\n{tourn_wins}Siege {tourn_lost}Niederlagen"
text.01ea: "Klassenturniere sind offen\nfür alle und finden oft statt."
text.025a: "Aber Digimon einer höheren\nStufe sollten nicht bei\nniedrigen Turnieren antreten."
text.02f2: "Digievolviert dein Digimon\nzwischen Anmeldung und\nTurnier, ist es nicht dabei."
text.039c: "Sonderturniere haben feste\nTeilnahmeregeln und finden\nnicht oft statt."
text.0434: "Gibt es nicht genug\nTeilnehmer in der Stadt,\nfinden sie gar nicht statt."
text.04cc: "Jedes Turnier gibt es nur\nein- oder zweimal im Jahr.\nSchau vorher im Turnierplan."
text.058c: "{color:10}{partner}{color:1}, ich überlege mir\ndeinen Spitznamen... ein Held,\nder die Welt gerettet hat."
text.061c: "Mal sehen."
text.0648: "Wie wär's mit\n„Unbesiegbarer {color:10}{partner}{color:1}“?"
text.0694: "Wie wär's mit\n„Legendärer Held {color:10}{partner}{color:1}“?"
text.06e8: "Wie wär's mit\n„{color:10}{partner}{color:1} der Große“?"
text.0732: "Wie wär's mit\n„Friedensstifter {color:10}{partner}{color:1}“?"
text.077e: "Wie wär's mit\n„{color:10}{partner}{color:1} der Champ“?"
text.07c8: "Wie wär's mit\n„{color:10}{partner}{color:1} der Tapfere“?"
text.0812: "Wie wär's mit\n„Cooler Typ {color:10}{partner}{color:1}“?"
text.085e: "Wie wär's mit\n„Der mächtige {color:10}{partner}{color:1}“?"
text.08aa: "Wie wär's mit\n„Erhabener {color:10}{partner}{color:1}“?"
text.08f2: "Wie wär's mit\n„Superhirn {color:10}{partner}{color:1}“?"
text.0946: "Hey, die Plätze sind\nfür unsere Gäste."
text.0d0e: "- Klasse D -\nTurnier für\nNeuling-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.0e0c: "- Klasse C -\nTurnier für\nChampion-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.0f0e: "- Klasse B -\nTurnier für\nChampion-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.1010: "- Klasse A -\nTurnier für\nUltra-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen: keine."
text.1112: "- Klasse S -\nTurnier der\nstärksten Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Sieger der Klasse A."
text.120c: "- Klasse R -\nMassenkampf-Turnier:\nTaktik ist der Schlüssel\n\nMassenkampf zu viert,\nzwei Runden, acht Teilnehmer.\nBedingungen: keine."
text.1340: "- Version-1-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 1\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Digimon der Version 1."
text.147c: "- Version-2-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 2\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nNur Digimon der Version 2."
text.15b8: "- Version-3-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 3\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nder Version 3."
text.1700: "- Version-4-Pokal -\nKampf auf Zeit für die\nbesten Digimon der Version 4\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nder Version 4."
text.1842: "- Version-0-Pokal -\nKampf auf Zeit für die\nbesten Digimon, die nicht\nzu Version 1 bis 4 gehören.\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\naußerhalb Version 1 bis 4."
text.19a8: "- Feuer-Pokal -\nKampf auf Zeit um den König\nder lodernden Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit feuriger Natur."
text.1ae2: "- Ringen-Pokal -\nKampf auf Zeit um den\nKönig des Kampfsports\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit kämpferischer Natur."
text.1c2c: "- Donner-Wind-Pokal -\nKampf auf Zeit um den König\nder Digimon der Lüfte\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit luftiger Natur."
text.1d7a: "- Kälte-Pokal -\nKampf auf Zeit um den König\nder coolen Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit eisiger Natur."
text.1eac: "- Natur-Pokal -\nKampf auf Zeit um den König\nder Natur-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon,\ndie der Natur nahestehen."
text.1ff8: "- Metall-Pokal -\nKampf auf Zeit um den König\nder Androiden-Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit mechanischer Natur."
text.2132: "- Dreck-Pokal -\nKampf auf Zeit um den König\nder dreckigen Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer. Nur Digimon\nmit dreckiger Natur."
text.226a: "- Dino-Pokal -\nKampf auf Zeit für Digimon\nmit urzeitlichem Blut\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen --  ? ? ?"
text.239a: "- Flügel-Pokal -\nDigimon mit Flügeln\nmessen ihre Kräfte\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen --  ? ? ?"
text.24ac: "- Tier-Pokal -\nKampf auf Zeit für Digimon\nmit tierischem Blut\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen --  ? ? ?"
text.25e0: "- Mensch-Pokal -\nKampf auf Zeit für\nmenschenähnliche Digimon\n\nEinzelkampf, drei Runden,\nacht Teilnehmer.\nBedingungen --  ? ? ?"
