text.0038: "Was ist das alles?\nBücher, die ich lesen kann?"
text.00ba: "Nein. Lesen kann ich keins."
text.00e8: "Wow! Ein Buch mit\neinem coolen Umschlag!"
text.012a: "Nehmen\nLieber nicht"
text.0190: "Das coole Buch berührt."
text.01c0: "Hä?"
text.01f8: "Wow!"
text.020e: "Das könnte eine Falle sein....\nLass es!"
