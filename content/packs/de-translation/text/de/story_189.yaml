text.00a6: "Hast du etwas mitgebracht,\num die Wunde zu behandeln?"
text.0104: "Moment mal. Lass mich sehen..."
text.014c: "Mein Flügel tut weh!"
text.0170: "Was ist passiert?"
text.0194: "Mein Flügel ist verletzt.\nHast du was für die Wunde?"
text.020a: "Sieht übel aus. Halte durch.\nWas soll ich tun?"
text.027c: "Ich habe gerade nichts."
text.02f8: "Nicht gut. So geht das nicht!"
text.0346: "Schon viel besser. Danke."
text.0386: "Kannst du schon fliegen?"
text.03b6: "Weit fliegen kann ich nicht."
text.03f6: "In der Stadt gibt es eine\nKlinik. Geh am besten hin.\nSie ist nicht weit von hier."
text.048a: "Ich habe von der Stadt gehört.\nSie ist größer als gedacht."
text.04f8: "Ruh dich in der Stadt aus."
text.0534: "Danke. Vielleicht kann ich\ndir eines Tages helfen."
text.05c2: "Unimon zieht in die Stadt!"
text.0602: "Ich hole etwas für deine\nWunde. Warte auf mich."
text.0678: "Danke. Beeil dich bitte!"
