text.0026: "Hier ist alles in Ordnung.\nViel Glück."
text.0078: "Ich muss auch helfen. Ich\npendle zwischen hier und\nder Stadt, so oft ich kann."
text.0128: "Andromon zieht in die Stadt!"
text.0176: "Die Datenreparatur ist fertig.\nLesen wir jetzt die Daten."
text.01e6: "Bitte."
text.0200: "Vor hundert Jahren tauchten\nAnalogmenschen auf der\nDigimon-Insel auf."
text.0286: "Analogmenschen und Digimon\nder Insel kämpften hart."
text.02f0: "Nach zehn Jahren Krieg\nwurden die Analogmenschen\nbesiegt und verschwanden."
text.038c: "In den zehn Jahren danach\nwuchs die Insel rätselhaft\nauf fast die doppelte Größe."
text.0438: "Menschen gegen Digimon?"
text.0476: "Tut mir leid. Mehr Daten\nkonnten wir nicht retten."
text.04e6: "Keine Sorge. Das ist eine\nsehr wichtige Information.\nJetzt weiß ich viel mehr."
text.0582: "Wirklich?"
text.05ae: "Diese Menschen haben wohl\ndas Chaos und den Ärger auf\nder Insel verursacht."
text.065e: "Können Menschen hundert\nJahre alt werden?"
text.06aa: "Für Menschen scheint die\nZeit hier langsam zu laufen."
text.071a: "Darum muss ich hier wohl\nweder essen noch schlafen."
text.078a: "Hundert Jahre sind eine\nsehr lange Zeit. Die Typen\nmüssen ziemlich zäh sein."
text.081c: "Glaubst du, sie verstecken\nsich irgendwo?"
text.0872: "Ich finde sie\nund unternehme was."
text.08b8: "Jetzt weiß ich, warum ich\nhier bin. Als Mensch muss\nich mich um sie kümmern."
text.095e: "Es tut uns sehr leid. Wir\nschließen die Fabrik erst mal."
text.09d6: "Bei dem Ärger gerade weiß\nniemand, was passieren wird.\nEs ist nicht deine Schuld."
text.0a8a: "Ich glaube, jemand\nsteuert Giromon."
text.0aea: "Computer wurden zerstört und\nAbwasser trat aus."
text.0b62: "Das Wasser hat die Digimon\nverrückt gemacht. Das ist\nbestimmt kein Zufall."
text.0bee: "Diese Computer sind\nvon großer Bedeutung."
text.0c46: "Vielleicht ist es zu spät,\naber ich glaube, jemand\nhatte es auf uns abgesehen."
text.0cc8: "Was?!"
text.0cdc: "Ich glaube, auf diesen\nComputern waren Daten über\ndie Vergangenheit der Insel."
text.0d78: "Aber durch Giromons Amoklauf\nwurden die Daten zerstört."
text.0dec: "Du kennst die Daten nicht?"
text.0e2a: "Nein, aber vielleicht können\nwir einen Teil reparieren.\nIch setze sie zusammen."
text.0eca: "Verstehe, danke.\nWie lange dauert das?"
text.0f22: "Eine Weile. Ich öffne den\nStadteingang wieder, also\nkomm später zurück."
text.0fb2: "Danke. Ich komme wieder."
text.0ff6: "Bist du mit der Reparatur\nder Daten fertig?"
text.1044: "Es dauert noch etwas.\nKomm später wieder."
text.10a2: "Okay, ich komme wieder."
text.10ea: "Hey, hey!"
text.1104: "Ich muss mich entschuldigen."
text.113c: "Später! Du musst sofort die\nMaschinen der Fabrik stoppen!"
text.11ba: "Gut, mach ich."
text.11ee: "Die Fabrik hat gerade den\nBetrieb eingestellt."
text.1246: "Gut, ich sehe mir den Kanal\nan. Bis dann, Kumpel."
text.12b2: "Ich bitte um Entschuldigung."
text.12dc: "Dafür haben wir jetzt\nkeine Zeit!"
text.133e: "Unser Computer ist perfekt."
text.1376: "Ist die Fabrik echt sicher?\nWas können wir jetzt tun?"
text.13e8: "Okay, wir müssen was gegen\ndie Wachen tun. Es gibt\nkeinen anderen Weg!"
text.1482: "Wie kamst du in die Stadt?"
text.14ca: "Wenn du hier nichts zu tun\nhast, verschwinde sofort!"
text.1546: "Darüber reden wir später.\nIch muss mir jetzt\ndie Fabrik ansehen."
text.15cc: "Es geht um Leben und Tod.\nGib mir die Erlaubnis!"
text.163e: "Ich verstehe nicht ganz,\nwas du vorhast. Ich kann\ndir keine Erlaubnis geben."
text.16e4: "Durch das Abwasser der\nFabrik drohen Digimon zu\nverschwinden!"
text.178e: "Aus der Fabrik? Unmöglich!\nDie Abwasserreinigung\nfunktioniert einwandfrei."
text.182a: "Woher weißt du das, wenn\nwir nicht nachsehen?!"
text.18a6: "Unser Computer ist perfekt.\nIm Notfall schaltet der\nNetzwächter das System ab."
text.1952: "Willst du sagen, der\nNetzwächter funktioniert\nimmer richtig?"
text.19de: "Netzwächter ist ein anderer\nName für Giromon, ein\nUltra-Digimon."
text.1a68: "Sein Urteil und sein Können\nsind einfach perfekt."
text.1ac2: "Er ist ein Digimon?! Oh nein,\ndann wird's noch schlimmer.\nBitte, gib mir die Erlaubnis!"
text.1b7c: "Raus! Sofort!"
text.1ba2: "Seufz... Mist!"
