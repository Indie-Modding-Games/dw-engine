text.0054: "Hör auf mit dem Unsinn!"
text.0084: "Na gut. Ich werd's wohl\nnicht wieder tun."
text.00e2: "Das ist wohl\nder letzte Raum."
text.0156: "{color:7}??? {color:1}\nWelche?"
text.0198: "Die Stimme... klingt wie\nWaruMonzaemon!"
text.01ec: "Große Kiste oder kleine Kiste.\nIch lese deine Gedanken!"
text.0250: "Große Kiste\nKleine Kiste"
text.0304: "Hä? Aaahhhh!"
text.04a2: "Hahaha, du Trottel!\nDaneben!"
text.052c: "Ohhhh, erwischt!\nHehehe. Nervös?"
text.059a: "Mist, was ist so lustig?"
text.05ce: "Wow, reg dich nicht auf.\nWarum bist du heute hier?\nWillst du für mich arbeiten?"
text.0674: "Gib uns unseren entführten\nFreund zurück!"
text.06c6: "Freund? Wovon redest du?\nSehe ich so aus, als würde\nich so was tun?"
text.0768: "Ja!"
text.077a: "Wow, schon wieder richtig!\nJa, ich war's! Das war ich!"
text.07ec: "Aber du weißt, dass du ihn\nnicht zurückbekommst.\nDenn ich bin WaruMonzaemon."
text.0878: "Wenn du so denkst,\nzwinge ich dich!"
text.08d2: "Soll das ein Witz sein?\nDu willst mich besiegen?"
text.0930: "Weißt du was?\nWach lieber auf und\nsieh der Wahrheit ins Auge!"
text.09e0: "Hey, gib mir meinen\nentführten Freund zurück."
text.0a4a: "Urghhh....nein!\nIch fass es nicht,\nich verliere...."
text.0ae2: "Na los!"
text.0afa: "Na ja... ich hab wohl\nkeine Wahl. Hier."
text.0bd8: "Hä? Wowww.... hey!"
text.0d54: "Hey, hör auf mit dem Quatsch,\ndas reicht!"
text.0dae: "Hey, verstehst du keinen Spaß?\nHier. Das ist er."
text.0e2c: "Was ist das?\nDas ist ein Zahnrad."
text.0e6e: "Ja, genau."
text.0ea4: "Das ist der Freund???"
text.0ed6: "Na ja, sonst hab ich nichts\ngenommen. Ehrlich."
text.0f32: "Das nehme ich jetzt\nerst mal mit."
text.0f94: "Du! Mach nie wieder was\nBöses, verstanden?!"
text.0ff8: "Na gut. Ich glaub nicht,\ndass das wieder passiert."
text.105c: "Irgendwie glaub ich dir nicht,\naber ich hab so viel\nzu erledigen."
text.1104: "Oh nein, ich hab zu viele\nItems. Ich muss eins\nwegwerfen."
text.1182: "Ich hab ein {color:6}Zahnrad{color:1} bekommen!"
text.11ba: "Was? Wer bist du?"
text.11e6: "Wer ich bin? Wer bist du?!"
text.1292: "Ich hab den\n{color:4}Dimensionsschlüsselbund{color:1}!\nNun kann ich 20 Items tragen!"
text.1354: "Ich hab den\n{color:4}Dimensionsschlüsselbund{color:1}!\nNun kann ich 20 Items tragen!"
