text.0034: "Mampf, mampf."
text.004e: "Äh..."
text.0064: "Hör mir bitte zu."
text.008e: "Lecker, lecker."
text.00b0: "Meine Leute hören nicht mehr."
text.00f0: "Ich glaube, sie können sich\nmeine Befehle nicht merken."
text.014a: "Manchmal verstehen sie sie\nnicht einmal."
text.019a: "Meine Leute sollten mir\ndas Essen bringen, aber..."
text.01ea: "Lecker..."
text.0202: "Während ich arbeitete,\nbrachten sie mir nichts,\nalso vergaß ich zu essen."
text.0294: "Du gehst zu sehr in\ndeiner Arbeit auf."
text.02e2: "Wie peinlich."
text.0310: "Ich glaube, in der Villa\ngibt es Ärger."
text.0366: "Ärger auf der Insel? Sind\nalle so wie meine Leute?"
text.03da: "Ja, alle verlieren ihr\nGedächtnis."
text.042c: "Glaubst du, jemand\nsteckt dahinter?"
text.0478: "Hmmm"
text.0488: "Was kann ich tun?"
text.04ac: "Unsere Stadt soll die Herzen\naller Digimon vereinen."
text.0512: "Wir reisen, um\nFreunde zu finden."
text.055a: "Was ich tun kann?\nMeine Leute können\nnur kämpfen."
text.05cc: "Ich kann sie nicht hierlassen."
text.0604: "Verstehe..."
text.061c: "Lass mich darüber nachdenken.\nEs tut mir sehr leid, aber..."
text.067e: "Ich komme wieder.\nVergiss nicht zu essen."
text.06de: "Lust auf einen Wettkampf?"
text.0712: "Ein Wettkampf? Perfekt, das\nmuntert meine Leute auf."
text.0776: "Also, machst du mit?"
text.07a8: "Ja, aber ich muss hier noch\nforschen. Ich komme\nbald hin."
