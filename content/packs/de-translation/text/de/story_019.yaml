text.007a: "Hier kommst du nicht durch!"
text.00c4: "Ich nehme dir\nalles ab, was du hast!"
text.0118: "Hier kommst du nicht durch!"
text.0162: "Du wirst nicht gewinnen!"
text.01a2: "Ich sollte dich erledigen!"
text.01de: "Ich mach dich fertig!"
text.021e: "So ein Ärger!"
text.0252: "Ich erledige dich!"
