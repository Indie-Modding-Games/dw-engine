text.00f8: "Ich bin zurück!"
text.0122: "Danke für die Einladung.\nIch hoffe, wir arbeiten gut\nzusammen, {color:10}{partner}{color:1}."
text.01c6: "{color:7}Die Bändigerstufe\nist gestiegen! {color:1}"
text.020c: "{color:7}Glückwunsch!\nHier ist eine\nMedaille für dich. {color:1}"
text.026c: "Eine Machinedramon-Karte!"
text.0782: "Hast du den Wächter\ndes Sees gesehen?"
text.07c8: "Wenn nicht, warte mal\nan der Südseite."
text.083e: "Steh ganz früh auf und\nlauf durch den Nebel.\nDann passiert was Gutes!"
text.08de: "Wusstest du, dass es im\nNorden einen Ort namens\nEisbergstrand gibt?"
text.0962: "Es heißt, dass an dem Strand\noft ein riesiges\nDigimon auftaucht."
text.09f4: "Sind die Banditen besiegt?\nIch hab von einer\nBanditenbande gehört."
text.0a8c: "Warst du mal im Großen Canyon?"
text.0ac6: "Es heißt, dass die\nBanditen dort sind."
text.0b1e: "Sind das Bösewichte?"
text.0b4a: "Sie überfallen dich einfach."
text.0b86: "Lass uns was dagegen tun."
text.0bd8: "Warst du mal im Großen Canyon?"
text.0c12: "Es heißt, dort gibt es eine\nUnsichtbare Brücke."
text.0c96: "Ich hab gehört,\nMachinedramon ist zurück."
text.0cea: "Du hast Machinedramon\nwieder besiegt."
text.0d2e: "Ich erkläre dir die\nUmgebung der Stadt."
text.0d88: "Der Heimatwald\numgibt die Stadt."
text.0dd0: "Die Digimon dort sind\nnicht besonders stark."
text.0e2c: "Im Westen gibt es ein\nTrainingslager."
text.0e7a: "Der Tropendschungel liegt\nöstlich hinter dem Fluss."
text.0ed2: "Was dahinter liegt,\nweiß ich nicht."
text.0f18: "Im Westen gibt es einen\nBerg und einen See."
text.0f70: "Im Süden liegt das Meer."
text.0fb4: "Im Norden gibt es einen\nhohen Berg."
text.1006: "Diese Stadt ist das\nZentrum der Insel."
text.1058: "Ich höre mich mal um. Komm\nwieder, dann weißt du mehr."
text.10c8: "Mal sehen, was es hier gibt."
text.1108: "Das Klo mag ich nicht, aber\nsonst ist alles okay!"
text.117e: "Hier ist ganz schön was los."
text.11b2: "Muss ich nicht zurück\nnach Fabrikstadt?"
text.120c: "Meine Planungsfunktion\nläuft. Kein Problem."
text.1282: "Du kommst genau richtig!"
text.12be: "Sieh dir diese Skulptur an!\nWas hältst du davon?"
text.1318: "Was für ein Meisterwerk.\nIch staune über mich selbst."
text.1364: "Wie meinst du das?\nDu willst mich veralbern!"
text.13be: "Worüber haben wir geredet?\nNa ja, egal."
text.141e: "Was hatte ich mir vorgestellt?\nWenn du es herausfindest,\nsag mir Bescheid."
text.14e2: "schläft..."
text.1516: "Schon gehört? Im\nTropendschungel wächst eine\nseltsame Pflanze."
text.15b2: "Ach ja,"
text.15c8: "Ich hab eine {color:6}Regenpflanze\n{color:1}genau da gepflanzt."
text.1618: "Sie trägt jedes Jahr um den\nFünfzehnten herum Früchte.\nDie darfst du nehmen."
text.16a4: "Wofür?"
text.16cc: "Oh, das tut gut!\nSonnenstrahlen."
text.170e: "Oh, das tut gut!\nSonnenstrahlen."
text.1766: "Super, das ist toll!"
text.17be: "Oh, das ist ja..."
text.17f6: "Zu viele Items."
text.1822: "Ich hab eine {color:6}Frucht\nder Regenpflanze{color:1}!"
text.1902: "Ich bringe dich aufs Meer.\nDas ist mein Job."
text.195c: "Ich bringe dich an Orte, die\nman nur übers Meer erreicht."
text.19c8: "Also dann..."
text.19ea: "Hmmm, wohin soll's gehen?\nNach Fabrikstadt oder\nzur Strandhöhle?"
text.1a6c: "Fabrikstadt\nGeheime Strandhöhle\nNirgendwohin"
text.1b5a: "Da bist du ja!"
text.1b88: "Oh nein, er kommt\ndirekt auf uns zu!"
text.1be2: "Endlich treffe ich dich!\nIch bin Greymon.\nJetzt klären wir das!"
text.1c62: "Was?!"
text.1c76: "Ich bin den Gerüchten über\ndich hierher gefolgt.\nIch will gegen dich kämpfen!"
text.1d00: "Wenn ich gewinne, will\nich dieses Straßenschild!"
text.1d54: "Hier ist kein Schild."
text.1d7c: "Egal,\nwir kämpfen trotzdem!"
text.1e08: "Hey, ihr seid gut! Aber\nfür euer Ziel seid ihr\nnoch Anfänger."
text.1ea6: "Hmmm"
text.1eb6: "Ich bleibe und trainiere\neuch. Ihr werdet viel besser!"
text.1f56: "Greymon zieht in die Stadt!"
text.200c: "So, da bist du ja, {color:6}{tamer}{color:1}!"
text.2048: "Hinterhalt!"
text.205e: "Ich will dich besiegen."
text.2094: "Diese Augen! Man hat ihm\nwohl das Hirn gewaschen!"
text.2126: "Egal, was ich tue,\nich muss ihn besiegen."
text.218c: "Wovon redest du?\nDu musst behandelt werden."
