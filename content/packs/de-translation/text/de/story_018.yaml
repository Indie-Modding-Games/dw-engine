text.027a: "Eindringling-Alarm!"
text.02a2: "Eindringling-Alarm!"
text.02ca: "Ich schieße!"
text.0346: "Alles okay, {color:10}{partner}{color:1}?!"
text.0376: "Gehen wir zurück."
text.03b2: "Oh nein! Ich muss\n{color:10}{partner}{color:1}wiederbeleben."
text.131c: " !!! "
text.1364: "Toll, dass ihr es durch den\nWald geschafft habt!"
text.13cc: "Ich bin Centarumon.\nEs tut mir leid, was ich tat."
text.1426: "Das war kein Test aus Spaß.\nIch will mit euch arbeiten."
text.149a: "Geht nur. Ich bleibe in der\nStadt und warte auf euch."
text.1536: "Centarumon zieht in die Stadt!"
text.1584: "{color:10}{partner}{color:1}, ich glaube,\nwir werden ziemlich berühmt!"
text.15e2: "Weiter so!"
text.1632: "Daneben!"
