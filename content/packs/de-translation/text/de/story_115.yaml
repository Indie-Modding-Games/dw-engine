text.00c8: "Willkommen, junger Mann."
text.0108: "Du bist Cherrymon, oder?"
text.0144: "Wer ist da?"
text.0164: "Was willst du von einem\nalten Mann wie mir?"
text.01ca: "Erst muss der Nebel weg."
text.0200: "Im Nebel sehe ich nichts.\nKannst du ihn vertreiben?"
text.026c: "Ach so ist das. Verstehe."
text.02a6: "... kannst du's nicht?"
text.02da: "Hör erst mal, was ich zu\nsagen habe. Also... \nwo fange ich an?"
text.0364: "Wenn du von der Notlage der\nInsel weißt, dann erzähl\nmir bitte davon."
text.03fa: "Verstehe, verstehe.\nDie Notlage."
text.043e: "Diese Insel begann sich vor\nachtzig Jahren zu verändern,\nnach den Landveränderungen."
text.04de: "Der Nordosten der Insel\ntauchte vor achtzig Jahren\nplötzlich auf."
text.0574: "Seitdem zogen die Digimon\nfort. Die Arten trennten\nsich voneinander."
text.05fa: "Und jede Art fing an, ihre\neigene Sprache zu sprechen."
text.066a: "Sie vergaßen die Sprache,\ndie man in der Stadt sprach..."
text.06d2: "Am Ende verlor File-Stadt\nfast all ihre\nDigimon-Bewohner."
text.0752: "Dann verloren die Digimon\nihr Gedächtnis!"
text.07a8: "Die Inselgeschichte, ihre\nVergangenheit, ihre Sinne...\nes wird täglich schlimmer."
text.0844: "Ich hab dir was Wichtiges\nzu sagen, aber auch daran\nerinnere ich mich nicht."
text.08e6: "Doch am Ende fügt sich alles\nzusammen. Jemand sorgt\ndafür, dass es so kommt!"
text.097c: "Mit der Zeit werden die\nDigimon die Notlage für\nnormal halten."
text.0a08: "Nur du und die Kraft von\nFile-Stadt, die Digimon eint,\nkönnen das aufhalten!"
text.0ab8: "Hol Digimon in die Stadt\nund vollbringe ein Wunder.\nEs wird bestimmt geschehen."
text.0b54: "Oh, ich hab mich aufgeregt.\nPuh, jetzt ist alles gesagt."
text.0bd4: "Vertreiben wir nun den Nebel."
text.0c20: "Den Nebel im Wald machte ich,\num mit dir reden zu können.\nAch, noch etwas..."
text.0cd0: "Im Wald gibt es noch\nandere, die von der\nVergangenheit wissen."
text.0d44: "Geh tief in den Wald und\nfinde sie, wenn du kannst."
text.0dbc: "Bist du wieder gekommen, um\neinen alten Mann zu hören?"
text.0e24: "Über die Insel...\nTrainiere {color:10}{partner}{color:1}\nSchon gut"
text.0e98: "Das will ich dir sagen."
text.0eda: "Ach, okay."
text.0efe: "{color:5}Training: Die Lehren \ndes Waldes {color:1}"
text.0f56: "Starten\nErklären\nBeenden"
text.0f8e: "Normal\nBonusversuch\nBeenden"
text.0fcc: "Cherrymon gibt dir viel\nWissen. Das steigert deine\nWeisheit stark."
text.1068: "Nochmal erklären\nStarten\nBeenden"
text.10c2: "{color:7}Spielautomat {color:1}\nDrück {color:6}△ {color:1}\nfür drei gleiche Bilder."
text.1138: "Hahaha."
