text.0024: "Hallo, {color:6}{tamer}{color:1}.\nÜberraschung! Ich habe\neine Klinik eröffnet!"
text.007a: "Hier behandle ich Krankheiten\nund Wunden. Gratis ist es\nnicht, aber günstig."
text.0130: "Dein Digimon sieht nicht gut\naus. Du musst auf seine\nGesundheit achten."
text.01be: "Ich behandle ihn sofort und\ngebe dir Rabatt.\nDreihundert Bits."
text.025e: "Du hast nicht genug Bits?\nZahl mir, was du kannst."
text.0304: "Jetzt ist alles wieder gut.\nPass ab jetzt besser auf."
text.038a: "Dein Digimon sieht gut aus.\nWas brauchst du?"
text.03e6: "Müdigkeit vertreiben\nMedizin kaufen\nNichts"
text.046c: "{color:10}{partner}{color:1} ist sehr müde.\nEr muss sich jetzt ausruhen."
text.04ec: "{color:10}{partner}{color:1} ist müde.\nEr sollte sich ausruhen."
text.0548: "{color:10}{partner}{color:1} wirkt ein\nbisschen müde. Er sollte\nes nicht übertreiben."
text.05c2: "{color:10}{partner}{color:1} geht es gut.\nAchte auf seine Müdigkeit."
text.0634: "Fühlt er sich entspannter?"
text.066e: "Brauchst du noch etwas?"
text.06a0: "Weiter ausruhen\nMedizin kaufen\nNichts"
text.0706: "Es sollte ihm gut gehen."
text.0732: "Verband: 400 Bits\nMedizin: 1200 Bits\nNicht kaufen"
text.07c0: "Wenn es ihm nicht gut geht,\nkomm zu mir."
text.0826: "Ist er noch müde, trainiere\nweniger und lass ihn\nregelmäßig essen und schlafen."
text.08c8: "Wer zu lange an kalten oder\nheißen Orten bleibt,\nkann krank werden."
text.0958: "Ein Verband hilft nur\nbei Wunden."
text.09b2: "Medizin heilt Krankheiten,\naber gegen Müdigkeit\nhilft sie nicht."
text.0a50: "Wenn die HP am Kampfende\nniedrig sind, verletzt sich\nein Digimon leicht."
text.0ae8: "Hohes Glück und wenig\nMüdigkeit sorgen für\nein langes Leben."
text.0b8c: "Du hast nicht genug Bits.\nSo kann ich nichts verkaufen."
text.0c0e: "Du hast zu viele Items."
text.0c62: "Du hast nicht genug Bits.\nSo kann ich nichts verkaufen."
text.0ce4: "Du hast zu viele Items."
text.0d28: "Brauchst du noch etwas?"
text.0d5a: "Müdigkeit vertreiben\nMehr Medizin kaufen\nNein, nichts"
