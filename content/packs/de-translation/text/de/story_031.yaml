text.0040: "!"
text.0058: "Was ist mit der Insel los?"
text.0092: "Die Stämme zerfielen, verloren\nihr Gedächtnis, wurden wild."
text.0100: "Ich weiß nicht, wie lange\nich noch bei Verstand bleibe."
text.0152: "So können wir es nicht lassen!\nSie müssen die Gefahr sehen!"
text.021c: "Halt! Willst du die Insel\nzerstören?!"
text.0278: "Wer bist du? Geh mir aus dem\nWeg! Es gibt keinen anderen!"
text.031c: "Willst du sagen, es gibt\neinen anderen Weg?"
text.037a: "Wenn die Insel zerstört ist,\nist alles umsonst!\nHör mir zu."
text.03fe: "Was?"
text.0418: "Wir bauen eine Stadt für\ndie Insel und holen alle\nDigimon zusammen."
text.049a: "Wenn die Digimon sich\nvereinen, retten wir die\nInsel vor der Gefahr."
text.0532: "Du hast wohl recht, aber\nalle Digimon zu vereinen,\ndas ist eine riesige..."
text.05cc: "Daran arbeiten wir gerade.\nNichts ist unmöglich!"
text.063e: "Das ist eine Riesenaufgabe!\nAber ich bin gerührt...\nVielleicht schafft ihr das."
text.06c8: "Wenn du an uns glaubst,\nkomm in die Stadt."
text.073e: "Gut. Ich gehe in die Stadt.\nDas ist wohl mein neuer Weg!"
text.07f0: "Meramon zieht in die Stadt!"
text.084a: "Ich wusste, du kommst zurück.\nIch muss die Antwort wissen!"
text.08f0: "Ich hab wohl verloren..."
text.091c: "Ich muss dir etwas\nsagen."
