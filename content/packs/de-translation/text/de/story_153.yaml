text.0010: "Ich hab auf dich gewartet!"
text.0044: "Kommst du wieder\nzu Verstand?"
text.0092: "Ich fühle mich\nirgendwie komisch."
text.00d8: "Hey,\ndas ist ernst, weißt du?"
text.011e: "Die Fabrik ist geschlossen,\nalso hab ich viel Freizeit.\nIch helfe dir!"
text.01b0: "Er ist wieder bei Verstand,\naber wirkt immer noch irre!\n? wirkt immer noch irre!"
text.024c: "Na, entschuuuuldigung.\nBis später!"
text.02d6: "Giromon zieht in die Stadt!"
