text.0060: "Du kommst genau richtig! Ich\nhab eine große Bitte, die\nnur du erfüllen kannst."
text.010c: "Worum geht's?"
text.012a: "Es ist dieselbe Bosheit, die\nich bei Analogman und\nMachinedramon spürte."
text.01a6: "Aber ich weiß nicht,\nwoher sie kommt."
text.01fe: "Gut, überlass das mir!"
text.0236: "Danke. Übrigens..."
text.0282: "Ich hab gehört, du hast\nMachinedramon besiegt!"
text.02d2: "Ja, aber ich versteh's nicht.\nEs wirkte wie der\nFluch von Analogman."
text.035a: "Sein Groll war so stark.\nVielleicht ist jetzt Frieden."
text.03ce: "Kommt Machinedramon zurück,\nbesiegen wir ihn wieder."
text.0436: "Auf dich ist Verlass. Hier,\nals Zeichen meines Danks.\nAus unserer Fleischfarm."
text.04d8: "Wow! Eine\n{color:6}Kettenmelone{color:1}?"
text.0530: "Ich hab zu viele Items."
text.0570: "Gern angenommen, danke!"
text.05c8: "Oh, du bist zurück!\nDarum kann ich sonst\nniemanden bitten."
text.0648: "Okay. Heißt das, Analogman\nist zurück?"
text.0698: "Ich spürte seine Bosheit,\naber weiß nicht, wo er ist."
text.06fc: "Gut, überlass das mir!\nIch suche ihn und\nkümmere mich darum."
text.0780: "Oh, danke. Übrigens..."
text.0800: "Du bist wach. Tut mir so leid."
text.086a: "Was ist das für eine Maschine?"
text.08a6: "Das ist eine\n{color:4}Speichermaschine für\nMemory-Card-Kampfdaten{color:1}."
text.0914: "Mit der Maschine kannst du\ndie Daten deines Partners\nfür Kämpfe speichern."
text.09aa: "Drück einfach {color:6}△ {color:1}und\ndie Maschine sagt dir,\nwas zu tun ist."
text.0a4e: "Willst du die\n{color:4}Speichermaschine für\nMemory-Card-Kampfdaten{color:1} nutzen?"
text.0ace: "Ja\nNein"
text.0b04: "Yuramon hat wohl neue\nGerüchte gesammelt."
text.0b78: "Ich hab gehört, Yuramon\nkennt neue Gerüchte."
text.0bda: "Seit wir hier sind, fängt\ndie Stadt an zu wachsen\nund sich zu verändern."
text.0c5a: "{color:6}{tamer}{color:1}, du gehst\nganz anders an\nAbenteuer heran."
