text.002e: "Ich krieg dich."
text.0068: "Bist du hier, um zu verlieren?"
text.00b2: "Du siehst echt mickrig aus!"
text.00f2: "Hmm, willst du echt verlieren?"
text.0140: "Du gehst unter!"
text.017a: "Geh mir aus dem Weg!"
text.01ca: "Das ist eine völlig\nandere Zeitzone."
text.0226: "Keine Zeit verlieren.\nWir suchen nach Meteoriten."
