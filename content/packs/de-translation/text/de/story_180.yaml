"text.006c": "Mir geht's nicht gut."
"text.0098": "Alles in Ordnung?"
"text.00c0": "Mir ist nicht gut."
"text.00ec": "Wohnst du hier?"
"text.0122": "Mir ist schlecht. Keine Kraft."
"text.0158": "Du siehst furchtbar aus."
"text.017e": "Es wird schlimmer."
"text.01ac": "Ich muss rausfinden, warum."
"text.01e6": "Woher kommt dieses\nAbwasser?\nIch seh mal nach!"
"text.0282": "Was ist das?"
"text.02b2": "Was ist los, {color:10}{partner}{color:1}?!"
"text.02ea": "Dieser Nebel stinkt!"
"text.0312": "Komisch, irgendwie eklig."
"text.0350": "Gut, die Kanalisation\nist wieder normal."
"text.039a": "Jetzt geht's ihm wieder gut.\nIch habe das Problem gelöst."
"text.040c": "Irgendwas stimmt nicht!"
"text.0450": "Da da da!"
"text.04bc": "Ich bin müde.\nWas ist mit euch los?"
"text.050e": "Er klingt dümmer!\nVielleicht ist er wieder klar."
"text.0574": "Nennst du mich dumm?\nWie frech! Ich heiße Numemon."
"text.05e8": "Wenn du nicht dumm bist,\nwas bist du dann?"
"text.0630": "Entschuldige, Numemon. Weißt\ndu, wer dich gerettet hat?"
"text.06a0": "Hä? Willst du, dass ich\ndich rette? Okay."
"text.06fc": "Uff. Er kapiert es\nüberhaupt nicht! Na, egal."
"text.0766": "Hey, ich bin ein Retter. Cool!"
"text.07ae": "Komm bitte in unsere Stadt.\nWeißt du, wo sie ist?"
"text.081c": "So ungefähr."
"text.087c": "Numemon zieht in die Stadt!"
"text.08ce": "Wer ist da?!"
"text.08ec": "Wer bist du?!"
"text.0984": "Ich habe den\n{color:4}Dimensionsschlüsselbund{color:1}!\nJetzt passen zwanzig Items!"
"text.0a46": "Ich habe den\n{color:4}Dimensionsschlüsselbund{color:1}!\nJetzt passen dreißig Items!"
