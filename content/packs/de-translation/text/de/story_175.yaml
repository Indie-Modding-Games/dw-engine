"text.0050": "Willkommen in meinem Lokal."
"text.0088": "Ich habe beschlossen,\nLeiter und Koch dieses\nRestaurants zu werden."
"text.0104": "Genieß meine feurige Küche,\nso viel du willst."
"text.0180": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nwollt ihr nicht meine\nHausmannskost probieren?"
"text.01d6": "Anders als Items, die du\nfindest, ist das echte\nKochkunst. Mein Geheimtalent."
"text.027c": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nIch lebe jetzt vom Kochen.\nUnd ich bin gut!"
"text.02f6": "Entspann dich doch mal\nund iss irgendwann in\nmeinem Restaurant."
"text.037e": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}.\nMein Restaurant hat\nendlich geöffnet!"
"text.03d4": "Probier das Eisdessert!\nDas ist meine Spezialität."
"text.044a": "{color:6}{tamer}{color:1}, ich arbeite\njetzt als Koch in\ndiesem Restaurant."
"text.04c2": "Hier bekommst du\nein warmes Essen."
"text.0520": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nich bin jetzt Profikoch!"
"text.0572": "Willst du mein Essen\nprobieren, komm am\nbesten morgens!"
"text.0614": "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nIch lebe jetzt vom Kochen.\nUnd ich bin gut!"
"text.068e": "Mein Spezialessen gibt es\nfrüh am Morgen und\nmitten in der Nacht."
"text.0750": "Hey, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
"text.0770": "Ich helfe jetzt in\ndiesem Restaurant.\nIch darf Desserts machen."
"text.07ee": "Ich bin echt stolz auf\nmein Dessert.\nProbier es unbedingt, ja?"
"text.08a8": "Wow! Hey, {color:6}{tamer}{color:1}!\nWofür ist diese Maschine?"
"text.08fa": "Keine Angst! Das ist eine\nJukebox, die mein Herz\nzum Pochen bringt! Yeah!"
"text.098a": "Du musst tanzen!\nLos, lass dich gehen! Ich\nwarte auf deinen Wunsch!"
