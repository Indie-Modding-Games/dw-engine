text.009c: "Dahinter liegt die\nTempo-Zeitzone.\nGeh nicht zu nah ran."
text.012e: "Ich habe zwei Ziele.\nErstens die Gefahr für\ndie Insel zu finden."
text.01b2: "Zweitens Digimon in\ndie Stadt zu holen."
text.0212: "Und worauf willst du hinaus?"
text.023e: "Bitte hilf mir\nAch, vergiss es"
text.0286: "Geht nicht. Ich muss diesen\nWald bewachen."
text.02d4: "Weißt du dann etwas über\ndie Gefahr für die Insel?"
text.0346: "Gar nichts. Moment mal."
text.037c: "Vor nicht allzu langer Zeit\nfiel ein großer Felsen\nvom Himmel."
text.03fc: "Wo ist er hingefallen?"
text.0428: "In die Tempo-Zeitzone. Auf\nder anderen Seite des Waldes."
text.04a2: "Lass mich hin! Vielleicht\nfinde ich Hinweise!"
text.0506: "..."
text.0512: "Wenn du darauf bestehst.\nSieh es dir ruhig an."
text.057e: "Ab hier vergeht die Zeit\ndoppelt so schnell.\nNimm genug Essen mit."
text.0610: "Pass auch auf, dass es\nnicht zu alt wird."
text.0672: "Sieh dich lieber\nanderswo um."
text.06dc: "Ab hier vergeht die Zeit\ndoppelt so schnell.\nNimm genug Essen mit."
text.076e: "Pass auch auf, dass es\nnicht zu alt wird."
text.07dc: "Ist etwas passiert?"
text.0810: "Noch nicht."
text.0828: "Laut meinem Meister gibt es\neinen Geheimgang."
text.0890: "Aber ich weiß nicht, wo."
text.08da: "Was ist das?"
text.08f8: "Sieht aus wie ein Meteorit!\nKein Grund zur Sorge."
text.096c: "Tut mir leid, mehr\nweiß ich nicht."
text.09ae: "Trotzdem danke."
text.09da: "Nimm das!"
text.0a82: "Du Nichtsnutz!"
text.0aac: "Meister?!"
text.0ac4: "Nicht zu glauben, dass\ndu noch hier bist!"
text.0b1c: "Meister? Wer ist das?"
text.0b4c: "Aber Meister, wer bewacht\ndann die Urzeit-Dinoregion?"
text.0bba: "Die Insel steckt in einer\nKrise. Geh in die Stadt\nund hilf den anderen!"
text.0c5c: "Jawohl!"
text.0c7c: "Ist das wirklich okay?!"
text.0cba: "Er ist noch jung, aber\nbitte gib ihm Arbeit.\nIch halte hier Wache."
text.0d54: "Meister..."
text.0d74: "{color:6}{tamer}{color:1}, so ist das.\nDarf ich in die Stadt?"
text.0de4: "Du musst fleißig sein."
text.0e12: "Mach ich!\nMeister, bis später!"
text.0e92: "Tyrannomon zieht in\ndie Stadt!"
text.0ed6: "Was er wohl kann?"
text.0f1a: "Lange her, dass ich\nhier Wache gehalten habe."
text.0f7a: "Du kannst jederzeit durch."
text.0fc2: "Lange her, dass ich\nhier Wache gehalten habe."
text.1022: "Du kannst jederzeit durch."
