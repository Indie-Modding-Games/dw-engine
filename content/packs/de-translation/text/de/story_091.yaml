text.007c: "Ich werde gewinnen!"
text.00ae: "Mich besiegst du nie!"
text.00ee: "Hehe! Tut mir echt leid!"
text.012c: "Ignorierst du mich etwa?"
text.017a: "Wenn du hier durchwillst,\nmusst du dich mir stellen."
text.021c: "Ich war unachtsam, aber zwei\ngegen einen ist unfair."
text.028a: "Mag schon sein\nSei kein schlechter Verlierer"
text.02ea: "In einem fairen Kampf\nverliere ich gegen keinen."
text.034e: "Kämpfen wir eins gegen eins.\nKomm morgen um vier Uhr.\nNur die Digimon kämpfen."
text.03fe: "Einverstanden\nNein danke"
text.0436: "Dann ist es abgemacht.\nBis morgen!"
text.04e6: "Du bist wieder da, gut.\nHeute kämpfen wir fair!"
text.0550: "Du kommst spät, so konnte\nich meine Wunde pflegen.\nJetzt geht's los."
text.05f2: "Ich sehe nur zu. Los!"
text.0630: "Los, {color:10}{partner}{color:1}!"
text.067e: "Du bist gut! Wer bist du?"
text.06b8: "Wir erkunden die Insel und\nwollen sie vor Gefahr retten."
text.0734: "Was?"
text.0746: "{color:6}{tamer}{color:1} gibt sich große\nMühe, ihn zu überzeugen!"
text.079a: "Ich helfe dir. Aber zuerst\nwill ich diese Stadt sehen."
text.0844: "Garurumon zieht in\ndie Stadt!"
