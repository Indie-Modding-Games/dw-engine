text.005e: "Felsen versperren den Weg..."
text.00a2: "Kampftest!"
text.00c0: "War nur Spaß."
text.00e6: "Ich heiße Mr. Handy!\nWas kann ich für dich tun?"
text.0146: "Werte ändern\nZeit vorspulen\nAlle Techniken meistern"
text.01cc: "Erhöhen\nVerringern\nFähigkeitsstufe zurücksetzen"
text.022a: "Eine Stunde vorspulen\nSechs Stunden vorspulen\nEinen Tag vorspulen"
text.02e4: "Fünfzig dazu\nHundert dazu\nZweihundert dazu"
text.03bc: "Fünfzig weniger\nHundert weniger\nZweihundert weniger"
