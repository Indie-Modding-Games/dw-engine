text.0438: "{color:1}Weiß Weiß Weiß\n{color:2}Blau Blau Blau\n{color:3}Rot Rot Rot\n{color:4}Rosa {color:5}Grün\n{color:6}Hellblau Hellblau\n{color:7}Gelb {color:10}Orange\n{color:10}a {color:6}b {color:4}c {color:5}d"
text.051c: "Es ist {num:pstat=107}: {num:pstat=108} Uhr\nam {num:pstat=106}. Tag\ndes {num:pstat=105}. Monats."
text.0582: "Ich bin Mr. Warp.\nWohin willst du?"
text.05d6: "Nah\nFern\nSehr fern"
text.0620: "Gipfel des Panoramabergs\nTropendschungel\nBohrtunnel"
text.069e: "Zahnradsavanne\nVilla des Grauen Lords\nGroßer Canyon"
text.070c: "Urzeit-Dinoreg.: Tor\nUrzeit-Dinoreg.: hinten\nUnbekannte Welt"
text.07b6: "Vor der Curling-Höhle\nSeadra angeln\nLavahöhle"
text.083e: "Leben drei"
text.085a: "Ich bin Mr. Digivolution.\nWas willst du werden?"
text.08bc: "Numemon\nSukamon\nBotamon"
text.0a50: "Halbtot\nIntro-Modus\nZeit vorspulen"
text.0acc: "Eine Stunde vor\nSechs Stunden vor\nZehn Tage vor"
text.0b76: "Möchtest du etwas Fleisch?"
text.0bae: "Oh, tut mir leid.\nIch vergaß, es zu erklären."
text.0bfa: "Das ist eine Fleischfarm.\nWir bauen Fleisch für alle an."
text.0c60: "Ihr baut hier Fleisch an?"
text.0c98: "Ja, was ist daran falsch?"
text.0cc4: "Nichts... schon gut.\nErzähl bitte weiter..."
text.0d20: "Jiji und ich geben dir ab\njetzt jeden Tag drei\nStück Fleisch, {color:6}{tamer}{color:1}."
text.0da4: "Hier, dein Fleisch für heute."
text.0df6: "Du hast zu viel Fleisch.\nHeute brauchst du\nwohl keins."
text.0e82: "Du hast zu viel Fleisch.\nIch nehme, was du\nnicht tragen kannst."
text.0efa: "Ich hab drei Stück\n{color:6}Fleisch{color:1} bekommen!"
text.0f52: "Du hast zu viele Items."
text.0f8a: "Ich hab drei Stück\n{color:6}Fleisch{color:1} bekommen!"
text.0fea: "Wir haben viel Fleisch\ngeerntet! Darum gibt's\nfünf Stück Fleisch."
text.1088: "Du hast zu viel Fleisch.\nHeute brauchst du\nwohl keins."
text.1110: "Du hast zu viel Fleisch.\nIch nehme gern, was du\nnicht tragen kannst"
text.1192: "Ich hab fünf Stück\n{color:6}Fleisch{color:1} bekommen!"
text.11f0: "Tut mir leid, aber du\nhast zu viele Items."
text.1246: "Ich hab fünf Stück\n{color:6}Fleisch{color:1} bekommen!"
text.1286: "Morgen gibt's mehr."
text.12d8: "Hier, dein Fleisch für heute."
text.131e: "Du hast zu viel Fleisch.\nHeute brauchst du\nwohl keins."
text.13a6: "Du hast zu viel Fleisch.\nIch nehme gern, was du\nnicht tragen kannst."
text.142a: "Ich hab drei Stück\n{color:6}Fleisch{color:1} bekommen!"
text.148a: "Du hast zu viele Items."
text.14c4: "Ich hab drei Stück\n{color:6}Fleisch{color:1} bekommen!"
text.1506: "Morgen gibt's mehr."
text.154c: "Was? Ich hab dir heute schon\nFleisch gegeben. Vergessen?"
text.159e: "Wenn dir das Essen ausgeht,\nsuch Pilze im\nHeimatwald."
text.1620: "Okay, ich erkläre dir die\nUmgebung dieser Stadt."
text.1692: "Der Heimatwald\numgibt die Stadt."
text.16da: "Die Digimon dort sind\nnicht sehr stark."
text.173a: "Im Westen gibt es ein\nTrainingslager. Da wirst du\nwohl oft hingehen."
text.17d4: "Der Tropendschungel liegt im\nOsten, hinter dem Fluss."
text.1846: "Dahinter? Keine Ahnung."
text.1888: "Im Westen gibt es einen Berg\nund einen See, aber da\ngeht es nicht weiter."
text.1910: "Wenn du weiter nach Süden\ngehst, kommt das Meer."
text.196a: "Und im Norden gibt es einen\nhohen Berg. Da geht es\nauch nicht weiter."
text.19ee: "Da die Stadt das Zentrum der\nInsel ist, muss es im Norden\nweite Gebiete geben."
text.1a9c: "Ich höre mich nach Gerüchten\nüber die Umgebung um. Komm\nwieder, dann weißt du mehr."
