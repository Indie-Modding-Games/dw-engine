text.0018: "Ich sammle Digimon-Karten."
text.0058: "Gib mir Hagurumon,\nToyAgumon und WaruMonzaemon,\ndann kriegst du was."
text.0108: "Geben\nNicht geben"
text.0138: "Sorry, ich hab keine."
text.0176: "Hier. Ein {color:6}X-Verband{color:1}."
text.01b4: "Ich hab zu viele Items."
text.01f8: "Schon mal Curling gespielt?"
text.0236: "Wenn du im Spiel zehn\nPunkte schaffst, hast du\nunglaubliches Talent."
text.02c0: "Keine Ahnung, ob's hilft, aber\nhier ein paar Angeltipps."
text.0338: "Erstens: die Angel.\nEine gute wirft weit\nund ist biegsam genug."
text.03c0: "Dann der Köder. Merk dir,\nwelchen Fisch du mit\nwelchem Köder gefangen hast."
text.043c: "Lass beim Auswerfen mit\n{color:6}△ {color:1}los, damit sie\nmit voller Kraft fliegt!"
text.04ce: "Zum Wächter des Sees...\nEr erscheint jeden Tag am\nMorgen und spätnachmittags."
