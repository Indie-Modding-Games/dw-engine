text.0020: "Ich will Kabuterimon besiegen.\nWie kann ich ihn schlagen?"
text.0098: "Hmm. Du musst stärker werden.\nEs gibt einen sicheren Weg....\n...na ja, halte durch."
text.015e: "Verstehe. Gut, ich trainiere."
text.019e: "Echt?! Dann trainier ich dich!"
text.01e8: "Komm einfach in die Stadt."
text.0220: "..."
text.022c: "Du bist echt nett.\nIch komme in die Stadt."
text.02bc: "Kuwagamon zieht in die Stadt!"
text.0304: "Mann, du bist nicht nett.\nIch bin enttäuscht!"
text.0368: "Hey, du warst doch bei diesen\nKäferturnieren, oder?"
text.03d8: "Dann bring ich dir\nwas Nützliches bei."
text.042a: "Weißt du, wo Kunemon schläft?\nIm Heimatwald?"
text.0496: "Dort schlafen Kinder-Digimon.\nWenn sie aufwachen, werden\nsie zu Kunemon."
text.051e: "Aber manchmal nicht.\nDas ist Glückssache."
text.05a8: "Hey, du warst doch bei diesen\nKäferturnieren, oder?"
text.0618: "Äh... So wie du jetzt bist,\nschaffst du das nicht."
text.0676: "Dann bring ich dir\nwas Nützliches bei."
text.06c8: "Weißt du, wo Kunemon schläft?\nIm Heimatwald."
text.0734: "Dort schlafen Kinder-Digimon.\nWenn sie aufwachen, werden\nsie zu Kunemon."
text.07bc: "Aber manchmal nicht.\nDas ist Glückssache."
text.0826: "Hey, willst du beim\nKäferturnier mitmachen?"
text.0890: "Was ist das?"
text.08b0: "Du musst dich am 22. bis\nzehn Uhr anmelden."
text.0924: "Hä???"
text.0938: "Die Einzelheiten gibt's\nam Tag des Turniers."
text.099c: "Wovon redet er\nwohl?"
text.09ea: "Wir trainieren hart, aber\nwir müssen uns auch ausruhen."
text.0a42: "Ruhen wir uns eine Stunde aus?"
text.0a7e: "Ausruhen\nNicht ausruhen"
text.0ae0: "{color:5}Training:\nHammermaschine {color:1}"
text.0b1e: "Starten\nErklären\nBeenden"
text.0b56: "Normal\nBonusversuch\nLieber nicht"
text.0ba0: "Schläge der Hammermaschine\nmachen dich stark. Deine\nVerteidigung steigt."
text.0c3e: "Nochmal erklären\nStarten\nBeenden"
text.0c98: "{color:7}Spielautomat {color:1}\nDrück {color:6}△ \nfür drei gleiche Bilder."
text.0d22: "{color:5}Training: Laufband {color:1}"
text.0d54: "Starten\nErklären\nBeenden"
text.0d8c: "Normal\nBonusversuch\nLieber nicht"
text.0dd6: "Lauf gegen die Richtung\ndes laufenden Bandes.\nDein Tempo steigt."
text.0e5a: "Nochmal erklären\nStarten\nBeenden"
text.0eb4: "{color:7}Spielautomat {color:1}\nDrück {color:6}△ {color:1}\nfür drei gleiche Bilder."
