text.0066: "Ich hau dich k.o.!"
text.00ce: "Gleich noch mal."
text.00fa: "Okay\nNein"
text.0148: "Nur noch ein bisschen...\nKomm, noch ein Mal!"
text.01ae: "Okay\nNein"
text.020c: "Ich kann nicht gewinnen!"
text.0230: "Warum willst du gewinnen?"
text.026e: "Was soll ich tun?"
text.0298: "Wie meinst du das?\nHast du nichts zu tun?"
text.02f4: "Ich habe viel Zeit."
text.032c: "Wenn du zu viel Zeit hast,\nkomm in die Stadt. Dort gibt\nes Digimon aller Art."
text.03d6: "Klingt gut. Ich komme.\nIch heiße Patamon.\nBis später."
text.0482: "Patamon zieht in die Stadt!"
text.04c8: "Das macht keinen Spaß!"
text.04f6: "Kommst du?"
text.052a: "Du riechst nach nichts!"
text.0560: "Siehst lecker aus.\nIch verschling dich!"
text.05b6: "Haha, du bist lustig!"
