text.00bc: "Osten: Aufzug\nWesten: Gefahr!!\nVorsicht, Klippe."
text.012e: "Oger-Modus: AN\nOger-Modus: AUS"
text.018a: "Vorsicht, Steinschlag!"
text.01f0: "Es heißt, auf diesem Weg\nüberfallen Banditen Leute."
text.025e: "Gut, los geht's, {color:10}{partner}{color:1}."
text.02b6: "Juhu!"
text.02d2: "Hahaha!"
text.02ec: "Jippie!"
text.034a: "Gib auf und lass dein Zeug\nhier, sonst bereust du es!"
text.03c6: "Gib auf!"
text.03e2: "Was?! Du..."
text.0404: "Das kann nicht sein!"
text.0424: "Boss, was sollen wir tun?"
text.0458: "Keine Panik! Wir sind stärker\nund wir sind mehr!\nSchnappt sie euch!"
text.0530: "Das zahl ich dir heim!"
text.0570: "Sieh nur, wie sie rennen! Die\nkommen so bald nicht wieder."
