text.006a: "Beim letzten Erdbeben sind\nErde und Sand verschwunden!"
text.00ee: "Die aktuelle Zeit ist:\nMonat {num:pstat=105}, Tag {num:pstat=106},\n{num:pstat=107} Std., {num:pstat=108} Min."
text.016e: "{color:10}{partner}{color:1} ist ein\nDaten-Digimon, oder?"
text.01c6: "{color:10}{partner}{color:1} ist ein\nVakzin-Digimon, oder?"
text.0224: "{color:10}{partner}{color:1} ist ein\nVirus-Digimon, oder?"
text.027c: "Ich kann vieles für dich tun.\nWas soll ich machen?"
text.02f2: "Seine Werte ändern\nDie Zeit beschleunigen\nHier einen Laden eröffnen"
text.038c: "Ihn superstark machen\nIhn superschwach machen\nIhn durchschnittlich machen"
text.0416: "Eine Stunde vergehen lassen\nSechs Stunden vergehen lassen\n24 Stunden vergehen lassen"
