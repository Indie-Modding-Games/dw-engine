text.0066: "Taaa"
text.0084: "Bitten wir um Verzeihung."
text.00ce: "Verzeihen heilt das Herz."
text.011c: "Bist du böse?"
text.014c: "Folge mir. Und dann..."
text.0194: "Ha ha ha!"
text.01bc: "Du!"
text.01cc: "Du wirst verlieren!"
text.0220: "Unglaublich, dass er mir\ndas Gehirn gewaschen hat."
text.027c: "Er ist stark.\nKannst du ihn besiegen?\nWarum tust du das?"
text.02f4: "Ich kämpfe für die Insel.\nKlären wir das jetzt."
text.035c: "Wir wollen keinen Herrscher.\nNur du kannst uns helfen."
