text.0072: "Da bist du ja, {color:6}{tamer}{color:1}!"
text.009a: "Wir sind Schatzsucher.\nMit unserem Grabtalent finden\nwir Schätze unter der Erde."
text.013e: "Ich finde jeden Schatz."
text.0196: "Soll ich etwas suchen?\nOder soll ich dir erklären,\nwie wir das machen?"
text.0230: "Erklären\nNicht erklären\nSchon gut"
text.0286: "Es gibt zwei Pläne, mit\nanderen Tagen und Preisen."
text.02ee: "Norm.: 3 Tage, 1000 Bits\nSpez.: 10 Tage, 5000 Bits"
text.036a: "Mit dem Spezialplan ist die\nChance auf bessere Schätze\nhöher."
text.03f6: "Das wär's.\nWas möchtest du tun?"
text.044e: "Schatz suchen\nNochmal erklären\nSchon gut"
text.04b0: "Wähl einen Plan!"
text.04d4: "Norm.: 3 Tage, 1000 Bits\nSpez.: 10 Tage, 5000 Bits\nAbbrechen"
text.056e: "Okay, dann tschüss."
text.05c4: "In drei Tagen gibt's das\nErgebnis. Drück die Daumen."
text.066a: "In zehn Tagen gibt's das\nErgebnis. Drück die Daumen."
text.06ea: "Du hast nicht genug Bits.\nIch brauche Geld für\ndie Schatzsuche."
text.07a4: "Ich suche gerade nach dem\nSchatz. Hab bitte Geduld."
text.082a: "Weißt du was?\nWir haben Schätze gefunden."
text.0b00: "Mach Platz im Gepäck!"
text.0b32: "{color:6}{item:pstat=110}{color:1} erhalten!"
text.0dae: "Danke für deinen Besuch!"
text.0de8: "Danke für dein Vertrauen,\n{color:6}{tamer}{color:1}!"
text.0e2a: "Ich helfe Drimogemon erst\nseit Kurzem. Im Suchen bin\nich richtig gut."
