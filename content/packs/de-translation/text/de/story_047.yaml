text.001c: "Formation C!"
text.00a4: "Formation A!"
text.012c: "Formation B!"
text.01c6: "Uaargh!"
text.01d8: "..."
text.01e6: "Ist das dein Ernst?!"
text.0218: "Er ist weg.\nHab ich mir das eingebildet?"
text.02a4: "Haben wir ihn erledigt?!"
text.02dc: "Was?!"
text.02f6: "Was?"
text.0310: "Ich bin plötzlich umgekippt.\nTut mir leid."
text.03b2: "Ist das Analogmans Fluch?\nMir egal."
