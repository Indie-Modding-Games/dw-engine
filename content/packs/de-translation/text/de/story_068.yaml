text.00ce: "Haha, wer mich anfasst,\nkriegt einen Schlag."
text.016a: "Willst du nicht hier sein?"
text.01ee: "Wow, toll! Der hat Mumm."
text.022c: "Aus dir wird mal was!\nGut, ich helfe dir."
text.029a: "Setzt du deine Stromkraft\nnicht für die Stadt ein?"
text.0300: "Stadt? Was ist das?\nKlingt bekannt, aber..."
text.035a: "Ich helfe. Ich bin Elecmon,\nfreut mich."
text.03ec: "Elecmon zieht in die Stadt!"
text.0432: "Uff!"
text.0454: "Aaah!"
text.0474: "Du bist erledigt!"
text.04ac: "Nicht schlecht."
text.04d2: "Du hast keinen Geschmack."
text.050e: "Du Angeber! Ich zeig's dir."
text.057e: "Diese Eisentür ist hart.\nWenn sie nicht aufgeht,\nkommen wir nicht rein."
