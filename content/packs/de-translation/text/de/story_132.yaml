text.0028: "Wo sind wir?\nIst das ein Traum?"
text.008c: "Wow! Wer bist du?\nWo ist {color:10}{partner}{color:1}?"
text.00e2: "Beruhig dich. Ich heiße\nFrigimon. Das ist mein Haus.\nIch bin ein Eis-Digimon."
text.017c: "Du lagst bewusstlos im\nSchnee. Ich hab dich geholt\nund gepflegt."
text.0218: "Oh, {color:10}{partner}{color:1}.\nGut, dass du heil bist!"
text.025c: "Hey, hörst du mir zu?\nHätte ich dich nicht gefunden,\nwärst du jetzt tot!"
text.02f6: "Oh, sorry. Ähm, danke."
text.033e: "Hey, {color:10}{partner}{color:1},\nich hab mir sogar den Kopf\ngestoßen, als du umfielst."
text.03be: "{digimon:pstat=103}erträgt keine Kälte.\nDu bist so leichtsinnig.\nDas ist alles deine Schuld."
text.0452: "Das wusste ich nicht.\nTut mir leid, {color:10}{partner}{color:1}."
text.049e: "Danke, Frigimon. Darf ich\ndich noch um was bitten?"
text.0504: "Was machst du, wenn\n{digimon:pstat=103}wieder umkippt?\nGeh lieber bald nach Hause!"
text.058e: "Gut, verstanden. {color:10}{partner}{color:1}\nsoll zu einem anderen\nDigimon digievolvieren."
text.062c: "Digievolvieren?"
text.06c8: "Hallo nochmal."
text.06e8: "Was ist mit dem\nanderen Digimon passiert?"
text.0732: "Oh, das ist dasselbe."
text.076a: "Hä? Ist das so?\nDas versteh ich nicht."
text.07bc: "Ich bin hier, weil ich dich\num was bitten will. Komm\nbitte in die Stadt."
text.0850: "Und was hab ich davon?\nWas Interessantes?"
text.08b6: "Na ja, du kannst jeden\nLaden eröffnen, den du willst."
text.0914: "Wow, das wollte ich schon\nimmer. Gut, ich komme!"
text.0980: "OK, klingt gut.\nDann lass uns gleich gehen."
text.09d8: "Ein Laden! Eisbecher und\nSofteis. Das wird\nrichtig toll!"
text.0a94: "Frigimon zieht in die Stadt!"
text.0ad6: "Das Digimon verträgt\nKälte gar nicht!"
text.0b36: "Ich komme wieder!"
