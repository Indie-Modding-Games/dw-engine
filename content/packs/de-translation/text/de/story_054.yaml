text.0056: "Myotismon ist weg."
text.009a: "Oh!"
text.00b8: "Ich habe einen Schlüssel.\nVielleicht passt er irgendwo."
text.0128: "Ich habe den\n{color:6}Hausschlüssel{color:1} benutzt!"
text.016e: "Ich muss etwas loswerden."
text.01e2: "Ich habe den\n{color:6}Hausschlüssel{color:1} benutzt!"
text.0246: "Geht nicht auf.\nEs ist abgeschlossen."
text.02d8: "Ich habe den\n{color:6}Hausschlüssel{color:1} benutzt!"
text.033c: "Geht nicht auf.\nEs ist abgeschlossen."
text.03b0: "Mampf, mampf...."
text.03d0: "Also."
text.03e6: "Hör mir zu."
text.0408: "Lecker, lecker...."
text.0430: "Meine Leute gehorchen nicht."
text.0470: "Ich glaube, sie erinnern\nsich nicht an meine Befehle."
text.04ca: "Sie verstehen nichts mehr.\nEigentlich sollten sie mir\nmein Essen bringen, aber...."
text.0560: "Mampf, mampf...."
text.0580: "Während ich arbeitete, kam\nkein Essen, also habe ich\ndas Essen vergessen."
text.0614: "Du gehst zu sehr in deiner\nArbeit auf."
text.0662: "Wie peinlich."
text.0690: "Ich glaube, in der Villa\nstimmt etwas nicht."
text.06e6: "Gibt es Ärger auf der Insel?\nSind alle wie meine Leute?"
text.0754: "Ja, alle verlieren\nihr Gedächtnis."
text.07a6: "Glaubst du, jemand steckt\ndahinter?"
text.07fa: "Hm?"
text.080a: "Was kann ich tun?"
text.082e: "Wir bauen eine Stadt, die\ndie Herzen der Digimon eint."
text.089e: "Wir suchen Freunde."
text.08da: "Was kann ich tun? Meine Leute\nkönnen nur kämpfen."
text.0940: "Ich lasse sie nicht allein."
text.0978: "Verstehe."
text.098c: "Lass mich darüber nachdenken.\nEs tut mir sehr leid."
text.09e0: "Ich komme wieder.\nVergiss nicht zu essen."
text.0b9c: "Danke für deine Hilfe. Ich\nzeige dir meine Forschung."
text.0c02: "Manchmal, wenn MetalGreymon\nschwindet, digievolviert er\nzu SkullGreymon.{stop}"
text.0cac: "Bakemon, Devimon und\nPhoenixmon digievolvieren\nauch so."
text.0d22: "Wer sie bei der Geburt waren,\nweiß ich nicht. Die Tabellen\nzur Digievolution schweigen."
text.0dc6: "Die Kämpfe haben meinen\nLeuten geholfen."
text.0e0a: "Ein Kampf ist eine schöne\nPause von der Forschung."
text.0e64: "Was erforschst du denn?"
text.0eae: "In der Stadt wurde eine\nArena gebaut!"
text.0efc: "Ob meine Leute wohl\nhelfen könnten?"
text.0f40: "Ja, dort dürfen sie so hart\nkämpfen, wie sie wollen."
text.0fa4: "Meinen Leuten geht es\nschlechter. Zeit, die\nVilla zu verlassen."
