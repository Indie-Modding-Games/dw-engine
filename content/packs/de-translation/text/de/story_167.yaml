text.0038: "Oh, {color:6}{tamer}{color:1}und {color:10}{partner}{color:1},\nda seid ihr ja."
text.0078: "Ich bin ein Lieferant.\nIch liefere alles."
text.00cc: "Das Einzige, was ihr tragen\nkönnt, seid ihr selbst, oder?"
text.0132: "Soll ich euch tragen?\nTolle Idee, oder?"
text.0190: "Ich bringe euch überall\nhin, jederzeit.\nNatürlich gegen Gebühr."
text.0222: "Hey, {color:6}{tamer}{color:1}."
text.023c: "Manchmal patrouilliere ich\nin der Zahnradsavanne."
text.029e: "Am Strand der Zahnradsavanne\nsoll es Läden geben. Hast\ndu sie gesehen?"
