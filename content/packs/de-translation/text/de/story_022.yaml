text.00c2: "Mein Flügel tut weh."
text.00ee: "Was ist passiert?"
text.0112: "Mein Flügel ist verletzt...\nHast du was zum Verarzten?"
text.018e: "Wow, das sieht übel aus!\nWarte. Lass mich mal sehen."
text.0208: "Ich hab gerade\nnichts dabei."
text.0294: "Das reicht nicht."
text.02bc: "Viel besser. Danke dir."
text.030a: "Kannst du jetzt fliegen?"
text.0332: "Weit fliegen geht noch nicht."
text.037a: "In der Stadt gibt es eine\nKlinik. Geh am besten hin.\nEs ist nicht weit."
text.0402: "Ich hab von der Stadt gehört.\nSie ist größer als gedacht."
text.0470: "Ruh dich in der Stadt aus."
text.04a8: "Danke. Vielleicht kann\nich dir mal helfen."
text.053c: "Unimon zieht in die Stadt!"
text.057c: "Ich habe nichts, um deine\nWunde zu verarzten.\nIch besorge dir etwas."
text.0608: "Tut mir leid. Beeil dich!"
text.068c: "Hier sind seltsame Zeichen\nauf dem Boden."
text.06f0: "Ist das einer dieser\nmysteriösen Kreise?\nEr sieht noch neu aus."
text.0774: "Jetzt sehe ich noch mehr!\nOb das etwas mit dem\nUFO zu tun hat...?"
text.080a: "Wow!? Es sind mehr\nals vorher!"
text.0862: "Was hat das zu bedeuten?"
text.0896: "Was?"
text.08f8: "Vademons UFO erscheint."
text.092c: "Ein... ein Alien?!"
text.0950: "..."
text.095e: "Bist du... ein Digimon?"
text.0990: "..."
text.099e: "Na ja..."
text.09b4: "..."
text.09ca: "Vademon zieht eine Waffe."
text.09fa: "Nein, halt!\nIch bin nicht dein Feind!"
text.0a3c: "Vademon senkt die Waffe."
text.0a70: "Gut, dass du verstehst."
text.0aa0: "{color:6}{tamer}{color:1} versucht\nihn verzweifelt zu überreden."
text.0af4: "..."
text.0b02: "Versteht er es etwa nicht?"
text.0b3a: "Okay."
text.0b8a: "Vademon zieht in die Stadt!"
text.0bc0: "Er..."
text.0bd0: "Er kann ja sprechen!"
