text.009a: "Ha! Du hast Angst."
text.00d4: "Geh lieber nach Hause!"
text.0114: "Wer hineingeht,\nkommt nicht mehr raus."
text.0170: "Hehe!"
text.0198: "Warte."
text.01b8: "Du wirst besessen."
text.0202: "Bakke-bakke?"
text.0226: "Ich glaube, er\nfragt etwas."
text.0272: "?...Ja\n?...Nein"
text.02a8: "Bakke! Bakke bakke?"
text.02d6: "Ja\nNein"
text.0300: "Bakkeee...bakke bakke?"
text.0338: "Ja\nNein"
text.035e: "Bakke bakke!\nBakkeee bakke bakkeee!"
text.03e8: "Bakemon zieht in die Stadt!"
text.0422: "Ich glaube, das lief gut."
text.046e: "Hab ich ihn wütend gemacht?"
text.04ea: "Eine seltsame schwarze\nKraft hält mich auf!"
text.0556: "Was?! Meine Beine sind..."
