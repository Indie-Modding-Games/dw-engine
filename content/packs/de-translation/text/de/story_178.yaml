"text.00a8": "Du kommst genau richtig!\nIch habe eine Bitte, die\nnur du erfüllen kannst."
"text.0146": "Was gibt's?"
"text.0164": "Ich spüre dasselbe Böse\nwie bei Analogman\nund Machinedramon."
"text.01f8": "Ich weiß, woher es kommt."
"text.0236": "Schon wieder? Überlass es mir!"
"text.0272": "Danke. Übrigens..."
"text.02b8": "Ich habe gehört, du hast\nMachinedramon besiegt!"
"text.02fe": "Ja, aber ich versteh's nicht.\nEs wirkte wie der Fluch\nvon Analogman."
"text.0386": "Sein Groll war so stark.\nVielleicht ist jetzt Frieden."
"text.03fa": "Kommt Machinedramon zurück,\nbesiegen wir ihn wieder."
"text.0460": "Dir kann man vertrauen. Das\nwuchs auf unserer Fleischfarm,\nes ist für dich."
"text.04f0": "Wow! Eine\n{color:6}Kettenmelone{color:1}?"
"text.0548": "Ich habe zu viele Items."
"text.0588": "Danke!"
"text.05be": "Da bist du ja!\nUm das kann ich sonst\nniemanden bitten."
"text.0636": "Keine Sorge, ich bin da.\nMeinst du, Analogman\nist zurück?"
"text.06a6": "Ich spüre sein Böses, aber\nnicht, wo es ist."
"text.0712": "Überlass das mir! Ich finde\nihn und kümmere mich drum."
"text.0784": "Danke.\nÜbrigens..."
"text.07ea": "Ich bin zurück und will die\nFile-Stadt mit Hilfe von\n{color:10}{partner}{color:1} neu aufbauen."
"text.0882": "Ich will Läden bauen,\ndie dir und {color:10}{partner}{color:1}\nnützlich sind."
"text.0900": "Erkunde den Heimatwald\ndirekt vor der Stadt."
"text.099c": "Nimm das. Viel Glück."
"text.09de": "Ich habe viele Items bekommen!"
"text.0a26": "Um Items anzusehen, drück\n{color:5}× {color:1}..."
"text.0a6a": "...dann wähl „Item“\nund schau sie dir mit\n{color:6}△ {color:1}an."
"text.0ae2": "Yuramon hat wohl neue\nGerüchte gesammelt."
"text.0b56": "Yuramon soll neue\nGerüchte haben."
"text.0bb2": "Die Stadt fängt an zu\nwachsen, und sie soll sich\ngerade verändern."
"text.0c30": "Ich erkläre dir, wie es in\nunserer Welt so läuft."
"text.0ca0": "Ein Tag hat vierundzwanzig\nStunden, und es gibt Morgen,\nTag und Nacht."
"text.0d32": "Vielleicht kommt dir das\nTempo schnell vor."
"text.0d76": "Ein Jahr hat dreißig Tage.\nMonate? Was? Jahreszeiten?\nKann man die essen?"
"text.0e14": "Natürlich haben wir Geld.\nDie Einheit heißt Bit. Geld\nkann man nie genug haben."
"text.0eb6": "Wenn man auf dieser Insel\n„Stadt“ sagt, meint man hier."
"text.0f24": "Aber es gibt noch andere\nkleine Dörfer und Städte."
"text.0f84": "Auf der Uhr zeigt der gelbe\nPunkt die Stunden, der Zeiger\ndie Minuten."
"text.100a": "Oben ist Mitternacht\nund unten Mittag."
"text.1050": "Der rote Teil links ist der\nspäte Nachmittag: von vier\nbis acht Uhr."
"text.10f0": "Der lila Teil rechts ist der\nMorgen: von vier bis\nacht Uhr."
"text.118a": "Digimon sind zu bestimmten\nTageszeiten aktiv."
"text.11e6": "Die meisten stehen morgens\nauf und schlafen nachts,\nmanche aber umgekehrt."
"text.1286": "Triffst du ein Digimon\nnicht, versuch es zu\neiner anderen Tageszeit."
"text.1340": "Sprich so oft du kannst\nmit Tsunomon und Yuramon."
"text.13bc": "Ich erzähle dir von\nder Bändigerstufe."
"text.140a": "Ist deine Bändigerstufe hoch,\nund dein Digimon verschwindet,"
"text.147c": "hat dein nächstes Digimon\nbessere Werte."
"text.14de": "Am Anfang steigt\nsie nicht sehr,"
"text.152e": "aber zieh fleißig weiter auf,\ndann wird sie besser."
"text.15b2": "Setzt du deine Spezialtechnik\nein, drück schnell immer\nwieder L und R."
"text.1658": "Ist die Spezialleiste voll,\nrichtest du doppelt so viel\nSchaden an wie bei leerer!"
"text.1704": "Ich erzähle dir vom\nLeben eines Digimon."
"text.1754": "Hat ein Digimon Hunger,\nsagt es dir Bescheid."
"text.17ac": "Es muss auch aufs Klo.\nSorg dafür, dass es\ndas Klo benutzt."
"text.182e": "Digimon werden müde und\nbrauchen Schlaf, aber du\nmusst sie schlafen legen."
"text.18b8": "Lass es nicht zu lange\nwach bleiben."
"text.190a": "Es kann müde, krank oder\neinfach sauer werden.\nEs ist recht empfindlich."
"text.198c": "Digimon sind wilde Wesen,\ndarum musst du sie loben\noder mit ihnen schimpfen."
"text.1a16": "Was du auch tust, achte\nimmer darauf, was dein\nDigimon gerade macht."
"text.1aba": "Du bist aufgewacht...\nEs tut mir so leid."
"text.1b28": "Was ist das für eine Maschine?"
"text.1b64": "Die da? Das ist eine\n{color:4}Speichermaschine für\nMemory-Card-Kampfdaten{color:1}."
"text.1be6": "Mit der Maschine kannst du\ndie Daten deines Partners\nfür Kämpfe speichern."
"text.1c7c": "Drück einfach {color:6}△ {color:1},\ndann sagt dir die Maschine,\nwas zu tun ist."
"text.1d02": "Willst du die\n{color:4}Speichermaschine für\nMemory-Card-Kampfdaten{color:1} nutzen?"
"text.1d84": "Ja\nNein"
"text.1dce": "Punimon ist nicht da, aber\nich ruhe mich hier aus."
"text.1e3a": "{color:7}Punimon {color:1}\nIch bin Punimon! Willst du\ndich hier etwas ausruhen?"
"text.1eb0": "{color:7}Punimon {color:1}\nEine Stunde Ruhe heilt HP,\nMP und senkt die Müdigkeit."
"text.1f34": "Ausruhen\nNicht ausruhen"
