text.009a: "Hier ist keine Wache!"
text.00f8: "Hier kommst du nicht durch."
text.0136: "Hier kommst du nicht durch."
text.01dc: "......"
text.01f0: "Wow, er starrt uns an!\nVielleicht ist er\nmisstrauisch."
text.0266: "Wir sollten uns verstecken,\nwarten und wiederkommen.\nEs ist zwölf Uhr."
text.030e: "Diese Fabrik leitet sicher\nihren Abfall in den Kanal.\nDas muss ich rausfinden."
text.03d4: "Kannst du bitte zur Seite?"
text.0412: "Ohne Passierschein vom\nZuständigen kommst du\nhier nicht durch."
text.04a8: "Ich hab's eilig."
text.04ce: "Sorry, du brauchst einen\nPassierschein."
text.051c: "OK, wenn das\nso ist."
text.0580: "Und was machen wir jetzt?"
text.05b4: "Zeit für den Schichtwechsel\nLass mich durch, sonst...\nNein, nichts"
text.0636: "Es ist noch nicht Zeit\nfür den Schichtwechsel."
text.0694: "Schon gut, keine Sorge.\nWann ist Schichtwechsel?"
text.0704: "Nein, wir müssen uns genau\nan die Zeiten halten."
text.075e: "Schichtwechsel ist um\nMitternacht und mittags."
text.07bc: "Ach so."
text.07e2: "Drohen bringt nichts.\nHol dir einen Passierschein."
text.084a: "Passierschein? Hab ich.\nIch erteile dir die Erlaubnis!"
text.08bc: "Wir können dir keinen geben.\nDu musst den offiziellen\nWeg gehen."
text.0944: "Wow, seid ihr streng!"
text.097c: "Ist noch kein Schichtwechsel?"
text.09b8: "..."
text.09c6: "Wow, er starrt uns an!\nEr wird wohl nicht die\nSchicht wechseln."
text.0a42: "Komm, wir kommen später\nwieder. Wir sollten uns\nverstecken und warten."
text.0aca: "Bopi bopi puuuuu."
text.0b02: "Geba geba!"
text.0b2c: "Buubjo?"
text.0b50: "Ich bin zufrieden!"
text.0b82: "Das gehört zu meinem Job."
text.0bc6: "Was ist das Problem?"
