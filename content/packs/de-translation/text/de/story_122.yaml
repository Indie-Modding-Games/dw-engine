text.0020: "Bin ich im Weg?"
text.0056: "Du hast mich gerettet!"
text.0078: "Du warst das also."
text.009c: "Das passt ja perfekt."
text.00cc: "Was?"
text.00e2: "Ich war auf dem Weg in deine\nStadt, um mein Talent\nsinnvoll einzusetzen!"
text.0160: "Was für ein Talent?"
text.0190: "Was, du kennst mich nicht?\nIch bin bei den Digimon als\nBesserwisserin bekannt!"
text.0224: "Echt?\nVon dir hab ich nie gehört."
text.026c: "Ich bin bereit für die Stadt."
text.02b4: "Ist sie wirklich\nzu was nütze?"
text.0302: "Tschüss!"
text.0350: "Shellmon zieht in die Stadt!"
