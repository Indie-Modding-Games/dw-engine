text.0090: "Du hältst dich für was Tolles!"
text.00dc: "Was hab ich dir denn getan!?"
text.0156: "{color:7}? ? ? {color:1}\nWarte!"
text.02f0: "Ich heiße Ninjamon!"
text.033a: "Du bist {color:6}{tamer}{color:1}?\nUnd du musst {color:10}{partner}{color:1}sein!"
text.0380: "Du bist berühmt, sogar im\nNinjadorf. Nimm meine\nHerausforderung an!"
text.041e: "Klar\nEin andermal"
text.0454: "Ha, das glaubst auch nur du!"
text.04e0: "Du bist so stark, wie alle\nsagen. Bitte mach mich\nzu deinem Schüler!"
text.0580: "Schüler? Na ja, das mache\nich nicht. Aber hilf uns\ndoch beim Stadtbau."
text.060a: "Okay.\nDas ist auch gutes Training.\nIch gebe mein Bestes."
text.076c: "Ninjamon zieht in die Stadt!"
text.07b8: "He, du!"
text.07d0: "Was meinst du damit?\nWarum bist du hier?"
text.081c: "He, {color:6}{tamer}{color:1}!"
text.0834: "Als ich in der Stadt meinen\neigenen Harem gründen\nwollte, flog ich raus!"
text.08ce: "Dir geht's ja richtig gut\nzurzeit, hab ich gehört.\nIch verkauf dir was Gutes!"
text.0962: "Es ist die äußerst wertvolle\n{color:6}Goldbanane{color:1}."
text.09c0: "Macht fünfzigtausend Bits.\nKein Anschreiben, bitte."
text.0a24: "Zahlen\nNicht zahlen"
text.0a76: "Du Dummkopf! Du hast zu viel!"
text.0abe: "Ups, ich hab zu viel!"
text.0afe: "Vielen herzlichen Dank!"
text.0b30: "Menschen zahlen mit Echtgeld."
