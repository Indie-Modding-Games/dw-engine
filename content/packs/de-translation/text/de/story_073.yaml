text.00cc: "Was ist los?"
text.00f4: "HILFE!"
text.0114: "Er steckt in der Klemme,\nich muss ihm helfen!"
text.0174: "{color:7}??? {color:1}\nLeg dich mit jemandem\nin deiner Größe an!"
text.01e4: "Wer ist das?"
text.0270: "Alles in Ordnung?"
text.0298: "Danke."
text.02b4: "Ruf mich, wenn du in\nder Klemme steckst. Ich\nkomme sofort!"
text.032e: "Bis bald!"
text.035e: "Hey, warte!"
text.039a: "Er ist wie ein Held.\nEr kriegt allen Ruhm."
text.0404: "Das ist mein Haus. Raus!"
text.044a: "Ich bin Sharmamon. Und du?"
