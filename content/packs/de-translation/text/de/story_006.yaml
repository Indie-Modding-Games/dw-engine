text.0122: "Ich werde gewinnen!"
text.0150: "Komm nicht her! Geh weg!"
text.0194: "Jetzt bin ich richtig sauer!"
text.01d0: "Schlägst du, hau ich zurück!"
text.0214: "Versuch's, wenn du kannst!"
text.02f4: "Ach, du bist's, {color:6}{tamer}{color:1}.\nDie Brücke ist repariert."
text.0348: "Du baust eine Stadt, hör ich."
text.0386: "Ich habe eine Bitte.\nHilf mir, so wie ich\ndir geholfen habe."
text.040a: "?"
text.0414: "Eine Stadt bauen heißt,\ndiese Insel zu retten.\nAlle werden gerettet."
text.04a2: "Heißt das, du kommst\nin die Stadt?"
text.04fc: "Ja. Ich komme in deine Stadt."
text.0596: "Coelamon zieht in die Stadt!"
text.06b0: "He, bist du ein Mensch?"
text.06dc: "Ich bin Coelamon,\ndas Fisch-Digimon.\nBist du zu mir gekommen?"
text.0758: "Ja, wir haben dich gesucht\nJetzt, wo du es sagst"
text.07d0: "Haha, ach wirklich!"
text.080c: "Ich weiß schon, was\ndu willst."
text.084e: "Die Brücke flussaufwärts ist\nkaputt und du willst rüber.\nStimmt's?"
text.08f2: "Verstehe.\nGut, ich helfe dir."
text.093c: "Aha, du bist wieder da."
text.0a0a: "Jetzt lauf über unsere\nKöpfe. Keine Sorge."
text.0a7a: "Okay, los geht's!"
text.0b94: "Diese Welt braucht mehr\nTeamgeist. Bis bald."
