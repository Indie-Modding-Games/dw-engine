text.0028: "Urgh!"
text.0060: "Was?"
text.007e: "Was?!"
text.009e: "Oh Boss, wir haben Ärger!"
text.00e2: "Was macht ihr da?"
text.011e: "Respekt. Du hast die Neue\nOgerfestung gefunden!"
text.018c: "Plant ihr neue Verbrechen?"
text.01d0: "Na klar! Hehe!"
text.01fa: "Das lasse ich nicht zu!\nIhr verschwindet besser\naus dieser Höhle!"
text.0278: "Diesmal ist es anders!"
text.02c0: "Boss, ist er das?"
text.02ee: "Ja. Los!"
text.033c: "Was zum...?!"
text.0360: "Meister WaruSeadramon!\nBitte, mach ihn fertig!"
text.03ca: "Er ist dein Leibwächter, was?"
text.040c: "Hehehe! Du bist erledigt!"
text.0490: "Mist!"
text.04a2: "Ahhhhhh!"
text.04c6: "Du entkommst mir nicht!"
