text.003c: "Wohin gehst du?"
text.007a: "Warte!"
text.009a: "Dopeeee!"
text.00c0: "Gguhh Heii Hii!"
text.00f6: "Wer bist du?"
text.0114: "Ich bin MetalMamemon, in 99\nKämpfen unbesiegt! Du wirst\nmein hundertstes Opfer!"
text.01b0: "Ich glaub nicht, dass einer\nwie {color:6}{tamer}{color:1}wegläuft."
text.0214: "OK, kämpfen wir\nSorry, später"
text.0294: "Du bist besser, als\nich dachte."
text.02d4: "Du bist ein würdiger Rivale!"
text.0306: "Eines Tages schlag ich dich!"
text.0372: "MetalMamemon zieht in\ndie Stadt!"
text.03c6: "Ich wusste, dass du kneifst.\nNa ja, wir sehen uns, wenn\ndu mehr Mumm hast."
