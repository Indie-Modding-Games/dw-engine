text.0072: "Heiß! Ist das heiß!"
text.00a4: "Es fängt an zu kochen!"
text.00e0: "Ach so."
text.010a: "Na gut, komm schon!"
text.0142: "Mir reicht's!"
text.0178: "Nein danke!"
text.01a2: "Was?"
text.01c2: "Mmmmm!"
text.01f4: "Ich hab ein mieses Gefühl."
text.022c: "Du auch? Dachte ich mir."
text.0288: "Im Tunnel ist nichts.\nGehen wir durch?"
text.02f0: "Gehen\nNicht gehen"
