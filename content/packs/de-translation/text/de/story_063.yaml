text.0042: "Myotismon ist nicht hier."
text.00b2: "Äh... mein Kühlschlüssel?"
text.00f4: " ! "
text.0102: "Will mir jemand helfen?"
text.013a: "Ein Digimon? Alles okay?"
text.016a: "Wer bist du? Gib mir Essen!"
text.01a6: "Hunger? Was willst du denn?"
text.01e0: "Fleisch."
text.020c: "Ich habe Fleisch!"
text.022a: "Fleisch."
text.023c: "Was?"
text.0252: "Fleisch? Nein, hab ich nicht."
text.028e: "Hier."
text.02a4: "Ein Schlüssel?"
text.02c4: "Ich muss etwas loswerden."
text.0312: "Ich habe den {color:6}Kühlschlüssel{color:1}!"
text.0342: "Okay..."
text.0358: "Ich habe nicht mehr viel Zeit!"
text.038c: "Ich bringe bald etwas.\nHalte noch etwas durch."
text.03fc: "Puh!"
text.041e: "Gerettet. Tausend Dank.\nTut mir leid für die Mühe."
text.0488: "Was ist passiert?"
text.04ac: "Ich bin Myotismon, der Herr\ndieser Villa."
text.0500: "Ich bin {color:6}{tamer}{color:1}, ein Mensch\naus einer anderen Welt. Das\nist mein Partner {color:10}{partner}{color:1}."
text.0580: "Wir wollen\ndie Insel retten."
text.05c4: "Wir haben wohl viel zu\nbereden. Willkommen."
text.0678: "Wow!"
text.0688: "..."
text.0696: "Ist das dein Ernst?"
text.06c6: "Es ist weg. Ist das ein Traum?"
text.0746: "Ich glaube, das ist erledigt."
text.078e: "Was?"
text.07a6: "Hä? Was?"
text.07ca: "Ich war weg. Tut mir leid."
text.084e: "Der Fluch von Analogman!\nKeine Sorge, das wird schon."
