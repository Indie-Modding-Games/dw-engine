text.0056: "Mann, ich will {color:6}Fleisch {color:1}."
text.0090: "Willkommen, du brauchst also\n{color:6}Fleisch{color:1}. Also, äh..."
text.0104: "Preis erhöhen\nBei fünfzig Bits lassen\nPreis senken"
text.0176: "Äh, du willst also billiges\n{color:6}Fleisch{color:1}? Äh..."
text.01e8: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfundsiebzig Bits?"
text.0256: "Auf fünfundsiebzig erhöhen\nNochmal überlegen"
text.02de: "Und {color:6}Fleisch{color:1} zu fünfzig Bits\nfür siebzig Bits?"
text.033a: "Auf siebzig erhöhen\nNochmal überlegen"
text.03c2: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfundsechzig Bits?"
text.042c: "Auf fünfundsechzig erhöhen\nNochmal überlegen"
text.04b0: "Und {color:6}Fleisch{color:1} zu fünfzig Bits\nfür sechzig Bits?"
text.0508: "Auf sechzig erhöhen\nNochmal überlegen"
text.058c: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfundfünfzig Bits?"
text.05f6: "Auf fünfundfünfzig erhöhen\nNochmal überlegen"
text.066e: "Und {color:6}Fleisch{color:1} zu fünfzig Bits\nzum Normalpreis?"
text.06ca: "Zum Normalpreis anbieten\nNochmal überlegen"
text.074c: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfundvierzig Bits?"
text.07b6: "Auf fünfundvierzig senken\nNochmal überlegen"
text.083a: "Und {color:6}Fleisch{color:1} zu fünfzig Bits\nfür vierzig Bits?"
text.0892: "Auf vierzig senken\nNochmal überlegen"
text.0916: "Wie wär's: {color:6}Fleisch{color:1} zu fünfzig\nfür fünfunddreißig Bits?"
text.0982: "Auf fünfunddreißig senken\nNochmal überlegen"
text.0aca: "Okay, ich nehm's!"
