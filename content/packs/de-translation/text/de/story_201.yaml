text.0ce2: "Gesamtgewinn: {shopvar}\nGewinn:\nfünfzehn"
text.0d3c: "Gesamtgewinn: {shopvar}\nGewinn:\nzehn"
text.0d8e: "Gesamtgewinn: {shopvar}\nGewinn:\nfünf"
text.0dd8: "Gesamtgewinn: {shopvar}\nGewinn:\nnull"
text.0e9a: "Du verschwendest meine Zeit!!"
text.0f06: "Mensch, wo bleiben die Kunden?"
text.0f56: "Ich glaub, du bist zu teuer!"
text.0f96: "Kann sein. Na dann..."
text.0fce: "Ich gäb alles für ein\n{color:6}Reiseklo{color:1}."
text.102a: "Äh... Willkommen, du willst\nein billiges {color:6}Reiseklo{color:1}?"
text.10a0: "Preis erhöhen\nBei dreihundert Bits lassen\nPreis senken"
text.111c: "Äh... mal sehen, du willst\nein {color:6}Reiseklo{color:1}?"
text.119c: "Und das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür vierhundertfünfzig Bits?"
text.1238: "Auf vierhundertfünfzig erhöhen\nNochmal überlegen"
text.12c6: "Wie wär's: das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür vierhundertzwanzig Bits?"
text.136c: "Auf vierhundertzwanzig erhöhen\nNochmal überlegen"
text.13f6: "Und das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür dreihundertneunzig Bits?"
text.1496: "Auf dreihundertneunzig erhöhen\nNochmal überlegen"
text.1522: "Wie wär's: das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür dreihundertsechzig Bits?"
text.15c8: "Auf dreihundertsechzig erhöhen\nNochmal überlegen"
text.1652: "Und das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür dreihundertdreißig Bits?"
text.16f2: "Auf dreihundertdreißig erhöhen\nNochmal überlegen"
text.1772: "Wie wär's: das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nzum Normalpreis: dreihundert?"
text.1818: "Zum Normalpreis anbieten\nNochmal überlegen"
text.189a: "Und das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür zweihundertsiebzig Bits?"
text.1938: "Auf zweihundertsiebzig senken\nNochmal überlegen"
text.19c6: "Wie wär's: das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür zweihundertvierzig Bits?"
text.1a68: "Auf zweihundertvierzig senken\nNochmal überlegen"
text.1af4: "Wie wär's: das {color:6}Reiseklo{color:1}\nzu dreihundert Bits\nfür zweihundertvierzig Bits?"
text.1b96: "Auf zweihundertzehn senken\nNochmal überlegen"
text.1ce0: "Alles klar, ich nehm's!"
