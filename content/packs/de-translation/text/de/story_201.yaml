text.20ec: "Jetzt mach mal halblang!"
text.2126: "Hä? Na dann..."
text.2154: "Mann, ich brauche\n{color:6}Medizin{color:1}."
text.2194: "Äh... Willkommen, du willst\n{color:6}Medizin{color:1}?"
text.21fa: "Preis erhöhen\nBei tausend Bits lassen\nPreis senken"
text.2274: "Äh, du wolltest billige\n{color:6}Medizin {color:1}, oder?"
text.22f4: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür fünfzehnhundert Bits?"
text.2380: "Auf fünfzehnhundert erhöhen\nNochmal überlegen"
text.240a: "Und die {color:6}Medizin{color:1}\nzu tausend Bits\nfür vierzehnhundert Bits?"
text.2490: "Auf vierzehnhundert erhöhen\nNochmal überlegen"
text.251c: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür dreizehnhundert Bits?"
text.25aa: "Auf dreizehnhundert erhöhen\nNochmal überlegen"
text.2636: "Und die {color:6}Medizin{color:1}\nzu tausend Bits\nfür zwölfhundert Bits?"
text.26b8: "Auf zwölfhundert erhöhen\nNochmal überlegen"
text.2740: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür elfhundert Bits?"
text.27ca: "Auf elfhundert erhöhen\nNochmal überlegen"
text.2846: "Und die {color:6}Medizin{color:1}\nzu tausend Bits\nzum Normalpreis: tausend?"
text.28d0: "Zum Normalpreis anbieten\nNochmal überlegen"
text.2952: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür neunhundert Bits?"
text.29d8: "Auf neunhundert senken\nNochmal überlegen"
text.2a62: "Und die {color:6}Medizin{color:1}\nzu tausend Bits\nfür achthundert Bits?"
text.2ae2: "Auf achthundert senken\nNochmal überlegen"
text.2b6e: "Wie wär's: die {color:6}Medizin{color:1}\nzu tausend Bits\nfür siebenhundert Bits?"
text.2bf6: "Auf siebenhundert senken\nNochmal überlegen"
text.2d44: "Okay, gekauft!"
