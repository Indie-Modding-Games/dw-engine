text.0094: "Geh geradeaus und dann\nrechts. Hehehe..."
text.0108: "Geh rechts und dann\nschnell links. Hehe..."
text.016c: "Aus diesem Wald kommst du\nnicht raus. Hehehe..."
text.01dc: "Ich hab mich verlaufen!"
text.0208: "In letzter Zeit bin ich müde."
text.024e: "Du? Niemals!?"
text.027e: "Pass auf, wo du hintrittst."
text.02cc: "Hey, du da!"
text.0318: "Hmm, du bist ja einer!\nDas war ziemlich gut für\nso früh am Morgen."
text.03c2: "Hey, hey, tu nicht so, als\nginge dich das nichts an!"
text.0438: "Ich weiß! Ich weiß, wovon\ndu redest."
text.0490: "Ich hab gehört, du sammelst\nfleißig Digimon, um der\nInsel zu helfen."
text.0520: "Du weißt es also. Na dann,\nhilf mir doch."
text.057a: "Und wo soll ich\nwas genau tun?"
text.05d2: "Ach, du kapierst es nicht!\nDu sollst doch in der\nStadt arbeiten, vergessen?!"
text.066c: "Wie man so sagt... der frühe\nVogel fängt den Käfer."
text.06e2: "Das hat damit gar nichts zu\ntun! Außerdem heißt es\nWurm, nicht Käfer!"
text.078a: "War nur ein Scherz. Na dann,\nwir sehen uns in der Stadt..."
text.0830: "Kokatorimon zieht in die\nStadt!"
text.0876: "Können wir ihm wirklich\ntrauen? Ich frag mich..."
text.08de: "Hey, hier liegen Vogelfedern.\nSie sind noch ganz frisch.\nSind wir zu spät?"
