text.0076: "Oh, vielen Dank!"
text.00a6: "Was? Willst du kämpfen?"
text.00f4: "Oh, danke schön!"
text.0120: "Lass das!"
text.0154: "Übernimm dich nicht!"
text.0186: "Kämpf mit mir, du Wicht!"
text.01c0: "Ich gebe auf!"
text.01de: "Der Boss ist weg."
text.0262: "He, Leute, wenn ihr hier\ndurchwollt, dann lasst\nall eure Sachen da!{stop}"
text.02ec: "Lange nicht gesehen."
text.0316: "Hm. Ihr schon wieder!"
text.0346: "Das sag ich doch!\nDich zu finden war leicht.\nBereit zu verlieren?"
text.03c6: "Verlieren? Niemals!\nIch zeig dir, was ich tue,\nwenn ich ernst mache!"
text.0444: "Klären wir das\nein für alle Mal!"
text.04de: "Wieso... gewinne ich nicht?"
text.0520: "Was ist los?\nLäufst du nicht weg?"
text.0578: "Ich bin zu müde."
text.059c: "..."
text.05aa: "Ich wurde Bandit, weil ich\ndachte, die Insel sei am\nEnde. Mir war alles egal."
text.0654: "Wusstest du, dass die\nInsel in Not ist?"
text.06aa: "Ja, und dann kamst du.\nEs wäre wohl dumm, dir\njetzt noch zu helfen."
text.0742: "Finde ich nicht.\nKomm in die Stadt."
text.0794: "Nein, das geht nicht. Und\nkeiner würde mir verzeihen,\nwas ich getan habe."
text.083e: "Ach, sei einfach still\nund komm mit!"
text.089c: "Du kannst nützlich sein!\nJeder hat etwas\nzu bieten!"
text.090c: "!!!"
text.0922: "Kann diese Insel gerettet\nwerden? Du wirst sie für\nuns retten, oder?!"
text.09ba: "Klar! Du weißt doch,\nwo die Stadt ist, oder?"
text.0a1c: "Ohhhhh!\nIch komme hin!"
text.0a84: "Ogremon zieht in die Stadt!"
text.0ad6: "Ups!\nHier geht's nicht raus!"
text.0b32: "Oh nein! Die Erdkiste muss\nzurück zu Drimogemon!"
text.0be6: "Ups! Hier geht's nicht raus!"
text.0c42: "Oh nein! Die Erdkiste muss\nzurück zu Drimogemon!"
