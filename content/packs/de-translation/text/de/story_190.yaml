text.014c: "Auf dem Boden sind\nkomische Zeichnungen."
text.01a2: "Sind das diese seltsamen\nKreise? Sie wirken noch neu."
text.0238: "Jetzt sind es mehr.\nGlaubst du, sie sind\nvom UFO?"
text.02d4: "Uaah!?"
text.02f4: "Jetzt sehe ich viel mehr."
text.032c: "Tja, ich schätze, das heißt..."
text.036a: "Was?"
text.03d0: "Ein Alien?!"
text.03ec: "..."
text.03fa: "Bist du ein Digimon?"
text.0426: "..."
text.0434: "Bist du eins?"
text.044c: "..."
text.0472: "Ich bin nicht dein Feind!"
text.04a8: "Gut, jetzt verstehst du es."
text.04ea: "{color:6}{tamer}{color:1} versuchte,\nihn zu überzeugen."
text.0526: "..."
text.0534: "Er versteht es wohl nicht."
text.0588: "Okay."
text.05d4: "Vademon zieht in die Stadt!"
text.060a: "Hä?"
text.0618: "Er kann sprechen!"
