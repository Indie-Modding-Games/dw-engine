text.004a: "Willkommen. Dich habe ich noch\nnie gesehen. Woher kommst du?"
text.00c2: "Aus der Stadt. Eigentlich aus\neiner anderen Welt."
text.0120: "Du verstehst meine Sprache?"
text.015e: "Ja, tue ich."
text.017a: "Manchmal ist es schwer und\nich verkaufe hier nicht viel."
text.01e0: "Verstehe."
text.01f4: "Viele Kunden bleiben weg."
text.0236: "Das liegt bestimmt an den\nProblemen auf der Insel."
text.0288: "Hilf mir bei etwas."
text.02ba: "Wobei denn?"
text.02d8: "Arbeitest du in meinem Laden?"
text.0310: "In deinem Laden?"
text.032c: "Einen halben Tag? Je mehr du\nverkaufst, desto mehr zahle\nich. Du kennst unsere Sprache."
text.03c8: "Vielleicht verlierst du Geld."
text.03fa: "Keine Sorge. Das tut mir gut.\nWie wäre es mit acht Stunden?"
text.0474: "Ich versuch's\nNein danke"
text.05fa: "Schade. Komm wieder, wenn\ndu Zeit hast."
text.065e: "Willst du arbeiten?"
text.06b2: "Gut, die Hälfte ist geschafft.\n "
text.0750: "So verdienen wir gar nichts.\nStreng dich mehr an.\n "
text.07e2: "Der Verkauf läuft gut.\nDa springt etwas Geld raus."
text.084a: "So viel Kundschaft hatte\nich lange nicht mehr.\nWeiter so!"
text.08d8: "Ich glaube, es ist Zeit.\nDanke für deine Arbeit."
text.0944: "Es ging besser, aber es\nwar nicht so schlecht.\nGib nicht auf."
text.09d4: "Ich habe 500 Bits bekommen!"
text.0a22: "Das kannst du besser.\nDu solltest mehr arbeiten."
text.0a86: "Ich habe 1500 Bits bekommen!"
text.0ace: "Um die Insel zu retten,\nbrauchen wir deine Weisheit,\ndeinen Charakter und Mut."
text.0b60: "Wovon redest du?"
text.0b9e: "Ich wollte prüfen, ob du\nuns retten kannst."
text.0c18: "Im Kampf gut zu sein\nist wichtig."
text.0c68: "Neben Kraft braucht man\nauch Mut und Weisheit."
text.0cd4: "Haben wir bestanden?"
text.0d06: "Ja, ich helfe dir, so\nviel ich kann."
text.0d56: "Kommst du in die Stadt?\nWas machst du\nmit dem Laden?"
text.0dd2: "Ich mach später einen Laden\nauf. Dieser hat ausgedient."
text.0e42: "Monochromon zieht in\ndie Stadt!"
text.0e7e: "Ich habe 2000 Bits bekommen!"
