text.0d82: "{color:6}{tamer}{color:1} bringt dir vieles\nbei. Steigert Intelligenz\nund max. MP."
text.0df2: "Nochmal erklären\nStarten\nBeenden"
text.0e4c: "{color:7}Spielautomat {color:1}\nDrück {color:6}△ {color:1}\nfür drei gleiche Bilder."
text.0ece: "Hey, hier sind neue Infos."
text.0efe: "Mach mit Baby- oder\nTraining-Digimon immer\nwieder dasselbe Training."
text.0f88: "Dann passiert was Gutes."
text.0fd4: "Hier sind neue Infos."
text.0ffa: "Wenn du beim Bonusversuch\ngleiche Bilder schaffst,\nsteigen seine Werte stark."
text.10b0: "Ach, ich sollte dir ja\nwas über Techniken erzählen."
text.110e: "Techniken, die ein Gegner\neinsetzt, kannst du meistern,\nwenn du den Kampf gewinnst."
text.1198: "Aber nur Techniken, die\nman zu dem Zeitpunkt\nlernen kann."
text.1226: "Du kannst nicht alles lernen.\nDoch durch Kämpfe meisterst\ndu Techniken am schnellsten."
text.12d0: "Auch im Training geht das,\naber die Chancen sind gering."
text.134e: "Bist du klüger, besuch\n{color:6}{tamer}{color:1}s Unterricht. Da\nlernst du evtl. eine Technik."
text.13e6: "Die Chancen sind gering,\nalso erwarte nicht zu viel.\nTrainiere ausgewogen!"
text.148c: "Hi, ich bin Koromon.\nJiji hat mich gebeten, dir\nvom Training zu erzählen."
text.1506: "Willst du mich was fragen?"
text.153c: "Welches Training?\nWie trainiere ich?\nNein, nichts"
text.15b2: "Wenn du hier trainierst,\nkannst du die Werte deines\nDigimon steigern."
text.162c: "Training macht müde, aber\ndu holst mehr raus als\nin einem echten Kampf."
text.16c8: "Und manchmal, sehr selten,\nmeisterst du neue Techniken."
text.173a: "Mehr über Techniken erzähl\nich dir nächstes Mal."
text.17a0: "Hier gibt es sechs Stationen\nzum Trainieren, jede mit\neinem Schild daneben."
text.182a: "Drück {color:6}△ {color:1}\nvor dem Schild."
text.187c: "Lies die Schilder, dann\nweißt du, welche Werte\ndu steigern kannst."
text.18fe: "Je nach Spezialität deines\nDigimon steigen manche Werte\nmehr als andere."
text.19aa: "Sicher weißt du das aber\nerst, wenn du's versuchst."
text.1a0a: "Nach „Starten“\nwähl „Normal“ und\ntrainiere eine Stunde."
text.1a7a: "Beim Training kannst du mit\n{color:5}× {color:1}die Zeit\nvorspulen."
text.1ae6: "Ach ja, ich muss dir noch\nvom „Bonusversuch“ erzählen."
text.1b48: "Klappt der Bonusversuch,\nsteigen die Werte stark,\nsonst nur wenig."
text.1be4: "Probier's aus, dann siehst du."
text.1c24: "Bald hab ich wieder neue\nInfos für dich."
text.1d7c: "Ich war in der Stadt. Aber\ndie war mir zu städtisch,\nalso bin ich hergekommen."
text.1e10: "Ich hab die Geräte umgebaut.\nJetzt besser. Trainiere hart!"
