text.0082: "Du schon wieder! Raus hier!"
text.00c8: "Äh..."
text.00e0: "Du... du bist eine Plage!\nBist du jetzt zufrieden?!"
text.0154: "Du schon wieder! Raus hier,\nund zwar sofort!"
text.01ba: "Schön, euch zu sehen, Freunde.\nWenn ihr hier leben wollt,\nerlaube ich es euch."
text.0260: "Wir wollen hier leben\nWir wollen zurück"
text.02c6: "Hmmm, schön. Was?\nAber du bist analog,\ndu kannst hier nicht leben."
text.0356: "Wir müssen zusammenbleiben!"
text.038c: "Dann verschwinde mit ihm\nvon hier!"
text.03de: "Was? Was sagst du da?"
text.0422: "Er war früher kein Sukamon.\nKönig, bitte gib ihm seine\nalte Gestalt zurück!"
text.04c2: "Ist es nicht toll, dass\ner ein Sukamon wurde?"
text.0516: "Nein, gerade ist das gar\nnicht gut. Bitte."
text.0570: "Sukamon wird man nur,\nwenn man sich anstrengt."
text.05cc: "Er wurde ganz natürlich\nzu Sukamon, und\ndas ist das Problem."
text.0642: "Ihr seid ja unglaublich!"
text.06aa: "Wow! Danke, König!"
text.06e0: "Raus hier, aber sofort!"
text.072c: "Seid ihr wegen etwas\nhergekommen?"
text.0774: "Also..."
text.078a: "Wenn ihr eine Bitte habt,\nvergesst es. Denn ich bin\nKing of Sukamon!"
text.0810: "Ich kann ihn wohl nicht\nin die Stadt einladen."
text.0890: "Ich sammle selbst auch\nDigimon-Karten."
text.08e0: "Ich will so gern eine Karte\nvon King of Sukamon. Tauschst\ndu gegen meine Etemon-Karte?"
text.0986: "Tauschen\nNicht tauschen"
text.09ba: "Leider hab ich sie nicht."
text.0a02: "Wow, das stinkt! Ist das\neine Müllhalde?"
text.0a4c: "Gibt es so was etwa auch\nin der Digimon-Welt?"
text.0aca: "Schön, dass ihr da seid.\nNeue Freunde sind willkommen."
text.0b26: "Ist das eine Gemeinde\nvom Stamm der Sukamon?"
text.0b82: "Genau. Das ist ein Paradies\nfür den Stamm der Sukamon,\nes heißt Staubkönigreich."
text.0c20: "King of Sukamon ist auch hier."
text.0c62: "King of Sukamon...?"
text.0c90: "King of Sukamon ist toll!\nWer nicht auf ihn hört,\nwird digievolviert!"
text.0d32: "Heißt das, wir werden zu\netwas anderem als Sukamon?"
text.0d9e: "Heißt das, wir bekommen\nunsere alte Gestalt zurück?!"
text.0dfc: "Ja, unheimlich. Gruselig."
text.0e36: "Da hab ich was gelernt..."
text.0ea2: "Oh, Sukamon?!"
text.0ec4: "Hä? Kennst du mich etwa?"
text.0f00: "Na ja, irgendwie.\nMüssen wir Sukamon auch\nin die Stadt bringen?"
text.0f92: "Wow, das ist interessant!\nSo was hab ich noch\nnie gesehen!"
text.1014: "Meine Güte! Die Häufchen\nbewegen sich und reden!"
text.107c: "Redest du von mir?\nIch bin Sukamon...\nEin Mutanten-Digimon."
text.1100: "Du bist kein Häufchen?"
text.112a: "Irgendwie hast du recht,\ndenn wir bestehen aus\ndigitalem Müll."
text.11aa: "Sollen wir ihn auch in die\nStadt einladen? Wir sollten\nkeine Vorurteile haben."
text.1240: "Willst du etwa\nhier leben?"
text.1284: "Was? Darüber hab ich\nnie nachgedacht."
text.12ca: "Na ja, das ist ein Paradies\nnur für den Stamm der Sukamon.\nSonst darf hier keiner leben."
text.136a: "Dann könnt ihr nirgendwo\nanders leben?"
text.13ba: "Natürlich nicht!\nWas denkst du denn?"
text.1404: "Verstehe. Das hab\nich mir gedacht."
text.1446: "Na ja, leben kannst du\nhier zwar nicht, aber\numsehen darfst du dich."
text.14be: "Ach, nur umsehen. Okay."
text.14f2: "Ach, übrigens: Mach den\nKönig bloß nie wütend."
text.1552: "Sonst verwandelt dich seine\nDigievolutionstechnik in\netwas Erbärmliches."
text.1610: "Hey, du hast zu viele\nEtemon-Karten!\nLass das."
text.167c: "Oh, danke!"
text.16bc: "Hey, kommt ihr etwa aus ...\nwie heißt sie noch... Stadt?"
text.172e: "Das bleibt unter uns.\nIch bin ein bisschen\nneugierig."
text.17ae: "Irgendwann besuche ich\neuch dort mal."
text.17fe: "Hey Leute, kennt ihr die\nSpezialtechnik vom\nStamm der Sukamon?"
text.187e: "Wir saugen Häufchen vom Boden\nin unseren Körper und\nmachen Energie daraus!"
text.1916: "Hm? Das Staubkönigreich.\nFür dich ist das sicher\nnur eine Müllhalde."
text.19a4: "Aber vielleicht finden wir\nwas Nützliches. Da drüben\nlag so ein langer Stab."
text.1a4c: "Wow, das ist eine\n{color:6}Alte Angel{color:1}!"
text.1aba: " {color:5}Training: Müllversteck {color:1}"
text.1af6: "Starten\nErklären\nBeenden"
text.1b2e: "Normal\nBonusversuch\nBeenden"
text.1b6c: "Mentaltraining, indem du\ndich in dreckigen Müll legst.\nMax. MP steigen stark."
text.1c0e: "Nochmal erklären\nStarten\nBeenden"
text.1c68: " {color:7}Spielautomat {color:1}\nDrück {color:6}△ {color:1}\nfür drei gleiche Bilder."
