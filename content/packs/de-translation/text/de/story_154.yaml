text.003e: "Da ist jemand! Wer ist da?!"
text.00c4: "Hehe, ich mach den bösen\nComputer kaputt! Hehehe!"
text.0284: "Das ist er... Hey!\nHey, was machst du da?!"
text.02f0: "Jaa! Ich zerstöre!\nIch zerstöre alles.\nAlles Böse!"
text.04b2: "Oh nein, er ist verrückt.\nEr ist ein Ultra-Digimon,\naber wir müssen ihn stoppen!"
text.054c: "Hehehe,\nich zerstöre euch alle!"
text.06c4: "Uaargh! Meine Kraft schwindet."
text.0702: "Der Strom wird schwächer.\nBitten wir Andromon, das\nFabrikabwasser zu stoppen."
