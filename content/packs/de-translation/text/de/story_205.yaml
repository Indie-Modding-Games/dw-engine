text.0010: "Welchen Laden möchtest du?"
text.004c: "Klinik\nSchatzsucher\nWahrsager"
text.00aa: "Hier ist jetzt eine Klinik."
text.0100: "Ihm geht's nicht gut,\noder? Du musst auf seine\nGesundheit achten!"
text.018c: "Ich behandle ihn sofort.\nDie Gebühr ist ermäßigt\nauf dreihundert Bits."
text.0242: "Du hast nicht genug Bits?!\nGib mir, was du kannst. Spar\nfür schlechte Zeiten."
text.02f6: "Jetzt ist alles wieder gut.\nPass ab jetzt besser auf."
text.0364: "Er wirkt weder krank noch\nverletzt. Was brauchst du?"
text.03d0: "Untersuch ihn\nVerkauf mir Medizin\nNichts"
text.042c: "Gut, mal sehen, wie es\n{color:10}{partner}{color:1} geht."
text.048a: "Oh nein. Die Müdigkeit von\n{color:10}{partner}{color:1} ist gefährlich!\nEr muss sofort ausruhen!"
text.0540: "{color:10}{partner}{color:1} ist viel zu\nmüde. Er sollte ausruhen,\nbevor es zu spät ist."
text.05da: "{color:10}{partner}{color:1} wirkt etwas\nmüde. Er sollte sich nicht\nso überanstrengen."
text.0664: "{color:10}{partner}{color:1} ist fit, aber\nMüdigkeit kann allerlei\nSchlimmes auslösen. Vorsicht."
text.06fe: "Na, wie fühlt er sich?"
text.0742: "Seelisch ist {color:10}{partner}{color:1}\nvöllig entspannt. Er wird\nlange leben."
text.07da: "{color:10}{partner}{color:1} ist seelisch\nin Bestform. Das zeigt ein\ngesundes Leben."
text.0880: "{color:10}{partner}{color:1} wirkt sehr\nentspannt. Ist ihm etwas\nSchönes passiert?"
text.0918: "Ich glaube nicht, dass\n{color:10}{partner}{color:1} sehr gestresst ist.\nIch würde sagen, normal."
text.09be: "{color:10}{partner}{color:1} ist etwas gestresst.\nTrainier ihn sanfter."
text.0a40: "{color:10}{partner}{color:1} hat zu viel Stress.\nEr braucht etwas Spaß."
text.0aac: "{color:10}{partner}{color:1} hat viel zu viel\nStress und ist unglücklich.\nEr sollte sich schonen."
text.0b4e: "{color:10}{partner}{color:1} hat viel zu viel\nStress! Geht das so weiter,\nlebt er nicht lange!"
text.0be4: "Hmmm.... Mehr kann ich\nfür {color:10}{partner}{color:1} nicht tun."
text.0c40: "Brauchst du sonst\nnoch etwas?"
text.0c8e: "Untersuch ihn\nVerkauf mir Medizin\nNichts"
text.0cee: "Hmmm, er dürfte fit sein."
text.0d26: "Verband:  400 Bits\nMedizin: 1200 Bits\nNichts kaufen"
text.0dca: "Wenn es ihm nicht gut geht,\nkomm sofort zu mir."
text.0e50: "Du hast zu viele Sachen dabei."
text.0ea8: "Du hast nicht genug Bits.\nSo kann ich nichts verkaufen."
text.0f28: "Du hast zu viele Sachen dabei."
text.0f80: "Du hast nicht genug Bits.\nSo kann ich nichts verkaufen."
text.0fee: "Brauchst du sonst\nnoch etwas?"
text.103c: "Untersuch ihn\nVerkauf mir Medizin\nNichts"
text.109c: "Ich hab umgesattelt und bin\njetzt Schatzsucher."
text.1112: "Möchtest du eine Schatzsuche\nin Auftrag geben? Oder\nwillst du Infos?"
text.11ac: "Infos bitte\nKeine Infos nötig\nSchon gut"
text.121c: "Es gibt zwei Pläne. Sie sind\nverschieden lang und teuer."
text.128e: "Normal: 3 Tage, 1000 Bits\nSpezial: 10 Tage, 5000 Bits"
text.130a: "Mit dem Spezialplan ist\ndie Chance auf bessere\nSchätze höher."
text.139e: "Das wär's so weit.\nAlso, was möchtest du tun?"
text.13fe: "Nochmal erklären\nSchatz suchen\nNichts"
text.145a: "Wähl einen Plan!"
text.147e: "Normal: 3 Tage, 1000 Bits\nSpezial: 10 Tage, 5000 Bits\nAbbrechen"
text.1518: "Gut, dann tschüss."
text.1564: "Gut, das Ergebnis gibt's in\ndrei Tagen. Drück die Daumen!"
text.1602: "Gut, das Ergebnis gibt's in\ndrei Tagen. Drück die Daumen!"
text.1680: "Du hast nicht genug Bits.\nFür die Schatzsuche\nbrauche ich Geld."
text.1734: "{color:7}Schild {color:1}\nIch suche gerade Schätze.\nBitte warte ein Weilchen.\nGruß, Drimogemon."
text.17d6: "Weißt du was?\nWir haben einen Schatz!"
text.1976: "Mach Platz in deinem Gepäck!"
text.19aa: "Ich habe {color:6}{item:pstat=110}{color:1} bekommen!"
text.1af2: "Danke für deinen Auftrag!"
