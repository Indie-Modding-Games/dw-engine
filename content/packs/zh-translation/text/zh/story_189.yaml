text.00a6: "你带了能\n治伤的东西吗？"
text.0104: "等一下。让我看看……"
text.014c: "我的翅膀好痛！"
text.0170: "怎么了？"
text.0194: "我的翅膀受伤了。你有\n能治伤的东西吗？"
text.020a: "伤得好重。撑住。\n我该怎么办？"
text.027c: "我现在什么都没有。"
text.02f8: "不行。这样可不行！"
text.0346: "好多了。谢谢。"
text.0386: "你已经能飞了吗？"
text.03b6: "我想我飞不了太远。"
text.03f6: "城里有家诊所。\n你应该去那里。\n离这里不远。"
text.048a: "我听说过那座城镇。\n比我想的还要大。"
text.04f8: "去城里好好休息吧。"
text.0534: "谢谢。也许\n哪天我能帮上你。"
text.05c2: "Unimon加入了城镇！"
text.0602: "我去拿能治伤的东西来。\n等我一下。"
text.0678: "谢谢。请快点！"
