text.007c: "我要赢！"
text.00ae: "你永远赢不了我！"
text.00ee: "嘿嘿！真是对不起啦！"
text.012c: "你在无视我吗？"
text.017a: "想从这里过去，\n就得接受我的挑战。"
text.021c: "我一时大意了，\n不过二对一可不公平。"
text.028a: "也许吧\n别输不起嘛"
text.02ea: "只要是公平的较量，\n我从没输给过任何人。"
text.034e: "我们一对一打吧。明天\n4点再来。\n只让数码兽来打。"
text.03fe: "好的\n不了"
text.0436: "那就说定了。\n明天见！"
text.04e6: "你来了，很好。\n今天我们公平地打一场！"
text.0550: "你来晚了，不过正好\n让我养好了伤。\n现在开始吧。"
text.05f2: "我就在旁边看着。开始！"
text.0630: "上吧，{color:10}{partner}{color:1}！"
text.067e: "你真厉害！你们是谁？"
text.06b8: "我们在四处探索，\n想把岛从危机中拯救出来。"
text.0734: "什么？"
text.0746: "{color:6}{tamer}{color:1}拼命地\n想说服他！"
text.079a: "我会帮你们。不过，\n我得先看看那座城。"
text.0844: "Garurumon加入了城镇！"
