text.0042: "一定就是这个了！\n不管怎么看，\n都只是块普通的陨石。"
text.00d8: "敲开看看\n别管它"
text.0130: "嗯……"
text.0146: "在我看来，这只是块\n普通的老陨石。"
text.019c: "{color:7}???mon {color:1}\n真抱歉，我长得\n又普通又老。"
text.0202: "哇！"
text.0212: "你是数码兽？！\n你是谁？"
text.0264: "{color:7}???mon {color:1}\n我叫Meteormon。"
text.02aa: "你知道这座岛的\n危机吗？"
text.02fe: "我什么都不知道！"
text.0324: "什么都不知道？！你确定\n没有隐瞒什么吗？"
text.039c: "真没礼貌！好吧！\n我们来打一场，\n看看谁才是对的！"
text.041e: "好！放马过来吧。"
text.0488: "我认输。你太强了。"
text.04c8: "关于岛上的危机，\n你知道什么就告诉我。"
text.0542: "我才刚出生，\n什么都不知道啊！"
text.059e: "什么？！"
text.05ba: "陨石一族在天空中\n诞生，然后\n落到地面上。"
text.064a: "然后我们会睡很长时间。\n其实我本来应该\n睡得更久的，可是……"
text.06fa: "这里的时间过得快多了。"
text.0738: "大概吧。总之，我要去\n这座岛上看看。\n回头见！{stop}"
text.07f4: "我们没找到任何线索。\n赶快离开吧。"
text.086a: "我们看过了，\n还是什么都看不出来。\n敲开它吧！"
text.08f8: "{color:7}???mon {color:1}\n你以为你在干什么？\n你这个鲁莽的笨蛋！"
text.0998: "咦？你是谁？！"
text.09c4: "我是谁？你又是谁？！"
text.0a70: "得到了{color:4}次元钥匙扣{color:1}。\n可以携带20个道具了！"
text.0b20: "得到了{color:4}次元钥匙扣{color:1}。\n可以携带30个道具了！"
