text.0060: "我要赢！"
text.0098: "好，来吧，小家伙！"
text.00d4: "接下来会怎么样呢？"
text.0122: "怎么可能行得通。"
text.0168: "我饿了。"
text.0186: "给它食物\n不给食物"
text.01de: "我现在没有食物。"
text.0266: "哎呀，这个不能给你。"
text.02b8: "真好吃……"
text.02de: "来打一场吧！"
text.032e: "这下糟了。\n我该怎么办？"
text.0380: "跟我去城里，\n干活抵你吃掉的东西！"
text.03e6: "好吧，我去。我是\n昆虫型数码兽，\n叫Kunemon。请多关照。"
text.04c0: "Kunemon加入了城镇！"
text.0508: "下次带点来吧。"
