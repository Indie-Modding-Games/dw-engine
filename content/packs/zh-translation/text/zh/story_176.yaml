text.03b8: "欢迎光临我的店。"
text.03e4: "你看，{color:6}{tamer}{color:1}。这是\n我的店。我要卖\n各种各样的道具。"
text.046c: "很快会有更多货的。\n不过我需要能来\n帮忙的数码兽。"
text.052c: "我会买卖道具。\n需要的时候\n就来找我吧。"
text.05c6: "现在货品不多，\n但要是找到帮手，\n也许能做得更好。"
text.069c: "我决定\n开一家道具店。\n希望你常来哦。"
text.0726: "现在货还不够齐全，\n不过很快就会扩充的。\n请暂时多多包涵。"
text.080a: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}，\n我开了道具店。\n我想生意会很好！"
text.087c: "城里的数码兽越多，\n我们的货就越多。"
text.0920: "{color:6}{tamer}{color:1}，我刚开始\n帮忙打理这家店。\n请多买点东西哦！"
text.09ea: "欢迎光临。从今天起\n我就在这里工作了。\n请常来哦。"
text.0ab4: "我决定来帮忙\n打理这家店。\n随时欢迎光临。"
text.0b68: "哦，{color:6}{tamer}{color:1}。这里是\n最适合我的地方。\n我会在这里努力工作。"
text.0e56: "嗨，我每天都忙着\n打理这家店……才怪！"
text.0ec2: "我有点懒，\n不常待在店里。\n不过我有好东西哦。"
text.0f5e: "好耶！“训练手册”！\n有了它，你的训练\n效果会更好！"
text.0fe6: "这可是很珍贵的。\n卖你50000 Bits。\n不买你会后悔的。"
text.1094: "购买\n不买"
text.10d6: "你的Bits不够。"
text.1126: "嗯，你身上\n带的东西太多了。"
text.1186: "得到了\n{color:6}训练手册{color:1}！"
text.11c2: "我可不会给你打折。"
text.123a: "你是不是因为\n东西带太多\n而烦恼？"
text.12b2: "有个地方能找到一种\n钥匙扣，能把你的包\n和另一个次元连起来。"
text.135a: "它能增加\n你能携带的道具数量。"
text.13be: "就算是去过的地方，\n也再找找看吧。"
text.1432: "我来告诉你\n买道具的秘诀。"
text.1488: "在想了解的道具上\n按Start键，\n就能看到说明！"
text.1514: "用{color:6}△{color:1}选择道具，\n想买很多的话\n就按{color:4}□{color:1}。"
text.159e: "按住{color:10}○{color:1}的同时\n按方向键上或下，\n可以一次加减10个。"
text.1636: "对了，刚进化完\n就试着买点东西吧。\n应该会有好事发生！"
