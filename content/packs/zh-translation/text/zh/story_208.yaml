text.002e: "贝壳报 第8期\n外星数码兽现身：\n我们找到了UFO。\n那个生物露出了身体，\n还说着听不懂的话。\n它真的是外星人吗？\n它还会再出现吗？"
text.018a: "上一页\n结束"
text.01bc: "贝壳报 第7期\nMyotismon否认引退：\n在接受采访时，\n他否认了传闻。\n他依然在努力奋斗，\n他深爱着他的粉丝。\n他还宣布，\n他的徒弟SkullGreymon\n即将出道。"
text.0368: "上一页\n下一页\n结束"
text.03d0: "贝壳报 第6期\nMyotismon要引退了？：\n据传，人气高、实力强的\nMyotismon即将引退。\n竞技场里已经没人\n见过他了。他的生涯\n已到尽头，他太老了。"
text.0544: "上一页\n下一页\n结束"
text.05b4: "贝壳报 第5期\n隐藏的宝藏：\n齿轮草原的一家好店。\n这家店每年只在\n1日到15日营业。\n店长对他的稀有道具\n非常自豪。"
text.0710: "上一页\n下一页\n结束"
text.0794: "贝壳报 第4期\n传说中的数码兽？：\n据传冰冻大地有一只\n耐寒的数码兽。\nM先生曾被这只怪物救过，\n它看起来像个大雪球。\n怕冷的数码兽们，\n请多加小心！"
text.094e: "上一页\n下一页\n结束"
text.09aa: "贝壳报 第3期\n湖之守护者？：\n龙眼湖里\n有一位湖之守护者。\n这个像数码兽的生物\n是被某人召唤来的。\n这位守护者\n能实现愿望吗？"
text.0b10: "上一页\n下一页\n结束"
text.0b80: "贝壳报 第2期\n发现UFO！：\n有报告说UFO\n出现在全景山附近。\n那个UFO像个银色盘子，\n底部会发出光。\n是外星人吗？\n后续报道敬请期待。"
text.0cf8: "上一页\n下一页\n结束"
text.0d48: "贝壳报 第1期\n盗贼消失了！：\n{color:6}{tamer}{color:1}找到了\nOgremon率领的盗贼巢穴。\n然而Ogremon仍然\n逍遥法外，\n大家依旧很担心。"
text.0e70: "下一页\n结束"
