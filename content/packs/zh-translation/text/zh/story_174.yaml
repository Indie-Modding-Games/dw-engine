text.004c: "欢迎光临我的餐厅。"
text.0084: "我决定当这家餐厅的\n经理兼主厨了。"
text.00fc: "尽情享用我的\n火焰料理吧。"
text.0178: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}，要不要\n尝尝我的家常菜？"
text.01ce: "和你们得到的道具不同，\n这可是真正的料理。\n是我的独门绝活。"
text.0274: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}！\n我决定靠做菜谋生了。\n我的手艺可好了！"
text.02f2: "有空就来我的餐厅\n放松一下，吃顿饭吧。"
text.037a: "C???NC?? , C???MC?? .\n我的餐厅终于开张了！"
text.03e6: "尝尝冰冻甜点吧！\n这是我的拿手菜。"
text.045c: "{color:6}{tamer}{color:1}，我决定\n在这家餐厅\n当厨师了。"
text.04d0: "来这里吃顿热饭吧。"
text.051e: "好耶！\n{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}，\n我现在是厨师啦！"
text.0566: "我做的菜比你在\n别处能吃到的好多了。\n尝尝看吧！"
text.061a: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}！\n我决定把一生\n献给料理！"
text.067e: "我特制的家常菜\n非常健康！我做菜的时候\n就来找我吧。"
text.0734: "嘿！ {color:6}{tamer}{color:1}，{color:10}{partner}{color:1}！"
text.0758: "我决定来这家\n餐厅帮忙了。\n他们让我做甜点。"
text.07d6: "我对我做的甜点\n非常自豪。\n一定要尝尝哦！"
