text.004c: " {color:6}{tamer}{color:1}和{color:10}{partner}{color:1}，\n对吧？谢谢你们\n来到音量村！"
text.00ca: "我们对Otamamon做的事，\n真是抱歉。"
text.0122: "没关系。"
text.0148: "咦？"
text.0168: "我很感激。我听说\n你一直在努力\n拯救这座岛。"
text.0200: "是吗？"
text.0218: "我一直想帮你。\n你去过这里北边的\n迷雾森林吗？"
text.02ca: "还没有。"
text.02ee: "去过。"
text.02fe: "那里总是有雾。\n你大概会很难\n在里面行动。"
text.0390: "不过你应该去见见\n森林的首领\nCherrymon。"
text.041e: "Cherrymon？我从没听说过\n这种数码兽。"
text.0482: "迷雾森林的雾\n是Cherrymon制造的。"
text.04d6: "它制造雾，是为了\n保护森林不受危险。"
text.0548: "可是这让我们很头疼。"
text.0594: "我觉得Cherrymon知道\n岛上发生的问题\n是什么原因。"
text.062e: "值得穿过雾\n去见它一面。"
text.0688: "要是能把雾\n想想办法就好了。"
text.06da: "能把雾散掉的，\n只有Cherrymon。"
text.074a: "不过有办法穿过去。\n我给你施个法术。"
text.07be: "会怎么样？"
text.07ee: "就算有雾，\n你也能看清道路。"
text.0860: "哦，太好了！"
text.0888: "好，那我开始了。"
text.08b8: "呱呱，呱呱！"
text.08f6: "好。这样就完美了。\n现在去迷雾森林吧。"
text.0974: "我见到它了。\n雾已经散了。"
text.09ba: "哇，太厉害了！那么，\n我能帮你做些什么呢？"
text.0a2a: "好，这个送给你。"
text.0a6c: "得到了\n{color:6}数码鲈鱼{color:1}！"
text.0abc: "扔掉别的东西吧。"
text.0b04: "这可是很稀有的东西。\n会对你有用的。"
text.0b72: "谢谢。那么Shogun，\n你要不要来城里？"
text.0bde: "我是Geko沼泽\n一百只Gekomon的首领。\n抱歉，我不能跟你走。"
text.0c84: "不过作为补偿，\n我会在这里尽力帮你。\n随时欢迎你来。"
text.0d58: "看来你遇到麻烦了。\n是那件布偶装的事吧？"
text.0dce: "你知道？"
text.0dfa: "别小看我。Numemon\n会穿得上的。"
text.0e68: "吃惊吗？不只这样，\n它一穿上……你不会相信……\n好了，你试试看吧。"
text.0f4e: "对了，我要把你道具里的\n{color:6}神奇钓竿 {color:1}\n拿走了。"
text.0fe0: "那是特殊道具。"
text.1022: "祝你好运！"
text.1052: "只能在龙眼湖\n钓鱼。"
text.10a6: "退后，退后！"
text.10da: "Shogun在收集\n稀有道具。它以前\n是收集道具的。"
text.1154: "不过现在它迷上了\n数码兽卡片。"
text.11aa: "只要带来稀有卡片，\n它就会给你\n功绩点。"
text.1222: "你可以收集卡片\n和功绩点，\n拿来换道具。{stop}{stop}"
text.12bc: "这个……不，没什么。呱。"
text.12fe: "打扰一下……我想去\n城里。呱！"
text.1362: "好啊，可是发生什么事了？"
text.1396: "我想在竞技场战斗。\n好像我们\nGekomon一族{stop}"
text.142e: "被看成是\n乡下数码兽。呱。"
text.1494: "没错，我们是乡下来的，\n可我们也有自尊！{stop}"
text.1522: "我明白你的心情。\n那就试试吧。加油！"
text.1582: "Gekomon加入了竞技场！"
