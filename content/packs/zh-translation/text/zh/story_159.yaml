text.0082: "又是你！滚出去！"
text.00c8: "呃……"
text.00e0: "你……你真是个讨厌鬼！\n这下你满意了吧？！"
text.0154: "又是你！马上\n给我滚出去！"
text.01ba: "欢迎你们，我的朋友。\n如果想住在这里，\n我准许你们。"
text.0260: "我们想住在这里\n我们想回去"
text.02c6: "嗯，很好。什么？\n可你是模拟的，\n不能住在这里。"
text.0356: "我们必须在一起！"
text.038c: "那你就和他\n一起滚出去！"
text.03de: "什么？你在说什么？"
text.0422: "他本来不是Sukamon。\n国王，求你把他\n变回原来的样子吧！"
text.04c2: "他变成了Sukamon，\n这不是很棒吗？"
text.0516: "不，现在一点也不好。\n求求你了。"
text.0570: "想成为Sukamon，\n只有努力这一条路。"
text.05cc: "他是自然而然\n变成Sukamon的，\n问题就在这里。"
text.0642: "你们真是不可理喻！"
text.06aa: "哇！国王，谢谢你！"
text.06e0: "马上给我滚出去！"
text.072c: "你们来这里\n有什么事吗？"
text.0774: "这个嘛……"
text.078a: "如果是有事相求，\n那就算了吧。因为\n我是Sukamon之王！"
text.0810: "看来我没办法\n邀请他去城里了。"
text.0890: "我自己也在收集\n数码兽卡片。"
text.08e0: "我很想要一张Sukamon之王\n卡片。能用我的Etemon\n卡片跟你换吗？"
text.0986: "交换\n不交换"
text.09ba: "抱歉，我没有那张卡。"
text.0a02: "哇，好臭！这里是\n垃圾场吗？"
text.0a4c: "没想到数码兽世界\n也有这种地方。"
text.0aca: "很高兴你们来了。\n我们欢迎新朋友。"
text.0b26: "这里是Sukamon一族的\n聚居地吗？"
text.0b82: "没错。这里是Sukamon一族的\n乐园，名叫\n尘埃王国。"
text.0c20: "Sukamon之王也住在这里。"
text.0c62: "Sukamon之王……？"
text.0c90: "Sukamon之王可厉害了！\n要是不听他的话，\n就会被他进化掉！"
text.0d32: "你是说我们会变成\nSukamon以外的东西？"
text.0d9e: "那不就是变回\n我们原来的样子吗？！"
text.0dfc: "是啊，太可怕了。毛骨悚然。"
text.0e36: "我知道了一件有用的事……"
text.0ea2: "啊，Sukamon？！"
text.0ec4: "咦？你认识我？"
text.0f00: "嗯，算是吧。\n我们也要把Sukamon\n带到城里去吗？"
text.0f92: "哇，真有意思！\n我从来没见过\n这样的东西！"
text.1014: "我的天啊！便便\n会动还会说话！"
text.107c: "你是在说我吗？\n我是Sukamon……\n是突变型数码兽。"
text.1100: "你不是便便？"
text.112a: "某种意义上你说得对，\n因为我们是由\n数码废弃物构成的。"
text.11aa: "要不要也请他\n去城里？我们\n不该有偏见。"
text.1240: "你打算\n住在这里吗？"
text.1284: "什么？我从来\n没想过。"
text.12ca: "这个嘛，这里是只属于\nSukamon一族的乐园。\n别人不能住在这里。"
text.136a: "那你们不能\n住在别的地方吗？"
text.13ba: "当然不能！\n你以为呢？"
text.1404: "原来如此。\n跟我想的一样。"
text.1446: "嗯，虽然你\n不能住在这里，\n但可以四处看看。"
text.14be: "哦，只是看看啊。好吧。"
text.14f2: "对了，千万\n别惹国王生气。"
text.1552: "国王会用他的进化招式\n把你变成\n很惨的东西。"
text.1610: "喂，你的Etemon卡片\n太多了！\n别换了。"
text.167c: "哦，谢谢你！"
text.16bc: "喂，你们是从……\n那个叫什么来着……城里来的？"
text.172e: "这话只在你我之间说。\n我有那么一点\n感兴趣。"
text.17ae: "总有一天\n我会去那里找你们。"
text.17fe: "喂，你们知道\nSukamon一族的\n独门招式吗？"
text.187e: "我们会把地上的便便\n吸进身体里，\n转化成能量！"
text.1916: "咦？这里是尘埃王国。\n我知道对你来说\n这只是个垃圾场。"
text.19a4: "不过说不定能找到有用的\n东西。我在那边看到\n一根长长的棍子。"
text.1a4c: "哇，是\n{color:6}旧钓竿{color:1}！"
text.1aba: " {color:5}训练：藏身垃圾堆 {color:1}"
text.1af6: "开始\n说明\n退出"
text.1b2e: "普通\n奖励挑战\n退出"
text.1b6c: "把自己埋进脏垃圾里\n进行精神修炼。\n能大幅提升MP上限。"
text.1c0e: "再听一次说明\n开始\n退出"
text.1c68: " {color:7}Slot Game {color:1}\n用{color:6}△ {color:1}\n对齐三个图案。"
