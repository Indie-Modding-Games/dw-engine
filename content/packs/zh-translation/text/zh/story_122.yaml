text.0020: "我挡着你了吗？"
text.0056: "你救了我！"
text.0078: "原来是你啊。"
text.009c: "正好。"
text.00cc: "什么？"
text.00e2: "我正要去你们城里，\n好好发挥\n我的才能！"
text.0160: "什么样的才能？"
text.0190: "哎呀，你不认识我吗？\n我在数码兽之间可是\n出了名的万事通！"
text.0224: "真的吗？\n我从没听说过你。"
text.026c: "我准备好去城里了。"
text.02b4: "她真的能\n派上用场吗？"
text.0302: "再见啦！"
text.0350: "Shellmon加入了城镇！"
