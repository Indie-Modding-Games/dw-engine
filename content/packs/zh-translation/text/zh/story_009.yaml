text.004c: "自动贩卖机"
text.007a: "天哪，好贵啊！"
text.00b6: "肉: 300 Bits\n数码菇: 600 Bits\n不买"
text.015e: "我的钱不够。"
text.01b2: "我的钱不够。"
text.01f6: "掉出了{color:6}肉{color:1}！"
text.023e: "哎呀，东西太多了。"
text.0286: "掉出了\n{color:6}数码菇{color:1}！"
text.02ec: "哎呀，东西太多了。"
text.0338: "钓鱼说明：\n先弄到一根“钓竿”，\n子菜单{color:5}× {color:1}里就会有\n“钓鱼”图标，选择它。\n用{color:6}△ {color:1}挂鱼饵，\n从身上的食物中选一样。"
text.0480: "接着用左右键改变方向，\n按住{color:6}△ {color:1}把钓竿举过头顶，\n再按{color:6}△ {color:1}抛竿。\n等待浮漂动起来。\n浮漂一动，就是鱼咬饵了。\n用{color:6}△ {color:1}收竿。"
text.05f8: "注意看左上方的计量条。\n在计量条满之前松开{color:6}△ {color:1}，\n不然鱼线会断，要小心。\n只要把浮漂拉到\n足够靠近自己的地方，\n就钓到鱼了。"
text.077a: "如果鱼影上出现“X”，\n就表示用现在的鱼饵\n钓不到这条鱼。"
