text.0084: "喂，你就是那个\n在建设城镇的人？"
text.00d6: "是的。"
text.00ea: "呃，你能遇见我\n运气真不错。"
text.0132: "别看我这样，我可是\n完全体数码兽。你要是\n赢了我，我就帮你。"
text.01d6: "好，我接受\n不了，谢谢"
text.0258: "哇，我输了！好吧，\n我们城里见。"
text.02f0: "Piximon加入了城镇！"
text.033a: "哎呀，真是个胆小鬼！\n下次再见吧！"
text.03c0: "哦，小姐！"
text.03f0: "嘿，朋友，最近怎么样？"
text.0430: "呜奇，呜奇！"
text.0460: "嗯？"
