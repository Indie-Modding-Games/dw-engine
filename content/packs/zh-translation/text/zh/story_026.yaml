text.0076: "哦，太感谢了！"
text.00a6: "什么？想打架吗？"
text.00f4: "哦，多谢啦！"
text.0120: "别管了！"
text.0154: "别太勉强自己！"
text.0186: "来打吧，小鬼！"
text.01c0: "我认输！"
text.01de: "老大不见了。"
text.0262: "喂，你们要是想\n从这里过去，就把\n东西全部留下！{stop}"
text.02ec: "好久不见。"
text.0316: "嗯？又是你们！"
text.0346: "这是我的台词！\n找到你可真容易。\n准备好认输了吗？"
text.03c6: "认输？想得美！\n让你见识一下\n我认真起来的厉害！"
text.0444: "我们来个\n彻底的了断吧！"
text.04de: "为什么……我就是赢不了？"
text.0520: "怎么了？\n你不逃跑吗？"
text.0578: "我太累了。"
text.059c: "……"
text.05aa: "我以为这座岛已经完了，\n所以才当了强盗，\n想干什么就干什么。"
text.0654: "你知道这座岛\n陷入危机了吗？"
text.06aa: "知道，然后你就出现了。\n我想现在才开始帮你\n也太蠢了。"
text.0742: "我不这么觉得。\n来城里吧。"
text.0794: "不，我不能去。而且我想\n没有人会原谅\n我做过的事。"
text.083e: "哎呀，别废话了，\n跟我走就是了！"
text.089c: "你能派上用场的！\n每个人都有\n自己的长处！"
text.090c: "！！！"
text.0922: "这座岛还有救吗？\n你会为了我们\n拯救它的，对吧？！"
text.09ba: "当然！你知道\n城在哪里吧？"
text.0a1c: "哦哦哦哦！\n我这就去！"
text.0a84: "Ogremon加入了城镇！"
text.0ad6: "哎呀！\n出口不在这边！"
text.0b32: "糟了！我得把土箱\n还给Drimogemon！"
text.0be6: "哎呀！出口不在这边！"
text.0c42: "糟了！我得把土箱\n还给Drimogemon！"
