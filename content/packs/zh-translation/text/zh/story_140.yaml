text.00b2: "怎么了？！"
text.00e2: "哦，欢迎回来，Hagurumon！"
text.0122: "Hagurumon？！"
text.0168: "这是怎么回事？！"
text.01d8: "{color:7}Toys {color:1}\n这是一个古老的故事。\n有个坏人从遥远的地方\n来到了这座岛。"
text.0280: "{color:7}Toys {color:1}\n坏人对数码兽们说：\n这座岛是我们的。"
text.030a: "{color:7}Toys {color:1}\n数码兽们回答：\n才不是。这座岛\n是属于大家的。"
text.03b8: "{color:7}Toys {color:1}\n数码兽们团结起来\n挑战坏人，\n坏人得到了教训。"
text.0494: "{color:7}Toys {color:1}\n可是坏人说：\n等着瞧，我们还会回来的。\n……然后就消失了。"
text.0554: "{color:7}Toys {color:1}\n这是一个古老的故事。"
text.05b0: "嗯——好开心啊……\n哦，等一下。"
text.05fc: "歌里的那个故事，\n是这座岛上\n古老的传说吧？"
text.0684: "就是数码兽们\n打败坏人的事……"
text.06e0: "嗯——故事里的坏人\n到底是谁呢？"
text.0750: "谢谢你帮了我。\n这是我的谢礼。"
text.07cc: "Monzaemon的\n布偶加入了城镇！"
text.0850: "等等，WaruMonzaemon\n是不是掉了什么东西？"
text.08be: "祝你好运！\n就在隔壁的房子！"
text.092a: "…………"
text.09cc: "啊，Monzaemon！\n你活着回来了！"
text.0a16: "哇，那是什么？"
text.0a3e: "快去打WaruMonzaemon！\n大家快点\n行动！快，快！"
text.0ace: "等……等等！它不是\n你们认识的那个Monzaemon。"
text.0b38: "咦？什么意思？可是\n它是Monzaemon没错吧？"
text.0bb2: "是啊，它确实\n是Monzaemon。"
text.0c0a: "有个叫WaruMonzaemon的坏蛋\n抓走了我的朋友们。"
text.0c7a: "我觉得能打败它的\n只有Monzaemon了！"
text.0cec: "嗯，那我们得找到\n那个坏蛋。它在哪里？"
text.0d5a: "它就在隔壁。\n我来解开门上的封印。"
text.0dc2: "所以拜托你去看看\n能做些什么。"
text.0e14: "我明白了。好，\n我来帮你！"
text.0e60: "谢谢！"
text.0e88: "谢谢！"
text.0eb0: "谢谢！"
