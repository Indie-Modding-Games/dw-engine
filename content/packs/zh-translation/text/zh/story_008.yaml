text.004e: "钻头隧道"
text.0084: "普通\n恶鬼模式"
text.00ec: "那个混蛋！真没礼貌！"
text.012e: "嗯？"
text.015a: "{color:7}Market manager {color:1}\n没想到过个隧道\n还要交钱！"
text.01f6: "{color:7}Market manager {color:1}\n喂，你不就是……没错！\n快想想办法！"
text.026c: "里面的Drimogemon\n怎么样了？"
text.02b0: "{color:7}Market manager {color:1}\n我不知道。"
text.02f6: "希望他们没事。\n好，我去了！"
text.0362: "{color:7}Market manager {color:1}\n快想想办法！"
text.03f8: "隧道里已经没什么了……\n我们要穿过去\n还是怎样？"
text.047e: "穿过去吧！\n还是算了"
