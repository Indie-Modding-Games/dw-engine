text.0058: "喂！"
text.0076: "哈啊啊！"
text.0098: "哇！"
text.00bc: "东：升降机\n西：危险！！\n小心悬崖。"
text.012e: "恶鬼模式：开\n恶鬼模式：关"
text.018a: "小心塌方！"
text.01f0: "听说这条路上\n经常有强盗出没。"
text.025e: "好，我们走吧，{color:10}{partner}{color:1}。"
text.02b6: "哟吼！"
text.02d2: "哈哈哈！"
text.02ec: "呀吼！"
text.034a: "乖乖投降，把东西留下，\n不然你会后悔的！"
text.03c6: "投降吧！"
text.03e2: "什么？！你……"
text.0404: "怎么可能！"
text.0424: "老大，怎么办？"
text.0458: "别慌！我们更强，\n人也更多！\n给我上！"
text.0530: "总有一天我会报仇的！"
text.0570: "看它们跑的！\n暂时不会回来了。"
