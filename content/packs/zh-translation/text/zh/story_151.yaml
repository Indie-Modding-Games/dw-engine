text.0026: "这里一切正常。\n祝你好运。"
text.0078: "我也要出一份力。只要有空，\n我就会在这里和城里\n之间来回跑。"
text.0128: "Andromon加入了城镇！"
text.0176: "数据修复完成了。\n现在来读取数据吧。"
text.01e6: "拜托了。"
text.0200: "一百年前，\n模拟人类出现在了\n数码兽岛上。"
text.0286: "模拟人类和岛上原有的\n数码兽展开了激烈的战斗。"
text.02f0: "经过十年的战斗，\n模拟人类战败，\n从此消失了。"
text.038c: "在之后的十年里，\n岛的面积不可思议地\n扩大了将近一倍。"
text.0438: "人类和数码兽打过仗？"
text.0476: "对不起。我们能恢复的\n数据只有这些了。"
text.04e6: "别在意。这可是\n非常重要的情报。\n我现在知道得多多了。"
text.0582: "是吗？"
text.05ae: "这些人类大概就是\n在岛上制造混乱和\n麻烦的家伙吧。"
text.065e: "人类能活\n一百年吗？"
text.06aa: "看来在这个世界里，\n人类的时间过得很慢。"
text.071a: "难怪我在这里\n不用吃饭也不用睡觉。"
text.078a: "一百年可是很长的\n时间。那些家伙\n一定很难对付。"
text.081c: "你觉得他们\n藏在什么地方吗？"
text.0872: "我会找到他们，\n想办法解决的。"
text.08b8: "我终于知道我为什么在这里了。\n因为我是人类，\n所以我得去对付他们。"
text.095e: "真的非常抱歉。我们会\n暂时关闭工厂。"
text.09d6: "现在出了这么多麻烦，\n谁也说不准会发生什么。\n这不是你们的错。"
text.0a8a: "我觉得有人在\n操纵Giromon。"
text.0aea: "电脑被破坏了，\n污水开始泄漏出来。"
text.0b62: "那些污水让数码兽\n发了疯。我不觉得\n这是巧合。"
text.0bee: "这些电脑里\n有很关键的东西。"
text.0c46: "现在说可能太晚了，\n但我觉得有人\n想对我们下手。"
text.0cc8: "什么？！"
text.0cdc: "我想这些电脑里\n曾经有关于\n这座岛过去的数据。"
text.0d78: "可是因为Giromon暴走，\n那些数据都被毁了。"
text.0dec: "你从来没看过那些数据？"
text.0e2a: "没有，不过也许能\n修复一部分。我会\n试着把数据连接起来。"
text.0eca: "原来如此，谢谢你。\n需要多长时间？"
text.0f22: "要花一段时间。我会\n重新打开镇子的入口，\n你过阵子再来吧。"
text.0fb2: "谢谢。我会再来的。"
text.0ff6: "数据修复\n完成了吗？"
text.1044: "还要再花点时间。\n你过阵子再来吧。"
text.10a2: "好，我会再来的。"
text.10ea: "喂，喂！"
text.1104: "我必须向你道歉。"
text.113c: "那个以后再说，你得马上\n让工厂的机器停下来！"
text.11ba: "好的，我这就去。"
text.11ee: "工厂的运转\n刚刚停止了。"
text.1246: "很好，我去检查下水道。\n回头见，伙计。"
text.12b2: "我必须道歉。"
text.12dc: "现在可没时间\n说那个！"
text.133e: "我们的电脑是完美的。"
text.1376: "工厂真的安全吗？\n我们现在能做什么？"
text.13e8: "好，得想办法对付\n那些守卫。我们\n没有别的办法了！"
text.1482: "你是怎么进到镇里来的？"
text.14ca: "如果你在这里没事，\n就马上离开！"
text.1546: "那个以后再说。\n我现在得去\n检查工厂。"
text.15cc: "这可是生死攸关的\n事情。快答应我！"
text.163e: "我不太明白\n你想做什么。\n我不能答应你。"
text.16e4: "有数码兽因为工厂的\n污水，快要\n消失了！"
text.178e: "工厂的污水？不可能！\n污水净化系统\n运转得很正常。"
text.182a: "不检查一下，\n你怎么知道它运转正常？！"
text.18a6: "我们的电脑是完美的。一旦\n出现紧急情况，网络守护者\n就会关闭系统。"
text.1952: "你是说网络守护者\n永远都会\n正常运作？"
text.19de: "网络守护者是\n完全体数码兽\nGiromon的别名。"
text.1a68: "他的判断力和能力\n都是完美的。"
text.1ac2: "他是数码兽？！糟了，\n这下麻烦更大了。\n求你了，答应我吧！"
text.1b7c: "走开！马上！"
text.1ba2: "唉……可恶！"
