text.0038: "哦，{color:6}{tamer}{color:1}和{color:10}{partner}{color:1}，\n你们来了。"
text.0078: "我是送货员。\n什么都能送。"
text.00cc: "你们能搬运的\n只有自己吧？"
text.0132: "不如我来载你们吧？\n好主意吧，嗯？"
text.0190: "无论何时何地，\n我都能送你们去。\n当然，是要收费的。"
text.0222: "嘿，{color:6}{tamer}{color:1}。"
text.023c: "我有时会回\n齿轮草原巡逻。"
text.029e: "听说齿轮草原的海滩上\n有几家店。\n你看到了吗？"
