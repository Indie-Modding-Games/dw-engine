text.0022: "{color:7}Poyomon {color:1}\nPoyomon。我叫Poyomon。"
text.0084: "{color:7}Poyomon {color:1}\n我来讲讲进化吧。\n嗯……是关于成熟期\n之后的下一个阶段。"
text.014e: "{color:7}Poyomon {color:1}\n那就是完全体数码兽。\n不过成熟期数码兽\n不一定都能进化。"
text.0214: "{color:7}Poyomon {color:1}\n进化的条件很苛刻，\n但成为完全体后，\n寿命就会延长。"
text.02d8: "{color:7}Poyomon {color:1}\n用进化道具进化的话，\n寿命不会增加。"
text.0370: "{color:7}Poyomon {color:1}\n我来讲讲进化吧。\n嗯……是关于\n进化的条件。"
text.0428: "{color:7}Poyomon {color:1}\n首先，体重要接近\n下一阶段的体重范围。"
text.04b6: "{color:7}Poyomon {color:1}\n其次，各项能力值越高\n越好，但每项能力值的\n效果各不相同。"
text.0566: "{color:7}Poyomon {color:1}\n然后是照顾失误。\n根据想要的数码兽，\n有时失误反而是好事。"
text.062e: "{color:7}Poyomon {color:1}\n对了，要变成某些\n数码兽，还有其他的\n特殊条件。"
text.06d6: "{color:7}Poyomon {color:1}\n比如纪律特别高，\n或者战斗次数很多。"
text.0756: "{color:7}Poyomon {color:1}\n这样的话，即使三个\n基本条件没有完全满足，\n也能进化。"
text.082a: "{color:7}Poyomon {color:1}\n我听Jiji说\n{color:10}{partner}{color:1}就要进化了。"
text.089c: "{color:7}Poyomon {color:1}\n从幼年期I到幼年期II\n需要6个小时。"
text.0920: "{color:7}Poyomon {color:1}\n到成长期\n只需要1天。"
text.09ac: "{color:7}Poyomon {color:1}\n下一个阶段成熟期\n大约需要3天。"
text.0a2c: "{color:7}Poyomon {color:1}\n到再下一个阶段要多久？\n我忘了，不过会更久。"
text.0ab4: "{color:7}Poyomon {color:1}\n体重、能力值和照顾失误\n都会影响进化。"
text.0b42: "{color:7}Poyomon {color:1}\n细节我也不太清楚，\n下次我去问问Jiji。"
