text.0044: "你好，需要肉吗？"
text.007c: "啊，这件事\n我还没跟你说过呢。"
text.00d8: "这里是肉田。\n我们为大家种肉。"
text.013e: "肉是在田里种出来的？"
text.0176: "对啊，怎么了？"
text.0192: "呃……没什么"
text.01b8: "我和Jiji决定了，\n每天给你3块肉，\n{color:6}{tamer}{color:1}。"
text.0242: "这是你今天的肉。"
text.028e: "你的肉已经够多了。\n今天不需要了吧。"
text.030a: "你的肉太多了。\n拿不下的我先收着。"
text.0380: "得到了3块\n{color:6}肉{color:1}！"
text.03dc: "你的道具太多了。"
text.0414: "得到了3块\n{color:6}肉{color:1}！"
text.0470: "今天收获了好多肉！\n给你\n5块吧。"
text.0508: "你的肉已经够多了。"
text.054c: "你的肉太多了。\n拿不下的我先收着。"
text.05c2: "得到了5块\n{color:6}肉{color:1}！"
text.0620: "你的道具太多了。"
text.0658: "得到了5块\n{color:6}肉{color:1}！"
text.0698: "明天还会有的。"
text.06e4: "这是今天的肉。"
text.072a: "你的肉已经够多了。"
text.076e: "你的肉太多了。\n拿不下的我先收着。"
text.07e4: "得到了{color:6}肉{color:1}！"
text.0820: "你的道具太多了。"
text.0858: "得到了{color:6}肉{color:1}！"
text.087a: "明天再给你。"
text.08c0: "今天的肉\n我不是给过你了吗？"
text.090a: "要是没吃的了，\n就去原生森林\n找蘑菇吧。"
text.09a2: "你好，{color:6}{tamer}{color:1}，\n我把肉田扩大了。"
text.09ea: "每天给你\n3块大块肉。"
text.0a4e: "要是想多要，\n我可以卖给你，\n每块500 Bits。"
text.0ad2: "我替Tanemon\n管理这片田。\n他去别处休息了。"
text.0b74: "我今天收获了\n好多肉！"
text.0bd2: "你的大块肉已经够多了。\n今天不需要了吧。"
text.0c56: "你的大块肉已经够多了。\n今天不需要了吧。"
text.0cce: "得到了{color:6}大块肉{color:1}！"
text.0d14: "你的道具太多了。"
text.0d4c: "得到了5块\n{color:6}大块肉{color:1}！"
text.0d98: "明天再给你。"
text.0dea: "这是今天的\n3块大块肉。"
text.0e60: "你的大块肉已经够多了。\n今天不需要了吧"
text.0ee2: "你的\n大块肉太多了。\n拿不下的我先收着。"
text.0f64: "得到了{color:6}大块肉{color:1}！"
text.0faa: "你的道具太多了。"
text.0fe2: "得到了3块\n{color:6}大块肉{color:1}！"
text.1036: "明天再给你。\n也可以现在买。\n每块500 Bits，要吗？"
text.10d2: "买\n不买"
text.1110: "你的钱不够。"
text.1150: "你的道具太多了。"
text.119c: "还要再买吗？"
text.11d4: "买\n不买"
text.1202: "明天见。"
text.123e: "嘿嘿嘿！\n{color:6}{tamer}{color:1}，你看！"
text.128a: "我们能种好多\n西冷肉了。每天\n给你3块西冷肉。"
text.1310: "我还开始种\n稀有蔬菜了！\n想买多少都行！"
text.13a6: "我今天心情好，\n就给你5块\n西冷肉吧。"
text.143a: "你的西冷肉已经够多了。\n今天不需要了吧"
text.14b6: "你的西冷肉已经够多了。"
text.14f4: "得到了{color:6}西冷肉{color:1}！"
text.1534: "你的道具太多了。"
text.156c: "得到了5块\n{color:6}西冷肉{color:1}！"
text.15b2: "明天见！"
text.15ee: "这是今天的份，\n3块西冷肉！"
text.1668: "你的西冷肉已经够多了。\n今天不需要了吧。"
text.16e6: "你的西冷肉已经够多了。"
text.1724: "得到了{color:6}西冷肉{color:1}！"
text.1766: "你的道具太多了。"
text.179e: "得到了3块\n{color:6}西冷肉{color:1}！"
text.17ec: "还没到明天哦！\n要买蔬菜吗？"
text.1858: "买\n不买"
text.1886: "超级胡萝卜: 500 Bits\n鹰萝卜: 500 Bits\n不买"
text.1930: "你的钱不够。"
text.197e: "你的道具太多了！"
text.19ca: "你的钱不够。"
text.1a18: "你的道具太多了！"
text.1a62: "还要再买吗？"
text.1a9a: "买\n不买"
text.1ac8: "再见！"
