text.00ae: "你想干什么？！"
text.00e8: "哇！"
text.0104: "……？……！"
text.011e: "什么？现在？！\n好吧，来打一场！"
text.0196: "我输了。可恶！"
text.01bc: "应该邀请他\n来城里。"
text.0206: "呃，打扰一下。"
text.022c: "你能不能……\n来城里……？"
text.027e: "什么？城里？！"
text.029c: "你是说那个……破旧的地方？"
text.02dc: "这个嘛……"
text.02f0: "呃…………"
text.0306: "嗯………………"
text.0332: "好吧，没问题。\n我是Agumon。\n请多关照。"
text.03c6: "Agumon加入了城镇！"
text.0408: "好，果然值得一试。\n我会继续邀请的！"
text.0478: "这里是我的地盘！"
text.04b8: "什么？！"
text.04da: "机会来了！"
text.0810: "我就是甩不掉\n这家伙！"
