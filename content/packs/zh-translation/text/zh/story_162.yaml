text.00f8: "我回来了！"
text.0122: "谢谢你邀请我。\n希望我们能一起努力，\n{color:10}{partner}{color:1}。"
text.01c6: "{color:7}驯兽师等级\n提升了！ {color:1}"
text.020c: "{color:7}恭喜你！\n这枚奖章\n送给你。 {color:1}"
text.026c: "得到了Machinedramon卡片！"
text.0782: "你见过\n湖之守护者吗？"
text.07c8: "没见过的话，\n就去南边等着吧。"
text.083e: "一大早起来，\n在雾里走走。\n会有好事发生哦！"
text.08de: "你知道吗？北边有个\n地方叫\n冰山海滩。"
text.0962: "听说那片海滩上\n经常出现一只\n巨大的数码兽。"
text.09f4: "强盗被打倒了吗？\n听说有一伙\n强盗。"
text.0a8c: "你去过大峡谷吗？"
text.0ac6: "听说强盗\n就在那里。"
text.0b1e: "他们是坏人吗？"
text.0b4a: "他们会突然袭击，抢你的东西。"
text.0b86: "我们得想想办法。"
text.0bd8: "你去过大峡谷吗？"
text.0c12: "听说那里有一座\n隐形桥。"
text.0c96: "听说\nMachinedramon回来了。"
text.0cea: "你又打败了\nMachinedramon。"
text.0d2e: "我来给你介绍一下\n城市周边吧。"
text.0d88: "原生森林\n环绕着这座城市。"
text.0dd0: "那一带的数码兽\n不怎么强。"
text.0e2c: "西边有一个\n训练场。"
text.0e7a: "过了河往东\n就是热带丛林。"
text.0ed2: "再往前是什么\n我就不知道了。"
text.0f18: "西边有一座\n山和一个湖。"
text.0f70: "往南走就是大海。"
text.0fb4: "北边有一座\n很高的山。"
text.1006: "这座城市位于\n岛的中心。"
text.1058: "我会去打听传闻的。\n再来找我问问吧。"
text.10c8: "来看看这附近有什么吧。"
text.1108: "我不喜欢这里的厕所，\n不过其他都还不错！"
text.117e: "看起来挺热闹的。"
text.11b2: "我不用回\n工厂镇吗？"
text.120c: "我的日程管理功能\n运作正常。没问题。"
text.1282: "你来得正是时候！"
text.12be: "快看这座雕像！\n你觉得怎么样？"
text.1318: "真是杰作啊。\n连我自己都佩服自己。"
text.1364: "你什么意思？\n你在取笑我吧！"
text.13be: "我们刚才说到哪了？\n算了，无所谓。"
text.141e: "我当时想表现什么来着？\n等你想明白了，\n告诉我一声。"
text.14e2: "正在睡觉……"
text.1516: "你听说了吗？热带丛林\n长出了一株\n奇怪的植物。"
text.15b2: "对了，"
text.15c8: "我就在那边种了\n一株{color:6}降雨草{color:1}。"
text.1618: "每年15日前后\n它都会结果。\n你可以拿去。"
text.16a4: "拿来干什么？"
text.16cc: "啊，真舒服！\n是阳光啊。"
text.170e: "啊，真舒服！\n是阳光啊。"
text.1766: "好耶，太棒了！"
text.17be: "哦，这是……"
text.17f6: "道具太多了。"
text.1822: "得到了{color:6}降雨草\n果实{color:1}！"
text.1902: "我带你出海吧。\n这是我的工作。"
text.195c: "我带你去只有\n走海路才能到的地方。"
text.19c8: "那么……"
text.19ea: "嗯，去哪里好呢？\n工厂镇，或者是\n海滩洞窟。"
text.1a6c: "工厂镇\n秘密海滩洞窟\n哪里都不去"
text.1b5a: "找到你了！"
text.1b88: "糟了，他直冲\n我们过来了！"
text.1be2: "终于见到你了！\n我是Greymon。\n现在来做个了断吧！"
text.1c62: "什么？！"
text.1c76: "我是顺着关于你的\n传闻找到这里的。\n我要跟你打一场！"
text.1d00: "如果我赢了，\n我要这块路牌！"
text.1d54: "这里没有路牌啊。"
text.1d7c: "我不管，\n总之来打吧！"
text.1e08: "喂，你们挺厉害嘛！\n不过要实现目标，\n你们还是新手。"
text.1ea6: "嗯……"
text.1eb6: "我留下来训练你们。\n你们会变强很多的！"
text.1f56: "Greymon加入了城镇！"
text.200c: "好啊，找到你了，{color:6}{tamer}{color:1}！"
text.2048: "偷袭！"
text.205e: "我的目标是打倒你。"
text.2094: "那双眼睛！他一定是\n被洗脑了！"
text.2126: "不管怎样，\n我都必须打倒他。"
text.218c: "你在说什么？\n你得去治疗一下。"
