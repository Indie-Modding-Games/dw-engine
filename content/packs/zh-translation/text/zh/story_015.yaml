text.006c: "你是数码兽吗？"
text.00a6: "你是从哪儿来的，哥们？！"
text.00e8: "别取笑我！"
text.0128: "我要把你一口吞掉！"
text.01a4: "糟了，要是什么都不做，\n它就要枯死了……"
text.020a: "真希望下雨啊……"
text.023e: "哇，真有意思。\n它发芽了。"
text.0294: "它稍微动了一下。\n这就是大家都在谈论的\n那株神秘植物吗？"
text.0340: "它在枯萎。要是什么都\n不做，它就会死掉。"
text.03ac: "要用道具吗？"
text.03de: "是\n否"
text.0410: "我现在什么都没有。"
text.045c: "我的东西都派不上用场。"
text.04ae: "这样不行……"
text.0800: "嘿嘿嘿。"
text.0818: "嘿，我是Vegiemon！"
text.084c: "什么！植物数码兽？"
text.0880: "对了，你喜欢\n蔬菜吗？"
text.08d4: "为什么要问我蔬菜的事？\n到底喜不喜欢？"
text.0932: "喜欢\n不喜欢"
text.0966: "嗯，我改主意了。"
text.09a8: "喜欢蔬菜的人\n一定是好人。"
text.0a14: "不不不！\n蔬菜很好吃！"
text.0a52: " ? ? ? "
text.0a68: "好，我决定了。\n我要跟你走！"
text.0acc: "真是个死缠烂打的家伙……\n喂，等等！"
text.0b1e: "那我就不去了！\n拜拜！"
text.0b60: "你倒是快拿个主意啊！"
text.0b8c: "你想要我怎么做？"
text.0bd0: "你来城里\n帮帮我们吧！"
text.0c36: "好啊，听起来不错。\n我在这里待得太久了。"
text.0cea: "Vegiemon加入了城镇！"
