text.005c: "Myotismon！发生了什么事？"
text.00b0: "Bakke！"
text.00c6: "……"
text.00ea: "我会去竞技场跟你会合。\n我的手下可能会想我。"
text.0172: "我的手下不听话，\n所以我带上SkullGreymon。"
text.01d8: "SkullGreymon变了。\n现在他会听别人的话。"
text.024e: "Myotismon，你没事吧？"
text.02a8: "呜……是你！\n你又救了我一次。"
text.0306: "发生了什么事？"
text.032a: "你见过Devimon吗？"
text.035e: "见过。他很坏。"
text.038a: "他用邪恶\n毁了我的研究。"
text.03da: "你关于SkullGreymon的\n研究吗？"
text.0422: "我一直在收集骨头，\n把它们拼起来。\n我以后会更小心的。"
text.04b8: "那个Devimon真可恶。"
text.04ec: "我很了解他。"
text.0514: "什么？！"
text.0528: "他一直都很狡猾，\n但从没这么坏过。"
text.0580: "说不定他被\n什么人洗脑了。"
text.05d8: "也许吧。"
text.05ec: "如果他恢复本性，\n说不定能加入你们。"
