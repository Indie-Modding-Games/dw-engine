text.0116: "我想大部分的土\n都已经运出去了。"
text.0182: "工作进展得很顺利。\n谢谢。\n请再稍等一下。"
text.021e: "辛苦你了。\n这是你的报酬。"
text.0296: "干活赚到了\n500 Bits！"
text.02d8: "HP提升了50！\n攻击提升了5！\n防御提升了5！"
text.0396: "请把土倒在\n隧道外面。"
text.040a: "从土堆那里装土吧。"
text.0476: "你要运土吗？"
text.04b4: "你的数码兽好像累了。\n先让它休息一下吧。"
text.054c: "你要运土吗？"
text.058c: "是\n否"
text.05b8: "这里不是外行人\n该来的地方。走远点，\n太危险了。"
text.065e: "这条隧道还没有\n挖通。别妨碍\n我们干活。"
text.06d8: "抱歉。你知道\n什么时候能挖通吗？"
text.072e: "不知道，\n还要花上一段时间。"
text.077c: "那可麻烦了。\n我们能帮忙吗？"
text.07c0: "你想抢走我们的\n乐趣吗？\n那你就来运土吧。"
text.083c: "什么事？"
text.0866: "那些土是我挖出来的。\n你可以把它们运出去\n倒掉。"
text.08de: "这活儿很辛苦，所以\n每来回一趟，\n我付你500 Bits。"
text.096e: "这样挖得更快，我能赚钱，\n还能顺便训练。"
text.0a0c: "好的\n不了，谢谢"
text.0a3a: "运土工作\n在土堆前按{color:6}△ {color:1}放下土箱，\n把土倒到隧道外面。\n每完成一趟，\n请告诉Drimogemon。"
text.0b66: "你害怕了吗？"
text.0bae: "土箱已添加。"
