text.0028: "呃啊！"
text.0060: "什么？"
text.007e: "什么？！"
text.009e: "哎呀老大，大事不好了！"
text.00e2: "你们在干什么？"
text.011e: "真了不起。你居然找到了\n新恶鬼要塞！"
text.018c: "又打算干坏事吗？"
text.01d0: "那还用说！嘿嘿！"
text.01fa: "我不会让你们得逞的！\n你们最好赶快\n离开这个洞窟！"
text.0278: "这次可不一样了！"
text.02c0: "老大，就是那个吗？"
text.02ee: "没错。上！"
text.033c: "什么？！"
text.0360: "WaruSeadramon大人！\n请您动手吧！"
text.03ca: "原来是你们的保镖啊？"
text.040c: "嘿嘿嘿！你完蛋了！"
text.0490: "可恶！"
text.04a2: "啊啊啊啊啊！"
text.04c6: "别想逃！"
