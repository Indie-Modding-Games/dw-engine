text.0066: "哇，它看起来像活的！"
text.0096: "其实，我们一动，\n它就开始动。等一下！"
text.0144: "怎么了，{color:10}{partner}{color:1}？\n你发现什么了吗？"
text.01a0: "哇，太棒了，\n{color:10}{partner}{color:1}！"
text.0202: "哦？说起那座雕像……"
text.024e: "啊！"
text.0272: "呼，好了"
text.028e: "你复活了。\n太好了！"
text.02d4: "我是Angemon，守护你的\n天使。我已经苏醒，\n来履行我的职责。"
text.036a: "他在说什么啊……？"
text.03a8: "吾知晓天界之真理。"
text.03e4: "吾愿献出灵魂，\n遵从地上之命。"
text.044a: "他在说什么啊……？\n你要来城里吗？"
text.04c0: "汝之使命即吾之职责。\n吾去也。"
text.050a: "不好意思，你能用\n我听得懂的话说吗？"
text.0578: "我会去城里，\n所以你也要继续加油。"
text.05da: "原来如此。谢谢！"
text.0636: "Angemon加入了城镇！"
