text.00cc: "怎么了？"
text.00f4: "救命啊！"
text.0114: "他遇到麻烦了，\n我得去救他！"
text.0174: "{color:7}??? {color:1}\n有本事去欺负\n跟你一样大的！"
text.01e4: "那是谁？"
text.0270: "你没事吧？"
text.0298: "谢谢你。"
text.02b4: "遇到麻烦就随时\n叫我。我会马上\n赶过来！"
text.032e: "再见了！"
text.035e: "喂，等一下！"
text.039a: "他就像个英雄。\n功劳全让他拿走了。"
text.0404: "这是我家。出去！"
text.044a: "我是Sharmamon。你是谁？"
