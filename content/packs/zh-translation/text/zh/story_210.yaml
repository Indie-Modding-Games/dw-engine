text.00bc: "我一直在等你，\n{color:6}{tamer}{color:1}。\n这一天终于到来了"
text.0130: "怎么了？"
text.0154: "无限山的入口\n出现了。"
text.01a8: "什么？真的吗？在哪里？"
text.01d8: "就在城里的\n瀑布后面。"
text.0224: "天哪，这么近！"
text.0254: "依我看，最后的\n敌人就在无限山。"
text.02c4: "那里就是最后的迷宫了。\n我会去的！"
text.0316: "祝你好运！不过别着急。\n在做好万全准备之前，\n千万别轻举妄动。"
text.03ce: "无限山的入口\n就在城里\n瀑布的另一边。"
text.0478: "依我看，最后的\n敌人就在无限山。"
text.04e6: "做好万全准备再去吧！"
text.051c: "不管怎么说……"
text.0546: "现在城镇的\n繁荣度是{num:pstat=1}。"
text.05b4: "跟以前的样子\n还差得远呢。"
text.060e: "终于有点样子了。"
text.0658: "发展得很顺利。"
text.0698: "渐渐变成一座好城镇了。"
text.06e2: "你干得很好。\n了不起！"
text.073a: "我已经没什么好说的了。\n真是太棒了！"
text.07be: "{color:7}驯兽师等级\n提升了！ {color:1}"
text.0808: "{color:7}恭喜你！\n你干得太棒了，\n这枚奖章送给你！ {color:1}"
