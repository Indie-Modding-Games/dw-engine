text.0042: "Myotismon不在这里。"
text.00b2: "呃……我的肉冰箱钥匙呢？"
text.00f4: " ! "
text.0102: "有人来救我了吗？"
text.013a: "数码兽？你没事吧？"
text.016a: "你是谁？给我吃的！"
text.01a6: "饿了吗？你想要什么？"
text.01e0: "肉。"
text.020c: "得到了肉！"
text.022a: "肉。"
text.023c: "什么？"
text.0252: "肉？不，我没有。"
text.028e: "给。"
text.02a4: "钥匙？"
text.02c4: "我得扔掉点什么。"
text.0312: "得到了{color:6}冰箱钥匙{color:1}！"
text.0342: "好吧……"
text.0358: "我没多少时间了！"
text.038c: "我马上拿东西来。\n再坚持一下。"
text.03fc: "呼！"
text.041e: "我得救了。太感谢了。\n给你添麻烦了。"
text.0488: "发生了什么事？"
text.04ac: "我是Myotismon，\n这座宅邸的主人。"
text.0500: "我是{color:6}{tamer}{color:1}，来自另一个\n世界的人类。这是我的\n伙伴{color:10}{partner}{color:1}。"
text.0580: "我们是来\n拯救这座岛的。"
text.05c4: "看来我们有很多话要谈。\n欢迎你们。"
text.0678: "哇！"
text.0688: "……"
text.0696: "你是认真的吗？"
text.06c6: "不见了。这是在做梦吗？"
text.0746: "看来我们解决了。"
text.078e: "什么？"
text.07a6: "咦？什么？"
text.07ca: "我晕过去了。对不起。"
text.084e: "Analogman的诅咒！\n别担心，会没事的。"
