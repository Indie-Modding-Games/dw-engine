text.002c: "我把入口的告示牌修好了。"
text.0086: "好热！快想想办法！"
text.00c8: "怎么回事？"
text.00f4: "实在太热了！\n我再也受不了了！"
text.0178: "我被热得\n有点不对劲了。"
text.01c8: "我知道很热，可是……\n冷静点嘛，老兄！"
text.0218: "越往下挖就越热。\n这条隧道\n在火山里面。"
text.02a0: "我觉得不只是这个原因。\n说不定附近\n有什么地方着火了。"
text.0330: "嗯……"
text.0340: "我没有选择。\n只能忍着这股热气\n继续挖下去。"
text.03d0: "我们去查查原因。\n要是隧道能挖通\n就太好了。"
text.045a: "你真是个好人。\n我会赶快\n把隧道挖通的！"
text.050e: "今天轮到我\n负责做饭。"
