text.006a: "唰——！"
text.008c: "唰唰唰——！"
text.00c0: "看起来他没有受伤。"
text.010e: "给你打个折吧。"
text.0156: "别小看我们！"
text.0196: "你别想\n活着回家！"
text.0262: "好痛！"
text.027a: "摔得那么重，\n你看起来却没事。"
text.02dc: "{color:10}{partner}{color:1}，\n你没事吧？"
text.0310: "哇，你看起来没事！"
text.033c: "你飞下来的？太狡猾了！\n嗯，好像也不算吧。"
text.03b6: "走吧！"
text.03ea: "好痛！"
text.0402: "摔得那么重，\n他看起来却没事。"
text.0460: "{color:10}{partner}{color:1}，\n你没事吧？"
text.0494: "看来还是很痛。对不起。"
text.04d4: "走吧！"
