text.0062: "哇！"
text.0080: "嗯——"
text.00a0: "呃，就到此为止吧。"
text.00e6: "我们还不能\n放松警惕。"
text.013c: "……！"
text.0180: "不，我不要！\n我不想打架！"
text.01de: "不想打架的话，\n那就逃走吧。"
text.023a: "真遗憾。"
text.0268: "我搞不懂你。"
text.029c: "那么，要不要来\n我们的城里？总比\n躲在这里好。"
text.032e: "呃，城里？"
text.0350: "我们不会\n强迫你的。"
text.0394: "你这么说我倒想去了。\n好，我去！"
text.0426: "Gabumon加入了城镇！"
text.0464: "真是个怪家伙。"
