text.003a: "哇，太厉害了！"
text.0092: "喂，这里有块石板。\n我看看……"
text.0112: "上面写着Leomon。\n其他的看不懂。"
text.016c: "我听得懂别人说话，\n可是看不懂字……"
text.01cc: "把它带走吧。"
text.0200: "哎呀，得扔掉\n一些东西了。"
text.0262: "得到了{color:6}Leomon\n石板{color:1}！"
text.02ba: "你是谁？"
text.02da: "你是谁！"
text.0370: "得到了{color:4}次元钥匙扣{color:1}！\n可以携带20个道具了！"
text.0434: "得到了{color:4}次元钥匙扣{color:1}！\n可以携带30个道具了！"
