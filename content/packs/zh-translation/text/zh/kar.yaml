"penguinmon_dialogue.0001": "首先，请选择"
"penguinmon_dialogue.0002": "你的冰壶。"
"penguinmon_dialogue.0005": "冰壶分重、中、轻三种，"
"penguinmon_dialogue.0006": "所以要好好想想"
"penguinmon_dialogue.0007": "用它们的最佳顺序。"
"penguinmon_dialogue.0009": "有些冰壶带有四根钉子。"
"penguinmon_dialogue.0010": "它们会停在落下的位置，"
"penguinmon_dialogue.0011": "能派上大用场。"
"penguinmon_dialogue.0013": "用方向键"
"penguinmon_dialogue.0014": "左右移动，"
"penguinmon_dialogue.0015": "选择投掷的方向。"
"penguinmon_dialogue.0017": "用方向键上下移动画面。"
"penguinmon_dialogue.0018": "按{prompt:confirm}"
"penguinmon_dialogue.0019": "确定投掷方向。"
"penguinmon_dialogue.0021": "力量槽到达想要的"
"penguinmon_dialogue.0022": "位置时按{prompt:confirm}，"
"penguinmon_dialogue.0023": "就能决定投掷力度。"
"penguinmon_dialogue.0025": "冰壶停下时如果"
"penguinmon_dialogue.0026": "碰到GOOD标记，"
"penguinmon_dialogue.0027": "就能得两分。"
"penguinmon_dialogue.0029": "如果停在蓝线上，"
"penguinmon_dialogue.0030": "但在中心GOOD标记外，"
"penguinmon_dialogue.0031": "就得一分。"
"penguinmon_dialogue.0033": "如果碰到右下方的"
"penguinmon_dialogue.0034": "BAD标记，就会扣"
"penguinmon_dialogue.0035": "两分，要小心哦。"
"penguinmon_dialogue.0037": "还有，如果打成平手，"
"penguinmon_dialogue.0038": "就算我赢！"
"penguinmon_dialogue.0039": "那么比赛开始吧！！"
"penguinmon_dialogue.0042": "你也没多厉害嘛！"
"penguinmon_dialogue.0045": "比赛才刚开始呢！"
"penguinmon_dialogue.0049": "嘿，你挺厉害的嘛！"
"penguinmon_dialogue.0053": "耶！我赢了！"
"penguinmon_dialogue.0057": "唉，我输了。 "
"metalmamemon_dialogue.0001": "嗯。首先你得选择"
"metalmamemon_dialogue.0002": "冰壶的种类。"
"metalmamemon_dialogue.0005": "我是天才，所以能按"
"metalmamemon_dialogue.0006": "正确的顺序使用各种冰壶。"
"metalmamemon_dialogue.0007": "这就是获胜的关键。"
"metalmamemon_dialogue.0009": "带四根钉子的冰壶"
"metalmamemon_dialogue.0010": "会停在落下的位置，"
"metalmamemon_dialogue.0011": "所以非常宝贵。"
"metalmamemon_dialogue.0013": "用方向键左右移动，"
"metalmamemon_dialogue.0014": "选择投掷的方向，"
"metalmamemon_dialogue.0015": "就是左右来调整。"
"metalmamemon_dialogue.0017": "方向键上下可以"
"metalmamemon_dialogue.0018": "滚动画面。"
"metalmamemon_dialogue.0019": "按{prompt:confirm}就能投出去。"
"metalmamemon_dialogue.0021": "力量槽到达想要的"
"metalmamemon_dialogue.0022": "位置时按{prompt:confirm}，"
"metalmamemon_dialogue.0023": "就能决定投掷力度。"
"metalmamemon_dialogue.0025": "得分：冰壶停在"
"metalmamemon_dialogue.0026": "GOOD标记上，"
"metalmamemon_dialogue.0027": "就能得两分。"
"metalmamemon_dialogue.0029": "如果停在蓝线上，"
"metalmamemon_dialogue.0030": "但在中心GOOD标记外，"
"metalmamemon_dialogue.0031": "就得一分。"
"metalmamemon_dialogue.0033": "如果停在右下方的"
"metalmamemon_dialogue.0034": "BAD标记上，就会扣"
"metalmamemon_dialogue.0035": "两分，要小心哦。"
"metalmamemon_dialogue.0037": "打成平手就算我赢！"
"metalmamemon_dialogue.0038": "比赛开始！！"
"metalmamemon_dialogue.0041": "我会赢的！"
"metalmamemon_dialogue.0045": "我还没输呢！"
"metalmamemon_dialogue.0049": "这场比赛我不能输！"
"metalmamemon_dialogue.0053": "耶，我赢了！"
"metalmamemon_dialogue.0057": "唉，差一点就赢了。"
