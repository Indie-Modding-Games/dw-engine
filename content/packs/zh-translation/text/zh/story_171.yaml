text.0034: "欢迎光临！我的新生意是\n“道具保管所”。\n专门替大家保管道具。"
text.00c0: "作为特别服务，\n我免费替你保管道具。"
text.0144: "关于进化……\n说到成熟期数码兽的\n下一个世代……"
text.01e4: "那就是完全体数码兽。\n成熟期数码兽\n不一定都会进化成完全体。"
text.0286: "想要进化，\n就必须准确满足\n一定的条件。"
text.030e: "不过一旦进化成\n完全体数码兽，\n寿命就会延长。"
text.03a8: "但如果是吃了进化道具\n进化的，寿命\n就不会改变。"
text.0464: "再说说进化。\n关于进化的条件。"
text.04c6: "首先，听说体重\n必须接近\n目标体重。"
text.0560: "而且各项能力值\n越高越好。"
text.05b8: "不过，哪项能力值\n比较高，\n结果也会不一样。"
text.0644: "至于照顾失误，\n有时候故意失误\n反而效果更好。"
text.06d8: "根据进化的目标，\n有些条件\n是必须满足的。"
text.0768: "有些情况\n会引发进化。"
text.07da: "比如战斗的次数，\n或是纪律好不好。"
text.0850: "只要满足了这些条件，\n就算其他条件没满足，\n也还是能进化。"
text.08fc: "我听Jiji说\n{color:10}{partner}{color:1}就要进化了。"
text.0956: "从幼年期I数码兽\n进化到幼年期II数码兽，\n只需要6个小时。"
text.09e2: "从那里进化到成长期\n数码兽，大约\n需要1天。"
text.0a68: "再进化到下一阶段的成熟期\n数码兽，大约\n需要3天。"
text.0b02: "再下一个世代是什么来着？\n我忘了，\n不过后面还有。"
text.0b82: "进化和体重、\n能力值、\n照顾失误都有关系。"
text.0c0a: "我也不太明白。\n下次有机会\n再去问问Jiji吧。"
