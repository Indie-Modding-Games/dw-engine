text.0058: "情况不妙啊！"
text.0096: "你说什么了吗？"
text.00d8: "我都说了不可能。"
text.0124: "我没什么信心。"
text.0174: "手下留情啊。"
text.01a6: "别取笑我！"
text.01ee: "升降机"
text.0206: "按“屋顶”\n按“上”\n不坐"
text.026e: "一点反应都没有。"
text.02ba: "有块石头卡在\n机器里。难道是这个……"
text.0334: "把石头拿掉了！"
text.0362: "这样应该就行了！"
text.03fe: "一点反应都没有。"
text.044a: "有块石头卡在\n机器里。难道是这个……"
text.04bc: "把石头拿掉了！{stop}"
text.04fe: "这样应该就行了。"
