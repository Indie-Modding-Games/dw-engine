text.0042: "我们来帮你改造。\n费用是2000 Bits。"
text.00be: "型号不一样。\n我们没法改造。"
text.011a: "改造\n不用了"
text.015a: "你的Bits不够。"
text.01a0: "请稍等。"
text.01d4: "没有成功，不过……"
text.0214: "哇，变成Giromon了！"
text.0262: "成功了！"
text.029a: "哇，变成\nMetalMamemon了！"
text.02e6: "没有成功。"
text.030c: "太糟糕了！"
text.032e: "对不起……"
text.0350: "追加，消除！"
text.0392: "头号目标是\n破坏硬件。"
