text.0094: "一直往前走，\n然后右转。嘿嘿嘿……"
text.0108: "先右转，\n马上再左转。嘿嘿……"
text.016c: "你是走不出\n这片森林的。嘿嘿嘿……"
text.01dc: "我迷路了！"
text.0208: "最近我总觉得很累。"
text.024e: "你？不会吧？！"
text.027e: "走路要小心脚下哦。"
text.02cc: "喂，你！"
text.0318: "嗯，你可真不简单！\n一大早就能这样，\n已经很不错了。"
text.03c2: "喂喂，别装得\n好像事不关己一样！"
text.0438: "我知道！我知道\n你在说什么。"
text.0490: "听说你为了这座岛，\n正在努力地\n召集数码兽。"
text.0520: "原来你知道啊。那么，\n你来帮帮我吧。"
text.057a: "那，我该在哪里\n做什么呢？"
text.05d2: "哎呀，你根本没搞懂！\n你应该去城里\n干活才对，记得吗？！"
text.066c: "嗯，俗话说得好……\n早起的鸟儿有甲虫吃。"
text.06e2: "这跟什么都扯不上关系！\n而且应该是有虫吃，\n不是有甲虫吃！"
text.078a: "开玩笑的啦。好吧，\n城里见……"
text.0830: "Kokatorimon加入了城镇！"
text.0876: "真的能相信他吗？\n真让人怀疑……"
text.08de: "喂，这里掉了鸟的羽毛。\n还是新的。\n我们来晚了吗？"
