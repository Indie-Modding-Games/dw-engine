text.0090: "这里刻着\n一些文字。"
text.00dc: "这里没人！快回去！"
text.011e: "有人住在这里吗？"
text.0176: "{color:7}? ? ? {color:1}\n猴子也会从树上掉下来。"
text.01c8: "{color:7}? ? ? {color:1}\n飞膝落！"
text.025e: "我是输了，但是\n你们根本不算什么！"
text.02b4: "别输不起嘛。\n你还偷袭了\n我们呢。"
text.0344: "呃！你们让我\n别无选择，只能……"
text.0394: "我会在你们的城里\n让你们见识我有多强！\n你们等着瞧吧！"
text.0462: "Etemon加入了城镇！"
text.04a0: "你只会受伤而已。"
text.04e0: "你真是个小娃娃！"
text.051c: "好吧，我就陪你玩玩。"
text.056a: "我要打断你的鼻子！"
text.05aa: "我要把你劈成两半！"
