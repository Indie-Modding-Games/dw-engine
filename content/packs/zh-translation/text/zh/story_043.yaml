text.0060: "哒！"
text.007e: "哈！"
text.009c: "咕嘿！"
text.00c6: "东：升降机\n西：危险，悬崖"
text.0120: "恶鬼模式：开\n恶鬼模式：关"
text.0196: "什么？"
text.01fa: "我感觉地面在动。\n是我的错觉吗？"
text.02c8: "什么？不会吧！"
text.0344: "{color:6}{tamer}{color:1}哇啊！！"
text.0370: "小心塌方！"
text.03d6: "听说强盗们\n就在这条路上袭击人。"
text.0438: "走吧，{color:10}{partner}{color:1}。"
text.0480: "哟呼！"
text.049c: "哈哈！"
text.04b0: "呀呼！"
text.050e: "投降吧，把东西留下！\n不然的话！"
text.0562: "不，该投降的是你们！"
text.058a: "什么？！你是……？"
text.05ae: "不可能。"
text.05ce: "老大，我们怎么办？"
text.0602: "别怕，我们更强，\n人数也更多。\n给我上！"
text.06d2: "总有一天\n我会报仇的！"
text.0724: "看他们跑的！短时间内\n他们是不会回来了。"
