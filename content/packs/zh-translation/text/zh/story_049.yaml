text.004a: "欢迎光临。我从没见过你。\n你是从哪里来的？"
text.00c2: "从城里来的。其实，\n我来自另一个世界。"
text.0120: "你听得懂我的话？"
text.015e: "嗯，听得懂。"
text.017a: "有时候生意很难做，\n这里卖不出多少东西。"
text.01e0: "原来如此。"
text.01f4: "很多客人都不来了。"
text.0236: "一定是因为\n岛上出了麻烦。"
text.0288: "帮我个忙吧。"
text.02ba: "什么忙？"
text.02d8: "你能在我店里帮忙吗？"
text.0310: "在你的店里？"
text.032c: "干半天怎么样？卖得越多，\n我付你的钱就越多。\n你懂我们的语言嘛。"
text.03c8: "你可能会亏钱的。"
text.03fa: "别担心，这对我有好处。\n干8个小时怎么样？"
text.0474: "试试看\n不了"
text.05fa: "真可惜。\n有空再来吧。"
text.065e: "你要来干活吗？"
text.06b2: "嗯，已经过了一半了。\n "
text.0750: "照这样下去，我们赚不到钱。\n再加把劲吧。\n "
text.07e2: "卖得不错。\n能赚到一些钱了。"
text.084a: "好久没有这么\n好的生意了。\n继续加油！"
text.08d8: "我想时间到了。\n谢谢你的帮忙。"
text.0944: "本来可以更好，\n不过也不算太差。\n别灰心。"
text.09d4: "得到了500 Bits！"
text.0a22: "你可以做得更好。\n我希望你多干点。"
text.0a86: "得到了1500 Bits！"
text.0ace: "你的智慧、品格和勇气，\n正是拯救这座岛\n所需要的。"
text.0b60: "你在说什么啊？"
text.0b9e: "我是在考验你，\n看你有没有能力拯救我们。"
text.0c18: "战斗厉害\n固然重要。"
text.0c68: "不过除了力量，\n还需要勇气和智慧。"
text.0cd4: "我们通过考验了吗？"
text.0d06: "嗯，我会尽我所能\n帮助你。"
text.0d56: "你要来城里吗？\n那这家店\n怎么办？"
text.0dd2: "我以后可以再开店。\n这家店已经完成使命了。"
text.0e42: "Monochromon加入了城镇！"
text.0e7e: "得到了2000 Bits！"
