text.0096: "我听说过你。"
text.00d6: "既然你听说过我们和城镇，\n要不要跟我\n一起走？"
text.0166: "我也在思考这座岛的\n未来。我一直在\n寻找一样东西。"
text.0218: "你在找什么？"
text.0252: "是我的祖先留下的东西，\n可是我不知道\n那是什么。"
text.02fe: "原来如此。如果我找到了，\n就告诉你。"
text.0354: "我已经找了\n很久了。\n恐怕不容易找到。"
text.03cc: "不过如果你找到了，\n我保证，\n我会去你们的城镇。"
text.044c: "是这个吗？"
text.0474: "哦，就是它！"
text.04b8: "这是我的祖先写下的。\n让我看看。"
text.0524: "当危险降临这座岛时，\n就去城镇吧。"
text.0592: "祖先说\n我应该去！"
text.05de: "你要帮助我们吗？"
text.061e: "包在我身上！"
text.0686: "Leomon加入了城镇！"
text.06ca: "我得去找一样东西。\n不好意思，我得走了……"
text.0756: "{color:5}训练：\n重击特训 {color:1}"
text.0796: "开始\n说明\n退出"
text.07ce: "普通\n奖励挑战\n退出"
text.080c: "用一个混凝土沙袋，\n全力击打。"
text.0868: "可以提升攻击\n和最大HP。"
text.08c4: "再听一次说明\n开始\n退出"
