text.0066: "我要把你打趴下！"
text.00ce: "再来一次吧。"
text.00fa: "好\n不要"
text.0148: "就差一点了……\n来吧，再来一次！"
text.01ae: "好\n不要"
text.020c: "我赢不了！"
text.0230: "你为什么想赢？"
text.026e: "我该怎么办？"
text.0298: "什么意思？\n你没什么事可做吗？"
text.02f4: "我有的是时间。"
text.032c: "要是你时间太多，\n就来城里吧。那里有\n各种各样的数码兽。"
text.03d6: "听起来不错，我去。\n我叫Patamon。\n回头见。"
text.0482: "Patamon加入了城镇！"
text.04c8: "一点都不好玩！"
text.04f6: "你要来吗？"
text.052a: "你身上没味道！"
text.0560: "看起来好好吃。\n我要把你一口吞掉！"
text.05b6: "哈哈，你真好笑！"
