text.014c: "地上有\n奇怪的图案。"
text.01a2: "是那种神秘的圆圈吗？\n看起来还很新。"
text.0238: "现在变得更多了。\n你觉得它们\n是UFO弄的吗？"
text.02d4: "呃啊？！"
text.02f4: "现在看到更多了。"
text.032c: "嗯，我想这意味着……"
text.036a: "什么？"
text.03d0: "外星人？！"
text.03ec: "……"
text.03fa: "你是数码兽吗？"
text.0426: "……"
text.0434: "是吗？"
text.044c: "……"
text.0472: "我不是你的敌人！"
text.04a8: "很好，你总算明白了。"
text.04ea: "{color:6}{tamer}{color:1}试着\n说服他。"
text.0526: "……"
text.0534: "也许他听不懂。"
text.0588: "好吧。"
text.05d4: "Vademon加入了城镇！"
text.060a: "咦？"
text.0618: "他会说话！"
