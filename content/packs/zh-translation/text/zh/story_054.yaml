text.0056: "Myotismon不见了。"
text.009a: "哦！"
text.00b8: "我找到了一把钥匙。说不定\n能打开那些门。"
text.0128: "使用了\n{color:6}宅邸钥匙{color:1}！"
text.016e: "我得扔掉点什么。"
text.01e2: "使用了\n{color:6}宅邸钥匙{color:1}！"
text.0246: "打不开。\n锁住了。"
text.02d8: "使用了\n{color:6}宅邸钥匙{color:1}！"
text.033c: "打不开。\n锁住了。"
text.03b0: "吧唧，吧唧……"
text.03d0: "那个……"
text.03e6: "听我说。"
text.0408: "好吃，好吃……"
text.0430: "我的手下都不听话了。"
text.0470: "他们好像记不住\n我的命令了。"
text.04ca: "他们现在什么都不懂了。\n本来应该给我送饭的，\n可是……"
text.0560: "吧唧，吧唧……"
text.0580: "我工作的时候，\n他们没给我送饭，\n我就忘了吃。"
text.0614: "你太专注于\n工作了。"
text.0662: "真不好意思。"
text.0690: "我觉得宅邸里\n出了麻烦。"
text.06e6: "岛上出了什么问题吗？\n大家都像我的手下一样？"
text.0754: "是的，大家都在\n失去记忆。"
text.07a6: "你觉得是有人\n在背后策划吗？"
text.07fa: "嗯？"
text.080a: "我能做些什么？"
text.082e: "我们在建一座城，\n让数码兽们团结一心。"
text.089e: "我们正在寻找伙伴。"
text.08da: "我能做什么呢？我的手下\n只会打架。"
text.0940: "我不能把他们丢在这里。"
text.0978: "原来如此。"
text.098c: "让我考虑一下。\n真对不起。"
text.09e0: "我会再来的。\n别忘了吃饭哦。"
text.0b9c: "谢谢你的帮助。\n给你看看我的研究吧。"
text.0c02: "有时候，MetalGreymon\n消失的时候，会进化\n成SkullGreymon。{stop}"
text.0cac: "Bakemon、Devimon和\nPhoenixmon也会\n这样进化。"
text.0d22: "我不知道它们出生时\n是谁。进化图上\n也没有写。"
text.0dc6: "比赛对我的手下\n很有帮助。"
text.0e0a: "比赛是研究之余\n很好的休息。"
text.0e64: "你在研究什么？"
text.0eae: "城里建了一座\n竞技场！"
text.0efc: "不知道我的手下\n能不能帮上忙？"
text.0f40: "可以，在那里\n他们想多用力都行。"
text.0fa4: "我的手下情况更糟了。\n是时候离开\n宅邸了。"
