text.006c: "我不太舒服。"
text.0098: "你没事吧？"
text.00c0: "我感觉不太好。"
text.00ec: "你住在这里吗？"
text.0122: "我好难受。一点力气都没有。"
text.0158: "你脸色好差啊。"
text.017e: "越来越严重了。"
text.01ac: "我得查清楚原因。"
text.01e6: "这些脏水\n是从哪里来的？\n我去查个究竟！"
text.0282: "这是什么？"
text.02b2: "怎么了，{color:10}{partner}{color:1}？！"
text.02ea: "这雾好臭！"
text.0312: "怪怪的，有点恶心。"
text.0350: "好了，下水道\n恢复正常了。"
text.039a: "他现在没事了。\n问题解决了。"
text.040c: "不对劲！"
text.0450: "哒哒哒！"
text.04bc: "我好累。\n你们这是怎么了？"
text.050e: "他听起来更傻了！\n也许他恢复神智了。"
text.0574: "你是说我傻吗？\n太没礼貌了！我叫Numemon。"
text.05e8: "你要是不傻，\n那你是什么？"
text.0630: "我说，Numemon。你知道\n是谁救了你的命吗？"
text.06a0: "嗯？你要我\n救你的命？好啊。"
text.06fc: "唉。他完全\n没听懂！算了，无所谓。"
text.0766: "嘿，我要当救世主了。酷！"
text.07ae: "请来我们的城镇吧。\n你知道在哪里吗？"
text.081c: "大概知道一点。"
text.087c: "Numemon加入了城镇！"
text.08ce: "是谁？！"
text.08ec: "你是谁？！"
text.0984: "得到了{color:4}次元\n钥匙扣{color:1}！现在\n最多能带20个道具了！"
text.0a46: "得到了{color:4}次元\n钥匙扣{color:1}！现在\n最多能带30个道具了！"
