text.00c2: "我的翅膀好痛。"
text.00ee: "怎么了？"
text.0112: "我的翅膀受伤了……\n你有能治伤的东西吗？"
text.018e: "哇，看起来伤得不轻！\n等一下，让我看看。"
text.0208: "我现在\n什么都没有。"
text.0294: "这个不行。"
text.02bc: "好多了。谢谢你。"
text.030a: "现在能飞了吗？"
text.0332: "我想我还飞不远。"
text.037a: "城里有诊所。\n你应该去那里看看。\n离这儿不远。"
text.0402: "我听说过那座城。\n比我想象的还要大。"
text.0470: "去城里好好休息吧。"
text.04a8: "谢谢你。也许有一天\n我能帮上你的忙。"
text.053c: "Unimon加入了城镇！"
text.057c: "我没有能治你\n伤势的东西。\n我去帮你找点来。"
text.0608: "不好意思，请快一点。"
text.068c: "地上画着一些\n奇怪的图案。"
text.06f0: "这就是那种\n神秘的麦田圈吗？\n看起来还很新。"
text.0774: "现在看到更多了！\n这会不会跟\nUFO有关……？"
text.080a: "哇？！比之前\n更多了！"
text.0862: "这是什么意思？"
text.0896: "什么？"
text.08f8: "Vademon的UFO出现了。"
text.092c: "外、外星人？！"
text.0950: "……"
text.095e: "你……是数码兽吗？"
text.0990: "……"
text.099e: "这个嘛……"
text.09b4: "……"
text.09ca: "Vademon拿起了枪。"
text.09fa: "不，住手！\n我不是你的敌人！"
text.0a3c: "Vademon放下了枪。"
text.0a70: "你明白就好。"
text.0aa0: "{color:6}{tamer}{color:1}拼命地\n试着说服他。"
text.0af4: "……"
text.0b02: "他是不是没听懂？"
text.0b3a: "好吧。"
text.0b8a: "Vademon加入了城镇！"
text.0bc0: "他……"
text.0bd0: "他会说话！"
