text.0066: "要打一场吗？\n还是你害怕了？！"
text.00b2: "好，来打吧\n等一下"
text.011e: "糟了！我输了！"
text.0152: "他真够厉害的。"
text.019a: "你人不错。我是Mamemon。\n我跟你们走。"
text.0200: "跟我们走？那你\n干脆去城里怎么样？"
text.0272: "好。我这就过去。"
text.02d6: "Mamemon加入了城镇！"
text.0320: "等你变强了\n再来吧。"
text.039c: "哒——！"
text.03be: "哈，哈，哈。"
text.03ea: "呃啊——！"
text.0410: "东：原生森林\n西：齿轮草原"
