text.0ece: "喂，有新消息哦。"
text.0efe: "幼年期I或幼年期II的\n数码兽，试着反复进行\n同一种训练吧。"
text.0f88: "会有好事发生的。"
text.0fd4: "有新消息哦。"
text.0ffa: "奖励挑战时，如果对齐了\n相同的图案，\n能力就会大幅提升。"
text.10b0: "哦，我本来是要\n跟你讲招式的。"
text.110e: "敌人使用的招式，\n只要赢了战斗\n就有机会掌握。"
text.1198: "不过只限于那个时候\n能够学会的招式。"
text.1226: "你没法掌握所有招式。\n但战斗是掌握招式\n最快的方法。"
text.12d0: "训练也能掌握招式，\n不过几率很低。"
text.134e: "等你变聪明了，去上\n{color:6}{tamer}{color:1}的课堂，\n也许能学会招式。"
text.13e6: "学会的几率很低，\n别抱太大期望。\n要均衡地训练哦！"
text.148c: "嗨，我是Koromon。\nJiji让我跟你\n讲讲训练的事。"
text.1506: "想问我什么吗？"
text.153c: "什么是训练？\n教我怎么训练\n没什么"
text.15b2: "在这里训练，\n就能提升\n数码兽的能力。"
text.162c: "训练会让人疲劳，\n不过收获比实战\n还要多。"
text.16c8: "另外，虽然很少见，\n也能掌握新招式。"
text.173a: "招式的事，\n下次再详细告诉你。"
text.17a0: "这里有六个训练场，\n旁边都立着\n告示牌。"
text.182a: "在告示牌前\n按{color:6}△ {color:1}试试。"
text.187c: "看了告示牌，\n就知道能提升\n哪些能力。"
text.18fe: "根据数码兽的专长，\n有些能力会比其他\n能力提升得更多。"
text.19aa: "不过不试一下\n是不会知道的。"
text.1a0a: "选了「开始」之后，\n再选「普通」，\n就会训练一个小时。"
text.1a7a: "训练的时候，按\n{color:5}× {color:1}可以\n快进时间。"
text.1ae6: "对了，我还得跟你讲讲\n「奖励挑战」。"
text.1b48: "奖励挑战成功的话，\n能力会大幅提升，\n失败的话只会提升一点。"
text.1be4: "试一次你就明白了。"
text.1c24: "好啦，我很快会再给你\n带来新消息的。"
text.1d7c: "我去过城里。但是\n那里太像城市了，\n我待不惯，就来了这里。"
text.1e10: "我改良了器材。\n现在更好用了。努力训练吧！"
text.1e86: "我去过城里。但是\n那里太像城市了，\n我待不惯，就来了这里。"
text.1f1a: "我改良了器材。\n现在更好用了。努力训练吧！"
