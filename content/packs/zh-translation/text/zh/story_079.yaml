text.009c: "从这里往前就是\n疾速时代区。\n别靠得太近。"
text.012e: "我有两个目标。\n一个是找出\n岛上的危机。"
text.01b2: "另一个是把\n数码兽带到城里。"
text.0212: "所以你想说什么？"
text.023e: "请帮帮我\n哦，没什么"
text.0286: "我不行。我得守卫\n这片森林。"
text.02d4: "那你知道关于\n岛上危机的事吗？"
text.0346: "我什么都不知道。等等。"
text.037c: "我记得不久前，\n有一块大石头\n从天上掉了下来。"
text.03fc: "掉在哪里了？"
text.0428: "疾速时代区，\n在森林的另一边。"
text.04a2: "让我去吧！说不定\n能找到什么线索！"
text.0506: "……"
text.0512: "既然你坚持，\n那就去看看吧。"
text.057e: "从这里往前，\n时间会加倍流逝。\n带够食物再去吧。"
text.0610: "另外还要小心\n别让它老得太快。"
text.0672: "你应该去\n别的地方看看。"
text.06dc: "从这里往前，\n时间会加倍流逝。\n带够食物再去吧。"
text.076e: "另外还要小心\n别让它老得太快。"
text.07dc: "发生了什么事吗？"
text.0810: "还没有。"
text.0828: "据我师父说，\n有一条秘密通道。"
text.0890: "可我不知道在哪里。"
text.08da: "那是什么？"
text.08f8: "好像是陨石！\n没什么好担心的。"
text.096c: "抱歉，我知道的\n就这么多。"
text.09ae: "还是谢谢你。"
text.09da: "看招！"
text.0a82: "你真没用！"
text.0aac: "师父？！"
text.0ac4: "真不敢相信\n你还在这里！"
text.0b1c: "师父？他是谁？"
text.0b4c: "可是师父，谁来守卫\n古代恐龙地带呢？"
text.0bba: "现在是这座岛的\n关键时刻。去城里\n帮助大家吧！"
text.0c5c: "是！"
text.0c7c: "真的没关系吗？！"
text.0cba: "他还年轻，不过\n请让他好好干活。\n这里由我来守卫。"
text.0d54: "师父……"
text.0d74: "{color:6}{tamer}{color:1}，事情就是这样，\n我可以去城里吗？"
text.0de4: "你要好好努力。"
text.0e12: "我会的！\n师父，回头见！"
text.0e92: "Tyrannomon加入了城镇！"
text.0ed6: "不知道他能做些什么？"
text.0f1a: "我好久没有\n守卫这个地方了。"
text.0f7a: "你随时都可以通过。"
text.0fc2: "我好久没有\n守卫这个地方了。"
text.1022: "你随时都可以通过。"
