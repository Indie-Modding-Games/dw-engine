text.0072: "你来啦，{color:6}{tamer}{color:1}！"
text.009a: "我们是寻宝猎人。\n靠挖掘的本领\n找出埋在地下的宝藏。"
text.013e: "找宝藏的事就交给我吧。"
text.0196: "要我帮你找东西吗？\n还是要我说明一下\n我们怎么找？"
text.0230: "说明\n不用说明\n没事了"
text.0286: "我们有两种方案，\n天数和价格都不同。"
text.02ee: "普通: 3天，1000 Bits\n特别: 10天，5000 Bits"
text.036a: "选特别方案的话，\n找到更好宝藏的\n机会更大。"
text.03f6: "大概就是这样。\n你想怎么做？"
text.044e: "寻找宝藏\n再听一次说明\n没事了"
text.04b0: "选一个方案吧！"
text.04d4: "普通: 3天，1000 Bits\n特别: 10天，5000 Bits\n取消"
text.056e: "好吧，那再见了。"
text.05c4: "3天后告诉你结果。\n祝我好运吧。"
text.066a: "10天后告诉你结果。\n祝我好运吧。"
text.06ea: "你的Bits不够。\n找宝藏是要\n花钱的。"
text.07a4: "我现在正在找宝藏。\n请耐心等待。"
text.082a: "告诉你哦？\n我们找到宝藏了。"
text.0b00: "先把你的东西清一清！"
text.0b32: "得到了{color:6}{item:pstat=110}{color:1}！"
text.0dae: "谢谢你过来！"
text.0de8: "谢谢惠顾，\n{color:6}{tamer}{color:1}！"
text.0e2a: "我刚开始给Drimogemon\n当助手。我很擅长\n找东西哦。"
