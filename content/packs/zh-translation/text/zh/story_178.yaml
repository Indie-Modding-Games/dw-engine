text.00a8: "你来得正是时候！\n我有件事\n只有你才能办到。"
text.0146: "什么事？"
text.0164: "我刚刚感觉到一股\n和Analogman、Machinedramon\n一样的邪恶气息。"
text.01f8: "我知道它是从哪里来的。"
text.0236: "又来？好，交给我吧！"
text.0272: "谢谢。对了……"
text.02b8: "听说你打败了\nMachinedramon！"
text.02fe: "是啊，但我搞不懂。\n那好像是\nAnalogman的诅咒。"
text.0386: "他的怨念太强了。\n也许现在能迎来和平了。"
text.03fa: "要是Machinedramon回来，\n我们就再打败他一次。"
text.0460: "你值得信赖。这是我们\n肉田里长出来的，\n送给你。"
text.04f0: "哇！是{color:6}连锁瓜{color:1}？"
text.0548: "我的道具太多了。"
text.0588: "谢谢！"
text.05be: "你来了！\n这件事我没法\n拜托其他人。"
text.0636: "别怕，有我在。\n你是说\nAnalogman回来了？"
text.06a6: "我能感觉到他的邪恶，\n但不知道在哪里。"
text.0712: "交给我吧！我会找到他，\n把事情解决掉。"
text.0784: "谢谢。\n对了……"
text.07ea: "我回来了，打算在\n{color:10}{partner}{color:1}的帮助下\n重建文件城。"
text.0882: "我想建一些\n对你和{color:10}{partner}{color:1}\n有用的店。"
text.0900: "你该去城外不远的\n原生森林探索一下。"
text.099c: "这个给你。祝你好运。"
text.09de: "得到了很多道具！"
text.0a26: "要查看道具，\n就按{color:5}× {color:1}……"
text.0a6a: "……然后选择“道具”，\n用{color:6}△ {color:1}\n来查看。"
text.0ae2: "Yuramon好像\n又收集到新传闻了。"
text.0b56: "听说Yuramon\n有了新的传闻。"
text.0bb2: "城市开始发展了，\n听说现在\n正在变化呢。"
text.0c30: "我来教你\n我们世界的常识。"
text.0ca0: "一天有24个小时，\n分为早上、\n白天和晚上。"
text.0d32: "你可能会觉得\n节奏很快。"
text.0d76: "一年有30天。\n月？那是什么？季节？\n能吃吗？"
text.0e14: "当然有钱啦。\n单位是Bits。\n钱永远不嫌多。"
text.0eb6: "在这座岛上说“城市”，\n指的就是这里。"
text.0f24: "不过也有其他的\n小村子和小镇。"
text.0f84: "时钟上，黄点\n代表小时，指针\n代表分钟。"
text.100a: "上面是午夜，\n下面是中午。"
text.1050: "左边的红色部分\n代表傍晚，\n显示4点到8点。"
text.10f0: "右边的紫色部分\n代表早上，\n显示4点到8点。"
text.118a: "数码兽只在一天中的\n特定时间活动。"
text.11e6: "大部分早上起床、\n晚上睡觉，\n但也有反过来的。"
text.1286: "要是遇不到想见的\n数码兽，就换个\n时间再来试试。"
text.1340: "尽量多和Tsunomon\n还有Yuramon说说话。"
text.13bc: "我来跟你讲讲\n驯兽师等级。"
text.140a: "驯兽师等级越高，\n你的数码兽消失后，"
text.147c: "下一只数码兽的\n能力值就会更好。"
text.14de: "一开始\n不会涨很多，"
text.152e: "但只要坚持培育，\n就会越来越高。"
text.15b2: "使用必杀招式时，\n记得快速连按\nL键和R键。"
text.1658: "必杀槽满的时候，\n和空的时候相比，\n对敌人的伤害会翻倍！"
text.1704: "我来跟你讲讲\n数码兽的生活。"
text.1754: "数码兽肚子饿了，\n会告诉你的。"
text.17ac: "它也需要上厕所。\n一定要让它\n在厕所里解决。"
text.182e: "数码兽会困，\n需要睡觉，但你得\n让它去睡。"
text.18b8: "别让它熬夜\n熬太久。"
text.190a: "它可能会累、生病，\n或者闹脾气。\n它可是很娇气的。"
text.198c: "数码兽是野生的\n生物，所以你应该\n表扬或责骂它们。"
text.1a16: "不管做什么，\n都要留意\n你的数码兽在做什么。"
text.1aba: "你醒了……\n真对不起。"
text.1b28: "这是什么机器？"
text.1b64: "那个？那是\n{color:4}记忆卡对战\n数据保存机{color:1}。"
text.1be6: "用那台机器，\n可以保存你现在\n伙伴的对战数据。"
text.1c7c: "只要按{color:6}△ {color:1}，\n机器就会告诉你\n该怎么做。"
text.1d02: "要使用\n{color:4}记忆卡对战\n数据保存机{color:1}吗？"
text.1d84: "是\n否"
text.1dce: "没看到Punimon，\n不过我就在这里休息吧。"
text.1e3a: "{color:7}Punimon {color:1}\n我是Punimon！要不要\n在这里休息一会儿？"
text.1eb0: "{color:7}Punimon {color:1}\n休息1小时能恢复HP、\nMP，并减少疲劳。"
text.1f34: "休息\n不休息"
