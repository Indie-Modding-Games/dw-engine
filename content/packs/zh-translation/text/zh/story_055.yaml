text.0034: "我来对付你！"
text.006a: "我来对付你！"
text.00a0: "我来对付你！"
text.0102: "上面写了什么？"
text.012c: "回到从那个笨蛋\n那里得到点数的\n地方去。"
text.01d8: "使用了\n{color:6}冰箱钥匙{color:1}！"
text.0234: "没看到啊。"
text.025e: "有一张便条。"
text.0284: "回到从那个笨蛋\n那里得到点数的\n地方去。"
text.0310: "我应该照这张便条做。"
text.036a: "是一台冰箱。"
text.039a: "锁住了。我从没见过\n上锁的冰箱。"
