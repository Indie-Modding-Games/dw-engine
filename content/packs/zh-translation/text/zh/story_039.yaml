text.0020: "我打扰到你了吗？"
text.0090: "{color:7}??? {color:1}\n救救我！"
text.00ca: "我听到上面有声音。\n有人在吗？"
text.012c: "{color:7}??? {color:1}\n有人在吗？"
text.0162: "嗯，有人在。"
text.018a: "{color:7}??? {color:1}\n救救我！\n地面一直在往上鼓！"
text.01e8: "你开玩笑的吧。"
text.0222: "{color:7}??? {color:1}\n不，是真的。\n我听到了机器的声音。"
text.029a: "机器？那一定是从\nOgremon的老巢传来的。"
text.0312: "{color:7}??? {color:1}\n你是不是在那里\n做了什么不该做的事？"
text.0386: "我做了很多事。说不定\n是升降机……我回老巢\n去看看。"
text.0442: "{color:7}??? {color:1}\n谢谢。"
