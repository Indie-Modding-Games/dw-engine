text.0020: "欢迎回来，{color:6}{tamer}{color:1}。"
text.004c: "我是Jijimon的记录员。"
text.008a: "我负责记下Jijimon的\n情报，再转告给你。"
text.00e8: "要是不知道该做什么，\n就来问我，\n我会告诉你该去哪里。"
text.0184: "所有的数码兽\n都聚集到城里了。\n真是太感谢你了！"
text.0208: "我把我知道的告诉你吧。\n我想想……"
text.0266: "然后……"
text.0288: "还有……"
text.0300: "森林里有植物数码兽。\n它们离得越近，\n反而越难看见。"
text.03e6: "昆虫型数码兽\n喜欢草木。\n比如城镇周围那种……"
text.04a6: "热带丛林里有一片\n迷宫般的森林，\n有强大的数码兽守着。"
text.0578: "河边有个老前辈\n正在等人。"
text.0616: "有只数码兽\n很喜欢温暖的水边。"
text.06b0: "墓地里有幽灵。\n幽灵很喜欢跟你聊天。"
text.0752: "城里的花坛藏着一个秘密。\n去向一株植物\n打听另一株植物吧。"
text.0828: "古代恐龙地带很危险，\n不过最好还是\n去看一看。"
text.08ec: "全景山里流着熔岩。\n有些数码兽\n就喜欢炎热。"
text.09a4: "把喜欢炎热的数码兽\n带到寒冷的地方\n是违反规矩的，不过……"
text.0a88: "冰冻大地有很多\n愿意跟你走的数码兽。\n往西边去吧。"
text.0b58: "大峡谷的山顶上\n住着一只鸟型数码兽。"
text.0bf8: "大峡谷就像迷宫。\n一旦走进去，\n就很难出来。"
text.0cb0: "齿轮草原有一只\n很喜欢电的\n数码兽。"
text.0d60: "迷雾森林里可能会出现\n一只早起的数码兽。"
text.0e02: "大峡谷里\n有一家数码兽\n开的店。"
text.0ea6: "你也许会遇到一只\n扇一下翅膀就能\n飞越全景山的数码兽。"
text.0f84: "齿轮草原很适合\n飞不高的数码兽。\n你该去那里找找。"
text.104e: "有些数码兽可能听说过你，\n会来向你挑战。"
text.10ee: "冰冻大地有些\n住在洞穴里的数码兽，\n会邀请别人进去。"
text.11be: "等那些勤劳的数码兽\n忙完手上的工作，\n就请它们来城里吧。"
text.12a2: "迷雾森林最适合躲藏。\n引导躲起来的数码兽\n也是你的工作。"
text.137c: "等你的名声传开了，\n再回来看看吧。"
text.141e: "冰冻大地的海岸边\n会出现巨大的影子。\n也许是一只数码兽。"
text.14f6: "去帮帮那些\n喜欢收集东西的数码兽。\n去冰冻大地试试吧。"
text.15b6: "全景山的山顶上\n有一只数码兽，见到你\n就会向你挑战。"
text.1694: "下水道这类潮湿的地方\n也有数码兽。\n帮它们解决烦恼吧。"
text.176c: "龙眼湖的另一边\n住着一些昆虫型数码兽。\n去那里钓钓鱼吧。"
text.1832: "机器型数码兽\n坏掉的时候，能很快\n把自己完全修好。"
text.18fa: "要是害怕危险，\n就会迷失目标。"
text.1966: "至少要有一次\n勇气去攀登\n危险的悬崖。"
text.1a36: "留心城里传来的\n任何关于有人\n需要帮助的消息。"
text.1afc: "最近有个坏家伙\n搬进了人很多的地方。\n说不定是……"
text.1be0: "据说地下埋着一块\n古老的石板，\n但得有人把它挖出来。"
text.1ca8: "有只稀有数码兽\n会出现在丛林里，\n向别人挑战。"
text.1d68: "也许有住在树上的\n数码兽，谁知道呢？"
text.1e16: "在西边的钢铁之城，\n可能会出现一只\n稀有数码兽向人挑战。"
text.1efa: "有一只外星数码兽。\n你总有一天会遇见他。"
text.1f9e: "有一只神兽型数码兽，\n它就在一间\n失去了主人的房子里。"
text.2076: "你得一直找Nanimon，\n直到拿到\n真正的宝藏为止。"
text.2136: "Myotismon不见了。\n去他的宅邸里\n追寻线索吧。"
text.21f0: "还有一些未知的数码兽，\n不过先完成\n最重要的事吧！"
text.22c4: "最后的数码兽会诞生在\n你最后去的地方。\n你明白吗？"
