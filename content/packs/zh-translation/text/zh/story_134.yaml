text.0092: "沙咔沙咔！"
text.00c0: "咻啊！"
text.00e4: "呱呱！"
text.0104: "不把它们打倒，\n我们就会被打倒。"
text.017a: "鸟脑袋！"
text.0198: "笨脑瓜！"
text.01b4: "傻瓜！"
text.01ca: "木头脑袋！"
text.01ec: "笨蛋，笨蛋！"
text.020a: "书呆子臭味！"
text.022a: "你说什么？！"
text.0254: "气死我了\n不理它们"
text.02de: "它们真讨厌！"
text.034e: "等等，怎么了？"
text.0396: "！"
text.03b4: "我家主人在叫我。\n跟我来吧。呱。"
text.0420: "糟糕！"
text.0440: "哈哈哈，它在虚张声势。\n我才不跟小孩子计较。"
