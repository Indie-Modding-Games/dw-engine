text.0054: "别再胡闹了！"
text.0084: "好啦。我想我\n不会再这样了。"
text.00e2: "我觉得这是\n最后一个房间了。"
text.0156: "{color:7}??? {color:1}\n选哪个？"
text.0198: "这个声音……听起来像\nWaruMonzaemon！"
text.01ec: "大箱子还是小箱子。\n我能看穿你的心思！"
text.0250: "大箱子\n小箱子"
text.0304: "咦？啊啊啊啊！"
text.04a2: "哈哈哈，笨蛋！\n你选错了！"
text.052c: "哦哦哦，被你发现了！\n嘿嘿嘿。紧张吗？"
text.059a: "可恶，有什么好笑的？"
text.05ce: "哇，别激动嘛。\n你今天来干什么？\n想给我干活吗？"
text.0674: "把你抓走的\n朋友还给我们！"
text.06c6: "朋友？你在说什么啊。\n我看起来像是\n会干那种事的人吗？"
text.0768: "像！"
text.077a: "哇，又被你说中了！\n没错，就是我！是我干的！"
text.07ec: "不过你也知道，你是\n要不回去的。\n因为我是WaruMonzaemon。"
text.0878: "既然你这么想，\n那我就硬抢回来！"
text.08d2: "你开玩笑吧？\n就凭你也想打败我？"
text.0930: "我说啊，\n你最好清醒一点，\n面对现实吧！"
text.09e0: "喂，把你抓走的\n朋友还给我。"
text.0a4a: "呃啊啊……怎么会！\n真不敢相信，\n我居然要输了……"
text.0ae2: "快点！"
text.0afa: "好吧……看来\n我也没办法了。给你。"
text.0bd8: "咦？哇——……喂！"
text.0d54: "喂，别再胡闹了，\n适可而止吧！"
text.0dae: "喂，你听不懂玩笑吗？\n给你。就是这个。"
text.0e2c: "这是什么？\n这是个齿轮。"
text.0e6e: "没错，就是它。"
text.0ea4: "这就是那个朋友？？？"
text.0ed6: "我可没拿\n别的东西。真的。"
text.0f32: "那我暂时\n先把这个带回去吧。"
text.0f94: "你！以后不准\n再干坏事了，听到没？！"
text.0ff8: "好啦。我想\n不会再有下次了。"
text.105c: "总觉得不太相信你，\n不过我还有\n一大堆事要处理。"
text.1104: "糟糕，道具太多了。\n得扔掉\n一个才行。"
text.1182: "得到了{color:6}齿轮{color:1}！"
text.11ba: "什么？你是谁？"
text.11e6: "我是谁？你又是谁？！"
text.1292: "得到了{color:4}次元钥匙扣{color:1}！\n可以携带20个道具了。"
text.1354: "得到了{color:4}次元钥匙扣{color:1}！\n可以携带20个道具了。"
