text.0090: "你以为你很了不起啊！"
text.00dc: "我到底哪里得罪你了？！"
text.0156: "{color:7}? ? ? {color:1}\n等一下！"
text.02f0: "我叫Ninjamon！"
text.033a: "你就是{color:6}{tamer}{color:1}？\n那你一定是{color:10}{partner}{color:1}了！"
text.0380: "你们的名声连忍者村\n都传遍了。接受我的\n挑战，和我打一场吧。"
text.041e: "好啊\n改天吧"
text.0454: "哈，那是你的想法！"
text.04e0: "你果然和传闻中\n一样强。请务必\n收我为徒！"
text.0580: "徒弟？呃，我不收徒弟。\n不过你可以帮我们\n建设城镇。"
text.060a: "好的。\n这也是一种修行。\n我会努力的。"
text.076c: "Ninjamon加入了城镇！"
text.07b8: "喂，你！"
text.07d0: "你这话什么意思？\n你怎么会在这儿？"
text.081c: "喂，{color:6}{tamer}{color:1}！"
text.0834: "我想在城里建立\n自己的后宫，\n结果被赶出来了！"
text.08ce: "听说你最近\n混得很不错。\n卖你个好东西吧！"
text.0962: "这可是极其珍贵的\n{color:6}金香蕉{color:1}。"
text.09c0: "售价50000 Bits。\n概不赊账。"
text.0a24: "付钱\n不付"
text.0a76: "笨蛋！你拿的东西太多了！"
text.0abe: "哎呀，我拿的东西太多了！"
text.0afe: "太感谢你了！"
text.0b30: "人类就该用真钱。"
