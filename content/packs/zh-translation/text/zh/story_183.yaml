text.0034: "吧唧，吧唧。"
text.004e: "呃……"
text.0064: "请听我说。"
text.008e: "好吃，好吃。"
text.00b0: "我的手下都不听我的话了。"
text.00f0: "我觉得他们\n记不住我的命令。"
text.014a: "有时候他们\n甚至听不懂。"
text.019a: "我的手下本该\n给我送饭的，可是……"
text.01ea: "好吃……"
text.0202: "我工作的时候他们\n没给我送饭，\n所以我就忘了吃。"
text.0294: "你太埋头于\n工作了。"
text.02e2: "真是太丢人了。"
text.0310: "我觉得宅邸里\n出事了。"
text.0366: "岛上出事了？大家都像\n我的手下一样吗？"
text.03da: "是啊，大家都在\n失去记忆。"
text.042c: "你觉得是有人\n在搞鬼吗？"
text.0478: "嗯……"
text.0488: "我能做什么呢？"
text.04ac: "我们在建一座城镇，\n让数码兽们团结一心。"
text.0512: "我们在旅行，\n寻找伙伴。"
text.055a: "我能做什么？\n我的手下\n只会打架。"
text.05cc: "我不能把他们丢在这里。"
text.0604: "原来如此……"
text.061c: "让我考虑一下。\n真的很抱歉，不过……"
text.067e: "我还会再来的。\n别忘了吃饭哦。"
text.06de: "想参加比赛吗？"
text.0712: "比赛？正好，\n能让我的手下振作起来。"
text.0776: "那么，你要参加吗？"
text.07a8: "要，不过我在这里\n还有研究要做。\n我很快就过去。"
