text.00ac: "我又来了。"
text.00da: "拜拜！"
text.00fa: "再这样下去，\n我们只会原地打转。"
text.0168: "也许我该在这里等着。"
text.01c4: "是谁？"
text.01e0: "不可能。"
text.0206: "啊啊啊！"
text.0228: "等等我！"
text.027a: "又来了！等一下！"
text.02d6: "又来了！等一下！"
text.0332: "又来了！等一下！"
text.038e: "又来了！等一下！"
text.04c6: "也许我该等等。"
text.04ec: "等待\n出发"
text.0524: "好，{color:10}{partner}{color:1}，\n去对付Biyomon！"
text.05aa: "他跑错地方了！"
text.0612: "也许我该等等。"
text.0638: "等待\n出发"
text.0670: "好，{color:10}{partner}{color:1}，\n去对付Biyomon！"
text.06f6: "他跑错地方了！"
text.075c: "也许我该等等。"
text.0782: "等待\n出发"
text.07ba: "好，{color:10}{partner}{color:1}，\n去对付Biyomon！"
text.0840: "他跑错地方了！"
text.08a6: "也许我该等等。"
text.08cc: "等待\n出发"
text.0904: "好，{color:10}{partner}{color:1}，\n去对付Biyomon！"
text.098a: "他跑错地方了！"
text.09ea: "埋伏成功！"
text.0a26: "救命啊！"
text.0a4a: "别慌。我们不是\n坏人。"
text.0aac: "你就是那个有名的\n数码兽绑架犯？"
text.0b02: "我觉得大家\n都误会了。"
text.0b5e: "{color:6}{tamer}{color:1}试着\n说服对方。"
text.0ba0: "原来如此，是我搞错了。"
text.0bd6: "我去城里吧。"
text.0c66: "Biyomon加入了城镇！"
text.0cc4: "来抓我呀！"
text.0cfa: "你真勇敢！"
text.0d2a: "哇！"
text.0d48: "我先来！"
text.0d72: "我很强的。\n你对付不了我！"
text.0dc8: "我赢了你可别生气哦。"
