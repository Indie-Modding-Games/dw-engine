text.0020: "我已经厌倦在这里训练了。\n该怎么办呢？"
text.0082: "该怎么办呢？"
text.00a0: "你在哪里训练？"
text.00da: "那是训练场吗？"
text.0116: "我厌倦训练了。\n我想来场真正的战斗。"
text.0180: "可能是训练场\n可能是竞技场"
text.01ee: "我厌倦训练了。\n我想来场真正的战斗。"
text.0258: "我想去那里。\n我要在那里训练。"
text.02e2: "Kabuterimon加入了城镇！"
text.032a: "昆虫战士大赛\n每年都会在\n这里举行……"
text.03ae: "……日期里有两个2的日子。\n冠军能得到好东西！"
text.0422: "不过只有昆虫型\n数码兽才能参加。"
text.0480: "有Kabuterimon、\nKuragamon、Kunemon，\n还有另一只昆虫型。"
text.0508: "不过，没有Numemon。"
text.052e: "每年在日期有两个2的\n日子，都会举行\n昆虫战士大赛。"
text.05ce: "你以前赢过，对吧？"
text.060a: "有Kabuterimon、\nKuragamon、Kunemon，\n还有另一只昆虫型。"
text.0692: "那是HerculesKabuterimon。"
text.06ce: "Hercules-Kabuterimon\n超级强。"
text.071e: "大赛冠军可以\n变成Hercules-Kabuterimon，\n还能得到道具。"
text.07a6: "昆虫战士大赛\n可以参加很多次。"
text.0824: "你很强。\n我没什么可教你的了。"
text.0886: "我们在研究招式。\n高难度的招式\n很难掌握。"
text.091a: "如果你有能力，\n就能掌握这些招式。\n想学高难度的招式吗？"
text.09c8: "当然！\n不用了"
text.0a06: "那我就试试看。"
text.0a3e: "你的防御不够。\n再多训练吧。"
text.0aa0: "你的速度不够。\n再多训练吧。"
text.0aee: "你的HP不够。\n再多训练吧。"
text.0b2a: "你掌握了一个招式。"
text.0b64: "你掌握了“虫袭”！"
text.0bb4: "{color:5}训练：推岩石 {color:1}"
text.0bec: "开始\n说明\n退出"
text.0c22: "普通\n奖励挑战\n退出"
text.0c5e: "推动岩石来获得力量。\n能大幅提升\n最大HP。"
text.0ce4: "再听一次说明\n开始\n退出"
text.0d3e: "{color:7}Slot game {color:1}\n用{color:6}△ {color:1}\n对齐三个图案。"
text.0dc0: "{color:5}训练：击打 {color:1}"
text.0df0: "开始\n说明\n退出"
text.0e28: "普通\n奖励挑战\n退出"
text.0e66: "用木头人全力击打。\n能大幅提升\n攻击。"
text.0efc: "再听一次说明\n开始\n退出"
text.0f56: "{color:7}slot game {color:1}\n用{color:6}△ {color:1}\n对齐三个图案。"
