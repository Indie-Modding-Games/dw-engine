text.0050: "他来了！成功了！"
text.0094: "是人类。\n和你说的一样，Jiji。"
text.00e8: "嗯……"
text.0102: "嘘，他要起来了。"
text.0140: "咦？我在哪里？"
text.0170: "欢迎来到数码兽世界！"
text.01ae: "什么？"
text.01d0: "哇啊！"
text.01ec: "怎么了？"
text.0220: "你们是谁？"
text.0266: "我们是数码兽。"
text.0296: "数码……什么？"
text.02c0: "咦？我还以为你\n知道数码兽呢。"
text.0320: "我懂了，这是在做梦。"
text.0364: "这不是梦。"
text.039a: "等等，你是Tokomon。\n这梦也太真实了。"
text.0412: "{color:6}{tamer}{color:1}，这不是\n梦，但也不是\n现实。"
text.048a: "你在说什么？\n你是谁？"
text.04ea: "我是Jijimon。"
text.0514: "我不知道有叫\n这个名字的数码兽。"
text.0576: "数码兽比你知道的\n还要多得多。\n这里是数码兽世界。"
text.0600: "数码兽世界？！"
text.0636: "这个世界既不是\n梦，也不是现实。\n是我们的世界。"
text.06b8: "天哪……这也太真实了，\n不像是梦。"
text.071e: "看看你身后，\n你就明白了。"
text.077a: "什么？"
text.07b6: "这是{color:10}{partner}{color:1}吗？"
text.07e2: "我想起来了！我被吸进了\n那个数码兽钥匙扣里。"
text.0864: "没错。"
text.0892: "我为什么会在这里？"
text.08be: "来我家吧，\n我来给你解释。"
text.0a62: "我把你请到这里，\n是为了拯救我们。"
text.0aaa: "从什么危机里拯救你们？"
text.0ae0: "我们在文件城，\n这里是文件岛的中心。"
text.0b58: "城镇？在这里？"
text.0b86: "嗯，以前是座城镇。\n以前这里住着\n各种各样的数码兽。"
text.0c2e: "数码兽们渐渐失去了心，\n搬离了城镇。"
text.0ca6: "什么意思？"
text.0cdc: "我也不清楚是什么原因。\n数码兽们开始\n失去说话的能力。"
text.0d84: "有些还能说话，但大家\n都忘了自己\n曾经住在这里。"
text.0e14: "原来这就是你说的\n失去了心。"
text.0e70: "要是什么都不做，\n就危险了。"
text.0ebc: "可是为什么是我？"
text.0ee2: "你很擅长培育\n数码兽，对吧？"
text.0f3c: "那当然，我很擅长！"
text.0f7c: "你没发现\n你在说数码兽语吗？"
text.0fe6: "咦？怎么可能。我说的是\n普普通通的中文啊。"
text.104e: "在我们听来，就是数码兽语。"
text.10a2: "没错！"
text.10d4: "在这个世界里，你对\n数码兽的爱\n会给你力量。"
text.1158: "谢谢。"
text.1176: "所以我选中了你。\n你能把岛上所有的\n数码兽召集起来！"
text.120a: "什么？"
text.121c: "嗯？"
text.122c: "包在我身上！"
text.126c: "太好了！"
text.1294: "谢谢，你是我们唯一的希望。"
text.12da: "我该从哪里开始？"
text.130c: "带上{color:10}{partner}{color:1}，\n去探索这座岛吧。"
text.1360: "找出这场危机的原因，\n让数码兽们\n回到这里。"
text.13f6: "我们走吧，{color:10}{partner}{color:1}！"
text.1444: "等等，我还没说完呢。"
