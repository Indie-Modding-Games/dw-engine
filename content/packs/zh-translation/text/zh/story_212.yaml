text.0022: "看来{color:10}{partner}{color:1}\n已经消逝了……"
text.0064: "它在消逝之前，\n留下了一颗数码蛋。\n它会带着能力重生。"
text.0116: "你想要哪颗蛋？"
text.0158: "如果你想，可以给\n{color:10}{partner}{color:1}改个名字。"
text.01b0: "取个新名字\n保留原名"
text.0214: "叫{color:10}{partner}{color:1}可以吗？"
text.0234: "换个名字\n就这个"
text.02a0: "喂，可别生病了！"
text.02ce: "靠着仅剩的一点生命，\n{color:10}{partner}{color:1}\n活了下来。"
text.0346: "你要多加小心。"
text.0384: "天哪！\n你是打输了才回来的吧。"
text.03d4: "靠着仅剩的一点生命，\n{color:10}{partner}{color:1}\n活了下来。"
text.044c: "你的东西可能被偷了。"
text.048e: "战斗失败的人，\n东西可能会被偷走。"
text.0502: "被偷的东西可能会在\n某个地方出售。\n不要放弃寻找哦！"
text.059e: "糟了！{color:10}{partner}{color:1}\n已经耗尽了生命。"
text.05de: "在消逝之前，\n{color:10}{partner}{color:1}\n留下了一颗数码蛋。"
text.0646: "由于情况危险，\n数码蛋没能继承\n全部能力……"
text.06d8: "{color:4}驯兽师等级\n下降了！ {color:1}"
text.0726: "如果你想，\n可以把{color:10}{partner}{color:1}\n改成新名字。"
text.0780: "取个新名字\n保留原名"
text.0872: "{color:10}{partner}{color:1}进化了！"
text.08be: "{color:10}{partner}{color:1}进化了！"
text.090a: "{color:10}{partner}{color:1}进化了！"
text.095c: "{color:10}{partner}{color:1}进化了！"
