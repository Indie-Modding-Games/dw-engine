text.0040: "！"
text.0058: "这座岛到底怎么了？"
text.0092: "各个族群四分五裂，\n失去记忆，变得野蛮。"
text.0100: "我不知道自己\n还能保持清醒多久。"
text.0152: "不能就这样放着不管！\n得让他们意识到危险！"
text.021c: "住手！你想\n毁了这座岛吗？！"
text.0278: "你是谁？别挡我的路！\n只有这个办法了！"
text.031c: "你是说\n还有别的办法？"
text.037a: "要是岛毁了，\n那就没有意义了！\n听我说。"
text.03fe: "什么？"
text.0418: "我们正在聚集所有\n数码兽，为这座岛\n建设一座城。"
text.049a: "我听说只要团结数码兽，\n就能让这座岛\n摆脱危机。"
text.0532: "我觉得你说得对，\n可是要聚集所有数码兽，\n那可是……"
text.05cc: "我们现在就在做。\n没有不可能的事！"
text.063e: "那可是个大工程！\n不过我被打动了……\n也许你们能做到。"
text.06c8: "如果你相信我们，\n就来城里吧。"
text.073e: "好吧。我去城里。\n那就是我的新道路！"
text.07f0: "Meramon加入了城镇！"
text.084a: "我就知道你会回来。\n我想知道答案！"
text.08f0: "看来，我输了……"
text.091c: "有件事\n我得告诉你。"
