text.004e: "啊！"
text.006a: "啊！"
text.0096: "是升降机让地面\n升起来了吗？"
text.0102: "进去\n不进去"
text.0190: "喂！"
text.01b0: "什么？"
text.01c0: "你是来认输的吗？"
text.0208: "这是我的台词！"
text.0232: "这次我不会手下留情。\n我要让你哭出来！"
text.02d6: "哇！"
text.02e6: "糟了！"
text.0312: "可恶！"
text.03b6: "怎么了？"
text.0460: "拜拜啦，笨蛋们！"
text.0496: "可恶，让他跑了！"
text.04de: "那里有逃生升降机。\n追上去也没用。"
text.05a8: "你是谁？"
text.05c8: "我是谁？你又是谁？"
text.0672: "得到了{color:4}次元钥匙扣{color:1}！\n可以携带20个道具了！"
text.0722: "得到了{color:4}次元钥匙扣{color:1}！\n可以携带30个道具了！"
