text.0038: "啊，对了！"
text.0050: "要吹响湖之守护者的\n{color:6}蓝色长笛{color:1}吗？"
text.00b6: "吹\n不吹"
text.0188: "朋友，需要帮忙吗？"
text.01ce: "带我去对岸吧。"
text.020e: "没问题。上来吧。"
text.033c: "Seadramon！"
text.0358: "我们又见面了。\n有什么请求吗？"
text.03bc: "和我做朋友\n教我招式\n我想要道具"
text.0444: "我们已经是朋友了。\n还有别的请求吗？"
text.050c: "这、这是……糟了！\n是湖之守护者！"
text.056c: "呃，是的。我是Seadramon。"
text.05a0: "原来一直在这儿钓鱼的\n就是你啊！\n算了。有什么请求吗？"
text.0634: "什么？！难怪大家\n叫你守护者。\n对，我有个请求。"
text.06bc: "和我做朋友\n教我招式\n我想要道具"
text.0738: "好吧，可以。"
text.0754: "从现在起我们就是朋友了。\n这支笛子给你作为证明。"
text.07ec: "糟了！道具太多了。\n得扔掉一些才行。"
text.085e: "得到了湖之守护者的\n{color:6}蓝色长笛{color:1}！"
text.08b4: "在湖边吹响笛子，\n我就会过来，\n带你们去对岸。"
text.095c: "你是说我能去对岸了？\n谢谢！"
text.09bc: "湖的对面有一片\n奇怪的森林。\n你现在就想去吗？"
text.0a5e: "嗯，去吧\n不，下次吧"
text.0aaa: "我来教你一招吧。"
text.0af6: "掌握了“水之魔法”！"
text.0b40: "掌握了“寒冬冲击”！"
text.0b8e: "掌握了“极限冰冻”！"
text.0bcc: "呃，我好像已经\n没有可以教你的\n招式了……"
text.0c5c: "再见！"
text.0ca8: "那么，我就把\n{color:6}水壶{color:1}送给你吧。"
text.0d12: "糟了！道具太多了。\n得扔掉一些才行。"
text.0d84: "好耶，得到了\n{color:6}水壶{color:1}！"
text.0dca: "再见！"
text.0e16: "那么，跳到我背上来吧。"
text.0ece: "回头见。"
