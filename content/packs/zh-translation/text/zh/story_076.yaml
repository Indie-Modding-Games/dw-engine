text.0052: "嗒啊！"
text.0072: "好，看招！"
text.00ae: "唰啊啊！"
text.00d2: "呜轰！"
text.011e: "你是谁？我不会让任何人\n捣乱这个地方！"
text.0194: "别担心。我们只是\n路过这里，\n为了拯救这座岛。"
text.0220: "我不相信你，滚开！"
text.0260: "等一下。"
text.02cc: "你难道是……？"
text.030e: "我就说吧！"
text.0336: "对不起。这里很少\n有客人来，所以我对\n新工作太兴奋了。"
text.03d2: "工作？"
text.03e2: "我在守卫一个叫\n古代恐龙地带的地方。"
text.0448: "那是一片未经探索的地区。"
text.0484: "能带我参观一下吗？"
text.04bc: "古代恐龙地带\n分成两个区域。"
text.0520: "我们住的地方叫\n冰河时代区。"
text.057a: "那是个时间流逝\n很慢的特别地方。"
text.05de: "时间流逝很慢？"
text.0608: "另一个地方是\n疾速时代区。"
text.0656: "那里很危险，而且比\n冰河时代区更远。"
text.06c8: "那里很危险，因为\n时间流逝得非常快。"
text.071c: "那片土地寸草不生，\n到处都是骨头和化石。"
text.0782: "是因为那里的时间\n比别处过得更快吗？"
text.07fc: "没错。别在那里待太久。"
text.083c: "我挡着你的路，\n所以你过不去。"
text.08a4: "你输了。"
text.08c2: "我只是运气不好！\n这种事可不常见。"
text.0918: "是吗？"
text.093c: "我得回家了。\n有问题就去问\n其他数码兽吧。"
