text.0036: "我要抓住你！"
text.0070: "真的吗！"
text.00ce: "你是谁？"
text.00ee: "我是来帮你的\n我还没准备好……"
text.0158: "有谁在那里吗？"
text.018c: "你看不见吗？"
text.01b4: "我是Whamon。\n平时住在海里。"
text.0206: "我没有眼睛，\n但大多数东西都能感觉到。"
text.026c: "我是人类。我叫\n{color:6}{tamer}{color:1}。"
text.02a6: "这是{color:10}{partner}{color:1}，\n我的伙伴，它是{digimon:pstat=103}。"
text.02f6: "我感觉到一股强大的力量。"
text.0330: "你愿意听我说吗？\n这附近的海滩上\n有个我休息的洞窟。"
text.03c8: "可是，有一群坏家伙\n把我赶了出来，\n我重要的宝物也丢在那里了。"
text.046a: "坏家伙啊？\n听起来不太妙。"
text.04bc: "请把它们赶走。\n我想请你帮我\n夺回洞窟。"
text.0540: "我来帮你\n现在帮不了"
text.0592: "我明白了。"
text.05ae: "那就坐到我背上来吧。"
text.06c0: "我们走吧。"
