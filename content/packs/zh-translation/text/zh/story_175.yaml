text.0050: "欢迎来到我的餐厅。"
text.0088: "我决定当\n这家餐厅的\n经理兼主厨。"
text.0104: "尽情享用我的\n火焰料理吧。"
text.0180: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}，\n要不要尝尝\n我的家常菜？"
text.01d6: "这可不是你捡到的道具，\n而是真正的料理。\n是我的隐藏才能哦。"
text.027c: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}！\n我决定靠做菜为生了。\n我的手艺可好了！"
text.02f6: "有空就来我的餐厅\n放松一下，\n吃顿饭吧。"
text.037e: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}。\n我的餐厅\n终于开张了！"
text.03d4: "尝尝冰冻甜点吧！\n这是我的招牌。"
text.044a: "{color:6}{tamer}{color:1}，我决定\n在这家餐厅\n当厨师了。"
text.04c2: "在这里可以吃到\n热腾腾的饭菜。"
text.0520: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}，\n我现在是专业厨师了！"
text.0572: "想尝尝我的手艺，\n最好\n早上来哦！"
text.0614: "{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}！\n我决定靠做菜为生了。\n我的手艺可好了！"
text.068e: "清晨和半夜\n都能吃到\n我的特色料理。"
text.0750: "嘿，{color:6}{tamer}{color:1}，{color:10}{partner}{color:1}！"
text.0770: "我决定来\n这家餐厅帮忙。\n他们让我做甜点。"
text.07ee: "我对我的甜点\n可是很自豪的。\n一定要尝尝哦！"
text.08a8: "哇！嘿，{color:6}{tamer}{color:1}！\n这台机器是干什么的？"
text.08fa: "别害怕！这是\n让我心跳加速的\n点唱机！好耶！"
text.098a: "你也跳起来吧！\n来嘛，放开点！\n我等着你点菜呢！"
