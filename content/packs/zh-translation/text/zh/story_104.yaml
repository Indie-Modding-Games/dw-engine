text.0020: "我想打败Kabuterimon。\n要怎样才能赢呢？"
text.0098: "嗯。你得变得更强才行。\n其实有个必胜的办法……\n算了，你加油吧。"
text.015e: "原来如此。好，我去训练。"
text.019e: "真的吗？！那我来训练你！"
text.01e8: "你来城里就行了。"
text.0220: "……"
text.022c: "你人真好。\n我去城里吧。"
text.02bc: "Kuwagamon去城里了！"
text.0304: "什么嘛，你真不够意思。\n太让我失望了！"
text.0368: "喂，你参加过那个\n昆虫大赛吧？"
text.03d8: "好吧，我教你\n一件有用的事。"
text.042a: "你知道Kunemon在哪里睡觉吗？\n在原生森林吗？"
text.0496: "幼小的数码兽在那里睡觉。\n醒来以后，\n就会变成Kunemon。"
text.051e: "不过有时候也不会变。\n这全凭运气。"
text.05a8: "喂，你参加过那个\n昆虫大赛吧？"
text.0618: "呃……就你现在这样，\n是赢不了的。"
text.0676: "好吧，我教你\n一件有用的事。"
text.06c8: "你知道Kunemon在哪里睡觉吗？\n就在原生森林。"
text.0734: "幼小的数码兽在那里睡觉。\n醒来以后，\n就会变成Kunemon。"
text.07bc: "不过有时候也不会变。\n这全凭运气。"
text.0826: "喂，你想参加\n昆虫大赛吗？"
text.0890: "那是什么？"
text.08b0: "要在22日10点之前\n报名哦。"
text.0924: "啊？？？"
text.0938: "详细情况\n比赛当天会告诉你。"
text.099c: "他到底在说什么啊？"
text.09ea: "我们要努力训练，\n但也要好好休息。"
text.0a42: "我们休息一个小时吧？"
text.0a7e: "休息吧\n不休息"
text.0ae0: "{color:5}训练：\n重锤机 {color:1}"
text.0b1e: "开始\n说明\n退出"
text.0b56: "普通\n奖励挑战\n退出"
text.0ba0: "挨重锤机的打\n能让你变强。\n可以提升防御。"
text.0c3e: "再听一次说明\n开始\n退出"
text.0c98: "{color:7}Slot Game {color:1}\n用{color:6}△ \n对齐三个图案。"
text.0d22: "{color:5}训练：跑步机 {color:1}"
text.0d54: "开始\n说明\n退出"
text.0d8c: "普通\n奖励挑战\n退出"
text.0dd6: "朝着传送带转动的\n反方向跑。\n可以提升速度。"
text.0e5a: "再听一次说明\n开始\n退出"
text.0eb4: "{color:7}Slot Game {color:1}\n用{color:6}△ {color:1}\n对齐三个图案。"
