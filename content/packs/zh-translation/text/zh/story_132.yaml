text.0028: "这是哪里？\n是在做梦吗？"
text.008c: "哇！你是谁？\n{color:10}{partner}{color:1}在哪里？"
text.00e2: "冷静点。我叫Frigimon。\n这里是我家。\n我是冰雪数码兽。"
text.017c: "你在雪地里昏过去了。\n是我把你捡回来，\n照顾你的。"
text.0218: "啊，{color:10}{partner}{color:1}。\n你没事就好！"
text.025c: "喂，你在听吗？\n要不是我发现了你，\n你早就没命了！"
text.02f6: "啊，抱歉。真是谢谢你。"
text.033e: "喂，{color:10}{partner}{color:1}，\n你突然倒下的时候，\n我连头都撞到了。"
text.03be: "{digimon:pstat=103}很怕冷。\n你也太乱来了。\n全都是你的错。"
text.0452: "我不知道。\n对不起，{color:10}{partner}{color:1}。"
text.049e: "谢谢你，Frigimon。\n我能再拜托你一件事吗？"
text.0504: "{digimon:pstat=103}要是再倒下，\n你打算怎么办？\n你还是快点回家吧！"
text.058e: "好，我知道了。\n我会让{color:10}{partner}{color:1}\n进化成别的数码兽。"
text.062c: "进化？"
text.06c8: "又见面了。"
text.06e8: "之前那只数码兽\n怎么了？"
text.0732: "哦，就是同一只。"
text.076a: "咦？是这样吗？\n我搞不懂。"
text.07bc: "我来是有事要拜托你。\n我想请你\n来城里。"
text.0850: "那对我有什么好处？\n有什么好玩的吗？"
text.08b6: "这个嘛，你可以开\n任何你想开的店。"
text.0914: "哇，我一直都想开店。\n好，我去！"
text.0980: "好，听起来不错。\n那我们现在就走吧。"
text.09d8: "开店！刨冰和冰淇淋。\n一定会\n很棒的！"
text.0a94: "Frigimon加入了城镇！"
text.0ad6: "那只数码兽\n很怕冷的！"
text.0b36: "我还会回来的！"
