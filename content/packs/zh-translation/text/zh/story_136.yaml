text.014c: "后面传来了说话声。\n这个声音是……！"
text.01f6: "等一下！"
text.0208: "我凭什么要等？！"
text.023e: "哈哈哈！"
text.02bc: "哇，吓我一跳！"
text.02ee: "Whamon，干得好！哇！"
text.033e: "投降吧！"
text.0364: "呃啊！"
text.0378: "来城里干活，\n好好赎罪吧。"
text.03ec: "好吧，知道了。\n我去城里。"
text.0452: "哈哈哈，开玩笑的！拜拜。"
text.08fa: "可恶，被它骗了！"
text.092a: "算了，洞窟夺回来了。\n应该没问题吧。"
text.099a: "我觉得这个洞窟没事了。"
text.09da: "你真是个好人。\n它们总有一天\n会明白自己错了。"
text.0a8a: "我把宝物送给你。\n就在里面。"
text.0aea: "等等，等等。\n那是你的宝物吧？\n我不能收。"
text.0b68: "不，我不需要了。\n我想去你们的城里。"
text.0bce: "那我们夺回这个洞窟\n是为了什么？\n白忙一场……？"
text.0c56: "抱歉，不过现在\n我真的很想帮你。"
text.0cb8: "这样啊。谢谢你。\n你真是个好人。"
text.0d04: "我这就直接去城里。\n你想的话，\n我可以载你一程。"
text.0d92: "Whamon加入了城镇！"
text.0dd4: "要回城里吗？"
text.0e0a: "回去\n不回去"
