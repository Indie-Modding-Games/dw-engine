text.0010: "你想要哪种店？"
text.004c: "诊所\n寻宝猎人\n占卜师"
text.00aa: "我把这里改成医院了。"
text.0100: "他身体不舒服，\n对吧？你得好好\n照顾他的健康！"
text.018c: "我马上给他治疗。\n费用给你打折，\n只收300 Bits。"
text.0242: "你的Bits不够？！\n那就有多少付多少吧。\n平时要多存点钱哦。"
text.02f6: "现在已经没事了。\n以后要多加小心。"
text.0364: "他看起来没生病也没受伤。\n你需要什么？"
text.03d0: "帮他检查\n卖我药品\n没事"
text.042c: "好，让我看看\n{color:10}{partner}{color:1}的状况。"
text.048a: "糟了，{color:10}{partner}{color:1}的疲劳\n已经到了非常危险的程度。\n他必须马上休息！"
text.0540: "{color:10}{partner}{color:1}太疲劳了。\n趁还来得及，\n快让他休息吧。"
text.05da: "{color:10}{partner}{color:1}好像有点累了。\n别让他太勉强自己。"
text.0664: "{color:10}{partner}{color:1}没事，不过\n疲劳会带来各种坏处。\n要多加小心。"
text.06fe: "那么，他心情怎么样呢？"
text.0742: "{color:10}{partner}{color:1}的心情\n放松到了极点。\n他会活得很长久。"
text.07da: "{color:10}{partner}{color:1}的精神状态\n非常好。这说明\n他的生活很健康。"
text.0880: "{color:10}{partner}{color:1}看起来\n非常放松。是遇到\n什么好事了吗？"
text.0918: "我看{color:10}{partner}{color:1}没什么\n压力，算是正常吧。"
text.09be: "{color:10}{partner}{color:1}好像有点压力。\n训练时悠着点。"
text.0a40: "{color:10}{partner}{color:1}压力太大了。\n他需要玩一玩。"
text.0aac: "{color:10}{partner}{color:1}压力太大，\n一点也不开心。\n别让他太勉强自己。"
text.0b4e: "{color:10}{partner}{color:1}压力太大了！\n再这样下去，\n他会活不长的！"
text.0be4: "嗯……我能为{color:10}{partner}{color:1}\n做的就只有这些了。"
text.0c40: "你还有什么\n需要我帮忙的吗？"
text.0c8e: "帮他检查\n卖我药品\n没事"
text.0cee: "嗯，他应该没事了。"
text.0d26: "绷带: 400 Bits\n药品: 1200 Bits\n什么都不买"
text.0dca: "他身体不舒服的时候，\n马上来找我。"
text.0e50: "你带的东西太多了。"
text.0ea8: "你的Bits不够。\n我不能卖给你。"
text.0f28: "你带的东西太多了。"
text.0f80: "你的Bits不够。\n我不能卖给你。"
text.0fee: "你还有什么\n需要我帮忙的吗？"
text.103c: "帮他检查\n卖我药品\n没事"
text.109c: "我改行当\n寻宝猎人了。"
text.1112: "你要委托我寻宝吗？\n还是想听听说明？"
text.11ac: "听听说明\n不用说明\n算了"
text.121c: "有两种方案，\n时间和价格都不一样。"
text.128e: "普通: 3天，1000 Bits\n特别: 10天，5000 Bits"
text.130a: "选特别方案的话，\n找到好宝贝的机会更大。"
text.139e: "大概就是这样。\n那么，你想怎么做？"
text.13fe: "再说一遍\n去寻宝\n没事"
text.145a: "选一个方案吧！"
text.147e: "普通: 3天，1000 Bits\n特别: 10天，5000 Bits\n取消"
text.1518: "好吧，再见。"
text.1564: "好，3天后就有结果。\n祝我好运吧。"
text.1602: "好，3天后就有结果。\n祝我好运吧。"
text.1680: "你的Bits不够。\n寻宝可是要花钱的。"
text.1734: "{color:7}Sign {color:1}\n我正在外出寻宝。\n请稍等一阵子。\n——Drimogemon"
text.17d6: "告诉你哦，\n我们找到宝贝了。"
text.1976: "先腾出包里的空间吧！"
text.19aa: "得到了{color:6}{item:pstat=110}{color:1}！"
text.1af2: "谢谢惠顾！"
