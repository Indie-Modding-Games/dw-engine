text.003e: "！！！"
text.006c: "是蛋！"
text.0080: "难道是Machinedramon的？"
text.00c8: "可能要出事了！"
text.015e: "Digitamamon加入了城镇！"
text.01b8: "！"
text.01e2: "他在那里！找到他了！"
text.022a: "你就是头目！"
text.0252: "幸会。\n我是Analogman。"
text.029a: "你的事我全知道，\n但没想到你是个孩子。"
text.030e: "真不敢相信，一直破坏\n我计划的竟是个孩子。"
text.0378: "我差一点就能统治\n网络世界了。"
text.03ce: "你是大人啊！快住手，\n你在伤害大家。"
text.0442: "我才不在乎\n会不会伤害数码兽。"
text.049a: "数码兽就该像奴隶\n一样服从人类。"
text.04fa: "你错了！数码兽\n有心也有思想！\n我们是朋友！"
text.0578: "我们来打一场，看看是\n奴隶强还是朋友强。"
text.060c: "该你上了，Machinedramon！"
text.0698: "我们成功了，{color:10}{partner}{color:1}！"
text.06e0: "不可能！\n我最强的奴隶！"
text.0736: "你看，你错了吧！"
text.0772: "哇，哇……"
text.07b4: "只要你不再打扰这座岛，\n并请求原谅，\n大家会原谅你的。"
text.0854: "我就不该相信\n数码兽。我自己来。"
text.08e2: "你要干什么？！"
text.0926: "{color:7}Analogman {color:1}\n我要把这座岛炸掉，\n然后逃到另一个世界。\n真遗憾啊，小鬼！"
text.0a12: "不——！！"
text.0a3c: "{color:7}Analogman {color:1}\n这下你完蛋了！"
text.0a86: "对不起，大家。\n我已经无能为力了。"
text.0af0: "{color:7}??? {color:1}\n没关系的。"
text.0b30: "咦？"
text.0b56: "{color:7}Analogman {color:1}\n传送不了！\n程序出了问题。\n到底怎么回事？！"
text.0c18: "我听见大家的声音了！\n是谁在那里？"
text.0c7e: "{color:7}Jijimon {color:1}\n我们现在正把能量\n传送给你。"
text.0cee: "{color:7}Tokomon {color:1}\n你听得见我们的声音吗？"
text.0d3c: "{color:7}Agumon {color:1}\n看来我们赶上了！"
text.0d8e: "大家……"
text.0dc4: "{color:7}Analogman {color:1}\n不，这破玩意儿！救命！\n救救我！啊啊啊啊！！！"
text.0ec4: "他不见了！发生了什么？"
text.0efe: "{color:7}Jijimon {color:1}\n我也不知道。不过……"
text.0f4c: "Jijimon？要爆炸了！\n快想想办法！"
text.0fa2: "{color:7}Jijimon {color:1}\n他应该已经到了。"
text.1032: "Airdramon！"
text.104e: "快点，快过来！"
text.10ac: "Analogman消失了。"
text.10d8: "和平又回到了\n文件岛。"
text.1124: "然后……"
