text.0122: "我要赢！"
text.0150: "别过来！走开！"
text.0194: "这下我真的生气了！"
text.01d0: "你打我，我就打回去！"
text.0214: "有本事就来试试！"
text.02f4: "哦，是你啊，{color:6}{tamer}{color:1}。\n桥已经修好了。"
text.0348: "听说你在建设城镇。"
text.0386: "我有个请求。\n希望你像我帮你那样\n也帮帮我。"
text.040a: "？"
text.0414: "建设城镇就是\n拯救这座岛。\n大家都会得救。"
text.04a2: "意思是你愿意\n来城里了？"
text.04fc: "嗯。我会去你的城里。"
text.0596: "Coelamon加入了城镇！"
text.06b0: "喂，你是人类吗？"
text.06dc: "我是Coelamon，\n鱼型数码兽。\n你是来找我的吗？"
text.0758: "是啊，找你好久了\n你这么一说倒也是"
text.07d0: "哈哈，是吗！"
text.080c: "你想要什么，\n我已经知道了。"
text.084e: "上游的桥坏了，\n你们想过河，\n对吧？"
text.08f2: "原来如此。\n好，我来帮你们。"
text.093c: "啊哈，你又来了。"
text.0a0a: "来，踩着我们的头过去吧。\n别担心。"
text.0a7a: "好，出发吧！"
text.0b94: "这个世界需要更多的\n合作。后会有期。"
