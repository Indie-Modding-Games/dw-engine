text.0062: "走开！"
text.008a: "滚开！"
text.00b2: "这是我的！"
text.00dc: "我拿到了！"
text.0114: "{color:7}? ? ? {color:1}\n……"
text.013c: "{color:7}? ? ? {color:1}……是花。"
text.0172: "{color:7}? ? ? {color:1}\n我是一朵花。"
text.01ae: "{color:7}? ? ? {color:1}\n我说了我是一朵花！\n你没在听吗？！"
text.0262: "我讨厌打架。"
text.028e: "既然这样，\n就来城里吧。"
text.02d6: "那里很和平。"
text.030a: "城里？"
text.0322: "听起来很有趣。\n我是Palmon。\n我会派上用场的！"
text.03cc: "Palmon加入了城镇！"
