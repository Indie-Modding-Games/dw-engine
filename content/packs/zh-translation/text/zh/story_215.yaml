text.0020: "我的伤已经好了，\n想开始工作了。谢谢你\n一直照顾我。"
text.00b6: "我能预知任何生物的\n未来，这就是\n我要做的事。"
text.013e: "如果你感兴趣，\n欢迎来我的店里看看。\n不收你钱哦。"
text.01d6: "你想知道自己的\n运势吗？\n好，让我看看。"
text.0268: "嗯……哦……哇哦！"
text.029a: "那么，首先……"
text.0320: "总体来说，\n你的运气非常好。"
text.039e: "总体来说，运势相当不错。"
text.0424: "你的总体运势一般。"
text.04a4: "你的总体运势\n不太好。"
text.0532: "总体来说，运势不佳。"
text.059c: "无论做什么，\n都会很顺利。"
text.05ea: "你会遇到一个\n绝佳的机会。"
text.0650: "你可能会经历一件\n难忘的事。"
text.069e: "你可能会发现\n意想不到的东西。"
text.06f0: "你的疑问将会\n得到解答。"
text.073a: "你的钱包会鼓起来。"
text.077e: "你可能会从朋友那里\n听到好消息。"
text.07de: "换换心情\n可能对你有好处。"
text.0838: "试着去一个\n平时不常去的地方吧。"
text.0896: "你可能会做一个\n有趣的梦。"
text.08ea: "尽量不要\n花太多钱。"
text.0936: "你的秘密可能会被揭穿。"
text.097a: "最好早点睡觉。"
text.09ba: "看好你的东西。"
text.09f2: "你的朋友可能会\n拿你出气。"
text.0a5c: "你可能会祸不单行……"
text.0ab8: "你可能会碰到\n不喜欢的人。"
text.0b1c: "你可能会蒙受\n重大损失……"
text.0b76: "你的幸运色是红色。"
text.0bbe: "你的幸运色是白色。"
text.0c0a: "你的幸运色是蓝色。"
text.0c54: "你的幸运色是黑色。"
text.0ca0: "你的幸运色是绿色。"
text.0cec: "你的幸运色是灰色。"
text.0d36: "你的幸运色是棕色。"
text.0d82: "你的幸运色是黄色。"
text.0dd0: "你的幸运色是紫色。"
text.0e1e: "你的幸运色是金色。"
text.0e5c: "最后，关于你和\n{color:10}{partner}{color:1}的\n默契度……"
text.0ece: "你们是天生一对。"
text.0f10: "相当不错。"
text.0f4a: "还可以。"
text.0f72: "马马虎虎。"
text.0fa0: "不算差……"
