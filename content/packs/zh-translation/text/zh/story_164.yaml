text.0438: "{color:1}白 白 白\n{color:2}蓝 蓝 蓝\n{color:3}红 红 红\n{color:4}粉红 {color:5}绿\n{color:6}浅蓝 浅蓝\n{color:7}黄 {color:10}橙\n{color:10}a {color:6}b {color:4}c {color:5}d"
text.051c: "现在是\n{num:pstat=105}月{num:pstat=106}日\n{num:pstat=107}: {num:pstat=108}。"
text.0582: "我是传送先生。\n你想去哪里？"
text.05d6: "近处\n远处\n很远的地方"
text.0620: "全景山山顶\n热带丛林\n钻头隧道"
text.069e: "齿轮草原\n灰色领主宅邸\n大峡谷"
text.070c: "古代恐龙地带：门口\n古代恐龙地带：深处\n未知世界"
text.07b6: "冰壶洞窟前\nSeadra钓鱼\n熔岩洞窟"
text.083e: "寿命三"
text.085a: "我是进化先生。\n你想变成什么？"
text.08bc: "Numemon\nSukamon\nBotamon"
text.0a50: "半死不活\n开场模式\n快进时间"
text.0acc: "快进1小时\n快进6小时\n快进10天"
text.0b76: "要来点肉吗？"
text.0bae: "啊，抱歉。\n我忘了解释了。"
text.0bfa: "这里是肉田。\n我们为大家种肉。"
text.0c60: "肉是在田里种出来的？"
text.0c98: "是啊，有什么问题吗？"
text.0cc4: "没……没什么。\n请继续……"
text.0d20: "我和Jiji决定每天\n给你3块肉，\n{color:6}{tamer}{color:1}。"
text.0da4: "这是今天的肉。"
text.0df6: "你的肉太多了。\n看来你今天\n不需要了。"
text.0e82: "你的肉太多了。\n拿不下的部分\n我就收回了。"
text.0efa: "得到了3块\n{color:6}肉{color:1}！"
text.0f52: "你的道具太多了。"
text.0f8a: "得到了3块\n{color:6}肉{color:1}！"
text.0fea: "肉大丰收啦！\n所以今天给你\n5块肉。"
text.1088: "你的肉太多了。\n看来你今天\n不需要了。"
text.1110: "你的肉太多了。\n拿不下的部分\n我就很乐意收下啦"
text.1192: "得到了5块\n{color:6}肉{color:1}！"
text.11f0: "抱歉，\n你的道具太多了。"
text.1246: "得到了5块\n{color:6}肉{color:1}！"
text.1286: "明天再给你更多。"
text.12d8: "这是今天的肉。"
text.131e: "你的肉太多了。\n看来你今天\n不需要了。"
text.13a6: "你的肉太多了。\n拿不下的部分\n我就很乐意收下啦。"
text.142a: "得到了3块\n{color:6}肉{color:1}！"
text.148a: "你的道具太多了。"
text.14c4: "得到了3块\n{color:6}肉{color:1}！"
text.1506: "明天再给你更多。"
text.154c: "什么？今天已经给过你肉了，\n不记得了吗？"
text.159e: "如果没吃的了，\n就去原生森林\n找找蘑菇吧。"
text.1620: "好，我来给你介绍一下\n这座城市的周边。"
text.1692: "原生森林\n环绕着这座城市。"
text.16da: "那一带的数码兽\n不怎么强。"
text.173a: "西边有一个训练场。\n我想你会\n经常去那里。"
text.17d4: "过了河往东\n就是热带丛林。"
text.1846: "再往前是什么我就不知道了。"
text.1888: "西边有一座山和一个湖，\n那边是\n死路。"
text.1910: "一直往南走，\n就是大海。"
text.196a: "北边还有一座高山。\n那边也是\n死路。"
text.19ee: "这座城市是岛的中心，\n所以北边一定还有\n广阔的地方。"
text.1a9c: "我会去打听\n外面的传闻。\n再来找我问问吧。"
