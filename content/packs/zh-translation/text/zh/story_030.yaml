text.0060: "糟了！挖到一块大石头！"
text.0098: "我钻不过去。"
text.00c6: "钻不过去？糟了！"
text.00f0: "得想办法把它挪开。\n你能做到吗？"
text.0164: "我也不知道。"
text.0192: "{color:10}{partner}{color:1}，\n我需要你的帮忙。"
text.034e: "成功了！"
text.036a: "哇，好大的力气！\n石头挪开了！"
text.03be: "我想从这里往前\n是空的。"
text.041e: "是熔岩河！\n很危险！"
text.0468: "河边有一条路。\n走吧！"
text.04c2: "你要进去吗？\n小心点！"
text.0516: "你要进去吗？\n小心点！"
text.0576: "等{color:10}{partner}{color:1}\n再长大些再来吧。"
