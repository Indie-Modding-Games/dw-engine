text.0030: "尽可能多休息。\n这是让数码兽\n保持健康的关键。"
text.00ca: "好吧。我来告诉你\n这座城市会怎样\n发展繁荣……"
text.014c: "每有一只成长期数码兽\n来到城里，\n繁荣度就加1点。"
text.01cc: "每有一只成熟期\n数码兽来到城里，\n繁荣度就加2点。"
text.025a: "每有一只完全体数码兽\n来到城里，\n繁荣度就加3点。"
text.02da: "不过，有三只\n成熟期数码兽\n不怎么派得上用场。"
text.0366: "它们来的时候，\n只能加1点。"
text.03de: "我来跟你讲讲\n关于类型的事。"
text.0436: "如果对手和你的伙伴\n数码兽是同一类型，\n他可能就不跟你打了。"
text.04d2: "如果你的数码兽类型\n不合，进门时\n可能会被拒绝。"
text.056c: "除此之外，大概\n不用太在意\n这件事。"
text.05f2: "我来跟你讲讲\n驯兽师等级。"
text.063c: "如果你能把数码兽\n培育成完全体，\n驯兽师等级就会提升。"
text.06d0: "在高级别的大赛中\n夺得冠军\n也很有帮助。"
text.075c: "等级会自然而然地提升。\n你不用太\n担心这件事。"
text.07e8: "另一方面，\n你得注意\n别让它下降。"
text.0874: "如果你的数码兽消失了，\n驯兽师等级\n一定会下降。"
text.0900: "如果你经常出现\n照顾失误，等级\n可能会下降。要小心。"
