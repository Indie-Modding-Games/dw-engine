text.0048: "咕噜。"
text.005a: "咕噜……噜……噜……"
text.007e: "有什么东西复活了！"
text.00ce: " ？ "
text.00dc: "我以前住在城里。\n你身上有城里的味道。"
text.0156: "哇！"
text.0166: "好可怕。我离开城镇以后\n就失去了记忆。"
text.01ca: "不过多亏了你，\n我现在全都想起来了。"
text.022a: "我要回城里去，\n可以吗？"
text.0274: "当然。我想城里\n现在一定比以前\n更热闹了。"
text.02f8: "真的吗？太好了！\n我会努力的！"
text.037c: "Betamon加入了城镇！"
text.03c2: "这里是我的地盘！"
text.0402: "嘿嘿嘿。好啊！"
text.043c: "你就等着瞧吧！"
