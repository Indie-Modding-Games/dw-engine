text.0060: "这里是数码兽卡片店。"
text.00a0: "数码兽卡片是什么？"
text.00d4: "大家都在收集。\n有了它们绝对不吃亏。"
text.0146: "哦？"
text.0158: "第一张免费送你。\n是张好卡哦。"
text.01ca: "喂！这张卡上画的是我！"
text.0206: "得到了{color:6}{tamer}{color:1}的卡片！"
text.0236: "这里是数码兽卡片店。"
text.027e: "今天进了\n很酷的卡片哦。"
text.02da: "买卡片\n卖卡片\n退出"
text.0348: "买一包3张\n买1张\n退出"
text.03a0: "买1张\n退出"
text.03cc: "一包500 Bits。\n里面是什么全凭运气。"
text.0442: "买了\n不用了"
text.0488: "马上打开卡包吧。"
text.04e8: "还想要别的吗？"
text.0526: "欢迎再来。"
text.0552: "这里是回收品商店。"
text.0594: "我要普通道具\n我要回收道具\n下次吧"
text.0676: "喂？！"
text.0690: "这是商店！"
