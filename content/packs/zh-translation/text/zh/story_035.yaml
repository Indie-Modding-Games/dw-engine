text.009a: "哈！你害怕了。"
text.00d4: "你还是回家去吧！"
text.0114: "一旦进去，\n就再也出不来了。"
text.0170: "嘿，嘿！"
text.0198: "等一下。"
text.01b8: "你会被附身的。"
text.0202: "巴可-巴可？"
text.0226: "他好像在\n问什么东西。"
text.0272: "？……是\n？……否"
text.02a8: "巴可！巴可巴可？"
text.02d6: "是\n否"
text.0300: "巴可——……巴可巴可？"
text.0338: "是\n否"
text.035e: "巴可巴可！\n巴可——巴可巴可——！"
text.03e8: "Bakemon加入了城镇！"
text.0422: "我想应该成功了。"
text.046e: "难道我惹他生气了？"
text.04ea: "被一股奇怪的\n黑色力量挡住了！"
text.0556: "什么？！我的腿……"
