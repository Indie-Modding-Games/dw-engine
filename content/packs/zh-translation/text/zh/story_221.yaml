text.001e: "{color:6}{tamer}{color:1}，你做到了！"
text.0044: "Agumon来到了城里，\n在那边做起了生意。"
text.00be: "希望有更多数码兽\n能像他一样！"
text.012c: "Palmon来了，\n打算扩大肉田。"
text.019c: "这样我们就能吃到很多肉了！"
text.01f4: "Kunemon来了，\n说想吃草。"
text.024e: "希望他能把杂草吃掉！"
text.02a2: "Centarumon来了，\n打算开一家诊所。"
text.0310: "再也不用担心\n生病和受伤了！"
text.0386: "Coelamon来了，\n想开一家店。"
text.03ec: "城镇会繁荣起来的！"
text.0438: "Betamon来了，\n说想开一家店。"
text.04a8: "城镇会繁荣起来的！"
text.04f4: "Bakemon来了，\n说了些我听不懂的话。"
text.056c: "嗯，算了，没关系。"
text.05b6: "Vegiemon来了，\n打算进一步扩大肉田。"
text.0632: "再也不用为吃的发愁了。"
text.0686: "Tyrannomon来了，\n说他的厨艺是最棒的。"
text.06f8: "嗯，确实有它的魅力。"
text.0746: "Meramon来了，\n说他是火焰的首领。"
text.07c0: "他浑身燃烧着干劲！"
text.0816: "Frigimon来了，\n说了些关于零食的事。"
text.0882: "我最喜欢零食了。"
text.08bc: "Garurumon来了，\n说他会做菜。"
text.091e: "他的手艺挺不错的。"
text.0964: "Birdramon来了，\n说要当信使。"
text.09c4: "听起来不错。"
text.09fa: "Shellmon来了，\n说要做告示板。"
text.0a70: "向信息社会\n迈出了一步！"
text.0ada: "Elecmon来了，\n要给城里通上电。"
text.0b46: "希望城里能变得亮堂堂的。"
text.0b9c: "Kokatorimon来了，\n说要造一座雕像。"
text.0c10: "一个能让人放松的地方。"
text.0c66: "Monochromon来了，\n说想当\n道具店的店长。{stop}"
text.0d08: "他可是专业的。"
text.0d4e: "Unimon来了，\n说想在生意上帮忙。"
text.0dc4: "态度很好嘛。"
text.0e12: "Patamon来了，\n问有没有有趣的工作。"
text.0e78: "我推荐了道具店。"
text.0ec8: "Biyomon来了，\n问我推荐什么工作。"
text.0f3c: "我推荐了道具店。"
text.0f8c: "Greymon来了，\n说要建一座竞技场。"
text.0ff2: "我一定要\n去看看。"
text.104c: "Penguinmon来了，\n说要建一座\n冰壶场。"
text.10ca: "城里越来越丰富多彩了。"
text.1120: "Angemon来了，\n说要记录\n大家的对话。"
text.1194: "他就在附近。"
text.11ce: "Drimogemon来了，\n说要把寻宝\n当成正式工作。"
text.1270: "真是个大工程！"
text.12a2: "Gabumon来了，\n说他不知道该做什么，\n很烦恼。"
text.1334: "我让他选一份\n规模大的工作。"
text.13a0: "Ninjamon来了，\n说起了训练的事。"
text.1400: "看到勤奋的人真让人高兴。"
text.145a: "Whamon来了，\n说要来\n充当渡船。"
text.14e0: "太好了！"
text.150a: "Mojyamon来了，\n说要开一家\n杂货店。"
text.1586: "不过总觉得\n有点不对劲。"
text.15f4: "Mamemon来了，\n说要卖珍贵的道具。"
text.166a: "所谓的“珍贵”\n是指什么呢？"
text.16c8: "Numemon来了，\n说要开一家店，\n但这是个秘密。"
text.1752: "现在已经不是秘密了。"
text.17a0: "Kabuterimon来了，\n说起训练和改造的事。"
text.181e: "他是去绿色道馆了吗？"
text.1872: "Kuwagamon来了，\n问Kabuterimon在哪儿。"
text.18d8: "他去哪儿了呢？"
text.1916: "Giromon来了，\n说：“来点歌吧！”"
text.1976: "那就去点首歌吧。"
text.19b8: "Ogremon来了，\n说想让我赏识他的本事。"
text.1a1c: "他两眼放光！"
text.1a66: "Leomon来了，\n问了很多城里的事。"
text.1acc: "看来草原巡逻队\n还在继续啊！"
text.1b40: "Piximon来了，问我：\n“大叔，要不要\n秘密道具？”"
text.1bca: "真让我担心。"
text.1c04: "Etemon来了，\n说要开一家很酷的店。"
text.1c70: "听起来很可疑。"
text.1cb2: "MetalMamemon来了，\n问有没有能和{color:6}{tamer}{color:1}\n一较高下的工作。"
text.1d4e: "他很有好胜心。"
text.1da4: "Vademon来了，\n等等，他来过吗？"
text.1dfc: "我好像想不起来了。"
text.1e4c: "MetalGreymon来了，\n说起当模特的事"
text.1eb2: "真是自以为了不起！"
text.1efc: "Nanimon来了又走了。"
text.1f38: "他现在在哪儿呢？"
text.1f80: "Monzaemon来了，\n或者说是他的外壳\n突然出现了。"
text.2012: "他决定把外壳放在家里。"
text.206e: "Devimon来了，\n说起一件非常奇妙的道具。"
text.20e4: "我想应该很奇妙吧。"
text.2130: "Airdramon已经痊愈，\n说想开始工作了。"
text.219a: "他能恢复正常真是太好了。"
text.21f4: "Digitamamon来了，\n又以光速离开了。"
text.2264: "他还在城里的\n某个地方。"
text.22c4: "SkullGreymon来了，\n说要在竞技场\n参加比赛。"
text.233e: "Myotismon帮我翻译了。"
text.2396: "Andromon来了，\n说很高兴认识大家。"
text.23fa: "他好像不能\n久留。"
