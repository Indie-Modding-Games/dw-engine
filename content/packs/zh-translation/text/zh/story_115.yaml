text.00c8: "欢迎你，年轻人。"
text.0108: "你就是Cherrymon吧？"
text.0144: "是谁啊？"
text.0164: "你找我这个老头子\n有什么事？"
text.01ca: "首先，把雾散掉吧。"
text.0200: "雾这么大，什么都看不见。\n你能把雾散掉吗？"
text.026c: "原来是这样。我明白了。"
text.02a6: "……你做不到吗？"
text.02da: "先听我说几句吧。\n那么……\n该从哪里说起呢？"
text.0364: "如果你知道岛上的\n紧急情况，\n请告诉我吧。"
text.03fa: "原来如此，原来如此。\n紧急情况啊。"
text.043e: "这座岛从八十年前\n大地发生变化之后，\n就开始改变了。"
text.04de: "岛的东北部，\n是在八十年前\n突然出现的。"
text.0574: "从那以后，数码兽们\n开始离开。\n各个种族也分开了。"
text.05fa: "而且每个种族\n都开始说自己的语言。"
text.066a: "它们忘记了\n在城里说的语言……"
text.06d2: "最后，文件城的\n数码兽居民\n几乎全都不见了。"
text.0752: "接着，数码兽们\n开始失去记忆！"
text.07a8: "岛的历史、它们的过去、\n它们的感觉……\n一天比一天糟糕。"
text.0844: "我有件重要的事\n要告诉你，可是\n我也想不起来了。"
text.08e6: "不过，最后一切都会\n汇聚到一起。是某个人\n让事情变成这样的！"
text.097c: "再过一段时间，\n数码兽们就会把紧急情况\n当成理所当然了。"
text.0a08: "能阻止这一切的，\n只有你，以及文件城\n团结数码兽的力量！"
text.0ab8: "把数码兽召集到城里，\n创造奇迹吧。\n奇迹一定会发生的。"
text.0b54: "哎呀，我太激动了。\n呼，该说的都说完了。"
text.0bd4: "那么，把雾散掉吧。"
text.0c20: "我让森林起雾，\n是为了能和你说话。\n哦，还有一件事……"
text.0cd0: "森林里还有\n别人知道\n过去的事。"
text.0d44: "如果可以的话，\n去森林深处找找它们吧。"
text.0dbc: "你又来听\n老头子说话了吗？"
text.0e24: "关于这座岛……\n请训练{color:10}{partner}{color:1}\n没什么"
text.0e98: "我要说的是这些。"
text.0eda: "哦，好吧。"
text.0efe: "{color:5}训练：森林的\n教诲 {color:1}"
text.0f56: "开始\n说明\n退出"
text.0f8e: "普通\n奖励挑战\n退出"
text.0fcc: "Cherrymon会传授你\n很多知识。\n可以大幅提升智慧。"
text.1068: "再听一次说明\n开始\n退出"
text.10c2: "{color:7}Slot game {color:1}\n用{color:6}△ {color:1}\n对齐三个图案。"
text.1138: "哈哈哈。"
