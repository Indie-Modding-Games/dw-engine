text.0020: "那么，你要\n点些什么？"
text.0080: "你想吃什么？"
text.00cc: "喂，你要吃什么？"
text.0110: "红拉面: 400 Bits\n辣咖喱: 1200 Bits\n熔岩火锅: 3500 Bits"
text.01e0: "看来你的\nBits不够。"
text.0246: "{color:10}{partner}{color:1}美美地吃了\n火辣红拉面！"
text.02b4: "攻击提升了1！\n智力提升了1！"
text.0320: "快乐提升了！\n疲劳下降了！"
text.0386: "{color:10}{partner}{color:1}好像\n不饿。"
text.03e0: "看来你的\nBits不够。"
text.0446: "{color:10}{partner}{color:1}美美地吃了\n爆辣咖喱！"
text.04bc: "攻击提升了3！\n智力提升了2！"
text.0532: "快乐提升了！\n疲劳下降了。"
text.0598: "{color:10}{partner}{color:1}好像\n不饿。"
text.05f2: "看来你的\nBits不够。"
text.0658: "{color:10}{partner}{color:1}美美地吃了\n熔岩火锅！"
text.06c4: "攻击提升了5！\n智力提升了3！"
text.073c: "快乐提升了！\n纪律下降了！\n疲劳下降了！"
text.07ce: "{color:10}{partner}{color:1}好像\n不饿。"
text.0814: "欢迎随时再来。"
text.0842: "龙之面: 400 Bits\n恐龙披萨: 1000 Bits\n侏罗纪汉堡: 2500 Bits"
text.091a: "你的Bits不够。"
text.096a: "{color:10}{partner}{color:1}美美地吃了\n野性龙之面。"
text.09e2: "防御提升了1！\n速度提升了1！"
text.0a4c: "快乐提升了！\n疲劳下降了。"
text.0ab2: "{color:10}{partner}{color:1}好像\n不饿。"
text.0b0c: "你的Bits不够。"
text.0b5c: "{color:10}{partner}{color:1}美美地吃了\n恐龙披萨！"
text.0bc8: "防御提升了3！\n速度提升了2！"
text.0c30: "快乐提升了！\n疲劳下降了。"
text.0c96: "{color:10}{partner}{color:1}好像\n不饿。"
text.0cf0: "你的Bits不够。"
text.0d40: "{color:10}{partner}{color:1}美美地吃了\n侏罗纪汉堡！"
text.0db6: "防御提升了5！\n速度提升了3！"
text.0e30: "快乐提升了！\n纪律提升了！\n疲劳下降了。"
text.0ebe: "{color:10}{partner}{color:1}好像\n不饿。"
text.0f04: "哦，已经结束了啊。"
text.0f3a: "T骨牛排: 1000 Bits\nDX牛排: 2500 Bits\n幻影牛排: 5000 Bits"
text.1012: "你的Bits不够。"
text.1062: "{color:10}{partner}{color:1}美美地吃了\nT骨牛排！"
text.10ce: "HP提升了10！\n智力提升了1！"
text.111a: "纪律提升了\n疲劳下降了。"
text.1180: "{color:10}{partner}{color:1}好像\n不饿。"
text.11da: "你的Bits不够。"
text.122a: "{color:10}{partner}{color:1}美美地吃了\nDX牛排！"
text.129c: "HP提升了30！\n智力提升了2！"
text.12fa: "快乐提升了！\n纪律提升了！\n疲劳下降了！"
text.1388: "{color:10}{partner}{color:1}好像\n不饿。"
text.13e2: "你的Bits不够。"
text.1432: "{color:10}{partner}{color:1}美美地吃了\n幻影牛排！"
text.14ae: "HP提升了50！\n智力提升了3！"
text.150a: "快乐提升了！\n纪律提升了！\n疲劳下降了！"
text.1598: "{color:10}{partner}{color:1}好像\n不饿。"
text.15de: "欢迎再来！"
