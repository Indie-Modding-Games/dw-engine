text.0018: "我是数码兽卡片收藏家。"
text.0058: "把Hagurumon、\nToyAgumon和WaruMonzaemon\n给我，我就送你一样东西。"
text.0108: "给他\n不给"
text.0138: "抱歉，我一张都没有。"
text.0176: "给你。这是{color:6}X绷带{color:1}。"
text.01b4: "我的道具太多了。"
text.01f8: "你玩过冰壶吗？"
text.0236: "如果能在比赛中\n拿到10分，\n那你可真了不起。"
text.02c0: "不知道有没有用，\n教你几招钓鱼的诀窍吧。"
text.0338: "首先是钓竿。\n好钓竿能甩得远，\n又够有弹性。"
text.03c0: "然后是鱼饵。\n要记住用哪种鱼饵\n钓到了哪种鱼。"
text.043c: "甩竿的时候，\n按{color:6}△ {color:1}松手，\n就能全力甩出去！"
text.04ce: "关于湖之守护者……\n它每天早上和傍晚\n都会出现。"
