text.0040: "哦，{color:6}{tamer}{color:1}、{color:10}{partner}{color:1}，\n你们来啦。看看这座气派的\n文件城竞技场。很酷吧！"
text.00d0: "很快这里就会挤满\n选手和观众。你也会让\n观众们开心的，对吧？！"
text.0188: "大赛的优胜者能得到\n奖金和奖品。\n你没什么可损失的。"
text.0230: "想了解大赛的详情，\n就去看看那边的机器。"
text.02d0: "对了，幼年期II的\n数码兽不能参赛哦。\n要我帮你看看日程吗？"
text.038c: "对了，幼年期II的\n数码兽不能参赛哦。\n要我帮你看看日程吗？"
text.043c: "你来了，太好了。\n你想参加大赛吗？"
text.04b6: "是\n否\n什么意思？"
text.0520: "你要参加\n明天的比赛，\n对吧？"
text.058a: "你要取消\n报名吗？"
text.05d8: "不，不取消\n是，要取消"
text.0652: "你报名了今天的\n比赛，对吧？\n上午10点起可以进场。"
text.06e8: "你该不会是想\n取消吧？！"
text.0740: "不，不取消\n是，要取消"
text.07aa: "你报名了今天的\n比赛，对吧？\n晚上11点前要进场哦。"
text.0832: "你该不会是想\n取消吧？！"
text.088a: "不，不取消\n是，要取消"
text.08f6: "好吧，我帮你取消了。"
text.0934: "进场后，到了开始时间，\n就从左边的楼梯下去\n参加战斗。"
text.09de: "报名是免费的。\n只能报名今天和\n明天的比赛。"
text.0a8c: "不过，当天的比赛\n必须在上午10点前\n报名。"
text.0b1a: "日程可以提前5天查看，\n看好之后\n再做计划吧。"
text.0bb8: "红色的比赛\n表示你不能参加。"
text.0c32: "不过按Start键\n可以查看比赛内容。"
text.0ca0: "即使是参赛资格\n为“无”的比赛，"
text.0d06: "幼年期II的数码兽\n也不能参加。"
text.0d52: "报名的事就说到这儿。\n你要\n参加吗？"
text.0dd4: "是\n否\n抱歉，再说一遍"
text.0e3c: "喂！你还没有\n报名啊！"
text.0eba: "喂！大赛是\n明天啊！"
text.0f42: "现在进场还太早。\n请等到10点。"
text.0ff4: " \n{color:4}驯兽师等级下降了！{color:1}"
text.10c6: "- D级赛 -\n成长期数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.11c4: "- C级赛 -\n成熟期数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.12c6: "- B级赛 -\n成熟期数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.13c8: "- A级赛 -\n完全体数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.14ca: "- S级赛 -\n最强数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n须赢得A级赛。"
text.15c4: "- R级赛 -\n大混战大赛：\n战术是胜利的关键\n\n4人大混战，共2轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.16f8: "- 版本1杯 -\n限时比赛，决出\n最强的版本1数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本1数码兽。"
text.1834: "- 版本2杯 -\n限时比赛，决出\n最强的版本2数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本2数码兽。"
text.1970: "- 版本3杯 -\n限时比赛，决出\n最强的版本3数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本3数码兽。"
text.1ab8: "- 版本4杯 -\n限时比赛，决出\n最强的版本4数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本4数码兽。"
text.1bfa: "- 版本0杯 -\n限时比赛，决出\n版本1 ? 4以外的\n最强数码兽。\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本1 ? 4以外的数码兽。"
text.1d60: "- 火焰杯 -\n限时比赛，决出\n烈焰数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限火焰属性的数码兽。"
text.1e9a: "- 格斗杯 -\n限时比赛，决出\n格斗竞技之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限好战的数码兽。"
text.1fe4: "- 雷风杯 -\n限时比赛，决出\n大气数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限大气属性的数码兽。"
text.2132: "- 冰霜杯 -\n限时比赛，决出\n冰冷数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限冰属性的数码兽。"
text.2264: "- 自然杯 -\n限时比赛，决出\n自然数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限自然属性的数码兽。"
