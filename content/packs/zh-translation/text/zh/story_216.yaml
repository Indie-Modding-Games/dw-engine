text.0024: "你好，{color:6}{tamer}{color:1}。\n没想到吧！我开了\n一家诊所！"
text.007a: "这里专门治疗疾病和受伤。\n不是免费的，\n但会很便宜。"
text.0130: "你的数码兽看起来\n不太好。你得好好\n照顾它的健康。"
text.01be: "我现在就给它治疗，\n给你打个折。\n300 Bits。"
text.025e: "你的Bits不够？\n那就能付多少付多少吧。"
text.0304: "现在已经没事了。\n以后要多加小心。"
text.038a: "你的数码兽看起来不错。\n你需要什么？"
text.03e6: "消除疲劳\n买药品\n不用了"
text.046c: "{color:10}{partner}{color:1}的疲劳\n非常严重，必须马上休息。"
text.04ec: "{color:10}{partner}{color:1}累了。\n现在该休息了。"
text.0548: "{color:10}{partner}{color:1}好像有点\n累了。别让它\n太勉强。"
text.05c2: "{color:10}{partner}{color:1}没事。\n注意它的疲劳程度。"
text.0634: "它感觉放松些了吗？"
text.066e: "还需要什么吗？"
text.06a0: "再休息一下\n买药品\n不用了"
text.0706: "它应该没事了。"
text.0732: "绷带: 400 Bits\n药品: 1200 Bits\n不买"
text.07c0: "它不舒服的时候，\n就来找我吧。"
text.0826: "如果它还是很累，\n就减少训练，让它\n按时吃饭睡觉。"
text.08c8: "在寒冷或炎热的地方\n待太久的话，\n会生病的。"
text.0958: "绷带只对\n伤势有效。"
text.09b2: "药品可以治疗疾病，\n但不能\n减少疲劳。"
text.0a50: "如果战斗结束时HP很低，\n数码兽就\n容易受伤。"
text.0ae8: "让快乐和疲劳\n保持在良好水平，\n就能长寿。"
text.0b8c: "你的Bits不够。\n我不能卖给你。"
text.0c0e: "你的道具太多了。"
text.0c62: "你的Bits不够。\n我不能卖给你。"
text.0ce4: "你的道具太多了。"
text.0d28: "还需要什么吗？"
text.0d5a: "消除疲劳\n再买些药品\n不用了"
