text.0060: "你来得正是时候！我有件\n大事想拜托你，\n只有你才办得到。"
text.010c: "什么事？"
text.012a: "那和我从Analogman\n和Machinedramon身上\n感受到的邪恶一样。"
text.01a6: "可我不知道\n它是从哪里来的。"
text.01fe: "好，交给我吧！"
text.0236: "谢谢你。对了……"
text.0282: "听说你打败了\nMachinedramon！"
text.02d2: "是啊，可我还是想不通。\n那好像是\nAnalogman的诅咒。"
text.035a: "他的怨念太深了。\n也许现在能迎来和平了。"
text.03ce: "就算Machinedramon回来，\n我们也能再打败他。"
text.0436: "你真值得信赖。这是我的\n一点心意。是在我们的\n肉田里长出来的。"
text.04d8: "哇！是{color:6}连锁瓜{color:1}？"
text.0530: "我的道具太多了。"
text.0570: "那我就收下了，谢谢你！"
text.05c8: "哦，你回来了！\n这件事我没法\n拜托别人。"
text.0648: "好的。你是说\nAnalogman回来了？"
text.0698: "我感受到了他的邪恶，\n可不知道他在哪里。"
text.06fc: "好，交给我吧！\n我会去找到他，\n把事情解决掉。"
text.0780: "哦，谢谢你。对了……"
text.0800: "你醒了啊。真是对不起。"
text.086a: "这台机器是什么？"
text.08a6: "那是{color:4}记忆卡对战\n数据保存机{color:1}。"
text.0914: "用那台机器，\n就能保存你现在的伙伴\n用来对战的数据。"
text.09aa: "你只要按下\n{color:6}△ {color:1}，机器\n就会告诉你该怎么做。"
text.0a4e: "要使用\n{color:4}记忆卡对战\n数据保存机{color:1}吗？"
text.0ace: "是\n否"
text.0b04: "看来Yuramon又\n收集到了新的传闻。"
text.0b78: "听说Yuramon\n知道一些新的传闻。"
text.0bda: "自从我们来了以后，\n城市就开始\n发展变化了。"
text.0c5a: "{color:6}{tamer}{color:1}，你冒险的方式\n跟别人\n完全不一样呢。"
