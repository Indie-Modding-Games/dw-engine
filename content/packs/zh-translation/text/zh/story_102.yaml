text.005a: "很遗憾，你来晚了，\n已经过了报名时间。\n请等明年吧。"
text.00f4: "现在没有大赛。\n我也没什么事可做。"
text.017c: "大赛刚刚结束。\n请等明年吧。"
text.01fc: "你不是昆虫型的。\n不能参加这个大赛。"
text.027c: "你想参加大赛吗？"
text.02c0: "听说明\n不用说明"
text.02fe: "22日有一场\n只限昆虫型\n数码兽参加的大赛。"
text.0390: "现在就可以\n报名参加。"
text.03e6: "不是昆虫型数码兽的话，\n就不能报名\n参加这个大赛。"
text.047a: "赢了就能得到豪华奖品。\n快来报名吧。"
text.04f4: "报名\n不报名"
text.0548: "现在没有大赛。\n我也没什么事可做。"
text.05d0: "大赛刚刚结束。\n请等明年吧。"
text.0632: "你已经报名参加了\n' - {tournament:pstat=3}- '。\n要取消吗？"
text.06bc: "不取消\n取消"
text.0706: "已取消报名。"
text.0726: "你确定要这样做吗？"
text.0764: "报名成功。"
text.07a2: "今天没有大赛。"
text.0806: "没有报名的人\n不能进去。"
text.0886: "还没开放。请在22日\n上午10点到晚上11点\n之间报名。"
text.0950: "真遗憾，大赛已经结束了。\n明年再来吧。"
text.0a10: "真遗憾。\n只能等明年了。"
text.0a60: "参赛奖励，得到了\n{color:6}大块肉{color:1}！"
text.0ac8: "东西太多了。\n扔掉一些吧。"
text.0b30: "冠军奖金：\n5000 Bits。\n得到了冠军奖品\n{color:6}甲虫珍珠{color:1}！"
text.0c00: "东西太多了！"
text.0c52: "亚军奖金：\n2000 Bits！\n得到了亚军奖品\n{color:6}角盔{color:1}！"
text.0d22: "东西太多了！"
text.0d6c: "亚军奖金：\n2000 Bits！\n得到了亚军奖品\n{color:6}剪刀颚{color:1}！"
text.0e32: "东西太多了！"
