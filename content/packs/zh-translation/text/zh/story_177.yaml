text.002a: "我很了解道具哦。"
text.0056: "道具一共有\n128种。"
text.00d0: "其中32种是食物。"
text.00fe: "稀有道具会在某些地区\n自然生长，在别的\n地方就找不到。"
text.018e: "比如说，在原生森林\n可以找到\n蓝苹果。"
text.0204: "这些食物有特殊效果，\n所以吃的时机\n要小心。"
text.02b8: "现在我来讲讲\n进化道具。"
text.030c: "进化道具，顾名思义，\n就是能让数码兽\n进化的道具。"
text.0392: "进化道具\n有很多种类。"
text.0402: "每一种都会让数码兽\n进化成\n不同类型的数码兽。"
text.0494: "比如说，使用\n灰色利爪的话，\n数码兽会变成Greymon。"
text.0528: "进化道具是\n传说中的道具，\n有些是独一无二的。"
text.05b2: "不过有时候，你得不到\n普通进化时\n那样的额外能力加成。"
text.0654: "而且快乐值会下降，\n所以它们并不完美。"
text.06ca: "不过，能进化成\n自己想要的数码兽，\n还是很不错的。"
text.0772: "只有在目标数码兽的\n前一个世代，\n才能用它进化。"
text.081a: "所以要小心哦。"
text.087c: "嘿！朋友们，你们好！"
text.08a4: "这是什么店？\n是我的店？\n买点东西吧。"
text.0942: "看，{color:6}{tamer}{color:1}！我的店\n卖的都是有趣的东西。\n希望你常来哦。"
text.09f6: "这里的东西\n可都不寻常，\n尽管买吧！"
text.0a9c: "嘿，陌生人！我就知道\n你会来的，{color:6}{tamer}{color:1}。\n别那么惊讶嘛。"
text.0b1c: "你能掌握我这些\n道具的用法吗？答案取决于\n你作为驯兽师的能力。"
text.0be2: "我在哪里？\n我喜欢黑暗的地方，\n这家店就很能体现！"
text.0c88: "好啦，{color:6}{tamer}{color:1}，谢谢\n你来。既然来了，\n要不要买点东西？"
text.0d48: "嘿，{color:6}{tamer}{color:1}。你来啦！\n来吧，买点我这些\n超实用的道具。"
text.0dec: "嘿，陌生人！\n我就知道你会来的，{color:6}{tamer}{color:1}。\n别那么惊讶嘛。"
text.0e6c: "你能掌握我这些\n道具的用法吗？答案取决于\n你作为驯兽师的能力。"
