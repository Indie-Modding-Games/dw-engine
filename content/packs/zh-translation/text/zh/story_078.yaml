text.006e: "以前有个想当商人的家伙。\n听说他在某个地方\n开了一家店。"
text.011c: "他比我有用多了。"
text.015c: "为什么这里的时间\n跟其他地方不一样？"
text.01ba: "这地方住起来\n肯定很舒服，不过……"
text.0240: "我一直在天上\n四处观察。"
text.0292: "北边有冰有雪。\n住在那么冷的地方\n简直是疯了。"
text.0332: "我一直在天上\n四处观察。"
text.0384: "西边有一座\n铁做的小城市。"
text.03e6: "不过入口和出口都封住了。\n我可以飞过去。"
text.0460: "我一直在天上\n四处观察。"
text.04b2: "有些数码兽成群结队，\n长着角或爪子。"
text.0522: "听说它们会削木头\n来建造自己的家。"
text.0594: "我一直在天上\n四处观察。"
text.05e6: "西北边有一片\n有建筑物的森林。"
text.0644: "那里非常远。"
text.066e: "我一直在天上\n四处观察。"
text.06c0: "你去过大峡谷的另一边吗？\n那里就像个迷宫。"
text.073a: "我一直在天上\n四处观察。"
text.078c: "我看不到岛的中央。\n只能看到云。"
text.0812: "这个你已经听过了。"
text.0858: "这里的时间很慢。\n在这里待半天，\n相当于外面的一天。"
text.08de: "对想休息的人来说，\n这里再好不过了。"
text.094e: "疾速时代区的时间\n过得很快。\n就在这里再往前。"
text.09d0: "在那里一天\n会过去两天。"
text.0a26: "你的数码兽会长得更快，\n但也会更快消失。"
text.0aaa: "自动贩卖机"
text.0ad0: "会掉出什么呢？\n每次200 Bits？\n要买吗？"
text.0b54: "试试\n取消"
text.0b96: "我的钱不够。"
text.0bec: "掉出了{color:6}肉{color:1}！"
text.0c24: "我的道具太多了。\n得扔掉一些。"
text.0cac: "掉出了一个\n{color:6}小回复药{color:1}！"
text.0d0a: "我的道具太多了。\n得扔掉一些。"
text.0d92: "掉出了一块\n{color:6}牛排{color:1}！"
text.0dce: "我的道具太多了。\n得扔掉一些。"
text.0e56: "掉出了一张\n{color:6}MP软盘{color:1}！"
text.0e9c: "我的道具太多了。\n得扔掉一些。"
