text.0064: "这是最后一个了。"
text.00a2: "我们终于到了！"
text.00e0: "道路畅通了！"
text.0118: "轻松搞定吧。"
text.0154: "这是最后的机会！"
text.019a: "你真的要去吗？"
text.01f0: "好可怕！我浑身\n都在发抖。"
text.023a: "……"
text.0248: "他为什么不攻击我？"
text.0282: "……"
text.0290: "你不用战斗吗？"
text.02c8: "我们得赶快出发了。\n得去试试我们的本事。"
text.0348: "我们走吧，{color:10}{partner}{color:1}！"
text.039c: "……"
text.03de: "我们赢了吗？"
