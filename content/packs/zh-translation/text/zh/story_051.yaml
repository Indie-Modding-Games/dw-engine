text.004e: "我有种不好的预感……"
text.0098: "我就知道你会来！"
text.00e4: "你是谁？"
text.0104: "我是Devimon，黑暗天使。\n我掌握着黑暗之力。"
text.017c: "你知道些什么吗？"
text.01b0: "Myotismon在宅邸里。\n说不定他还活着。"
text.021e: "这是你干的吗？"
text.024a: "我不知道……我只知道\n你是我的敌人。"
text.02c2: "别想逃！"
text.030c: "哈哈哈！"
text.034a: "糟了！"
text.036e: "替我向Myotismon问好吧。"
text.03cc: "他逃走了！\n我讨厌那家伙。"
text.048a: "好大的宅邸啊！"
text.04ca: "有人在家吗？"
text.0500: "是没人在家，\n还是听不见我说话？"
text.0566: "好吧，开始探索！"
text.05be: "使用了\n{color:6}宅邸钥匙{color:1}！"
text.0622: "打不开。\n锁住了。"
text.069a: "使用了\n{color:6}宅邸钥匙{color:1}！"
text.06fe: "打不开。\n锁住了。"
text.0776: "使用了\n{color:6}宅邸钥匙{color:1}！"
text.07da: "打不开。\n锁住了。"
text.0866: "打不开。门被一股\n奇怪的力量封住了。"
