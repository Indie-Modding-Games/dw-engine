text.0084: "嗯，我明白你的意思。"
text.00c8: "你能看出它的美吗？"
text.010c: "呜呃呃呃！！"
text.0136: "我现在豁出去了！"
text.0170: "可恶！唉，算了。"
text.01aa: "我肚子疼。"
text.01e8: "自动贩卖机"
text.0212: "一台有特别奖品的\n自动贩卖机。\n要买点什么吗？"
text.0294: "小回复药: 200 Bits\n便携马桶: 500 Bits\n不买"
text.034c: "我的Bits不够。"
text.039e: "我的Bits不够。"
text.03ea: "我的道具太多了。"
text.041e: "掉出了一个\n{color:6}小回复药{color:1}！"
text.0496: "我的道具太多了。"
text.04ca: "掉出了一个\n{color:6}便携马桶{color:1}！"
text.0528: "好耶，中奖了！"
text.054e: "掉出了一个\n{color:6}双效软盘{color:1}！"
text.05a2: "我的道具太多了。"
text.05de: "MP补给站"
text.05fa: "这台机器能恢复MP吗？"
text.0638: "100 MP: 200 Bits\n1000 MP: 1800 Bits\n不用"
text.06e2: "我们的MP恢复了！"
text.0724: "我的Bits不够。"
text.077a: "我们的MP恢复了！"
text.07bc: "我的Bits不够。"
