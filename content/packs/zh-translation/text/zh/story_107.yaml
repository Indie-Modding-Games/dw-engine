text.006a: "上次地震的时候，\n泥土和沙子都消失了！"
text.00ee: "现在的时间是\n{num:pstat=105}月{num:pstat=106}日\n{num:pstat=107}点{num:pstat=108}分。"
text.016e: "{color:10}{partner}{color:1}是数据种\n数码兽，对吧？"
text.01c6: "{color:10}{partner}{color:1}是疫苗种\n数码兽，对吧？"
text.0224: "{color:10}{partner}{color:1}是病毒种\n数码兽，对吧？"
text.027c: "我能帮上很多忙。\n你想让我做什么？"
text.02f2: "修改它的参数\n让时间变快\n把这里变成商店"
text.038c: "让它变成最强\n让它变成超弱\n让它变得普通"
text.0416: "过1个小时\n过6个小时\n过24个小时"
