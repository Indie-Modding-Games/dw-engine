text.008e: "嗯"
text.00b4: "这好像是个鸟窝。\n你觉得呢？"
text.012e: "我听到了声音。"
text.01bc: "你挺厉害的。"
text.01dc: "原来这是你的窝。"
text.020c: "是啊。"
text.0222: "抱歉，没打招呼就进来了。"
text.026a: "哦，别放在心上。"
text.02a4: "？"
text.02ae: "我听说过你。"
text.02da: "我都不知道我这么有名。"
text.0318: "你可能是岛上\n仅剩的人类了。"
text.0388: "仅剩……？在我之前\n还有别人来过吗？"
text.03e0: "你不邀请我\n去城里吗？"
text.0440: "哦，对了，你要不要\n来城里？"
text.0492: "好。那我们就开始吧。\n抓紧了。"
text.0534: "Birdramon加入了城镇！"
text.066a: "升降机"
text.0682: "按一次下\n按两次下\n不上去"
text.074e: "咦？"
text.075c: "不行。动不了。"
