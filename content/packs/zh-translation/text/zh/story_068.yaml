text.00ce: "哈哈，碰我一下\n就会被电到哦。"
text.016a: "你不想待在这里吗？"
text.01ee: "哇，厉害！他真有胆量。"
text.022c: "你会成大器的！\n好吧，我来帮你。"
text.029a: "能不能把你的电力\n用在城镇上呢？"
text.0300: "城镇？那是什么？\n听着耳熟，可是……"
text.035a: "我来帮忙。我是Elecmon，\n请多关照。"
text.03ec: "Elecmon加入了城镇！"
text.0432: "呜呃！"
text.0454: "啊啊啊！"
text.0474: "你死定了！"
text.04ac: "还不错。"
text.04d2: "你品味真差。"
text.050e: "真嚣张！我来教训你。"
text.057e: "这扇铁门好硬。\n如果打不开，\n我们就进不去。"
