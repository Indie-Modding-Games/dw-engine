text.00e0: "竞技场信息"
text.0108: "战绩\n关于等级大赛\n关于特别大赛"
text.0188: "累计\n夺冠次数 {tourn_won}\n{tourn_wins}胜 {tourn_lost}负"
text.01ea: "等级大赛谁都能参加，\n而且经常举办。"
text.025a: "不过，世代较高的\n数码兽不应该参加\n级别较低的大赛。"
text.02f2: "如果你的数码兽在报名后、\n比赛前进化了，\n就不能参赛了。"
text.039c: "特别大赛有规定的\n参赛条件，\n而且不常举办。"
text.0434: "如果城里的参赛者\n不够多，\n比赛就根本办不成。"
text.04cc: "同一个大赛一年\n只举办一两次。\n记得提前确认日程。"
text.058c: "{color:10}{partner}{color:1}，让我想想\n你的外号……一位\n拯救了世界的英雄。"
text.061c: "我想想。"
text.0648: "叫\n“无敌的{color:10}{partner}{color:1}”怎么样？"
text.0694: "叫\n“传说英雄{color:10}{partner}{color:1}”怎么样？"
text.06e8: "叫\n“伟大的{color:10}{partner}{color:1}”怎么样？"
text.0732: "叫\n“和平使者{color:10}{partner}{color:1}”怎么样？"
text.077e: "叫\n“冠军{color:10}{partner}{color:1}”怎么样？"
text.07c8: "叫\n“勇者{color:10}{partner}{color:1}”怎么样？"
text.0812: "叫\n“酷哥{color:10}{partner}{color:1}”怎么样？"
text.085e: "叫\n“强大的{color:10}{partner}{color:1}”怎么样？"
text.08aa: "叫\n“尊贵的{color:10}{partner}{color:1}”怎么样？"
text.08f2: "叫\n“智多星{color:10}{partner}{color:1}”怎么样？"
text.0946: "喂，那些座位\n是给客人坐的。"
text.0d0e: "- D级赛 -\n成长期数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.0e0c: "- C级赛 -\n成熟期数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.0f0e: "- B级赛 -\n成熟期数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.1010: "- A级赛 -\n完全体数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.1112: "- S级赛 -\n最强数码兽的\n大赛\n\n单挑赛，共3轮，\n8名选手参赛。\n须赢得A级赛。"
text.120c: "- R级赛 -\n大混战大赛：\n战术是胜利的关键\n\n4人大混战，共2轮，\n8名选手参赛。\n参赛资格 ? 无。"
text.1340: "- 版本1杯 -\n限时比赛，决出\n最强的版本1数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本1数码兽。"
text.147c: "- 版本2杯 -\n限时比赛，决出\n最强的版本2数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本2数码兽。"
text.15b8: "- 版本3杯 -\n限时比赛，决出\n最强的版本3数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本3数码兽。"
text.1700: "- 版本4杯 -\n限时比赛，决出\n最强的版本4数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本4数码兽。"
text.1842: "- 版本0杯 -\n限时比赛，决出\n版本1 ? 4以外的\n最强数码兽。\n单挑赛，共3轮，\n8名选手参赛。\n仅限版本1 ? 4以外的数码兽。"
text.19a8: "- 火焰杯 -\n限时比赛，决出\n烈焰数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限火焰属性的数码兽。"
text.1ae2: "- 格斗杯 -\n限时比赛，决出\n格斗竞技之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限好战的数码兽。"
text.1c2c: "- 雷风杯 -\n限时比赛，决出\n大气数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限大气属性的数码兽。"
text.1d7a: "- 冰霜杯 -\n限时比赛，决出\n冰冷数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限冰属性的数码兽。"
text.1eac: "- 自然杯 -\n限时比赛，决出\n自然数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限自然属性的数码兽。"
text.1ff8: "- 金属杯 -\n限时比赛，决出\n机械数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限机械属性的数码兽。"
text.2132: "- 污秽杯 -\n限时比赛，决出\n污秽数码兽之王\n\n单挑赛，共3轮，\n8名选手参赛。\n仅限污秽属性的数码兽。"
text.226a: "- 恐龙杯 -\n限时比赛，参赛者为\n古老血统的数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 --  ? ? ?"
text.239a: "- 羽翼杯 -\n有翅膀的数码兽\n一较高下\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 --  ? ? ?"
text.24ac: "- 动物杯 -\n限时比赛，参赛者为\n野兽血统的数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 --  ? ? ?"
text.25e0: "- 人形杯 -\n限时比赛，参赛者为\n人形数码兽\n\n单挑赛，共3轮，\n8名选手参赛。\n参赛资格 --  ? ? ?"
