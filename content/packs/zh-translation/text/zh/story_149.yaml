text.009a: "没有守卫！"
text.00f8: "你不能从这里过去。"
text.0136: "你不能从这里过去。"
text.01dc: "…………"
text.01f0: "哇，它在盯着我们！\n也许它在\n怀疑我们。"
text.0266: "我们先躲起来等一等，\n再回来吧。\n现在是12点。"
text.030e: "这家工厂一定是\n把废料排进\n下水道。我得查清楚。"
text.03d4: "能让一下吗？"
text.0412: "没有负责人\n发放的许可证，\n你不能从这里过去。"
text.04a8: "我在赶时间。"
text.04ce: "抱歉，你得有\n许可证才行。"
text.051c: "好吧，既然\n是这样的话。"
text.0580: "那么，我们该怎么办？"
text.05b4: "该换班了\n快让我过去\n没什么"
text.0636: "还没到\n换班的时间。"
text.0694: "没关系，别在意。\n什么时候换班？"
text.0704: "不行，我们必须\n严格遵守时间。"
text.075e: "换班时间是\n半夜12点和中午12点。"
text.07bc: "哦，原来如此。"
text.07e2: "威胁我也没用。\n你得去拿许可证。"
text.084a: "许可证？我有啊。\n我准许你了！"
text.08bc: "我们不能给你许可证。\n你得按照\n正规流程办理。"
text.0944: "哇，你们也太死板了！"
text.097c: "还没到换班时间吗？"
text.09b8: "……"
text.09c6: "哇，它在盯着我们！\n看来它不会\n换班的。"
text.0a42: "我们待会儿再来吧。\n也许应该先躲起来\n等一等。"
text.0aca: "啵噼啵噼噗——"
text.0b02: "咯吧咯吧！"
text.0b2c: "噗哔哟？"
text.0b50: "我满意了！"
text.0b82: "这是我工作的一部分。"
text.0bc6: "有什么问题吗？"
