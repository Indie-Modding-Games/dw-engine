text.0034: "喂，要不要跟我比一场？\n你要是赢了，\n我什么都听你的。"
text.00da: "比什么？"
text.0108: "我管它叫……\n数码兽冰壶！\n详细的进去再说。"
text.0186: "嗯，那我输了会怎样？"
text.01c6: "第一次输了没什么。\n不过下次比赛前，\n你得先给我一条鱼。"
text.025c: "那如果我赢了，你就跟我\n去城里。好吗？{stop}\n那就来吧。"
text.02f4: "好吧，没问题。\n我们进去吧。"
text.0384: "喂，要不要跟我比一场？\n给我一条鱼，\n就能跟我比赛。"
text.0426: "我要赢你\n不了"
text.0474: "嘿，兄弟！\n我在这儿建了个溜冰场。"
text.04c2: "一条鱼比一场。\n不过你要是赢了，\n我会给你好奖品。"
text.0554: "喂，伙计，不想跟我\n比一场吗？拿一条鱼\n就能来挑战我。"
text.0606: "来吧\n不了"
text.0642: "切，真没意思。"
text.0676: "给我一条鱼！"
text.06ae: "我现在什么都没有……"
text.0738: "哎呀，给我这个\n可没什么用。"
text.079a: "哇，看起来好好吃。哎呀，\n得先比赛才行。\n我们进去吧。"
text.0842: "拜托，伙计。\n去龙眼湖\n钓条鱼来嘛。"
text.08d6: "抱歉啦，兄弟。\n欢迎再来挑战我。\n别忘了再带条鱼来。"
text.0992: "厉害！满分！\n你该不会是……\n职业选手吧？"
text.0a34: "{color:7}恭喜你！\n你的比赛很精彩，\n这枚奖章送给你！ {color:1}"
text.0ab8: "太厉害了，伙计。\n这是我第一次输。"
text.0b20: "好了，按照约定，\n跟我去城里吧。"
text.0b94: "唉，看来只好去了。\n不过我已经想好\n去城里要做什么了。"
text.0c7a: "Penguinmon加入了城镇！"
text.0cd2: "抱歉啦，兄弟。\n欢迎再来挑战我。\n别忘了带条鱼来。"
text.0d82: "厉害！满分！\n你该不会是……\n职业选手吧？"
text.0e24: "{color:7}恭喜你！\n你的比赛很精彩，\n这枚奖章送给你！ {color:1}"
text.0ea8: "哇，你太厉害了。\n我又输了。"
text.0f00: "唉，没话说了。\n这是你的奖品。"
text.0ff8: "你的道具太多了！"
text.103c: "得到了{color:6}{item:pstat=110}{color:1}！"
text.106a: "嘿，{color:6}{tamer}{color:1}。\n我现在受Penguinmon之托，\n帮忙看店。"
text.10ea: "跟我比一场吧！\n你要是赢了，就把\n我的特别奖品给你。怎么样？"
text.118c: "好，来比吧\n不了"
text.11da: "比赛前\n先把鱼给我。"
text.123e: "哎呀，我现在\n什么都没有。"
text.12da: "给你这个\n也没什么用。"
text.1330: "哼，这次我一定会赢。\n我们进去吧。"
text.13a2: "没有鱼就不能比赛。\n下次再来吧。"
text.1436: "什么？\n你要拒绝我？"
text.1488: "想赢我的话，\n最好动动脑子！\n改天再见啦。"
text.1546: "你居然拿满分赢了我！！\n你是冰壶天才吗？！"
text.15e0: "{color:7}恭喜你！\n你的比赛很精彩，\n这枚奖章送给你！ {color:1}"
text.1664: "你真厉害，{color:6}{tamer}{color:1}！\n这是我答应\n给你的奖品！"
text.17a2: "你的道具太多了。"
text.17e6: "得到了{color:6}{item:pstat=110}{color:1}！"
