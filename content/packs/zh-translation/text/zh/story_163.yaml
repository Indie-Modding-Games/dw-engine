text.034c: "巴克。巴·克咔。"
text.0374: "我还是听不懂他在说什么。"
text.03dc: "原来如此。你是在\n替我们巡逻吗？！"
text.0438: "快看！这是我的\n特制告示板。"
text.048a: "城里需要情报，\n所以我决定办一份\n报纸！你觉得怎么样？"
text.053e: "收集情报的事\n就交给我吧。"
text.059e: "你在看我的报纸呢。"
text.05f0: "啊，好凉快，真舒服。"
text.0630: "只要心情舒畅，\n就会觉得很舒服。"
text.069e: "你觉得我的店怎么样？"
text.06de: "我不擅长做买卖，\n可现在也没有\n别人能做了。"
text.0766: "多带些数码兽来哦！"
text.07c0: "怎么样，你觉得如何？"
text.07f8: "{color:7}Coelamon {color:1}\n我们决定互相帮助，\n一起卖这些道具。"
text.0912: "嗯——我看到一些\n好吃的植物，就吃了。"
text.0986: "我觉得城里的风\n变得太大了。"
text.09ee: "对了，前几天我碰巧\n捡到了一个\n{color:6}快乐蘑菇 {color:1}。"
text.0a6c: "听说那是很稀有的品种。"
text.0aa4: "我还听说有一种\n{color:6}豪华蘑菇{color:1}。\n要是能找到就好了。"
text.0b3e: "原生森林的\n{color:6}蓝苹果 {color:1}\n真的很好吃。"
text.0bb0: "热带丛林的\n{color:6}橙香蕉 {color:1}\n真的很好吃。"
text.0c2c: "全景山的\n{color:6}大莓果 {color:1}\n真的很好吃。"
text.0c98: "齿轮草原的\n{color:6}甜坚果 {color:1}\n真的很好吃。"
text.0d02: "Overdell墓地的\n{color:6}超级蔬菜 {color:1}\n很好吃。"
text.0d70: "古代恐龙墓的\n{color:6}红莓 {color:1}\n很好吃。"
text.0dda: "大峡谷的\n{color:6}仙人掌果 {color:1}\n很好吃。"
text.0e4e: "迷雾森林的\n{color:6}数码菠萝 {color:1}\n很好吃。"
text.0ff6: "我有话要说。"
text.102c: "什么事？\n回头见！"
text.106c: "你看到东桥修好了吗？\n我们可是\n拼了命干的。"
text.10f6: "我们正在修数码兽桥。\n请稍等一阵子。"
text.1166: "听说南边的腔棘岬\n有一只稀有的数码兽。"
text.11e0: "传闻说他每天\n傍晚都会出现。"
text.125c: "喂，你知道吗？\n城市东边\n有一座断掉的桥。"
text.12f0: "我们以为不会有人\n用它，所以就\n一直没管。"
text.138e: "我们在考虑\n自己动手修好它。"
text.13e8: "在那之前，先去西边\n和南边看看吧。\n然后再回来找我。"
text.1496: "你去过Geko沼泽吗？\n那里有调皮的数码兽\n可能会捉弄你。"
text.151c: "记住，数码兽一旦进化，\n它设定好的招式组合\n就会改变。"
text.15ae: "这个嘛……"
text.15d6: "怎么样？我把灯打开了。\n够亮吗？"
text.164e: "让我们的城市\n变得干净又热闹吧！"
text.16a6: "灯光会有\n什么不同吗？"
text.16f0: "这个嘛，全看你\n怎么想了。"
text.1746: "我是最强的。"
text.1780: "我可不觉得我会\n输给你。来竞技场\n你就知道了。"
text.1824: "嘿，{color:6}{tamer}{color:1}。\n我在城里巡逻，\n看有没有可疑的家伙。"
text.18a2: "怎么了？我没有\n打扰到你吧？！"
text.192a: "欢迎光临！\n给你个超值价，\n{color:6}{tamer}{color:1}。"
text.1998: "我不擅长做买卖，\n不过别人也都不擅长。"
text.1a02: "现在由我负责卖东西。\n希望能跟你做生意。"
text.1a74: "{color:6}{tamer}{color:1}，请尽量\n多带些数码兽\n回来。"
text.1b10: "你觉得\n我的店怎么样？"
text.1b50: "我不擅长做买卖，\n可别人也不擅长，\n只好由我来了。"
text.1bcc: "快多带些\n数码兽回来吧。"
text.1c32: "怎么样，你觉得如何？"
text.1c6a: "{color:7}Coelamon {color:1}\n我们决定互相帮助，\n一起卖这些道具。"
