text.00b8: "你是谁？走开！"
text.00f2: "这里是你住的地方吗？"
text.012c: "我不能告诉你！"
text.0156: "你是守卫还是什么？"
text.0198: "想打架？我会打败你的！"
text.01da: "那就打吧\n休想欺负我"
text.025c: "哇！"
text.02c4: "糟了！喂！"
text.02e2: "{color:7}???mon {color:1}\n哈哈哈。"
text.0310: "是谁？"
text.032c: "{color:7}???mon {color:1}\n我可没做什么坏事。\n不准擅自\n闯进我家！"
text.03d2: "看来我该走了。"
text.0418: "继续好好站岗吧！"
text.0452: "你是Ogremon强盗团的！\n这里就是你们的老巢！"
text.04ba: "你在说什么啊？"
text.0500: "上次算你走运！\n快投降吧！"
text.0554: "哇！"
text.05b4: "上次被你骗了，\n这次我可饶不了你。"
text.061a: "你在说什么啊？"
text.0660: "这次你别想逃！"
text.06ac: "好啦，让我进去吧。"
text.06da: "想打架吗？\n我要把你打趴下！"
text.0738: "打吧\n别欺负我"
