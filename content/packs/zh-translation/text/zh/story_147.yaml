text.003c: "你要去哪里？"
text.007a: "等一下！"
text.009a: "嘟噗——！"
text.00c0: "咕呃嘿咿嘻！"
text.00f6: "你是谁？"
text.0114: "我是九十九战不败的\nMetalMamemon！\n你就是我的第一百个对手！"
text.01b0: "我不相信像\n{color:6}{tamer}{color:1}这样的人会逃跑。"
text.0214: "好，来打吧\n抱歉，下次"
text.0294: "你比我想的\n还要厉害。"
text.02d4: "你真是值得一战的对手！"
text.0306: "总有一天我会打败你！"
text.0372: "MetalMamemon加入了城镇！"
text.03c6: "我就知道你会害怕。\n好吧，等你更有胆量了\n我们再见。"
