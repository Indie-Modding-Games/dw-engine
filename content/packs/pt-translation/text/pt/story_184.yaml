text.003e: "!!!"
text.006c: "Um ovo!"
text.0080: "Será que é do Machinedramon?"
text.00c8: "Isso não parece bom!"
text.015e: "Digitamamon entrou\nna cidade!"
text.01b8: "!"
text.01e2: "Ali está ele! Eu o achei!"
text.022a: "Você é o chefe!"
text.0252: "Muito prazer.\nSou o Analogman."
text.029a: "Sei tudo sobre você, mas não\nsabia que era uma criança."
text.030e: "Não acredito que uma criança\nestragou o meu plano."
text.0378: "Eu estava tão perto de\ndominar o Mundo da Rede."
text.03ce: "Você é um adulto! Pare com\nisso, está ferindo todos."
text.0442: "Não me importa se\nestou ferindo Digimon."
text.049a: "Os Digimon devem obedecer\naos humanos como escravos."
text.04fa: "Você está errado! Os Digimon\ntêm coração e mente!\nSomos amigos!"
text.0578: "Vamos lutar para ver o que\né melhor: escravos ou amigos."
text.060c: "Sua vez, Machinedramon!"
text.0698: "Conseguimos, {color:10}{partner}{color:1}!"
text.06e0: "Não pode ser!\nMeu escravo mais poderoso!"
text.0736: "Viu? Você estava errado!"
text.0772: "Ora, ora..."
text.07b4: "Se deixar a ilha em paz\ne pedir perdão,\neles vão te perdoar."
text.0854: "Não devia ter confiado nos\nDigimon. Eu mesmo vou fazer."
text.08e2: "O que você vai fazer?!"
text.0926: "{color:7}Analogman {color:1}\nVou explodir a ilha\ne fugir para outro\nmundo. Que pena, garoto!"
text.0a12: "Ah, nãããão!!"
text.0a3c: "{color:7}Analogman {color:1}\nAgora você está acabado!"
text.0a86: "Desculpem, pessoal. Não há\nmais nada que eu possa fazer."
text.0af0: "{color:7}??? {color:1}\nEstá tudo bem."
text.0b30: "Hã?"
text.0b56: "{color:7}Analogman {color:1}\nNão está transferindo!\nTem algo errado no\nprograma. O que houve?!"
text.0c18: "Estou ouvindo a voz de todos!\nQuem está aí?"
text.0c7e: "{color:7}Jijimon {color:1}\nEstamos mandando nossa\nenergia para você agora."
text.0cee: "{color:7}Tokomon {color:1}\nVocê ouve as nossas vozes?"
text.0d3c: "{color:7}Agumon {color:1}\nParece que chegamos a tempo!"
text.0d8e: "Vocês todos..."
text.0dc4: "{color:7}Analogman {color:1}\nNão, máquina idiota! Socorro!\nMe ajudem! Aaaaaaah!!!"
text.0ec4: "Ele sumiu! O que houve?"
text.0efe: "{color:7}Jijimon {color:1}\nNão sei. Mas..."
text.0f4c: "Jijimon? Vai explodir!\nFaça alguma coisa!"
text.0fa2: "{color:7}Jijimon {color:1}\nEle já devia estar aqui."
text.1032: "Airdramon!"
text.104e: "Depressa, vamos!"
text.10ac: "O Analogman se foi."
text.10d8: "A paz voltou para\na Ilha File."
text.1124: "E..."
