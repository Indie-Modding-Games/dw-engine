text.002e: "!"
text.005e: "Você é {color:6}{tamer}{color:1}?"
text.007e: "Um Digimon esqueleto?!"
text.00ac: "Você é {color:10}{partner}{color:1}?"
text.00cc: "Não sinto vida nele,\nsó alguma maldade."
text.0126: "Será que ele fez alguma\ncoisa com o Myotismon?!"
text.0188: "Se você não me contar...\nvou te atacar!"
text.0208: "Vou te atacar!"
text.0242: "Tenho que salvar o Myotismon\no quanto antes!"
