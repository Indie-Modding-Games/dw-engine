text.002e: "Jornal Concha Oito\nDigimon alienígena aparece:\nEncontramos o OVNI.\nA criatura mostrou o corpo\ne disse palavras estranhas.\nSerá um alienígena?\nVai aparecer de novo?"
text.018a: "Voltar\nSair"
text.01bc: "Jornal Concha Sete\nMyotismon nega a\naposentadoria:\nNuma entrevista,\nele negou os boatos.\nContinua trabalhando duro.\nEle ama seus fãs.\nTambém anunciou que\nseu pupilo, SkullGreymon,\nvai fazer sua estreia."
text.0368: "Voltar\nAvançar\nSair"
text.03d0: "Jornal Concha Seis\nMyotismon vai se aposentar?:\nDizem que o popular e \nhábil Myotismon vai parar.\nNinguém o viu na arena.\nA carreira dele chegou\nao fim. Está velho demais."
text.0544: "Voltar\nAvançar\nSair"
text.05b4: "Jornal Concha Cinco\nTesouro escondido:\nUma loja legal na Savana\nEngrenagem. Só abre do dia\nprimeiro ao quinze todo ano.\nO gerente tem orgulho\ndos seus itens raros."
text.0710: "Voltar\nAvançar\nSair"
text.0794: "Jornal Concha Quatro\nUm Digimon lendário?:\nDizem que há um Digimon\ndo frio na Terra Gelada.\nO Sr. M foi salvo por\nesse monstro. Parecia\numa grande bola de neve.\nDigimon que não aguentam\no frio, cuidado!"
text.094e: "Voltar\nAvançar\nSair"
text.09aa: "Jornal Concha Três\nUm Guardião para o Lago?:\nO Guardião do Lago está\nno Lago Olho de Dragão.\nA criatura tipo Digimon\nfoi chamada por alguém.\nSerá que o Guardião pode\nrealizar desejos?"
text.0b10: "Voltar\nAvançar\nSair"
text.0b80: "Jornal Concha Dois\nUm OVNI!:\nUm relato diz que o OVNI\nestá perto do Mte. Panorama.\nO OVNI parece um\nprato prateado com luz\nsaindo de baixo.\nSerá um alienígena?\nMais notícias em breve."
text.0cf8: "Voltar\nAvançar\nSair"
text.0d48: "Jornal Concha Um\nOs bandidos sumiram!:\n{color:6}{tamer}{color:1} achou o\nesconderijo do Ogremon.\nMas o Ogremon está \nà solta e o povo\nainda está preocupado."
text.0e70: "Avançar\nSair"
