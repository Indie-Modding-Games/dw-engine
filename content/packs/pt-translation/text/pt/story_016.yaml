text.0048: "Gruun."
text.005a: "Gruun.ru.ru.."
text.007e: "Algo voltou à vida!"
text.00ce: " ? "
text.00dc: "Eu morava na cidade.\nVocê tem cheiro de cidade."
text.0156: "Uau!"
text.0166: "Que medo. Saí da cidade\ne perdi a memória."
text.01ca: "Mas graças a você,\nagora lembro de tudo."
text.022a: "Vou voltar para a cidade,\ntá?"
text.0274: "Claro. Com certeza\na cidade está mais animada\ndo que antes."
text.02f8: "Sério? Certo!\nVou dar o meu melhor!"
text.037c: "Betamon entrou na cidade!"
text.03c2: "Este é o meu território!"
text.0402: "He he he. Isso aí!"
text.043c: "Só observe!"
