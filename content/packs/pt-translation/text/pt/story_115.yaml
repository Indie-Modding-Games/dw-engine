"text.00c8": "Bem-vindo, meu jovem."
"text.0108": "Você é o Cherrymon, né?"
"text.0144": "Quem está aí?"
"text.0164": "O que quer com um\nvelho como eu?"
"text.01ca": "Primeiro, tire a névoa."
"text.0200": "Não consigo ver com a névoa.\nPode tirá-la?"
"text.026c": "Então é isso. Entendo."
"text.02a6": "... não consegue fazer isso?"
"text.02da": "Primeiro, ouça o que eu\ntenho a dizer. Bem... \npor onde começo?"
"text.0364": "Se você sabe da emergência\nna ilha, por favor,\nme conte."
"text.03fa": "Entendo, entendo.\nA emergência."
"text.043e": "Esta ilha começou a mudar\noitenta anos atrás, depois\ndas mudanças na terra."
"text.04de": "As partes nordeste da ilha\nsurgiram de repente\noitenta anos atrás."
"text.0574": "Desde então, os Digimon\ncomeçaram a se afastar.\nAs espécies se separaram."
"text.05fa": "E cada espécie passou a\nfalar sua própria língua."
"text.066a": "Esqueceram a língua que\nusavam na cidade..."
"text.06d2": "No fim, a Cidade File\nperdeu quase toda a sua\npopulação de Digimon."
"text.0752": "Então os Digimon começaram\na perder a memória!"
"text.07a8": "A história da ilha, seu\npassado, seus sentidos...\npiorando dia após dia."
"text.0844": "Eu tenho algo importante\npara te contar, mas também\nnão consigo lembrar."
"text.08e6": "Porém, tudo vai se juntar\nno final. Alguém está\nforçando que seja assim!"
"text.097c": "Com o tempo, os Digimon vão\nachar que a emergência\né normal."
"text.0a08": "Só você pode impedir isso,\ncom o poder da Cidade File\nde unir os Digimon!"
"text.0ab8": "Reúna Digimon na cidade\ne crie um milagre.\nCom certeza vai acontecer."
"text.0b54": "Bom, eu me empolguei.\nUfa, falei tudo."
"text.0bd4": "Agora, vamos tirar a névoa."
"text.0c20": "A névoa da floresta era para\neu poder falar com você.\nAh, mais uma coisa..."
"text.0cd0": "Há outros na floresta\nque sabem sobre\no passado."
"text.0d44": "Entre fundo na floresta\npara achá-los, se puder."
"text.0dbc": "Veio de novo ouvir\num velho falar?"
"text.0e24": "Sobre a ilha...\nTreine {color:10}{partner}{color:1}\nDeixa pra lá"
"text.0e98": "Eis o que tenho a dizer."
"text.0eda": "Ah, tudo bem."
"text.0efe": "{color:5}Treino: Os Ensinamentos \nda Floresta {color:1}"
"text.0f56": "Começar\nExplicar\nSair"
"text.0f8e": "Normal\nTentativa bônus\nSair"
"text.0fcc": "O Cherrymon vai te passar\nmuito conhecimento. Aumenta\nmuito sua sabedoria."
"text.1068": "Explicar de novo\nComeçar\nSair"
"text.10c2": "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}\npara alinhar três figuras."
"text.1138": "Ha ha ha."
