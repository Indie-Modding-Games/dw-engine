text.03b8: "Bem-vindo à minha loja."
text.03e4: "Olhe, {color:6}{tamer}{color:1}. Esta é\na minha loja. Vou vender\ntodo tipo de item."
text.046c: "Logo terei mais coisas.\nMas preciso de Digimon que\nme ajudem aqui."
text.052c: "Vou comprar e vender\nitens. Venha me ver\nquando precisar."
text.05c6: "Não temos muita variedade,\nmas se eu achar um ajudante,\ntalvez melhore."
text.069c: "Decidi abrir\numa loja de itens.\nEspero que venha sempre."
text.0726: "Ainda temos pouco estoque,\nmas queremos crescer logo.\nPor ora, tenha paciência."
text.080a: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nabri minha loja de itens.\nAcho que vai dar certo!"
text.087c: "Com mais Digimon na\ncidade, teremos mais coisas."
text.0920: "{color:6}{tamer}{color:1}, comecei a ajudar\na cuidar desta loja.\nCompre bastante coisa!"
text.09ea: "Bem-vindo. A partir de hoje\nvou trabalhar aqui.\nVenha sempre, por favor."
text.0ab4: "Decidi ajudar a\ncuidar desta loja.\nVenha quando quiser."
text.0b68: "Ah, {color:6}{tamer}{color:1}. Este é\no lugar perfeito para mim.\nVou trabalhar duro aqui."
text.0e56: "Oi, vivo ocupado cuidando\ndesta loja... Só que não!"
text.0ec2: "Sou meio preguiçoso e não\nfico muito na loja. \nMas tenho coisas legais."
text.0f5e: "Isso! O «Manual de treino»!\nCom ele, seu treino\nvai ficar melhor!"
text.0fe6: "É muito valioso. Vendo\npor cinquenta mil Bits.\nVai se arrepender se\nnão comprar."
text.1094: "Comprar\nNão comprar"
text.10d6: "Você não tem Bits suficientes."
text.1126: "Hmmm, você está levando\nmuita coisa."
text.1186: "Ganhei um\n{color:6}Manual de treino{color:1}!"
text.11c2: "Não vou dar desconto."
text.123a: "Está com problemas\nporque leva\ncoisas demais?"
text.12b2: "Tem um lugar onde se acha\num chaveiro que liga sua\nbolsa a outra dimensão."
text.135a: "Ele aumenta o número de\nitens que você pode levar."
text.13be: "Mesmo que já tenha ido a\num lugar, olhe de novo."
text.1432: "Vou te contar o segredo\npara comprar itens."
text.1488: "Aperte o botão Start\nno item sobre o qual\nquiser informações!"
text.1514: "Escolha o item com {color:6}△{color:1}\ne aperte {color:4}□{color:1} se\nquiser comprar muitos."
text.159e: "Para subir ou baixar de dez,\nuse cima ou baixo no\ndirecional segurando {color:10}○{color:1}."
text.1636: "Ah, logo depois de\ndigievoluir, compre algo.\nAlgo bom deve acontecer!"
