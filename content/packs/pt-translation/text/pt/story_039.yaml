text.0020: "Estou te incomodando?"
text.0090: "{color:7}??? {color:1}\nSocorro!"
text.00ca: "Ouço uma voz lá de cima.\nTem alguém aí?"
text.012c: "{color:7}??? {color:1}\nTem alguém aí?"
text.0162: "Tem, sim."
text.018a: "{color:7}??? {color:1}\nSocorro!\nO chão está estufando."
text.01e8: "Só pode ser brincadeira."
text.0222: "{color:7}??? {color:1}\nNão, é verdade.\nOuço barulho de máquinas."
text.029a: "Uma máquina? Deve vir do\nesconderijo do Ogremon."
text.0312: "{color:7}??? {color:1}\nVocê deve ter feito\nalguma coisa errada lá, não?"
text.0386: "Fiz muita coisa. Pode ser\no elevador... Vou voltar\nao esconderijo e ver."
text.0442: "{color:7}??? {color:1}\nObrigado."
