text.0022: "{color:7}Poyomon {color:1}\nPoyomon. Meu nome é Poyomon."
text.0084: "{color:7}Poyomon {color:1}\nVou falar de digievolução.\nBem... É sobre o estágio\nque vem depois do Campeão."
text.014e: "{color:7}Poyomon {color:1}\nSe chama Digimon Ultra.\nMas não é certeza que um\nCampeão sempre digievolua."
text.0214: "{color:7}Poyomon {color:1}\nDigievoluir é difícil, mas\nquando chega a Ultra,\nsua vida fica mais longa."
text.02d8: "{color:7}Poyomon {color:1}\nCom itens de digievolução,\na vida não aumenta."
text.0370: "{color:7}Poyomon {color:1}\nVou falar de digievolução.\nBem... É sobre as\ncondições para digievoluir."
text.0428: "{color:7}Poyomon {color:1}\nPrimeiro, o peso precisa\nestar perto do peso do\npróximo estágio."
text.04b6: "{color:7}Poyomon {color:1}\nDepois, atributos altos são\nmelhores, mas cada um\ntem um efeito diferente."
text.0566: "{color:7}Poyomon {color:1}\nErros de cuidado. Conforme\no Digimon que você quer,\nàs vezes errar é bom."
text.062e: "{color:7}Poyomon {color:1}\nAh, é, tem outras\ncondições especiais para\nvirar certos Digimon."
text.06d6: "{color:7}Poyomon {color:1}\nTipo, disciplina bem alta,\nou muitas batalhas."
text.0756: "{color:7}Poyomon {color:1}\nAssim, mesmo sem cumprir\ntodas as três condições\nbásicas, dá para digievoluir."
text.082a: "{color:7}Poyomon {color:1}\nO Jiji me disse que {color:10}{partner}{color:1}\nlogo ia digievoluir."
text.089c: "{color:7}Poyomon {color:1}\nDe Bebê para Treinamento\nleva seis horas."
text.0920: "{color:7}Poyomon {color:1}\nE leva só um dia para\nchegar ao estágio Novato."
text.09ac: "{color:7}Poyomon {color:1}\nO próximo estágio, Campeão,\nleva uns três dias."
text.0a2c: "{color:7}Poyomon {color:1}\nE o estágio seguinte? Eu\nesqueci, mas leva mais tempo."
text.0ab4: "{color:7}Poyomon {color:1}\nPeso, atributos e erros de\ncuidado afetam a digievolução."
text.0b42: "{color:7}Poyomon {color:1}\nNão sei bem os detalhes,\nentão vou perguntar ao Jiji."
