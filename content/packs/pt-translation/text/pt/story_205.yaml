text.0010: "Que loja você quer?"
text.004c: "Clínica\nCaçador de tesouros\nVidente"
text.00aa: "Transformei em um hospital."
text.0100: "Não está se sentindo bem,\nné? Você precisa cuidar\nda saúde dele!"
text.018c: "Vou tratar agora mesmo.\nA consulta sai com desconto:\ntrezentos Bits."
text.0242: "Não tem Bits suficientes?!\nMe pague o que puder.\nGuarde para quando precisar."
text.02f6: "Pronto, está tudo bem.\nSó tome cuidado daqui\npra frente."
text.0364: "Não parece doente nem\nmachucado. Do que precisa?"
text.03d0: "Fazer um exame\nVender Remédio\nNada"
text.042c: "Certo, vou ver como\n{color:10}{partner}{color:1} está."
text.048a: "Ai, não. O cansaço de\n{color:10}{partner}{color:1} está num nível\nperigoso. Precisa\ndescansar agora mesmo!"
text.0540: "{color:10}{partner}{color:1} está cansado\ndemais. Precisa descansar\nantes que seja tarde."
text.05da: "{color:10}{partner}{color:1} parece um\npouco cansado. Não deve\nse esforçar tanto."
text.0664: "{color:10}{partner}{color:1} está bem, mas\no cansaço pode causar todo\ntipo de problema. Cuidado."
text.06fe: "E então, como ele se sente?"
text.0742: "A mente de {color:10}{partner}{color:1}\nestá superrelaxada.\nVai viver muito tempo."
text.07da: "O estado mental de\n{color:10}{partner}{color:1} está ótimo. É\nsinal de uma vida saudável."
text.0880: "{color:10}{partner}{color:1} parece bem\nrelaxado. Aconteceu\nalguma coisa boa?"
text.0918: "Não acho que {color:10}{partner}{color:1}\nesteja muito estressado.\nEu diria que está normal."
text.09be: "{color:10}{partner}{color:1} parece um\npouco estressado.\nPegue leve no treino."
text.0a40: "{color:10}{partner}{color:1} está com\nestresse demais.\nPrecisa se divertir."
text.0aac: "{color:10}{partner}{color:1} está muito\nestressado e infeliz. Não\ndeve se esforçar tanto."
text.0b4e: "{color:10}{partner}{color:1} está estressado\ndemais! Se continuar assim,\nnão vai viver muito!"
text.0be4: "Hmmm.... Isso é o melhor\nque posso fazer por {color:10}{partner}{color:1}."
text.0c40: "Precisa de mais\nalguma coisa?"
text.0c8e: "Fazer um exame\nVender Remédio\nNada"
text.0cee: "Hmmm, deve ficar tudo bem."
text.0d26: "Atadura:    quatrocentos Bits\nRemédio: mil e duzentos Bits\nNão comprar nada"
text.0dca: "Quando ele não estiver bem,\nvenha me ver na hora."
text.0e50: "Você tem coisas demais."
text.0ea8: "Você não tem Bits suficientes.\nNão posso te vender isso."
text.0f28: "Você tem coisas demais."
text.0f80: "Você não tem Bits suficientes.\nNão posso te vender isso."
text.0fee: "Precisa de mais\nalguma coisa?"
text.103c: "Fazer um exame\nVender Remédio\nNada"
text.109c: "Mudei de profissão e virei\no Caçador de tesouros."
text.1112: "Quer que eu procure algum\ntesouro? Quer que eu\nexplique como funciona?"
text.11ac: "Quero saber\nNão preciso saber\nDeixa pra lá"
text.121c: "Temos dois planos com\ndias e preços diferentes."
text.128e: "Normal: 3 dias, mil Bits\nEspecial: 10 dias, 5 mil Bits"
text.130a: "Com o plano Especial,\na chance de achar um tesouro\nmelhor é maior."
text.139e: "É isso.\nE então, o que vai querer?"
text.13fe: "Explicar de novo\nAchar tesouro\nDeixa pra lá"
text.145a: "Escolha um plano!"
text.147e: "Normal: 3 dias, mil Bits\nEspecial: 10 dias, 5 mil Bits\nCancelar"
text.1518: "Certo, então tchau."
text.1564: "Certo, você terá o resultado\nem três dias. Me deseje sorte."
text.1602: "Certo, você terá o resultado\nem dez dias. Me deseje sorte."
text.1680: "Você não tem Bits suficientes.\nPreciso de dinheiro para\nprocurar tesouros."
text.1734: "{color:7}Aviso {color:1}\nEstou procurando tesouros\nagora mesmo. Espere\num pouco: Drimogemon."
text.17d6: "Sabe de uma coisa?\nAchamos um tesouro."
text.1976: "Esvazie suas coisas!"
text.19aa: "Ganhei {color:6}{item:pstat=110}{color:1}!"
text.1af2: "Obrigado pela preferência!"
