text.0038: "Ah, {color:6}{tamer}{color:1}e {color:10}{partner}{color:1},\nvocês chegaram."
text.0078: "Sou entregador.\nEntrego qualquer coisa."
text.00cc: "A única coisa que vocês\nlevam são vocês mesmos, né?"
text.0132: "Que tal eu levar vocês?\nÓtima ideia, hein?"
text.0190: "Levo vocês a qualquer\nlugar, a qualquer hora.\nCobrando, é claro."
text.0222: "Oi, {color:6}{tamer}{color:1}."
text.023c: "Às vezes volto à Savana\nEngrenagem para patrulhar."
text.029e: "Ouvi dizer que tem lojas\nna praia da Savana\nEngrenagem. Você viu?"
