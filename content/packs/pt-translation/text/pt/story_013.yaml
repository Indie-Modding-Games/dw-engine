text.0084: "Ei, é você que está\nconstruindo uma cidade?"
text.00d6: "Sou."
text.00ea: "Hã, você tem muita sorte\nde me encontrar."
text.0132: "Não pareço, mas sou um\nDigimon Ultra. Se me\nvencer, eu te ajudo."
text.01d6: "Certo, eu aceito\nNão, obrigado"
text.0258: "Uau, perdi! Bom, a gente\nse vê na cidade."
text.02f0: "Piximon entrou na cidade!"
text.033a: "Ah, que covarde!\nAté a próxima!"
text.03c0: "Oh, señorita!"
text.03f0: "Ei, amigo, qual é a boa?"
text.0430: "Wooki, wooki!"
text.0460: "Hã?"
