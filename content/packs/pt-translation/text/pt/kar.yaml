"penguinmon_dialogue.0001": "Primeiro, escolha a sua"
"penguinmon_dialogue.0002": "pedra de curling, por favor."
"penguinmon_dialogue.0005": "Há pedras pesadas, médias"
"penguinmon_dialogue.0006": "e leves, então pense na"
"penguinmon_dialogue.0007": "melhor ordem para usá-las."
"penguinmon_dialogue.0009": "Algumas pedras têm quatro"
"penguinmon_dialogue.0010": "pinos. Elas ficam onde caem"
"penguinmon_dialogue.0011": "e podem ser muito úteis."
"penguinmon_dialogue.0013": "Mova o direcional para os "
"penguinmon_dialogue.0014": "lados para escolher a "
"penguinmon_dialogue.0015": "direção do arremesso."
"penguinmon_dialogue.0017": "Com cima e baixo você move"
"penguinmon_dialogue.0018": "a tela. Aperte {prompt:confirm} para"
"penguinmon_dialogue.0019": "definir a direção do tiro."
"penguinmon_dialogue.0021": "Aperte {prompt:confirm} quando a barra"
"penguinmon_dialogue.0022": "de força chegar no nível"
"penguinmon_dialogue.0023": "que quiser para lançar."
"penguinmon_dialogue.0025": "Se a sua pedra cair e tocar"
"penguinmon_dialogue.0026": "a marca GOOD, você ganha"
"penguinmon_dialogue.0027": "dois pontos."
"penguinmon_dialogue.0029": "Se parar na linha azul,"
"penguinmon_dialogue.0030": "mas fora da marca GOOD"
"penguinmon_dialogue.0031": "do centro, ganha um ponto."
"penguinmon_dialogue.0033": "Se tocar a marca BAD lá"
"penguinmon_dialogue.0034": "embaixo à direita, perde"
"penguinmon_dialogue.0035": "dois pontos. Tenha cuidado!"
"penguinmon_dialogue.0037": "E, se houver empate,"
"penguinmon_dialogue.0038": "eu ganho!"
"penguinmon_dialogue.0039": "Então vamos jogar!!"
"penguinmon_dialogue.0042": "Você não é tão bom assim!"
"penguinmon_dialogue.0045": "A batalha só está começando!"
"penguinmon_dialogue.0049": "Ei, você é muito bom!"
"penguinmon_dialogue.0053": "É! Ganhei!"
"penguinmon_dialogue.0057": "Ah, perdi. "
"metalmamemon_dialogue.0001": "É. Primeiro você escolhe"
"metalmamemon_dialogue.0002": "o tipo de pedra de curling."
"metalmamemon_dialogue.0005": "Como sou um gênio, uso várias"
"metalmamemon_dialogue.0006": "pedras na ordem certa."
"metalmamemon_dialogue.0007": "É a chave para vencer."
"metalmamemon_dialogue.0009": "As pedras com quatro pinos"
"metalmamemon_dialogue.0010": "freiam e ficam onde caem,"
"metalmamemon_dialogue.0011": "então valem muito."
"metalmamemon_dialogue.0013": "Escolha para onde lançar"
"metalmamemon_dialogue.0014": "com o direcional, movendo-o"
"metalmamemon_dialogue.0015": "para a esquerda e a direita."
"metalmamemon_dialogue.0017": "Com o direcional para cima"
"metalmamemon_dialogue.0018": "e baixo, você rola a tela."
"metalmamemon_dialogue.0019": "Aperte {prompt:confirm} para lançar."
"metalmamemon_dialogue.0021": "Aperte {prompt:confirm} quando a barra"
"metalmamemon_dialogue.0022": "de força chegar no nível "
"metalmamemon_dialogue.0023": "que quiser para lançar."
"metalmamemon_dialogue.0025": "Pontos: se a pedra parar"
"metalmamemon_dialogue.0026": "na marca GOOD,"
"metalmamemon_dialogue.0027": "você ganha dois pontos."
"metalmamemon_dialogue.0029": "Se parar na linha azul,"
"metalmamemon_dialogue.0030": "mas fora da marca GOOD"
"metalmamemon_dialogue.0031": "do centro, ganha um ponto."
"metalmamemon_dialogue.0033": "Se cair na marca BAD lá"
"metalmamemon_dialogue.0034": "embaixo à direita, são dois"
"metalmamemon_dialogue.0035": "pontos a menos. Cuidado!"
"metalmamemon_dialogue.0037": "Se der empate, eu ganho!"
"metalmamemon_dialogue.0038": "Que comece o jogo!!"
"metalmamemon_dialogue.0041": "Vou ganhar!"
"metalmamemon_dialogue.0045": "Ainda não perdi!"
"metalmamemon_dialogue.0049": "Não posso perder essa!"
"metalmamemon_dialogue.0053": "É, ganhei!"
"metalmamemon_dialogue.0057": "Ah, quase ganhei."
"menu.0000": "Jogar     Como jogar"
