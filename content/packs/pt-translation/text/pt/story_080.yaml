text.002e: "Vou te pegar."
text.0068: "Veio aqui para perder?"
text.00b2: "Você é bem fraquinho!"
text.00f2: "Hmmm, quer mesmo perder?"
text.0140: "Você vai cair!"
text.017a: "Saia do meu caminho!"
text.01ca: "Esta é uma zona de tempo\ncompletamente diferente."
text.0226: "Não podemos perder tempo.\nTemos que procurar meteoritos."
