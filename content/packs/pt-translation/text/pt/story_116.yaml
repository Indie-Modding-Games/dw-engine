"text.0062": "Uau!"
"text.0080": "Mmmm."
"text.00a0": "Hã, vamos parar por aqui."
"text.00e6": "Não podemos baixar\na guarda ainda."
"text.013c": "...!"
"text.0180": "Não, eu não quero!\nNão quero lutar!"
"text.01de": "Se não quer lutar,\nentão fuja."
"text.023a": "Que pena."
"text.0268": "Não entendo você."
"text.029c": "Bom, por que não vem para a\nnossa cidade? É melhor que\nficar escondido aqui."
"text.032e": "Hã, cidade?"
"text.0350": "Não vamos te\nobrigar."
"text.0394": "Assim dá vontade de ir.\nTá bom, eu vou!"
"text.0426": "Gabumon entrou na cidade!"
"text.0464": "Que sujeito esquisito."
