text.0122: "Eu vou ganhar!"
text.0150: "Não chegue perto! Vá embora!"
text.0194: "Agora fiquei bravo de verdade!"
text.01d0: "Bata e eu bato de volta!"
text.0214: "Tente, se puder!"
text.02f4: "Ah, é você, {color:6}{tamer}{color:1}.\nA ponte foi consertada."
text.0348: "Ouvi dizer que você está\nfazendo uma cidade."
text.0386: "Tenho um pedido.\nQuero que me ajude\ncomo eu te ajudei."
text.040a: "?"
text.0414: "Fazer uma cidade é\nsalvar esta ilha.\nTodos vão ser salvos."
text.04a2: "Quer dizer que você\nvai para a cidade?"
text.04fc: "Sim. Vou para a sua cidade."
text.0596: "Coelamon entrou na cidade!"
text.06b0: "Ei, você é humano?"
text.06dc: "Sou o Coelamon,\no Digimon peixe.\nVeio me ver?"
text.0758: "Sim, te procuramos muito\nAgora que você falou"
text.07d0: "Ha-ha, é mesmo!"
text.080c: "Já sei o que você\nquer."
text.084e: "A ponte rio acima está\nquebrada e você quer\natravessar. Certo?"
text.08f2: "Entendi.\nTudo bem, eu te ajudo."
text.093c: "Ah-há, você voltou."
text.0a0a: "Agora, ande nas nossas\ncabeças. Não se preocupe."
text.0a7a: "Certo, lá vamos nós!"
text.0b94: "Este mundo precisa de mais\nunião. Até a próxima."
