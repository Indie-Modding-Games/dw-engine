"text.005a": "Esta fantasia parece\ndiferente das outras. Tem\numa presença esmagadora."
"text.0130": "Tem um zíper nas costas."
"text.018e": "O que houve, {color:10}{partner}{color:1}?!"
"text.01d4": "O quê? Você virou\noutro Digimon?\nAté que ficou legal."
"text.0250": " {color:10}{partner}{color:1},\nquer entrar?"
"text.02ae": "Não dá, {color:10}{partner}{color:1}.\nSó entra quem for flexível\ne escorregadio."
