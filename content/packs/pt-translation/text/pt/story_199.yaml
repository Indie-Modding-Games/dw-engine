text.0056: "Ei, me dá {color:6}Carne{color:1}!"
text.008c: "Bem-vindo, quer\n{color:6}Carne{color:1}? Bom, é..."
text.0100: "Subir preço\nManter em cinquenta Bits\nBaixar preço"
text.0172: "É, você queria {color:6}Carne{color:1},\nné? É..."
text.01e8: "Que tal a {color:6}Carne{color:1} de cinquenta\npor setenta e cinco Bits?"
text.0256: "Subir pra setenta e cinco\nVou pensar melhor"
text.02de: "E a {color:6}Carne{color:1} de cinquenta\npor setenta Bits?"
text.033a: "Subir pra setenta\nVou pensar melhor"
text.03c2: "Que tal a {color:6}Carne{color:1} de cinquenta\npor sessenta e cinco Bits?"
text.042c: "Subir pra sessenta e cinco\nVou pensar melhor"
text.04b0: "E a {color:6}Carne{color:1} de cinquenta\npor sessenta Bits?"
text.0508: "Subir pra sessenta\nVou pensar melhor"
text.058c: "Que tal a {color:6}Carne{color:1} de cinquenta\npor cinquenta e cinco Bits?"
text.05f6: "Subir pra cinquenta e cinco\nVou pensar melhor"
text.066e: "E a {color:6}Carne{color:1} de cinquenta\npelo preço normal?"
text.06ca: "Vender a preço normal\nVou pensar melhor"
text.074c: "Que tal a {color:6}Carne{color:1} de cinquenta\npor quarenta e cinco Bits?"
text.07b6: "Baixar pra quarenta e cinco\nVou pensar melhor"
text.083a: "E a {color:6}Carne{color:1} de cinquenta\npor quarenta Bits?"
text.0892: "Baixar pra quarenta\nVou pensar melhor"
text.0916: "Que tal a {color:6}Carne{color:1} de cinquenta\npor trinta e cinco Bits?"
text.0982: "Baixar pra trinta e cinco\nVou pensar melhor"
text.0aca: "Beleza, vendido!"
text.0b12: "Lucro total: {shopvar}\nLucro:\nquarenta"
text.0b68: "Lucro total: {shopvar}\nLucro:\ntrinta e cinco"
text.0bca: "Lucro total: {shopvar}\nLucro:\ntrinta"
text.0c22: "Lucro total: {shopvar}\nLucro:\nvinte e cinco"
text.0c84: "Lucro total: {shopvar}\nLucro:\nvinte"
text.0cdc: "Lucro total: {shopvar}\nLucro:\nquinze"
text.0d36: "Lucro total: {shopvar}\nLucro:\ndez"
text.0d88: "Lucro total: {shopvar}\nLucro:\ncinco"
text.0dd2: "Lucro total: {shopvar}\nLucro:\nzero"
text.0e94: "Tchau! Tô fora!!"
text.0ef6: "Quando vão vir clientes...?"
text.0f44: "Me faz um desconto!"
text.0f74: "Bom... Bom, então..."
text.0fa8: "Ei! Me dá um\n{color:6}Penico portátil{color:1}."
text.0fee: "É... Bem-vindo, quer um\n{color:6}Penico portátil{color:1}?"
text.1060: "Subir preço\nManter em trezentos Bits\nBaixar preço"
text.10dc: "É... você queria um\n{color:6}Penico portátil{color:1}?"
text.114a: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nquatrocentos e cinquenta Bits?"
text.11e6: "Pedir quatrocentos e cinquenta\nVou pensar melhor"
text.1274: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nquatrocentos e vinte Bits?"
text.131a: "Subir pra quatrocentos e vinte\nVou pensar melhor"
text.13a4: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e noventa Bits?"
text.1444: "Subir pra trezentos e noventa\nVou pensar melhor"
text.14d0: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e sessenta Bits?"
text.1576: "Subir pra trezentos e sessenta\nVou pensar melhor"
text.1600: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e trinta Bits?"
text.16a0: "Subir pra trezentos e trinta\nVou pensar melhor"
text.1720: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits\npelo preço normal?"
text.17c6: "Vender a preço normal\nVou pensar melhor"
text.1848: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e setenta Bits?"
text.18e6: "Baixar pra duzentos e setenta\nVou pensar melhor"
text.1974: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e quarenta Bits?"
text.1a16: "Baixar pra duzentos e quarenta\nVou pensar melhor"
text.1aa2: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e dez Bits?"
text.1b38: "Baixar pra duzentos e dez\nVou pensar melhor"
text.1c82: "Isso! Negócio fechado!"
text.1cd4: "Lucro total: {shopvar}\nLucro:\nduzentos e quarenta"
text.1d42: "Lucro total: {shopvar}\nLucro:\nduzentos e dez"
text.1dac: "Lucro total: {shopvar}\nLucro:\ncento e oitenta"
text.1e1c: "Lucro total: {shopvar}\nLucro:\ncento e cinquenta"
text.1e8a: "Lucro total: {shopvar}\nLucro:\ncento e vinte"
text.1efa: "Lucro total: {shopvar}\nLucro:\nnoventa"
text.1f52: "Lucro total: {shopvar}\nLucro:\nsessenta"
text.1fa8: "Lucro total: {shopvar}\nLucro:\ntrinta"
text.1ff6: "Lucro total: {shopvar}\nLucro:\nzero"
text.208c: "Acho que está meio caro."
text.20c4: "Você acha? Bom, então..."
text.20fc: "Ei! Me dá um\n{color:6}Remédio{color:1}."
text.213a: "É... Bem-vindo, quer um\n{color:6}Remédio{color:1}?"
text.21a0: "Subir preço\nManter em mil Bits\nBaixar preço"
text.221a: "É, você queria um\n{color:6}Remédio{color:1}, né?"
text.228c: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e quinhentos Bits?"
text.2318: "Subir pra mil e quinhentos\nVou pensar melhor"
text.23a2: "E o {color:6}Remédio{color:1}\nde mil Bits por\nmil e quatrocentos Bits?"
text.2428: "Subir pra mil e quatrocentos\nVou pensar melhor"
text.24b4: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e trezentos Bits?"
text.2542: "Subir pra mil e trezentos\nVou pensar melhor"
text.25ce: "E o {color:6}Remédio{color:1}\nde mil Bits por\nmil e duzentos Bits?"
text.2650: "Subir pra mil e duzentos\nVou pensar melhor"
text.26d8: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e cem Bits?"
text.2762: "Subir pra mil e cem\nVou pensar melhor"
text.27de: "E o {color:6}Remédio{color:1}\nde mil Bits pelo\npreço normal de mil?"
text.2868: "Vender a preço normal\nVou pensar melhor"
text.28ea: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nnovecentos Bits?"
text.2970: "Baixar pra novecentos\nVou pensar melhor"
text.29fa: "E o {color:6}Remédio{color:1}\nde mil Bits por\noitocentos Bits?"
text.2a7a: "Baixar pra oitocentos\nVou pensar melhor"
text.2b06: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nsetecentos Bits?"
text.2b8e: "Baixar pra setecentos\nVou pensar melhor"
text.2cdc: "Beleza! Vou levar."
text.2d2a: "Lucro total: {shopvar}\nLucro:\noitocentos"
text.2d90: "Lucro total: {shopvar}\nLucro:\nsetecentos"
text.2df6: "Lucro total: {shopvar}\nLucro:\nseiscentos"
text.2e58: "Lucro total: {shopvar}\nLucro:\nquinhentos"
text.2ebc: "Lucro total: {shopvar}\nLucro:\nquatrocentos"
text.2f20: "Lucro total: {shopvar}\nLucro:\ntrezentos"
text.2f86: "Lucro total: {shopvar}\nLucro:\nduzentos"
text.2fe8: "Lucro total: {shopvar}\nLucro:\ncem"
text.3040: "Lucro total: {shopvar}\nLucro:\nzero"
text.30d6: "Você cobra caro demais."
text.3106: "Sério? Bom, então..."
