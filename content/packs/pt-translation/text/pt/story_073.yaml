text.00cc: "O que foi?"
text.00f4: "SOCORRO!"
text.0114: "Ele está em apuros,\npreciso ajudá-lo!"
text.0174: "{color:7}??? {color:1}\nMexa com alguém\ndo seu tamanho!"
text.01e4: "Quem é aquele?"
text.0270: "Você está bem?"
text.0298: "Obrigado."
text.02b4: "Me chame quando estiver\nem apuros. Eu venho\nna hora!"
text.032e: "Até mais!"
text.035e: "Ei, espere!"
text.039a: "Ele é tipo um herói.\nFica com todo o mérito."
text.0404: "Esta é a minha casa. Fora!"
text.044a: "Sou Sharmamon. Quem é você?"
