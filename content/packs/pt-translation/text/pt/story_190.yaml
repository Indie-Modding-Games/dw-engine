text.014c: "Tem uns desenhos estranhos\nno chão."
text.01a2: "Serão daqueles círculos\nestranhos? Parecem novos."
text.0238: "Agora tem mais deles.\nVocê acha que são\ndo OVNI?"
text.02d4: "Aaargh!?"
text.02f4: "Agora vejo muitos mais."
text.032c: "Bom, acho que isso indica..."
text.036a: "O quê?"
text.03d0: "Um alienígena?!"
text.03ec: "..."
text.03fa: "Você é um Digimon?"
text.0426: "..."
text.0434: "É?"
text.044c: "..."
text.0472: "Não sou seu inimigo!"
text.04a8: "Bom, agora você entendeu."
text.04ea: "{color:6}{tamer}{color:1} tentou\nconvencê-lo."
text.0526: "..."
text.0534: "Talvez ele não entenda."
text.0588: "Tá bom."
text.05d4: "Vademon entrou na cidade!"
text.060a: "Hã?"
text.0618: "Ele sabe falar!"
