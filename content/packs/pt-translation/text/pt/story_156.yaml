text.01d4: "Não funcionou, mas..."
text.0214: "Uau, virou Giromon!"
text.0262: "Deu certo!"
text.029a: "Uau, virou\nMetalMamemon!"
text.02e6: "Não funcionou."
text.030c: "Que horror!"
