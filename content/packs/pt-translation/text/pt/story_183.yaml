text.0034: "Nham, nham."
text.004e: "Hã..."
text.0064: "Me escute, por favor."
text.008e: "Que delícia, que delícia."
text.00b0: "Meus homens não me\nobedecem mais."
text.00f0: "Acho que eles não lembram\nmais das minhas ordens."
text.014a: "Às vezes eles nem\nentendem."
text.019a: "Meus homens deviam trazer\nminhas refeições, mas..."
text.01ea: "Que delícia..."
text.0202: "Enquanto eu trabalhava, não\ntrouxeram minha comida,\naí esqueci de comer."
text.0294: "Você está muito envolvido\nno seu trabalho."
text.02e2: "Que vergonha."
text.0310: "Acho que há problemas\nna mansão."
text.0366: "Problemas na ilha? Todos\nagem como meus homens?"
text.03da: "Sim, todos estão\nperdendo a memória."
text.042c: "Você acha que alguém\nestá fazendo isso?"
text.0478: "Hmmm"
text.0488: "O que eu posso fazer?"
text.04ac: "Estamos construindo uma\ncidade para unir os\ncorações dos Digimon."
text.0512: "Estamos viajando\npara achar amigos."
text.055a: "O que eu posso fazer?\nMeus homens só\nsabem lutar."
text.05cc: "Não posso deixá-los aqui."
text.0604: "Entendo..."
text.061c: "Deixe-me pensar.\nSinto muito, mas..."
text.067e: "Volto outra hora.\nNão se esqueça de comer."
text.06de: "Quer entrar numa luta?"
text.0712: "Uma luta? Perfeito,\nvai animar meus homens."
text.0776: "Então, quer participar?"
text.07a8: "Sim, mas ainda tenho que\npesquisar umas coisas aqui.\nVou para lá logo."
