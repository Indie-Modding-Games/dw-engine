text.24da: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e trezentos Bits?"
text.2568: "Subir pra mil e trezentos\nVou pensar melhor"
text.25f4: "E o {color:6}Remédio{color:1}\nde mil Bits por\nmil e duzentos Bits?"
