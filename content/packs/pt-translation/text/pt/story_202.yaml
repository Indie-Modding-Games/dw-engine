text.2804: "E o {color:6}Remédio{color:1}\nde mil Bits pelo\npreço normal de mil?"
text.2892: "Vender a preço normal\nVou pensar melhor"
text.2914: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nnovecentos Bits?"
text.2996: "Baixar pra novecentos\nVou pensar melhor"
text.2a20: "E o {color:6}Remédio{color:1}\nde mil Bits por\noitocentos Bits?"
