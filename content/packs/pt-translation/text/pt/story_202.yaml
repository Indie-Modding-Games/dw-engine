text.0de8: "Lucro total: {shopvar}\nLucro:\nzero"
text.0eaa: "Tô indo embora!!"
text.0ef4: "Não aparece nenhum cliente..."
text.0f32: "Você cobra caro demais!"
text.0f6c: "Sério? Bom, então..."
text.0fa0: "Puxa, preciso de um\n{color:6}Penico portátil{color:1}."
text.0ff0: "É... Bem-vindo, quer um\n{color:6}Penico portátil{color:1}?"
text.105c: "Subir preço\nManter em trezentos Bits\nBaixar preço"
text.10d8: "É... quer um bom preço\nnum {color:6}Penico portátil{color:1}?"
text.1160: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nquatrocentos e cinquenta Bits?"
text.11fc: "Pedir quatrocentos e cinquenta\nVou pensar melhor"
text.128a: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nquatrocentos e vinte Bits?"
text.1330: "Subir pra quatrocentos e vinte\nVou pensar melhor"
text.13ba: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e noventa Bits?"
text.145a: "Subir pra trezentos e noventa\nVou pensar melhor"
text.14e6: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e sessenta Bits?"
text.158c: "Subir pra trezentos e sessenta\nVou pensar melhor"
text.1616: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e trinta Bits?"
text.16b6: "Subir pra trezentos e trinta\nVou pensar melhor"
text.1736: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits\npelo preço normal?"
text.17dc: "Vender a preço normal\nVou pensar melhor"
text.185e: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e setenta Bits?"
text.18fc: "Baixar pra duzentos e setenta\nVou pensar melhor"
text.198a: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e quarenta Bits?"
text.1a2c: "Baixar pra duzentos e quarenta\nVou pensar melhor"
text.1ab8: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e dez Bits?"
text.1b4e: "Baixar pra duzentos e dez\nVou pensar melhor"
text.1c98: "Beleza, vou levar!"
