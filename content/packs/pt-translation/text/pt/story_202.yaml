text.0056: "Puxa, quero {color:6}Carne{color:1}."
text.008e: "Bem-vindo, quer\n{color:6}Carne{color:1}? Bom, é..."
text.0102: "Subir preço\nManter em cinquenta Bits\nBaixar preço"
text.0174: "É, você quer {color:6}Carne{color:1}\nbaratinha, né? É..."
text.01fa: "Que tal a {color:6}Carne{color:1} de cinquenta\npor setenta e cinco Bits?"
text.0268: "Subir pra setenta e cinco\nVou pensar melhor"
text.02f0: "E a {color:6}Carne{color:1} de cinquenta\npor setenta Bits?"
text.034c: "Subir pra setenta\nVou pensar melhor"
text.03d4: "Que tal a {color:6}Carne{color:1} de cinquenta\npor sessenta e cinco Bits?"
text.043e: "Subir pra sessenta e cinco\nVou pensar melhor"
text.04c2: "E a {color:6}Carne{color:1} de cinquenta\npor sessenta Bits?"
text.051a: "Subir pra sessenta\nVou pensar melhor"
text.059e: "Que tal a {color:6}Carne{color:1} de cinquenta\npor cinquenta e cinco Bits?"
text.0608: "Subir pra cinquenta e cinco\nVou pensar melhor"
text.0680: "E a {color:6}Carne{color:1} de cinquenta\npelo preço normal?"
text.06dc: "Vender a preço normal\nVou pensar melhor"
text.075e: "Que tal a {color:6}Carne{color:1} de cinquenta\npor quarenta e cinco Bits?"
text.07c8: "Baixar pra quarenta e cinco\nVou pensar melhor"
text.084c: "E a {color:6}Carne{color:1} de cinquenta\npor quarenta Bits?"
text.08a4: "Baixar pra quarenta\nVou pensar melhor"
text.0928: "Que tal a {color:6}Carne{color:1} de cinquenta\npor trinta e cinco Bits?"
text.0994: "Baixar pra trinta e cinco\nVou pensar melhor"
text.0adc: "Beleza, vou levar!"
text.0b28: "Lucro total: {shopvar}\nLucro:\nquarenta"
text.0b7e: "Lucro total: {shopvar}\nLucro:\ntrinta e cinco"
text.0be0: "Lucro total: {shopvar}\nLucro:\ntrinta"
text.0c38: "Lucro total: {shopvar}\nLucro:\nvinte e cinco"
text.0c9a: "Lucro total: {shopvar}\nLucro:\nvinte"
text.0cf2: "Lucro total: {shopvar}\nLucro:\nquinze"
