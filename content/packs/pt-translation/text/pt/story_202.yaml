text.209c: "Não está caro demais?"
text.20ce: "Não? Bom... Bom, então..."
text.210c: "Puxa, quero um\n{color:6}Remédio{color:1}."
text.214c: "É... Bem-vindo, quer um\n{color:6}Remédio{color:1}?"
text.21b2: "Subir preço\nManter em mil Bits\nBaixar preço"
