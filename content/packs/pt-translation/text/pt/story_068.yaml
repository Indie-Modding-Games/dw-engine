text.00ce: "Ha ha, se me tocar\nvai levar um choque."
text.016a: "Não quer ficar aqui?"
text.01ee: "Uau, incrível! Que coragem."
text.022c: "Você vai longe!\nCerto, vou te ajudar."
text.029a: "Não usaria seu poder\nelétrico para a cidade?"
text.0300: "Cidade? O que é isso?\nSoa familiar, mas..."
text.035a: "Vou ajudar. Sou Elecmon,\nmuito prazer."
text.03ec: "Elecmon entrou na cidade!"
text.0432: "Ugghh!"
text.0454: "Ahhh!"
text.0474: "Você está acabado!"
text.04ac: "Nada mal."
text.04d2: "Você tem mau gosto."
text.050e: "Convencido! Vou te ensinar."
text.057e: "Esta porta de ferro é dura.\nSe ela não abrir,\nnão dá para entrar."
