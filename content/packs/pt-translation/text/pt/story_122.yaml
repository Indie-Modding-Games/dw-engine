"text.0020": "Estou atrapalhando?"
"text.0056": "Você me salvou!"
"text.0078": "Então era você."
"text.009c": "Isso é perfeito."
"text.00cc": "O quê?"
"text.00e2": "Eu estava indo para a sua\ncidade usar meu talento\npara algo bom!"
"text.0160": "Que tipo de talento?"
"text.0190": "Ah, você não me conhece?\nSou famosa entre os Digimon\npor saber de tudo!"
"text.0224": "Sério?\nNunca ouvi falar de você."
"text.026c": "Estou pronta para ir à cidade."
"text.02b4": "Será que ela vai mesmo\nser útil?"
"text.0302": "Até mais!"
"text.0350": "Shellmon entrou na cidade!"
