text.0060: "Droga! Batemos numa pedra!"
text.0098: "Não consigo furar."
text.00c6: "Não consegue? Ah, não!"
text.00f0: "Temos que achar um jeito de\nmovê-la. Você consegue?"
text.0164: "Não sei."
text.0192: "{color:10}{partner}{color:1},\npreciso da sua ajuda."
text.034e: "Conseguimos!"
text.036a: "Uau, que força incrível!\nMovemos a pedra!"
text.03be: "Acho que depois daqui\nestá vazio."
text.041e: "É um rio de lava!\nÉ perigoso!"
text.0468: "Tem um caminho ao lado\ndo rio. Vamos!"
text.04c2: "Vai entrar?\nTome cuidado!"
text.0516: "Vai entrar?\nTome cuidado!"
text.0576: "Volte, {color:10}{partner}{color:1},\nquando crescer mais."
