text.0052: "Taaa!"
text.0072: "Certo, tome isto!"
text.00ae: "Shaaaa!"
text.00d2: "Buooon!"
text.011e: "Quem é você? Não vou deixar\nninguém bagunçar este lugar!"
text.0194: "Calma. Só estamos de\npassagem para\nsalvar a ilha."
text.0220: "Não confio em você, suma!"
text.0260: "Espere um pouco."
text.02cc: "Por acaso você é...?"
text.030e: "Eu avisei!"
text.0336: "Desculpe. Quase não temos\nvisitas, e eu me empolgo\ncom meu novo trabalho."
text.03d2: "Trabalho?"
text.03e2: "Eu vigio um lugar chamado\nRegião Dino Antiga."
text.0448: "É uma região inexplorada."
text.0484: "Pode me mostrar o lugar?"
text.04bc: "A Região Dino Antiga é\ndividida em duas partes."
text.0520: "Onde vivemos se chama\nZona do Tempo Glacial."
text.057a: "É um lugar especial onde\no tempo passa devagar."
text.05de: "O tempo passa devagar?"
text.0608: "O outro lugar é a\nZona do Tempo Veloz."
text.0656: "É perigosa e fica mais longe\nque a Zona do Tempo Glacial."
text.06c8: "É perigosa porque lá o\ntempo passa muito rápido."
text.071c: "A terra é árida. Há ossos\ne fósseis por toda parte."
text.0782: "Porque lá o tempo passa mais\nrápido que em outros lugares?"
text.07fc: "Isso. Não demore por lá."
text.083c: "Como estou bloqueando o\ncaminho, você não pode ir."
text.08a4: "Você perdeu."
text.08c2: "Dei azar! Isso não\nacontece sempre."
text.0918: "É mesmo?"
text.093c: "Tenho que voltar para casa.\nPergunte a outros Digimon\nse tiver dúvidas."
