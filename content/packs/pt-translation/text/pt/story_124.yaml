"text.008e": "Hmm"
"text.00b4": "Parece um ninho de pássaro.\nO que você acha?"
"text.012e": "Estou ouvindo um barulho."
"text.01bc": "Você é bom."
"text.01dc": "Então o ninho era seu."
"text.020c": "É."
"text.0222": "Desculpe entrar sem pedir."
"text.026a": "Ah, não se preocupe."
"text.02a4": "?"
"text.02ae": "Já ouvi falar de você."
"text.02da": "Não sabia que era famoso."
"text.0318": "Você deve ser o único humano\nque restou na ilha."
"text.0388": "Que restou...? Houve\noutros antes de mim?"
"text.03e0": "Não vai me convidar\npara a cidade?"
"text.0440": "Ah, é, não quer vir\npara a cidade?"
"text.0492": "Tá. Então vamos ao que\ninteressa. Segure firme."
"text.0534": "Birdramon entrou na cidade!"
"text.066a": "Elevador"
"text.0682": "Descer um andar\nDescer dois andares\nNão entrar"
"text.074e": "Hã?"
"text.075c": "Não dá. Não funciona."
