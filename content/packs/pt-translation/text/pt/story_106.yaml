"text.005e": "Rochas bloquearam a estrada..."
"text.00a2": "Teste de batalha!"
"text.00c0": "Brincadeira."
"text.00e6": "Me chamam de Sr. Prático!\nO que posso fazer por você?"
"text.0146": "Mudar parâmetros\nAvançar o tempo\nDominar todas as técnicas"
"text.01cc": "Aumentar\nDiminuir\nZerar nível de habilidade"
"text.022a": "Avançar uma hora\nAvançar seis horas\nAvançar um dia"
"text.02e4": "Somar cinquenta\nSomar cem\nSomar duzentos"
"text.03bc": "Tirar cinquenta\nTirar cem\nTirar duzentos"
