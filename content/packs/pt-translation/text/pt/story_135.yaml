"text.004c": " {color:6}{tamer}{color:1} e {color:10}{partner}{color:1},\nné? Obrigado por virem\nà Vila Volume!"
"text.00ca": "Desculpem pelo que\nfizemos ao Otamamon."
"text.0122": "Deixa pra lá."
"text.0148": "Hã?"
"text.0168": "Sou grato. Ouvi dizer que\nvocês estão se esforçando\npara salvar esta ilha."
"text.0200": "Ouviu?"
"text.0218": "Eu queria te ajudar.\nJá foi às Árvores Nebulosas,\nlogo ao norte daqui?"
"text.02ca": "Ainda não."
"text.02ee": "Sim."
"text.02fe": "Lá sempre tem névoa.\nDeve ser difícil\nandar por lá."
"text.0390": "Mas você devia conhecer\no Cherrymon, que é o\nchefe da floresta."
"text.041e": "Cherrymon? Nunca ouvi falar\ndesse Digimon."
"text.0482": "O Cherrymon cria a névoa\ndas Árvores Nebulosas."
"text.04d6": "Ele criou a névoa para\nproteger a floresta do perigo."
"text.0548": "Mas isso é um problema\npara nós."
"text.0594": "Acho que o Cherrymon sabe\nalgo sobre a causa dos\nproblemas da ilha."
"text.062e": "Vale a pena atravessar\na névoa para vê-lo."
"text.0688": "Se der para fazer algo\ncom a névoa."
"text.06da": "O único que pode tirar\na névoa é o Cherrymon."
"text.074a": "Mas há um jeito de passar.\nVou lançar um feitiço em você."
"text.07be": "O que vai acontecer?"
"text.07ee": "Você vai ver o caminho\nmesmo com a névoa."
"text.0860": "Ah, que bom!"
"text.0888": "Certo, vou começar."
"text.08b8": "Croac, croac!"
"text.08f6": "Bom. Perfeito.\nAgora vá às Árvores Nebulosas."
"text.0974": "Eu o encontrei.\nA névoa sumiu."
"text.09ba": "Uau, que incrível! Bom, como\nposso te ajudar?"
"text.0a2a": "Tá, deixe eu te dar isto."
"text.0a6c": "Consegui um\n{color:6}Digirrobalo{color:1}!"
"text.0abc": "Jogue outra coisa fora."
"text.0b04": "É uma coisa muito rara.\nVai ser útil para você."
"text.0b72": "Obrigado. Então, por que não\nvem para a cidade, Shogun?"
"text.0bde": "Sou chefe de cem Gekomon\nno Pântano Geko. Desculpe,\nmas não posso ir com você."
"text.0c84": "Mas, em troca, faço o que\npuder daqui mesmo.\nVenha quando quiser."
"text.0d58": "Parece que você tem um\nproblema. É a fantasia, né?"
"text.0dce": "Você sabe disso?"
"text.0dfa": "Não me subestime. O Numemon\nvai conseguir vesti-la."
"text.0e68": "Surpreso? E não é só isso:\nquando ele vestir... Você\nnem vai acreditar... Teste aí."
"text.0f4e": "Aliás, vou tirar dos seus\nitens a {color:6}Vara incrível {color:1}\nde pescar."
"text.0fe0": "É um item especial."
"text.1022": "Boa sorte!"
"text.1052": "Só dá para pescar no\nLago Olho de Dragão."
"text.10a6": "Para trás, para trás!"
"text.10da": "O Shogun coleciona itens\nraros. Antes ele\ncolecionava itens."
"text.1154": "Mas agora ele está vidrado\nem cartas Digimon."
"text.11aa": "Se trouxer uma carta rara,\nele te dá\npontos de mérito."
"text.1222": "Você junta cartas e pontos\nde mérito e troca por\nitens.{stop}{stop}"
"text.12bc": "Bom... não, nada. Croac."
"text.12fe": "Com licença... Quero ir para\na cidade. Croac!"
"text.1362": "Tá, mas o que houve?"
"text.1396": "Quero lutar na Arena.\nParece que nós, a\nTribo Gekomon,{stop}"
"text.142e": "somos desprezados como\nDigimon do interior. Croac."
"text.1494": "É, somos do interior, mas\ntemos orgulho! Croac.{stop}"
"text.1522": "Entendo como se sente.\nEntão tente. Boa sorte!"
"text.1582": "Gekomon entrou na Arena!"
