text.0116: "Acho que já tiramos quase\ntoda a terra."
text.0182: "O trabalho vai bem.\nObrigado.\nEspere só mais um pouco."
text.021e: "Obrigado pelo trabalho.\nAqui está o pagamento."
text.0296: "Ganhei quinhentos Bits\npelo trabalho!"
text.02d8: "HP sobe cinquenta!\nAtaque sobe cinco!\nDefesa sobe cinco!"
text.0396: "Despeje a terra fora\ndo túnel, por favor."
text.040a: "Pegue do monte de terra."
text.0476: "Vai carregar terra?"
text.04b4: "Seu Digimon parece cansado.\nQue tal descansar primeiro?"
text.054c: "Vai carregar terra?"
text.058c: "Sim\nNão"
text.05b8: "Isto não é lugar para\namadores. Afaste-se,\né perigoso demais."
text.065e: "Este túnel ainda não foi\naberto. Não atrapalhe\no nosso trabalho."
text.06d8: "Desculpe. Sabe quando\nvai ficar pronto?"
text.072e: "Não sei,\nvai demorar um pouco."
text.077c: "Que problema.\nPodemos ajudar?"
text.07c0: "Querem roubar a nossa\ndiversão? Bom, vocês\npodem carregar terra."
text.083c: "O que é?"
text.0866: "Cavei aquela terra.\nVocês podem levá-la\npara fora e despejar."
text.08de: "É um trabalho duro, então\nvou pagar quinhentos Bits\npor cada ida e volta."
text.096e: "Assim a escavação vai mais\nrápido. Ganho dinheiro\ne ainda é um bom treino."
text.0a0c: "OK\nNão, obrigado"
text.0a3a: "Transporte de terra\nUse {color:6}△ {color:1}para pôr uma\ncaixa diante da terra.\nDespeje fora do túnel.\nAo terminar uma volta,\navise o Drimogemon."
text.0b66: "Está com medo?"
text.0bae: "Caixa de terra adicionada."
