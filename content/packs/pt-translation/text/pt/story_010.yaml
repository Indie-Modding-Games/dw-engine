text.0090: "Se acha o tal, né!"
text.00dc: "O que foi que eu te fiz!?"
text.0156: "{color:7}? ? ? {color:1}\nEspere!"
text.02f0: "Meu nome é Ninjamon!"
text.033a: "Você é {color:6}{tamer}{color:1}?\nE você deve ser {color:10}{partner}{color:1}!"
text.0380: "Você é famoso até na\nVila Ninja. Aceite meu\ndesafio para lutar."
text.041e: "Claro\nOutra hora"
text.0454: "Ha, é o que você pensa!"
text.04e0: "Você é tão forte quanto\ndizem. Por favor, me\naceite como discípulo!"
text.0580: "Discípulo? Bom, isso eu\nnão faço. Mas você pode nos\najudar a fazer uma cidade."
text.060a: "Certo.\nTambém é um bom treino.\nVou me esforçar."
text.076c: "Ninjamon entrou na cidade!"
text.07b8: "Ei, você!"
text.07d0: "Como assim?\nPor que você está aqui?"
text.081c: "Ei, {color:6}{tamer}{color:1}!"
text.0834: "Quando tentei ter meu\npróprio harém na cidade,\nme expulsaram!"
text.08ce: "Ouvi dizer que você anda\nindo muito bem. Vou te\nvender uma coisa boa!"
text.0962: "É a valiosíssima\n{color:6}Banana ouro{color:1}."
text.09c0: "São 50.000 Bits.\nNada de fiado, por favor."
text.0a24: "Pagar\nNão pagar"
text.0a76: "Tonto! Você leva coisa demais!"
text.0abe: "Opa, estou com itens demais!"
text.0afe: "Muito obrigado!"
text.0b30: "Humanos devem pagar com\ndinheiro de verdade."
