"text.0054": "Pare de brincadeira!"
"text.0084": "Tá bom. Acho que não\nvou fazer de novo."
"text.00e2": "Acho que esta é\na última sala."
"text.0156": "{color:7}??? {color:1}\nQual delas?"
"text.0198": "Essa voz... parece a do\nWaruMonzaemon!"
"text.01ec": "Caixa grande ou caixa\npequena. Eu leio sua mente!"
"text.0250": "Caixa grande\nCaixa pequena"
"text.0304": "Hã? Aaahhhh!"
"text.04a2": "Ha ha ha, seu bobo!\nVocê errou!"
"text.052c": "Ohhhh, você descobriu!\nHe he he. Nervoso?"
"text.059a": "Droga, qual é a graça?"
"text.05ce": "Uau, não se empolgue.\nPor que veio aqui hoje?\nQuer trabalhar para mim?"
"text.0674": "Devolva o amigo\nque você raptou!"
"text.06c6": "Amigo? Do que está falando?\nEu pareço alguém que\nfaria uma coisa dessas?"
"text.0768": "Parece!"
"text.077a": "Uau, acertou de novo!\nSim, fui eu! Eu que fiz!"
"text.07ec": "Mas sabe que não vai\ntê-lo de volta.\nPorque sou o WaruMonzaemon."
"text.0878": "Se é assim que você pensa,\nvou te obrigar!"
"text.08d2": "Está brincando?\nVocê vai me derrotar?"
"text.0930": "Sabe de uma coisa?\nÉ melhor acordar e\nencarar a realidade!"
"text.09e0": "Ei, devolva o amigo\nque você raptou."
"text.0a4a": "Ugghhh.... não pode ser!\nNão acredito,\nestou perdendo...."
"text.0ae2": "Anda logo!"
"text.0afa": "Bom... acho que\nnão tenho escolha. Tome."
"text.0bd8": "Hã? Uauuu.... ei!"
"text.0d54": "Ei, pare de enrolar,\njá chega!"
"text.0dae": "Ei, não entendeu a piada?\nTome. É este aqui."
"text.0e2c": "O que é isto?\nÉ uma engrenagem."
"text.0e6e": "É, isso mesmo."
"text.0ea4": "Este é o amigo???"
"text.0ed6": "Bom, não peguei mais\nnada. Sério."
"text.0f32": "Acho que vou levar\nisto de volta por ora."
"text.0f94": "Você! Não faça mais nada\nde mau, entendeu?!"
"text.0ff8": "Tá bom. Acho que não vai\nacontecer de novo."
"text.105c": "Algo me diz que é mentira,\nmas tenho muita coisa\npara resolver."
"text.1104": "Ah, não, tenho itens\ndemais. Tenho que\njogar um fora."
"text.1182": "Consegui uma {color:6}Engrenagem{color:1}!"
"text.11ba": "O quê? Quem é você?"
"text.11e6": "Quem sou eu? Quem é você?!"
"text.1292": "Consegui um {color:4}Chaveiro\nDimensional{color:1}! Agora levo\naté vinte itens."
"text.1354": "Consegui um {color:4}Chaveiro\nDimensional{color:1}! Agora levo\naté vinte itens."
