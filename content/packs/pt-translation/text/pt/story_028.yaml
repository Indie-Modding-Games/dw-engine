text.002c: "Consertei a placa da entrada."
text.0086: "Que calor! Faça alguma coisa!"
text.00c8: "O que está acontecendo?"
text.00f4: "Está quente demais!\nNão aguento mais!"
text.0178: "Fiquei esquisito\npor causa do calor."
text.01c8: "Sei que está quente, mas...\nfica frio, cara!"
text.0218: "Quanto mais cavamos, mais\nquente fica. O túnel\nfica num vulcão."
text.02a0: "Acho que não é só por isso.\nTalvez tenha fogo\naqui perto."
text.0330: "Hmmm"
text.0340: "Não tenho escolha.\nPreciso aguentar o calor\ne continuar cavando."
text.03d0: "Vamos investigar a causa.\nSeria ótimo se o túnel\nchegasse do outro lado."
text.045a: "Você é gente boa.\nVou me apressar e\ncavar este túnel!"
text.050e: "Hoje eu cuido\nda comida."
