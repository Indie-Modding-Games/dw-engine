"text.0582": "{color:5}Treino: Golpear árvore {color:1}"
"text.05bc": "Começar\nExplicar\nSair"
"text.05f4": "Normal\nTentativa bônus\nSair"
"text.0632": "Golpeie uma árvore para\ntreinar. Aumenta muito\nAtaque e Velocidade."
"text.06c2": "Explicar de novo\nComeçar\nSair"
"text.071c": "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}\npara alinhar três figuras"
"text.07aa": "{color:5}Treino: Luva de boxe,\nmelhorado {color:1}"
"text.0800": "{color:5}Treino: Luva de boxe {color:1}"
"text.083c": "Começar\nExplicar\nSair"
"text.0874": "Normal\nTentativa bônus\nSair"
"text.08b2": "Ganhe força com a máquina\nde socos. Aumenta Defesa\ne Inteligência."
"text.0946": "Explicar de novo\nComeçar\nSair"
"text.09a0": "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}\npara alinhar três figuras."
"text.0a30": "{color:5}Treino:\nCorrida, melhorado {color:1}"
"text.0a78": "{color:5}Treino: Corrida {color:1}"
"text.0aa6": "Começar\nExplicar\nSair"
"text.0ade": "Normal\nTentativa bônus\nSair"
"text.0b1c": "Corra pelo circuito.\nAumenta muito\nVelocidade e HP máximo."
"text.0b88": "Explicar de novo\nComeçar\nSair"
"text.0be2": "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}\npara alinhar três figuras."
"text.0c72": "{color:5}Treino:\nAula de {color:6}{tamer}{color:1}{color:5},\nmelhorada {color:1}"
"text.0ccc": "{color:5}Treino:\nAula de {color:6}{tamer}{color:1}{color:5} {color:1}"
"text.0d0c": "Começar\nExplicar\nSair"
"text.0d44": "Normal\nTentativa bônus\nSair"
"text.0d82": "{color:6}{tamer}{color:1} ensina muitas\ncoisas. Aumenta\nInteligência e MP máximo."
"text.0df2": "Explicar de novo\nComeçar\nSair"
"text.0e4c": "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}\npara alinhar três figuras."
"text.0ece": "Ei, tenho uma dica nova."
"text.0efe": "Com Digimon Bebê ou\nTreinamento, tente repetir\no mesmo treino."
"text.0f88": "Algo bom vai acontecer."
"text.0fd4": "Mais uma dica nova."
"text.0ffa": "Na Tentativa bônus, se alinhar\nfiguras iguais, a habilidade\naumenta muito."
"text.10b0": "Ah, eu ia falar sobre\nas técnicas."
"text.110e": "As técnicas que um inimigo\nusa podem ser dominadas\nse você vencer a batalha."
"text.1198": "Mas só dá para dominar as\ntécnicas que podem ser\naprendidas naquele momento."
"text.1226": "Não dá para dominar tudo.\nMas batalhar é o jeito mais\nrápido de dominar técnicas."
"text.12d0": "Também dá para dominá-las\ntreinando, mas é difícil."
"text.134e": "Quando ficar mais esperto, vá\nà aula de {color:6}{tamer}{color:1} e talvez\naprenda uma técnica."
"text.13e6": "A chance de aprender é baixa,\nentão não espere demais.\nTreine com equilíbrio!"
"text.148c": "Ei, eu sou o Koromon.\nO Jiji pediu para eu te\nexplicar o treino."
"text.1506": "Quer me perguntar algo?"
"text.153c": "Que treino?\nMe ensine a treinar\nNão, nada"
"text.15b2": "Treinando aqui, você\npode aumentar as habilidades\ndo seu Digimon."
"text.162c": "Treinar cansa, mas rende\nmais do que uma\nbatalha de verdade."
"text.16c8": "E, muito raramente, dá\npara dominar técnicas novas."
"text.173a": "Da próxima vez eu conto\nmais sobre as técnicas."
"text.17a0": "Aqui há seis estações de\ntreino, e cada uma tem\numa placa por perto."
"text.182a": "Tente apertar {color:6}△ {color:1}\nna frente da placa."
"text.187c": "Lendo as placas, você vai\nsaber quais habilidades\npode aumentar."
"text.18fe": "Conforme a especialidade do\nseu Digimon, algumas\nhabilidades sobem mais."
"text.19aa": "Mas você só vai ter certeza\nquando tentar."
"text.1a0a": "Depois de 'Começar',\nescolha 'Normal' e\ntreine por uma hora."
"text.1a7a": "Durante o treino, com\n{color:5}× {color:1}você pode\navançar o tempo."
"text.1ae6": "Ah, é, preciso te falar\nda 'Tentativa bônus'."
"text.1b48": "Se der certo, a Tentativa\nbônus aumenta muito o poder,\nmas pouco se falhar."
"text.1be4": "Tente uma vez e você vai ver."
"text.1c24": "Bom, logo trago mais\nnovidades para você."
"text.1d7c": "Eu fui para a cidade, mas\nera urbana demais para\nmim, então vim para cá."
"text.1e10": "Eu modifiquei o equipamento.\nFicou melhor. Treine duro!"
"text.1e86": "Eu fui para a cidade, mas\nera urbana demais para\nmim, então vim para cá."
"text.1f1a": "Eu modifiquei o equipamento.\nFicou melhor. Treine duro!"
