"text.0322": "{color:5}Treino: Cachoeira {color:1}"
"text.0354": "Começar\nExplicar\nSair"
"text.038c": "Normal\nTentativa bônus\nSair"
"text.03ca": "Leve o impacto da Cachoeira.\nAumenta MP máximo\ne Defesa."
"text.0448": "Explicar de novo\nComeçar\nSair"
"text.04a2": "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}\npara alinhar três figuras."
