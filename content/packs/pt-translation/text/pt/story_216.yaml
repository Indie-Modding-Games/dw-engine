text.0024: "Olá, {color:6}{tamer}{color:1}.\nSurpresa! Eu abri\numa clínica!"
text.007a: "É para tratar doenças\ne ferimentos. Não é de graça,\nmas vai ser barato."
text.0130: "Seu Digimon não parece\nbem. Você precisa cuidar\nmelhor da saúde."
text.01be: "Vou tratar agora e te\ndar um desconto.\nTrezentos Bits."
text.025e: "Não tem Bits suficientes?\nMe pague o que puder."
text.0304: "Agora está tudo bem.\nSó tome mais cuidado."
text.038a: "Seu Digimon parece bem.\nDo que você precisa?"
text.03e6: "Tire o cansaço\nVenda remédio\nNada"
text.046c: "O cansaço de {color:10}{partner}{color:1}\nestá muito alto, precisa\ndescansar já."
text.04ec: "{color:10}{partner}{color:1} já se cansou.\nPrecisa descansar agora."
text.0548: "{color:10}{partner}{color:1} mostra um\npouco de cansaço. Não deve\nse esforçar demais."
text.05c2: "{color:10}{partner}{color:1} está bem.\nFique de olho no cansaço."
text.0634: "Já deu para relaxar?"
text.066e: "Precisa de mais alguma coisa?"
text.06a0: "Vamos descansar mais\nVenda remédio\nNada"
text.0706: "Deve ficar bem."
text.0732: "Atadura: 400 Bits\nRemédio: 1200 Bits\nNão comprar"
text.07c0: "Quando não estiver bem,\nvenha me ver."
text.0826: "Se o cansaço continuar,\ntreine menos e cuide da\ncomida e do sono."
text.08c8: "Ficar muito tempo em\nlugares frios ou quentes\npode causar doenças."
text.0958: "A atadura só serve\npara ferimentos."
text.09b2: "O remédio cura doenças,\nmas não diminui\no cansaço."
text.0a50: "Se o HP estiver baixo no\nfim de uma batalha, o\nDigimon se machuca fácil."
text.0ae8: "Manter a felicidade e o\ncansaço em bons níveis\ngarante uma vida longa."
text.0b8c: "Você não tem Bits suficientes.\nNão posso te vender isso."
text.0c0e: "Você tem itens demais."
text.0c62: "Você não tem Bits suficientes.\nNão posso te vender isso."
text.0ce4: "Você tem itens demais."
text.0d28: "Precisa de mais alguma coisa?"
text.0d5a: "Tire o cansaço\nVenda mais remédio\nNão, nada"
