text.0438: "{color:1}Branco Branco Branco\n{color:2}Azul Azul Azul\n{color:3}Vermelho Vermelho\n{color:4}Rosa {color:5}Verde\n{color:6}Celeste Celeste\n{color:7}Amarelo {color:10}Laranja\n{color:10}a {color:6}b {color:4}c {color:5}d"
text.051c: "Agora são {num:pstat=107}: {num:pstat=108}\ndo dia {num:pstat=106}\ndo mês {num:pstat=105}."
text.0582: "Sou o Sr. Teleporte.\nAonde você quer ir?"
text.05d6: "Perto\nLonge\nMuito longe"
text.0620: "Topo do Monte Panorama\nSelva Tropical\nTúnel Broca"
text.069e: "Savana Engrenagem\nMansão do Lorde Cinza\nGrande Cânion"
text.070c: "Reg. Dino Antiga: portão\nReg. Dino Antiga: fundo\nMundo desconhecido"
text.07b6: "Frente à Caverna do Curling\nPesca do Seadra\nCaverna de Lava"
text.083e: "Vida três"
text.085a: "Sou o Sr. Digievolução.\nO que você quer ser?"
text.08bc: "Numemon\nSukamon\nBotamon"
text.0a50: "Quase morto\nModo abertura\nAvançar o tempo"
text.0acc: "Avançar uma hora\nAvançar seis horas\nAvançar dez dias"
text.0b76: "Quer um pouco de Carne?"
text.0bae: "Ai, desculpe.\nEsqueci de explicar."
text.0bfa: "Esta é uma Fazenda de Carne.\nCultivamos Carne para todos."
text.0c60: "Vocês cultivam Carne?"
text.0c98: "Sim, qual o problema?"
text.0cc4: "Nada... tudo bem.\nPode continuar..."
text.0d20: "Eu e o Jiji decidimos te dar\ntrês pedaços de Carne\npor dia, {color:6}{tamer}{color:1}."
text.0da4: "Então, aqui está a Carne\nde hoje."
text.0df6: "Você tem Carne demais.\nAcho que hoje você\nnão precisa."
text.0e82: "Você tem Carne demais.\nEu fico com o que você\nnão conseguir carregar."
text.0efa: "Ganhei três pedaços de\n{color:6}Carne{color:1}!"
text.0f52: "Você tem itens demais."
text.0f8a: "Ganhei três pedaços de\n{color:6}Carne{color:1}!"
text.0fea: "Colhemos muita Carne!\nEntão vou te dar\ncinco pedaços de Carne."
text.1088: "Você tem Carne demais.\nAcho que hoje você\nnão precisa."
text.1110: "Você tem Carne demais.\nEu fico feliz com o que\nvocê não conseguir levar"
text.1192: "Ganhei cinco pedaços de\n{color:6}Carne{color:1}!"
text.11f0: "Desculpe, mas\nvocê tem itens demais."
text.1246: "Ganhei cinco pedaços de\n{color:6}Carne{color:1}!"
text.1286: "Amanhã te dou mais."
text.12d8: "Aqui está a Carne de hoje."
text.131e: "Você tem Carne demais.\nAcho que hoje você\nnão precisa."
text.13a6: "Você tem Carne demais.\nEu fico feliz com o que\nvocê não conseguir levar."
text.142a: "Ganhei três pedaços de\n{color:6}Carne{color:1}!"
text.148a: "Você tem itens demais."
text.14c4: "Ganhei três pedaços de\n{color:6}Carne{color:1}!"
text.1506: "Amanhã te dou mais."
text.154c: "O quê? Hoje eu já te dei\nCarne, lembra?"
text.159e: "Se a comida acabar,\nprocure cogumelos na\nFloresta Nativa."
text.1620: "Certo, vou te explicar os\narredores desta cidade."
text.1692: "A Floresta Nativa\ncerca a cidade."
text.16da: "Os Digimon de lá\nnão são muito fortes."
text.173a: "Tem um Campo de Treino\na oeste. Acho que você\nvai lá sempre."
text.17d4: "A Selva Tropical fica a\nleste, do outro lado do rio."
text.1846: "Não sei o que tem depois."
text.1888: "Tem uma montanha e um lago\na oeste, e lá não\ntem saída."
text.1910: "Seguindo para o sul,\nvocê chega ao mar."
text.196a: "E tem uma montanha alta\nno norte. Lá também\nnão tem saída."
text.19ee: "Como esta cidade é o centro\nda ilha, deve haver\ngrandes áreas no norte."
text.1a9c: "Vou investigar os boatos\nsobre as redondezas.\nVolte para saber mais."
