"text.0090": "Quem está aí?"
"text.00ba": "Lá vou eu! Brincadeira."
"text.0100": "Ha ha ha. Isso é ótimo."
"text.0144": "Ah, vou me\ndivertir com isso!"
"text.018c": "Tá falando sério?!"
"text.01c4": "Ei, tá falando sério?!"
"text.0206": "Silêncio!"
"text.022e": "Eu consigo quando\ncoloco na cabeça!"
