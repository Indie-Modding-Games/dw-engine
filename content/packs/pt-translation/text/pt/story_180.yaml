text.006c: "Não estou me sentindo bem."
text.0098: "Você está bem?"
text.00c0: "Estou passando mal."
text.00ec: "É aqui que você mora?"
text.0122: "Estou doente. Sem energia."
text.0158: "Você está péssimo."
text.017e: "Está piorando."
text.01ac: "Tenho que descobrir por quê."
text.01e6: "De onde vem esta\nágua suja?\nVou dar uma olhada!"
text.0282: "O que é isto?"
text.02b2: "O que houve, {color:10}{partner}{color:1}?!"
text.02ea: "Esta névoa fede!"
text.0312: "É estranha, meio nojenta."
text.0350: "Pronto, o esgoto\nvoltou ao normal."
text.039a: "Agora ele vai ficar bem.\nResolvi o problema."
text.040c: "Tem algo errado!"
text.0450: "Da da da!"
text.04bc: "Estou cansado.\nO que houve com vocês?"
text.050e: "Ele parece mais bobo!\nTalvez tenha voltado a si."
text.0574: "Está me chamando de bobo?\nQue grosseria! Sou o Numemon."
text.05e8: "Se você não é bobo,\no que você é?"
text.0630: "Com licença, Numemon. Sabe\nquem salvou a sua vida?"
text.06a0: "Hã? Quer que eu\nsalve a sua vida? Tá bom."
text.06fc: "Argh. Ele não entende\nnada! Bom, tanto faz."
text.0766: "Ei, vou ser um herói. Legal!"
text.07ae: "Venha para a nossa cidade.\nVocê sabe onde fica?"
text.081c: "Mais ou menos."
text.087c: "Numemon entrou na cidade!"
text.08ce: "Quem está aí?!"
text.08ec: "Quem é você?!"
text.0984: "Consegui um {color:4}Chaveiro\nDimensional{color:1}! Agora posso\nlevar até vinte itens!"
text.0a46: "Consegui um {color:4}Chaveiro\nDimensional{color:1}! Agora posso\nlevar até trinta itens!"
