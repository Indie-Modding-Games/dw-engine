text.007c: "Vou ganhar!"
text.00ae: "Você nunca vai me vencer!"
text.00ee: "He he! Sinto muito!"
text.012c: "Está me ignorando?"
text.017a: "Se quiser passar, vai ter\nque aceitar meu desafio."
text.021c: "Baixei a guarda, mas dois\ncontra um não é justo."
text.028a: "Bem, pode ser\nNão seja mau perdedor"
text.02ea: "Nunca perco para ninguém\nnuma luta justa."
text.034e: "Vamos lutar um contra um.\nVolte amanhã às quatro horas.\nSó os Digimon vão lutar."
text.03fe: "Combinado\nNão, obrigado"
text.0436: "Então está prometido.\nAté amanhã!"
text.04e6: "Que bom que voltou.\nHoje vamos lutar limpo!"
text.0550: "Você se atrasou, mas assim\neu cuidei do meu ferimento.\nAgora, vamos nessa."
text.05f2: "Eu só vou assistir. Comecem!"
text.0630: "Vai, {color:10}{partner}{color:1}!"
text.067e: "Você é bom! Quem é você?"
text.06b8: "Estamos explorando para\nsalvar a ilha do perigo."
text.0734: "O quê?"
text.0746: "{color:6}{tamer}{color:1} se esforça\npara convencê-lo!"
text.079a: "Vou ajudar vocês. Mas antes\nquero ver essa cidade."
text.0844: "Garurumon entrou na cidade!"
