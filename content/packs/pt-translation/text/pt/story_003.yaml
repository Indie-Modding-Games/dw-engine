text.0062: "Sai daqui!"
text.008a: "Some!"
text.00b2: "É meu!"
text.00dc: "Peguei!"
text.0114: "{color:7}? ? ? {color:1}\n..."
text.013c: "{color:7}? ? ? {color:1}. Uma flor."
text.0172: "{color:7}? ? ? {color:1}\nEu sou uma flor."
text.01ae: "{color:7}? ? ? {color:1}\nEu disse que sou uma flor!\nNão está ouvindo!?"
text.0262: "Odeio brigar."
text.028e: "Nesse caso,\nvenha para a cidade."
text.02d6: "Lá é tranquilo."
text.030a: "A cidade?"
text.0322: "Parece divertido.\nSou a Palmon.\nVou ser muito útil!"
text.03cc: "Palmon entrou na cidade!"
