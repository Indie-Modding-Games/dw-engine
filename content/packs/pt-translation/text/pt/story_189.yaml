text.00a6: "Você trouxe algo para\ncuidar da ferida?"
text.0104: "Só um segundo. Deixa eu ver..."
text.014c: "Minha asa está doendo!"
text.0170: "O que aconteceu?"
text.0194: "Machuquei a asa. Você tem\nalgo para cuidar da ferida?"
text.020a: "Parece feio. Aguente.\nO que eu faço?"
text.027c: "Não tenho nada agora."
text.02f8: "Não adianta. Assim não dá!"
text.0346: "Está bem melhor. Obrigado."
text.0386: "Já consegue voar?"
text.03b6: "Acho que não consigo\nvoar longe."
text.03f6: "Tem uma clínica na cidade.\nVocê devia ir lá.\nNão fica longe daqui."
text.048a: "Ouvi falar da cidade.\nÉ maior do que eu pensava."
text.04f8: "Vá para a cidade descansar."
text.0534: "Obrigado. Talvez um dia\neu possa te ajudar."
text.05c2: "Unimon entrou na cidade!"
text.0602: "Vou trazer algo para cuidar\nda sua ferida. Me espere."
text.0678: "Obrigado. Depressa,\npor favor!"
