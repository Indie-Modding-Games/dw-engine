text.006a: "Shwaa!"
text.008c: "Sha sha shaaaa!"
text.00c0: "Não parece ter se machucado."
text.010e: "Vou te dar um desconto."
text.0156: "Não tire sarro da gente!"
text.0196: "Você não vai voltar\npara casa vivo!"
text.0262: "Ai!"
text.027a: "Para uma queda tão grande,\nvocê parece bem."
text.02dc: "{color:10}{partner}{color:1},\nvocê está bem?"
text.0310: "Uau, você parece bem!"
text.033c: "Você voou? Isso é trapaça!\nBom, acho que nem tanto."
text.03b6: "Vamos!"
text.03ea: "Ai!"
text.0402: "Para uma queda tão grande,\nparece estar bem."
text.0460: "{color:10}{partner}{color:1},\nvocê está bem?"
text.0494: "Acho que dói. Desculpe."
text.04d4: "Vamos!"
