text.0010: "Eu estava te esperando!"
text.0044: "Você está voltando\nao normal?"
text.0092: "Estou me sentindo\nmeio esquisito."
text.00d8: "Ei,\nisso é sério, sabia?"
text.011e: "A fábrica está fechada, então\ntenho muito tempo livre.\nVou te ajudar!"
text.01b0: "Ele voltou ao normal, mas\nainda parece maluco!\n? ainda parece maluco!"
text.024c: "Taaaa bom, me desculpeeee.\nAté mais!"
text.02d6: "Giromon entrou na cidade!"
