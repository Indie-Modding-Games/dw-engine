text.004e: "Não devia ir para casa?"
text.0090: "Vá para casa!"
text.00b6: "Você devia voltar!"
text.010c: "Ai, que ofuscante!"
text.014c: "{color:7}??? mon {color:1}\nVocê que busca minha ajuda,\na hora chegou! Eu te dou\na bênção das minhas asas!"
text.0206: "Mas o quê...? Onde...?\nDe quem é essa voz...?"
text.0252: "Ugh!"
text.0274: "O que foi aquilo? A luz\nsumiu. Não há mais nada\naqui. Então está lá em cima?!"
