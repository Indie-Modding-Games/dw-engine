text.0060: "Daa!"
text.007e: "Haa!"
text.009c: "Gghhee!"
text.00c6: "Leste: Elevador\nOeste: Perigo, penhasco"
text.0120: "Modo Ogro : LIGADO\nModo Ogro : DESLIGADO"
text.0196: "O quê?"
text.01fa: "Senti o chão se mexer.\nFoi imaginação minha?"
text.02c8: "O quê? Não pode ser!"
text.0344: "{color:6}{tamer}{color:1}Uau!!"
text.0370: "Cuidado com desabamentos!"
text.03d6: "Ouvi dizer que é nesta\nestrada que bandidos atacam."
text.0438: "Vamos, {color:10}{partner}{color:1}."
text.0480: "Iu-hu!"
text.049c: "Ha ha!"
text.04b0: "Iaa-hu!"
text.050e: "Desista e deixe suas coisas!\nOu então!"
text.0562: "Não, desista você!"
text.058a: "O quê?! Vocês...?"
text.05ae: "Não pode ser."
text.05ce: "Chefe, o que a gente faz?"
text.0602: "Calma, somos mais fortes\ne estamos em maior número.\nPeguem eles!"
text.06d2: "Um dia eu me vingo\nde vocês!"
text.0724: "Olha eles correndo! Não vão\nvoltar tão cedo."
