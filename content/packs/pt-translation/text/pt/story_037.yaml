text.00a2: "Vou te nocautear!"
text.00de: "Ei, não me empurre!"
text.011a: "Aqui em cima é tranquilo!"
text.015c: "Vou cair! É perigoso!"
text.01a6: "Não faça isso aqui em cima!"
text.01e8: "Nem tente lutar comigo!"
text.0238: "Elevador"
text.0250: "Descer\nNão entrar"
text.0302: "Nada acontece.\nIsso não é bom."
