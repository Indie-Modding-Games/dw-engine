text.004e: "Tenho um mau pressentimento..."
text.0098: "Eu sabia que você viria!"
text.00e4: "Quem é você?"
text.0104: "Sou Devimon, um anjo sombrio.\nTenho o poder das trevas."
text.017c: "Você sabe de alguma coisa?"
text.01b0: "Myotismon está na mansão.\nTalvez ainda esteja vivo."
text.021e: "Foi você que fez isso?"
text.024a: "Não sei... só sei que\nvocê é meu inimigo."
text.02c2: "Você não vai escapar!"
text.030c: "Ha ha ha!"
text.034a: "Ah, não!"
text.036e: "Mande lembranças ao Myotismon."
text.03cc: "Ele fugiu!\nNão gosto desse cara."
text.048a: "Que mansão enorme!"
text.04ca: "Tem alguém em casa?"
text.0500: "Não tem ninguém ou\nnão estão me ouvindo."
text.0566: "Certo. Vamos explorar!"
text.05be: "Usei a\n{color:6}Chave mansão{color:1}!"
text.0622: "Não abre.\nEstá trancada."
text.069a: "Usei a\n{color:6}Chave mansão{color:1}!"
text.06fe: "Não abre.\nEstá trancada."
text.0776: "Usei a\n{color:6}Chave mansão{color:1}!"
text.07da: "Não abre.\nEstá trancada."
text.0866: "Não abre. Está selada por\numa força estranha."
