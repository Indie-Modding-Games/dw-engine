text.006e: "Tinha alguém que queria\nser comerciante. Dizem que\nele tem uma loja por aí."
text.011c: "Ele é mais útil que eu."
text.015c: "Por que o tempo aqui é\ndiferente de outros lugares?"
text.01ba: "Com certeza aqui é um bom\nlugar para viver, mas..."
text.0240: "Andei observando tudo\nlá do céu."
text.0292: "Ao norte há gelo e neve.\nViver num lugar tão frio\né loucura."
text.0332: "Andei observando tudo\nlá do céu."
text.0384: "A oeste há uma pequena\ncidade de ferro."
text.03e6: "Mas a entrada e a saída\nestão fechadas. Eu vou voando."
text.0460: "Andei observando tudo\nlá do céu."
text.04b2: "Há grupos de Digimon\ncom chifres ou garras."
text.0522: "Dizem que fazem suas casas\nescavando a madeira."
text.0594: "Andei observando tudo\nlá do céu."
text.05e6: "A noroeste há uma floresta\ncom construções."
text.0644: "Fica muito longe."
text.066e: "Andei observando tudo\nlá do céu."
text.06c0: "Já passou do Grande Cânion?\nÉ como um labirinto."
text.073a: "Andei observando tudo\nlá do céu."
text.078c: "Não consigo ver o centro da\nilha. Só vejo nuvens."
text.0812: "Você já ouviu isso."
text.0858: "Aqui o tempo é lento.\nMeio dia aqui é\ncomo um dia lá fora."
text.08de: "Para quem quer descansar,\né perfeito."
text.094e: "O tempo corre rápido na\nZona do Tempo Veloz.\nFica logo ali adiante."
text.09d0: "Lá passam dois dias\nem vez de um."
text.0a26: "Seu Digimon cresce mais\nrápido, mas também se\nesvai mais cedo."
text.0aaa: "Máquina de venda"
text.0ad0: "O que será que vai sair?\n200 Bits cada?\nCompro?"
text.0b54: "Tentar\nCancelar"
text.0b96: "Não tenho dinheiro suficiente."
text.0bec: "Saiu {color:6}Carne{color:1}!"
text.0c24: "Estou com itens demais.\nPreciso jogar alguns fora."
text.0cac: "Saiu um\n{color:6}Recup. peq.{color:1}!"
text.0d0a: "Estou com itens demais.\nPreciso jogar alguns fora."
text.0d92: "Saiu um\n{color:6}Bife{color:1}!"
text.0dce: "Estou com itens demais.\nPreciso jogar alguns fora."
text.0e56: "Saiu um\n{color:6}Disquete MP{color:1}!"
text.0e9c: "Estou com itens demais.\nPreciso jogar alguns fora."
