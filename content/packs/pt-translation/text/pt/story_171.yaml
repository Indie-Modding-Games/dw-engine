text.0034: "Bem-vindo! Meu novo negócio\né o «Guarda-Itens».\nGuardo itens dos outros."
text.00c0: "Como serviço especial,\nguardo seus itens de graça."
text.0144: "Sobre a digievolução...\nSobre o estágio que vem\ndepois do Digimon Campeão..."
text.01e4: "É o Digimon Ultra.\nNem sempre ele digievolui\ndepois de Campeão."
text.0286: "Para digievoluir, é\npreciso cumprir certas\ncondições à risca."
text.030e: "Mas quando digievolui\npara Ultra, a expectativa\nde vida aumenta."
text.03a8: "Mas se digievoluir comendo\num item de digievolução,\na vida não muda."
text.0464: "Mais sobre a digievolução.\nSobre as condições."
text.04c6: "Primeiro, dizem que o\npeso tem que ficar perto\ndo peso ideal."
text.0560: "E quanto mais altos os\nparâmetros, melhor."
text.05b8: "Mas, dependendo de qual\nparâmetro é mais alto,\no resultado muda."
text.0644: "Sobre os erros de cuidado,\nàs vezes é melhor\nerrar de propósito."
text.06d8: "Dependendo do Digimon\nem que vai digievoluir,\nhá condições a cumprir."
text.0768: "Há situações que podem\nprovocar a digievolução."
text.07da: "Como o número de batalhas\nou o quanto ele é\ndisciplinado."
text.0850: "Se essas condições forem\ncumpridas, mesmo que outras\nnão sejam, ele digievolui."
text.08fc: "O Jiji me disse que\n{color:10}{partner}{color:1} vai digievoluir."
text.0956: "De Digimon Bebê para\nDigimon Treinamento,\nleva só seis horas."
text.09e2: "Dali para Digimon\nNovato, leva mais ou\nmenos um dia."
text.0a68: "Depois, para Digimon\nCampeão, leva mais ou\nmenos três dias."
text.0b02: "E qual era o estágio\nseguinte? Esqueci,\nmas tem mais."
text.0b82: "A digievolução depende\ndo peso, dos parâmetros\ne dos erros de cuidado."
text.0c0a: "Não entendo\nmuito bem. Vou perguntar\nao Jiji quando puder."
