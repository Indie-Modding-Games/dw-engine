text.005c: "Myotismon! O que aconteceu?"
text.00b0: "Bakke!"
text.00c6: "..."
text.00ea: "Vou para a Arena com vocês.\nMeus homens podem sentir\nminha falta."
text.0172: "Meus homens não obedecem.\nEntão levo o SkullGreymon."
text.01d8: "SkullGreymon não é o mesmo.\nAgora ele obedece a outros."
text.024e: "Myotismon, você está bem?"
text.02a8: "Ugghh... É você!\nVocê me salvou de novo."
text.0306: "O que aconteceu?"
text.032a: "Você viu o Devimon?"
text.035e: "Vi. Ele é malvado."
text.038a: "Ele arruinou minha pesquisa\ncom maldade."
text.03da: "Sua pesquisa\nsobre o SkullGreymon?"
text.0422: "Eu estava juntando ossos\npara montá-los.\nVou ter mais cuidado."
text.04b8: "Esse Devimon é terrível."
text.04ec: "Eu o conheço bem."
text.0514: "O quê?!"
text.0528: "Ele sempre foi trapaceiro,\nmas nunca tão mau."
text.0580: "Talvez alguém tenha feito\nlavagem cerebral nele."
text.05d8: "Talvez."
text.05ec: "Se ele fosse o de sempre,\npoderia entrar no grupo."
