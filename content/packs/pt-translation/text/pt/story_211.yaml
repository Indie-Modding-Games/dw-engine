text.0020: "Bem-vindo de volta, {color:6}{tamer}{color:1}."
text.004c: "Sou o arquivista do Jijimon."
text.008a: "Registro as informações\ndo Jijimon e passo pra você."
text.00e8: "Se não souber o que fazer,\nme pergunte que eu digo\naonde ir."
text.0184: "Todos os Digimon se\nreuniram na cidade.\nMuito obrigado!"
text.0208: "Vou contar o que eu sei.\nDeixa eu ver..."
text.0266: "E depois..."
text.0288: "E também..."
text.0300: "Há Digimon Planta na\nfloresta. Quanto mais perto,\nmais difícil de ver."
text.03e6: "Os Digimon Inseto gostam\nde verde. Como o que tem\nem volta da cidade..."
text.04a6: "Na Selva Tropical há uma\nfloresta que é um labirinto.\nUm Digimon forte a protege."
text.0578: "Um veterano no rio\nestá esperando alguém."
text.0616: "Há um Digimon que adora\npraias de água quente."
text.06b0: "Cemitérios têm fantasmas.\nFantasmas adoram conversar."
text.0752: "Há um segredo no canteiro\nde flores da cidade. Pergunte\na uma planta sobre outra."
text.0828: "A Região Dino Antiga\né perigosa, mas vale\na pena dar uma olhada."
text.08ec: "Corre lava dentro do\nMonte Panorama. Alguns\nDigimon adoram o calor."
text.09a4: "Levar um Digimon que ama\no calor a um lugar frio é\ncontra as regras, mas..."
text.0a88: "Na Terra Gelada há muitos\nDigimon que virão com você.\nVá para o oeste."
text.0b58: "No pico do Grande Cânion\nvive um Digimon Pássaro."
text.0bf8: "O Grande Cânion é um\nlabirinto. Depois que entra,\né difícil sair."
text.0cb0: "Na Savana Engrenagem\nhá um Digimon que\nadora eletricidade."
text.0d60: "Nas Árvores Nebulosas pode\naparecer um Digimon\nmadrugador."
text.0e02: "No Grande Cânion\nhá uma loja cuidada\npor um Digimon."
text.0ea6: "Talvez você ache um Digimon\ncom asas que cruza o Monte\nPanorama num só bater."
text.0f84: "A Savana Engrenagem é boa\npra Digimon que não voam\nalto. Procure por lá."
text.104e: "Alguns Digimon podem saber\nde você e te desafiar."
text.10ee: "Na Terra Gelada há Digimon\nque vivem em cavernas\ne convidam outros a entrar."
text.11be: "Chame Digimon trabalhadores\npra vir à cidade quando\nterminarem suas tarefas."
text.12a2: "As Árvores Nebulosas são\nboas pra se esconder. Guiar\nquem se esconde é seu dever."
text.137c: "Quando os boatos sobre você\nse espalharem, volte aqui."
text.141e: "Uma sombra enorme aparece\nnas costas da Terra Gelada.\nTalvez seja um Digimon."
text.14f6: "Ajude os Digimon que\nadoram colecionar coisas.\nTente ir à Terra Gelada."
text.15b6: "No topo do Monte Panorama,\num Digimon vai te desafiar\nse você o encontrar."
text.1694: "Há Digimon em lugares\númidos, como esgotos.\nAjude-os com seus problemas."
text.176c: "Alguns Digimon Inseto vivem\nalém do Lago Olho de Dragão.\nVá pescar lá."
text.1832: "Quando um Digimon androide\nquebra, ele se conserta\nsozinho bem rápido."
text.18fa: "Se tiver medo do perigo,\nvai perder a meta de vista."
text.1966: "Você precisa ter coragem pra\ntentar escalar um penhasco\nperigoso pelo menos uma vez."
text.1a36: "Escute tudo o que ouvir\nna cidade sobre quem\nprecisa de ajuda."
text.1afc: "Um sujeito malvado se mudou\npra uma área bem povoada\nhá pouco. Talvez seja..."
text.1be0: "Dizem que há uma tábua\nantiga enterrada, mas\nalguém precisa desenterrá-la."
text.1ca8: "Um Digimon raro aparece\nnuma selva e desafia\nos outros pra lutar."
text.1d68: "Talvez existam Digimon que\nvivem em árvores, quem sabe?"
text.1e16: "Numa Cidade de Ferro a oeste\npode aparecer um Digimon raro\nque desafia os outros."
text.1efa: "Existe um Digimon alienígena.\nTalvez você o encontre um dia."
text.1f9e: "Existe um Digimon Animal\nMítico. Ele está numa casa\nque perdeu os donos."
text.2076: "Continue procurando o\nNanimon até conseguir\no verdadeiro tesouro."
text.2136: "O Myotismon sumiu.\nSiga as pistas que\nestão na mansão dele."
text.21f0: "Ainda há Digimon\ndesconhecidos, mas termine\nantes o mais importante!"
text.22c4: "O último Digimon vai nascer\nno último lugar aonde você\nfor. Entendeu?"
