"text.0026": "Aqui está tudo tranquilo.\nBoa sorte."
"text.0078": "Eu também tenho que ajudar.\nVou e volto entre aqui e a\ncidade sempre que puder."
"text.0128": "Andromon entrou na cidade!"
"text.0176": "O reparo dos dados terminou.\nAgora, vamos ler os dados."
"text.01e6": "Por favor."
"text.0200": "Cem anos atrás, Humanos\nAnalógicos surgiram\nna ilha Digimon."
"text.0286": "Os Humanos Analógicos e os\nDigimon nativos lutaram muito."
"text.02f0": "Após dez anos de batalha,\nos Humanos Analógicos foram\nderrotados e sumiram."
"text.038c": "Nos dez anos seguintes,\nmisteriosamente, a área da\nilha quase dobrou de tamanho."
"text.0438": "Então humanos lutaram\ncontra Digimon?"
"text.0476": "Sinto muito. Isso é tudo que\nconseguimos recuperar."
"text.04e6": "Não se preocupe. É uma \ninformação muito importante.\nAgora sei muito mais."
"text.0582": "É mesmo?"
"text.05ae": "Esses humanos devem ser os\nque causaram confusão e\nproblemas na ilha."
"text.065e": "Humanos vivem\ncem anos?"
"text.06aa": "Parece que, para humanos,\no tempo passa devagar aqui."
"text.071a": "Deve ser por isso que não\npreciso comer nem dormir aqui."
"text.078a": "Cem anos é muito\ntempo. Esses caras\ndevem ser bem durões."
"text.081c": "Acha que eles estão\nescondidos em algum lugar?"
"text.0872": "Vou encontrá-los\ne dar um jeito."
"text.08b8": "Agora sei por que vim. \nComo sou humano,\npreciso lidar com eles."
"text.095e": "Sentimos muito. Vamos fechar\na fábrica por um tempo."
"text.09d6": "Com os problemas de agora,\nninguém sabe o que vai\nacontecer. Não é culpa sua."
"text.0a8a": "Acho que tem alguém\ncontrolando o Giromon."
"text.0aea": "Os computadores foram\ndestruídos e a água suja\ncomeçou a vazar."
"text.0b62": "Essa água enlouqueceu os\nDigimon. Não acho que\nseja coincidência."
"text.0bee": "Estes computadores são\nmuito importantes."
"text.0c46": "Pode ser tarde demais,\nmas acho que alguém\nestava atrás de nós."
"text.0cc8": "O quê?!"
"text.0cdc": "Acho que havia dados sobre\no passado da ilha nestes\ncomputadores."
"text.0d78": "Mas, por causa da revolta\ndo Giromon, os dados\nforam destruídos."
"text.0dec": "Você nunca viu esses dados?"
"text.0e2a": "Não, mas talvez dê para\nrecuperar uma parte. Vou\ntentar juntar os dados."
"text.0eca": "Entendi, obrigado.\nQuanto tempo vai levar?"
"text.0f22": "Vai demorar. Vou reabrir\na entrada da cidade,\nentão volte depois."
"text.0fb2": "Obrigado. Eu volto."
"text.0ff6": "Terminou de\nconsertar os dados?"
"text.1044": "Vai demorar mais um pouco.\nVolte depois."
"text.10a2": "Tá, eu volto."
"text.10ea": "Ei, ei!"
"text.1104": "Preciso pedir desculpas."
"text.113c": "Faça isso depois! Agora você\ntem que parar a fábrica!"
"text.11ba": "Tá bom, vou parar."
"text.11ee": "A fábrica acabou de\nparar de funcionar."
"text.1246": "Ótimo, vou checar o esgoto.\nFalou, cara."
"text.12b2": "Preciso pedir desculpas."
"text.12dc": "Não temos tempo para\nfalar disso agora!"
"text.133e": "Nosso computador é perfeito."
"text.1376": "A fábrica está segura mesmo?\nO que podemos fazer agora?"
"text.13e8": "Tá, temos que dar um jeito\nnos guardas. Não temos\noutra saída!"
"text.1482": "Como você entrou na cidade?"
"text.14ca": "Se não tem nada para\nfazer aqui, vá embora!"
"text.1546": "Falamos disso depois.\nAgora preciso checar\na fábrica."
"text.15cc": "É uma situação de vida ou\nmorte. Me dê a permissão!"
"text.163e": "Não entendo bem o que\nvocê quer fazer.\nNão posso dar permissão."
"text.16e4": "Tem Digimon prestes a\nsumir por causa da água\nsuja da fábrica!"
"text.178e": "Da fábrica? Impossível!\nO sistema de limpeza da\nágua suja funciona bem."
"text.182a": "Como sabe que funciona bem\nse ninguém checou?!"
"text.18a6": "Nosso computador é perfeito.\nEm emergências, o Guardião\nda Rede desliga o sistema."
"text.1952": "Está dizendo que o Guardião\nda Rede sempre vai\nfuncionar direito?"
"text.19de": "Guardião da Rede é outro\nnome do Giromon, que é\num Digimon Ultra."
"text.1a68": "O julgamento e a habilidade\ndele são perfeitos."
"text.1ac2": "Ele é um Digimon?! Ah, não,\nisso piora tudo.\nPor favor, me dê permissão!"
"text.1b7c": "Saia! Agora!"
"text.1ba2": "Ai... Droga!"
