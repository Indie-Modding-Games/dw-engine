text.0096: "Já ouvi falar de você."
text.00d6: "Se já ouviu falar de nós\ne da cidade, por que não\nvem comigo?"
text.0166: "Eu também penso no futuro\nda ilha. Venho procurando\numa coisa."
text.0218: "O que você está procurando?"
text.0252: "Algo que meus ancestrais\ndeixaram, mas\nnão sei o que é."
text.02fe: "Entendi. Se eu encontrar,\naviso você."
text.0354: "Faz tempo que procuro.\nNão vai ser fácil\nde encontrar."
text.03cc: "Mas, se você encontrar,\nprometo que\nvou para a sua cidade."
text.044c: "É isto?"
text.0474: "Oh, é isso!"
text.04b8: "Foi isto que meus ancestrais\nescreveram. Vejamos."
text.0524: "Quando o perigo chegar à\nilha, vá para a cidade."
text.0592: "Meus ancestrais dizem\nque devo ir!"
text.05de: "Você vai nos ajudar?"
text.061e: "Pode contar comigo!"
text.0686: "Leomon entrou na cidade!"
text.06ca: "Preciso procurar uma coisa.\nCom licença, mas preciso ir..."
text.0756: "{color:5}Treino:\nGolpe especial {color:1}"
text.0796: "Começar\nExplicar\nSair"
text.07ce: "Normal\nTentativa bônus\nSair"
text.080c: "Com um saco de concreto,\nbata com toda a força."
text.0868: "Isso aumenta o Ataque\ne o HP máximo."
text.08c4: "Explicar de novo\nComeçar\nSair"
text.091e: "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}para\nalinhar três figuras."
text.09a0: "{color:5}Treino: \nCircuito Savana {color:1}"
text.09de: "Começar\nExplicar\nSair"
text.0a16: "Normal\nTentativa bônus\nSair"
text.0a54: "Corra pelo Circuito Savana."
text.0a8e: "Aumenta muito a Velocidade\ne também o HP máximo."
text.0afc: "Explicar de novo\nComeçar\nSair"
text.0b56: "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}para\nalinhar três figuras."
