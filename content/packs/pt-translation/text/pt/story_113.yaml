"text.0094": "Siga em frente e\nvire à direita. He he he..."
"text.0108": "Vire à direita e\nlogo à esquerda. He he..."
"text.016c": "Você não vai sair\ndesta floresta. He he he..."
"text.01dc": "Eu me perdi!"
"text.0208": "Ando cansado ultimamente."
"text.024e": "Você? Não pode ser!?"
"text.027e": "Cuidado onde pisa."
"text.02cc": "Ei, você!"
"text.0318": "Hmm, você é demais!\nFoi muito bom para\ntão cedo de manhã."
"text.03c2": "Ei, ei, não aja como se\nfosse problema dos outros!"
"text.0438": "Eu sei! Eu sei do que\nvocê está falando."
"text.0490": "Ouvi dizer que você trabalha\nduro pela ilha reunindo\nDigimon."
"text.0520": "Então você sabe. Bom,\npor que não me ajuda?"
"text.057a": "E onde é que eu devo\nfazer o quê?"
"text.05d2": "Ah, você não entende mesmo!\nVocê deve trabalhar\nna cidade, lembra?!"
"text.066c": "Bom, como dizem... Digimon\najuda quem cedo madruga."
"text.06e2": "Isso não tem nada a ver com\nnada! E outra: é 'Deus' que\najuda, não 'Digimon'!"
"text.078a": "Tô brincando. Bom,\nte vejo na cidade..."
"text.0830": "Kokatorimon entrou na cidade!"
"text.0876": "Será que dá para confiar\nnele? Sei não..."
"text.08de": "Ei, tem penas de pássaro\ncaídas aqui. Ainda estão\nfrescas. Chegamos tarde?"
