text.007e: "Ei, já vai abrir!"
text.00e6: "Esperávamos por isso!\nO túnel está aberto!"
text.014e: "Não precisamos mais cruzar\na montanha. Obrigado."
text.01c2: "Obrigado. Sozinho, não teria\nmovido a pedra grande."
text.0234: "O que faço agora?"
text.026e: "Venha para a cidade.\nVai ter muito o que fazer!"
text.02e6: "Ainda tenho muita energia.\nAceito o convite com gosto."
text.0362: "Já vai abrir!"
text.03dc: "Drimogemon entrou na cidade!"
