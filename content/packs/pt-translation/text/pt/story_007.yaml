text.0038: "Ah, sim!"
text.0050: "Vai tocar a {color:6}Flauta azul{color:1}\ndo Guardião do Lago?"
text.00b6: "Vou tocar\nNão vou tocar"
text.0188: "Precisa de ajuda, amigo?"
text.01ce: "Me leve para o outro lado."
text.020e: "Claro. Suba."
text.033c: "Seadramon!"
text.0358: "Nos encontramos de novo.\nTem algum pedido?"
text.03bc: "Vamos ser amigos\nMe ensine uma técnica\nQuero um item"
text.0444: "Já somos amigos.\nMais algum pedido?"
text.050c: "Mas o que... ah, não!\nÉ o Guardião do Lago!"
text.056c: "Hã, sim. Sou o Seadramon."
text.05a0: "Então é você que anda\npescando tanto!\nQue seja. Algum pedido?"
text.0634: "O quê!? Entendo por que te\nchamam de Guardião.\nSim, tenho um pedido."
text.06bc: "Vamos ser amigos\nMe ensine uma técnica\nQuero um item"
text.0738: "Tá bom, tudo bem."
text.0754: "De agora em diante somos\namigos. Como prova, te\ndou esta flauta."
text.07ec: "Ah, não! Itens demais.\nPreciso jogar alguns fora."
text.085e: "Ganhei a {color:6}Flauta azul{color:1}\ndo Guardião do Lago!"
text.08b4: "Se tocar a flauta perto do\nlago, eu venho. Te levo\npara o outro lado."
text.095c: "Quer dizer que posso ir\npara o outro lado? Valeu!"
text.09bc: "Depois do lago há uma\nfloresta estranha. Quer\nir lá agora mesmo?"
text.0a5e: "Sim, vamos\nNão, talvez depois"
text.0aaa: "Vou te ensinar uma técnica."
text.0af6: "Dominei 'Magia aquática'!"
text.0b40: "Dominei 'Rajada invernal'!"
text.0b8e: "Dominei 'Gigacongelamento'!"
text.0bcc: "Hã, acho que não tem\nmais técnicas que\neu possa te ensinar..."
text.0c5c: "Até mais!"
text.0ca8: "Bom, vou te dar o\n{color:6}Cantil{color:1}."
text.0d12: "Ah, não! Itens demais.\nPreciso jogar alguns fora."
text.0d84: "Isso! Ganhei o\n{color:6}Cantil{color:1}!"
text.0dca: "Até mais!"
text.0e16: "Então, suba nas minhas\ncostas."
text.0ece: "Até logo."
