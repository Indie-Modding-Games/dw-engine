"text.00b2": "O que foi?!"
"text.00e2": "Ah, que bom que voltou,\nHagurumon!"
"text.0122": "Hagurumon?!"
"text.0168": "O que está acontecendo?!"
"text.01d8": "{color:7}Brinquedos {color:1}\nÉ uma velha história.\nUm malvado veio de\nmuito longe a esta ilha."
"text.0280": "{color:7}Brinquedos {color:1}\nOs malvados disseram aos\nDigimon: Esta ilha é nossa."
"text.030a": "{color:7}Brinquedos {color:1}\nOs Digimon responderam:\nNão é verdade. Esta ilha\né de todos."
"text.03b8": "{color:7}Brinquedos {color:1}\nComo os Digimon se uniram\ne enfrentaram os malvados,\neles aprenderam a lição."
"text.0494": "{color:7}Brinquedos {color:1}\nMas os malvados disseram:\nEsperem, a gente volta.\n...e desapareceram."
"text.0554": "{color:7}Brinquedos {color:1}\nÉ uma velha história."
"text.05b0": "Hmmm, que alegria...\nOpa, espere aí."
"text.05fc": "Essa história da canção\né uma velha história\ndesta ilha, não é?"
"text.0684": "Sobre os Digimon\nderrotando os malvados..."
"text.06e0": "Hmmm, quem será que eram\nos malvados da história?"
"text.0750": "Obrigado pela ajuda.\nIsto é para mostrar minha\ngratidão."
"text.07cc": "O Monzaemon de pelúcia\nentrou na cidade!"
"text.0850": "Espere, o WaruMonzaemon não\nderrubou alguma coisa?"
"text.08be": "Boa sorte!\nÉ a casa ao lado!"
"text.092a": "......"
"text.09cc": "Ah, Monzaemon!\nVocê voltou vivo!"
"text.0a16": "Uau, o que foi?"
"text.0a3e": "Vamos lutar com o\nWaruMonzaemon! Rápido,\ntodos se mexendo! Já, já!"
"text.0ace": "Espera... espera! Ele não é o\nMonzaemon que vocês conhecem."
"text.0b38": "Hã? Como assim? Mas \nele é um Monzaemon, né?"
"text.0bb2": "É, é verdade que\nele é um Monzaemon."
"text.0c0a": "Um malvado chamado\nWaruMonzaemon raptou\nmeus amigos."
"text.0c7a": "Acho que o único que pode\nderrotá-lo é o Monzaemon!"
"text.0cec": "Hmm, então temos que achar\nesse malvado. Onde ele está?"
"text.0d5a": "Ele está na casa ao lado. Vou\nabrir o selo da porta."
"text.0dc2": "Então, por favor, vá ver\no que pode fazer."
"text.0e14": "Entendi. Tá bom,\neu te ajudo!"
"text.0e60": "Obrigado!"
"text.0e88": "Obrigado!"
"text.0eb0": "Obrigado!"
