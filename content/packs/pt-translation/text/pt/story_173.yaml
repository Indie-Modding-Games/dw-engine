text.0030: "Descanse o máximo possível.\nÉ a chave para a\nsaúde do seu Digimon."
text.00ca: "Certo. Vou te contar\ncomo a cidade vai\ncrescer e prosperar..."
text.014c: "Quando um Digimon Novato\nvem para a cidade,\nsoma um ponto."
text.01cc: "E quando um Digimon\nCampeão vem para a cidade,\nsoma dois pontos."
text.025a: "Se um Digimon Ultra\nvem para a cidade,\nsoma três pontos."
text.02da: "Mas tem três Digimon\nCampeão que não são\nmuito úteis."
text.0366: "Quando um deles vem,\nsó soma um ponto."
text.03de: "Vou te contar um\npouco sobre os tipos."
text.0436: "Se um rival for do mesmo\ntipo que seu parceiro\nDigimon, talvez não lute."
text.04d2: "E se o tipo do seu Digimon\nnão for compatível, ele pode\nser barrado numa porta."
text.056c: "Fora isso, talvez\nvocê não precise\nse preocupar."
text.05f2: "Vou te falar sobre o\nnível de domador."
text.063c: "O nível de domador sobe\nse você criar Digimon\naté Digimon Ultra."
text.06d0: "E vencer o campeonato\nde um torneio de nível alto\né muito bom."
text.075c: "Ele sobe sozinho.\nNão precisa se\npreocupar muito."
text.07e8: "Por outro lado,\nvocê tem que tomar cuidado\npara ele não baixar."
text.0874: "Se seu Digimon se for,\nseu nível de domador\nvai baixar, com certeza."
text.0900: "Se cometer erros de\ncuidado com frequência,\npode baixar. Cuidado."
