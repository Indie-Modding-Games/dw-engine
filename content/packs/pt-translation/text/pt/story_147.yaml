"text.003c": "Aonde você vai?"
"text.007a": "Espere!"
"text.009a": "Dopeeee!"
"text.00c0": "Gguhh Heyee Hee!"
"text.00f6": "Quem é você?"
"text.0114": "Sou MetalMamemon, invicto\nem noventa e nove batalhas!\nVocê vai ser a centésima!"
"text.01b0": "Não acredito que alguém como\n{color:6}{tamer}{color:1}fugiria."
"text.0214": "Tá, vamos lutar\nFoi mal, até mais"
"text.0294": "Você é melhor do\nque eu pensava."
"text.02d4": "Você é um rival à altura!"
"text.0306": "Um dia eu te venço!"
"text.0372": "MetalMamemon entrou na cidade!"
"text.03c6": "Eu sabia que você ia amarelar.\nBom, nos vemos quando\ntiver mais coragem."
