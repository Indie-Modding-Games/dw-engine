text.0066: "Vamos batalhar?\nTá com medo?!"
text.00b2: "Certo, vamos lutar\nEspere um pouco"
text.011e: "Ah, não! Perdi!"
text.0152: "Ele era bem durão."
text.019a: "Você é legal. Sou o Mamemon.\nVou com você."
text.0200: "Vem com a gente? Bom, por\nque não vai para a cidade?"
text.0272: "OK. Vou para lá."
text.02d6: "Mamemon entrou na cidade!"
text.0320: "Volte quando\nficar mais forte."
text.039c: "Daaaa!"
text.03be: "Ha, ha, ha."
text.03ea: "Argh!"
text.0410: "Leste: Floresta Nativa\nOeste: Savana Engrenagem"
