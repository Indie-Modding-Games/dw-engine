text.0034: "{color:5}Treino: Mover gelo {color:1}"
text.0068: "Começar\nExplicar\nSair"
text.009e: "Normal\nTentativa bônus\nSair"
text.00da: "Empurrar gelo dá força."
text.011c: "Aumenta muito o HP máximo.\nA Defesa também\naumenta."
text.0198: "Explicar de novo\nComeçar\nSair"
text.01f2: "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}para alinhar\ntrês figuras."
text.0274: "{color:5}Treino: Pingentes de gelo {color:1}"
text.02aa: "Começar\nExplicar\nSair"
text.02e2: "Normal\nTentativa bônus\nSair"
text.0320: "Treine pegando um\nenorme pingente de gelo."
text.0364: "A Defesa aumenta\nmuito.\nA Velocidade também sobe."
text.03e4: "Explicar de novo\nComeçar\nSair"
text.043e: "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}para\nalinhar três figuras"
