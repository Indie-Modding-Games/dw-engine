text.0042: "Deve ser isto!\nOlhando de qualquer jeito,\nparece um meteorito comum."
text.00d8: "Quebrar e examinar\nDeixar como está"
text.0130: "Hmmm"
text.0146: "Para mim, parece só um\nmeteorito velho e comum."
text.019c: "{color:7}???mon {color:1}\nDesculpe parecer\ntão comum e velho."
text.0202: "Uau!"
text.0212: "Você é um Digimon?!\nQuem é você?"
text.0264: "{color:7}???mon {color:1}\nMeu nome é Meteormon."
text.02aa: "Sabe algo sobre\no perigo da ilha?"
text.02fe: "Não sei de nada!"
text.0324: "Não sabe de nada?! Tem\ncerteza que não esconde algo?"
text.039c: "Que grosseria! Pois bem!\nVamos lutar para ver\nquem tem razão!"
text.041e: "Certo! Vamos nessa."
text.0488: "Desisto. Você é muito forte."
text.04c8: "Me conte o que sabe sobre\no perigo da ilha."
text.0542: "Acabei de nascer, então\nnão sei de nada!"
text.059e: "O quê?!"
text.05ba: "A Tribo Meteorito nasce\nno céu e depois\ncai na terra."
text.064a: "Depois dormimos muito tempo.\nNa verdade, eu devia dormir\nbem mais, mas..."
text.06fa: "Aqui o tempo corre muito mais."
text.0738: "Deve ser. Enfim, vou dar\numa olhada na ilha.\nAté mais!{stop}"
text.07f4: "Não achamos nenhuma pista.\nVamos sair logo."
text.086a: "Já olhamos e não\ndescobrimos nada.\nVamos quebrar!"
text.08f8: "{color:7}???mon {color:1}\nO que pensa que está fazendo?\nSeu bruto imprudente!"
text.0998: "Hã? Quem é você?!"
text.09c4: "Quem sou eu? Quem é você?!"
text.0a70: "Ganhei um {color:4}Chaveiro\nDimensional{color:1}.\nPosso levar vinte itens!"
text.0b20: "Ganhei um {color:4}Chaveiro\nDimensional{color:1}.\nPosso levar trinta itens!"
