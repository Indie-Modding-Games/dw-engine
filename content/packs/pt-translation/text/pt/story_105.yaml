"text.00ae": "O que você quer?!"
"text.00e8": "Uau!"
"text.0104": "...? ...!"
"text.011e": "O quê? Agora?!\nTudo bem, vamos lutar!"
"text.0196": "Perdi. Droga!"
"text.01bc": "Eu devia convidá-lo\npara a cidade."
"text.0206": "Hã, com licença."
"text.022c": "Você poderia...\nvir para a cidade...?"
"text.027e": "O quê? Cidade?!"
"text.029c": "Fala daquele... lugar velho?"
"text.02dc": "Bem..."
"text.02f0": "Hã......"
"text.0306": "Hum........."
"text.0332": "Bom, tudo bem.\nEu sou o Agumon.\nPrazer em conhecer."
"text.03c6": "Agumon entrou na cidade!"
"text.0408": "Isso, vale a pena tentar.\nVou continuar convidando!"
"text.0478": "Este é o meu território!"
"text.04b8": "O quê?!"
"text.04da": "Agora é a minha chance!"
"text.0810": "Não consigo fugir\ndesse cara!"
