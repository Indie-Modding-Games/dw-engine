text.0072: "Deixe seus objetos de valor."
text.00b2: "Vou te cobrir de gelo!"
text.00f4: "Não dá para ir a lugar nenhum."
text.0140: "Vou te transformar\nnuma escultura de gelo!"
text.019e: "Você vai ver!"
text.01d0: "Quer morrer congelado?"
text.0216: "Oeste: Árvores Nebulosas\nLeste: Praia do Iceberg"
