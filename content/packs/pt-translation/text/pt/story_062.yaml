text.0038: "O que é isso?\nAlgum livro que eu possa ler?"
text.00ba: "Não. Nenhum que eu possa ler."
text.00e8: "Uau! Um livro com\numa capa legal!"
text.012a: "Vou pegar\nMelhor não"
text.0190: "Tocou no livro legal."
text.01c0: "Hã?"
text.01f8: "Uau!"
text.020e: "Pode ser uma armadilha....\nDeixe aí!"
