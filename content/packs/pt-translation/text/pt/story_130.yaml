"text.0036": "Eu vou te pegar!"
"text.0070": "Ah, é mesmo!"
"text.00ce": "Quem é você?"
"text.00ee": "Vim aqui para te ajudar\nAinda não estou pronto..."
"text.0158": "Tem alguém aí?"
"text.018c": "Você não enxerga?"
"text.01b4": "Sou o Whamon. Normalmente\nvivo no mar."
"text.0206": "Não tenho olhos, mas\nsinto quase tudo."
"text.026c": "Sou humano. Meu nome é\n{color:6}{tamer}{color:1}."
"text.02a6": "Este é {color:10}{partner}{color:1},\nmeu parceiro, um {digimon:pstat=103}."
"text.02f6": "Sinto um poder forte."
"text.0330": "Pode ouvir minha história?\nPerto daqui há uma caverna\nna praia onde descanso."
"text.03c8": "Mas uns caras malvados me\nexpulsaram e perdi lá meu\ntesouro importante."
"text.046a": "Caras malvados, é?\nIsso não soa bem."
"text.04bc": "Por favor, expulse-os.\nQuero que me ajude a\nrecuperar a caverna."
"text.0540": "Eu te ajudo\nAgora não posso ajudar"
"text.0592": "Entendo."
"text.05ae": "Então suba nas minhas costas."
"text.06c0": "Vamos."
