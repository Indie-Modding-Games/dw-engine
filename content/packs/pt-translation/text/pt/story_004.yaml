text.0090: "Há letras gravadas\naqui."
text.00dc: "Não tem ninguém! Vá embora!"
text.011e: "Alguém mora aqui?"
text.0176: "{color:7}? ? ? {color:1}\nAté macaco cai do galho."
text.01c8: "{color:7}? ? ? {color:1}\nJoelhada voadora!"
text.025e: "Perdi, mas vocês\nnão são de nada!"
text.02b4: "Não seja mau perdedor.\nVocê até nos atacou\nde surpresa."
text.0344: "Argh! Vocês não me deixam\noutra escolha a não ser..."
text.0394: "Nessa cidade de vocês,\nvou mostrar como sou\nforte! Vocês vão ver!"
text.0462: "Etemon entrou na cidade!"
text.04a0: "Você só vai se machucar."
text.04e0: "Você é um bebezão!"
text.051c: "Acho que posso brincar\ncom você."
text.056a: "Vou quebrar o seu nariz!"
text.05aa: "Vou te partir ao meio!"
