text.004e: "Ah!"
text.006a: "Ah!"
text.0096: "O elevador está fazendo\no chão subir?"
text.0102: "Entrar\nNão entrar"
text.0190: "Ei!"
text.01b0: "O quê?"
text.01c0: "Veio aqui para perder?"
text.0208: "Essa fala é minha!"
text.0232: "Desta vez não vou pegar leve.\nVou te fazer chorar!"
text.02d6: "Uau!"
text.02e6: "Ah, não!"
text.0312: "Droga!"
text.03b6: "O que foi?"
text.0460: "Tchau, seus bobões!"
text.0496: "Droga, ele fugiu!"
text.04de: "Tem um elevador de fuga.\nNão adianta persegui-lo."
text.05a8: "Quem é você?"
text.05c8: "Quem sou eu? Quem é você?"
text.0672: "Ganhei um {color:4}Chaveiro\nDimensional{color:1}!\nPosso levar vinte itens!"
text.0722: "Ganhei um {color:4}Chaveiro\nDimensional{color:1}!\nPosso levar trinta itens!"
