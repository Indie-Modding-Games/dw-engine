text.003e: "Tem alguém aqui! Quem é?!"
text.00c4: "He he, vou quebrar o\ncomputador mau! He he he!"
text.0284: "É ele... Ei!\nEi, o que você está fazendo?!"
text.02f0: "Isso! Vou destruir!\nVou destruir tudo.\nTodas as coisas más!"
text.04b2: "Ah, não, ele está maluco.\nEle é um Digimon Ultra,\nmas temos que pará-lo!"
text.054c: "He he he,\nvou destruir todos vocês!"
text.06c4: "Aaargh! Estou perdendo força."
text.0702: "Estamos ficando sem energia.\nVamos pedir ao Andromon\nque pare a água suja\nda fábrica."
