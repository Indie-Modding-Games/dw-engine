text.00b8: "Quem é você? Vá embora!"
text.00f2: "É aqui que você mora?"
text.012c: "Não posso te dizer!"
text.0156: "Você é guarda ou algo assim?"
text.0198: "Quer briga? Eu te venço!"
text.01da: "Acho que vou lutar\nVocê não me intimida"
text.025c: "Uau!"
text.02c4: "Ah, não! Ei!"
text.02e2: "{color:7}???mon {color:1}\nHa ha ha."
text.0310: "Quem é?"
text.032c: "{color:7}???mon {color:1}\nNão fiz nada de errado.\nNão entre na minha casa\nsem permissão!"
text.03d2: "Acho que é melhor eu ir."
text.0418: "Continue com a guarda!"
text.0452: "Você é do bando do Ogremon!\nEste é o seu esconderijo!"
text.04ba: "Do que você está falando?"
text.0500: "Da última vez você teve\nsorte! Desista!"
text.0554: "Uau!"
text.05b4: "Você me enganou da outra vez,\nmas agora eu te pego."
text.061a: "Do que você está falando?"
text.0660: "Desta vez você não escapa!"
text.06ac: "Vamos, me deixe entrar."
text.06da: "Quer briga comigo?\nVou te nocautear!"
text.0738: "Vamos lutar\nNão me intimide"
