text.00bc: "Estava esperando você,\n{color:6}{tamer}{color:1}.\nFinalmente chegou o dia"
text.0130: "O que aconteceu?"
text.0154: "A entrada do Monte Infinito\napareceu."
text.01a8: "O quê? Sério? Onde?"
text.01d8: "Fica depois da cachoeira\nda cidade."
text.0224: "Puxa, é tão perto!"
text.0254: "Acho que o último inimigo\nestá no Monte Infinito."
text.02c4: "Então é a Última Masmorra.\nVou nessa!"
text.0316: "Boa sorte! Mas não se\napresse. Não faça nada\naté estar bem preparado."
text.03ce: "Do outro lado da cachoeira,\nna cidade, fica a entrada\ndo Monte Infinito."
text.0478: "Acho que o último inimigo\nestá no Monte Infinito."
text.04e6: "Vá bem preparado!"
text.051c: "De qualquer forma..."
text.0546: "O nível de prosperidade\nda cidade agora é {num:pstat=1}."
text.05b4: "Está longe de ser\no que era antes."
text.060e: "Finalmente está tomando forma."
text.0658: "Está crescendo bem."
text.0698: "Está virando uma bela cidade."
text.06e2: "Você fez um ótimo trabalho.\nEsplêndido!"
text.073a: "Não preciso dizer mais\nnada. Está fantástica!"
text.07be: "{color:7}O nível de domador\nsubiu! {color:1}"
text.0808: "{color:7}Parabéns!\nTome uma medalha\npelo seu ótimo trabalho! {color:1}"
