text.1fd8: "Lucro total: {shopvar}\nLucro:\ntrinta"
text.2026: "Lucro total: {shopvar}\nLucro:\nzero"
text.20bc: "Você cobra caro demais."
text.20fa: "Sério? Bom, então..."
text.212e: "Puxa, preciso muito de um\n{color:6}Remédio{color:1}."
text.217c: "É... Bem-vindo, quer um\n{color:6}Remédio{color:1}?"
text.21e2: "Subir preço\nManter em mil Bits\nBaixar preço"
text.225c: "É, você queria um\n{color:6}Remédio{color:1}, né?"
text.22ce: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e quinhentos Bits?"
text.235a: "Subir pra mil e quinhentos\nVou pensar melhor"
text.23e4: "E o {color:6}Remédio{color:1}\nde mil Bits por\nmil e quatrocentos Bits?"
text.246a: "Subir pra mil e quatrocentos\nVou pensar melhor"
text.24f6: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e trezentos Bits?"
text.2584: "Subir pra mil e trezentos\nVou pensar melhor"
text.2610: "E o {color:6}Remédio{color:1}\nde mil Bits por\nmil e duzentos Bits?"
