text.2820: "E o {color:6}Remédio{color:1}\nde mil Bits pelo\npreço normal?"
text.2894: "Vender a preço normal\nVou pensar melhor"
text.2916: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nnovecentos Bits?"
text.299c: "Baixar pra novecentos\nVou pensar melhor"
text.2a26: "E o {color:6}Remédio{color:1}\nde mil Bits por\noitocentos Bits?"
text.2aa6: "Baixar pra oitocentos\nVou pensar melhor"
text.2b32: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nsetecentos Bits?"
text.2bba: "Baixar pra setecentos\nVou pensar melhor"
text.2d08: "Cara, embrulha pra mim!"
