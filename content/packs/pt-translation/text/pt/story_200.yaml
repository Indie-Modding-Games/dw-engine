text.0056: "Bem que eu queria\numa {color:6}Carne{color:1}."
text.0098: "Bem-vindo, temos uma ótima\n{color:6}Carne{color:1}. Bom, é..."
text.010e: "Subir preço\nManter em cinquenta Bits\nBaixar preço"
text.0180: "É, você queria {color:6}Carne{color:1},\nné? É..."
text.01f6: "Que tal a {color:6}Carne{color:1} de cinquenta\npor setenta e cinco Bits?"
text.0264: "Subir pra setenta e cinco\nVou pensar melhor"
text.02ec: "E a {color:6}Carne{color:1} de cinquenta\npor setenta Bits?"
text.0348: "Subir pra setenta\nVou pensar melhor"
text.03d0: "Que tal a {color:6}Carne{color:1} de cinquenta\npor sessenta e cinco Bits?"
text.043a: "Subir pra sessenta e cinco\nVou pensar melhor"
text.04be: "E a {color:6}Carne{color:1} de cinquenta\npor sessenta Bits?"
text.0516: "Subir pra sessenta\nVou pensar melhor"
text.059a: "Que tal a {color:6}Carne{color:1} de cinquenta\npor cinquenta e cinco Bits?"
text.0604: "Subir pra cinquenta e cinco\nVou pensar melhor"
text.067c: "E a {color:6}Carne{color:1} de cinquenta\npelo preço normal?"
text.06d8: "Vender a preço normal\nVou pensar melhor"
text.075a: "Que tal a {color:6}Carne{color:1} de cinquenta\npor quarenta e cinco Bits?"
text.07c4: "Baixar pra quarenta e cinco\nVou pensar melhor"
text.0848: "E a {color:6}Carne{color:1} de cinquenta\npor quarenta Bits?"
text.08a0: "Baixar pra quarenta\nVou pensar melhor"
text.0924: "Que tal a {color:6}Carne{color:1} de cinquenta\npor trinta e cinco Bits?"
text.0990: "Baixar pra trinta e cinco\nVou pensar melhor"
text.0ad8: "Negócio fechado!"
text.0b1e: "Lucro total: {shopvar}\nLucro:\nquarenta"
text.0b74: "Lucro total: {shopvar}\nLucro:\ntrinta e cinco"
text.0bd6: "Lucro total: {shopvar}\nLucro:\ntrinta"
text.0c2e: "Lucro total: {shopvar}\nLucro:\nvinte e cinco"
text.0c90: "Lucro total: {shopvar}\nLucro:\nvinte"
text.0ce8: "Lucro total: {shopvar}\nLucro:\nquinze"
text.0d42: "Lucro total: {shopvar}\nLucro:\ndez"
text.0d94: "Lucro total: {shopvar}\nLucro:\ncinco"
text.0dde: "Lucro total: {shopvar}\nLucro:\nzero"
text.0ea0: "Deixa pra lá,\nvou comprar em outro lugar!!"
text.0f1c: "Sem clientes, que tédio."
text.0f64: "Cobro caro demais?"
text.0f94: "Você acha? Bom, então..."
text.0fd4: "Puxa, bem que eu queria um\n{color:6}Penico portátil{color:1}."
text.102e: "Bem-vindo, temos um ótimo\n{color:6}Penico portátil{color:1}!"
text.1094: "Subir preço\nManter em trezentos Bits\nBaixar preço"
text.1110: "É... então você quer um\n{color:6}Penico portátil{color:1}?"
text.1180: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nquatrocentos e cinquenta Bits?"
text.121c: "Pedir quatrocentos e cinquenta\nVou pensar melhor"
text.12aa: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nquatrocentos e vinte Bits?"
text.1350: "Subir pra quatrocentos e vinte\nVou pensar melhor"
text.13da: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e noventa Bits?"
text.147a: "Subir pra trezentos e noventa\nVou pensar melhor"
