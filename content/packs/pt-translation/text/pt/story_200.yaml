text.1756: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits\npelo preço normal?"
text.17fc: "Vender a preço normal\nVou pensar melhor"
text.187e: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e setenta Bits?"
text.191c: "Baixar pra duzentos e setenta\nVou pensar melhor"
text.19aa: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e quarenta Bits?"
text.1a4c: "Baixar pra duzentos e quarenta\nVou pensar melhor"
text.1ad8: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e dez Bits?"
text.1b6e: "Baixar pra duzentos e dez\nVou pensar melhor"
text.1cb8: "Beleza, negócio fechado!"
text.1d04: "Lucro total: {shopvar}\nLucro:\nduzentos e quarenta"
text.1d72: "Lucro total: {shopvar}\nLucro:\nduzentos e dez"
text.1ddc: "Lucro total: {shopvar}\nLucro:\ncento e oitenta"
