text.2f56: "Lucro total: {shopvar}\nLucro:\ntrezentos"
text.2fbc: "Lucro total: {shopvar}\nLucro:\nduzentos"
text.301e: "Lucro total: {shopvar}\nLucro:\ncem"
text.3076: "Lucro total: {shopvar}\nLucro:\nzero"
text.310c: "Isso está caro demais!"
