text.006e: "Hoje é o seu último dia."
text.00b2: "Não fique atrás de mim!"
text.00f4: "Já que você viu o meu rosto..."
text.0142: "Não posso errar!"
text.0186: "Desculpe, mas você vai perder!"
text.01d2: "Não vou deixar você escapar!"
text.0216: "Nem pensar, não vou perder!"
text.0262: "Acabei com você!"
