text.004c: "Bem-vindo ao meu restaurante."
text.0084: "Decidi ser o gerente e\nchef deste restaurante."
text.00fc: "Aproveite minha cozinha\nardente à vontade."
text.0178: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}, não\nquerem provar minha comida\ncaseira?"
text.01ce: "Diferente dos itens, isto\né comida de verdade. É o\nmeu talento secreto."
text.0274: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nDecidi viver de\ncozinhar. Sou bom nisso!"
text.02f2: "Relaxe e venha comer no\nmeu restaurante um dia."
text.037a: "C???NC?? , C???MC?? .\nMeu restaurante enfim abriu!"
text.03e6: "Prove a sobremesa gelada!\nÉ a minha especialidade."
text.045c: "{color:6}{tamer}{color:1}, decidi\ntrabalhar como chef\nneste restaurante."
text.04d0: "Aproveite uma comida quente."
text.051e: "Isso aí!\n{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nagora sou cozinheiro!"
text.0566: "Minha comida é muito\nmelhor do que a de\nqualquer lugar. Prove!"
text.061a: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nDecidi dedicar minha vida\nà cozinha!"
text.067e: "Minha comida caseira\nespecial é bem saudável!\nVenha me ver quando cozinho."
text.0734: "Oi!  {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
text.0758: "Decidi ajudar\neste restaurante.\nMe deixam fazer sobremesas."
text.07d6: "Tenho muito orgulho\nda minha sobremesa.\nNão deixe de provar, tá?"
