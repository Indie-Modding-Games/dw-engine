text.002a: "Eu entendo de itens."
text.0056: "Ao todo, existem cento e vinte\ne oito tipos de itens."
text.00d0: "Trinta e dois são comida."
text.00fe: "Itens raros crescem\nsozinhos em algumas áreas\ne em outras não aparecem."
text.018e: "Por exemplo, você pode\nachar uma Maçã azul\nna Floresta Nativa."
text.0204: "Essas comidas têm efeitos\nespeciais, então cuidado\ncom a hora de comê-las."
text.02b8: "Agora vou falar dos\nitens de digievolução."
text.030c: "Os itens de digievolução\nfazem o Digimon digievoluir,\ncomo diz o nome."
text.0392: "Existem muitos tipos de\nitens de digievolução."
text.0402: "Cada tipo faz o Digimon\ndigievoluir num tipo\ndiferente de Digimon."
text.0494: "Por exemplo, se usar\nGarras cinza, o Digimon\nvira Greymon."
text.0528: "Os itens de digievolução\nsão itens lendários e\nalguns são únicos."
text.05b2: "Mas às vezes você não ganha\no bônus de habilidade de\numa digievolução normal."
text.0654: "E a felicidade também cai,\nentão não são perfeitos."
text.06ca: "Por outro lado, é bom\ndigievoluir no Digimon\nque você quer ser."
text.0772: "Só dá para digievoluir a\npartir do estágio anterior\nao Digimon que você quer."
text.081a: "Então tome cuidado."
text.087c: "Ei! Hola amigos!"
text.08a4: "Que tipo de loja é esta?\nÉ a minha loja?\nCompre algo, por favor."
text.0942: "Olhe, {color:6}{tamer}{color:1}! Minha loja\nvende coisas interessantes.\nEspero que venha sempre."
text.09f6: "O que você vê aqui\nnão é nada comum,\nentão pode comprar!"
text.0a9c: "Olá, forasteiro! Sabia que\nviria, {color:6}{tamer}{color:1}.\nNão faça essa cara."
text.0b1c: "Saberá usar bem\nmeus itens? Depende da\nsua habilidade de domador."
text.0be2: "Onde estou?\nAmo lugares escuros, e\nesta loja mostra isso bem!"
text.0c88: "Certo, {color:6}{tamer}{color:1}, obrigado\npela visita. Já que está aqui,\npor que não compra algo?"
text.0d48: "Oi, {color:6}{tamer}{color:1}. Você veio!\nVamos, leve alguns dos\nmeus itens tão úteis."
text.0dec: "Olá, forasteiro!\nSabia que viria, {color:6}{tamer}{color:1}.\nNão faça essa cara."
text.0e6c: "Saberá usar bem\nmeus itens? Depende da\nsua habilidade de domador."
