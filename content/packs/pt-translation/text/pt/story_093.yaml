text.0066: "Uau, parece que está vivo!"
text.0096: "Na verdade, ele se mexe\nquando nos mexemos. Espere!"
text.0144: "O que foi, {color:10}{partner}{color:1}?\nAchou alguma coisa?"
text.01a0: "Uau, muito bem,\n{color:10}{partner}{color:1}!"
text.0202: "Hã? Sobre aquela estátua..."
text.024e: "Ah!"
text.0272: "Ufa, bem"
text.028e: "Você voltou à vida.\nIsso aí!"
text.02d4: "Sou Angemon, um anjo que\nprotege você. Despertei\npara cumprir meu dever."
text.036a: "Do que ele está falando...?"
text.03a8: "Conheço a verdade dos céus."
text.03e4: "Ofereço minha alma para seguir\nos mandamentos terrenos."
text.044a: "Do que ele está falando...?\nVocê vem para a cidade?"
text.04c0: "Vossa missão é meu dever.\nEu irei."
text.050a: "Desculpe, mas pode falar\nde um jeito que eu entenda?"
text.0578: "Irei para a cidade, então\ncontinue se esforçando."
text.05da: "Entendi. Obrigado!"
text.0636: "Angemon entrou na cidade!"
