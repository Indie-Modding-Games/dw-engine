text.0082: "Você de novo! Fora daqui!"
text.00c8: "Hã..."
text.00e0: "Você... você é uma praga!\nAgora está satisfeito?!"
text.0154: "Você de novo! Fora daqui\nagora mesmo!"
text.01ba: "Que bom ver vocês, amigos.\nSe quiserem morar aqui,\neu dou permissão."
text.0260: "Queremos morar aqui\nQueremos voltar"
text.02c6: "Hmmm, que bom. O quê?\nMas você é analógico,\nentão não pode morar aqui."
text.0356: "Temos que ficar juntos!"
text.038c: "Então saia daqui\ncom ele!"
text.03de: "O quê? O que está dizendo?"
text.0422: "Ele não era Sukamon antes.\nRei, por favor, devolva\na forma original dele!"
text.04c2: "Não é ótimo que\nele tenha virado Sukamon?"
text.0516: "Não, agora não está\nnada bom. Por favor."
text.0570: "O único jeito de virar\nSukamon é se esforçar."
text.05cc: "Ele virou Sukamon\nnaturalmente e\nesse é o problema."
text.0642: "Vocês são inacreditáveis!"
text.06aa: "Uau! Rei, obrigado!"
text.06e0: "Fora daqui agora mesmo!"
text.072c: "Vieram aqui por\nalgum motivo?"
text.0774: "Bom..."
text.078a: "Se for um pedido,\nesqueçam. Porque eu sou\no King of Sukamon!"
text.0810: "Acho que não vou conseguir\nconvidá-lo para a cidade."
text.0890: "Eu também coleciono\ncartas Digimon."
text.08e0: "Quero muito uma carta de\nKing of Sukamon. Troca\npela minha carta de Etemon?"
text.0986: "Trocar\nNão trocar"
text.09ba: "Desculpe, mas não tenho."
text.0a02: "Uau, que fedor! Isto é\num lixão?"
text.0a4c: "Não sabia que tinha um\nno mundo Digimon."
text.0aca: "Que bom que vieram.\nNovos amigos são bem-vindos."
text.0b26: "Esta é uma comunidade\nda tribo Sukamon?"
text.0b82: "Exato. É o paraíso da\ntribo Sukamon, e se chama\nReino da Poeira."
text.0c20: "O King of Sukamon\ntambém mora aqui."
text.0c62: "King of Sukamon...?"
text.0c90: "O King of Sukamon é incrível!\nSe não obedecer a ele,\nvai ser digievoluído!"
text.0d32: "Quer dizer que viramos\noutra coisa sem ser Sukamon?"
text.0d9e: "Quer dizer que voltamos\nà nossa forma original?!"
text.0dfc: "É, dá medo. Que arrepio."
text.0e36: "Aprendi algo útil..."
text.0ea2: "Ah, Sukamon?!"
text.0ec4: "Hã? Você me conhece?"
text.0f00: "Bom, mais ou menos.\nTemos que levar o Sukamon\npara a cidade também?"
text.0f92: "Uau, que interessante!\nNunca vi nada\nassim!"
text.1014: "Minha nossa! O cocô\nestá andando e falando!"
text.107c: "Está falando de mim?\nEu sou Sukamon...\nUm Digimon mutante."
text.1100: "Você não é cocô?"
text.112a: "De certa forma, tem razão,\nporque somos feitos de\nlixo digital."
text.11aa: "Vamos convidá-lo para a\ncidade também? Não devemos\nter preconceito."
text.1240: "Você pretende\nmorar aqui?"
text.1284: "O quê? Nunca\npensei nisso."
text.12ca: "Bom, isto é um paraíso só\npara a tribo Sukamon.\nOs outros não podem\nmorar aqui."
text.136a: "Então vocês não podem\nmorar em outros lugares?"
text.13ba: "Claro que não!\nO que você acha?"
text.1404: "Entendi. Era o\nque eu pensava."
text.1446: "Bom, mesmo que você\nnão possa morar aqui,\npode dar uma olhada."
text.14be: "Ah, só olhar. Tudo bem."
text.14f2: "Ah, aliás, nunca\ndeixe o Rei bravo."
text.1552: "O Rei vai te transformar\nem algo miserável com a\ntécnica de digievolução."
text.1610: "Ei, você tem cartas de\nEtemon demais!\nNão faça isso."
text.167c: "Ah, obrigado!"
text.16bc: "Ei, vocês são da...\ncomo é que chama... cidade?"
text.172e: "Isso fica só entre\nnós dois. Eu tenho\num pouquinho de interesse."
text.17ae: "Um dia eu vou\nvisitar vocês lá."
text.17fe: "Ei, vocês conhecem a\ntécnica especial da\ntribo Sukamon?"
text.187e: "Absorvemos o cocô do chão\npelo corpo e o\ntransformamos em energia!"
text.1916: "Hã? Este é o Reino da Poeira.\nSei que para você\né só um lixão."
text.19a4: "Mas talvez a gente ache algo\nútil. Vi uma coisa comprida\ntipo uma vara ali."
text.1a4c: "Uau, é uma\n{color:6}Vara velha{color:1}!"
text.1aba: " {color:5}Treino: Esconder no lixo {color:1}"
text.1af6: "Começar\nExplicar\nSair"
text.1b2e: "Normal\nTentativa bônus\nSair"
text.1b6c: "Treino mental se enfiando\nno lixo sujo.\nAumenta muito o MP máximo."
text.1c0e: "Explicar de novo\nComeçar\nSair"
text.1c68: " {color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}para\nalinhar três figuras."
