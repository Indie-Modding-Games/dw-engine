text.0034: "Ei, quer jogar uma partida\ncomigo? Se você ganhar,\nfaço o que você mandar."
text.00da: "Que tipo de partida?"
text.0108: "Eu chamo de...\nCurling Digimon! \nTe conto mais lá dentro."
text.0186: "Hmm, e se eu perder?"
text.01c6: "Na primeira vez, nada.\nMas da próxima, você tem que\nme dar um peixe antes."
text.025c: "Então, se eu ganhar, você vem\npra cidade comigo. Certo?{stop}\nEntão, vamos nessa."
text.02f4: "Certo, tudo bem. \nVamos lá pra dentro."
text.0384: "Ei, quer jogar uma partida\ncomigo? Me dê um peixe\ne você pode me desafiar."
text.0426: "Vou buscar\nNão, obrigado"
text.0474: "E aí, mano! Fiz uma\npista de patinação aqui."
text.04c2: "Um peixe por partida.\nMas se você ganhar, te dou\num prêmio legal."
text.0554: "Ei, cara, não quer jogar\numa partida comigo? Pode me\ndesafiar com um peixe."
text.0606: "Topo\nNão, obrigado"
text.0642: "Poxa, assim não tem graça."
text.0676: "Me dê um peixe!"
text.06ae: "Não tenho nada agora..."
text.0738: "Ah, não, te dar isso\nnão adianta nada."
text.079a: "Uau, parece gostoso. Opa,\nprimeiro temos que jogar.\nVamos lá pra dentro."
text.0842: "Ah, qual é, cara.\nPor que não vai pescar no\nLago Olho de Dragão?"
text.08d6: "Foi mal, mano. Volte pra me\ndesafiar de novo. E não\nesqueça de trazer outro peixe."
text.0992: "Impressionante! Placar\nperfeito! Por acaso você...\né profissional?"
text.0a34: "{color:7}Parabéns!\nTome uma medalha pela\nsua ótima disputa! {color:1}"
text.0ab8: "Incrível, cara. Perdi uma\npartida pela primeira vez."
text.0b20: "Certo, agora venha pra\ncidade comigo, como prometeu."
text.0b94: "Fazer o quê, acho que vou.\nMas já decidi o que\nvou fazer na cidade."
text.0c7a: "Penguinmon entrou na cidade!"
text.0cd2: "Foi mal, mano. Volte pra me\ndesafiar de novo. E não\nesqueça de trazer um peixe."
text.0d82: "Impressionante! Placar\nperfeito! Por acaso você...\né profissional?"
text.0e24: "{color:7}Parabéns!\nTome uma medalha pela\nsua ótima disputa! {color:1}"
text.0ea8: "Uau, você é demais, cara. \nPerdi de novo."
text.0f00: "Bom, fazer o quê.\nAqui está seu prêmio."
text.0ff8: "Você tem itens demais!"
text.103c: "Ganhei {color:6}{item:pstat=110}{color:1}!"
text.106a: "Ei, {color:6}{tamer}{color:1}. Estou cuidando\nda loja como um favor\npro Penguinmon."
text.10ea: "Jogue uma partida comigo!\nSe ganhar, te dou meu\nprêmio especial. Que tal?"
text.118c: "Certo, vamos nessa\nNão, obrigado"
text.11da: "Me dê o peixe\nantes da partida."
text.123e: "Ah, não tenho\nnada agora."
text.12da: "Te dar isso\nnão adianta nada."
text.1330: "Bom, desta vez eu vou\nganhar. Vamos lá pra dentro."
text.13a2: "Sem peixe não tem\npartida. Volte outra\nhora."
text.1436: "Quê? Está me\nrecusando?"
text.1488: "Se quer ganhar de mim,\né melhor usar a cabeça!\nAté um dia desses."
text.1546: "Você fez placar perfeito\ncontra mim!! Você é\num gênio do curling?!"
text.15e0: "{color:7}Parabéns!\nTome uma medalha pela\nsua ótima disputa! {color:1}"
text.1664: "Você é bom, {color:6}{tamer}{color:1}!\nAqui está o prêmio\nque te prometi!"
text.17a2: "Você tem itens demais."
text.17e6: "Ganhei {color:6}{item:pstat=110}{color:1}!"
