text.0698: "Amanhã tem mais."
text.06e4: "Aqui está a Carne de hoje."
text.072a: "Você tem Carne demais."
text.076e: "Você tem Carne demais. Fico\ncom o que não couber."
text.07e4: "Ganhei {color:6}Carne{color:1}!"
text.0820: "Você tem itens demais."
text.0858: "Ganhei {color:6}Carne{color:1}!"
text.087a: "Amanhã te dou mais."
text.08c0: "Acho que já te dei\na Carne de hoje."
text.090a: "Se a comida acabar,\nvá à Floresta Nativa\nprocurar cogumelos."
text.09a2: "Oi, {color:6}{tamer}{color:1}, aumentei\nminha fazenda de Carne."
text.09ea: "Vou te dar três pedaços\nde Carne enorme por dia."
text.0a4e: "Se quiser mais,\neu vendo por\nquinhentos Bits cada."
text.0ad2: "Vou cuidar desta\nfazenda no lugar do Tanemon.\nEle está descansando por aí."
text.0b74: "Colhi muita\nCarne hoje!"
text.0bd2: "Você tem Carne enorme demais.\nHoje não precisa de mais."
text.0c56: "Você tem Carne enorme demais.\nHoje não precisa de mais."
text.0cce: "Ganhei {color:6}Carne enorme{color:1}!"
text.0d14: "Você tem itens demais."
text.0d4c: "Ganhei cinco pedaços de\n{color:6}Carne enorme{color:1}!"
text.0d98: "Amanhã te dou mais."
text.0dea: "Aqui estão três pedaços de\nCarne enorme de hoje."
text.0e60: "Você tem Carne enorme demais.\nHoje não precisa de mais"
text.0ee2: "Você tem Carne\nenorme demais. Fico com\no que não couber."
text.0f64: "Ganhei {color:6}Carne enorme{color:1}!"
text.0faa: "Você tem itens demais."
text.0fe2: "Ganhei três pedaços de\n{color:6}Carne enorme{color:1}!"
text.1036: "Amanhã te dou mais.\nOu pode comprar agora.\nQuinhentos Bits cada?"
text.10d2: "Comprar\nNão comprar"
text.1110: "Você precisa de mais dinheiro."
text.1150: "Você tem itens demais."
text.119c: "Quer comprar mais?"
text.11d4: "Comprar\nNão comprar"
text.1202: "Até amanhã."
text.123e: "Heh, heh, heh!\n{color:6}{tamer}{color:1}, olhe!"
text.128a: "Agora dá pra cultivar muita\nAlcatra. Vou te dar\ntrês Alcatras por dia."
text.1310: "Também comecei a plantar\nverduras raras!\nCompre quantas quiser!"
text.13a6: "Hoje estou de bom humor,\nentão te dou cinco pedaços\nde Alcatra."
text.143a: "Você tem Alcatra demais.\nHoje não precisa de mais"
text.14b6: "Você tem Alcatra demais."
