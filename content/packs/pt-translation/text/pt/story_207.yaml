text.1534: "Você tem itens demais."
text.156c: "Ganhei cinco pedaços de\n{color:6}Alcatra{color:1}!"
text.15b2: "Até amanhã!"
text.15ee: "Aqui está a porção de hoje:\nAlcatra vezes três!"
text.1668: "Você tem Alcatra demais.\nHoje não precisa de mais."
text.16e6: "Você tem Alcatra demais."
text.1724: "Ganhei {color:6}Alcatra{color:1}!"
