text.0044: "Oi, precisa de Carne?"
text.007c: "Ah, ainda não te contei\nnada sobre isso."
text.00d8: "Esta é uma fazenda de Carne.\nCultivamos Carne pra todos."
text.013e: "Vocês cultivam Carne?"
text.0176: "Sim, por quê?"
text.0192: "Bom... nada"
text.01b8: "O Jiji e eu decidimos\nte dar três pedaços de\nCarne por dia, {color:6}{tamer}{color:1}."
text.0242: "Aqui está sua Carne de hoje."
text.028e: "Você tem Carne demais.\nHoje não precisa de mais."
text.030a: "Você tem Carne demais. Fico\ncom o que não couber."
text.0380: "Ganhei três pedaços\nde {color:6}Carne{color:1}!"
text.03dc: "Você tem itens demais."
text.0414: "Ganhei três pedaços de\n{color:6}Carne{color:1}!"
text.0470: "Colhemos muita Carne\nhoje! Vamos te dar\ncinco pedaços."
text.0508: "Você tem Carne demais."
text.054c: "Você tem Carne demais. Fico\ncom o que não couber."
text.05c2: "Ganhei cinco pedaços de\n{color:6}Carne{color:1}!"
text.0620: "Você tem itens demais."
