"text.009a": "Não tem guarda!"
"text.00f8": "Você não pode passar por aqui."
"text.0136": "Você não pode passar por aqui."
"text.01dc": "......"
"text.01f0": "Uau, ele está nos encarando!\nTalvez desconfie\nde nós."
"text.0266": "É melhor nos escondermos\ne esperar, depois voltar.\nSão doze horas."
"text.030e": "Esta fábrica deve estar\njogando os resíduos no\nesgoto. Preciso descobrir."
"text.03d4": "Pode me dar licença?"
"text.0412": "Não pode passar sem uma\nautorização emitida pelo\nresponsável."
"text.04a8": "Estou com pressa."
"text.04ce": "Desculpe, precisa de\numa autorização."
"text.051c": "Tá bom, se é\nassim que é."
"text.0580": "E agora, o que fazemos?"
"text.05b4": "Hora da troca de turno\nMe deixe passar, ou...\nNão, nada"
"text.0636": "Ainda não é hora da\ntroca de turno."
"text.0694": "Tudo bem, não se preocupe.\nQuando é a troca de turno?"
"text.0704": "Não, temos que seguir\no horário à risca."
"text.075e": "As trocas de turno são\nà meia-noite e ao meio-dia."
"text.07bc": "Ah, entendi."
"text.07e2": "Você não me ameaça.\nPrecisa de uma autorização."
"text.084a": "Autorização? Eu tenho uma.\nEu te dou permissão!"
"text.08bc": "Não podemos te dar uma\nautorização. Tem que seguir\nos canais oficiais."
"text.0944": "Nossa, que rigorosos!"
"text.097c": "Ainda não é a troca de turno?"
"text.09b8": "..."
"text.09c6": "Uau, ele está nos encarando!\nAcho que ele não vai\ntrocar o turno."
"text.0a42": "Vamos voltar depois.\nTalvez seja melhor nos\nescondermos e esperar."
"text.0aca": "Bopi bopi pooooo."
"text.0b02": "Geba geba!"
"text.0b2c": "Boobyo?"
"text.0b50": "Estou satisfeito!"
"text.0b82": "Faz parte do meu trabalho."
"text.0bc6": "Qual é o problema?"
