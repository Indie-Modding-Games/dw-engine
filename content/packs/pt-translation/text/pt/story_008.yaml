text.004e: "Túnel Broca"
text.0084: "Normal\nModo Ogro"
text.00ec: "Ah, que grosso! Que falta\nde educação!"
text.012e: "Hã?"
text.015a: "{color:7}Gerente do mercado {color:1}\nNão sabia que teríamos\nque pagar para passar!"
text.01f6: "{color:7}Gerente do mercado {color:1}\nEi, você não é... é sim!\nFaça alguma coisa!"
text.026c: "Como estão os Drimogemon\nlá dentro?"
text.02b0: "{color:7}Gerente do mercado {color:1}\nNão sei."
text.02f6: "Tomara que estejam bem.\nCerto, lá vou eu!"
text.0362: "{color:7}Gerente do mercado {color:1}\nFaça algo, rápido!"
text.03f8: "Não há mais nada no\ntúnel... Atravessamos\nou o quê?"
text.047e: "Vamos atravessar!\nMelhor não"
