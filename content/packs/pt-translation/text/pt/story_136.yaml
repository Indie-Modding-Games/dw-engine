"text.014c": "Ouço uma voz vindo de\ntrás. Essa voz é...!"
"text.01f6": "Espere!"
"text.0208": "Por que eu esperaria?!"
"text.023e": "Ha ha ha!"
"text.02bc": "Uau, que surpresa!"
"text.02ee": "Whamon, boa! Uau!"
"text.033e": "Desista!"
"text.0364": "Ugghh!"
"text.0378": "Venha trabalhar na cidade\npara pagar pelos seus erros."
"text.03ec": "Tá bom, entendi.\nVou para a cidade."
"text.0452": "Ha ha ha, brincadeira! Tchau."
"text.08fa": "Droga, ele me enganou!"
"text.092a": "Bom, recuperamos a caverna.\nAcho que está tudo bem."
"text.099a": "Acho que a caverna já está\nsegura."
"text.09da": "Você parece uma pessoa muito\nboa. Com certeza um dia eles\nvão ver o erro deles."
"text.0a8a": "Vou te dar meu tesouro.\nEstá lá no fundo."
"text.0aea": "Espere, espere.\nEsse é o seu tesouro, né?\nNão posso aceitar."
"text.0b68": "Não, eu não preciso dele.\nQuero ir para a sua cidade."
"text.0bce": "Então por que tivemos que\nrecuperar esta caverna?\nPor nada...?"
"text.0c56": "Desculpe, mas agora eu\nquero muito te ajudar."
"text.0cb8": "Entendo. Obrigado.\nVocê é muito legal."
"text.0d04": "Vou direto para a cidade.\nSe quiser, te dou\numa carona."
"text.0d92": "Whamon entrou na cidade!"
"text.0dd4": "Voltando para a cidade?"
"text.0e0a": "Vou voltar\nNão vou"
