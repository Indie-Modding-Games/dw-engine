text.0088: "Dá para parar com isso?"
text.00c6: "Shuha, shuha!"
text.00f6: "Zás!"
text.0118: "Vamos lutar com tudo!"
text.0158: "Do que você está falando?"
text.019a: "Noroeste: Terra Gelada"
text.01d8: "Elevador"
text.01f0: "Subir\nDescer\nNão entrar"
text.02b4: "O quê?"
text.02c4: "Nada acontece."
