"text.0060": "Aqui é a Loja de Cartas\nDigimon."
"text.00a0": "O que é uma carta Digimon?"
"text.00d4": "Todo mundo coleciona.\nNão tem como perder."
"text.0146": "Hã?"
"text.0158": "Vou te dar uma de graça\npara começar. É das boas."
"text.01ca": "Ei! Essa carta é sobre MIM!"
"text.0206": "Ganhou uma carta de {color:6}{tamer}{color:1}!"
"text.0236": "Aqui é a Loja de Cartas\nDigimon."
"text.027e": "Hoje temos cartas muito\nlegais no estoque."
"text.02da": "Comprar uma carta\nVender uma carta\nSair"
"text.0348": "Comprar pacote de três\nComprar uma\nSair"
"text.03a0": "Comprar uma\nSair"
"text.03cc": "Quinhentos Bits o pacote.\nNinguém sabe o que vem."
"text.0442": "Vou comprar\nNão, obrigado"
"text.0488": "Abra o pacote agora mesmo."
"text.04e8": "Quer mais alguma coisa?"
"text.0526": "Volte sempre."
"text.0552": "Esta é uma loja de reciclados."
"text.0594": "Quero um item normal\nQuero um item reciclado\nFica para a próxima"
"text.0676": "Ei!?"
"text.0690": "É uma loja!"
