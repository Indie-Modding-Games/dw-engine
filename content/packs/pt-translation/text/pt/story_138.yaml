"text.0018": "Coleciono cartas Digimon."
"text.0058": "Me dê Hagurumon,\nToyAgumon e WaruMonzaemon,\nque eu te dou uma coisa."
"text.0108": "Dar\nNão dar"
"text.0138": "Desculpe, não tenho nenhuma."
"text.0176": "Aqui. Uma {color:6}Atadura X{color:1}."
"text.01b4": "Tenho itens demais."
"text.01f8": "Já experimentou o curling?"
"text.0236": "Se conseguir dez pontos\nno jogo, você tem uma\nhabilidade incrível."
"text.02c0": "Não sei se ajuda, mas\naqui vão dicas de pesca."
"text.0338": "Primeiro, a vara. Uma boa\nvoa longe e tem\nboa flexibilidade."
"text.03c0": "Depois, a isca. Lembre qual\npeixe você pegou com\nqual isca."
"text.043c": "Ao lançar a vara, solte\ncom {color:6}△ {color:1}\npara voar com força total!"
"text.04ce": "Sobre o Guardião do Lago...\nEle aparece de manhã e\nno fim da tarde, todo dia."
