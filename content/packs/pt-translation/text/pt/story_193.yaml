text.0050: "Ele chegou! Funcionou!"
text.0094: "Um humano.\nComo você disse, Jiji."
text.00e8: "Mmmm."
text.0102: "Psiu, ele está levantando."
text.0140: "Hã? Onde estou?"
text.0170: "Bem-vindo ao Mundo Digimon!"
text.01ae: "O quê?"
text.01d0: "Ai!"
text.01ec: "O que foi?"
text.0220: "Quem são vocês?"
text.0266: "Somos Digimon."
text.0296: "Digi... o quê?"
text.02c0: "Hã? Achei que você\nconhecia os Digimon."
text.0320: "Já entendi, isto é um sonho."
text.0364: "Não é um sonho."
text.039a: "Ei, espera, você é o Tokomon.\nQue sonho realista."
text.0412: "{color:6}{tamer}{color:1}, isto não\né um sonho, mas também\nnão é real."
text.048a: "Do que você está falando?\nQuem é você?"
text.04ea: "Eu sou o Jijimon."
text.0514: "Não conheço nenhum\nDigimon com esse nome."
text.0576: "Há mais Digimon do que\nvocê conhece.\nEste é o Mundo Digimon."
text.0600: "O Mundo Digimon?!"
text.0636: "Este mundo não é um\nsonho nem é real.\nÉ o nosso mundo."
text.06b8: "Puxa... Parece real demais\npara ser um sonho."
text.071e: "Olhe atrás de você e\nvai entender o que digo."
text.077a: "O quê?"
text.07b6: "Este é o {color:10}{partner}{color:1}?"
text.07e2: "Agora lembrei! Fui sugado\npara aquele chaveiro Digimon."
text.0864: "Isso mesmo."
text.0892: "Por que estou aqui?"
text.08be: "Venha à minha casa,\nque eu explico."
text.0a62: "Eu te trouxe aqui\npara nos salvar."
text.0aaa: "Salvar vocês do quê?"
text.0ae0: "Estamos na Cidade File,\no centro da Ilha File."
text.0b58: "Uma cidade? Aqui?"
text.0b86: "Bom, era uma cidade.\nAqui viviam Digimon\nde todo tipo."
text.0c2e: "Os Digimon perderam o ânimo\ne foram embora da cidade."
text.0ca6: "Como assim?"
text.0cdc: "Não sei bem o que causou isso.\nOs Digimon começaram a\nperder a fala."
text.0d84: "Alguns ainda falam, mas\ntodos esqueceram que\nmoravam aqui."
text.0e14: "Era isso que você queria\ndizer com perder o ânimo."
text.0e70: "É perigoso se a gente\nnão fizer nada."
text.0ebc: "Mas por que eu?"
text.0ee2: "Você é bom em criar\nDigimon, não é?"
text.0f3c: "Claro que sou bom nisso!"
text.0f7c: "Não percebeu que está\nfalando a língua Digimon?"
text.0fe6: "Hã? Nada disso. Estou\nfalando português comum."
text.104e: "Para nós, soa como Digimon."
text.10a2: "Isso mesmo!"
text.10d4: "Neste mundo, seu amor\npelos Digimon vai\nte dar força."
text.1158: "Obrigado."
text.1176: "Por isso te escolhi. Você\npode reunir todos os\nDigimon da ilha!"
text.120a: "O quê?"
text.121c: "Hmm?"
text.122c: "Pode contar comigo!"
text.126c: "Muito bem!"
text.1294: "Obrigado, você é nossa\núnica esperança."
text.12da: "Por onde eu começo?"
text.130c: "Leve {color:10}{partner}{color:1} e\nexplore a ilha."
text.1360: "Encontre a causa deste\nperigo e faça os\nDigimon voltarem."
text.13f6: "Vamos, {color:10}{partner}{color:1}!"
text.1444: "Espera, ainda não terminei."
