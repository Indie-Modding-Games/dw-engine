text.0040: "!"
text.0058: "O que houve com a ilha?"
text.0092: "As tribos se separaram,\nperdendo a memória e\nficando selvagens."
text.0100: "Não sei por quanto tempo\nvou manter o juízo."
text.0152: "Não podemos deixar assim!\nEles precisam ver o perigo!"
text.021c: "Pare! Quer arruinar\na ilha?!"
text.0278: "Quem é você? Saia da minha\nfrente! Este é o único jeito!"
text.031c: "Está me dizendo que\nhá outro jeito?"
text.037a: "Se a ilha for arruinada,\nnão adianta nada!\nMe escute."
text.03fe: "O quê?"
text.0418: "Estamos construindo uma\ncidade para a ilha, reunindo\ntodos os Digimon."
text.049a: "Ouvi dizer que podemos\nsalvar a ilha desse perigo\nunindo os Digimon."
text.0532: "Acho que você tem razão,\nmas reunir todos os\nDigimon é um grande..."
text.05cc: "Estamos cuidando disso\nagora. Nada é impossível!"
text.063e: "É uma tarefa enorme!\nMas fiquei comovido...\nTalvez vocês consigam."
text.06c8: "Se acredita em nós, quero\nque venha para a cidade."
text.073e: "Certo. Vou para a cidade.\nAcho que é o meu novo rumo!"
text.07f0: "Meramon entrou na cidade!"
text.084a: "Eu sabia que você voltaria.\nPreciso saber a resposta!"
text.08f0: "Acho que perdi..."
text.091c: "Tem uma coisa que\npreciso te contar."
