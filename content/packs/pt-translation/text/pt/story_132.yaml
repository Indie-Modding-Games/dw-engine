"text.0028": "Onde estamos?\nIsto é um sonho?"
"text.008c": "Uau! Quem é você?\nCadê {color:10}{partner}{color:1}?"
"text.00e2": "Calma. Meu nome é Frigimon.\nEsta é a minha casa. Sou\num Digimon de gelo e neve."
"text.017c": "Você estava desmaiado na\nneve. Eu te trouxe\ne cuidei de você."
"text.0218": "Ah, {color:10}{partner}{color:1}.\nQue bom que você está bem!"
"text.025c": "Ei, está me ouvindo?\nSe eu não te achasse,\nvocê já estaria morto!"
"text.02f6": "Ah, desculpe. Puxa, obrigado."
"text.033e": "Ei, {color:10}{partner}{color:1},\naté bati a cabeça quando\nvocê caiu de repente."
"text.03be": "{digimon:pstat=103}não aguenta frio.\nVocê é muito imprudente.\nA culpa é toda sua."
"text.0452": "Eu não sabia.\nDesculpe, {color:10}{partner}{color:1}."
"text.049e": "Obrigado, Frigimon. Posso\npedir mais um favor?"
"text.0504": "E se {digimon:pstat=103}\ndesmaiar de novo?\nÉ melhor ir logo para casa!"
"text.058e": "Tá, entendi.\nVou digievoluir {color:10}{partner}{color:1}\nem outro Digimon."
"text.062c": "Digievoluir?"
"text.06c8": "Olá de novo."
"text.06e8": "O que houve com\no outro Digimon?"
"text.0732": "Ah, é o mesmo."
"text.076a": "Hã? É mesmo?\nNão entendi."
"text.07bc": "Vim porque tenho um\nfavor a pedir. Quero que\nvocê venha para a cidade."
"text.0850": "O que tem lá para mim?\nAlgo interessante?"
"text.08b6": "Bom, você pode abrir\na loja que quiser."
"text.0914": "Uau, sempre quis fazer\nisso. Tá bom, eu vou!"
"text.0980": "Certo, ótimo.\nEntão vamos agora."
"text.09d8": "Uma loja! Raspadinha e\nsorvete. Vai ser\ndemais!"
"text.0a94": "Frigimon entrou na cidade!"
"text.0ad6": "Esse Digimon não aguenta\nmuito bem o frio!"
"text.0b36": "Eu volto!"
