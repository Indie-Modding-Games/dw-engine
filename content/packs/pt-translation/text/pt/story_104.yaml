"text.0020": "Quero vencer o Kabuterimon.\nO que faço para ganhar?"
"text.0098": "Hmm. Precisa ficar mais forte.\nNa verdade, tem um jeito\ncerteiro... Bom, aguente aí."
"text.015e": "Entendi. Certo, vou treinar."
"text.019e": "Sério?! Então eu te treino!"
"text.01e8": "É só vir para a cidade."
"text.0220": "..."
"text.022c": "Você é muito legal.\nVou para a cidade."
"text.02bc": "Kuwagamon entrou na cidade!"
"text.0304": "Puxa, você não é nada legal.\nQue decepção!"
"text.0368": "Ei, você já participou dos\ntorneios de insetos, né?"
"text.03d8": "Bom, vou te ensinar\numa coisa útil."
"text.042a": "Sabe onde o Kunemon dorme?\nNa Floresta Nativa?"
"text.0496": "Os Digimon filhotes dormem\nlá. Quando acordam,\nviram Kunemon."
"text.051e": "Mas às vezes isso não\nacontece. É questão de sorte."
"text.05a8": "Ei, você já participou dos\ntorneios de insetos, né?"
"text.0618": "Hã... Do jeito que você está,\nnão vai conseguir."
"text.0676": "Bom, vou te ensinar\numa coisa útil."
"text.06c8": "Sabe onde o Kunemon dorme?\nNa Floresta Nativa."
"text.0734": "Os Digimon filhotes dormem\nlá. Quando acordam,\nviram Kunemon."
"text.07bc": "Mas às vezes isso não\nacontece. É questão de sorte."
"text.0826": "Ei, quer participar do\ntorneio de insetos?"
"text.0890": "O que é isso?"
"text.08b0": "Tem que se inscrever até as\ndez horas do dia vinte e dois."
"text.0924": "Hã???"
"text.0938": "Os detalhes você recebe\nno dia do torneio."
"text.099c": "Do que será que ele\nestá falando?"
"text.09ea": "Vamos treinar duro, mas\ntambém precisamos descansar."
"text.0a42": "Vamos descansar uma hora?"
"text.0a7e": "Descansar\nNão descansar"
"text.0ae0": "{color:5}Treino:\nMáquina de martelo {color:1}"
"text.0b1e": "Começar\nExplicar\nSair"
"text.0b56": "Normal\nTentativa bônus\nSair"
"text.0ba0": "Levar golpes da Máquina de\nmartelo te deixa forte.\nA Defesa aumenta."
"text.0c3e": "Explicar de novo\nComeçar\nSair"
"text.0c98": "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ \npara alinhar três figuras."
"text.0d22": "{color:5}Treino: Esteira {color:1}"
"text.0d54": "Começar\nExplicar\nSair"
"text.0d8c": "Normal\nTentativa bônus\nSair"
"text.0dd6": "Corra no sentido contrário\nda esteira em movimento.\nSua Velocidade aumenta."
"text.0e5a": "Explicar de novo\nComeçar\nSair"
"text.0eb4": "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}\npara alinhar três figuras."
