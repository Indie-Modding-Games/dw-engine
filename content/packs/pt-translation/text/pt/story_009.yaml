text.004c: "Máquina de venda"
text.007a: "Nossa, que caro!"
text.00b6: "Carne: 300 Bits\nDigicogumelo: 600 Bits\nNão comprar"
text.015e: "Não tenho dinheiro suficiente."
text.01b2: "Não tenho dinheiro suficiente."
text.01f6: "Saiu {color:6}Carne{color:1}!"
text.023e: "Opa, coisas demais."
text.0286: "Saiu um\n{color:6}Digicogumelo{color:1}!"
text.02ec: "Opa, coisas demais."
text.0338: "Como pescar:\nPrimeiro, arrume uma 'vara'.\nVai aparecer um submenu {color:5}× {color:1}\ncom o ícone 'Pesca'. Escolha.\nPonha a isca com {color:6}△ {color:1}.\nEscolha algo da comida\nque você leva."
text.0480: "Depois, mude de direção\ncom esquerda ou direita.\nErga a vara com {color:6}△ {color:1}\ne lance com {color:6}△ {color:1}.\nEspere a boia se mexer:\no peixe mordeu a isca.\nPuxe com {color:6}△ {color:1}."
text.05f8: "Olhe o medidor no alto, à\nesquerda. Solte {color:6}△ {color:1}antes\nde encher, senão a linha\narrebenta. Tome cuidado.\nSe puxar a boia perto o\nbastante de você, terá\npescado o peixe."
text.077a: "Se aparecer um 'X' na sombra\ndo peixe, não dá para pescar\ncom a isca que você usa."
