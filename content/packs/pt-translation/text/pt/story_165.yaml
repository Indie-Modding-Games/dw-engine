text.0060: "Você chegou na hora certa!\nTenho um grande favor a pedir\nque só você pode fazer."
text.010c: "O que é?"
text.012a: "É a mesma maldade\nque senti no Analogman\ne no Machinedramon."
text.01a6: "Mas não sei dizer\nde onde ela vem."
text.01fe: "Certo, deixe comigo!"
text.0236: "Obrigado. Aliás..."
text.0282: "Ouvi dizer que você\nvenceu o Machinedramon!"
text.02d2: "É, mas não entendo.\nParecia a maldição\ndo Analogman."
text.035a: "O rancor dele era forte.\nTalvez agora tenhamos paz."
text.03ce: "Se o Machinedramon voltar,\nvamos vencê-lo de novo."
text.0436: "Você é de confiança. Aceite\nisto como agradecimento.\nCresceu na Fazenda de Carne."
text.04d8: "Uau! Um {color:6}Melão\ncadeia{color:1}?"
text.0530: "Tenho itens demais."
text.0570: "Aceito com prazer, obrigado!"
text.05c8: "Ah, você voltou!\nIsto eu não posso pedir\na mais ninguém."
text.0648: "Certo. Quer dizer que\no Analogman voltou?"
text.0698: "Senti a maldade dele,\nmas não sei onde está."
text.06fc: "Certo, deixe comigo!\nVou encontrá-lo e\nresolver isso."
text.0780: "Ah, obrigado. Aliás..."
text.0800: "Você acordou. Sinto muito."
text.086a: "Que máquina é essa?"
text.08a6: "É uma {color:4}máquina que salva\ndados de batalha no\ncartão de memória{color:1}."
text.0914: "Com ela, você pode\nsalvar os dados do seu\nparceiro para batalhas."
text.09aa: "É só apertar {color:6}△ {color:1}\ne a máquina te diz\no que fazer."
text.0a4e: "Quer usar a\n{color:4}máquina que salva\ndados de batalha{color:1}?"
text.0ace: "Sim\nNão"
text.0b04: "Parece que o Yuramon\njuntou mais boatos."
text.0b78: "Ouvi dizer que o Yuramon\nsabe de boatos novos."
text.0bda: "A cidade começa a\ncrescer e mudar\nagora que estamos aqui."
text.0c5a: "{color:6}{tamer}{color:1}, você tem um\njeito bem diferente\nde viver a aventura."
