text.009a: "Ha! Está com medo."
text.00d4: "É melhor ir para casa!"
text.0114: "Quem entra\nnão sai mais."
text.0170: "Hê, hê!"
text.0198: "Espere."
text.01b8: "Você vai ser possuído."
text.0202: "Bakke-bakke?"
text.0226: "Parece que ele está\nperguntando algo."
text.0272: "?...Sim\n?...Não"
text.02a8: "Bakke! Bakke bakke?"
text.02d6: "Sim\nNão"
text.0300: "Bakkeee...bakke bakke?"
text.0338: "Sim\nNão"
text.035e: "Bakke bakke!\nBakkeee bakke bakkeee!"
text.03e8: "Bakemon entrou na cidade!"
text.0422: "Acho que deu certo."
text.046e: "Será que o deixei bravo?"
text.04ea: "Uma estranha força negra\nme impediu!"
text.0556: "O quê?! Minhas pernas..."
