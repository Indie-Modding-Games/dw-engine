text.001e: "{color:6}{tamer}{color:1}, você conseguiu!"
text.0044: "O Agumon veio para a cidade.\nEle abriu um negócio\nali adiante."
text.00be: "Tomara que mais Digimon\nsejam como ele!"
text.012c: "A Palmon veio e quer\naumentar a Fazenda de Carne."
text.019c: "Assim teremos muita Carne!"
text.01f4: "O Kunemon veio e\nquer comer capim."
text.024e: "Tomara que coma o mato!"
text.02a2: "O Centarumon veio e\nquer abrir uma clínica."
text.0310: "Chega de se preocupar com\nficar doente ou machucado!"
text.0386: "O Coelamon veio e\nquer abrir uma loja."
text.03ec: "A cidade vai prosperar!"
text.0438: "O Betamon veio e disse\nque quer abrir uma loja."
text.04a8: "A cidade vai prosperar!"
text.04f4: "O Bakemon veio e disse\numa coisa que não entendi."
text.056c: "É, bom, tudo bem."
text.05b6: "O Vegiemon veio. Ele quer\naumentar mais a Fazenda\nde Carne."
text.0632: "Chega de se preocupar\ncom comida."
text.0686: "O Tyrannomon veio e disse\nque a comida dele é a melhor."
text.06f8: "Bem, tem o seu charme."
text.0746: "O Meramon veio e disse\nque é o chefe das chamas."
text.07c0: "Ele está pegando fogo\nde motivação!"
text.0816: "O Frigimon veio e falou\nalguma coisa de lanches."
text.0882: "Eu adoro lanches."
text.08bc: "O Garurumon veio e\ndisse que sabe cozinhar."
text.091e: "Ele é bem habilidoso."
text.0964: "O Birdramon veio dizendo\nque vai ser Mensageiro."
text.09c4: "Parece bom."
text.09fa: "O Shellmon veio dizendo\nque vai fazer quadros\nde avisos."
text.0a70: "Um passo rumo à\nsociedade da informação!"
text.0ada: "O Elecmon veio e vai\nligar a eletricidade."
text.0b46: "Tomara que a cidade\nfique bem iluminada."
text.0b9c: "O Kokatorimon veio e\nfalou de fazer uma estátua."
text.0c10: "Um lugar para relaxar."
text.0c66: "O Monochromon veio falando\nde trabalhar como gerente\nda Loja de Itens.{stop}"
text.0d08: "Ele é um profissional."
text.0d4e: "O Unimon veio falando de\nser útil nos negócios."
text.0dc4: "Boa atitude."
text.0e12: "O Patamon veio perguntando\nde trabalhos interessantes."
text.0e78: "Sugeri a Loja de Itens."
text.0ec8: "O Biyomon veio perguntando\nque trabalho eu indicaria."
text.0f3c: "Sugeri a Loja de Itens."
text.0f8c: "O Greymon veio falando\nde fazer uma Arena."
text.0ff2: "Com certeza quero\nver isso."
text.104c: "O Penguinmon veio\nfalando de fazer\num estádio de curling."
text.10ca: "Estamos ficando com\nmuita variedade."
text.1120: "O Angemon veio e falou\nde gravar\nconversas."
text.1194: "Ele está aqui perto."
text.11ce: "O Drimogemon veio e falou\nde virar caçador de\ntesouros em tempo integral."
text.1270: "Um grande trabalho!"
text.12a2: "O Gabumon veio e\nfalou que está preocupado\nem fazer alguma coisa."
text.1334: "Eu disse para ele escolher\num trabalho grandioso."
text.13a0: "O Ninjamon veio e\nfalou de treinar."
text.1400: "Dá gosto ver gente\ntrabalhadora."
text.145a: "O Whamon veio falando\nde fazer o papel\nde balsa."
text.14e0: "Ótimo!"
text.150a: "O Mojyamon veio falando\nde abrir\numa Loja de Tudo."
text.1586: "Mas tem algo de\nestranho nisso."
text.15f4: "O Mamemon veio falando de\nvender itens preciosos."
text.166a: "O que será que\n'preciosos' quer dizer?"
text.16c8: "O Numemon veio falando\nde abrir uma loja,\nmas é segredo."
text.1752: "Já não é mais segredo."
text.17a0: "O Kabuterimon veio falando\nde treinar e reformar."
text.181e: "Será que foi ao Ginásio Verde?"
text.1872: "O Kuwagamon veio perguntar\nonde está o Kabuterimon."
text.18d8: "Aonde será que ele foi?"
text.1916: "O Giromon veio e disse:\nfaça um pedido!"
text.1976: "Então faça um pedido."
text.19b8: "O Ogremon veio e me\npediu para comprar o\nbraço dele."
text.1a1c: "O olhar dele faiscava!"
text.1a66: "O Leomon veio e perguntou\nmuito sobre a cidade."
text.1acc: "Parece que a Patrulha da\nSavana continua ativa!"
text.1b40: "O Piximon veio e perguntou:\n'Moço, quer um\nitem secreto?'"
text.1bca: "Ele me preocupa."
text.1c04: "O Etemon veio falando\nde abrir uma loja legal."
text.1c70: "Parece suspeito."
text.1cb2: "O MetalMamemon veio\nperguntar se há trabalhos\npara competir com {color:6}{tamer}{color:1}."
text.1d4e: "Ele tem espírito competitivo."
text.1da4: "O Vademon veio, e...\nespera, ele veio mesmo?"
text.1dfc: "Não consigo me lembrar."
text.1e4c: "O MetalGreymon veio\ne falou de ser modelo"
text.1eb2: "Ele se acha demais!"
text.1efc: "O Nanimon veio e foi embora."
text.1f38: "Onde será que ele está?"
text.1f80: "O Monzaemon veio, ou\nmelhor, a carcaça dele\napareceu de repente."
text.2012: "Ele resolveu deixá-la em casa."
text.206e: "O Devimon veio falando de\num item fantástico mesmo."
text.20e4: "Acho que é fantástico."
text.2130: "O Airdramon já sarou\ne falou de trabalhar."
text.219a: "Que bom que voltou\nao normal."
text.21f4: "O Digitamamon veio e foi\nembora na velocidade da luz."
text.2264: "Ele ainda está em algum\nlugar da cidade."
text.22c4: "O SkullGreymon veio dizendo\nque vai competir\nna Arena."
text.233e: "O Myotismon foi meu\nintérprete."
text.2396: "O Andromon veio dizendo\nque foi um prazer conhecer."
text.23fa: "Parece que ele não pode\nficar por muito tempo."
