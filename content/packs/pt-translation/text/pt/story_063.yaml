text.0042: "Myotismon não está aqui."
text.00b2: "Hã... a chave da minha\ngeladeira de carne?"
text.00f4: " ! "
text.0102: "Alguém veio me ajudar?"
text.013a: "Um Digimon? Você está bem?"
text.016a: "Quem é você? Me dê comida!"
text.01a6: "Com fome? O que você quer?"
text.01e0: "Carne."
text.020c: "Tenho carne!"
text.022a: "Carne."
text.023c: "O quê?"
text.0252: "Carne? Não, não tenho nada."
text.028e: "Tome."
text.02a4: "Uma chave?"
text.02c4: "Preciso me livrar de algo."
text.0312: "Ganhei a {color:6}Chave gelad.{color:1}!"
text.0342: "Certo..."
text.0358: "Não tenho muito tempo!"
text.038c: "Logo trago alguma coisa.\nAguente mais um pouco."
text.03fc: "Ufa!"
text.041e: "Estou salvo. Muito obrigado.\nDesculpe o incômodo."
text.0488: "O que aconteceu?"
text.04ac: "Sou Myotismon, senhor\ndesta mansão."
text.0500: "Sou {color:6}{tamer}{color:1}, um humano de\noutro mundo. Este é\nmeu parceiro, {color:10}{partner}{color:1}."
text.0580: "Viemos para\nsalvar a ilha."
text.05c4: "Parece que temos muito a\nconversar. Sejam bem-vindos."
text.0678: "Uau!"
text.0688: "..."
text.0696: "Tá falando sério?"
text.06c6: "Sumiu. Isto é um sonho?"
text.0746: "Acho que resolvemos."
text.078e: "O quê?"
text.07a6: "Hã? O quê?"
text.07ca: "Eu desmaiei. Desculpe."
text.084e: "A maldição do Analogman!\nCalma, vai ficar tudo bem."
