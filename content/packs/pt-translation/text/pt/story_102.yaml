text.005a: "Infelizmente, você chegou\ntarde para se inscrever.\nEspere mais um ano."
text.00f4: "Estamos entre torneios.\nNão tenho nada para fazer."
text.017c: "O torneio acabou de terminar.\nEspere mais um ano."
text.01fc: "Você não é um inseto.\nNão pode participar."
text.027c: "Quer participar do torneio?"
text.02c0: "Explicar\nNão explicar"
text.02fe: "No dia vinte e dois, há um\ntorneio só para Digimon\ninseto."
text.0390: "Você pode se inscrever\nnele agora mesmo."
text.03e6: "Se não for um Digimon\ninseto, não pode se\ninscrever no torneio."
text.047a: "Se ganhar, vai receber\nprêmios de luxo. É só se\ninscrever."
text.04f4: "Inscrever-se\nNão se inscrever"
text.0548: "Estamos entre torneios.\nNão tenho nada para fazer."
text.05d0: "O torneio acabou de terminar.\nEspere mais um ano."
text.0632: "Você está inscrito no\ntorneio  ' - {tournament:pstat=3}- '.\nQuer cancelar?"
text.06bc: "Não cancelar\nCancelar"
text.0706: "Inscrição cancelada."
text.0726: "Tem certeza disso?"
text.0764: "Inscrição feita."
text.07a2: "Hoje não tem torneio."
text.0806: "Quem não está inscrito\nnão pode entrar."
text.0886: "Ainda não abriu. Inscreva-se\nno dia vinte e dois, das dez\nda manhã às onze da noite."
text.0950: "Que pena, o torneio acabou.\nVolte no ano que vem."
text.0a10: "Que pena.\nFica para o ano que vem."
text.0a60: "Ganhei {color:6}Carne enorme {color:1}\npor participar!"
text.0ac8: "Coisas demais.\nJogue algumas fora."
text.0b30: "Prêmio do campeonato:\ncinco mil Bits.\nGanhei {color:6}Pérola inseto {color:1}\ncomo prêmio de campeão!"
text.0c00: "Coisas demais!"
text.0c52: "Prêmio do segundo lugar:\ndois mil Bits!\nGanhei {color:6}Elmo chifre {color:1}\ncomo prêmio de vice!"
text.0d22: "Coisas demais!"
text.0d6c: "Prêmio do segundo lugar:\ndois mil Bits!\nGanhei {color:6}Boca tesoura {color:1}\ncomo prêmio de vice!"
text.0e32: "Coisas demais!"
