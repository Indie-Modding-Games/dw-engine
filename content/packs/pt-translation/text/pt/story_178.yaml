text.00a8: "Você chegou na hora certa!\nTenho um favor que só\nvocê pode fazer."
text.0146: "O que é?"
text.0164: "Acabei de sentir a mesma\nmaldade que o Analogman\ne o Machinedramon passam."
text.01f8: "Eu sei de onde ela vem."
text.0236: "De novo? Tá, deixa comigo!"
text.0272: "Obrigado. Aliás..."
text.02b8: "Soube que você venceu\no Machinedramon!"
text.02fe: "É, mas não entendo.\nParecia a maldição\ndo Analogman."
text.0386: "O rancor dele era forte.\nTalvez agora tenhamos paz."
text.03fa: "Se o Machinedramon voltar,\na gente vence ele de novo."
text.0460: "Você é de confiança. Isto\ncresceu na Fazenda de Carne,\né para você."
text.04f0: "Uau! Um {color:6}Melão\ncadeia{color:1}?"
text.0548: "Tenho itens demais."
text.0588: "Obrigado!"
text.05be: "Você veio!\nNão posso pedir isto\na mais ninguém."
text.0636: "Não tema, estou aqui.\nQuer dizer que o\nAnalogman voltou?"
text.06a6: "Sinto a maldade dele, mas\nnão sei dizer onde está."
text.0712: "Deixa comigo! Vou achá-lo\ne dar um jeito nele."
text.0784: "Obrigado.\nAliás..."
text.07ea: "Voltei e pretendo reconstruir\na Cidade File com a ajuda\nde {color:10}{partner}{color:1}."
text.0882: "Quero construir lojas\nque sejam úteis para você\ne {color:10}{partner}{color:1}."
text.0900: "Explore a Floresta Nativa,\nlogo fora da cidade."
text.099c: "Fique com isto. Boa sorte."
text.09de: "Consegui um monte de itens!"
text.0a26: "Para ver os itens, aperte\n{color:5}× {color:1}..."
text.0a6a: "...depois escolha «Item»\ne veja usando\n{color:6}△ {color:1}."
text.0ae2: "Parece que o Yuramon\njuntou mais boatos."
text.0b56: "Ouvi dizer que o Yuramon\ntem boatos novos."
text.0bb2: "A cidade está começando\na crescer e dizem que\nestá mudando."
text.0c30: "Vou te ensinar o básico\nsobre o nosso mundo."
text.0ca0: "O dia tem vinte e quatro\nhoras, e tem manhã,\ntarde e noite."
text.0d32: "Talvez você ache que\no ritmo é rápido."
text.0d76: "O ano tem trinta dias.\nMês? O que é isso? Estações?\nDá para comer?"
text.0e14: "Claro que temos dinheiro.\nA unidade é o bit. Dinheiro\nnunca é demais."
text.0eb6: "Quando alguém nesta ilha diz\n«cidade», quer dizer aqui."
text.0f24: "Mas há outras vilas\ne cidadezinhas."
text.0f84: "No relógio, o ponto amarelo\nsão as horas e o ponteiro,\nos minutos."
text.100a: "Em cima é meia-noite\ne embaixo, meio-dia."
text.1050: "A parte vermelha à esquerda\né o fim da tarde. Mostra\ndas quatro às oito."
text.10f0: "A parte roxa à direita\né a manhã e mostra\ndas quatro às oito."
text.118a: "Os Digimon ficam ativos\nem certas horas do dia."
text.11e6: "A maioria acorda de manhã\ne dorme à noite, mas\nalguns fazem o contrário."
text.1286: "Se não achar o Digimon\nque procura, tente outra\nhora do dia."
text.1340: "Fale com o Tsunomon e o\nYuramon sempre que puder."
text.13bc: "Vou te falar sobre o\nnível de domador."
text.140a: "Com um nível de domador alto,\nquando seu Digimon partir,"
text.147c: "seu próximo Digimon terá\nparâmetros melhores."
text.14de: "No começo,\nnão vai subir muito,"
text.152e: "mas continue criando com\ncalma e vai melhorar."
text.15b2: "Quando usar o golpe final,\naperte rápido os\nbotões L e R."
text.1658: "Com o medidor final cheio,\ncomparado a vazio, o dano\nno inimigo é o dobro!"
text.1704: "Vou te falar sobre a\nvida de um Digimon."
text.1754: "Quando o Digimon tem fome,\nele avisa você."
text.17ac: "Ele também precisa ir ao\nbanheiro. Garanta que ele\nuse a privada."
text.182e: "Os Digimon ficam com sono e\nprecisam dormir, mas é você\nque tem que pô-lo para dormir."
text.18b8: "Não tente mantê-lo\nacordado por muito tempo."
text.190a: "Ele pode se cansar, adoecer\nou só ficar chateado.\nEle é meio delicado."
text.198c: "Como os Digimon são\ncriaturas selvagens, você\ndeve elogiar ou dar bronca."
text.1a16: "Faça o que fizer,\npreste atenção no que\nseu Digimon está fazendo."
text.1aba: "Você acordou...\nSinto muito."
text.1b28: "Que máquina é essa?"
text.1b64: "Aquilo? É uma {color:4}máquina\nque salva dados de batalha\nno cartão de memória{color:1}."
text.1be6: "Com ela, você pode\nsalvar os dados do seu\nparceiro para batalhas."
text.1c7c: "É só apertar {color:6}△ {color:1}\ne a máquina te diz\no que fazer."
text.1d02: "Quer usar a\n{color:4}máquina que salva\ndados de batalha{color:1}?"
text.1d84: "Sim\nNão"
text.1dce: "Não vejo o Punimon, mas\nacho que vou descansar aqui."
text.1e3a: "{color:7}Punimon {color:1}\nSou o Punimon! Que tal\ndescansar aqui um pouco?"
text.1eb0: "{color:7}Punimon {color:1}\nUma hora de descanso recupera\nHP e MP e baixa o cansaço."
text.1f34: "Descansar\nNão descansar"
