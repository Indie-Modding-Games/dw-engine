text.0020: "Já que minha ferida sarou,\nquero trabalhar. Obrigado\npor cuidar de mim."
text.00b6: "Posso prever o futuro\nde qualquer criatura,\ne é isso que vou fazer."
text.013e: "Se tiver interesse,\nvenha visitar minha loja.\nNão vou te cobrar nada."
text.01d6: "Quer saber qual é\na sua sorte?\nCerto, deixa eu ver."
text.0268: "Hummm, oh... oh, uau!"
text.029a: "Bem, antes de tudo..."
text.0320: "No geral, você tem\nmuita sorte."
text.039e: "No geral, parece\nbem bom."
text.0424: "Sua sorte geral é razoável."
text.04a4: "Sua sorte geral\nnão é lá muito boa."
text.0532: "No geral, não está boa."
text.059c: "Faça o que fizer,\nvai dar tudo certo."
text.05ea: "Uma chance maravilhosa\nvai aparecer para você."
text.0650: "Talvez você viva algo\nmemorável."
text.069e: "Talvez você encontre\nalgo inesperado."
text.06f0: "Sua pergunta vai ter\nresposta."
text.073a: "Sua carteira vai engordar."
text.077e: "Talvez você receba boas\nnotícias dos seus amigos."
text.07de: "Mudar de humor pode\nfazer bem para você."
text.0838: "Tente ir a um lugar\naonde você não costuma ir."
text.0896: "Talvez você tenha um\nsonho interessante."
text.08ea: "Tente não gastar\ndinheiro demais."
text.0936: "Seu segredo pode vir à tona."
text.097a: "Melhor dormir cedo."
text.09ba: "Cuide bem das suas coisas."
text.09f2: "Um amigo pode descontar\na frustração em você."
text.0a5c: "Várias desgraças podem\ncair sobre você..."
text.0ab8: "Talvez você encontre\nalguém de quem não gosta."
text.0b1c: "Uma grande perda pode\ncair sobre você..."
text.0b76: "Sua cor da sorte\né o vermelho."
text.0bbe: "Sua cor da sorte\né o branco."
text.0c0a: "Sua cor da sorte\né o azul."
text.0c54: "Sua cor da sorte\né o preto."
text.0ca0: "Sua cor da sorte\né o verde."
text.0cec: "Sua cor da sorte\né o cinza."
text.0d36: "Sua cor da sorte\né o marrom."
text.0d82: "Sua cor da sorte\né o amarelo."
text.0dd0: "Sua cor da sorte\né o roxo."
text.0e1e: "Sua cor da sorte\né o dourado."
text.0e5c: "Por último, sobre sua\ncompatibilidade com\n{color:10}{partner}{color:1}..."
text.0ece: "É uma combinação perfeita."
text.0f10: "É bem boa."
text.0f4a: "Está ok."
text.0f72: "É mais ou menos."
text.0fa0: "Não é ruim..."
