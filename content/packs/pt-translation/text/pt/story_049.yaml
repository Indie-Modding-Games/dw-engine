text.004a: "Bem-vindo. Nunca te vi\npor aqui. De onde você é?"
text.00c2: "Da cidade. Na verdade,\nsou de outro mundo."
text.0120: "Você entende a minha língua?"
text.015e: "Entendo, sim."
text.017a: "Às vezes é difícil e\naqui eu vendo pouco."
text.01e0: "Entendi."
text.01f4: "Muitos clientes sumiram."
text.0236: "Deve ser por causa dos\nproblemas na ilha."
text.0288: "Me ajude com uma coisa."
text.02ba: "O que é?"
text.02d8: "Pode trabalhar na minha loja?"
text.0310: "Na sua loja?"
text.032c: "Meio período? Quanto mais\nvender, mais eu te pago.\nVocê conhece nossa língua."
text.03c8: "Você pode perder dinheiro."
text.03fa: "Não se preocupe. Vai ser bom\npara mim. Que tal oito horas?"
text.0474: "Vou tentar\nNão, obrigado"
text.05fa: "Que pena. Volte quando\ntiver tempo."
text.065e: "Quer trabalhar?"
text.06b2: "Bom, já está na metade.\n "
text.0750: "Do jeito que vai, não vamos\nganhar nada. Capriche mais.\n "
text.07e2: "As vendas vão bem.\nDá para ganhar um dinheiro."
text.084a: "Fazia tempo que eu não\nvendia tanto.\nContinue assim!"
text.08d8: "Acho que já deu a hora.\nObrigado pelo trabalho."
text.0944: "Podia ter sido melhor, mas\nnão foi tão ruim.\nNão desista."
text.09d4: "Ganhei quinhentos Bits!"
text.0a22: "Você pode fazer melhor.\nQuero que trabalhe mais."
text.0a86: "Ganhei mil e quinhentos Bits!"
text.0ace: "Sua sabedoria, caráter e\ncoragem são o que precisamos\npara salvar esta ilha."
text.0b60: "Do que você está falando?"
text.0b9e: "Eu estava te testando para\nver se pode nos salvar."
text.0c18: "É importante ser\nbom de batalha."
text.0c68: "Além de força, também é\npreciso coragem e sabedoria."
text.0cd4: "Passamos no teste?"
text.0d06: "Sim, vou ajudar vocês\nno que eu puder."
text.0d56: "Você vem para a cidade?\nO que vai fazer\ncom a loja?"
text.0dd2: "Posso abrir uma loja depois.\nEsta loja já cumpriu o papel."
text.0e42: "Monochromon entrou na cidade!"
text.0e7e: "Ganhei dois mil Bits!"
