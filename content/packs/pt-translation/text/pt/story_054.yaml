text.0056: "Myotismon sumiu."
text.009a: "Oh!"
text.00b8: "Achei uma chave. Talvez abra\nalguma daquelas portas."
text.0128: "Usei a\n{color:6}Chave mansão{color:1}!"
text.016e: "Preciso me livrar de algo."
text.01e2: "Usei a\n{color:6}Chave mansão{color:1}!"
text.0246: "Não abre.\nEstá trancada."
text.02d8: "Usei a\n{color:6}Chave mansão{color:1}!"
text.033c: "Não abre.\nEstá trancada."
text.03b0: "Nham, nham...."
text.03d0: "Bem."
text.03e6: "Me escute."
text.0408: "Que delícia, que delícia...."
text.0430: "Meus homens não obedecem mais."
text.0470: "Acho que eles não lembram\nmais das minhas ordens."
text.04ca: "Eles não entendem mais.\nDeveriam me trazer\na comida, mas...."
text.0560: "Nham, nham...."
text.0580: "Enquanto eu trabalhava, não\nme trouxeram a comida,\ne esqueci de comer."
text.0614: "Você está muito envolvido\nno seu trabalho."
text.0662: "Que vergonha."
text.0690: "Acho que há problemas\nna mansão."
text.06e6: "Algum problema na ilha?\nTodos estão como meus homens?"
text.0754: "Sim, todos estão\nperdendo a memória."
text.07a6: "Acha que alguém está\nplanejando isso?"
text.07fa: "Hmm?"
text.080a: "O que eu posso fazer?"
text.082e: "Estamos construindo uma\ncidade para unir os\ncorações dos Digimon."
text.089e: "Estamos procurando amigos."
text.08da: "O que posso fazer? Meus homens\nsó sabem lutar."
text.0940: "Não posso deixá-los aqui."
text.0978: "Entendi."
text.098c: "Deixe-me pensar.\nSinto muito."
text.09e0: "Volto outra hora.\nNão se esqueça de comer."
text.0b9c: "Obrigado pela ajuda.\nVou te mostrar minha pesquisa."
text.0c02: "Às vezes, se MetalGreymon\nse esvai, ele digievolui\npara SkullGreymon.{stop}"
text.0cac: "Bakemon, Devimon e\nPhoenixmon também\ndigievoluem assim."
text.0d22: "Não sei quem eles eram ao\nnascer. As tabelas de\ndigievolução não dizem."
text.0dc6: "As lutas ajudaram\nmeus homens."
text.0e0a: "Uma luta é uma boa pausa\nna minha pesquisa."
text.0e64: "Pesquisa sobre o quê?"
text.0eae: "Construíram uma Arena\nna cidade!"
text.0efc: "Será que meus homens\npoderiam ajudar?"
text.0f40: "Sim, lá eles podem lutar\ncom toda a força que quiserem."
text.0fa4: "Meus homens estão piores.\nÉ hora de deixar\na mansão."
