"text.00c6": "Ei, {color:6}{tamer}{color:1}!"
"text.00f4": "Ei, {color:6}{tamer}{color:1}!"
"text.0122": "Ei, {color:6}{tamer}{color:1}!"
"text.0154": "Obrigado por vir de novo."
"text.0190": "Oi, eu sou o Mojyamon!"
"text.0280": "{color:6}{tamer}{color:1}, estou tão feliz!\nVocê fez tanto por nós."
"text.02e2": "Decidi que vou para a\ncidade. Vamos trabalhar\njuntos, tá bom?"
"text.03a4": "Mojyamon entrou na cidade!"
