text.00e0: "Informações da Arena"
text.0108: "Histórico\nSobre os torneios de Classe\nSobre os torneios especiais"
text.0188: "Campeonatos\nvencidos: {tourn_won}\n{tourn_wins}vitórias {tourn_lost}derrotas"
text.01ea: "Qualquer um pode entrar num\ntorneio de Classe. Tem muitos."
text.025a: "Mas um Digimon de estágio\nsuperior não deve entrar em\ntorneios de nível inferior."
text.02f2: "Se seu Digimon digievoluir\nentre a inscrição e o\ntorneio, não pode competir."
text.039c: "Os torneios especiais têm\nregras de participação\ne não acontecem sempre."
text.0434: "Se não houver lutadores\nsuficientes na cidade,\nnem chegam a acontecer."
text.04cc: "Cada torneio só acontece\numa ou duas vezes por ano.\nVeja o calendário antes."
text.058c: "{color:10}{partner}{color:1}, vou pensar\nnum apelido para você...\num herói que salvou o mundo."
text.061c: "Vejamos."
text.0648: "Que tal\n«{color:10}{partner}{color:1}, o Invencível»?"
text.0694: "Que tal\n«{color:10}{partner}{color:1}, Herói Lendário»?"
text.06e8: "Que tal\n«{color:10}{partner}{color:1}, o Grande»?"
text.0732: "Que tal\n«{color:10}{partner}{color:1}, o Pacificador»?"
text.077e: "Que tal\n«{color:10}{partner}{color:1}, o Campeão»?"
text.07c8: "Que tal\n«{color:10}{partner}{color:1}, o Valente»?"
text.0812: "Que tal\n«{color:10}{partner}{color:1}, o Descolado»?"
text.085e: "Que tal\n«O Poderoso {color:10}{partner}{color:1}»?"
text.08aa: "Que tal\n«O Augusto {color:10}{partner}{color:1}»?"
text.08f2: "Que tal\n«{color:10}{partner}{color:1}, o Gênio»?"
text.0946: "Ei, esses lugares são\npara os convidados."
text.0d0e: "- Classe D -\nTorneio de\nDigimon Novato\n\nLutas um contra um, três\nrodadas, oito lutadores.\nRequisitos ? nenhum."
text.0e0c: "- Classe C -\nTorneio de\nDigimon Campeão\n\nLutas um contra um, três\nrodadas, oito lutadores.\nRequisitos ? nenhum."
text.0f0e: "- Classe B -\nTorneio de\nDigimon Campeão\n\nLutas um contra um, três\nrodadas, oito lutadores.\nRequisitos ? nenhum."
text.1010: "- Classe A -\nTorneio de\nDigimon Ultra\n\nLutas um contra um, três\nrodadas, oito lutadores.\nRequisitos ? nenhum."
text.1112: "- Classe S -\nTorneio dos\nDigimon mais fortes\n\nLutas um contra um, três\nrodadas, oito lutadores.\nRequer vencer a Classe A."
text.120c: "- Classe R -\nTorneio de batalha real:\na tática é a chave da vitória\n\nBatalha real a quatro,\nduas rodadas, oito lutadores.\nRequisitos ? nenhum."
text.1340: "- Copa Versão 1 -\nLuta com tempo limite para\nos melhores Digimon versão 1\n\nLutas um contra um, três\nrodadas, oito lutadores.\nSó Digimon versão 1."
text.147c: "- Copa Versão 2 -\nLuta com tempo limite para\nos melhores Digimon versão 2\n\nLutas um contra um, três\nrodadas, oito lutadores.\nSó Digimon versão 2."
text.15b8: "- Copa Versão 3 -\nLuta com tempo limite para\nos melhores Digimon versão 3\n\nLutas um contra um, três\nrodadas, oito lutadores.\nSó Digimon versão 3."
text.1700: "- Copa Versão 4 -\nLuta com tempo limite para\nos melhores Digimon versão 4\n\nLutas um contra um, três\nrodadas, oito lutadores.\nSó Digimon versão 4."
text.1842: "- Copa Versão 0 -\nLuta com tempo limite para\nos melhores Digimon fora\ndas versões 1 ? 4.\nLutas um contra um, três\nrodadas, oito lutadores. Só\nDigimon fora das v. 1 ? 4."
text.19a8: "- Copa Fogo -\nLuta com tempo limite pelo\nrei dos Digimon de fogo\n\nLutas um contra um, três\nrodadas, oito lutadores. Só\nDigimon de natureza ígnea."
text.1ae2: "- Copa Luta -\nLuta com tempo limite pelo\nrei da luta\n\nLutas um contra um, três\nrodadas, oito lutadores. Só\nDigimon de espírito lutador."
text.1c2c: "- Copa Trovão-Vento -\nLuta com tempo limite pelo\nrei dos Digimon do ar\n\nLutas um contra um, três\nrodadas, oito lutadores. Só\nDigimon de natureza aérea."
text.1d7a: "- Copa Frio -\nLuta com tempo limite pelo\nrei dos Digimon frios\n\nLutas um contra um, três\nrodadas, oito lutadores. Só\nDigimon de natureza gelada."
text.1eac: "- Copa Natureza -\nLuta com tempo limite pelo\nrei da natureza\n\nLutas um contra um, três\nrodadas, oito lutadores. Só\nDigimon da natureza."
text.1ff8: "- Copa Metal -\nLuta com tempo limite pelo\nrei dos Digimon máquina\n\nLutas um contra um, três\nrodadas, oito lutadores. Só\nDigimon do tipo mecânico."
text.2132: "- Copa Sujeira -\nLuta com tempo limite pelo\nrei dos Digimon imundos\n\nLutas um contra um, três\nrodadas, oito lutadores. Só\nDigimon de natureza imunda."
