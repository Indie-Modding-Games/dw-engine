text.0076: "Ah, muito obrigado!"
text.00a6: "O quê? Quer briga?"
text.00f4: "Ah, valeu mesmo!"
text.0120: "Deixa isso!"
text.0154: "Não se esforce demais!"
text.0186: "Vamos lutar, moleque!"
text.01c0: "Eu desisto!"
text.01de: "O chefe sumiu."
text.0262: "Ei, se vocês querem\npassar por aqui, deixem\ntodas as suas coisas!{stop}"
text.02ec: "Quanto tempo."
text.0316: "Hmm. Vocês de novo!"
text.0346: "Essa fala é minha!\nFoi fácil achar vocês.\nProntos para perder?"
text.03c6: "Perder? Nem pensar!\nVou mostrar o que faço\nquando fico sério!"
text.0444: "Vamos resolver isto\nde uma vez por todas!"
text.04de: "Como...? Não consigo ganhar?"
text.0520: "O que foi?\nNão vai fugir?"
text.0578: "Estou cansado demais."
text.059c: "..."
text.05aa: "Virei bandido porque achei\nque esta ilha estava\nperdida, e fiz o que quis."
text.0654: "Você sabia que a ilha\nestava em perigo?"
text.06aa: "Sim, e aí vocês apareceram.\nAcho que é bobagem começar\na ajudar vocês agora."
text.0742: "Acho que não.\nVenha para a cidade."
text.0794: "Não, não posso. Além disso,\nacho que ninguém me perdoaria\npelo que eu fiz."
text.083e: "Ah, fique quieto\ne venha comigo!"
text.089c: "Você pode ser útil!\nTodo mundo tem algo\na oferecer!"
text.090c: "!!!"
text.0922: "Esta ilha tem salvação?\nVocês vão salvá-la\npor nós, né?!"
text.09ba: "Claro! Você sabe\nonde fica a cidade, né?"
text.0a1c: "Ohhhhh!\nEu vou lá!"
text.0a84: "Ogremon entrou na cidade!"
text.0ad6: "Opa!\nA saída não é por aqui!"
text.0b32: "Ah, não! Preciso devolver a\ncaixa de terra ao Drimogemon!"
text.0be6: "Opa! A saída não é por aqui!"
text.0c42: "Ah, não! Preciso devolver a\ncaixa de terra ao Drimogemon!"
