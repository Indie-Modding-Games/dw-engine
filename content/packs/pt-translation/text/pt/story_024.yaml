text.0072: "Quente! Que calor!"
text.00a4: "Começou a ferver!"
text.00e0: "Ah, entendi."
text.010a: "Certo, venha!"
text.0142: "Para mim chega!"
text.0178: "Não, obrigado!"
text.01a2: "O quê?"
text.01c2: "Mmmmm!"
text.01f4: "Tenho um mau pressentimento."
text.022c: "Você também? Bem que eu achei."
text.0288: "Não há nada no túnel.\nVamos atravessar?"
text.02f0: "Ir\nNão ir"
