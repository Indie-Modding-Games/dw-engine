text.0066: "Taaa"
text.0084: "Vamos pedir perdão."
text.00ce: "O perdão cura o coração."
text.011c: "Você é do mal?"
text.014c: "Siga-me. E então..."
text.0194: "Ha ha ha!"
text.01bc: "Você!"
text.01cc: "Você vai perder!"
text.0220: "Não acredito que ele\nfez lavagem cerebral em mim."
text.027c: "Ele é forte.\nVocê consegue vencê-lo?\nPor que está fazendo isso?"
text.02f4: "Vou lutar pela ilha.\nVamos resolver isso agora."
text.035c: "Não queremos um soberano,\nvocê é nossa única esperança."
