text.0022: "Parece que {color:10}{partner}{color:1}\nse foi..."
text.0064: "Antes de partir, deixou\num Digitama. Vai renascer\ncom suas habilidades."
text.0116: "Qual ovo você quer?"
text.0158: "Você pode mudar o nome de\n{color:10}{partner}{color:1} se quiser."
text.01b0: "Quero um nome novo\nVou manter o nome"
text.0214: "{color:10}{partner}{color:1} está bom?"
text.0234: "Quero outro nome\nEstá bom"
text.02a0: "Ei, não fique doente!"
text.02ce: "Com o pouco de vida que\nrestava, {color:10}{partner}{color:1}\nconseguiu sobreviver."
text.0346: "Tome cuidado."
text.0384: "Minha nossa!\nVocê voltou depois de perder."
text.03d4: "Com o pouco de vida que\nrestava, {color:10}{partner}{color:1}\nconseguiu sobreviver."
text.044c: "Talvez suas coisas tenham\nsido roubadas."
text.048e: "Quem perde uma batalha pode\nter suas coisas roubadas."
text.0502: "Objetos roubados podem ser\nvendidos em algum lugar. Não\ndesista de encontrá-los!"
text.059e: "Ah, não! {color:10}{partner}{color:1}\nperdeu toda a vida."
text.05de: "Antes de partir,\n{color:10}{partner}{color:1}\ndeixou um Digitama."
text.0646: "Por causa do perigo, o\nDigitama não herdou todas\nas habilidades..."
text.06d8: "{color:4}O nível de domador\ncaiu! {color:1}"
text.0726: "Se quiser, você pode\nmudar o nome de\n{color:10}{partner}{color:1}."
text.0780: "Quero um nome novo\nVou manter o nome"
text.0872: "{color:10}{partner}{color:1} digievoluiu!"
text.08be: "{color:10}{partner}{color:1} digievoluiu!"
text.090a: "{color:10}{partner}{color:1} digievoluiu!"
