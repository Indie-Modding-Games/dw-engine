"text.003a": "Uau, que incrível!"
"text.0092": "Ei, tem uma tábua de pedra.\nDeixa eu ver..."
"text.0112": "Diz Leomon.\nNão consigo ler o resto."
"text.016c": "Eu entendo a fala,\nmas não a escrita..."
"text.01cc": "Vamos levar."
"text.0200": "Opa, tenho que jogar\nalguma coisa fora."
"text.0262": "Consegui a {color:6}Pedra\nLeomon{color:1}!"
"text.02ba": "Quem é você?"
"text.02da": "Quem é você!"
"text.0370": "Consegui um {color:4}Chaveiro\nDimensional{color:1}! Agora levo\naté vinte itens!"
"text.0434": "Consegui um {color:4}Chaveiro\nDimensional{color:1}! Agora levo\naté trinta itens!"
