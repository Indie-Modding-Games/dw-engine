text.009c: "Daqui em diante fica a\nZona do Tempo Veloz.\nNão chegue muito perto."
text.012e: "Tenho dois objetivos.\nUm é descobrir o\nperigo da ilha."
text.01b2: "O outro é levar\nDigimon para a cidade."
text.0212: "E aonde quer chegar?"
text.023e: "Me ajude, por favor\nAh, deixa pra lá"
text.0286: "Não posso. Preciso vigiar\nesta floresta."
text.02d4: "Então, sabe algo sobre\no perigo da ilha?"
text.0346: "Não sei de nada. Espere."
text.037c: "Lembro que uma grande pedra\ncaiu do céu\nnão faz muito tempo."
text.03fc: "Onde ela caiu?"
text.0428: "Na Zona do Tempo Veloz, do\noutro lado da floresta."
text.04a2: "Deixe-me ir! Talvez eu\nache alguma pista!"
text.0506: "..."
text.0512: "Se você insiste.\nVá lá dar uma olhada."
text.057e: "Daqui em diante, o tempo\npassa duas vezes mais rápido.\nLeve bastante comida."
text.0610: "Também cuidado para não\nenvelhecer demais."
text.0672: "Você devia dar uma olhada\nem outros lugares."
text.06dc: "Daqui em diante, o tempo\npassa duas vezes mais rápido.\nLeve bastante comida."
text.076e: "Também cuidado para não\nenvelhecer demais."
text.07dc: "Aconteceu alguma coisa?"
text.0810: "Ainda não."
text.0828: "Segundo o meu mestre,\nhá uma passagem secreta."
text.0890: "Mas não sei onde."
text.08da: "O que é isso?"
text.08f8: "Parece um meteorito!\nNada com que se preocupar."
text.096c: "Desculpe, mas isso é\ntudo o que eu sei."
text.09ae: "Obrigado mesmo assim."
text.09da: "Tome isto!"
text.0a82: "Você não serve para nada!"
text.0aac: "Mestre?!"
text.0ac4: "Não acredito que\nvocê ainda está aqui!"
text.0b1c: "Mestre? Quem é ele?"
text.0b4c: "Mas, mestre, quem vai vigiar\na Região Dino Antiga?"
text.0bba: "É um momento crítico\npara a ilha. Vá para a\ncidade ajudar os outros!"
text.0c5c: "Sim, senhor!"
text.0c7c: "Tem certeza de que tudo bem?!"
text.0cba: "Ele ainda é jovem, mas\npor favor, dê trabalho a ele.\nEu vigiarei este lugar."
text.0d54: "Mestre..."
text.0d74: "{color:6}{tamer}{color:1}, é isso.\nEntão posso ir para a cidade?"
text.0de4: "Você tem que se esforçar."
text.0e12: "Pode deixar!\nMestre, até mais!"
text.0e92: "Tyrannomon entrou na cidade!"
text.0ed6: "O que será que ele sabe fazer?"
text.0f1a: "Fazia tempo que eu não\nvigiava este lugar."
text.0f7a: "Pode passar quando quiser."
text.0fc2: "Fazia tempo que eu não\nvigiava este lugar."
text.1022: "Pode passar quando quiser."
