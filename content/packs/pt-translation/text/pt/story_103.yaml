text.0020: "Cansei de treinar aqui.\nO que eu faço?"
text.0082: "O que fazer?"
text.00a0: "Onde você treina?"
text.00da: "Isso é um lugar de treino?"
text.0116: "Cansei de treinar.\nQuero batalhas de verdade."
text.0180: "Talvez um lugar de treino\nTalvez uma Arena"
text.01ee: "Cansei de treinar.\nQuero batalhas de verdade."
text.0258: "Quero ir para lá.\nVou treinar lá."
text.02e2: "Kabuterimon entrou na cidade!"
text.032a: "O Torneio dos Guerreiros\nInseto acontece aqui\ntodo ano..."
text.03ae: "...nos dias com dois dois.\nO campeão ganha coisas boas!"
text.0422: "Mas só Digimon inseto\npodem participar."
text.0480: "Tem o Kabuterimon,\no Kuragamon, o Kunemon\ne mais um inseto."
text.0508: "Mas o Numemon, não."
text.052e: "Nos dias com dois dois, o\nTorneio dos Guerreiros\nInseto acontece todo ano."
text.05ce: "Você já ganhou antes, né?"
text.060a: "Tem o Kabuterimon,\no Kuragamon, o Kunemon\ne mais um inseto."
text.0692: "Esse é o HerculesKabuterimon."
text.06ce: "Hercules-Kabuterimon é\nsuperforte."
text.071e: "O vencedor do torneio pode\nvirar Hercules-Kabuterimon\ne ganhar itens."
text.07a6: "Você pode participar do\nTorneio dos Guerreiros\nInseto várias vezes."
text.0824: "Você é forte.\nNão tenho nada a te ensinar."
text.0886: "Estamos pesquisando técnicas.\nÉ difícil dominar\nas técnicas difíceis."
text.091a: "Se tiver talento, talvez\ndomine as técnicas.\nQuer dominar as difíceis?"
text.09c8: "Claro!\nNão, obrigado"
text.0a06: "Então vou tentar."
text.0a3e: "Falta Defesa.\nTreine mais."
text.0aa0: "Falta Velocidade.\nTreine mais."
text.0aee: "Falta HP.\nTreine mais."
text.0b2a: "Você dominou uma técnica."
text.0b64: "Você dominou 'Inseto'!"
text.0bb4: "{color:5}Treino: Empurrar rocha {color:1}"
text.0bec: "Começar\nExplicar\nSair"
text.0c22: "Normal\nTentativa bônus\nSair"
text.0c5e: "Ganhe força empurrando\na rocha. Aumenta muito\no HP máximo."
text.0ce4: "Explicar de novo\nComeçar\nSair"
text.0d3e: "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}para\nalinhar três figuras."
text.0dc0: "{color:5}Treino: Golpes {color:1}"
text.0df0: "Começar\nExplicar\nSair"
text.0e28: "Normal\nTentativa bônus\nSair"
text.0e66: "Bata num boneco com toda\na força. Aumenta muito\no Ataque."
text.0efc: "Explicar de novo\nComeçar\nSair"
text.0f56: "{color:7}Caça-níqueis {color:1}\nUse {color:6}△ {color:1}para\nalinhar três figuras."
