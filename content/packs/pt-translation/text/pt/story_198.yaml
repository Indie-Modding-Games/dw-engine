text.0064: "Este é o último."
text.00a2: "Enfim chegamos!"
text.00e0: "O caminho está livre!"
text.0118: "Vamos facilitar."
text.0154: "É a última chance!"
text.019a: "Vai mesmo?"
text.01f0: "Que medo! Sinto isso\naté nos ossos."
text.023a: "..."
text.0248: "Por que ele não me ataca?"
text.0282: "..."
text.0290: "Você não precisa lutar?"
text.02c8: "Vamos depressa.\nTemos que testar\nnossas habilidades."
text.0348: "Vamos, {color:10}{partner}{color:1}!"
text.039c: "..."
text.03de: "Ganhamos?"
