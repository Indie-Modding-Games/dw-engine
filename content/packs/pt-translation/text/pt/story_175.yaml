text.0050: "Bem-vindo ao meu restaurante."
text.0088: "Decidi ser\no gerente e chef\ndeste restaurante."
text.0104: "Aproveite minha cozinha\nardente à vontade."
text.0180: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nnão querem provar\nminha comida caseira?"
text.01d6: "Diferente dos itens, isto\né comida de verdade. É o\nmeu talento secreto."
text.027c: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nDecidi viver de\ncozinhar. Sou bom nisso!"
text.02f6: "Relaxe e venha\ncomer no meu restaurante\num dia."
text.037e: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}.\nMeu restaurante\nenfim abriu!"
text.03d4: "Prove a sobremesa gelada!\nÉ a minha especialidade."
text.044a: "{color:6}{tamer}{color:1}, decidi\ntrabalhar como chef\nneste restaurante."
text.04c2: "Aqui você pode aproveitar\numa comida quente."
text.0520: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nagora sou cozinheiro\nprofissional!"
text.0572: "Se quiser provar minha\ncomida, é melhor vir\nde manhã!"
text.0614: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nDecidi viver de\ncozinhar. Sou bom nisso!"
text.068e: "Você pode comer minha\ncomida especial bem cedo\ne no meio da noite."
text.0750: "Oi, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
text.0770: "Decidi ajudar\neste restaurante.\nMe deixam fazer sobremesas."
text.07ee: "Tenho muito orgulho\nda minha sobremesa.\nNão deixe de provar, tá?"
text.08a8: "Uau! Ei, {color:6}{tamer}{color:1}!\nPara que serve esta máquina?"
text.08fa: "Não se assuste! É uma\njukebox que faz meu\ncoração disparar! Isso aí!"
text.098a: "Vamos dançar!\nSolte-se! Estou\nesperando seu pedido!"
