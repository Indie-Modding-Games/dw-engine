text.0060: "Eu vou ganhar!"
text.0098: "Certo, vem, garoto!"
text.00d4: "O que vai acontecer agora?"
text.0122: "Não tem como dar certo."
text.0168: "Estou com fome."
text.0186: "Dar comida\nNão dar comida"
text.01de: "Não tenho comida agora."
text.0266: "Opa, não posso te dar isto."
text.02b8: "Que bom..."
text.02de: "Vamos lutar!"
text.032e: "Isto não está bom.\nO que eu faço?"
text.0380: "Venha para a cidade e pague\no que comeu trabalhando!"
text.03e6: "Tá bom, eu vou. Sou um\nDigimon Inseto chamado\nKunemon. Prazer!"
text.04c0: "Kunemon entrou na cidade!"
text.0508: "Traga um pouco da próxima vez."
