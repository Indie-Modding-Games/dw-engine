"text.006a": "No último terremoto, a terra\ne a areia sumiram!"
"text.00ee": "A hora atual é:\nmês {num:pstat=105}, dia {num:pstat=106},\n{num:pstat=107} horas, {num:pstat=108} minutos."
"text.016e": "{color:10}{partner}{color:1} é um Digimon\ndo tipo Dados, né?"
"text.01c6": "{color:10}{partner}{color:1} é um Digimon\ndo tipo Vacina, né?"
"text.0224": "{color:10}{partner}{color:1} é um Digimon\ndo tipo Vírus, né?"
"text.027c": "Sirvo para muitas coisas.\nO que quer que eu faça?"
"text.02f2": "Mudar os parâmetros dele\nAcelerar o tempo\nTransformar isto em loja"
"text.038c": "Deixá-lo fortíssimo\nDeixá-lo fraquíssimo\nDeixá-lo mediano"
"text.0416": "Passar uma hora\nPassar seis horas\nPassar vinte e quatro horas"
