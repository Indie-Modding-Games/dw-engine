text.0072: "Você chegou, {color:6}{tamer}{color:1}!"
text.009a: "Somos caçadores de tesouro.\nAchamos tesouros enterrados\ncom nossa habilidade de cavar."
text.013e: "Pode confiar em mim\npara achar tesouros."
text.0196: "Quer que eu procure\nalguma coisa? Quer que eu\nexplique como fazemos?"
text.0230: "Explicar\nNão explicar\nDeixa pra lá"
text.0286: "Temos dois planos com\ndias e preços diferentes."
text.02ee: "Normal: 3 dias, mil Bits\nEspecial: 10 dias, 5 mil Bits"
text.036a: "Com o plano Especial,\na chance de achar um tesouro\nmelhor é maior."
text.03f6: "É isso.\nO que você quer fazer?"
text.044e: "Achar tesouro\nExplicar de novo\nDeixa pra lá"
text.04b0: "Escolha um plano!"
text.04d4: "Normal: 3 dias, mil Bits\nEspecial: 10 dias, 5 mil Bits\nCancelar"
text.056e: "Certo, então tchau."
text.05c4: "Você terá o resultado em\ntrês dias. Me deseje sorte."
text.066a: "Você terá o resultado em\ndez dias. Me deseje sorte."
text.06ea: "Você não tem Bits suficientes.\nPreciso de dinheiro para\nprocurar tesouros."
text.07a4: "Estou procurando o tesouro\nagora. Tenha paciência."
text.082a: "Sabe de uma coisa?\nAchamos um tesouro."
text.0b00: "Esvazie suas coisas!"
text.0b32: "Ganhei {color:6}{item:pstat=110}{color:1}!"
text.0dae: "Obrigado pela visita!"
text.0de8: "Obrigado pela preferência,\n{color:6}{tamer}{color:1}!"
text.0e2a: "Comecei há pouco a ajudar\no Drimogemon. Sou muito bom\nem procurar coisas."
