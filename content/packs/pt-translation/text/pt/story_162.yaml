text.00f8: "Voltei!"
text.0122: "Obrigado pelo convite.\nEspero que a gente trabalhe\njunto, {color:10}{partner}{color:1}."
text.01c6: "{color:7}O nível de domador\nsubiu! {color:1}"
text.020c: "{color:7}Parabéns!\nAqui está uma\nmedalha para você. {color:1}"
text.026c: "Ganhei uma carta de\nMachinedramon!"
text.0782: "Você já viu o\nGuardião do Lago?"
text.07c8: "Se não, devia esperar\nno lado sul."
text.083e: "Acorde bem cedinho e\nande pela névoa.\nVai acontecer algo bom!"
text.08de: "Sabia que no norte tem\num lugar chamado\nPraia do Iceberg?"
text.0962: "Dizem que um Digimon\nenorme costuma aparecer\nnessa praia."
text.09f4: "Já venceram os bandidos?\nOuvi dizer que tem uma\ngangue de bandidos."
text.0a8c: "Já foi ao Grande Cânion?"
text.0ac6: "Dizem que os bandidos\nestão lá."
text.0b1e: "Eles são do mal?"
text.0b4a: "Eles te atacam e te roubam."
text.0b86: "Vamos dar um jeito nisso."
text.0bd8: "Já foi ao Grande Cânion?"
text.0c12: "Dizem que lá existe uma\nPonte Invisível."
text.0c96: "Ouvi dizer que o\nMachinedramon voltou."
text.0cea: "Você venceu o\nMachinedramon de novo."
text.0d2e: "Vou te explicar os\narredores da cidade."
text.0d88: "A Floresta Nativa\ncerca a cidade."
text.0dd0: "Os Digimon de lá\nnão são muito fortes."
text.0e2c: "A oeste tem um\nCampo de Treino."
text.0e7a: "A Selva Tropical fica a\nleste, do outro lado do rio."
text.0ed2: "Não sei o que tem\ndepois de lá."
text.0f18: "A oeste tem uma\nmontanha e um lago."
text.0f70: "Indo para o sul, tem o mar."
text.0fb4: "Ao norte tem uma\nmontanha bem alta."
text.1006: "Esta cidade é o\ncentro da ilha."
text.1058: "Vou investigar os boatos.\nVolte para saber mais."
text.10c8: "Vamos ver o que tem por aqui."
text.1108: "Não gosto do banheiro, mas\no resto parece tudo bem!"
text.117e: "Parece bem animado."
text.11b2: "Eu não tenho que voltar\npara a Cidade Fatorial?"
text.120c: "Minha função de agenda\nestá funcionando. Tudo certo."
text.1282: "Você chegou na hora certa!"
text.12be: "Olhe esta escultura!\nO que você acha?"
text.1318: "Que obra-prima.\nEu me impressiono."
text.1364: "Como assim?\nVocê está zombando de mim!"
text.13be: "Do que estávamos falando?\nBom, tanto faz."
text.141e: "Que imagem eu tinha?\nQuando descobrir,\nme avise."
text.14e2: "dormindo..."
text.1516: "Ficou sabendo? Tem uma\nplanta estranha crescendo\nna Selva Tropical."
text.15b2: "Ah, é,"
text.15c8: "Plantei uma {color:6}Planta chuva\n{color:1}bem ali."
text.1618: "Ela dá frutos todo ano\nlá pelo dia quinze.\nPode pegá-los."
text.16a4: "Para quê?"
text.16cc: "Ah, que gostoso!\nRaios de sol."
text.170e: "Ah, que gostoso!\nRaios de sol."
text.1766: "Isso, que ótimo!"
text.17be: "Ah, isto é um..."
text.17f6: "Itens demais."
text.1822: "Ganhei um {color:6}Fruto de\nPlanta chuva{color:1}!"
text.1902: "Vou te levar ao mar.\nEsse é o meu trabalho."
text.195c: "Vou te levar a um lugar\naonde só se chega por mar."
text.19c8: "Bom, então..."
text.19ea: "Hmmm, aonde vamos?\nCidade Fatorial ou\ntalvez a Caverna da Praia."
text.1a6c: "Cidade Fatorial\nCaverna da Praia Secreta\nLugar nenhum"
text.1b5a: "Achei você!"
text.1b88: "Ah, não, ele está vindo\nbem na nossa direção!"
text.1be2: "Finalmente te encontrei!\nEu sou Greymon.\nVamos acertar as contas!"
text.1c62: "O quê?!"
text.1c76: "Cheguei aqui seguindo\nos boatos sobre você.\nQuero lutar com você!"
text.1d00: "Se eu ganhar,\nquero esta placa da rua!"
text.1d54: "Não tem placa nenhuma."
text.1d7c: "Não ligo,\nvamos lutar mesmo assim!"
text.1e08: "Ei, vocês são bons!\nMas para cumprir a meta,\nainda são amadores."
text.1ea6: "Hmmm"
text.1eb6: "Vou ficar e treinar vocês.\nVão melhorar muito!"
text.1f56: "Greymon entrou na cidade!"
text.200c: "Isso, achei você, {color:6}{tamer}{color:1}!"
text.2048: "Emboscada!"
text.205e: "Minha meta é te vencer."
text.2094: "Esses olhos! Ele deve ter\nsofrido lavagem cerebral!"
text.2126: "Não importa o que eu faça,\npreciso vencê-lo."
text.218c: "Do que você está falando?\nVocê precisa de tratamento."
