text.0056: "Enfim chegamos."
text.008c: "Você é o chefe?"
text.00ba: "Sinto muito, não sou.\nSou o MetalGreymon!"
text.0114: "Cuido de você depois!\nSai da frente!"
text.015e: "Não vou sair da frente.\nVocê não vai passar."
text.01c4: "Quero poupar energia.\nLutar com ele não me ajuda."
text.0230: "Lá vou eu!"
text.0294: "Hã? Onde estou?"
text.02bc: "Você voltou a si!"
text.02f6: "Acho que sim..."
text.0316: "Se vencer eles, talvez\na gente se veja de novo.\nAté lá, estou indo."
