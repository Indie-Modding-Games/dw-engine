text.00c2: "Minha asa dói."
text.00ee: "O que aconteceu?"
text.0112: "Machuquei a asa... Você tem\nalgo para tratar?"
text.018e: "Nossa, parece bem feio!\nEspere. Deixe-me ver."
text.0208: "Não tenho nada\nagora."
text.0294: "Assim não dá."
text.02bc: "Está bem melhor. Obrigado."
text.030a: "Consegue voar agora?"
text.0332: "Acho que não consigo\nvoar longe."
text.037a: "Tem uma clínica na cidade.\nVocê devia ir lá.\nNão é longe."
text.0402: "Ouvi falar da cidade.\nÉ maior do que eu pensava."
text.0470: "Vá para a cidade descansar."
text.04a8: "Obrigado. Talvez um dia\neu possa te ajudar."
text.053c: "Unimon entrou na cidade!"
text.057c: "Não tenho nada para\ntratar a sua ferida.\nVou buscar alguma coisa."
text.0608: "Desculpe, mas se apresse."
text.068c: "Há uns desenhos estranhos\nno chão."
text.06f0: "Será um daqueles\nCírculos Misteriosos?\nAinda parece novo."
text.0774: "Agora vejo mais deles!\nSerá que isso tem a ver\ncom o OVNI...?"
text.080a: "Uau!? Tem mais deles\ndo que antes!"
text.0862: "O que isso quer dizer?"
text.0896: "O quê?"
text.08f8: "Aparece o OVNI do Vademon."
text.092c: "U... um alienígena?!"
text.0950: "..."
text.095e: "Você é... um Digimon?"
text.0990: "..."
text.099e: "Bom..."
text.09b4: "..."
text.09ca: "Vademon saca uma arma."
text.09fa: "Não, pare!\nNão sou seu inimigo!"
text.0a3c: "Vademon larga a arma."
text.0a70: "Que bom que entendeu."
text.0aa0: "{color:6}{tamer}{color:1} tenta\nconvencê-lo desesperadamente."
text.0af4: "..."
text.0b02: "Será que ele não entendeu?"
text.0b3a: "Certo."
text.0b8a: "Vademon entrou na cidade!"
text.0bc0: "Ele..."
text.0bd0: "Ele sabe falar!"
