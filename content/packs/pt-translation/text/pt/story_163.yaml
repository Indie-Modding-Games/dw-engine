text.034c: "Bakke. Bah Kkea."
text.0374: "Continuo sem entender ele."
text.03dc: "Entendi. Você está\npatrulhando por nós?!"
text.0438: "Olhe! É o meu quadro\nde avisos especial."
text.048a: "A cidade precisa de notícias,\nentão decidi fazer um\njornal! O que você acha?"
text.053e: "Pode contar comigo para\njuntar informações."
text.059e: "Você está lendo meu jornal."
text.05f0: "Ah, que fresquinho, que bom."
text.0630: "Quando está confortável,\né uma delícia."
text.069e: "O que acha da minha loja?"
text.06de: "Não sou bom de vendas, mas\nagora não tem mais ninguém\npara fazer isso."
text.0766: "Traga muitos Digimon, tá?"
text.07c0: "Bom, o que você acha?"
text.07f8: "{color:7}Coelamon {color:1}\nDecidimos nos ajudar\ne vender todos estes itens."
text.0912: "Hmmm. Vi umas plantas\ngostosas e resolvi comer."
text.0986: "Acho que a cidade ficou\nventilada demais."
text.09ee: "Ah, outro dia achei por\nacaso um {color:6}Cogum. feliz{color:1}."
text.0a6c: "Dizem que é bem raro."
text.0aa4: "Também ouvi falar de um\n{color:6}Cogum. luxo{color:1}.\nSeria bom achar um."
text.0b3e: "A {color:6}Maçã azul {color:1}\nda Floresta Nativa\né muito gostosa."
text.0bb0: "A {color:6}Banana laranja {color:1}\nda Selva Tropical\né muito gostosa."
text.0c2c: "A {color:6}Baga grande {color:1}\ndo Monte Panorama\né muito gostosa."
text.0c98: "A {color:6}Noz doce {color:1}\nda Savana Engrenagem\né muito gostosa."
text.0d02: "O {color:6}Super legume {color:1}\ndo Cemitério Overdell\né gostoso."
text.0d70: "A {color:6}Baga rubra {color:1}\nda Tumba Dino Antiga\né gostosa."
text.0dda: "O {color:6}Figo-da-índia {color:1}\ndo Grande Cânion\né gostoso."
text.0e4e: "O {color:6}Digiabacaxi {color:1}\ndas Árvores Nebulosas\né gostoso."
text.0ff6: "Tenho algo a dizer."
text.102c: "O que foi?\nAté mais!"
text.106c: "Viu que consertamos\na Ponte Leste?\nTrabalhamos muito."
text.10f6: "Estamos consertando a Ponte\nDigimon. Espere um pouco."
text.1166: "Dizem que tem um Digimon raro\nna Ponta Coela, no sul."
text.11e0: "Dizem que ele aparece\ntodo dia no fim da tarde."
text.125c: "Diga, sabia que tem\numa ponte quebrada\nno leste da cidade?"
text.12f0: "Achamos que ninguém\nia usá-la, então não\nfizemos nada."
text.138e: "Estamos pensando em\nconsertá-la por conta própria."
text.13e8: "Até lá, vá ver as áreas\noeste e sul.\nDepois volte para me ver."
text.1496: "Foi ao Pântano Geko?\nUm Digimon arteiro\npode te enganar."
text.151c: "Lembre: quando um Digimon\ndigievolui, as técnicas\nque ele usa mudam."
text.15ae: "Bom..."
text.15d6: "O que acha? Acendi a luz.\nEstá claro o bastante?"
text.164e: "Vamos deixar a cidade\nlimpa e alegre!"
text.16a6: "A luz faz\nalguma diferença?"
text.16f0: "Bom, tudo depende\nde como você vê."
text.1746: "Eu sou o mais poderoso."
text.1780: "Não me acho inferior\na você. Se vier à\nArena, vai ver."
text.1824: "Oi, {color:6}{tamer}{color:1}.\nEstou patrulhando a cidade\natrás de tipos suspeitos."
text.18a2: "O que foi? Não estou\nte incomodando, né?!"
text.192a: "Bem-vindo à minha loja!\nVou te fazer um ótimo preço,\n{color:6}{tamer}{color:1}."
text.1998: "Não sou bom de vendas,\nmas ninguém mais é."
text.1a02: "Agora eu cuido das vendas.\nEspero que façamos negócio."
text.1a74: "{color:6}{tamer}{color:1}, por favor, traga\no máximo de Digimon\nque conseguir."
text.1b10: "O que acha\nda minha loja?"
text.1b50: "Não sou bom de vendas,\nmas ninguém mais é,\nentão tenho que fazer."
text.1bcc: "Traga logo muitos\nDigimon."
text.1c32: "Bom, o que você acha?"
text.1c6a: "{color:7}Coelamon {color:1}\nDecidimos nos ajudar\ne vender estes itens."
