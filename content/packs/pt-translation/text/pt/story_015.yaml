text.006c: "Você é um Digimon?"
text.00a6: "De onde você é, mano?!"
text.00e8: "Não tire sarro de mim!"
text.0128: "Vou te devorar!"
text.01a4: "Ah, não, se eu não fizer\nnada, vai secar..."
text.020a: "Tomara que chova..."
text.023e: "Uau, interessante.\nEstá brotando."
text.0294: "Mexeu um pouquinho.\nSerá a planta misteriosa\nde que todos falam?"
text.0340: "Está murchando. Se eu não\nfizer nada, vai morrer."
text.03ac: "Vai usar algum item?"
text.03de: "Sim\nNão"
text.0410: "Não tenho nada agora."
text.045c: "Nada do que tenho serve."
text.04ae: "Assim não vai dar..."
text.0800: "He he he."
text.0818: "Ei, eu sou o Vegiemon!"
text.084c: "O quê! Um Digimon planta?"
text.0880: "Aliás, você gosta de\nverduras?"
text.08d4: "Por que está me perguntando\nde verduras? E aí?"
text.0932: "Gosto\nNão gosto"
text.0966: "Bom, mudei de ideia."
text.09a8: "Quem gosta de verduras\nsó pode ser gente boa."
text.0a14: "Não, não!\nVerduras são ótimas!"
text.0a52: " ? ? ? "
text.0a68: "Certo, decidi.\nVou com vocês!"
text.0acc: "Que cara insistente...\nEi, espere!"
text.0b1e: "Bom, então não vou!\nTchau!"
text.0b60: "Decida-se!"
text.0b8c: "O que você quer que eu faça?"
text.0bd0: "Por que não vem para\na cidade nos ajudar?"
text.0c36: "Certo, parece bom.\nJá estou aqui há tempo demais."
text.0cea: "Vegiemon entrou na cidade!"
