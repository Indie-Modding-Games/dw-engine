text.0066: "Vou te nocautear!"
text.00ce: "Vamos de novo."
text.00fa: "Sim\nNão"
text.0148: "Só mais um pouco...\nVamos, mais uma vez!"
text.01ae: "Sim\nNão"
text.020c: "Não consigo ganhar!"
text.0230: "Por que você quer ganhar?"
text.026e: "O que eu devo fazer?"
text.0298: "Como assim?\nVocê não tem nada para fazer?"
text.02f4: "Tenho tempo de sobra."
text.032c: "Se tem tempo de sobra,\nvenha para a cidade. Lá tem\nDigimon de todo tipo."
text.03d6: "Parece bom. Eu vou.\nMeu nome é Patamon.\nAté mais."
text.0482: "Patamon entrou na cidade!"
text.04c8: "Isso não tem graça!"
text.04f6: "Você vem?"
text.052a: "Você não tem cheiro!"
text.0560: "Parece gostoso.\nVou te devorar!"
text.05b6: "Ha ha, você é engraçado!"
