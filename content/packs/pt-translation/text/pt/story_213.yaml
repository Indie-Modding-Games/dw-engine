text.0040: "Ah, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nvocês vieram. Vejam esta\nArena da Cidade File. Legal!"
text.00d0: "Logo os lutadores e fãs vão\nlotar tudo. Você também vai\nalegrar os fãs, né?!"
text.0188: "Vão ter dinheiro e prêmios\npara os campeões dos torneios.\nVocê não tem nada a perder."
text.0230: "Os detalhes dos torneios\nestão naquela máquina ali."
text.02d0: "Ah, Digimon Treinamento\nnão podem participar.\nQuer que eu veja o calendário?"
text.038c: "Ah, Digimon Treinamento\nnão podem participar.\nQuer que eu veja o calendário?"
text.043c: "Que bom que veio. Quer\nse inscrever no torneio?"
text.04b6: "Sim\nNão\nComo assim?"
text.0520: "Então você vai\nparticipar do torneio\nde amanhã, né?"
text.058a: "Vai cancelar sua\ninscrição?"
text.05d8: "Não vou cancelar\nSim, quero cancelar"
text.0652: "Então você está inscrito no\ntorneio de hoje, né?\nPode entrar a partir das 10h."
text.06e8: "Não está pensando em cancelar,\nestá?!"
text.0740: "Não vou cancelar\nSim, quero cancelar"
text.07aa: "Então você está inscrito no\ntorneio de hoje, né?\nEntre até as 23h."
text.0832: "Não está pensando em\ncancelar, está?!"
text.088a: "Não vou cancelar\nSim, quero cancelar"
text.08f6: "Bom, vou cancelar pra você."
text.0934: "Lá dentro, na hora marcada,\ndesça a escada da esquerda\npara competir na batalha."
text.09de: "A inscrição é grátis. Só dá\npra se inscrever nos torneios\nde hoje e de amanhã."
text.0a8c: "Mas, para o torneio do\npróprio dia, você precisa\nse inscrever até as 10h."
text.0b1a: "Dá pra ver o calendário com\ncinco dias de antecedência,\nentão confira e se planeje."
text.0bb8: "Os torneios em vermelho são\nos que você não pode entrar."
text.0c32: "Mas aperte Start para\nver do que se trata."
text.0ca0: "Mesmo nos torneios com\nRequisitos: nenhum,"
text.0d06: "Digimon Treinamento\nnão podem competir."
text.0d52: "Bom, é isso sobre a\ninscrição. Quer se\ninscrever?"
text.0dd4: "Sim\nNão\nFoi mal, explique de novo"
text.0e3c: "Ei! Você não está\ninscrito, sabia?"
text.0eba: "Ei! O torneio é\namanhã, sabia?"
text.0f42: "Ainda é cedo para entrar.\nEspere até as dez horas."
text.0ff4: " \n{color:4}O nível de domador caiu!{color:1}"
