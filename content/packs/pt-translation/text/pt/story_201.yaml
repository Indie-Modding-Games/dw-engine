text.0056: "Ei, quero {color:6}Carne {color:1}."
text.0090: "Bem-vindo, precisa de\n{color:6}Carne{color:1}? Bom, é..."
text.0104: "Subir preço\nManter em cinquenta Bits\nBaixar preço"
text.0176: "É, você quer {color:6}Carne{color:1}\nbaratinha? É..."
text.01e8: "Que tal a {color:6}Carne{color:1} de cinquenta\npor setenta e cinco Bits?"
text.0256: "Subir pra setenta e cinco\nVou pensar melhor"
text.02de: "E a {color:6}Carne{color:1} de cinquenta\npor setenta Bits?"
text.033a: "Subir pra setenta\nVou pensar melhor"
text.03c2: "Que tal a {color:6}Carne{color:1} de cinquenta\npor sessenta e cinco Bits?"
text.042c: "Subir pra sessenta e cinco\nVou pensar melhor"
text.04b0: "E a {color:6}Carne{color:1} de cinquenta\npor sessenta Bits?"
text.0508: "Subir pra sessenta\nVou pensar melhor"
text.058c: "Que tal a {color:6}Carne{color:1} de cinquenta\npor cinquenta e cinco Bits?"
text.05f6: "Subir pra cinquenta e cinco\nVou pensar melhor"
text.066e: "E a {color:6}Carne{color:1} de cinquenta\npelo preço normal?"
text.06ca: "Vender a preço normal\nVou pensar melhor"
text.074c: "Que tal a {color:6}Carne{color:1} de cinquenta\npor quarenta e cinco Bits?"
text.07b6: "Baixar pra quarenta e cinco\nVou pensar melhor"
text.083a: "E a {color:6}Carne{color:1} de cinquenta\npor quarenta Bits?"
text.0892: "Baixar pra quarenta\nVou pensar melhor"
text.0916: "Que tal a {color:6}Carne{color:1} de cinquenta\npor trinta e cinco Bits?"
text.0982: "Baixar pra trinta e cinco\nVou pensar melhor"
text.0aca: "Beleza, vou levar!"
text.0b18: "Lucro total: {shopvar}\nLucro:\nquarenta"
text.0b6e: "Lucro total: {shopvar}\nLucro:\ntrinta e cinco"
text.0bd0: "Lucro total: {shopvar}\nLucro:\ntrinta"
text.0c28: "Lucro total: {shopvar}\nLucro:\nvinte e cinco"
text.0c8a: "Lucro total: {shopvar}\nLucro:\nvinte"
text.0ce2: "Lucro total: {shopvar}\nLucro:\nquinze"
text.0d3c: "Lucro total: {shopvar}\nLucro:\ndez"
text.0d8e: "Lucro total: {shopvar}\nLucro:\ncinco"
text.0dd8: "Lucro total: {shopvar}\nLucro:\nzero"
text.0e9a: "Estou perdendo meu tempo!!"
text.0f06: "Puxa, cadê os clientes?"
text.0f56: "Acho que você cobra demais!"
text.0f96: "Pode ser. Bom, então..."
text.0fce: "Eu daria tudo por um\n{color:6}Penico portátil{color:1}."
text.102a: "É... Bem-vindo, quer um\n{color:6}Penico portátil{color:1} barato?"
text.10a0: "Subir preço\nManter em trezentos Bits\nBaixar preço"
text.111c: "É... deixa eu ver, quer um\n{color:6}Penico portátil{color:1}?"
text.119c: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nquatrocentos e cinquenta Bits?"
text.1238: "Pedir quatrocentos e cinquenta\nVou pensar melhor"
text.12c6: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nquatrocentos e vinte Bits?"
text.136c: "Subir pra quatrocentos e vinte\nVou pensar melhor"
text.13f6: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e noventa Bits?"
text.1496: "Subir pra trezentos e noventa\nVou pensar melhor"
text.1522: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e sessenta Bits?"
text.15c8: "Subir pra trezentos e sessenta\nVou pensar melhor"
text.1652: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\ntrezentos e trinta Bits?"
text.16f2: "Subir pra trezentos e trinta\nVou pensar melhor"
text.1772: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits\npelo preço normal?"
text.1818: "Vender a preço normal\nVou pensar melhor"
text.189a: "E o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e setenta Bits?"
text.1938: "Baixar pra duzentos e setenta\nVou pensar melhor"
text.19c6: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e quarenta Bits?"
text.1a68: "Baixar pra duzentos e quarenta\nVou pensar melhor"
text.1af4: "Que tal o {color:6}Penico portátil{color:1}\nde trezentos Bits por\nduzentos e quarenta Bits?"
text.1b96: "Baixar pra duzentos e dez\nVou pensar melhor"
text.1ce0: "Certo, vou levar!"
text.1d34: "Lucro total: {shopvar}\nLucro:\nduzentos e quarenta"
text.1da2: "Lucro total: {shopvar}\nLucro:\nduzentos e dez"
text.1e0c: "Lucro total: {shopvar}\nLucro:\ncento e oitenta"
text.1e7c: "Lucro total: {shopvar}\nLucro:\ncento e cinquenta"
text.1eea: "Lucro total: {shopvar}\nLucro:\ncento e vinte"
text.1f5a: "Lucro total: {shopvar}\nLucro:\nnoventa"
text.1fb2: "Lucro total: {shopvar}\nLucro:\nsessenta"
text.2008: "Lucro total: {shopvar}\nLucro:\ntrinta"
text.2056: "Lucro total: {shopvar}\nLucro:\nzero"
text.20ec: "Qual é, faz um desconto!"
text.2126: "Hã? Bom, então..."
text.2154: "Ei, preciso de um\n{color:6}Remédio{color:1}."
text.2194: "É... Bem-vindo, quer um\n{color:6}Remédio{color:1}?"
text.21fa: "Subir preço\nManter em mil Bits\nBaixar preço"
text.2274: "É, você queria um {color:6}Remédio {color:1}\nbaratinho, né?"
text.22f4: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e quinhentos Bits?"
text.2380: "Subir pra mil e quinhentos\nVou pensar melhor"
text.240a: "E o {color:6}Remédio{color:1}\nde mil Bits por\nmil e quatrocentos Bits?"
text.2490: "Subir pra mil e quatrocentos\nVou pensar melhor"
text.251c: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e trezentos Bits?"
text.25aa: "Subir pra mil e trezentos\nVou pensar melhor"
text.2636: "E o {color:6}Remédio{color:1}\nde mil Bits por\nmil e duzentos Bits?"
text.26b8: "Subir pra mil e duzentos\nVou pensar melhor"
text.2740: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nmil e cem Bits?"
text.27ca: "Subir pra mil e cem\nVou pensar melhor"
text.2846: "E o {color:6}Remédio{color:1}\nde mil Bits pelo\npreço normal de mil?"
text.28d0: "Vender a preço normal\nVou pensar melhor"
text.2952: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nnovecentos Bits?"
text.29d8: "Baixar pra novecentos\nVou pensar melhor"
text.2a62: "E o {color:6}Remédio{color:1}\nde mil Bits por\noitocentos Bits?"
text.2ae2: "Baixar pra oitocentos\nVou pensar melhor"
text.2b6e: "Que tal o {color:6}Remédio{color:1}\nde mil Bits por\nsetecentos Bits?"
text.2bf6: "Baixar pra setecentos\nVou pensar melhor"
text.2d44: "Beleza, vendido!"
text.2d96: "Lucro total: {shopvar}\nLucro:\noitocentos"
text.2dfc: "Lucro total: {shopvar}\nLucro:\nsetecentos"
text.2e62: "Lucro total: {shopvar}\nLucro:\nseiscentos"
text.2ec4: "Lucro total: {shopvar}\nLucro:\nquinhentos"
text.2f28: "Lucro total: {shopvar}\nLucro:\nquatrocentos"
text.2f8c: "Lucro total: {shopvar}\nLucro:\ntrezentos"
text.2ff2: "Lucro total: {shopvar}\nLucro:\nduzentos"
text.3054: "Lucro total: {shopvar}\nLucro:\ncem"
text.30ac: "Lucro total: {shopvar}\nLucro:\nzero"
text.3142: "Isso é um assalto!"
text.3178: "Tá. Bom, então..."
