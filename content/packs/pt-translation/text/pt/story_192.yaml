text.0032: "Chegou a hora."
text.005e: "Queria poder ficar,\nmas minha mãe se preocupa."
text.00b6: "Obrigado, {color:6}{tamer}{color:1}.\nQueria poder te retribuir."
text.010e: "{color:7}Tokomon {color:1}\nNão se esqueça da gente!"
text.014c: "A gente vai se ver de novo.\nEu sei disso."
text.01c0: "Eu me diverti muito. Valeu."
text.01fa: "Devíamos fazer uma\ncerimônia de despedida."
text.0258: "{color:10}{partner}{color:1}, nossa\naventura foi incrível!"
