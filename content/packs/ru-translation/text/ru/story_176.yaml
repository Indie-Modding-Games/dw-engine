text.03b8: "Добро пожаловать в магазин!"
text.03e4: "Смотри, {color:6}{tamer}{color:1}. Это\nмой магазин. Буду продавать\nвсякие предметы."
text.046c: "Скоро товаров будет больше.\nНо мне нужны Дигимоны,\nчтобы помогать тут."
text.052c: "Я буду покупать и продавать\nпредметы. Заходи, когда\nпонадобится."
text.05c6: "Выбор пока небольшой, но\nесли найду помощника,\nдела пойдут лучше."
text.069c: "Я решил открыть\nмагазин предметов.\nНадеюсь, будешь заходить."
text.0726: "Товаров пока немного,\nно скоро мы расширимся.\nПока потерпи немного."
text.080a: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nя открыл магазин предметов.\nДумаю, дела пойдут!"
text.087c: "Чем больше Дигимонов в\nгороде, тем больше товаров."
text.0920: "{color:6}{tamer}{color:1}, я только начал\nпомогать в этом магазине.\nПокупай побольше!"
text.09ea: "Добро пожаловать! Отныне\nя работаю здесь.\nЗаходи почаще."
text.0ab4: "Я решил помогать\nв этом магазине.\nЗаходи в любое время."
text.0b68: "О, {color:6}{tamer}{color:1}. Это\nидеальное место для меня.\nБуду стараться."
text.0e56: "Привет, я всё время занят\nв магазине... Шучу!"
text.0ec2: "Я лентяй и в магазине\nбываю редко.\nНо у меня есть классные вещи."
text.0f5e: "Да! «Учебник»!\nС ним тренировки\nпойдут лучше!"
text.0fe6: "Это очень ценная вещь.\nОтдам за 50000 Bits.\nНе купишь — пожалеешь."
text.1094: "Купить\nНе покупать"
text.10d6: "У тебя не хватает Bits."
text.1126: "Хм, у тебя с собой\nмного вещей."
text.1186: "Я получил\n{color:6}Учебник{color:1}!"
text.11c2: "Скидки не будет."
text.123a: "У тебя проблемы из-за\nтого, что слишком\nмного вещей?"
text.12b2: "Есть место, где можно найти\nбрелок, связывающий сумку\nс другим измерением."
text.135a: "С ним можно носить\nбольше предметов."
text.13be: "Даже если ты где-то уже был,\nпоищи там снова."
text.1432: "Расскажу секрет\nпокупки предметов."
text.1488: "Нажми кнопку Start\nна предмете, о котором\nхочешь узнать!"
text.1514: "Выбери предмет кнопкой {color:6}△{color:1},\nа чтобы купить много,\nнажми {color:4}□{color:1}."
text.159e: "Чтобы менять число на 10,\nжми вверх или вниз на\nкрестовине, держа {color:10}○{color:1}."
text.1636: "О, сразу после дигиэволюции\nпопробуй что-нибудь купить.\nДолжно случиться хорошее!"
