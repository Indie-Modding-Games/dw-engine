text.0056: "Наконец-то мы на месте."
text.008c: "Ты главарь?"
text.00ba: "Извини, нет.\nЯ MetalGreymon!"
text.0114: "С тобой разберусь позже!\nПрочь с дороги!"
text.015e: "Я не уйду с дороги.\nТебе не пройти."
text.01c4: "Я хочу беречь силы.\nДраться с ним бесполезно."
text.0230: "Я иду за тобой!"
text.0294: "А? Где я?"
text.02bc: "Ты пришёл в себя!"
text.02f6: "Похоже на то..."
text.0316: "Если победишь их, может,\nещё увидимся.\nА пока я ухожу."
