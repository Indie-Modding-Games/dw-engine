text.006c: "Мне нехорошо."
text.0098: "Ты в порядке?"
text.00c0: "Мне плохо."
text.00ec: "Ты здесь живёшь?"
text.0122: "Меня мутит. Совсем нет сил."
text.0158: "Выглядишь ужасно."
text.017e: "Становится хуже."
text.01ac: "Надо выяснить, в чём дело."
text.01e6: "Откуда течёт эта\nгрязная вода?\nПойду проверю!"
text.0282: "Что это?"
text.02b2: "Что случилось, {color:10}{partner}{color:1}?!"
text.02ea: "Этот туман воняет!"
text.0312: "Странный, мерзкий какой-то."
text.0350: "Отлично, канализация\nснова в порядке."
text.039a: "Теперь с ним всё будет\nхорошо. Я решил проблему."
text.040c: "Что-то не так!"
text.0450: "Да-да-да!"
text.04bc: "Я устал.\nЧто с вами случилось?"
text.050e: "Звучит ещё глупее!\nМожет, он пришёл в себя."
text.0574: "Ты назвал меня глупым?\nКак грубо! Меня зовут Numemon."
text.05e8: "Если ты не глупый,\nто кто ты?"
text.0630: "Прости, Numemon. Ты знаешь,\nкто спас тебе жизнь?"
text.06a0: "А? Хочешь, чтобы я спас\nтебе жизнь? Ладно."
text.06fc: "Уф. Он совсем ничего\nне понял! Ну и ладно."
text.0766: "Эй, я буду спасителем. Круто!"
text.07ae: "Приходи в наш город.\nТы знаешь, где он?"
text.081c: "Примерно знаю."
text.087c: "Numemon теперь живёт\nв городе!"
text.08ce: "Кто там?!"
text.08ec: "Ты кто такой?!"
text.0984: "Я получил {color:4}Брелок\nизмерений{color:1}! Теперь можно\nносить до двадцати предметов!"
text.0a46: "Я получил {color:4}Брелок\nизмерений{color:1}! Теперь можно\nносить до тридцати предметов!"
