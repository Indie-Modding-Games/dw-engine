text.002e: "Сейчас я тебя поймаю."
text.0068: "Пришёл сюда проиграть?"
text.00b2: "Видок у тебя жалкий!"
text.00f2: "Хмм, так хочешь проиграть?"
text.0140: "Тебе крышка!"
text.017a: "Прочь с дороги!"
text.01ca: "Здесь время течёт\nсовсем иначе."
text.0226: "Нельзя терять время.\nНадо найти метеориты."
