text.0060: "Я выиграю!"
text.0098: "Ну, давай, дружок!"
text.00d4: "Что же будет дальше?"
text.0122: "Ничего не выйдет."
text.0168: "Я голодный."
text.0186: "Дать еды\nНе давать"
text.01de: "У меня сейчас нет еды."
text.0266: "Ой, это я дать не могу."
text.02b8: "Вкуснятина..."
text.02de: "Давай драться!"
text.032e: "Плохо дело.\nЧто же мне делать?"
text.0380: "Иди в город и отработай\nвсё, что съел!"
text.03e6: "Ладно, так и быть. Я\nДигимон-насекомое\nKunemon. Будем знакомы."
text.04c0: "Kunemon теперь живёт\nв городе!"
text.0508: "В другой раз принеси еды."
