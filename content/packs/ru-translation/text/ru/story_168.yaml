text.00e0: "Информация об Арене"
text.0108: "Результаты\nО турнирах классов\nОб особых турнирах"
text.0188: "Выиграно\nтурниров: {tourn_won}\n{tourn_wins}побед {tourn_lost}поражений"
text.01ea: "Турниры классов проводятся\nчасто, участвовать может\nкаждый."
text.025a: "Но Дигимону старшей стадии\nне стоит участвовать в\nтурнирах для младших."
text.02f2: "Если твой Дигимон\nдигиэволюционирует после\nзаписи, участвовать нельзя."
text.039c: "У особых турниров есть\nусловия участия, и проходят\nони нечасто."
text.0434: "Если в городе мало\nучастников, турнир\nвообще не состоится."
text.04cc: "Каждый турнир проходит\nлишь раз-два в год.\nСмотри расписание заранее."
text.058c: "{color:10}{partner}{color:1}, придумаю тебе\nпрозвище... герой,\nкоторый спас мир."
text.061c: "Так-так."
text.0648: "Как насчёт\n«Непобедимый {color:10}{partner}{color:1}»?"
text.0694: "Как насчёт\n«Легендарный герой {color:10}{partner}{color:1}»?"
text.06e8: "Как насчёт\n«Великий {color:10}{partner}{color:1}»?"
text.0732: "Как насчёт\n«Миротворец {color:10}{partner}{color:1}»?"
text.077e: "Как насчёт\n«Чемпион {color:10}{partner}{color:1}»?"
text.07c8: "Как насчёт\n«Храбрый {color:10}{partner}{color:1}»?"
text.0812: "Как насчёт\n«Крутой парень {color:10}{partner}{color:1}»?"
text.085e: "Как насчёт\n«Могучий {color:10}{partner}{color:1}»?"
text.08aa: "Как насчёт\n«Августейший {color:10}{partner}{color:1}»?"
text.08f2: "Как насчёт\n«Гениальный {color:10}{partner}{color:1}»?"
text.0946: "Эй, эти места\nдля наших гостей."
text.0d0e: "- Класс D -\nТурнир для Дигимонов\nуровня Новичок\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.0e0c: "- Класс C -\nТурнир для Дигимонов\nуровня Чемпион\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.0f0e: "- Класс B -\nТурнир для Дигимонов\nуровня Чемпион\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.1010: "- Класс A -\nТурнир для Дигимонов\nуровня Ультра\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.1112: "- Класс S -\nТурнир для самых\nсильных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников.\nНужна победа в Классе A."
text.120c: "- Класс R -\nКоролевская битва:\nпобеждает тактика\n\nКоролевская битва на 4,\n2 раунда, 8 участников.\nУсловия: нет."
text.1340: "- Кубок Версии 1 -\nБои на время для лучших\nДигимонов Версии 1\n\nБои один на один, 3 раунда,\n8 участников.\nТолько Дигимоны Версии 1."
text.147c: "- Кубок Версии 2 -\nБои на время для лучших\nДигимонов Версии 2\n\nБои один на один, 3 раунда,\n8 участников.\nТолько Дигимоны Версии 2."
text.15b8: "- Кубок Версии 3 -\nБои на время для лучших\nДигимонов Версии 3\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны Версии 3."
text.1700: "- Кубок Версии 4 -\nБои на время для лучших\nДигимонов Версии 4\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны Версии 4."
text.1842: "- Кубок Версии 0 -\nБои на время для лучших\nДигимонов не из\nверсий с 1 по 4.\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны не из версий 1-4."
text.19a8: "- Кубок Огня -\nБои на время за титул\nКороля огненных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны огненной природы."
text.1ae2: "- Кубок Борьбы -\nБои на время за титул\nКороля боевых искусств\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны-бойцы."
text.1c2c: "- Кубок Грома и Ветра -\nБои на время за титул\nКороля Дигимонов неба\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны стихии неба."
text.1d7a: "- Кубок Холода -\nБои на время за титул\nКороля холодных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны ледяной природы."
text.1eac: "- Кубок Природы -\nБои на время за титул\nКороля Дигимонов природы\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны природы."
text.1ff8: "- Кубок Металла -\nБои на время за титул\nКороля Дигимонов-машин\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны-машины."
text.2132: "- Кубок Грязи -\nБои на время за титул\nКороля грязных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны грязной природы."
text.226a: "- Кубок Дино -\nБои на время для Дигимонов\nдревней крови\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.239a: "- Кубок Крыльев -\nКрылатые Дигимоны\nмеряются силой\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.24ac: "- Кубок Зверей -\nБои на время для Дигимонов\nзвериной крови\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.25e0: "- Кубок Людей -\nБои на время для\nчеловекоподобных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
