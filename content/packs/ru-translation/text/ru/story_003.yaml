text.0062: "Уходи!"
text.008a: "Проваливай!"
text.00b2: "Это моё!"
text.00dc: "Попался!"
text.0114: "{color:7}? ? ? {color:1}\n..."
text.013c: "{color:7}? ? ? {color:1}. Цветок."
text.0172: "{color:7}? ? ? {color:1}\nЯ цветок."
text.01ae: "{color:7}? ? ? {color:1}\nЯ же сказал, что я цветок!\nТы что, не слушаешь!?"
text.0262: "Я не люблю драться."
text.028e: "Тогда пойдём\nв город."
text.02d6: "Там спокойно."
text.030a: "В город?"
text.0322: "Звучит весело.\nЯ Palmon.\nЯ тебе пригожусь!"
text.03cc: "Palmon теперь живёт в городе!"
