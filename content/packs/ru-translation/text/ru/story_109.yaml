text.003a: "Ух ты, вот это да!"
text.0092: "Эй, тут каменная табличка.\nПосмотрим..."
text.0112: "Тут написано «Leomon».\nОстальное не прочесть."
text.016c: "Речь я понимаю,\nа вот письмо — нет..."
text.01cc: "Возьмём её."
text.0200: "Ой, придётся что-то\nвыбросить."
text.0262: "Я получил {color:6}Камень\nLeomon{color:1}!"
text.02ba: "Ты кто?"
text.02da: "Ты кто такой!"
text.0370: "Я получил {color:4}Брелок\nизмерений{color:1}! Теперь\nможно носить до 20 предметов!"
text.0434: "Я получил {color:4}Брелок\nизмерений{color:1}! Теперь\nможно носить до 30 предметов!"
