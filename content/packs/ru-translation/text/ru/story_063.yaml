text.0042: "Myotismon здесь нет."
text.00b2: "А... ключ от моего\nхолодильника с мясом?"
text.00f4: " ! "
text.0102: "Кто-то пришёл меня спасти?"
text.013a: "Дигимон? Ты в порядке?"
text.016a: "Ты кто? Дай поесть!"
text.01a6: "Проголодался? Чего хочешь?"
text.01e0: "Мяса."
text.020c: "У меня есть мясо!"
text.022a: "Мяса."
text.023c: "Что?"
text.0252: "Мяса? Нет, у меня нету."
text.028e: "Вот."
text.02a4: "Ключ?"
text.02c4: "Надо кое от чего избавиться."
text.0312: "Я получил {color:6}ключ\nот холодильника{color:1}!"
text.0342: "Ладно..."
text.0358: "У меня мало времени!"
text.038c: "Скоро принесу что-нибудь.\nПотерпи ещё немного."
text.03fc: "Уф!"
text.041e: "Я спасён. Огромное спасибо.\nПрости за хлопоты."
text.0488: "Что случилось?"
text.04ac: "Я Myotismon, хозяин\nэтого особняка."
text.0500: "Я {color:6}{tamer}{color:1}, человек из\nдругого мира. А это мой\nнапарник {color:10}{partner}{color:1}."
text.0580: "Мы пришли\nспасти остров."
text.05c4: "Нам о многом нужно\nпоговорить. Добро пожаловать."
text.0678: "Ух ты!"
text.0688: "..."
text.0696: "Ты серьёзно?"
text.06c6: "Исчезло. Это сон?"
text.0746: "Кажется, мы справились."
text.078e: "Что?"
text.07a6: "А? Что?"
text.07ca: "Я потерял сознание. Прости."
text.084e: "Проклятие Analogman!\nНе бойся, всё будет хорошо."
