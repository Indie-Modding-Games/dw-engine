text.0050: "Автомат MP"
text.0080: "Этот автомат\nвосстанавливает MP."
text.00b8: "100 MP: 200 Bits\n1000 MP: 1800 Bits\nНе брать"
text.0160: "Мои MP восстановились!"
text.019e: "Мне не хватает Bits."
text.01f6: "Мои MP восстановились!"
text.0234: "Мне не хватает Bits."
text.0272: "Забудь."
text.02aa: "О, мост!"
text.02d2: "Ты что, драться со мной?"
text.030e: "Ну ты и умник!"
text.035a: "Ч-что ты задумал?!"
text.039e: "Я на тебя нажалуюсь!"
