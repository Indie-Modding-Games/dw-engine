text.0058: "Ничего не выходит!"
text.0096: "Ты что-то сказал?"
text.00d8: "Я же говорил, это\nневозможно."
text.0124: "Я не очень-то уверен."
text.0174: "Полегче со мной."
text.01a6: "Не смейся надо мной!"
text.01ee: "Лифт"
text.0206: "На крышу\nВверх\nНе входить"
text.026e: "Ничего не происходит."
text.02ba: "В механизме застрял\nкамень. Может, это..."
text.0334: "Я убрал камень!"
text.0362: "Вот теперь должно\nзаработать!"
text.03fe: "Ничего не происходит."
text.044a: "В механизме застрял\nкамень. Может, это..."
text.04bc: "Я убрал камень!{stop}"
text.04fe: "Вот теперь должно\nзаработать."
