text.0054: "Хватит дурачиться!"
text.0084: "Ладно. Думаю, больше\nне буду."
text.00e2: "Кажется, это\nпоследняя комната."
text.0156: "{color:7}??? {color:1}\nКакой?"
text.0198: "Этот голос... похоже,\nэто WaruMonzaemon!"
text.01ec: "Большой ящик или маленький?\nЯ читаю твои мысли!"
text.0250: "Большой ящик\nМаленький ящик"
text.0304: "А? А-а-а-а!"
text.04a2: "Ха-ха-ха, дурачок!\nМимо!"
text.052c: "О-о-о, ты догадался!\nХе-хе-хе. Нервничаешь?"
text.059a: "Чёрт, что тут смешного?"
text.05ce: "Ого, не горячись.\nЗачем ты сегодня пришёл?\nХочешь работать на меня?"
text.0674: "Верни нашего друга,\nкоторого ты похитил!"
text.06c6: "Друга? О чём ты говоришь.\nРазве я похож на того,\nкто на такое способен?"
text.0768: "Да!"
text.077a: "Ого, опять угадал!\nДа, это я! Это я сделал!"
text.07ec: "Но ты же понимаешь, что\nне получишь его обратно.\nВедь я WaruMonzaemon."
text.0878: "Раз так,\nя тебя заставлю!"
text.08d2: "Ты шутишь?\nТы собрался меня победить?"
text.0930: "Знаешь что?\nПроснись уже и посмотри\nправде в глаза!"
text.09e0: "Эй, верни моего друга,\nкоторого ты похитил."
text.0a4a: "Уггххх.... не может быть!\nНе верю, я\nпроигрываю...."
text.0ae2: "Ну же!"
text.0afa: "Ну... похоже, выбора\nу меня нет. Держи."
text.0bd8: "А? Ого-о-о.... эй!"
text.0d54: "Эй, хватит валять дурака,\nдовольно!"
text.0dae: "Эй, шуток не понимаешь?\nДержи. Вот он."
text.0e2c: "Что это?\nЭто же шестерёнка."
text.0e6e: "Да, именно."
text.0ea4: "Это и есть друг???"
text.0ed6: "Ну, больше я ничего\nне брал. Честно."
text.0f32: "Пожалуй, пока заберу\nэто обратно."
text.0f94: "Эй ты! Больше никаких\nпакостей, понял?!"
text.0ff8: "Ладно. Думаю, такого\nбольше не повторится."
text.105c: "Что-то не верится,\nно у меня столько\nдругих дел."
text.1104: "Ой-ой, у меня слишком много\nпредметов. Придётся\nодин выбросить."
text.1182: "Я получил предмет {color:6}Шестерёнка{color:1}!"
text.11ba: "Что? Ты кто?"
text.11e6: "Кто я? А ты кто такой?!"
text.1292: "Я получил {color:4}Брелок\nизмерений{color:1}! Теперь\nможно носить до 20 предметов."
text.1354: "Я получил {color:4}Брелок\nизмерений{color:1}! Теперь\nможно носить до 20 предметов."
