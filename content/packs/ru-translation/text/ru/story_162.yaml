text.00f8: "Я вернулся!"
text.0122: "Спасибо за приглашение.\nНадеюсь, мы сработаемся,\n{color:10}{partner}{color:1}."
text.01c6: "{color:7}Уровень укротителя\nповысился! {color:1}"
text.020c: "{color:7}Поздравляем!\nВот тебе\nмедаль. {color:1}"
text.026c: "Есть карта Machinedramon!"
text.0782: "Ты видел\nСтража озера?"
text.07c8: "Если нет, подожди\nна южной стороне."
text.083e: "Встань пораньше и\nпогуляй в тумане.\nСлучится что-то хорошее!"
text.08de: "Знаешь, что на севере\nесть место под названием\nПляж Айсбергов?"
text.0962: "Говорят, на этом пляже\nчасто появляется\nогромный Дигимон."
text.09f4: "Бандитов уже победили?\nГоворят, тут орудует\nбанда разбойников."
text.0a8c: "Ты бывал в Великом каньоне?"
text.0ac6: "Говорят, там\nпрячутся бандиты."
text.0b1e: "Они плохие?"
text.0b4a: "Они нападают и грабят."
text.0b86: "Надо с этим что-то сделать."
text.0bd8: "Ты бывал в Великом каньоне?"
text.0c12: "Говорят, там есть\nНевидимый мост."
text.0c96: "Говорят, Machinedramon\nвернулся."
text.0cea: "Ты снова победил\nMachinedramon."
text.0d2e: "Я расскажу тебе, что\nесть вокруг города."
text.0d88: "Город окружает\nРодной лес."
text.0dd0: "Дигимоны там\nне очень сильные."
text.0e2c: "На западе есть\nтренировочный лагерь."
text.0e7a: "Тропические джунгли —\nна востоке, за рекой."
text.0ed2: "Не знаю, что\nтам дальше."
text.0f18: "На западе есть\nгора и озеро."
text.0f70: "Пойдёшь на юг — там океан."
text.0fb4: "На севере есть\nвысокая гора."
text.1006: "Этот город — центр\nострова."
text.1058: "Я разузнаю слухи.\nЗаходи потом, расскажу ещё."
text.10c8: "Посмотрим, что тут есть."
text.1108: "Туалет мне не нравится, но\nв остальном всё отлично!"
text.117e: "Тут довольно оживлённо."
text.11b2: "Разве мне не надо вернуться\nв Город Факториал?"
text.120c: "Моя функция расписания\nработает. Без проблем."
text.1282: "Ты пришёл как раз вовремя!"
text.12be: "Взгляни на эту скульптуру!\nЧто скажешь?"
text.1318: "Какой шедевр.\nЯ сам собой восхищаюсь."
text.1364: "Что ты имеешь в виду?\nТы надо мной смеёшься!"
text.13be: "О чём мы говорили?\nА, неважно."
text.141e: "Какой замысел у меня был?\nКогда поймёшь,\nскажи мне."
text.14e2: "спит..."
text.1516: "Слышал? В Тропических\nджунглях растёт\nстранное растение."
text.15b2: "Ах да,"
text.15c8: "Я посадил {color:6}Дождецвет\n{color:1}вот здесь."
text.1618: "Он плодоносит каждый год\nпримерно пятнадцатого.\nМожешь их забирать."
text.16a4: "Зачем?"
text.16cc: "Ох, как хорошо!\nСолнышко."
text.170e: "Ох, как хорошо!\nСолнышко."
text.1766: "Отлично, вот здорово!"
text.17be: "О, это же..."
text.17f6: "Слишком много предметов."
text.1822: "Я получил {color:6}плод\nДождецвета{color:1}!"
text.1902: "Я отвезу тебя к океану.\nЭто моя работа."
text.195c: "Я отвезу тебя туда, куда\nможно добраться только морем."
text.19c8: "Ну что ж..."
text.19ea: "Хм, куда поплывём? В Город\nФакториал или, может,\nв Пещеру тайного пляжа."
text.1a6c: "Город Факториал\nПещера тайного пляжа\nНикуда"
text.1b5a: "Нашёл тебя!"
text.1b88: "О нет, он идёт\nпрямо к нам!"
text.1be2: "Наконец-то я тебя нашёл!\nЯ Greymon.\nДавай разберёмся!"
text.1c62: "Что?!"
text.1c76: "Я шёл сюда по слухам\nо тебе. Хочу\nс тобой сразиться!"
text.1d00: "Если я выиграю,\nэтот указатель — мой!"
text.1d54: "Тут нет указателя."
text.1d7c: "Всё равно,\nдавай драться!"
text.1e08: "Эй, а вы хороши!\nНо для вашей цели\nвы ещё новички."
text.1ea6: "Хммм"
text.1eb6: "Я останусь и потренирую\nвас. Вы станете гораздо\nсильнее!"
text.1f56: "Greymon теперь живёт\nв городе!"
text.200c: "Ага, нашёл тебя, {color:6}{tamer}{color:1}!"
text.2048: "Засада!"
text.205e: "Моя цель — победить тебя."
text.2094: "Эти глаза! Ему, наверное,\nпромыли мозги!"
text.2126: "Что бы ни было,\nя должен его победить."
text.218c: "Ты о чём вообще?\nТебе надо лечиться."
