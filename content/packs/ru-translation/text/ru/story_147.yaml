text.003c: "Куда это ты?"
text.007a: "Стой!"
text.009a: "Допи-и-и!"
text.00c0: "Ггух Хейи Хи!"
text.00f6: "Ты кто?"
text.0114: "Я MetalMamemon, непобеждён\nв девяноста девяти боях!\nТы будешь сотым!"
text.01b0: "Не верю, что такой, как\n{color:6}{tamer}{color:1}, сбежит."
text.0214: "Давай драться\nПрости, потом"
text.0294: "Ты сильнее, чем\nя думал."
text.02d4: "Ты достойный соперник!"
text.0306: "Когда-нибудь я тебя одолею!"
text.0372: "MetalMamemon теперь\nживёт в городе!"
text.03c6: "Так и знал, что струсишь.\nНу, встретимся, когда\nнаберёшься смелости."
