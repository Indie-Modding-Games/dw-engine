text.0012: "Магазин 1\nМагазин 2\nПрочее\nВвести имя"
text.0074: "{color:6}{tamer}{color:1}\n{color:10}{partner}{color:1}"
text.00a6: "Магазин\nРынок\nОчки"
text.01fc: "Карты\nХранилище\nДругие магазины"
text.0256: "Сегодня, как всегда,\nсвежие карты."
text.02a6: "Купить карту\nПродать карту\nОтмена"
text.0304: "Набор из 3 карт\nОдна карта\nОтмена"
text.0378: "Одна карта\nОтмена"
text.03bc: "Один набор стоит\n500 Bits. Что внутри —\nсюрприз."
text.0442: "Купить\nОтмена"
text.0472: "Открой набор прямо сейчас."
text.04d4: "Что ещё нужно, амиго?"
text.0518: "Заходи ещё!"
text.0538: "Тест звука\nМагазин перемещений\nОбмен"
text.05a4: "Запись\nАрена\nРазное\nЦена"
text.05ee: "Начало\nФинал\nПревращение\nУход"
text.0772: "Вернуть исходную форму."
text.07b8: "Дигиэволюция в Sukamon."
text.07f6: "Готово."
text.082e: "Запись на ' - {tournament:pstat=3}- '"
text.0872: "Записей нет."
text.08b0: "Сейчас: {shopvar} Bits."
text.08e2: "Очистить\nДобавить\nКонец"
text.0992: "- Класс D -\nТурнир для Дигимонов\nуровня Новичок\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.0a90: "- Класс C -\nТурнир для Дигимонов\nуровня Чемпион\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.0b92: "- Класс B -\nТурнир для Дигимонов\nуровня Чемпион\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.0c94: "- Класс A -\nТурнир для Дигимонов\nуровня Ультра\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.0d96: "- Класс S -\nТурнир для самых\nсильных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников.\nНужна победа в Классе A."
text.0e90: "- Класс R -\nКоролевская битва:\nпобеждает тактика\n\nКоролевская битва на 4,\n2 раунда, 8 участников.\nУсловия: нет."
text.0fc4: "- Кубок Версии 1 -\nБои на время для лучших\nДигимонов Версии 1\n\nБои один на один, 3 раунда,\n8 участников.\nТолько Дигимоны Версии 1."
text.1100: "- Кубок Версии 2 -\nБои на время для лучших\nДигимонов Версии 2\n\nБои один на один, 3 раунда,\n8 участников.\nТолько Дигимоны Версии 2."
text.123c: "- Кубок Версии 3 -\nБои на время для лучших\nДигимонов Версии 3\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны Версии 3."
text.1384: "- Кубок Версии 4 -\nБои на время для лучших\nДигимонов Версии 4\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны Версии 4."
text.14c6: "- Кубок Версии 0 -\nБои на время для лучших\nДигимонов не из\nверсий с 1 по 4.\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны не из версий 1-4."
text.162c: "- Кубок Огня -\nБои на время за титул\nКороля огненных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны огненной природы."
text.1766: "- Кубок Борьбы -\nБои на время за титул\nКороля боевых искусств\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны-бойцы."
text.18b0: "- Кубок Грома и Ветра -\nБои на время за титул\nКороля Дигимонов неба\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны стихии неба."
text.19fe: "- Кубок Холода -\nБои на время за титул\nКороля холодных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны ледяной природы."
text.1b30: "- Кубок Природы -\nБои на время за титул\nКороля Дигимонов природы\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны природы."
text.1c7c: "- Кубок Металла -\nБои на время за титул\nКороля Дигимонов-машин\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны-машины."
text.1db6: "- Кубок Грязи -\nБои на время за титул\nКороля грязных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны грязной природы."
text.1eee: "- Кубок Дино -\nБои на время для Дигимонов\nдревней крови\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.201e: "- Кубок Крыльев -\nКрылатые Дигимоны\nмеряются силой\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.2130: "- Кубок Зверей -\nБои на время для Дигимонов\nзвериной крови\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.2264: "- Кубок Людей -\nБои на время для\nчеловекоподобных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
