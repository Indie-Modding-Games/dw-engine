text.0044: "Привет! Тебе нужно мясо?"
text.007c: "Ой, я же тебе ещё\nничего не рассказал."
text.00d8: "Это мясная ферма.\nМы растим мясо для всех."
text.013e: "Мясо растят на ферме?"
text.0176: "Ага, а что?"
text.0192: "Да так... ничего"
text.01b8: "Мы с Jiji решили давать\nтебе по три куска мяса\nкаждый день, {color:6}{tamer}{color:1}."
text.0242: "Вот твоё мясо на сегодня."
text.028e: "У тебя полно мяса.\nСегодня оно тебе не нужно."
text.030a: "У тебя полно мяса. Что не\nунесёшь, я заберу."
text.0380: "Я получил три куска\n{color:6}Мяса{color:1}!"
text.03dc: "Слишком много предметов."
text.0414: "Я получил три куска\n{color:6}Мяса{color:1}!"
text.0470: "Сегодня у нас богатый\nурожай мяса! Дадим тебе\nпять кусков."
text.0508: "У тебя полно мяса."
text.054c: "У тебя полно мяса. Что не\nунесёшь, я заберу."
text.05c2: "Я получил пять кусков\n{color:6}Мяса{color:1}!"
text.0620: "Слишком много предметов."
text.0658: "Я получил пять кусков\n{color:6}Мяса{color:1}!"
text.0698: "Завтра получишь ещё."
text.06e4: "Вот мясо на сегодня."
text.072a: "У тебя полно мяса."
text.076e: "У тебя полно мяса. Что не\nунесёшь, я заберу."
text.07e4: "Я получил {color:6}Мясо{color:1}!"
text.0820: "Слишком много предметов."
text.0858: "Я получил {color:6}Мясо{color:1}!"
text.087a: "Завтра дам ещё."
text.08c0: "Я ведь уже дал тебе\nмясо на сегодня."
text.090a: "Если кончится еда,\nсходи в Родной лес\nза грибами."
text.09a2: "Привет, {color:6}{tamer}{color:1}! Я расширил\nсвою мясную ферму."
text.09ea: "Буду давать тебе по три\nГоры мяса в день."
text.0a4e: "Если нужно больше,\nпродам по 500 Bits\nза штуку."
text.0ad2: "Я присмотрю за фермой\nвместо Tanemon.\nОн где-то отдыхает."
text.0b74: "Сегодня у меня богатый\nурожай мяса!"
text.0bd2: "У тебя полно Горы мяса.\nСегодня она тебе не нужна."
text.0c56: "У тебя полно Горы мяса.\nСегодня она тебе не нужна."
text.0cce: "Я получил {color:6}Гору мяса{color:1}!"
text.0d14: "Слишком много предметов."
text.0d4c: "Я получил пять\n{color:6}Гор мяса{color:1}!"
text.0d98: "Завтра дам ещё."
text.0dea: "Вот тебе три Горы мяса\nна сегодня."
text.0e60: "У тебя полно Горы мяса.\nСегодня она тебе не нужна"
text.0ee2: "У тебя полно\nГоры мяса. Что не унесёшь,\nя заберу."
text.0f64: "Я получил {color:6}Гору мяса{color:1}!"
text.0faa: "Слишком много предметов."
text.0fe2: "Я получил три\n{color:6}Горы мяса{color:1}!"
text.1036: "Завтра дам ещё.\nИли купи прямо сейчас.\nПо 500 Bits за штуку?"
text.10d2: "Купить\nНе покупать"
text.1110: "Тебе не хватает денег."
text.1150: "Слишком много предметов."
text.119c: "Хочешь купить ещё?"
text.11d4: "Купить\nНе покупать"
text.1202: "До завтра."
text.123e: "Хе-хе-хе!\n{color:6}{tamer}{color:1}, смотри!"
text.128a: "Теперь мы растим много\nВырезки. Буду давать тебе\nпо три Вырезки в день."
text.1310: "А ещё я начал растить\nредкие овощи!\nПокупай сколько хочешь!"
text.13a6: "У меня сегодня хорошее\nнастроение, так что дам\nтебе пять Вырезок."
text.143a: "У тебя полно Вырезки.\nСегодня она тебе не нужна"
text.14b6: "У тебя полно Вырезки."
text.14f4: "Я получил {color:6}Вырезку{color:1}!"
text.1534: "Слишком много предметов."
text.156c: "Я получил пять\n{color:6}Вырезок{color:1}!"
text.15b2: "До завтра!"
text.15ee: "Вот твоя порция на сегодня:\nтри Вырезки!"
text.1668: "У тебя полно Вырезки.\nСегодня она тебе не нужна."
text.16e6: "У тебя полно Вырезки."
text.1724: "Я получил {color:6}Вырезку{color:1}!"
text.1766: "Слишком много предметов."
text.179e: "Я получил три\n{color:6}Вырезки{color:1}!"
text.17ec: "Завтра ещё не наступило!\nХочешь купить овощей?"
text.1858: "Купить\nНе покупать"
text.1886: "Супермарковь: 500 Bits\nРедис-ястреб: 500 Bits\nНе покупать"
text.1930: "Тебе не хватает денег."
text.197e: "Слишком много предметов!"
text.19ca: "Тебе не хватает денег."
text.1a18: "Слишком много предметов!"
text.1a62: "Хочешь купить ещё?"
text.1a9a: "Купить\nНе покупать"
text.1ac8: "Пока!"
