text.0090: "Думаешь, ты важная птица!"
text.00dc: "Что я тебе сделал!?"
text.0156: "{color:7}? ? ? {color:1}\nСтой!"
text.02f0: "Меня зовут Ninjamon!"
text.033a: "Ты {color:6}{tamer}{color:1}?\nА ты, должно быть, {color:10}{partner}{color:1}!"
text.0380: "О тебе знают даже в\nДеревне ниндзя. Прими\nмой вызов на бой."
text.041e: "Давай\nВ другой раз"
text.0454: "Ха, это ты так думаешь!"
text.04e0: "Ты и правда так силён,\nкак говорят. Прошу,\nвозьми меня в ученики!"
text.0580: "В ученики? Нет, я этим\nне занимаюсь. Но ты можешь\nпомочь нам строить город."
text.060a: "Хорошо.\nЭто тоже тренировка.\nЯ буду стараться."
text.076c: "Ninjamon теперь живёт\nв городе!"
text.07b8: "Эй, ты!"
text.07d0: "Ты о чём?\nЧто ты тут делаешь?"
text.081c: "Эй, {color:6}{tamer}{color:1}!"
text.0834: "Я хотел собрать в городе\nсвой гарем, а меня\nвыгнали!"
text.08ce: "Слышал, у тебя дела идут\nв гору. Продам тебе\nкое-что хорошее!"
text.0962: "Это ценнейший\n{color:6}Золотой банан{color:1}."
text.09c0: "С тебя 50000 Bits.\nВ долг не даю."
text.0a24: "Заплатить\nНе платить"
text.0a76: "Глупец! У тебя полно вещей!"
text.0abe: "Ой, у меня полно вещей!"
text.0afe: "Огромное спасибо!"
text.0b30: "Люди должны платить\nнастоящими деньгами."
