text.0034: "Ням-ням."
text.004e: "Э-э..."
text.0064: "Послушай, пожалуйста."
text.008e: "Вкуснятина, вкуснятина."
text.00b0: "Мои подчинённые\nбольше меня не слушают."
text.00f0: "Кажется, они не могут\nзапомнить мои приказы."
text.014a: "Иногда они их\nдаже не понимают."
text.019a: "Мне должны приносить\nеду, но..."
text.01ea: "Вкуснятина..."
text.0202: "Пока я работал, еду\nмне не приносили,\nи я забыл поесть."
text.0294: "Ты слишком увлёкся\nработой."
text.02e2: "Как неловко."
text.0310: "По-моему, в особняке\nчто-то неладно."
text.0366: "Беда на острове? Все\nведут себя, как мои\nподчинённые?"
text.03da: "Да, все теряют\nпамять."
text.042c: "Думаешь, кто-то\nэто делает нарочно?"
text.0478: "Хм-м"
text.0488: "Что я могу сделать?"
text.04ac: "Мы строим город, чтобы\nобъединить сердца\nДигимонов."
text.0512: "Мы путешествуем,\nчтобы найти друзей."
text.055a: "Что я могу сделать?\nМои подчинённые\nумеют только драться."
text.05cc: "Я не могу их бросить."
text.0604: "Понятно..."
text.061c: "Дай мне подумать.\nМне очень жаль, но..."
text.067e: "Я ещё вернусь.\nНе забывай поесть."
text.06de: "Хочешь поучаствовать\nв турнире?"
text.0712: "В турнире? Отлично,\nмои ребята взбодрятся."
text.0776: "Так ты с нами?"
text.07a8: "Да, но мне ещё нужно\nзакончить исследования.\nСкоро я приду."
