text.00ac: "Я опять здесь."
text.00da: "Пока!"
text.00fa: "Если так пойдёт, мы будем\nходить по кругу."
text.0168: "Может, мне подождать тут?"
text.01c4: "Кто там?"
text.01e0: "Ни за что."
text.0206: "Ааах!"
text.0228: "Подожди!"
text.027a: "Опять! Подожди!"
text.02d6: "Опять! Подожди!"
text.0332: "Опять! Подожди!"
text.038e: "Опять! Подожди!"
text.04c6: "Может, подождать?"
text.04ec: "Ждать\nИдти"
text.0524: "Давай, {color:10}{partner}{color:1},\nпрогони Biyomon!"
text.05aa: "Он побежал не туда!"
text.0612: "Может, подождать?"
text.0638: "Ждать\nИдти"
text.0670: "Давай, {color:10}{partner}{color:1},\nпрогони Biyomon!"
text.06f6: "Он побежал не туда!"
text.075c: "Может, подождать?"
text.0782: "Ждать\nИдти"
text.07ba: "Давай, {color:10}{partner}{color:1},\nпрогони Biyomon!"
text.0840: "Он побежал не туда!"
text.08a6: "Может, подождать?"
text.08cc: "Ждать\nИдти"
text.0904: "Давай, {color:10}{partner}{color:1},\nпрогони Biyomon!"
text.098a: "Он побежал не туда!"
text.09ea: "Засада удалась!"
text.0a26: "Помогите!"
text.0a4a: "Не паникуй. Мы тут\nне злодеи."
text.0aac: "Ты тот самый знаменитый\nпохититель Дигимонов?"
text.0b02: "Похоже, все всё\nпоняли не так."
text.0b5e: "{color:6}{tamer}{color:1} попытался\nвсё объяснить."
text.0ba0: "Понятно. Я ошибся."
text.0bd6: "Я пойду в город."
text.0c66: "Biyomon теперь живёт\nв городе!"
text.0cc4: "А ну, поймай меня!"
text.0cfa: "Смелый ты!"
text.0d2a: "Ух ты!"
text.0d48: "Я первый!"
text.0d72: "Я сильный.\nТебе со мной не сладить!"
text.0dc8: "Не злись, если я выиграю."
