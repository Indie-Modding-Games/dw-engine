text.0020: "Надоело тут тренироваться.\nЧто же делать?"
text.0082: "Что делать?"
text.00a0: "Где ты тренируешься?"
text.00da: "Это тренировочная площадка?"
text.0116: "Надоело тренироваться.\nХочу настоящих боёв."
text.0180: "Может, это площадка\nА может, Арена"
text.01ee: "Надоело тренироваться.\nХочу настоящих боёв."
text.0258: "Хочу туда.\nБуду тренироваться там."
text.02e2: "Kabuterimon теперь\nживёт в городе!"
text.032a: "Каждый год здесь проходит\nТурнир воинов-насекомых..."
text.03ae: "...в дни с двумя двойками.\nПобедителю — отличные призы!"
text.0422: "Но участвовать могут\nтолько Дигимоны-насекомые."
text.0480: "Это Kabuterimon,\nKuragamon, Kunemon\nи ещё одно насекомое."
text.0508: "Но не Numemon."
text.052e: "В дни с двумя двойками\nкаждый год проходит\nТурнир воинов-насекомых."
text.05ce: "Ты ведь уже побеждал, да?"
text.060a: "Это Kabuterimon,\nKuragamon, Kunemon\nи ещё одно насекомое."
text.0692: "Это HerculesKabuterimon."
text.06ce: "Hercules-Kabuterimon\nужасно сильный."
text.071e: "Победитель турнира может\nстать Hercules-Kabuterimon\nи получить предметы."
text.07a6: "В Турнире воинов-насекомых\nможно участвовать много раз."
text.0824: "Ты сильный.\nМне нечему тебя учить."
text.0886: "Мы изучаем приёмы.\nСложные приёмы\nосвоить непросто."
text.091a: "Если есть способности,\nможешь освоить приёмы.\nХочешь освоить сложные?"
text.09c8: "Конечно!\nНет, не хочу"
text.0a06: "Тогда попробую."
text.0a3e: "Тебе не хватает Защиты.\nТренируйся ещё."
text.0aa0: "Тебе не хватает Скорости.\nТренируйся ещё."
text.0aee: "Тебе не хватает HP.\nТренируйся ещё."
text.0b2a: "Ты освоил приём."
text.0b64: "Ты освоил «Жучок»!"
text.0bb4: "{color:5}Тренировка: Толкать камень {color:1}"
text.0bec: "Начать\nОбъяснить\nВыйти"
text.0c22: "Обычная\nДоп. попытка\nВыйти"
text.0c5e: "Толкай камень, чтобы\nстать сильнее. Макс. HP\nсильно растёт."
text.0ce4: "Ещё раз объяснить\nНачать\nВыйти"
text.0d3e: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}и собери\nтри одинаковые картинки."
text.0dc0: "{color:5}Тренировка: Удары {color:1}"
text.0df0: "Начать\nОбъяснить\nВыйти"
text.0e28: "Обычная\nДоп. попытка\nВыйти"
text.0e66: "Бей манекен изо всех\nсил. Атака сильно\nрастёт."
text.0efc: "Ещё раз объяснить\nНачать\nВыйти"
text.0f56: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}и собери\nтри одинаковые картинки."
