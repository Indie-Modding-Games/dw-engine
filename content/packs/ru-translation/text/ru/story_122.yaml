text.0020: "Я мешаю?"
text.0056: "Ты меня спас!"
text.0078: "Так это был ты."
text.009c: "Вот и отлично."
text.00cc: "Что?"
text.00e2: "Я как раз иду в твой\nгород, чтобы найти\nприменение своему таланту!"
text.0160: "Какому таланту?"
text.0190: "Ты что, меня не знаешь?\nВсе Дигимоны знают меня\nкак всезнайку!"
text.0224: "Правда?\nНикогда о тебе не слышал."
text.026c: "Можно отправляться в город."
text.02b4: "А правда ли от этого\nбудет толк?"
text.0302: "Пока!"
text.0350: "Shellmon теперь живёт\nв городе!"
