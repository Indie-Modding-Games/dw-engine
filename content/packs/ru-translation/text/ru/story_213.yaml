text.0040: "О, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nвы пришли! Гляньте на эту\nАрену Города Файл. Круто, а?"
text.00d0: "Скоро тут будет полно бойцов\nи фанатов. Ты ведь тоже\nпорадуешь фанатов, правда?!"
text.0188: "Победителей турниров ждут\nденьги и призы.\nТебе нечего терять."
text.0230: "Подробности о турнирах —\nв том автомате."
text.02d0: "Да, но Дигимоны-ученики\nучаствовать не могут.\nПроверить расписание?"
text.038c: "Да, но Дигимоны-ученики\nучаствовать не могут.\nПроверить расписание?"
text.043c: "Рад, что ты пришёл. Хочешь\nзаписаться на турнир?"
text.04b6: "Да\nНет\nВ смысле?"
text.0520: "Значит, ты записан\nна завтрашний\nтурнир, так?"
text.058a: "Хочешь отменить\nзапись?"
text.05d8: "Нет, не отменяю\nДа, отменяю"
text.0652: "Значит, ты записан\nна сегодняшний турнир?\nВход открыт с 10 утра."
text.06e8: "Ты же не собираешься\nотменять, правда?!"
text.0740: "Нет, не отменяю\nДа, отменяю"
text.07aa: "Значит, ты записан\nна сегодняшний турнир?\nПриходи до 11 вечера."
text.0832: "Ты же не собираешься\nотменять, правда?!"
text.088a: "Нет, не отменяю\nДа, отменяю"
text.08f6: "Что ж, я отменю запись."
text.0934: "Когда начнётся турнир,\nспустись внутри по левой\nлестнице, чтобы сражаться."
text.09de: "Запись бесплатная. Можно\nзаписаться только на турнир\nсегодня или завтра."
text.0a8c: "Но на турнир в тот же день\nнужно записаться\nдо 10 утра."
text.0b1a: "Расписание видно на пять\nдней вперёд, так что\nсмотри и строй планы."
text.0bb8: "В турнирах, отмеченных\nкрасным, участвовать нельзя."
text.0c32: "Но нажми Start, чтобы\nузнать, что это за турнир."
text.0ca0: "Даже в турнирах, где\nУсловия: нет,"
text.0d06: "Дигимоны-ученики\nучаствовать не могут."
text.0d52: "Вот и всё о записи.\nХочешь записаться?"
text.0dd4: "Да\nНет\nОбъясни ещё раз"
text.0e3c: "Эй! Ты ведь\nне записан!"
text.0eba: "Эй! Турнир-то\nзавтра!"
text.0f42: "Входить ещё рано.\nЖди до 10 часов."
text.0ff4: " \n{color:4}Уровень укротителя понизился!{color:1}"
text.10c6: "- Класс D -\nТурнир для Дигимонов\nуровня Новичок\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.11c4: "- Класс C -\nТурнир для Дигимонов\nуровня Чемпион\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.12c6: "- Класс B -\nТурнир для Дигимонов\nуровня Чемпион\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.13c8: "- Класс A -\nТурнир для Дигимонов\nуровня Ультра\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.14ca: "- Класс S -\nТурнир для самых\nсильных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников.\nНужна победа в Классе A."
text.15c4: "- Класс R -\nКоролевская битва:\nпобеждает тактика\n\nКоролевская битва на 4,\n2 раунда, 8 участников.\nУсловия: нет."
text.16f8: "- Кубок Версии 1 -\nБои на время для лучших\nДигимонов Версии 1\n\nБои один на один, 3 раунда,\n8 участников.\nТолько Дигимоны Версии 1."
text.1834: "- Кубок Версии 2 -\nБои на время для лучших\nДигимонов Версии 2\n\nБои один на один, 3 раунда,\n8 участников.\nТолько Дигимоны Версии 2."
text.1970: "- Кубок Версии 3 -\nБои на время для лучших\nДигимонов Версии 3\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны Версии 3."
text.1ab8: "- Кубок Версии 4 -\nБои на время для лучших\nДигимонов Версии 4\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны Версии 4."
text.1bfa: "- Кубок Версии 0 -\nБои на время для лучших\nДигимонов не из\nверсий с 1 по 4.\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны не из версий 1-4."
text.1d60: "- Кубок Огня -\nБои на время за титул\nКороля огненных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны огненной природы."
text.1e9a: "- Кубок Борьбы -\nБои на время за титул\nКороля боевых искусств\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны-бойцы."
text.1fe4: "- Кубок Грома и Ветра -\nБои на время за титул\nКороля Дигимонов неба\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны стихии неба."
text.2132: "- Кубок Холода -\nБои на время за титул\nКороля холодных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны ледяной природы."
text.2264: "- Кубок Природы -\nБои на время за титул\nКороля Дигимонов природы\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны природы."
text.23b0: "- Кубок Металла -\nБои на время за титул\nКороля Дигимонов-машин\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны-машины."
text.24ea: "- Кубок Грязи -\nБои на время за титул\nКороля грязных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны грязной природы."
text.2622: "- Кубок Дино -\nБои на время для Дигимонов\nдревней крови\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.2752: "- Кубок Крыльев -\nКрылатые Дигимоны\nмеряются силой\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.2864: "- Кубок Зверей -\nБои на время для Дигимонов\nзвериной крови\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.2998: "- Кубок Людей -\nБои на время для\nчеловекоподобных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
