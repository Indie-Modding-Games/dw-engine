text.0094: "Иди прямо, а потом\nнаправо. Хе-хе-хе..."
text.0108: "Направо и сразу\nналево. Хе-хе..."
text.016c: "Из этого леса тебе\nне выбраться. Хе-хе-хе..."
text.01dc: "Я заблудился!"
text.0208: "Что-то я устал в последнее\nвремя."
text.024e: "Ты? Да ладно!?"
text.027e: "Смотри под ноги."
text.02cc: "Эй, ты!"
text.0318: "Хм, а ты ничего!\nОчень неплохо для\nтакого раннего утра."
text.03c2: "Эй-эй, не делай вид,\nбудто тебя это не касается!"
text.0438: "Знаю! Знаю, о чём\nты говоришь."
text.0490: "Говорят, ты стараешься\nради острова и собираешь\nДигимонов."
text.0520: "Так ты знаешь. Ну тогда,\nможет, поможешь мне?"
text.057a: "А где мне это делать,\nи что именно?"
text.05d2: "Ну ты совсем не понимаешь!\nТы же должен работать\nв городе, помнишь?!"
text.066c: "Ну, как говорится...\nкто рано встаёт, тому\nжучок подаёт."
text.06e2: "Это тут вообще ни при чём!\nИ там не жучок, а Бог\nподаёт!"
text.078a: "Да шучу я. Ну,\nувидимся в городе..."
text.0830: "Kokatorimon теперь\nживёт в городе!"
text.0876: "Можно ли ему доверять?\nНе знаю..."
text.08de: "Эй, тут птичьи перья.\nЕщё совсем свежие.\nМы опоздали?"
