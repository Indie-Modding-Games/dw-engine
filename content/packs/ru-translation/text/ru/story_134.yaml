text.0092: "Шака-шака!"
text.00c0: "Шрио!"
text.00e4: "Ква!"
text.0104: "Если мы их не вырубим,\nто они вырубят нас."
text.017a: "Куриные мозги!"
text.0198: "Тупица!"
text.01b4: "Балбес!"
text.01ca: "Дубовая башка!"
text.01ec: "Глупый, глупый!"
text.020a: "Ботан вонючий!"
text.022a: "Что ты сказал?!"
text.0254: "Это меня злит\nПроигнорирую"
text.02de: "Какие грубые!"
text.034e: "Погоди, что такое?"
text.0396: "!"
text.03b4: "Меня зовёт хозяин.\nИдём со мной. Ква."
text.0420: "О нет!"
text.0440: "Ха-ха-ха, он блефует.\nС детьми я не вожусь."
