text.0438: "{color:1}Белый Белый Белый\n{color:2}Синий Синий Синий\n{color:3}Красный Красный Красный\n{color:4}Розовый {color:5}Зелёный\n{color:6}Голубой Голубой\n{color:7}Жёлтый {color:10}Оранжевый\n{color:10}a {color:6}b {color:4}c {color:5}d"
text.051c: "Сейчас {num:pstat=107}: {num:pstat=108}\n{num:pstat=106}-й день\n{num:pstat=105}-го месяца."
text.0582: "Я Господин Телепорт.\nКуда хочешь попасть?"
text.05d6: "Близко\nДалеко\nОчень далеко"
text.0620: "Вершина горы Панорама\nТропические джунгли\nБур-туннель"
text.069e: "Саванна Шестерён\nОсобняк Серого Лорда\nВеликий каньон"
text.070c: "Древний Дино-край: ворота\nДревний Дино-край: тыл\nНеизвестный мир"
text.07b6: "У Пещеры кёрлинга\nРыбалка Seadra\nЛавовая пещера"
text.083e: "Жизнь три"
text.085a: "Я Господин Дигиэволюция.\nКем хочешь стать?"
text.08bc: "Numemon\nSukamon\nBotamon"
text.0a50: "Полумёртвый\nРежим заставки\nПеремотка времени"
text.0acc: "Вперёд на час\nВперёд на шесть часов\nВперёд на десять дней"
text.0b76: "Хочешь мяса?"
text.0bae: "Ой, прости.\nЯ забыл объяснить."
text.0bfa: "Это мясная ферма.\nМы растим мясо для всех."
text.0c60: "Вы выращиваете мясо на ферме?"
text.0c98: "Да, а что такого?"
text.0cc4: "Ничего... всё нормально.\nПродолжай..."
text.0d20: "Мы с Jiji решили давать\nтебе три куска мяса\nв день, {color:6}{tamer}{color:1}."
text.0da4: "Вот сегодняшнее мясо."
text.0df6: "У тебя слишком много мяса.\nПохоже, сегодня тебе\nоно не нужно."
text.0e82: "У тебя слишком много мяса.\nЧто не унесёшь,\nя оставлю себе."
text.0efa: "Я получил три куска\n{color:6}мяса{color:1}!"
text.0f52: "У тебя слишком много вещей."
text.0f8a: "Я получил три куска\n{color:6}мяса{color:1}!"
text.0fea: "Мы собрали много мяса!\nПоэтому я дам тебе\nпять кусков мяса."
text.1088: "У тебя слишком много мяса.\nПохоже, сегодня тебе\nоно не нужно."
text.1110: "У тебя слишком много мяса.\nЧто не унесёшь, я\nс радостью заберу"
text.1192: "Я получил пять кусков\n{color:6}мяса{color:1}!"
text.11f0: "Прости, но у тебя\nслишком много вещей."
text.1246: "Я получил пять кусков\n{color:6}мяса{color:1}!"
text.1286: "Завтра дам ещё."
text.12d8: "Вот сегодняшнее мясо."
text.131e: "У тебя слишком много мяса.\nПохоже, сегодня тебе\nоно не нужно."
text.13a6: "У тебя слишком много мяса.\nЧто не унесёшь, я\nс радостью заберу."
text.142a: "Я получил три куска\n{color:6}мяса{color:1}!"
text.148a: "У тебя слишком много вещей."
text.14c4: "Я получил три куска\n{color:6}мяса{color:1}!"
text.1506: "Завтра дам ещё."
text.154c: "Что? Я же сегодня давал\nтебе мясо, помнишь?"
text.159e: "Если кончится еда, поищи\nгрибы в Родном лесу."
text.1620: "Хорошо, я расскажу тебе,\nчто есть вокруг города."
text.1692: "Город окружает\nРодной лес."
text.16da: "Дигимоны там\nне очень сильные."
text.173a: "На западе есть\nтренировочный лагерь. Думаю,\nты будешь туда часто ходить."
text.17d4: "Тропические джунгли —\nна востоке, за рекой."
text.1846: "Не знаю, что там дальше."
text.1888: "На западе есть гора\nи озеро, но дальше\nпути нет."
text.1910: "Если идти дальше на юг,\nбудет океан."
text.196a: "А на севере есть высокая\nгора. Там тоже\nтупик."
text.19ee: "Раз этот город — центр\nострова, на севере должны\nбыть большие земли."
text.1a9c: "Я разузнаю слухи о том,\nчто там снаружи.\nЗаходи потом, расскажу ещё."
