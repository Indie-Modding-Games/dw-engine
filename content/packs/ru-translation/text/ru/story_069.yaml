text.0066: "Сейчас я тебя вырублю!"
text.00ce: "Давай ещё раз."
text.00fa: "Давай\nНет"
text.0148: "Ещё чуть-чуть...\nНу же, ещё разок!"
text.01ae: "Давай\nНет"
text.020c: "Мне не победить!"
text.0230: "Зачем тебе побеждать?"
text.026e: "А что мне делать?"
text.0298: "Как это?\nТебе нечем заняться?"
text.02f4: "У меня полно времени."
text.032c: "Если времени много, приходи\nв город. Там живут\nсамые разные Дигимоны."
text.03d6: "Звучит здорово. Приду.\nМеня зовут Patamon.\nДо встречи."
text.0482: "Patamon теперь живёт\nв городе!"
text.04c8: "Так неинтересно!"
text.04f6: "Ты идёшь?"
text.052a: "Ты ничем не пахнешь!"
text.0560: "Выглядишь вкусно.\nСейчас я тебя слопаю!"
text.05b6: "Ха-ха, ты смешной!"
