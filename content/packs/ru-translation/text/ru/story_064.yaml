text.005c: "Myotismon! Что случилось?"
text.00b0: "Бакке!"
text.00c6: "..."
text.00ea: "Увидимся на арене.\nМои ребята, верно, скучают."
text.0172: "Ребята меня не слушаются.\nТак что возьму SkullGreymon."
text.01d8: "SkullGreymon уже не тот.\nТеперь он слушает других."
text.024e: "Myotismon, ты цел?"
text.02a8: "Уггх... Это ты!\nТы снова меня спас."
text.0306: "Что случилось?"
text.032a: "Ты видел Devimon?"
text.035e: "Видел. Он злой."
text.038a: "Он своим злом погубил\nмои исследования."
text.03da: "Твои исследования\nо SkullGreymon?"
text.0422: "Я собирал кости и\nскладывал их вместе.\nБуду осторожнее."
text.04b8: "Этот Devimon ужасен."
text.04ec: "Я хорошо его знаю."
text.0514: "Что?!"
text.0528: "Он всегда был хитрецом,\nно не таким злым."
text.0580: "Может, кто-то\nзадурил ему голову."
text.05d8: "Может быть."
text.05ec: "Будь он собой, он мог бы\nбыть в вашей команде."
