text.007c: "Я выиграю!"
text.00ae: "Тебе меня не победить!"
text.00ee: "Хе-хе! Ну, извини!"
text.012c: "Ты меня не замечаешь?"
text.017a: "Хочешь пройти — прими\nмой вызов."
text.021c: "Я зазевался, но двое\nна одного — нечестно."
text.028a: "Может, и так\nНе будь нытиком"
text.02ea: "В честном бою я никому\nне проигрываю."
text.034e: "Сразимся один на один.\nПриходи завтра в четыре.\nДраться будут только Дигимоны."
text.03fe: "Ладно\nНет, спасибо"
text.0436: "Значит, договорились.\nДо завтра!"
text.04e6: "Ты вернулся, хорошо.\nСегодня бьёмся честно!"
text.0550: "Ты опоздал, зато я успел\nподлечить рану.\nТеперь давай!"
text.05f2: "Я только посмотрю. Начали!"
text.0630: "Вперёд, {color:10}{partner}{color:1}!"
text.067e: "А ты силён! Ты кто?"
text.06b8: "Мы путешествуем и хотим\nспасти остров от беды."
text.0734: "Что?"
text.0746: "{color:6}{tamer}{color:1} изо всех сил\nего уговаривает!"
text.079a: "Я помогу тебе. Но сначала\nхочу посмотреть на город."
text.0844: "Garurumon теперь живёт\nв городе!"
