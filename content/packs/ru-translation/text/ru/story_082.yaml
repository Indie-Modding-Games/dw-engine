text.0042: "Это точно он!\nКак ни посмотри,\nобычный метеорит."
text.00d8: "Расколоть\nНе трогать"
text.0130: "Хмм"
text.0146: "По-моему, это просто\nстарый метеорит."
text.019c: "{color:7}???mon {color:1}\nУж извини, что я такой\nпростой и старый."
text.0202: "Ух ты!"
text.0212: "Ты Дигимон?!\nКто ты?"
text.0264: "{color:7}???mon {color:1}\nМеня зовут Meteormon."
text.02aa: "Ты знаешь, что\nгрозит острову?"
text.02fe: "Ничего не знаю!"
text.0324: "Ничего не знаешь?! Точно\nничего не скрываешь?"
text.039c: "Как грубо! Ладно!\nДавай сразимся и\nвыясним, кто прав!"
text.041e: "Ладно! Давай!"
text.0488: "Сдаюсь. Ты такой сильный."
text.04c8: "Расскажи всё, что знаешь\nо беде острова."
text.0542: "Я только родился, так\nчто ничего не знаю!"
text.059e: "Что?!"
text.05ba: "Племя метеоритов рождается\nв небе, а потом\nпадает на землю."
text.064a: "Потом мы долго спим.\nВообще-то я должен был\nспать гораздо дольше, но..."
text.06fa: "Время здесь идёт быстрее."
text.0738: "Наверное. Ладно, пойду\nосмотрю остров.{stop}\nПока!"
text.07f4: "Никаких зацепок.\nУходим скорее."
text.086a: "Мы его осмотрели, но\nничего не поняли.\nРасколем его!"
text.08f8: "{color:7}???mon {color:1}\nТы что это делаешь?\nВот же безрассудный болван!"
text.0998: "А? Ты кто?!"
text.09c4: "Кто я? А ты кто?!"
text.0a70: "Я получил {color:4}Брелок\nизмерений{color:1}.\nВлезет двадцать предметов!"
text.0b20: "Я получил {color:4}Брелок\nизмерений{color:1}.\nВлезет тридцать предметов!"
