text.0096: "Я слышал о тебе."
text.00d6: "Раз ты слышал о нас и\nо городе, может,\nпойдёшь со мной?"
text.0166: "Я тоже думаю о будущем\nострова. Я давно\nкое-что ищу."
text.0218: "Что ты ищешь?"
text.0252: "Кое-что, что оставили мои\nпредки, но я не знаю,\nчто это."
text.02fe: "Понятно. Если найду,\nдам тебе знать."
text.0354: "Я ищу это\nуже давно.\nНайти будет непросто."
text.03cc: "Но если найдёшь,\nобещаю, что приду\nв твой город."
text.044c: "Это оно?"
text.0474: "О, это оно!"
text.04b8: "Это написали мои предки.\nДай-ка посмотреть."
text.0524: "Когда острову будет грозить\nбеда, иди в город."
text.0592: "Предки говорят,\nчто я должен идти!"
text.05de: "Ты нам поможешь?"
text.061e: "Можешь на меня рассчитывать!"
text.0686: "Leomon теперь живёт\nв городе!"
text.06ca: "Мне надо кое-что найти.\nИзвини, но мне пора..."
text.0756: "{color:5}Тренировка:\nОсобые удары {color:1}"
text.0796: "Начать\nОбъяснить\nВыйти"
text.07ce: "Обычная\nДоп. попытка\nВыйти"
text.080c: "Бей по мешку с бетоном\nизо всех сил."
text.0868: "Повышает Атаку\nи макс. HP."
text.08c4: "Ещё раз объяснить\nНачать\nВыйти"
text.091e: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
text.09a0: "{color:5}Тренировка: \nТрасса саванны {color:1}"
text.09de: "Начать\nОбъяснить\nВыйти"
text.0a16: "Обычная\nДоп. попытка\nВыйти"
text.0a54: "Бег по трассе саванны."
text.0a8e: "Сильно повышает Скорость\nи ещё макс. HP."
text.0afc: "Ещё раз объяснить\nНачать\nВыйти"
text.0b56: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
