text.0066: "Та-а-а"
text.0084: "Давай попросим прощения."
text.00ce: "Прощение лечит сердце."
text.011c: "Ты злой?"
text.014c: "Иди за мной. А потом..."
text.0194: "Ха-ха-ха!"
text.01bc: "Ты!"
text.01cc: "Ты проиграешь!"
text.0220: "Не верится, что он\nпромыл мне мозги."
text.027c: "Он сильный.\nТы сможешь его победить?\nЗачем ты это делаешь?"
text.02f4: "Я буду биться за остров.\nПокончим с этим сейчас."
text.035c: "Нам не нужен правитель,\nты наша единственная\nнадежда."
