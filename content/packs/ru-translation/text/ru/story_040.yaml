text.00b8: "Ты кто? Уходи!"
text.00f2: "Ты здесь живёшь?"
text.012c: "Не скажу!"
text.0156: "Ты что, охранник?"
text.0198: "Хочешь драться? Побью!"
text.01da: "Придётся драться\nНе запугаешь"
text.025c: "Ух ты!"
text.02c4: "Ой-ой! Эй!"
text.02e2: "{color:7}???mon {color:1}\nХа-ха-ха."
text.0310: "Кто там?"
text.032c: "{color:7}???mon {color:1}\nНичего плохого я не делал.\nНе входи ко мне домой\nбез спросу!"
text.03d2: "Пожалуй, мне пора."
text.0418: "Хорошо охраняй!"
text.0452: "Ты из банды Ogremon!\nЭто твоё логово!"
text.04ba: "О чём это ты?"
text.0500: "В прошлый раз тебе\nповезло! Сдавайся!"
text.0554: "Ух ты!"
text.05b4: "В прошлый раз ты меня\nобманул, но теперь попался."
text.061a: "О чём это ты?"
text.0660: "В этот раз не уйдёшь!"
text.06ac: "Ну же, впусти меня."
text.06da: "Нарываешься?\nЯ тебя вырублю!"
text.0738: "Давай драться\nНе задирайся"
