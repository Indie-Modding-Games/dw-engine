text.003e: "!!!"
text.006c: "Яйцо!"
text.0080: "Неужели это яйцо\nMachinedramon?"
text.00c8: "Похоже, будет беда!"
text.015e: "Digitamamon теперь\nживёт в городе!"
text.01b8: "!"
text.01e2: "Вот он! Я его нашёл!"
text.022a: "Так это ты главный!"
text.0252: "Приятно познакомиться.\nЯ Analogman."
text.029a: "Я всё о тебе знаю, но не\nдумал, что ты ребёнок."
text.030e: "Не верится, что мой план\nсорвал какой-то ребёнок."
text.0378: "Я был так близок к\nвласти над Сетевым миром."
text.03ce: "Ты же взрослый! Хватит,\nты всем делаешь больно."
text.0442: "Мне всё равно, больно\nДигимонам или нет."
text.049a: "Дигимоны должны слушаться\nлюдей, как рабы."
text.04fa: "Неправда! У Дигимонов\nесть сердце и разум!\nМы друзья!"
text.0578: "Давай сразимся: кто\nсильнее, рабы или друзья?"
text.060c: "Твой черёд, Machinedramon!"
text.0698: "Мы победили, {color:10}{partner}{color:1}!"
text.06e0: "Не может быть!\nМой самый сильный раб!"
text.0736: "Видишь, ты ошибался!"
text.0772: "Ну и ну..."
text.07b4: "Оставь остров в покое,\nпопроси прощения,\nи тебя простят."
text.0854: "Зря я доверял Дигимонам.\nСделаю всё сам."
text.08e2: "Что ты задумал?!"
text.0926: "{color:7}Analogman {color:1}\nЯ взорву этот остров\nи сбегу в другой мир.\nНе повезло, малыш!"
text.0a12: "О не-е-ет!!"
text.0a3c: "{color:7}Analogman {color:1}\nТеперь тебе конец!"
text.0a86: "Простите, ребята. Я уже\nничего не могу сделать."
text.0af0: "{color:7}??? {color:1}\nВсё хорошо."
text.0b30: "А?"
text.0b56: "{color:7}Analogman {color:1}\nПередача не идёт!\nВ программе сбой.\nЧто происходит?!"
text.0c18: "Я слышу голоса всех!\nКто там?"
text.0c7e: "{color:7}Jijimon {color:1}\nМы прямо сейчас\nпосылаем тебе энергию."
text.0cee: "{color:7}Tokomon {color:1}\nТы слышишь нас?"
text.0d3c: "{color:7}Agumon {color:1}\nКажется, мы успели!"
text.0d8e: "Вы все..."
text.0dc4: "{color:7}Analogman {color:1}\nНет, дурацкая железка!\nПомогите! Спасите!\nА-а-а-а-а!!!"
text.0ec4: "Он исчез! Что случилось?"
text.0efe: "{color:7}Jijimon {color:1}\nНе знаю. Но..."
text.0f4c: "Jijimon? Сейчас рванёт!\nСделай что-нибудь!"
text.0fa2: "{color:7}Jijimon {color:1}\nОн уже должен быть тут."
text.1032: "Airdramon!"
text.104e: "Скорее, давай!"
text.10ac: "Analogman исчез."
text.10d8: "На остров Файл\nвернулся мир."
text.1124: "И..."
