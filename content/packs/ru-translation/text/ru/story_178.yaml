text.00a8: "Ты пришёл как раз вовремя!\nЕсть просьба, с которой\nсправишься только ты."
text.0146: "Какая?"
text.0164: "Я снова почувствовал то же\nзло, что исходило от\nAnalogman и Machinedramon."
text.01f8: "Я знаю, откуда оно идёт."
text.0236: "Опять? Ладно, я разберусь!"
text.0272: "Спасибо. Кстати..."
text.02b8: "Я слышал, ты победил\nMachinedramon!"
text.02fe: "Да, но я не понимаю.\nЭто было похоже на\nпроклятие Analogman."
text.0386: "Его злоба была так сильна.\nМожет, теперь будет мир."
text.03fa: "Если Machinedramon вернётся,\nмы снова его победим."
text.0460: "Тебе можно доверять. Это\nвыросло на нашей мясной\nферме, держи."
text.04f0: "Ого! Это\n{color:6}Дыня-цепь{color:1}?"
text.0548: "У меня слишком много вещей."
text.0588: "Спасибо!"
text.05be: "Ты пришёл!\nЭто я больше никого\nпопросить не могу."
text.0636: "Не бойся, я здесь.\nХочешь сказать,\nAnalogman вернулся?"
text.06a6: "Я чувствую его зло, но\nне знаю, где он."
text.0712: "Предоставь это мне! Я найду\nего и со всем разберусь."
text.0784: "Спасибо.\nКстати..."
text.07ea: "Я вернулся и хочу отстроить\nГород Файл с помощью\n{color:10}{partner}{color:1}."
text.0882: "Я хочу построить\nмагазины, полезные\nтебе и {color:10}{partner}{color:1}."
text.0900: "Исследуй Родной лес\nсразу за городом."
text.099c: "Возьми это. Удачи."
text.09de: "Я получил много предметов!"
text.0a26: "Чтобы посмотреть предметы,\nнажми {color:5}× {color:1}..."
text.0a6a: "...затем выбери «Предметы»\nи листай кнопкой\n{color:6}△ {color:1}."
text.0ae2: "Похоже, Yuramon собрал\nновые слухи."
text.0b56: "Говорят, у Yuramon\nесть новые слухи."
text.0bb2: "Город начинает расти,\nи, говорят, он уже\nменяется."
text.0c30: "Я расскажу тебе, как\nустроен наш мир."
text.0ca0: "В сутках двадцать четыре\nчаса, есть утро,\nдень и ночь."
text.0d32: "Тебе может показаться,\nчто время идёт быстро."
text.0d76: "В году тридцать дней.\nМесяц? Что это? Времена года?\nА их едят?"
text.0e14: "Деньги у нас, конечно, есть.\nЕдиница — Bits. Денег\nмного не бывает."
text.0eb6: "Когда на этом острове\nговорят «город», имеют\nв виду это место."
text.0f24: "Но есть и другие\nдеревни и городки."
text.0f84: "На часах жёлтая точка —\nэто часы, а стрелка —\nминуты."
text.100a: "Вверху — полночь,\nвнизу — полдень."
text.1050: "Красная часть слева —\nэто вечер. Она показывает\nс четырёх до восьми."
text.10f0: "Фиолетовая часть справа —\nэто утро, она показывает\nс четырёх до восьми."
text.118a: "Дигимоны активны в\nопределённое время суток."
text.11e6: "Большинство встают утром\nи спят ночью, но\nесть и наоборот."
text.1286: "Если не можешь встретить\nнужного Дигимона, приходи\nв другое время суток."
text.1340: "Говори с Tsunomon и\nYuramon как можно чаще."
text.13bc: "Расскажу тебе об\nуровне укротителя."
text.140a: "С высоким уровнем укротителя,\nкогда твой Дигимон исчезнет,"
text.147c: "у следующего Дигимона будут\nпараметры получше."
text.14de: "Поначалу он будет\nрасти медленно,"
text.152e: "но расти Дигимона упорно,\nи всё наладится."
text.15b2: "Когда используешь коронный\nприём, быстро жми\nкнопки L и R."
text.1658: "Когда шкала коронного приёма\nполна, урон врагу вдвое\nбольше, чем когда пуста!"
text.1704: "Расскажу тебе о\nжизни Дигимона."
text.1754: "Когда Дигимон голоден,\nон сам тебе скажет."
text.17ac: "Ещё ему нужно ходить\nв туалет. Следи, чтобы он\nделал это где положено."
text.182e: "Дигимоны хотят спать, но\nуложить спать его\nдолжен ты."
text.18b8: "Не заставляй его\nслишком долго не спать."
text.190a: "Он может устать, заболеть\nили просто расстроиться.\nОн довольно нежный."
text.198c: "Дигимоны — дикие\nсущества, так что их надо\nхвалить или ругать."
text.1a16: "Что бы ты ни делал,\nследи за тем, что\nделает твой Дигимон."
text.1aba: "Ты очнулся...\nМне так жаль."
text.1b28: "Что это за машина?"
text.1b64: "А, это? Это {color:4}автомат\nзаписи данных для боя\nс карты памяти{color:1}."
text.1be6: "С его помощью можно\nсохранить данные твоего\nнапарника для боёв."
text.1c7c: "Просто нажми {color:6}△ {color:1},\nи автомат подскажет,\nчто делать."
text.1d02: "Хочешь воспользоваться\n{color:4}автоматом записи для\nбоя с карты памяти{color:1}?"
text.1d84: "Да\nНет"
text.1dce: "Punimon не видно, но\nя, пожалуй, тут отдохну."
text.1e3a: "{color:7}Punimon {color:1}\nЯ Punimon! Может,\nотдохнёшь тут немного?"
text.1eb0: "{color:7}Punimon {color:1}\nЧас отдыха восстановит HP,\nMP и снизит усталость."
text.1f34: "Отдохнуть\nНе отдыхать"
