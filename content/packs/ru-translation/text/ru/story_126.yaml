text.0060: "Это магазин карт Дигимонов."
text.00a0: "Что такое карта Дигимона?"
text.00d4: "Их все собирают.\nС ними не прогадаешь."
text.0146: "Да?"
text.0158: "Для начала дам одну даром.\nХорошая карта."
text.01ca: "Эй! Да на этой карте Я!"
text.0206: "Получена карта {color:6}{tamer}{color:1}!"
text.0236: "Это магазин карт Дигимонов."
text.027e: "Сегодня у нас отличные\nкарты."
text.02da: "Купить карту\nПродать карту\nВыйти"
text.0348: "Набор из трёх\nОдну карту\nВыйти"
text.03a0: "Одну карту\nВыйти"
text.03cc: "Набор стоит 500 Bits.\nЧто внутри — сюрприз."
text.0442: "Куплю\nНет, спасибо"
text.0488: "Открой набор прямо сейчас."
text.04e8: "Хочешь что-то ещё?"
text.0526: "Заходи ещё!"
text.0552: "Это лавка вторсырья."
text.0594: "Обычный предмет\nПереработанный\nВ другой раз"
text.0676: "Эй!?"
text.0690: "Это же магазин!"
