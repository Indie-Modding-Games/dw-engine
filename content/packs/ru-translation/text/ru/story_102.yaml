text.005a: "Увы, ты опоздал\nс записью.\nПодожди ещё год."
text.00f4: "Сейчас турниров нет.\nМне нечем заняться."
text.017c: "Турнир только что закончился.\nПодожди ещё год."
text.01fc: "Ты не насекомое.\nТебе нельзя участвовать."
text.027c: "Хочешь участвовать в турнире?"
text.02c0: "Объяснить\nНе объяснять"
text.02fe: "Двадцать второго числа\nпройдёт турнир только\nдля Дигимонов-насекомых."
text.0390: "На него можно\nзаписаться прямо сейчас."
text.03e6: "Если ты не Дигимон-\nнасекомое, записаться\nна турнир нельзя."
text.047a: "Победителя ждут роскошные\nпризы. Просто запишись."
text.04f4: "Записаться\nНе записываться"
text.0548: "Сейчас турниров нет.\nМне нечем заняться."
text.05d0: "Турнир только что закончился.\nПодожди ещё год."
text.0632: "Ты записан на турнир\n ' - {tournament:pstat=3}- '.\nХочешь отменить запись?"
text.06bc: "Не отменять\nОтменить"
text.0706: "Запись отменена."
text.0726: "Точно хочешь это сделать?"
text.0764: "Я записался."
text.07a2: "Сегодня турнира нет."
text.0806: "Кто не записан,\nтот не может войти."
text.0886: "Ещё закрыто. Запишись\nдвадцать второго, с десяти\nутра до одиннадцати вечера."
text.0950: "Жаль, турнир закончился.\nПриходи в следующем году."
text.0a10: "Жаль.\nЖди следующего года."
text.0a60: "Я получил приз за участие:\n{color:6}Гора мяса {color:1}!"
text.0ac8: "Слишком много вещей.\nНадо что-то выбросить."
text.0b30: "Призовые за победу:\nпять тысяч Bits.\nЕщё мне дали {color:6}Жучий жемчуг {color:1}\nкак приз чемпиона!"
text.0c00: "Слишком много вещей!"
text.0c52: "Призовые за 2-е место:\nдве тысячи Bits!\nЕщё мне дали {color:6}Рогатый шлем {color:1}\nза второе место!"
text.0d22: "Слишком много вещей!"
text.0d6c: "Призовые за 2-е место:\nдве тысячи Bits!\nЕщё мне дали {color:6}Жвалы-ножницы {color:1}\nза второе место!"
text.0e32: "Слишком много вещей!"
text.0ed6: "- Класс D -\nТурнир для Дигимонов\nуровня Новичок\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.0fd4: "- Класс C -\nТурнир для Дигимонов\nуровня Чемпион\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.10d6: "- Класс B -\nТурнир для Дигимонов\nуровня Чемпион\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.11d8: "- Класс A -\nТурнир для Дигимонов\nуровня Ультра\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия: нет."
text.12da: "- Класс S -\nТурнир для самых\nсильных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников.\nНужна победа в Классе A."
text.13d4: "- Класс R -\nКоролевская битва:\nпобеждает тактика\n\nКоролевская битва на 4,\n2 раунда, 8 участников.\nУсловия: нет."
text.1508: "- Кубок Версии 1 -\nБои на время для лучших\nДигимонов Версии 1\n\nБои один на один, 3 раунда,\n8 участников.\nТолько Дигимоны Версии 1."
text.1644: "- Кубок Версии 2 -\nБои на время для лучших\nДигимонов Версии 2\n\nБои один на один, 3 раунда,\n8 участников.\nТолько Дигимоны Версии 2."
text.1780: "- Кубок Версии 3 -\nБои на время для лучших\nДигимонов Версии 3\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны Версии 3."
text.18c8: "- Кубок Версии 4 -\nБои на время для лучших\nДигимонов Версии 4\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны Версии 4."
text.1a0a: "- Кубок Версии 0 -\nБои на время для лучших\nДигимонов не из\nверсий с 1 по 4.\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны не из версий 1-4."
text.1b70: "- Кубок Огня -\nБои на время за титул\nКороля огненных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны огненной природы."
text.1caa: "- Кубок Борьбы -\nБои на время за титул\nКороля боевых искусств\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны-бойцы."
text.1df4: "- Кубок Грома и Ветра -\nБои на время за титул\nКороля Дигимонов неба\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны стихии неба."
text.1f42: "- Кубок Холода -\nБои на время за титул\nКороля холодных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны ледяной природы."
text.2074: "- Кубок Природы -\nБои на время за титул\nКороля Дигимонов природы\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны природы."
text.21c0: "- Кубок Металла -\nБои на время за титул\nКороля Дигимонов-машин\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны-машины."
text.22fa: "- Кубок Грязи -\nБои на время за титул\nКороля грязных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников. Только\nДигимоны грязной природы."
text.2432: "- Кубок Дино -\nБои на время для Дигимонов\nдревней крови\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.2562: "- Кубок Крыльев -\nКрылатые Дигимоны\nмеряются силой\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.2674: "- Кубок Зверей -\nБои на время для Дигимонов\nзвериной крови\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
text.27a8: "- Кубок Людей -\nБои на время для\nчеловекоподобных Дигимонов\n\nБои один на один, 3 раунда,\n8 участников.\nУсловия --  ? ? ?"
