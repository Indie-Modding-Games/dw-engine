text.0020: "Моя рана зажила, и я хочу\nработать. Спасибо, что\nзаботился обо мне."
text.00b6: "Я умею предсказывать\nсудьбу любого существа.\nЭтим я и займусь."
text.013e: "Если интересно, заходи\nко мне в лавку.\nДенег я не возьму."
text.01d6: "Хочешь узнать свою судьбу?\nЛадно, сейчас погляжу."
text.0268: "Хм-м, о... ого!"
text.029a: "Итак, во-первых..."
text.0320: "В целом тебе\nочень везёт."
text.039e: "В целом всё весьма неплохо."
text.0424: "В целом удача средняя."
text.04a4: "В целом удача\nне очень."
text.0532: "В целом всё нехорошо."
text.059c: "Что бы ты ни делал,\nвсё получится."
text.05ea: "Тебе выпадет\nчудесный шанс."
text.0650: "Тебя может ждать\nпамятное событие."
text.069e: "Ты можешь найти\nчто-то неожиданное."
text.06f0: "Ты получишь ответ\nна свой вопрос."
text.073a: "Твой кошелёк потолстеет."
text.077e: "Возможно, друзья\nпринесут хорошие вести."
text.07de: "Тебе полезно сменить\nнастроение."
text.0838: "Сходи туда, где\nобычно не бываешь."
text.0896: "Тебе может присниться\nинтересный сон."
text.08ea: "Постарайся не тратить\nслишком много денег."
text.0936: "Твой секрет может\nраскрыться."
text.097a: "Лучше ложись спать пораньше."
text.09ba: "Береги свои вещи."
text.09f2: "Друг может сорвать\nна тебе злость."
text.0a5c: "На тебя может свалиться\nкуча бед..."
text.0ab8: "Ты можешь встретить того,\nкто тебе не нравится."
text.0b1c: "Тебя может постичь\nбольшая потеря..."
text.0b76: "Твой цвет удачи — красный."
text.0bbe: "Твой цвет удачи — белый."
text.0c0a: "Твой цвет удачи — синий."
text.0c54: "Твой цвет удачи — чёрный."
text.0ca0: "Твой цвет удачи — зелёный."
text.0cec: "Твой цвет удачи — серый."
text.0d36: "Твой цвет удачи — бурый."
text.0d82: "Твой цвет удачи — жёлтый."
text.0dd0: "Твой цвет удачи — фиолетовый."
text.0e1e: "Твой цвет удачи — золотой."
text.0e5c: "И наконец, о твоей\nсовместимости с\n{color:10}{partner}{color:1}..."
text.0ece: "Идеальная пара."
text.0f10: "Очень даже хорошо."
text.0f4a: "Нормально."
text.0f72: "Так себе."
text.0fa0: "Неплохо..."
