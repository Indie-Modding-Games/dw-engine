text.006c: "Ты Дигимон?"
text.00a6: "Ты откуда, братан?!"
text.00e8: "Не смейся надо мной!"
text.0128: "Я тебя слопаю!"
text.01a4: "Ой, если ничего не\nсделать, оно засохнет..."
text.020a: "Хоть бы пошёл дождь..."
text.023e: "Ух ты, интересно.\nОно прорастает."
text.0294: "Оно чуть шевельнулось. Это\nи есть загадочное растение,\nо котором все говорят?"
text.0340: "Оно вянет. Если ничего\nне сделать, оно погибнет."
text.03ac: "Использовать предметы?"
text.03de: "Да\nНет"
text.0410: "У меня сейчас ничего нет."
text.045c: "Ничего полезного у меня нет."
text.04ae: "Так не выйдет..."
text.0800: "Хе-хе-хе."
text.0818: "Привет, я Vegiemon!"
text.084c: "Что! Дигимон-растение?"
text.0880: "Кстати, ты любишь\nовощи?"
text.08d4: "Почему ты спрашиваешь\nпро овощи? Ну так что?"
text.0932: "Люблю\nНе люблю"
text.0966: "Ну, я передумал."
text.09a8: "Кто любит овощи,\nтот хороший парень."
text.0a14: "Нет-нет!\nОвощи — это вкусно!"
text.0a52: " ? ? ? "
text.0a68: "Ладно, я решил.\nЯ пойду с тобой!"
text.0acc: "Вот ведь упрямый...\nЭй, погоди!"
text.0b1e: "Ну, тогда не пойду!\nПока!"
text.0b60: "Да определись уже!"
text.0b8c: "Чего ты от меня хочешь?"
text.0bd0: "Пойдём в город\nи поможешь нам!"
text.0c36: "Ладно, идёт.\nЯ тут слишком засиделся."
text.0cea: "Vegiemon теперь живёт\nв городе!"
