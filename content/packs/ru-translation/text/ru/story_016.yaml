text.0048: "Груун."
text.005a: "Груун.ру.ру.."
text.007e: "Что-то ожило!"
text.00ce: " ? "
text.00dc: "Я раньше жил в городе.\nОт тебя пахнет городом."
text.0156: "Ух ты!"
text.0166: "Страшно подумать. Я ушёл\nиз города и всё забыл."
text.01ca: "Но благодаря тебе\nя всё вспомнил."
text.022a: "Я вернусь в город,\nладно?"
text.0274: "Конечно. Сейчас в городе\nнаверняка веселее,\nчем раньше."
text.02f8: "Правда? Отлично!\nЯ буду стараться!"
text.037c: "Betamon теперь живёт\nв городе!"
text.03c2: "Это моя территория!"
text.0402: "Хе-хе-хе. Отлично!"
text.043c: "Вот увидишь!"
