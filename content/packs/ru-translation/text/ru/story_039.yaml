text.0020: "Я тебе мешаю?"
text.0090: "{color:7}??? {color:1}\nПомогите!"
text.00ca: "Сверху слышен голос.\nТам кто-то есть?"
text.012c: "{color:7}??? {color:1}\nТут кто-нибудь есть?"
text.0162: "Да, есть."
text.018a: "{color:7}??? {color:1}\nПомогите!\nЗемля вспучивается."
text.01e8: "Ты, наверное, шутишь."
text.0222: "{color:7}??? {color:1}\nНет, правда.\nЯ слышу шум каких-то машин."
text.029a: "Машин? Наверное, это из\nлогова Ogremon."
text.0312: "{color:7}??? {color:1}\nНебось ты там что-то\nнапортачил, а?"
text.0386: "Я много чего натворил.\nМожет, это лифт... Вернусь\nв логово и проверю."
text.0442: "{color:7}??? {color:1}\nСпасибо."
