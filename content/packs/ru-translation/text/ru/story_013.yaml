text.0084: "Эй, это ты строишь\nгород?"
text.00d6: "Да."
text.00ea: "Хе, тебе крупно повезло\nвстретить меня."
text.0132: "По мне не скажешь, но я\nДигимон уровня Ультра.\nПобедишь — помогу тебе."
text.01d6: "Принимаю\nНет, спасибо"
text.0258: "Ух ты, я проиграл! Ну,\nувидимся в городе."
text.02f0: "Piximon теперь живёт в городе!"
text.033a: "Эх, ну и трусишка!\nЕщё встретимся!"
text.03c0: "О, сеньорита!"
text.03f0: "Эй, амиго, как дела?"
text.0430: "Вуки, вуки!"
text.0460: "А?"
