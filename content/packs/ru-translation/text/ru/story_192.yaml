text.0032: "Время пришло."
text.005e: "Я бы остался, но мама\nбудет волноваться."
text.00b6: "Спасибо, {color:6}{tamer}{color:1}.\nЖаль, не могу отплатить."
text.010e: "{color:7}Tokomon {color:1}\nНе забывай нас!"
text.014c: "Мы ещё увидимся.\nЯ точно знаю."
text.01c0: "Мне было здорово. Спасибо."
text.01fa: "Надо устроить\nпрощальный праздник."
text.0258: "{color:10}{partner}{color:1}, наше\nприключение было чудесным!"
