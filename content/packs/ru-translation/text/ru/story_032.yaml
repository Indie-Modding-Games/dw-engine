text.007e: "Эй, скоро откроется!"
text.00e6: "Мы так этого ждали!\nТуннель открыт!"
text.014e: "Больше не надо ходить\nчерез гору. Спасибо."
text.01c2: "Спасибо. Один я бы\nне сдвинул ту скалу."
text.0234: "Что же мне теперь делать?"
text.026e: "Приходи в город.\nТам найдётся дело!"
text.02e6: "Сил у меня ещё много.\nС радостью соглашаюсь."
text.0362: "Скоро откроется!"
text.03dc: "Drimogemon теперь живёт\nв городе!"
