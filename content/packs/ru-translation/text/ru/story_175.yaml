text.0050: "Добро пожаловать в ресторан!"
text.0088: "Я решил стать\nхозяином и шеф-поваром\nэтого ресторана."
text.0104: "Угощайся моей огненной\nкухней сколько хочешь."
text.0180: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nне хотите отведать\nдомашней кухни?"
text.01d6: "Это не какие-то предметы,\nа настоящая кухня. Мой\nтайный талант."
text.027c: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nЯ решил зарабатывать\nготовкой. У меня талант!"
text.02f6: "Приходи как-нибудь\nотдохнуть и поесть\nв моём ресторане."
text.037e: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}.\nМой ресторан наконец\nоткрыт!"
text.03d4: "Попробуй ледяной десерт!\nЭто моё фирменное блюдо."
text.044a: "{color:6}{tamer}{color:1}, я решил\nработать поваром\nв этом ресторане."
text.04c2: "Здесь можно\nпоесть горячего."
text.0520: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nтеперь я настоящий повар!"
text.0572: "Хочешь попробовать мою\nстряпню — приходи\nс утра!"
text.0614: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nЯ решил зарабатывать\nготовкой. У меня талант!"
text.068e: "Моё особое блюдо можно\nпоесть рано утром\nи посреди ночи."
text.0750: "Эй, {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
text.0770: "Я решил помогать\nэтому ресторану.\nМне доверили десерты."
text.07ee: "Я очень горжусь\nсвоим десертом.\nОбязательно попробуй, ладно?"
text.08a8: "Ого! Эй, {color:6}{tamer}{color:1}!\nА эта машина зачем?"
text.08fa: "Не бойся! Это музыкальный\nавтомат, от него сердце\nтак и скачет! Ура!"
text.098a: "Давай танцуй!\nОторвись! Жду\nтвой заказ!"
