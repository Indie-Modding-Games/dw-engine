text.0034: "{color:5}Тренировка: Толкай лёд {color:1}"
text.0068: "Начать\nОбъяснить\nВыйти"
text.009e: "Обычная\nДоп. попытка\nВыйти"
text.00da: "Толкать лёд — растить силу."
text.011c: "Сильно повышает макс. HP.\nЗащита тоже\nрастёт."
text.0198: "Ещё раз объяснить\nНачать\nВыйти"
text.01f2: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}и собери\nтри картинки."
text.0274: "{color:5}Тренировка: Сосульки {color:1}"
text.02aa: "Начать\nОбъяснить\nВыйти"
text.02e2: "Обычная\nДоп. попытка\nВыйти"
text.0320: "Учись ловить\nбольшую сосульку."
text.0364: "Сильно повышает\nЗащиту.\nСкорость тоже растёт."
text.03e4: "Ещё раз объяснить\nНачать\nВыйти"
text.043e: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки"
