text.004e: "Ах!"
text.006a: "Ах!"
text.0096: "Это лифт поднимает\nземлю?"
text.0102: "Войти\nНе входить"
text.0190: "Эй!"
text.01b0: "Что?"
text.01c0: "Пришёл сюда проиграть?"
text.0208: "Это я должен сказать!"
text.0232: "В этот раз я не сдержусь.\nТы у меня заплачешь!"
text.02d6: "Ух ты!"
text.02e6: "Ой, нет!"
text.0312: "Вот досада!"
text.03b6: "Что такое?"
text.0460: "Пока, балбесы!"
text.0496: "Эх, он сбежал!"
text.04de: "Там лифт для побега.\nГнаться за ним бесполезно."
text.05a8: "Ты кто?"
text.05c8: "Кто я? А ты кто?"
text.0672: "Я получил {color:4}Брелок\nизмерений{color:1}!\nВлезет двадцать предметов!"
text.0722: "Я получил {color:4}Брелок\nизмерений{color:1}!\nВлезет тридцать предметов!"
