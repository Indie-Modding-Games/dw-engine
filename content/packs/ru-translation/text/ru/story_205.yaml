text.0010: "Какую лавку ты хочешь?"
text.004c: "Клиника\nКладоискатель\nПредсказатель"
text.00aa: "Я сделал здесь больницу."
text.0100: "Ему нездоровится,\nда? Тебе надо следить\nза его здоровьем!"
text.018c: "Давай я его сразу вылечу.\nСо скидкой это будет\nстоить 300 Bits."
text.0242: "Не хватает Bits?!\nПлати, сколько можешь.\nКопи деньги на чёрный день."
text.02f6: "Теперь всё в порядке.\nВпредь будь осторожнее."
text.0364: "Он не болен и не ранен.\nЧто тебе нужно?"
text.03d0: "Осмотреть его\nПродай лекарство\nНичего"
text.042c: "Хорошо, посмотрим,\nкак там {color:10}{partner}{color:1}."
text.048a: "Ох. У {color:10}{partner}{color:1} опасно\nвысокая усталость.\nЕму срочно нужен отдых!"
text.0540: "{color:10}{partner}{color:1} слишком\nустал. Ему надо отдохнуть,\nпока не поздно."
text.05da: "{color:10}{partner}{color:1}, кажется,\nнемного устал. Не стоит\nему так перенапрягаться."
text.0664: "{color:10}{partner}{color:1} в порядке, но\nусталость может навредить\nпо-всякому. Будь осторожен."
text.06fe: "Ну, как он себя чувствует?"
text.0742: "{color:10}{partner}{color:1} полностью\nрасслаблен. Он проживёт\nдолгую жизнь."
text.07da: "{color:10}{partner}{color:1} в отличном\nнастроении. Это признак\nздорового образа жизни."
text.0880: "{color:10}{partner}{color:1} очень\nрасслаблен. С ним\nслучилось что-то хорошее?"
text.0918: "Не думаю, что у\n{color:10}{partner}{color:1} сильный стресс.\nСкажу так: всё нормально."
text.09be: "У {color:10}{partner}{color:1} небольшой\nстресс. Тренируй его\nполегче."
text.0a40: "У {color:10}{partner}{color:1} много стресса.\nЕму нужно развлечься."
text.0aac: "У {color:10}{partner}{color:1} сильный стресс,\nон несчастен. Не стоит\nему так перенапрягаться."
text.0b4e: "У {color:10}{partner}{color:1} огромный\nстресс! Если так пойдёт и\nдальше, он долго не проживёт!"
text.0be4: "Хм-м.... Это всё, что я\nмогу сделать для\n{color:10}{partner}{color:1}."
text.0c40: "Тебе ещё что-нибудь\nот меня нужно?"
text.0c8e: "Осмотреть его\nПродай лекарство\nНичего"
text.0cee: "Хм-м, с ним всё должно\nбыть хорошо."
text.0d26: "Бинт:      400 Bits\nЛекарство: 1200 Bits\nНичего не покупать"
text.0dca: "Если ему станет плохо,\nсразу приходи ко мне."
text.0e50: "У тебя слишком много вещей."
text.0ea8: "У тебя не хватает Bits.\nНе могу это продать."
text.0f28: "У тебя слишком много вещей."
text.0f80: "У тебя не хватает Bits.\nНе могу это продать."
text.0fee: "Тебе ещё что-нибудь\nот меня нужно?"
text.103c: "Осмотреть его\nПродай лекарство\nНичего"
text.109c: "Я сменил работу и стал\nкладоискателем."
text.1112: "Хочешь заказать поиск\nсокровищ? Или тебе\nнужна информация?"
text.11ac: "Расскажи\nНе надо\nНеважно"
text.121c: "Есть два плана: у них\nразные сроки и цены."
text.128e: "Обычный: 3 дня, 1000 Bits\nОсобый: 10 дней, 5000 Bits"
text.130a: "С Особым планом больше\nшансов найти сокровище\nполучше."
text.139e: "Вот и всё.\nНу, что будешь делать?"
text.13fe: "Ещё раз объяснить\nИскать сокровища\nНичего"
text.145a: "Выбирай план!"
text.147e: "Обычный: 3 дня, 1000 Bits\nОсобый: 10 дней, 5000 Bits\nОтмена"
text.1518: "Ладно, тогда пока."
text.1564: "Хорошо, результат будет\nчерез три дня. Пожелай\nмне удачи."
text.1602: "Хорошо, результат будет\nчерез три дня. Пожелай\nмне удачи."
text.1680: "У тебя не хватает Bits.\nДля поиска сокровищ\nнужны деньги."
text.1734: "{color:7}Табличка {color:1}\nЯ сейчас ищу сокровища.\nПодожди немного.\nDrimogemon."
text.17d6: "Знаешь что?\nМы нашли сокровище."
text.1976: "Освободи место в сумке!"
text.19aa: "Получено: {color:6}{item:pstat=110}{color:1}!"
text.1af2: "Спасибо за заказ!"
