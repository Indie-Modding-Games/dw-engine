text.009a: "Охраны нет!"
text.00f8: "Здесь не пройти."
text.0136: "Здесь не пройти."
text.01dc: "......"
text.01f0: "Ой, он на нас уставился!\nМожет, он что-то\nподозревает."
text.0266: "Давай спрячемся от них,\nподождём и вернёмся.\nСейчас двенадцать часов."
text.030e: "Наверное, эта фабрика\nсливает отходы в\nканализацию. Надо узнать."
text.03d4: "Подвинься, пожалуйста."
text.0412: "Здесь нельзя пройти без\nпропуска, выданного\nначальством."
text.04a8: "Я тороплюсь."
text.04ce: "Извини, нужен\nпропуск."
text.051c: "Ладно, раз уж\nтак."
text.0580: "Ну, и что будем делать?"
text.05b4: "Пересменка!\nПропусти, а то...\nНет, ничего"
text.0636: "Ещё не время\nдля пересменки."
text.0694: "Ничего, не беспокойся.\nА когда пересменка?"
text.0704: "Нет, мы строго\nсоблюдаем время."
text.075e: "Пересменка бывает\nв полночь и в полдень."
text.07bc: "А, понятно."
text.07e2: "Угрозами ты ничего не\nдобьёшься. Нужен пропуск."
text.084a: "Пропуск? Есть у меня.\nЯ тебе разрешаю!"
text.08bc: "Мы не можем дать тебе\nпропуск. Всё надо делать\nпо правилам."
text.0944: "Ну вы и строгие!"
text.097c: "Ещё не пересменка?"
text.09b8: "..."
text.09c6: "Ой, он на нас уставился!\nПохоже, смены\nне будет."
text.0a42: "Вернёмся попозже.\nМожет, спрятаться\nи подождать."
text.0aca: "Бопи бопи пуууу."
text.0b02: "Геба геба!"
text.0b2c: "Бубьё?"
text.0b50: "Я доволен!"
text.0b82: "Это часть моей работы."
text.0bc6: "В чём дело?"
