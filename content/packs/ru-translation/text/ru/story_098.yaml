text.004e: "Может, тебе пора домой?"
text.0090: "Иди домой!"
text.00b6: "Лучше возвращайся!"
text.010c: "Ой, как слепит!"
text.014c: "{color:7}??? mon {color:1}\nИщущий моей помощи, твой\nчас настал! Дарую тебе\nблагословение моих крыл!"
text.0206: "Что за..? Где..?\nЧей это голос..?"
text.0252: "Агх!"
text.0274: "Что это было? Свет погас.\nБольше тут ничего нет.\nЗначит, оно наверху?!"
