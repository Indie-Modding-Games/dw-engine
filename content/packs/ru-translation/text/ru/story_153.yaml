text.0010: "Я тебя ждал!"
text.0044: "Ты приходишь\nв себя?"
text.0092: "Мне что-то\nнемного не по себе."
text.00d8: "Эй,\nэто серьёзно, понимаешь?"
text.011e: "Фабрика сейчас закрыта, так\nчто у меня куча времени.\nЯ тебе помогу!"
text.01b0: "В себя он пришёл, но\nвыглядит всё равно чокнутым!\n? всё равно чокнутым!"
text.024c: "Ну, извиииините!\nДо скорого!"
text.02d6: "Giromon теперь живёт\nв городе!"
