text.0022: "Похоже, {color:10}{partner}{color:1}\nугас..."
text.0064: "Перед тем как угаснуть, он\nоставил Дигияйцо. Он родится\nвновь со своими силами."
text.0116: "Какое яйцо ты хочешь?"
text.0158: "Можешь сменить имя\n{color:10}{partner}{color:1}, если хочешь."
text.01b0: "Новое имя\nОставить имя"
text.0214: "Имя {color:10}{partner}{color:1} подходит?"
text.0234: "Другое имя\nПодходит"
text.02a0: "Эй, не болей!"
text.02ce: "С последней каплей жизни\n{color:10}{partner}{color:1} сумел\nвыжить."
text.0346: "Будь осторожен."
text.0384: "Ох, батюшки!\nТы вернулся после поражения."
text.03d4: "С последней каплей жизни\n{color:10}{partner}{color:1} сумел\nвыжить."
text.044c: "Возможно, твои вещи украли."
text.048e: "У проигравших в бою\nмогут украсть вещи."
text.0502: "Краденое могут где-то\nпродавать. Не сдавайся,\nищи его!"
text.059e: "О нет! У {color:10}{partner}{color:1}\nне осталось жизни."
text.05de: "Перед тем как угаснуть,\n{color:10}{partner}{color:1}\nоставил Дигияйцо."
text.0646: "Из-за опасности Дигияйцо\nунаследовало не все\nспособности..."
text.06d8: "{color:4}Уровень укротителя\nпонизился! {color:1}"
text.0726: "Если хочешь,\nможешь сменить имя\n{color:10}{partner}{color:1}."
text.0780: "Новое имя\nОставить имя"
text.0872: "{color:10}{partner}{color:1} дигиэволюционировал!"
text.08be: "{color:10}{partner}{color:1} дигиэволюционировал!"
text.090a: "{color:10}{partner}{color:1} дигиэволюционировал!"
