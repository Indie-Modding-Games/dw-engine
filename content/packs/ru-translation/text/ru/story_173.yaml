text.0030: "Отдыхай как можно больше.\nЭто залог здоровья\nтвоего Дигимона."
text.00ca: "Ладно. Расскажу, как\nгород будет расти\nи процветать..."
text.014c: "Когда в город приходит\nНовичок, это плюс\nодно очко."
text.01cc: "А когда приходит Чемпион,\nэто плюс два очка."
text.025a: "Если приходит Ультра,\nэто плюс три очка."
text.02da: "Но есть три Чемпиона,\nот которых мало\nпользы."
text.0366: "Когда приходит один из них,\nэто лишь плюс одно очко."
text.03de: "Расскажу тебе немного\nо типах."
text.0436: "Если соперник того же типа,\nчто и твой напарник,\nон может не драться."
text.04d2: "А если тип твоего Дигимона\nне подходит, его могут\nне пустить в дверь."
text.056c: "В остальном, пожалуй,\nможно не волноваться."
text.05f2: "Расскажу тебе об\nуровне укротителя."
text.063c: "Уровень укротителя растёт,\nесли вырастить Дигимона\nдо Ультра."
text.06d0: "А победа в турнире\nвысокого уровня —\nэто очень хорошо."
text.075c: "Он будет расти сам.\nНе стоит об этом\nсильно переживать."
text.07e8: "С другой стороны,\nследи, чтобы он\nне падал."
text.0874: "Если твой Дигимон исчезнет,\nуровень укротителя\nточно упадёт."
text.0900: "Если часто допускать\nошибки ухода, он может\nупасть. Будь осторожен."
