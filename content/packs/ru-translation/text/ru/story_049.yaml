text.004a: "Привет. Я тебя раньше\nне видел. Ты откуда?"
text.00c2: "Из города. Вообще-то я\nиз другого мира."
text.0120: "Ты понимаешь мой язык?"
text.015e: "Да, понимаю."
text.017a: "Бывает трудно, и продаю\nя здесь немного."
text.01e0: "Понятно."
text.01f4: "Покупатели почти не ходят."
text.0236: "Наверное, из-за бед\nна острове."
text.0288: "Помоги мне кое с чем."
text.02ba: "С чем?"
text.02d8: "Поработаешь в моей лавке?"
text.0310: "В твоей лавке?"
text.032c: "Полдня? Чем больше продашь,\nтем больше заплачу.\nТы ведь знаешь наш язык."
text.03c8: "Ты можешь прогореть."
text.03fa: "Не бойся. Мне это на пользу.\nКак насчёт восьми часов?"
text.0474: "Попробую\nНет, спасибо"
text.05fa: "Жаль. Приходи,\nкогда будет время."
text.065e: "Хочешь поработать?"
text.06b2: "Ну вот, полдела сделано.\n "
text.0750: "Так мы ничего не заработаем.\nПостарайся получше.\n "
text.07e2: "Торговля идёт хорошо.\nМожно кое-что заработать."
text.084a: "Давно у меня не было\nстолько покупателей.\nТак держать!"
text.08d8: "Похоже, пора.\nСпасибо за работу."
text.0944: "Могло быть и лучше,\nно вышло неплохо.\nНе сдавайся."
text.09d4: "Я заработал пятьсот Bits!"
text.0a22: "Ты можешь лучше.\nПоработай ещё."
text.0a86: "Я заработал 1500 Bits!"
text.0ace: "Твой ум, характер и смелость —\nвот что нужно, чтобы\nспасти этот остров."
text.0b60: "О чём ты говоришь?"
text.0b9e: "Я проверял, сможешь ли\nты нас спасти."
text.0c18: "Важно хорошо\nсражаться."
text.0c68: "Но кроме силы нужны\nещё смелость и ум."
text.0cd4: "Мы прошли проверку?"
text.0d06: "Да. Я помогу тебе\nчем только смогу."
text.0d56: "Ты переедешь в город?\nА что будет\nс лавкой?"
text.0dd2: "Лавку я открою и потом.\nЭта своё дело сделала."
text.0e42: "Monochromon теперь живёт\nв городе!"
text.0e7e: "Я заработал две тысячи Bits!"
