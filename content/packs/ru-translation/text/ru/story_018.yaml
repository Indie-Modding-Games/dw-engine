text.027a: "Тревога! Нарушитель!"
text.02a2: "Тревога! Нарушитель!"
text.02ca: "Стреляю!"
text.0346: "Ты цел, {color:10}{partner}{color:1}?!"
text.0376: "Пойдём обратно."
text.03b2: "Ой-ой! Надо привести\nв чувство {color:10}{partner}{color:1}."
text.131c: " !!! "
text.1364: "Поразительно, что ты\nпрошёл через лес!"
text.13cc: "Я Centarumon.\nПрости за то, что было."
text.1426: "Я испытал тебя не ради\nзабавы. Хочу помогать тебе."
text.149a: "Иди. А я буду ждать\nтебя в городе."
text.1536: "Centarumon теперь живёт\nв городе!"
text.1584: "{color:10}{partner}{color:1}, похоже,\nмы становимся знаменитыми!"
text.15e2: "Так держать!"
