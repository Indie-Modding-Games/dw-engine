text.001e: "{color:6}{tamer}{color:1}, у тебя получилось!"
text.0044: "Agumon пришёл в город.\nОн открыл своё дело\nвон там."
text.00be: "Хорошо бы и другие\nДигимоны были как он!"
text.012c: "Пришёл Palmon. Он хочет\nрасширить мясное поле."
text.019c: "Тогда у нас будет много мяса!"
text.01f4: "Пришёл Kunemon. Он хочет\nпоедать траву."
text.024e: "Надеюсь, он съест сорняки!"
text.02a2: "Пришёл Centarumon. Он хочет\nоткрыть клинику."
text.0310: "Больше не надо бояться\nболезней и ран!"
text.0386: "Пришёл Coelamon. Он хочет\nоткрыть магазин."
text.03ec: "Город будет процветать!"
text.0438: "Пришёл Betamon и сказал,\nчто хочет открыть магазин."
text.04a8: "Город будет процветать!"
text.04f4: "Пришёл Bakemon и сказал\nчто-то непонятное."
text.056c: "Ну да ладно, ничего."
text.05b6: "Пришёл Vegiemon. Он хочет\nещё расширить мясное поле."
text.0632: "Больше никаких забот о еде."
text.0686: "Пришёл Tyrannomon и сказал,\nчто готовит лучше всех."
text.06f8: "Что ж, в этом что-то есть."
text.0746: "Пришёл Meramon и сказал,\nчто он главный по огню."
text.07c0: "Он так и пылает задором!"
text.0816: "Пришёл Frigimon и что-то\nговорил про сладости."
text.0882: "Я люблю сладости."
text.08bc: "Пришёл Garurumon и сказал,\nчто умеет готовить."
text.091e: "Он весьма умелый."
text.0964: "Пришёл Birdramon и сказал,\nчто будет посыльным."
text.09c4: "Звучит неплохо."
text.09fa: "Пришёл Shellmon и сказал,\nчто поставит доски объявлений."
text.0a70: "Шаг к информационному\nобществу!"
text.0ada: "Пришёл Elecmon. Он\nпроведёт электричество."
text.0b46: "Надеюсь, в городе станет\nсветло."
text.0b9c: "Пришёл Kokatorimon и\nговорил о постройке статуи."
text.0c10: "Место, где можно отдохнуть."
text.0c66: "Monochromon пришёл\nи хочет управлять\nМагазином предметов.{stop}"
text.0d08: "Он настоящий профи."
text.0d4e: "Пришёл Unimon и сказал, что\nхочет помогать в делах."
text.0dc4: "Хороший настрой."
text.0e12: "Пришёл Patamon и спросил\nпро интересную работу."
text.0e78: "Я посоветовал ему\nМагазин предметов."
text.0ec8: "Пришёл Biyomon и спросил,\nкакую работу я посоветую."
text.0f3c: "Я посоветовал ему\nМагазин предметов."
text.0f8c: "Пришёл Greymon и говорил\nо постройке арены."
text.0ff2: "Я очень хочу\nэто увидеть."
text.104c: "Пришёл Penguinmon\nи говорил о постройке\nстадиона для кёрлинга."
text.10ca: "У нас всё больше\nразнообразия."
text.1120: "Пришёл Angemon и говорил\nо записи\nразговоров."
text.1194: "Он где-то рядом."
text.11ce: "Пришёл Drimogemon и\nговорил, что хочет искать\nсокровища всерьёз."
text.1270: "Большое дело!"
text.12a2: "Пришёл Gabumon и говорил,\nчто не может решить,\nчем заняться."
text.1334: "Я сказал ему выбрать\nдело с размахом."
text.13a0: "Пришёл Ninjamon и\nговорил о тренировках."
text.1400: "Приятно видеть трудяг."
text.145a: "Пришёл Whamon и сказал,\nчто готов работать\nпаромом."
text.14e0: "Здорово!"
text.150a: "Пришёл Mojyamon и говорил,\nчто откроет\nЛавку всего."
text.1586: "Хотя что-то в ней\nне так."
text.15f4: "Пришёл Mamemon и говорил\nпро продажу ценностей."
text.166a: "Интересно, что значит\n«ценности»?"
text.16c8: "Пришёл Numemon и говорил,\nчто откроет магазин.\nНо это секрет."
text.1752: "Уже не секрет."
text.17a0: "Пришёл Kabuterimon и говорил\nпро тренировки и ремонт."
text.181e: "Он пошёл в Зелёный спортзал?"
text.1872: "Пришёл Kuwagamon и спросил,\nгде Kabuterimon."
text.18d8: "Куда же он делся?"
text.1916: "Пришёл Giromon и сказал:\nделай заказ!"
text.1976: "Так что делай заказ."
text.19b8: "Пришёл Ogremon и попросил\nкупить его руку."
text.1a1c: "Глаза у него так и сверкали!"
text.1a66: "Пришёл Leomon и много\nспрашивал о городе."
text.1acc: "Похоже, Патруль Саванны\nвсё ещё в деле!"
text.1b40: "Пришёл Piximon и спросил:\n«Дедушка, хочешь\nсекретный предмет?»"
text.1bca: "Он меня беспокоит."
text.1c04: "Пришёл Etemon и говорил,\nчто откроет крутой магазин."
text.1c70: "Звучит подозрительно."
text.1cb2: "Пришёл MetalMamemon и\nспросил, нет ли работы, чтобы\nсоревноваться с {color:6}{tamer}{color:1}."
text.1d4e: "Вот это боевой дух."
text.1da4: "Пришёл Vademon и...\nпостой, а он приходил?"
text.1dfc: "Что-то не могу вспомнить."
text.1e4c: "Пришёл MetalGreymon\nи говорил о работе моделью"
text.1eb2: "Много о себе возомнил!"
text.1efc: "Nanimon пришёл и ушёл."
text.1f38: "Интересно, где он?"
text.1f80: "Пришёл Monzaemon, вернее,\nвдруг появилась его\nпустая оболочка."
text.2012: "Он решил оставить её дома."
text.206e: "Пришёл Devimon и говорил\nо чудесном предмете."
text.20e4: "Наверное, и правда чудесный."
text.2130: "Airdramon поправился\nи говорил о работе."
text.219a: "Хорошо, что он снова в норме."
text.21f4: "Пришёл Digitamamon и умчался\nсо скоростью света."
text.2264: "Он всё ещё где-то\nв городе."
text.22c4: "Пришёл SkullGreymon и\nсказал, что будет биться\nна арене."
text.233e: "Myotismon был переводчиком."
text.2396: "Пришёл Andromon и сказал,\nчто рад знакомству."
text.23fa: "Похоже, он не может\nзадержаться надолго."
