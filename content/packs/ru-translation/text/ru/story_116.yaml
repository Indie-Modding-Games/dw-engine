text.0062: "Ух ты!"
text.0080: "Хм-м-м."
text.00a0: "Э-э, давай закончим."
text.00e6: "Нам пока нельзя\nтерять бдительность."
text.013c: "...!"
text.0180: "Нет, не хочу!\nНе хочу драться!"
text.01de: "Если не хочешь драться,\nто убегай."
text.023a: "Очень жаль."
text.0268: "Я тебя не понимаю."
text.029c: "Ну что ж, может, переедешь\nк нам в город? Лучше,\nчем прятаться тут."
text.032e: "Э-э, в город?"
text.0350: "Мы не будем тебя\nзаставлять."
text.0394: "Вот теперь мне хочется туда.\nЛадно, иду!"
text.0426: "Gabumon теперь живёт в городе!"
text.0464: "Какой странный тип."
