text.0036: "Сейчас я тебя поймаю!"
text.0070: "Ах вот как!"
text.00ce: "Ты кто?"
text.00ee: "Я пришёл помочь\nЯ ещё не готов..."
text.0158: "Тут кто-нибудь есть?"
text.018c: "Ты не видишь?"
text.01b4: "Я Whamon. Обычно\nя живу в море."
text.0206: "Глаз у меня нет, но\nя почти всё чувствую."
text.026c: "Я человек. Меня зовут\n{color:6}{tamer}{color:1}."
text.02a6: "А это {color:10}{partner}{color:1},\nмой напарник, он {digimon:pstat=103}."
text.02f6: "Я чувствую большую силу."
text.0330: "Выслушаешь мою историю?\nНеподалёку на пляже есть\nпещера, где я отдыхаю."
text.03c8: "Но злые типы меня выгнали,\nи там осталось моё\nсамое ценное сокровище."
text.046a: "Злые типы, говоришь?\nНе нравится мне это."
text.04bc: "Прошу, прогони их.\nПомоги мне вернуть\nпещеру."
text.0540: "Я помогу\nСейчас не могу"
text.0592: "Понятно."
text.05ae: "Тогда садись мне на спину."
text.06c0: "Поехали."
