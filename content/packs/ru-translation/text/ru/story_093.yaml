text.0066: "Ух ты, прямо как живая!"
text.0096: "Она двигается, когда\nдвигаемся мы. Стой!"
text.0144: "Что такое, {color:10}{partner}{color:1}?\nНашёл что-нибудь?"
text.01a0: "Ух ты, молодец,\n{color:10}{partner}{color:1}!"
text.0202: "О? Насчёт этой статуи..."
text.024e: "Ах!"
text.0272: "Уф, ну что ж"
text.028e: "Ты ожил.\nОтлично!"
text.02d4: "Я Angemon, ангел, что\nхранит тебя. Я пробудился,\nдабы исполнить свой долг."
text.036a: "О чём это он...?"
text.03a8: "Мне ведома истина небес."
text.03e4: "Вверяю душу свою\nземным наставлениям."
text.044a: "О чём это он...?\nТы придёшь в город?"
text.04c0: "Миссия твоя — долг мой.\nГряду."
text.050a: "Прости, а можно\nговорить попонятнее?"
text.0578: "Я пойду в город, а ты\nпродолжай стараться."
text.05da: "Понятно. Спасибо!"
text.0636: "Angemon теперь живёт\nв городе!"
