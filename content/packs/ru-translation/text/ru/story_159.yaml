text.0082: "Опять ты! Убирайся отсюда!"
text.00c8: "Э-э..."
text.00e0: "Ты... ты просто вредитель!\nТеперь доволен?!"
text.0154: "Опять ты! Убирайся отсюда\nсейчас же!"
text.01ba: "Рад видеть вас, друзья.\nЕсли хотите жить здесь,\nя разрешаю."
text.0260: "Хотим жить тут\nХотим вернуться"
text.02c6: "Хм, вот и славно. Что?\nНо ты же аналоговый,\nтебе здесь жить нельзя."
text.0356: "Мы должны быть вместе!"
text.038c: "Тогда убирайся отсюда\nвместе с ним!"
text.03de: "Что? Ты о чём?"
text.0422: "Он не всегда был Sukamon.\nКороль, прошу, верни ему\nпрежний облик!"
text.04c2: "Разве не здорово, что\nон стал Sukamon?"
text.0516: "Нет, сейчас это совсем\nне здорово. Прошу тебя."
text.0570: "Чтобы стать Sukamon, нужно\nочень постараться."
text.05cc: "Он стал Sukamon\nбез всяких стараний,\nвот в чём беда."
text.0642: "Ну вы даёте!"
text.06aa: "Ура! Король, спасибо!"
text.06e0: "Убирайся отсюда сейчас же!"
text.072c: "Вы пришли сюда\nпо делу?"
text.0774: "Ну..."
text.078a: "Если у вас просьба, то\nзабудьте. Ведь я —\nКороль Sukamon!"
text.0810: "Похоже, его в город\nпозвать не получится."
text.0890: "Я и сам собираю\nкарты Дигимонов."
text.08e0: "Мне очень нужна карта\nКороля Sukamon. Сменяешь\nна мою карту Etemon?"
text.0986: "Обменять\nНе обменивать"
text.09ba: "Прости, но у меня её нет."
text.0a02: "Ну и вонь! Это что,\nсвалка?"
text.0a4c: "Не знал, что в мире\nДигимонов такая есть."
text.0aca: "Рад, что вы пришли.\nМы рады новым друзьям."
text.0b26: "Это поселение племени\nSukamon?"
text.0b82: "Именно. Это рай для\nплемени Sukamon, и зовётся\nон Пыльное королевство."
text.0c20: "Здесь живёт и Король Sukamon."
text.0c62: "Король Sukamon...?"
text.0c90: "Король Sukamon потрясающий!\nЕсли его не слушаться,\nон тебя дигиэволюционирует!"
text.0d32: "То есть мы превратимся\nв кого-то, кроме Sukamon?"
text.0d9e: "То есть мы вернёмся\nв прежний облик?!"
text.0dfc: "Ага, это страшно. Жуть."
text.0e36: "Я узнал кое-что полезное..."
text.0ea2: "О, Sukamon?!"
text.0ec4: "А? Ты меня знаешь?"
text.0f00: "Ну, вроде того.\nНам и Sukamon нужно\nпозвать в город?"
text.0f92: "Ого, как интересно!\nНикогда такого\nне видел!"
text.1014: "Батюшки! Какашки\nдвигаются и говорят!"
text.107c: "Ты обо мне?\nЯ Sukamon...\nДигимон-мутант."
text.1100: "Так ты не какашка?"
text.112a: "В каком-то смысле ты прав:\nмы сделаны из\nцифрового мусора."
text.11aa: "Может, его тоже позвать\nв город? Не стоит\nсудить предвзято."
text.1240: "Ты собираешься\nжить здесь?"
text.1284: "Что? Я об этом\nне думал."
text.12ca: "Видишь ли, это рай только\nдля племени Sukamon.\nДругим здесь жить нельзя."
text.136a: "Значит, вы не можете\nжить в других местах?"
text.13ba: "Конечно, нет!\nА ты как думал?"
text.1404: "Понятно. Так я\nи думал."
text.1446: "Жить тут тебе нельзя,\nно осмотреться\nможешь."
text.14be: "А, только посмотреть. Ладно."
text.14f2: "Кстати, никогда\nне зли Короля."
text.1552: "Король своим приёмом\nдигиэволюции превратит\nтебя во что-то жалкое."
text.1610: "Эй, у тебя слишком много\nкарт Etemon!\nНе делай этого."
text.167c: "О, спасибо!"
text.16bc: "Эй, вы ведь из...\nкак его там... города?"
text.172e: "Это только между нами.\nМне немножко\nинтересно."
text.17ae: "Как-нибудь я к вам\nтуда загляну."
text.17fe: "Эй, вы знаете особый\nприём племени\nSukamon?"
text.187e: "Мы впитываем телом какашки\nс земли и превращаем\nих в энергию!"
text.1916: "А? Это Пыльное королевство.\nЗнаю, для тебя это\nпросто свалка."
text.19a4: "Но тут может найтись что-то\nполезное. Я видел вон там\nчто-то длинное, вроде палки."
text.1a4c: "Ого, это\n{color:6}Стар. удочка{color:1}!"
text.1aba: " {color:5}Тренировка: В мусоре {color:1}"
text.1af6: "Начать\nОбъяснить\nВыйти"
text.1b2e: "Обычная\nДоп. попытка\nВыйти"
text.1b6c: "Тренировка духа: сидишь\nв грязном мусоре.\nМакс. MP сильно растёт."
text.1c0e: "Ещё раз объяснить\nНачать\nВыйти"
text.1c68: " {color:7}Игровой автомат {color:1}\nНажимай {color:6}△ {color:1}\nи собери три картинки."
