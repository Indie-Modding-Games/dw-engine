text.006e: "Сегодня твой последний день."
text.00b2: "Не стой у меня за спиной!"
text.00f4: "Раз уж ты видел моё лицо..."
text.0142: "Я не имею права на ошибку!"
text.0186: "Извини, но ты проиграешь!"
text.01d2: "Я не дам тебе сбежать!"
text.0216: "Ни за что, я не проиграю!"
text.0262: "С тобой покончено!"
