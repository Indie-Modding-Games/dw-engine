text.002e: "!"
text.005e: "Ты {color:6}{tamer}{color:1}?"
text.007e: "Дигимон-скелет?!"
text.00ac: "Ты {color:10}{partner}{color:1}?"
text.00cc: "Я не чувствую в нём жизни,\nтолько зло."
text.0126: "Неужели он что-то\nсделал с Myotismon?!"
text.0188: "Если не скажешь...\nя нападу!"
text.0208: "Я нападу!"
text.0242: "Надо скорее спасать\nMyotismon!"
