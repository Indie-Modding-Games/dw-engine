text.0034: "Я с тобой разберусь!"
text.006a: "Я с тобой разберусь!"
text.00a0: "Я с тобой разберусь!"
text.0102: "Что там написано?"
text.012c: "Вернись туда, где\nглупыш дал тебе\nочки."
text.01d8: "Я использовал {color:6}\nключ от холодильника. {color:1}"
text.0234: "Не вижу."
text.025e: "Тут записка."
text.0284: "Вернись туда, где\nглупыш дал тебе\nочки."
text.0310: "Пожалуй, стоит её послушать."
text.036a: "Это холодильник."
text.039a: "Он заперт. Ни разу не видел\nхолодильник с замком."
