text.0058: "Эй!"
text.0076: "Ха-а-а!"
text.0098: "Ух ты!"
text.00bc: "Восток: лифт\nЗапад: Опасно!!\nОсторожно, обрыв."
text.012e: "Режим Огра: ВКЛ\nРежим Огра: ВЫКЛ"
text.018a: "Осторожно, обвалы!"
text.01f0: "Говорят, на этой дороге\nнападают бандиты."
text.025e: "Ну, пошли, {color:10}{partner}{color:1}."
text.02b6: "Йо-хо!"
text.02d2: "Ха-ха-ха!"
text.02ec: "Йа-ху!"
text.034a: "Сдавайся и оставь вещи\nтут, а то пожалеешь!"
text.03c6: "Сдавайся!"
text.03e2: "Что?! Ты..."
text.0404: "Не может быть!"
text.0424: "Босс, что делать будем?"
text.0458: "Без паники! Мы сильнее,\nи нас больше!\nВзять их!"
text.0530: "Я ещё отомщу!"
text.0570: "Гляди, как удирают! Теперь\nнескоро вернутся."
