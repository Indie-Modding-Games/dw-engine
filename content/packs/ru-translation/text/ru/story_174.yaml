text.004c: "Добро пожаловать в ресторан!"
text.0084: "Я решил стать хозяином\nи шеф-поваром ресторана."
text.00fc: "Угощайся моей огненной\nкухней сколько хочешь."
text.0178: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nне хотите отведать моей\nдомашней кухни?"
text.01ce: "Это не какие-то предметы,\nа настоящая кухня. Мой\nтайный талант."
text.0274: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nЯ решил зарабатывать\nготовкой. У меня талант!"
text.02f2: "Приходи как-нибудь\nотдохнуть и поесть у меня."
text.037a: "C???NC?? , C???MC?? .\nМой ресторан наконец открыт!"
text.03e6: "Попробуй ледяной десерт!\nЭто моё фирменное блюдо."
text.045c: "{color:6}{tamer}{color:1}, я решил\nработать поваром\nв этом ресторане."
text.04d0: "Здесь можно поесть горячего."
text.051e: "Отлично!\n{color:6}{tamer}{color:1}, {color:10}{partner}{color:1},\nтеперь я повар!"
text.0566: "Моя стряпня гораздо лучше\nтого, что найдёшь\nгде-то ещё. Попробуй!"
text.061a: "{color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!\nЯ решил посвятить жизнь\nготовке!"
text.067e: "Моя особая домашняя кухня\nочень полезна! Заходи,\nкогда я готовлю."
text.0734: "Эй!  {color:6}{tamer}{color:1}, {color:10}{partner}{color:1}!"
text.0758: "Я решил помогать\nэтому ресторану.\nМне доверили десерты."
text.07d6: "Я очень горжусь\nсвоим десертом.\nОбязательно попробуй, ладно?"
