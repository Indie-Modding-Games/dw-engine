text.009c: "Дальше начинается\nБыстрая эпоха.\nНе подходи близко."
text.012e: "У меня две цели.\nПервая — узнать, что\nгрозит острову."
text.01b2: "Вторая — позвать\nДигимонов в город."
text.0212: "И к чему ты клонишь?"
text.023e: "Помоги мне\nА, неважно"
text.0286: "Не могу. Я должен\nсторожить этот лес."
text.02d4: "Тогда, может, ты знаешь,\nчто грозит острову?"
text.0346: "Ничего не знаю. Погоди-ка."
text.037c: "Помню, недавно\nс неба упал\nбольшой камень."
text.03fc: "Где он упал?"
text.0428: "В Быстрой эпохе.\nПо ту сторону леса."
text.04a2: "Пусти меня! Вдруг я\nнайду какие-то зацепки!"
text.0506: "..."
text.0512: "Раз ты настаиваешь.\nИди и посмотри."
text.057e: "Дальше — время идёт\nв два раза быстрее.\nВозьми с собой еды."
text.0610: "И смотри, как бы\nне состариться."
text.0672: "Тебе стоит поискать\nв других местах."
text.06dc: "Дальше — время идёт\nв два раза быстрее.\nВозьми с собой еды."
text.076e: "И смотри, как бы\nне состариться."
text.07dc: "Что-нибудь случилось?"
text.0810: "Пока нет."
text.0828: "Мой учитель говорил,\nчто тут есть тайный ход."
text.0890: "Но я не знаю, где он."
text.08da: "Что это?"
text.08f8: "Похоже на метеорит!\nНичего страшного."
text.096c: "Прости, но это\nвсё, что я знаю."
text.09ae: "Всё равно спасибо."
text.09da: "Получай!"
text.0a82: "Толку от тебя никакого!"
text.0aac: "Учитель?!"
text.0ac4: "Не верю, что ты\nвсё ещё здесь!"
text.0b1c: "Учитель? Кто он?"
text.0b4c: "Но, учитель, кто будет\nсторожить Древний Дино-край?"
text.0bba: "Для острова настали\nтрудные времена. Иди в\nгород и помогай другим!"
text.0c5c: "Слушаюсь!"
text.0c7c: "Ты уверен, что так можно?!"
text.0cba: "Он ещё молод, но\nдай ему работу.\nА я буду сторожить тут."
text.0d54: "Учитель..."
text.0d74: "{color:6}{tamer}{color:1}, вот такие дела.\nМожно мне в город?"
text.0de4: "Трудись как следует."
text.0e12: "Буду!\nУчитель, до встречи!"
text.0e92: "Tyrannomon теперь живёт\nв городе!"
text.0ed6: "Интересно, что он умеет?"
text.0f1a: "Давно я не сторожил\nэто место."
text.0f7a: "Проходи когда хочешь."
text.0fc2: "Давно я не сторожил\nэто место."
text.1022: "Проходи когда хочешь."
