text.0116: "Похоже, почти всю землю\nмы уже вынесли."
text.0182: "Работа идёт хорошо.\nСпасибо.\nПодожди ещё немного."
text.021e: "Спасибо за работу.\nВот твоя плата."
text.0296: "Я заработал\n500 Bits!"
text.02d8: "HP выросло на 50!\nАтака выросла на 5!\nЗащита выросла на 5!"
text.0396: "Высыпай землю\nснаружи туннеля."
text.040a: "Бери её из кучи земли."
text.0476: "Будешь таскать землю?"
text.04b4: "Твой Дигимон устал.\nДай ему сначала отдохнуть."
text.054c: "Будешь таскать землю?"
text.058c: "Да\nНет"
text.05b8: "Здесь не место для\nновичков. Уходи,\nтут слишком опасно."
text.065e: "Этот туннель ещё не\nпрокопан. Не мешай\nнам."
text.06d8: "Извини. А ты знаешь,\nкогда закончите?"
text.072e: "Не знаю,\nэто займёт время."
text.077c: "Вот беда.\nМожет, мы поможем?"
text.07c0: "Хочешь отнять у нас\nвсё веселье? Ну, можешь\nтаскать землю."
text.083c: "Что такое?"
text.0866: "Я накопал эту землю.\nМожешь вынести её\nи высыпать."
text.08de: "Работа тяжёлая, так что\nза каждый рейс туда\nи обратно — 500 Bits."
text.096e: "Так копать будут быстрее.\nЯ заработаю, да и\nтренировка неплохая."
text.0a0c: "Давай\nНет, спасибо"
text.0a3a: "Перевозка земли\nКнопкой {color:6}△ {color:1}ставь ящик\nперед кучей земли.\nВысыпай землю снаружи.\nЗакончив рейс, скажи\nоб этом Drimogemon."
text.0b66: "Испугался?"
text.0bae: "Добавлен ящик для земли."
