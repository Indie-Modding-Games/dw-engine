text.004c: " {color:6}{tamer}{color:1} и {color:10}{partner}{color:1},\nверно? Добро пожаловать\nв Виллу Громкость!"
text.00ca: "Прости за то, что мы\nсделали с Otamamon."
text.0122: "Ничего страшного."
text.0148: "А?"
text.0168: "Я благодарен. Я слышал,\nты много трудишься,\nчтобы спасти остров."
text.0200: "Правда?"
text.0218: "Я давно хотел тебе помочь.\nТы был в Туманной роще,\nчто к северу отсюда?"
text.02ca: "Ещё нет."
text.02ee: "Да."
text.02fe: "Там всегда туман.\nТебе, наверное, будет\nтрудно там пройти."
text.0390: "Но тебе стоит встретиться\nс Cherrymon, хозяином\nлеса."
text.041e: "Cherrymon? Никогда не слышал\nо таком Дигимоне."
text.0482: "Это Cherrymon напускает\nтуман в Туманной роще."
text.04d6: "Он создал туман, чтобы\nзащитить лес от бед."
text.0548: "Но нам от этого одни проблемы."
text.0594: "Думаю, Cherrymon кое-что\nзнает о причине\nбед острова."
text.062e: "Ради встречи с ним стоит\nпройти сквозь туман."
text.0688: "Если бы только что-то\nсделать с туманом."
text.06da: "Убрать туман может\nтолько Cherrymon."
text.074a: "Но пройти можно.\nЯ наложу на тебя чары."
text.07be: "И что будет?"
text.07ee: "Ты будешь видеть дорогу\nдаже в тумане."
text.0860: "О, здорово!"
text.0888: "Хорошо, тогда начинаю."
text.08b8: "Ква, ква!"
text.08f6: "Хорошо. Всё получилось.\nТеперь иди в Туманную рощу."
text.0974: "Я с ним встретился.\nТумана больше нет."
text.09ba: "Ого, вот это да! Ну,\nчем я могу тебе помочь?"
text.0a2a: "Вот, возьми это."
text.0a6c: "Я получил\n{color:6}Дигисибас{color:1}!"
text.0abc: "Выбрось что-нибудь другое."
text.0b04: "Это большая редкость.\nТебе пригодится."
text.0b72: "Спасибо. А может, переедешь\nв город, Shogun?"
text.0bde: "Я вождь сотни Gekomon\nв Болоте Геко. Прости,\nно пойти с тобой не могу."
text.0c84: "Но взамен я сделаю\nвсё, что смогу, отсюда.\nПриходи когда угодно."
text.0d58: "Похоже, у тебя проблема.\nС костюмом, да?"
text.0dce: "Ты об этом знаешь?"
text.0dfa: "Не недооценивай меня. Numemon\nсможет его надеть."
text.0e68: "Удивлён? И это ещё не всё:\nкогда он его наденет... Ты\nне поверишь... Попробуй сам."
text.0f4e: "Кстати, {color:6}Супер-удочка {color:1}\nдля рыбалки уйдёт\nиз твоих предметов."
text.0fe0: "Это особый предмет."
text.1022: "Удачи!"
text.1052: "Рыбачить можно только\nв Озере Драконий Глаз."
text.10a6: "Назад, назад!"
text.10da: "Shogun собирает редкие\nпредметы. Раньше он собирал\nпредметы."
text.1154: "Но теперь он без ума\nот карт Дигимонов."
text.11aa: "Если принесёшь редкую карту,\nон даст тебе\nочки заслуг."
text.1222: "Собирай карты, копи\nочки заслуг и\nменяй их на предметы.{stop}{stop}"
text.12bc: "Ну... нет, ничего. Ква."
text.12fe: "Простите... Я хочу пойти\nв город. Ква!"
text.1362: "Хорошо, а что случилось?"
text.1396: "Хочу сражаться на Арене.\nПохоже, на нас,\nплемя Gekomon,{stop}"
text.142e: "смотрят свысока, как на\nдеревенских Дигимонов. Ква."
text.1494: "Да, мы из деревни,\nно и у нас есть гордость!{stop}\nКва."
text.1522: "Понимаю тебя.\nТогда вперёд. Удачи!"
text.1582: "Gekomon теперь на Арене!"
