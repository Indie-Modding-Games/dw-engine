text.0060: "Вот незадача! Тут скала!"
text.0098: "Мне её не пробурить."
text.00c6: "Не можешь? Ой-ой!"
text.00f0: "Надо придумать, как её\nсдвинуть. Ты сможешь?"
text.0164: "Не знаю."
text.0192: "{color:10}{partner}{color:1},\nмне нужна твоя помощь."
text.034e: "Получилось!"
text.036a: "Ух ты, вот это сила!\nМы сдвинули скалу!"
text.03be: "Кажется, дальше\nпусто."
text.041e: "Это лавовая река!\nОпасно!"
text.0468: "Вдоль реки есть тропа.\nПошли!"
text.04c2: "Ты пойдёшь внутрь?\nОсторожнее!"
text.0516: "Ты пойдёшь внутрь?\nОсторожнее!"
text.0576: "Возвращайся с {color:10}{partner}{color:1},\nкогда он подрастёт."
