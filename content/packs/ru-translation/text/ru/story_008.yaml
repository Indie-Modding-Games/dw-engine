text.004e: "Бур-туннель"
text.0084: "Обычный\nРежим Огра"
text.00ec: "Вот нахал! Какая грубость!"
text.012e: "А?"
text.015a: "{color:7}Управляющий рынком {color:1}\nЯ и не знал, что за\nпроход надо платить!"
text.01f6: "{color:7}Управляющий рынком {color:1}\nЭй, ты ведь... точно!\nСделай что-нибудь!"
text.026c: "Как там Drimogemon\nвнутри?"
text.02b0: "{color:7}Управляющий рынком {color:1}\nНе знаю."
text.02f6: "Надеюсь, они целы.\nЛадно, я пошёл!"
text.0362: "{color:7}Управляющий рынком {color:1}\nСкорее сделай что-нибудь!"
text.03f8: "В туннеле больше ничего\nнет... Пройдём его\nнасквозь или как?"
text.047e: "Пройдём!\nНе будем"
