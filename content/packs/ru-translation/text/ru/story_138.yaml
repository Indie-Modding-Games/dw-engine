text.0018: "Я собираю карты Дигимонов."
text.0058: "Дай мне Hagurumon,\nToyAgumon и WaruMonzaemon,\nи я тебе кое-что дам."
text.0108: "Дать\nНе давать"
text.0138: "Прости, у меня их нет."
text.0176: "Держи. Это {color:6}Бинт X{color:1}."
text.01b4: "У меня слишком много вещей."
text.01f8: "Ты когда-нибудь пробовал\nкёрлинг?"
text.0236: "Если наберёшь в игре\nдесять очков,\nты просто талант."
text.02c0: "Не знаю, поможет ли, но\nвот тебе советы по рыбалке."
text.0338: "Во-первых, удочка.\nХорошая бросает далеко\nи хорошо гнётся."
text.03c0: "Во-вторых, наживка. Запомни,\nкакую рыбу ты поймал\nна какую наживку."
text.043c: "Закидывая удочку,\nотпусти {color:6}△ {color:1},\nчтобы бросить изо всех сил!"
text.04ce: "Насчёт Стража озера...\nОн появляется каждый день\nутром и под вечер."
