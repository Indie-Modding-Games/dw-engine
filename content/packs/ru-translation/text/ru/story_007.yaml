text.0038: "О, да!"
text.0050: "Сыграешь на {color:6}Синей\nфлейте{color:1} Стража озера?"
text.00b6: "Сыграть\nНе играть"
text.0188: "Тебе помочь, друг?"
text.01ce: "Отвези меня на тот берег."
text.020e: "Конечно. Садись."
text.033c: "Seadramon!"
text.0358: "Вот мы и снова встретились.\nЕсть просьба?"
text.03bc: "Давай дружить\nНаучи приёму\nДай предмет"
text.0444: "Мы ведь уже друзья.\nЕщё просьбы есть?"
text.050c: "Что за... ой-ой!\nЭто же Страж озера!"
text.056c: "Э-э, да. Я Seadramon."
text.05a0: "Так это ты столько\nрыбы наловил!\nЛадно. Есть просьба?"
text.0634: "Что!? Ясно, почему тебя\nзовут Стражем.\nДа, есть просьба."
text.06bc: "Давай дружить\nНаучи приёму\nДай предмет"
text.0738: "Ладно, договорились."
text.0754: "Теперь мы друзья. В знак\nдружбы дарю тебе флейту."
text.07ec: "Ой-ой! Много предметов.\nНадо что-то выбросить."
text.085e: "Я получил {color:6}Синюю\nфлейту{color:1} Стража озера!"
text.08b4: "Сыграй на флейте у озера,\nи я приплыву. Я отвезу\nтебя на тот берег."
text.095c: "Я смогу попасть на тот\nберег? Спасибо!"
text.09bc: "За озером есть странный\nлес. Хочешь отправиться\nтуда прямо сейчас?"
text.0a5e: "Да, поплыли\nНет, потом"
text.0aaa: "Я научу тебя приёму."
text.0af6: "Освоен приём «Аквамагия»!"
text.0b40: "Освоен приём «Зимний вихрь»!"
text.0b8e: "Освоен приём «Гигазаморозка»!"
text.0bcc: "Э-э, кажется, больше\nприёмов, которым я могу\nнаучить, нет..."
text.0c5c: "Пока!"
text.0ca8: "Ну, тогда дарю тебе\n{color:6}Флягу{color:1}."
text.0d12: "Ой-ой! Много предметов.\nНадо что-то выбросить."
text.0d84: "Ура, я получил\n{color:6}Флягу{color:1}!"
text.0dca: "Пока!"
text.0e16: "Ну, тогда садись мне\nна спину."
text.0ece: "До встречи."
