text.0040: "!"
text.0058: "Что случилось с островом?"
text.0092: "Племена распались: все\nтеряют память и дичают."
text.0100: "Не знаю, сколько ещё\nя смогу быть в своём уме."
text.0152: "Нельзя это так оставлять!\nОни должны понять, как\nэто опасно!"
text.021c: "Стой! Ты хочешь\nпогубить остров?!"
text.0278: "Ты кто такой? Прочь с\nдороги! Другого пути нет!"
text.031c: "Хочешь сказать, что\nесть другой путь?"
text.037a: "Если остров погибнет,\nто всё зря!\nПослушай меня."
text.03fe: "Что?"
text.0418: "Мы строим город для\nострова и собираем в нём\nвсех Дигимонов."
text.049a: "Я слышал, что остров\nможно спасти, если\nобъединить Дигимонов."
text.0532: "Может, ты и прав, но\nсобрать всех Дигимонов —\nэто же огромная..."
text.05cc: "Мы уже этим занимаемся.\nНет ничего невозможного!"
text.063e: "Это огромный труд!\nНо я тронут...\nМожет, у вас получится."
text.06c8: "Если веришь в нас,\nприходи в город."
text.073e: "Хорошо. Я пойду в город.\nВидно, это мой новый путь!"
text.07f0: "Meramon теперь живёт\nв городе!"
text.084a: "Я знал, что ты вернёшься.\nМне нужен ответ!"
text.08f0: "Похоже, я проиграл..."
text.091c: "Мне нужно тебе\nкое-что сказать."
