text.006a: "Шваа!"
text.008c: "Ша-ша-шаааа!"
text.00c0: "Похоже, он не ранен."
text.010e: "Так и быть, сделаю скидку."
text.0156: "Не смейся над нами!"
text.0196: "Домой ты живым\nне вернёшься!"
text.0262: "Ой!"
text.027a: "Так сильно упал,\nа выглядишь неплохо."
text.02dc: "{color:10}{partner}{color:1},\nты цел?"
text.0310: "Ух ты, ты в порядке!"
text.033c: "Ты летел? Это нечестно!\nХотя ладно, наверное, честно."
text.03b6: "Идём!"
text.03ea: "Ой!"
text.0402: "Так сильно упал,\nа выглядит неплохо."
text.0460: "{color:10}{partner}{color:1},\nты цел?"
text.0494: "Наверное, больно. Прости."
text.04d4: "Идём!"
