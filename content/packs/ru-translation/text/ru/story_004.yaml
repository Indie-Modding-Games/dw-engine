text.0090: "Здесь вырезаны\nкакие-то буквы."
text.00dc: "Никого нет! Иди домой!"
text.011e: "Тут кто-то живёт?"
text.0176: "{color:7}? ? ? {color:1}\nИ обезьяна с дерева падает."
text.01c8: "{color:7}? ? ? {color:1}\nЛетучий удар коленом!"
text.025e: "Я проиграл, но вы всё\nравно слабаки!"
text.02b4: "Не злись, что проиграл.\nТы ведь ещё и напал\nисподтишка."
text.0344: "Ух! Ничего не остаётся,\nкроме как..."
text.0394: "В вашем городе я ещё\nпокажу, какой я сильный!\nВот увидите!"
text.0462: "Etemon теперь живёт в городе!"
text.04a0: "Только ушибёшься."
text.04e0: "Ну ты и малыш!"
text.051c: "Ладно, поиграю с тобой."
text.056a: "Нос тебе расквашу!"
text.05aa: "Пополам сломаю!"
