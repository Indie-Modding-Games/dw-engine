text.006e: "Был тут один, кто хотел\nстать торговцем. Говорят,\nу него где-то есть лавка."
text.011c: "От него пользы больше, чем\nот меня."
text.015c: "Почему время здесь\nне такое, как везде?"
text.01ba: "Жить тут, конечно,\nлегко, но..."
text.0240: "Я тут всё осматривал\nс неба."
text.0292: "На севере лёд и снег.\nЖить в таком холоде —\nэто безумие."
text.0332: "Я тут всё осматривал\nс неба."
text.0384: "На западе есть маленький\nжелезный город."
text.03e6: "Но вход и выход закрыты.\nА я могу туда долететь."
text.0460: "Я тут всё осматривал\nс неба."
text.04b2: "Там живут стаи Дигимонов\nс рогами или клешнями."
text.0522: "Говорят, они делают\nсебе дома, выдалбливая дерево."
text.0594: "Я тут всё осматривал\nс неба."
text.05e6: "На северо-западе есть лес\nсо зданиями."
text.0644: "Это очень далеко."
text.066e: "Я тут всё осматривал\nс неба."
text.06c0: "Ты бывал за Великим\nканьоном? Там как в лабиринте."
text.073a: "Я тут всё осматривал\nс неба."
text.078c: "Середины острова не видно.\nОдни облака."
text.0812: "Ты это уже слышал."
text.0858: "Время здесь медленное.\nПолдня здесь —\nкак день снаружи."
text.08de: "Для тех, кто хочет\nотдохнуть, — самое то."
text.094e: "В Быстрой эпохе время\nлетит быстро.\nОна сразу за этим местом."
text.09d0: "Там вместо одного дня\nпроходит два."
text.0a26: "Твой Дигимон растёт быстрее,\nно и угасает быстрее."
text.0aaa: "Торговый автомат"
text.0ad0: "Интересно, что выпадет?\nПо 200 Bits за раз.\nКупить?"
text.0b54: "Купить\nОтмена"
text.0b96: "Мне не хватает денег."
text.0bec: "Выпало:\n{color:6}Мясо {color:1}!"
text.0c24: "Слишком много предметов.\nНадо что-то выбросить."
text.0cac: "Выпало:\n{color:6}Восст. мал. {color:1}!"
text.0d0a: "Слишком много предметов.\nНадо что-то выбросить."
text.0d92: "Выпало:\n{color:6}Стейк {color:1}!"
text.0dce: "Слишком много предметов.\nНадо что-то выбросить."
text.0e56: "Выпало:\n{color:6}Дискета MP {color:1}!"
text.0e9c: "Слишком много предметов.\nНадо что-то выбросить."
