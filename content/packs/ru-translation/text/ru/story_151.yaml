text.0026: "Здесь всё спокойно.\nУдачи."
text.0078: "Я тоже должен помочь. Буду\nпо возможности бывать\nи здесь, и в городе."
text.0128: "Andromon теперь живёт\nв городе!"
text.0176: "Данные восстановлены.\nТеперь давай их прочитаем."
text.01e6: "Пожалуйста."
text.0200: "Сто лет назад на острове\nДигимонов появились\nАналоговые люди."
text.0286: "Аналоговые люди и местные\nДигимоны жестоко сражались."
text.02f0: "После десяти лет войны\nАналоговые люди были\nразбиты и исчезли."
text.038c: "За следующие десять лет\nостров загадочным образом\nвырос почти вдвое."
text.0438: "Так люди воевали с Дигимонами?"
text.0476: "Прости. Это всё, что нам\nудалось восстановить."
text.04e6: "Не переживай. Это очень\nважные сведения.\nТеперь я знаю гораздо больше."
text.0582: "Правда?"
text.05ae: "Наверное, именно эти люди\nи принесли на остров\nсмуту и беды."
text.065e: "Разве люди могут\nжить сто лет?"
text.06aa: "Похоже, для людей в этом\nмире время идёт медленно."
text.071a: "Наверное, поэтому мне тут\nне нужно ни есть, ни спать."
text.078a: "Сто лет — это очень\nдолго. Эти ребята,\nнаверное, очень крепкие."
text.081c: "Думаешь, они где-то\nпрячутся?"
text.0872: "Я найду их\nи что-нибудь сделаю."
text.08b8: "Теперь я понял, зачем я тут.\nРаз я человек,\nмне с ними и разбираться."
text.095e: "Нам очень жаль. Мы закроем\nфабрику на время."
text.09d6: "Сейчас такие беды, что\nникто не знает, что будет.\nТы не виноват."
text.0a8a: "Думаю, кто-то\nуправляет Giromon."
text.0aea: "Компьютеры разрушены, и\nначали течь сточные воды."
text.0b62: "От этой воды Дигимоны\nсходят с ума. Не думаю,\nчто это случайность."
text.0bee: "В этих компьютерах есть\nчто-то очень важное."
text.0c46: "Может, уже поздно, но,\nпо-моему, кто-то хотел\nнас достать."
text.0cc8: "Что?!"
text.0cdc: "Кажется, в этих компьютерах\nбыли данные о прошлом\nострова."
text.0d78: "Но из-за бунта Giromon\nданные были уничтожены."
text.0dec: "Ты сам эти данные не видел?"
text.0e2a: "Нет, но часть, может, удастся\nвосстановить. Попробую\nсобрать данные."
text.0eca: "Понятно, спасибо.\nСколько это займёт?"
text.0f22: "Это надолго. Я снова открою\nвход в город, так что\nзаходи потом."
text.0fb2: "Спасибо. Я вернусь."
text.0ff6: "Ты закончил\nвосстанавливать данные?"
text.1044: "Нужно ещё немного времени.\nЗаходи попозже."
text.10a2: "Ладно, я вернусь."
text.10ea: "Эй, эй!"
text.1104: "Я должен извиниться."
text.113c: "Потом извинишься, а сейчас\nостанови машины фабрики!"
text.11ba: "Хорошо, сделаю."
text.11ee: "Фабрика только что\nостановилась."
text.1246: "Отлично, проверю канализацию.\nБывай, дружище."
text.12b2: "Мне нужно извиниться."
text.12dc: "Нам некогда\nэто обсуждать!"
text.133e: "Наш компьютер безупречен."
text.1376: "Фабрика правда безопасна?\nЧто нам теперь делать?"
text.13e8: "Ладно, надо что-то делать\nс охраной. Другого пути\nу нас нет!"
text.1482: "Как ты попал в город?"
text.14ca: "Если у тебя здесь нет дел,\nуходи сейчас же!"
text.1546: "Об этом поговорим потом.\nСейчас мне надо\nпроверить фабрику."
text.15cc: "Это вопрос жизни и\nсмерти. Дай разрешение!"
text.163e: "Я не очень понимаю,\nчто ты задумал.\nЯ не могу дать разрешение."
text.16e4: "Дигимоны вот-вот исчезнут\nиз-за сточных вод\nс фабрики!"
text.178e: "С фабрики? Не может быть!\nСистема очистки сточных\nвод работает исправно."
text.182a: "Как ты узнаешь, что она\nработает, если не проверить?!"
text.18a6: "Наш компьютер безупречен.\nПри аварии Сетевой Страж\nотключит систему."
text.1952: "Хочешь сказать, Сетевой\nСтраж всегда будет\nработать как надо?"
text.19de: "Сетевой Страж — это другое\nимя Giromon, Дигимона\nуровня Ультра."
text.1a68: "Его суждения и умения\nбезупречны."
text.1ac2: "Он Дигимон?! О нет, тогда\nвсё ещё хуже.\nПрошу, дай разрешение!"
text.1b7c: "Уходи! Сейчас же!"
text.1ba2: "Эх... Вот досада!"
