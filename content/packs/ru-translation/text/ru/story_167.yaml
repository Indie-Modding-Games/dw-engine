text.0038: "О, {color:6}{tamer}{color:1}и {color:10}{partner}{color:1},\nвы здесь."
text.0078: "Я курьер.\nДоставляю что угодно."
text.00cc: "Нести вы можете\nтолько себя, так?"
text.0132: "А давайте я вас отвезу?\nОтличная идея, а?"
text.0190: "Отвезу куда угодно\nи когда угодно.\nЗа плату, конечно."
text.0222: "Привет, {color:6}{tamer}{color:1}."
text.023c: "Иногда я возвращаюсь в\nСаванну Шестерён на дозор."
text.029e: "Говорят, на пляже в Саванне\nШестерён есть магазины.\nТы их видел?"
