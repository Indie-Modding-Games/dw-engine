text.0034: "Добро пожаловать! Моё новое\nдело — «Склад предметов».\nЯ храню чужие предметы."
text.00c0: "В качестве особой услуги\nхраню твои вещи бесплатно."
text.0144: "Насчёт дигиэволюции...\nО стадии, что идёт\nпосле Чемпиона..."
text.01e4: "Это Ультра. Но после\nЧемпиона Дигимон не всегда\nдигиэволюционирует."
text.0286: "Чтобы дигиэволюционировать,\nнужно точно выполнить\nопределённые условия."
text.030e: "Но если Дигимон станет\nУльтра, его жизнь\nстанет дольше."
text.03a8: "Но если он дигиэволюционирует,\nсъев предмет дигиэволюции,\nсрок жизни не изменится."
text.0464: "Ещё о дигиэволюции.\nОб условиях."
text.04c6: "Во-первых, говорят, вес\nдолжен быть близок\nк нужному."
text.0560: "И чем выше параметры,\nтем лучше."
text.05b8: "Но результат зависит\nот того, какой параметр\nвыше."
text.0644: "Насчёт ошибок ухода:\nиногда лучше ошибиться\nнарочно."
text.06d8: "В зависимости от того, в кого\nдигиэволюционирует Дигимон,\nнужны свои условия."
text.0768: "Есть ситуации, которые могут\nвызвать дигиэволюцию."
text.07da: "Например, число боёв\nили уровень дисциплины."
text.0850: "Если эти условия выполнены,\nон может дигиэволюционировать,\nдаже если другие — нет."
text.08fc: "Jiji сказал, что\n{color:10}{partner}{color:1} скоро\nдигиэволюционирует."
text.0956: "Из Малыша в Ученика\nДигимон превращается\nвсего за шесть часов."
text.09e2: "Оттуда до Новичка\nдигиэволюция занимает\nоколо суток."
text.0a68: "Потом до Чемпиона\nдигиэволюция занимает\nоколо трёх дней."
text.0b02: "А какая стадия дальше?\nЗабыл, но там есть\nещё."
text.0b82: "Дигиэволюция зависит от\nвеса, параметров\nи ошибок ухода."
text.0c0a: "Я не очень понимаю.\nСпрошу у Jiji\nпри случае."
