text.0034: "Эй, хочешь сыграть со\nмной? Если выиграешь,\nсделаю всё, что скажешь."
text.00da: "А во что сыграть?"
text.0108: "Это называется...\nДигимон-кёрлинг! \nВнутри расскажу больше."
text.0186: "Хм, а что будет, если\nя проиграю?"
text.01c6: "В первый раз ничего.\nНо в следующий раз сначала\nпринесёшь мне рыбу."
text.025c: "Тогда, если я выиграю, ты\nпойдёшь со мной в город.{stop}\nНу, давай сыграем."
text.02f4: "Ладно, договорились. \nПойдём внутрь."
text.0384: "Эй, хочешь сыграть со\nмной? Дай мне рыбу, и\nсможешь сыграть."
text.0426: "Я тебя обыграю\nНет, спасибо"
text.0474: "Привет, братишка! Я\nсделал тут каток."
text.04c2: "Одна рыба за одну игру.\nНо если выиграешь, получишь\nхороший приз."
text.0554: "Эй, приятель, не хочешь со\nмной сыграть? Чтобы бросить\nвызов, нужна одна рыба."
text.0606: "Давай\nНет, спасибо"
text.0642: "Эх, скукота."
text.0676: "Дай мне рыбу!"
text.06ae: "У меня сейчас ничего нет..."
text.0738: "Ой нет, если я дам тебе\nэто, толку не будет."
text.079a: "Ух ты, вкуснятина. Ой,\nсначала надо сыграть.\nПойдём внутрь."
text.0842: "Да ладно, приятель.\nСходи порыбачить на\nОзеро Драконий Глаз."
text.08d6: "Извини, братишка. Приходи\nсыграть ещё раз. И не\nзабудь принести рыбу."
text.0992: "Потрясающе! Идеальный счёт!\nТы случайно не...\nпрофессионал?"
text.0a34: "{color:7}Поздравляю!\nВот тебе медаль за\nотличную игру! {color:1}"
text.0ab8: "Круто, приятель. Я впервые\nпроиграл."
text.0b20: "Отлично, теперь пойдём\nв город, как ты обещал."
text.0b94: "Что ж, видно, придётся.\nНо я уже решил, чем\nзаймусь в городе."
text.0c7a: "Penguinmon теперь\nживёт в городе!"
text.0cd2: "Извини, братишка. Приходи\nсыграть ещё раз. И не\nзабудь принести рыбу."
text.0d82: "Потрясающе! Идеальный счёт!\nТы случайно не...\nпрофессионал?"
text.0e24: "{color:7}Поздравляю!\nВот тебе медаль за\nотличную игру! {color:1}"
text.0ea8: "Ух, ты крутой, приятель. \nЯ опять проиграл."
text.0f00: "Что тут скажешь.\nВот твой приз."
text.0ff8: "У тебя слишком много вещей!"
text.103c: "Получено: {color:6}{item:pstat=110}{color:1}!"
text.106a: "Привет, {color:6}{tamer}{color:1}. Я\nприсматриваю за лавкой\nпо просьбе Penguinmon."
text.10ea: "Сыграй со мной! Если\nвыиграешь, получишь мой\nособый приз. Ну как?"
text.118c: "Давай сыграем\nНет, спасибо"
text.11da: "Перед игрой давай\nсюда рыбу."
text.123e: "Ой, у меня сейчас\nничего нет."
text.12da: "Если я дам тебе это,\nтолку не будет."
text.1330: "Ну, в этот раз я\nвыиграю. Пойдём внутрь."
text.13a2: "Без рыбы я играть не\nмогу. Приходи как-нибудь\nв другой раз."
text.1436: "Что? Ты мне\nотказываешь?"
text.1488: "Хочешь меня обыграть —\nшевели мозгами!\nЕщё увидимся."
text.1546: "Идеальный счёт против\nменя!! Да ты гений\nкёрлинга?!"
text.15e0: "{color:7}Поздравляю!\nВот тебе медаль за\nотличную игру! {color:1}"
text.1664: "А ты хорош, {color:6}{tamer}{color:1}!\nВот приз, который\nя тебе обещал!"
text.17a2: "У тебя слишком много вещей."
text.17e6: "Получено: {color:6}{item:pstat=110}{color:1}!"
