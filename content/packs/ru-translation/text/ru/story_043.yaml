text.0060: "Даа!"
text.007e: "Хаа!"
text.009c: "Гххии!"
text.00c6: "Восток: лифт\nЗапад: опасно, обрыв"
text.0120: "Режим Огра: ВКЛ\nРежим Огра: ВЫКЛ"
text.0196: "Что?"
text.01fa: "Мне показалось, земля\nдрогнула. Или почудилось?"
text.02c8: "Что? Не может быть!"
text.0344: "{color:6}{tamer}{color:1}Ух ты!!"
text.0370: "Осторожно, обвалы!"
text.03d6: "Говорят, на этой дороге\nнападают бандиты."
text.0438: "Идём, {color:10}{partner}{color:1}."
text.0480: "Юху!"
text.049c: "Ха-ха!"
text.04b0: "Йа-ху!"
text.050e: "Сдавайся и отдай всё, что\nесть! А не то...!"
text.0562: "Нет, это ты сдавайся!"
text.058a: "Что?! Ты...?"
text.05ae: "Не может быть."
text.05ce: "Босс, что будем делать?"
text.0602: "Не бойтесь, мы сильнее,\nи нас больше.\nВперёд, хватай их!"
text.06d2: "Я тебе ещё\nотомщу!"
text.0724: "Гляди, как удирают! Теперь\nнескоро вернутся."
