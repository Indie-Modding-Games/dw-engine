text.005e: "Обвал перегородил дорогу..."
text.00a2: "Боевой тест!"
text.00c0: "Шучу."
text.00e6: "Меня зовут Mr. Handy!\nЧем могу помочь?"
text.0146: "Изменить параметры\nПеремотать время\nОсвоить все приёмы"
text.01cc: "Увеличить\nУменьшить\nСбросить уровень"
text.022a: "Вперёд на час\nВперёд на 6 часов\nВперёд на день"
text.02e4: "Прибавить 50\nПрибавить 100\nПрибавить 200"
text.03bc: "Отнять 50\nОтнять 100\nОтнять 200"
