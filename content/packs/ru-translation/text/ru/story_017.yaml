text.0028: "Ша-а-а, ша-а-а!"
text.0056: "Бум, бум!"
text.0082: "Ха-ха, ты цел?"
text.00c6: "Хм-м?"
text.00e6: "О! Ха-ха-ха!"
text.0116: "Джунгли Mojya."
text.0156: "{color:3}Внимание {color:1}\nБуду стрелять в любого\nнарушителя. Centarumon"
text.01c8: "Я переехал. Новый адрес:\nГород Файл. Centarumon"
