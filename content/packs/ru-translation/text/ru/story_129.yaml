text.00c6: "Привет, {color:6}{tamer}{color:1}!"
text.00f4: "Привет, {color:6}{tamer}{color:1}!"
text.0122: "Привет, {color:6}{tamer}{color:1}!"
text.0154: "Спасибо, что снова пришёл."
text.0190: "Привет, я Mojyamon!"
text.0280: "{color:6}{tamer}{color:1}, я так рад!\nТы столько для нас сделал."
text.02e2: "Я решил: переезжаю\nв город. Будем работать\nвместе, ладно?"
text.03a4: "Mojyamon теперь живёт\nв городе!"
