text.002c: "Я починил табличку у входа."
text.0086: "Жарко! Сделай что-нибудь!"
text.00c8: "Что происходит?"
text.00f4: "Слишком жарко!\nЯ больше не могу!"
text.0178: "Я от жары\nсовсем одурел."
text.01c8: "Знаю, что жарко, но...\nостынь, приятель!"
text.0218: "Чем глубже копаем, тем\nжарче. Туннель-то\nв вулкане."
text.02a0: "Вряд ли дело только\nв этом. Может, рядом\nпожар."
text.0330: "Хм-м"
text.0340: "Выбора у меня нет.\nПридётся терпеть жару\nи копать дальше."
text.03d0: "Мы выясним, в чём дело.\nХорошо бы туннель\nпрошёл насквозь."
text.045a: "Ты славный парень.\nЯ поскорее выкопаю\nэтот туннель!"
text.050e: "Сегодня я\nдежурю на кухне."
