text.00bc: "Я ждал тебя,\n{color:6}{tamer}{color:1}.\nНаконец этот день настал"
text.0130: "Что случилось?"
text.0154: "Появился вход на гору\nБесконечность."
text.01a8: "Что? Правда? Где?"
text.01d8: "За водопадом\nв городе."
text.0224: "Ого, совсем рядом!"
text.0254: "По-моему, последний враг\nждёт на горе Бесконечность."
text.02c4: "Значит, это последнее\nподземелье. Я справлюсь!"
text.0316: "Удачи! Но не спеши.\nНе выступай, пока\nне подготовишься как следует."
text.03ce: "За водопадом, в городе,\nнаходится вход на гору\nБесконечность."
text.0478: "По-моему, последний враг\nждёт на горе Бесконечность."
text.04e6: "Иди туда хорошо\nподготовленным!"
text.051c: "Как бы то ни было..."
text.0546: "Процветание города\nсейчас: {num:pstat=1}."
text.05b4: "Он далёк от того,\nкаким был раньше."
text.060e: "Город наконец обретает вид."
text.0658: "Город хорошо развивается."
text.0698: "Город становится отличным."
text.06e2: "Ты отлично потрудился.\nВеликолепно!"
text.073a: "Мне больше нечего сказать.\nЭто потрясающе!"
text.07be: "{color:7}Уровень укротителя\nповысился! {color:1}"
text.0808: "{color:7}Поздравляю!\nВот тебе медаль\nза отличную работу! {color:1}"
