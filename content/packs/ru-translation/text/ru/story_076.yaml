text.0052: "Тааа!"
text.0072: "Вот, получай!"
text.00ae: "Шаааа!"
text.00d2: "Буууон!"
text.011e: "Ты кто? Я никому не дам\nхозяйничать здесь!"
text.0194: "Не бойся. Мы просто\nидём мимо, чтобы\nспасти остров."
text.0220: "Я тебе не верю, проваливай!"
text.0260: "Подожди-ка."
text.02cc: "Ты случайно не...?"
text.030e: "Я же говорил!"
text.0336: "Прости. Гости у нас редко,\nвот я и разошёлся\nна новой работе."
text.03d2: "На работе?"
text.03e2: "Я сторожу место под\nназванием Древний Дино-край."
text.0448: "Это неизведанный край."
text.0484: "Покажешь мне его?"
text.04bc: "Древний Дино-край\nделится на две части."
text.0520: "Там, где мы живём, —\nЛедниковая эпоха."
text.057a: "Это особое место, где\nвремя идёт медленно."
text.05de: "Время идёт медленно?"
text.0608: "Вторая часть —\nБыстрая эпоха."
text.0656: "Она опасна и лежит дальше,\nчем Ледниковая эпоха."
text.06c8: "Она опасна, потому что\nвремя там летит быстро."
text.071c: "Земля там голая. Всюду\nкости и окаменелости."
text.0782: "Это потому, что время там\nидёт быстрее, чем везде?"
text.07fc: "Да. Не задерживайся там."
text.083c: "Я загораживаю дорогу,\nтак что пройти нельзя."
text.08a4: "Ты проиграл."
text.08c2: "Мне не повезло! Такое\nредко бывает."
text.0918: "Правда?"
text.093c: "Мне пора домой.\nЕсли есть вопросы,\nспроси других Дигимонов."
