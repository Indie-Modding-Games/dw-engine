text.00c2: "У меня болит крыло."
text.00ee: "Что случилось?"
text.0112: "Я поранил крыло... У тебя\nесть чем его полечить?"
text.018e: "Ого, выглядит плохо!\nПогоди. Дай посмотреть."
text.0208: "У меня сейчас\nничего нет."
text.0294: "Это не подойдёт."
text.02bc: "Гораздо лучше. Спасибо."
text.030a: "Теперь можешь летать?"
text.0332: "Далеко мне не улететь."
text.037a: "В городе есть клиника.\nСходи туда.\nЭто недалеко."
text.0402: "Я слышал о городе.\nОн больше, чем я думал."
text.0470: "Иди в город и отдохни."
text.04a8: "Спасибо. Может, когда-\nнибудь я тебе помогу."
text.053c: "Unimon теперь живёт\nв городе!"
text.057c: "Мне нечем вылечить\nтвою рану.\nЯ что-нибудь принесу."
text.0608: "Прости, поторопись."
text.068c: "На земле какие-то\nстранные рисунки."
text.06f0: "Неужели это загадочные\nкруги?\nВыглядят совсем свежими."
text.0774: "Теперь их ещё больше!\nМожет, это как-то\nсвязано с НЛО...?"
text.080a: "Ого!? Их стало\nбольше, чем раньше!"
text.0862: "Что это значит?"
text.0896: "Что?"
text.08f8: "Появляется НЛО Vademon."
text.092c: "При... пришелец?!"
text.0950: "..."
text.095e: "Ты... Дигимон?"
text.0990: "..."
text.099e: "Ну..."
text.09b4: "..."
text.09ca: "Vademon достаёт бластер."
text.09fa: "Нет, стой!\nЯ тебе не враг!"
text.0a3c: "Vademon опускает бластер."
text.0a70: "Хорошо, что ты понял."
text.0aa0: "{color:6}{tamer}{color:1} изо всех сил\nпытается его убедить."
text.0af4: "..."
text.0b02: "Может, он не понимает?"
text.0b3a: "Ладно."
text.0b8a: "Vademon теперь живёт\nв городе!"
text.0bc0: "Он..."
text.0bd0: "Он умеет говорить!"
