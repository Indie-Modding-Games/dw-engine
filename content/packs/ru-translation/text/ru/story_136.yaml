text.014c: "Сзади слышен голос.\nЭто же голос...!"
text.01f6: "Стой!"
text.0208: "С чего бы мне стоять?!"
text.023e: "Ха-ха-ха!"
text.02bc: "Ого, вот так сюрприз!"
text.02ee: "Whamon, молодец! Ух ты!"
text.033e: "Сдавайся!"
text.0364: "Уггх!"
text.0378: "Иди работать в город\nи искупи свою вину."
text.03ec: "Ладно, понял.\nПойду в город."
text.0452: "Ха-ха-ха, шучу! Пока."
text.08fa: "Вот гад, обманул!"
text.092a: "Ну, пещеру мы вернули.\nНаверное, и так сойдёт."
text.099a: "Кажется, с пещерой\nтеперь всё в порядке."
text.09da: "Ты, похоже, очень хороший.\nУверен, когда-нибудь они\nпоймут свою ошибку."
text.0a8a: "Я отдам тебе своё сокровище.\nОно там, в глубине."
text.0aea: "Погоди, погоди.\nЭто же твоё сокровище?\nЯ не могу его взять."
text.0b68: "Нет, мне оно не нужно. Я\nхочу в твой город."
text.0bce: "Тогда зачем мы\nотвоёвывали эту пещеру?\nВсё зря...?"
text.0c56: "Прости, но теперь я очень\nхочу тебе помогать."
text.0cb8: "Вот как. Спасибо.\nТы очень добрый."
text.0d04: "Я сразу плыву в город.\nМогу тебя подвезти,\nесли хочешь."
text.0d92: "Whamon теперь живёт в городе!"
text.0dd4: "Возвращаемся в город?"
text.0e0a: "Возвращаюсь\nНет"
