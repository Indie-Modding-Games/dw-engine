text.00b2: "Что такое?!"
text.00e2: "О, с возвращением, Hagurumon!"
text.0122: "Hagurumon?!"
text.0168: "Что происходит?!"
text.01d8: "{color:7}Игрушки {color:1}\nЭто старая сказка.\nОднажды издалека на остров\nпришёл злодей."
text.0280: "{color:7}Игрушки {color:1}\nЗлодеи сказали Дигимонам:\nЭтот остров наш."
text.030a: "{color:7}Игрушки {color:1}\nДигимоны им ответили:\nЭто неправда. Этот остров\nдля всех."
text.03b8: "{color:7}Игрушки {color:1}\nДигимоны объединились\nи дали злодеям бой,\nи те получили урок."
text.0494: "{color:7}Игрушки {color:1}\nНо злодеи сказали:\nПогодите, мы ещё вернёмся.\n...и исчезли."
text.0554: "{color:7}Игрушки {color:1}\nЭто старая сказка."
text.05b0: "Хм-м, как радостно...\nО, погоди-ка."
text.05fc: "История из этой песни —\nэто старое предание\nэтого острова, да?"
text.0684: "Про то, как Дигимоны\nпобедили злодеев..."
text.06e0: "Хм, интересно, кто же\nбыли те злодеи из сказки?"
text.0750: "Спасибо, что помог мне.\nЭто в знак благодарности."
text.07cc: "Плюшевый Monzaemon\nтеперь живёт в городе!"
text.0850: "Постой, WaruMonzaemon\nничего не обронил?"
text.08be: "Удачи!\nЭто в соседнем доме!"
text.092a: "......"
text.09cc: "О, Monzaemon!\nТы вернулся живым!"
text.0a16: "Ого, что это?"
text.0a3e: "Бей WaruMonzaemon!\nБыстрее, все за дело!\nЖивей, живей!"
text.0ace: "Стойте... стойте! Это не тот\nMonzaemon, которого вы знаете."
text.0b38: "А? В смысле? Но \nон же Monzaemon, так?"
text.0bb2: "Да, он правда\nMonzaemon."
text.0c0a: "Злодей по имени WaruMonzaemon\nпохитил моих друзей."
text.0c7a: "Думаю, одолеть его может\nтолько Monzaemon!"
text.0cec: "Хм, тогда надо найти\nэтого злодея. Где он?"
text.0d5a: "Он в соседнем доме. Я сниму\nпечать с двери."
text.0dc2: "Так что, пожалуйста, сходи\nи посмотри, что можно сделать."
text.0e14: "Понятно. Ладно,\nя помогу!"
text.0e60: "Спасибо!"
text.0e88: "Спасибо!"
text.0eb0: "Спасибо!"
