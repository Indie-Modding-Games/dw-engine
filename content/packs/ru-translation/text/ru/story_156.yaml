text.0042: "Будем переделывать.\nЦена — две тысячи Bits."
text.00be: "Стиль не тот.\nПеределать не выйдет."
text.011a: "Давай\nНе надо"
text.015a: "У тебя не хватает Bits."
text.01a0: "Минутку."
text.01d4: "Не получилось, но..."
text.0214: "Ого, он стал Giromon!"
text.0262: "Получилось!"
text.029a: "Ого, он стал\nMetalMamemon!"
text.02e6: "Не получилось."
text.030c: "Какой ужас!"
text.032e: "Прости..."
text.0350: "Сложение, удаление!"
text.0392: "Главная цель —\nуничтожить железо."
