text.0024: "Привет, {color:6}{tamer}{color:1}.\nСюрприз! Я открыл\nклинику!"
text.007a: "Здесь лечат болезни\nи раны. Не бесплатно,\nно недорого."
text.0130: "Твой Дигимон неважно\nвыглядит. Позаботься\nо его здоровье."
text.01be: "Я сейчас его вылечу\nсо скидкой.\nС тебя 300 Bits."
text.025e: "Не хватает Bits?\nЗаплати, сколько можешь."
text.0304: "Теперь всё в порядке.\nТолько впредь будь осторожен."
text.038a: "Твой Дигимон в порядке.\nЧто тебе нужно?"
text.03e6: "Снять усталость\nКупить лекарство\nНичего"
text.046c: "Усталость у {color:10}{partner}{color:1} очень\nвысокая, ему пора отдохнуть."
text.04ec: "{color:10}{partner}{color:1} устал.\nЕму пора отдохнуть."
text.0548: "{color:10}{partner}{color:1} немного\nустал. Ему не стоит\nперенапрягаться."
text.05c2: "{color:10}{partner}{color:1} в порядке.\nСледи за его усталостью."
text.0634: "Ему стало полегче?"
text.066e: "Нужно что-то ещё?"
text.06a0: "Ещё отдохнуть\nКупить лекарство\nНичего"
text.0706: "С ним всё будет хорошо."
text.0732: "Бинт: 400 Bits\nЛекарство: 1200 Bits\nНе покупать"
text.07c0: "Если ему станет плохо,\nприходи ко мне."
text.0826: "Если он всё ещё устал,\nтренируй его меньше, корми\nи укладывай спать вовремя."
text.08c8: "Долгое пребывание в холоде\nили жаре может\nвызвать болезнь."
text.0958: "Бинт помогает\nтолько от ран."
text.09b2: "Лекарство лечит болезни,\nно усталость\nне снимает."
text.0a50: "Если в конце боя мало HP,\nДигимон легко может\nполучить рану."
text.0ae8: "Если счастье высокое,\nа усталость низкая,\nДигимон проживёт долго."
text.0b8c: "Тебе не хватает Bits.\nЯ не могу это продать."
text.0c0e: "Слишком много предметов."
text.0c62: "Тебе не хватает Bits.\nЯ не могу это продать."
text.0ce4: "Слишком много предметов."
text.0d28: "Нужно что-то ещё?"
text.0d5a: "Снять усталость\nЕщё лекарство\nНет, ничего"
