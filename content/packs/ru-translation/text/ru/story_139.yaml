text.005a: "Этот костюм не похож\nна другие. От него веет\nкакой-то мощью."
text.0130: "Сзади есть молния."
text.018e: "Что случилось, {color:10}{partner}{color:1}?!"
text.01d4: "Что? Ты стал\nдругим Дигимоном?\nА неплохо."
text.0250: " {color:10}{partner}{color:1},\nхочешь залезть внутрь?"
text.02ae: "Нет, тебе нельзя, {color:10}{partner}{color:1}.\nВлезет только тот, кто\nгибкий и скользкий."
