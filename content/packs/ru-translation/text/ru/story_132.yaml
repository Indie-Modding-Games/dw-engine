text.0028: "Где мы?\nЭто сон?"
text.008c: "Ой! Ты кто?\nГде {color:10}{partner}{color:1}?"
text.00e2: "Успокойся. Меня зовут\nFrigimon. Это мой дом.\nЯ ледяной Дигимон."
text.017c: "Ты лежал без сознания\nв снегу. Я тебя подобрал\nи выходил."
text.0218: "О, {color:10}{partner}{color:1}.\nКак хорошо, что ты цел!"
text.025c: "Эй, ты меня слушаешь?\nЕсли бы не я,\nты бы уже замёрз насмерть!"
text.02f6: "Ой, прости. Ну, спасибо."
text.033e: "Эй, {color:10}{partner}{color:1},\nя даже ударился головой,\nкогда ты вдруг упал."
text.03be: "{digimon:pstat=103}не выносит холода.\nТы такой безрассудный.\nЭто всё ты виноват."
text.0452: "Я не знал.\nПрости, {color:10}{partner}{color:1}."
text.049e: "Спасибо, Frigimon. Можно\nпопросить ещё об одном?"
text.0504: "А что, если\n{digimon:pstat=103}снова упадёт?\nЛучше поскорее иди домой!"
text.058e: "Ладно, понял.\nПусть {color:10}{partner}{color:1}\nдигиэволюционирует."
text.062c: "Дигиэволюционирует?"
text.06c8: "И снова привет."
text.06e8: "А что стало\nс тем Дигимоном?"
text.0732: "Так это он и есть."
text.076a: "А? Правда?\nНичего не понимаю."
text.07bc: "Я пришёл с просьбой.\nХочу, чтобы ты\nпереехал в город."
text.0850: "А что мне там делать?\nЧто-нибудь интересное?"
text.08b6: "Ну, можешь открыть\nлюбой магазин."
text.0914: "Ух ты, я всегда об этом\nмечтал. Ладно, еду!"
text.0980: "Вот и хорошо.\nТогда идём прямо сейчас."
text.09d8: "Магазин! Фруктовый лёд\nи мороженое. Вот это\nбудет здорово!"
text.0a94: "Frigimon теперь живёт\nв городе!"
text.0ad6: "Этот Дигимон совсем\nне выносит холода!"
text.0b36: "Я ещё вернусь!"
