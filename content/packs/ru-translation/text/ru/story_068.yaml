text.00ce: "Ха-ха, тронешь меня —\nи тебя ударит током."
text.016a: "Не хочешь тут побыть?"
text.01ee: "Ух ты, здорово! Смелый какой."
text.022c: "Из тебя выйдет толк!\nЛадно, я помогу."
text.029a: "Может, отдашь свою\nэлектросилу городу?"
text.0300: "Городу? Это что?\nЗвучит знакомо, но..."
text.035a: "Я помогу. Я Elecmon,\nрад знакомству."
text.03ec: "Elecmon теперь живёт\nв городе!"
text.0432: "Уггх!"
text.0454: "Ааах!"
text.0474: "Тебе конец!"
text.04ac: "Неплохо."
text.04d2: "Вкус у тебя так себе."
text.050e: "Зазнайка! Я тебя проучу."
text.057e: "Железная дверь крепкая.\nЕсли она не откроется,\nнам не войти."
