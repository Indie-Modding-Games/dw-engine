text.0072: "Жарко! Ну и жара!"
text.00a4: "Закипело!"
text.00e0: "А, понятно."
text.010a: "Ладно, давай!"
text.0142: "С меня хватит!"
text.0178: "Нет уж, спасибо!"
text.01a2: "Что?"
text.01c2: "М-м-м-м!"
text.01f4: "Есть у меня плохое\nпредчувствие."
text.022c: "И у тебя? Я так и думал."
text.0288: "В туннеле ничего нет.\nПройдём через него?"
text.02f0: "Пойти\nНе идти"
