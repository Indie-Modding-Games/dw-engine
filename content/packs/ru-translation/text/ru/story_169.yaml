text.0072: "Ты пришёл, {color:6}{tamer}{color:1}!"
text.009a: "Мы охотники за сокровищами.\nМы копаем и находим\nсокровища под землёй."
text.013e: "Сокровища — это ко мне."
text.0196: "Хочешь, я что-нибудь\nнайду? Или объяснить,\nкак мы работаем?"
text.0230: "Объяснить\nНе объяснять\nНеважно"
text.0286: "У нас два плана: разные\nсроки и разные цены."
text.02ee: "Обычный: 3 дня, 1000 Bits\nОсобый: 10 дней, 5000 Bits"
text.036a: "С особым планом больше\nшансов найти сокровище\nполучше."
text.03f6: "Вот и всё.\nЧто будешь делать?"
text.044e: "Искать клад\nЕщё раз объяснить\nНеважно"
text.04b0: "Выбери план!"
text.04d4: "Обычный: 3 дня, 1000 Bits\nОсобый: 10 дней, 5000 Bits\nОтмена"
text.056e: "Ладно, тогда пока."
text.05c4: "Результаты будут через\nтри дня. Пожелай удачи."
text.066a: "Результаты будут через\nдесять дней. Пожелай удачи."
text.06ea: "У тебя не хватает Bits.\nБез денег сокровища\nне найти."
text.07a4: "Я как раз ищу сокровища.\nНемного потерпи."
text.082a: "Знаешь что?\nМы нашли сокровище."
text.0b00: "Освободи место в сумке!"
text.0b32: "Я получил {color:6}{item:pstat=110}{color:1}!"
text.0dae: "Спасибо, что зашёл!"
text.0de8: "Спасибо за заказ,\n{color:6}{tamer}{color:1}!"
text.0e2a: "Я недавно начал помогать\nDrimogemon. Я здорово\nумею искать вещи."
