text.004e: "Плохое у меня предчувствие...."
text.0098: "Я знал, что ты придёшь!"
text.00e4: "Ты кто?"
text.0104: "Я Devimon, тёмный ангел.\nМне подвластна сила тьмы."
text.017c: "Ты что-то знаешь?"
text.01b0: "Myotismon в особняке.\nМожет, он ещё жив."
text.021e: "Это твоих рук дело?"
text.024a: "Не знаю...знаю только,\nчто ты мой враг."
text.02c2: "Ты не уйдёшь!"
text.030c: "Ха-ха-ха!"
text.034a: "Ой, нет!"
text.036e: "Передай привет Myotismon."
text.03cc: "Он сбежал!\nНе нравится он мне."
text.048a: "Какой огромный особняк!"
text.04ca: "Есть кто дома?"
text.0500: "Дома никого или\nменя не слышат."
text.0566: "Ладно. Начнём осмотр!"
text.05be: "Я использовал\n{color:6}Ключ особняка{color:1}!"
text.0622: "Не открывается.\nЗаперто."
text.069a: "Я использовал\n{color:6}Ключ особняка{color:1}!"
text.06fe: "Не открывается.\nЗаперто."
text.0776: "Я использовал\n{color:6}Ключ особняка{color:1}!"
text.07da: "Не открывается.\nЗаперто."
text.0866: "Не открывается. Её держит\nкакая-то странная сила."
