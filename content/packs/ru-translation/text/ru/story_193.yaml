text.0050: "Он здесь! Получилось!"
text.0094: "Человек.\nКак ты и говорил, Jiji."
text.00e8: "Мм-м."
text.0102: "Тсс, он просыпается."
text.0140: "А? Где я?"
text.0170: "Добро пожаловать\nв Мир Дигимонов!"
text.01ae: "Что?"
text.01d0: "Ой!"
text.01ec: "Что с тобой?"
text.0220: "Вы кто такие?"
text.0266: "Мы Дигимоны."
text.0296: "Диги... кто?"
text.02c0: "А? Я думал, ты знаешь\nпро Дигимонов."
text.0320: "Понял, это сон."
text.0364: "Это не сон."
text.039a: "Стой, ты же Tokomon.\nКакой реалистичный сон."
text.0412: "{color:6}{tamer}{color:1}, это\nне сон, но и не\nреальность."
text.048a: "О чём ты говоришь?\nТы кто?"
text.04ea: "Я Jijimon."
text.0514: "Не знаю Дигимона\nс таким именем."
text.0576: "Дигимонов больше,\nчем ты знаешь.\nЭто Мир Дигимонов."
text.0600: "Мир Дигимонов?!"
text.0636: "Этот мир не сон,\nно и не реальность.\nЭто наш мир."
text.06b8: "Ух ты... Для сна всё\nслишком настоящее."
text.071e: "Оглянись,\nи ты поймёшь."
text.077a: "Что?"
text.07b6: "Это {color:10}{partner}{color:1}?"
text.07e2: "Вспомнил! Меня затянуло\nв тот брелок с Дигимоном."
text.0864: "Верно."
text.0892: "Зачем я здесь?"
text.08be: "Пойдём ко мне домой,\nя всё объясню."
text.0a62: "Я позвал тебя сюда,\nчтобы ты нас спас."
text.0aaa: "Спас от чего?"
text.0ae0: "Мы в Городе Файл, это\nцентр острова Файл."
text.0b58: "Город? Здесь?"
text.0b86: "Ну, раньше был город.\nЗдесь жили самые\nразные Дигимоны."
text.0c2e: "Дигимоны пали духом\nи ушли из города."
text.0ca6: "Что ты имеешь в виду?"
text.0cdc: "Не знаю, в чём причина.\nДигимоны стали\nразучиваться говорить."
text.0d84: "Кто-то ещё говорит, но\nвсе забыли, что жили\nздесь."
text.0e14: "Вот что значит\n«пали духом»."
text.0e70: "Если ничего не делать,\nбудет беда."
text.0ebc: "Но почему я?"
text.0ee2: "Ты ведь умеешь\nрастить Дигимонов?"
text.0f3c: "Ещё бы, умею!"
text.0f7c: "Ты не заметил, что\nговоришь по-дигимонски?"
text.0fe6: "А? Да нет же. Я говорю\nна обычном русском."
text.104e: "А нам слышится\nдигимонский."
text.10a2: "Верно!"
text.10d4: "В этом мире твоя любовь\nк Дигимонам даст\nтебе силу."
text.1158: "Спасибо."
text.1176: "Поэтому я выбрал тебя.\nТы сможешь собрать всех\nДигимонов острова!"
text.120a: "Что?"
text.121c: "Хм?"
text.122c: "Можешь на меня\nрассчитывать!"
text.126c: "Отлично!"
text.1294: "Спасибо, ты наша\nединственная надежда."
text.12da: "С чего мне начать?"
text.130c: "Возьми {color:10}{partner}{color:1} и\nисследуй остров."
text.1360: "Найди причину беды\nи верни Дигимонов\nв город."
text.13f6: "Вперёд, {color:10}{partner}{color:1}!"
text.1444: "Погоди, я ещё не договорил."
