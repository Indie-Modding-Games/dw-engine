text.00ae: "Чего тебе?!"
text.00e8: "Ух ты!"
text.0104: "...? ...!"
text.011e: "Что? Прямо сейчас?!\nЛадно, давай драться!"
text.0196: "Я проиграл. Вот досада!"
text.01bc: "Надо бы позвать его\nв город."
text.0206: "Э-э, извини."
text.022c: "Может, ты...\nпереберёшься в город...?"
text.027e: "Что? В город?!"
text.029c: "В эту... старую дыру?"
text.02dc: "Ну..."
text.02f0: "Э-э......"
text.0306: "Хм-м........."
text.0332: "Ну, ладно.\nЯ Agumon.\nПриятно познакомиться."
text.03c6: "Agumon теперь живёт в городе!"
text.0408: "Вот, попытка не пытка.\nБуду звать и дальше!"
text.0478: "Это моя территория!"
text.04b8: "Что?!"
text.04da: "Вот мой шанс!"
text.0810: "Никак не могу отделаться\nот этого типа!"
