text.008e: "Хм"
text.00b4: "Похоже на птичье гнездо.\nКак думаешь?"
text.012e: "Я слышу шум."
text.01bc: "А ты хорош."
text.01dc: "Так это твоё гнездо."
text.020c: "Ага."
text.0222: "Прости, что вошли без спроса."
text.026a: "Ой, не переживай."
text.02a4: "?"
text.02ae: "Я о тебе слышал."
text.02da: "Не знал, что я знаменит."
text.0318: "Ты, наверное, последний\nчеловек на острове."
text.0388: "Последний...? А до меня\nбыли и другие?"
text.03e0: "Ты разве не позовёшь\nменя в город?"
text.0440: "Ах да, может, переедешь\nв город?"
text.0492: "Хорошо. Тогда за дело.\nДержись крепче."
text.0534: "Birdramon теперь живёт\nв городе!"
text.066a: "Лифт"
text.0682: "Вниз один раз\nВниз два раза\nНе садиться"
text.074e: "А?"
text.075c: "Никак. Не работает."
