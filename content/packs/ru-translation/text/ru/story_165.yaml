text.0060: "Ты пришёл как раз вовремя!\nЕсть большая просьба, и\nсправишься с ней только ты."
text.010c: "Какая?"
text.012a: "Это то же зло, что я\nчувствовал в Analogman\nи Machinedramon."
text.01a6: "Но я не могу понять,\nоткуда оно исходит."
text.01fe: "Хорошо, предоставь это мне!"
text.0236: "Спасибо. Кстати..."
text.0282: "Я слышал, ты победил\nMachinedramon!"
text.02d2: "Да, но я не понимаю.\nЭто было похоже на\nпроклятие Analogman."
text.035a: "Его злоба была так сильна.\nМожет, теперь будет мир."
text.03ce: "Если Machinedramon вернётся,\nмы снова его победим."
text.0436: "Тебе можно доверять. Вот\nтебе в знак благодарности.\nВыросло на нашей мясной ферме."
text.04d8: "Ого! Это\n{color:6}Дыня-цепь{color:1}?"
text.0530: "У меня слишком много вещей."
text.0570: "С радостью приму, спасибо!"
text.05c8: "О, ты вернулся!\nЭто я больше никого\nпопросить не могу."
text.0648: "Ладно. Хочешь сказать,\nAnalogman вернулся?"
text.0698: "Я чувствую его зло, но\nне знаю, где он."
text.06fc: "Хорошо, предоставь это мне!\nЯ найду его и\nсо всем разберусь."
text.0780: "О, спасибо. Кстати..."
text.0800: "Ты очнулся. Мне так жаль."
text.086a: "Что это за машина?"
text.08a6: "Это {color:4}автомат записи\nданных для боя с\nкарты памяти{color:1}."
text.0914: "С его помощью можно\nсохранить данные твоего\nнапарника для боёв."
text.09aa: "Просто нажми\n{color:6}△ {color:1}— и автомат\nподскажет, что делать."
text.0a4e: "Хочешь воспользоваться\n{color:4}автоматом записи для\nбоя с карты памяти{color:1}?"
text.0ace: "Да\nНет"
text.0b04: "Похоже, Yuramon собрал\nновые слухи."
text.0b78: "Говорят, Yuramon знает\nновые слухи."
text.0bda: "Раз мы здесь, город\nначинает расти\nи меняться."
text.0c5a: "{color:6}{tamer}{color:1}, у тебя совсем\nдругой подход\nк приключениям."
