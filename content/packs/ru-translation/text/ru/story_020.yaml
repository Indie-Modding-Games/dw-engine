text.0066: "Будем драться?\nИли струсил?!"
text.00b2: "Давай драться\nПогоди-ка"
text.011e: "Ой-ой! Я проиграл!"
text.0152: "А он был силён."
text.019a: "Ты славный. Я Mamemon.\nЯ пойду с тобой."
text.0200: "С нами? Слушай, а почему\nбы тебе не пойти в город?"
text.0272: "Ладно. Пойду туда."
text.02d6: "Mamemon теперь живёт\nв городе!"
text.0320: "Приходи, когда\nстанешь сильнее."
text.039c: "Да-а-а-а!"
text.03be: "Ха-ха-ха."
text.03ea: "Ух-х-х!"
text.0410: "Восток: Родной лес\nЗапад: Саванна Шестерён"
