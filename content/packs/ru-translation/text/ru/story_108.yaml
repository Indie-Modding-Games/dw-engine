text.004e: "{color:5}Тренировка:\nВалун, улучшенная {color:1}"
text.00a4: "{color:5}Тренировка:\nВалун {color:1}"
text.00e0: "Начать\nОбъяснить\nВыйти"
text.0116: "Обычная\nДоп. попытка\nВыйти"
text.0152: "Толкай валун и набирайся\nсил. Растут макс. HP\nи Атака."
text.01ec: "Ещё раз объяснить\nНачать\nВыйти"
text.0246: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
text.02d6: "{color:5}Тренировка:\nВодопад, улучшенная {color:1}"
text.0322: "{color:5}Тренировка: Водопад {color:1}"
text.0354: "Начать\nОбъяснить\nВыйти"
text.038c: "Обычная\nДоп. попытка\nВыйти"
text.03ca: "Стой под водопадом.\nРастут макс. MP\nи Защита."
text.0448: "Ещё раз объяснить\nНачать\nВыйти"
text.04a2: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
text.0532: "{color:5}Тренировка:\nУдары по дереву, улучш. {color:1}"
text.0582: "{color:5}Тренировка: Удары по дереву {color:1}"
text.05bc: "Начать\nОбъяснить\nВыйти"
text.05f4: "Обычная\nДоп. попытка\nВыйти"
text.0632: "Отрабатывай удары по дереву.\nСильно растут Атака\nи Скорость."
text.06c2: "Ещё раз объяснить\nНачать\nВыйти"
text.071c: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки"
text.07aa: "{color:5}Тренировка: Груша,\nулучшенная {color:1}"
text.0800: "{color:5}Тренировка: Груша {color:1}"
text.083c: "Начать\nОбъяснить\nВыйти"
text.0874: "Обычная\nДоп. попытка\nВыйти"
text.08b2: "Набирайся сил, колотя\nгрушу. Растут Защита\nи Интеллект."
text.0946: "Ещё раз объяснить\nНачать\nВыйти"
text.09a0: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
text.0a30: "{color:5}Тренировка:\nБег, улучшенная {color:1}"
text.0a78: "{color:5}Тренировка: Бег {color:1}"
text.0aa6: "Начать\nОбъяснить\nВыйти"
text.0ade: "Обычная\nДоп. попытка\nВыйти"
text.0b1c: "Бегай по дорожке.\nСильно растут\nСкорость и макс. HP."
text.0b88: "Ещё раз объяснить\nНачать\nВыйти"
text.0be2: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
text.0c72: "{color:5}Тренировка:\nШкола {color:6}{tamer}{color:1}{color:5},\nулучшенная {color:1}"
text.0ccc: "{color:5}Тренировка:\nШкола {color:6}{tamer}{color:1}{color:5} {color:1}"
text.0d0c: "Начать\nОбъяснить\nВыйти"
text.0d44: "Обычная\nДоп. попытка\nВыйти"
text.0d82: "{color:6}{tamer}{color:1} многому научит.\nРастут Интеллект\nи макс. MP."
text.0df2: "Ещё раз объяснить\nНачать\nВыйти"
text.0e4c: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
text.0ece: "Эй, есть новости."
text.0efe: "Малышам и Ученикам\nполезно повторять одну\nи ту же тренировку."
text.0f88: "Случится кое-что хорошее."
text.0fd4: "Есть новости."
text.0ffa: "Если в доп. попытке выпадут\nодинаковые картинки, его\nспособность сильно вырастет."
text.10b0: "Ой, я же хотел рассказать\nпро приёмы."
text.110e: "Приём, который использует\nвраг, можно освоить,\nесли выиграть бой."
text.1198: "Но только те приёмы, которые\nможно выучить в этот\nмомент."
text.1226: "Освоить всё не получится.\nНо бои — самый быстрый\nспособ освоить приёмы."
text.12d0: "Можно и на тренировках,\nно шансов немного."
text.134e: "Когда поумнеешь, походи\nв школу {color:6}{tamer}{color:1} — может,\nвыучишь приём."
text.13e6: "Шансы выучить невелики,\nтак что не жди многого.\nТренируйся разносторонне!"
text.148c: "Привет, я Koromon.\nJiji попросил рассказать\nтебе о тренировках."
text.1506: "Хочешь что-то спросить?"
text.153c: "Какие тренировки?\nКак тренироваться?\nНет, ничего"
text.15b2: "Тренируясь здесь,\nможно развить способности\nсвоего Дигимона."
text.162c: "От тренировок устаёшь,\nно пользы от них больше,\nчем от настоящего боя."
text.16c8: "А ещё, хоть и очень редко,\nможно освоить новый приём."
text.173a: "Про приёмы расскажу\nв следующий раз."
text.17a0: "Здесь шесть тренировочных\nснарядов, и у каждого\nесть табличка."
text.182a: "Нажми {color:6}△ {color:1}\nперед табличкой."
text.187c: "Прочитай таблички и узнаешь,\nкакие способности\nможно развить."
text.18fe: "Смотря в чём силён твой\nДигимон, одни способности\nрастут больше других."
text.19aa: "Но точно не узнаешь,\nпока не попробуешь."
text.1a0a: "После «Начать»\nвыбери «Обычная» и\nтренируйся один час."
text.1a7a: "Во время тренировки\nкнопкой {color:5}× {color:1}можно\nпромотать время."
text.1ae6: "Ах да, надо рассказать\nпро «Доп. попытку»."
text.1b48: "Если доп. попытка удастся,\nсила сильно вырастет,\nа если нет — чуть-чуть."
text.1be4: "Попробуй разок — увидишь."
text.1c24: "Ладно, скоро раздобуду\nдля тебя ещё новостей."
text.1d7c: "Я был в городе. Но там\nдля меня слишком шумно,\nвот я и пришёл сюда."
text.1e10: "Я переделал снаряды.\nСтали лучше. Тренируйся!"
text.1e86: "Я был в городе. Но там\nдля меня слишком шумно,\nвот я и пришёл сюда."
text.1f1a: "Я переделал снаряды.\nСтали лучше. Тренируйся!"
