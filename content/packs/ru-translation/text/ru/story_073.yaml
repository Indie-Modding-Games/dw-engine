text.00cc: "Что такое?"
text.00f4: "ПОМОГИТЕ!"
text.0114: "Он в беде,\nнадо ему помочь!"
text.0174: "{color:7}??? {color:1}\nНе трогай тех,\nкто меньше тебя!"
text.01e4: "Кто это?"
text.0270: "Ты цел?"
text.0298: "Спасибо."
text.02b4: "Зови меня, если попадёшь\nв беду. Я сразу\nже приду!"
text.032e: "До встречи!"
text.035e: "Эй, подожди!"
text.039a: "Прямо герой.\nВся слава ему одному."
text.0404: "Это мой дом. Уходи!"
text.044a: "Я Sharmamon. А ты кто?"
