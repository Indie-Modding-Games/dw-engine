text.0020: "Ну, что будешь\nзаказывать?"
text.0080: "Что хочешь съесть?"
text.00cc: "Эй, что будешь есть?"
text.0110: "Красный рамен: 400 Bits\nОстрое карри: 1200 Bits\nПохлёбка: 3500 Bits"
text.01e0: "Похоже, тебе\nне хватает Bits."
text.0246: "{color:10}{partner}{color:1} с удовольствием\nсъел острый красный рамен!"
text.02b4: "Атака увеличена на 1!\nИнтеллект увеличен на 1!"
text.0320: "Счастье выросло!\nУсталость снизилась!"
text.0386: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.03e0: "Похоже, тебе\nне хватает Bits."
text.0446: "{color:10}{partner}{color:1} с удовольствием\nсъел жгучее карри!"
text.04bc: "Атака увеличена на 3!\nИнтеллект увеличен на 2!"
text.0532: "Счастье выросло!\nУсталость снизилась."
text.0598: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.05f2: "Похоже, тебе\nне хватает Bits."
text.0658: "{color:10}{partner}{color:1} с удовольствием\nсъел лавовую похлёбку!"
text.06c4: "Атака увеличена на 5!\nИнтеллект увеличен на 3!"
text.073c: "Счастье выросло!\nДисциплина упала!\nУсталость снизилась!"
text.07ce: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.0814: "Заходи когда угодно."
text.0842: "Драконья лапша: 400 Bits\nЗаурус-пицца: 1000 Bits\nЮрский бургер: 2500 Bits"
text.091a: "Тебе не хватает Bits."
text.096a: "{color:10}{partner}{color:1} с удовольствием\nсъел дикую драконью лапшу."
text.09e2: "Защита увеличена на 1!\nСкорость увеличена на 1!"
text.0a4c: "Счастье выросло!\nУсталость снизилась."
text.0ab2: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.0b0c: "Тебе не хватает Bits."
text.0b5c: "{color:10}{partner}{color:1} с удовольствием\nсъел заурус-пиццу!"
text.0bc8: "Защита увеличена на 3!\nСкорость увеличена на 2!"
text.0c30: "Счастье выросло!\nУсталость снизилась."
text.0c96: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.0cf0: "Тебе не хватает Bits."
text.0d40: "{color:10}{partner}{color:1} с удовольствием\nсъел юрский бургер!"
text.0db6: "Защита увеличена на 5!\nСкорость увеличена на 3!"
text.0e30: "Счастье выросло!\nДисциплина выросла!\nУсталость снизилась."
text.0ebe: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.0f04: "Ой, уже всё закончилось."
text.0f3a: "Стейк на кости: 1000 Bits\nDX-стейк: 2500 Bits\nФантом-стейк: 5000 Bits"
text.1012: "Тебе не хватает Bits."
text.1062: "{color:10}{partner}{color:1} с удовольствием\nсъел стейк на кости!"
text.10ce: "HP увеличено на 10!\nИнтеллект увеличен на 1!"
text.111a: "Дисциплина выросла\nУсталость снизилась."
text.1180: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.11da: "Тебе не хватает Bits."
text.122a: "{color:10}{partner}{color:1} с удовольствием\nсъел DX-стейк!"
text.129c: "HP увеличено на 30!\nИнтеллект увеличен на 2!"
text.12fa: "Счастье выросло!\nДисциплина выросла!\nУсталость снизилась!"
text.1388: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.13e2: "Тебе не хватает Bits."
text.1432: "{color:10}{partner}{color:1} с удовольствием\nсъел фантом-стейк!"
text.14ae: "HP увеличено на 50!\nИнтеллект увеличен на 3!"
text.150a: "Счастье выросло!\nДисциплина выросла!\nУсталость снизилась!"
text.1598: "{color:10}{partner}{color:1}, похоже,\nне голоден."
text.15de: "Приходи ещё!"
