text.0056: "Myotismon исчез."
text.009a: "О!"
text.00b8: "Я нашёл ключ. Может, он\nоткроет какую-то из дверей."
text.0128: "Я использовал\n{color:6}Ключ особняка{color:1}!"
text.016e: "Надо кое от чего избавиться."
text.01e2: "Я использовал\n{color:6}Ключ особняка{color:1}!"
text.0246: "Не открывается.\nЗаперто."
text.02d8: "Я использовал\n{color:6}Ключ особняка{color:1}!"
text.033c: "Не открывается.\nЗаперто."
text.03b0: "Ням-ням...."
text.03d0: "Так."
text.03e6: "Послушай меня."
text.0408: "Вкуснятина...."
text.0430: "Мои ребята меня не слушаются."
text.0470: "Похоже, они не помнят\nмоих приказов."
text.04ca: "Они больше не понимают.\nОни должны носить\nмне еду, но...."
text.0560: "Ням-ням...."
text.0580: "Пока я работал, еду\nмне не приносили,\nвот я и забыл поесть."
text.0614: "Ты слишком увлёкся\nработой."
text.0662: "Как неловко."
text.0690: "Похоже, в особняке\nбеда."
text.06e6: "На острове что-то стряслось?\nВсе как мои ребята?"
text.0754: "Да, все теряют\nпамять."
text.07a6: "Думаешь, кто-то\nэто задумал?"
text.07fa: "Хм?"
text.080a: "Чем я могу помочь?"
text.082e: "Мы строим город, чтобы\nобъединить сердца Дигимонов."
text.089e: "Мы ищем друзей."
text.08da: "Чем я помогу? Мои ребята\nумеют только драться."
text.0940: "Я не могу их бросить."
text.0978: "Понятно."
text.098c: "Дай мне подумать.\nМне очень жаль."
text.09e0: "Я ещё вернусь.\nНе забывай есть."
text.0b9c: "Спасибо за помощь.\nПокажу тебе свои записи."
text.0c02: "Иногда MetalGreymon,\nугасая, {stop}дигиэволюционирует\nв SkullGreymon."
text.0cac: "Bakemon, Devimon и\nPhoenixmon тоже\nдигиэволюционируют так."
text.0d22: "Кем они были при рождении,\nя не знаю. В схемах\nдигиэволюции об этом ни слова."
text.0dc6: "Бои пошли моим\nребятам на пользу."
text.0e0a: "Бой — хороший отдых\nот моих исследований."
text.0e64: "А что ты исследуешь?"
text.0eae: "В городе построили\nарену!"
text.0efc: "Может, мои ребята\nтам пригодятся?"
text.0f40: "Да, там они могут драться\nсколько душе угодно."
text.0fa4: "Моим ребятам всё хуже.\nПора покинуть\nособняк."
