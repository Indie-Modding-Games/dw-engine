text.0076: "О, большое спасибо!"
text.00a6: "Что? Драться хочешь?"
text.00f4: "О, огромное спасибо!"
text.0120: "Брось!"
text.0154: "Не перенапрягайся!"
text.0186: "Давай драться, сопляк!"
text.01c0: "Сдаюсь!"
text.01de: "Босс ушёл."
text.0262: "Эй, ребята, хотите пройти\nздесь — оставляйте\nвсе свои вещи!{stop}"
text.02ec: "Давно не виделись."
text.0316: "Хм. Опять вы!"
text.0346: "Это я должен сказать!\nТебя было легко найти.\nГотов проиграть?"
text.03c6: "Проиграть? Ни за что!\nСейчас увидишь, что я\nмогу, когда всерьёз!"
text.0444: "Решим это раз\nи навсегда!"
text.04de: "Как же так... я не могу\nпобедить?"
text.0520: "Что такое?\nНе будешь убегать?"
text.0578: "Я слишком устал."
text.059c: "..."
text.05aa: "Я стал разбойником, потому\nчто думал, что острову\nконец. Вот и творил что хотел."
text.0654: "Ты знал, что остров\nв беде?"
text.06aa: "Да, а потом появился ты.\nГлупо, наверное, теперь\nвдруг начать помогать."
text.0742: "Вовсе нет.\nПриходи в город."
text.0794: "Нет, не могу. К тому же,\nвряд ли кто-то простит\nмне всё, что я натворил."
text.083e: "Ох, помолчи уже\nи пойдём со мной!"
text.089c: "Ты можешь быть полезен!\nКаждому есть что\nпредложить!"
text.090c: "!!!"
text.0922: "Этот остров можно спасти?\nТы ведь спасёшь его\nдля нас, правда?!"
text.09ba: "Конечно! Ты ведь знаешь,\nгде город?"
text.0a1c: "О-о-о-о!\nЯ приду!"
text.0a84: "Ogremon теперь живёт\nв городе!"
text.0ad6: "Ой!\nВыход не здесь!"
text.0b32: "Ой-ой! Надо вернуть ящик\nдля земли Drimogemon!"
text.0be6: "Ой! Выход не здесь!"
text.0c42: "Ой-ой! Надо вернуть ящик\nдля земли Drimogemon!"
