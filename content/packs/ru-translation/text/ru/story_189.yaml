text.00a6: "Ты принёс что-нибудь,\nчтобы вылечить рану?"
text.0104: "Погоди секунду. Сейчас..."
text.014c: "У меня болит крыло!"
text.0170: "Что случилось?"
text.0194: "Я поранил крыло. У тебя\nесть чем вылечить рану?"
text.020a: "Выглядит плохо. Держись.\nЧто же мне делать?"
text.027c: "У меня сейчас ничего нет."
text.02f8: "Не то. Это не поможет!"
text.0346: "Гораздо лучше. Спасибо."
text.0386: "Ты уже можешь летать?"
text.03b6: "Далеко мне не улететь."
text.03f6: "В городе есть клиника.\nТебе стоит туда сходить.\nЭто недалеко отсюда."
text.048a: "Я слышал про город.\nОн больше, чем я думал."
text.04f8: "Иди в город и отдохни."
text.0534: "Спасибо. Может, когда-нибудь\nя тоже тебе помогу."
text.05c2: "Unimon теперь\nживёт в городе!"
text.0602: "Я принесу что-нибудь\nот твоей раны. Жди меня."
text.0678: "Спасибо. Только скорее!"
