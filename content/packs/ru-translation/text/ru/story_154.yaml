text.003e: "Здесь кто-то есть! Кто это?!"
text.00c4: "Хе-хе, я сломаю плохой\nкомпьютер! Хе-хе-хе!"
text.0284: "Это он... Эй!\nЭй, ты что делаешь?!"
text.02f0: "Да! Я всё уничтожу!\nУничтожу всё подряд.\nВсё плохое!"
text.04b2: "О нет, он спятил.\nОн Дигимон уровня Ультра,\nно его надо остановить!"
text.054c: "Хе-хе-хе,\nя вас всех уничтожу!"
text.06c4: "Ыыгх! Силы уходят."
text.0702: "Электричество кончается.\nПопросим Andromon перекрыть\nсточные воды фабрики."
