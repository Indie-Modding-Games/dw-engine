text.006a: "После последнего землетрясения\nземля и песок исчезли!"
text.00ee: "Сейчас:\nмесяц {num:pstat=105}, день {num:pstat=106},\n{num:pstat=107} ч. {num:pstat=108} мин."
text.016e: "{color:10}{partner}{color:1} — Дигимон\nтипа Данные, верно?"
text.01c6: "{color:10}{partner}{color:1} — Дигимон\nтипа Вакцина, верно?"
text.0224: "{color:10}{partner}{color:1} — Дигимон\nтипа Вирус, верно?"
text.027c: "Я на многое гожусь.\nЧто мне сделать?"
text.02f2: "Изменить параметры\nУскорить время\nСделать тут магазин"
text.038c: "Сделать сильнейшим\nСделать слабаком\nСделать средним"
text.0416: "Пусть пройдёт час\nПусть пройдёт 6 часов\nПусть пройдут сутки"
