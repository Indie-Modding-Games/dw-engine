text.0028: "Уггх!"
text.0060: "Что?"
text.007e: "Что?!"
text.009e: "Ой, босс, мы влипли!"
text.00e2: "Что вы тут делаете?"
text.011e: "Впечатляет. Ты нашёл\nновую Крепость Огра!"
text.018c: "Опять безобразничать будете?"
text.01d0: "Ещё бы! Хе-хе!"
text.01fa: "Я вам не позволю!\nЛучше убирайтесь\nиз этой пещеры!"
text.0278: "На этот раз всё иначе!"
text.02c0: "Босс, это он?"
text.02ee: "Да. Вперёд!"
text.033c: "Что за?!"
text.0360: "Господин WaruSeadramon!\nПрошу, сделайте это!"
text.03ca: "Это твой телохранитель, да?"
text.040c: "Хе-хе-хе! Тебе конец!"
text.0490: "Чёрт!"
text.04a2: "А-а-а-а-а!"
text.04c6: "Не дам тебе уйти!"
