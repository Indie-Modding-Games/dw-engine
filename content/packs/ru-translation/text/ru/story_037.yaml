text.00a2: "Я тебя вырублю!"
text.00de: "Эй, не толкайся!"
text.011a: "Как тут наверху спокойно!"
text.015c: "Я упаду! Опасно!"
text.01a6: "Не делай так тут наверху!"
text.01e8: "Даже не пытайся со мной\nдраться!"
text.0238: "Лифт"
text.0250: "Вниз\nНе входить"
text.0302: "Ничего не происходит.\nНехорошо."
