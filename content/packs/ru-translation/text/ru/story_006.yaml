text.0122: "Я выиграю!"
text.0150: "Не подходи! Уходи!"
text.0194: "Ну всё, я разозлился!"
text.01d0: "Ударишь — дам сдачи!"
text.0214: "Попробуй, если сможешь!"
text.02f4: "А, это ты, {color:6}{tamer}{color:1}.\nМост починили."
text.0348: "Слышал, ты строишь город."
text.0386: "У меня есть просьба.\nПомоги мне, как я\nпомог тебе."
text.040a: "?"
text.0414: "Строить город — значит\nспасать этот остров.\nВсе будут спасены."
text.04a2: "Значит, ты придёшь\nв город?"
text.04fc: "Да. Я приду в твой город."
text.0596: "Coelamon теперь живёт\nв городе!"
text.06b0: "Эй, ты человек?"
text.06dc: "Я Coelamon,\nДигимон-рыба.\nТы пришёл ко мне?"
text.0758: "Да, мы искали\nВообще-то, да"
text.07d0: "Ха-ха, вот как!"
text.080c: "Я уже знаю, что\nтебе нужно."
text.084e: "Мост выше по реке\nсломан, а тебе надо\nна тот берег. Так?"
text.08f2: "Понятно.\nЛадно, я помогу."
text.093c: "А-а, ты снова пришёл."
text.0a0a: "Иди прямо по нашим\nголовам. Не бойся."
text.0a7a: "Ну, поехали!"
text.0b94: "Этому миру нужно больше\nдружбы. Ещё увидимся."
