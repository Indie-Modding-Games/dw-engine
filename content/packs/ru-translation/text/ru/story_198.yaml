text.0064: "Это последний."
text.00a2: "Наконец-то мы здесь!"
text.00e0: "Путь свободен!"
text.0118: "Давай по-простому."
text.0154: "Это последний шанс!"
text.019a: "Ты правда пойдёшь?"
text.01f0: "Как страшно! Аж до\nмурашек по коже."
text.023a: "..."
text.0248: "Почему он меня не атакует?"
text.0282: "..."
text.0290: "Тебе разве не надо драться?"
text.02c8: "Скорее, пошли.\nНам надо испытать\nсвои силы."
text.0348: "Вперёд, {color:10}{partner}{color:1}!"
text.039c: "..."
text.03de: "Мы победили?"
