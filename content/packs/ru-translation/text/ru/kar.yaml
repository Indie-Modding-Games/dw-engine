"penguinmon_dialogue.0001": "Сначала выбери, пожалуйста,"
"penguinmon_dialogue.0002": "камень для кёрлинга."
"penguinmon_dialogue.0005": "Есть тяжёлые, средние и"
"penguinmon_dialogue.0006": "лёгкие, так что подумай,"
"penguinmon_dialogue.0007": "в каком порядке их бросать."
"penguinmon_dialogue.0009": "У некоторых камней четыре"
"penguinmon_dialogue.0010": "шипа. Они замирают там, где"
"penguinmon_dialogue.0011": "упали, и очень полезны."
"penguinmon_dialogue.0013": "Крестовиной влево и вправо"
"penguinmon_dialogue.0014": "выбери направление"
"penguinmon_dialogue.0015": "броска."
"penguinmon_dialogue.0017": "Вверх и вниз двигают экран."
"penguinmon_dialogue.0018": "Нажми {prompt:confirm}, чтобы"
"penguinmon_dialogue.0019": "задать направление броска."
"penguinmon_dialogue.0021": "Нажми {prompt:confirm}, когда шкала"
"penguinmon_dialogue.0022": "силы дойдёт до нужного"
"penguinmon_dialogue.0023": "уровня, чтобы задать силу."
"penguinmon_dialogue.0025": "Если камень остановится на"
"penguinmon_dialogue.0026": "отметке GOOD, ты получишь"
"penguinmon_dialogue.0027": "два очка."
"penguinmon_dialogue.0029": "Если он на синей линии, но"
"penguinmon_dialogue.0030": "вне центральной отметки GOOD,"
"penguinmon_dialogue.0031": "то одно очко."
"penguinmon_dialogue.0033": "Если заденешь BAD справа"
"penguinmon_dialogue.0034": "внизу, потеряешь два очка,"
"penguinmon_dialogue.0035": "так что будь осторожен."
"penguinmon_dialogue.0037": "А при ничьей"
"penguinmon_dialogue.0038": "побеждаю я!"
"penguinmon_dialogue.0039": "Итак, начинаем игру!!"
"penguinmon_dialogue.0042": "Не так уж ты и хорош!"
"penguinmon_dialogue.0045": "Битва только начинается!"
"penguinmon_dialogue.0049": "Эй, а ты неплох!"
"penguinmon_dialogue.0053": "Ура! Я победил!"
"penguinmon_dialogue.0057": "Эх, я проиграл. "
"metalmamemon_dialogue.0001": "Ага. Сначала надо выбрать"
"metalmamemon_dialogue.0002": "тип камня для кёрлинга."
"metalmamemon_dialogue.0005": "Я гений, так что бросаю"
"metalmamemon_dialogue.0006": "разные камни в нужном"
"metalmamemon_dialogue.0007": "порядке. В этом весь секрет."
"metalmamemon_dialogue.0009": "Камни с четырьмя шипами"
"metalmamemon_dialogue.0010": "останавливаются там, где"
"metalmamemon_dialogue.0011": "упали, так что они ценные."
"metalmamemon_dialogue.0013": "Направление броска выбирай"
"metalmamemon_dialogue.0014": "крестовиной,"
"metalmamemon_dialogue.0015": "двигая её влево и вправо."
"metalmamemon_dialogue.0017": "Экран прокручивается"
"metalmamemon_dialogue.0018": "крестовиной вверх и вниз."
"metalmamemon_dialogue.0019": "Нажми {prompt:confirm}, чтобы бросить."
"metalmamemon_dialogue.0021": "Нажми {prompt:confirm}, когда шкала"
"metalmamemon_dialogue.0022": "силы дойдёт до нужного"
"metalmamemon_dialogue.0023": "уровня, чтобы задать силу."
"metalmamemon_dialogue.0025": "Очки: если камень попадёт"
"metalmamemon_dialogue.0026": "на отметку GOOD,"
"metalmamemon_dialogue.0027": "получишь два очка."
"metalmamemon_dialogue.0029": "Если он на синей линии, но"
"metalmamemon_dialogue.0030": "вне центральной отметки GOOD,"
"metalmamemon_dialogue.0031": "то одно очко."
"metalmamemon_dialogue.0033": "Если попадёшь на BAD справа"
"metalmamemon_dialogue.0034": "внизу, будет минус два очка,"
"metalmamemon_dialogue.0035": "так что осторожнее."
"metalmamemon_dialogue.0037": "При ничьей побеждаю я!"
"metalmamemon_dialogue.0038": "Начинаем игру!!"
"metalmamemon_dialogue.0041": "Я выиграю!"
"metalmamemon_dialogue.0045": "Я ещё не проиграл!"
"metalmamemon_dialogue.0049": "Мне нельзя проиграть!"
"metalmamemon_dialogue.0053": "Да, я победил!"
"metalmamemon_dialogue.0057": "Эх, почти победил."
"menu.0000": "Играть    Правила"
