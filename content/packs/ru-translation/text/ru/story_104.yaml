text.0020: "Хочу победить Kabuterimon.\nЧто мне нужно для победы?"
text.0098: "Хм. Тебе надо стать сильнее.\nВообще-то есть верный\nспособ.... ну, держись."
text.015e: "Понятно. Ладно, потренируюсь."
text.019e: "Правда?! Тогда я тебя\nпотренирую!"
text.01e8: "Просто приходи в город."
text.0220: "..."
text.022c: "Ты очень добрый.\nЯ пойду в город."
text.02bc: "Kuwagamon ушёл в город!"
text.0304: "Эх, ты совсем не добрый.\nКак обидно!"
text.0368: "Эй, ты ведь бывал на этих\nтурнирах жуков, да?"
text.03d8: "Тогда расскажу тебе\nкое-что полезное."
text.042a: "Знаешь, где спит Kunemon?\nВ Родном лесу?"
text.0496: "Там спят Дигимоны-малыши.\nКогда они просыпаются,\nто становятся Kunemon."
text.051e: "Но иногда не становятся.\nТут уж как повезёт."
text.05a8: "Эй, ты ведь бывал на этих\nтурнирах жуков, да?"
text.0618: "Э-э... Такой, как сейчас,\nты не справишься."
text.0676: "Тогда расскажу тебе\nкое-что полезное."
text.06c8: "Знаешь, где спит Kunemon?\nВ Родном лесу."
text.0734: "Там спят Дигимоны-малыши.\nКогда они просыпаются,\nто становятся Kunemon."
text.07bc: "Но иногда не становятся.\nТут уж как повезёт."
text.0826: "Эй, хочешь участвовать\nв турнире жуков?"
text.0890: "Что это?"
text.08b0: "Запишись до десяти часов\nдвадцать второго числа."
text.0924: "Чего???"
text.0938: "Подробности узнаешь\nв день турнира."
text.099c: "О чём это он?\nНе понимаю..."
text.09ea: "Тренируемся усердно,\nно и отдыхать надо."
text.0a42: "Отдохнём часок?"
text.0a7e: "Отдохнём\nБез отдыха"
text.0ae0: "{color:5}Тренировка:\nМолот-машина {color:1}"
text.0b1e: "Начать\nОбъяснить\nВыйти"
text.0b56: "Обычная\nДоп. попытка\nНе надо"
text.0ba0: "Удары молот-машины\nделают тебя крепче.\nЗащита растёт."
text.0c3e: "Ещё раз объяснить\nНачать\nВыйти"
text.0c98: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ \nи собери три картинки."
text.0d22: "{color:5}Тренировка: Дорожка {color:1}"
text.0d54: "Начать\nОбъяснить\nВыйти"
text.0d8c: "Обычная\nДоп. попытка\nНе надо"
text.0dd6: "Беги против хода\nдвижущейся ленты.\nСкорость растёт."
text.0e5a: "Ещё раз объяснить\nНачать\nВыйти"
text.0eb4: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
