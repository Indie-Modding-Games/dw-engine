text.002a: "Я разбираюсь в предметах."
text.0056: "Всего существует сто двадцать\nвосемь видов предметов."
text.00d0: "Тридцать два из них — еда."
text.00fe: "Редкие предметы растут\nсами в одних местах, а\nв других их не найти."
text.018e: "Например, в Родном лесу\nможно найти\nСинее яблоко."
text.0204: "У этой еды особые\nсвойства, так что следи,\nкогда её есть."
text.02b8: "Теперь расскажу о\nпредметах дигиэволюции."
text.030c: "Предметы дигиэволюции, как\nи следует из названия,\nвызывают дигиэволюцию."
text.0392: "Есть много разных видов\nпредметов дигиэволюции."
text.0402: "Каждый вид превращает\nДигимона в Дигимона\nдругого типа."
text.0494: "Например, если использовать\nСерые когти, Дигимон\nстанет Greymon."
text.0528: "Предметы дигиэволюции —\nлегендарные вещи, и\nнекоторые единственные."
text.05b2: "Но иногда не получаешь\nдополнительных способностей,\nкак при обычной дигиэволюции."
text.0654: "А ещё падает счастье,\nтак что они не идеальны."
text.06ca: "Зато приятно стать\nименно тем Дигимоном,\nкаким хочешь."
text.0772: "Дигиэволюционировать можно\nтолько со стадии перед\nнужным Дигимоном."
text.081a: "Так что будь осторожен."
text.087c: "Эй! Ола, амигос!"
text.08a4: "Что это за магазин?\nЭто мой магазин?\nКупи что-нибудь, пожалуйста."
text.0942: "Смотри, {color:6}{tamer}{color:1}! В моём\nмагазине интересные вещи.\nНадеюсь, будешь заходить."
text.09f6: "Тут у меня вещи\nнеобычные, так что\nсмело покупай!"
text.0a9c: "Привет, незнакомец! Я знал,\nчто ты придёшь, {color:6}{tamer}{color:1}.\nНе удивляйся так."
text.0b1c: "Сумеешь ли ты обращаться\nс моими предметами? Решит\nтвой талант укротителя."
text.0be2: "Где я?\nЯ люблю тёмные места, и\nэтот магазин тому пример!"
text.0c88: "Ну что, {color:6}{tamer}{color:1}, спасибо,\nчто пришёл. Раз уж ты тут,\nкупи что-нибудь, а?"
text.0d48: "Привет, {color:6}{tamer}{color:1}. Ты пришёл!\nДавай, возьми мои\nочень полезные предметы."
text.0dec: "Привет, незнакомец!\nЯ знал, что ты придёшь,\n{color:6}{tamer}{color:1}. Не удивляйся так."
text.0e6c: "Сумеешь ли ты обращаться\nс моими предметами? Решит\nтвой талант укротителя."
