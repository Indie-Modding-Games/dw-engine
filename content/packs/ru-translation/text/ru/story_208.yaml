text.002e: "Ракушечная газета, номер 8\nДигимон-пришелец:\nМы нашли НЛО.\nСущество показалось нам\nи сказало странные слова.\nЭто инопланетянин?\nПоявится ли он снова?"
text.018a: "Назад\nВыйти"
text.01bc: "Ракушечная газета, номер 7\nMyotismon не уходит\nна покой:\nВ интервью он опроверг\nэти слухи.\nОн всё так же трудится\nи любит своих фанатов.\nА ещё он объявил, что\nего ученик SkullGreymon\nскоро дебютирует."
text.0368: "Назад\nДальше\nВыйти"
text.03d0: "Ракушечная газета, номер 6\nMyotismon уходит?:\nХодят слухи, что славный\nMyotismon уйдёт на покой.\nНа арене его давно никто\nне видел. Карьере конец.\nОн слишком стар."
text.0544: "Назад\nДальше\nВыйти"
text.05b4: "Ракушечная газета, номер 5\nСкрытое сокровище:\nКлассный магазин в Саванне\nШестерён. Открыт только с\n1-го по 15-е число каждый\nгод. Хозяин гордится\nсвоими редкими товарами."
text.0710: "Назад\nДальше\nВыйти"
text.0794: "Ракушечная газета, номер 4\nЛегендарный Дигимон?:\nГоворят, в Ледяном крае\nживёт Дигимон холодов.\nОн спас господина M.\nОн похож на большой\nснежный ком. Дигимоны,\nне любящие холод,\nберегитесь!"
text.094e: "Назад\nДальше\nВыйти"
text.09aa: "Ракушечная газета, номер 3\nСтраж озера?:\nСтраж озера живёт\nв озере Драконий Глаз.\nКто-то призвал это\nсущество, похожее\nна Дигимона. Исполняет\nли Страж желания?"
text.0b10: "Назад\nДальше\nВыйти"
text.0b80: "Ракушечная газета, номер 2\nНЛО!:\nПо сообщениям, НЛО видели\nу горы Панорама.\nНЛО похож на серебряное\nблюдо, снизу из него\nльётся свет.\nЭто пришельцы?\nПодробности позже."
text.0cf8: "Назад\nДальше\nВыйти"
text.0d48: "Ракушечная газета, номер 1\nБандитов больше нет!:\n{color:6}{tamer}{color:1} нашёл их\nлогово во главе с Ogremon.\nНо Ogremon \nна свободе, и жители\nвсё ещё волнуются."
text.0e70: "Дальше\nВыйти"
