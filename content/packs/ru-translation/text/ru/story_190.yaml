text.014c: "На земле какие-то\nстранные рисунки."
text.01a2: "Это те самые странные\nкруги? Они совсем свежие."
text.0238: "Их стало больше.\nДумаешь, это\nот НЛО?"
text.02d4: "Ух?!"
text.02f4: "Теперь их ещё больше."
text.032c: "Что ж, похоже, это значит..."
text.036a: "Что?"
text.03d0: "Пришелец?!"
text.03ec: "..."
text.03fa: "Ты Дигимон?"
text.0426: "..."
text.0434: "Да?"
text.044c: "..."
text.0472: "Я тебе не враг!"
text.04a8: "Хорошо, теперь ты понял."
text.04ea: "{color:6}{tamer}{color:1} попытался\nего убедить."
text.0526: "..."
text.0534: "Может, он не понимает."
text.0588: "Ладно."
text.05d4: "Vademon теперь\nживёт в городе!"
text.060a: "А?"
text.0618: "Он умеет говорить!"
