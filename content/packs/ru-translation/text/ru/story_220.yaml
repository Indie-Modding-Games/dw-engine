text.0022: "{color:7}Poyomon {color:1}\nPoyomon. Меня зовут Poyomon."
text.0084: "{color:7}Poyomon {color:1}\nРасскажу о дигиэволюции.\nНу... О том, что идёт\nпосле уровня Чемпион."
text.014e: "{color:7}Poyomon {color:1}\nЭто уровень Ультра.\nНо не каждый Чемпион\nобязательно эволюционирует."
text.0214: "{color:7}Poyomon {color:1}\nУсловия дигиэволюции\nсуровые, но на уровне Ультра\nжизнь становится длиннее."
text.02d8: "{color:7}Poyomon {color:1}\nС предметами дигиэволюции\nжизнь не удлиняется."
text.0370: "{color:7}Poyomon {color:1}\nРасскажу о дигиэволюции.\nНу... Об условиях \nдигиэволюции."
text.0428: "{color:7}Poyomon {color:1}\nВо-первых, вес должен быть\nблизок к весу след. уровня."
text.04b6: "{color:7}Poyomon {color:1}\nДальше: чем выше параметры,\nтем лучше, но каждый\nвлияет по-своему."
text.0566: "{color:7}Poyomon {color:1}\nОшибки ухода. Смотря какого\nДигимона ты хочешь, ошибки\nиногда даже на пользу."
text.062e: "{color:7}Poyomon {color:1}\nАх да, для некоторых\nДигимонов есть ещё\nособые условия."
text.06d6: "{color:7}Poyomon {color:1}\nНапример, очень высокая\nдисциплина или много боёв."
text.0756: "{color:7}Poyomon {color:1}\nЕсли их выполнить, можно\nдигиэволюционировать, даже\nне выполнив трёх основных."
text.082a: "{color:7}Poyomon {color:1}\nJiji сказал, что {color:10}{partner}{color:1}\nскоро дигиэволюционирует."
text.089c: "{color:7}Poyomon {color:1}\nОт Малыша до Ученика\nпроходит шесть часов."
text.0920: "{color:7}Poyomon {color:1}\nА до уровня Новичок\nвсего один день."
text.09ac: "{color:7}Poyomon {color:1}\nСледующий, уровень Чемпион,\nзанимает около трёх дней."
text.0a2c: "{color:7}Poyomon {color:1}\nСколько до следующего? Я\nзабыл, но дольше."
text.0ab4: "{color:7}Poyomon {color:1}\nВес, параметры и ошибки\nухода влияют на эволюцию."
text.0b42: "{color:7}Poyomon {color:1}\nПодробностей я не знаю,\nспрошу у Jiji в другой раз."
