text.0020: "С возвращением, {color:6}{tamer}{color:1}."
text.004c: "Я летописец Jijimon."
text.008a: "Я записываю всё, что знает\nJijimon, и передаю тебе."
text.00e8: "Если не знаешь, что делать,\nспроси меня, и я подскажу,\nкуда идти."
text.0184: "Все Дигимоны собрались\nв городе.\nОгромное тебе спасибо!"
text.0208: "Расскажу, что я знаю.\nТак, посмотрим..."
text.0266: "А ещё..."
text.0288: "И кроме того..."
text.0300: "Дигимоны-растения живут\nв лесу. Чем они ближе,\nтем хуже их видно."
text.03e6: "Дигимоны-насекомые любят\nзелень. Например, ту, что\nрастёт вокруг города..."
text.04a6: "В Тропических джунглях\nесть лес-лабиринт. Его\nохраняет сильный Дигимон."
text.0578: "Старожил в реке\nкого-то ждёт."
text.0616: "Есть Дигимон, который\nлюбит тёплые берега."
text.06b0: "На кладбищах есть призраки.\nПризраки любят поболтать."
text.0752: "В городской клумбе есть\nсекрет. Спроси у растения\nпро другое растение."
text.0828: "В Древнем Дино-крае опасно,\nно туда стоит заглянуть."
text.08ec: "Внутри горы Панорама течёт\nлава. Некоторые Дигимоны\nобожают жару."
text.09a4: "Вести Дигимона, любящего\nжару, в холодное место —\nне по правилам, но..."
text.0a88: "В Ледяном крае много\nДигимонов, готовых пойти\nс тобой. Иди на запад."
text.0b58: "На вершине Великого каньона\nживёт Дигимон-птица."
text.0bf8: "Великий каньон похож на\nлабиринт. Войти легко,\nа выйти трудно."
text.0cb0: "В Саванне Шестерён\nживёт Дигимон, который\nобожает электричество."
text.0d60: "В Туманной роще может\nпоявиться ранняя пташка."
text.0e02: "В Великом каньоне\nесть магазин, которым\nзаведует Дигимон."
text.0ea6: "Может, встретишь крылатого\nДигимона, что перелетает\nгору Панорама за один взмах."
text.0f84: "Саванна Шестерён подходит\nДигимонам, что низко летают.\nПоищи там."
text.104e: "Кое-кто из Дигимонов может\nзнать о тебе и бросить вызов."
text.10ee: "В Ледяном крае есть\nДигимоны, что живут в пещерах\nи зовут к себе в гости."
text.11be: "Зови в город трудолюбивых\nДигимонов, когда они\nзакончат свои дела."
text.12a2: "В Туманной роще легко\nспрятаться. А ты должен\nнаходить тех, кто прячется."
text.137c: "Когда о тебе пойдут слухи,\nвозвращайся."
text.141e: "У берегов Ледяного края\nвидна огромная тень.\nМожет, это Дигимон."
text.14f6: "Помоги Дигимонам, которые\nлюбят что-нибудь собирать.\nЗагляни в Ледяной край."
text.15b6: "На вершине горы Панорама\nтебя вызовет на бой Дигимон,\nесли попадёшься ему на глаза."
text.1694: "Дигимоны живут и в сырых\nместах вроде канализации.\nПомоги им с их бедами."
text.176c: "За озером Драконий Глаз\nживут Дигимоны-насекомые.\nСходи туда на рыбалку."
text.1832: "Когда Дигимон-андроид\nломается, он быстро\nи полностью чинит себя."
text.18fa: "Если боишься опасностей,\nупустишь из виду цель."
text.1966: "Нужно набраться смелости\nи хоть раз залезть\nна опасный утёс."
text.1a36: "Слушай, что говорят в городе\nо тех, кому нужна помощь."
text.1afc: "Недавно в людное место\nпереехал какой-то злюка.\nМожет, это..."
text.1be0: "Говорят, где-то зарыта\nстаринная табличка, но\nкому-то надо её откопать."
text.1ca8: "Редкий Дигимон появляется\nв джунглях и вызывает\nвсех на бой."
text.1d68: "Может, есть Дигимоны,\nчто живут на деревьях. Кто\nзнает?"
text.1e16: "В Железном городе на западе\nможет появиться редкий\nДигимон и вызвать всех на бой."
text.1efa: "Есть Дигимон-пришелец.\nКогда-нибудь ты его встретишь."
text.1f9e: "Есть Дигимон — мифический\nзверь. Он живёт в доме,\nчто остался без хозяев."
text.2076: "Ищи Nanimon, пока не\nнайдёшь настоящее\nсокровище."
text.2136: "Myotismon пропал.\nИди по следам, что\nостались в его особняке."
text.21f0: "Остались ещё неизвестные\nДигимоны, но сначала\nзакончи главные дела!"
text.22c4: "Последний Дигимон родится\nв последнем месте, куда\nты пойдёшь. Понимаешь?"
