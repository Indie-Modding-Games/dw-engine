text.034c: "Бакке. Ба Ккеа."
text.0374: "Я его всё ещё не понимаю."
text.03dc: "Понятно. Так ты\nнас охраняешь?!"
text.0438: "Смотри! Это моя особая\nдоска объявлений."
text.048a: "Городу нужны новости, вот я\nи решил выпускать газету!\nНу как тебе?"
text.053e: "Можешь на меня положиться\nв сборе новостей."
text.059e: "Ты читаешь мою газету."
text.05f0: "Ах, прохладно и приятно."
text.0630: "Когда тебе удобно,\nи на душе хорошо."
text.069e: "Как тебе мой магазин?"
text.06de: "Торговать я не мастер, но\nсейчас больше некому."
text.0766: "Приводи побольше Дигимонов!"
text.07c0: "Ну, что скажешь?"
text.07f8: "{color:7}Coelamon {color:1}\nМы решили помогать друг\nдругу и продавать всё это."
text.0912: "Ммм. Увидел вкусные\nрастения и решил поесть."
text.0986: "Наверное, в городе стало\nслишком ветрено."
text.09ee: "О, на днях мне\nслучайно попался\n{color:6}Гриб счастья {color:1}."
text.0a6c: "Говорят, он редкий."
text.0aa4: "А ещё я слышал про\n{color:6}Гриб-люкс{color:1}.\nВот бы его найти."
text.0b3e: "{color:6}Синее яблоко {color:1}\nиз Родного леса —\nобъедение."
text.0bb0: "{color:6}Оранж. банан {color:1}\nиз Тропических джунглей —\nобъедение."
text.0c2c: "{color:6}Ягодища {color:1}\nс горы Панорама —\nобъедение."
text.0c98: "{color:6}Сладкий орех {color:1}\nиз Саванны Шестерён —\nобъедение."
text.0d02: "{color:6}Суперовощ {color:1}\nс кладбища Overdell —\nэто вкусно."
text.0d70: "{color:6}Алая ягода {color:1}\nиз Древнего Дино-края —\nэто вкусно."
text.0dda: "{color:6}Опунция {color:1}\nиз Великого каньона —\nэто вкусно."
text.0e4e: "{color:6}Дигиананас {color:1}\nиз Туманной рощи —\nэто вкусно."
text.0ff6: "Мне есть что сказать."
text.102c: "Что там?\nПока!"
text.106c: "Видел, мы починили\nВосточный мост?\nМы так старались."
text.10f6: "Сейчас чиним Мост\nДигимонов. Подожди немного."
text.1166: "Говорят, на мысе Коэла на юге\nводится редкий Дигимон."
text.11e0: "Говорят, он появляется\nкаждый день под вечер."
text.125c: "Слушай, а ты знал, что\nна востоке города\nесть сломанный мост?"
text.12f0: "Мы думали, им никто не\nбудет пользоваться, и\nничего с ним не делали."
text.138e: "Мы думаем починить\nего сами."
text.13e8: "А пока сходи на запад\nи на юг.\nПотом возвращайся ко мне."
text.1496: "Ты был на Болоте Геко?\nТам озорной Дигимон\nможет тебя обмануть."
text.151c: "Помни: когда Дигимон\nдигиэволюционирует, его\nнабор приёмов меняется."
text.15ae: "Ну..."
text.15d6: "Как тебе? Я включил\nсвет. Достаточно светло?"
text.164e: "Сделаем наш город\nчистым и весёлым!"
text.16a6: "А от света есть\nкакая-то разница?"
text.16f0: "Ну, это смотря как\nпосмотреть."
text.1746: "Я здесь самый сильный."
text.1780: "Я не считаю, что слабее\nтебя. Приходи на Арену —\nсам увидишь."
text.1824: "Привет, {color:6}{tamer}{color:1}.\nЯ ищу в городе\nподозрительных типов."
text.18a2: "Что такое? Я ведь тебе\nне мешаю?!"
text.192a: "Добро пожаловать!\nДля тебя лучшая цена,\n{color:6}{tamer}{color:1}."
text.1998: "Торговать я не мастер,\nно и другие не лучше."
text.1a02: "Теперь я отвечаю за торговлю.\nНадеюсь, мы поладим."
text.1a74: "{color:6}{tamer}{color:1}, прошу, приведи\nкак можно больше\nДигимонов."
text.1b10: "Как тебе\nмой магазин?"
text.1b50: "Торговать я не мастер,\nно больше некому,\nтак что приходится."
text.1bcc: "Приводи поскорее\nпобольше Дигимонов."
text.1c32: "Ну, что скажешь?"
text.1c6a: "{color:7}Coelamon {color:1}\nМы решили помогать друг\nдругу и продавать товары."
