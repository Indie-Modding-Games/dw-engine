text.004c: "Торговый автомат"
text.007a: "Ничего себе, как дорого!"
text.00b6: "Мясо: 300 Bits\nДигигриб: 600 Bits\nНе покупать"
text.015e: "Мне не хватает денег."
text.01b2: "Мне не хватает денег."
text.01f6: "Выпало {color:6}Мясо{color:1}!"
text.023e: "Ой, слишком много вещей."
text.0286: "Выпал\n{color:6}Дигигриб{color:1}!"
text.02ec: "Ой, слишком много вещей."
text.0338: "Как рыбачить:\nСначала добудь «удочку».\nВ подменю {color:5}× {color:1}появится\nзначок «Рыбалка». Выбери\nего. Наживка: {color:6}△ {color:1}.\nВыбери что-нибудь\nиз своей еды."
text.0480: "Затем поверни влево или\nвправо. Подними удочку\nкнопкой {color:6}△ {color:1}, забрось\nснова кнопкой {color:6}△ {color:1}.\nЖди, пока поплавок дёрнется.\nДёрнулся — значит, клюёт.\nТяни кнопкой {color:6}△ {color:1}."
text.05f8: "Смотри на шкалу слева вверху.\nОтпусти {color:6}△ {color:1}, пока шкала\nне заполнилась, иначе леска\nпорвётся. Будь осторожен.\nЕсли подтянешь поплавок\nдостаточно близко к себе,\nрыба поймана."
text.077a: "Если на тени рыбы «X»,\nэту рыбу на твою наживку\nне поймать."
