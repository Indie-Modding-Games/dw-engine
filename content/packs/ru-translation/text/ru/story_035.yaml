text.009a: "Ха! Испугался."
text.00d4: "Иди-ка ты лучше домой!"
text.0114: "Кто туда войдёт,\nтот уже не выйдет."
text.0170: "Хе-хе!"
text.0198: "Подожди."
text.01b8: "В тебя вселятся."
text.0202: "Бакке-бакке?"
text.0226: "Похоже, он\nо чём-то спрашивает."
text.0272: "?...Да\n?...Нет"
text.02a8: "Бакке! Бакке-бакке?"
text.02d6: "Да\nНет"
text.0300: "Бакке-е-е...бакке-бакке?"
text.0338: "Да\nНет"
text.035e: "Бакке-бакке!\nБакке-е-е бакке бакке-е-е!"
text.03e8: "Bakemon теперь живёт\nв городе!"
text.0422: "Кажется, всё получилось."
text.046e: "Может, я его разозлил?"
text.04ea: "Меня остановила странная\nчёрная сила!"
text.0556: "Что?! Мои ноги..."
