text.00c8: "Добро пожаловать, юноша."
text.0108: "Ты ведь Cherrymon, да?"
text.0144: "Кто там?"
text.0164: "Чего ты хочешь\nот такого старика, как я?"
text.01ca: "Сначала развей туман."
text.0200: "В тумане ничего не видно.\nМожешь его убрать?"
text.026c: "Вот оно что. Понятно."
text.02a6: "... не можешь?"
text.02da: "Сначала выслушай меня.\nТак... с чего бы\nначать?"
text.0364: "Если ты знаешь о беде\nна острове, прошу,\nрасскажи мне."
text.03fa: "Так-так.\nБеда."
text.043e: "Остров начал меняться\nвосемьдесят лет назад,\nкогда сдвинулась земля."
text.04de: "Северо-восток острова\nвнезапно появился\nвосемьдесят лет назад."
text.0574: "С тех пор Дигимоны\nстали разъезжаться.\nВиды разделились."
text.05fa: "И каждый вид заговорил\nна своём языке."
text.066a: "Они забыли язык, на котором\nговорили в городе..."
text.06d2: "В итоге Город Файл\nпотерял почти всех\nсвоих жителей-Дигимонов."
text.0752: "А потом Дигимоны начали\nтерять память!"
text.07a8: "История острова, прошлое,\nчувства... с каждым днём\nвсё хуже."
text.0844: "Я должен сказать тебе\nкое-что важное, но тоже\nне могу вспомнить."
text.08e6: "Но в конце концов всё\nсойдётся. Кто-то\nсделает так!"
text.097c: "Со временем Дигимоны\nначнут считать беду\nчем-то обычным."
text.0a08: "Остановить это можешь только\nты и сила Города Файл,\nобъединяющая Дигимонов!"
text.0ab8: "Собери Дигимонов в городе\nи сотвори чудо.\nОно обязательно случится."
text.0b54: "Ох, я разволновался.\nФух, всё сказал."
text.0bd4: "Ну что ж, уберём туман."
text.0c20: "Туман в лесу был нужен,\nчтобы поговорить с тобой.\nО, и ещё кое-что..."
text.0cd0: "В лесу есть и другие,\nкто знает\nо прошлом."
text.0d44: "Отыщи их в глубине леса,\nесли сможешь."
text.0dbc: "Снова пришёл послушать\nстариковские речи?"
text.0e24: "Об острове...\nПотренируй {color:10}{partner}{color:1}\nНичего"
text.0e98: "Вот что я скажу."
text.0eda: "А, ладно."
text.0efe: "{color:5}Тренировка: Уроки \nлеса {color:1}"
text.0f56: "Начать\nОбъяснить\nВыйти"
text.0f8e: "Обычная\nДоп. попытка\nВыйти"
text.0fcc: "Cherrymon даст тебе много\nзнаний. Мудрость\nсильно вырастет."
text.1068: "Ещё раз объяснить\nНачать\nВыйти"
text.10c2: "{color:7}Игровой автомат {color:1}\nЖми {color:6}△ {color:1}\nи собери три картинки."
text.1138: "Ха-ха-ха."
