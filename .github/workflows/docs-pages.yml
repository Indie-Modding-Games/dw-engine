name: Docs site (GitHub Pages)

# Publishes the documentation site (docs/) to GitHub Pages every time main changes it. The site is served under
# /<repository>/, at https://indie-modding-games.github.io/dw-engine/. A pull request that changes the docs builds the
# site too, without deploying it, so a page the site cannot build shows up before it reaches main.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.devcontainer/docs-site/**', '.github/workflows/docs-pages.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', '.devcontainer/docs-site/**', '.github/workflows/docs-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The same Node and packages as the development image (.devcontainer/Dockerfile and its docs-site lockfile).
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install the site's packages
        run: |
          npm ci --prefix .devcontainer/docs-site --ignore-scripts --no-audit --no-fund
          ln -s .devcontainer/docs-site/node_modules node_modules

      - name: Build the site
        env:
          DWE_DOCS_BASE: /${{ github.event.repository.name }}/
        run: node_modules/.bin/vitepress build docs

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
