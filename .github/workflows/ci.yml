name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the development image
        run: scripts/dev.sh image

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'triplets/**', 'cmake/toolchains/**', '.devcontainer/Dockerfile') }}
          restore-keys: vcpkg-

      - name: Check the format
        run: scripts/dev.sh format --check

      - name: Configure
        env:
          PRESET: ci
          DWE_CACHE_DIR: ${{ runner.temp }}/vcpkg-cache
        run: scripts/dev.sh configure

      - name: Build
        env:
          PRESET: ci
          DWE_CACHE_DIR: ${{ runner.temp }}/vcpkg-cache
        run: scripts/dev.sh build

      - name: Test
        env:
          PRESET: ci
          DWE_CACHE_DIR: ${{ runner.temp }}/vcpkg-cache
        run: scripts/dev.sh test

  # Written from the documentation of CMake, vcpkg and clang-cl; not run yet.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP vcpkg
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $baseline
          & (Join-Path $root bootstrap-vcpkg.bat) -disableMetrics
          $cache = Join-Path $env:RUNNER_TEMP vcpkg-cache
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'cmake/toolchains/**') }}
          restore-keys: vcpkg-windows-

      - name: Show the tools
        run: |
          clang-cl --version
          cmake --version
          ninja --version

      - name: Configure
        run: cmake --preset windows-ci

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Test
        run: ctest --preset windows-ci
