name: CI

# A change that only touches documentation builds nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a pull request's run; every run on main finishes, so its caches get saved.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the development image
        run: scripts/dev.sh image

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**', 'triplets/**', 'cmake/toolchains/**', '.devcontainer/Dockerfile') }}
          restore-keys: vcpkg-

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      # The same check as a branch's tip on a developer machine (scripts/dev.sh check-full), with release-only
      # dependencies, built once instead of twice, and no validation layers: no test draws anything. clang-tidy runs
      # next to the tests; each step's log is folded in the output.
      - name: Check
        env:
          DWE_CACHE_DIR: ${{ runner.temp }}/vcpkg-cache
          DWE_CCACHE_DIR: ${{ runner.temp }}/ccache
          DWE_CCACHE_SIZE: 2G
          DWE_LOG_DIR: ${{ runner.temp }}/logs
        run: >-
          scripts/dev.sh check-full
          -DVCPKG_TARGET_TRIPLET=x64-linux-libcxx-release
          -DVCPKG_HOST_TRIPLET=x64-linux-libcxx-release
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON

  # Written from the documentation of CMake, vcpkg and clang-cl; not run yet.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP vcpkg
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $baseline
          & (Join-Path $root bootstrap-vcpkg.bat) -disableMetrics
          $cache = Join-Path $env:RUNNER_TEMP vcpkg-cache
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      # sccache in front of clang-cl: the presets ask for the compiler launcher in DWE_COMPILER_LAUNCHER and put the
      # debug information in the objects (/Z7), which a compiler cache can store, instead of a shared PDB (/Zi).
      - name: Set up sccache
        shell: pwsh
        run: |
          $version = 'v0.10.0'
          $name = "sccache-$version-x86_64-pc-windows-msvc"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$version/$name.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP $name) >> $env:GITHUB_PATH
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP sccache)" >> $env:GITHUB_ENV
          "SCCACHE_CACHE_SIZE=2G" >> $env:GITHUB_ENV
          "DWE_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: sccache-windows-

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**', 'cmake/toolchains/**') }}
          restore-keys: vcpkg-windows-

      - name: Show the tools
        run: |
          clang-cl --version
          sccache --version
          cmake --version
          ninja --version

      # No validation layers: no test draws anything. The dependencies keep their debug build, because a debug build
      # with clang-cl cannot link release libraries (a different CRT).
      # vcpkg gives up at once on some download errors (an SSL error from lua.org once); one more try reuses
      # everything already downloaded and built.
      - name: Configure
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --preset windows-ci -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Configure failed; trying once more in a minute"
            Start-Sleep -Seconds 60
            cmake --preset windows-ci -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          }

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Test
        run: ctest --preset windows-ci -j 4

      - name: Show the compiler cache statistics
        if: always()
        run: sccache --show-stats
