name: CI

# The checks of a pull request to main (docs/contribuir.md). main's ruleset requires the jobs
# linux, windows and launcher-version. Only a pull request's newest commit is checked: a newer push
# cancels the run of the older one. Nothing runs on main itself: a squash-merged pull request
# already passed these checks (release.yml builds main and keeps the compiler caches these jobs
# start from warm).
#
# A pull request that only touches documentation builds nothing: the workflow still runs (a
# required check that never reports would hold the pull request forever), and the jobs with
# nothing to check are skipped, which counts as passed.
#
# The package jobs build the release's game packages, unsigned, from the pull request's head, so
# the merge only has to sign and publish them (release.yml finds them by the code's tree). They
# need no secret and save no cache.
#
# Left out of this path, as too slow for every pull request: clang-tidy, the documentation site,
# the tests on Windows itself (platform-check.yml, weekly and by hand) and the format and lint of
# the files the pull request does not touch. scripts/dev.sh check-full runs them all on a
# computer.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The development images in GitHub's container registry (release.yml pushes them).
  packages: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # What the pull request changes: code (anything but the documentation and the map editor), the
  # launcher, the map editor, and whether its merge makes a release.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
      launcher: ${{ steps.changes.outputs.launcher }}
      mapper: ${{ steps.changes.outputs.mapper }}
      release: ${{ steps.changes.outputs.release }}
      base: ${{ steps.changes.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The history without the files' contents: enough to list what changed.
          fetch-depth: 0
          filter: blob:none

      - name: List what changed
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE" ]] && base="$(git merge-base "$BASE" HEAD)"; then
            files="$(git diff-tree -r --name-only "$base" HEAD)"
          else
            echo "Checking everything (no pull request to compare with)"
            base=""
            files="$(git ls-files)"
          fi
          code=false
          launcher=false
          mapper=false
          release=false
          docs='^(docs/|docs-site/|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|LICENSE)|\.md$'
          # The map editor builds with cargo alone: a change only there builds no C++.
          mapper_paths='^(apps/mapper/|packages/rust/|scripts/mapper\.sh$)'
          grep -vE "$docs" <<<"$files" | grep -qvE "$mapper_paths" && code=true
          grep -qE "$mapper_paths" <<<"$files" && mapper=true
          launcher_paths='^(apps/launcher/|apps/beta-gateway/|apps/versus-signal/|scripts/launcher\.sh$|scripts/ci/|'
          launcher_paths+='scripts/package/|scripts/release_local\.sh$|\.devcontainer/launcher\.Dockerfile$)'
          grep -qE "$launcher_paths" <<<"$files" && launcher=true
          # release.yml's paths-ignore, the same list: a merge that touches only these publishes
          # nothing, so it needs no packages.
          not_released='^(docs/|docs-site/|\.github/|scripts/ci/|apps/versus-signal/)|\.md$|(^|/)tests/'
          grep -qvE "$not_released" <<<"$files" && release=true
          echo "code=$code launcher=$launcher mapper=$mapper release=$release base=$base"
          {
            echo "code=$code"
            echo "launcher=$launcher"
            echo "mapper=$mapper"
            echo "release=$release"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

  # Required. The format and the lint of the changed files, then the engine, the game and the
  # tools built for Linux (debug, warnings as errors) and every test; the tests that need the
  # player's disc or extracted content skip.
  linux:
    name: linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRESET: ci
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ needs.changes.outputs.base }}
      DWE_CCACHE_SIZE: 2G
    steps:
      # The runner context only exists inside steps, so the cache folders go to the job here.
      - name: Cache folders
        run: |
          echo "DWE_CACHE_DIR=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          echo "DWE_CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          # The format and the lint compare with the pull request's base.
          fetch-depth: 0
          filter: blob:none

      - name: Development image
        run: scripts/ci/image.sh dev

      # This preset's Linux dependencies (x64-linux-libcxx-release, without the default features),
      # saved on main by release.yml's pr-caches job.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-ci-linux-x86_64-${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**', '.devcontainer/Dockerfile') }}
          restore-keys: vcpkg-ci-linux-x86_64-

      # main's newest objects of this preset, saved by release.yml's pr-caches job.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ci-linux-${{ github.sha }}
          restore-keys: ccache-ci-linux-

      - name: Format of the changed files
        if: env.BASE != ''
        run: scripts/dev.sh format --since "$BASE"

      - name: Lint of the changed files
        if: ${{ !cancelled() && env.BASE != '' }}
        run: scripts/dev.sh lint --since "$BASE"

      # The build runs even when the format or the lint failed, so one run says everything.
      - name: Configure
        id: configure
        if: ${{ !cancelled() }}
        run: >-
          scripts/dev.sh configure
          -DVCPKG_TARGET_TRIPLET=x64-linux-libcxx-release
          -DVCPKG_HOST_TRIPLET=x64-linux-libcxx-release
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: scripts/dev.sh build

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/dev.sh test -j "$(nproc)"

  # Required. The same sources cross-compiled for Windows with clang-cl and the MSVC library, the
  # release's toolchain: built, tests included, but not run (platform-check.yml runs them on
  # Windows).
  windows:
    name: windows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRESET: windows-cross
      GH_TOKEN: ${{ github.token }}
      DWE_CCACHE_SIZE: 2G
    steps:
      # The runner context only exists inside steps, so the cache folders go to the job here.
      - name: Cache folders
        run: |
          echo "DWE_CACHE_DIR=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          echo "DWE_CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo "DWE_XWIN_DIR=$RUNNER_TEMP/xwin" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Development image
        run: scripts/ci/image.sh dev

      - name: Restore the MSVC libraries and the Windows SDK
        id: xwin-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xwin
          key: xwin-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Fetch the MSVC libraries and the Windows SDK
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: scripts/dev.sh windows-sdk --accept-license

      # The release's Windows dependencies (the same triplet), saved on main by release.yml.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-release-windows-x86_64-${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**', '.devcontainer/Dockerfile') }}
          restore-keys: vcpkg-release-windows-x86_64-

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ci-windows-${{ github.sha }}
          restore-keys: ccache-ci-windows-

      - name: Configure
        run: scripts/dev.sh configure

      - name: Build
        run: scripts/dev.sh build

  # Not required. The release's game package of each computer, built by the same steps as
  # release.yml's game job (.github/actions/game-package) from the pull request's head commit,
  # not GitHub's temporary merge commit: when the pull request is up to date with main, its
  # squash merge has this tree, and release.yml publishes these files instead of building them
  # again. Unsigned: only release.yml's publish job holds the key. A fork's pull request skips
  # them (its merge builds the packages on main), and the caches are only read here.
  package:
    name: package (${{ matrix.platform }})
    needs: changes
    if: >-
      needs.changes.outputs.release == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: windows-x86_64, runner: ubuntu-24.04 }
          - { platform: darwin-aarch64, runner: macos-15, arch: arm64 }
          # Cross-compiled on Apple silicon, as in release.yml (.github/actions/macos-tools).
          - { platform: darwin-x86_64, runner: macos-15, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # main's caches of the release build (release.yml's game job saves them).
      - name: Restore the MSVC libraries and the Windows SDK
        if: matrix.platform == 'windows-x86_64'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xwin
          key: xwin-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-release-${{ matrix.platform }}-${{ runner.os == 'macOS' && 'llvm22-' || '' }}${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**', '.devcontainer/Dockerfile') }}
          restore-keys: vcpkg-release-${{ matrix.platform }}-

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-release-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-release-${{ matrix.platform }}-

      - name: Game package
        id: package
        uses: ./.github/actions/game-package
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          pr: ${{ github.event.pull_request.number }}

      # vcpkg prints only the paths of a failed port's logs; their ends say why.
      - name: Show the logs of a failed vcpkg step
        if: failure()
        run: |
          find build -path '*vcpkg_buildtrees*' -name '*.log' -size +0 \
            \( -name '*-err.log' -o -name 'config-*-out.log' \) 2>/dev/null | head -20 | while read -r log; do
            echo "::group::$log"
            tail -n 60 "$log"
            echo "::endgroup::"
          done

      - name: Show the compiler cache statistics
        if: always()
        env:
          DWE_CACHE_DIR: ${{ runner.temp }}/vcpkg-cache
          DWE_CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then ccache --show-stats || true
          else scripts/dev.sh shell -c 'ccache --show-stats' || true; fi

      # Named by the tree, which is how release.yml looks for it (scripts/ci/packages.py find).
      # The last step: a package job that uploaded has succeeded.
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ steps.package.outputs.tree }}
          path: |
            dist/dwe-beta-*-${{ matrix.platform }}.tar.xz
            dist/source.json
          if-no-files-found: error
          retention-days: 14

  # Required. The launcher's version can ship (scripts/ci/launcher_version.sh): installed
  # launchers update only to a higher version. Seconds, and run on every pull request: the newest
  # release may be newer than the pull request's base.
  launcher-version:
    name: launcher-version
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check the launcher's version
        run: scripts/ci/launcher_version.sh

  # The launcher's tests and clippy, the beta gateway's tests and the release scripts' tests, when
  # one of them changed.
  launcher:
    name: launcher
    needs: changes
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Launcher image
        run: scripts/ci/image.sh launcher

      - name: Restore the launcher's build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/launcher-cargo
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: launcher-linux-${{ hashFiles('apps/launcher/src-tauri/Cargo.lock', '.devcontainer/launcher.Dockerfile') }}
          restore-keys: launcher-linux-

      - name: Launcher tests and clippy
        env:
          DWE_LAUNCHER_CARGO_DIR: ${{ runner.temp }}/launcher-cargo
        run: scripts/launcher.sh test

      - name: Beta gateway tests
        working-directory: apps/beta-gateway
        run: node --test

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Versus signaling server tests
        working-directory: apps/versus-signal
        run: node --test

      - name: Release scripts tests
        working-directory: scripts/ci/tests
        run: |
          python3 -B -m unittest -v test_release test_packages
          cd ../../package/tests
          python3 -B -m unittest -v test_release_manifest test_third_party_notices

  # Not required. The map editor's format check, tests and clippy (apps/mapper and its crates in
  # packages/rust), in the launcher's image, when one of them changed. No GPU: the tests are
  # headless. Nothing on main saves this cache, so the job keeps its own.
  mapper:
    name: mapper
    needs: changes
    if: needs.changes.outputs.mapper == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Launcher image
        run: scripts/ci/image.sh launcher

      - name: Map editor's build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/mapper-cargo
            build/mapper
          key: mapper-linux-${{ hashFiles('apps/mapper/Cargo.lock', '.devcontainer/launcher.Dockerfile') }}
          restore-keys: mapper-linux-

      - name: Map editor tests and clippy
        env:
          DWE_MAPPER_CARGO_DIR: ${{ runner.temp }}/mapper-cargo
        run: scripts/mapper.sh test
