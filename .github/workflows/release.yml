name: Release

# Every push to main (a merged pull request) publishes a prerelease, the launcher's «Pruebas»
# channel: the game packages for the launcher (no game data) for Linux, Windows and macOS, the
# launcher's installers (AppImage and .deb, the Windows NSIS installer, the macOS .dmg), their
# signatures, game-manifest.json and latest.json. A merge that only touches documentation, tests or
# the CI's own files publishes nothing. Actions > Release > Run workflow does the same for main's
# tip by hand. The pr-caches job also keeps the compiler caches ci.yml's pull request checks start
# from.
#
# Two ways to the same files, and the run's summary says which one was taken:
#   - promotion, the usual one (2-4 min): the pull request's CI already built every game package
#     (ci.yml's package jobs) from the tree main now has, since main only takes pull requests that
#     are up to date with it. plan finds them (scripts/ci/packages.py) and publish signs them and
#     publishes them as they are;
#   - full build, the fallback (~10-12 min): when there are no such packages (a fork's pull
#     request, one merged before its packages were built, packages expired, a run by hand with
#     "full build"), the game job builds them here as the package jobs do.
# The launcher is built only when what it is built from changed since the previous release
# (scripts/ci/launcher_reuse.sh); otherwise that release's launcher files, the same version and
# already signed, are published again.
#
# The version needs no one (scripts/ci/release.py version): <CMakeLists.txt's version>-beta.<N>, N
# the commits on main, and the tag is v<version>. A newer merge cancels the run of an older one:
# only the newest commit gets a release, and a cancelled run leaves at most a draft, which the next
# run deletes. promote.yml later makes a tested prerelease the stable release, with the same files.
# docs/modulos/apps/launcher.md explains the versions and the channels.
#
# Every Monday (schedule) the full build of the game and the launcher runs without publishing, so
# the fallback never rots and the caches the package jobs start from stay warm.
#
# The Windows builds are cross-compiled on Linux (the same Docker images as a developer's machine);
# only the macOS ones need macOS runners. Every computer builds on its own: one that fails does not
# stop the others, and the publish job then says in the run's summary which computers are missing
# and publishes nothing; "Re-run failed jobs" builds only what failed and publishes. The release is
# uploaded as a draft and published once every file and both manifests are there and checked, so a
# launcher never sees a half-uploaded release. Only the publish job holds the signing key.
#
# docs/modulos/apps/launcher.md explains the secrets:
#   secrets.DWE_SIGNING_KEY            the private key of `tauri signer generate` (its text)
#   secrets.DWE_SIGNING_KEY_PASSWORD   its password
#   vars.DWE_SIGNING_PUBKEY            the public key (the .pub file's text), built into the launcher
#   vars.DWE_BETA_GATEWAY              the beta gateway's URL (apps/beta-gateway), built into the
#                                      launcher as its release server
#   secrets.DWE_BETA_KEY               the beta key, the same value as the gateway's BETA_KEY (24
#                                      characters or more), built into the launcher so testers
#                                      never type it; a light barrier, not a secret: anyone with
#                                      the launcher can read it out of the program
#   vars.DWE_LAUNCHER_LINKS            optional: the main screen's links, a JSON object of https URLs
#                                      by kind ({"repo", "community", "web"}); unset, none are shown
# Changing one of the launcher's values (the public key, the gateway, the beta key or the links)
# rebuilds the launcher on the next merge: plan compares them with the previous launcher.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'docs-site/**', '**/*.md', '**/tests/**', '.github/**', 'scripts/ci/**', 'apps/versus-signal/**']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      full_build:
        description: Build every game package and the launcher here instead of reusing them
        type: boolean
        default: false

permissions:
  contents: write
  # Deleting this workflow's older compiler caches (one is kept per computer), and reading the
  # artifacts of ci.yml's runs.
  actions: write
  # The development images in GitHub's container registry, for the next runs and for ci.yml.
  packages: write

# The weekly build has a group of its own: it must never cancel a merge's release.
concurrency:
  group: release-${{ github.event_name == 'schedule' && 'weekly' || 'main' }}
  cancel-in-progress: true

env:
  DWE_LAUNCHER_PUBKEY: ${{ vars.DWE_SIGNING_PUBKEY }}
  DWE_LAUNCHER_GATEWAY: ${{ vars.DWE_BETA_GATEWAY }}
  DWE_LAUNCHER_LINKS: ${{ vars.DWE_LAUNCHER_LINKS }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      tree: ${{ steps.mode.outputs.tree }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
      # The ci.yml run whose packages are promoted; empty: the game job builds them.
      packages-run: ${{ steps.packages.outputs.run }}
      # build or reuse
      launcher: ${{ steps.launcher.outputs.launcher }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Built into the launcher; plan only checks it and compares it with the previous launcher.
      DWE_LAUNCHER_BETA_KEY: ${{ secrets.DWE_BETA_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version counts the commits; the launcher's sources are compared with the newest
          # release's tag. Without the files' contents, which none of that needs.
          fetch-depth: 0
          filter: blob:none

      - name: Check the signing key, the gateway and the beta key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DWE_SIGNING_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$DWE_LAUNCHER_PUBKEY" ] || {
            echo "Set secrets.DWE_SIGNING_KEY and vars.DWE_SIGNING_PUBKEY first" >&2
            exit 1
          }
          [[ "$DWE_LAUNCHER_GATEWAY" =~ ^https://[^[:space:]]+$ ]] || {
            echo "Set vars.DWE_BETA_GATEWAY to the beta gateway's https URL first" >&2
            exit 1
          }
          # Never printed: only whether it is there, long enough and without spaces.
          [[ "$DWE_LAUNCHER_BETA_KEY" =~ ^[^[:space:]]{24,}$ ]] || {
            echo "Set secrets.DWE_BETA_KEY to the beta gateway's BETA_KEY first" \
              "(24 characters or more, no spaces)" >&2
            exit 1
          }

      # The weekly run only builds; a run by hand with "full build" builds everything here.
      - name: What this run does
        id: mode
        env:
          FULL_BUILD: ${{ github.event_name == 'schedule' || inputs.full_build == true }}
        run: |
          publish=true
          [ "$GITHUB_EVENT_NAME" = schedule ] && publish=false
          {
            echo "publish=$publish"
            echo "full=$FULL_BUILD"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_OUTPUT"

      # A published release is never touched; a draft of the same tag is an unfinished run's and
      # the publish job replaces it. The new game version must be above the newest release's, or
      # no launcher would install it.
      - name: Pick the version
        id: version
        if: steps.mode.outputs.publish == 'true'
        run: |
          version="$(python3 scripts/ci/release.py version)"
          tag="v$version"
          if is_draft="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" \
            && [ "$is_draft" != true ]; then
            echo "$tag is already released: this commit was built before" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "The tag $tag exists without a release; delete it or merge a new commit" >&2
            exit 1
          fi
          previous="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName \
            --jq '.[0].tagName // ""')"
          if [ -n "$previous" ]; then
            gh release download "$previous" -R "$GITHUB_REPOSITORY" -p game-manifest.json \
              -O "$RUNNER_TEMP/previous-game.json" --clobber
            previous_version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' \
              "$RUNNER_TEMP/previous-game.json")"
            python3 scripts/ci/release.py newer "$version" "$previous_version" || {
              echo "The game would be $version, not above $previous_version of $previous: raise the version in CMakeLists.txt" >&2
              exit 1
            }
          fi
          echo "Release $tag (game $version), after ${previous:-no release}"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

      # Installed launchers update themselves only to a higher version: a release whose launcher
      # changed must raise it (the same check as CI's launcher-version).
      - name: Check the launcher's version
        if: steps.mode.outputs.publish == 'true'
        run: scripts/ci/launcher_version.sh

      # The pull request's packages of this tree, if its CI built them. A package job that is
      # still uploading gets a minute; after that the game job builds them here instead. GitHub's
      # API failing also falls back to the full build.
      - name: Find the pull request's packages
        id: packages
        if: steps.mode.outputs.publish == 'true' && steps.mode.outputs.full != 'true'
        env:
          TREE: ${{ steps.mode.outputs.tree }}
        run: |
          run="$(python3 scripts/ci/packages.py find --repo "$GITHUB_REPOSITORY" --tree "$TREE" --wait 60)" \
            || run=""
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Build or reuse the launcher
        id: launcher
        env:
          FULL: ${{ steps.mode.outputs.full }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          if [ "$FULL" = true ]; then launcher=build
          else launcher="$(scripts/ci/launcher_reuse.sh "$PREVIOUS")" || launcher=build; fi
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"

      - name: Say which way this run goes
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
          TREE: ${{ steps.mode.outputs.tree }}
          RUN: ${{ steps.packages.outputs.run }}
          LAUNCHER: ${{ steps.launcher.outputs.launcher }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          {
            echo "## Plan"
            echo
            if [ "$PUBLISH" != true ]; then echo "- Weekly full build: nothing is published."; fi
            if [ -n "$RUN" ]; then
              echo "- Game packages: **promoted** from the pull request's CI run" \
                "[$RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN) (tree \`${TREE:0:12}\`)."
            else
              echo "- Game packages: **full build** here (tree \`${TREE:0:12}\`)."
            fi
            if [ "$LAUNCHER" = reuse ]; then echo "- Launcher: reused from $PREVIOUS (unchanged)."
            else echo "- Launcher: built here."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The full build: one unsigned game package per computer, by the same steps as ci.yml's package
  # jobs (.github/actions/game-package), when plan found none to promote, and every Monday. The
  # publish job signs them. This job also saves the caches the package jobs start from.
  game:
    needs: plan
    if: needs.plan.outputs.packages-run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: windows-x86_64, runner: ubuntu-24.04 }
          - { platform: darwin-aarch64, runner: macos-15, arch: arm64 }
          - { platform: darwin-x86_64, runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      # The package names its tree, which one commit is enough to know.
      - uses: actions/checkout@v4

      # The MSVC libraries and the Windows SDK change only with xwin's version (the image's Dockerfile).
      - name: Restore the MSVC libraries and the Windows SDK
        id: xwin-cache
        if: matrix.platform == 'windows-x86_64'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xwin
          key: xwin-${{ hashFiles('.devcontainer/Dockerfile') }}

      # Restored and saved apart, so a build that fails after its dependencies keeps them for the
      # next run. vcpkg rebuilds only the dependencies whose inputs changed.
      # The macOS key names the pinned LLVM (.github/actions/game-package), which the hashed files
      # do not hold.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-release-${{ matrix.platform }}-${{ runner.os == 'macOS' && 'llvm22-' || '' }}${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**', '.devcontainer/Dockerfile') }}
          restore-keys: vcpkg-release-${{ matrix.platform }}-

      # The game's own objects (ccache, in the development image on Linux): an unchanged file is
      # not compiled again. One cache per computer, the newest; older ones are deleted below.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-release-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-release-${{ matrix.platform }}-

      - name: Game package
        uses: ./.github/actions/game-package
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          push-image: 'true'

      # vcpkg prints only the paths of a failed port's logs; their ends say why.
      - name: Show the logs of a failed vcpkg step
        if: failure()
        run: |
          find build -path '*vcpkg_buildtrees*' -name '*.log' -size +0 \
            \( -name '*-err.log' -o -name 'config-*-out.log' \) 2>/dev/null | head -20 | while read -r log; do
            echo "::group::$log"
            tail -n 60 "$log"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: |
            dist/dwe-beta-*-${{ matrix.platform }}.tar.xz
            dist/source.json
          if-no-files-found: error

      # Only after a whole build, so a half-fetched folder is never kept.
      - name: Save the MSVC libraries and the Windows SDK
        if: matrix.platform == 'windows-x86_64' && steps.xwin-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/xwin
          key: xwin-${{ hashFiles('.devcontainer/Dockerfile') }}

      # Only after a whole build: then the installed packages are all the ones it needs.
      - name: Delete the packages this build no longer uses from the vcpkg binary cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: scripts/ci/prune_vcpkg_cache.sh "$RUNNER_TEMP/vcpkg-cache" build

      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-release-${{ matrix.platform }}-${{ runner.os == 'macOS' && 'llvm22-' || '' }}${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**', '.devcontainer/Dockerfile') }}

      - name: Show the compiler cache statistics
        if: always()
        env:
          DWE_CACHE_DIR: ${{ runner.temp }}/vcpkg-cache
          DWE_CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then ccache --show-stats || true
          else scripts/dev.sh shell -c 'ccache --show-stats' || true; fi

      # The older copies go first: saving the new one next to them overfills the repository's
      # cache space for a moment, and the space is freed by evicting the vcpkg caches.
      - name: Delete the older compiler caches
        if: always()
        continue-on-error: true
        uses: ./.github/actions/trim-caches
        with:
          prefix: ccache-release-${{ matrix.platform }}-
          keep: ccache-release-${{ matrix.platform }}-${{ github.run_id }}

      - name: Save the compiler cache
        id: ccache-save
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-release-${{ matrix.platform }}-${{ github.run_id }}

  # The launcher's installers, unsigned (DWE_LAUNCHER_UNSIGNED): the publish job signs them. Only
  # when plan says it changed since the previous release, and every Monday.
  launcher:
    needs: plan
    if: needs.plan.outputs.launcher == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: linux, runner: ubuntu-24.04 }
          - { system: windows, runner: ubuntu-24.04 }
          - { system: macos, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    env:
      # Built into the launcher (apps/launcher/src-tauri/src/beta_key.rs); the log never shows it.
      DWE_LAUNCHER_BETA_KEY: ${{ secrets.DWE_BETA_KEY }}
      DWE_LAUNCHER_UNSIGNED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Launcher image
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/image.sh launcher --push

      # cargo's downloads and the compiled dependencies, by Cargo.lock and the image: the launcher's
      # own crate is compiled again, its dependencies only when Cargo.lock changes.
      - name: Restore the launcher's build cache
        id: launcher-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/launcher-cargo
            ${{ runner.temp }}/launcher-xwin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/launcher
          key: launcher-${{ matrix.system }}-${{ hashFiles('apps/launcher/src-tauri/Cargo.lock', '.devcontainer/launcher.Dockerfile') }}
          restore-keys: launcher-${{ matrix.system }}-

      - name: AppImage and .deb
        if: matrix.system == 'linux'
        env:
          DWE_LAUNCHER_CARGO_DIR: ${{ runner.temp }}/launcher-cargo
        run: |
          scripts/launcher.sh bundle
          bundle=build/launcher/release/bundle
          mkdir -p out
          cp "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb out/

      - name: Windows installer
        if: matrix.system == 'windows'
        env:
          DWE_LAUNCHER_CARGO_DIR: ${{ runner.temp }}/launcher-cargo
          DWE_LAUNCHER_XWIN_DIR: ${{ runner.temp }}/launcher-xwin
        run: |
          scripts/launcher.sh bundle-windows
          mkdir -p out
          cp build/launcher/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe out/

      # One universal bundle for Apple silicon and Intel Macs, signed ad hoc (tauri.macos.conf.json).
      # Without the key tauri writes no update bundle, so it is packed here as tauri packs it (the
      # .app folder in a .tar.gz, without macOS's extra metadata files).
      - name: macOS .dmg and update bundle
        if: matrix.system == 'macos'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/launcher
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm install -g @tauri-apps/cli@2
          fonts=content/packs/game/ui/fonts
          mkdir -p apps/launcher/ui/fonts
          cp "$fonts/noto_sans_regular.ttf" "$fonts/noto_sans_bold.ttf" "$fonts/noto_sans_license.txt" apps/launcher/ui/fonts/
          # The bundle's LICENSE and THIRD_PARTY_NOTICES.txt, as scripts/launcher.sh writes them.
          mkdir -p apps/launcher/src-tauri/notices
          cp LICENSE apps/launcher/src-tauri/notices/LICENSE
          python3 scripts/package/third_party_notices.py launcher \
            --manifest-path apps/launcher/src-tauri/Cargo.toml \
            --target aarch64-apple-darwin --target x86_64-apple-darwin \
            --extra "Noto Sans (the font)=apps/launcher/ui/fonts/noto_sans_license.txt" \
            --out apps/launcher/src-tauri/notices/THIRD_PARTY_NOTICES.txt
          cd apps/launcher/src-tauri
          tauri build --target universal-apple-darwin \
            --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$DWE_LAUNCHER_PUBKEY\"}},\"bundle\":{\"createUpdaterArtifacts\":false}}"
          cd "$GITHUB_WORKSPACE"
          bundle=build/launcher/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$bundle"/dmg/*.dmg out/
          apps=("$bundle"/macos/*.app)
          [ "${#apps[@]}" -eq 1 ] && [ -d "${apps[0]}" ] || { echo "Expected one .app: ${apps[*]}" >&2; exit 1; }
          app="$(basename "${apps[0]}")"
          COPYFILE_DISABLE=1 tar -C "$bundle/macos" -czf "out/$app.tar.gz" "$app"

      # The program a tester runs has the beta gateway, the public key and the beta key built in,
      # and the bundle carries LICENSE and THIRD_PARTY_NOTICES.txt (on Windows, the files the
      # installer packs).
      - name: Check the gateway, the public key, the beta key and the notices in the launcher
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          case "$SYSTEM" in
            linux)
              mkdir -p build/deb-check
              dpkg-deb --fsys-tarfile out/*.deb | tar -x -C build/deb-check --wildcards '*/bin/*'
              binaries=(build/deb-check/usr/bin/*)
              contents="$(dpkg-deb -c out/*.deb)"
              ;;
            windows)
              binaries=(build/launcher/x86_64-pc-windows-msvc/release/dwe-launcher.exe)
              contents="$(find build/launcher/x86_64-pc-windows-msvc/release -maxdepth 1 -type f)"
              ;;
            macos)
              binaries=(build/launcher/universal-apple-darwin/release/bundle/macos/*.app/Contents/MacOS/*)
              contents="$(find build/launcher/universal-apple-darwin/release/bundle/macos/*.app/Contents/Resources -type f)"
              ;;
          esac
          for file in LICENSE THIRD_PARTY_NOTICES.txt; do
            grep -qE "/$file\$" <<<"$contents" || { echo "The launcher bundle has no $file" >&2; exit 1; }
          done
          public_key="$(printf '%s' "$DWE_LAUNCHER_PUBKEY" | tr -d '[:space:]')"
          for binary in "${binaries[@]}"; do
            [ -f "$binary" ] || { echo "No launcher program at $binary" >&2; exit 1; }
            grep -q -a -F "$DWE_LAUNCHER_GATEWAY" "$binary" || { echo "$binary does not have the gateway" >&2; exit 1; }
            grep -q -a -F "$public_key" "$binary" || { echo "$binary does not have the public key" >&2; exit 1; }
            grep -q -a -F -e "$DWE_LAUNCHER_BETA_KEY" "$binary" || { echo "$binary does not have the beta key" >&2; exit 1; }
          done
          echo "The launcher has the gateway $DWE_LAUNCHER_GATEWAY, the public key and the beta key"

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.system }}
          path: out/*
          if-no-files-found: error

      # Only the dependencies are kept: the bundles and the launcher's own crate are rebuilt anyway.
      - name: Trim the launcher's build cache
        if: steps.launcher-cache.outputs.cache-hit != 'true'
        run: |
          find build/launcher -type d \( -name bundle -o -name incremental \) -prune -exec rm -rf {} + 2>/dev/null || true
          find build/launcher \( -name 'dwe-launcher*' -o -name 'dwe_launcher*' -o -name '*dwe-launcher*' \) \
            -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Save the launcher's build cache
        if: steps.launcher-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/launcher-cargo
            ${{ runner.temp }}/launcher-xwin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/launcher
          key: launcher-${{ matrix.system }}-${{ hashFiles('apps/launcher/src-tauri/Cargo.lock', '.devcontainer/launcher.Dockerfile') }}

  # Not part of the release: the objects of ci.yml's presets (ci for Linux, windows-cross for
  # Windows) built on main and saved, so a pull request's linux and windows checks compile only
  # what it changed. Nothing is tested here: the pull request was.
  pr-caches:
    name: pr-caches (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ci's Linux dependencies use a triplet of their own (x64-linux-libcxx-release), so this job
          # keeps them in a cache of their own; windows-cross's are the release's.
          - { preset: ci, cache: ccache-ci-linux, vcpkg: vcpkg-ci-linux-x86_64 }
          - { preset: windows-cross, cache: ccache-ci-windows, vcpkg: vcpkg-release-windows-x86_64 }
    runs-on: ubuntu-24.04
    env:
      PRESET: ${{ matrix.preset }}
      GH_TOKEN: ${{ github.token }}
      # 1G each: with the release caches and the vcpkg ones they must fit in the repository's 10 GB.
      DWE_CCACHE_SIZE: 1G
    steps:
      # The runner context only exists inside steps, so the cache folders go to the job here.
      - name: Cache folders
        run: |
          echo "DWE_CACHE_DIR=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          echo "DWE_CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo "DWE_XWIN_DIR=$RUNNER_TEMP/xwin" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Development image
        run: scripts/ci/image.sh dev --push

      - name: Restore the MSVC libraries and the Windows SDK
        id: xwin-cache
        if: matrix.preset == 'windows-cross'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xwin
          key: xwin-${{ hashFiles('.devcontainer/Dockerfile') }}

      - name: Fetch the MSVC libraries and the Windows SDK
        if: matrix.preset == 'windows-cross' && steps.xwin-cache.outputs.cache-hit != 'true'
        run: scripts/dev.sh windows-sdk --accept-license

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ matrix.vcpkg }}-${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**', '.devcontainer/Dockerfile') }}
          restore-keys: ${{ matrix.vcpkg }}-

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ matrix.cache }}-${{ github.run_id }}
          restore-keys: ${{ matrix.cache }}-

      # The same configure as ci.yml's job of this preset.
      - name: Build
        run: |
          scripts/dev.sh shell -c 'ccache --zero-stats'
          if [ "$PRESET" = ci ]; then
            scripts/dev.sh configure -DVCPKG_TARGET_TRIPLET=x64-linux-libcxx-release \
              -DVCPKG_HOST_TRIPLET=x64-linux-libcxx-release -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          else
            scripts/dev.sh configure
          fi
          scripts/dev.sh build

      - name: Delete the packages this build no longer uses from the vcpkg binary cache
        if: success() && matrix.preset == 'ci' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: scripts/ci/prune_vcpkg_cache.sh "$RUNNER_TEMP/vcpkg-cache" build

      # Saved even when the build failed after its dependencies, as in the game job.
      - name: Save the vcpkg binary cache
        if: always() && matrix.preset == 'ci' && steps.vcpkg-cache.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ matrix.vcpkg }}-${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**', '.devcontainer/Dockerfile') }}

      # ccache applies a lower size limit only when it next cleans up, so the cache is trimmed to it here.
      - name: Trim the compiler cache to its size limit
        if: always()
        continue-on-error: true
        run: scripts/dev.sh shell -c 'ccache --show-stats; ccache --cleanup'

      # The older copies go first: saving the new one next to them overfills the repository's
      # cache space for a moment, and the space is freed by evicting the vcpkg caches.
      - name: Delete the older compiler caches
        if: always()
        continue-on-error: true
        uses: ./.github/actions/trim-caches
        with:
          prefix: ${{ matrix.cache }}-
          keep: ${{ matrix.cache }}-${{ github.run_id }}

      - name: Save the compiler cache
        id: ccache-save
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ matrix.cache }}-${{ github.run_id }}

  # Runs even when a computer failed, to say which in the summary; then it publishes nothing. The
  # only job with the signing key.
  publish:
    needs: [plan, game, launcher]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      PACKAGES_RUN: ${{ needs.plan.outputs.packages-run }}
      LAUNCHER: ${{ needs.plan.outputs.launcher }}
      TREE: ${{ needs.plan.outputs.tree }}
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DWE_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DWE_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # What this run built: the full build's game packages, a launcher that changed. The
      # artifacts of earlier attempts of this run count too ("Re-run failed jobs").
      - uses: actions/download-artifact@v4
        if: env.PACKAGES_RUN == '' || env.LAUNCHER == 'build'
        with:
          path: artifacts

      # The packages the pull request's CI built from this tree (plan found them), all at once.
      - name: Fetch the pull request's packages
        if: env.PACKAGES_RUN != ''
        run: |
          pids=()
          for platform in linux-x86_64 windows-x86_64 darwin-aarch64 darwin-x86_64; do
            gh run download "$PACKAGES_RUN" -R "$GITHUB_REPOSITORY" -n "package-$platform-$TREE" \
              -D "artifacts/game-$platform" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          exit "$failed"

      # The launcher did not change: the previous release's files, signed when they were published.
      - name: Fetch the previous release's launcher
        if: env.LAUNCHER == 'reuse'
        run: |
          from="$RUNNER_TEMP/launcher"
          gh release download "$PREVIOUS" -R "$GITHUB_REPOSITORY" -p 'dwe-launcher*' -D "$from"
          mkdir -p artifacts/launcher-linux artifacts/launcher-windows artifacts/launcher-macos
          mv "$from"/*.AppImage* "$from"/*.deb* artifacts/launcher-linux/
          mv "$from"/*-setup.exe* artifacts/launcher-windows/
          mv "$from"/*.dmg* "$from"/*.app.tar.gz* artifacts/launcher-macos/

      - name: Check that every computer was built
        id: built
        run: |
          python3 - <<'EOF'
          import os, sys
          from pathlib import Path
          wanted = [("game", p) for p in ("linux-x86_64", "windows-x86_64", "darwin-aarch64", "darwin-x86_64")]
          wanted += [("launcher", s) for s in ("linux", "windows", "macos")]
          rows, missing = [], []
          for kind, name in wanted:
              folder = Path("artifacts") / f"{kind}-{name}"
              files = sorted(p.name for p in folder.glob("*") if p.is_file()) if folder.is_dir() else []
              if not files:
                  missing.append(f"{kind} {name}")
              rows.append(f"| {kind} | {name} | {'built: ' + ', '.join(files) if files else '**MISSING**'} |")
          run = os.environ["PACKAGES_RUN"]
          server, repo = os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"]
          game = (f"promoted from the pull request's CI run [{run}]({server}/{repo}/actions/runs/{run})" if run
                  else "built in this run")
          launcher = (f"reused from {os.environ['PREVIOUS']}" if os.environ["LAUNCHER"] == "reuse"
                      else "built in this run")
          summary = ["## Release " + os.environ["TAG"], "", f"Game packages {game}; launcher {launcher}.", "",
                     "| What | Computer | Files |", "|---|---|---|", *rows, ""]
          if missing:
              summary += [f"**Not published**: {', '.join(missing)} did not build. The other files are kept as "
                          "this run's artifacts; fix the cause and use *Re-run failed jobs*.", ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(summary) + "\n")
          if missing:
              sys.exit(f"Missing: {', '.join(missing)}; nothing is published")
          platforms = " ".join(name for kind, name in wanted if kind == "game")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"platforms={platforms}\n")
          EOF

      # Whichever way they came, the packages are of the code main has now (its tree) and are the
      # files their jobs built (SHA-256 in source.json).
      - name: Check that the packages are main's
        env:
          PLATFORMS: ${{ steps.built.outputs.platforms }}
        run: |
          platform_args=()
          for platform in $PLATFORMS; do platform_args+=(--platform "$platform"); done
          python3 scripts/ci/packages.py verify --folder artifacts --tree "$(git rev-parse 'HEAD^{tree}')" \
            "${platform_args[@]}"

      # tauri's signer on the runner, instead of building the launcher image only to sign: the
      # version the launcher image has, from npm's cache after the first run.
      - name: Restore tauri's signer
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: tauri-cli-2.12.4

      - name: Install tauri's signer
        run: |
          npm install -g --prefer-offline --no-audit --no-fund @tauri-apps/cli@2.12.4
          echo "DWE_TAURI_CLI=tauri" >> "$GITHUB_ENV"

      # A wrong password, or a key that is not the public key's, fails here, before anything is signed.
      - name: Check that the key signs and the public key verifies it
        run: |
          python3 -c 'import cryptography' 2>/dev/null || sudo apt-get install -y python3-cryptography
          probe="$RUNNER_TEMP/key-probe"
          mkdir -p "$probe"
          head -c 4096 /dev/urandom > "$probe/probe"
          printf '%s' "$DWE_LAUNCHER_PUBKEY" > "$probe/key.pub"
          tauri signer sign "$probe/probe" >/dev/null
          python3 scripts/package/release_manifest.py verify --pubkey "$probe/key.pub" "$probe/probe"
          rm -rf "$probe"

      # One game-manifest.json of one version names every package; it names main's commit, which
      # only exists now (the packages name their tree). Every launcher file built in this run is
      # signed here; reused ones keep the signatures they were published with.
      - name: Sign the files and write the game manifest
        env:
          PLATFORMS: ${{ steps.built.outputs.platforms }}
        run: |
          for platform in $PLATFORMS; do
            tarballs=(artifacts/game-"$platform"/dwe-beta-*-"$platform".tar.xz)
            [ "${#tarballs[@]}" -eq 1 ] && [ -f "${tarballs[0]}" ] || { echo "Expected one package for $platform: ${tarballs[*]}" >&2; exit 1; }
            scripts/package_release.sh --platform "$platform" --tarball "${tarballs[0]}" --version "$VERSION" \
              --commit "$GITHUB_SHA" --out dist
          done
          cp artifacts/launcher-*/* dist/
          for file in dist/*.AppImage dist/*.deb dist/*-setup.exe dist/*.dmg dist/*.app.tar.gz; do
            [ -f "$file" ] || continue
            [ -f "$file.sig" ] && continue
            scripts/launcher.sh sign "$file"
          done

      - name: Check the files
        env:
          PLATFORMS: ${{ steps.built.outputs.platforms }}
        run: |
          printf '%s' "$DWE_LAUNCHER_PUBKEY" > "$RUNNER_TEMP/key.pub"
          platform_args=()
          for platform in $PLATFORMS; do platform_args+=(--platform "$platform"); done
          # Every file's signature, sizes and game-manifest.json; latest.json is checked once it has
          # the files' URLs, after the upload.
          python3 scripts/package/release_manifest.py check --folder dist --pubkey "$RUNNER_TEMP/key.pub" \
            "${platform_args[@]}" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          # Nothing read from a disc in any package: the packagers' own check, again on what ships.
          # shellcheck source=scripts/package/no_disc_data.sh
          source scripts/package/no_disc_data.sh
          for tarball in dist/dwe-game-*.tar.xz; do
            rm -rf "$RUNNER_TEMP/game" && mkdir -p "$RUNNER_TEMP/game"
            tar -C "$RUNNER_TEMP/game" -xJf "$tarball"
            package_no_disc_data "$RUNNER_TEMP/game" "$(basename "$tarball")"
          done
          for deb in dist/*.deb; do
            if dpkg-deb -c "$deb" | awk '{ printf "%s%c", $6, 0 }' | policy_forbidden_paths_in >&2; then
              echo "$(basename "$deb") holds disc data" >&2
              exit 1
            fi
          done
          rm -rf "$RUNNER_TEMP/game"

      # GitHub's notes (the squashed pull requests' titles since the previous release), in
      # Spanish; the launcher shows them as its news.
      - name: Release notes
        run: |
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          [ -n "$PREVIOUS" ] && args+=(-f previous_tag_name="$PREVIOUS")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/generated.md"
          python3 scripts/ci/release.py notes --kind testing --version "$VERSION" --commit "$GITHUB_SHA" \
            --generated "$RUNNER_TEMP/generated.md" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Only this workflow makes drafts, one run at a time: a draft left is a cancelled run's,
      # never seen by a launcher (the gateway hides drafts), and has no tag yet. The files go up
      # several at a time: the upload is most of this job.
      - name: Draft release with the files
        run: |
          gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | while read -r draft; do
            [[ "$draft" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || continue
            echo "Deleting the draft $draft of an unfinished run"
            gh release delete "$draft" --yes
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A published release $TAG exists; it is never replaced" >&2
            exit 1
          fi
          gh release create "$TAG" --draft --prerelease --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
          find dist -maxdepth 1 -type f -print0 | xargs -0 -n 1 -P 6 gh release upload "$TAG"

      # latest.json names each update file by its download URL (release and file name), which
      # stays right if a file is uploaded again, unlike an asset id; the beta gateway points it at
      # itself when a launcher asks, so testers never reach GitHub. The universal macOS bundle
      # serves both Mac processors.
      - name: Launcher update manifest
        env:
          PLATFORMS: ${{ steps.built.outputs.platforms }}
        run: |
          url() {
            printf 'https://github.com/%s/releases/download/%s/%s' "$GITHUB_REPOSITORY" "$TAG" "$1"
          }
          one() {
            [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "Expected one file, found: $*" >&2; exit 1; }
            printf '%s' "$1"
          }
          appimage="$(one dist/*.AppImage)"
          deb="$(one dist/*.deb)"
          setup="$(one dist/*-setup.exe)"
          # A launcher installed from the .deb asks first for linux-x86_64-deb and installs a .deb;
          # the AppImage's own key and the plain one name the AppImage.
          bundles=(--platform linux-x86_64 "$appimage.sig" "$(url "$(basename "$appimage")")"
            --platform linux-x86_64-appimage "$appimage.sig" "$(url "$(basename "$appimage")")"
            --platform linux-x86_64-deb "$deb.sig" "$(url "$(basename "$deb")")"
            --platform windows-x86_64 "$setup.sig" "$(url "$(basename "$setup")")")
          mac="$(one dist/*.app.tar.gz)"
          bundles+=(--platform darwin-aarch64 "$mac.sig" "$(url "$(basename "$mac")")"
            --platform darwin-x86_64 "$mac.sig" "$(url "$(basename "$mac")")")
          version="$(python3 -c 'import json; print(json.load(open("apps/launcher/src-tauri/tauri.conf.json"))["version"])')"
          python3 scripts/package/release_manifest.py launcher --version "$version" --notes "$TAG" \
            "${bundles[@]}" > dist/latest.json
          platform_args=()
          for platform in $PLATFORMS; do platform_args+=(--platform "$platform"); done
          python3 scripts/package/release_manifest.py check --folder dist --pubkey "$RUNNER_TEMP/key.pub" \
            "${platform_args[@]}" --latest dist/latest.json --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          gh release upload "$TAG" dist/latest.json
          gh release edit "$TAG" --draft=false --prerelease
          url="$(gh release view "$TAG" --json url --jq .url)"
          {
            echo "Published: $url"
            echo
            echo '```'
            find dist -maxdepth 1 -type f -printf '%12s  %f\n' | sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
