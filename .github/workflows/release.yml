name: Release

# Builds a beta release by hand only (Actions > Release > Run workflow): the game package for the
# launcher (no game data), the launcher's AppImage and .deb, their signatures, game-manifest.json
# and latest.json, all uploaded to a DRAFT prerelease that someone reviews and publishes by hand.
# Nothing here runs on a push or a tag. docs/modulos/apps/launcher.md explains the secrets:
#   secrets.DWE_SIGNING_KEY            the private key of `tauri signer generate` (its text)
#   secrets.DWE_SIGNING_KEY_PASSWORD   its password
#   vars.DWE_SIGNING_PUBKEY            the public key (the .pub file's text), built into the launcher
#   vars.DWE_BETA_GATEWAY              the beta gateway's URL (services/beta-gateway), built into the
#                                      launcher as its release server
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release (for example v0.1.0-beta.1)
        required: true
      notes:
        description: Release notes (Markdown); the launcher shows them as its news
        required: false
        default: ""

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DWE_SIGNING_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DWE_SIGNING_KEY_PASSWORD }}
      DWE_LAUNCHER_PUBKEY: ${{ vars.DWE_SIGNING_PUBKEY }}
      DWE_LAUNCHER_GATEWAY: ${{ vars.DWE_BETA_GATEWAY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release's version counts the commits.
          fetch-depth: 0

      - name: Check the signing key and the gateway
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$DWE_LAUNCHER_PUBKEY" ] || {
            echo "Set secrets.DWE_SIGNING_KEY and vars.DWE_SIGNING_PUBKEY first" >&2
            exit 1
          }
          case "$DWE_LAUNCHER_GATEWAY" in
            https://*) ;;
            *) echo "Set vars.DWE_BETA_GATEWAY to the beta gateway's https URL first" >&2; exit 1 ;;
          esac

      - name: Build the images
        run: |
          scripts/dev.sh image
          scripts/launcher.sh image

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-package-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**', 'triplets/**', 'cmake/toolchains/**', '.devcontainer/Dockerfile') }}
          restore-keys: vcpkg-package-

      - name: Game package and manifest
        env:
          DWE_CACHE_DIR: ${{ runner.temp }}/vcpkg-cache
          DWE_CCACHE_DIR: ${{ runner.temp }}/ccache
        run: scripts/package_release.sh --out dist

      - name: Launcher bundles
        run: scripts/launcher.sh bundle

      - name: Draft release with the files
        run: |
          bundle=build/launcher/release/bundle
          appimage="$(ls "$bundle"/appimage/*.AppImage | head -1)"
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" --draft --prerelease --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" dist/*.tar.xz dist/game-manifest.json "$appimage" "$appimage.sig" \
            "$bundle"/deb/*.deb

      # latest.json names the AppImage by its API URL, which exists only after the upload; the
      # beta gateway points it at itself when a launcher asks, so testers never reach GitHub.
      - name: Launcher update manifest
        run: |
          appimage="$(basename "$(ls build/launcher/release/bundle/appimage/*.AppImage | head -1)")"
          url="$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name == \"$appimage\") | .url")"
          version="$(python3 -c 'import json; print(json.load(open("apps/launcher/src-tauri/tauri.conf.json"))["version"])')"
          python3 scripts/package/release_manifest.py launcher --version "$version" --notes "$TAG" \
            --platform linux-x86_64 "build/launcher/release/bundle/appimage/$appimage.sig" "$url" > latest.json
          gh release upload "$TAG" latest.json
