name: Platform check

# Builds the engine and runs its unit tests, and the launcher's tests, on Windows and (when the
# `macos` input is ticked) on macOS: every Monday on Windows, and by hand (Actions > Platform check
# > Run workflow; docs/guides/beta-windows-macos.md). A pull request's windows check only
# cross-compiles them (ci.yml). The tests that need the player's disc or extracted content skip,
# as on Linux without DWE_DISC and DWE_CONTENT.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      macos:
        description: Also check macOS
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP vcpkg
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $baseline
          & (Join-Path $root bootstrap-vcpkg.bat) -disableMetrics
          $cache = Join-Path $env:RUNNER_TEMP vcpkg-cache
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

      # Restored and saved apart, so a run whose build or tests fail keeps the dependencies.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-platform-windows-${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/cmake/toolchains/**') }}
          restore-keys: vcpkg-platform-windows-

      - name: Configure
        id: configure
        run: cmake --preset windows-ci -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON

      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-platform-windows-${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/cmake/toolchains/**') }}

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Test
        run: ctest --preset windows-ci -j 4

      # PowerShell, not bash: Git's bash puts its own coreutils `link` before MSVC's link.exe, which cargo calls.
      - name: Launcher tests
        working-directory: apps/launcher/src-tauri
        shell: pwsh
        run: |
          $fonts = '../../../content/packs/game/ui/fonts'
          New-Item -ItemType Directory -Force ../ui/fonts | Out-Null
          Copy-Item "$fonts/noto_sans_regular.ttf", "$fonts/noto_sans_bold.ttf", "$fonts/noto_sans_license.txt" ../ui/fonts/
          # The bundle's notices, which the build looks for (scripts/launcher.sh, write_notices).
          New-Item -ItemType Directory -Force notices | Out-Null
          Copy-Item ../../../LICENSE notices/LICENSE
          python ../../../scripts/package/third_party_notices.py launcher --manifest-path Cargo.toml `
            --target x86_64-pc-windows-msvc --extra "Noto Sans (the font)=../ui/fonts/noto_sans_license.txt" `
            --out notices/THIRD_PARTY_NOTICES.txt
          cargo test --locked

  macos:
    if: inputs.macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install the tools
        run: |
          brew install llvm ninja nasm
          root="$RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout "$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"

      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-platform-macos-${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**') }}
          restore-keys: vcpkg-platform-macos-

      - name: Configure
        run: cmake --preset macos-arm64-release

      # Saved even when a later step fails, as on Windows: the packages built so far are not downloaded again.
      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-platform-macos-${{ hashFiles('vcpkg.json', 'tooling/vcpkg-ports/**', 'tooling/triplets/**', 'tooling/cmake/toolchains/**') }}

      - name: Build
        run: cmake --build --preset macos-arm64-release

      - name: Test
        run: ctest --preset macos-arm64-release -j 3

      - name: Launcher tests
        working-directory: apps/launcher/src-tauri
        run: |
          fonts=../../../content/packs/game/ui/fonts
          mkdir -p ../ui/fonts
          cp "$fonts/noto_sans_regular.ttf" "$fonts/noto_sans_bold.ttf" "$fonts/noto_sans_license.txt" ../ui/fonts/
          # The bundle's notices, which the build looks for (scripts/launcher.sh, write_notices).
          mkdir -p notices
          cp ../../../LICENSE notices/LICENSE
          python3 ../../../scripts/package/third_party_notices.py launcher --manifest-path Cargo.toml \
            --target aarch64-apple-darwin --extra "Noto Sans (the font)=../ui/fonts/noto_sans_license.txt" \
            --out notices/THIRD_PARTY_NOTICES.txt
          cargo test --locked
