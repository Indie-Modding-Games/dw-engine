# Config of scripts/port_coverage.py, which writes port-coverage.md.
#
# [[system]]: the systems of the page, in its order, each with the decomp files it owns (paths under src/).
# [[system_by_name]]: a function whose name matches goes to that system instead of its file's one (first match).
# [[not_needed]]: what the engine replaces and is never ported as such (graphics, sound and disc plumbing). A rule
#   marks the functions that match its pattern and/or files, and only those the code does not name.
# [twins]: the tournament and versus overlays carry copies of the battle code; a copy whose battle twin exists
#   (STD_x or VS_x next to BTL_x) is not needed: the engine's battle covers both.
# [functions.<name>]: the manual call for one function. status: portado, parcial, falta or no-aplica; note: why or
#   what is missing; what: one line saying what it does (Spanish); dwe: where the engine does it; system: moves it.

[[system]]
id = "battle"
name = "Batalla"
about = "El combate normal: órdenes, IA, daño, estados, HUD, inicio y final, aprendizaje de técnicas."
files = [
  "btl/battle_main.c", "btl/battle_setup.c", "btl/battle_hud.c", "btl/command_menu.c", "btl/command_shout.c",
  "main/btl.c", "main/battle_tick.c", "main/battle_ui.c", "main/entity_text.c",
]

[[system]]
id = "effects"
name = "Efectos de batalla"
about = "La máquina de efectos de las técnicas (scripts EFE): proyectiles, golpes, cámara, partículas, destellos."
files = [
  "btl/battle_effect.c", "main/efe.c", "main/efe_table.c", "main/effect_common.c", "main/buff_model.c",
  "main/particle.c",
]

[[system]]
