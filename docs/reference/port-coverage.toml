# Config of scripts/port_coverage.py, which writes port-coverage.md.
#
# [[system]]: the systems of the page, in its order, each with the decomp files it owns (paths under src/).
# [[system_by_name]]: a function whose name matches goes to that system instead of its file's one (first match).
# [[not_needed]]: what is tied to the original console, which the engine replaces and never ports as such (graphics,
#   sound and disc plumbing); status no-aplica, left out of every count on the page. A rule marks the functions that
#   match its pattern and/or files, and only those the code does not name.
# [twins]: the tournament and versus overlays carry copies of the battle code; a copy whose battle twin exists
#   (STD_x or VS_x next to BTL_x) is not needed: the engine's battle covers both.
# [functions.<name>]: the manual call for one function. status: portado, parcial, falta or no-aplica; note: why or
#   what is missing; what: one line saying what it does; dwe: where the engine does it; system: moves it.

[[system]]
id = "battle"
name = "Battle"
about = "The normal fight: commands, AI, damage, status effects, HUD, start and end, learning moves."
files = [
  "btl/battle_main.c", "btl/battle_setup.c", "btl/battle_hud.c", "btl/command_menu.c", "btl/command_shout.c",
  "main/btl.c", "main/battle_tick.c", "main/battle_ui.c", "main/entity_text.c",
]

[[system]]
id = "effects"
name = "Battle effects"
about = "The effect machine of the moves (EFE scripts): projectiles, hits, camera, particles, flashes."
files = [
  "btl/battle_effect.c", "main/efe.c", "main/efe_table.c", "main/effect_common.c", "main/buff_model.c",
  "main/particle.c",
]

[[system]]
id = "field"
name = "Field: movement, collision and camera"
about = "The player on the map, the collision grid, warps, the partner following and the camera."
files = ["main/map.c", "main/map_collision.c", "main/aabb.c", "main/tamer.c", "main/vecmath.c"]

[[system]]
id = "world"
name = "NPCs and map objects"
about = "The characters on the map and their walking AI, chests, objects on the ground and scenery with logic."
files = [
  "main/overworld.c", "main/map_object.c", "main/world_object.c", "main/butterfly.c", "main/bubble.c",
  "main/drop_shadow.c", "main/model.c", "main/anim.c",
]

[[system]]
id = "partner"
name = "Partner: AI and care"
about = "Hunger, sleep, bathroom, sickness, happiness and discipline, poop, natural death, walking and commands."
files = ["main/partner.c", "main/partner_impl.c"]

[[system]]
id = "script"
name = "Script and interpreter"
about = "The event script machine: commands, values, text boxes and choices."
files = ["main/script_interp.c", "main/script_value.c", "main/script_textbox.c", "main/script_common.c"]

[[system]]
id = "menus"
name = "Menus and interface"
about = "Title, game menu, partner sheet, bag, interface boxes, fades and text."
files = [
  "main/main_menu.c", "main/game_menu.c", "main/inventory.c", "main/ui.c", "main/font.c", "main/sjis.c",
  "main/fade.c", "main/new_game.c",
