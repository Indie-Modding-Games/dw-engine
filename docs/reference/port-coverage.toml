[[system_by_name]]
pattern = "^(?![A-Z0-9]+_)(?=.*(?i:save|memcard|memorycard))|Card(UsedBlock|Change|ReadError)|^(render|draw)(SaveSlot|CheckingCard|ConfirmNoCard|ConfirmSlot|FormatMemoryCard|ConfirmOverwrite|RegisterDigimon|SelectRegisterSlot|ConfirmRegister|CantRegister|DoYouWantToSave|InsertGameCard|RegisteredDigimonSlots)|^(registerBattleData|awardMachinedramonData|countRegisteredDigimon|tickSelectSlotInput|createByteSum|isMemcardUnformatted|_strncpy)$"
system = "save"

[[not_needed]]
files = ["main/_psstart.c", "main/file_queue.c", "main/line.c", "main/sjis.c", "main/sound_async.c"]
why = "arranque, cola de lectura del disco, codificación de texto o carga de sonido del original: lo hace el motor"

[[not_needed]]
pattern = "(?i)VRAM|CLUT|Clut|TIM(File|ToVRAM)?$|loadTIM|TMDMap|OrderingTable|Framebuffer|Prim$|PolyF|PolyG|PolyFT|SetPoly|setUVData|setPosData|initStringFT4|DrawOffset|DrawingOffset|Viewport|RView|RotTransMatrix|setupModelMatrix|setupEntityMatrix|transposeRefMatrix|BlendingMode|swap(Byte|Short|Int)s?$|^swapShortBytes$|Heap|garbage|^empty_|^thunk|^_?strncpy$|concatStrings|^(allocate|free)Array$|lookupFileSize|loadTextureFile|uploadMapTileImages|downloadSomeImage|modifySomeImage|^(get|set)VRAMModeCoords|ScreenPolyFT3|worldPosToScreenPos|^pauseFrame$|^__start"
why = "gráficos, memoria o ficheros del hardware original: los sustituye el motor"

[[not_needed]]
pattern = "^(?:[A-Z0-9]+_+)?(render|draw)[A-Z]"
why = "dibujo del original: el motor dibuja con su propio renderizador; el hueco visual, si lo hay, va en la función de lógica"

[[not_needed]]
pattern = "^(?:[A-Z0-9]+_+)?(remove|free|unload|deinitialize|destroy)(?!.*Item)[A-Z]"
why = "limpieza de objetos y memoria del original: el motor libera lo suyo"

[[not_needed]]
pattern = "^(?:[A-Z0-9]+_+)?(initialize|init)(?!.*(Battle|Tournament|Opponent|Fishing|Training|Evo|Partner|Tamer|Inventory|Clock|Save|Map$))[A-Z]\\w*(Data|Table|Tables|Objects|Object|Sprites|Sprite|Model|Models|Prims|Buffers|Buffer|Heap|Memory|UI|Lighting|Camera|Text|Font)$"
why = "preparación de tablas, objetos o recursos del original: el motor monta los suyos"

[[twins]]
dirs = ["std", "vs"]
target = "BTL_"

[[twins]]
dirs = ["trn2"]
target = "TRN_"

